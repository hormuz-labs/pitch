[workspace]
resolver = "3"
members = ["crates/*"]
# The desktop app needs a system webview to build; `cargo build` skips it.
default-members = ["crates/od"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"

[workspace.dependencies]
goose = { git = "https://github.com/aaif-goose/goose", rev = "bfcc6ee6f1ee18d0c4c852a65c49b25f87ee40dc", default-features = false, features = ["rustls-tls"] }
goose-providers = { git = "https://github.com/aaif-goose/goose", rev = "bfcc6ee6f1ee18d0c4c852a65c49b25f87ee40dc", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "3.4.1", default-features = false, features = ["server", "macros", "schemars"] }

[profile.dev.package."*"]
opt-level = 1
