<!doctype html><meta charset="utf-8">
<title>Mountains: Animated Website [Dribbble]</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0c1220;font-family:"Atlas Grotesk",sans-serif;color:#fff}
  .sky{position:absolute;inset:0;background:linear-gradient(180deg,#0c1220 0%,#25335a 40%,#c46a5a 75%,#f2b28a 100%)}
  .sun{position:absolute;left:50%;top:44%;width:180px;height:180px;margin:-90px 0 0 -90px;border-radius:50%;background:radial-gradient(circle,#fff3d6,#ffb27a 60%,rgba(255,160,100,0) 72%);filter:blur(1px)}
  .haze{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 60%,rgba(255,180,120,.35),transparent 70%)}
  svg.m{position:absolute;left:-5%;width:110%;bottom:0;height:auto;will-change:transform}
  .m1{opacity:.55}.m2{opacity:.8}
  .fog{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,rgba(12,18,32,0),rgba(12,18,32,.9))}
  .nav{position:absolute;left:64px;right:64px;top:36px;display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
  .nav b{font-size:16px;letter-spacing:.2em;font-weight:500}
  .nav em{display:flex;gap:26px;font-style:normal;opacity:.85}
  .h1{position:absolute;left:64px;top:170px;font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:120px;line-height:.92;letter-spacing:-.045em;text-transform:uppercase}
  .h1 span{display:block;overflow:hidden;padding-bottom:6px}.h1 u{display:block;text-decoration:none}
  .sub{position:absolute;left:64px;top:430px;font-size:17px;line-height:1.5;max-width:400px;opacity:.9}
  .cta{position:absolute;left:64px;top:520px;display:flex;gap:14px;align-items:center}
  .cta b{padding:14px 26px;border-radius:999px;background:#fff;color:#0c1220;font-weight:500;font-size:14px}
  .cta span{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
  .cards{position:absolute;right:64px;bottom:56px;display:flex;gap:14px}
  .card{width:170px;height:110px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(10px);padding:16px;will-change:transform}
  .card small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;display:block}
  .card b{font-family:"Sharp Grotesk",sans-serif;font-size:30px;font-weight:500;letter-spacing:-.03em;display:block;margin-top:8px}
  .card i{display:block;width:34px;height:2px;background:#fff;margin-top:10px;transform-origin:0 50%}
  .stars{position:absolute;inset:0}
  .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}
  .birds{position:absolute;left:0;top:0;will-change:transform}
</style>
<div class="stage">
  <div class="sky"></div>
  <div class="stars"></div>
  <div class="sun"></div>
  <div class="haze"></div>
  <svg class="m m1" viewBox="0 0 1400 400" preserveAspectRatio="none"><path fill="#3b3f63" d="M0 400V250l120-90 90 60 110-130 100 80 130-150 120 110 110-70 130 120 90-60 110 90 120-70 70 40v220z"/></svg>
  <svg class="m m2" viewBox="0 0 1400 400" preserveAspectRatio="none"><path fill="#232849" d="M0 400V300l160-120 110 80 120-110 140 110 100-60 150 130 120-90 130 100 110-50 130 90 130-40v60z"/></svg>
  <svg class="m m3" viewBox="0 0 1400 400" preserveAspectRatio="none"><path fill="#121629" d="M0 400V340l140-70 120 50 130-90 150 80 120-40 170 90 140-60 150 70 130-30 150 60v0z"/></svg>
  <svg class="birds" width="120" height="40" viewBox="0 0 120 40" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M5 20q8-8 16 0M40 12q8-8 16 0M75 24q8-8 16 0M100 8q7-7 14 0"/></svg>
  <div class="fog"></div>
  <div class="nav"><b>Alta</b><em><span>Journeys</span><span>Guides</span><span>Journal</span><span>Book</span></em></div>
  <div class="h1"><span><u>Higher</u></span><span><u>Ground</u></span></div>
  <div class="sub">Guided expeditions through the Dolomites, the Andes and the high Atlas. Small groups, slow mornings.</div>
  <div class="cta"><b>Plan a journey</b><span>Season 2026</span></div>
  <div class="cards">
    <div class="card"><small>Summits</small><b>32</b><i></i></div>
    <div class="card"><small>Days on trail</small><b>140</b><i></i></div>
    <div class="card"><small>Altitude</small><b>4,810m</b><i></i></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const rnd = fx.rng(7), stars = document.querySelector('.stars');
  for (let i = 0; i < 60; i++) { const s = document.createElement('i'); s.style.left = rnd() * 100 + '%'; s.style.top = rnd() * 45 + '%'; s.style.opacity = 0.3 + rnd() * 0.7; stars.appendChild(s); }
  const tl = fx.timeline({ duration: 5 });
  // dramatic reveal: the landscape layers rise with parallax, the sun lifts, the title lands heavy
  tl.from('.m1', { y: 160, duration: 1.6, ease: 'move' }, 0)
    .from('.m2', { y: 240, duration: 1.6, ease: 'move' }, 0.1)
    .from('.m3', { y: 320, duration: 1.6, ease: 'move' }, 0.2)
    .from('.sun', { y: 160, scale: 0.6, opacity: 0, duration: 1.8, ease: 'power3.out' }, 0)
    .from('.haze', { opacity: 0, duration: 1.5 }, 0.3)
    .from('.stars i', { opacity: 0, duration: 0.8, stagger: { each: 0.01, from: 'random' } }, 0.2)
    .from('.nav', { y: -24, opacity: 0, duration: 0.8, ease: 'expo.out' }, 0.3)
    .from('.h1 u', { yPercent: 110, duration: 1.0, ease: 'expo.out', stagger: 0.12 }, 0.5)
    .from('.sub', { y: 24, opacity: 0, duration: 0.7, ease: 'power3.out' }, 1.0)
    .from('.cta > *', { y: 18, opacity: 0, duration: 0.6, ease: 'back.out(1.6)', stagger: 0.08 }, 1.2)
    .from('.card', { y: 60, opacity: 0, duration: 0.9, ease: 'expo.out', stagger: 0.1 }, 1.1)
    .from('.card i', { scaleX: 0, duration: 0.6, ease: 'expo.out', stagger: 0.1 }, 1.6);
  // continuous parallax drift on the layers; birds cross; sun keeps climbing
  tl.to('.m1', { x: -20, duration: 4, ease: 'sine.inOut' }, 1)
    .to('.m2', { x: 25, duration: 4, ease: 'sine.inOut' }, 1)
    .to('.m3', { x: -35, duration: 4, ease: 'sine.inOut' }, 1)
    .to('.sun', { y: -30, duration: 4, ease: 'sine.inOut' }, 1)
    .fromTo('.birds', { x: 1000, y: 180, opacity: 0 }, { x: 640, y: 140, opacity: 1, duration: 2.6, ease: 'none' }, 1.3)
    .to('.birds', { opacity: 0, duration: 0.5 }, 3.9)
    .to('.card', { y: -8, duration: 1.2, ease: 'sine.inOut', yoyo: true, repeat: 1, stagger: 0.15 }, 2.2);
  // exit: title lifts, landscape sinks back into fog
  tl.to('.h1 u', { yPercent: -110, duration: 0.45, ease: 'expo.in', stagger: 0.08 }, 4.3)
    .to('.sub, .cta, .nav', { opacity: 0, y: -16, duration: 0.35, ease: 'power2.in' }, 4.4)
    .to('.card', { y: 60, opacity: 0, duration: 0.4, ease: 'power2.in', stagger: 0.05 }, 4.4)
    .to('.m3', { y: 320, duration: 0.6, ease: 'expo.in' }, 4.4)
    .to('.m2', { y: 240, duration: 0.6, ease: 'expo.in' }, 4.45)
    .to('.m1', { y: 160, duration: 0.6, ease: 'expo.in' }, 4.5)
    .to('.sun', { y: 160, opacity: 0, duration: 0.6, ease: 'power2.in' }, 4.45);
</script>
