<!doctype html><meta charset="utf-8">
<title>Animated Square Images</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f3f1ec;font-family:"Atlas Grotesk",sans-serif}
  .grid{position:absolute;left:50%;top:50%;width:1060px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;transform:translate(-50%,-50%)}
  .cell{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#ddd;will-change:transform;clip-path:inset(0 round 14px)}
  .img{position:absolute;inset:-12%;background-size:cover;background-position:center;will-change:transform}
  .cell:nth-child(1) .img{background-image:url("../../../assets/backgrounds/sunset.png");background-position:20% 30%}
  .cell:nth-child(2) .img{background-image:url("../../../assets/backgrounds/aurora.png");background-position:70% 40%}
  .cell:nth-child(3) .img{background-image:url("../../../assets/backgrounds/ocean.png");background-position:30% 60%}
  .cell:nth-child(4) .img{background-image:url("../../../assets/backgrounds/sunset.png");background-position:80% 70%}
  .cell:nth-child(5) .img{background-image:url("../../../assets/backgrounds/ocean.png");background-position:75% 20%}
  .cell:nth-child(6) .img{background-image:url("../../../assets/backgrounds/sunset.png");background-position:50% 90%}
  .cell:nth-child(7) .img{background-image:url("../../../assets/backgrounds/aurora.png");background-position:20% 80%}
  .cell:nth-child(8) .img{background-image:url("../../../assets/backgrounds/ocean.png");background-position:10% 10%}
  .cap{position:absolute;left:12px;bottom:10px;color:#fff;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.9;text-shadow:0 1px 8px rgba(0,0,0,.5)}
  .title{position:absolute;left:0;right:0;top:44px;text-align:center;font-family:"Sorts Mill Goudy",serif;font-size:30px;color:#1c1b18;letter-spacing:.02em}
  .title span{display:inline-block;overflow:hidden;vertical-align:bottom}.title u{display:block;text-decoration:none}
  .foot{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#7a766d}
</style>
<div class="stage">
  <div class="title"><span><u>Summer Collection — Lookbook</u></span></div>
  <div class="grid">
    <div class="cell"><div class="img"></div><span class="cap">No. 01</span></div>
    <div class="cell"><div class="img"></div><span class="cap">No. 02</span></div>
    <div class="cell"><div class="img"></div><span class="cap">No. 03</span></div>
    <div class="cell"><div class="img"></div><span class="cap">No. 04</span></div>
    <div class="cell"><div class="img"></div><span class="cap">No. 05</span></div>
    <div class="cell"><div class="img"></div><span class="cap">No. 06</span></div>
    <div class="cell"><div class="img"></div><span class="cap">No. 07</span></div>
    <div class="cell"><div class="img"></div><span class="cap">No. 08</span></div>
  </div>
  <div class="foot">Shot on location · Lisbon</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  ['sunset','aurora','ocean'].forEach(n => { const im = new Image(); im.src = `../../../assets/backgrounds/${n}.png`; fx.wait(im.decode().catch(()=>{})); });
  const tl = fx.timeline({ duration: 3 });
  // squares wipe open from the bottom edge in a diagonal wave while the image inside pushes in
  tl.fromTo('.cell', { clipPath: 'inset(100% 0 0 0 round 14px)', y: 40 }, { clipPath: 'inset(0% 0 0 0 round 14px)', y: 0, duration: 0.8, ease: 'expo.out', stagger: { each: 0.07, grid: [2, 4], from: 'start' } }, 0.05);
  tl.fromTo('.img', { scale: 1.3, yPercent: 8 }, { scale: 1, yPercent: 0, duration: 1.1, ease: 'expo.out', stagger: { each: 0.07, grid: [2, 4], from: 'start' } }, 0.05);
  tl.from('.cap', { y: 10, opacity: 0, duration: 0.4, stagger: { each: 0.07, grid: [2, 4], from: 'start' } }, 0.5);
  tl.from('.title u', { yPercent: 110, duration: 0.7, ease: 'expo.out' }, 0.1)
    .from('.foot', { opacity: 0, y: 8, duration: 0.5 }, 0.6);
  // hold with a slow drift on the imagery
  tl.to('.img', { yPercent: -4, duration: 1.4, ease: 'sine.inOut' }, 1.2);
  // exit: wipe closed from the top in the opposite diagonal
  tl.to('.cell', { clipPath: 'inset(0 0 100% 0 round 14px)', y: -30, duration: 0.5, ease: 'expo.in', stagger: { each: 0.05, grid: [2, 4], from: 'end' } }, 2.25);
  tl.to('.title u', { yPercent: -110, duration: 0.4, ease: 'expo.in' }, 2.55).to('.foot', { opacity: 0, duration: 0.25 }, 2.6);
</script>
