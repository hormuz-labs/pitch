<!doctype html><meta charset="utf-8">
<title>Minimalist Website</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f7f6f3;font-family:"Atlas Grotesk",sans-serif;color:#151515}
  .nav{position:absolute;left:72px;right:72px;top:40px;display:flex;justify-content:space-between;font-size:13px;letter-spacing:.04em}
  .nav span{overflow:hidden;display:block}.nav u{display:block;text-decoration:none}
  .rule{position:absolute;left:72px;right:72px;top:78px;height:1px;background:#151515;transform-origin:0 50%}
  .h1{position:absolute;left:72px;top:150px;font-family:"Sharp Grotesk",sans-serif;font-weight:400;font-size:112px;line-height:.95;letter-spacing:-.045em}
  .h1 span{display:block;overflow:hidden;padding-bottom:8px}.h1 u{display:block;text-decoration:none}
  .h1 em{font-family:"Sorts Mill Goudy",serif;font-style:italic;letter-spacing:-.01em}
  .meta{position:absolute;left:72px;bottom:64px;font-size:13px;line-height:1.8;color:#6b6b6b;max-width:300px}
  .meta span{display:block;overflow:hidden}.meta u{display:block;text-decoration:none}
  .img{position:absolute;right:72px;top:150px;width:380px;height:470px;overflow:hidden;will-change:transform}
  .img i{position:absolute;inset:-10%;background:url("../../../assets/backgrounds/ocean.png") center/cover;filter:saturate(.5) contrast(1.05);will-change:transform}
  .cap{position:absolute;right:72px;bottom:64px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#6b6b6b;text-align:right}
  .idx{position:absolute;left:50%;bottom:64px;font-size:12px;letter-spacing:.2em;color:#6b6b6b;transform:translateX(-50%)}
  .dot{position:absolute;left:72px;top:530px;width:10px;height:10px;border-radius:50%;background:#151515}
  .btn{position:absolute;left:96px;top:520px;font-size:14px;letter-spacing:.04em;border-bottom:1px solid #151515;padding-bottom:4px}
  .btn span{display:block;overflow:hidden}.btn u{display:block;text-decoration:none}
</style>
<div class="stage">
  <div class="nav"><span><u>Studio Meridian</u></span><span><u>Work</u></span><span><u>Studio</u></span><span><u>Contact</u></span></div>
  <div class="rule"></div>
  <div class="h1"><span><u>Quiet</u></span><span><u>work, <em>made</em></u></span><span><u>to last.</u></span></div>
  <div class="dot"></div><div class="btn"><span><u>View the archive</u></span></div>
  <div class="meta"><span><u>A design practice for</u></span><span><u>brands that prefer to</u></span><span><u>speak softly.</u></span></div>
  <div class="img"><i></i></div>
  <div class="idx">01 — 04</div>
  <div class="cap">Field study, Atlantic coast</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const im = new Image(); im.src = '../../../assets/backgrounds/ocean.png'; fx.wait(im.decode().catch(()=>{}));
  const tl = fx.timeline({ duration: 5 });
  // refined: a rule draws, type rises line by line, the image unveils with a slow curtain, nothing overshoots
  tl.fromTo('.rule', { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: 'expo.inOut' }, 0)
    .from('.nav u', { yPercent: 110, duration: 0.8, ease: 'expo.out', stagger: 0.06 }, 0.3)
    .from('.h1 u', { yPercent: 110, duration: 1.0, ease: 'expo.out', stagger: 0.12 }, 0.45)
    .fromTo('.img', { clipPath: 'inset(0 0 100% 0)' }, { clipPath: 'inset(0 0 0% 0)', duration: 1.3, ease: 'expo.inOut' }, 0.5)
    .fromTo('.img i', { scale: 1.25, yPercent: -6 }, { scale: 1, yPercent: 0, duration: 1.6, ease: 'expo.out' }, 0.5)
    .from('.meta u', { yPercent: 110, duration: 0.7, ease: 'expo.out', stagger: 0.07 }, 1.2)
    .from('.dot', { scale: 0, duration: 0.5, ease: 'expo.out' }, 1.4)
    .from('.btn u', { yPercent: 110, duration: 0.6, ease: 'expo.out' }, 1.45)
    .from('.btn', { borderColor: 'rgba(21,21,21,0)', duration: 0.6 }, 1.6)
    .from('.idx, .cap', { opacity: 0, y: 8, duration: 0.6, stagger: 0.1 }, 1.6);
  // hold: the image breathes; the index ticks
  tl.to('.img i', { yPercent: 4, duration: 2.4, ease: 'sine.inOut' }, 1.9)
    .to('.dot', { x: 6, duration: 0.5, ease: 'power2.inOut', yoyo: true, repeat: 1 }, 2.6);
  // exit: the image slides up as a curtain, the type drops back
  tl.to('.img', { clipPath: 'inset(0 0 100% 0)', duration: 0.6, ease: 'expo.in' }, 4.2)
    .to('.h1 u', { yPercent: -110, duration: 0.45, ease: 'expo.in', stagger: 0.07 }, 4.25)
    .to('.meta u, .btn u, .nav u', { yPercent: -110, duration: 0.4, ease: 'expo.in', stagger: 0.03 }, 4.35)
    .to('.dot, .idx, .cap', { opacity: 0, duration: 0.3 }, 4.5)
    .to('.rule', { scaleX: 0, transformOrigin: '100% 50%', duration: 0.5, ease: 'expo.in' }, 4.5);
</script>
