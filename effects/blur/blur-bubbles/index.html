<!doctype html><meta charset="utf-8">
<title>Blur: Bubbles</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0d0b1a}
  .field{position:absolute;inset:0;filter:blur(38px) saturate(1.3)}
  .b{position:absolute;left:50%;top:50%;border-radius:50%;will-change:transform;mix-blend-mode:screen}
  .grain{position:absolute;inset:0;opacity:.07;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
  .ui{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:640px;padding:56px;border-radius:44px;background:rgba(255,255,255,.08);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1.5px solid rgba(255,255,255,.22);color:#fff;text-align:center}
  .ui .k{font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:500}
  .ui h1{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:74px;letter-spacing:-.04em;line-height:1;margin-top:14px}
  .ui .btn{display:inline-block;margin-top:34px;padding:20px 40px;border-radius:999px;background:#fff;color:#1a1530;font-weight:500;font-size:26px}
</style>
<div class="stage">
  <div class="field" id="field"></div>
  <div class="grain"></div>
  <div class="ui"><div class="k">Northwind · Ambient</div><h1>Soft layers,<br>gentle motion</h1><span class="btn">Explore</span></div>
</div>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 5, TAU = Math.PI * 2;
  const rnd = fx.rng(7);
  const cols = ['#ff5fa2', '#5f7bff', '#ffb35f', '#5fffd1', '#b95fff', '#ff5f5f', '#5fd5ff', '#f0ff5f'];
  const field = document.getElementById('field');
  const bubbles = cols.map((c, i) => {
    const el = document.createElement('div');
    el.className = 'b';
    const size = 260 + rnd() * 300;
    el.style.width = el.style.height = size + 'px';
    el.style.marginLeft = -size / 2 + 'px';
    el.style.marginTop = -size / 2 + 'px';
    el.style.background = `radial-gradient(circle at 40% 40%, ${c} 0%, ${c}cc 45%, transparent 72%)`;
    field.appendChild(el);
    // every orbit is an integer number of cycles per loop so t=0 and t=D match
    return {
      el,
      cx: (rnd() - .5) * 760, cy: (rnd() - .5) * 760,
      rx: 90 + rnd() * 220, ry: 90 + rnd() * 220,
      kx: 1 + Math.floor(rnd() * 2), ky: 1 + Math.floor(rnd() * 2),
      px: rnd() * TAU, py: rnd() * TAU, ks: 1 + Math.floor(rnd() * 2), ps: rnd() * TAU,
    };
  });
  fx.register({ duration: D, seek(t) {
    const u = t / D;
    for (const b of bubbles) {
      const x = b.cx + Math.cos(u * TAU * b.kx + b.px) * b.rx;
      const y = b.cy + Math.sin(u * TAU * b.ky + b.py) * b.ry;
      const s = 0.85 + 0.25 * Math.sin(u * TAU * b.ks + b.ps);
      b.el.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    }
    // the card breathes, barely
    const ui = document.querySelector('.ui');
    ui.style.transform = `translate(-50%,-50%) translateY(${Math.sin(u * TAU) * 8}px)`;
  } });
</script>
