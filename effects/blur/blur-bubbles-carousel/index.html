<!doctype html><meta charset="utf-8">
<title>Blur: Bubbles &amp; Carousel</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f3efe8}
  .field{position:absolute;inset:0;filter:blur(46px)}
  .b{position:absolute;left:50%;top:50%;border-radius:50%;will-change:transform;opacity:.85}
  .brand{position:absolute;top:56px;left:80px;display:flex;align-items:center;gap:14px;font-weight:500;font-size:22px;color:#2a2622;letter-spacing:-.01em}
  .brand i{display:block;width:30px;height:30px;border-radius:50%;background:#2a2622}
  .brand i::after{content:"";position:absolute;width:14px;height:14px;background:#f3efe8;border-radius:50%;margin:8px}
  .title{position:absolute;top:150px;left:80px;font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:64px;letter-spacing:-.04em;color:#2a2622;line-height:1}
  .title small{display:block;font-family:"Atlas Grotesk",sans-serif;font-size:22px;letter-spacing:.02em;color:#6f675e;margin-top:14px}
  .carousel{position:absolute;left:0;right:0;top:300px;height:360px}
  .track{position:absolute;left:80px;top:0;display:flex;gap:28px;will-change:transform}
  .card{position:relative;flex:none;width:400px;height:330px;border-radius:32px;overflow:hidden;background:rgba(255,255,255,.55);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1.5px solid rgba(255,255,255,.8);box-shadow:0 30px 60px rgba(60,40,20,.12);padding:30px;color:#2a2622;transform-origin:50% 100%}
  .card .pic{height:150px;border-radius:20px;background:linear-gradient(135deg,var(--a),var(--b))}
  .card h3{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:32px;letter-spacing:-.03em;margin-top:22px;line-height:1}
  .card p{font-size:18px;color:#6f675e;margin-top:8px}
  .card .price{position:absolute;right:30px;bottom:30px;font-weight:500;font-size:22px}
  .pager{position:absolute;left:80px;bottom:56px;display:flex;gap:10px}
  .pager i{display:block;width:10px;height:10px;border-radius:5px;background:rgba(42,38,34,.25)}
  .pager i.on{width:34px;background:#2a2622}
</style>
<div class="stage">
  <div class="field" id="field"></div>
  <div class="brand"><i></i>Northwind Living</div>
  <div class="title">Summer edit<small>New pieces, softer palette.</small></div>
  <div class="carousel"><div class="track" id="track"></div></div>
  <div class="pager" id="pager"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 10, N = 5, STEP = 428, TAU = Math.PI * 2;
  const items = [
    ['Linen throw', 'Oat, 130×180', '$64', '#ffd7a8', '#ff9f6b'],
    ['Stone vase', 'Hand-cast, matte', '$48', '#cfe8ff', '#7fb4ff'],
    ['Cane chair', 'Natural ash', '$220', '#d6f5d0', '#8fd39a'],
    ['Wool rug', 'Undyed, 2×3', '$310', '#ffd0e0', '#ff8fb6'],
    ['Glass lamp', 'Warm dimmer', '$96', '#efe0ff', '#b98cff'],
  ];
  const track = document.getElementById('track'), pager = document.getElementById('pager');
  // the set twice, so a full pass of N steps lands on an identical frame
  for (let k = 0; k < 2; k++) items.forEach(([h, p, pr, a, b]) => {
    track.insertAdjacentHTML('beforeend', `<div class="card" style="--a:${a};--b:${b}"><div class="pic"></div><h3>${h}</h3><p>${p}</p><div class="price">${pr}</div></div>`);
  });
  items.forEach((_, i) => pager.insertAdjacentHTML('beforeend', `<i class="${i ? '' : 'on'}"></i>`));
  const cards = gsap.utils.toArray('.card'), dots = gsap.utils.toArray('.pager i');

  // background bubbles, all on integer cycles
  const rnd = fx.rng(21), field = document.getElementById('field');
  const cols = ['#ffb07a', '#8fb8ff', '#ffd0e0', '#b7f0c9', '#d9c2ff', '#fff0a8'];
  const bubbles = cols.map(c => {
    const el = document.createElement('div'); el.className = 'b';
    const s = 300 + rnd() * 320; el.style.width = el.style.height = s + 'px'; el.style.marginLeft = -s / 2 + 'px'; el.style.marginTop = -s / 2 + 'px';
    el.style.background = `radial-gradient(circle at 45% 45%, ${c} 0%, ${c} 40%, transparent 70%)`;
    field.appendChild(el);
    return { el, cx: (rnd() - .5) * 1100, cy: (rnd() - .5) * 600, rx: 80 + rnd() * 200, ry: 60 + rnd() * 160, kx: 1 + (rnd() > .6 ? 1 : 0), ky: 1, px: rnd() * TAU, py: rnd() * TAU };
  });

  const tl = fx.timeline({ duration: D });
  for (let i = 0; i < N; i++) {
    const at = 0.9 + i * 1.8;
    tl.to('.track', { x: -STEP * (i + 1), duration: 0.9, ease: 'expo.inOut' }, at);
    // the passing card dips, blurs, and springs back
    tl.to(cards[i], { scale: 0.9, filter: 'blur(10px)', opacity: 0.6, duration: 0.45, ease: 'power2.in' }, at);
    tl.to(cards[i + 1], { y: -18, duration: 0.5, ease: 'expo.out' }, at + 0.4).to(cards[i + 1], { y: 0, duration: 0.5, ease: 'power2.inOut' }, at + 0.9);
    tl.to(dots[i], { width: 10, backgroundColor: 'rgba(42,38,34,.25)', duration: 0.3 }, at + 0.3);
    tl.to(dots[(i + 1) % N], { width: 34, backgroundColor: '#2a2622', duration: 0.3 }, at + 0.3);
  }
  // the bubble field is driven by t directly, layered on the same seek
  const seek = window.__fx.seek;
  window.__fx.seek = t => {
    seek(t);
    const u = t / D;
    for (const b of bubbles) b.el.style.transform = `translate(${b.cx + Math.cos(u * TAU * b.kx + b.px) * b.rx}px, ${b.cy + Math.sin(u * TAU * b.ky + b.py) * b.ry}px)`;
  };
</script>
