<!doctype html><meta charset="utf-8">
<title>Blur: Swirl</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#08070c}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #out{filter:saturate(1.25) contrast(1.05)}
  .cap{position:absolute;left:0;right:0;bottom:64px;text-align:center;color:#fff;font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:22px;letter-spacing:.3em;text-transform:uppercase;opacity:.8;mix-blend-mode:screen}
</style>
<div class="stage">
  <canvas id="out"></canvas>
  <div class="cap">Acme · Atmosphere</div>
</div>
<script src="../../_lib/fx.js"></script>
<script>
  // A swirl distortion, pixel-mapped on a half-res buffer and then upscaled with a soft blur.
  const D = 10, W = 1280, H = 720, SW = 480, SH = 270, TAU = Math.PI * 2;
  const out = document.getElementById('out'); out.width = W; out.height = H;
  const octx = out.getContext('2d');
  const src = document.createElement('canvas'); src.width = SW; src.height = SH;
  const sctx = src.getContext('2d', { willReadFrequently: true });
  const dst = document.createElement('canvas'); dst.width = SW; dst.height = SH;
  const dctx = dst.getContext('2d');
  const dimg = dctx.createImageData(SW, SH);

  function drawContent(u) {
    // the content being swirled: a rotating band gradient with a wordmark in it
    sctx.save();
    sctx.fillStyle = '#12101c'; sctx.fillRect(0, 0, SW, SH);
    sctx.translate(SW / 2, SH / 2); sctx.rotate(u * TAU);
    const g = sctx.createLinearGradient(-SW, 0, SW, 0);
    g.addColorStop(0, '#ff3d81'); g.addColorStop(.25, '#ffd23f'); g.addColorStop(.5, '#2ee6a6'); g.addColorStop(.75, '#4c8bff'); g.addColorStop(1, '#ff3d81');
    sctx.fillStyle = g; sctx.fillRect(-SW, -SH, SW * 2, SH * 2);
    sctx.rotate(-u * TAU);
    sctx.fillStyle = 'rgba(8,7,12,.85)';
    sctx.font = '500 120px "Sharp Grotesk", sans-serif'; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('SWIRL', 0, 6);
    sctx.restore();
  }
  fx.register({ duration: D, seek(t) {
    const u = t / D;
    drawContent(u);
    const s = sctx.getImageData(0, 0, SW, SH).data, d = dimg.data;
    // strength swings through zero twice per loop, so the frame at D matches the frame at 0
    const strength = 4.5 * Math.sin(u * TAU);
    const cx = SW / 2 + Math.cos(u * TAU) * 40, cy = SH / 2 + Math.sin(u * TAU * 2) * 20;
    const R = 260;
    for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
      const dx = x - cx, dy = y - cy, r = Math.sqrt(dx * dx + dy * dy);
      const f = Math.max(0, 1 - r / R);
      const a = strength * f * f + u * TAU * 0.0; // swirl angle grows toward the centre
      const c = Math.cos(a), sn = Math.sin(a);
      let sx = Math.round(cx + dx * c - dy * sn), sy = Math.round(cy + dx * sn + dy * c);
      sx = ((sx % SW) + SW) % SW; sy = ((sy % SH) + SH) % SH;
      const si = (sy * SW + sx) * 4, di = (y * SW + x) * 4;
      d[di] = s[si]; d[di + 1] = s[si + 1]; d[di + 2] = s[si + 2]; d[di + 3] = 255;
    }
    dctx.putImageData(dimg, 0, 0);
    // upscale through a blur that breathes with the swirl
    octx.filter = `blur(${6 + 10 * Math.abs(Math.sin(u * TAU))}px)`;
    octx.drawImage(dst, -20, -20, W + 40, H + 40);
    octx.filter = 'none';
  } });
</script>
