<!doctype html><meta charset="utf-8">
<title>Blur: News Stack [iOS]</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#1b2a4a}
  .wall{position:absolute;inset:-10%;background:url("../../../assets/backgrounds/ocean.png") center/cover;filter:blur(50px) brightness(.75);transform:scale(1.15)}
  .phone{position:absolute;left:50%;top:50%;width:330px;height:660px;margin:-330px 0 0 -165px;border-radius:50px;background:#000;padding:12px;box-shadow:0 40px 90px rgba(0,0,0,.35)}
  .screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:#f2f2f7}
  .screen .wallpaper{position:absolute;inset:-20%;background:url("../../../assets/backgrounds/aurora.png") center/cover;filter:blur(40px) saturate(1.3)}
  .notch{position:absolute;top:14px;left:50%;width:110px;height:32px;margin-left:-55px;border-radius:20px;background:#000;z-index:5}
  .time{position:absolute;top:22px;left:32px;font-weight:500;font-size:17px;color:#111;z-index:4}
  .hdr{position:absolute;top:66px;left:24px;right:24px;color:#111}
  .hdr small{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#555;font-weight:500}
  .hdr h1{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:34px;letter-spacing:-.03em;line-height:1}
  .stack{position:absolute;left:20px;right:20px;top:150px;height:440px}
  .card{position:absolute;left:0;right:0;top:0;height:400px;border-radius:28px;overflow:hidden;background:#1b1b22;transform-origin:50% 100%;will-change:transform,filter,opacity;box-shadow:0 20px 40px rgba(0,0,0,.25)}
  .card .art{position:absolute;inset:-30%;filter:blur(50px);transform:scale(1.15)}
  .card .art b{position:absolute;width:60%;height:60%;border-radius:50%}
  .card .glass{position:absolute;left:14px;right:14px;bottom:14px;padding:20px;border-radius:22px;background:rgba(255,255,255,.16);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgba(255,255,255,.3);color:#fff}
  .card .glass small{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:rgba(255,255,255,.75)}
  .card .glass h2{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:23px;letter-spacing:-.02em;line-height:1.05;margin-top:8px}
  .card .glass p{font-size:14px;line-height:1.35;color:rgba(255,255,255,.8);margin-top:8px}
  .card .src{position:absolute;top:18px;left:18px;display:flex;align-items:center;gap:8px;font-size:13px;color:#fff;font-weight:500}
  .card .src i{display:block;width:22px;height:22px;border-radius:50%;background:#fff}
  .home{position:absolute;bottom:10px;left:50%;width:130px;height:5px;margin-left:-65px;border-radius:3px;background:#111;opacity:.7}
  .side{position:absolute;top:50%;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.3);transform:translateY(-50%)}
  .side.l{left:110px;width:260px}.side.r{right:110px;width:260px;text-align:right}
  .side h3{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:44px;letter-spacing:-.04em;line-height:1}
  .side p{font-size:18px;color:rgba(255,255,255,.8);margin-top:12px;line-height:1.4}
</style>
<div class="stage">
  <div class="wall"></div>
  <div class="side l"><h3>Swipe through the day</h3><p>Every story on a frosted card. Swipe one away, the next rises.</p></div>
  <div class="side r"><h3>Considered by default</h3><p>Blur, depth, and a little spring — nothing loud.</p></div>
  <div class="phone"><div class="screen">
    <div class="wallpaper"></div><div class="notch"></div><div class="time">9:41</div>
    <div class="hdr"><small>Top stories</small><h1>Briefing</h1></div>
    <div class="stack" id="stack"></div>
    <div class="home"></div>
  </div></div>
</div>
<script src="../../_lib/fx.js"></script>
<script>
  const stories = [
    ['Acme Daily', 'Technology', 'A folding screen that finally feels like paper', 'Three years of prototypes, one thin sheet of glass.', ['#ff7a59', '#ffd23f', '#ff3d81']],
    ['Northwind', 'Climate', 'The harbour that learned to float', 'How a coastal town rebuilt its port on the tide.', ['#3d7bff', '#7ef0ff', '#6a3dff']],
    ['The Ledger', 'Markets', 'Small shops, big quarter', 'Local retail posts its strongest spring in a decade.', ['#2ee6a6', '#b8ff5c', '#0f8a6a']],
    ['Field Notes', 'Science', 'What the deep sea sounds like', 'A new microphone array is mapping the ocean by ear.', ['#ff3d81', '#ff9f3d', '#8a1f4f']],
  ];
  const stack = document.getElementById('stack');
  const cards = stories.map(([src, tag, h, p, c]) => {
    stack.insertAdjacentHTML('beforeend', `<div class="card"><div class="art"><b style="left:-10%;top:-10%;background:${c[0]}"></b><b style="right:-5%;top:20%;background:${c[1]}"></b><b style="left:20%;bottom:-15%;background:${c[2]}"></b></div><div class="src"><i></i>${src}</div><div class="glass"><small>${tag}</small><h2>${h}</h2><p>${p}</p></div></div>`);
    return stack.lastElementChild;
  });
  const N = cards.length, SEG = 2, D = SEG * N;
  const ease = x => 1 - Math.pow(1 - x, 4);           // expo-ish out
  const spring = x => 1 - Math.exp(-6 * x) * Math.cos(x * 7);
  function place(el, depth) {                          // depth 0 = top of stack
    el.style.zIndex = 10 - depth;
    el.style.transform = `translateY(${depth * 22}px) scale(${1 - depth * 0.07})`;
    el.style.filter = `blur(${depth * 4}px) brightness(${1 - depth * 0.12})`;
    el.style.opacity = depth > 2.5 ? Math.max(0, 3.5 - depth) : 1;
  }
  fx.register({ duration: D, seek(t) {
    const step = Math.floor(t / SEG) % N, local = (t % SEG) / SEG;
    const swipe = Math.min(1, local / 0.32);           // the top card leaves in the first 0.65s
    const rise = Math.min(1, Math.max(0, (local - 0.1) / 0.45));
    cards.forEach((el, i) => {
      const depth = (i - step + N) % N;
      if (depth === 0) {
        // top card: swipes up-left, tilting and dissolving into blur
        const e = ease(swipe);
        el.style.zIndex = 20;
        el.style.transform = `translate(${-e * 340}px, ${-e * 180}px) rotate(${-e * 14}deg) scale(${1 - e * 0.1})`;
        el.style.filter = `blur(${e * 18}px)`;
        el.style.opacity = 1 - Math.max(0, (swipe - 0.5) / 0.5);
        // re-enter at the back once gone
        if (swipe >= 1) { const back = N - 1 - (1 - rise); place(el, N - 1 + (1 - rise) * 1.2); el.style.opacity = rise; }
      } else {
        const s = spring(rise);
        place(el, depth - s);
      }
    });
    // the phone wallpaper drifts, the wall too, for the whole loop
    const u = t / D * Math.PI * 2;
    document.querySelector('.wallpaper').style.transform = `translate(${Math.cos(u) * 20}px, ${Math.sin(u) * 20}px)`;
    document.querySelector('.wall').style.transform = `scale(1.15) translate(${Math.sin(u) * 16}px, 0)`;
  } });
</script>
