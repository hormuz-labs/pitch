<!doctype html><meta charset="utf-8">
<title>Blur: Logo Switcher</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0e0e11;display:flex;align-items:center;justify-content:center}
  .glow{position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;filter:blur(120px);opacity:.35;will-change:transform,background}
  .logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:36px;color:#fff;will-change:filter,transform,opacity;opacity:0}
  .logo svg{width:150px;height:150px}
  .logo .word{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:112px;letter-spacing:-.05em;line-height:1}
  .logo .word small{display:block;font-family:"Atlas Grotesk",sans-serif;font-weight:400;font-size:24px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:6px}
  .idx{position:absolute;bottom:56px;left:0;right:0;display:flex;justify-content:center;gap:12px}
  .idx i{display:block;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.25)}
</style>
<div class="stage">
  <div class="glow" id="glow"></div>
  <div class="logo" style="--c:#ff5a3d"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#ff5a3d"/><circle cx="50" cy="50" r="22" fill="#0e0e11"/></svg><div class="word">Acme<small>Studio</small></div></div>
  <div class="logo" style="--c:#4c8bff"><svg viewBox="0 0 100 100"><rect x="6" y="6" width="88" height="88" rx="22" fill="#4c8bff"/><path d="M28 66 L50 30 L72 66 Z" fill="#0e0e11"/></svg><div class="word">Northwind<small>Labs</small></div></div>
  <div class="logo" style="--c:#2ee6a6"><svg viewBox="0 0 100 100"><path d="M50 4 L96 50 L50 96 L4 50 Z" fill="#2ee6a6"/><rect x="36" y="36" width="28" height="28" fill="#0e0e11"/></svg><div class="word">Vertex<small>Health</small></div></div>
  <div class="logo" style="--c:#ffd23f"><svg viewBox="0 0 100 100"><circle cx="34" cy="50" r="30" fill="#ffd23f"/><circle cx="66" cy="50" r="30" fill="#ffd23f" opacity=".7"/></svg><div class="word">Orbit<small>Finance</small></div></div>
  <div class="idx"><i></i><i></i><i></i><i></i></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const logos = gsap.utils.toArray('.logo'), dots = gsap.utils.toArray('.idx i');
  const cols = logos.map(l => getComputedStyle(l).getPropertyValue('--c').trim());
  const SEG = 2.5;
  const tl = fx.timeline({ duration: SEG * logos.length });
  logos.forEach((el, i) => {
    const at = i * SEG;
    // in: from a heavy blur, slightly large, letters tightening as it resolves
    tl.fromTo(el, { opacity: 0, filter: 'blur(40px)', scale: 1.18, letterSpacing: '0.02em' },
      { opacity: 1, filter: 'blur(0px)', scale: 1, letterSpacing: '-0.05em', duration: 0.9, ease: 'expo.out' }, at);
    tl.from(el.querySelector('svg'), { rotation: -40, duration: 1, ease: 'expo.out' }, at);
    // out: dissolve into blur, shrinking away
    tl.to(el, { opacity: 0, filter: 'blur(36px)', scale: 0.86, duration: 0.55, ease: 'power3.in' }, at + SEG - 0.55);
    tl.to('#glow', { backgroundColor: cols[i], duration: 0.8, ease: 'power2.inOut' }, at);
    tl.to(dots[i], { backgroundColor: '#fff', scale: 1.4, duration: 0.3 }, at)
      .to(dots[i], { backgroundColor: 'rgba(255,255,255,.25)', scale: 1, duration: 0.3 }, at + SEG - 0.3);
  });
  gsap.set('#glow', { backgroundColor: cols[cols.length - 1] });
  tl.fromTo('#glow', { rotation: 0, xPercent: -8 }, { rotation: 360, xPercent: 8, duration: SEG * logos.length, ease: 'none' }, 0);
</script>
