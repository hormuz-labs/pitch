<!doctype html><meta charset="utf-8">
<title>YouTube Subscribe Button</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0f0f0f;display:flex;align-items:center;justify-content:center}
  .row{display:flex;align-items:center;gap:22px}
  .av{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#ff5c5c,#ff2d55);display:flex;align-items:center;justify-content:center;flex:none}
  .av i{width:0;height:0;border-left:26px solid #fff;border-top:16px solid transparent;border-bottom:16px solid transparent;margin-left:6px}
  .meta{margin-right:20px}
  .nm{font-size:26px;font-weight:500;color:#fff}
  .sb{font-size:16px;color:#aaa;margin-top:4px;height:20px;overflow:hidden;position:relative;width:200px}
  .sb span{position:absolute;left:0;top:0;line-height:20px;white-space:nowrap}
  .btn{position:relative;height:64px;border-radius:32px;background:#ff0033;color:#fff;overflow:hidden;font-size:20px;font-weight:500;width:190px;will-change:transform,width,background-color;display:flex;align-items:center;justify-content:center}
  .btn .l{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
  .btn .l svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .ripple{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0)}
  .bellw{width:64px;height:64px;border-radius:50%;background:#272727;display:flex;align-items:center;justify-content:center;position:relative;will-change:transform}
  .bell{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transform-origin:50% 12%;will-change:transform}
  .dot{position:absolute;top:12px;right:14px;width:14px;height:14px;border-radius:50%;background:#ff0033;border:2px solid #272727;transform:scale(0)}
  .wave{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2px solid #fff;opacity:0}
  .cursor{position:absolute;left:0;top:0;width:30px;height:30px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));z-index:10;will-change:transform}
</style>
<div class="stage">
  <div class="row">
    <div class="av"><i></i></div>
    <div class="meta"><div class="nm">Northwind Studio</div><div class="sb"><span class="c1">128K subscribers</span><span class="c2">129K subscribers</span></div></div>
    <div class="btn"><div class="ripple"></div><div class="l l1">Subscribe</div><div class="l l2"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg><span>Subscribed</span></div></div>
    <div class="bellw"><div class="wave w1"></div><div class="wave w2"></div><svg class="bell" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21h4"/></svg><div class="dot"></div></div>
  </div>
  <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l16 9-7 1.5L9 20z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/CustomEase.min.js"></script>
<script src="../../../assets/gsap/CustomWiggle.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(CustomEase, CustomWiggle);
  CustomWiggle.create('ring', { wiggles: 7, type: 'easeOut' });
  const tl = fx.timeline({ duration: 4 });
  const b = document.querySelector('.btn').getBoundingClientRect();
  const BX = b.left + b.width / 2 + 10, BY = b.top + b.height / 2 + 6;
  gsap.set('.cursor', { x: 1060, y: 660 });
  gsap.set('.l2', { yPercent: 110 });
  gsap.set('.c2', { y: 24 });
  gsap.set('.bellw', { scale: 0, opacity: 0 });
  tl.from('.row > *', { y: 24, opacity: 0, duration: 0.6, ease: 'expo.out', stagger: 0.08 }, 0)
    .to('.cursor', { x: BX, y: BY, duration: 0.8, ease: 'power3.inOut' }, 0.4)
    // the click
    .to('.btn', { scale: 0.93, duration: 0.1, ease: 'power2.in' }, 1.25)
    .to('.btn', { scale: 1, duration: 0.5, ease: 'elastic.out(1,0.45)' }, 1.35)
    .to('.cursor', { scale: 0.85, duration: 0.08 }, 1.25).to('.cursor', { scale: 1, duration: 0.2 }, 1.35)
    .fromTo('.ripple', { scale: 0, opacity: 1 }, { scale: 22, opacity: 0, duration: 0.6, ease: 'power2.out' }, 1.25)
    .to('.btn', { backgroundColor: '#272727', width: 210, duration: 0.4, ease: 'expo.out' }, 1.35)
    .to('.l1', { yPercent: -110, duration: 0.35, ease: 'expo.out' }, 1.35)
    .to('.l2', { yPercent: 0, duration: 0.4, ease: 'expo.out' }, 1.35)
    .to('.c1', { y: -24, duration: 0.35, ease: 'expo.out' }, 1.5).to('.c2', { y: 0, duration: 0.4, ease: 'expo.out' }, 1.5)
    // the bell arrives and rings
    .to('.bellw', { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(2.5)' }, 1.6)
    .to('.bell', { rotation: 24, duration: 1.1, ease: 'ring' }, 1.9)
    .fromTo('.w1', { scale: 1, opacity: 0.7 }, { scale: 1.9, opacity: 0, duration: 0.7, ease: 'power2.out' }, 1.9)
    .fromTo('.w2', { scale: 1, opacity: 0.5 }, { scale: 1.9, opacity: 0, duration: 0.7, ease: 'power2.out' }, 2.15)
    .fromTo('.dot', { scale: 0 }, { scale: 1, duration: 0.4, ease: 'back.out(3)' }, 2.3)
    .to('.cursor', { x: BX + 60, y: BY + 80, duration: 0.6, ease: 'power2.inOut' }, 1.7)
    // reset for the loop
    .to('.row', { opacity: 0, y: -20, duration: 0.35, ease: 'power2.in' }, 3.55)
    .to('.cursor', { x: 1060, y: 660, opacity: 0, duration: 0.4, ease: 'power2.in' }, 3.5);
</script>
