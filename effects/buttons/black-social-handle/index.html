<!doctype html><meta charset="utf-8">
<title>Black Social Handle</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#111}
  .bg{position:absolute;inset:0;background:url("../../../assets/backgrounds/sunset.png") center/cover;transform:scale(1.06)}
  .lt{position:absolute;left:80px;bottom:80px;height:76px;display:flex;align-items:center}
  .pill{position:absolute;left:0;top:0;height:76px;width:76px;border-radius:38px;background:#0c0c0e;box-shadow:0 20px 40px rgba(0,0,0,.35);will-change:width;overflow:hidden}
  .ic{position:absolute;left:0;top:0;width:76px;height:76px;display:flex;align-items:center;justify-content:center;will-change:transform}
  .ic svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .m{position:absolute;left:76px;top:0;height:76px;overflow:hidden;display:flex;align-items:center;padding-right:34px}
  .h{white-space:nowrap;color:#fff;font-size:30px;font-weight:500;letter-spacing:-.01em;will-change:transform}
  .h b{font-weight:400;color:#9a9aa5;margin-right:2px}
  .dot{position:absolute;left:58px;top:14px;width:12px;height:12px;border-radius:50%;background:#ff3b5c;border:2px solid #0c0c0e;transform:scale(0)}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="lt">
    <div class="pill"><div class="m"><div class="h"><b>@</b>northwind.studio</div></div></div>
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".8" fill="#fff"/></svg><div class="dot"></div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  const W = 76 + 34 + 340;   // icon + padding + text
  gsap.set('.h', { xPercent: -110 });
  tl.fromTo('.bg', { scale: 1.06, xPercent: 0.8 }, { scale: 1.12, xPercent: -0.8, duration: 4, ease: 'none' }, 0)
    .fromTo('.pill', { scale: 0 }, { scale: 1, duration: 0.5, ease: 'back.out(2)' }, 0.1)
    .fromTo('.ic', { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.6, ease: 'back.out(2)' }, 0.15)
    .to('.pill', { width: W, duration: 0.7, ease: 'expo.out' }, 0.55)
    .to('.h', { xPercent: 0, duration: 0.7, ease: 'expo.out' }, 0.65)
    .fromTo('.dot', { scale: 0 }, { scale: 1, duration: 0.4, ease: 'back.out(3)' }, 1.3)
    .to('.dot', { scale: 1.3, duration: 0.3, yoyo: true, repeat: 3, ease: 'power1.inOut' }, 1.8)
    // out: text back into the pill, pill collapses to the icon, icon spins away
    .to('.h', { xPercent: -110, duration: 0.45, ease: 'expo.in' }, 3.1)
    .to('.pill', { width: 76, duration: 0.5, ease: 'expo.inOut' }, 3.2)
    .to('.dot', { scale: 0, duration: 0.2 }, 3.3)
    .to('.ic', { scale: 0, rotation: 90, duration: 0.4, ease: 'back.in(2)' }, 3.6)
    .to('.pill', { scale: 0, duration: 0.35, ease: 'back.in(2)' }, 3.65);
</script>
