<!doctype html><meta charset="utf-8">
<title>Black App Store Badge</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:radial-gradient(circle at 50% 40%,#ffffff,#e9ebf0);display:flex;align-items:center;justify-content:center}
  .badge{position:relative;width:420px;height:124px;border-radius:20px;background:#0a0a0a;border:2px solid #3a3a3a;display:flex;align-items:center;gap:20px;padding:0 30px;color:#fff;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.25);will-change:transform,filter}
  .logo{width:64px;height:64px;flex:none}
  .logo svg{width:64px;height:64px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
  .lines{display:flex;flex-direction:column;justify-content:center}
  .m{overflow:hidden;line-height:1.05}
  .small{display:block;font-size:19px;letter-spacing:.02em;color:#ddd;font-weight:400}
  .big{display:block;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-size:50px;font-weight:500;letter-spacing:-.02em;margin-top:2px}
  .shine{position:absolute;top:-40px;bottom:-40px;left:0;width:90px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg) translateX(-200px)}
  .shadow{position:absolute;width:360px;height:40px;border-radius:50%;background:rgba(0,0,0,.25);filter:blur(18px);left:50%;top:50%;margin:60px 0 0 -180px}
</style>
<div class="stage">
  <div class="shadow"></div>
  <div class="badge">
    <div class="logo"><svg viewBox="0 0 64 64"><path class="p1" d="M12 46 L32 10 L52 46"/><path class="p2" d="M20 36 H44"/><path class="p3" d="M32 46 a20 20 0 0 1 -20 0"/></svg></div>
    <div class="lines">
      <div class="m"><span class="small">Download on the</span></div>
      <div class="m"><span class="big">App Store</span></div>
    </div>
    <div class="shine"></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 3 });
  tl.fromTo('.badge', { scale: 0.5, rotation: -8, opacity: 0, filter: 'blur(14px)' }, { scale: 1, rotation: 0, opacity: 1, filter: 'blur(0px)', duration: 0.7, ease: 'back.out(1.8)' }, 0)
    .fromTo('.shadow', { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: 'power3.out' }, 0)
    .from('.logo path', { drawSVG: '0%', duration: 0.5, ease: 'power2.inOut', stagger: 0.1 }, 0.25)
    .from('.small', { yPercent: 120, duration: 0.5, ease: 'expo.out' }, 0.45)
    .from('.big', { yPercent: 120, duration: 0.6, ease: 'expo.out' }, 0.55)
    // the gloss sweep
    .to('.shine', { x: 640, duration: 0.7, ease: 'power2.inOut' }, 1.0)
    // hover lift
    .to('.badge', { y: -8, duration: 0.5, ease: 'power2.out' }, 1.5)
    .to('.shadow', { scale: 0.92, opacity: 0.7, duration: 0.5 }, 1.5)
    .to('.badge', { y: 0, duration: 0.5, ease: 'power2.inOut' }, 2.0)
    .to('.shadow', { scale: 1, opacity: 1, duration: 0.5 }, 2.0)
    // out
    .to('.badge', { scale: 0.6, opacity: 0, rotation: 6, filter: 'blur(12px)', duration: 0.35, ease: 'power3.in' }, 2.6)
    .to('.shadow', { scale: 0.3, opacity: 0, duration: 0.35, ease: 'power3.in' }, 2.6);
</script>
