<!doctype html><meta charset="utf-8">
<title>3 Toggle Switch Buttons</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f3f4f7;display:flex;align-items:center;justify-content:center}
  .card{width:520px;background:#fff;border-radius:28px;padding:14px 8px;box-shadow:0 30px 60px rgba(20,24,40,.10),0 2px 6px rgba(20,24,40,.05)}
  .hd{padding:14px 20px 12px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#8a8f9c;font-weight:500}
  .row{display:flex;align-items:center;gap:18px;padding:18px 20px;border-radius:18px;will-change:transform}
  .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center}
  .ic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .r1 .ic{background:#ff6b6b}.r2 .ic{background:#4d7cff}.r3 .ic{background:#22c55e}
  .txt{flex:1}
  .t{font-size:20px;font-weight:500;color:#111}
  .s{font-size:15px;color:#8a8f9c;margin-top:3px;height:20px;overflow:hidden;position:relative}
  .s span{position:absolute;left:0;top:0}
  .s .on{transform:translateY(120%)}
  .tg{position:relative;width:66px;height:38px;border-radius:19px;background:#d9dce3;will-change:background-color,transform}
  .kn{position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);will-change:transform}
</style>
<div class="stage">
  <div class="card">
    <div class="hd">Permissions</div>
    <div class="row r1"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div><div class="txt"><div class="t">Camera</div><div class="s"><span class="off">Not allowed</span><span class="on">Allowed while using</span></div></div><div class="tg"><div class="kn"></div></div></div>
    <div class="row r2"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div><div class="txt"><div class="t">Location</div><div class="s"><span class="off">Never</span><span class="on">Precise location on</span></div></div><div class="tg"><div class="kn"></div></div></div>
    <div class="row r3"><div class="ic"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21h4"/></svg></div><div class="txt"><div class="t">Notifications</div><div class="s"><span class="off">Off</span><span class="on">Banners and sounds</span></div></div><div class="tg"><div class="kn"></div></div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 3 });
  const colors = ['#ff6b6b', '#4d7cff', '#22c55e'];
  tl.from('.card', { y: 30, opacity: 0, duration: 0.5, ease: 'expo.out' }, 0)
    .from('.row', { x: -24, opacity: 0, duration: 0.5, ease: 'expo.out', stagger: 0.07 }, 0.1);
  const on = (i, t) => {
    const r = `.r${i + 1}`;
    tl.to(`${r} .kn`, { x: 28, duration: 0.45, ease: 'back.out(2.2)' }, t)
      .to(`${r} .kn`, { scaleX: 1.25, duration: 0.12, ease: 'power2.out' }, t)
      .to(`${r} .kn`, { scaleX: 1, duration: 0.35, ease: 'elastic.out(1,0.5)' }, t + 0.12)
      .to(`${r} .tg`, { backgroundColor: colors[i], duration: 0.3 }, t)
      .to(`${r} .tg`, { scale: 1.06, duration: 0.1 }, t).to(`${r} .tg`, { scale: 1, duration: 0.35, ease: 'elastic.out(1,0.45)' }, t + 0.1)
      .to(`${r} .s .off`, { yPercent: -120, duration: 0.3, ease: 'expo.out' }, t + 0.05)
      .to(`${r} .s .on`, { y: 0, duration: 0.35, ease: 'expo.out' }, t + 0.05)
      .to(`${r} .ic`, { scale: 1.1, duration: 0.1 }, t).to(`${r} .ic`, { scale: 1, duration: 0.4, ease: 'elastic.out(1,0.4)' }, t + 0.1);
  };
  const off = (i, t) => {
    const r = `.r${i + 1}`;
    tl.to(`${r} .kn`, { x: 0, duration: 0.4, ease: 'back.out(1.8)' }, t)
      .to(`${r} .tg`, { backgroundColor: '#d9dce3', duration: 0.3 }, t)
      .to(`${r} .s .off`, { yPercent: 0, duration: 0.3, ease: 'expo.out' }, t + 0.05)
      .to(`${r} .s .on`, { y: '120%', duration: 0.3, ease: 'expo.out' }, t + 0.05);
  };
  gsap.set('.s .on', { y: '120%' });
  on(0, 0.6); on(1, 0.85); on(2, 1.1);
  off(2, 2.15); off(1, 2.35); off(0, 2.55);
</script>
