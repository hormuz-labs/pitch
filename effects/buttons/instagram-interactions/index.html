<!doctype html><meta charset="utf-8">
<title>Instagram Interactions</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#fafafa;display:flex;align-items:center;justify-content:center}
  .post{width:720px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.10);will-change:transform}
  .top{display:flex;align-items:center;gap:14px;padding:20px 24px}
  .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ff7a45,#ff2d87,#8a3cff)}
  .un{font-size:20px;font-weight:500;color:#111}
  .pic{height:520px;background:url("../../../assets/backgrounds/ocean.png") center/cover}
  .acts{display:flex;align-items:center;gap:26px;padding:20px 24px 26px;position:relative}
  .a{display:flex;align-items:center;gap:10px;will-change:transform}
  .a svg{width:38px;height:38px;fill:none;stroke:#111;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .a .n{font-size:22px;font-weight:500;color:#111;height:28px;overflow:hidden}
  .a .n span{display:block;line-height:28px}
  .heart path{fill:transparent}
  .bubble{position:absolute;left:24px;top:-30px;background:#111;color:#fff;font-size:18px;padding:8px 14px;border-radius:14px;white-space:nowrap;transform-origin:left bottom;opacity:0}
  .bubble::after{content:"";position:absolute;left:14px;bottom:-6px;border:6px solid transparent;border-top-color:#111;border-bottom:0}
</style>
<div class="stage">
  <div class="post">
    <div class="top"><div class="av"></div><div class="un">northwind.studio</div></div>
    <div class="pic"></div>
    <div class="acts">
      <div class="bubble b1">Sam liked your post</div>
      <div class="bubble b2">Alex commented: "so good"</div>
      <div class="bubble b3">Jo shared your post</div>
      <div class="a like"><svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11.3A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.7C20 15.7 12 21 12 21z"/></svg><div class="n"><span>1,204</span><span>1,205</span></div></div>
      <div class="a cmt"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.4A8 8 0 1 1 21 12z"/></svg><div class="n"><span>86</span><span>87</span></div></div>
      <div class="a shr"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg><div class="n"><span>12</span><span>13</span></div></div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 2 });
  tl.from('.post', { y: 40, opacity: 0, duration: 0.5, ease: 'expo.out' }, 0)
    .from('.a', { scale: 0, duration: 0.5, ease: 'back.out(2.5)', stagger: 0.1, transformOrigin: '50% 50%' }, 0.15);
  const hit = (sel, t, bubble) => {
    tl.to(`${sel} svg`, { scale: 1.35, duration: 0.14, ease: 'power2.out' }, t)
      .to(`${sel} svg`, { scale: 1, duration: 0.5, ease: 'elastic.out(1,0.4)' }, t + 0.14)
      .to(`${sel} .n span`, { y: -28, duration: 0.35, ease: 'back.out(1.6)' }, t + 0.05)
      .fromTo(bubble, { scale: 0.6, y: 10, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.4, ease: 'back.out(2)' }, t)
      .to(bubble, { y: -14, opacity: 0, duration: 0.3, ease: 'power2.in' }, t + 0.5);
  };
  hit('.like', 0.6, '.b1');
  tl.to('.heart path', { fill: '#ff2d55', stroke: '#ff2d55', duration: 0.2 }, 0.6);
  hit('.cmt', 1.0, '.b2');
  hit('.shr', 1.35, '.b3');
  tl.to('.post', { y: -30, opacity: 0, duration: 0.3, ease: 'power3.in' }, 1.75);
</script>
