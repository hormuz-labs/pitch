<!doctype html><meta charset="utf-8">
<title>Button: Hover Effect</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0d0e12;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:34px}
  .h{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-size:64px;font-weight:500;color:#fff;letter-spacing:-.03em;text-align:center;line-height:1.05}
  .h span{color:#6b6f7c}
  .btn{position:relative;height:74px;padding:0 40px;border-radius:37px;border:2px solid #fff;color:#fff;display:flex;align-items:center;gap:0;font-size:22px;font-weight:500;overflow:hidden;will-change:transform,box-shadow}
  .fill{position:absolute;width:40px;height:40px;border-radius:50%;background:#fff;left:0;top:0;margin:-20px 0 0 -20px;transform:scale(0);will-change:transform}
  .lab{position:relative;z-index:2;will-change:color,transform}
  .aw{position:relative;z-index:2;width:0;overflow:hidden;display:flex;align-items:center;height:24px}
  .aw svg{width:24px;height:24px;flex:none;fill:none;stroke:#111;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .glow{position:absolute;left:50%;top:50%;width:300px;height:80px;margin:-40px 0 0 -150px;border-radius:50%;background:#fff;filter:blur(40px);opacity:0}
  .cursor{position:absolute;left:0;top:0;width:30px;height:30px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));z-index:10;will-change:transform}
</style>
<div class="stage">
  <div class="h">Ship faster with<br><span>Northwind Cloud</span></div>
  <div style="position:relative"><div class="glow"></div>
  <div class="btn"><div class="fill"></div><span class="lab">Get started</span><span class="aw"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div></div>
  <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l16 9-7 1.5L9 20z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  // button is centered near y≈450 (title 2 lines + gap); measure from the DOM for the cursor path
  const b = document.querySelector('.btn').getBoundingClientRect();
  const ex = b.left + 40, ey = b.top + b.height / 2 + 6;       // entry point at the button's left edge
  gsap.set('.fill', { x: 40, y: b.height / 2 });
  gsap.set('.cursor', { x: 1060, y: 660 });
  tl.from('.h', { y: 30, opacity: 0, duration: 0.7, ease: 'expo.out' }, 0)
    .from('.btn', { y: 30, opacity: 0, duration: 0.7, ease: 'expo.out' }, 0.1)
    // cursor arrives at the left edge of the button
    .to('.cursor', { x: ex, y: ey, duration: 0.8, ease: 'power3.inOut' }, 0.4)
    // hover in: the fill floods from the cursor's entry point, label inverts, arrow unfolds, button lifts
    .to('.fill', { scale: 12, duration: 0.6, ease: 'power3.out' }, 1.15)
    .to('.lab', { color: '#111', duration: 0.25 }, 1.25)
    .to('.aw', { width: 34, duration: 0.45, ease: 'back.out(2)' }, 1.3)
    .to('.aw svg', { x: 10, duration: 0.45, ease: 'back.out(2)' }, 1.3)
    .to('.btn', { y: -4, scale: 1.04, duration: 0.5, ease: 'back.out(2)' }, 1.15)
    .to('.glow', { opacity: 0.35, duration: 0.5 }, 1.15)
    // the cursor glides across while hovered
    .to('.cursor', { x: b.right - 50, duration: 1.2, ease: 'power1.inOut' }, 1.3)
    // hover out: fill retreats to the exit point (the right edge), everything resets
    .to('.fill', { x: b.width - 40, duration: 0.01 }, 2.55)
    .to('.fill', { scale: 0, duration: 0.5, ease: 'power3.in' }, 2.6)
    .to('.lab', { color: '#fff', duration: 0.2 }, 2.85)
    .to('.aw', { width: 0, duration: 0.35, ease: 'power3.in' }, 2.6)
    .to('.aw svg', { x: 0, duration: 0.35, ease: 'power3.in' }, 2.6)
    .to('.btn', { y: 0, scale: 1, duration: 0.5, ease: 'power3.out' }, 2.7)
    .to('.glow', { opacity: 0, duration: 0.4 }, 2.6)
    .to('.cursor', { x: 1060, y: 660, duration: 0.7, ease: 'power3.inOut' }, 2.65)
    .set('.fill', { x: 40 }, 3.4)
    // exit the whole for the loop
    .to('.h, .btn', { y: -20, opacity: 0, duration: 0.35, ease: 'power3.in', stagger: 0.05 }, 3.6);
</script>
