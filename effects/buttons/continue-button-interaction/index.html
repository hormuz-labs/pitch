<!doctype html><meta charset="utf-8">
<title>Continue Button Interaction</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f1f2f6;display:flex;align-items:center;justify-content:center}
  .card{position:relative;width:520px;height:440px;background:#fff;border-radius:32px;padding:36px;box-shadow:0 30px 60px rgba(20,24,40,.10);overflow:hidden}
  .dots{display:flex;gap:8px;margin-bottom:26px}
  .dots i{display:block;height:6px;width:24px;border-radius:3px;background:#e2e4ea;overflow:hidden;position:relative}
  .dots i b{position:absolute;inset:0;background:#111;transform:scaleX(0);transform-origin:left}
  .steps{position:relative;height:250px}
  .step{position:absolute;inset:0;will-change:transform,opacity}
  .art{width:110px;height:110px;border-radius:30px;margin-bottom:24px;display:flex;align-items:center;justify-content:center}
  .s1 .art{background:#ffe1cc}.s2 .art{background:#d9e6ff}.s3 .art{background:#d7f5e3}
  .art i{width:44px;height:44px;border-radius:12px;background:#111}
  .s2 .art i{border-radius:50%}.s3 .art i{transform:rotate(45deg);border-radius:8px}
  .t{font-size:30px;font-weight:500;color:#111;letter-spacing:-.02em;line-height:1.1}
  .d{font-size:17px;color:#7a7f8c;margin-top:10px;line-height:1.4}
  .btn{position:absolute;left:36px;right:36px;bottom:36px;height:64px;border-radius:32px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:19px;font-weight:500;overflow:hidden;will-change:transform}
  .btn .l{position:relative;overflow:hidden;height:26px}
  .btn .l span{display:block;line-height:26px}
  .btn .aw{width:22px;height:22px;position:relative}
  .btn .aw svg{position:absolute;inset:0;width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .ripple{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0)}
  .cursor{position:absolute;left:0;top:0;width:30px;height:30px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));z-index:10;will-change:transform}
</style>
<div class="stage">
  <div class="card">
    <div class="dots"><i><b></b></i><i><b></b></i><i><b></b></i></div>
    <div class="steps">
      <div class="step s1"><div class="art"><i></i></div><div class="t">Create your workspace</div><div class="d">Give it a name and pick a color. You can change both later.</div></div>
      <div class="step s2"><div class="art"><i></i></div><div class="t">Invite your team</div><div class="d">Add a few teammates so the space isn't empty on day one.</div></div>
      <div class="step s3"><div class="art"><i></i></div><div class="t">You're all set</div><div class="d">Everything is ready. Jump in whenever you like.</div></div>
    </div>
    <div class="btn"><div class="ripple"></div><div class="l"><span class="c">Continue</span><span class="f">Finish</span></div><div class="aw"><svg class="a1" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg><svg class="a2" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div></div>
  </div>
  <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l16 9-7 1.5L9 20z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  const bb = document.querySelector('.btn').getBoundingClientRect();
  const BX = bb.left + bb.width / 2 + 40, BY = bb.top + bb.height / 2;
  gsap.set('.s2, .s3', { x: 80, opacity: 0 });
  gsap.set('.f', { yPercent: 100, position: 'absolute', left: 0, top: 0 });
  gsap.set('.a2', { opacity: 0, scale: 0.5 });
  gsap.set('.cursor', { x: 1000, y: 660 });
  gsap.set('.dots i:nth-child(1) b', { scaleX: 1 });
  const tap = (t, from, to, last) => {
    tl.to('.btn', { scale: 0.95, duration: 0.1, ease: 'power2.in' }, t)
      .to('.btn', { scale: 1, duration: 0.5, ease: 'elastic.out(1,0.45)' }, t + 0.1)
      .to('.cursor', { scale: 0.85, duration: 0.08 }, t).to('.cursor', { scale: 1, duration: 0.2 }, t + 0.1)
      .fromTo('.ripple', { scale: 0, opacity: 1 }, { scale: 30, opacity: 0, duration: 0.6, ease: 'power2.out' }, t)
      // the arrow lunges: momentum
      .to('.aw', { x: 8, duration: 0.15, ease: 'power2.out' }, t).to('.aw', { x: 0, duration: 0.5, ease: 'elastic.out(1,0.4)' }, t + 0.15)
      // step slides on
      .to(from, { x: -80, opacity: 0, duration: 0.45, ease: 'power3.in' }, t + 0.05)
      .to(to, { x: 0, opacity: 1, duration: 0.6, ease: 'expo.out' }, t + 0.35)
      .to(`.dots i:nth-child(${last ? 3 : 2}) b`, { scaleX: 1, duration: 0.4, ease: 'expo.out' }, t + 0.2);
    if (last) tl.to('.c', { yPercent: -100, duration: 0.35, ease: 'expo.out' }, t + 0.3).to('.f', { yPercent: 0, duration: 0.35, ease: 'expo.out' }, t + 0.3)
      .to('.a1', { opacity: 0, scale: 0.5, duration: 0.2 }, t + 0.3).to('.a2', { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2.5)' }, t + 0.4)
      .to('.btn', { backgroundColor: '#16a34a', duration: 0.35 }, t + 0.3);
  };
  tl.from('.card', { y: 40, opacity: 0, duration: 0.6, ease: 'expo.out' }, 0)
    .to('.cursor', { x: BX, y: BY + 6, duration: 0.8, ease: 'power3.inOut' }, 0.3);
  tap(1.2, '.s1', '.s2', false);
  tap(2.45, '.s2', '.s3', true);
  tl.to('.card', { y: -40, opacity: 0, duration: 0.4, ease: 'power3.in' }, 3.55)
    .to('.cursor', { x: 1000, y: 660, opacity: 0, duration: 0.45, ease: 'power2.in' }, 3.55);
</script>
