<!doctype html><meta charset="utf-8">
<title>Toggle Switch Button</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f3f4f7;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:34px;will-change:background-color}
  .tg{position:relative;width:240px;height:130px;border-radius:65px;background:#d9dce3;will-change:background-color,transform;box-shadow:inset 0 4px 12px rgba(0,0,0,.08)}
  .kn{position:absolute;top:10px;left:10px;width:110px;height:110px;border-radius:55px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25);will-change:transform;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .kn svg{position:absolute;width:48px;height:48px;fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .kn .moon{stroke:#111;opacity:0}
  .lbl{font-size:30px;font-weight:500;color:#111;height:36px;overflow:hidden;position:relative;width:240px;text-align:center;will-change:color}
  .lbl span{position:absolute;left:0;right:0;top:0;line-height:36px}
  .stars{position:absolute;inset:0;pointer-events:none}
  .stars i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:0}
</style>
<div class="stage">
  <div class="stars"></div>
  <div class="tg"><div class="kn">
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
    <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
  </div></div>
  <div class="lbl"><span class="l1">Light mode</span><span class="l2">Dark mode</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 3 });
  const rng = fx.rng(3);
  const stars = document.querySelector('.stars');
  for (let i = 0; i < 40; i++) { const s = document.createElement('i'); s.style.left = rng() * 100 + '%'; s.style.top = rng() * 100 + '%'; s.style.transform = `scale(${0.6 + rng() * 1.4})`; stars.appendChild(s); }
  gsap.set('.l2', { y: 40 });
  const TRAVEL = 110;
  tl.from('.tg', { scale: 0.8, opacity: 0, duration: 0.5, ease: 'back.out(2)' }, 0)
    .from('.lbl', { y: 14, opacity: 0, duration: 0.5, ease: 'expo.out' }, 0.1)
    // on: the knob stretches across, then snaps round with overshoot; the world goes dark
    .to('.kn', { scaleX: 1.35, duration: 0.18, ease: 'power2.in', transformOrigin: 'left center' }, 0.7)
    .to('.kn', { x: TRAVEL, duration: 0.45, ease: 'back.out(1.8)' }, 0.75)
    .to('.kn', { scaleX: 1, duration: 0.45, ease: 'elastic.out(1,0.5)', transformOrigin: 'right center' }, 0.9)
    .to('.tg', { backgroundColor: '#5b3cff', duration: 0.35 }, 0.75)
    .to('.tg', { scale: 1.05, duration: 0.15 }, 0.75).to('.tg', { scale: 1, duration: 0.5, ease: 'elastic.out(1,0.4)' }, 0.9)
    .to('.stage', { backgroundColor: '#0c0c14', duration: 0.6 }, 0.8)
    .to('.sun', { rotation: 90, scale: 0.4, opacity: 0, duration: 0.35, ease: 'power2.in' }, 0.8)
    .to('.moon', { opacity: 1, duration: 0.4, ease: 'power2.out' }, 1.0)
    .fromTo('.moon', { rotation: -90, scale: 0.4 }, { rotation: 0, scale: 1, duration: 0.5, ease: 'back.out(2)' }, 1.0)
    .to('.lbl', { color: '#fff', duration: 0.4 }, 0.8)
    .to('.l1', { y: -40, duration: 0.35, ease: 'expo.out' }, 0.85).to('.l2', { y: 0, duration: 0.4, ease: 'expo.out' }, 0.85)
    .to('.stars i', { opacity: 0.8, duration: 0.5, stagger: { each: 0.01, from: 'random' } }, 1.0)
    // off
    .to('.kn', { scaleX: 1.35, duration: 0.18, ease: 'power2.in', transformOrigin: 'right center' }, 2.05)
    .to('.kn', { x: 0, duration: 0.45, ease: 'back.out(1.8)' }, 2.1)
    .to('.kn', { scaleX: 1, duration: 0.45, ease: 'elastic.out(1,0.5)', transformOrigin: 'left center' }, 2.25)
    .to('.tg', { backgroundColor: '#d9dce3', duration: 0.35 }, 2.1)
    .to('.stage', { backgroundColor: '#f3f4f7', duration: 0.5 }, 2.15)
    .to('.moon', { rotation: 90, scale: 0.4, opacity: 0, duration: 0.3, ease: 'power2.in' }, 2.15)
    .to('.sun', { rotation: 0, scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(2)' }, 2.35)
    .to('.lbl', { color: '#111', duration: 0.4 }, 2.15)
    .to('.l2', { y: 40, duration: 0.35, ease: 'expo.out' }, 2.2).to('.l1', { y: 0, duration: 0.4, ease: 'expo.out' }, 2.2)
    .to('.stars i', { opacity: 0, duration: 0.3 }, 2.1);
</script>
