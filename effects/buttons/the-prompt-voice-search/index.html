<!doctype html><meta charset="utf-8">
<title>The Prompt: Voice Search</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b0b0f;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px}
  .glow{position:absolute;left:50%;top:50%;width:900px;height:600px;margin:-300px 0 0 -450px;border-radius:50%;background:radial-gradient(ellipse,#3c6dff 0%,transparent 60%);opacity:.15;filter:blur(40px)}
  .search{position:relative;width:760px;height:84px;border-radius:42px;background:#15161c;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;padding:0 16px 0 30px;color:#fff;font-size:22px;box-shadow:0 30px 60px rgba(0,0,0,.5);will-change:transform}
  .q{flex:1;position:relative;height:30px;overflow:hidden}
  .q .ph{position:absolute;left:0;top:0;line-height:30px;color:#6b6f7c;white-space:nowrap}
  .q .txt{position:absolute;left:0;top:0;line-height:30px;white-space:nowrap}
  .q .wave{position:absolute;left:0;top:0;height:30px;display:flex;align-items:center;gap:5px;opacity:0}
  .q .wave i{display:block;width:5px;height:6px;border-radius:3px;background:#3c9dff;will-change:transform;transform-origin:center}
  .mic{position:relative;width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;will-change:transform,background-color}
  .mic svg{width:24px;height:24px;fill:none;stroke:#111;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .ring{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:2px solid #3c9dff;opacity:0}
  .hint{color:#6b6f7c;font-size:17px;letter-spacing:.06em;text-transform:uppercase;height:22px;overflow:hidden}
  .hint span{display:block;line-height:22px}
  .res{width:760px;display:flex;flex-direction:column;gap:12px}
  .r{display:flex;align-items:center;gap:16px;background:#15161c;border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:16px 20px;color:#fff;will-change:transform,opacity}
  .r .d{width:40px;height:40px;border-radius:12px;background:#2a2c36;display:flex;align-items:center;justify-content:center}
  .r .d i{width:14px;height:14px;border-radius:50%;background:#3c9dff}
  .r .t{font-size:19px;font-weight:500}
  .r .s{font-size:14px;color:#8a8f9c;margin-top:3px}
  .r .m{margin-left:auto;color:#3c9dff;font-size:15px}
  .cursor{position:absolute;left:0;top:0;width:30px;height:30px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));z-index:10;will-change:transform}
</style>
<div class="stage">
  <div class="glow"></div>
  <div class="search">
    <div class="q"><span class="ph">Search or ask anything</span><span class="txt"></span><div class="wave"></div></div>
    <div class="mic"><div class="ring r1"></div><div class="ring r2"></div><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
  </div>
  <div class="hint"><span class="h1">Tap the mic to speak</span><span class="h2">Listening…</span><span class="h3">3 results</span></div>
  <div class="res">
    <div class="r"><div class="d"><i></i></div><div><div class="t">Northwind Roasters</div><div class="s">Open until 9 pm · 0.3 mi</div></div><div class="m">Directions</div></div>
    <div class="r"><div class="d"><i></i></div><div><div class="t">Acme Coffee Bar</div><div class="s">Open until 8 pm · 0.6 mi</div></div><div class="m">Directions</div></div>
    <div class="r"><div class="d"><i></i></div><div><div class="t">Harbor Espresso</div><div class="s">Open 24 hours · 1.1 mi</div></div><div class="m">Directions</div></div>
  </div>
  <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l16 9-7 1.5L9 20z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/TextPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(TextPlugin);
  const D = 10;
  const tl = fx.timeline({ duration: D });
  const wave = document.querySelector('.wave');
  const N = 28;
  for (let i = 0; i < N; i++) wave.appendChild(document.createElement('i'));
  const bars = [...wave.children];
  const rng = fx.rng(11);
  const ph = bars.map(() => rng() * 6.28), fr = bars.map(() => 6 + rng() * 9);
  const m = document.querySelector('.mic').getBoundingClientRect();
  const MX = m.left + m.width / 2 + 8, MY = m.top + m.height / 2 + 8;
  const state = { level: 0 };
  gsap.set('.cursor', { x: 1060, y: 660 });
  gsap.set('.r', { opacity: 0, y: 24 });
  gsap.set('.h2, .h3', { y: 22 });
  tl.from('.search', { y: 30, opacity: 0, duration: 0.6, ease: 'expo.out' }, 0)
    .from('.hint', { opacity: 0, duration: 0.5 }, 0.2)
    .to('.cursor', { x: MX, y: MY, duration: 0.9, ease: 'power3.inOut' }, 0.5)
    // tap the mic: it goes blue and breathes; rings radiate
    .to('.mic', { scale: 0.85, duration: 0.1, ease: 'power2.in' }, 1.5)
    .to('.mic', { scale: 1.1, backgroundColor: '#3c9dff', duration: 0.5, ease: 'elastic.out(1,0.45)' }, 1.6)
    .to('.mic svg', { stroke: '#fff', duration: 0.2 }, 1.6)
    .to('.cursor', { x: MX + 140, y: MY + 90, opacity: 0, duration: 0.6, ease: 'power2.inOut' }, 1.8)
    .to('.ph', { y: -30, opacity: 0, duration: 0.3, ease: 'expo.in' }, 1.6)
    .to('.wave', { opacity: 1, duration: 0.3 }, 1.8)
    .to(state, { level: 1, duration: 0.6 }, 1.8)
    .to('.h1', { y: -22, duration: 0.3, ease: 'expo.out' }, 1.7).to('.h2', { y: 0, duration: 0.35, ease: 'expo.out' }, 1.7);
  for (let k = 0; k < 6; k++) {
    tl.fromTo('.ring.r1', { scale: 1, opacity: 0.8 }, { scale: 2.6, opacity: 0, duration: 1.1, ease: 'power2.out' }, 1.7 + k * 0.8);
    tl.fromTo('.ring.r2', { scale: 1, opacity: 0.5 }, { scale: 2.2, opacity: 0, duration: 1.1, ease: 'power2.out' }, 2.1 + k * 0.8);
  }
  tl.to('.mic', { scale: 1.0, duration: 0.4, yoyo: true, repeat: 9, ease: 'sine.inOut' }, 2.1)
    // the words land as they are recognised: waveform gives way to the transcript
    .to(state, { level: 0, duration: 0.5 }, 5.3)
    .to('.wave', { opacity: 0, duration: 0.3 }, 5.5)
    .to('.txt', { text: 'Find cafés open now near me', duration: 1.2, ease: 'none' }, 5.6)
    .to('.mic', { backgroundColor: '#fff', scale: 1, duration: 0.4 }, 6.6)
    .to('.mic svg', { stroke: '#111', duration: 0.3 }, 6.6)
    .to('.h2', { y: -22, duration: 0.3, ease: 'expo.out' }, 6.9).to('.h3', { y: 0, duration: 0.35, ease: 'expo.out' }, 6.9)
    .to('.r', { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out', stagger: 0.12 }, 7.0)
    // out
    .to('.r', { opacity: 0, y: -16, duration: 0.3, ease: 'power2.in', stagger: 0.05 }, 9.2)
    .to('.search, .hint', { opacity: 0, y: -20, duration: 0.35, ease: 'power2.in' }, 9.4);
  const seek0 = window.__fx.seek;
  window.__fx.seek = t => {
    seek0(t);
    const L = state.level;
    bars.forEach((b, i) => {
      const env = Math.sin(t * 2.1 + i * 0.35) * 0.5 + 0.5;
      const v = Math.abs(Math.sin(t * fr[i] + ph[i])) * (0.4 + 0.6 * env);
      const h = 1 + L * v * 4.2;   // scaleY of a 6px bar → up to ~30px
      b.style.transform = `scaleY(${h.toFixed(3)})`;
    });
  };
</script>
