<!doctype html><meta charset="utf-8">
<title>Google Play Badge</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:radial-gradient(circle at 50% 40%,#ffffff,#e9ebf0);display:flex;align-items:center;justify-content:center}
  .badge{position:relative;width:420px;height:124px;border-radius:20px;background:#0a0a0a;border:2px solid #3a3a3a;display:flex;align-items:center;gap:22px;padding:0 30px;color:#fff;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.25);will-change:transform}
  .logo{width:64px;height:64px;flex:none;position:relative}
  .logo svg{width:64px;height:64px;overflow:visible}
  .logo path{will-change:transform;transform-box:fill-box;transform-origin:center}
  .lines{display:flex;flex-direction:column;justify-content:center}
  .m{overflow:hidden;line-height:1.05}
  .small{display:block;font-size:17px;letter-spacing:.14em;color:#ddd;text-transform:uppercase}
  .big{display:block;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-size:50px;font-weight:500;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
  .shine{position:absolute;top:-40px;bottom:-40px;left:0;width:90px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg) translateX(-200px)}
  .shadow{position:absolute;width:360px;height:40px;border-radius:50%;background:rgba(0,0,0,.25);filter:blur(18px);left:50%;top:50%;margin:60px 0 0 -180px}
</style>
<div class="stage">
  <div class="shadow"></div>
  <div class="badge">
    <div class="logo"><svg viewBox="0 0 64 64">
      <path class="q q1" d="M8 6 L36 32 L8 58 Z" fill="#00c3ff"/>
      <path class="q q2" d="M8 6 L44 24 L36 32 Z" fill="#00e676"/>
      <path class="q q3" d="M8 58 L36 32 L44 40 Z" fill="#ff3d5a"/>
      <path class="q q4" d="M44 24 L58 32 L44 40 L36 32 Z" fill="#ffd600"/>
    </svg></div>
    <div class="lines">
      <div class="m"><span class="small">Get it on</span></div>
      <div class="m"><span class="big">Play Store</span></div>
    </div>
    <div class="shine"></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 3 });
  tl.fromTo('.badge', { scale: 0.6, y: 40, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.7, ease: 'back.out(1.6)' }, 0)
    .fromTo('.shadow', { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: 'power3.out' }, 0)
    // the four facets fly in from four directions and lock together
    .from('.q1', { x: -60, opacity: 0, duration: 0.55, ease: 'back.out(1.8)' }, 0.25)
    .from('.q2', { y: -60, opacity: 0, duration: 0.55, ease: 'back.out(1.8)' }, 0.33)
    .from('.q3', { y: 60, opacity: 0, duration: 0.55, ease: 'back.out(1.8)' }, 0.41)
    .from('.q4', { x: 60, opacity: 0, duration: 0.55, ease: 'back.out(1.8)' }, 0.49)
    .from('.small', { yPercent: 120, duration: 0.5, ease: 'expo.out' }, 0.45)
    .from('.big', { yPercent: 120, duration: 0.6, ease: 'expo.out' }, 0.55)
    .to('.shine', { x: 640, duration: 0.7, ease: 'power2.inOut' }, 1.05)
    // a tilt-and-return, like the badge catching light
    .to('.badge', { rotationY: 14, rotationX: -6, duration: 0.6, ease: 'power2.inOut', transformPerspective: 900 }, 1.5)
    .to('.badge', { rotationY: 0, rotationX: 0, duration: 0.6, ease: 'power2.inOut' }, 2.05)
    .to('.logo svg', { rotation: 360, duration: 0.8, ease: 'power3.inOut', transformOrigin: '50% 50%' }, 1.5)
    .to('.badge', { scale: 0.6, y: -40, opacity: 0, duration: 0.35, ease: 'power3.in' }, 2.6)
    .to('.shadow', { scale: 0.3, opacity: 0, duration: 0.35, ease: 'power3.in' }, 2.6);
</script>
