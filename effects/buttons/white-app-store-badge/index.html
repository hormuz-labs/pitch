<!doctype html><meta charset="utf-8">
<title>White App Store Badge</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0a0a0c;display:flex;align-items:center;justify-content:center;perspective:1000px}
  .bg{position:absolute;inset:0;background:url("../../../assets/backgrounds/aurora.png") center/cover;opacity:.35;transform:scale(1.1)}
  .badge{position:relative;width:420px;height:124px;border-radius:20px;background:#fff;border:2px solid #d8d8dc;display:flex;align-items:center;gap:20px;padding:0 30px;color:#0a0a0a;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5);will-change:transform;transform-style:preserve-3d}
  .logo{width:64px;height:64px;flex:none}
  .logo svg{width:64px;height:64px;fill:none;stroke:#0a0a0a;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
  .lines{display:flex;flex-direction:column;justify-content:center}
  .m{overflow:hidden;line-height:1.05}
  .small{display:block;font-size:19px;letter-spacing:.02em;color:#444}
  .big{display:block;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-size:50px;font-weight:500;letter-spacing:-.02em;margin-top:2px}
  .shine{position:absolute;top:-40px;bottom:-40px;left:0;width:110px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.08),transparent);transform:skewX(-20deg) translateX(-200px)}
  .halo{position:absolute;left:50%;top:50%;width:520px;height:200px;margin:-100px 0 0 -260px;border-radius:50%;background:#fff;filter:blur(60px);opacity:0}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="halo"></div>
  <div class="badge">
    <div class="logo"><svg viewBox="0 0 64 64"><path class="p1" d="M12 46 L32 10 L52 46"/><path class="p2" d="M20 36 H44"/><path class="p3" d="M32 46 a20 20 0 0 1 -20 0"/></svg></div>
    <div class="lines">
      <div class="m"><span class="small">Download on the</span></div>
      <div class="m"><span class="big">App Store</span></div>
    </div>
    <div class="shine"></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 3 });
  tl.fromTo('.bg', { scale: 1.1, xPercent: 1 }, { scale: 1.16, xPercent: -1, duration: 3, ease: 'none' }, 0)
    // the badge flips up from flat, like a card being turned to face the viewer
    .fromTo('.badge', { rotationX: -95, y: 60, opacity: 0, transformOrigin: '50% 100%' }, { rotationX: 0, y: 0, opacity: 1, duration: 0.8, ease: 'back.out(1.4)' }, 0)
    .to('.halo', { opacity: 0.22, duration: 0.8 }, 0.2)
    .from('.logo path', { drawSVG: '0%', duration: 0.5, ease: 'power2.inOut', stagger: 0.1 }, 0.35)
    .from('.small', { yPercent: 120, duration: 0.5, ease: 'expo.out' }, 0.5)
    .from('.big', { yPercent: 120, duration: 0.6, ease: 'expo.out' }, 0.6)
    .to('.shine', { x: 640, duration: 0.7, ease: 'power2.inOut' }, 1.1)
    // a breath
    .to('.badge', { scale: 1.04, duration: 0.5, ease: 'sine.inOut' }, 1.6)
    .to('.badge', { scale: 1, duration: 0.5, ease: 'sine.inOut' }, 2.1)
    .to('.halo', { opacity: 0.32, duration: 0.5, yoyo: true, repeat: 1 }, 1.6)
    // out: flips away over the top
    .to('.badge', { rotationX: 95, y: -60, opacity: 0, duration: 0.4, ease: 'power3.in', transformOrigin: '50% 0%' }, 2.6)
    .to('.halo', { opacity: 0, duration: 0.4 }, 2.6);
</script>
