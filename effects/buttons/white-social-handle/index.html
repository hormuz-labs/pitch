<!doctype html><meta charset="utf-8">
<title>White Social Handle</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0a0a0c}
  .bg{position:absolute;inset:0;background:url("../../../assets/backgrounds/aurora.png") center/cover;transform:scale(1.06);filter:brightness(.55)}
  .lt{position:absolute;left:80px;bottom:80px;height:76px}
  .pill{position:absolute;left:0;top:0;height:76px;border-radius:38px;background:#fff;box-shadow:0 20px 40px rgba(0,0,0,.4);display:flex;align-items:center;padding:0 34px 0 0;overflow:hidden;will-change:transform,clip-path}
  .ic{width:76px;height:76px;flex:none;display:flex;align-items:center;justify-content:center;will-change:transform}
  .ic svg{width:34px;height:34px;fill:none;stroke:#111;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .h{white-space:nowrap;color:#111;font-size:30px;font-weight:500;letter-spacing:-.01em;will-change:transform,opacity}
  .h b{font-weight:400;color:#8a8f9c;margin-right:2px}
  .h .ch{display:inline-block;will-change:transform,opacity}
  .under{position:absolute;left:76px;right:34px;bottom:16px;height:2px;background:#111;transform:scaleX(0);transform-origin:left;opacity:.6}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="lt">
    <div class="pill">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.4L19 9l-4.3 3.4L16 18l-4-2.8L8 18l1.3-5.6L5 9l5.1-.6z"/></svg></div>
      <div class="h"><b>@</b><span class="w">acme.motion</span></div>
      <div class="under"></div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/SplitText.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(SplitText);
  const tl = fx.timeline({ duration: 4 });
  const split = new SplitText('.w', { type: 'chars', charsClass: 'ch' });
  tl.fromTo('.bg', { scale: 1.06, yPercent: 0.6 }, { scale: 1.12, yPercent: -0.6, duration: 4, ease: 'none' }, 0)
    // the bar wipes in from the left edge, the icon spinning into place
    .fromTo('.pill', { clipPath: 'inset(0 100% 0 0 round 38px)', x: -40 }, { clipPath: 'inset(0 0% 0 0 round 38px)', x: 0, duration: 0.8, ease: 'expo.out' }, 0.1)
    .fromTo('.ic', { rotation: -180, scale: 0.4 }, { rotation: 0, scale: 1, duration: 0.7, ease: 'back.out(1.8)' }, 0.15)
    .from('.h b', { opacity: 0, x: -10, duration: 0.4, ease: 'power3.out' }, 0.45)
    .from(split.chars, { yPercent: 80, opacity: 0, duration: 0.45, ease: 'back.out(2)', stagger: 0.03 }, 0.5)
    .to('.under', { scaleX: 1, duration: 0.6, ease: 'expo.out' }, 0.9)
    .to('.ic', { rotation: 360, duration: 0.7, ease: 'power3.inOut' }, 2.0)
    // out: the letters fall away and the bar wipes back to the left
    .to(split.chars, { yPercent: -80, opacity: 0, duration: 0.3, ease: 'power2.in', stagger: 0.02 }, 3.1)
    .to('.under', { scaleX: 0, duration: 0.3, ease: 'power2.in', transformOrigin: 'right' }, 3.1)
    .to('.pill', { clipPath: 'inset(0 100% 0 0 round 38px)', x: -40, duration: 0.45, ease: 'expo.in' }, 3.4);
</script>
