<!doctype html><meta charset="utf-8">
<title>The Prompt: Generate Button</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b0b0f;display:flex;align-items:center;justify-content:center}
  .glow{position:absolute;left:50%;top:50%;width:1000px;height:600px;margin:-300px 0 0 -500px;border-radius:50%;background:radial-gradient(ellipse,#5b3cff 0%,transparent 60%);opacity:.18;filter:blur(40px)}
  .box{position:relative;width:760px}
  .field{background:#15161c;border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:24px 26px;color:#fff;font-size:22px;line-height:1.4;min-height:110px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
  .field .ph{color:#6b6f7c}
  .field .txt::after{content:"";display:inline-block;width:2px;height:24px;background:#fff;vertical-align:-4px;margin-left:2px}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
  .chips{display:flex;gap:10px}
  .chip{padding:10px 16px;border-radius:14px;background:#15161c;border:1px solid rgba(255,255,255,.08);color:#9a9eab;font-size:15px}
  .gen{position:relative;height:60px;width:200px;border-radius:30px;overflow:hidden;will-change:transform}
  .gen .border{position:absolute;inset:-60px;background:conic-gradient(from 0deg,#5b3cff,#ff3cac,#ffb13c,#3cffd6,#5b3cff);will-change:transform;opacity:0}
  .gen .inner{position:absolute;inset:2px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .gen .l{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:19px;font-weight:500;color:#111}
  .gen .l svg{width:20px;height:20px}
  .gen .spin{width:24px;height:24px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;will-change:transform}
  .gen .lb{background:#111;color:#fff}
  .gen .ld{background:#16a34a;color:#fff}
  .out{margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .tile{height:150px;border-radius:18px;will-change:transform,opacity;overflow:hidden;position:relative}
  .t1{background:linear-gradient(160deg,#ff9a5c,#ff3cac)}.t2{background:linear-gradient(160deg,#3cffd6,#5b3cff)}.t3{background:linear-gradient(160deg,#ffb13c,#ff5c5c)}
  .tile i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.85)}
  .t2 i{border-radius:12px;transform:rotate(45deg)}.t3 i{border-radius:12px 12px 40px 40px}
  .cursor{position:absolute;left:0;top:0;width:30px;height:30px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));z-index:10;will-change:transform}
</style>
<div class="stage">
  <div class="glow"></div>
  <div class="box">
    <div class="field"><span class="txt"></span></div>
    <div class="bar">
      <div class="chips"><div class="chip">Photoreal</div><div class="chip">3 : 2</div><div class="chip">Seed 42</div></div>
      <div class="gen"><div class="border"></div><div class="inner">
        <div class="l la"><svg viewBox="0 0 24 24" fill="#111"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2z"/></svg><span>Generate</span></div>
        <div class="l lb"><div class="spin"></div><span>Generating</span></div>
        <div class="l ld"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg><span>Done</span></div>
      </div></div>
    </div>
    <div class="out"><div class="tile t1"><i></i></div><div class="tile t2"><i></i></div><div class="tile t3"><i></i></div></div>
  </div>
  <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l16 9-7 1.5L9 20z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/TextPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(TextPlugin);
  const tl = fx.timeline({ duration: 7 });
  const g = document.querySelector('.gen').getBoundingClientRect();
  const GX = g.left + g.width / 2 + 10, GY = g.top + g.height / 2 + 6;
  gsap.set('.cursor', { x: 1060, y: 660 });
  gsap.set('.lb, .ld', { yPercent: 110 });
  gsap.set('.tile', { opacity: 0, y: 30, scale: 0.9 });
  tl.from('.box', { y: 30, opacity: 0, duration: 0.6, ease: 'expo.out' }, 0)
    // the prompt types itself
    .to('.txt', { text: 'A lighthouse at dusk, soft film grain, wide shot', duration: 1.6, ease: 'none' }, 0.3)
    .to('.cursor', { x: GX, y: GY, duration: 0.8, ease: 'power3.inOut' }, 1.4)
    // press
    .to('.gen', { scale: 0.94, duration: 0.1, ease: 'power2.in' }, 2.3)
    .to('.gen', { scale: 1, duration: 0.5, ease: 'elastic.out(1,0.45)' }, 2.4)
    .to('.cursor', { scale: 0.85, duration: 0.08 }, 2.3).to('.cursor', { scale: 1, duration: 0.2 }, 2.4)
    // loading: label swap, rainbow border spins
    .to('.la', { yPercent: -110, duration: 0.35, ease: 'expo.out' }, 2.4)
    .to('.lb', { yPercent: 0, duration: 0.4, ease: 'expo.out' }, 2.4)
    .to('.border', { opacity: 1, duration: 0.3 }, 2.4)
    .to('.border', { rotation: 720, duration: 2.4, ease: 'none' }, 2.4)
    .to('.spin', { rotation: 1080, duration: 2.4, ease: 'none' }, 2.4)
    .to('.cursor', { x: GX + 120, y: GY + 60, duration: 0.6, ease: 'power2.inOut' }, 2.6)
    // completion
    .to('.lb', { yPercent: -110, duration: 0.35, ease: 'expo.out' }, 4.8)
    .to('.ld', { yPercent: 0, duration: 0.4, ease: 'expo.out' }, 4.8)
    .to('.border', { opacity: 0, duration: 0.3 }, 4.9)
    .to('.gen', { scale: 1.06, duration: 0.15 }, 4.8).to('.gen', { scale: 1, duration: 0.5, ease: 'elastic.out(1,0.4)' }, 4.95)
    .to('.tile', { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: 'back.out(1.8)', stagger: 0.1 }, 4.9)
    // out for loop
    .to('.box', { y: -30, opacity: 0, duration: 0.4, ease: 'power3.in' }, 6.5)
    .to('.cursor', { x: 1060, y: 660, duration: 0.5, ease: 'power2.in' }, 6.4);
</script>
