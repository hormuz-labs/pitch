<!doctype html><meta charset="utf-8">
<title>Magic Keyboard Specs [Apple Event]</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#000;color:#fff;perspective:1800px}
  .kb{position:absolute;left:190px;top:250px;width:900px;height:300px;border-radius:18px;background:linear-gradient(180deg,#e9e9ec,#c9c9ce);padding:20px;box-shadow:0 50px 100px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.7);transform-style:preserve-3d;will-change:transform}
  .keys{display:grid;grid-template-columns:repeat(15,1fr);gap:8px;height:100%}
  .key{border-radius:6px;background:#fafafa;box-shadow:0 2px 0 #b3b3b8;position:relative;will-change:transform,background-color}
  .key.w2{grid-column:span 2}.key.w6{grid-column:span 6}
  .key.tid{background:#111;box-shadow:0 2px 0 #000}
  .key.tid:after{content:"";position:absolute;inset:25%;border-radius:50%;border:2px solid #4d4d52}
  .spec{position:absolute;display:flex;flex-direction:column;gap:6px;will-change:transform,opacity}
  .spec b{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:34px;letter-spacing:-.03em;line-height:1}
  .spec small{font-size:16px;color:#a1a1a6}
  .spec .line{position:absolute;height:2px;background:#fff;transform-origin:left;opacity:.6}
  .s1{left:120px;top:90px}.s1 .line{left:0;top:78px;width:150px;transform:rotate(38deg)}
  .s2{left:520px;top:80px;align-items:center;text-align:center}.s2 .line{left:50%;top:78px;width:80px;transform:rotate(90deg);transform-origin:left}
  .s3{right:120px;top:90px;align-items:flex-end;text-align:right}.s3 .line{right:0;top:78px;width:150px;transform:rotate(-38deg);transform-origin:right}
  .s4{left:120px;top:590px}.s5{left:520px;top:590px;align-items:center;text-align:center}.s6{right:120px;top:590px;align-items:flex-end;text-align:right}
  .cap{position:absolute;left:60px;top:48px;font-size:14px;letter-spacing:.25em;text-transform:uppercase;color:#a1a1a6}
  .title{position:absolute;right:60px;top:44px;font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:22px;letter-spacing:-.02em;overflow:hidden}
  .title span{display:block}
</style>
<div class="stage">
  <div class="cap">Acme Input · Keynote</div>
  <div class="title"><span>Magic Keyboard</span></div>
  <div class="kb"><div class="keys" id="keys"></div></div>
  <div class="spec s1"><b>Touch ID</b><small>Unlock with a tap</small><i class="line"></i></div>
  <div class="spec s2"><b>1 mm travel</b><small>Scissor mechanism</small><i class="line"></i></div>
  <div class="spec s3"><b>USB‑C</b><small>Charge once a month</small><i class="line"></i></div>
  <div class="spec s4"><b>78 keys</b><small>Full-height function row</small></div>
  <div class="spec s5"><b>Backlit</b><small>Ambient light sensor</small></div>
  <div class="spec s6"><b>248 g</b><small>Recycled aluminium</small></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  // build the key grid: 4 rows of 15 columns
  const rows = [
    ['','','','','','','','','','','','','','','tid'],
    ['w2','','','','','','','','','','','','','',''],
    ['','','','','','','','','','','','','','w2'],
    ['','','w2','w6','w2','','','','']
  ];
  const K = document.getElementById('keys');
  rows.forEach(r => r.forEach(c => { const k = document.createElement('i'); k.className = 'key ' + c; K.appendChild(k); }));
  const keys = gsap.utils.toArray('.key');
  const tl = fx.timeline({ duration: 4 });
  gsap.set('.spec', { opacity: 0, y: 20 });
  gsap.set('.spec .line', { scaleX: 0 });
  gsap.set('.title span', { yPercent: 110 });
  // the keyboard tilts up from a flat, far view, keys popping into place
  tl.fromTo('.kb', { rotateX: 60, y: 200, scale: 0.8 }, { rotateX: 18, y: 0, scale: 1, duration: 1.2, ease: 'move' }, 0)
    .from(keys, { scale: 0, duration: 0.5, ease: 'back.out(2)', stagger: { each: 0.012, from: 'center', grid: 'auto' } }, 0.2)
    .to('.title span', { yPercent: 0, duration: 0.6, ease: 'expo.out' }, 0.3);
  // spec callouts fly in with their leader lines
  ['.s1', '.s2', '.s3', '.s4', '.s5', '.s6'].forEach((s, i) => {
    tl.to(s, { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out' }, 1.0 + i * 0.15)
      .to(`${s} .line`, { scaleX: 1, duration: 0.5, ease: 'expo.out' }, 1.0 + i * 0.15);
  });
  // backlight wave rolls across the keys twice
  tl.to(keys, { backgroundColor: '#ffffff', boxShadow: '0 2px 0 #b3b3b8, 0 0 14px rgba(255,255,255,.9)', duration: 0.25, yoyo: true, repeat: 1, stagger: { each: 0.02, from: 'start', grid: [4, 15], axis: 'x' } }, 1.6);
  tl.to(keys, { backgroundColor: '#ffffff', boxShadow: '0 2px 0 #b3b3b8, 0 0 14px rgba(255,255,255,.9)', duration: 0.25, yoyo: true, repeat: 1, stagger: { each: 0.02, from: 'end', grid: [4, 15], axis: 'x' } }, 2.4);
  // touch id pulses
  tl.fromTo('.key.tid', { boxShadow: '0 2px 0 #000, 0 0 0 rgba(255,255,255,0)' }, { boxShadow: '0 2px 0 #000, 0 0 18px rgba(255,255,255,.8)', duration: 0.4, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 1.1);
  // slow drift on the board the whole time
  tl.fromTo('.kb', { rotateY: -4 }, { rotateY: 4, duration: 4, ease: 'sine.inOut' }, 0);
  // exit
  tl.to('.spec', { opacity: 0, y: -20, duration: 0.3, ease: 'expo.in', stagger: 0.04 }, 3.3)
    .to('.kb', { rotateX: 70, y: 300, scale: 0.8, duration: 0.5, ease: 'expo.in' }, 3.5)
    .to('.title span', { yPercent: -110, duration: 0.3, ease: 'expo.in' }, 3.6);
</script>
