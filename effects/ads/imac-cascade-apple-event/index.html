<!doctype html><meta charset="utf-8">
<title>iMac Cascade [Apple Event]</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#000;color:#fff;perspective:2000px}
  .row{position:absolute;left:0;top:150px;width:1280px;height:420px;transform-style:preserve-3d}
  .imac{position:absolute;left:520px;top:0;width:240px;height:400px;will-change:transform;transform-style:preserve-3d}
  .disp{position:absolute;left:0;top:0;width:240px;height:190px;border-radius:12px 12px 4px 4px;padding:8px 8px 0;background:var(--c);box-shadow:0 30px 60px rgba(0,0,0,.6)}
  .scr{width:100%;height:150px;border-radius:6px 6px 0 0;background:linear-gradient(160deg,var(--h1),var(--h2));position:relative;overflow:hidden}
  .scr:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.25),transparent 40%)}
  .chin{position:absolute;left:0;top:190px;width:240px;height:36px;border-radius:0 0 8px 8px;background:var(--c);filter:brightness(.92)}
  .stand{position:absolute;left:90px;top:226px;width:60px;height:60px;background:var(--c);filter:brightness(.8);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%)}
  .foot{position:absolute;left:40px;top:284px;width:160px;height:10px;border-radius:5px;background:var(--c);filter:brightness(.7)}
  .txt{position:absolute;left:0;right:0;top:590px;text-align:center}
  .r{overflow:hidden}.r span{display:block;will-change:transform}
  .h1{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:56px;letter-spacing:-.03em}
  .sub{font-size:20px;color:#a1a1a6;margin-top:4px}
  .cap{position:absolute;left:60px;top:48px;font-size:14px;letter-spacing:.25em;text-transform:uppercase;color:#a1a1a6}
</style>
<div class="stage">
  <div class="cap">Acme Desktop · Keynote</div>
  <div class="row">
    <div class="imac" style="--c:#4f9dde;--h1:#9fd0ff;--h2:#2b6cb0"><div class="disp"><div class="scr"></div></div><div class="chin"></div><div class="stand"></div><div class="foot"></div></div>
    <div class="imac" style="--c:#5cc08a;--h1:#b9f2d0;--h2:#2f8f5c"><div class="disp"><div class="scr"></div></div><div class="chin"></div><div class="stand"></div><div class="foot"></div></div>
    <div class="imac" style="--c:#f2b134;--h1:#ffe6a3;--h2:#c98a12"><div class="disp"><div class="scr"></div></div><div class="chin"></div><div class="stand"></div><div class="foot"></div></div>
    <div class="imac" style="--c:#ec6a4b;--h1:#ffc4b3;--h2:#b6432a"><div class="disp"><div class="scr"></div></div><div class="chin"></div><div class="stand"></div><div class="foot"></div></div>
    <div class="imac" style="--c:#e05c8a;--h1:#ffc6dc;--h2:#a83a63"><div class="disp"><div class="scr"></div></div><div class="chin"></div><div class="stand"></div><div class="foot"></div></div>
    <div class="imac" style="--c:#8b6fe0;--h1:#d8ccff;--h2:#5a3fb0"><div class="disp"><div class="scr"></div></div><div class="chin"></div><div class="stand"></div><div class="foot"></div></div>
    <div class="imac" style="--c:#c8c8cc;--h1:#f4f4f6;--h2:#8e8e94"><div class="disp"><div class="scr"></div></div><div class="chin"></div><div class="stand"></div><div class="foot"></div></div>
  </div>
  <div class="txt"><div class="h1 r"><span>iMac. In seven colors.</span></div><div class="sub r"><span>Thinner than ever. Yours in any shade.</span></div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  const macs = gsap.utils.toArray('.imac'), N = macs.length;
  gsap.set('.r span', { yPercent: 110 });
  // all seven start stacked off to the right, angled; they cascade left one by one into a fanned row
  macs.forEach((m, i) => gsap.set(m, { x: 900, rotateY: -35, scale: 0.9, opacity: 0, zIndex: N - i }));
  macs.forEach((m, i) => {
    const target = (i - (N - 1) / 2) * 150;
    tl.to(m, { x: target, rotateY: -14, scale: 1, opacity: 1, duration: 1.0, ease: 'expo.out' }, 0.1 + i * 0.12);
  });
  // then the fan straightens to face the camera, all at once
  tl.to(macs, { rotateY: 0, duration: 0.8, ease: 'power3.inOut', stagger: 0.03 }, 1.5)
    .to('.h1 span', { yPercent: 0, duration: 0.7, ease: 'expo.out' }, 1.7)
    .to('.sub span', { yPercent: 0, duration: 0.7, ease: 'expo.out' }, 1.85);
  // a light sweeps across the screens, and the row drifts in parallax
  tl.fromTo('.row', { x: 30 }, { x: -30, duration: 4, ease: 'none' }, 0);
  tl.fromTo('.scr', { filter: 'brightness(1)' }, { filter: 'brightness(1.35)', duration: 0.35, yoyo: true, repeat: 1, stagger: 0.08, ease: 'sine.inOut' }, 2.3);
  // exit: cascade out to the left, in the same order
  macs.forEach((m, i) => tl.to(m, { x: -900, rotateY: 30, opacity: 0, duration: 0.5, ease: 'expo.in' }, 3.3 + i * 0.05));
  tl.to('.r span', { yPercent: -110, duration: 0.3, ease: 'expo.in', stagger: 0.05 }, 3.4);
</script>
