<!doctype html><meta charset="utf-8">
<title>Sliding Blocks [Apple Event]</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#000;color:#fff}
  .grid{position:absolute;left:140px;top:120px;width:1000px;height:480px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:16px}
  .blk{border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;will-change:transform,opacity;background:#1c1c1e}
  .blk.a{grid-column:span 2;background:linear-gradient(135deg,#1d1d1f,#2c2c2e)}
  .blk.b{background:#0a84ff}
  .blk.c{background:#1c1c1e}
  .blk.d{background:linear-gradient(135deg,#30d158,#0a84ff)}
  .blk.e{background:#1c1c1e}
  .blk.f{grid-column:span 2;background:linear-gradient(135deg,#bf5af2,#ff375f)}
  .blk b{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:52px;letter-spacing:-.04em;line-height:1;will-change:transform}
  .blk small{font-size:16px;color:rgba(255,255,255,.75);margin-top:8px}
  .blk .chip{position:absolute;right:28px;top:28px;width:72px;height:72px;border-radius:16px;background:#000;box-shadow:inset 0 0 0 2px #444;display:flex;align-items:center;justify-content:center;font-family:"Sharp Grotesk",sans-serif;font-size:22px}
  .blk .n{font-variant-numeric:tabular-nums}
  .cap{position:absolute;left:60px;top:48px;font-size:14px;letter-spacing:.25em;text-transform:uppercase;color:#a1a1a6}
  .title{position:absolute;left:140px;top:630px;font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:28px;letter-spacing:-.02em;overflow:hidden}
  .title span{display:block}
</style>
<div class="stage">
  <div class="cap">Acme Silicon · Keynote</div>
  <div class="grid">
    <div class="blk a"><div class="chip">A4</div><b>Acme A4 chip</b><small>Second-generation 3nm</small></div>
    <div class="blk b"><b><span class="n" data-to="3">0</span>×</b><small>faster CPU</small></div>
    <div class="blk c"><b><span class="n" data-to="18">0</span>h</b><small>battery life</small></div>
    <div class="blk d"><b><span class="n" data-to="40">0</span>%</b><small>more efficient</small></div>
    <div class="blk e"><b><span class="n" data-to="16">0</span>-core</b><small>neural engine</small></div>
    <div class="blk f"><b>Up to 128 GB</b><small>unified memory</small></div>
  </div>
  <div class="title"><span>Everything, in one slide.</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  const blocks = gsap.utils.toArray('.blk');
  // each block slides in from a different edge, keynote style
  const from = [{ x: -700 }, { y: -500 }, { y: -500 }, { x: 700 }, { x: -700 }, { y: 500 }];
  gsap.set('.title span', { yPercent: 110 });
  gsap.set('.blk b, .blk small', { opacity: 0, y: 16 });
  blocks.forEach((b, i) => {
    gsap.set(b, { ...from[i], opacity: 0 });
    tl.to(b, { x: 0, y: 0, opacity: 1, duration: 0.9, ease: 'move' }, 0.05 + i * 0.1)
      .to(b.querySelectorAll('b, small'), { opacity: 1, y: 0, duration: 0.5, ease: 'move', stagger: 0.06 }, 0.45 + i * 0.1);
  });
  // counters tick up as the blocks land
  document.querySelectorAll('.n').forEach((el, i) => {
    const o = { v: 0 }, to = +el.dataset.to;
    tl.to(o, { v: to, duration: 0.9, ease: 'power3.out', onUpdate: () => { el.textContent = Math.round(o.v); } }, 0.6 + i * 0.1);
  });
  tl.to('.title span', { yPercent: 0, duration: 0.6, ease: 'expo.out' }, 1.1);
  // the chip block gets a highlight sweep; blocks breathe slightly in sequence
  tl.fromTo('.blk.a', { backgroundPosition: '0% 50%' }, { backgroundPosition: '100% 50%', duration: 1.5, ease: 'sine.inOut' }, 1.4);
  tl.to(blocks, { scale: 1.02, duration: 0.35, yoyo: true, repeat: 1, ease: 'sine.inOut', stagger: 0.12 }, 1.8);
  // exit: slide back out the way they came, reverse order
  blocks.slice().reverse().forEach((b, i) => {
    const f = from[blocks.length - 1 - i];
    tl.to(b, { x: (f.x || 0), y: (f.y || 0), opacity: 0, duration: 0.45, ease: 'expo.in' }, 3.3 + i * 0.05);
  });
  tl.to('.title span', { yPercent: -110, duration: 0.3, ease: 'expo.in' }, 3.4);
</script>
