<!doctype html><meta charset="utf-8">
<title>Circular Loader</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#111216;display:grid;place-items:center}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:36px}
  .ld{width:180px;height:180px}
  .ld circle{fill:none;stroke-linecap:round;stroke-width:12}
  .ld .track{stroke:rgba(255,255,255,.08)}
  .ld .arc{stroke:#fff}
  .ld .arc2{stroke:#8b93ff;stroke-width:6}
  .txt{color:#8b90a3;font-size:18px;letter-spacing:.06em}
  .txt b{color:#fff;font-weight:500}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#8b90a3;margin-left:3px}
</style>
<div class="stage">
  <div class="wrap">
    <svg class="ld" viewBox="0 0 180 180">
      <circle class="track" cx="90" cy="90" r="76"/>
      <circle class="arc" cx="90" cy="90" r="76"/>
      <circle class="arc2" cx="90" cy="90" r="56"/>
    </svg>
    <div class="txt"><b>Loading</b> your workspace<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 4 });
  // classic material loader: the arc grows and shrinks (head/tail chase) while the whole ring rotates steadily
  tl.fromTo('.ld', { rotate: 0 }, { rotate: 720, duration: 4, ease: 'none', transformOrigin: '50% 50%' }, 0);
  const cycle = (at, d) => tl.fromTo('.arc', { drawSVG: '0% 8%' }, { drawSVG: '0% 80%', duration: d / 2, ease: 'power2.inOut' }, at)
    .to('.arc', { drawSVG: '92% 100%', duration: d / 2, ease: 'power2.inOut' }, at + d / 2);
  cycle(0, 2); cycle(2, 2);
  // the inner ring runs the opposite way, a short comet
  tl.fromTo('.arc2', { rotate: 0 }, { rotate: -360, duration: 4, ease: 'none', transformOrigin: '50% 50%' }, 0);
  const c2 = (at, d) => tl.fromTo('.arc2', { drawSVG: '0% 4%' }, { drawSVG: '0% 45%', duration: d / 2, ease: 'sine.inOut' }, at)
    .to('.arc2', { drawSVG: '96% 100%', duration: d / 2, ease: 'sine.inOut' }, at + d / 2);
  c2(0, 4 / 3); c2(4 / 3, 4 / 3); c2(8 / 3, 4 / 3);
  // dots march
  for (let k = 0; k < 4; k++) tl.fromTo('.dot', { y: 0, opacity: .4 }, { y: -6, opacity: 1, duration: .25, stagger: .12, yoyo: true, repeat: 1, ease: 'sine.inOut' }, k);
</script>
