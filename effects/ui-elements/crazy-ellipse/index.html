<!doctype html><meta charset="utf-8">
<title>Crazy Ellipse</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f5e9d6}
  canvas{position:absolute;inset:0;width:100%;height:100%}
</style>
<div class="stage"><canvas id="c" width="1280" height="720"></canvas></div>
<script src="../../_lib/fx.js"></script>
<script>
  // a ball bouncing around a box: simulated once, deterministically, then seeked
  const W = 1280, H = 720, DUR = 4, STEP = 1 / 240;
  const rng = fx.rng(7);
  const ctx = document.getElementById('c').getContext('2d');
  const balls = [
    { x: 300, y: 260, vx: 520, vy: -380, r: 90, color: '#ff5f3c' },
    { x: 900, y: 420, vx: -430, vy: 300, r: 60, color: '#1b1f3a' },
    { x: 640, y: 160, vx: 260, vy: 560, r: 40, color: '#5b6bff' },
  ];
  // precompute
  const frames = [];
  const st = balls.map(b => ({ ...b, sx: 1, sy: 1, hit: 0 }));
  for (let t = 0; t <= DUR + STEP; t += STEP) {
    for (const b of st) {
      b.x += b.vx * STEP; b.y += b.vy * STEP;
      if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx); b.hit = t; b.ax = 'x'; }
      if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); b.hit = t; b.ax = 'x'; }
      if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy); b.hit = t; b.ax = 'y'; }
      if (b.y + b.r > H) { b.y = H - b.r; b.vy = -Math.abs(b.vy); b.hit = t; b.ax = 'y'; }
      // slight unpredictable speed drift on each hit
      if (b.hit === t) { const k = .9 + rng() * .25; b.vx *= k; b.vy *= (2 - k); }
    }
    frames.push(st.map(b => ({ x: b.x, y: b.y, hit: b.hit, ax: b.ax, vx: b.vx, vy: b.vy })));
  }
  fx.register({ duration: DUR, seek(t) {
    const i = Math.min(frames.length - 1, Math.max(0, Math.round(t / STEP)));
    const f = frames[i];
    ctx.clearRect(0, 0, W, H);
    // trail: a few ghost frames behind each ball
    for (let g = 12; g > 0; g -= 3) {
      const j = Math.max(0, i - g * 2); const ff = frames[j];
      ff.forEach((b, k) => { ctx.globalAlpha = .12 * (1 - g / 14); ctx.fillStyle = balls[k].color; ctx.beginPath(); ctx.ellipse(b.x, b.y, balls[k].r, balls[k].r, 0, 0, Math.PI * 2); ctx.fill(); });
    }
    ctx.globalAlpha = 1;
    f.forEach((b, k) => {
      const r = balls[k].r;
      // squash on impact, decaying over .25s
      const dt = t - b.hit, q = dt < .3 ? Math.exp(-dt * 12) * Math.sin(dt * 40) * .35 : 0;
      const sx = b.ax === 'x' ? 1 - q : 1 + q, sy = b.ax === 'x' ? 1 + q : 1 - q;
      // stretch along velocity
      const sp = Math.hypot(b.vx, b.vy), ang = Math.atan2(b.vy, b.vx), st2 = 1 + sp / 4000;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(ang); ctx.scale(st2, 1 / st2); ctx.rotate(-ang); ctx.scale(sx, sy);
      ctx.fillStyle = balls[k].color; ctx.beginPath(); ctx.ellipse(0, 0, r, r, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  } });
</script>
