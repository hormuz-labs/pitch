<!doctype html><meta charset="utf-8">
<title>Animated App List</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f3f4f8;display:grid;place-items:center}
  .phone{position:relative;width:340px;height:640px;border-radius:44px;background:#0d0e12;padding:12px;box-shadow:0 40px 80px rgba(20,24,40,.25)}
  .screen{position:relative;width:100%;height:100%;border-radius:34px;background:#fff;overflow:hidden;padding:54px 18px 18px}
  .notch{position:absolute;left:50%;top:14px;width:96px;height:26px;border-radius:13px;background:#0d0e12;transform:translateX(-50%);z-index:3}
  .hdr{margin-bottom:16px;padding:0 4px}
  .hdr b{display:block;font-size:24px;font-weight:500;letter-spacing:-.02em;color:#111}
  .hdr span{display:block;font-size:13px;color:#8a8f9c;margin-top:2px}
  .list{display:flex;flex-direction:column;gap:10px}
  .app{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:#f5f6fa;will-change:transform}
  .ic{width:48px;height:48px;border-radius:13px;flex:none;display:grid;place-items:center}
  .ic i{display:block;width:20px;height:20px;border-radius:5px;background:#fff}
  .ic.a{background:#5b6bff}.ic.b{background:#ff6b8b}.ic.c{background:#2fd3a5}.ic.d{background:#ffb84d}.ic.e{background:#8a5cff}.ic.f{background:#25b7e6}
  .ic.b i{border-radius:50%}.ic.c i{width:22px;height:8px;border-radius:4px;box-shadow:0 12px 0 #fff}.ic.d i{transform:rotate(45deg)}.ic.e i{border-radius:50% 50% 0 50%}.ic.f i{clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0}
  .t{flex:1;min-width:0}
  .t b{display:block;font-size:15px;font-weight:500;color:#111}
  .t span{display:block;font-size:12px;color:#8a8f9c;margin-top:2px}
  .get{font-size:12px;font-weight:500;color:#5b6bff;background:#e9ebff;padding:7px 14px;border-radius:999px}
  .side{position:absolute;left:120px;top:50%;transform:translateY(-50%);width:360px}
  .side h1{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:56px;line-height:1;letter-spacing:-.03em;color:#111}
  .side p{margin-top:16px;font-size:18px;color:#6b7080;line-height:1.4}
  .blob{position:absolute;right:80px;top:60px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#dfe3ff,#f3f4f8 68%)}
</style>
<div class="stage">
  <div class="blob"></div>
  <div class="side"><h1>Every app,<br>one tap away.</h1><p>Curated collections from the Northwind store.</p></div>
  <div class="phone"><div class="notch"></div><div class="screen">
    <div class="hdr"><b>Featured apps</b><span>Handpicked this week</span></div>
    <div class="list">
      <div class="app"><div class="ic a"><i></i></div><div class="t"><b>Notewave</b><span>Productivity</span></div><div class="get">Get</div></div>
      <div class="app"><div class="ic b"><i></i></div><div class="t"><b>Pulse</b><span>Health &amp; Fitness</span></div><div class="get">Get</div></div>
      <div class="app"><div class="ic c"><i></i></div><div class="t"><b>Ledger</b><span>Finance</span></div><div class="get">Get</div></div>
      <div class="app"><div class="ic d"><i></i></div><div class="t"><b>Beacon</b><span>Navigation</span></div><div class="get">Get</div></div>
      <div class="app"><div class="ic e"><i></i></div><div class="t"><b>Drift</b><span>Music</span></div><div class="get">Get</div></div>
      <div class="app"><div class="ic f"><i></i></div><div class="t"><b>Summit</b><span>Travel</span></div><div class="get">Get</div></div>
    </div>
  </div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 3 });
  tl.fromTo('.blob', { scale: .9, x: -20 }, { scale: 1.05, x: 20, duration: 3, ease: 'sine.inOut' }, 0);
  tl.from('.side h1', { y: 30, opacity: 0, duration: .7, ease: 'expo.out' }, 0)
    .from('.side p', { y: 20, opacity: 0, duration: .6, ease: 'expo.out' }, .15);
  tl.from('.hdr > *', { y: 14, opacity: 0, duration: .5, stagger: .08, ease: 'power3.out' }, .1);
  // rows stagger in: slide up + fade, icon pops after
  tl.from('.app', { y: 40, opacity: 0, duration: .6, stagger: .14, ease: 'expo.out' }, .25)
    .from('.ic', { scale: .4, duration: .55, stagger: .14, ease: 'back.out(2.5)' }, .35)
    .from('.get', { scale: .6, opacity: 0, duration: .4, stagger: .14, ease: 'back.out(2)' }, .5);
  // exit: rows lift out in order
  tl.to('.app', { y: -24, opacity: 0, duration: .3, stagger: .05, ease: 'power2.in' }, 2.45)
    .to('.hdr > *', { y: -10, opacity: 0, duration: .3, ease: 'power2.in' }, 2.7)
    .to('.side > *', { y: -20, opacity: 0, duration: .3, stagger: .05, ease: 'power2.in' }, 2.65);
</script>
