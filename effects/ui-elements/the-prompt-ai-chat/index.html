<!doctype html><meta charset="utf-8">
<title>The Prompt: AI Chat</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b0b0f;display:flex;align-items:center;justify-content:center}
  .win{width:900px;height:600px;border-radius:26px;background:#141419;border:1px solid #26262e;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6)}
  .bar{height:52px;display:flex;align-items:center;gap:8px;padding:0 20px;border-bottom:1px solid #202028;color:#8d8d99;font-size:14px}
  .bar i{width:12px;height:12px;border-radius:50%;background:#3a3a44}
  .bar span{margin-left:12px}
  .thread{flex:1;padding:26px 30px;display:flex;flex-direction:column;justify-content:flex-end;gap:18px}
  .msg{display:flex;gap:14px;align-items:flex-start;max-width:78%}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;font-weight:500;color:#fff}
  .ai .av{background:linear-gradient(135deg,#7c3aed,#06b6d4)}
  .user .av{background:#2a2a33}
  .bub{padding:14px 18px;border-radius:18px;font-size:19px;line-height:1.45;color:#ececf3}
  .user .bub{background:#2b2b36;border-top-right-radius:6px}
  .ai .bub{background:transparent;padding-top:6px}
  .bub .w{display:inline-block;white-space:pre}
  .dots{display:inline-flex;gap:6px;align-items:center;height:26px}
  .dots i{width:8px;height:8px;border-radius:50%;background:#8d8d99}
  .compose{margin:0 24px 22px;height:58px;border-radius:16px;background:#1c1c23;border:1px solid #2a2a33;display:flex;align-items:center;padding:0 10px 0 18px;gap:10px}
  .compose .txt{flex:1;font-size:18px;color:#ececf3;white-space:nowrap;overflow:hidden}
  .compose .ph{color:#66667a}
  .caret{display:inline-block;width:2px;height:22px;background:#ececf3;vertical-align:-4px;margin-left:2px}
  .send{width:40px;height:40px;border-radius:12px;background:#7c3aed;display:grid;place-items:center;flex:none}
  .send svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
</style>
<div class="stage">
  <div class="win">
    <div class="bar"><i></i><i></i><i></i><span>Northwind Assistant</span></div>
    <div class="thread">
      <div class="msg user" id="u1"><div class="av">S</div><div class="bub">Draft a launch tweet for our new planner feature.</div></div>
      <div class="msg ai" id="a1"><div class="av">N</div><div class="bub"><span class="dots"><i></i><i></i><i></i></span><span class="words"></span></div></div>
      <div class="msg user" id="u2"><div class="av">S</div><div class="bub">Shorter and more playful.</div></div>
      <div class="msg ai" id="a2"><div class="av">N</div><div class="bub"><span class="dots"><i></i><i></i><i></i></span><span class="words"></span></div></div>
    </div>
    <div class="compose"><div class="txt"><span class="ph">Message Northwind…</span><span class="typed"></span><span class="caret"></span></div><div class="send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/TextPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(TextPlugin);
  const D = 10;
  const tl = fx.timeline({ duration: D });
  const R1 = "Plan less, do more. Our new Planner turns your week into a single, calm view — drag, drop, done. Rolling out today to every workspace.";
  const R2 = "Your week, finally in one tidy place. Say hi to Planner ✨";
  const fill = (id, text) => {
    const w = document.querySelector(id + ' .words');
    w.innerHTML = text.split(' ').map(s => `<span class="w">${s} </span>`).join('');
    return w.querySelectorAll('.w');
  };
  const w1 = fill('#a1', R1), w2 = fill('#a2', R2);
  gsap.set('.msg', { opacity: 0, y: 18 });
  gsap.set([w1, w2], { opacity: 0, y: 6 });
  gsap.set('#a1 .dots, #a2 .dots', { display: 'inline-flex' });
  const caret = tl.to('.caret', { opacity: 0, duration: .4, repeat: -1, yoyo: true, ease: 'steps(1)' }, 0);

  // exchange 1: type, send, think, stream
  tl.to('.ph', { opacity: 0, duration: .2 }, 0.3)
    .to('.typed', { text: 'Draft a launch tweet for our new planner feature.', duration: 1.4, ease: 'none' }, 0.4)
    .to('.send', { scale: .85, duration: .1, yoyo: true, repeat: 1 }, 1.9)
    .to('.typed', { text: '', duration: .01 }, 2.0).to('.ph', { opacity: 1, duration: .3 }, 2.05)
    .to('#u1', { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 2.0)
    .to('#a1', { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 2.4)
    .to('#a1 .dots i', { y: -5, duration: .25, stagger: .1, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 2.5)
    .set('#a1 .dots', { display: 'none' }, 3.5)
    .to(w1, { opacity: 1, y: 0, duration: .25, stagger: .055, ease: 'power2.out' }, 3.5)
    // exchange 2
    .to('.ph', { opacity: 0, duration: .2 }, 5.4)
    .to('.typed', { text: 'Shorter and more playful.', duration: .8, ease: 'none' }, 5.5)
    .to('.send', { scale: .85, duration: .1, yoyo: true, repeat: 1 }, 6.4)
    .to('.typed', { text: '', duration: .01 }, 6.5).to('.ph', { opacity: 1, duration: .3 }, 6.55)
    .to('#u2', { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 6.5)
    .to('#a2', { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 6.9)
    .to('#a2 .dots i', { y: -5, duration: .25, stagger: .1, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 7.0)
    .set('#a2 .dots', { display: 'none' }, 7.9)
    .to(w2, { opacity: 1, y: 0, duration: .25, stagger: .07, ease: 'power2.out' }, 7.9)
    // clear for the loop
    .to('.msg', { opacity: 0, y: -16, duration: .35, stagger: .06, ease: 'power2.in' }, 9.4)
    .set('.msg', { y: 18 }, 9.99)
    .set([w1, w2], { opacity: 0, y: 6 }, 9.99)
    .set('#a1 .dots, #a2 .dots', { display: 'inline-flex' }, 9.99);
</script>
