<!doctype html><meta charset="utf-8">
<title>Interactive Components</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#fafafa;color:#111}
  .board{position:absolute;inset:0;padding:60px 90px;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:28px;align-content:center}
  .cell{position:relative;display:flex;flex-direction:column;gap:10px}
  .lab{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9a9fae}
  .states{display:flex;flex-direction:column;gap:14px}
  /* buttons: default / hover / pressed / loading */
  .b{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:14px;background:#111;color:#fff;font-size:17px;font-weight:500;position:relative;overflow:hidden}
  .b.o{background:#fff;color:#111;border:2px solid #e2e4ea}
  .b .spn{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;display:none}
  .b .lbl2{position:absolute;inset:0;display:grid;place-items:center;opacity:0}
  /* input */
  .inp{position:relative;height:56px;border-radius:14px;border:2px solid #e2e4ea;background:#fff;padding:0 16px;display:flex;align-items:center;font-size:17px}
  .inp .fl{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#9a9fae;transform-origin:0 50%;background:#fff;padding:0 4px}
  .inp .ty{color:#111}
  .inp .cr{width:2px;height:24px;background:#5b6bff;margin-left:1px;opacity:0}
  .inp .ok{position:absolute;right:14px;width:24px;height:24px;border-radius:50%;background:#2fd3a5;display:grid;place-items:center;transform:scale(0)}
  .inp .ok svg{width:14px;height:14px}.inp .ok path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .hint{font-size:13px;color:#9a9fae}
  /* card with like */
  .card{border-radius:20px;background:#fff;border:1px solid #ececf1;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
  .card .img{height:120px;border-radius:14px;background:linear-gradient(135deg,#5b6bff,#ff6b8b)}
  .card .cb{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
  .card b{font-size:16px;font-weight:500}.card span{display:block;font-size:13px;color:#9a9fae;margin-top:2px}
  .heart{width:40px;height:40px;border-radius:50%;background:#f3f4f8;display:grid;place-items:center}
  .heart svg{width:20px;height:20px}.heart path{fill:none;stroke:#111;stroke-width:2.2;stroke-linejoin:round}
  /* dropdown */
  .dd{position:relative}
  .dd .head{height:54px;border-radius:14px;border:2px solid #e2e4ea;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:17px}
  .dd .chev{width:18px;height:18px}.dd .chev path{fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .dd .menu{position:absolute;left:0;right:0;top:62px;border-radius:14px;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.12);padding:8px;z-index:5;transform-origin:50% 0}
  .dd .it{padding:11px 12px;border-radius:9px;font-size:15px}
  .dd .it.h{background:#f3f4f8}
  /* tabs */
  .tabs{display:flex;gap:26px;border-bottom:2px solid #ececf1;position:relative;padding-bottom:12px}
  .tabs span{font-size:16px;color:#9a9fae;font-weight:500}
  .tabs .ul{position:absolute;bottom:-2px;left:0;height:2px;width:56px;background:#111}
  /* chips */
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:8px 14px;border-radius:999px;border:1.5px solid #e2e4ea;font-size:14px;background:#fff}
  .cur{position:absolute;width:24px;height:24px;left:0;top:0;z-index:20}
  .cur path{fill:#111;stroke:#fff;stroke-width:1.5}
</style>
<div class="stage">
  <div class="board">
    <div class="cell"><div class="lab">Buttons</div><div class="states">
      <div class="b b1">Continue</div>
      <div class="b o b2">Secondary</div>
      <div class="b b3"><span class="t">Submit</span><span class="spn"></span><span class="lbl2">Done ✓</span></div>
    </div></div>
    <div class="cell"><div class="lab">Input</div>
      <div class="inp"><span class="fl">Email address</span><span class="ty"></span><span class="cr"></span><div class="ok"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.5 3.5L13 5"/></svg></div></div>
      <div class="hint">We'll never share your email.</div>
      <div class="lab" style="margin-top:14px">Tabs</div>
      <div class="tabs"><div class="ul"></div><span>Overview</span><span>Activity</span><span>Settings</span></div>
      <div class="lab" style="margin-top:14px">Chips</div>
      <div class="chips"><div class="chip">Design</div><div class="chip">Motion</div><div class="chip">Code</div><div class="chip">Research</div></div>
    </div>
    <div class="cell"><div class="lab">Card &amp; dropdown</div>
      <div class="card"><div class="img"></div><div class="cb"><div><b>Morning hills</b><span>by Northwind</span></div><div class="heart"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg></div></div></div>
      <div class="dd"><div class="head"><span class="sel">Select plan</span><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
        <div class="menu"><div class="it">Starter</div><div class="it">Pro</div><div class="it">Enterprise</div></div></div>
    </div>
  </div>
  <svg class="cur" viewBox="0 0 24 24"><path d="M4 2l16 10-7 1.5L9 21z"/></svg>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/TextPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(TextPlugin);
  const tl = fx.timeline({ duration: 6 });
  gsap.set('.menu', { opacity: 0, scaleY: .8 });
  gsap.set('.cur', { x: 120, y: 660 });
  tl.from('.cell', { y: 30, opacity: 0, duration: .7, stagger: .1, ease: 'expo.out' }, 0);
  // button 1: hover lift, press
  tl.to('.cur', { x: 300, y: 260, duration: .5, ease: 'power3.inOut' }, .5)
    .to('.b1', { y: -3, boxShadow: '0 10px 24px rgba(0,0,0,.25)', duration: .25 }, .9)
    .to('.b1', { scale: .96, duration: .1 }, 1.2).to('.b1', { scale: 1, y: 0, boxShadow: '0 0 0 rgba(0,0,0,0)', duration: .45, ease: 'elastic.out(1,.5)' }, 1.3);
  // button 3: click -> loading -> done
  tl.to('.cur', { x: 300, y: 400, duration: .4, ease: 'power3.inOut' }, 1.5)
    .to('.b3', { scale: .96, duration: .1 }, 1.9).to('.b3', { scale: 1, duration: .3 }, 2.0)
    .to('.b3 .t', { opacity: 0, duration: .15 }, 1.95).set('.b3 .spn', { display: 'block' }, 2.05)
    .fromTo('.b3 .spn', { rotate: 0 }, { rotate: 1080, duration: 1.3, ease: 'none' }, 2.05)
    .set('.b3 .spn', { display: 'none' }, 3.35).to('.b3', { backgroundColor: '#2fd3a5', duration: .3 }, 3.35)
    .fromTo('.b3 .lbl2', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .35, ease: 'back.out(2)' }, 3.4);
  // input: focus, label floats, type, check
  tl.to('.cur', { x: 640, y: 236, duration: .45, ease: 'power3.inOut' }, 2.1)
    .to('.inp', { borderColor: '#5b6bff', boxShadow: '0 0 0 4px rgba(91,107,255,.18)', duration: .25 }, 2.5)
    .to('.fl', { y: -38, scale: .78, color: '#5b6bff', duration: .35, ease: 'back.out(1.6)' }, 2.5)
    .to('.cr', { opacity: 1, duration: .05 }, 2.6).to('.cr', { opacity: 0, duration: .05, repeat: 7, yoyo: true, repeatDelay: .25 }, 2.7)
    .to('.ty', { text: 'ana@northwind.co', duration: .9, ease: 'none' }, 2.75)
    .to('.ok', { scale: 1, duration: .4, ease: 'back.out(2.5)' }, 3.75)
    .to('.inp', { borderColor: '#2fd3a5', boxShadow: '0 0 0 0 rgba(0,0,0,0)', duration: .3 }, 3.8).to('.fl', { color: '#2fd3a5', duration: .3 }, 3.8);
  // tabs: underline slides
  tl.to('.ul', { x: 110, width: 62, duration: .45, ease: 'power3.inOut' }, 3.2).to('.tabs span:nth-of-type(1)', { color: '#9a9fae', duration: .2 }, 3.2).to('.tabs span:nth-of-type(2)', { color: '#111', duration: .2 }, 3.25)
    .to('.ul', { x: 200, width: 66, duration: .45, ease: 'power3.inOut' }, 4.6).to('.tabs span:nth-of-type(2)', { color: '#9a9fae', duration: .2 }, 4.6).to('.tabs span:nth-of-type(3)', { color: '#111', duration: .2 }, 4.65);
  gsap.set('.tabs span:nth-of-type(1)', { color: '#111' });
  // chips select in sequence
  tl.to('.chip', { backgroundColor: '#111', color: '#fff', borderColor: '#111', duration: .25, stagger: .3 }, 3.6)
    .to('.chip', { scale: 1.08, duration: .15, stagger: .3, yoyo: true, repeat: 1 }, 3.6);
  // heart: press, fill, pop
  tl.to('.cur', { x: 1120, y: 322, duration: .5, ease: 'power3.inOut' }, 4.0)
    .to('.heart', { scale: .8, duration: .1 }, 4.5).to('.heart', { scale: 1, duration: .5, ease: 'elastic.out(1,.4)' }, 4.6)
    .to('.heart path', { fill: '#ff3d5a', stroke: '#ff3d5a', duration: .2 }, 4.55).to('.heart', { backgroundColor: '#ffe3e8', duration: .2 }, 4.55);
  // dropdown: open, hover, select
  tl.to('.cur', { x: 1100, y: 460, duration: .4, ease: 'power3.inOut' }, 4.7)
    .to('.chev', { rotate: 180, duration: .3 }, 5.05).to('.dd .head', { borderColor: '#111', duration: .2 }, 5.05)
    .to('.menu', { opacity: 1, scaleY: 1, duration: .35, ease: 'back.out(1.8)' }, 5.05)
    .to('.it:nth-child(2)', { backgroundColor: '#f3f4f8', duration: .2 }, 5.3)
    .to('.sel', { text: 'Pro', duration: 0 }, 5.6).to('.menu', { opacity: 0, scaleY: .8, duration: .2 }, 5.6).to('.chev', { rotate: 0, duration: .25 }, 5.6);
  tl.to('.board', { opacity: 0, duration: .25 }, 5.78).to('.cur', { opacity: 0, duration: .2 }, 5.78);
</script>
