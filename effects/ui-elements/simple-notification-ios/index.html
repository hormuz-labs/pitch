<!doctype html><meta charset="utf-8">
<title>Simple Notification [iOS]</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0e0f14;display:flex;align-items:center;justify-content:center;perspective:1600px}
  .glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,#2b3a8a 0%,rgba(14,15,20,0) 60%);left:50%;top:50%;transform:translate(-50%,-50%);opacity:.8}
  .phone{position:relative;width:340px;height:700px;border-radius:56px;background:#1b1c22;padding:12px;box-shadow:0 40px 100px rgba(0,0,0,.6),inset 0 0 0 2px #3a3b44;transform-style:preserve-3d}
  .screen{width:100%;height:100%;border-radius:46px;overflow:hidden;position:relative;background:url("../../../assets/backgrounds/ocean.png") center/cover}
  .island{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:100px;height:28px;border-radius:20px;background:#000;z-index:5}
  .st{position:absolute;top:16px;left:26px;right:26px;display:flex;justify-content:space-between;color:#fff;font-size:14px;font-weight:500;z-index:4}
  .grid{position:absolute;top:80px;left:22px;right:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
  .app{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:#fff}
  .app i{width:56px;height:56px;border-radius:15px;display:block}
  .dock{position:absolute;bottom:14px;left:16px;right:16px;height:82px;border-radius:30px;background:rgba(255,255,255,.22);backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center}
  .dock i{width:56px;height:56px;border-radius:15px;display:block}
  .banner{position:absolute;left:12px;right:12px;top:12px;height:84px;border-radius:26px;background:rgba(250,250,252,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 12px 40px rgba(0,0,0,.25);z-index:6;color:#111;transform-origin:top center}
  .banner .ic{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#34d399,#059669);display:grid;place-items:center;color:#fff;font-weight:500;font-size:22px;flex:none}
  .banner .t{flex:1;min-width:0}
  .banner .h{display:flex;justify-content:space-between;font-size:13px}
  .banner .h b{font-weight:500}.banner .h span{color:#6b6b72;font-size:12px}
  .banner .m{font-size:13px;line-height:1.25;color:#222;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
<div class="stage">
  <div class="glow"></div>
  <div class="phone">
    <div class="screen">
      <div class="island"></div>
      <div class="st"><span>9:41</span><span>●●● ▮</span></div>
      <div class="grid">
        <div class="app"><i style="background:#3b82f6"></i>Mail</div><div class="app"><i style="background:#f59e0b"></i>Notes</div>
        <div class="app"><i style="background:#ef4444"></i>Music</div><div class="app"><i style="background:#8b5cf6"></i>Photos</div>
        <div class="app"><i style="background:#10b981"></i>Maps</div><div class="app"><i style="background:#ec4899"></i>Health</div>
        <div class="app"><i style="background:#14b8a6"></i>Wallet</div><div class="app"><i style="background:#64748b"></i>Settings</div>
        <div class="app"><i style="background:#0ea5e9"></i>Weather</div><div class="app"><i style="background:#f97316"></i>Clock</div>
        <div class="app"><i style="background:#22c55e"></i>Fitness</div><div class="app"><i style="background:#a855f7"></i>Acme</div>
      </div>
      <div class="dock"><i style="background:#22c55e"></i><i style="background:#3b82f6"></i><i style="background:#0ea5e9"></i><i style="background:#f43f5e"></i></div>
      <div class="banner">
        <div class="ic">A</div>
        <div class="t"><div class="h"><b>Acme</b><span>now</span></div><div class="m">Your table for two is confirmed at 7:30 pm</div></div>
      </div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 3;
  const tl = fx.timeline({ duration: D });
  gsap.set('.banner', { y: -130, scale: .92, opacity: 0 });
  tl.fromTo('.phone', { rotationY: -14, rotationX: 4 }, { rotationY: 10, rotationX: -3, duration: D, ease: 'sine.inOut' }, 0)
    // the system spring: drops in, slight overshoot, settles
    .to('.banner', { y: 0, scale: 1, opacity: 1, duration: .75, ease: 'elastic.out(1,.7)' }, 0.3)
    .to('.island', { scaleX: 1.2, scaleY: 1.1, duration: .18, yoyo: true, repeat: 1, ease: 'power2.inOut' }, 0.25)
    .to('.grid, .dock', { filter: 'brightness(.85)', duration: .4 }, 0.3)
    .to('.grid, .dock', { filter: 'brightness(1)', duration: .4 }, 2.3)
    // retracts up as iOS does, quick and clean
    .to('.banner', { y: -130, scale: .94, opacity: 0, duration: .4, ease: 'power3.in' }, 2.3);
</script>
