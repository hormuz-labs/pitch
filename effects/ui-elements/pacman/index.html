<!doctype html><meta charset="utf-8">
<title>Pacman</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#000}
  canvas{position:absolute;inset:0;width:100%;height:100%}
</style>
<div class="stage"><canvas id="c" width="1280" height="720"></canvas></div>
<script src="../../_lib/fx.js"></script>
<script>
  const W = 1280, H = 720, DUR = 4, ctx = document.getElementById('c').getContext('2d');
  const Y = 360, R = 52, DOTS = 14, GAP = 96, X0 = 220;
  const speed = (DOTS * GAP + 400) / DUR; // px/s; pacman crosses the whole row per loop
  const ghosts = [ { c: '#ff0000', d: 200 }, { c: '#ffb8ff', d: 300 }, { c: '#00ffff', d: 400 } ];
  function ghost(x, y, col, t) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y - 6, 40, Math.PI, 0); ctx.lineTo(x + 40, y + 30);
    const wob = Math.floor(t * 8) % 2; for (let i = 0; i < 4; i++) { const bx = x + 40 - i * 20; ctx.lineTo(bx - 10, y + 30 - (wob ? 14 : 4) * ((i % 2) ? 1 : 0)); ctx.lineTo(bx - 20, y + 30); } ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(x - 14, y - 8, 10, 12, 0, 0, 7); ctx.ellipse(x + 14, y - 8, 10, 12, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#2121de'; ctx.beginPath(); ctx.arc(x - 18, y - 8, 5, 0, 7); ctx.arc(x + 10, y - 8, 5, 0, 7); ctx.fill();
  }
  fx.register({ duration: DUR, seek(t) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    // maze walls: two blue rails
    ctx.strokeStyle = '#2121de'; ctx.lineWidth = 6; ctx.lineJoin = 'round';
    [Y - 120, Y + 120].forEach(y => { ctx.beginPath(); ctx.roundRect(60, y - 10, W - 120, 20, 10); ctx.stroke(); });
    ctx.beginPath(); ctx.roundRect(28, 28, W - 56, H - 56, 30); ctx.stroke();
    const px = -100 + speed * t;
    // dots: gone once pacman's mouth passes them
    for (let i = 0; i < DOTS; i++) { const dx = X0 + i * GAP; if (dx > px - 8) { if (i === DOTS - 1) { ctx.fillStyle = Math.floor(t * 6) % 2 ? '#ffb897' : '#000'; ctx.beginPath(); ctx.arc(dx, Y, 18, 0, 7); ctx.fill(); } else { ctx.fillStyle = '#ffb897'; ctx.fillRect(dx - 7, Y - 7, 14, 14); } } }
    // pacman: mouth chomps at 6Hz
    const m = (0.5 - 0.5 * Math.cos(t * Math.PI * 12)) * 0.55 + 0.05;
    ctx.fillStyle = '#ffe600'; ctx.beginPath(); ctx.moveTo(px, Y); ctx.arc(px, Y, R, m, Math.PI * 2 - m); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(px + 8, Y - 26, 6, 0, 7); ctx.fill();
    // ghosts trail, bobbing
    ghosts.forEach((g, i) => ghost(px - g.d, Y + Math.sin(t * 6 + i) * 6, g.c, t));
    // score
    ctx.fillStyle = '#fff'; ctx.font = '500 26px "Atlas Grotesk", monospace'; ctx.textAlign = 'left';
    const eaten = Math.max(0, Math.min(DOTS, Math.floor((px - X0 + 8) / GAP) + 1));
    ctx.fillText('SCORE  ' + String(eaten * 10).padStart(4, '0'), 70, 72);
    ctx.textAlign = 'right'; ctx.fillText('1UP', W - 70, 72);
  } });
</script>
