<!doctype html><meta charset="utf-8">
<title>The Vault: App Icons</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0d0e13;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;perspective:1200px}
  .glow{position:absolute;left:50%;top:50%;width:1000px;height:600px;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(80,90,200,.28),rgba(0,0,0,0) 65%)}
  .head{text-align:center;color:#fff;position:relative}
  .head .k{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#8b90a8}
  .head h1{font-size:44px;font-weight:500;letter-spacing:-.03em;margin-top:8px;overflow:hidden;line-height:1.15}
  .head h1 span{display:block}
  .grid{display:grid;grid-template-columns:repeat(6,120px);gap:28px 34px;position:relative;transform-style:preserve-3d}
  .app{display:flex;flex-direction:column;align-items:center;gap:10px;transform-style:preserve-3d}
  .ico{width:96px;height:96px;border-radius:26px;display:grid;place-items:center;box-shadow:0 14px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35);position:relative;overflow:hidden}
  .ico svg{width:46px;height:46px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .ico .sh{position:absolute;inset:0;border-radius:26px;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);opacity:0}
  .app b{font-size:14px;font-weight:400;color:#c9cbd6}
</style>
<div class="stage">
  <div class="glow"></div>
  <div class="head"><div class="k">The Acme family</div><h1><span>Twelve apps. One account.</span></h1></div>
  <div class="grid">
    <div class="app"><div class="ico" style="background:linear-gradient(145deg,#60a5fa,#1d4ed8)"><div class="sh"></div><svg viewBox="0 0 24 24"><path d="M4 7l8 6 8-6M4 7h16v10H4z"/></svg></div><b>Mail</b></div>
    <div class="app"><div class="ico" style="background:linear-gradient(145deg,#fbbf24,#d97706)"><div class="sh"></div><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 9h6M9 13h6"/></svg></div><b>Notes</b></div>
    <div class="app"><div class="ico" style="background:linear-gradient(145deg,#f87171,#b91c1c)"><div class="sh"></div><svg viewBox="0 0 24 24"><circle cx="8" cy="17" r="3"/><circle cx="17" cy="15" r="3"/><path d="M11 17V6l9-2v11"/></svg></div><b>Music</b></div>
    <div class="app"><div class="ico" style="background:linear-gradient(145deg,#c084fc,#7e22ce)"><div class="sh"></div><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 16l5-5 4 4 3-3 4 4"/></svg></div><b>Photos</b></div>
    <div class="app"><div class="ico" style="background:linear-gradient(145deg,#34d399,#047857)"><div class="sh"></div><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg></div><b>Maps</b></div>
    <div class="app"><div class="ico" style="background:linear-gradient(145deg,#f472b6,#be185d)"><div class="sh"></div><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg></div><b>Health</b></div>
    <div class="app"><div class="ico" style="background:linear-gradient(145deg,#2dd4bf,#0f766e)"><div class="sh"></div><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg></div><b>Wallet</b></div>
    <div class="app"><div class="ico" style="background:linear-gradient(145deg,#94a3b8,#475569)"><div class="sh"></div><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2 2M16.4 16.4l2 2M5.6 18.4l2-2M16.4 7.6l2-2"/></svg></div><b>Settings</b></div>
    <div class="app"><div class="ico" style="background:linear-gradient(145deg,#38bdf8,#0369a1)"><div class="sh"></div><svg viewBox="0 0 24 24"><path d="M7 17h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1A3.5 3.5 0 0 0 7 17z"/></svg></div><b>Weather</b></div>
    <div class="app"><div class="ico" style="background:linear-gradient(145deg,#fb923c,#c2410c)"><div class="sh"></div><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></div><b>Clock</b></div>
    <div class="app"><div class="ico" style="background:linear-gradient(145deg,#4ade80,#15803d)"><div class="sh"></div><svg viewBox="0 0 24 24"><path d="M4 12h3l2-5 4 10 2-5h5"/></svg></div><b>Fitness</b></div>
    <div class="app"><div class="ico" style="background:linear-gradient(145deg,#a78bfa,#5b21b6)"><div class="sh"></div><svg viewBox="0 0 24 24"><path d="M12 3l9 6-9 6-9-6z"/><path d="M3 15l9 6 9-6"/></svg></div><b>Acme</b></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 10;
  const tl = fx.timeline({ duration: D });
  const apps = document.querySelectorAll('.app');
  const gridStagger = (each, from) => ({ each, grid: [2, 6], from, ease: 'power2.out' });
  tl.from('.head h1 span', { yPercent: 110, duration: .8, ease: 'expo.out' }, 0.1)
    .from('.head .k', { opacity: 0, y: 10, duration: .5 }, 0)
    // icons pop in from the centre outward
    .from('.ico', { scale: 0, rotationY: -90, duration: .8, stagger: gridStagger(.09, 'center'), ease: 'back.out(1.8)' }, 0.4)
    .from('.app b', { opacity: 0, y: 8, duration: .5, stagger: gridStagger(.09, 'center') }, 0.7)
    // a light sweep across the family, left to right
    .fromTo('.ico .sh', { opacity: 1, xPercent: -110 }, { xPercent: 110, duration: .7, stagger: gridStagger(.06, 'start'), ease: 'power1.inOut' }, 2.8)
    .to('.ico .sh', { opacity: 0, duration: .01 }, 4.4)
    // a wave of lifts, row by row
    .to('.ico', { y: -14, rotationX: 12, duration: .35, stagger: gridStagger(.05, 'edges'), ease: 'power2.out' }, 4.6)
    .to('.ico', { y: 0, rotationX: 0, duration: .7, stagger: gridStagger(.05, 'edges'), ease: 'elastic.out(1,.5)' }, 4.95)
    // the hero app steps forward while the rest recede
    .to(apps[11].querySelector('.ico'), { scale: 1.35, z: 60, duration: .7, ease: 'back.out(2)' }, 6.5)
    .to([...apps].slice(0, 11).map(a => a.querySelector('.ico')), { opacity: .35, scale: .92, duration: .6, ease: 'power2.out' }, 6.5)
    .to([...apps].slice(0, 11).map(a => a.querySelector('b')), { opacity: .35, duration: .6 }, 6.5)
    .to(apps[11].querySelector('.ico'), { scale: 1, z: 0, duration: .6, ease: 'power3.inOut' }, 8.2)
    .to([...apps].slice(0, 11).map(a => a.querySelector('.ico')), { opacity: 1, scale: 1, duration: .6, ease: 'power2.out' }, 8.2)
    .to([...apps].slice(0, 11).map(a => a.querySelector('b')), { opacity: 1, duration: .6 }, 8.2)
    // out: reverse grid pop
    .to('.ico', { scale: 0, rotationY: 90, duration: .45, stagger: gridStagger(.05, 'edges'), ease: 'back.in(1.6)' }, 9.0)
    .to('.app b', { opacity: 0, duration: .3, stagger: gridStagger(.05, 'edges') }, 9.0)
    .to('.head h1 span', { yPercent: -110, duration: .4, ease: 'power3.in' }, 9.5)
    .to('.head .k', { opacity: 0, duration: .3 }, 9.6);
</script>
