<!doctype html><meta charset="utf-8">
<title>Push Notifications: List [iOS]</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#000}
  .wall{position:absolute;inset:0;background:url("../../../assets/backgrounds/aurora.png") center/cover;transform:scale(1.1)}
  .dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35))}
  .status{position:absolute;top:36px;left:0;right:0;display:flex;justify-content:space-between;padding:0 80px;color:#fff;font-size:30px;font-weight:500}
  .island{position:absolute;left:50%;top:32px;transform:translateX(-50%);width:250px;height:64px;border-radius:40px;background:#000}
  .lock{position:absolute;top:150px;left:0;right:0;text-align:center;color:#fff}
  .lock .date{font-size:36px;font-weight:500;opacity:.9}
  .lock .time{font-size:200px;font-weight:500;letter-spacing:-.05em;line-height:1;margin-top:4px}
  .list{position:absolute;left:60px;right:60px;top:640px}
  .note{position:absolute;left:0;right:0;top:0;height:176px;border-radius:44px;background:rgba(255,255,255,.72);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);display:flex;align-items:center;gap:24px;padding:0 34px;color:#111;box-shadow:0 10px 40px rgba(0,0,0,.12);will-change:transform}
  .icon{width:92px;height:92px;border-radius:24px;flex:none;display:grid;place-items:center;color:#fff;font-weight:500;font-size:42px}
  .body{flex:1;min-width:0}
  .head{display:flex;justify-content:space-between;align-items:baseline}
  .head b{font-weight:500;font-size:31px}
  .head span{font-size:24px;color:#4b4b52}
  .msg{font-size:29px;line-height:1.25;color:#1c1c22;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
  .bottom{position:absolute;bottom:90px;left:0;right:0;display:flex;justify-content:space-between;padding:0 120px}
  .bottom i{width:110px;height:110px;border-radius:50%;background:rgba(0,0,0,.45);display:block}
  .bar{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:280px;height:10px;border-radius:5px;background:#fff;opacity:.9}
</style>
<div class="stage">
  <div class="wall"></div><div class="dim"></div>
  <div class="status"><span>9:41</span><span>●●●  ▲  ▮▮▮</span></div>
  <div class="island"></div>
  <div class="lock"><div class="date">Tuesday, June 4</div><div class="time">9:41</div></div>
  <div class="list">
    <div class="note" data-t="0.25"><div class="icon" style="background:linear-gradient(135deg,#3b82f6,#1d4ed8)">A</div><div class="body"><div class="head"><b>Acme</b><span>now</span></div><div class="msg">Your order #4821 has shipped 📦</div></div></div>
    <div class="note" data-t="0.85"><div class="icon" style="background:linear-gradient(135deg,#22c55e,#15803d)">✓</div><div class="body"><div class="head"><b>Reminders</b><span>now</span></div><div class="msg">Standup in 10 minutes</div></div></div>
    <div class="note" data-t="1.45"><div class="icon" style="background:linear-gradient(135deg,#f472b6,#db2777)">N</div><div class="body"><div class="head"><b>Northwind</b><span>now</span></div><div class="msg">Maya commented on your design</div></div></div>
    <div class="note" data-t="2.0"><div class="icon" style="background:linear-gradient(135deg,#f59e0b,#d97706)">$</div><div class="body"><div class="head"><b>Wallet</b><span>now</span></div><div class="msg">$42.00 received from Jordan</div></div></div>
  </div>
  <div class="bottom"><i></i><i></i></div>
  <div class="bar"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 3, GAP = 196;
  const tl = fx.timeline({ duration: D });
  const notes = [...document.querySelectorAll('.note')];
  gsap.set(notes, { opacity: 0, y: -70, scale: .9 });
  notes.forEach((n, i) => {
    const t = +n.dataset.t;
    // the newest arrives at the top: from above, with a spring settle
    tl.to(n, { opacity: 1, y: 0, scale: 1, duration: .6, ease: 'back.out(1.6)' }, t);
    // everyone already there is pushed down one slot
    for (let j = 0; j < i; j++) tl.to(notes[j], { y: (i - j) * GAP, duration: .55, ease: 'power3.out' }, t);
  });
  tl.fromTo('.wall', { scale: 1.1, yPercent: -1 }, { scale: 1.14, yPercent: 1, duration: D, ease: 'none' }, 0);
  tl.to('.island', { scaleX: 1.06, duration: .2, yoyo: true, repeat: 1, ease: 'power2.inOut' }, 0.2);
  // clear the stack for the loop
  tl.to(notes, { opacity: 0, y: '-=60', scale: .94, duration: .32, stagger: .05, ease: 'power2.in' }, 2.55);
</script>
