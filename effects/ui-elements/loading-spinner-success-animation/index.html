<!doctype html><meta charset="utf-8">
<title>Loading Spinner: Success</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#111216;display:grid;place-items:center}
  .card{width:520px;padding:52px 40px 44px;border-radius:28px;background:#1a1b22;border:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;gap:26px;color:#fff}
  .ico{position:relative;width:140px;height:140px;display:grid;place-items:center}
  .ico svg{position:absolute;inset:0;width:140px;height:140px;overflow:visible}
  .ico circle{fill:none;stroke-width:8;stroke-linecap:round}
  .ico .tr{stroke:rgba(255,255,255,.08)}
  .ico .sp{stroke:#5b6bff}
  .ico .fill{fill:#2fd3a5;stroke:none;transform-origin:50% 50%}
  .ico .chk{fill:none;stroke:#111216;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  .ico .burst{fill:none;stroke:#2fd3a5;stroke-width:4;opacity:0}
  .title{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:34px;letter-spacing:-.02em;height:42px;position:relative;width:100%;text-align:center}
  .title span{position:absolute;left:0;right:0;top:0}
  .sub{font-size:16px;color:#8b90a3;text-align:center;height:22px;position:relative;width:100%}
  .sub span{position:absolute;left:0;right:0;top:0}
  .btn{margin-top:8px;padding:16px 36px;border-radius:14px;background:#fff;color:#111;font-size:16px;font-weight:500}
  .pt{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#2fd3a5;margin:-4px}
</style>
<div class="stage">
  <div class="card">
    <div class="ico">
      <svg viewBox="0 0 140 140"><circle class="tr" cx="70" cy="70" r="60"/><circle class="sp" cx="70" cy="70" r="60" transform="rotate(-90 70 70)"/></svg>
      <svg viewBox="0 0 140 140"><circle class="fill" cx="70" cy="70" r="60"/><path class="chk" d="M44 72l18 18 34-38"/><circle class="burst" cx="70" cy="70" r="60"/></svg>
    </div>
    <div class="title"><span class="t1">Submitting…</span><span class="t2">Payment sent</span></div>
    <div class="sub"><span class="s1">Securing the connection</span><span class="s2">$1,240.00 to Northwind Studio</span></div>
    <div class="btn">Done</div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 8 });
  const ico = document.querySelector('.ico');
  const pts = []; for (let i = 0; i < 12; i++) { const p = document.createElement('div'); p.className = 'pt'; ico.appendChild(p); pts.push(p); }
  gsap.set(pts, { scale: 0 });
  gsap.set('.fill', { scale: 0 });
  gsap.set('.chk', { drawSVG: '0%' });
  gsap.set('.t2, .s2', { opacity: 0, y: 12 });
  gsap.set('.btn', { opacity: 0, y: 10, scale: .9 });
  tl.from('.card', { y: 40, opacity: 0, duration: .7, ease: 'expo.out' }, 0);
  // spinner: arc chases head/tail, whole svg spins — runs until 4.2s
  tl.fromTo('.sp', { drawSVG: '0% 10%' }, { drawSVG: '0% 75%', duration: .7, ease: 'power2.inOut', repeat: 2, yoyo: true, repeatDelay: 0 }, .2)
    .fromTo(ico.querySelector('svg'), { rotate: 0 }, { rotate: 1440, duration: 4.2, ease: 'none', transformOrigin: '50% 50%' }, 0)
    .to('.s1', { opacity: .5, duration: .6, yoyo: true, repeat: 5 }, .2);
  // the dot count on the title pulses
  tl.to('.sp', { drawSVG: '0% 100%', duration: .5, ease: 'power2.inOut' }, 3.7);
  // transition: spinner becomes the success disc, check draws, particles burst
  tl.to('.sp', { stroke: '#2fd3a5', duration: .3 }, 4.0)
    .to('.fill', { scale: 1, duration: .55, ease: 'back.out(1.8)' }, 4.2)
    .to('.sp, .tr', { opacity: 0, duration: .2 }, 4.3)
    .to('.chk', { drawSVG: '100%', duration: .45, ease: 'power2.out' }, 4.5)
    .fromTo('.burst', { opacity: .9, scale: 1, transformOrigin: '50% 50%' }, { opacity: 0, scale: 1.5, duration: .7, ease: 'power2.out' }, 4.35)
    .to('.ico', { scale: 1.08, duration: .2, ease: 'power2.out' }, 4.5).to('.ico', { scale: 1, duration: .5, ease: 'elastic.out(1,.5)' }, 4.7);
  pts.forEach((p, i) => { const a = i / 12 * Math.PI * 2, r = 92 + (i % 2) * 18;
    tl.fromTo(p, { x: 0, y: 0, scale: 0 }, { x: Math.cos(a) * r, y: Math.sin(a) * r, scale: 1, duration: .55, ease: 'power3.out' }, 4.35).to(p, { scale: 0, opacity: 0, duration: .3 }, 4.8); });
  tl.to('.t1', { opacity: 0, y: -12, duration: .3 }, 4.4).to('.t2', { opacity: 1, y: 0, duration: .5, ease: 'back.out(1.6)' }, 4.55)
    .to('.s1', { opacity: 0, y: -10, duration: .3 }, 4.45).to('.s2', { opacity: 1, y: 0, duration: .5, ease: 'back.out(1.6)' }, 4.65)
    .to('.btn', { opacity: 1, y: 0, scale: 1, duration: .5, ease: 'back.out(2)' }, 4.9);
  // hold, then the card leaves
  tl.to('.btn', { scale: 1.04, duration: .5, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 5.5);
  tl.to('.card', { y: -30, opacity: 0, duration: .4, ease: 'power2.in' }, 7.5);
</script>
