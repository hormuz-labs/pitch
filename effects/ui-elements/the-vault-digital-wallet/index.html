<!doctype html><meta charset="utf-8">
<title>The Vault: Digital Wallet</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0f1015;color:#fff}
  .bgc{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,#2a2d55,transparent 50%),radial-gradient(circle at 80% 90%,#0e3a3f,transparent 45%)}
  .top{position:absolute;top:120px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
  .top .av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444)}
  .top b{font-size:34px;font-weight:500}
  .bal{position:absolute;top:270px;left:80px}
  .bal span{font-size:26px;color:#8b8f9c;letter-spacing:.1em;text-transform:uppercase}
  .bal b{display:block;font-size:112px;font-weight:500;letter-spacing:-.05em;line-height:1.05;margin-top:8px;font-variant-numeric:tabular-nums}
  .bal em{font-style:normal;display:inline-block;margin-top:14px;font-size:24px;padding:8px 16px;border-radius:999px;background:rgba(34,197,94,.18);color:#4ade80}
  .cards{position:absolute;top:560px;left:80px;right:80px;height:620px}
  .card{position:absolute;left:0;right:0;top:0;height:560px;border-radius:44px;padding:44px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 30px 70px rgba(0,0,0,.45);transform-origin:center top}
  .card .n{font-size:30px;letter-spacing:.14em;font-weight:500}
  .card .num{font-size:46px;letter-spacing:.1em;font-variant-numeric:tabular-nums}
  .card .row{display:flex;justify-content:space-between;font-size:26px;opacity:.85}
  .c1{background:linear-gradient(135deg,#6366f1,#22d3ee)}
  .c2{background:linear-gradient(135deg,#1e293b,#475569);border:1px solid rgba(255,255,255,.15)}
  .c3{background:linear-gradient(135deg,#f59e0b,#ec4899)}
  .dots{position:absolute;top:1220px;left:0;right:0;display:flex;justify-content:center;gap:12px}
  .dots i{width:14px;height:14px;border-radius:50%;background:#3a3c48;display:block}
  .list{position:absolute;top:1290px;left:80px;right:80px}
  .list h3{font-size:30px;font-weight:500;margin-bottom:20px;color:#c9cbd6}
  .tx{display:flex;align-items:center;gap:22px;padding:22px 0;border-top:1px solid rgba(255,255,255,.08)}
  .tx i{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;font-style:normal;font-weight:500;font-size:30px;flex:none}
  .tx div{flex:1}.tx div b{display:block;font-weight:500;font-size:30px}.tx div span{font-size:24px;color:#8b8f9c}
  .tx strong{font-size:30px;font-weight:500;font-variant-numeric:tabular-nums}
  .tab{position:absolute;bottom:60px;left:80px;right:80px;height:120px;border-radius:40px;background:rgba(255,255,255,.08);display:flex;justify-content:space-around;align-items:center}
  .tab i{width:44px;height:44px;border-radius:12px;background:#3a3c48;display:block}
  .tab i.on{background:#fff}
</style>
<div class="stage">
  <div class="bgc"></div>
  <div class="top"><b>Wallet</b><div class="av"></div></div>
  <div class="bal"><span>Total balance</span><b class="b">$0.00</b><em class="d">+$1,240 this week</em></div>
  <div class="cards">
    <div class="card c3"><div class="n">ACME GOLD</div><div class="num">•••• •••• •••• 9021</div><div class="row"><span>Jordan Lee</span><span>Credit</span></div></div>
    <div class="card c2"><div class="n">NORTHWIND</div><div class="num">•••• •••• •••• 4821</div><div class="row"><span>Jordan Lee</span><span>Debit</span></div></div>
    <div class="card c1"><div class="n">ACME</div><div class="num">•••• •••• •••• 2210</div><div class="row"><span>Jordan Lee</span><span>Savings</span></div></div>
  </div>
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="list">
    <h3>Recent</h3>
    <div class="tx"><i style="background:#1e293b">☕</i><div><b>Acme Coffee</b><span>Today</span></div><strong>−$6.40</strong></div>
    <div class="tx"><i style="background:#1e293b">💸</i><div><b>Salary</b><span>Yesterday</span></div><strong style="color:#4ade80">+$3,200</strong></div>
    <div class="tx"><i style="background:#1e293b">🛒</i><div><b>Northwind Market</b><span>Mon</span></div><strong>−$84.12</strong></div>
  </div>
  <div class="tab"><i class="on"></i><i></i><i></i><i></i></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 9;
  const tl = fx.timeline({ duration: D });
  const cards = ['.c1', '.c2', '.c3'], dots = document.querySelectorAll('.dots i');
  const bal = document.querySelector('.b'), st = { v: 0 };
  const draw = () => bal.textContent = '$' + st.v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  draw();
  // stacked deck: front card flat, the others peek from behind, scaled and lifted
  const stack = (front, t, dur = .7) => {
    const order = [front, (front + 1) % 3, (front + 2) % 3];
    order.forEach((ci, depth) => tl.to(cards[ci], { y: -depth * 34, scale: 1 - depth * .06, opacity: 1 - depth * .25, zIndex: 3 - depth, duration: dur, ease: 'power3.inOut' }, t));
    tl.to(dots, { backgroundColor: '#3a3c48', duration: .3 }, t).to(dots[front], { backgroundColor: '#fff', duration: .3 }, t);
  };
  gsap.set('.c1', { zIndex: 3 }); gsap.set('.c2', { zIndex: 2, y: -34, scale: .94, opacity: .75 }); gsap.set('.c3', { zIndex: 1, y: -68, scale: .88, opacity: .5 });
  gsap.set(dots[0], { backgroundColor: '#fff' });
  tl.from('.top', { y: -30, opacity: 0, duration: .6, ease: 'power3.out' }, 0)
    .from('.bal span, .bal b, .bal em', { y: 24, opacity: 0, duration: .6, stagger: .1, ease: 'power3.out' }, 0.1)
    .to(st, { v: 12480.5, duration: 1.6, ease: 'expo.out', onUpdate: draw }, 0.3)
    .from('.card', { y: 300, opacity: 0, duration: .9, stagger: -.1, ease: 'power3.out' }, 0.2)
    .from('.list h3, .tx', { x: 40, opacity: 0, duration: .5, stagger: .1, ease: 'power3.out' }, 0.8)
    .from('.tab', { y: 60, opacity: 0, duration: .6, ease: 'power3.out' }, 0.5);
  // swipe: the front card flies off to the left and tucks to the back
  const swipe = (front, t) => {
    tl.to(cards[front], { x: -700, rotation: -8, duration: .5, ease: 'power3.in' }, t)
      .set(cards[front], { zIndex: 0 }, t + .5)
      .to(cards[front], { x: 0, rotation: 0, duration: .5, ease: 'power3.out' }, t + .5);
    stack((front + 1) % 3, t + .35, .6);
  };
  swipe(0, 2.6);
  tl.to(st, { v: 4210.0, duration: .9, ease: 'expo.out', onUpdate: draw }, 3.0);
  swipe(1, 4.8);
  tl.to(st, { v: 980.25, duration: .9, ease: 'expo.out', onUpdate: draw }, 5.2);
  swipe(2, 6.8);
  tl.to(st, { v: 12480.5, duration: .9, ease: 'expo.out', onUpdate: draw }, 7.2);
  tl.to('.tx', { opacity: .5, duration: .3, stagger: .05, yoyo: true, repeat: 1 }, 3.0);
  // exit for the loop: everything leaves the way it came
  tl.to('.card', { y: 300, opacity: 0, duration: .5, stagger: .06, ease: 'power3.in' }, 8.2)
    .to('.list h3, .tx', { x: 40, opacity: 0, duration: .35, stagger: -.05, ease: 'power2.in' }, 8.3)
    .to('.bal span, .bal b, .bal em', { y: 24, opacity: 0, duration: .35, stagger: .05, ease: 'power2.in' }, 8.45)
    .to('.top', { y: -30, opacity: 0, duration: .35, ease: 'power2.in' }, 8.55)
    .to('.tab', { y: 60, opacity: 0, duration: .35, ease: 'power2.in' }, 8.55)
    .set(st, { v: 0, onUpdate: draw }, 8.99);
</script>
