<!doctype html><meta charset="utf-8">
<title>Progress Pie</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101318;display:flex;align-items:center;justify-content:center;gap:90px}
  .pie{width:340px;height:340px;position:relative;flex:none}
  .pie svg{position:absolute;inset:0;overflow:visible}
  .base{fill:#1c2129}
  .wedge{fill:none;stroke:#34d399;stroke-width:140}
  .wedge2{fill:none;stroke:#0ea5e9;stroke-width:140}
  .rim{fill:none;stroke:#2a313c;stroke-width:2}
  .tag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:#101318;border-radius:18px;padding:12px 20px;font-size:34px;font-weight:500;letter-spacing:-.03em;box-shadow:0 12px 30px rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
  .txt{color:#fff;max-width:420px}
  .txt .eyebrow{font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:#7c8798}
  .txt h1{font-size:54px;font-weight:500;letter-spacing:-.03em;line-height:1.05;margin:14px 0 26px}
  .legend{display:flex;flex-direction:column;gap:14px}
  .legend div{display:flex;align-items:center;gap:14px;font-size:20px;color:#c8cfda}
  .legend i{width:16px;height:16px;border-radius:50%;background:#34d399}
  .legend b{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums;min-width:70px;text-align:right}
  .badge{display:inline-flex;align-items:center;gap:10px;margin-top:30px;padding:10px 18px;border-radius:999px;background:#34d399;color:#06281a;font-weight:500;font-size:18px;transform-origin:left center}
  .badge svg{width:18px;height:18px}
</style>
<div class="stage">
  <div class="pie">
    <svg viewBox="0 0 340 340">
      <circle class="base" cx="170" cy="170" r="150"/>
      <g style="transform-origin:170px 170px;transform:rotate(-90deg)">
        <circle class="wedge2" cx="170" cy="170" r="70"/>
        <circle class="wedge" cx="170" cy="170" r="70"/>
      </g>
      <circle class="rim" cx="170" cy="170" r="150"/>
    </svg>
    <div class="tag"><span class="n">0</span>%</div>
  </div>
  <div class="txt">
    <div class="eyebrow">Savings goal</div>
    <h1>Trip to Kyoto</h1>
    <div class="legend">
      <div><i></i>Saved<b class="a">$0</b></div>
      <div><i style="background:#0ea5e9"></i>Scheduled<b class="b">$0</b></div>
      <div><i style="background:#1c2129"></i>Remaining<b class="c">$4,800</b></div>
    </div>
    <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg>Goal reached</div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 4, C = 2 * Math.PI * 70, TOTAL = 4800;
  const tl = fx.timeline({ duration: D });
  const w1 = document.querySelector('.wedge'), w2 = document.querySelector('.wedge2');
  const n = document.querySelector('.n'), a = document.querySelector('.a'), b = document.querySelector('.b'), c = document.querySelector('.c');
  const st = { p1: 0, p2: 0 };
  const money = v => '$' + Math.round(v).toLocaleString('en-US');
  const draw = () => {
    w1.setAttribute('stroke-dasharray', `${st.p1 * C} ${C}`);
    w2.setAttribute('stroke-dasharray', `${(st.p1 + st.p2) * C} ${C}`);
    n.textContent = Math.round((st.p1 + st.p2) * 100);
    a.textContent = money(st.p1 * TOTAL); b.textContent = money(st.p2 * TOTAL); c.textContent = money((1 - st.p1 - st.p2) * TOTAL);
  };
  draw();
  gsap.set('.badge', { scale: 0, opacity: 0 });
  tl.from('.pie', { scale: .7, opacity: 0, duration: .7, ease: 'back.out(1.6)' }, 0)
    .from('.eyebrow, .txt h1, .legend div', { y: 18, opacity: 0, duration: .55, stagger: .08, ease: 'power3.out' }, 0.1)
    .to(st, { p1: 0.68, duration: 1.5, ease: 'expo.out', onUpdate: draw }, 0.35)
    .fromTo('.tag', { scale: .8 }, { scale: 1.08, duration: .5, ease: 'back.out(3)' }, 0.35)
    .to('.tag', { scale: 1, duration: .5, ease: 'power2.inOut' }, 0.85)
    .to(st, { p2: 0.32, duration: 1.0, ease: 'power3.inOut', onUpdate: draw }, 2.0)
    .to('.pie', { scale: 1.04, duration: .18, ease: 'power2.out' }, 2.95)
    .to('.pie', { scale: 1, duration: .45, ease: 'elastic.out(1,.5)' }, 3.13)
    .to('.badge', { scale: 1, opacity: 1, duration: .5, ease: 'back.out(2.2)' }, 2.95)
    // out
    .to('.pie', { scale: .7, opacity: 0, duration: .32, ease: 'power3.in' }, 3.6)
    .to('.badge', { scale: 0, opacity: 0, duration: .25, ease: 'power2.in' }, 3.6)
    .to('.eyebrow, .txt h1, .legend div', { y: -14, opacity: 0, duration: .28, stagger: .04, ease: 'power2.in' }, 3.62)
    .set(st, { p1: 0, p2: 0, onUpdate: draw }, 3.999)
    .set('.eyebrow, .txt h1, .legend div', { y: 0, opacity: 1 }, 3.999)
    .set('.pie', { scale: 1, opacity: 1 }, 3.999);
</script>
