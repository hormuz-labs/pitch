<!doctype html><meta charset="utf-8">
<title>Pink Loading Spinner</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#fde8f0;display:flex;align-items:center;justify-content:center}
  .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.7}
  .b1{width:520px;height:520px;left:-120px;top:-160px;background:#ffc9dd}
  .b2{width:620px;height:620px;right:-180px;bottom:-240px;background:#ffd6e6}
  .card{position:relative;width:440px;height:440px;border-radius:52px;background:#fff;box-shadow:0 30px 80px rgba(230,80,140,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:38px}
  .spin{width:190px;height:190px;position:relative}
  .spin svg{position:absolute;inset:0;overflow:visible}
  .pulse{position:absolute;inset:-14px;border-radius:50%;border:3px solid #f7a6c6;opacity:0}
  .track{fill:none;stroke:#fbd4e2;stroke-width:16}
  .arc{fill:none;stroke:#f0559a;stroke-width:16;stroke-linecap:round}
  .sat{fill:#f89ec2}
  .label{font-size:24px;font-weight:500;color:#c23c78;letter-spacing:.01em;display:flex;align-items:flex-end;gap:2px}
  .label i{font-style:normal;display:inline-block;width:8px;text-align:center}
</style>
<div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="card">
    <div class="spin">
      <div class="pulse p1"></div><div class="pulse p2"></div>
      <svg viewBox="0 0 190 190">
        <circle class="track" cx="95" cy="95" r="80"/>
        <g class="rot" style="transform-origin:95px 95px">
          <circle class="arc" cx="95" cy="95" r="80" transform="rotate(-90 95 95)"/>
        </g>
        <g class="orb o1" style="transform-origin:95px 95px"><circle class="sat" cx="95" cy="-2" r="7"/></g>
        <g class="orb o2" style="transform-origin:95px 95px"><circle class="sat" cx="95" cy="-2" r="5" style="fill:#f0559a"/></g>
      </svg>
    </div>
    <div class="label">Loading<i>.</i><i>.</i><i>.</i></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 3, C = 2 * Math.PI * 80;
  const tl = fx.timeline({ duration: D });
  const arc = document.querySelector('.arc');
  const st = { len: 0.08 };
  const draw = () => arc.setAttribute('stroke-dasharray', `${st.len * C} ${C}`);
  draw();
  // the head runs ahead, the tail catches up: arc length breathes twice per loop
  tl.to(st, { len: 0.72, duration: 0.75, ease: 'power2.inOut', yoyo: true, repeat: 3, onUpdate: draw }, 0);
  // constant rotation, 720 deg over the loop = clean loop
  tl.fromTo('.rot', { rotation: 0 }, { rotation: 720, duration: D, ease: 'none' }, 0);
  tl.fromTo('.o1', { rotation: 0 }, { rotation: 360, duration: D, ease: 'none' }, 0);
  tl.fromTo('.o2', { rotation: 120 }, { rotation: -600, duration: D, ease: 'none' }, 0);
  // soft pulse rings, two per loop
  tl.fromTo('.p1', { scale: .85, opacity: .8 }, { scale: 1.3, opacity: 0, duration: 1.5, ease: 'power2.out', repeat: 1 }, 0);
  tl.fromTo('.p2', { scale: .85, opacity: .8 }, { scale: 1.3, opacity: 0, duration: 1.5, ease: 'power2.out', repeat: 1 }, 0.75);
  // ellipsis bounce
  document.querySelectorAll('.label i').forEach((d, i) => {
    tl.to(d, { y: -7, duration: .22, yoyo: true, repeat: 9, ease: 'sine.inOut' }, 0.15 + i * 0.11);
  });
  tl.to('.card', { y: -6, duration: 1.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
</script>
