<!doctype html><meta charset="utf-8">
<title>Splitting Cube: Perfect Loop</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:radial-gradient(circle at 50% 40%,#1a1c26,#0a0b10 70%);perspective:1400px;perspective-origin:50% 42%}
  .world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
  .group{position:absolute;transform-style:preserve-3d}
  .cube{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;transform-style:preserve-3d}
  .f{position:absolute;inset:0;border-radius:6px;background:var(--c)}
  .f.top{transform:rotateX(90deg) translateZ(55px);filter:brightness(1.25)}
  .f.bottom{transform:rotateX(-90deg) translateZ(55px);filter:brightness(.55)}
  .f.front{transform:translateZ(55px)}
  .f.back{transform:rotateY(180deg) translateZ(55px);filter:brightness(.7)}
  .f.left{transform:rotateY(-90deg) translateZ(55px);filter:brightness(.8)}
  .f.right{transform:rotateY(90deg) translateZ(55px);filter:brightness(.9)}
  .shadow{position:absolute;left:50%;top:50%;width:420px;height:120px;margin:190px 0 0 -210px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),rgba(0,0,0,0) 70%)}
</style>
<div class="stage">
  <div class="shadow"></div>
  <div class="world"><div class="group" id="g"></div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 5, H = 55;
  const colors = ['#ff5a5f', '#ffb340', '#3ddc97', '#3b82f6', '#a855f7', '#f472b6', '#14b8a6', '#f5f5f5'];
  const g = document.getElementById('g');
  const cubes = [];
  let i = 0;
  for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) {
    const c = document.createElement('div'); c.className = 'cube'; c.style.setProperty('--c', colors[i++]);
    c.innerHTML = ['front', 'back', 'left', 'right', 'top', 'bottom'].map(f => `<div class="f ${f}"></div>`).join('');
    g.appendChild(c); cubes.push({ el: c, x, y, z });
  }
  const st = { spread: 0, spin: 0, twist: 0, ry: 0, rx: 0 };
  const tl = fx.timeline({ duration: D });
  const place = () => {
    const k = H * (1 + st.spread * 1.6);
    for (const c of cubes) {
      gsap.set(c.el, { x: c.x * k, y: c.y * k, z: c.z * k, rotationX: st.twist * 180 * c.x, rotationY: st.spin * 180 * c.y });
    }
    gsap.set(g, { rotationX: -22 + st.rx, rotationY: st.ry });
  };
  place();
  tl.to(st, { spread: 1, duration: .9, ease: 'back.out(1.8)', onUpdate: place }, 0.3)
    .to(st, { spin: 1, duration: 1.0, ease: 'expo.inOut', onUpdate: place }, 1.1)
    .to(st, { twist: 1, duration: 1.0, ease: 'expo.inOut', onUpdate: place }, 1.5)
    .to(st, { spread: 0, duration: .9, ease: 'back.in(1.4)', onUpdate: place }, 2.9)
    .to(st, { spin: 2, duration: .8, ease: 'expo.inOut', onUpdate: place }, 3.7)
    .to(st, { twist: 2, duration: .8, ease: 'expo.inOut', onUpdate: place }, 3.9)
    .to(st, { ry: 360, duration: D, ease: 'none', onUpdate: place }, 0)
    .to(st, { rx: 14, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1, onUpdate: place }, 0)
    .to('.shadow', { scale: 1.35, opacity: .6, duration: .9, ease: 'back.out(1.8)' }, 0.3)
    .to('.shadow', { scale: 1, opacity: 1, duration: .9, ease: 'back.in(1.4)' }, 2.9);
</script>
