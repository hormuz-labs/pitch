<!doctype html><meta charset="utf-8">
<title>Loading Spinner: Infinite Loop</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f6f6f8;display:grid;place-items:center}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:40px}
  .inf{width:360px;height:200px;overflow:visible}
  .inf path{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .inf .tr{stroke:#e3e4ea;stroke-width:14}
  .inf .hd{stroke:#111;stroke-width:14}
  .inf .hd2{stroke:#5b6bff;stroke-width:14}
  .txt{font-size:17px;color:#8a8f9c;letter-spacing:.12em;text-transform:uppercase}
</style>
<div class="stage">
  <div class="wrap">
    <svg class="inf" viewBox="0 0 360 200">
      <path class="tr" d="M180 100 C 180 40, 100 20, 60 60 S 20 160, 60 160 S 180 140, 180 100 S 280 20, 320 60 S 340 160, 300 160 S 180 140, 180 100"/>
      <path class="hd" d="M180 100 C 180 40, 100 20, 60 60 S 20 160, 60 160 S 180 140, 180 100 S 280 20, 320 60 S 340 160, 300 160 S 180 140, 180 100"/>
      <path class="hd2" d="M180 100 C 180 40, 100 20, 60 60 S 20 160, 60 160 S 180 140, 180 100 S 280 20, 320 60 S 340 160, 300 160 S 180 140, 180 100"/>
    </svg>
    <div class="txt">Preparing your space</div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 8 });
  // a dash chases the infinity path; 4 laps per loop, the tail breathes longer and shorter
  const lap = (sel, at, d, off) => {
    tl.fromTo(sel, { drawSVG: `${off}% ${off + 4}%` }, { drawSVG: `${off + 40}% ${off + 62}%`, duration: d * .5, ease: 'power1.inOut' }, at)
      .to(sel, { drawSVG: `${off + 96}% ${off + 100}%`, duration: d * .5, ease: 'power1.inOut' }, at + d * .5);
  };
  // DrawSVG accepts values over 100 as wrap-around when using percentages? Not reliably — use a dash offset instead
  const paths = [document.querySelector('.hd'), document.querySelector('.hd2')];
  const L = paths[0].getTotalLength();
  paths.forEach(p => { p.style.strokeDasharray = `${L * .18} ${L * .82}`; });
  const st = { a: 0, b: 0 };
  tl.to(st, { a: -L * 4, duration: 8, ease: 'none', onUpdate: () => { paths[0].style.strokeDashoffset = st.a; } }, 0);
  tl.to(st, { b: -L * 4, duration: 8, ease: 'none', onUpdate: () => { paths[1].style.strokeDashoffset = st.b - L * .5; } }, 0);
  // the dash length breathes so it isn't a rigid segment
  const dl = { k: .18 };
  tl.to(dl, { k: .32, duration: 1, ease: 'sine.inOut', yoyo: true, repeat: 7, onUpdate: () => { paths.forEach(p => p.style.strokeDasharray = `${L * dl.k} ${L * (1 - dl.k)}`); } }, 0);
  tl.fromTo('.txt', { opacity: .5 }, { opacity: 1, duration: 1, ease: 'sine.inOut', yoyo: true, repeat: 7 }, 0);
  tl.fromTo('.inf', { scale: .98 }, { scale: 1.02, duration: 2, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 0);
</script>
