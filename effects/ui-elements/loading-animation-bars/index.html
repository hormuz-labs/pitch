<!doctype html><meta charset="utf-8">
<title>Loading Animation: Bars</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0e0f14;display:grid;place-items:center}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:44px}
  .bars{display:flex;align-items:center;gap:14px;height:160px}
  .bar{width:22px;height:160px;border-radius:11px;background:linear-gradient(180deg,#8b93ff,#5b6bff);transform-origin:50% 50%}
  .bar:nth-child(2n){background:linear-gradient(180deg,#ff8fa8,#ff6b8b)}
  .bar:nth-child(3n){background:linear-gradient(180deg,#6cf0c8,#2fd3a5)}
  .txt{color:#8b90a3;font-size:18px;letter-spacing:.14em;text-transform:uppercase}
  .txt b{color:#fff;font-weight:500}
</style>
<div class="stage">
  <div class="wrap">
    <div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
    <div class="txt"><b>Processing</b> data</div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 3 });
  // each bar pulses tall then short; the stagger runs left→right, twice per loop
  const bars = gsap.utils.toArray('.bar');
  gsap.set(bars, { scaleY: .25, opacity: .55 });
  const wave = (at) => bars.forEach((b, i) => {
    tl.to(b, { scaleY: 1, opacity: 1, duration: .4, ease: 'power2.out' }, at + i * .1)
      .to(b, { scaleY: .25, opacity: .55, duration: .5, ease: 'power2.inOut' }, at + i * .1 + .4);
  });
  wave(0); wave(1.5);
  // a whole-set breathe so nothing sits still between waves
  tl.fromTo('.bars', { y: 4 }, { y: -4, duration: 1.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  tl.fromTo('.txt', { opacity: .6 }, { opacity: 1, duration: .75, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 0);
</script>
