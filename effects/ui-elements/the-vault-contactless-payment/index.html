<!doctype html><meta charset="utf-8">
<title>The Vault: Contactless Payment</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#e8e6e1;display:flex;align-items:center;justify-content:center;perspective:1400px}
  .term{position:relative;width:340px;height:520px;border-radius:40px;background:#1f2026;box-shadow:0 40px 90px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);padding:22px;display:flex;flex-direction:column;gap:18px;transform:translateX(-120px)}
  .scr{flex:1;border-radius:24px;background:#0f1014;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;position:relative;overflow:hidden}
  .scr .lbl{font-size:16px;color:#8b8f9c;letter-spacing:.12em;text-transform:uppercase}
  .scr .amt{font-size:64px;font-weight:500;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .scr .ok{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0f1014;opacity:0}
  .ok .ring{width:110px;height:110px;border-radius:50%;background:#22c55e;display:grid;place-items:center}
  .ok svg{width:60px;height:60px;fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .ok b{font-size:28px;font-weight:500}
  .ok span{font-size:16px;color:#8b8f9c}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .keys i{height:44px;border-radius:12px;background:#2c2d35;display:block}
  .nfc{position:absolute;right:30px;top:30px;width:44px;height:44px}
  .nfc svg{width:100%;height:100%;fill:none;stroke:#8b8f9c;stroke-width:2.5;stroke-linecap:round}
  .waves{position:absolute;left:50%;top:50%;width:0;height:0}
  .wave{position:absolute;left:-90px;top:-90px;width:180px;height:180px;border-radius:50%;border:4px solid #22c55e;opacity:0}
  .phone{position:absolute;width:250px;height:510px;border-radius:44px;background:#0a0a0c;padding:10px;box-shadow:0 30px 60px rgba(0,0,0,.35),inset 0 0 0 2px #35363d;left:50%;top:50%;margin:-255px 0 0 60px;transform-style:preserve-3d}
  .ps{width:100%;height:100%;border-radius:36px;background:linear-gradient(170deg,#1c1d24,#0d0e12);overflow:hidden;display:flex;flex-direction:column;align-items:center;padding-top:80px;gap:14px;color:#fff}
  .card{width:200px;height:124px;border-radius:18px;background:linear-gradient(135deg,#6366f1,#22d3ee);box-shadow:0 14px 30px rgba(0,0,0,.4);padding:16px;display:flex;flex-direction:column;justify-content:space-between;font-size:13px}
  .card b{font-weight:500;letter-spacing:.06em}
  .ps .hint{font-size:14px;color:#8b8f9c;margin-top:8px}
  .ps .done{font-size:16px;color:#22c55e;font-weight:500;opacity:0}
</style>
<div class="stage">
  <div class="term">
    <div class="scr">
      <div class="lbl">Total</div><div class="amt">$24.00</div><div class="lbl" style="font-size:13px">Tap to pay</div>
      <div class="ok"><div class="ring"><svg viewBox="0 0 24 24"><path class="tick" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><b>Approved</b><span>Acme Coffee · $24.00</span></div>
    </div>
    <div class="keys"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="nfc"><svg viewBox="0 0 24 24"><path d="M6 8a8 8 0 0 1 0 8M9.5 10a4 4 0 0 1 0 4M13 8a8 8 0 0 0 0 8M16.5 10a4 4 0 0 0 0 4"/></svg></div>
    <div class="waves"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
  </div>
  <div class="phone"><div class="ps">
    <div class="card"><b>NORTHWIND</b><div>•••• 4821<br><span style="opacity:.7">Jordan Lee</span></div></div>
    <div class="hint">Hold near reader</div>
    <div class="done">✓ Done</div>
  </div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const D = 10;
  const tl = fx.timeline({ duration: D });
  gsap.set('.phone', { x: 720, rotationY: -35, rotationZ: -8 });
  gsap.set('.tick', { drawSVG: '0%' });
  tl.from('.term', { y: 40, opacity: 0, duration: .8, ease: 'power3.out' }, 0)
    // the phone glides in and tilts flat against the reader
    .to('.phone', { x: 150, rotationY: -18, rotationZ: -4, duration: 1.4, ease: 'power3.inOut' }, 0.6)
    .to('.phone', { x: 40, y: -40, rotationY: -8, rotationZ: -10, duration: .8, ease: 'power2.inOut' }, 2.0)
    // the tap: a tiny nudge, then NFC rings ripple out
    .to('.phone', { x: 24, duration: .12, ease: 'power2.in' }, 2.8).to('.phone', { x: 36, duration: .3, ease: 'power2.out' }, 2.92)
    .to('.nfc svg', { stroke: '#22c55e', duration: .2 }, 2.8)
    .fromTo('.wave', { scale: .3, opacity: .9 }, { scale: 2.2, opacity: 0, duration: 1.1, stagger: .28, ease: 'power2.out', repeat: 1 }, 2.85)
    .to('.card', { y: -6, scale: 1.04, duration: .3, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 2.85)
    // approved
    .to('.ok', { opacity: 1, duration: .3 }, 4.5)
    .from('.ok .ring', { scale: 0, duration: .6, ease: 'back.out(2.2)' }, 4.5)
    .to('.tick', { drawSVG: '100%', duration: .5, ease: 'power2.out' }, 4.85)
    .from('.ok b, .ok span', { y: 12, opacity: 0, duration: .4, stagger: .1 }, 4.9)
    .to('.hint', { opacity: 0, duration: .2 }, 4.5).to('.done', { opacity: 1, y: -20, duration: .4, ease: 'power3.out' }, 4.7)
    .to('.scr', { boxShadow: '0 0 0 3px #22c55e', duration: .3 }, 4.5)
    // the phone pulls away
    .to('.phone', { x: 720, y: 0, rotationY: -35, rotationZ: -8, duration: 1.2, ease: 'power3.in' }, 6.6)
    // reader resets, term shrinks out for the loop
    .to('.ok', { opacity: 0, duration: .4 }, 8.4)
    .to('.scr', { boxShadow: '0 0 0 0px #22c55e', duration: .3 }, 8.4)
    .to('.nfc svg', { stroke: '#8b8f9c', duration: .3 }, 8.4)
    .to('.term', { y: 40, opacity: 0, duration: .5, ease: 'power3.in' }, 9.4)
    .set('.tick', { drawSVG: '0%' }, 9.99).set('.hint', { opacity: 1 }, 9.99).set('.done', { opacity: 0, y: 0 }, 9.99);
</script>
