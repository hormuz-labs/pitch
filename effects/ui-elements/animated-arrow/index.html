<!doctype html><meta charset="utf-8">
<title>Animated Arrow</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101114;display:grid;place-items:center}
  .wrap{display:flex;align-items:center;gap:56px}
  .cta{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:72px;letter-spacing:-.03em;color:#fff;line-height:1}
  .cta em{font-style:normal;color:#8b93ff}
  .arrow{width:220px;height:140px;overflow:visible}
  .arrow path{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
  .arrow .trail{stroke:#8b93ff;stroke-width:12;opacity:.9}
  .arrow .trail2{stroke:#8b93ff;stroke-width:6;opacity:.35}
  .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1.5px,transparent 1.5px);background-size:32px 32px}
</style>
<div class="stage">
  <div class="dots"></div>
  <div class="wrap">
    <div class="cta">Swipe to <em>continue</em></div>
    <svg class="arrow" viewBox="0 0 220 140">
      <path class="trail2" d="M6 70 H180"/>
      <path class="trail" d="M6 70 H180"/>
      <path class="shaft" d="M40 70 H190"/>
      <path class="head" d="M150 30 L192 70 L150 110"/>
    </svg>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 5 });
  tl.fromTo('.dots', { backgroundPosition: '0px 0px' }, { backgroundPosition: '160px 0px', duration: 5, ease: 'none' }, 0);
  tl.from('.cta', { x: -30, opacity: 0, duration: .8, ease: 'expo.out' }, 0);
  // two pulses per loop: arrow nudges right, a trail draws through it and streaks off
  const pulse = (at) => {
    tl.fromTo('.shaft', { drawSVG: '0% 0%' }, { drawSVG: '0% 100%', duration: .5, ease: 'expo.out' }, at)
      .fromTo('.head', { drawSVG: '0% 0%' }, { drawSVG: '0% 100%', duration: .4, ease: 'expo.out' }, at + .25)
      .fromTo('.arrow', { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: .55, ease: 'expo.out' }, at)
      .fromTo('.trail', { drawSVG: '0% 0%' }, { drawSVG: '40% 100%', duration: .5, ease: 'power2.in' }, at + .55)
      .to('.trail', { drawSVG: '100% 100%', duration: .35, ease: 'power2.out' }, at + 1.0)
      .fromTo('.trail2', { drawSVG: '0% 0%' }, { drawSVG: '20% 100%', duration: .5, ease: 'power2.in' }, at + .65)
      .to('.trail2', { drawSVG: '100% 100%', duration: .4, ease: 'power2.out' }, at + 1.1)
      .to('.arrow', { x: 26, duration: .4, ease: 'power2.inOut' }, at + .6)
      .to('.arrow', { x: 0, duration: .5, ease: 'elastic.out(1,.5)' }, at + 1.0)
      .to('.arrow', { x: 80, opacity: 0, duration: .35, ease: 'power3.in' }, at + 1.9);
  };
  pulse(0.2); pulse(2.6);
  tl.to('.cta', { x: 30, opacity: 0, duration: .35, ease: 'power3.in' }, 4.6);
</script>
