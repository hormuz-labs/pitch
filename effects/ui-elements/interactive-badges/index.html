<!doctype html><meta charset="utf-8">
<title>Interactive Badges</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#12131a;color:#fff;display:grid;place-items:center}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:40px}
  .hd{text-align:center}
  .hd h1{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:46px;letter-spacing:-.03em}
  .hd p{margin-top:8px;color:#8b90a3;font-size:18px}
  .row{display:flex;gap:36px}
  .bd{position:relative;width:180px;display:flex;flex-direction:column;align-items:center;gap:16px}
  .hex{position:relative;width:140px;height:140px;display:grid;place-items:center}
  .hex .shape{position:absolute;inset:0;clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%);background:#22242f}
  .hex .col{position:absolute;inset:0;clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%);opacity:0}
  .bd:nth-child(1) .col{background:linear-gradient(160deg,#ffb84d,#ff7a1a)}
  .bd:nth-child(2) .col{background:linear-gradient(160deg,#5b6bff,#a05cff)}
  .bd:nth-child(3) .col{background:linear-gradient(160deg,#2fd3a5,#0fa57c)}
  .bd:nth-child(4) .col{background:linear-gradient(160deg,#ff6b8b,#ff3d5a)}
  .hex .ring{position:absolute;inset:-14px;border-radius:50%;border:3px solid #fff;opacity:0}
  .hex svg{position:relative;width:56px;height:56px}
  .hex path,.hex circle,.hex polygon{fill:none;stroke:#4a4d5c;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .hex.on path,.hex.on circle,.hex.on polygon{stroke:#fff}
  .nm{font-size:17px;font-weight:500;color:#5a5e70}
  .nm small{display:block;font-weight:400;font-size:13px;color:#4a4d5c;margin-top:3px}
  .sh{position:absolute;inset:0;clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%);background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);background-size:300% 100%;background-repeat:no-repeat;opacity:0}
  .sp{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#fff}
  .tag{position:absolute;top:-10px;right:6px;background:#fff;color:#12131a;font-size:11px;font-weight:500;padding:4px 8px;border-radius:999px;opacity:0}
  .cur{position:absolute;width:24px;height:24px;left:0;top:0}
  .cur path{fill:#fff;stroke:#12131a;stroke-width:1.5}
</style>
<div class="stage">
  <div class="wrap">
    <div class="hd"><h1>Achievements</h1><p>3 of 4 unlocked this week</p></div>
    <div class="row">
      <div class="bd"><div class="hex"><div class="shape"></div><div class="col"></div><div class="sh"></div><div class="ring"></div><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><div class="tag">Unlocked</div></div><div class="nm">First launch<small>Ship your first project</small></div></div>
      <div class="bd"><div class="hex"><div class="shape"></div><div class="col"></div><div class="sh"></div><div class="ring"></div><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><div class="tag">Unlocked</div></div><div class="nm">Speed run<small>Deploy under 60s</small></div></div>
      <div class="bd"><div class="hex"><div class="shape"></div><div class="col"></div><div class="sh"></div><div class="ring"></div><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg><div class="tag">Unlocked</div></div><div class="nm">Bullseye<small>100% test coverage</small></div></div>
      <div class="bd"><div class="hex"><div class="shape"></div><div class="col"></div><div class="sh"></div><div class="ring"></div><svg viewBox="0 0 24 24"><path d="M6 4h12v4a6 6 0 0 1-12 0zM9 20h6M12 14v6M3 6h3M18 6h3"/></svg><div class="tag">Locked</div></div><div class="nm">Champion<small>Invite 10 teammates</small></div></div>
    </div>
  </div>
  <svg class="cur" viewBox="0 0 24 24"><path d="M4 2l16 10-7 1.5L9 21z"/></svg>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 6 });
  const hex = gsap.utils.toArray('.hex');
  // sparks per badge
  const sparks = hex.map(h => { const arr = []; for (let i = 0; i < 8; i++) { const s = document.createElement('div'); s.className = 'sp'; h.appendChild(s); arr.push(s); } return arr; });
  gsap.set('.sp', { scale: 0 });
  tl.from('.hd > *', { y: 20, opacity: 0, duration: .6, stagger: .08, ease: 'expo.out' }, 0)
    .from('.bd', { y: 40, opacity: 0, scale: .9, duration: .7, stagger: .1, ease: 'expo.out' }, .1);
  // the cursor visits three badges; each lights up on hover: color floods, ring pulses, sparks burst
  const pos = [ [-270, 0], [-90, 0], [90, 0] ];
  const light = (i, at) => {
    const h = hex[i], bd = h.closest('.bd');
    tl.to('.cur', { x: 640 + pos[i][0] + 20, y: 330 + 20, duration: .55, ease: 'power3.inOut' }, at - .55)
      .to(h, { scale: 1.1, rotate: 8, duration: .45, ease: 'back.out(2.5)' }, at)
      .to(h, { rotate: 0, duration: .5, ease: 'elastic.out(1,.5)' }, at + .45)
      .to(h.querySelector('.col'), { opacity: 1, duration: .3, ease: 'power2.out' }, at)
      .to(h, { className: 'hex on', duration: 0 }, at + .05)
      .to(bd.querySelector('.nm'), { color: '#fff', duration: .3 }, at)
      .fromTo(h.querySelector('.ring'), { scale: .8, opacity: .9 }, { scale: 1.35, opacity: 0, duration: .7, ease: 'power2.out', immediateRender: false }, at)
      .fromTo(h.querySelector('.sh'), { backgroundPosition: '100% 0', opacity: 1 }, { backgroundPosition: '0% 0', opacity: 1, duration: .6, ease: 'power2.inOut', immediateRender: false }, at + .1).to(h.querySelector('.sh'), { opacity: 0, duration: .1 }, at + .7)
      .fromTo(h.querySelector('.tag'), { opacity: 0, y: 8, scale: .7 }, { opacity: 1, y: 0, scale: 1, duration: .4, ease: 'back.out(2)', immediateRender: false }, at + .25);
    sparks[i].forEach((s, k) => { const a = k / 8 * Math.PI * 2;
      tl.fromTo(s, { x: 0, y: 0, scale: 0 }, { x: Math.cos(a) * 90, y: Math.sin(a) * 90, scale: 1, duration: .5, ease: 'power3.out' }, at)
        .to(s, { scale: 0, duration: .25 }, at + .4); });
  };
  gsap.set('.cur', { x: 200, y: 600 });
  light(0, 1.0); light(1, 2.4); light(2, 3.8);
  // the locked badge: cursor nudges it, it shakes and stays grey
  tl.to('.cur', { x: 640 + 270 + 20, y: 350, duration: .5, ease: 'power3.inOut' }, 4.6)
    .to(hex[3], { x: -6, duration: .06, yoyo: true, repeat: 5, ease: 'sine.inOut' }, 5.1)
    .fromTo(hex[3].querySelector('.tag'), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .3 }, 5.15)
    .to(hex[3].querySelector('.tag'), { opacity: 0, duration: .2 }, 5.6)
    .to('.cur', { x: 1000, y: 700, opacity: 0, duration: .3 }, 5.55);
  tl.to('.wrap', { opacity: 0, y: -20, duration: .3, ease: 'power2.in' }, 5.7);
</script>
