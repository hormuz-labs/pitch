<!doctype html><meta charset="utf-8">
<title>Charging (Watch)</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#e9e9ee;display:grid;place-items:center}
  .watch{position:relative;width:360px;height:440px}
  .band{position:absolute;left:100px;width:160px;height:200px;background:#2a2a2e;border-radius:26px}
  .band.t{top:-150px}.band.b{bottom:-150px}
  .case{position:absolute;left:0;top:0;width:360px;height:440px;border-radius:96px;background:linear-gradient(160deg,#4a4a50,#1c1c20);box-shadow:0 30px 70px rgba(0,0,0,.35),inset 0 0 0 4px #5a5a62}
  .crown{position:absolute;right:-12px;top:150px;width:18px;height:64px;border-radius:8px;background:#3a3a40}
  .btnw{position:absolute;right:-8px;top:236px;width:12px;height:70px;border-radius:6px;background:#3a3a40}
  .scr{position:absolute;left:22px;top:22px;right:22px;bottom:22px;border-radius:78px;background:#000;overflow:hidden;display:grid;place-items:center}
  .time{position:absolute;top:34px;right:40px;color:#fff;font-size:20px;font-weight:500;letter-spacing:.02em}
  .ring{width:220px;height:220px}
  .ring circle{fill:none;stroke-width:16;stroke-linecap:round}
  .ring .bgc{stroke:#1c3a26}
  .ring .fgc{stroke:#30d158}
  .ring .glow{stroke:#30d158;stroke-width:26;opacity:.25;filter:blur(8px)}
  .pct{position:absolute;color:#30d158;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:54px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .bolt{position:absolute;bottom:52px;width:24px;height:34px}
  .bolt path{fill:#30d158}
  .halo{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(48,209,88,.35),transparent 65%)}
</style>
<div class="stage">
  <div class="watch">
    <div class="band t"></div><div class="band b"></div>
    <div class="case"><div class="crown"></div><div class="btnw"></div>
      <div class="scr">
        <div class="time">9:41</div>
        <div class="halo"></div>
        <svg class="ring" viewBox="0 0 220 220">
          <circle class="glow" cx="110" cy="110" r="94" transform="rotate(-90 110 110)"/>
          <circle class="bgc" cx="110" cy="110" r="94"/>
          <circle class="fgc" cx="110" cy="110" r="94" transform="rotate(-90 110 110)"/>
        </svg>
        <div class="pct">78%</div>
        <svg class="bolt" viewBox="0 0 24 34"><path d="M14 0L2 19h8l-2 15L22 13h-8z"/></svg>
      </div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 4 });
  const pct = document.querySelector('.pct'), s = { v: 78 };
  gsap.set('.fgc', { drawSVG: '0% 78%' });
  gsap.set('.glow', { drawSVG: '0% 78%' });
  tl.from('.watch', { y: 40, opacity: 0, duration: .8, ease: 'expo.out' }, 0);
  // the ring fills from empty to 78, a tick to 79 later
  tl.fromTo('.fgc', { drawSVG: '0% 0%' }, { drawSVG: '0% 78%', duration: 1.3, ease: 'expo.out' }, .2)
    .fromTo('.glow', { drawSVG: '0% 0%' }, { drawSVG: '0% 78%', duration: 1.3, ease: 'expo.out' }, .2)
    .fromTo(s, { v: 0 }, { v: 78, duration: 1.3, ease: 'expo.out', onUpdate: () => pct.textContent = Math.round(s.v) + '%' }, .2)
    .to('.fgc', { drawSVG: '0% 79%', duration: .3, ease: 'power2.out' }, 2.4)
    .to('.glow', { drawSVG: '0% 79%', duration: .3, ease: 'power2.out' }, 2.4)
    .to(s, { v: 79, duration: .3, onUpdate: () => pct.textContent = Math.round(s.v) + '%' }, 2.4);
  // the charging pulse: halo breathes, bolt throbs, ring glow swells — 4 beats per loop
  tl.fromTo('.halo', { scale: .7, opacity: .3 }, { scale: 1.15, opacity: 1, duration: .5, ease: 'sine.inOut', yoyo: true, repeat: 7 }, 0)
    .fromTo('.bolt', { scale: .9 }, { scale: 1.15, duration: .5, ease: 'sine.inOut', yoyo: true, repeat: 7 }, 0)
    .fromTo('.glow', { opacity: .15 }, { opacity: .45, duration: .5, ease: 'sine.inOut', yoyo: true, repeat: 7 }, 0)
    .fromTo('.pct', { scale: .98 }, { scale: 1.03, duration: .5, ease: 'sine.inOut', yoyo: true, repeat: 7 }, 0);
  // a light sweep across the case for life
  tl.fromTo('.case', { backgroundPosition: '0% 0%' }, { backgroundPosition: '100% 100%', duration: 4, ease: 'none' }, 0);
</script>
