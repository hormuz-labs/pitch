<!doctype html><meta charset="utf-8">
<title>Animated Color Palette</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f7f5f0;display:grid;place-items:center}
  .card{width:1040px;padding:44px 48px;border-radius:28px;background:#fff;box-shadow:0 30px 60px rgba(30,25,20,.12)}
  .top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:30px}
  .top h1{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:44px;letter-spacing:-.03em;color:#161412}
  .top span{font-size:15px;color:#8b867e;letter-spacing:.12em;text-transform:uppercase}
  .row{display:flex;gap:16px;height:300px}
  .sw{flex:1;position:relative;border-radius:18px;overflow:hidden;transform-origin:50% 100%}
  .fill{position:absolute;inset:0;transform-origin:50% 100%}
  .lbl{position:absolute;left:18px;bottom:18px;color:#fff;font-size:14px;line-height:1.5}
  .lbl b{display:block;font-weight:500;font-size:18px;letter-spacing:-.01em}
  .sw.dark .lbl{color:#161412}
  .sw:nth-child(1) .fill{background:#1b1f3a}.sw:nth-child(2) .fill{background:#5b6bff}.sw:nth-child(3) .fill{background:#ff6b8b}.sw:nth-child(4) .fill{background:#ffb84d}.sw:nth-child(5) .fill{background:#2fd3a5}.sw:nth-child(6) .fill{background:#efe9dc}
  .chip{position:absolute;right:14px;top:14px;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.7)}
  .sw.dark .chip{background:rgba(0,0,0,.25)}
</style>
<div class="stage">
  <div class="card">
    <div class="top"><h1>Acme brand palette</h1><span>v2.0 — core colors</span></div>
    <div class="row">
      <div class="sw"><div class="fill"></div><div class="chip"></div><div class="lbl"><b>Ink</b>#1B1F3A</div></div>
      <div class="sw"><div class="fill"></div><div class="chip"></div><div class="lbl"><b>Cobalt</b>#5B6BFF</div></div>
      <div class="sw"><div class="fill"></div><div class="chip"></div><div class="lbl"><b>Coral</b>#FF6B8B</div></div>
      <div class="sw"><div class="fill"></div><div class="chip"></div><div class="lbl"><b>Amber</b>#FFB84D</div></div>
      <div class="sw"><div class="fill"></div><div class="chip"></div><div class="lbl"><b>Mint</b>#2FD3A5</div></div>
      <div class="sw dark"><div class="fill"></div><div class="chip"></div><div class="lbl"><b>Sand</b>#EFE9DC</div></div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 3 });
  tl.from('.card', { y: 40, opacity: 0, duration: .7, ease: 'expo.out' }, 0)
    .from('.top > *', { y: 16, opacity: 0, duration: .6, stagger: .08, ease: 'power3.out' }, .1);
  // swatches rise in sequence: the fill grows from the bottom, then the label lands
  tl.from('.sw', { scaleY: 0, duration: .55, stagger: .12, ease: 'expo.out' }, .3)
    .from('.fill', { scaleY: .4, duration: .8, stagger: .12, ease: 'expo.out' }, .38)
    .from('.lbl', { y: 18, opacity: 0, duration: .5, stagger: .12, ease: 'power3.out' }, .6)
    .from('.chip', { scale: 0, duration: .4, stagger: .12, ease: 'back.out(3)' }, .7);
  // a wave of lift across the swatches mid-loop
  tl.to('.sw', { y: -14, duration: .3, stagger: .06, ease: 'power2.out' }, 1.55)
    .to('.sw', { y: 0, duration: .5, stagger: .06, ease: 'elastic.out(1,.5)' }, 1.85);
  // exit: swatches drop back down in reverse, card fades
  tl.to('.sw', { scaleY: 0, duration: .3, stagger: { each: .05, from: 'end' }, ease: 'power3.in' }, 2.45)
    .to('.card', { y: 30, opacity: 0, duration: .3, ease: 'power2.in' }, 2.72);
</script>
