<!doctype html><meta charset="utf-8">
<title>Social Media Icons</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f4f1ea;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:60px}
  .title{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-size:52px;font-weight:500;letter-spacing:-.03em;color:#17161a;overflow:hidden;line-height:1.2}
  .title span{display:block}
  .row{display:flex;gap:46px}
  .ic{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px}
  .disc{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;color:#fff;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.12)}
  .disc svg{width:56px;height:56px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
  .ring{position:absolute;inset:0;border-radius:50%;border:3px solid currentColor;opacity:0}
  .handle{font-size:20px;font-weight:500;color:#17161a;overflow:hidden;height:26px;line-height:26px}
  .handle span{display:block}
</style>
<div class="stage">
  <div class="title"><span>Follow along</span></div>
  <div class="row">
    <div class="ic"><div class="disc" style="background:#1d9bf0;color:#1d9bf0"><div class="ring"></div><svg viewBox="0 0 24 24"><path d="M4 6l8 7 8-7M4 6h16v12H4z"/></svg></div><div class="handle"><span>@acme</span></div></div>
    <div class="ic"><div class="disc" style="background:#e1306c;color:#e1306c"><div class="ring"></div><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="17" cy="7" r=".6"/></svg></div><div class="handle"><span>@acme.co</span></div></div>
    <div class="ic"><div class="disc" style="background:#ff0033;color:#ff0033"><div class="ring"></div><svg viewBox="0 0 24 24"><path d="M10 8.5v7l6-3.5z" fill="#fff"/><rect x="3" y="5" width="18" height="14" rx="4"/></svg></div><div class="handle"><span>Acme TV</span></div></div>
    <div class="ic"><div class="disc" style="background:#111;color:#111"><div class="ring"></div><svg viewBox="0 0 24 24"><path d="M14 4v11a3.5 3.5 0 1 1-3.5-3.5M14 4c0 2.5 2 4.5 4.5 4.5"/></svg></div><div class="handle"><span>@acmeofficial</span></div></div>
    <div class="ic"><div class="disc" style="background:#0a66c2;color:#0a66c2"><div class="ring"></div><svg viewBox="0 0 24 24"><path d="M7 10v7M7 7v.1M12 17v-4a2.5 2.5 0 0 1 5 0v4M12 10v7"/></svg></div><div class="handle"><span>Acme Inc.</span></div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 4;
  const tl = fx.timeline({ duration: D });
  tl.from('.title span', { yPercent: 110, duration: .7, ease: 'expo.out' }, 0)
    // coordinated pop: scale from 0 with rotation, back overshoot, left to right
    .from('.disc', { scale: 0, rotation: -60, duration: .7, stagger: .1, ease: 'back.out(2)' }, 0.25)
    .from('.disc svg', { scale: .4, opacity: 0, duration: .5, stagger: .1, ease: 'back.out(3)' }, 0.5)
    .from('.handle span', { yPercent: 110, duration: .5, stagger: .1, ease: 'expo.out' }, 0.7)
    // ripple ring across the row
    .fromTo('.ring', { scale: 1, opacity: .7 }, { scale: 1.55, opacity: 0, duration: .8, stagger: .1, ease: 'power2.out' }, 1.3)
    // a nudge wave
    .to('.disc', { y: -12, duration: .3, stagger: .08, ease: 'power2.out' }, 2.2)
    .to('.disc', { y: 0, duration: .5, stagger: .08, ease: 'bounce.out' }, 2.5)
    // out
    .to('.handle span', { yPercent: -110, duration: .3, stagger: -.05, ease: 'power2.in' }, 3.35)
    .to('.disc', { scale: 0, rotation: 60, duration: .35, stagger: -.06, ease: 'back.in(1.6)' }, 3.4)
    .to('.title span', { yPercent: -110, duration: .35, ease: 'power3.in' }, 3.6);
</script>
