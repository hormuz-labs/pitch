<!doctype html><meta charset="utf-8">
<title>Progress Donut</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#eef0f4;display:flex;align-items:center;justify-content:center}
  .card{width:860px;height:440px;border-radius:36px;background:#fff;box-shadow:0 24px 70px rgba(20,30,60,.10);display:flex;align-items:center;padding:0 70px;gap:70px}
  .donut{width:300px;height:300px;position:relative;flex:none}
  .donut svg{position:absolute;inset:0;overflow:visible}
  .ring{fill:none;stroke:#eceef3;stroke-width:34}
  .seg{fill:none;stroke-width:34;stroke-linecap:round}
  .s1{stroke:#3b5bff}.s2{stroke:#8ea2ff}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .num{font-size:66px;font-weight:500;letter-spacing:-.04em;color:#0f1424;line-height:1}
  .num small{font-size:30px;letter-spacing:0}
  .sub{font-size:16px;color:#8a90a3;margin-top:8px;text-transform:uppercase;letter-spacing:.14em}
  .side{flex:1}
  .side h2{font-size:34px;font-weight:500;letter-spacing:-.02em;color:#0f1424}
  .side p{color:#7b8194;font-size:18px;margin:6px 0 30px}
  .row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid #eef0f4;font-size:19px;color:#2b3042}
  .row i{width:14px;height:14px;border-radius:4px;background:#3b5bff}
  .row b{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums}
</style>
<div class="stage">
  <div class="card">
    <div class="donut">
      <svg viewBox="0 0 300 300">
        <circle class="ring" cx="150" cy="150" r="118"/>
        <g style="transform-origin:150px 150px;transform:rotate(-90deg)">
          <circle class="seg s2" cx="150" cy="150" r="118"/>
          <circle class="seg s1" cx="150" cy="150" r="118"/>
        </g>
      </svg>
      <div class="center"><div class="num"><span class="n">0</span><small>%</small></div><div class="sub">of goal</div></div>
    </div>
    <div class="side">
      <h2>Quarterly target</h2>
      <p>Northwind · Q3 pipeline</p>
      <div class="row"><i></i>Closed won<b class="v1">$0</b></div>
      <div class="row"><i style="background:#8ea2ff"></i>Committed<b class="v2">$0</b></div>
      <div class="row"><i style="background:#eceef3"></i>Remaining<b class="v3">$1.20M</b></div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 4, C = 2 * Math.PI * 118;
  const tl = fx.timeline({ duration: D });
  const s1 = document.querySelector('.s1'), s2 = document.querySelector('.s2');
  const nEl = document.querySelector('.n'), v1 = document.querySelector('.v1'), v2 = document.querySelector('.v2'), v3 = document.querySelector('.v3');
  const st = { p1: 0, p2: 0 };
  const fmt = v => '$' + (v).toFixed(2) + 'M';
  const draw = () => {
    s1.setAttribute('stroke-dasharray', `${Math.max(0, st.p1) * C} ${C}`);
    // the second segment sits behind, extending past the first
    s2.setAttribute('stroke-dasharray', `${Math.max(0, st.p1 + st.p2) * C} ${C}`);
    const pct = Math.round((st.p1 + st.p2) * 100);
    nEl.textContent = pct;
    v1.textContent = fmt(st.p1 * 1.2);
    v2.textContent = fmt(st.p2 * 1.2);
    v3.textContent = fmt((1 - st.p1 - st.p2) * 1.2);
  };
  draw();
  tl.to(st, { p1: 0.58, duration: 1.6, ease: 'expo.out', onUpdate: draw }, 0.15)
    .to(st, { p2: 0.22, duration: 1.0, ease: 'expo.out', onUpdate: draw }, 1.2)
    .from('.row', { x: 30, opacity: 0, duration: .6, stagger: .12, ease: 'power3.out' }, 0.2)
    .from('.side h2, .side p', { y: 14, opacity: 0, duration: .5, stagger: .08, ease: 'power3.out' }, 0.05)
    .fromTo('.donut', { scale: .96 }, { scale: 1.02, duration: 1.0, ease: 'back.out(3)' }, 0.15)
    .to('.donut', { scale: 1, duration: .6, ease: 'power2.inOut' }, 1.2)
    // unwind for the loop
    .to(st, { p2: 0, duration: .5, ease: 'power3.in', onUpdate: draw }, 3.2)
    .to(st, { p1: 0, duration: .55, ease: 'expo.inOut', onUpdate: draw }, 3.4)
    .to('.row', { x: 30, opacity: 0, duration: .3, stagger: -.05, ease: 'power2.in' }, 3.55)
    .to('.side h2, .side p', { y: 14, opacity: 0, duration: .3, ease: 'power2.in' }, 3.65)
    .set('.row, .side h2, .side p', { x: 0, y: 0, opacity: 1 }, 3.999);
</script>
