<!doctype html><meta charset="utf-8">
<title>The Vault: Payment Notifications</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101216;display:flex;align-items:flex-start;justify-content:center;padding-top:150px}
  .bgc{position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,#23283b,transparent 60%)}
  .head{position:absolute;top:70px;left:0;right:0;text-align:center;color:#8b90a3;font-size:15px;letter-spacing:.18em;text-transform:uppercase}
  .stack{position:relative;width:600px;height:400px}
  .card{position:absolute;left:0;right:0;top:0;height:104px;border-radius:26px;background:#fff;display:flex;align-items:center;gap:18px;padding:0 24px;box-shadow:0 20px 50px rgba(0,0,0,.35);transform-origin:top center;will-change:transform}
  .ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;flex:none;color:#fff;font-weight:500;font-size:24px}
  .t{flex:1;min-width:0}
  .t .h{display:flex;justify-content:space-between;font-size:15px}
  .t .h b{font-weight:500;color:#111}.t .h span{color:#8a8f9e}
  .t .m{font-size:18px;color:#1a1d26;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .amt{font-size:22px;font-weight:500;color:#16a34a;font-variant-numeric:tabular-nums;flex:none}
  .amt.neg{color:#111}
  .tot{position:absolute;bottom:90px;left:0;right:0;text-align:center;color:#fff}
  .tot span{font-size:14px;color:#8b90a3;letter-spacing:.14em;text-transform:uppercase}
  .tot b{display:block;font-size:54px;font-weight:500;letter-spacing:-.04em;margin-top:6px;font-variant-numeric:tabular-nums}
</style>
<div class="stage">
  <div class="bgc"></div>
  <div class="head">Northwind Pay · Activity</div>
  <div class="stack">
    <div class="card" data-t="0.4" data-v="1240"><div class="ic" style="background:#3b82f6">A</div><div class="t"><div class="h"><b>Acme Corp</b><span>now</span></div><div class="m">Invoice INV-2210 paid</div></div><div class="amt">+$1,240.00</div></div>
    <div class="card" data-t="1.7" data-v="-18.5"><div class="ic" style="background:#f59e0b">☕</div><div class="t"><div class="h"><b>Card · 4821</b><span>now</span></div><div class="m">Blue Bottle Coffee</div></div><div class="amt neg">−$18.50</div></div>
    <div class="card" data-t="3.0" data-v="640"><div class="ic" style="background:#8b5cf6">G</div><div class="t"><div class="h"><b>Globex</b><span>now</span></div><div class="m">Subscription renewed</div></div><div class="amt">+$640.00</div></div>
    <div class="card" data-t="4.3" data-v="2100"><div class="ic" style="background:#14b8a6">I</div><div class="t"><div class="h"><b>Initech</b><span>now</span></div><div class="m">Transfer received</div></div><div class="amt">+$2,100.00</div></div>
    <div class="card" data-t="5.6" data-v="-249"><div class="ic" style="background:#ec4899">N</div><div class="t"><div class="h"><b>Card · 4821</b><span>now</span></div><div class="m">Northwind Market</div></div><div class="amt neg">−$249.00</div></div>
  </div>
  <div class="tot"><span>Net today</span><b class="n">$0.00</b></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 9, GAP = 118, MAX = 3;
  const tl = fx.timeline({ duration: D });
  const cards = [...document.querySelectorAll('.card')];
  const n = document.querySelector('.n'), st = { v: 0 };
  const draw = () => n.textContent = (st.v < 0 ? '−' : '') + '$' + Math.abs(st.v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  draw();
  gsap.set(cards, { opacity: 0, y: -90, scale: .9 });
  cards.forEach((c, i) => { c.style.zIndex = 10 - i; });
  let sum = 0;
  cards.forEach((c, i) => {
    const t = +c.dataset.t;
    // newest drops in on top with a spring
    tl.to(c, { opacity: 1, y: 0, scale: 1, duration: .7, ease: 'back.out(1.7)' }, t);
    // the ones below shift down; beyond the visible stack they tuck under and fade
    for (let j = 0; j < i; j++) {
      const depth = i - j;
      if (depth < MAX) tl.to(cards[j], { y: depth * GAP, scale: 1 - depth * .02, opacity: 1 - depth * .12, duration: .6, ease: 'power3.out' }, t);
      else tl.to(cards[j], { y: MAX * GAP - 30, scale: .9, opacity: 0, duration: .5, ease: 'power2.in' }, t);
    }
    sum += +c.dataset.v;
    tl.to(st, { v: sum, duration: .8, ease: 'expo.out', onUpdate: draw }, t + .15);
    tl.fromTo(c.querySelector('.amt'), { scale: 1.25 }, { scale: 1, duration: .5, ease: 'back.out(2)' }, t + .2);
  });
  // clear for the loop
  tl.to(cards, { opacity: 0, y: '-=60', duration: .35, stagger: .05, ease: 'power2.in' }, 7.7)
    .to(st, { v: 0, duration: .6, ease: 'power3.inOut', onUpdate: draw }, 7.9)
    .set(cards, { y: -90, scale: .9 }, 8.99);
</script>
