<!doctype html><meta charset="utf-8">
<title>Instagram Story: 4 Images</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f3efe8;color:#111}
  .tile{position:absolute;overflow:hidden;border-radius:28px;background:#ddd;will-change:transform}
  .tile .img{position:absolute;inset:-6%;background-size:cover;background-position:center}
  .t1 .img{background-image:url("../../../assets/backgrounds/sunset.png")}
  .t2 .img{background-image:url("../../../assets/backgrounds/ocean.png")}
  .t3 .img{background-image:url("../../../assets/backgrounds/aurora.png")}
  .t4 .img{background-image:url("../../../assets/backgrounds/sunset.png");filter:hue-rotate(160deg) saturate(1.1)}
  .t1{left:70px;top:300px;width:460px;height:640px}
  .t2{left:550px;top:300px;width:460px;height:640px}
  .t3{left:70px;top:960px;width:460px;height:640px}
  .t4{left:550px;top:960px;width:460px;height:640px}
  .num{position:absolute;left:24px;top:22px;font-size:26px;font-weight:500;color:#fff;letter-spacing:.06em;text-shadow:0 2px 12px rgba(0,0,0,.35)}
  .head{position:absolute;left:70px;top:130px;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:84px;letter-spacing:-.04em;line-height:1;overflow:hidden}
  .head span{display:block}
  .foot{position:absolute;left:70px;right:70px;top:1660px;display:flex;justify-content:space-between;align-items:center;font-size:30px;letter-spacing:.02em}
  .foot .pill{padding:16px 30px;border:2px solid #111;border-radius:999px;font-weight:500}
  .dots{position:absolute;left:70px;right:70px;top:60px;display:flex;gap:8px}
  .dots i{flex:1;height:6px;border-radius:3px;background:rgba(0,0,0,.14);overflow:hidden;position:relative}
  .dots i b{position:absolute;left:0;top:0;bottom:0;width:100%;background:#111;transform-origin:left;transform:scaleX(0)}
</style>
<div class="stage">
  <div class="dots"><i><b class="d1"></b></i><i><b class="d2"></b></i><i><b class="d3"></b></i><i><b class="d4"></b></i></div>
  <div class="head"><span class="hl">New arrivals</span></div>
  <div class="tile t1"><div class="img"></div><div class="num">01</div></div>
  <div class="tile t2"><div class="img"></div><div class="num">02</div></div>
  <div class="tile t3"><div class="img"></div><div class="num">03</div></div>
  <div class="tile t4"><div class="img"></div><div class="num">04</div></div>
  <div class="foot"><span class="fl">Acme Studio — Spring collection</span><span class="pill">Shop now</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  // story progress bar drives the whole loop
  tl.to('.d1', { scaleX: 1, duration: 1, ease: 'none' }, 0)
    .to('.d2', { scaleX: 1, duration: 1, ease: 'none' }, 1)
    .to('.d3', { scaleX: 1, duration: 1, ease: 'none' }, 2)
    .to('.d4', { scaleX: 1, duration: 1, ease: 'none' }, 3);
  // header
  tl.from('.hl', { yPercent: 110, duration: 0.7, ease: 'expo.out' }, 0.1)
    .from('.fl', { opacity: 0, x: -30, duration: 0.6, ease: 'power3.out' }, 0.5)
    .from('.pill', { opacity: 0, scale: 0.6, duration: 0.6, ease: 'back.out(2)' }, 0.6);
  // tiles fly in from four edges
  tl.from('.t1', { x: -700, rotation: -8, duration: 0.8, ease: 'expo.out' }, 0.05)
    .from('.t2', { y: -900, rotation: 6, duration: 0.8, ease: 'expo.out' }, 0.15)
    .from('.t3', { y: 900, rotation: -6, duration: 0.8, ease: 'expo.out' }, 0.25)
    .from('.t4', { x: 700, rotation: 8, duration: 0.8, ease: 'expo.out' }, 0.35);
  // slow drift inside every tile, the whole loop
  tl.fromTo('.tile .img', { scale: 1.0, xPercent: -2 }, { scale: 1.08, xPercent: 2, duration: 4, ease: 'none' }, 0);
  // layout shift: tile 1 takes the top, the rest line up below
  tl.to('.t1', { left: 70, top: 300, width: 940, height: 900, duration: 0.9, ease: 'expo.inOut' }, 1.5)
    .to('.t2', { left: 70, top: 1230, width: 296, height: 370, duration: 0.9, ease: 'expo.inOut' }, 1.5)
    .to('.t3', { left: 392, top: 1230, width: 296, height: 370, duration: 0.9, ease: 'expo.inOut' }, 1.55)
    .to('.t4', { left: 714, top: 1230, width: 296, height: 370, duration: 0.9, ease: 'expo.inOut' }, 1.6);
  // a second shift: tile 2 takes the feature, 1 goes to the row
  tl.to('.t2', { left: 70, top: 300, width: 940, height: 900, duration: 0.9, ease: 'expo.inOut' }, 2.6)
    .to('.t1', { left: 70, top: 1230, width: 296, height: 370, duration: 0.9, ease: 'expo.inOut' }, 2.6);
  // exit: everything snaps out the way it came
  tl.to('.tile', { y: -1400, duration: 0.5, ease: 'expo.in', stagger: 0.05 }, 3.45)
    .to('.hl', { yPercent: -110, duration: 0.35, ease: 'expo.in' }, 3.6)
    .to('.foot', { opacity: 0, y: 30, duration: 0.3, ease: 'power2.in' }, 3.65);
</script>
