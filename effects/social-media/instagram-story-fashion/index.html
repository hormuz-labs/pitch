<!doctype html><meta charset="utf-8">
<title>Instagram Story: Fashion</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#ece7df;color:#141414}
  .photo{position:absolute;left:0;top:520px;width:1080px;height:1400px;overflow:hidden}
  .photo .img{position:absolute;inset:-6%;background:url("../../../assets/backgrounds/sunset.png") center/cover;filter:grayscale(.35) contrast(1.1)}
  .photo{clip-path:inset(0 0 0 0)}
  .panel{position:absolute;left:0;top:520px;width:1080px;height:1400px;background:#ece7df;transform-origin:top}
  .season{position:absolute;left:70px;top:150px;font-size:28px;letter-spacing:.32em;text-transform:uppercase;font-weight:500}
  .big{position:absolute;left:70px;right:70px;top:1030px;font-family:"Sorts Mill Goudy",Georgia,serif;font-size:220px;line-height:.88;letter-spacing:-.03em;color:#fff;mix-blend-mode:difference}
  .big .row{overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
  .big .ln{display:block}
  .big .it{font-style:italic}
  .num{position:absolute;right:70px;top:150px;font-family:"Sorts Mill Goudy",serif;font-size:40px;letter-spacing:.06em}
  .vline{position:absolute;left:70px;top:230px;width:2px;height:250px;background:#141414;transform-origin:top}
  .side{position:absolute;left:100px;top:236px;font-size:24px;letter-spacing:.22em;text-transform:uppercase;opacity:.85;line-height:1.6}
  .side b{display:block;font-family:"Sorts Mill Goudy",serif;font-weight:400;font-size:56px;letter-spacing:0;text-transform:none;margin-top:14px}
  .credit{position:absolute;left:70px;right:70px;top:1660px;display:flex;justify-content:space-between;align-items:center;font-size:26px;letter-spacing:.12em;text-transform:uppercase}
  .credit .rule{flex:1;height:2px;background:#141414;margin:0 40px;transform-origin:left}
  .swatch{position:absolute;right:70px;top:1040px;width:280px;height:380px;overflow:hidden;background:#111}
  .swatch .img{position:absolute;inset:-10%;background:url("../../../assets/backgrounds/ocean.png") center/cover;filter:contrast(1.15)}
  .swatch .veil{position:absolute;inset:0;background:#ece7df;transform-origin:bottom}
</style>
<div class="stage">
  <div class="photo"><div class="img"></div></div>
  <div class="panel"></div>
  <div class="season">Acme Atelier</div>
  <div class="num">No. 07</div>
  <div class="vline"></div>
  <div class="side">Autumn / Winter<b>twenty-six</b></div>
  <div class="swatch"><div class="img"></div><div class="veil"></div></div>
  <div class="big">
    <div class="row"><span class="ln">Form</span></div>
    <div class="row"><span class="ln it">follows</span></div>
    <div class="row"><span class="ln">Fabric</span></div>
  </div>
  <div class="credit"><span class="cl">Look 03</span><span class="rule"></span><span class="cr">Shot in Marseille</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  // the photo: a slow push in, the whole loop
  tl.fromTo('.photo .img', { scale: 1.0, yPercent: 2 }, { scale: 1.1, yPercent: -2, duration: 4, ease: 'none' }, 0);
  // the panel lifts off the photo like a page
  tl.to('.panel', { scaleY: 0, duration: 1.0, ease: 'expo.inOut' }, 0.1);
  // hierarchy: small type first, the rule, then the headline arrives big
  tl.from('.season', { opacity: 0, x: -30, duration: 0.6, ease: 'power3.out' }, 0.3)
    .from('.num', { opacity: 0, x: 30, duration: 0.6, ease: 'power3.out' }, 0.35)
    .from('.vline', { scaleY: 0, duration: 0.9, ease: 'expo.out' }, 0.5)
    .from('.side', { opacity: 0, y: -30, duration: 0.7, ease: 'power3.out' }, 0.7);
  tl.from('.big .ln', { yPercent: 120, duration: 0.9, ease: 'expo.out', stagger: 0.14 }, 0.8);
  tl.from('.swatch', { x: 200, duration: 0.8, ease: 'move' }, 1.1)
    .to('.swatch .veil', { scaleY: 0, duration: 0.7, ease: 'expo.inOut' }, 1.3)
    .fromTo('.swatch .img', { scale: 1.15 }, { scale: 1.0, duration: 2.5, ease: 'none' }, 1.3);
  tl.from('.credit .rule', { scaleX: 0, duration: 0.7, ease: 'expo.out' }, 1.6)
    .from('.cl', { opacity: 0, x: -20, duration: 0.5 }, 1.6)
    .from('.cr', { opacity: 0, x: 20, duration: 0.5 }, 1.75);
  // the italic word slides sideways as an editorial flourish
  tl.to('.big .it', { x: 120, duration: 0.7, ease: 'expo.inOut' }, 2.3);
  // exit: the page closes back down over the photo
  tl.to('.big .ln', { yPercent: -120, duration: 0.45, ease: 'expo.in', stagger: 0.06 }, 3.3)
    .to('.season, .num, .side, .credit, .swatch', { opacity: 0, duration: 0.3, stagger: 0.03 }, 3.4)
    .to('.vline', { scaleY: 0, transformOrigin: 'bottom', duration: 0.4, ease: 'expo.in' }, 3.4)
    .to('.panel', { scaleY: 1, transformOrigin: 'bottom', duration: 0.5, ease: 'expo.inOut' }, 3.5);
</script>
