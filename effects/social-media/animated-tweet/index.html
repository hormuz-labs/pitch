<!doctype html><meta charset="utf-8">
<title>Animated Tweet</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0f1419;display:flex;align-items:center;justify-content:center}
  .glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(29,155,240,.28),rgba(29,155,240,0) 65%);left:90px;top:90px}
  .card{position:relative;width:760px;padding:34px 38px 30px;background:#fff;border-radius:28px;box-shadow:0 40px 90px rgba(0,0,0,.5);color:#0f1419;transform-origin:50% 60%}
  .head{display:flex;align-items:center;gap:16px}
  .avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#ff7a59,#ffd23f);position:relative;overflow:hidden;flex:none}
  .avatar::after{content:"";position:absolute;left:18px;top:14px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 40px 0 12px #fff}
  .who{display:flex;flex-direction:column;line-height:1.15}
  .name{font-weight:500;font-size:26px;display:flex;align-items:center;gap:6px}
  .badge{width:22px;height:22px;border-radius:50%;background:#1d9bf0;display:inline-block;position:relative}
  .badge::after{content:"";position:absolute;left:7px;top:4px;width:6px;height:10px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
  .handle{font-size:22px;color:#536471}
  .x{margin-left:auto;font-size:34px;font-weight:500;letter-spacing:-.05em}
  .body{margin-top:24px;font-size:34px;line-height:1.32;letter-spacing:-.01em}
  .body .w{display:inline-block;white-space:pre}
  .body .hl{color:#1d9bf0}
  .time{margin-top:22px;color:#536471;font-size:21px}
  .rule{height:1px;background:#eff3f4;margin:18px 0}
  .stats{display:flex;gap:38px;color:#536471;font-size:22px}
  .stats b{color:#0f1419;font-weight:500}
  .actions{display:flex;justify-content:space-between;padding:0 30px;margin-top:18px;color:#536471;font-size:22px}
  .act{display:flex;align-items:center;gap:8px}
  .ico{width:24px;height:24px;border:2.5px solid currentColor;border-radius:8px}
  .ico.rt{border-radius:4px;transform:skewX(-10deg)}
  .heart{position:relative;width:24px;height:24px}
  .heart::before,.heart::after{content:"";position:absolute;top:0;left:12px;width:12px;height:20px;border-radius:12px 12px 0 0;background:currentColor;transform:rotate(-45deg);transform-origin:0 100%}
  .heart::after{left:0;transform:rotate(45deg);transform-origin:100% 100%}
  .act.liked{color:#f91880}
  .burst{position:absolute;left:12px;top:12px;width:4px;height:4px}
  .burst i{position:absolute;left:0;top:0;width:6px;height:6px;border-radius:50%;background:#f91880}
</style>
<div class="stage">
  <div class="glow"></div>
  <div class="card">
    <div class="head">
      <div class="avatar"></div>
      <div class="who"><span class="name">Maya Chen <i class="badge"></i></span><span class="handle">@mayabuilds</span></div>
      <div class="x">𝕏</div>
    </div>
    <div class="body" id="body">Just switched our whole team to Northwind. Onboarding took 10 minutes and the weekly report writes itself now. <span class="hl">#shipfaster</span></div>
    <div class="time">9:41 AM · Mar 12, 2026</div>
    <div class="rule"></div>
    <div class="stats"><span><b id="rt">0</b> Reposts</span><span><b id="qt">0</b> Quotes</span><span><b id="lk">0</b> Likes</span></div>
    <div class="rule"></div>
    <div class="actions">
      <div class="act"><i class="ico"></i>128</div>
      <div class="act"><i class="ico rt"></i>1.2K</div>
      <div class="act" id="like"><span style="position:relative"><i class="heart"></i><span class="burst" id="burst"></span></span><span id="likeN">4,180</span></div>
      <div class="act"><i class="ico"></i></div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  // split words
  const body = document.getElementById('body');
  const html = [];
  body.childNodes.forEach(n => {
    if (n.nodeType === 3) n.textContent.split(/(\s+)/).forEach(w => { if (w.trim()) html.push(`<span class="w">${w} </span>`); });
    else html.push(`<span class="w hl">${n.textContent}</span>`);
  });
  body.innerHTML = html.join('');
  const burst = document.getElementById('burst');
  for (let i = 0; i < 8; i++) burst.insertAdjacentHTML('beforeend', '<i></i>');

  const tl = fx.timeline({ duration: 5 });
  tl.from('.card', { y: 120, scale: .9, opacity: 0, duration: .9, ease: 'expo.out' }, 0)
    .from('.glow', { scale: .4, opacity: 0, duration: 1.4, ease: 'power2.out' }, 0)
    .from('.avatar', { scale: 0, duration: .6, ease: 'back.out(2)' }, .35)
    .from('.who > *', { x: -20, opacity: 0, stagger: .08, duration: .5, ease: 'power3.out' }, .45)
    .from('.badge', { scale: 0, duration: .5, ease: 'back.out(3)' }, .7)
    .from('.body .w', { y: 18, opacity: 0, stagger: .028, duration: .45, ease: 'power3.out' }, .55)
    .from('.time,.rule,.stats,.actions', { opacity: 0, y: 10, stagger: .08, duration: .5, ease: 'power2.out' }, 1.2);
  const counters = { rt: 0, qt: 0, lk: 0 };
  tl.to(counters, { rt: 312, qt: 48, lk: 4180, duration: 1.4, ease: 'power3.out', onUpdate() {
    document.getElementById('rt').textContent = Math.round(counters.rt);
    document.getElementById('qt').textContent = Math.round(counters.qt);
    document.getElementById('lk').textContent = Math.round(counters.lk).toLocaleString('en-US');
  } }, 1.4);
  // the like tap
  tl.call(() => document.getElementById('like').classList.add('liked'), null, 2.6)
    .call(() => document.getElementById('like').classList.remove('liked'), null, 4.6)
    .fromTo('.heart', { scale: 1 }, { scale: 1.45, duration: .18, ease: 'power2.out' }, 2.6)
    .to('.heart', { scale: 1, duration: .5, ease: 'elastic.out(1,.4)' }, 2.78)
    .call(() => document.getElementById('likeN').textContent = '4,181', null, 2.65)
    .call(() => document.getElementById('likeN').textContent = '4,180', null, 4.6)
    .fromTo('.burst i', { x: 0, y: 0, opacity: 1, scale: 1 }, { x: i => Math.cos(i * Math.PI / 4) * 30, y: i => Math.sin(i * Math.PI / 4) * 30, opacity: 0, scale: .3, duration: .6, ease: 'power2.out' }, 2.6)
    // subtle float while holding
    .to('.card', { y: -8, duration: 2, ease: 'sine.inOut' }, 1.5).to('.card', { y: 0, duration: 1.4, ease: 'sine.inOut' }, 3.5)
    // out
    .to('.card', { y: -80, scale: .94, opacity: 0, duration: .5, ease: 'expo.in' }, 4.5)
    .to('.glow', { opacity: 0, duration: .5 }, 4.5);
</script>
