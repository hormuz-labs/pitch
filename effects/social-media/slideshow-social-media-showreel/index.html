<!doctype html><meta charset="utf-8">
<title>Slideshow: Social Media Showreel</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0c0c0e;color:#fff}
  .deck{position:absolute;inset:0}
  .slide{position:absolute;inset:0;overflow:hidden;opacity:0}
  .slide .img{position:absolute;inset:-8%;background-size:cover;background-position:center}
  .s1 .img{background-image:url("../../../assets/backgrounds/sunset.png")}
  .s2 .img{background-image:url("../../../assets/backgrounds/ocean.png")}
  .s3 .img{background-image:url("../../../assets/backgrounds/aurora.png")}
  .s4 .img{background-image:url("../../../assets/backgrounds/sunset.png");filter:hue-rotate(180deg)}
  .s5 .img{background-image:url("../../../assets/backgrounds/ocean.png");filter:hue-rotate(-100deg) saturate(1.3)}
  .slide .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.7))}
  .slide .cap{position:absolute;left:80px;bottom:120px;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:96px;letter-spacing:-.04em;line-height:.95;overflow:hidden}
  .slide .cap span{display:block}
  .slide .sub{position:absolute;left:80px;bottom:80px;font-size:24px;letter-spacing:.24em;text-transform:uppercase;opacity:.8}
  .wipe{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left}
  .hud{position:absolute;left:80px;right:80px;top:70px;display:flex;justify-content:space-between;font-size:22px;letter-spacing:.3em;text-transform:uppercase;opacity:.8}
  .prog{position:absolute;left:80px;right:80px;top:120px;display:flex;gap:10px}
  .prog i{flex:1;height:3px;background:rgba(255,255,255,.25);position:relative;overflow:hidden}
  .prog i b{position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(0)}
</style>
<div class="stage">
  <div class="deck">
    <div class="slide s1"><div class="img"></div><div class="shade"></div><div class="cap"><span>Ember</span></div><div class="sub">Campaign · 01</div></div>
    <div class="slide s2"><div class="img"></div><div class="shade"></div><div class="cap"><span>Tide</span></div><div class="sub">Platform · 02</div></div>
    <div class="slide s3"><div class="img"></div><div class="shade"></div><div class="cap"><span>Aurora</span></div><div class="sub">Identity · 03</div></div>
    <div class="slide s4"><div class="img"></div><div class="shade"></div><div class="cap"><span>Dusk</span></div><div class="sub">Film · 04</div></div>
    <div class="slide s5"><div class="img"></div><div class="shade"></div><div class="cap"><span>Harbor</span></div><div class="sub">Editorial · 05</div></div>
  </div>
  <div class="wipe"></div>
  <div class="hud"><span>Northwind Studio</span><span>Showreel</span></div>
  <div class="prog"><i><b class="p1"></b></i><i><b class="p2"></b></i><i><b class="p3"></b></i><i><b class="p4"></b></i><i><b class="p5"></b></i></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 10, N = 5, SEG = D / N;
  const tl = fx.timeline({ duration: D });
  gsap.set('.s1', { opacity: 1 });
  tl.from('.hud', { opacity: 0, y: -20, duration: 0.6 }, 0);
  // slow drift on every slide, a different direction each
  const drifts = [{ xPercent: 3, scale: 1.08 }, { yPercent: -3, scale: 1.06 }, { xPercent: -3, scale: 1.1 }, { yPercent: 3, scale: 1.05 }, { xPercent: 3, yPercent: -2, scale: 1.08 }];
  for (let i = 0; i < N; i++) {
    const s = `.s${i + 1}`, at = i * SEG;
    tl.fromTo(s + ' .img', { xPercent: 0, yPercent: 0, scale: 1 }, { ...drifts[i], duration: SEG + 0.8, ease: 'none' }, at - 0.4 < 0 ? 0 : at - 0.4);
    tl.fromTo(`.p${i + 1}`, { scaleX: 0 }, { scaleX: 1, duration: SEG, ease: 'none' }, at);
    // caption arrives after the transition settles
    tl.fromTo(s + ' .cap span', { yPercent: 110 }, { yPercent: 0, duration: 0.8, ease: 'expo.out', immediateRender: false }, at + 0.3)
      .fromTo(s + ' .sub', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out', immediateRender: false }, at + 0.5)
      .to(s + ' .cap span', { yPercent: -110, duration: 0.4, ease: 'expo.in' }, at + SEG - 0.5)
      .to(s + ' .sub', { opacity: 0, duration: 0.3 }, at + SEG - 0.4);
    // the transition: a white wipe crosses, the next slide is revealed beneath it with a push
    const nx = `.s${(i + 1) % N + 1}`, tt = at + SEG - 0.45;
    tl.fromTo('.wipe', { scaleX: 0, transformOrigin: 'left' }, { scaleX: 1, duration: 0.4, ease: 'expo.inOut', immediateRender: false }, tt)
      .set(nx, { opacity: 1 }, tt + 0.4)
      .set(s, { opacity: 0 }, tt + 0.4)
      .fromTo(nx, { x: 120 }, { x: 0, duration: 0.7, ease: 'expo.out', immediateRender: false }, tt + 0.4)
      .to('.wipe', { scaleX: 0, transformOrigin: 'right', duration: 0.4, ease: 'expo.inOut' }, tt + 0.4);
  }
  // reset the progress bars for the loop
  tl.set('.prog b', { scaleX: 0 }, D - 0.02);
</script>
