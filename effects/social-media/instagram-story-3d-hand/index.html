<!doctype html><meta charset="utf-8">
<title>Instagram Story: 3D Hand</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#ffd23f}
  .bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,#ffe27a,#ffc41f 70%)}
  .ttl{position:absolute;left:0;right:0;top:170px;text-align:center;font:500 108px/1 "Sharp Grotesk","Atlas Grotesk",sans-serif;letter-spacing:-.04em;color:#161616;text-transform:uppercase}
  .ttl .l{display:block;overflow:hidden}.ttl .w{display:inline-block}
  .card{position:absolute;left:150px;top:640px;width:780px;height:640px;border-radius:40px;background:#fff;box-shadow:0 50px 100px rgba(120,80,0,.25);padding:46px;color:#161616;transform-origin:50% 50%}
  .card h3{font:500 40px/1.1 "Sharp Grotesk","Atlas Grotesk",sans-serif;letter-spacing:-.03em}
  .card p{margin-top:12px;font:400 24px/1.4 "Atlas Grotesk",sans-serif;color:#777}
  .swatches{display:flex;gap:18px;margin-top:34px}
  .sw{width:86px;height:86px;border-radius:50%;border:4px solid transparent;position:relative}
  .sw i{position:absolute;inset:4px;border-radius:50%}
  .sw.on{border-color:#161616}
  .price{margin-top:38px;font:500 56px "Sharp Grotesk","Atlas Grotesk",sans-serif;letter-spacing:-.03em}
  .btn{position:absolute;left:46px;right:46px;bottom:46px;height:104px;border-radius:26px;background:#161616;color:#fff;font:500 30px/104px "Atlas Grotesk",sans-serif;text-align:center;letter-spacing:.02em;transform-origin:50% 50%}
  .ring{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:4px solid #161616;opacity:0}
  canvas{position:absolute;inset:0;display:block}
  .sub{position:absolute;left:0;right:0;bottom:150px;text-align:center;font:400 26px "Atlas Grotesk",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#161616}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="ttl"><span class="l"><span class="w">Tap to</span></span><span class="l"><span class="w">try it</span></span></div>
  <div class="card" id="card">
    <h3>Acme Runner 2</h3><p>Lightweight. Grippy. Ready for rain.</p>
    <div class="swatches"><div class="sw on" id="s0"><i style="background:#ff7a59"></i></div><div class="sw" id="s1"><i style="background:#2f6bff"></i></div><div class="sw" id="s2"><i style="background:#1fb37a"></i></div></div>
    <div class="price" id="price">$129</div>
    <div class="btn" id="btn">Add to bag<div class="ring" id="ring"></div></div>
  </div>
  <div class="sub">Acme · Interactive demo</div>
  <canvas id="c" width="1080" height="1920"></canvas>
</div>
<script type="importmap">{"imports":{"three":"../../../assets/three/three.module.min.js"}}</script>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script type="module">
import * as THREE from 'three';
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.setClearColor(0, 0);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(35, W / H, .1, 100); cam.position.set(0, 0, 30);
scene.add(new THREE.HemisphereLight(0xfff4d6, 0xc98a1a, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-6, 8, 12); scene.add(key);
const skin = new THREE.MeshStandardMaterial({ color: 0xf2b58f, roughness: .55, metalness: 0 });
const nail = new THREE.MeshStandardMaterial({ color: 0xffe4d6, roughness: .3 });
// a stylised hand: palm + five capsule fingers, index extended, others curled
const hand = new THREE.Group();
const palm = new THREE.Mesh(new THREE.CapsuleGeometry(1.5, 1.6, 6, 16), skin); palm.scale.set(1, 1, .5); hand.add(palm);
function finger(len, r, x, y, rz, curl) {
  const g = new THREE.Group(); g.position.set(x, y, 0); g.rotation.z = rz;
  const seg1 = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 6, 14), skin); seg1.position.y = len / 2; g.add(seg1);
  const j = new THREE.Group(); j.position.y = len; j.rotation.x = curl; g.add(j);
  const seg2 = new THREE.Mesh(new THREE.CapsuleGeometry(r * .92, len * .8, 6, 14), skin); seg2.position.y = len * .4; j.add(seg2);
  const n = new THREE.Mesh(new THREE.SphereGeometry(r * .55, 12, 12), nail); n.position.set(0, len * .75, r * .55); j.add(n);
  return g;
}
const index = finger(1.9, .42, -.55, 1.8, .05, 0); hand.add(index);
hand.add(finger(1.6, .42, .45, 1.9, -.06, 1.6));
hand.add(finger(1.5, .4, 1.25, 1.6, -.3, 1.8));
hand.add(finger(1.2, .36, 1.9, 1.1, -.6, 1.9));
const thumb = finger(1.4, .48, -1.7, .2, 1.0, .6); hand.add(thumb);
const wrist = new THREE.Mesh(new THREE.CapsuleGeometry(1.2, 3, 6, 16), skin); wrist.position.y = -3; wrist.scale.set(1, 1, .5); hand.add(wrist);
hand.rotation.set(-.25, .2, .15);
scene.add(hand);
// world-space targets: the button is at DOM y≈1194 → three y; camera z=30, fov 35 → visible half-height at z=0 is 30*tan(17.5°)≈9.46
const vh = 30 * Math.tan(THREE.MathUtils.degToRad(17.5)), vw = vh * W / H;
const toWorld = (px, py) => ({ x: (px / W - .5) * 2 * vw, y: (.5 - py / H) * 2 * vh });
const btn = toWorld(540, 1194), sw1 = toWorld(360, 950);
// fingertip is ~ (−.55, 1.8+1.9+1.5) above the hand origin → offset so the tip lands on the target
const tip = { x: -.55, y: 5.2 };
const pose = { x: 9, y: -22, z: 4, press: 0, rz: .15 };
const setHand = () => { hand.position.set(pose.x - tip.x, pose.y - tip.y, pose.z); hand.rotation.z = pose.rz; index.children[1].rotation.x = pose.press * .35; };
const btnEl = document.getElementById('btn'), ring = document.getElementById('ring'), price = document.getElementById('price');
const sws = ['s0', 's1', 's2'].map(id => document.getElementById(id));
const tl = gsap.timeline({ paused: true });
tl.from('.ttl .w', { yPercent: 110, stagger: .1, duration: .7, ease: 'expo.out' }, 0)
  .from('#card', { y: 300, opacity: 0, scale: .9, duration: .9, ease: 'move' }, .1)
  .from('.sub', { opacity: 0, duration: .5 }, .8)
  // hand enters from bottom-right and hovers over the blue swatch, taps it
  .to(pose, { x: sw1.x, y: sw1.y, z: 3, rz: .05, duration: 1.1, ease: 'expo.out' }, .6)
  .to(pose, { z: .6, press: 1, duration: .18, ease: 'power2.in' }, 1.7)
  .to(pose, { z: 3, press: 0, duration: .3, ease: 'power2.out' }, 1.9)
  .call(() => { sws.forEach((s, i) => s.classList.toggle('on', i === 1)); price.textContent = '$139'; }, null, 1.86)
  .fromTo('#s1', { scale: 1 }, { scale: .85, duration: .12, yoyo: true, repeat: 1, immediateRender: false }, 1.86)
  // then down to the button and press it; the button squashes and a ring ripples
  .to(pose, { x: btn.x, y: btn.y, rz: -.05, duration: .9, ease: 'expo.inOut' }, 2.5)
  .to(pose, { z: .5, press: 1, duration: .18, ease: 'power2.in' }, 3.4)
  .to(pose, { z: 3, press: 0, duration: .35, ease: 'power2.out' }, 3.6)
  .to('#btn', { scale: .94, duration: .15, ease: 'power2.in' }, 3.42)
  .to('#btn', { scale: 1, duration: .5, ease: 'elastic.out(1,.4)' }, 3.6)
  .call(() => btnEl.firstChild.textContent = 'Added ✓', null, 3.6)
  .call(() => btnEl.firstChild.textContent = 'Add to bag', null, 5.6)
  .fromTo('#ring', { scale: .5, opacity: .9 }, { scale: 6, opacity: 0, duration: .7, ease: 'power2.out', immediateRender: false }, 3.6)
  .to('#card', { y: -12, duration: .2, ease: 'power2.out' }, 3.45).to('#card', { y: 0, duration: .6, ease: 'elastic.out(1,.4)' }, 3.65)
  // hand relaxes back out of frame; card and title leave for the loop
  .to(pose, { x: 12, y: -24, z: 4, rz: .3, duration: .9, ease: 'power3.in' }, 4.4)
  .to('.ttl .w', { yPercent: -110, stagger: .06, duration: .4, ease: 'expo.in' }, 5.3)
  .to('#card', { y: 300, opacity: 0, scale: .9, duration: .5, ease: 'expo.in' }, 5.4)
  .to('.sub', { opacity: 0, duration: .3 }, 5.5)
  .call(() => { sws.forEach((s, i) => s.classList.toggle('on', i === 0)); price.textContent = '$129'; }, null, 5.9);
fx.register({ duration: 6, seek(t) {
  tl.seek(Math.min(t, tl.duration()), false);
  setHand();
  // a soft idle sway so the hand is never rigid
  hand.rotation.x = -.25 + Math.sin(t * 2.1) * .04; hand.rotation.y = .2 + Math.cos(t * 1.7) * .05;
  renderer.render(scene, cam);
} });
</script>
