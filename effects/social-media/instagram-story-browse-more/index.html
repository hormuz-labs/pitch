<!doctype html><meta charset="utf-8">
<title>Instagram Story: Browse More</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101014;color:#fff}
  .bg{position:absolute;inset:-4%;background:url("../../../assets/backgrounds/aurora.png") center/cover;filter:brightness(.55) saturate(1.2)}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,16,20,.1) 30%,rgba(16,16,20,.9) 75%)}
  .head{position:absolute;left:80px;right:80px;top:220px;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:110px;line-height:.95;letter-spacing:-.04em}
  .head .row{overflow:hidden}.head .ln{display:block}
  .sub{position:absolute;left:80px;top:480px;font-size:34px;opacity:.75;letter-spacing:.01em}
  .deck{position:absolute;left:0;top:0;width:100%;height:100%}
  .card{position:absolute;left:120px;top:1160px;width:840px;height:560px;border-radius:32px;background:#1c1c22;border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;padding:36px;will-change:transform}
  .card .th{height:300px;border-radius:20px;background-size:cover;background-position:center}
  .k1 .th{background-image:url("../../../assets/backgrounds/sunset.png")}
  .k2 .th{background-image:url("../../../assets/backgrounds/ocean.png")}
  .k3 .th{background-image:url("../../../assets/backgrounds/aurora.png");filter:hue-rotate(90deg)}
  .card h3{margin-top:30px;font-size:40px;font-weight:500;letter-spacing:-.02em}
  .card p{margin-top:12px;font-size:26px;opacity:.6}
  .prompt{position:absolute;left:0;right:0;top:760px;display:flex;flex-direction:column;align-items:center;gap:22px}
  .chev{width:56px;height:56px;border-left:5px solid #fff;border-top:5px solid #fff;transform:rotate(45deg);opacity:.9}
  .chevs{display:flex;flex-direction:column;gap:-10px;align-items:center;height:130px;justify-content:flex-end}
  .chevs .chev{margin-top:-26px}
  .label{font-size:34px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
  .finger{position:absolute;left:540px;top:1560px;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid #fff;box-shadow:0 0 0 12px rgba(255,255,255,.12)}
</style>
<div class="stage">
  <div class="bg"></div><div class="shade"></div>
  <div class="head"><div class="row"><span class="ln">Browse</span></div><div class="row"><span class="ln">more</span></div></div>
  <div class="sub">Three new stories from Acme this week</div>
  <div class="prompt">
    <div class="chevs"><div class="chev c3"></div><div class="chev c2"></div><div class="chev c1"></div></div>
    <div class="label">Swipe up</div>
  </div>
  <div class="deck">
    <div class="card k3"><div class="th"></div><h3>Field notes: Lisbon</h3><p>12 photographs, one week</p></div>
    <div class="card k2"><div class="th"></div><h3>The tide calendar</h3><p>A tool for coastal walks</p></div>
    <div class="card k1"><div class="th"></div><h3>Golden hour, explained</h3><p>Why the light does that</p></div>
  </div>
  <div class="finger"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  const cards = ['.k1', '.k2', '.k3'];
  cards.forEach((c, i) => gsap.set(c, { y: i * -44, scale: 1 - i * 0.06, filter: `brightness(${1 - i * .25})` }));
  gsap.set('.finger', { opacity: 0 });
  tl.fromTo('.bg', { yPercent: 2 }, { yPercent: -2, duration: 4, ease: 'none' }, 0);
  tl.from('.head .ln', { yPercent: 110, duration: 0.8, ease: 'expo.out', stagger: 0.1 }, 0)
    .from('.sub', { opacity: 0, y: 20, duration: 0.6, ease: 'power3.out' }, 0.5)
    .from('.card', { y: '+=900', duration: 0.9, ease: 'move', stagger: -0.08 }, 0.15)
    .from('.label', { opacity: 0, y: 20, duration: 0.5 }, 0.7);
  // the chevrons ripple upward, continuously
  for (let k = 0; k < 4; k++) {
    tl.fromTo('.chevs .chev', { y: 14, opacity: 0.15 }, { y: -14, opacity: 1, duration: 0.45, ease: 'power2.out', stagger: -0.12 }, 0.6 + k * 0.8)
      .to('.chevs .chev', { y: -30, opacity: 0.15, duration: 0.35, ease: 'power2.in', stagger: -0.12 }, 1.05 + k * 0.8);
  }
  // the swipe: a finger appears, drags up, and the front card flies off; the deck steps forward
  function swipe(at, front) {
    tl.fromTo('.finger', { y: 60, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.25, ease: 'power2.out' }, at)
      .to('.finger', { y: -420, duration: 0.45, ease: 'power3.inOut' }, at + 0.25)
      .to('.finger', { opacity: 0, scale: 1.4, duration: 0.2 }, at + 0.65)
      .to(front, { y: -2000, rotation: -4, duration: 0.55, ease: 'power3.in' }, at + 0.3);
    return at + 0.3;
  }
  let t = swipe(1.3, '.k1');
  tl.to('.k2', { y: 0, scale: 1, filter: 'brightness(1)', duration: 0.6, ease: 'move' }, t + 0.25)
    .to('.k3', { y: -44, scale: 0.94, filter: 'brightness(.75)', duration: 0.6, ease: 'move' }, t + 0.3);
  t = swipe(2.5, '.k2');
  tl.to('.k3', { y: 0, scale: 1, filter: 'brightness(1)', duration: 0.6, ease: 'move' }, t + 0.25);
  // loop: the cards return from below as a fresh deck
  tl.to('.k3', { y: -2000, rotation: -4, duration: 0.45, ease: 'power3.in' }, 3.45);
  cards.forEach((c, i) => {
    tl.fromTo(c, { y: 1000, rotation: 0, scale: 1 - i * 0.06, filter: `brightness(${1 - i * .25})` }, { y: i * -44, duration: 0.55, ease: 'move', immediateRender: false }, 3.55 + i * 0.05);
  });
</script>
