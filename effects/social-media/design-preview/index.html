<!doctype html><meta charset="utf-8">
<title>Design Preview</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#e9e6df;display:flex;align-items:center;justify-content:center}
  .dots{position:absolute;inset:0;background-image:radial-gradient(#c9c5bb 1.2px,transparent 1.3px);background-size:28px 28px}
  .art{position:absolute;width:760px;height:480px;left:260px;top:120px;transform-origin:50% 50%}
  .frame{position:absolute;inset:0;pointer-events:none}
  .frame svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .frame rect{fill:none;stroke:#2f6bff;stroke-width:2}
  .hd{position:absolute;width:12px;height:12px;background:#fff;border:2px solid #2f6bff;border-radius:2px}
  .lbl{position:absolute;background:#2f6bff;color:#fff;font:500 15px/1 "Atlas Grotesk",sans-serif;padding:6px 9px;border-radius:5px;white-space:nowrap}
  .lblW{left:50%;top:-34px;transform:translateX(-50%)}
  .lblH{top:50%;right:-64px;transform:translateY(-50%) rotate(90deg);transform-origin:50% 50%}
  .work{position:absolute;inset:0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.14)}
  .chrome{height:40px;background:#f6f5f2;border-bottom:1px solid #e6e3dc;display:flex;align-items:center;padding:0 14px;gap:7px}
  .chrome i{width:10px;height:10px;border-radius:50%;background:#d9d5cc}
  .url{margin-left:14px;flex:1;height:22px;border-radius:6px;background:#ecebe6}
  .ui{position:absolute;inset:40px 0 0;padding:34px 40px;display:grid;grid-template-columns:1.1fr 1fr;gap:30px}
  .hero h2{font:500 42px/1.05 "Sharp Grotesk","Atlas Grotesk",sans-serif;letter-spacing:-.04em;color:#111}
  .hero p{margin-top:14px;font-size:16px;color:#666;line-height:1.5;max-width:340px}
  .btns{display:flex;gap:10px;margin-top:22px}
  .btn{height:40px;padding:0 18px;border-radius:10px;background:#111;color:#fff;font:500 15px/40px "Atlas Grotesk",sans-serif}
  .btn.o{background:#f0eee8;color:#111}
  .card{background:linear-gradient(140deg,#2f6bff,#8fb4ff);border-radius:16px;position:relative;overflow:hidden}
  .card::after{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.28)}
  .card .k{position:absolute;left:22px;top:22px;color:#fff;font:500 58px/1 "Sharp Grotesk",sans-serif;letter-spacing:-.04em}
  .card .s{position:absolute;left:22px;top:90px;color:rgba(255,255,255,.85);font-size:15px}
  .note{position:absolute;left:60px;bottom:52px;font:400 18px "Atlas Grotesk",sans-serif;color:#555}
  .note b{font-weight:500;color:#111}
  .cursor{position:absolute;width:18px;height:24px;left:0;top:0;z-index:5}
</style>
<div class="stage">
  <div class="dots"></div>
  <div class="art" id="art">
    <div class="work">
      <div class="chrome"><i></i><i></i><i></i><div class="url"></div></div>
      <div class="ui">
        <div class="hero"><h2>Plan the week in one place.</h2><p>Northwind keeps tasks, notes and people together so the team ships without the noise.</p><div class="btns"><span class="btn">Get started</span><span class="btn o">See demo</span></div></div>
        <div class="card"><span class="k">98%</span><span class="s">on-time delivery</span></div>
      </div>
    </div>
    <div class="frame">
      <svg><rect id="rect" x="0" y="0" width="760" height="480"/></svg>
      <div class="hd" style="left:-6px;top:-6px"></div><div class="hd" style="right:-6px;top:-6px"></div><div class="hd" style="left:-6px;bottom:-6px"></div><div class="hd" style="right:-6px;bottom:-6px"></div>
      <div class="lbl lblW" id="lw">760 × 480</div>
      <div class="lbl lblH" id="lh">Desktop / Home</div>
    </div>
  </div>
  <svg class="cursor" id="cur" viewBox="0 0 18 24"><path d="M1 1l16 11-7 1 4 9-3 1-4-9-6 5z" fill="#111" stroke="#fff" stroke-width="1.5"/></svg>
  <div class="note"><b>Northwind</b> · Marketing site v2 · Preview for review</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 10 });
  const lw = document.getElementById('lw');
  tl.from('.dots', { opacity: 0, duration: 1 }, 0)
    // frame draws itself, handles pop, label appears
    .from('#rect', { drawSVG: '0%', duration: 1, ease: 'power3.inOut' }, .1)
    .from('.hd', { scale: 0, stagger: .07, duration: .35, ease: 'back.out(3)' }, .9)
    .from('.lbl', { opacity: 0, y: 6, stagger: .1, duration: .4 }, 1.1)
    // work drops into the frame
    .from('.work', { clipPath: 'inset(0 0 100% 0)', duration: .9, ease: 'expo.inOut' }, 1.2)
    .from('.hero > *', { y: 20, opacity: 0, stagger: .1, duration: .6, ease: 'power3.out' }, 1.7)
    .from('.card', { scale: .8, opacity: 0, duration: .7, ease: 'back.out(1.6)' }, 1.9)
    .from('.note', { opacity: 0, y: 10, duration: .5 }, 2.2)
    // cursor arrives, grabs the corner handle and resizes the frame to mobile
    .fromTo('#cur', { x: 1100, y: 640, opacity: 0 }, { x: 1020, y: 600, opacity: 1, duration: .6, ease: 'power2.out' }, 3.4)
    .to('#cur', { x: 1024, y: 604, duration: .15 }, 4.05);
  const resize = { w: 760, h: 480, x: 260 };
  tl.to(resize, { w: 420, h: 480, x: 430, duration: 1.1, ease: 'expo.inOut', onUpdate: apply }, 4.2)
    .to('#cur', { x: 856, y: 604, duration: 1.1, ease: 'expo.inOut' }, 4.2)
    .to('#cur', { x: 900, y: 660, opacity: 0, duration: .5, ease: 'power2.in' }, 5.5)
    // layout reflows to a single column inside the frame
    .to('.ui', { gridTemplateColumns: '1fr 0fr', gap: 0, duration: 1.1, ease: 'expo.inOut' }, 4.2)
    .to('.card', { opacity: 0, duration: .4 }, 4.2)
    .to('.hero h2', { fontSize: 34, duration: 1.1, ease: 'expo.inOut' }, 4.2)
    .call(() => document.getElementById('lh').textContent = 'Mobile / Home', null, 4.8)
    // hold with a slow sway, then whole art card scales off for the loop
    .to('#art', { rotationY: 6, rotationX: -3, duration: 1.6, ease: 'sine.inOut', transformPerspective: 1400 }, 6)
    .to('#art', { rotationY: 0, rotationX: 0, duration: 1.4, ease: 'sine.inOut' }, 7.6)
    .to('#art', { y: -60, opacity: 0, duration: .6, ease: 'expo.in' }, 9.2)
    .to('.note', { opacity: 0, duration: .4 }, 9.3)
    .to('.dots', { opacity: 0, duration: .4 }, 9.5);
  function apply() {
    const art = document.getElementById('art');
    art.style.width = resize.w + 'px'; art.style.left = resize.x + 'px';
    document.getElementById('rect').setAttribute('width', resize.w);
    lw.textContent = Math.round(resize.w) + ' × ' + Math.round(resize.h);
  }
</script>
