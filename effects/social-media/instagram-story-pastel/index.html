<!doctype html><meta charset="utf-8">
<title>Instagram Story: Pastel</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f6eef4;color:#4a3d52}
  .blob{position:absolute;border-radius:50%;will-change:transform}
  .b1{left:-300px;top:-200px;width:900px;height:900px;background:radial-gradient(circle at 40% 40%,#ffd6e0 0%,rgba(255,214,224,0) 70%)}
  .b2{left:400px;top:900px;width:1000px;height:1000px;background:radial-gradient(circle at 50% 50%,#cfe6ff 0%,rgba(207,230,255,0) 70%)}
  .b3{left:-200px;top:1200px;width:800px;height:800px;background:radial-gradient(circle at 50% 50%,#e3f5d9 0%,rgba(227,245,217,0) 70%)}
  .card{position:absolute;left:120px;top:560px;width:840px;height:880px;border-radius:40px;background:#fff;box-shadow:0 30px 80px rgba(120,90,130,.18);overflow:hidden}
  .card .img{position:absolute;inset:0;background:url("../../../assets/backgrounds/sunset.png") center/cover;filter:saturate(.7) brightness(1.15) contrast(.85)}
  .card .tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,214,224,.35),rgba(207,230,255,.35))}
  .kicker{position:absolute;left:120px;top:250px;font-size:28px;letter-spacing:.3em;text-transform:uppercase;opacity:.7}
  .title{position:absolute;left:120px;right:120px;top:300px;font-family:"Sorts Mill Goudy",Georgia,serif;font-size:96px;line-height:1;letter-spacing:-.01em}
  .title .row{overflow:hidden}.title .ln{display:block}
  .quote{position:absolute;left:120px;right:120px;top:1500px;font-size:38px;line-height:1.4;font-style:italic;font-family:"Sorts Mill Goudy",Georgia,serif}
  .quote .w{display:inline-block;white-space:pre}
  .sticker{position:absolute;left:760px;top:1330px;width:230px;height:230px;border-radius:50%;background:#ffd6e0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;line-height:1.3;box-shadow:0 12px 30px rgba(120,90,130,.15)}
  .petal{position:absolute;width:26px;height:38px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#ffc3d3;opacity:.85}
  .foot{position:absolute;left:120px;top:1720px;font-size:26px;letter-spacing:.18em;text-transform:uppercase;opacity:.6}
</style>
<div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="petal p1" style="left:180px;top:1500px"></div>
  <div class="petal p2" style="left:900px;top:600px"></div>
  <div class="petal p3" style="left:820px;top:1750px"></div>
  <div class="petal p4" style="left:80px;top:900px"></div>
  <div class="kicker">Slow Sundays</div>
  <div class="title"><div class="row"><span class="ln">Softer</span></div><div class="row"><span class="ln">mornings</span></div></div>
  <div class="card"><div class="img"></div><div class="tint"></div></div>
  <div class="sticker"><span>New<br>edit</span></div>
  <div class="quote" id="q">Linen, light and a slower kind of morning routine.</div>
  <div class="foot">Northwind Home</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const q = document.getElementById('q');
  q.innerHTML = q.textContent.split(' ').map(w => `<span class="w">${w} </span>`).join('');
  const tl = fx.timeline({ duration: 5 });
  // the blobs breathe, the whole loop, and come back to where they started
  tl.to('.b1', { x: 80, y: 60, scale: 1.1, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
    .to('.b2', { x: -90, y: -70, scale: 1.08, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
    .to('.b3', { x: 60, y: -50, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  // petals drift and turn
  tl.to('.p1', { y: -40, rotation: 30, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
    .to('.p2', { y: 50, x: -20, rotation: -40, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
    .to('.p3', { y: -30, x: 20, rotation: 25, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
    .to('.p4', { y: 40, rotation: -20, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  // gentle entrances
  tl.from('.kicker', { opacity: 0, y: 16, duration: 0.9, ease: 'power2.out' }, 0.1)
    .from('.title .ln', { yPercent: 105, duration: 1.1, ease: 'power3.out', stagger: 0.15 }, 0.2)
    .from('.card', { y: 80, opacity: 0, scale: 0.96, duration: 1.2, ease: 'power3.out' }, 0.4)
    .fromTo('.card .img', { scale: 1.08 }, { scale: 1.0, duration: 4.4, ease: 'none' }, 0.4)
    .from('.sticker', { scale: 0, rotation: -30, duration: 0.9, ease: 'back.out(1.4)' }, 1.2)
    .to('.sticker', { rotation: 8, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2.1)
    .from('.quote .w', { opacity: 0, y: 12, duration: 0.7, ease: 'power2.out', stagger: 0.06 }, 1.5)
    .from('.foot', { opacity: 0, duration: 0.8 }, 2.2);
  // exit, as gently as it came
  tl.to('.quote, .foot, .kicker', { opacity: 0, duration: 0.5, ease: 'power2.in' }, 4.2)
    .to('.sticker', { scale: 0, duration: 0.4, ease: 'back.in(1.4)' }, 4.3)
    .to('.title .ln', { yPercent: -105, duration: 0.5, ease: 'power3.in', stagger: 0.08 }, 4.3)
    .to('.card', { y: -60, opacity: 0, duration: 0.5, ease: 'power2.in' }, 4.45);
</script>
