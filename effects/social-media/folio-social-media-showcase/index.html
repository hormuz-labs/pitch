<!doctype html><meta charset="utf-8">
<title>Folio: Social Media Showcase</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f4f1ea;color:#161616}
  .img{position:absolute;overflow:hidden}
  .img i{position:absolute;inset:-6%;background:center/cover;display:block}
  .a{left:90px;top:80px;width:620px;height:560px}
  .a i{background-image:url("../../../assets/backgrounds/ocean.png")}
  .b{left:760px;top:250px;width:430px;height:390px}
  .b i{background-image:url("../../../assets/backgrounds/sunset.png")}
  .meta{position:absolute;left:760px;top:80px;width:430px}
  .idx{font:400 16px "Atlas Grotesk",sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#7a766d}
  .ttl{font:400 60px/1 "Sorts Mill Goudy",serif;letter-spacing:-.02em;margin-top:8px}
  .ttl .l{display:block;overflow:hidden}.ttl .w{display:inline-block}
  .ttl em{font-style:italic}
  .rule{position:absolute;left:90px;right:90px;top:660px;height:1px;background:#161616;transform-origin:0 50%}
  .foot{position:absolute;left:90px;top:676px;font:400 14px "Atlas Grotesk",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#7a766d}
  .foot.r{left:auto;right:90px}
</style>
<div class="stage">
  <div class="img a" id="a"><i></i></div>
  <div class="img b" id="b"><i></i></div>
  <div class="meta">
    <div class="idx" id="idx">01 — Coastal Study</div>
    <div class="ttl" id="ttl"><span class="l"><span class="w">Light on</span></span><span class="l"><span class="w"><em>still</em> water</span></span></div>
  </div>
  <div class="rule" id="rule"></div>
  <div class="foot">Acme Folio · 2026</div><div class="foot r">Selected work</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  const ttl = document.getElementById('ttl'), idx = document.getElementById('idx');
  // enter: images wipe open with an inner counter-move, title lines rise
  tl.fromTo('#a', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 1, ease: 'expo.inOut' }, 0)
    .fromTo('#a i', { xPercent: -8, scale: 1.08 }, { xPercent: 0, scale: 1, duration: 1.4, ease: 'expo.out' }, 0)
    .fromTo('#b', { clipPath: 'inset(100% 0 0 0)' }, { clipPath: 'inset(0% 0 0 0)', duration: .9, ease: 'expo.inOut' }, .25)
    .fromTo('#b i', { yPercent: 8, scale: 1.08 }, { yPercent: 0, scale: 1, duration: 1.3, ease: 'expo.out' }, .25)
    .from('.idx', { opacity: 0, y: 8, duration: .5 }, .5)
    .from('#ttl .w', { yPercent: 110, stagger: .1, duration: .7, ease: 'expo.out' }, .55)
    .from('#rule', { scaleX: 0, duration: .9, ease: 'expo.inOut' }, .5)
    .from('.foot', { opacity: 0, duration: .5, stagger: .1 }, .9)
    // slow drift while holding
    .to('#a i', { scale: 1.05, duration: 2, ease: 'none' }, 1.2)
    .to('#b i', { scale: 1.05, yPercent: -2, duration: 2, ease: 'none' }, 1.2)
    // transition: images swap places through a wipe; title changes
    .to('#a', { clipPath: 'inset(0 0 0 100%)', duration: .7, ease: 'expo.inOut' }, 2.6)
    .to('#a i', { xPercent: 10, duration: .7, ease: 'expo.inOut' }, 2.6)
    .to('#b', { clipPath: 'inset(0 0 100% 0)', duration: .6, ease: 'expo.inOut' }, 2.75)
    .to('#ttl .w', { yPercent: -110, stagger: .06, duration: .45, ease: 'expo.in' }, 2.7)
    .to('.idx', { opacity: 0, y: -8, duration: .3 }, 2.8)
    .to('#rule', { scaleX: 0, transformOrigin: '100% 50%', duration: .6, ease: 'expo.inOut' }, 3.1)
    .to('.foot', { opacity: 0, duration: .3, stagger: .05 }, 3.4);
</script>
