<!doctype html><meta charset="utf-8">
<title>Project Teaser</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#000;color:#f4f1ea}
  .film{position:absolute;inset:0;overflow:hidden}
  .film .img{position:absolute;inset:-8%;background:url("../../../assets/backgrounds/aurora.png") center/cover;filter:brightness(.35) saturate(.6)}
  .bars{position:absolute;left:0;right:0;height:90px;background:#000}
  .bars.t{top:0;transform-origin:top}.bars.b{bottom:0;transform-origin:bottom}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(0,0,0,.85) 100%)}
  .kick{position:absolute;left:0;right:0;top:250px;text-align:center;font-size:18px;letter-spacing:.5em;text-transform:uppercase;opacity:.75}
  .kick .row{overflow:hidden}.kick span{display:block}
  .word{position:absolute;left:0;right:0;top:300px;text-align:center;font-family:"Sorts Mill Goudy",Georgia,serif;font-size:132px;line-height:1;letter-spacing:.02em}
  .word .row{overflow:hidden;padding:0 20px}
  .word span{display:block;will-change:transform,filter}
  .word .l{display:inline-block}
  .date{position:absolute;left:0;right:0;top:470px;text-align:center;font-size:22px;letter-spacing:.42em;text-transform:uppercase}
  .date .rule{display:block;width:120px;height:1px;background:#f4f1ea;margin:0 auto 22px;transform-origin:center}
  .light{position:absolute;left:-200px;top:0;width:400px;height:720px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(255,255,255,0));transform:skewX(-18deg);mix-blend-mode:screen;opacity:0}
  .corner{position:absolute;font-size:14px;letter-spacing:.32em;text-transform:uppercase;opacity:.55}
  .corner.tl{left:60px;top:110px}.corner.tr{right:60px;top:110px}.corner.bl{left:60px;bottom:110px}.corner.br{right:60px;bottom:110px}
  .flash{position:absolute;inset:0;background:#fff;opacity:0}
</style>
<div class="stage">
  <div class="film"><div class="img"></div></div>
  <div class="vig"></div>
  <div class="light"></div>
  <div class="corner tl">Vendredi Society</div><div class="corner tr">Teaser</div>
  <div class="corner bl">Case 014</div><div class="corner br">Coming soon</div>
  <div class="kick"><div class="row"><span>A new identity for</span></div></div>
  <div class="word"><div class="row"><span class="w"><i class="l">N</i><i class="l">o</i><i class="l">r</i><i class="l">t</i><i class="l">h</i><i class="l">w</i><i class="l">i</i><i class="l">n</i><i class="l">d</i></span></div></div>
  <div class="date"><span class="rule"></span><span class="d">Revealed 12 · 10 · 2026</span></div>
  <div class="bars t"></div><div class="bars b"></div>
  <div class="flash"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 9 });
  gsap.set('.word .l', { fontStyle: 'normal' });
  // slow build: the image barely rises out of black over five seconds
  tl.fromTo('.film .img', { scale: 1.3, filter: 'brightness(0.05) saturate(.4)' }, { scale: 1.12, filter: 'brightness(0.32) saturate(.7)', duration: 5.5, ease: 'power2.inOut' }, 0)
    .from('.bars.t', { scaleY: 3, duration: 2.5, ease: 'power3.out' }, 0)
    .from('.bars.b', { scaleY: 3, duration: 2.5, ease: 'power3.out' }, 0)
    .from('.corner', { opacity: 0, duration: 1.5, stagger: 0.2 }, 0.8);
  // the kicker fades up, letters of the name drift in one by one, soft and slow
  tl.from('.kick span', { yPercent: 110, duration: 1.2, ease: 'power3.out' }, 1.4)
    .from('.word .l', { opacity: 0, y: 30, filter: 'blur(14px)', duration: 1.6, ease: 'power2.out', stagger: 0.14 }, 2.0)
    .from('.date .rule', { scaleX: 0, duration: 1.2, ease: 'expo.out' }, 4.2)
    .from('.date .d', { opacity: 0, letterSpacing: '.9em', duration: 1.4, ease: 'power3.out' }, 4.4);
  // the dramatic reveal: the light sweeps, a flash, the image jumps to full colour and pushes in
  tl.to('.light', { opacity: 1, duration: 0.2 }, 5.6)
    .to('.light', { x: 1700, duration: 0.7, ease: 'power2.inOut' }, 5.6)
    .to('.light', { opacity: 0, duration: 0.2 }, 6.2)
    .to('.flash', { opacity: 1, duration: 0.06 }, 6.25)
    .to('.flash', { opacity: 0, duration: 0.8, ease: 'power2.out' }, 6.31)
    .to('.film .img', { filter: 'brightness(1) saturate(1.2)', scale: 1.0, duration: 1.4, ease: 'expo.out' }, 6.25)
    .to('.word', { scale: 1.12, duration: 1.6, ease: 'expo.out' }, 6.25)
    .to('.word .l', { color: '#fff', textShadow: '0 0 40px rgba(255,255,255,.5)', duration: 0.6 }, 6.25)
    .to('.bars.t, .bars.b', { scaleY: 0.4, duration: 1.2, ease: 'expo.out' }, 6.3)
    .to('.kick', { opacity: 0, duration: 0.5 }, 6.25);
  // fade back into black for the loop
  tl.to('.film .img, .word, .date, .corner', { opacity: 0, duration: 0.8, ease: 'power2.in' }, 8.1)
    .to('.bars.t, .bars.b', { scaleY: 3, duration: 0.8, ease: 'power2.in' }, 8.1);
</script>
