<!doctype html><meta charset="utf-8">
<title>Instagram Story: 2 Images With Captions</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f6f3ec;color:#161616}
  .block{position:absolute;left:80px;width:920px}
  .b1{top:170px}.b2{top:1010px}
  .img{position:relative;width:920px;height:560px;overflow:hidden;border-radius:10px}
  .img i{position:absolute;inset:-8%;background:center/cover}
  .b1 i{background-image:url("../../../assets/backgrounds/sunset.png")}
  .b2 i{background-image:url("../../../assets/backgrounds/ocean.png")}
  .cap{margin-top:34px;display:flex;gap:30px;align-items:flex-start}
  .n{font:400 20px "Atlas Grotesk",sans-serif;letter-spacing:.25em;color:#8a857a;padding-top:14px;flex:none}
  .cap h2{font:400 62px/1.05 "Sorts Mill Goudy",serif;letter-spacing:-.02em}
  .cap h2 .l{display:block;overflow:hidden}.cap h2 .w{display:inline-block}
  .cap p{margin-top:12px;font:400 24px/1.4 "Atlas Grotesk",sans-serif;color:#5a564e;max-width:640px}
  .cap p .w{display:inline-block;white-space:pre}
  .hd{position:absolute;left:80px;top:80px;font:500 20px "Atlas Grotesk",sans-serif;letter-spacing:.3em;text-transform:uppercase}
  .ft{position:absolute;left:80px;right:80px;bottom:80px;display:flex;justify-content:space-between;font:400 20px "Atlas Grotesk",sans-serif;letter-spacing:.2em;color:#8a857a;text-transform:uppercase}
  .line{position:absolute;left:80px;right:80px;top:960px;height:2px;background:#161616;transform-origin:0 50%}
</style>
<div class="stage">
  <div class="hd">Acme Home — Lookbook</div>
  <div class="block b1"><div class="img"><i></i></div>
    <div class="cap"><span class="n">01</span><div><h2><span class="l"><span class="w">The Dune chair</span></span></h2><p>Ash frame, wool bouclé, made in small batches.</p></div></div></div>
  <div class="line"></div>
  <div class="block b2"><div class="img"><i></i></div>
    <div class="cap"><span class="n">02</span><div><h2><span class="l"><span class="w">The Tide table</span></span></h2><p>Solid oak, oil finish, seats six with ease.</p></div></div></div>
  <div class="ft"><span>Spring 26</span><span>Swipe up</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  document.querySelectorAll('.cap p').forEach(p => p.innerHTML = p.textContent.split(' ').map(w => `<span class="w">${w} </span>`).join(''));
  const tl = fx.timeline({ duration: 4 });
  const enter = (sel, at) => {
    tl.fromTo(sel + ' .img', { clipPath: 'inset(0 0 100% 0)' }, { clipPath: 'inset(0 0 0% 0)', duration: .9, ease: 'expo.inOut' }, at)
      .fromTo(sel + ' .img i', { scale: 1.15, yPercent: -6 }, { scale: 1, yPercent: 0, duration: 1.6, ease: 'expo.out' }, at)
      .from(sel + ' .n', { opacity: 0, x: -14, duration: .5 }, at + .5)
      .from(sel + ' h2 .w', { yPercent: 110, duration: .7, ease: 'expo.out' }, at + .55)
      .from(sel + ' p .w', { y: 14, opacity: 0, stagger: .03, duration: .45, ease: 'power3.out' }, at + .7);
  };
  const exit = (sel, at) => {
    tl.to(sel + ' h2 .w', { yPercent: -110, duration: .4, ease: 'expo.in' }, at)
      .to(sel + ' p .w', { opacity: 0, y: -8, stagger: .01, duration: .3 }, at)
      .to(sel + ' .n', { opacity: 0, duration: .3 }, at)
      .to(sel + ' .img', { clipPath: 'inset(100% 0 0% 0)', duration: .5, ease: 'expo.in' }, at + .1);
  };
  tl.from('.hd', { opacity: 0, y: -14, duration: .5 }, 0);
  enter('.b1', .1);
  tl.from('.line', { scaleX: 0, duration: .9, ease: 'expo.inOut' }, .7);
  enter('.b2', .9);
  tl.from('.ft', { opacity: 0, duration: .5 }, 1.6)
    // hold with ken-burns on both
    .to('.b1 .img i', { scale: 1.06, duration: 1.6, ease: 'none' }, 1.7)
    .to('.b2 .img i', { scale: 1.06, duration: 1.4, ease: 'none' }, 2.5);
  exit('.b1', 3.0); exit('.b2', 3.25);
  tl.to('.line', { scaleX: 0, transformOrigin: '100% 50%', duration: .5, ease: 'expo.in' }, 3.3)
    .to('.hd,.ft', { opacity: 0, duration: .3 }, 3.6);
</script>
