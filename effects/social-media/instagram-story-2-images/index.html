<!doctype html><meta charset="utf-8">
<title>Instagram Story: 2 Images</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#111}
  .img{position:absolute;inset:0;overflow:hidden}
  .img i{position:absolute;inset:-8%;background:center/cover;display:block}
  .a i{background-image:url("../../../assets/backgrounds/sunset.png")}
  .b i{background-image:url("../../../assets/backgrounds/ocean.png")}
  .lbl{position:absolute;left:80px;bottom:160px;color:#fff;font:500 120px/1 "Sharp Grotesk","Atlas Grotesk",sans-serif;letter-spacing:-.04em;text-transform:uppercase}
  .lbl .l{display:block;overflow:hidden}.lbl .w{display:inline-block}
  .lbl small{display:block;font:400 26px "Atlas Grotesk",sans-serif;letter-spacing:.3em;margin-bottom:22px;text-transform:uppercase;opacity:.85}
  .pill{position:absolute;left:80px;top:120px;height:56px;padding:0 24px;border-radius:28px;background:rgba(255,255,255,.18);backdrop-filter:blur(12px);color:#fff;font:500 22px/56px "Atlas Grotesk",sans-serif;letter-spacing:.08em;text-transform:uppercase}
  .bar{position:absolute;left:40px;right:40px;top:60px;display:flex;gap:8px}
  .bar i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.35);position:relative;overflow:hidden}
  .bar i b{position:absolute;left:0;top:0;bottom:0;width:100%;background:#fff;transform-origin:0 50%}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 25%,transparent 60%,rgba(0,0,0,.55))}
</style>
<div class="stage">
  <div class="img a" id="a"><i></i></div>
  <div class="img b" id="b"><i></i></div>
  <div class="shade"></div>
  <div class="bar"><i><b id="pb1"></b></i><i><b id="pb2"></b></i></div>
  <div class="pill" id="pill">Acme · Summer 26</div>
  <div class="lbl" id="l1"><small>01 / 02</small><span class="l"><span class="w">Golden</span></span><span class="l"><span class="w">hour</span></span></div>
  <div class="lbl" id="l2"><small>02 / 02</small><span class="l"><span class="w">Deep</span></span><span class="l"><span class="w">blue</span></span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  gsap.set('#b', { clipPath: 'inset(0 0 100% 0)' });
  gsap.set('#l2', { autoAlpha: 0 });
  gsap.set('#pb1,#pb2', { scaleX: 0 });
  // image 1 breathes in, its label rises; progress bar fills
  tl.fromTo('#a i', { scale: 1.15, yPercent: 4 }, { scale: 1, yPercent: 0, duration: 2, ease: 'power2.out' }, 0)
    .from('.pill', { y: -30, opacity: 0, duration: .6, ease: 'expo.out' }, .1)
    .from('#l1 small', { opacity: 0, x: -20, duration: .5 }, .2)
    .from('#l1 .w', { yPercent: 110, stagger: .1, duration: .7, ease: 'expo.out' }, .25)
    .to('#pb1', { scaleX: 1, duration: 1.9, ease: 'none' }, 0)
    // clean transition: image 2 wipes down over image 1 while 1 pushes away; labels swap
    .to('#l1 .w', { yPercent: -110, stagger: .06, duration: .4, ease: 'expo.in' }, 1.6)
    .to('#l1 small', { opacity: 0, duration: .3 }, 1.7)
    .to('#b', { clipPath: 'inset(0 0 0% 0)', duration: .9, ease: 'expo.inOut' }, 1.9)
    .fromTo('#b i', { yPercent: -10, scale: 1.12 }, { yPercent: 0, scale: 1, duration: 1.8, ease: 'power2.out', immediateRender: false }, 1.9)
    .to('#a i', { yPercent: 10, scale: 1.1, duration: .9, ease: 'expo.inOut' }, 1.9)
    .set('#l2', { autoAlpha: 1 }, 2.3)
    .from('#l2 small', { opacity: 0, x: -20, duration: .5 }, 2.35)
    .from('#l2 .w', { yPercent: 110, stagger: .1, duration: .7, ease: 'expo.out' }, 2.4)
    .to('#pb2', { scaleX: 1, duration: 2, ease: 'none' }, 2)
    // exit: image 2 wipes up to reveal image 1 reset beneath, closing the loop
    .to('#l2 .w', { yPercent: -110, stagger: .06, duration: .35, ease: 'expo.in' }, 3.45)
    .to('#l2 small', { opacity: 0, duration: .25 }, 3.5)
    .set('#a i', { yPercent: 4, scale: 1.15 }, 3.55)
    .to('#b', { clipPath: 'inset(100% 0 0% 0)', duration: .45, ease: 'expo.inOut' }, 3.55)
    .to('#pb1,#pb2', { scaleX: 0, duration: .01 }, 3.99);
</script>
