<!doctype html><meta charset="utf-8">
<title>Instagram Story: 2 Vertical Images</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f2ede4;color:#161616}
  .col{position:absolute;top:260px;width:470px;height:1120px;overflow:hidden}
  .col i{position:absolute;inset:-10% 0;background:center/cover}
  .ca{left:60px}.ca i{background-image:url("../../../assets/backgrounds/ocean.png")}
  .cb{left:550px}.cb i{background-image:url("../../../assets/backgrounds/sunset.png")}
  .name{position:absolute;left:0;right:0;text-align:center;font:400 150px/1 "Sorts Mill Goudy",serif;letter-spacing:-.02em;z-index:3;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.35)}
  .name em{font-style:italic}
  .n1{top:700px}.n2{top:860px}
  .tiny{position:absolute;font:400 20px "Atlas Grotesk",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#6d675c}
  .t1{left:60px;top:170px}.t2{right:60px;top:170px;text-align:right}
  .t3{left:60px;bottom:120px}.t4{right:60px;bottom:120px}
  .ruleV{position:absolute;left:539px;top:260px;width:2px;height:1120px;background:#f2ede4;z-index:2}
</style>
<div class="stage">
  <div class="tiny t1">Acme Atelier</div><div class="tiny t2">AW / 26</div>
  <div class="col ca"><i></i></div>
  <div class="col cb"><i></i></div>
  <div class="name n1"><span class="w">Quiet</span></div>
  <div class="name n2"><span class="w"><em>forms</em></span></div>
  <div class="tiny t3">Look 07 — Look 08</div><div class="tiny t4">Editorial</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  // the two portraits slide in vertically from opposite ends, each with a slow inner counter-scroll
  tl.fromTo('.ca', { clipPath: 'inset(100% 0 0 0)' }, { clipPath: 'inset(0% 0 0 0)', duration: 1.1, ease: 'expo.inOut' }, 0)
    .fromTo('.cb', { clipPath: 'inset(0 0 100% 0)' }, { clipPath: 'inset(0 0 0% 0)', duration: 1.1, ease: 'expo.inOut' }, .15)
    .fromTo('.ca i', { yPercent: -10, scale: 1.1 }, { yPercent: 0, scale: 1, duration: 1.8, ease: 'expo.out' }, 0)
    .fromTo('.cb i', { yPercent: 10, scale: 1.1 }, { yPercent: 0, scale: 1, duration: 1.8, ease: 'expo.out' }, .15)
    .from('.tiny', { opacity: 0, y: 8, stagger: .08, duration: .5 }, .6)
    .from('.n1', { x: -200, opacity: 0, duration: .9, ease: 'move' }, .7)
    .from('.n2', { x: 200, opacity: 0, duration: .9, ease: 'move' }, .85)
    // the hold: columns drift in opposite directions (a vertical parallax), the names glide the other way
    .to('.ca i', { yPercent: 5, duration: 2.2, ease: 'sine.inOut' }, 1.5)
    .to('.cb i', { yPercent: -5, duration: 2.2, ease: 'sine.inOut' }, 1.5)
    .to('.n1', { x: 30, duration: 2.2, ease: 'sine.inOut' }, 1.5)
    .to('.n2', { x: -30, duration: 2.2, ease: 'sine.inOut' }, 1.5)
    // exit the way they came
    .to('.ca', { clipPath: 'inset(0 0 100% 0)', duration: .6, ease: 'expo.in' }, 3.4)
    .to('.cb', { clipPath: 'inset(100% 0 0 0)', duration: .6, ease: 'expo.in' }, 3.4)
    .to('.n1', { x: -200, opacity: 0, duration: .45, ease: 'expo.in' }, 3.4)
    .to('.n2', { x: 200, opacity: 0, duration: .45, ease: 'expo.in' }, 3.45)
    .to('.tiny', { opacity: 0, duration: .3, stagger: .04 }, 3.55);
</script>
