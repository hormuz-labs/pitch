<!doctype html><meta charset="utf-8">
<title>Instagram Story: 3 Square Images</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#1a1a1d;color:#fff;perspective:1800px}
  .bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#2c2a35,#1a1a1d 60%)}
  .deck{position:absolute;left:0;right:0;top:0;bottom:0;transform-style:preserve-3d}
  .sq{position:absolute;left:190px;top:560px;width:700px;height:700px;border-radius:28px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.5);transform-origin:50% 50%}
  .sq i{position:absolute;inset:-8%;background:center/cover}
  .q1 i{background-image:url("../../../assets/backgrounds/sunset.png")}
  .q2 i{background-image:url("../../../assets/backgrounds/ocean.png")}
  .q3 i{background-image:url("../../../assets/backgrounds/aurora.png")}
  .sq .lb{position:absolute;left:30px;bottom:30px;font:500 40px "Sharp Grotesk","Atlas Grotesk",sans-serif;letter-spacing:-.02em}
  .sq .lb small{display:block;font:400 18px "Atlas Grotesk",sans-serif;letter-spacing:.25em;text-transform:uppercase;opacity:.8;margin-bottom:6px}
  .ttl{position:absolute;left:0;right:0;top:300px;text-align:center;font:500 84px/1 "Sharp Grotesk","Atlas Grotesk",sans-serif;letter-spacing:-.04em}
  .ttl .l{display:block;overflow:hidden}.ttl .w{display:inline-block}
  .dots{position:absolute;left:0;right:0;top:1360px;display:flex;justify-content:center;gap:12px}
  .dots i{width:10px;height:10px;border-radius:5px;background:rgba(255,255,255,.3)}
  .dots i.on{background:#fff;width:34px}
  .price{position:absolute;left:0;right:0;top:1440px;text-align:center;font:400 30px "Atlas Grotesk",sans-serif;letter-spacing:.2em;color:#bbb;text-transform:uppercase}
  .cta{position:absolute;left:290px;top:1560px;width:500px;height:88px;border-radius:44px;background:#fff;color:#111;font:500 26px/88px "Atlas Grotesk",sans-serif;text-align:center;letter-spacing:.05em}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="ttl"><span class="l"><span class="w">New in</span></span><span class="l"><span class="w">the shop</span></span></div>
  <div class="deck" id="deck">
    <div class="sq q3"><i></i><div class="lb"><small>03 · Lamp</small>Aurora</div></div>
    <div class="sq q2"><i></i><div class="lb"><small>02 · Vase</small>Tide</div></div>
    <div class="sq q1"><i></i><div class="lb"><small>01 · Chair</small>Ember</div></div>
  </div>
  <div class="dots"><i class="on"></i><i></i><i></i></div>
  <div class="price" id="price">From $120</div>
  <div class="cta">Shop the drop</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  const dots = gsap.utils.toArray('.dots i'), price = document.getElementById('price');
  // a stacked deck: three squares fan in, then each top card flicks off to reveal the next
  gsap.set('.q2', { y: -40, scale: .92, rotationZ: 3 });
  gsap.set('.q3', { y: -80, scale: .84, rotationZ: -3 });
  tl.from('.ttl .w', { yPercent: 110, stagger: .1, duration: .7, ease: 'expo.out' }, 0)
    .from('.q3', { y: 1400, rotationZ: 20, duration: .8, ease: 'move' }, .1)
    .from('.q2', { y: 1400, rotationZ: -20, duration: .8, ease: 'move' }, .22)
    .from('.q1', { y: 1400, rotationZ: 12, duration: .8, ease: 'move' }, .34)
    .from('.dots,.price,.cta', { opacity: 0, y: 20, stagger: .08, duration: .5 }, .8)
    .fromTo('.sq i', { scale: 1.12 }, { scale: 1, duration: 1.6, ease: 'expo.out' }, .3);
  const flick = (top, next, back, at, n, p) => {
    tl.to(top, { x: -900, rotationZ: -18, rotationY: -30, duration: .55, ease: 'power3.in' }, at)
      .to(next, { y: 0, scale: 1, rotationZ: 0, duration: .6, ease: 'back.out(1.4)' }, at + .15)
      .to(back, { y: -40, scale: .92, rotationZ: 3, duration: .6, ease: 'power2.out' }, at + .15)
      .call(() => { dots.forEach((d, i) => d.classList.toggle('on', i === n)); price.textContent = p; }, null, at + .3);
  };
  flick('.q1', '.q2', '.q3', 1.5, 1, 'From $64');
  flick('.q2', '.q3', null, 2.5, 2, 'From $210');
  tl.to('.q3', { x: -900, rotationZ: -18, rotationY: -30, duration: .5, ease: 'power3.in' }, 3.4)
    .to('.ttl .w', { yPercent: -110, stagger: .06, duration: .35, ease: 'expo.in' }, 3.5)
    .to('.dots,.price,.cta', { opacity: 0, y: 20, stagger: .05, duration: .3 }, 3.5)
    .call(() => { dots.forEach((d, i) => d.classList.toggle('on', i === 0)); price.textContent = 'From $120'; }, null, 3.95);
</script>
