<!doctype html><meta charset="utf-8">
<title>Orbit: Social Media Showreel</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b0d12;color:#fff}
  .ring{position:absolute;left:540px;top:540px;width:0;height:0}
  .ring i{position:absolute;left:-330px;top:-330px;width:660px;height:660px;border-radius:50%;border:1px solid rgba(255,255,255,.14)}
  .ring i.r2{left:-450px;top:-450px;width:900px;height:900px;border-color:rgba(255,255,255,.07)}
  .core{position:absolute;left:540px;top:540px;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;background:#fff;color:#0b0d12;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:500;letter-spacing:-.02em;font-size:34px;box-shadow:0 0 0 18px rgba(255,255,255,.06)}
  .core small{font-size:16px;letter-spacing:.24em;text-transform:uppercase;font-weight:400;opacity:.6;margin-top:6px}
  .card{position:absolute;left:540px;top:540px;width:250px;height:250px;margin:-125px 0 0 -125px;border-radius:22px;overflow:hidden;background:#1b1f28;box-shadow:0 20px 50px rgba(0,0,0,.5);will-change:transform}
  .card .img{position:absolute;inset:0;background-size:cover;background-position:center}
  .card .cap{position:absolute;left:16px;bottom:14px;font-size:18px;font-weight:500;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .k0 .img{background-image:url("../../../assets/backgrounds/sunset.png")}
  .k1 .img{background-image:url("../../../assets/backgrounds/ocean.png")}
  .k2 .img{background-image:url("../../../assets/backgrounds/aurora.png")}
  .k3 .img{background-image:url("../../../assets/backgrounds/sunset.png");filter:hue-rotate(150deg)}
  .k4 .img{background-image:url("../../../assets/backgrounds/ocean.png");filter:hue-rotate(-90deg)}
  .k5 .img{background-image:url("../../../assets/backgrounds/aurora.png");filter:hue-rotate(200deg)}
  .k6{background:#ff5a36}.k6 .cap{font-size:26px;left:20px;bottom:18px;text-shadow:none}
  .k7{background:#ffd23f;color:#111}.k7 .cap{font-size:26px;left:20px;bottom:18px;text-shadow:none}
  .ttl{position:absolute;left:60px;top:60px;font-size:22px;letter-spacing:.3em;text-transform:uppercase;opacity:.7}
  .yr{position:absolute;right:60px;top:60px;font-size:22px;letter-spacing:.3em;opacity:.7}
  .ft{position:absolute;left:60px;right:60px;bottom:60px;display:flex;justify-content:space-between;font-size:20px;opacity:.6;letter-spacing:.06em}
</style>
<div class="stage">
  <div class="ring"><i class="r1"></i><i class="r2"></i></div>
  <div class="ttl">Showreel</div><div class="yr">2026</div>
  <div class="card k0"><div class="img"></div><div class="cap">Dusk app</div></div>
  <div class="card k1"><div class="img"></div><div class="cap">Tide</div></div>
  <div class="card k6"><div class="cap">Brand<br>system</div></div>
  <div class="card k2"><div class="img"></div><div class="cap">Aurora</div></div>
  <div class="card k3"><div class="img"></div><div class="cap">Ember</div></div>
  <div class="card k7"><div class="cap">Motion<br>reel</div></div>
  <div class="card k4"><div class="img"></div><div class="cap">Harbor</div></div>
  <div class="card k5"><div class="img"></div><div class="cap">Nightfall</div></div>
  <div class="core">Rico<small>studio</small></div>
  <div class="ft"><span>Selected work — 8 pieces</span><span>rico.studio</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const cards = Array.from(document.querySelectorAll('.card'));
  const N = cards.length, R = 330, TILT = 0.42, D = 10;
  // continuous orbit: one full turn per loop. The ring is tilted, so the
  // front of the orbit is bigger and the back is smaller and dimmer.
  function place(t) {
    const base = (t / D) * Math.PI * 2;
    cards.forEach((c, i) => {
      const a = base + (i / N) * Math.PI * 2;
      const x = Math.cos(a) * R;
      const yz = Math.sin(a);           // -1 back, +1 front
      const y = yz * R * TILT;
      const s = 0.72 + (yz + 1) * 0.5 * 0.55;
      gsap.set(c, { x, y, scale: s, zIndex: Math.round(100 + yz * 50), opacity: 0.55 + (yz + 1) * 0.5 * 0.45 });
    });
  }
  // an intro/outro on top: the cards spring out from the core and fold back in
  const intro = gsap.timeline({ paused: true });
  const wrap = gsap.timeline({ paused: true });
  wrap.fromTo('.core', { scale: 0.6 }, { scale: 1, duration: 0.8, ease: 'back.out(1.8)' }, 0)
      .fromTo('.ring i', { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.2, ease: 'expo.out', stagger: 0.1 }, 0)
      .fromTo('.ttl, .yr, .ft', { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.6)
      .to('.core', { scale: 1.06, duration: 1, ease: 'sine.inOut', yoyo: true, repeat: 7 }, 1)
      .to('.ttl, .yr, .ft', { opacity: 0, duration: 0.4 }, 9.4)
      .to('.ring i', { scale: 0.2, opacity: 0, duration: 0.5, ease: 'expo.in', stagger: 0.05 }, 9.4)
      .to('.core', { scale: 0.6, duration: 0.5, ease: 'back.in(1.8)' }, 9.5);
  // the spread: 0 at t=0 and t=D, 1 in between (cards fly out and fold in)
  const spreadOf = (t) => {
    if (t < 1) return gsap.parseEase('expo.out')(t / 1);
    if (t > D - 0.6) return 1 - gsap.parseEase('expo.in')((t - (D - 0.6)) / 0.6);
    return 1;
  };
  fx.register({ duration: D, seek(t) {
    wrap.seek(Math.min(t, wrap.duration()), false);
    const sp = spreadOf(t);
    const base = (t / D) * Math.PI * 2;
    cards.forEach((c, i) => {
      const a = base + (i / N) * Math.PI * 2;
      const yz = Math.sin(a);
      const x = Math.cos(a) * R * sp, y = yz * R * TILT * sp;
      const s = (0.72 + (yz + 1) * 0.5 * 0.55) * (0.3 + 0.7 * sp);
      gsap.set(c, { x, y, scale: s, rotation: (1 - sp) * -90, zIndex: Math.round(100 + yz * 50), opacity: (0.55 + (yz + 1) * 0.5 * 0.45) * Math.min(1, sp * 3) });
    });
  }});
</script>
