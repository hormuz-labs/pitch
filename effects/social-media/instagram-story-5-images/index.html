<!doctype html><meta charset="utf-8">
<title>Instagram Story: 5 Images</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0d0d10;color:#fff}
  .rail{position:absolute;left:0;top:0;width:100%;height:100%}
  .card{position:absolute;left:90px;top:360px;width:900px;height:1200px;border-radius:36px;overflow:hidden;background:#222;box-shadow:0 40px 90px rgba(0,0,0,.55);will-change:transform}
  .card .img{position:absolute;inset:-8%;background-size:cover;background-position:center}
  .card .dim{position:absolute;inset:0;background:#000;opacity:0}
  .c1 .img{background-image:url("../../../assets/backgrounds/aurora.png")}
  .c2 .img{background-image:url("../../../assets/backgrounds/sunset.png")}
  .c3 .img{background-image:url("../../../assets/backgrounds/ocean.png")}
  .c4 .img{background-image:url("../../../assets/backgrounds/aurora.png");filter:hue-rotate(120deg)}
  .c5 .img{background-image:url("../../../assets/backgrounds/sunset.png");filter:hue-rotate(-60deg) saturate(1.3)}
  .card .cap{position:absolute;left:44px;bottom:40px;font-size:34px;font-weight:500;letter-spacing:-.01em;text-shadow:0 2px 14px rgba(0,0,0,.5)}
  .card .cap small{display:block;font-size:22px;opacity:.8;font-weight:400;margin-top:8px;letter-spacing:.08em;text-transform:uppercase}
  .top{position:absolute;left:90px;right:90px;top:150px;display:flex;justify-content:space-between;align-items:flex-end}
  .top h1{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:92px;letter-spacing:-.04em;line-height:.95}
  .count{font-size:40px;font-variant-numeric:tabular-nums;letter-spacing:.04em;display:flex;align-items:baseline;gap:6px}
  .count .n{display:inline-block;width:1.2em;height:1em;overflow:hidden;position:relative;vertical-align:baseline}
  .count .n span{position:absolute;left:0;top:0;line-height:1}
  .count .of{opacity:.5;font-size:28px}
  .bar{position:absolute;left:90px;right:90px;top:1640px;height:4px;background:rgba(255,255,255,.18);border-radius:2px}
  .bar b{position:absolute;left:0;top:0;bottom:0;width:100%;background:#fff;transform-origin:left;border-radius:2px}
  .foot{position:absolute;left:90px;top:1690px;font-size:28px;opacity:.7;letter-spacing:.02em}
</style>
<div class="stage">
  <div class="top"><h1>Launch<br>night</h1><div class="count"><span class="n"><span class="digit">1</span></span><span class="of">/ 5</span></div></div>
  <div class="rail">
    <div class="card c5"><div class="img"></div><div class="dim"></div><div class="cap">After hours<small>Frame 05</small></div></div>
    <div class="card c4"><div class="img"></div><div class="dim"></div><div class="cap">The crowd<small>Frame 04</small></div></div>
    <div class="card c3"><div class="img"></div><div class="dim"></div><div class="cap">On stage<small>Frame 03</small></div></div>
    <div class="card c2"><div class="img"></div><div class="dim"></div><div class="cap">Doors open<small>Frame 02</small></div></div>
    <div class="card c1"><div class="img"></div><div class="dim"></div><div class="cap">Arrivals<small>Frame 01</small></div></div>
  </div>
  <div class="bar"><b></b></div>
  <div class="foot">Northwind — Spring showcase, recap</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  const cards = ['.c1', '.c2', '.c3', '.c4', '.c5'];
  const STEP = 0.72, T0 = 0.35;
  const depth = (k) => ({ y: -k * 40, scale: 1 - k * 0.06 });
  cards.forEach((c, i) => { gsap.set(c, depth(i)); gsap.set(c + ' .dim', { opacity: Math.min(0.7, i * 0.22) }); });
  tl.fromTo('.card .img', { xPercent: -3, scale: 1 }, { xPercent: 3, scale: 1.06, duration: 4, ease: 'none' }, 0);
  tl.from('.top h1', { y: 60, opacity: 0, duration: 0.7, ease: 'expo.out' }, 0)
    .from('.foot', { opacity: 0, duration: 0.5 }, 0.3)
    .fromTo('.bar b', { scaleX: 0 }, { scaleX: 1, duration: 4, ease: 'none' }, 0);
  // the flow: the front card peels off upward with a tilt; the stack steps forward
  cards.forEach((c, i) => {
    if (i === 4) return;
    const at = T0 + i * STEP;
    tl.to(c, { y: -1800, rotation: -7, duration: 0.55, ease: 'power3.in' }, at);
    cards.slice(i + 1).forEach((rest, k) => {
      tl.to(rest, { ...depth(k), duration: 0.6, ease: 'expo.out' }, at + 0.15)
        .to(rest + ' .dim', { opacity: Math.min(0.7, k * 0.22), duration: 0.6 }, at + 0.15);
    });
    tl.to('.digit', { yPercent: -100, opacity: 0, duration: 0.2, ease: 'power2.in' }, at + 0.25)
      .set('.digit', { textContent: String(i + 2), yPercent: 100 }, at + 0.45)
      .to('.digit', { yPercent: 0, opacity: 1, duration: 0.3, ease: 'expo.out' }, at + 0.45);
  });
  // loop: the last card leaves and the first four return from below as a fresh stack
  tl.to('.c5', { y: -1800, rotation: -7, duration: 0.45, ease: 'power3.in' }, 3.35)
    .to('.digit', { yPercent: -100, opacity: 0, duration: 0.2 }, 3.5)
    .set('.digit', { textContent: '1', yPercent: 100 }, 3.7)
    .to('.digit', { yPercent: 0, opacity: 1, duration: 0.3, ease: 'expo.out' }, 3.7);
  cards.slice(0, 4).forEach((c, i) => {
    tl.set(c + ' .dim', { opacity: Math.min(0.7, i * 0.22) }, 3.45)
      .fromTo(c, { y: 1700, rotation: 5, scale: 1 - i * 0.06 }, { y: -i * 40, rotation: 0, duration: 0.55, ease: 'move', immediateRender: false }, 3.45 + i * 0.05);
  });
</script>
