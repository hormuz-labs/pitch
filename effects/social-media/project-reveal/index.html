<!doctype html><meta charset="utf-8">
<title>Project Reveal</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#08080a;color:#f2efe9}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:80px 80px}
  .meta{position:absolute;left:80px;top:90px;font-size:18px;letter-spacing:.28em;text-transform:uppercase;line-height:2.3;opacity:.85}
  .meta div{overflow:hidden}.meta span{display:block}
  .meta b{font-weight:500;color:#fff;margin-left:20px}
  .frame{position:absolute;left:80px;top:80px;width:1120px;height:560px;pointer-events:none}
  .frame i{position:absolute;background:rgba(255,255,255,.55)}
  .frame .t{left:0;top:0;width:100%;height:1px;transform-origin:left}
  .frame .b{left:0;bottom:0;width:100%;height:1px;transform-origin:right}
  .frame .l{left:0;top:0;width:1px;height:100%;transform-origin:bottom}
  .frame .r{right:0;top:0;width:1px;height:100%;transform-origin:top}
  .pct{position:absolute;right:80px;top:90px;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-size:96px;font-weight:500;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
  .pct small{display:block;font-size:16px;letter-spacing:.3em;text-transform:uppercase;font-family:"Atlas Grotesk",sans-serif;font-weight:400;opacity:.6;margin-top:10px}
  .loadbar{position:absolute;left:80px;right:80px;top:600px;height:2px;background:rgba(255,255,255,.15)}
  .loadbar b{position:absolute;left:0;top:0;bottom:0;width:100%;background:#fff;transform-origin:left}
  .center{position:absolute;left:0;right:0;top:300px;text-align:center;font-family:"Sorts Mill Goudy",Georgia,serif;font-size:44px;font-style:italic;opacity:.9}
  .center .row{overflow:hidden}.center span{display:block}
  .work{position:absolute;left:80px;top:80px;width:1120px;height:560px;overflow:hidden;background:#111}
  .work .img{position:absolute;inset:-6%;background:url("../../../assets/backgrounds/sunset.png") center/cover}
  .work .ui{position:absolute;left:220px;top:80px;width:680px;height:520px;border-radius:24px 24px 0 0;background:#fff;color:#111;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
  .work .ui .bar{height:44px;background:#f2f2f2;display:flex;align-items:center;gap:8px;padding:0 16px}
  .work .ui .bar i{width:12px;height:12px;border-radius:50%;background:#ddd}
  .work .ui .row{margin:22px 26px 0;height:18px;border-radius:9px;background:#e9e9e9}
  .work .ui .hero{margin:22px 26px 0;height:150px;border-radius:14px;background:linear-gradient(135deg,#ff6a3d,#ffb347)}
  .work .ui .row.s{width:200px}
  .title{position:absolute;left:80px;top:640px;right:80px;display:flex;justify-content:space-between;align-items:flex-end}
  .title h1{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:56px;letter-spacing:-.04em;line-height:1;overflow:hidden}
  .title h1 span{display:block}
  .title .cl{font-size:16px;letter-spacing:.28em;text-transform:uppercase;opacity:.7}
  .flash{position:absolute;inset:0;background:#fff;opacity:0}
</style>
<div class="stage">
  <div class="grid"></div>
  <div class="frame"><i class="t"></i><i class="r"></i><i class="b"></i><i class="l"></i></div>
  <div class="meta">
    <div><span class="m1">Client <b>Northwind</b></span></div>
    <div><span class="m2">Year <b>2026</b></span></div>
    <div><span class="m3">Scope <b>Brand, Web, Motion</b></span></div>
    <div><span class="m4">Studio <b>Vendredi Society</b></span></div>
  </div>
  <div class="pct"><span class="n">00</span><small>Loading project</small></div>
  <div class="center"><div class="row"><span class="c1">Something we've been quietly building</span></div><div class="row"><span class="c2">since January.</span></div></div>
  <div class="loadbar"><b></b></div>
  <div class="work">
    <div class="img"></div>
    <div class="ui"><div class="bar"><i></i><i></i><i></i></div><div class="hero"></div><div class="row"></div><div class="row s"></div></div>
  </div>
  <div class="title"><h1><span>Northwind — Rebrand</span></h1><div class="cl">Case study · 01</div></div>
  <div class="flash"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 10 });
  gsap.set('.work', { clipPath: 'inset(0 0 100% 0)' });
  gsap.set('.title h1 span', { yPercent: 120 });
  gsap.set('.title .cl', { opacity: 0 });
  // the build: frame lines draw, meta lines arrive one at a time, the counter climbs slowly
  tl.from('.frame .t', { scaleX: 0, duration: 1.2, ease: 'expo.inOut' }, 0)
    .from('.frame .r', { scaleY: 0, duration: 1.0, ease: 'expo.inOut' }, 0.6)
    .from('.frame .b', { scaleX: 0, duration: 1.2, ease: 'expo.inOut' }, 1.2)
    .from('.frame .l', { scaleY: 0, duration: 1.0, ease: 'expo.inOut' }, 1.8);
  tl.from('.m1', { yPercent: 110, duration: 0.7, ease: 'expo.out' }, 0.8)
    .from('.m2', { yPercent: 110, duration: 0.7, ease: 'expo.out' }, 1.7)
    .from('.m3', { yPercent: 110, duration: 0.7, ease: 'expo.out' }, 2.6)
    .from('.m4', { yPercent: 110, duration: 0.7, ease: 'expo.out' }, 3.5);
  tl.from('.c1', { yPercent: 110, duration: 0.9, ease: 'expo.out' }, 2.2)
    .from('.c2', { yPercent: 110, duration: 0.9, ease: 'expo.out' }, 2.5);
  const cnt = { v: 0 };
  tl.from('.pct', { opacity: 0, duration: 0.6 }, 0.4)
    .to(cnt, { v: 100, duration: 6.2, ease: 'power2.inOut', onUpdate() { document.querySelector('.pct .n').textContent = String(Math.round(cnt.v)).padStart(2, '0'); } }, 0.6)
    .fromTo('.loadbar b', { scaleX: 0 }, { scaleX: 1, duration: 6.2, ease: 'power2.inOut' }, 0.6);
  tl.fromTo('.grid', { backgroundPosition: '0 0' }, { backgroundPosition: '80px 80px', duration: 10, ease: 'none' }, 0);
  // the tension: everything pulls tight toward the centre just before the reveal
  tl.to('.meta, .center', { opacity: 0, y: -20, duration: 0.4, ease: 'power2.in' }, 6.5)
    .to('.pct', { opacity: 0, y: -20, duration: 0.4, ease: 'power2.in' }, 6.6)
    .to('.loadbar', { opacity: 0, duration: 0.3 }, 6.7);
  // the reveal: a flash, the work wipes down, the title snaps in
  tl.to('.flash', { opacity: 1, duration: 0.08 }, 6.9)
    .to('.flash', { opacity: 0, duration: 0.6, ease: 'power2.out' }, 6.98)
    .to('.work', { clipPath: 'inset(0 0 0% 0)', duration: 0.9, ease: 'expo.inOut' }, 6.9)
    .fromTo('.work .img', { scale: 1.15 }, { scale: 1.0, duration: 3, ease: 'power2.out' }, 6.9)
    .fromTo('.work .ui', { y: 240 }, { y: 0, duration: 1.2, ease: 'move' }, 7.2)
    .to('.title h1 span', { yPercent: 0, duration: 0.8, ease: 'expo.out' }, 7.4)
    .to('.title .cl', { opacity: 1, duration: 0.5 }, 7.7)
    .to('.frame i', { opacity: 0, duration: 0.3 }, 7.0);
  // loop: the work lifts away and the stage is dark again
  tl.to('.work', { clipPath: 'inset(100% 0 0 0)', duration: 0.6, ease: 'expo.in' }, 9.4)
    .to('.title h1 span', { yPercent: -120, duration: 0.4, ease: 'expo.in' }, 9.5)
    .to('.title .cl', { opacity: 0, duration: 0.3 }, 9.5);
</script>
