<!doctype html><meta charset="utf-8">
<title>Instagram Stories: Collage</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#efe9de}
  .paper{position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1.2px);background-size:18px 18px}
  .tile{position:absolute;background:#fff;padding:14px 14px 40px;box-shadow:0 24px 50px rgba(0,0,0,.22);transform-origin:50% 50%}
  .tile i{display:block;width:100%;height:100%;background:center/cover}
  .tape{position:absolute;width:150px;height:38px;background:rgba(255,224,130,.75);left:50%;top:-16px;transform:translateX(-50%) rotate(-4deg);box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .t1{left:70px;top:230px;width:560px;height:660px}.t1 i{background-image:url("../../../assets/backgrounds/sunset.png")}
  .t2{left:470px;top:560px;width:540px;height:560px}.t2 i{background-image:url("../../../assets/backgrounds/ocean.png")}
  .t3{left:120px;top:1000px;width:480px;height:620px}.t3 i{background-image:url("../../../assets/backgrounds/aurora.png")}
  .t4{left:560px;top:1150px;width:440px;height:440px}.t4 i{background-image:url("../../../assets/backgrounds/ocean.png");filter:hue-rotate(120deg)}
  .t5{left:640px;top:300px;width:340px;height:340px}.t5 i{background-image:url("../../../assets/backgrounds/aurora.png");filter:hue-rotate(-80deg)}
  .word{position:absolute;left:0;right:0;text-align:center;font:400 190px/1 "Sorts Mill Goudy",serif;color:#161616;letter-spacing:-.03em}
  .word em{font-style:italic}
  .w1{top:60px}.w2{top:1660px}
  .sticker{position:absolute;left:720px;top:960px;width:250px;height:250px;border-radius:50%;background:#ff3b1f;color:#fff;display:flex;align-items:center;justify-content:center;font:500 34px "Sharp Grotesk","Atlas Grotesk",sans-serif;text-transform:uppercase;letter-spacing:.05em;text-align:center;line-height:1.05;transform:rotate(-12deg)}
</style>
<div class="stage">
  <div class="paper"></div>
  <div class="word w1" id="w1">Mood <em>board</em></div>
  <div class="tile t1"><i></i><span class="tape"></span></div>
  <div class="tile t5"><i></i><span class="tape"></span></div>
  <div class="tile t2"><i></i><span class="tape"></span></div>
  <div class="tile t3"><i></i><span class="tape"></span></div>
  <div class="tile t4"><i></i><span class="tape"></span></div>
  <div class="sticker">New<br>drop</div>
  <div class="word w2" id="w2">Vol. <em>04</em></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  const rot = [-6, 5, -3, 7, -9];
  const tiles = gsap.utils.toArray('.tile');
  tiles.forEach((t, i) => gsap.set(t, { rotation: rot[i] }));
  // tiles get thrown onto the board from off-frame, each from a different side, landing with a small settle
  tl.from('.w1', { y: -160, opacity: 0, duration: .8, ease: 'expo.out' }, 0)
    .from('.t1', { x: -900, y: -300, rotation: -40, duration: .7, ease: 'move' }, .1)
    .from('.t5', { x: 900, y: -500, rotation: 40, duration: .7, ease: 'move' }, .25)
    .from('.t2', { x: 900, y: 300, rotation: 30, duration: .7, ease: 'move' }, .4)
    .from('.t3', { x: -900, y: 700, rotation: -30, duration: .7, ease: 'move' }, .55)
    .from('.t4', { y: 1200, rotation: 25, duration: .7, ease: 'move' }, .7)
    .from('.sticker', { scale: 0, rotation: 180, duration: .6, ease: 'back.out(2.5)' }, 1.2)
    .from('.w2', { y: 160, opacity: 0, duration: .8, ease: 'expo.out' }, 1.0)
    .from('.tape', { scaleX: 0, stagger: .1, duration: .3, ease: 'power2.out' }, .7);
  // settle wobble on landing, then a slow float while held
  tiles.forEach((t, i) => {
    tl.to(t, { rotation: rot[i] + (i % 2 ? -2 : 2), duration: .25, ease: 'power2.out' }, .6 + i * .15)
      .to(t, { rotation: rot[i], duration: .4, ease: 'elastic.out(1,.5)' }, .85 + i * .15)
      .to(t, { y: i % 2 ? -14 : 12, duration: 1.2, ease: 'sine.inOut' }, 1.7)
      .to(t, { y: 0, duration: 1, ease: 'sine.inOut' }, 2.9);
  });
  tl.to('.sticker', { rotation: -2, duration: 1.4, ease: 'sine.inOut' }, 1.8).to('.sticker', { rotation: -12, duration: 1, ease: 'sine.inOut' }, 3.2)
    // scatter out for the loop
    .to('.t4,.t3,.t2,.t5,.t1', { x: i => (i % 2 ? 1 : -1) * 1100, rotation: i => (i % 2 ? 1 : -1) * 40, stagger: .05, duration: .45, ease: 'expo.in' }, 3.45)
    .to('.sticker', { scale: 0, duration: .3, ease: 'back.in(2)' }, 3.5)
    .to('.w1', { y: -160, opacity: 0, duration: .35, ease: 'expo.in' }, 3.6)
    .to('.w2', { y: 160, opacity: 0, duration: .35, ease: 'expo.in' }, 3.6);
</script>
