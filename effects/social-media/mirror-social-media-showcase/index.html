<!doctype html><meta charset="utf-8">
<title>Mirror: Social Media Showcase</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0a0a0c;color:#fff}
  .half{position:absolute;top:0;width:540px;height:1080px;overflow:hidden}
  .half.l{left:0}
  .half.r{left:540px;transform:scaleX(-1)}
  .half.r .word{transform:scaleX(-1)}
  .axis{position:absolute;left:539px;top:0;width:2px;height:1080px;background:rgba(255,255,255,.35);transform-origin:center}
  .pic{position:absolute;left:60px;top:200px;width:560px;height:680px;border-radius:24px 0 0 24px;overflow:hidden;background:#222}
  .pic .img{position:absolute;inset:-8%;background-size:cover;background-position:center}
  .pic.a .img{background-image:url("../../../assets/backgrounds/aurora.png")}
  .pic.b .img{background-image:url("../../../assets/backgrounds/sunset.png")}
  .pic.c .img{background-image:url("../../../assets/backgrounds/ocean.png")}
  .word{position:absolute;left:60px;top:930px;width:480px;height:80px;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:74px;letter-spacing:-.03em;line-height:1;overflow:hidden;white-space:nowrap}
  .word span{display:block}
  .tag{position:absolute;left:60px;top:120px;font-size:22px;letter-spacing:.3em;text-transform:uppercase;opacity:.7}
  .n{position:absolute;left:60px;top:150px;font-size:22px;letter-spacing:.3em;opacity:.7}
  .center{position:absolute;left:0;top:0;width:1080px;height:1080px;pointer-events:none}
  .center .lbl{position:absolute;left:0;right:0;top:1038px;text-align:center;font-size:20px;letter-spacing:.32em;text-transform:uppercase;opacity:.55}
  .center .logo{position:absolute;left:510px;top:30px;width:60px;height:60px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center}
  .center .logo:after{content:"";width:22px;height:22px;background:#fff;transform:rotate(45deg)}
</style>
<div class="stage">
  <div class="half l">
    <div class="pic a"><div class="img"></div></div>
    <div class="pic b"><div class="img"></div></div>
    <div class="pic c"><div class="img"></div></div>
    <div class="tag">Acme Studio</div>
    <div class="word"><span class="w1">Symmetry</span><span class="w2">Balance</span><span class="w3">Reflect</span></div>
  </div>
  <div class="half r">
    <div class="pic a"><div class="img"></div></div>
    <div class="pic b"><div class="img"></div></div>
    <div class="pic c"><div class="img"></div></div>
    <div class="tag">Acme Studio</div>
    <div class="word"><span class="w1">Symmetry</span><span class="w2">Balance</span><span class="w3">Reflect</span></div>
  </div>
  <div class="axis"></div>
  <div class="center"><div class="logo"></div><div class="lbl">Showcase — 2026</div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  gsap.set('.word span', { position: 'absolute', left: 0, top: 0 });
  gsap.set('.half.r .tag', { scaleX: -1 });
  gsap.set('.w2, .w3', { yPercent: 110 });
  gsap.set('.pic.b, .pic.c', { xPercent: -110 });
  // the axis draws, the logo drops
  tl.from('.axis', { scaleY: 0, duration: 0.8, ease: 'expo.inOut' }, 0)
    .from('.center .logo', { y: -100, opacity: 0, duration: 0.6, ease: 'back.out(2)' }, 0.5)
    .from('.center .lbl', { opacity: 0, duration: 0.5 }, 0.7)
    .from('.tag', { opacity: 0, x: -20, duration: 0.5 }, 0.6);
  // the first picture slides toward the axis from both sides (the mirror does the same in reverse)
  tl.from('.pic.a', { xPercent: -110, duration: 0.9, ease: 'expo.out' }, 0.2)
    .from('.w1', { yPercent: 110, duration: 0.7, ease: 'expo.out' }, 0.6);
  // the pictures drift toward the centre line, always
  tl.fromTo('.pic .img', { xPercent: -3 }, { xPercent: 3, duration: 4, ease: 'none' }, 0);
  // swap 1
  tl.to('.pic.a', { xPercent: 20, duration: 0.7, ease: 'expo.inOut' }, 1.5)
    .to('.pic.b', { xPercent: 0, duration: 0.7, ease: 'expo.inOut' }, 1.5)
    .to('.w1', { yPercent: -110, duration: 0.4, ease: 'expo.in' }, 1.5)
    .to('.w2', { yPercent: 0, duration: 0.6, ease: 'expo.out' }, 1.75);
  // swap 2
  tl.to('.pic.b', { xPercent: 20, duration: 0.7, ease: 'expo.inOut' }, 2.6)
    .to('.pic.c', { xPercent: 0, duration: 0.7, ease: 'expo.inOut' }, 2.6)
    .to('.w2', { yPercent: -110, duration: 0.4, ease: 'expo.in' }, 2.6)
    .to('.w3', { yPercent: 0, duration: 0.6, ease: 'expo.out' }, 2.85);
  // exit: everything folds back into the axis
  tl.to('.pic', { xPercent: -110, duration: 0.5, ease: 'expo.in' }, 3.5)
    .to('.w3', { yPercent: -110, duration: 0.35, ease: 'expo.in' }, 3.55)
    .to('.tag, .center .lbl, .center .logo', { opacity: 0, duration: 0.3 }, 3.6)
    .to('.axis', { scaleY: 0, duration: 0.4, ease: 'expo.in' }, 3.6);
</script>
