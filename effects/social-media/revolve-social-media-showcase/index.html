<!doctype html><meta charset="utf-8">
<title>Revolve: Social Media Showcase</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#111014;color:#fff}
  .pivot{position:absolute;left:540px;top:2300px;width:0;height:0}
  .arm{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
  .slide{position:absolute;left:-380px;top:-1800px;width:760px;height:1000px;border-radius:40px;overflow:hidden;background:#222;box-shadow:0 40px 100px rgba(0,0,0,.6)}
  .slide .img{position:absolute;inset:-8%;background-size:cover;background-position:center}
  .s1 .img{background-image:url("../../../assets/backgrounds/sunset.png")}
  .s2 .img{background-image:url("../../../assets/backgrounds/ocean.png")}
  .s3 .img{background-image:url("../../../assets/backgrounds/aurora.png")}
  .s4 .img{background-image:url("../../../assets/backgrounds/sunset.png");filter:hue-rotate(200deg)}
  .slide .cap{position:absolute;left:44px;bottom:44px;font-size:40px;font-weight:500;letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.5)}
  .slide .cap small{display:block;font-size:22px;letter-spacing:.2em;text-transform:uppercase;opacity:.8;font-weight:400;margin-top:8px}
  .head{position:absolute;left:80px;top:180px;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:110px;letter-spacing:-.04em;line-height:.95;overflow:hidden}
  .head span{display:block}
  .idx{position:absolute;right:80px;top:200px;font-size:34px;letter-spacing:.2em;font-variant-numeric:tabular-nums;overflow:hidden;height:44px}
  .idx span{display:block;line-height:44px}
  .dial{position:absolute;left:0;right:0;top:1700px;display:flex;justify-content:center;gap:16px}
  .dial i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.25)}
  .dial i.on{background:#fff}
  .hint{position:absolute;left:80px;top:1780px;font-size:24px;letter-spacing:.24em;text-transform:uppercase;opacity:.55}
</style>
<div class="stage">
  <div class="head"><span>Revolve</span></div>
  <div class="idx"><span class="i1">01 / 04</span><span class="i2">02 / 04</span><span class="i3">03 / 04</span><span class="i4">04 / 04</span></div>
  <div class="pivot">
    <div class="arm a4"><div class="slide s4"><div class="img"></div><div class="cap">Dune<small>Print series</small></div></div></div>
    <div class="arm a3"><div class="slide s3"><div class="img"></div><div class="cap">Aurora<small>App identity</small></div></div></div>
    <div class="arm a2"><div class="slide s2"><div class="img"></div><div class="cap">Tide<small>Web platform</small></div></div></div>
    <div class="arm a1"><div class="slide s1"><div class="img"></div><div class="cap">Ember<small>Campaign film</small></div></div></div>
  </div>
  <div class="dial"><i class="d1 on"></i><i class="d2"></i><i class="d3"></i><i class="d4"></i></div>
  <div class="hint">Acme Studio — Portfolio 2026</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 8 });
  const arms = ['.a1', '.a2', '.a3', '.a4'];
  // each slide waits below the frame, rotated on the pivot, and spins up into place
  arms.forEach((a, i) => gsap.set(a, { rotation: i === 0 ? 0 : 80 }));
  gsap.set('.slide', { transformOrigin: 'center' });
  tl.from('.head span', { yPercent: 110, duration: 0.8, ease: 'expo.out' }, 0)
    .from('.hint', { opacity: 0, duration: 0.6 }, 0.4);
  tl.from('.a1', { rotation: 80, duration: 1.1, ease: 'expo.out' }, 0.1);
  tl.fromTo('.slide .img', { scale: 1, xPercent: -2 }, { scale: 1.06, xPercent: 2, duration: 8, ease: 'none' }, 0);
  // every 1.8s the current slide revolves out to the left while the next one revolves in from the right
  for (let i = 1; i < 4; i++) {
    const at = 0.4 + i * 1.8;
    tl.to(arms[i - 1], { rotation: -80, duration: 1.0, ease: 'expo.inOut' }, at)
      .to(arms[i], { rotation: 0, duration: 1.1, ease: 'expo.out' }, at + 0.15)
      .to('.idx span', { yPercent: -100 * i, duration: 0.4, ease: 'expo.inOut' }, at + 0.3)
      .to(`.d${i}`, { backgroundColor: 'rgba(255,255,255,.25)', duration: 0.3 }, at + 0.3)
      .to(`.d${i + 1}`, { backgroundColor: '#fff', duration: 0.3 }, at + 0.3);
  }
  // loop: the last slide spins out and everything resets
  tl.to('.a4', { rotation: -80, duration: 0.8, ease: 'expo.in' }, 7.0)
    .to('.head span', { yPercent: -110, duration: 0.4, ease: 'expo.in' }, 7.3)
    .to('.hint, .idx, .dial', { opacity: 0, duration: 0.3 }, 7.4);
</script>
