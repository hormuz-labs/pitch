<!doctype html><meta charset="utf-8">
<title>Image Carousel: Parallax</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0e0e10}
  .bgs{position:absolute;inset:0}
  .bg{position:absolute;inset:-10%;background:center/cover;filter:blur(30px) saturate(1.3);opacity:0}
  .track{position:absolute;left:0;top:130px;height:460px;display:flex;gap:40px;padding-left:280px;will-change:transform}
  .card{width:720px;height:460px;border-radius:20px;overflow:hidden;position:relative;flex:none;box-shadow:0 30px 60px rgba(0,0,0,.5)}
  .card i{position:absolute;top:0;bottom:0;left:-15%;width:130%;background:center/cover;will-change:transform}
  .card .cap{position:absolute;left:34px;bottom:30px;color:#fff;font:400 16px "Atlas Grotesk",sans-serif;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
  .card h2{position:absolute;left:34px;bottom:58px;color:#fff;font:400 54px/1 "Sorts Mill Goudy",serif;letter-spacing:-.01em}
  .card::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.5),transparent 55%)}
  .i1{background-image:url("../../../assets/backgrounds/sunset.png")}
  .i2{background-image:url("../../../assets/backgrounds/ocean.png")}
  .i3{background-image:url("../../../assets/backgrounds/aurora.png")}
  .dots{position:absolute;left:0;right:0;bottom:60px;display:flex;justify-content:center;gap:10px}
  .dots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.35)}
  .dots i.on{background:#fff;width:28px}
  .num{position:absolute;right:60px;top:60px;color:#fff;font:400 15px "Atlas Grotesk",sans-serif;letter-spacing:.25em}
  .num b{font-weight:500}
</style>
<div class="stage">
  <div class="bgs"><div class="bg i1"></div><div class="bg i2"></div><div class="bg i3"></div></div>
  <div class="num"><b id="n">01</b> / 03</div>
  <div class="track" id="track">
    <div class="card"><i class="i1"></i><h2>Evening tide</h2><span class="cap">Editorial · Sept</span></div>
    <div class="card"><i class="i2"></i><h2>Open water</h2><span class="cap">Editorial · Oct</span></div>
    <div class="card"><i class="i3"></i><h2>North light</h2><span class="cap">Editorial · Nov</span></div>
    <div class="card"><i class="i1"></i><h2>Evening tide</h2><span class="cap">Editorial · Sept</span></div>
  </div>
  <div class="dots"><i class="on"></i><i></i><i></i></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 8 });
  const step = 760, imgs = gsap.utils.toArray('.card i'), bgs = gsap.utils.toArray('.bg'), dots = gsap.utils.toArray('.dots i');
  const n = document.getElementById('n');
  gsap.set(bgs[0], { opacity: .45 });
  // the track moves 3 steps (the 4th card is the 1st again, so the loop closes); the images inside move
  // in the opposite direction at ~40% speed, the blurred background at ~20%: three planes, three speeds.
  const move = (k, at) => {
    tl.to('#track', { x: -step * k, duration: 1.2, ease: 'expo.inOut' }, at)
      .to(imgs, { x: step * k * .4 % (step * .4 * 4), duration: 1.2, ease: 'expo.inOut' }, at)
      .to('.bgs', { x: -step * k * .12, duration: 1.2, ease: 'expo.inOut' }, at)
      .to(bgs, { opacity: i => (i === k % 3 ? .45 : 0), duration: 1.2 }, at)
      .call(() => { n.textContent = '0' + ((k % 3) + 1); dots.forEach((d, i) => d.classList.toggle('on', i === k % 3)); }, null, at + .6);
  };
  // idle drift on each hold so nothing is ever still
  tl.fromTo('.card', { scale: 1 }, { scale: 1.02, duration: 8, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  move(1, 1.6); move(2, 4.1); move(3, 6.6);
  tl.to('.dots', { opacity: 0, duration: .01 }, 7.99);
</script>
