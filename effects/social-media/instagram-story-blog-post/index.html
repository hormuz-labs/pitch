<!doctype html><meta charset="utf-8">
<title>Instagram Story: Blog Post</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#fbf8f1;color:#151515}
  .hero{position:absolute;left:80px;top:170px;width:920px;height:640px;border-radius:32px;overflow:hidden;background:#ccc}
  .hero .img{position:absolute;inset:-6%;background:url("../../../assets/backgrounds/ocean.png") center/cover}
  .hero .veil{position:absolute;inset:0;background:#fbf8f1;transform-origin:right}
  .tag{position:absolute;left:80px;top:880px;display:inline-flex;align-items:center;gap:14px;padding:14px 26px;border-radius:999px;background:#151515;color:#fbf8f1;font-size:26px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
  .tag i{width:12px;height:12px;border-radius:50%;background:#ff5a36}
  .title{position:absolute;left:80px;right:80px;top:970px;font-family:"Sorts Mill Goudy",Georgia,serif;font-size:104px;line-height:1.02;letter-spacing:-.02em}
  .title .row{overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
  .title .ln{display:block;will-change:transform}
  .excerpt{position:absolute;left:80px;right:80px;top:1350px;font-size:34px;line-height:1.45;color:#444}
  .excerpt .w{display:inline-block;white-space:pre}
  .meta{position:absolute;left:80px;top:1560px;font-size:26px;letter-spacing:.06em;text-transform:uppercase;color:#777;display:flex;gap:26px;align-items:center}
  .meta .rule{width:60px;height:2px;background:#151515;transform-origin:left}
  .cta{position:absolute;left:80px;top:1660px;display:inline-flex;align-items:center;gap:22px;padding:24px 40px;border-radius:18px;background:#ff5a36;color:#fff;font-size:32px;font-weight:500}
  .cta .arr{display:inline-block;width:34px;height:34px;position:relative}
  .cta .arr:before{content:"";position:absolute;left:0;top:50%;width:30px;height:3px;background:#fff;margin-top:-1.5px}
  .cta .arr:after{content:"";position:absolute;right:2px;top:50%;width:14px;height:14px;border-top:3px solid #fff;border-right:3px solid #fff;transform:translateY(-50%) rotate(45deg)}
  .brand{position:absolute;right:80px;top:1680px;font-size:26px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;opacity:.6}
</style>
<div class="stage">
  <div class="hero"><div class="img"></div><div class="veil"></div></div>
  <div class="tag"><i></i>New on the blog</div>
  <div class="title">
    <div class="row"><span class="ln">Why slow</span></div>
    <div class="row"><span class="ln">mornings make</span></div>
    <div class="row"><span class="ln">better work</span></div>
  </div>
  <div class="excerpt" id="ex">A short essay on rituals, quiet hours and the case for doing less before noon.</div>
  <div class="meta"><span class="rule"></span><span class="mt">6 min read · Culture</span></div>
  <div class="cta"><span>Read the article</span><span class="arr"></span></div>
  <div class="brand">Northwind Journal</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const ex = document.getElementById('ex');
  ex.innerHTML = ex.textContent.split(' ').map(w => `<span class="w">${w} </span>`).join('');
  const tl = fx.timeline({ duration: 4 });
  tl.fromTo('.hero .img', { scale: 1.12, yPercent: -3 }, { scale: 1.0, yPercent: 3, duration: 4, ease: 'none' }, 0)
    .to('.hero .veil', { scaleX: 0, duration: 0.9, ease: 'expo.inOut' }, 0.05)
    .from('.hero', { y: 60, duration: 0.9, ease: 'expo.out' }, 0.05);
  tl.from('.tag', { scaleX: 0, transformOrigin: 'left center', duration: 0.6, ease: 'expo.out' }, 0.5)
    .from('.tag i', { scale: 0, duration: 0.4, ease: 'back.out(3)' }, 0.85);
  tl.from('.title .ln', { yPercent: 110, rotation: 3, transformOrigin: 'left top', duration: 0.8, ease: 'expo.out', stagger: 0.12 }, 0.7);
  tl.from('.excerpt .w', { opacity: 0, y: 18, duration: 0.5, ease: 'power3.out', stagger: 0.035 }, 1.25);
  tl.from('.meta .rule', { scaleX: 0, duration: 0.5, ease: 'expo.out' }, 1.7)
    .from('.mt', { opacity: 0, x: -20, duration: 0.5, ease: 'power3.out' }, 1.85);
  tl.from('.cta', { y: 40, opacity: 0, duration: 0.6, ease: 'back.out(1.6)' }, 2.0)
    .from('.brand', { opacity: 0, duration: 0.5 }, 2.2);
  // the arrow nudges until the exit
  tl.to('.cta .arr', { x: 10, duration: 0.35, ease: 'power2.inOut', yoyo: true, repeat: 3 }, 2.4);
  // exit: lines drop out in order, the veil closes over the hero
  tl.to('.title .ln', { yPercent: -110, duration: 0.4, ease: 'expo.in', stagger: 0.06 }, 3.35)
    .to('.excerpt, .meta, .cta, .brand, .tag', { opacity: 0, y: -20, duration: 0.3, ease: 'power2.in', stagger: 0.03 }, 3.45)
    .to('.hero .veil', { scaleX: 1, transformOrigin: 'left', duration: 0.45, ease: 'expo.in' }, 3.5);
</script>
