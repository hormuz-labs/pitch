<!doctype html><meta charset="utf-8">
<title>Drop It Like It's Hot: Mask</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f2efe8;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif}
  .bg{position:absolute;inset:0;background:center/cover;will-change:transform}
  .b1{background-image:url("../../../assets/backgrounds/sunset.png")}
  .b2{background-image:url("../../../assets/backgrounds/ocean.png")}
  .b3{background-image:url("../../../assets/backgrounds/aurora.png")}
  .maskText{position:absolute;inset:0}
  .maskText svg{width:100%;height:100%}
  .maskText text{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:300px;letter-spacing:-.06em;text-anchor:middle;text-transform:uppercase}
  .word{position:absolute;left:0;right:0;text-align:center;font-weight:500;font-size:240px;letter-spacing:-.06em;line-height:.85;text-transform:uppercase;color:#111}
  .word.w{color:#f2efe8}
  .circ{position:absolute;inset:0;background:#111;clip-path:circle(0% at 50% 50%)}
  .bar{position:absolute;left:0;right:0;height:25%;background:center/cover;background-image:url("../../../assets/backgrounds/aurora.png");background-attachment:fixed}
  .bars{position:absolute;inset:0}
  .bars .bar{background:#ff3b1f}
  .bars .bar:nth-child(2n){background:#ffd23f}
  .lead{position:absolute;left:60px;bottom:50px;font:400 22px "Atlas Grotesk",sans-serif;color:#111;letter-spacing:.02em;text-transform:uppercase}
  .lead2{left:auto;right:60px}
</style>
<div class="stage">
  <div class="bg b1" id="bg1"></div>
  <!-- image seen through the letters -->
  <div class="maskText" id="mt">
    <svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
      <defs><mask id="m1"><rect width="1280" height="720" fill="#fff"/><text id="tx" x="640" y="470" fill="#000">DROP</text></mask></defs>
      <rect width="1280" height="720" fill="#f2efe8" mask="url(#m1)"/>
    </svg>
  </div>
  <div class="circ" id="circ"></div>
  <div class="word w" id="wIt" style="top:240px">IT</div>
  <div class="bg b2" id="bg2" style="clip-path:inset(50% 0 50% 0)"></div>
  <div class="word" id="wLike" style="top:240px;color:#fff">LIKE</div>
  <div class="bars" id="bars"><div class="bar" style="top:0"></div><div class="bar" style="top:25%"></div><div class="bar" style="top:50%"></div><div class="bar" style="top:75%"></div></div>
  <div class="bg b3" id="bg3" style="clip-path:polygon(0 0,0 0,0 100%,0 100%)"></div>
  <div class="word" id="wHot" style="top:240px;color:#fff">HOT</div>
  <div class="lead" id="l1">Savee · Showreel 2026</div>
  <div class="lead lead2" id="l2">Vol. 01</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 10 });
  gsap.set('#wIt,#wLike,#wHot,#bars,#bg3', { autoAlpha: 0 });
  gsap.set('.bars .bar', { scaleX: 0, transformOrigin: '0 50%' });
  gsap.set('#tx', { transformOrigin: '640px 400px' });
  // 0–2.6: DROP as a knockout mask — the letters drop in from above, image drifts behind, then the mask blows up to reveal the image full-bleed
  tl.fromTo('#bg1', { scale: 1.25 }, { scale: 1.05, duration: 3, ease: 'none' }, 0)
    .from('#tx', { y: -700, duration: .8, ease: 'expo.out' }, 0)
    .fromTo('#tx', { scaleY: 1 }, { scaleY: .82, duration: .12, ease: 'power2.out', yoyo: true, repeat: 1 }, .7)
    .to('#tx', { scale: 14, duration: .9, ease: 'expo.in' }, 1.9)
    .from('#l1,#l2', { y: 20, opacity: 0, stagger: .1, duration: .5 }, .6)
    // 2.8: black circle mask blooms from the centre; IT lands with a bounce
    .to('#circ', { clipPath: 'circle(75% at 50% 50%)', duration: .7, ease: 'expo.inOut' }, 2.8)
    .set('#wIt', { autoAlpha: 1 }, 3.1)
    .from('#wIt', { y: -500, duration: .7, ease: 'bounce.out' }, 3.1)
    .to('#wIt', { scaleX: 1.15, scaleY: .85, duration: .1, yoyo: true, repeat: 1, ease: 'power1.inOut' }, 3.7)
    // 4.4: horizontal letterbox mask slices open to the ocean; LIKE drops through
    .to('#bg2', { clipPath: 'inset(0% 0 0% 0)', duration: .6, ease: 'expo.inOut' }, 4.4)
    .fromTo('#bg2', { scale: 1.2 }, { scale: 1, duration: 2, ease: 'none' }, 4.4)
    .set('#wLike', { autoAlpha: 1 }, 4.7).set('#wIt,#circ', { autoAlpha: 0 }, 5)
    .from('#wLike', { yPercent: -250, duration: .6, ease: 'move' }, 4.7)
    .to('#wLike', { yPercent: 250, duration: .45, ease: 'expo.in' }, 6)
    // 6.2: striped bar mask rips across, then aurora wipes diagonally; HOT snaps in
    .set('#bars', { autoAlpha: 1 }, 6.2)
    .to('.bars .bar', { scaleX: 1, stagger: .07, duration: .45, ease: 'expo.inOut' }, 6.2)
    .set('#bg3', { autoAlpha: 1 }, 6.8)
    .to('#bg3', { clipPath: 'polygon(0 0,100% 0,100% 100%,0 100%)', duration: .7, ease: 'expo.inOut' }, 6.8)
    .fromTo('#bg3', { scale: 1.15 }, { scale: 1, duration: 3, ease: 'none' }, 6.8)
    .set('#bars,#bg2', { autoAlpha: 0 }, 7.5)
    .set('#wHot', { autoAlpha: 1 }, 7.2)
    .fromTo('#wHot', { scale: 4, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: 'expo.out' }, 7.2)
    .to('#wHot', { letterSpacing: '.05em', duration: 1.6, ease: 'none' }, 7.7)
    // 9.2: everything masks back to the cream for the loop
    .set('#mt', { clipPath: 'inset(0 0 100% 0)' }, 9.2).to('#mt', { clipPath: 'inset(0 0 0% 0)', duration: .6, ease: 'expo.inOut' }, 9.2)
    .set('#mt svg rect', { attr: { mask: 'none' } }, 9.2)
    .to('#l1,#l2,#wHot,#bg3', { autoAlpha: 0, duration: .3 }, 9.5)
    .set('#mt svg rect', { attr: { mask: 'url(#m1)' } }, 9.99);
</script>
