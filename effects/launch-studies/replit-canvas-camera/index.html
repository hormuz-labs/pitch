<!doctype html><meta charset="utf-8">
<title>Replit Canvas Camera</title>
<meta name="fx" content="w=1920 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  :root{--ink:#161616;--paper:#f7f6f1;--red:#ff4b1f;--blue:#3157e7}
  .stage{background:var(--paper);color:var(--ink);font-family:"Atlas Grotesk",Arial,sans-serif}
  .grid{position:absolute;inset:0;background-image:linear-gradient(#deddd7 1px,transparent 1px),linear-gradient(90deg,#deddd7 1px,transparent 1px);background-size:120px 120px;opacity:.55}
  .world{position:absolute;left:0;top:0;width:2600px;height:1500px;will-change:transform,filter}
  .card{position:absolute;border:2px solid #171717;border-radius:28px;overflow:hidden;background:#e9e4d1;box-shadow:0 20px 60px #392b1517}
  .vault{left:170px;top:130px;width:980px;height:660px;display:grid;grid-template:1.4fr 1fr/1.35fr 1fr 1fr;background:#d8cc6b}
  .tile{position:relative;border-right:2px solid #151515;border-bottom:2px solid #151515;padding:26px;font-size:30px;letter-spacing:-.04em}
  .tile.hero{grid-row:span 2;background:radial-gradient(ellipse at 70% 10%,#e8523f 0 18%,transparent 19%),radial-gradient(ellipse at 40% 45%,#315c38 0 24%,transparent 25%),radial-gradient(ellipse at 72% 75%,#e47a4b 0 26%,transparent 27%),#dfd2bd;color:#fff;font-size:48px}
  .tile strong{font:500 72px/1 "Sharp Grotesk",Arial,sans-serif}.tile small{position:absolute;bottom:22px;left:26px;font-size:17px}
  .serum{left:1350px;top:105px;width:1050px;height:620px;background:#fbfaf6;padding:34px}.serum .mega{font:500 150px/.75 "Sharp Grotesk",Arial,sans-serif;letter-spacing:-.075em}.serum .bottle{position:absolute;left:470px;top:190px;width:120px;height:260px;background:linear-gradient(90deg,#e7ded3,#fff,#d8cfc3);border-radius:16px 16px 26px 26px;box-shadow:0 22px 40px #0002}.serum .orb{position:absolute;right:70px;top:90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffdbf8,#9c62ef 50%,#4d36ba);mix-blend-mode:multiply}
  .money{left:1260px;top:825px;width:1180px;height:590px;background:#352ed7;color:white}.money .headline{position:absolute;left:250px;top:115px;width:680px;text-align:center;font:500 76px/.88 "Sharp Grotesk",Arial,sans-serif;letter-spacing:-.055em}.money .flower{position:absolute;width:260px;height:260px;border-radius:50%;filter:saturate(1.3);background:repeating-conic-gradient(#f6f 0 12deg,#6ff 13deg 24deg,#ff9 25deg 36deg)}.money .f1{left:-70px;top:-45px}.money .f2{right:-55px;bottom:-60px}.money .note{position:absolute;left:410px;top:350px;width:360px;height:150px;background:#fff;color:#111;border-radius:70px;display:grid;place-items:center;font-size:26px}
  .paper-flash{position:absolute;inset:0;background:var(--paper);opacity:0;pointer-events:none}
  .brand{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:22px;font:500 72px/1 "Sharp Grotesk",Arial,sans-serif;opacity:0}.brand-mark{width:42px;height:42px;position:relative}.brand-mark i,.brand-mark:before,.brand-mark:after{content:"";position:absolute;background:var(--red);border-radius:5px}.brand-mark i{width:18px;height:18px;left:0;top:12px}.brand-mark:before{width:18px;height:42px;left:24px}.brand-mark:after{width:18px;height:18px;left:0;top:36px}
  .prompt-scene{position:absolute;inset:0;background:var(--paper);opacity:0;will-change:opacity,filter}.prompt-title{position:absolute;left:0;right:0;top:110px;text-align:center;font:500 72px/1 "Sharp Grotesk",Arial,sans-serif;letter-spacing:-.045em}.prompt-card{position:absolute;left:210px;top:350px;width:1500px;height:420px;background:#fff;border:1px solid #e0ded7;border-radius:34px;box-shadow:0 30px 90px #544d3b16}.field{position:absolute;left:60px;right:60px;top:54px;font-size:44px;line-height:1.15}.caret{display:inline-block;width:3px;height:48px;background:#111;vertical-align:-7px}.controls{position:absolute;left:60px;right:60px;bottom:44px;display:flex;gap:16px;align-items:center}.chip{border:1px solid #d8d6d0;border-radius:22px;padding:12px 20px;color:#666;font-size:22px}.send{margin-left:auto;width:60px;height:60px;border-radius:16px;background:#0a84ff;color:white;display:grid;place-items:center;font-size:34px;box-shadow:0 10px 30px #0a84ff44}.cursor{position:absolute;width:0;height:0;border-left:18px solid #111;border-top:30px solid transparent;border-bottom:7px solid transparent;filter:drop-shadow(1px 2px 0 white);left:1450px;top:650px}.author{position:absolute;left:1440px;top:710px;padding:9px 15px;border:1px solid #d2cec3;border-radius:18px;background:#faf7ef;color:#e35435;font-size:18px}
  .grain{position:absolute;inset:0;opacity:.035;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}
</style>
<div class="stage"><div class="grid"></div><div class="world">
  <div class="card vault"><div class="tile hero">Vault<small>Wealth, Engineered For You.</small></div><div class="tile"><strong>31.4%</strong><small>Annual return</small></div><div class="tile"><strong>$4</strong><small>Daily minimum</small></div><div class="tile"><strong>12.8M</strong><small>People reached</small></div><div class="tile"><strong>19%</strong><small>Growth</small></div></div>
  <div class="card serum"><div class="mega">SERUM</div><div class="orb"></div><div class="bottle"></div></div>
  <div class="card money"><div class="flower f1"></div><div class="flower f2"></div><div class="headline">MONEY<br>THAT MOVES<br>WITH YOU</div><div class="note">Your notes. Margin style.</div></div>
 </div><div class="paper-flash"></div><div class="brand"><span class="brand-mark"><i></i></span><span>Replit Canvas</span></div>
 <div class="prompt-scene"><div class="prompt-title">Prompt</div><div class="prompt-card"><div class="field"><span class="typed"></span><span class="caret"></span></div><div class="controls"><div class="chip">＋</div><div class="chip">⌘</div><div class="chip">Auto ›</div><div class="chip">Default ›</div><div class="send">↑</div></div></div><div class="cursor"></div><div class="author">Paul</div></div><div class="grain"></div></div>
<script src="../../_lib/motion.js"></script><script src="../../_lib/fx.js"></script>
<script>
  const M=Motion,D=10,world=document.querySelector('.world'),prompt=document.querySelector('.prompt-scene');
  const flash=document.querySelector('.paper-flash'),brand=document.querySelector('.brand'),send=document.querySelector('.send');
  function mixState(a,b,p){return{x:M.lerp(a.x,b.x,p),y:M.lerp(a.y,b.y,p),zoom:M.lerp(a.zoom,b.zoom,p),rotate:M.lerp(a.rotate||0,b.rotate||0,p)}}
  function seek(t){
    let cam={x:1300,y:750,zoom:.23};
    if(t<1.3) cam=mixState({x:640,y:450,zoom:.12},{x:640,y:450,zoom:.39},M.phase(t,0,1.3,'expoOut'));
    else if(t<3.0) cam=mixState({x:640,y:450,zoom:.39},{x:660,y:450,zoom:1.02},M.phase(t,1.3,3,'expoInOut'));
    else if(t<4.1) cam=mixState({x:660,y:450,zoom:1.02},{x:1870,y:410,zoom:.68},M.phase(t,3,4.1,'expoInOut'));
    else cam=mixState({x:1870,y:410,zoom:.68},{x:1850,y:1110,zoom:.72},M.phase(t,4.1,5.15,'expoInOut'));
    M.camera(world,cam);
    const cut=M.phase(t,5.05,5.34,'expoOut'); flash.style.opacity=cut*(1-M.phase(t,6.35,6.65));
    brand.style.opacity=M.envelope(t,5.28,5.7,6.15,6.48,'expoOut');
    M.set(brand,{scale:M.between(t,5.28,5.85,.91,1,'expoOut'),y:M.between(t,6.15,6.48,0,-34,'expoIn'),opacity:brand.style.opacity});
    const po=M.phase(t,6.35,6.72,'expoOut'); prompt.style.opacity=po;
    const promptZoom=M.between(t,6.35,7.15,.92,1,'expoOut')*M.between(t,8.05,9.55,1,1.36,'expoInOut');
    const promptY=M.between(t,8.05,9.55,0,-155,'expoInOut'); M.set(prompt,{scale:promptZoom,y:promptY,opacity:po});
    M.typeText(document.querySelector('.typed'),'Help me come up with designs for my fashion brand',M.phase(t,7.15,9.15,'linear'));
    document.querySelector('.caret').style.opacity=Math.floor(t*4)%2;
    const press=M.phase(t,9.18,9.5,'backOut'); M.set(send,{scale:1+.13*Math.sin(press*Math.PI)});
  }
  fx.register({duration:D,loop:false,seek});
</script>
