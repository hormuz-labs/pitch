<!--
  A motion study of a narrated explainer's first act (reel 0:00–0:23), timed 1:1
  with the reel: page time t == reel time. The point is the CHAIN — how each
  moment hands over to the next without a cut, at the narration's pace.

  moment                         reel        join into the next
  1 dark "Every day,"            0.00–0.62   a white disc bursts from the word gap and floods the frame (disc → ground)
  2 light line + pill keyword    0.62–1.83   row 2 arrives → camera pulls back, cards drift in at depths
  3 cards at depths              1.83–4.25   push in on "And…", pull back on "too many…" (text swaps ride the camera steps)
  4 near-lens rush               4.25–5.45   cards turn blue and blur past the lens; the frame empties to bare ground
  5 big scrolling line           5.47–7.50   the line pans ahead of the voice, old words fade at the left edge
  6 ghosted line + push          7.48–9.43   pull back while the ghost row fills, then accelerating push → cut on motion
  7 dark grid, travelling glows  9.43–11.84  camera keeps panning into the cut
  8 pills, pull back             11.84–14.78 three filled pills emit lines; pattern fades, lines run off right
  9 branching line               14.78–18.12 the line comes back in from the left; pan right past the glow band
 10 ground → card                18.12–19.17 the dark ground shrinks into a square card on blue (ground → card)
 11 light "Not because…"         19.17–20.88 hard cut, camera pulls back 1.2→1.0 while the row fills
 12 sphere + speed lines         20.88–23.15 sphere rushes in with the first word; the line scrolls, the sphere rolls under it
-->

<script>
const M = Motion, P = M.phase, B = M.between, lerp = M.lerp, clamp = M.clamp;
const CX = 960, CY = 540, D = 23.3, END = 23.15;
const $ = (s, r = document) => r.querySelector(s);
const show = (el, on) => { el.style.visibility = on ? 'visible' : 'hidden'; };
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, p) => { const A = hex(a), Bc = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, Bc[i], clamp(p)))).join(',')})`; };
const css = n => getComputedStyle($('.stage')).getPropertyValue(n).trim();
/* start + eased deltas: path({x:0}, [[a, b, {x: 10}, 'move'], …]) → t => {x} */
function path(start, keys) {
  let prev = { ...start };
  const segs = keys.map(([a, b, to, e]) => { const d = {}; for (const k in to) d[k] = to[k] - prev[k]; prev = { ...prev, ...to }; return [a, b, d, e || 'move']; });
  return t => { const v = { ...start }; for (const [a, b, d, e] of segs) { const p = P(t, a, b, e); if (p) for (const k in d) v[k] += d[k] * p; } return v; };
}

/* ── Captions: the spoken words. One Row = one caption stack; words carry their
   spoken time. Modes, per row of the stack:
     row      laid out at its final width, centred; words appear in place
     recentre each word re-centres the row (eased step per word)
     fit      re-centres while it fits, then right-aligns at `right` (scrolls)
     left     left-anchored at `left` (the big scrolling line; panned by f.x)
   Reveals: rise (word rises from grey), chars (soft letter wipe), ghost (row shows faint, words solidify). */
class Row {
  constructor(parent, o) {
    Object.assign(this, { size: 80, cx: CX, cy: CY, lh: 1.3, modes: ['row'], reveal: 'rise', gap: .3, step: .4, lag: 0, ghost: .08,
      ink: css('--ink'), soft: css('--soft'), accent: css('--accent'), vfinal: false }, o);
    this.el = document.createElement('div'); this.el.className = 'row' + (o.cls ? ' ' + o.cls : '');
    this.el.style.fontSize = this.size + 'px'; parent.appendChild(this.el);
    this.words = o.words.map(([text, t, f = '']) => {
      const s = document.createElement('span'); s.className = 'w' + (f.includes('b') ? ' b' : '') + (f.includes('p') ? ' pillw' : '');
      const w = { text, t, el: s, br: f.includes('n'), accent: f.includes('a'), pill: f.includes('p') };
      if (this.reveal === 'chars' || this.reveal === 'sweep') w.chars = [...text].map(ch => { const c = document.createElement('span'); c.textContent = ch; s.appendChild(c); return c; });
      else s.textContent = text;
      if (w.pill) { w.pbg = document.createElement('i'); w.pbg.className = 'pbg'; s.prepend(w.pbg); }
      this.el.appendChild(s); return w;
    });
  }
  layout() {
    const g = this.gap * this.size; this.rows = []; let cur = null;
    for (const w of this.words) {
      w.width = w.el.getBoundingClientRect().width;
      if (!cur || w.br) { cur = { words: [], t: w.t }; this.rows.push(cur); }
      cur.words.push(w);
    }
    this.rows.forEach((r, k) => {
      let x = 0; for (const w of r.words) { w.rx = x; x += w.width + g; }
      r.width = x - g; r.pre = r.words.map(w => w.rx + w.width); r.mode = this.modes[Math.min(k, this.modes.length - 1)];
    });
  }
  rowX(r, t) {
    const m = r.mode;
    if (m === 'row') return this.cx - r.width / 2;
    if (m === 'left') return this.left;
    const at = i => m === 'recentre' ? this.cx - r.pre[i] / 2 : (r.pre[i] <= this.maxW ? this.cx - r.pre[i] / 2 : this.right - r.pre[i]);
    let x = at(0);
    for (let i = 1; i < r.words.length; i++) { const a = r.words[i].t + this.lag; x += (at(i) - at(i - 1)) * P(t, a, a + this.step, 'move'); }
    return x;
  }
  draw(t, f = {}) {
    const on = (f.alpha ?? 1) > 0.002; this.el.style.display = on ? '' : 'none'; if (!on) return;
    const lh = this.lh * this.size, n = this.rows.length;
    let y0 = this.cy;
    if (this.vfinal) y0 -= (n - 1) * lh / 2;
    else for (let k = 1; k < n; k++) y0 -= lh / 2 * P(t, this.rows[k].t, this.rows[k].t + .45, 'move');
    this.rows.forEach((r, k) => { const rx = this.rowX(r, t); for (const w of r.words) this.word(w, t, rx + w.rx, y0 + k * lh); });
    const s = f.scale ?? 1;
    this.el.style.transformOrigin = `${f.px ?? CX}px ${f.py ?? CY}px`;
    this.el.style.transform = `translate(${f.x || 0}px,${f.y || 0}px) scale(${s})`;
    this.el.style.opacity = f.alpha ?? 1;
    this.el.style.filter = (f.blur || 0) > .05 ? `blur(${f.blur}px)` : 'none';
  }
  word(w, t, x, y) {
    const S = this.size, to = w.accent ? this.accent : this.ink, st = w.el.style;
    let a = P(t, w.t, w.t + .14, 'smooth'), dy = 0, blur = 0;
    if (this.reveal === 'rise') { dy = (1 - P(t, w.t, w.t + .3, 'expoOut')) * .16 * S; blur = (1 - a) * .05 * S; }
    if (this.reveal === 'ghost') a = lerp(this.ghost, 1, P(t, w.t, w.t + .12)), blur = (1 - P(t, w.t, w.t + .12)) * 2.5;
    if (this.reveal === 'chars') {          // letters arrive one by one, near-ink
      a = t >= w.t ? 1 : 0;
      const cd = Math.min(.028, (w.dur || .3) / w.chars.length);
      w.chars.forEach((c, j) => { const tj = w.t + j * cd; c.style.opacity = P(t, tj, tj + .06); c.style.color = mix(this.soft, to, P(t, tj + .02, tj + .2)); });
    } else if (this.reveal === 'sweep') {   // the word lands whole and grey; ink sweeps through it left to right
      a = P(t, w.t, w.t + .08);
      w.chars.forEach((c, j) => { const tj = w.t + .04 + j * .045; c.style.color = mix(this.soft, to, P(t, tj, tj + .22)); });
    } else st.color = mix(this.soft, to, P(t, w.t + .02, w.t + .25));
    if (w.pill) { // keyword in a pill: slides in blurred, then the pill dissolves and the word resolves to bold ink
      const slide = 1 - P(t, w.t, w.t + .14, 'expoOut');
      x += slide * 120; blur = slide * 16; a = P(t, w.t, w.t + .06);
      w.pbg.style.opacity = 1 - P(t, w.t + .2, w.t + .43); w.pbg.style.filter = `blur(${P(t, w.t + .14, w.t + .43) * 12}px)`;
      st.color = mix('#e9ecff', to, P(t, w.t + .17, w.t + .3));
    }
    st.opacity = a;
    st.transform = `translate(${x}px,${y - S * .5 + dy}px)`;
    st.filter = blur > .1 ? `blur(${blur}px)` : 'none';
  }
}

/* ── scenes ─────────────────────────────────────────────────────────── */
const sOpen = $('#s-open'), sLight = $('#s-light'), sGrid = $('#s-grid'), sPills = $('#s-pills'), sBranch = $('#s-branch'), sWeak = $('#s-weak'), sSphere = $('#s-sphere');

// 1 dark opener

      const tp = t - k * .035; if (tp < 20.88) break;
      const [px, py] = sph(tp), age = k / 24, sh = L - lineX(tp);
      d += (d ? 'L' : 'M') + (px + sh - 150 * age * age).toFixed(1) + ' ' + (py - 40 + off * (8 + 70 * age) + 30 * age).toFixed(1);
    }
    pth.setAttribute('d', d); pth.style.opacity = .75 * P(t, 21.0, 21.15);
  });
}

/* ── seek ─────────────────────────────────────────────────────────────── */
let laid = false;
function seek(t0) {
  if (!laid) return;
  const t = Math.min(t0, END);
  const inn = (a, b) => t >= a && t < b;
  show(sOpen, inn(0, .95)); show(sLight, inn(.6, 9.43)); show(sGrid, inn(9.43, 11.84)); show(sPills, inn(11.84, 14.78));
  show(sBranch, inn(14.38, 19.17)); show(sWeak, inn(19.17, 20.88)); show(sSphere, t >= 20.88);
  let discAt = { x: CX, y: CY };
  if (inn(0, .95)) {
    const drift = drawOpen(t), r = rOpen.rows[0], w0 = r.words[0];
    discAt = { x: rOpen.rowX(r, .62) + w0.width + rOpen.gap * rOpen.size / 2 + drift, y: 555 - .04 * rOpen.size };
  }
  if (inn(.6, 9.43)) drawLight(t, discAt);
  if (inn(9.43, 11.84)) drawGrid(t);
  if (inn(14.38, 19.17)) drawBranch(t);
  if (inn(11.84, 14.78)) drawPills(t);
  if (inn(19.17, 20.88)) drawWeak(t);
  if (t >= 20.88) drawSphere(t);
}
fx.wait(Promise.all(['400 100px "Sharp Grotesk"', '500 100px "Sharp Grotesk"', 'italic 400 30px "Sorts Mill Goudy"'].map(f => document.fonts.load(f))).then(() => {
  for (const r of ROWS) r.layout();
  rBefore.words.forEach((w, i, a) => { w.dur = (a[i + 1] ? a[i + 1].t : w.t + .4) - w.t; });
  rSystem.words.forEach((w, i, a) => { w.dur = (a[i + 1] ? a[i + 1].t : w.t + .4) - w.t; });
  laid = true;
}));
fx.register({ duration: D, loop: false, seek });
