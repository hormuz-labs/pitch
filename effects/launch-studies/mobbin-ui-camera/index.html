<script src="../../_lib/motion.js"></script><script src="../../_lib/fx.js"></script><script>
 const M=Motion,D=10,intro=document.querySelector('.intro'),wipe=document.querySelector('.blue-wipe'),scene=document.querySelector('.world-scene'),world=document.querySelector('.world');
 function state(a,b,p){return{x:M.lerp(a.x,b.x,p),y:M.lerp(a.y,b.y,p),zoom:M.lerp(a.zoom,b.zoom,p)}}
 function seek(t){
  const ip=M.envelope(t,.25,.75,2.15,2.55,'expoOut');M.set(intro,{y:M.between(t,.25,.75,36,0,'expoOut')+M.between(t,2.15,2.55,0,-30,'expoIn'),opacity:ip,scale:M.between(t,.25,.75,.96,1,'expoOut')});
  const wp=M.phase(t,2.18,2.85,'expoInOut');wipe.style.transform=`scaleY(${wp*(1-M.phase(t,2.78,3.22,'expoInOut'))})`;wipe.style.opacity=1;scene.style.opacity=M.phase(t,2.85,3.2,'expoOut');
  let cam=state({x:1500,y:825,zoom:.48},{x:1500,y:720,zoom:.9},M.phase(t,3.0,5.0,'expoInOut'));
  if(t>6.25)cam=state({x:1500,y:720,zoom:.9},{x:1500,y:1060,zoom:.60},M.phase(t,6.25,8.6,'expoInOut'));M.camera(world,cam);
  const menu=document.querySelector('.menu');M.set(menu,{y:M.between(t,4.35,4.85,32,0,'expoOut'),scale:M.between(t,4.35,4.85,.94,1,'expoOut'),opacity:M.envelope(t,4.25,4.65,6.4,6.7,'expoOut')});
  document.querySelectorAll('.row').forEach((el,i)=>M.set(el,{x:M.between(t,4.45+i*.12,4.9+i*.12,30,0,'expoOut'),opacity:M.phase(t,4.45+i*.12,4.82+i*.12,'expoOut')}));
  const cp=M.phase(t,4.0,5.2,'expoOut');M.set(document.querySelector('.cursor'),{x:M.lerp(220,0,cp),y:M.lerp(100,0,cp),scale:1-.13*Math.sin(M.phase(t,5.1,5.55)*Math.PI),opacity:M.envelope(t,3.9,4.3,6.5,6.8)});
  document.querySelectorAll('.phone').forEach((el,i)=>{const p=M.spring(M.phase(t,6.2+i*.14,7.4+i*.14,'linear'));const focus=Math.abs(i-2);M.set(el,{y:M.lerp(260,focus*13,p),scale:M.lerp(.72,1-focus*.035,p),rotate:M.lerp((i-2.5)*5,0,p),opacity:M.clamp(p),blur:focus*1.15*(1-M.phase(t,8.15,9.2,'smooth'))});});
 }
 fx.register({duration:D,loop:false,seek});
