<!doctype html><meta charset="utf-8">
<title>Gradients: Morphing Shapes</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f6f2ea}
  svg{position:absolute;inset:0;width:100%;height:100%}
  .cap{position:absolute;left:48px;bottom:40px;font-family:"Atlas Grotesk",sans-serif;font-size:15px;letter-spacing:.25em;text-transform:uppercase;color:#1a1a1a;opacity:.7}
  .word{position:absolute;right:56px;top:48px;font-family:"Sorts Mill Goudy",serif;font-size:34px;font-style:italic;color:#1a1a1a}
</style>
<div class="stage">
  <svg viewBox="0 0 1280 720">
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff2d95"/></linearGradient>
      <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
      <linearGradient id="g3" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#19c37d"/><stop offset="1" stop-color="#ffe66a"/></linearGradient>
    </defs>
    <path id="p1" fill="url(#g1)" style="mix-blend-mode:multiply"/>
    <path id="p2" fill="url(#g2)" style="mix-blend-mode:multiply"/>
    <path id="p3" fill="url(#g3)" style="mix-blend-mode:multiply"/>
  </svg>
  <div class="word">Northwind</div>
  <div class="cap">Morphing shapes</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/MorphSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(MorphSVGPlugin);
  const D = 8;
  // organic blobs: 8 spokes with seeded radii, joined by a smooth closed curve
  const rng = fx.rng(7);
  function blob(seed, base = 150) {
    const r = fx.rng(seed);
    const n = 8, pts = [];
    for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2, rad = base * (0.7 + 0.6 * r()); pts.push([Math.cos(a) * rad, Math.sin(a) * rad]); }
    let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d + ' Z';
  }
  const tl = fx.timeline({ duration: D });
  const shapes = [['#p1', 430, 330, 200, 11], ['#p2', 660, 380, 200, 23], ['#p3', 850, 300, 180, 37]];
  const K = 4, step = D / K;
  shapes.forEach(([id, cx, cy, base, seed], si) => {
    const forms = Array.from({ length: K }, (_, k) => blob(seed + k * 101, base));
    const el = document.querySelector(id);
    el.setAttribute('d', forms[0]);
    gsap.set(el, { x: cx, y: cy, transformOrigin: '50% 50%' });
    // slow continuous morph through K forms and back to the first
    for (let k = 0; k < K; k++) tl.to(el, { morphSVG: forms[(k + 1) % K], duration: step, ease: 'sine.inOut' }, k * step);
    // a lazy drift and a full slow turn, both whole cycles
    tl.to(el, { rotation: (si % 2 ? -1 : 1) * 360, duration: D, ease: 'none' }, 0)
      .fromTo(el, { x: cx - 40 }, { x: cx + 40, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
      .fromTo(el, { y: cy + 25 }, { y: cy - 25, duration: D / 4, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 0);
  });
</script>
