<!doctype html><meta charset="utf-8">
<title>Gradients: Vertical Sweep</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#04121f}
  .base{position:absolute;inset:0;background:linear-gradient(180deg,#04121f,#0b2a4a 60%,#04121f)}
  /* a repeating horizontal band taller than the frame; sliding it one period down is a seamless loop */
  .band{position:absolute;left:0;width:100%;top:-1440px;height:2880px;will-change:transform;mix-blend-mode:screen;filter:blur(8px)}
  .band.a{background:repeating-linear-gradient(180deg,rgba(255,255,255,0) 0px,#19c37d 260px,#38bdf8 520px,#ffe66a 700px,rgba(255,255,255,0) 1040px,rgba(255,255,255,0) 1440px)}
  .band.b{background:repeating-linear-gradient(180deg,rgba(255,255,255,0) 0px,#7c3aed 360px,#ff2d95 640px,rgba(255,255,255,0) 960px,rgba(255,255,255,0) 1440px);opacity:.55;filter:blur(14px)}
  .soft{position:absolute;inset:0;background:radial-gradient(70% 70% at 50% 50%,rgba(0,0,0,0),rgba(0,0,0,.4))}
  .title{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#fff;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:120px;letter-spacing:-.04em;line-height:1}
  .sub{position:absolute;left:0;right:0;bottom:60px;text-align:center;color:#fff;font-family:"Atlas Grotesk",sans-serif;font-size:15px;letter-spacing:.3em;text-transform:uppercase;opacity:.8}
</style>
<div class="stage">
  <div class="base"></div>
  <div class="band b"></div>
  <div class="band a"></div>
  <div class="soft"></div>
  <div class="title">Acme</div>
  <div class="sub">Vertical sweep — background</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 5;
  const tl = fx.timeline({ duration: D });
  // main band sweeps down one period with a push and settle; the second rises half a period out of phase
  tl.fromTo('.band.a', { y: -1440 }, { y: 0, duration: D, ease: 'power1.inOut' }, 0)
    .fromTo('.band.b', { y: 720 }, { y: -720, duration: D, ease: 'power1.inOut' }, 0)
    .fromTo('.title', { y: 6 }, { y: -6, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
</script>
