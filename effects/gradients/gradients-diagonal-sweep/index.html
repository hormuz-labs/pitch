<!doctype html><meta charset="utf-8">
<title>Gradients: Diagonal Sweep</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#12083a}
  .base{position:absolute;inset:0;background:linear-gradient(135deg,#12083a 0%,#3b0764 50%,#0b1a4a 100%)}
  /* a repeating diagonal band, wider than the frame; sliding it one period along its normal is a seamless loop */
  .band{position:absolute;left:50%;top:50%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;transform:rotate(-35deg);will-change:transform}
  .band .i{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0px,#ff2d95 220px,#ff8a3d 460px,#ffe66a 640px,rgba(255,255,255,0) 980px,rgba(255,255,255,0) 1300px);opacity:.95;mix-blend-mode:screen;filter:blur(6px);will-change:transform}
  .band .j{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(56,189,248,0) 0px,#38bdf8 300px,#7c3aed 600px,rgba(56,189,248,0) 900px,rgba(56,189,248,0) 1300px);opacity:.6;mix-blend-mode:screen;filter:blur(10px);will-change:transform}
  .soft{position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 50%,rgba(0,0,0,0),rgba(0,0,0,.45))}
  .title{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#fff;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:120px;letter-spacing:-.04em;line-height:1}
  .sub{position:absolute;left:0;right:0;bottom:60px;text-align:center;color:#fff;font-family:"Atlas Grotesk",sans-serif;font-size:15px;letter-spacing:.3em;text-transform:uppercase;opacity:.8}
</style>
<div class="stage">
  <div class="base"></div>
  <div class="band"><div class="j"></div><div class="i"></div></div>
  <div class="soft"></div>
  <div class="title">Northwind</div>
  <div class="sub">Diagonal sweep — background</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 5;
  const tl = fx.timeline({ duration: D });
  // one period (1300px) across the loop; ease-in-out gives the sweep its push and settle, still seamless
  tl.fromTo('.band .i', { x: -1300 }, { x: 0, duration: D, ease: 'power1.inOut' }, 0);
  // a cooler second band half a period behind, so light is always crossing the frame
  tl.fromTo('.band .j', { x: -650 }, { x: 650, duration: D, ease: 'power1.inOut' }, 0);
  tl.fromTo('.title', { scale: 0.98 }, { scale: 1.02, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
</script>
