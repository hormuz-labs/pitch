<!doctype html><meta charset="utf-8">
<title>Counter: Halftone Poster</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f4ecd8;color:#171512}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .top{position:absolute;top:56px;left:64px;right:64px;display:flex;justify-content:space-between;font-family:"Sorts Mill Goudy",serif;font-size:30px;font-style:italic}
  .rule{position:absolute;left:64px;right:64px;top:106px;height:3px;background:#171512;transform-origin:0 50%}
  .bot{position:absolute;left:64px;right:64px;bottom:56px}
  .bot h2{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:96px;letter-spacing:-.05em;line-height:.9;text-transform:uppercase}
  .bot p{font-family:"Sorts Mill Goudy",serif;font-size:28px;margin-top:16px;line-height:1.3}
  .bot .row{display:flex;justify-content:space-between;align-items:flex-end}
  .stamp{width:150px;height:150px;border:3px solid #171512;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:"Sorts Mill Goudy",serif;font-size:22px;line-height:1.1;font-style:italic;will-change:transform}
  .paper{position:absolute;inset:0;opacity:.12;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");mix-blend-mode:multiply;pointer-events:none}
</style>
<div class="stage">
  <canvas id="c"></canvas>
  <div class="top"><span>Northwind Print Fair</span><span>Hall B · Stand 12</span></div><i class="rule"></i>
  <div class="bot"><div class="row"><div><h2>Days<br>Left</h2><p>Doors open at nine. Paper, ink, and a very large number.</p></div><div class="stamp">Limited<br>Edition</div></div></div>
  <div class="paper"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 4, TARGET = 21, W = 1080, H = 1080;
  const c = document.getElementById('c'); c.width = W; c.height = H; const ctx = c.getContext('2d');
  const off = document.createElement('canvas'); off.width = W; off.height = H; const octx = off.getContext('2d', { willReadFrequently: true });
  const state = { v: 0, reveal: 0, scale: 1, cell: 26 };
  const tl = fx.timeline({ duration: D });
  tl.from('.rule', { scaleX: 0, duration: 0.8, ease: 'expo.out' }, 0);
  tl.from('.top span', { y: 20, opacity: 0, stagger: .1, duration: .6, ease: 'expo.out' }, .1);
  tl.to(state, { v: TARGET, duration: 2.4, ease: 'power3.out' }, 0.4);
  tl.to(state, { reveal: 1, duration: 1.0, ease: 'expo.out' }, 0.2);
  tl.fromTo(state, { cell: 60 }, { cell: 22, duration: 2.6, ease: 'power2.out' }, 0.3);  // the screen tightens as the number resolves
  tl.from('.bot h2', { y: 50, opacity: 0, duration: .8, ease: 'expo.out' }, .5);
  tl.from('.bot p', { y: 30, opacity: 0, duration: .8, ease: 'expo.out' }, .7);
  tl.from('.stamp', { scale: 0, rotation: -60, duration: .8, ease: 'back.out(2)' }, 1.1).to('.stamp', { rotation: 20, duration: 2.5, ease: 'sine.inOut' }, 1.9);
  tl.fromTo(state, { scale: 1 }, { scale: 1.06, duration: .12, ease: 'power3.out' }, 2.85).to(state, { scale: 1, duration: .5, ease: 'elastic.out(1,.4)' }, 2.97);
  tl.to(['.bot', '.top', '.rule'], { opacity: 0, duration: .25, ease: 'power2.in' }, 3.72);
  tl.to(state, { reveal: 0, duration: .3, ease: 'power3.in' }, 3.7);
  const seek = window.__fx.seek;
  window.__fx.seek = t => {
    seek(t);
    // 1. draw the number crisp to an offscreen buffer
    octx.fillStyle = '#fff'; octx.fillRect(0, 0, W, H);
    octx.save(); octx.translate(W / 2, H / 2 - 40); octx.scale(state.scale, state.scale);
    octx.fillStyle = '#000'; octx.font = '500 720px "Sharp Grotesk", sans-serif'; octx.textAlign = 'center'; octx.textBaseline = 'middle';
    octx.fillText(String(Math.round(state.v)).padStart(2, '0'), 0, 0);
    octx.restore();
    // 2. screen it: dots sized by coverage, on a 15° grid, revealed top-down
    const cell = state.cell, img = octx.getImageData(0, 0, W, H).data;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#171512';
    const ang = Math.PI / 12, cs = Math.cos(ang), sn = Math.sin(ang), diag = 800;
    for (let gy = -diag; gy < diag; gy += cell) for (let gx = -diag; gx < diag; gx += cell) {
      const x = W / 2 + gx * cs - gy * sn, y = H / 2 + gx * sn + gy * cs;
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      // average coverage over the cell
      let sum = 0, n = 0;
      for (let dy = -cell / 2; dy < cell / 2; dy += cell / 4) for (let dx = -cell / 2; dx < cell / 2; dx += cell / 4) {
        const px = Math.round(x + dx), py = Math.round(y + dy);
        if (px < 0 || py < 0 || px >= W || py >= H) continue;
        sum += 1 - img[(py * W + px) * 4] / 255; n++;
      }
      const cov = n ? sum / n : 0;
      if (cov < 0.03) continue;
      const wipe = Math.min(1, Math.max(0, (state.reveal * (H + 200) - y) / 120));
      if (wipe <= 0) continue;
      const r = cell * 0.62 * Math.sqrt(cov) * wipe;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  };
</script>
