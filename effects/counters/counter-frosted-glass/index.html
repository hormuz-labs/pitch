<!doctype html><meta charset="utf-8">
<title>Counter: Frosted Glass</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0a0a14;display:flex;align-items:center;justify-content:center}
  .bg{position:absolute;inset:-10%;background:url("../../../assets/backgrounds/aurora.png") center/cover;filter:saturate(1.3);will-change:transform}
  .orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.9;will-change:transform}
  .glass{position:relative;padding:54px 72px;border-radius:40px;background:rgba(255,255,255,.12);backdrop-filter:blur(34px) saturate(1.6);-webkit-backdrop-filter:blur(34px) saturate(1.6);border:1.5px solid rgba(255,255,255,.35);box-shadow:0 40px 90px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.5);color:#fff;text-align:center}
  .glass .k{font-size:20px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:500}
  .clock{display:flex;align-items:center;gap:18px;margin-top:14px;font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:150px;letter-spacing:-.04em;line-height:1}
  .grp{display:flex}
  .dg{display:inline-block;width:.62em;height:1em;overflow:hidden;position:relative;text-align:center}
  .dg i{position:absolute;left:0;right:0;top:0;font-style:normal;will-change:transform}
  .colon{width:.3em;text-align:center;color:rgba(255,255,255,.8);will-change:opacity}
  .sub{display:flex;justify-content:space-between;margin-top:14px;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);padding:0 .3em}
  .shine{position:absolute;inset:0;border-radius:40px;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.25) 45%,transparent 60%);will-change:transform;pointer-events:none}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="orb" style="width:520px;height:520px;background:#ff5fa2;left:80px;top:-120px"></div>
  <div class="orb" style="width:460px;height:460px;background:#5fd5ff;right:60px;bottom:-140px"></div>
  <div class="glass">
    <div class="k">Session ends in</div>
    <div class="clock" id="clock"></div>
    <div class="sub"><span>Hours</span><span>Minutes</span><span>Seconds</span></div>
    <div class="shine"></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 5;
  // a 5-second window of a countdown: 00:14:59 → 00:14:55 ... the seconds tick, digits flip up
  const START = [0, 0, 1, 4, 5, 9]; // h h m m s s
  const clock = document.getElementById('clock');
  const groups = [[0, 1], [2, 3], [4, 5]];
  const dg = [];
  groups.forEach((g, gi) => {
    const wrap = document.createElement('div'); wrap.className = 'grp';
    g.forEach(i => { const d = document.createElement('span'); d.className = 'dg'; d.innerHTML = '<i></i><i></i>'; wrap.appendChild(d); dg[i] = d; });
    clock.appendChild(wrap);
    if (gi < 2) { const c = document.createElement('span'); c.className = 'colon'; c.textContent = ':'; clock.appendChild(c); }
  });
  const tl = fx.timeline({ duration: D });
  tl.fromTo('.bg', { xPercent: -2, scale: 1.05 }, { xPercent: 2, scale: 1.1, duration: D, ease: 'sine.inOut' }, 0);
  tl.fromTo('.orb', { y: 0 }, { y: (i) => i ? -50 : 50, duration: D / 2, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 0);
  tl.fromTo('.shine', { xPercent: -120 }, { xPercent: 120, duration: 1.6, ease: 'power2.inOut' }, 1.2);
  tl.fromTo('.colon', { opacity: 1 }, { opacity: 0.25, duration: 0.5, yoyo: true, repeat: 9, ease: 'steps(1)' }, 0);
  tl.fromTo('.glass', { y: 0 }, { y: -6, duration: D / 2, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 0);
  const ease = x => 1 - Math.pow(1 - x, 4);
  const seek = window.__fx.seek;
  window.__fx.seek = t => {
    seek(t);
    const total = 14 * 60 + 59 - Math.floor(t);                 // seconds remaining now
    const next = total - 1;
    const p = t % 1, flip = p > 0.72 ? ease((p - 0.72) / 0.28) : 0; // flip in the last 280ms before the tick
    const fmt = s => [0, 0, Math.floor(s / 60 / 10), Math.floor(s / 60) % 10, Math.floor(s % 60 / 10), s % 10];
    const cur = fmt(total), nxt = fmt(next);
    dg.forEach((d, i) => {
      const [a, b] = d.children;
      a.textContent = cur[i]; b.textContent = nxt[i];
      const changes = cur[i] !== nxt[i];
      const f = changes ? flip : 0;
      a.style.transform = `translateY(${-f * 100}%)`; a.style.opacity = 1 - f;
      b.style.transform = `translateY(${(1 - f) * 100}%)`; b.style.opacity = f;
      a.style.filter = f ? `blur(${f * 6}px)` : ''; b.style.filter = f ? `blur(${(1 - f) * 6}px)` : '';
    });
  };
</script>
