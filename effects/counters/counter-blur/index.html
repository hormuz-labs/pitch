<!doctype html><meta charset="utf-8">
<title>Counter: Blur</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b0b0e;display:flex;align-items:center;justify-content:center;color:#fff}
  .wrap{text-align:center}
  .num{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:300px;letter-spacing:-.06em;line-height:1;display:flex;justify-content:center;will-change:filter,transform}
  .num span{display:inline-block;min-width:.6em;text-align:center;will-change:filter,transform,opacity}
  .num .pct{font-size:.45em;align-self:flex-start;margin-top:.22em;margin-left:.05em;color:#8f8fa8}
  .lbl{margin-top:8px;font-size:26px;letter-spacing:.22em;text-transform:uppercase;color:#8f8fa8;font-weight:500}
  .bar{margin:34px auto 0;width:520px;height:4px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:#fff;border-radius:2px}
  .halo{position:absolute;left:50%;top:50%;width:800px;height:800px;margin:-400px 0 0 -400px;border-radius:50%;background:radial-gradient(circle,#3d5cff 0%,transparent 60%);opacity:.25;filter:blur(60px)}
</style>
<div class="stage">
  <div class="halo"></div>
  <div class="wrap">
    <div class="num"><span id="d0">0</span><span id="d1">0</span><span id="d2">0</span><span class="pct">%</span></div>
    <div class="lbl">Loading assets</div>
    <div class="bar"><i id="bar"></i></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 4;
  const digits = [0, 1, 2].map(i => document.getElementById('d' + i));
  const bar = document.getElementById('bar');
  const state = { v: 0 };
  const tl = fx.timeline({ duration: D });
  // the count: fast at first, slowing toward 100
  tl.to(state, { v: 100, duration: 3.1, ease: 'power3.out' }, 0.3);
  // whole-number resolve: it starts as a soft haze and sharpens as it climbs
  tl.fromTo('.num', { filter: 'blur(28px)', scale: 1.12, opacity: 0.6 }, { filter: 'blur(0px)', scale: 1, opacity: 1, duration: 3.2, ease: 'power2.out' }, 0.2);
  tl.from('.lbl', { opacity: 0, y: 12, filter: 'blur(8px)', duration: 0.8, ease: 'power2.out' }, 0.5);
  tl.fromTo('.halo', { scale: 0.6, opacity: 0 }, { scale: 1.2, opacity: 0.35, duration: 3.4, ease: 'power2.out' }, 0);
  // the landing on 100: a crisp settle
  tl.fromTo('.num', { scale: 1 }, { scale: 1.04, duration: 0.15, ease: 'power2.out' }, 3.4).to('.num', { scale: 1, duration: 0.35, ease: 'elastic.out(1,0.5)' }, 3.55);
  // exit: back into blur so the loop rewinds through the haze
  tl.to('.wrap', { filter: 'blur(24px)', opacity: 0, duration: 0.3, ease: 'power2.in' }, 3.7);
  let last = -1;
  const seek = window.__fx.seek;
  window.__fx.seek = t => {
    seek(t);
    const v = Math.round(state.v);
    const s = String(v).padStart(3, '0');
    digits.forEach((el, i) => {
      const ch = s[i];
      el.textContent = (v < 100 && i === 0) ? '' : ch;
      el.style.minWidth = (v < 100 && i === 0) ? '0' : '';
    });
    // each digit that changed gets a tiny per-digit re-blur that decays over the next frames
    const changeT = t;
    digits.forEach((el, i) => {
      const per = i === 2 ? 1 : i === 1 ? 10 : 100;
      const frac = (state.v / per) % 1;             // 0 just after a change, →1 just before the next
      const blur = i === 2 && v < 100 ? 6 * (1 - frac) * Math.min(1, (100 - v) / 8) : 0;
      el.style.filter = blur > 0.2 ? `blur(${blur}px)` : '';
    });
    bar.style.width = state.v + '%';
  };
</script>
