<!doctype html><meta charset="utf-8">
<title>Counter: Progress Ring</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f6f7fb;display:flex;align-items:center;justify-content:center;gap:90px;color:#14151c}
  .ring{position:relative;width:420px;height:420px}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .val{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:120px;letter-spacing:-.05em;line-height:1;will-change:transform}
  .val small{font-size:.4em;color:#6b6f80;letter-spacing:-.02em;margin-left:.04em}
  .sub{font-size:20px;color:#6b6f80;margin-top:4px;letter-spacing:.02em}
  .card{width:380px;padding:36px;border-radius:28px;background:#fff;box-shadow:0 30px 60px rgba(20,21,28,.08);will-change:transform,opacity}
  .card h3{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:34px;letter-spacing:-.03em;line-height:1}
  .card p{font-size:18px;color:#6b6f80;margin-top:8px}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:22px;font-size:18px}
  .row b{font-weight:500}
  .row .tr{height:8px;width:180px;background:#eceef5;border-radius:4px;overflow:hidden}
  .row .tr i{display:block;height:100%;width:0;border-radius:4px;background:#4c6bff}
  .check{position:absolute;left:50%;top:50%;width:0;height:0}
  .check svg{position:absolute;left:-50px;top:-50px;width:100px;height:100px}
</style>
<div class="stage">
  <div class="ring">
    <svg viewBox="0 0 420 420">
      <circle cx="210" cy="210" r="186" fill="none" stroke="#e6e8f2" stroke-width="26"/>
      <circle id="glowarc" cx="210" cy="210" r="186" fill="none" stroke="#4c6bff" stroke-width="40" stroke-linecap="round" opacity=".18" style="filter:blur(10px)"/>
      <circle id="arc" cx="210" cy="210" r="186" fill="none" stroke="#4c6bff" stroke-width="26" stroke-linecap="round"/>
      <circle id="tip" cx="396" cy="210" r="8" fill="#fff"/>
    </svg>
    <div class="center"><div class="val"><span id="v">0</span><small>%</small></div><div class="sub" id="sub">Uploading</div></div>
  </div>
  <div class="card">
    <h3>Sync in progress</h3><p>Northwind Drive · 3 folders</p>
    <div class="row"><span>Photos</span><span class="tr"><i class="f" data-k="1"></i></span></div>
    <div class="row"><span>Documents</span><span class="tr"><i class="f" data-k="0.85"></i></span></div>
    <div class="row"><span>Backups</span><span class="tr"><i class="f" data-k="0.6"></i></span></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 4, R = 186, C = 2 * Math.PI * R;
  const arc = document.getElementById('arc'), glow = document.getElementById('glowarc'), tip = document.getElementById('tip'), vEl = document.getElementById('v'), sub = document.getElementById('sub');
  const fills = gsap.utils.toArray('.f');
  [arc, glow].forEach(e => { e.setAttribute('stroke-dasharray', C); e.setAttribute('stroke-dashoffset', C); });
  const state = { p: 0 };
  const tl = fx.timeline({ duration: D });
  tl.from('.ring', { scale: 0.85, opacity: 0, duration: 0.7, ease: 'expo.out' }, 0);
  tl.from('.card', { x: 60, opacity: 0, duration: 0.8, ease: 'expo.out' }, 0.15);
  // the fill: quick start, a hesitation near 70, then the run to 100
  tl.to(state, { p: 68, duration: 1.3, ease: 'power2.out' }, 0.4)
    .to(state, { p: 74, duration: 0.5, ease: 'power1.inOut' }, 1.7)
    .to(state, { p: 100, duration: 0.8, ease: 'power3.inOut' }, 2.2);
  tl.fromTo('.val', { scale: 1 }, { scale: 1.1, duration: 0.15, ease: 'power3.out' }, 3.0).to('.val', { scale: 1, duration: 0.5, ease: 'elastic.out(1,0.45)' }, 3.15);
  tl.to('#arc', { stroke: '#22c48a', duration: 0.4 }, 3.0).to('#glowarc', { stroke: '#22c48a', duration: 0.4 }, 3.0).to('.f', { backgroundColor: '#22c48a', duration: 0.4 }, 3.0);
  tl.to(['.ring', '.card'], { opacity: 0, y: -20, duration: 0.3, ease: 'power2.in' }, 3.7);
  const seek = window.__fx.seek;
  window.__fx.seek = t => {
    seek(t);
    const p = state.p, off = C * (1 - p / 100);
    arc.setAttribute('stroke-dashoffset', off); glow.setAttribute('stroke-dashoffset', off);
    const a = p / 100 * Math.PI * 2;
    tip.setAttribute('cx', 210 + Math.cos(a) * R); tip.setAttribute('cy', 210 + Math.sin(a) * R);
    tip.setAttribute('opacity', p > 0.5 && p < 99.5 ? 1 : 0);
    vEl.textContent = Math.round(p);
    sub.textContent = p >= 99.5 ? 'Complete' : p > 70 && p < 75 ? 'Almost there' : 'Uploading';
    fills.forEach(f => f.style.width = Math.min(100, p * +f.dataset.k * 1.05) + '%');
  };
</script>
