<!doctype html><meta charset="utf-8">
<title>Counter: Dotted Circle</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#12102a;display:flex;align-items:center;justify-content:center;color:#fff}
  .ring{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px}
  .ring svg{width:100%;height:100%;overflow:visible}
  .center{position:relative;text-align:center}
  .val{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:200px;letter-spacing:-.06em;line-height:1;will-change:transform}
  .val small{font-size:.35em;color:#ffd23f;letter-spacing:-.02em;margin-left:.06em}
  .lbl{font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:#a29fd0;font-weight:500;margin-top:6px}
  .confetti{position:absolute;left:50%;top:50%;width:0;height:0}
  .confetti i{position:absolute;width:14px;height:14px;border-radius:3px;left:-7px;top:-7px;will-change:transform,opacity}
</style>
<div class="stage">
  <div class="ring"><svg viewBox="0 0 520 520">
    <circle id="track" cx="260" cy="260" r="240" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="14" stroke-linecap="round" stroke-dasharray="0 31.4"/>
    <circle id="dots" cx="260" cy="260" r="240" fill="none" stroke="#ffd23f" stroke-width="14" stroke-linecap="round" stroke-dasharray="0 31.4" transform="rotate(-90 260 260)"/>
    <circle id="orbit" cx="260" cy="260" r="200" fill="none" stroke="#ff5fa2" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 22" transform="rotate(-90 260 260)"/>
  </svg></div>
  <div class="confetti" id="conf"></div>
  <div class="center"><div class="val"><span id="v">0</span><small>%</small></div><div class="lbl">Goal reached</div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 4, TARGET = 87, C = 2 * Math.PI * 240, C2 = 2 * Math.PI * 200;
  const dots = document.getElementById('dots'), orbit = document.getElementById('orbit'), vEl = document.getElementById('v');
  const state = { v: 0, spin: 0 };
  // 48 dots around the ring; the progress reveals them one by one via a dashoffset mask
  const N = 48, gap = C / N;
  dots.setAttribute('stroke-dasharray', `0.01 ${gap - 0.01}`);
  document.getElementById('track').setAttribute('stroke-dasharray', `0.01 ${gap - 0.01}`);
  orbit.setAttribute('stroke-dasharray', `0.01 ${C2 / 36 - 0.01}`);
  // reveal mask: a second dash pattern on top via pathLength trick -> use stroke-dashoffset on a wrapping group is messy; instead animate the visible arc with clip via a mask circle
  const svg = document.querySelector('svg');
  svg.insertAdjacentHTML('afterbegin', `<defs><mask id="m"><circle id="mask" cx="260" cy="260" r="240" fill="none" stroke="#fff" stroke-width="40" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 260 260)"/></mask></defs>`);
  dots.setAttribute('mask', 'url(#m)');
  const mask = document.getElementById('mask');
  // confetti pieces for the landing
  const rnd = fx.rng(11), conf = document.getElementById('conf'), pieces = [];
  const cols = ['#ffd23f', '#ff5fa2', '#5fd5ff', '#2ee6a6', '#fff'];
  for (let i = 0; i < 26; i++) { const el = document.createElement('i'); el.style.background = cols[i % cols.length]; conf.appendChild(el); pieces.push({ el, a: rnd() * Math.PI * 2, r: 220 + rnd() * 160, rot: rnd() * 720 }); }
  const tl = fx.timeline({ duration: D });
  tl.from('.ring', { scale: 0.6, opacity: 0, rotation: -60, duration: 0.9, ease: 'expo.out' }, 0);
  tl.from('.center', { scale: 0.7, opacity: 0, duration: 0.7, ease: 'back.out(2)' }, 0.2);
  tl.to(state, { v: TARGET, duration: 2.2, ease: 'power3.inOut' }, 0.5);
  tl.to(state, { spin: 1, duration: D, ease: 'none' }, 0);
  // landing pop
  tl.fromTo('.val', { scale: 1 }, { scale: 1.12, duration: 0.15, ease: 'power3.out' }, 2.7).to('.val', { scale: 1, duration: 0.6, ease: 'elastic.out(1,0.4)' }, 2.85);
  pieces.forEach(p => {
    tl.fromTo(p.el, { x: 0, y: 0, opacity: 1, rotation: 0, scale: 0.6 }, { x: Math.cos(p.a) * p.r, y: Math.sin(p.a) * p.r, rotation: p.rot, scale: 1, duration: 0.9, ease: 'move' }, 2.72)
      .to(p.el, { opacity: 0, y: '+=60', duration: 0.5, ease: 'power2.in' }, 3.2);
  });
  tl.to(['.ring', '.center'], { opacity: 0, scale: 0.9, duration: 0.3, ease: 'power2.in' }, 3.7);
  const seek = window.__fx.seek;
  window.__fx.seek = t => {
    seek(t);
    vEl.textContent = Math.round(state.v);
    mask.setAttribute('stroke-dashoffset', C * (1 - state.v / 100));
    // the dot ring ticks, the inner orbit spins the other way, the whole loop
    dots.setAttribute('transform', `rotate(${-90 + Math.floor(state.spin * N * 2) * (360 / N) * 0.5} 260 260)`);
    document.getElementById('track').setAttribute('transform', dots.getAttribute('transform'));
    orbit.setAttribute('transform', `rotate(${-90 - state.spin * 360} 260 260)`);
  };
</script>
