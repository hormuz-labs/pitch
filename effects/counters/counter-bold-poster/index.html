<!doctype html><meta charset="utf-8">
<title>Counter: Bold Poster</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#ff4a1f;color:#111;overflow:hidden}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.08) 1px,transparent 1px);background-size:90px 90px}
  .top{position:absolute;top:64px;left:72px;right:72px;display:flex;justify-content:space-between;font-weight:500;font-size:26px;letter-spacing:.06em;text-transform:uppercase}
  .top .rule{position:absolute;left:0;right:0;top:48px;height:4px;background:#111;transform-origin:0 50%}
  .big{position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:760px;letter-spacing:-.09em;line-height:1;display:flex;will-change:transform}
  .big span{display:inline-block;will-change:transform,opacity}
  .big .over{display:inline-block}
  .bottom{position:absolute;left:72px;right:72px;bottom:64px;display:flex;align-items:flex-end;justify-content:space-between}
  .bottom h2{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:84px;letter-spacing:-.05em;line-height:.9;text-transform:uppercase}
  .bottom p{font-size:26px;line-height:1.3;max-width:340px;text-align:right}
  .badge{position:absolute;right:72px;top:130px;width:150px;height:150px;border-radius:50%;background:#111;color:#ff4a1f;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:500;font-size:24px;line-height:1.05;letter-spacing:.02em;will-change:transform}
</style>
<div class="stage">
  <div class="grid"></div>
  <div class="top"><span>Northwind Sessions</span><span>Vol. 03</span><i class="rule"></i></div>
  <div class="big"><span class="over"><span id="n0" class="dg">0</span></span><span class="over"><span id="n1" class="dg">0</span></span></div>
  <div class="badge">Days<br>to go</div>
  <div class="bottom"><h2>Open<br>Air</h2><p>Riverside Hall · Doors at 7 · Tickets at the gate</p></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 4, TARGET = 48;
  const n0 = document.getElementById('n0'), n1 = document.getElementById('n1');
  const state = { v: 0 };
  const tl = fx.timeline({ duration: D });
  tl.from('.rule', { scaleX: 0, duration: 0.8, ease: 'expo.out' }, 0);
  tl.from('.top span', { y: 24, opacity: 0, stagger: 0.08, duration: 0.6, ease: 'expo.out' }, 0.1);
  tl.from('.big', { yPercent: 30, opacity: 0, duration: 0.9, ease: 'expo.out' }, 0.15);
  tl.to(state, { v: TARGET, duration: 2.3, ease: 'power4.out' }, 0.5);
  tl.from('.badge', { scale: 0, rotation: -90, duration: 0.9, ease: 'back.out(2)' }, 0.9);
  tl.to('.badge', { rotation: 360, duration: 3.1, ease: 'none' }, 0.9);
  tl.from('.bottom h2', { y: 60, opacity: 0, duration: 0.8, ease: 'expo.out' }, 0.5);
  tl.from('.bottom p', { y: 30, opacity: 0, duration: 0.8, ease: 'expo.out' }, 0.7);
  // the landing: number stamps down, the poster shakes once
  tl.fromTo('.big', { scale: 1 }, { scale: 1.06, duration: 0.12, ease: 'power3.out' }, 2.75).to('.big', { scale: 1, duration: 0.5, ease: 'elastic.out(1,0.4)' }, 2.87);
  tl.fromTo('.stage', { y: 0 }, { y: 10, duration: 0.06, yoyo: true, repeat: 3, ease: 'none' }, 2.78);
  tl.to(['.big', '.bottom', '.badge', '.top'], { opacity: 0, y: -40, duration: 0.25, ease: 'power3.in', stagger: 0.02 }, 3.7);
  let prev = -1;
  const seek = window.__fx.seek;
  window.__fx.seek = t => {
    seek(t);
    const v = Math.round(state.v), s = String(v).padStart(2, '0');
    n0.textContent = s[0]; n1.textContent = s[1];
    // digits roll: the changing digit slides up from below over the frames after its change
    // the changing digit flickers in as it lands, no clipping tricks
    const f = state.v % 1;
    n1.style.opacity = v < TARGET ? String(0.75 + f * 0.25) : '';
  };
</script>
