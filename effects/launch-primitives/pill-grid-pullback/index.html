<!doctype html><meta charset="utf-8"><title>Pill Grid Pullback</title><meta name="fx" content="w=1920 h=1080"><link rel="stylesheet" href="../../_lib/base.css">
<style>
.stage{
  --ground:#000002; --ground-glow:#0c1650; --band:#0b1246;
  --line:#1d38bb; --ink:#ffffff;
  --fill-1:#c9cff3; --fill-2:#99a2e1; --fill-3:#6070cf; --fill-4:#2841bc; --fill-5:#1c2fa7; --fill-6:#11237f; --fill-7:#0a1143; --fill-8:#04041b;
  --wire:#2f45d8; --wire-head:#dfe3ff;
  background:var(--ground); font-family:"Sharp Grotesk",sans-serif; color:var(--ink);
}
.glow{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,transparent 55%,#03021899 68%,#030a28 83%,#080f3b 92%,var(--ground-glow) 100%)}
.band{position:absolute;inset:-10% -20%;background:linear-gradient(114deg,var(--ground) 0%,var(--ground) 44%,#05093a 54%,var(--band) 62%,#0a1143 67%,#030318 80%,var(--ground) 96%);opacity:0}
.world{position:absolute;left:0;top:0;width:0;height:0}
.row{position:absolute;left:0;width:0;height:0}
.pill{position:absolute;top:-150px;height:300px;border-radius:150px;border:8px solid var(--line);display:grid;place-items:center;white-space:nowrap;font-weight:400;letter-spacing:-.01em}
.pill span{position:relative;z-index:2;line-height:1;transform:translateY(-.04em)}
.fill{position:absolute;inset:12px;border-radius:150px;overflow:hidden;opacity:0;background:#04050d}
.strip{position:absolute;top:0;bottom:0;left:0;width:140%;background:linear-gradient(90deg,var(--fill-1) 0%,var(--fill-2) 9%,var(--fill-3) 18%,var(--fill-4) 29%,var(--fill-5) 36%,var(--fill-6) 46%,var(--fill-7) 56%,var(--fill-8) 66%,#020208 76%,#020208 100%)}
.icon{position:absolute;top:-100px;width:200px;height:200px;margin-left:-100px;border-radius:50%;background:radial-gradient(circle,#000000b0 0 55%,transparent 71%);display:grid;place-items:center}
.icon svg{width:140px;height:140px;fill:none;stroke:var(--ink);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.wires{position:absolute;left:-1000px;top:-1000px;width:6000px;height:2000px;overflow:visible;pointer-events:none}
.wires path{fill:none;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
</style>
<div class="stage"><div class="glow"></div><div class="band"></div><div class="world"></div></div>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.6"/><path d="M5 20.5v-1.2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1.2"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="7.5" r="3.4"/><path d="M2.5 20.5v-1a4.8 4.8 0 0 1 4.8-4.8h3.4a4.8 4.8 0 0 1 4.8 4.8v1"/><path d="M15 4.3a3.4 3.4 0 0 1 0 6.4"/><path d="M18.3 14.9a4.8 4.8 0 0 1 3.2 4.5v1.1"/></symbol>
  <symbol id="i-building" viewBox="0 0 24 24"><rect x="4.5" y="3" width="11" height="18" rx="1.5"/><path d="M15.5 9h3a1.5 1.5 0 0 1 1.5 1.5V21H4"/><path d="M8 7h4M8 10.5h4M8 14h4"/><path d="M8.5 21v-3.2h3V21"/></symbol>
</defs></svg>
<script src="../../_lib/motion.js"></script><script src="../../_lib/fx.js"></script>
<script>
/* Times are seconds from the cut-in (reel 0:11.83). World units: 1 px at zoom 1, 1920x1080. */
const M = Motion, D = 3.3, W = 1920, H = 1080;
const P = 360;                     // row pitch: 300 px pill + 60 px gutter
const WORDS = ['Thinking', 'Asking', 'Building'];        // the verbs the narration says
const ICONS = ['i-users', 'i-building', 'i-user'];       // the icon after each word
const PAD = 182, GAP = 453;        // pill side padding; pill-edge to pill-edge across an icon

/* cubic-bezier as an ease, for the measured pull-back (fast out of rest, long settle) */
function bezier(x1, y1, x2, y2) {
  const B = (a, b, t) => 3 * a * t * (1 - t) * (1 - t) + 3 * b * t * t * (1 - t) + t * t * t;
  return x => { if (x <= 0 || x >= 1) return M.clamp(x); let lo = 0, hi = 1;
    for (let k = 0; k < 26; k++) { const m = (lo + hi) / 2; if (B(x1, x2, m) < x) lo = m; else hi = m; }
    return B(y1, y2, (lo + hi) / 2); };
}
const pull = bezier(.2, 0, .05, 1);

const world = document.querySelector('.world');
const glow = document.querySelector('.glow'), band = document.querySelector('.band');

/* font size so "Thinking" sets 512 px wide, as in the reel at full size */
const probe = document.createElement('span');
probe.style.cssText = 'position:absolute;visibility:hidden;font:400 100px "Sharp Grotesk";letter-spacing:-.01em;white-space:nowrap';
document.body.appendChild(probe);
let FS = 138, textW = {};
function measure() {
  probe.textContent = 'Thinking'; FS = 512 / probe.getBoundingClientRect().width * 100;
  for (const w of WORDS) { probe.textContent = w; textW[w] = probe.getBoundingClientRect().width * FS / 100; }
}

/* Rows. r = 0 is the first row seen (its Thinking is the first lit pill); 1 and 2 hold the next two.
   anchor: [word index, world x of that pill's centre]. dir: which way the row slides in. */
const ROWS = [
  { r: -4, show: .06,   t0: .067,  dir: +1, dur: 1.4, anchor: [2, -620] },
  { r: -3, show: .06,   t0: .067,  dir: -1, dur: 1.4, anchor: [0, 980] },
  { r: -2, show: .06,   t0: .067,  dir: +1, dur: 1.4, anchor: [1, -260] },
  { r: -1, show: .06,   t0: .067,  dir: -1, dur: 1.4, anchor: [1, 450] },
  { r: 0,  show: 0,     t0: 0,     dir: +1, dur: 1.4, anchor: [0, 0],    lit: [0, .48, .95] },
  { r: 1,  show: 1.2,   t0: 1.2,   dir: -1, dur: 2.0, anchor: [1, 1800], lit: [1, 1.21, 1.6] },
  { r: 2,  show: 1.93,  t0: 1.937, dir: -1, dur: 1.8, anchor: [2, 1190], lit: [2, 1.95, 2.22] },
  { r: 3,  show: 1.997, t0: 1.997, dir: +1, dur: 1.8, anchor: [0, 380] },
  { r: 4,  show: 2.03,  t0: 2.03,  dir: -1, dur: 1.8, anchor: [2, -480] },
  { r: 5,  show: 2.063, t0: 2.063, dir: +1, dur: 1.8, anchor: [1, 720] },
  { r: 6,  show: 2.097, t0: 2.097, dir: -1, dur: 1.8, anchor: [0, -150] },
];
/* connectors: each leaves its lit pill's right end, elbows into the gutter, runs right */
const WIRES = { 0: { dy: +180, len: 2300, at: 2.047, span: .85, pow: 2.0 },
                1: { dy: -180, len: 900,  at: 2.047, span: .85, pow: 2.0 },
                2: { dy: -180, len: 1000, at: 2.067, span: .83, pow: 2.0 } };

const pillW = w => textW[w] + PAD * 2;
function build() {
  measure();
  for (const row of ROWS) {
    const el = document.createElement('div'); el.className = 'row'; el.style.top = row.r * P + 'px';
    row.el = el; row.dim = []; world.appendChild(el);
    const [k0, x0] = row.anchor;
    // walk right then left from the anchor pill, laying pill, icon, pill…
    const items = [];
    let k = k0, x = x0;
    for (let n = 0; x < 6200; n++) { items.push({ k: ((k % 3) + 3) % 3, x }); const w = pillW(WORDS[((k % 3) + 3) % 3]);
      const nk = k + 1, nw = pillW(WORDS[((nk % 3) + 3) % 3]); x += w / 2 + GAP + nw / 2; k = nk; }
    k = k0; x = x0;
    for (; x > -6200;) { const w = pillW(WORDS[((k % 3) + 3) % 3]); const pk = k - 1, pw = pillW(WORDS[((pk % 3) + 3) % 3]);
      x -= w / 2 + GAP + pw / 2; k = pk; items.push({ k: ((k % 3) + 3) % 3, x }); }
    for (const it of items) {
      const word = WORDS[it.k], w = pillW(word);
      const p = document.createElement('div'); p.className = 'pill';
      p.style.cssText = `left:${it.x - w / 2}px;width:${w}px;font-size:${FS}px`;
      const lit = row.lit && it.x === x0;
      if (lit) { p.innerHTML = '<div class="fill"><div class="strip"></div></div>'; row.fill = p.firstChild; row.strip = p.firstChild.firstChild; row.litRight = it.x + w / 2; }
      p.insertAdjacentHTML('beforeend', `<span>${word}</span>`);
      el.appendChild(p); if (!lit) row.dim.push(p);
      const ic = document.createElement('div'); ic.className = 'icon'; ic.style.left = (it.x + w / 2 + GAP / 2) + 'px';
      ic.innerHTML = `<svg><use href="#${ICONS[it.k]}"/></svg>`; el.appendChild(ic); row.dim.push(ic);
    }
    const wire = WIRES[row.r];
    if (wire) {
      const NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'wires'); svg.setAttribute('viewBox', '-1000 -1000 6000 2000');
      const x0w = row.litRight + 12, x1 = row.litRight + 105, R = 50, gy = wire.dy, s = Math.sign(gy);
      const d = `M${x0w} 0 H${x1 - R} Q${x1} 0 ${x1} ${s * R} V${gy - s * R} Q${x1} ${gy} ${x1 + R} ${gy} H${x1 + R + 4000}`;
      const id = 'g' + row.r;
      svg.innerHTML = `<defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${x0w}" y1="0" x2="${x0w + 400}" y2="0">
        <stop offset="0" style="stop-color:var(--wire)"/><stop offset=".55" style="stop-color:var(--wire)"/><stop offset="1" style="stop-color:var(--wire-head)"/></linearGradient></defs>
        <path d="${d}" stroke="url(#${id})"/>`;
      el.appendChild(svg);
      wire.path = svg.querySelector('path'); wire.grad = svg.querySelector('linearGradient'); wire.total = wire.path.getTotalLength(); wire.x0 = x0w;
      wire.path.style.strokeDasharray = `0 ${wire.total + 10}`;
    }
  }
}

function seek(t) {
  // camera: hold on row 0, whip to row 1 while easing out (smootherstep), then the pull-back proper
  const a = M.phase(t, .787, 1.617, 'smoother');
  const b = pull(M.phase(t, 1.747, 2.947, 'linear'));
  const tau = Math.max(0, t - 2.617);
  const exitX = tau > 0 ? 4 * (Math.exp(19 * Math.min(tau, .3)) - 1) : 0;   // whips out right into the cut
  const zoom = M.lerp(1, .755, M.phase(t, .767, 1.817, 'smooth')) * M.lerp(1, .473, b);
  M.camera(world, { x: 1710 * a - 1010 * b - exitX, y: P * a, zoom }, { width: W, height: H });

  const fade = M.phase(t, 2.217, 2.867, 'linear'), dim = 1 - .95 * fade, soft = `blur(${6 * fade * fade}px)`;
  for (const row of ROWS) {
    const off = row.dir * 540 * Math.pow(2, -10 * Math.max(0, t - row.t0) / row.dur);
    row.el.style.transform = `translate3d(${off}px,0,0)`;
    row.el.style.visibility = t >= row.show ? 'visible' : 'hidden';
    for (const d of row.dim) { d.style.opacity = dim; d.style.filter = fade > 0 ? soft : 'none'; }
    if (row.lit) {
      const f = M.phase(t, row.lit[1], row.lit[2], 'smooth');
      row.fill.style.opacity = M.phase(f, 0, .18);
      row.fill.style.inset = M.lerp(14, 3, M.phase(f, 0, .6)) + 'px';
      row.strip.style.transform = `translateX(${M.lerp(-28.6, 0, f)}%)`;
    }
    const wire = WIRES[row.r];
    if (wire) {
      const u = M.clamp((t - wire.at) / wire.span);
      const L = t < wire.at ? 0 : Math.max(3, wire.len * Math.pow(u, wire.pow));
      wire.path.style.visibility = L > 0 ? 'visible' : 'hidden';
      wire.path.style.strokeDasharray = `${L} ${wire.total + 10}`;
      const head = wire.path.getPointAtLength(Math.min(L, wire.total));
      wire.grad.setAttribute('x2', Math.max(wire.x0 + 140, head.x));
    }
  }
  // ground: the navy floor glow gives way to a diagonal blue band; the pattern cuts out at 2.9
  glow.style.opacity = 1 - M.phase(t, 2.25, 2.75);
  band.style.opacity = M.phase(t, 2.2, 2.75);
  band.style.transform = `translate3d(${M.lerp(260, 0, M.phase(t, 2.2, 2.9, 'smooth'))}px,0,0)`;
  world.style.opacity = 1 - M.phase(t, 2.885, 2.92, 'linear');
}

fx.wait(document.fonts.load('400 100px "Sharp Grotesk"').then(() => { build(); seek(0); }));
fx.register({ duration: D, loop: false, seek });
</script>
