<!doctype html><meta charset="utf-8">
<title>Wristwatch</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#e9e6df}
  .band{position:absolute;left:50%;top:-60px;width:330px;height:1200px;margin-left:-165px;background:linear-gradient(90deg,#1c1c1e,#3a3a3d 50%,#1c1c1e);border-radius:40px}
  .band::before,.band::after{content:"";position:absolute;left:0;width:100%;height:22px;background:rgba(255,255,255,.08)}
  .band::before{top:180px}.band::after{bottom:180px}
  .case{position:absolute;left:50%;top:50%;width:520px;height:620px;margin:-310px 0 0 -260px;border-radius:150px;background:linear-gradient(160deg,#f2f2f2,#b8b8bc);box-shadow:0 40px 100px rgba(0,0,0,.35),inset 0 -6px 12px rgba(0,0,0,.2)}
  .crown{position:absolute;right:-26px;top:200px;width:36px;height:80px;border-radius:12px;background:linear-gradient(90deg,#c8c8cc,#8a8a90);will-change:transform}
  .screen{position:absolute;inset:30px;border-radius:125px;background:#000;overflow:hidden}
  .face{position:absolute;left:0;width:100%;top:102px;height:300px;display:flex;align-items:center;justify-content:center}
  .face svg{width:300px;height:300px;overflow:visible}
  .tick{stroke:#555;stroke-width:3}
  .tick.big{stroke:#ddd;stroke-width:6}
  .hand{stroke-linecap:round;transform-origin:100px 100px;will-change:transform}
  .hh{stroke:#fff;stroke-width:10}.mh{stroke:#fff;stroke-width:7}.sh{stroke:#ff9f0a;stroke-width:3}
  .cap{fill:#ff9f0a}
  .digital{position:absolute;left:0;width:100%;top:44px;text-align:center;font-family:"Atlas Grotesk",sans-serif;font-weight:500;font-size:44px;color:#fff;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .digital span{display:inline-block;will-change:transform,opacity}
  .rings{position:absolute;left:50%;bottom:54px;width:84px;height:84px;margin-left:-42px}
  .rings svg{width:100%;height:100%;transform:rotate(-90deg)}
  .rings circle{fill:none;stroke-width:12}
  .rt{stroke:rgba(255,255,255,.12)}
  .r1{stroke:#ff375f}.r2{stroke:#a4ff3c}.r3{stroke:#0af}
  .hr{position:absolute;left:0;width:100%;bottom:22px;text-align:center;font-family:"Atlas Grotesk",sans-serif;font-size:24px;color:#ff375f;letter-spacing:.06em}
  .hr b{display:inline-block;will-change:transform}
</style>
<div class="stage">
  <div class="band"></div>
  <div class="case">
    <div class="crown"></div>
    <div class="screen">
      <div class="digital"><span id="dg">10:09:32</span></div>
      <div class="face">
        <svg viewBox="0 0 200 200" id="fs">
          <g id="ticks"></g>
          <line class="hand hh" x1="100" y1="100" x2="100" y2="52"/>
          <line class="hand mh" x1="100" y1="100" x2="100" y2="34"/>
          <line class="hand sh" x1="100" y1="112" x2="100" y2="26"/>
          <circle class="cap" cx="100" cy="100" r="5"/>
        </svg>
      </div>
      <div class="rings"><svg viewBox="0 0 100 100"><circle class="rt" cx="50" cy="50" r="42"/><circle class="r1" cx="50" cy="50" r="42"/><circle class="rt" cx="50" cy="50" r="28"/><circle class="r2" cx="50" cy="50" r="28"/><circle class="rt" cx="50" cy="50" r="14"/><circle class="r3" cx="50" cy="50" r="14"/></svg></div>
      <div class="hr"><b>♥</b> 72 BPM</div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tg = document.getElementById('ticks');
  for (let i = 0; i < 60; i++) {
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    const big = i % 5 === 0, r1 = big ? 78 : 84, r2 = 92, a = i / 60 * Math.PI * 2;
    l.setAttribute('x1', 100 + Math.sin(a) * r1); l.setAttribute('y1', 100 - Math.cos(a) * r1);
    l.setAttribute('x2', 100 + Math.sin(a) * r2); l.setAttribute('y2', 100 - Math.cos(a) * r2);
    l.setAttribute('class', 'tick' + (big ? ' big' : '')); tg.appendChild(l);
  }
  const dg = document.getElementById('dg');
  const D = 2;
  // hands: a second hand that ticks twice with mechanical snap, minute/hour crawl
  const tl = fx.timeline({ duration: D });
  const s0 = 32;
  gsap.set('.sh', { rotation: s0 * 6 });
  gsap.set('.mh', { rotation: 9 * 6 + s0 * .1 });
  gsap.set('.hh', { rotation: 10 * 30 + 9 * .5 });
  for (let k = 0; k < 2; k++) {
    tl.to('.sh', { rotation: (s0 + k + 1) * 6, duration: .18, ease: 'elastic.out(1.2,.35)' }, k + .02)
      .set(dg, { textContent: '10:09:' + (s0 + k + 1) }, k + .02)
      .fromTo(dg, { scale: 1.12 }, { scale: 1, duration: .3, ease: 'power2.out', immediateRender: false }, k + .02);
  }
  tl.to('.mh', { rotation: 9 * 6 + (s0 + 2) * .1, duration: 2, ease: 'none' }, 0)
    .to('.hh', { rotation: 10 * 30 + 9 * .5 + .02, duration: 2, ease: 'none' }, 0);
  // rings sweep in continuously, resetting seamlessly
  tl.fromTo('.r1', { drawSVG: '0% 0%' }, { drawSVG: '0% 78%', duration: 1.2, ease: 'power3.out', immediateRender: true }, 0)
    .fromTo('.r2', { drawSVG: '0% 0%' }, { drawSVG: '0% 62%', duration: 1.2, ease: 'power3.out', immediateRender: true }, .1)
    .fromTo('.r3', { drawSVG: '0% 0%' }, { drawSVG: '0% 90%', duration: 1.2, ease: 'power3.out', immediateRender: true }, .2)
    .to('.r1, .r2, .r3', { drawSVG: '100% 100%', duration: .4, ease: 'power3.in', stagger: .05 }, 1.55);
  // heart beat 72bpm ~ every .83s
  [0, .83, 1.66].forEach(t => tl.to('.hr b', { scale: 1.5, duration: .1, ease: 'power2.out' }, t).to('.hr b', { scale: 1, duration: .3, ease: 'power2.inOut' }, t + .1));
  // crown turns, screen glints
  tl.to('.crown', { y: -6, duration: .5, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 0);
</script>
