<!doctype html><meta charset="utf-8">
<title>Illustrator Logo</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#1a0d05;display:flex;align-items:center;justify-content:center}
  .tile{position:relative;width:300px;height:300px;border-radius:56px;background:#330000;box-shadow:0 30px 80px rgba(255,154,0,.2)}
  .tile svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .stroke path,.stroke rect,.stroke circle{fill:none;stroke:#ff9a00;stroke-width:8;stroke-linejoin:round;stroke-linecap:round}
  .fills path,.fills rect,.fills circle{fill:#ff9a00}
  .anchor{fill:#fff;stroke:#ff9a00;stroke-width:2}
  .handle{stroke:#ffd27f;stroke-width:2}
  .pen{position:absolute;width:34px;height:34px;left:0;top:0;will-change:transform}
  .pen path{fill:#fff;stroke:#1a0d05;stroke-width:1.5}
</style>
<div class="stage">
  <div class="tile">
    <svg class="fills" viewBox="0 0 300 300">
      <path d="M80,225 L124,75 L158,75 L202,225 L172,225 L162,190 L120,190 L110,225 Z M128,163 L154,163 L141,113 Z" fill-rule="evenodd"/>
      <rect x="212" y="120" width="26" height="105" rx="4"/>
      <circle cx="225" cy="90" r="16"/>
    </svg>
    <svg class="stroke" viewBox="0 0 300 300">
      <path class="pA" d="M80,225 L124,75 L158,75 L202,225 L172,225 L162,190 L120,190 L110,225 Z"/>
      <path class="pA2" d="M128,163 L154,163 L141,113 Z"/>
      <path class="pI" d="M212,124 Q212,120 216,120 L234,120 Q238,120 238,124 L238,221 Q238,225 234,225 L216,225 Q212,225 212,221 Z"/>
      <path class="pDot" d="M225,74 A16,16 0 1,1 224.9,74 Z"/>
      <g class="anchors">
        <circle class="anchor" cx="80" cy="225" r="5"/><circle class="anchor" cx="124" cy="75" r="5"/><circle class="anchor" cx="158" cy="75" r="5"/><circle class="anchor" cx="202" cy="225" r="5"/>
        <circle class="anchor" cx="120" cy="190" r="5"/><circle class="anchor" cx="162" cy="190" r="5"/>
        <line class="handle" x1="124" y1="75" x2="98" y2="60"/><line class="handle" x1="158" y1="75" x2="184" y2="60"/>
      </g>
    </svg>
    <svg class="pen" viewBox="0 0 24 24"><path d="M2,2 L9,4 L20,15 L15,20 L4,9 Z M20,15 L22,17 L17,22 L15,20 Z"/></svg>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../../assets/gsap/MotionPathPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin);
  const tl = fx.timeline({ duration: 4 });
  gsap.set('.fills',{opacity:0});gsap.set('.pen',{opacity:0});
  tl.from('.tile',{scale:.7,opacity:0,duration:.7,ease:'expo.out'},0)
    // pen tool traces the A outline, dropping anchors as it goes
    .fromTo('.pA',{drawSVG:'0%'},{drawSVG:'100%',duration:1.3,ease:'power1.inOut'},.3)
    .to('.pen',{motionPath:{path:'.pA',align:'.pA',alignOrigin:[.1,.1]},duration:1.3,ease:'power1.inOut'},.3)
    .to('.pen',{opacity:1,duration:.2},.3)
    .from('.anchor',{scale:0,transformOrigin:'50% 50%',duration:.25,stagger:.14,ease:'back.out(3)'},.4)
    .from('.handle',{drawSVG:'50% 50%',duration:.3,stagger:.1},.55)
    .fromTo('.pA2',{drawSVG:'0%'},{drawSVG:'100%',duration:.45,ease:'power1.inOut'},1.6)
    .to('.pen',{motionPath:{path:'.pA2',align:'.pA2',alignOrigin:[.1,.1]},duration:.45,ease:'power1.inOut'},1.6)
    .fromTo('.pI',{drawSVG:'0%'},{drawSVG:'100%',duration:.5,ease:'power1.inOut'},2.05)
    .to('.pen',{motionPath:{path:'.pI',align:'.pI',alignOrigin:[.1,.1]},duration:.5,ease:'power1.inOut'},2.05)
    .to('.pen',{opacity:0,duration:.15},2.5)
    .fromTo('.pDot',{drawSVG:'0%'},{drawSVG:'100%',duration:.35,ease:'power2.out'},2.4)
    // fill floods in, outlines and anchors clear
    .to('.fills',{opacity:1,duration:.4,ease:'power2.out'},2.75)
    .to('.anchors',{opacity:0,duration:.3},2.75)
    .to('.stroke path, .stroke rect, .stroke circle',{opacity:0,duration:.4},2.85)
    .fromTo('.fills',{scale:.94,transformOrigin:'50% 50%'},{scale:1,duration:.5,ease:'elastic.out(1,.5)'},2.75)
    // exit
    .to('.tile',{scale:.7,opacity:0,duration:.4,ease:'power3.in'},3.55);
</script>
