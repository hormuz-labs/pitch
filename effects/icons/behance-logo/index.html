<!doctype html><meta charset="utf-8">
<title>Behance Logo</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#1769ff;display:flex;align-items:center;justify-content:center}
  .mark{position:relative;display:flex;align-items:flex-end;gap:6px;height:220px;padding:0 20px}
  .row{overflow:hidden;height:220px;display:flex;align-items:flex-end}
  .ltr{display:block;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:240px;line-height:.85;color:#fff;letter-spacing:-.04em;will-change:transform}
  .ltr.e{font-size:190px}
  .bar{position:absolute;right:40px;top:26px;width:104px;height:20px;border-radius:10px;background:#fff;transform-origin:0 50%}
  .caption{position:absolute;bottom:150px;left:0;right:0;text-align:center;color:rgba(255,255,255,.85);font-size:26px;letter-spacing:.02em;overflow:hidden;height:40px}
  .caption span{display:block}
  .ring{position:absolute;left:50%;top:50%;width:520px;height:520px;border-radius:50%;border:2px solid rgba(255,255,255,.35);transform:translate(-50%,-50%)}
</style>
<div class="stage">
  <div class="ring"></div>
  <div class="mark">
    <div class="row"><span class="ltr b">B</span></div>
    <div class="row"><span class="ltr e">e</span></div>
    <div class="bar"></div>
  </div>
  <div class="caption"><span>Portfolio now live</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 3 });
  tl.from('.ring',{scale:.2,opacity:0,duration:1.2,ease:'expo.out'},0)
    .to('.ring',{scale:1.6,opacity:0,duration:1,ease:'power2.out'},.9)
    // letters rise from behind the baseline, the macron wipes across
    .from('.ltr.b',{yPercent:110,duration:.8,ease:'expo.out'},.1)
    .from('.ltr.e',{yPercent:110,duration:.8,ease:'expo.out'},.22)
    .from('.bar',{scaleX:0,duration:.5,ease:'expo.out'},.7)
    .fromTo('.mark',{scale:.96},{scale:1,duration:.6,ease:'elastic.out(1,.5)'},1)
    .from('.caption span',{yPercent:120,duration:.6,ease:'expo.out'},.95)
    // exit
    .to('.caption span',{yPercent:-120,duration:.35,ease:'power3.in'},2.35)
    .to('.bar',{scaleX:0,duration:.3,ease:'power3.in'},2.4)
    .to('.ltr',{yPercent:-110,duration:.4,stagger:.07,ease:'power3.in'},2.45);
</script>
