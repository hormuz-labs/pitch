<!doctype html><meta charset="utf-8">
<title>Close Icon</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0f1115;display:flex;align-items:center;justify-content:center}
  .modal{position:relative;width:560px;height:340px;border-radius:24px;background:#1a1d24;border:1px solid #2a2e38;box-shadow:0 40px 100px rgba(0,0,0,.5);padding:40px;will-change:transform}
  .t{width:60%;height:18px;border-radius:9px;background:#3a3f4c}
  .l{height:12px;border-radius:6px;background:#2c303a;margin-top:18px}
  .btn{position:absolute;bottom:40px;right:40px;width:140px;height:48px;border-radius:12px;background:#4f7cff}
  .x{position:absolute;top:22px;right:22px;width:56px;height:56px;border-radius:50%;background:#262a34;display:flex;align-items:center;justify-content:center;will-change:transform}
  .x svg{width:56px;height:56px;overflow:visible}
  .x path{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round}
  .x .glow{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 rgba(255,255,255,.5)}
</style>
<div class="stage">
  <div class="modal">
    <div class="t"></div><div class="l" style="width:90%"></div><div class="l" style="width:75%"></div><div class="l" style="width:55%"></div>
    <div class="btn"></div>
    <div class="x"><div class="glow"></div><svg viewBox="0 0 56 56"><path class="a" d="M18,18 L38,38"/><path class="b" d="M38,18 L18,38"/></svg></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 3 });
  // modal opens, the close icon reveals: disc pops, the two strokes draw and rotate in
  tl.from('.modal',{y:60,scale:.94,opacity:0,duration:.7,ease:'expo.out'},0)
    .from('.x',{scale:0,duration:.5,ease:'back.out(2)'},.35)
    .fromTo('.x svg',{rotation:-90},{rotation:0,duration:.7,ease:'expo.out'},.5)
    .fromTo('.x .a',{drawSVG:'0%'},{drawSVG:'100%',duration:.35,ease:'power3.out'},.5)
    .fromTo('.x .b',{drawSVG:'100% 100%'},{drawSVG:'0% 100%',duration:.35,ease:'power3.out'},.62)
    // hover state: it spins a quarter and lifts
    .to('.x',{rotation:90,scale:1.12,backgroundColor:'#ff4d5e',duration:.45,ease:'back.out(2)'},1.3)
    // press: click, modal dismisses
    .to('.x',{scale:.9,duration:.12,ease:'power2.in'},2.05)
    .to('.x',{scale:1.1,duration:.15,ease:'power2.out'},2.17)
    .to('.modal',{y:40,scale:.94,opacity:0,duration:.4,ease:'power3.in'},2.35);
</script>
