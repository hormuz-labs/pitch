<!doctype html><meta charset="utf-8">
<title>Live Memoji</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#1c1c1e}
  .bubble{position:absolute;left:50%;top:50%;width:620px;height:620px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3a3f,#232326 70%);box-shadow:inset 0 -30px 80px rgba(0,0,0,.4),0 40px 120px rgba(0,0,0,.5)}
  .head{position:absolute;left:50%;top:50%;width:380px;height:420px;margin:-230px 0 0 -190px;transform-origin:50% 90%;will-change:transform}
  .face{position:absolute;inset:0;border-radius:190px 190px 170px 170px/200px 200px 180px 180px;background:linear-gradient(180deg,#ffd6b3,#f2b48a)}
  .hair{position:absolute;left:-14px;top:-30px;width:408px;height:220px;border-radius:210px 210px 80px 80px/200px 200px 60px 60px;background:#3b2a24}
  .hair::after{content:"";position:absolute;left:20px;top:140px;width:120px;height:80px;background:#3b2a24;border-radius:0 0 80px 60px;transform:rotate(-12deg)}
  .ear{position:absolute;top:190px;width:54px;height:80px;border-radius:50%;background:#f2b48a}
  .ear.l{left:-22px}.ear.r{right:-22px}
  .eye{position:absolute;top:196px;width:58px;height:58px;border-radius:50%;background:#fff;overflow:hidden;will-change:transform}
  .eye.l{left:84px}.eye.r{right:84px}
  .pupil{position:absolute;left:14px;top:14px;width:30px;height:30px;border-radius:50%;background:#2a1a12;will-change:transform}
  .pupil::after{content:"";position:absolute;left:5px;top:4px;width:9px;height:9px;border-radius:50%;background:#fff}
  .lid{position:absolute;left:0;top:-100%;width:100%;height:100%;background:#f7c6a2;border-radius:50%;will-change:transform}
  .brow{position:absolute;top:164px;width:78px;height:16px;border-radius:8px;background:#3b2a24;will-change:transform}
  .brow.l{left:74px;transform:rotate(-6deg)}.brow.r{right:74px;transform:rotate(6deg)}
  .nose{position:absolute;left:50%;top:250px;width:26px;height:40px;margin-left:-13px;border-radius:13px;background:#e9a57c}
  .mouth{position:absolute;left:50%;top:306px;width:120px;height:56px;margin-left:-60px;transform-origin:50% 0;will-change:transform}
  .mouth svg{width:100%;height:100%;overflow:visible}
  .cheek{position:absolute;top:280px;width:60px;height:34px;border-radius:50%;background:#ff9e9e;opacity:.5;filter:blur(4px)}
  .cheek.l{left:40px}.cheek.r{right:40px}
  .rec{position:absolute;left:50%;top:860px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:14px 28px;border-radius:40px;background:rgba(255,255,255,.08);font-family:"Atlas Grotesk",sans-serif;font-size:30px;color:#fff;white-space:nowrap}
  .rec i{width:18px;height:18px;border-radius:50%;background:#ff453a;display:block}
  .wave{position:absolute;left:50%;top:150px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;height:60px}
  .wave b{display:block;width:10px;height:20px;border-radius:5px;background:#5ac8fa;will-change:transform}
</style>
<div class="stage">
  <div class="bubble"></div>
  <div class="wave" id="wave"></div>
  <div class="head">
    <div class="ear l"></div><div class="ear r"></div>
    <div class="face"></div>
    <div class="hair"></div>
    <div class="cheek l"></div><div class="cheek r"></div>
    <div class="brow l"></div><div class="brow r"></div>
    <div class="eye l"><div class="pupil"></div><div class="lid"></div></div>
    <div class="eye r"><div class="pupil"></div><div class="lid"></div></div>
    <div class="nose"></div>
    <div class="mouth"><svg viewBox="0 0 120 56"><path id="mp" d="M10 14 Q60 26 110 14 Q60 30 10 14 Z" fill="#8a2d3b" stroke="#c0525f" stroke-width="3" stroke-linejoin="round"/></svg></div>
  </div>
  <div class="rec"><i></i>Recording Memoji</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/MorphSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(MorphSVGPlugin);
  const wave = document.getElementById('wave'), bars = [];
  for (let i = 0; i < 9; i++) { const b = document.createElement('b'); wave.appendChild(b); bars.push(b); }
  const rng = fx.rng(11);
  const smile = 'M8 10 Q60 68 112 10 Q60 30 8 10 Z';
  const open = 'M18 6 Q60 -4 102 6 Q104 56 60 60 Q16 56 18 6 Z';
  const neutral = 'M10 14 Q60 26 110 14 Q60 30 10 14 Z';
  const tl = fx.timeline({ duration: 4 });
  // audio bars pulse the whole loop
  bars.forEach((b, i) => {
    for (let k = 0; k < 8; k++) tl.to(b, { scaleY: .6 + rng() * 2.4, duration: .25, ease: 'sine.inOut' }, k * .5 + i * .03);
    tl.to(b, { scaleY: 1, duration: .2 }, 3.85);
  });
  // head talks: tilt, nod, turn
  tl.to('.head', { rotation: -8, x: -20, duration: .7, ease: 'power2.inOut' }, .2)
    .to('.head', { rotation: 6, x: 18, y: 8, duration: .8, ease: 'power2.inOut' }, 1.1)
    .to('.head', { rotation: 0, x: 0, y: -12, duration: .6, ease: 'back.out(2)' }, 2.1)
    .to('.head', { y: 0, duration: .5, ease: 'power2.inOut' }, 2.9)
    .to('.head', { rotation: 0, x: 0, y: 0, duration: .4, ease: 'power2.inOut' }, 3.5);
  // pupils look around
  tl.to('.pupil', { x: -8, y: 2, duration: .4, ease: 'power2.out' }, .3)
    .to('.pupil', { x: 8, y: -3, duration: .4, ease: 'power2.inOut' }, 1.2)
    .to('.pupil', { x: 0, y: 0, duration: .4, ease: 'power2.inOut' }, 2.2);
  // blinks
  [0.9, 2.6].forEach(t => tl.to('.lid', { yPercent: 100, duration: .09, ease: 'power2.in' }, t).to('.lid', { yPercent: 0, duration: .12, ease: 'power2.out' }, t + .1));
  // brows: raise on the surprise beat, then relax
  tl.to('.brow', { y: -18, duration: .3, ease: 'back.out(2)' }, 2.1)
    .to('.brow.l', { rotation: -14, duration: .3 }, 2.1)
    .to('.brow.r', { rotation: 14, duration: .3 }, 2.1)
    .to('.brow', { y: 0, duration: .5, ease: 'power2.inOut' }, 2.9)
    .to('.brow.l', { rotation: -6, duration: .5 }, 2.9)
    .to('.brow.r', { rotation: 6, duration: .5 }, 2.9);
  // mouth: talk, gasp, big smile, back to neutral
  tl.to('#mp', { morphSVG: open, duration: .2, ease: 'power2.out' }, .3)
    .to('#mp', { morphSVG: neutral, duration: .2 }, .55)
    .to('#mp', { morphSVG: open, duration: .18 }, .8)
    .to('#mp', { morphSVG: neutral, duration: .2 }, 1.0)
    .to('#mp', { morphSVG: open, duration: .25, ease: 'back.out(2)' }, 2.1)
    .to('#mp', { morphSVG: smile, duration: .5, ease: 'elastic.out(1,.5)' }, 2.6)
    .to('.cheek', { opacity: .9, scale: 1.3, duration: .4 }, 2.6)
    .to('#mp', { morphSVG: neutral, duration: .4, ease: 'power2.inOut' }, 3.5)
    .to('.cheek', { opacity: .5, scale: 1, duration: .4 }, 3.5);
  // rec dot blinks
  tl.to('.rec i', { opacity: .2, duration: .5, ease: 'sine.inOut', yoyo: true, repeat: 7 }, 0);
</script>
