<!doctype html><meta charset="utf-8">
<title>Check Icon</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f6f7f9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px}
  .badge{position:relative;width:220px;height:220px}
  .badge svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .ring{fill:none;stroke:#22c55e;stroke-width:10;stroke-linecap:round}
  .disc{fill:#22c55e;transform-origin:50% 50%;transform-box:fill-box}
  .tick{fill:none;stroke:#fff;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
  .tick.g{stroke:#22c55e}
  .pulse{fill:none;stroke:#22c55e;stroke-width:4;transform-origin:50% 50%;transform-box:fill-box}
  .msg{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:44px;color:#111;letter-spacing:-.02em;overflow:hidden;height:56px}
  .msg span{display:block}
</style>
<div class="stage">
  <div class="badge">
    <svg viewBox="0 0 220 220">
      <circle class="pulse" cx="110" cy="110" r="100"/>
      <circle class="ring" cx="110" cy="110" r="100"/>
      <circle class="disc" cx="110" cy="110" r="100"/>
      <path class="tick g" d="M62,114 L96,148 L160,80"/>
      <path class="tick w" d="M62,114 L96,148 L160,80"/>
    </svg>
  </div>
  <div class="msg"><span>Payment complete</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 3 });
  gsap.set('.disc',{scale:0});
  gsap.set('.pulse',{opacity:0});
  // ring draws, the check draws itself with one stroke, then the disc fills behind it
  tl.fromTo('.ring',{drawSVG:'0%',rotation:-90,transformOrigin:'50% 50%'},{drawSVG:'100%',duration:.8,ease:'power3.inOut'},0)
    .fromTo('.tick.g',{drawSVG:'0%'},{drawSVG:'100%',duration:.55,ease:'power3.out'},.5)
    .to('.disc',{scale:1,duration:.55,ease:'back.out(1.8)'},1.05)
    .fromTo('.tick.w',{drawSVG:'0%'},{drawSVG:'100%',duration:.4,ease:'power2.out'},1.15)
    .fromTo('.pulse',{scale:1,opacity:.8},{scale:1.45,opacity:0,duration:.8,ease:'power2.out'},1.15)
    .fromTo('.badge',{scale:1},{scale:1.06,duration:.25,ease:'power2.out',yoyo:true,repeat:1},1.1)
    .from('.msg span',{yPercent:120,duration:.6,ease:'expo.out'},1.3)
    // exit
    .to('.msg span',{yPercent:-120,duration:.35,ease:'power3.in'},2.5)
    .to('.badge',{scale:0,duration:.4,ease:'back.in(1.8)'},2.55);
</script>
