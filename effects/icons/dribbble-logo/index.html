<!doctype html><meta charset="utf-8">
<title>Dribbble Logo</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#fdf1f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
  .ball{width:240px;height:240px;overflow:visible;will-change:transform}
  .rim{fill:#ea4c89}
  .seam{fill:none;stroke:#fdf1f6;stroke-width:10;stroke-linecap:round}
  .shadow{width:200px;height:24px;border-radius:50%;background:rgba(234,76,137,.25);filter:blur(6px);margin-top:-30px}
  .word{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:48px;color:#2b1a22;letter-spacing:-.02em;overflow:hidden;height:60px}
  .word span{display:block}
</style>
<div class="stage">
  <svg class="ball" viewBox="0 0 240 240">
    <circle class="rim" cx="120" cy="120" r="112"/>
    <g class="seams">
      <path class="seam" d="M40,70 C90,110 150,120 225,105"/>
      <path class="seam" d="M85,20 C130,80 165,140 180,222"/>
      <path class="seam" d="M15,130 C70,125 140,150 195,200"/>
    </g>
  </svg>
  <div class="shadow"></div>
  <div class="word"><span>New shot posted</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 3 });
  // the ball drops and bounces, spinning, seams draw on as it settles
  tl.from('.ball',{y:-420,rotation:-200,duration:.8,ease:'bounce.out'},0)
    .fromTo('.ball',{scaleY:1,scaleX:1},{scaleY:.82,scaleX:1.14,transformOrigin:'50% 100%',duration:.1,ease:'power2.in',yoyo:true,repeat:1},.42)
    .from('.shadow',{scaleX:.2,opacity:0,duration:.8,ease:'bounce.out'},0)
    .fromTo('.seam',{drawSVG:'0%'},{drawSVG:'100%',duration:.6,stagger:.12,ease:'power2.out'},.55)
    .to('.ball',{rotation:20,duration:1.2,ease:'sine.inOut'},.9)
    .from('.word span',{yPercent:120,duration:.6,ease:'expo.out'},1)
    // exit: bounce up and off
    .to('.ball',{scaleY:.85,scaleX:1.1,duration:.15,ease:'power2.in'},2.35)
    .to('.ball',{y:-500,scaleY:1.05,scaleX:.95,rotation:120,duration:.45,ease:'power3.in'},2.5)
    .to('.shadow',{scaleX:.2,opacity:0,duration:.4},2.5)
    .to('.word span',{yPercent:-120,duration:.35,ease:'power3.in'},2.5);
</script>
