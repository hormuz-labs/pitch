<!doctype html><meta charset="utf-8">
<title>Instagram Logo</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0d0810}
  .grad{position:absolute;left:50%;top:50%;width:1600px;height:1600px;transform:translate(-50%,-50%);background:conic-gradient(from 0deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);filter:blur(120px);opacity:.55;will-change:transform}
  .tile{position:absolute;left:50%;top:50%;width:420px;height:420px;transform:translate(-50%,-50%);border-radius:110px;background:linear-gradient(135deg,#feda75 0%,#fa7e1e 25%,#d62976 50%,#962fbf 75%,#4f5bd5 100%);box-shadow:0 40px 100px rgba(214,41,118,.45);will-change:transform}
  .tile svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .frame,.lens{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round}
  .dot{fill:#fff}
  .shine{position:absolute;inset:0;border-radius:110px;overflow:hidden}
  .shine div{position:absolute;top:-40%;left:-60%;width:60%;height:180%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.45),rgba(255,255,255,0));transform:rotate(20deg);will-change:transform}
  .name{position:absolute;left:50%;top:770px;transform:translateX(-50%);font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:64px;color:#fff;letter-spacing:-.02em;white-space:nowrap;display:flex;gap:2px}
  .name span{display:inline-block;will-change:transform,opacity}
</style>
<div class="stage">
  <div class="grad"></div>
  <div class="tile">
    <svg viewBox="0 0 100 100">
      <rect class="frame" x="14" y="14" width="72" height="72" rx="22"/>
      <circle class="lens" cx="50" cy="50" r="17"/>
      <circle class="dot" cx="72" cy="28" r="5"/>
    </svg>
    <div class="shine"><div></div></div>
  </div>
  <div class="name" id="nm"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const nm = document.getElementById('nm');
  'photogram'.split('').forEach(c => { const s = document.createElement('span'); s.textContent = c; nm.appendChild(s); });
  const tl = fx.timeline({ duration: 3 });
  tl.fromTo('.grad', { rotation: 0 }, { rotation: 120, duration: 3, ease: 'none' }, 0);
  // tile lands with a bounce, then the glyph draws itself on
  tl.from('.tile', { scale: 0, rotation: -35, duration: .8, ease: 'back.out(1.6)' }, 0)
    .fromTo('.frame', { drawSVG: '0%' }, { drawSVG: '100%', duration: .7, ease: 'power3.inOut' }, .35)
    .fromTo('.lens', { drawSVG: '0%' }, { drawSVG: '100%', duration: .55, ease: 'power3.inOut' }, .65)
    .from('.dot', { scale: 0, transformOrigin: '50% 50%', duration: .4, ease: 'back.out(4)' }, 1.05)
    .fromTo('.shine div', { xPercent: -80 }, { xPercent: 380, duration: .7, ease: 'power2.inOut' }, 1.2)
    .from('.name span', { yPercent: 110, opacity: 0, duration: .5, stagger: .04, ease: 'expo.out' }, 1.0)
    // tiny lens pulse like a focus tap
    .to('.lens', { scale: 1.12, transformOrigin: '50% 50%', duration: .2, ease: 'power2.out' }, 1.85)
    .to('.lens', { scale: 1, duration: .35, ease: 'elastic.out(1,.5)' }, 2.05)
    // exit
    .to('.name span', { yPercent: -110, opacity: 0, duration: .3, stagger: .02, ease: 'power3.in' }, 2.5)
    .to('.tile', { scale: 0, rotation: 25, duration: .4, ease: 'back.in(1.6)' }, 2.6);
</script>
