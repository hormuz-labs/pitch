<!doctype html><meta charset="utf-8">
<title>TikTok Logo</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#000}
  .wrap{position:absolute;left:50%;top:46%;width:420px;height:480px;margin:-240px 0 0 -210px;will-change:transform}
  .layer{position:absolute;inset:0;will-change:transform,opacity}
  .layer svg{width:100%;height:100%;overflow:visible}
  .layer path{fill:none;stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
  .c path{stroke:#25f4ee}.r path{stroke:#fe2c55}.w path{stroke:#fff}
  .c,.r{mix-blend-mode:screen}
  .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,0) 0 6px,rgba(255,255,255,.05) 6px 8px);pointer-events:none}
  .slice{position:absolute;left:0;width:100%;height:30px;overflow:hidden;opacity:0;will-change:transform,opacity}
  .slice .layer{top:calc(var(--y) * -1)}
  .tag{position:absolute;left:50%;top:840px;transform:translateX(-50%);font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:60px;color:#fff;letter-spacing:-.02em;white-space:nowrap;will-change:transform}
  .tag i{position:absolute;inset:0;font-style:normal;will-change:transform,opacity;mix-blend-mode:screen}
  .tag .tc{color:#25f4ee}.tag .tr{color:#fe2c55}
  .bar{position:absolute;left:50%;bottom:90px;width:360px;height:6px;margin-left:-180px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
  .bar div{width:100%;height:100%;background:#fff;transform-origin:0 50%;will-change:transform}
</style>
<div class="stage">
  <div class="wrap">
    <div class="layer c"><svg viewBox="0 0 420 480"><path d="M210 40 V320 A80 80 0 1 1 130 240 M210 40 C218 96 262 138 320 142"/></svg></div>
    <div class="layer r"><svg viewBox="0 0 420 480"><path d="M210 40 V320 A80 80 0 1 1 130 240 M210 40 C218 96 262 138 320 142"/></svg></div>
    <div class="layer w"><svg viewBox="0 0 420 480"><path d="M210 40 V320 A80 80 0 1 1 130 240 M210 40 C218 96 262 138 320 142"/></svg></div>
    <div class="slice s1" style="--y:140px;top:140px"><div class="layer w"><svg viewBox="0 0 420 480"><path d="M210 40 V320 A80 80 0 1 1 130 240 M210 40 C218 96 262 138 320 142"/></svg></div></div>
    <div class="slice s2" style="--y:300px;top:300px"><div class="layer w"><svg viewBox="0 0 420 480"><path d="M210 40 V320 A80 80 0 1 1 130 240 M210 40 C218 96 262 138 320 142"/></svg></div></div>
  </div>
  <div class="scan"></div>
  <div class="tag"><i class="tc">@northwind</i><i class="tr">@northwind</i><span>@northwind</span></div>
  <div class="bar"><div></div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const rng = fx.rng(13);
  const tl = fx.timeline({ duration: 3 });
  // the note draws itself as a white stroke, then the cyan/red ghosts split off with a bass thump
  tl.fromTo('.layer path', { drawSVG: '0%' }, { drawSVG: '100%', duration: .8, ease: 'power3.inOut', immediateRender: true }, 0)
    .fromTo('.wrap', { scale: .8 }, { scale: 1, duration: .8, ease: 'expo.out', immediateRender: true }, 0)
    .from('.tag span', { yPercent: 60, opacity: 0, duration: .5, ease: 'expo.out' }, .5)
    .fromTo('.bar div', { scaleX: 0 }, { scaleX: 1, duration: 3, ease: 'none', immediateRender: true }, 0);
  // rhythmic thumps: on each, ghosts offset then snap back, a slice tears sideways
  [0.9, 1.5, 2.1, 2.6].forEach((t, i) => {
    const dx = 14 + rng() * 18;
    tl.to('.wrap', { scale: 1.1, duration: .08, ease: 'power2.out' }, t)
      .to('.wrap', { scale: 1, duration: .45, ease: 'elastic.out(1,.4)' }, t + .08)
      .to('.layer.c', { x: -dx, y: -dx * .4, duration: .06 }, t)
      .to('.layer.r', { x: dx, y: dx * .4, duration: .06 }, t)
      .to('.layer.c, .layer.r', { x: 0, y: 0, duration: .4, ease: 'elastic.out(1,.35)' }, t + .1)
      .to('.tag .tc', { x: -8, opacity: 1, duration: .06 }, t)
      .to('.tag .tr', { x: 8, opacity: 1, duration: .06 }, t)
      .to('.tag i', { x: 0, duration: .3, ease: 'expo.out' }, t + .1)
      .fromTo('.slice.s' + (1 + i % 2), { x: 0, opacity: 1 }, { x: (i % 2 ? -1 : 1) * (40 + rng() * 40), duration: .08, immediateRender: false }, t)
      .to('.slice.s' + (1 + i % 2), { x: 0, duration: .12 }, t + .1)
      .to('.slice.s' + (1 + i % 2), { opacity: 0, duration: .02 }, t + .24);
  });
  gsap.set('.tag i', { opacity: 0 });
  gsap.set('.layer.c, .layer.r', { x: 0, y: 0 });
  // settle idle then erase for the loop
  tl.to('.layer path', { drawSVG: '100% 100%', duration: .35, ease: 'power3.in' }, 2.65)
    .to('.tag span', { yPercent: -60, opacity: 0, duration: .3, ease: 'power3.in' }, 2.7)
    .set('.tag i', { opacity: 0 }, 2.7);
</script>
