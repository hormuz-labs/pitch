<!doctype html><meta charset="utf-8">
<title>Twitch Logo</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0e0e10}
  .glow{position:absolute;left:50%;top:44%;width:900px;height:900px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(145,70,255,.35),rgba(145,70,255,0) 65%);will-change:transform}
  .wrap{position:absolute;left:50%;top:44%;width:420px;height:420px;margin:-210px 0 0 -210px;transform-origin:50% 100%;will-change:transform}
  .wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .bub{fill:#9146ff}
  .eye{fill:#0e0e10;transform-origin:50% 50%;will-change:transform}
  .ghost{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
  .ghost svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .ghost.a .bub{fill:#5a2fbd}.ghost.b .bub{fill:#c9a6ff}
  .badge{position:absolute;left:50%;top:700px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:14px 30px;border-radius:14px;background:#ff3d3d;color:#fff;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:34px;letter-spacing:.1em;white-space:nowrap;will-change:transform,opacity}
  .badge i{width:16px;height:16px;border-radius:50%;background:#fff;display:block}
  .chat{position:absolute;left:50%;top:800px;width:520px;margin-left:-260px;font-family:"Atlas Grotesk",sans-serif;font-size:26px;color:rgba(255,255,255,.8)}
  .chat div{margin-bottom:12px;white-space:nowrap;will-change:transform,opacity}
  .chat b{color:#bf94ff;font-weight:500}
</style>
<div class="stage">
  <div class="glow"></div>
  <div class="wrap">
    <div class="ghost a"><svg viewBox="0 0 100 100"><path class="bub" d="M22 8 H92 V62 L70 84 H52 L38 98 V84 H18 V22 Z"/></svg></div>
    <div class="ghost b"><svg viewBox="0 0 100 100"><path class="bub" d="M22 8 H92 V62 L70 84 H52 L38 98 V84 H18 V22 Z"/></svg></div>
    <svg viewBox="0 0 100 100">
      <path class="bub" d="M22 8 H92 V62 L70 84 H52 L38 98 V84 H18 V22 Z"/>
      <rect class="eye e1" x="44" y="30" width="8" height="24" rx="2"/>
      <rect class="eye e2" x="66" y="30" width="8" height="24" rx="2"/>
    </svg>
  </div>
  <div class="badge"><i></i>LIVE NOW</div>
  <div class="chat">
    <div><b>pixel_pete:</b> lets gooo</div>
    <div><b>nora.k:</b> finally!!</div>
    <div><b>acme_dev:</b> raid incoming</div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  // bubble slams in from above, squashes on landing, springs upright
  tl.fromTo('.wrap', { y: -520, scaleY: 1.2, scaleX: .85 }, { y: 0, scaleY: 1, scaleX: 1, duration: .55, ease: 'power3.in', immediateRender: true }, 0)
    .to('.wrap', { scaleY: .78, scaleX: 1.18, duration: .12, ease: 'power2.out' }, .55)
    .to('.wrap', { scaleY: 1, scaleX: 1, duration: .7, ease: 'elastic.out(1,.35)' }, .67)
    .fromTo('.glow', { scale: .4, opacity: 0 }, { scale: 1, opacity: 1, duration: .6, ease: 'expo.out', immediateRender: true }, .55)
    // glitch ghosts split at the impact
    .fromTo('.ghost.a', { x: 0, opacity: 0 }, { x: -22, opacity: 1, duration: .05, immediateRender: false }, .58)
    .fromTo('.ghost.b', { x: 0, opacity: 0 }, { x: 22, opacity: 1, duration: .05, immediateRender: false }, .58)
    .to('.ghost', { x: 0, opacity: 0, duration: .3, ease: 'expo.out' }, .68)
    // eyes blink and glance
    .to('.eye', { scaleY: .1, duration: .08, ease: 'power2.in' }, 1.4).to('.eye', { scaleY: 1, duration: .12, ease: 'power2.out' }, 1.5)
    .to('.eye', { x: 4, duration: .3, ease: 'power2.inOut' }, 1.8)
    .to('.eye', { x: -4, duration: .3, ease: 'power2.inOut' }, 2.3)
    .to('.eye', { x: 0, duration: .3, ease: 'power2.inOut' }, 2.8)
    .to('.eye', { scaleY: .1, duration: .08, ease: 'power2.in' }, 3.1).to('.eye', { scaleY: 1, duration: .12, ease: 'power2.out' }, 3.2)
    // head tilt like a nod
    .to('.wrap', { rotation: -5, duration: .4, ease: 'power2.inOut' }, 1.8)
    .to('.wrap', { rotation: 4, duration: .5, ease: 'power2.inOut' }, 2.3)
    .to('.wrap', { rotation: 0, duration: .4, ease: 'power2.inOut' }, 2.9)
    // UI
    .from('.badge', { scale: 0, duration: .5, ease: 'back.out(3)' }, .9)
    .to('.badge i', { opacity: .3, duration: .35, yoyo: true, repeat: 7, ease: 'sine.inOut' }, .9)
    .from('.chat div', { x: -40, opacity: 0, duration: .5, stagger: .35, ease: 'expo.out' }, 1.2)
    // exit: bubble jumps up and out
    .to('.wrap', { scaleY: .85, scaleX: 1.1, duration: .15, ease: 'power2.in' }, 3.45)
    .to('.wrap', { y: -560, scaleY: 1.15, scaleX: .9, duration: .4, ease: 'power3.in' }, 3.6)
    .to('.glow', { opacity: 0, scale: .5, duration: .4 }, 3.6)
    .to('.badge, .chat div', { opacity: 0, y: 20, duration: .3, stagger: .04 }, 3.6);
</script>
