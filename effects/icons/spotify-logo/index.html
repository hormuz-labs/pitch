<!doctype html><meta charset="utf-8">
<title>Spotify Logo</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#121212}
  .wrap{position:absolute;left:50%;top:46%;width:440px;height:440px;margin:-220px 0 0 -220px}
  .disc{position:absolute;inset:0;border-radius:50%;background:#1ed760;box-shadow:0 30px 100px rgba(30,215,96,.35);will-change:transform}
  .disc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .w{fill:none;stroke:#121212;stroke-linecap:round}
  .w1{stroke-width:11}.w2{stroke-width:10}.w3{stroke-width:9}
  .ripple{position:absolute;inset:0;border-radius:50%;border:5px solid #1ed760;opacity:0;will-change:transform,opacity}
  .eq{position:absolute;left:50%;top:790px;transform:translateX(-50%);display:flex;gap:10px;align-items:flex-end;height:90px}
  .eq b{display:block;width:16px;height:90px;border-radius:8px;background:#1ed760;transform-origin:50% 100%;will-change:transform}
  .title{position:absolute;left:50%;top:910px;transform:translateX(-50%);font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:54px;color:#fff;letter-spacing:-.02em;white-space:nowrap;overflow:hidden}
  .title span{display:inline-block;will-change:transform}
  .note{position:absolute;left:50%;top:46%;font-size:60px;color:#1ed760;opacity:0;will-change:transform,opacity;font-family:"Atlas Grotesk",sans-serif}
</style>
<div class="stage">
  <div class="wrap">
    <div class="ripple r1"></div><div class="ripple r2"></div><div class="ripple r3"></div>
    <div class="disc">
      <svg viewBox="0 0 100 100">
        <path class="w w1" d="M26 38 C42 33 62 34 78 42"/>
        <path class="w w2" d="M29 51 C43 47 59 48 72 54"/>
        <path class="w w3" d="M32 63 C43 60 56 61 66 66"/>
      </svg>
    </div>
  </div>
  <div class="note n1">♪</div><div class="note n2">♫</div><div class="note n3">♪</div>
  <div class="eq" id="eq"></div>
  <div class="title" id="tt"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const eq = document.getElementById('eq'), bars = [];
  for (let i = 0; i < 11; i++) { const b = document.createElement('b'); eq.appendChild(b); bars.push(b); }
  const tt = document.getElementById('tt');
  'Now playing'.split('').forEach(c => { const s = document.createElement('span'); s.innerHTML = c === ' ' ? '&nbsp;' : c; tt.appendChild(s); });
  const rng = fx.rng(9);
  const tl = fx.timeline({ duration: 3 });
  // disc drops in with a spin and bounce, the three sound waves draw on in sequence
  tl.from('.disc', { scale: 0, rotation: -120, duration: .8, ease: 'back.out(1.5)' }, 0)
    .fromTo('.w1', { drawSVG: '0%' }, { drawSVG: '100%', duration: .4, ease: 'power3.out', immediateRender: true }, .5)
    .fromTo('.w2', { drawSVG: '0%' }, { drawSVG: '100%', duration: .4, ease: 'power3.out', immediateRender: true }, .62)
    .fromTo('.w3', { drawSVG: '0%' }, { drawSVG: '100%', duration: .4, ease: 'power3.out', immediateRender: true }, .74)
    // pulse to the beat, ripples fly out
    .to('.disc', { scale: 1.08, duration: .12, ease: 'power2.out' }, 1.2)
    .to('.disc', { scale: 1, duration: .5, ease: 'elastic.out(1,.4)' }, 1.32)
    .to('.disc', { scale: 1.08, duration: .12, ease: 'power2.out' }, 1.8)
    .to('.disc', { scale: 1, duration: .5, ease: 'elastic.out(1,.4)' }, 1.92)
    .fromTo('.r1', { scale: 1, opacity: .8 }, { scale: 1.7, opacity: 0, duration: .9, ease: 'expo.out', immediateRender: false }, 1.2)
    .fromTo('.r2', { scale: 1, opacity: .8 }, { scale: 1.7, opacity: 0, duration: .9, ease: 'expo.out', immediateRender: false }, 1.8)
    .fromTo('.r3', { scale: 1, opacity: .6 }, { scale: 1.5, opacity: 0, duration: .8, ease: 'expo.out', immediateRender: false }, .8)
    .from('#tt span', { yPercent: 110, duration: .5, stagger: .03, ease: 'expo.out' }, .9);
  // waves bounce with the beat
  [1.2, 1.8].forEach(t => tl.to('.w', { y: -3, duration: .1, stagger: .04, ease: 'power2.out' }, t).to('.w', { y: 0, duration: .4, stagger: .04, ease: 'elastic.out(1,.4)' }, t + .1));
  // equalizer
  bars.forEach((b, i) => {
    gsap.set(b, { scaleY: .15 });
    tl.to(b, { scaleY: .2 + rng() * .8, duration: .25, ease: 'sine.inOut' }, .6 + i * .03);
    for (let k = 1; k < 9; k++) tl.to(b, { scaleY: .15 + rng() * .85, duration: .25, ease: 'sine.inOut' }, .6 + k * .25 + i * .03);
    tl.to(b, { scaleY: .15, duration: .25, ease: 'power2.in' }, 2.7);
  });
  // notes float up
  [['.n1', -180, 1.25], ['.n2', 200, 1.5], ['.n3', -60, 1.85]].forEach(([s, x, t]) => tl.fromTo(s, { x: x, y: 40, opacity: 0, rotation: -10 }, { y: -320, opacity: 1, rotation: 12, duration: .9, ease: 'power2.out', immediateRender: false }, t).to(s, { opacity: 0, duration: .3 }, t + .7));
  // exit
  tl.to('#tt span', { yPercent: -110, duration: .3, stagger: .02, ease: 'power3.in' }, 2.55)
    .to('.disc', { scale: 0, rotation: 90, duration: .4, ease: 'back.in(1.5)' }, 2.6);
</script>
