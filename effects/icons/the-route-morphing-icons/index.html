<!doctype html><meta charset="utf-8">
<title>The Route: Morphing Icons</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f6f1e8}
  svg.route{position:absolute;inset:0;width:100%;height:100%}
  .track{fill:none;stroke:#d9d0c2;stroke-width:6;stroke-dasharray:2 16;stroke-linecap:round}
  .ink{fill:none;stroke:#1a1a1a;stroke-width:6;stroke-linecap:round}
  .stop{fill:#f6f1e8;stroke:#1a1a1a;stroke-width:5}
  .stop.lit{fill:#1a1a1a}
  .rider{will-change:transform}
  .rider .disc{fill:#ff5a36}
  .rider .ico{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
  .lbl{position:absolute;font-family:"Atlas Grotesk",sans-serif;font-size:22px;color:#6b6157;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;will-change:transform,opacity}
  .title{position:absolute;left:80px;top:60px;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:54px;letter-spacing:-.02em;color:#1a1a1a;overflow:hidden}
  .title span{display:inline-block;will-change:transform}
</style>
<div class="stage">
  <svg class="route" viewBox="0 0 1280 720">
    <path id="pth" class="track" d="M120 560 C 260 560 260 300 400 300 S 560 520 700 520 S 840 200 980 200 S 1160 460 1160 460"/>
    <path id="ink" class="ink" d="M120 560 C 260 560 260 300 400 300 S 560 520 700 520 S 840 200 980 200 S 1160 460 1160 460"/>
    <g id="stops"></g>
    <g class="rider" id="rider">
      <circle class="disc" r="44"/>
      <path class="ico" id="ico" d="M-22 4 L0 -18 L22 4 L22 20 L-22 20 Z"/>
    </g>
  </svg>
  <div class="title" id="tt"></div>
  <div class="lbl" style="left:80px;top:600px">Home</div>
  <div class="lbl" style="left:360px;top:340px">Search</div>
  <div class="lbl" style="left:660px;top:560px">Saved</div>
  <div class="lbl" style="left:940px;top:240px">Alerts</div>
  <div class="lbl" style="left:1120px;top:500px">Settings</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../../assets/gsap/MorphSVGPlugin.min.js"></script>
<script src="../../../assets/gsap/MotionPathPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin, MorphSVGPlugin, MotionPathPlugin);
  const tt = document.getElementById('tt');
  'One route, five icons'.split('').forEach(c => { const s = document.createElement('span'); s.innerHTML = c === ' ' ? '&nbsp;' : c; tt.appendChild(s); });
  const shapes = {
    home: 'M-22 4 L0 -18 L22 4 L22 20 L-22 20 Z',
    search: 'M-8 -8 m-12 0 a12 12 0 1 0 24 0 a12 12 0 1 0 -24 0 M1 1 L20 20',
    heart: 'M0 20 C-20 6 -26 -2 -26 -10 C-26 -17 -20 -22 -14 -22 C-8 -22 -3 -18 0 -13 C3 -18 8 -22 14 -22 C20 -22 26 -17 26 -10 C26 -2 20 6 0 20 Z',
    bell: 'M-18 10 L18 10 L14 4 L14 -8 A14 14 0 0 0 -14 -8 L-14 4 Z M-6 16 A6 6 0 0 0 6 16',
    gear: 'M0 -22 L6 -18 L14 -18 L18 -10 L22 -4 L22 4 L18 10 L14 18 L6 18 L0 22 L-6 18 L-14 18 L-18 10 L-22 4 L-22 -4 L-18 -10 L-14 -18 L-6 -18 Z M0 -8 A8 8 0 1 0 0 8 A8 8 0 1 0 0 -8',
  };
  const order = ['home', 'search', 'heart', 'bell', 'gear'];
  const stopsG = document.getElementById('stops');
  const pathEl = document.getElementById('pth');
  const L = pathEl.getTotalLength();
  const stopsP = [0, .25, .5, .75, 1];
  const stopEls = stopsP.map(p => {
    const pt = pathEl.getPointAtLength(p * L);
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('class', 'stop'); c.setAttribute('r', 12); c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y);
    stopsG.appendChild(c); return c;
  });
  const D = 10;
  const tl = fx.timeline({ duration: D });
  tl.from('#tt span', { yPercent: 110, duration: .6, stagger: .02, ease: 'expo.out' }, 0)
    .from('.lbl', { y: 14, opacity: 0, duration: .5, stagger: .1, ease: 'power3.out' }, .3)
    .fromTo('#ink', { drawSVG: '0%' }, { drawSVG: '100%', duration: 8.2, ease: 'none', immediateRender: true }, .6)
    .fromTo('#rider', { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: .5, ease: 'back.out(2)', immediateRender: true }, .3)
    .to('#rider', { motionPath: { path: '#pth', align: '#pth', alignOrigin: [.5, .5] }, duration: 8.2, ease: 'none' }, .6);
  // at each stop: the icon morphs into the next one, the stop lights, the rider bumps
  order.forEach((k, i) => {
    if (i === 0) return;
    const t = .6 + 8.2 * stopsP[i] - .35;
    tl.to('#ico', { morphSVG: shapes[k], duration: .6, ease: 'power2.inOut' }, t)
      .to('#rider .disc', { attr: { r: 54 }, duration: .2, ease: 'power2.out' }, t + .1)
      .to('#rider .disc', { attr: { r: 44 }, duration: .5, ease: 'elastic.out(1,.45)' }, t + .3)
      .to(stopEls[i], { fill: '#1a1a1a', duration: .2 }, t + .3);
  });
  tl.to(stopEls[0], { fill: '#1a1a1a', duration: .2 }, .6);
  // wrap: rider shrinks, ink erases, icon returns to home, stops reset
  tl.to('#rider', { scale: 0, duration: .35, ease: 'back.in(2)' }, 9.0)
    .to('#ink', { drawSVG: '100% 100%', duration: .7, ease: 'power3.inOut' }, 9.1)
    .to(stopEls, { fill: '#f6f1e8', duration: .3, stagger: .05 }, 9.2)
    .set('#ico', { morphSVG: shapes.home }, 9.6);
</script>
