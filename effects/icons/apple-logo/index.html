<!doctype html><meta charset="utf-8">
<title>Apple Logo</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f5f5f7;display:flex;align-items:center;justify-content:center}
  .logo{width:320px;height:360px;overflow:visible}
  .body{fill:#1d1d1f}
  .leaf{fill:#1d1d1f;transform-origin:160px 110px;transform-box:view-box}
  .bite{fill:#f5f5f7}
  .shine{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:.5}
</style>
<div class="stage">
  <svg class="logo" viewBox="0 0 320 360">
    <g class="fruit">
      <path class="body" d="M160,130 C120,95 40,120 40,210 C40,285 90,350 130,350 C150,350 155,340 160,340 C165,340 170,350 190,350 C230,350 280,285 280,210 C280,120 200,95 160,130 Z"/>
      <circle class="bite" cx="300" cy="185" r="52"/>
      <path class="shine" d="M75,175 C70,200 72,230 84,262"/>
    </g>
    <path class="leaf" d="M160,112 C160,60 195,30 230,30 C232,80 200,112 160,112 Z"/>
  </svg>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 3 });
  // minimal: the fruit fades up, the bite is taken, the leaf unfurls, a breath, then out
  tl.from('.fruit',{opacity:0,scale:.92,transformOrigin:'50% 60%',duration:.9,ease:'expo.out'},0)
    .from('.bite',{x:90,duration:.6,ease:'expo.out'},.45)
    .from('.leaf',{scale:0,rotation:-60,opacity:0,duration:.7,ease:'back.out(2)'},.7)
    .fromTo('.shine',{drawSVG:'0%'},{drawSVG:'100%',duration:.5,ease:'power2.out'},1)
    .to('.logo',{scale:1.03,duration:1.1,ease:'sine.inOut',yoyo:true,repeat:1},1.1)
    .to('.leaf',{rotation:4,duration:.8,ease:'sine.inOut',yoyo:true,repeat:1},1.2)
    .to('.logo',{opacity:0,scale:.95,duration:.35,ease:'power2.in'},2.65);
</script>
