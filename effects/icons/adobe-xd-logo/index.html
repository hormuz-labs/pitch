<!doctype html><meta charset="utf-8">
<title>XD Logo</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#1b0516;display:flex;align-items:center;justify-content:center;perspective:1200px}
  .tile{position:relative;width:300px;height:300px;border-radius:56px;background:#470137;box-shadow:0 30px 80px rgba(255,97,246,.22);transform-style:preserve-3d;will-change:transform}
  .tile svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .x{fill:none;stroke:#ff61f6;stroke-width:26;stroke-linecap:round}
  .d{font-family:"Atlas Grotesk",sans-serif;font-weight:500;font-size:150px;fill:#ff61f6}
  .art{position:absolute;width:150px;height:110px;border-radius:14px;border:2px solid rgba(255,97,246,.5);background:rgba(255,97,246,.06)}
  .art i{position:absolute;left:14px;right:14px;height:8px;border-radius:4px;background:rgba(255,97,246,.35)}
  .art.a{left:250px;top:200px}.art.b{left:880px;top:410px}
  .wire{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .wire path{fill:none;stroke:#ff61f6;stroke-width:3;stroke-dasharray:8 8}
  .wire circle{fill:#ff61f6}
</style>
<div class="stage">
  <div class="art a"><i style="top:16px;width:50%"></i><i style="top:36px"></i><i style="top:56px"></i><i style="top:82px;width:40%;background:#ff61f6"></i></div>
  <div class="art b"><i style="top:16px;width:60%"></i><i style="top:36px"></i><i style="top:56px;width:70%"></i></div>
  <svg class="wire" viewBox="0 0 1280 720">
    <path class="w1" d="M400,290 C500,290 460,360 640,360"/>
    <path class="w2" d="M640,360 C820,360 780,465 880,465"/>
    <circle class="c1" cx="400" cy="290" r="7"/><circle class="c2" cx="880" cy="465" r="7"/>
  </svg>
  <div class="tile">
    <svg viewBox="0 0 300 300">
      <path class="x x1" d="M62,90 L142,210"/>
      <path class="x x2" d="M142,90 L62,210"/>
      <text class="d" x="160" y="204">d</text>
    </svg>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 4 });
  // tile turns in on the Y axis, the X draws, the d slides in
  tl.from('.tile',{rotationY:-95,x:-80,opacity:0,duration:1,ease:'expo.out'},0)
    .fromTo('.x1',{drawSVG:'0%'},{drawSVG:'100%',duration:.5,ease:'power3.out'},.55)
    .fromTo('.x2',{drawSVG:'100% 100%'},{drawSVG:'0% 100%',duration:.5,ease:'power3.out'},.7)
    .from('.d',{x:60,opacity:0,duration:.6,ease:'expo.out'},.95)
    // prototype wires connect artboards through the tile
    .from('.art',{scale:.6,opacity:0,duration:.7,stagger:.15,ease:'back.out(1.8)'},1.2)
    .from('.c1',{scale:0,transformOrigin:'50% 50%',duration:.3,ease:'back.out(3)'},1.5)
    .fromTo('.w1',{drawSVG:'0%'},{drawSVG:'100%',duration:.6,ease:'power2.inOut'},1.6)
    .fromTo('.w2',{drawSVG:'0%'},{drawSVG:'100%',duration:.6,ease:'power2.inOut'},2.15)
    .from('.c2',{scale:0,transformOrigin:'50% 50%',duration:.3,ease:'back.out(3)'},2.7)
    .to('.tile',{rotationY:14,rotationX:-6,duration:1.6,ease:'sine.inOut'},1.4)
    // exit: turn out the other way
    .to('.wire path',{drawSVG:'100% 100%',duration:.4,ease:'power2.in'},3.25)
    .to('.wire circle, .art',{opacity:0,scale:.6,duration:.35,ease:'power2.in'},3.35)
    .to('.tile',{rotationY:95,x:80,opacity:0,duration:.5,ease:'power3.in'},3.45);
</script>
