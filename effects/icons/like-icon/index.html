<!doctype html><meta charset="utf-8">
<title>Like Icon</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f3f4f8}
  .btn{position:absolute;left:50%;top:50%;width:440px;height:150px;transform:translate(-50%,-50%);border-radius:75px;background:#fff;box-shadow:0 20px 60px rgba(20,30,60,.12);display:flex;align-items:center;gap:26px;padding:0 44px;will-change:transform;border:3px solid #fff}
  .ico{width:80px;height:80px;position:relative;transform-origin:35% 85%;will-change:transform}
  .ico svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .ol{fill:none;stroke:#1f2540;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
  .fl{fill:#2f6bff}
  .txt{font-family:"Atlas Grotesk",sans-serif;font-weight:500;font-size:48px;color:#1f2540;letter-spacing:-.01em;position:relative;height:56px;line-height:56px;overflow:hidden;width:220px}
  .txt span{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform,opacity}
  .txt .on{color:#2f6bff}
  .halo{position:absolute;left:50%;top:50%;width:150px;height:150px;border-radius:50%;background:#2f6bff;opacity:0;transform:translate(-50%,-50%);will-change:transform,opacity}
  .bit{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:4px;background:#2f6bff;opacity:0;will-change:transform,opacity}
</style>
<div class="stage">
  <div class="halo"></div>
  <div id="bits"></div>
  <div class="btn">
    <div class="ico">
      <svg viewBox="0 0 24 24">
        <defs><clipPath id="lc"><rect id="lcr" x="0" y="24" width="24" height="24"/></clipPath></defs>
        <path class="fl" clip-path="url(#lc)" d="M2 10h4v11H2zM7 10.5l4.2-7.4A2 2 0 0 1 14.9 4.6L14 9h5.2a2.5 2.5 0 0 1 2.4 3.1l-1.8 7.2A2.5 2.5 0 0 1 17.4 21H7z"/>
        <path class="ol" d="M2 10h4v11H2zM7 10.5l4.2-7.4A2 2 0 0 1 14.9 4.6L14 9h5.2a2.5 2.5 0 0 1 2.4 3.1l-1.8 7.2A2.5 2.5 0 0 1 17.4 21H7z"/>
      </svg>
    </div>
    <div class="txt"><span class="off">Like</span><span class="on">Liked</span></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const bits = document.getElementById('bits'), B = [];
  for (let i = 0; i < 8; i++) { const b = document.createElement('div'); b.className = 'bit'; bits.appendChild(b); B.push(b); }
  const rng = fx.rng(3);
  gsap.set('.txt .on', { yPercent: 110, opacity: 0 });
  const tl = fx.timeline({ duration: 3 });
  // press
  tl.to('.btn', { scale: .94, duration: .18, ease: 'power2.in' }, .5)
    .to('.btn', { scale: 1, duration: .6, ease: 'elastic.out(1,.5)' }, .68)
    .to('.btn', { borderColor: '#2f6bff', boxShadow: '0 20px 60px rgba(47,107,255,.28)', duration: .4 }, .68)
    // thumb tips back and fills up from the base, then springs
    .to('.ico', { rotation: -28, scale: .9, duration: .18, ease: 'power2.in' }, .5)
    .to('.ico', { rotation: 0, scale: 1.18, duration: .35, ease: 'back.out(3)' }, .68)
    .to('.ico', { scale: 1, duration: .5, ease: 'elastic.out(1,.4)' }, 1.03)
    .to('#lcr', { attr: { y: 0 }, duration: .45, ease: 'power3.out' }, .68)
    .to('.ol', { stroke: '#2f6bff', duration: .3 }, .75)
    // label swaps
    .to('.txt .off', { yPercent: -110, opacity: 0, duration: .3, ease: 'power3.in' }, .68)
    .to('.txt .on', { yPercent: 0, opacity: 1, duration: .45, ease: 'expo.out' }, .85)
    // halo + bits
    .fromTo('.halo', { scale: .4, opacity: .35 }, { scale: 4.5, opacity: 0, duration: .9, ease: 'expo.out' }, .7);
  B.forEach((b, i) => {
    const a = (i / B.length) * Math.PI * 2 + .2, r = 170 + rng() * 60;
    tl.fromTo(b, { x: -110, y: 0, opacity: 1, scale: .5, rotation: 0 }, { x: -110 + Math.cos(a) * r, y: Math.sin(a) * r, scale: 1, rotation: 180, duration: .7, ease: 'move' }, .72)
      .to(b, { opacity: 0, duration: .3 }, 1.15);
  });
  // release back to idle for the loop
  tl.to('#lcr', { attr: { y: 24 }, duration: .35, ease: 'power2.in' }, 2.35)
    .to('.ol', { stroke: '#1f2540', duration: .3 }, 2.45)
    .to('.btn', { borderColor: '#fff', boxShadow: '0 20px 60px rgba(20,30,60,.12)', duration: .4 }, 2.4)
    .to('.txt .on', { yPercent: 110, opacity: 0, duration: .3, ease: 'power3.in' }, 2.35)
    .to('.txt .off', { yPercent: 0, opacity: 1, duration: .4, ease: 'expo.out' }, 2.55)
    .to('.ico', { scale: .92, duration: .15, ease: 'power2.in' }, 2.4)
    .to('.ico', { scale: 1, duration: .35, ease: 'back.out(2)' }, 2.55);
</script>
