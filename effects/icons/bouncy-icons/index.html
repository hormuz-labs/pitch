<!doctype html><meta charset="utf-8">
<title>Bouncy Icons</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f2f3f7;display:flex;align-items:center;justify-content:center}
  .grid{display:grid;grid-template-columns:repeat(4,140px);gap:56px 64px}
  .app{width:140px;height:140px;border-radius:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(20,24,40,.14);will-change:transform;transform-origin:50% 100%}
  .app svg{width:70px;height:70px;fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .shadow{position:absolute;left:50%;bottom:-24px;width:100px;height:14px;border-radius:50%;background:rgba(20,24,40,.18);transform:translateX(-50%);filter:blur(4px)}
  .cell{position:relative}
</style>
<div class="stage">
  <div class="grid">
    <div class="cell"><div class="shadow"></div><div class="app" style="background:#ff5a5f"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg></div></div>
    <div class="cell"><div class="shadow"></div><div class="app" style="background:#2f80ed"><svg viewBox="0 0 24 24"><path d="M4 6h16v10H8l-4 4z"/></svg></div></div>
    <div class="cell"><div class="shadow"></div><div class="app" style="background:#27ae60"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></div></div>
    <div class="cell"><div class="shadow"></div><div class="app" style="background:#f2994a"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg></div></div>
    <div class="cell"><div class="shadow"></div><div class="app" style="background:#9b51e0"><svg viewBox="0 0 24 24"><path d="M9 18V6l10 3v9"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="18" r="2.5"/></svg></div></div>
    <div class="cell"><div class="shadow"></div><div class="app" style="background:#1d1d1f"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M10 10v10"/></svg></div></div>
    <div class="cell"><div class="shadow"></div><div class="app" style="background:#00b4d8"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9c4 0 7 3 7 3M21 12a9 9 0 0 1-9 9c-4 0-7-3-7-3"/><path d="M16 3h3v3M8 21H5v-3"/></svg></div></div>
    <div class="cell"><div class="shadow"></div><div class="app" style="background:#eb5757"><svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg></div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/CustomEase.min.js"></script>
<script src="../../../assets/gsap/CustomBounce.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(CustomEase, CustomBounce);
  CustomBounce.create('drop', { strength: 0.55, squash: 3 });
  const tl = fx.timeline({ duration: 4 });
  const apps = gsap.utils.toArray('.app');
  apps.forEach((el, i) => {
    const t = 0.1 + i * 0.13;
    // each icon drops from above and bounces to rest, squashing on impact
    tl.from(el, { y: -520, duration: 1.1, ease: 'drop' }, t)
      .to(el, { scaleX: 1.25, scaleY: 0.75, duration: 1.1, ease: 'drop-squash' }, t)
      .from(el.previousElementSibling, { scaleX: 0.2, opacity: 0, duration: 1.1, ease: 'drop' }, t);
  });
  // a springy wiggle once everyone has landed
  tl.to(apps, { rotation: 6, duration: .35, stagger: .05, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2.15)
    // exit: spring up and out
    .to(apps, { y: -40, scaleY: 1.1, scaleX: .9, duration: .18, stagger: .05, ease: 'move' }, 3.15)
    .to(apps, { y: -600, duration: .35, stagger: .05, ease: 'power3.in' }, 3.33)
    .to('.shadow', { opacity: 0, scaleX: .2, duration: .3, stagger: .05 }, 3.3);
</script>
