<!doctype html><meta charset="utf-8">
<title>Dislike Icon</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#fff;display:flex;align-items:center;justify-content:center;gap:120px}
  .pill{display:flex;align-items:center;gap:22px;padding:22px 44px;border-radius:999px;border:2px solid #e6e8ee;background:#fff;will-change:transform}
  .ico{width:84px;height:84px;position:relative}
  .ico svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .thumb{fill:none;stroke:#4a4f5c;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
  .thumbf{fill:#ff4d5e;transform-origin:50% 50%;transform-box:fill-box}
  .count{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:52px;color:#4a4f5c;letter-spacing:-.02em;width:110px;overflow:hidden;height:64px;position:relative}
  .count span{position:absolute;left:0;top:0;line-height:64px}
  .ripple{position:absolute;inset:0;border-radius:50%;border:4px solid #ff4d5e;opacity:0}
  .sad{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
  .sad circle{fill:#ff4d5e}
</style>
<div class="stage">
  <div class="pill">
    <div class="ico">
      <div class="ripple"></div>
      <svg class="sad" viewBox="0 0 84 84"></svg>
      <svg viewBox="0 0 24 24">
        <path class="thumbf" d="M17 2H20a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3zM17 13V3H8.5a2 2 0 0 0-1.9 1.4l-2.5 8A2 2 0 0 0 6 15h5v5a2 2 0 0 0 2 2l4-9z"/>
        <path class="thumb" d="M17 2H20a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3zM17 13V3H8.5a2 2 0 0 0-1.9 1.4l-2.5 8A2 2 0 0 0 6 15h5v5a2 2 0 0 0 2 2l4-9z"/>
      </svg>
    </div>
    <div class="count"><span class="n0">128</span><span class="n1">129</span></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const sad=document.querySelector('.sad');
  for(let k=0;k<6;k++){const a=Math.PI/2+ (k-2.5)*0.45;sad.insertAdjacentHTML('beforeend',`<circle cx="42" cy="42" r="${3+(k%2)*1.5}" data-dx="${(Math.cos(a)*44).toFixed(1)}" data-dy="${(Math.sin(a)*44).toFixed(1)}"/>`);}
  const tl = fx.timeline({ duration: 3 });
  gsap.set('.thumbf',{scale:0});
  gsap.set('.n1',{yPercent:100});
  gsap.set('.sad circle',{opacity:0});
  // idle state, then press: thumb tips down, fills red, drops droplets, the count ticks
  tl.from('.pill',{y:40,opacity:0,duration:.7,ease:'expo.out'},0)
    .to('.ico',{scale:.82,duration:.15,ease:'power2.in'},.9)
    .to('.ico',{scale:1,rotation:-18,duration:.6,ease:'elastic.out(1,.4)'},1.05)
    .to('.thumbf',{scale:1,duration:.4,ease:'back.out(2)'},1.05)
    .to('.thumb',{stroke:'#ff4d5e',duration:.3},1.05)
    .fromTo('.ripple',{scale:.6,opacity:.9},{scale:1.9,opacity:0,duration:.6,ease:'power2.out'},1.05)
    .to('.pill',{borderColor:'#ffd0d5',backgroundColor:'#fff5f6',duration:.4},1.05)
    .to('.n0',{yPercent:-100,duration:.4,ease:'power3.inOut'},1.1)
    .to('.n1',{yPercent:0,duration:.4,ease:'power3.inOut'},1.1)
    .to('.count',{color:'#ff4d5e',duration:.3},1.1);
  gsap.utils.toArray('.sad circle').forEach((c,i)=>{
    tl.fromTo(c,{x:0,y:0,opacity:1},{x:+c.dataset.dx,y:+c.dataset.dy,opacity:0,duration:.6,ease:'power2.out'},1.1+i*.03);
  });
  tl.to('.ico',{rotation:0,duration:.6,ease:'power2.inOut'},2.0)
    .to('.pill',{y:-30,opacity:0,duration:.35,ease:'power3.in'},2.6);
</script>
