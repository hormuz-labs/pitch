<!doctype html><meta charset="utf-8">
<title>Heart Icon</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#fff5f7}
  .glow{position:absolute;left:50%;top:50%;width:900px;height:900px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,64,110,.28),rgba(255,64,110,0) 65%);will-change:transform}
  .wrap{position:absolute;left:50%;top:50%;width:360px;height:360px;transform:translate(-50%,-50%)}
  .heart{position:absolute;inset:0;transform-origin:50% 55%;will-change:transform}
  .heart svg{width:100%;height:100%;overflow:visible}
  .outline{fill:none;stroke:#2a1a20;stroke-width:16;stroke-linejoin:round}
  .fill{fill:#ff3b6b}
  .ring{position:absolute;left:50%;top:50%;width:360px;height:360px;border-radius:50%;border:26px solid #ff8fa8;transform:translate(-50%,-50%) scale(.3);opacity:0;will-change:transform,opacity}
  .particles{position:absolute;left:50%;top:50%;width:0;height:0}
  .p{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:#ff3b6b;opacity:0;will-change:transform,opacity}
  .p:nth-child(2n){background:#ffb703;width:12px;height:12px}
  .p:nth-child(3n){background:#7c5cff;width:10px;height:10px}
  .cursor{position:absolute;left:640px;top:720px;width:70px;height:70px;will-change:transform}
  .cursor svg{width:100%;height:100%;filter:drop-shadow(0 8px 12px rgba(0,0,0,.25))}
  .label{position:absolute;left:50%;top:800px;transform:translateX(-50%);font-family:"Atlas Grotesk",sans-serif;font-weight:500;font-size:44px;color:#2a1a20;letter-spacing:-.01em;white-space:nowrap}
  .count{display:inline-block;overflow:hidden;height:52px;vertical-align:bottom;line-height:52px}
  .count span{display:block}
</style>
<div class="stage">
  <div class="glow"></div>
  <div class="ring"></div>
  <div class="particles" id="pp"></div>
  <div class="wrap">
    <div class="heart">
      <svg viewBox="0 0 100 100">
        <defs><clipPath id="hc"><rect id="hcr" x="0" y="100" width="100" height="100"/></clipPath></defs>
        <path class="outline" d="M50 88 C20 66 8 52 8 34 C8 20 19 10 31 10 C40 10 46 15 50 22 C54 15 60 10 69 10 C81 10 92 20 92 34 C92 52 80 66 50 88 Z"/>
        <path class="fill" clip-path="url(#hc)" d="M50 88 C20 66 8 52 8 34 C8 20 19 10 31 10 C40 10 46 15 50 22 C54 15 60 10 69 10 C81 10 92 20 92 34 C92 52 80 66 50 88 Z"/>
      </svg>
    </div>
  </div>
  <div class="label"><span class="count"><span id="cnt">1,204</span></span>&nbsp;likes</div>
  <div class="cursor"><svg viewBox="0 0 24 24"><path d="M9 11V6a2 2 0 1 1 4 0v5.5l3.2-.6a2 2 0 0 1 2.3 2.4l-1.4 5.3A3 3 0 0 1 14.2 21H10a3 3 0 0 1-2.4-1.2L4 15l1.5-1.5L9 15.5Z" fill="#fff" stroke="#2a1a20" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const rng = fx.rng(7);
  const pp = document.getElementById('pp');
  const N = 18, dots = [];
  for (let i = 0; i < N; i++) { const d = document.createElement('div'); d.className = 'p'; pp.appendChild(d); dots.push(d); }
  const tl = fx.timeline({ duration: 3 });
  // idle breath
  tl.fromTo('.glow', { scale: .9 }, { scale: 1.05, duration: 1.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  // finger comes in and presses
  tl.from('.cursor', { x: 260, y: 220, opacity: 0, duration: .55, ease: 'move' }, 0)
    .to('.cursor', { x: -40, y: -60, duration: .35, ease: 'power2.inOut' }, .55)
    .to('.cursor', { scale: .85, duration: .12, ease: 'power2.in' }, .9)
    .to('.cursor', { scale: 1, duration: .25, ease: 'back.out(3)' }, 1.02)
    .to('.cursor', { x: 120, y: 180, opacity: 0, duration: .5, ease: 'power2.in' }, 1.6);
  // heart: squash on press, then burst on release
  tl.to('.heart', { scale: .8, duration: .12, ease: 'power2.in' }, .9)
    .to('.heart', { scale: 1.28, duration: .28, ease: 'back.out(4)' }, 1.02)
    .to('.heart', { scale: 1, duration: .5, ease: 'elastic.out(1,.4)' }, 1.3)
    .to('#hcr', { attr: { y: 0 }, duration: .32, ease: 'power3.out' }, 1.02)
    .to('.outline', { stroke: '#ff3b6b', duration: .2 }, 1.02)
    .fromTo('.ring', { xPercent: -50, yPercent: -50, scale: .3, opacity: 1, borderWidth: 26 }, { xPercent: -50, yPercent: -50, scale: 1.9, opacity: 0, borderWidth: 2, duration: .7, ease: 'move', immediateRender: false }, 1.02);
  dots.forEach((d, i) => {
    const a = (i / N) * Math.PI * 2 + rng() * .3, r = 260 + rng() * 140;
    tl.fromTo(d, { x: 0, y: 0, opacity: 1, scale: .4 }, { x: Math.cos(a) * r, y: Math.sin(a) * r, scale: 1, duration: .8, ease: 'move' }, 1.06)
      .to(d, { opacity: 0, y: '+=40', duration: .35, ease: 'power1.in' }, 1.5);
  });
  // counter ticks up
  tl.to('#cnt', { yPercent: -100, duration: .15, ease: 'power2.in', onStart() {}, }, 1.05)
    .set('#cnt', { textContent: '1,205', yPercent: 100 }, 1.2)
    .to('#cnt', { yPercent: 0, duration: .25, ease: 'back.out(2)' }, 1.2)
    .to('.label', { color: '#ff3b6b', duration: .2 }, 1.05);
  // un-like to loop cleanly
  tl.to('#hcr', { attr: { y: 100 }, duration: .3, ease: 'power2.in' }, 2.55)
    .to('.outline', { stroke: '#2a1a20', duration: .25 }, 2.6)
    .to('.heart', { scale: .9, duration: .15, ease: 'power2.in' }, 2.55)
    .to('.heart', { scale: 1, duration: .25, ease: 'back.out(2)' }, 2.7)
    .to('#cnt', { yPercent: 100, duration: .15, ease: 'power2.in' }, 2.6)
    .set('#cnt', { textContent: '1,204', yPercent: -100 }, 2.75)
    .to('#cnt', { yPercent: 0, duration: .2, ease: 'power2.out' }, 2.75)
    .to('.label', { color: '#2a1a20', duration: .2 }, 2.6);
</script>
