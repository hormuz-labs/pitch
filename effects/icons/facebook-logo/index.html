<!doctype html><meta charset="utf-8">
<title>Facebook Logo</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f0f2f5;display:flex;align-items:center;justify-content:center}
  .badge{position:relative;width:260px;height:260px;border-radius:50%;background:#1877f2;box-shadow:0 30px 80px rgba(24,119,242,.3);overflow:hidden;will-change:transform}
  .badge svg{position:absolute;inset:0;width:100%;height:100%}
  .f{fill:none;stroke:#fff;stroke-width:34;stroke-linecap:butt}
  .f2{stroke-width:42}
  .rings{position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px 0 0 -130px;pointer-events:none}
  .rings i{position:absolute;inset:0;border-radius:50%;border:3px solid #1877f2;opacity:0}
  .bubble{position:absolute;width:120px;height:120px;border-radius:50%;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:44px;will-change:transform}
</style>
<div class="stage">
  <div class="rings"><i></i><i></i><i></i></div>
  <div class="bubble b1" style="left:330px;top:150px">👍</div>
  <div class="bubble b2" style="left:840px;top:420px">💬</div>
  <div class="badge">
    <svg viewBox="0 0 260 260">
      <path class="f stem" d="M150,290 L150,120 C150,80 170,66 210,66"/>
      <path class="f f2 bar" d="M105,148 L200,148"/>
    </svg>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 3 });
  // the disc pops in, the f draws in two strokes, rings ripple out, reaction bubbles float in
  tl.from('.badge',{scale:0,duration:.7,ease:'back.out(1.7)'},0)
    .fromTo('.stem',{drawSVG:'0%'},{drawSVG:'100%',duration:.6,ease:'power3.out'},.35)
    .fromTo('.bar',{drawSVG:'50% 50%'},{drawSVG:'0% 100%',duration:.4,ease:'power3.out'},.75)
    .fromTo('.rings i',{scale:1,opacity:.7},{scale:2.4,opacity:0,duration:1.2,stagger:.2,ease:'power2.out'},.7)
    .from('.b1',{scale:0,y:60,duration:.7,ease:'back.out(2)'},1)
    .from('.b2',{scale:0,y:60,duration:.7,ease:'back.out(2)'},1.15)
    .to('.b1',{y:-14,duration:.8,ease:'sine.inOut',yoyo:true,repeat:1},1.6)
    .to('.b2',{y:-10,duration:.7,ease:'sine.inOut',yoyo:true,repeat:1},1.7)
    // exit
    .to('.bubble',{scale:0,duration:.3,stagger:.06,ease:'back.in(2)'},2.45)
    .to('.badge',{scale:0,duration:.4,ease:'back.in(1.7)'},2.55);
</script>
