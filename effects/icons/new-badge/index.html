<!doctype html><meta charset="utf-8">
<title>New Badge</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0f1117}
  .panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:840px;padding:56px 64px;border-radius:32px;background:#171a23;border:1px solid rgba(255,255,255,.08);box-shadow:0 40px 120px rgba(0,0,0,.5)}
  .row{display:flex;align-items:center;gap:22px}
  .row h1{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:60px;color:#fff;letter-spacing:-.02em;white-space:nowrap;overflow:hidden}
  .row h1 span{display:inline-block;will-change:transform,opacity}
  .badge{position:relative;height:56px;padding:0 20px;border-radius:14px;background:#6c5cff;color:#fff;font-family:"Atlas Grotesk",sans-serif;font-weight:500;font-size:26px;letter-spacing:.14em;display:flex;align-items:center;overflow:hidden;transform-origin:0 50%;will-change:transform;box-shadow:0 10px 30px rgba(108,92,255,.4)}
  .badge .cover{position:absolute;inset:0;background:#fff;transform-origin:100% 50%;will-change:transform}
  .badge .txt{position:relative;display:flex;gap:2px}
  .badge .txt i{font-style:normal;display:inline-block;will-change:transform,opacity}
  .badge .shine{position:absolute;top:-30%;left:-40%;width:40%;height:160%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.6),rgba(255,255,255,0));transform:rotate(18deg);will-change:transform}
  .badge .ring{position:absolute;inset:-4px;border-radius:18px;border:3px solid #a99cff;opacity:0}
  p{margin-top:22px;font-family:"Atlas Grotesk",sans-serif;font-size:26px;line-height:1.45;color:rgba(255,255,255,.6);max-width:640px;will-change:transform,opacity}
  .lines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
  .lines b{position:absolute;left:50%;top:50%;width:3px;height:70px;background:#a99cff;border-radius:2px;opacity:0;will-change:transform,opacity}
</style>
<div class="stage">
  <div class="panel">
    <div class="row">
      <h1 id="h"></h1>
      <div class="badge"><div class="txt" id="bt"></div><div class="shine"></div><div class="cover"></div><div class="ring"></div></div>
    </div>
    <p>Smart layouts arrange your blocks automatically so every board looks finished the moment you drop something in.</p>
  </div>
  <div class="lines" id="ln"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const h = document.getElementById('h');
  'Smart layouts'.split('').forEach(c => { const s = document.createElement('span'); s.innerHTML = c === ' ' ? '&nbsp;' : c; h.appendChild(s); });
  const bt = document.getElementById('bt');
  'NEW'.split('').forEach(c => { const i = document.createElement('i'); i.textContent = c; bt.appendChild(i); });
  const ln = document.getElementById('ln'), L = [];
  for (let k = 0; k < 8; k++) { const b = document.createElement('b'); ln.appendChild(b); L.push(b); }
  const tl = fx.timeline({ duration: 4 });
  tl.from('.panel', { y: 40, opacity: 0, duration: .7, ease: 'expo.out' }, 0)
    .from('#h span', { yPercent: 100, opacity: 0, duration: .55, stagger: .025, ease: 'expo.out' }, .15)
    .from('p', { y: 20, opacity: 0, duration: .6, ease: 'power3.out' }, .5)
    // badge: confident wipe in — white cover slides off, letters follow
    .from('.badge', { scaleX: 0, duration: .5, ease: 'expo.out' }, .7)
    .fromTo('.badge .cover', { scaleX: 1 }, { scaleX: 0, duration: .45, ease: 'expo.inOut', immediateRender: false }, .95)
    .from('.badge .txt i', { yPercent: 120, duration: .45, stagger: .06, ease: 'back.out(2)' }, 1.05)
    .fromTo('.badge', { rotation: -6 }, { rotation: 0, duration: .6, ease: 'elastic.out(1,.5)', immediateRender: false }, 1.2)
    .fromTo('.badge .shine', { xPercent: -50 }, { xPercent: 400, duration: .6, ease: 'power2.inOut', immediateRender: false }, 1.45)
    .fromTo('.badge .ring', { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.5, duration: .6, ease: 'expo.out', immediateRender: false }, 1.2);
  // radial burst lines around the badge
  const bx = 640 + 190, by = 360 - 90;
  L.forEach((b, k) => {
    const a = (k / L.length) * Math.PI * 2;
    tl.fromTo(b, { x: bx - 640, y: by - 360, rotation: a * 180 / Math.PI + 90, scaleY: 0, opacity: 1 },
      { x: bx - 640 + Math.cos(a) * 130, y: by - 360 + Math.sin(a) * 130, scaleY: 1, opacity: 0, duration: .7, ease: 'expo.out', immediateRender: false }, 1.15);
  });
  // subtle idle pulse then exit
  tl.to('.badge', { scale: 1.06, duration: .35, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2.4)
    .to('.badge', { scaleX: 0, duration: .3, ease: 'expo.in' }, 3.4)
    .to('#h span', { yPercent: -100, opacity: 0, duration: .3, stagger: .015, ease: 'power3.in' }, 3.45)
    .to('p', { opacity: 0, y: -10, duration: .3 }, 3.5)
    .to('.panel', { opacity: 0, y: -30, duration: .3, ease: 'power3.in' }, 3.65);
</script>
