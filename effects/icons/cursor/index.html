<!doctype html><meta charset="utf-8">
<title>Cursor</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101216}
  .card{position:absolute;left:390px;top:200px;width:500px;height:320px;border-radius:24px;background:#1a1d24;border:1px solid #2a2e38;padding:36px}
  .card .t{width:55%;height:16px;border-radius:8px;background:#3a3f4c}
  .card .l{height:10px;border-radius:5px;background:#2c303a;margin-top:16px}
  .btn{position:absolute;left:36px;bottom:36px;width:170px;height:52px;border-radius:12px;background:#4f7cff;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;will-change:transform}
  .tog{position:absolute;right:36px;bottom:36px;width:72px;height:40px;border-radius:20px;background:#3a3f4c}
  .tog i{position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:#fff}
  .trail{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .trail circle{fill:#4f7cff}
  .cur{position:absolute;left:0;top:0;width:40px;height:40px;will-change:transform}
  .cur svg{width:40px;height:40px;overflow:visible}
  .arrow{fill:#fff;stroke:#101216;stroke-width:1.5;stroke-linejoin:round}
  .click{position:absolute;left:0;top:0;width:60px;height:60px;border-radius:50%;border:3px solid #4f7cff;margin:-30px 0 0 -30px;opacity:0}
</style>
<div class="stage">
  <div class="card">
    <div class="t"></div><div class="l" style="width:85%"></div><div class="l" style="width:70%"></div>
    <div class="btn">Continue</div>
    <div class="tog"><i></i></div>
  </div>
  <svg class="trail" viewBox="0 0 1280 720"></svg>
  <div class="click"></div>
  <div class="cur"><svg viewBox="0 0 24 24"><path class="arrow" d="M3,2 L3,19 L7.5,15 L11,22 L14,20.5 L10.5,13.5 L16,13 Z"/></svg></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 2 });
  const N=10, trail=document.querySelector('.trail');
  for(let i=0;i<N;i++) trail.insertAdjacentHTML('beforeend',`<circle r="${(9-i*0.8).toFixed(1)}" opacity="${(0.5-i*0.045).toFixed(2)}"/>`);
  const dots=gsap.utils.toArray('.trail circle');
  // the cursor's path: enter, glide to the button, click, swing over to the toggle, click, leave
  const pts=[{x:150,y:600,t:0},{x:470,y:470,t:.55},{x:500,y:462,t:.75},{x:830,y:520,t:1.35},{x:822,y:508,t:1.5},{x:1150,y:120,t:2}];
  const px=gsap.timeline();
  for(let i=1;i<pts.length;i++) px.to('.cur',{x:pts[i].x,y:pts[i].y,duration:pts[i].t-pts[i-1].t,ease:i===2||i===4?'sine.inOut':'power2.inOut'},pts[i-1].t);
  gsap.set('.cur',{x:pts[0].x,y:pts[0].y});
  tl.add(px,0);
  // trail: each dot lags the cursor by a few frames along the same path
  dots.forEach((d,i)=>{
    const lag=(i+1)*0.035;
    const sub=gsap.timeline();
    gsap.set(d,{attr:{cx:pts[0].x,cy:pts[0].y}});
    for(let k=1;k<pts.length;k++) sub.to(d,{attr:{cx:pts[k].x+4,cy:pts[k].y+6},duration:pts[k].t-pts[k-1].t,ease:k===2||k===4?'sine.inOut':'power2.inOut'},pts[k-1].t);
    tl.add(sub,lag);
  });
  // click states
  const click=(t,x,y,target)=>{
    tl.to('.cur svg',{scale:.8,duration:.08,transformOrigin:'0 0'},t).to('.cur svg',{scale:1,duration:.15,ease:'back.out(3)'},t+.08)
      .fromTo('.click',{x,y,scale:.3,opacity:.9},{scale:1.6,opacity:0,duration:.45,ease:'power2.out'},t)
      .to(target,{scale:.93,duration:.08,transformOrigin:'50% 50%'},t).to(target,{scale:1,duration:.3,ease:'elastic.out(1,.5)'},t+.08);
  };
  click(.75,500,462,'.btn');
  click(1.5,822,508,'.tog');
  tl.to('.tog i',{x:32,duration:.25,ease:'power3.out'},1.5).to('.tog',{backgroundColor:'#22c55e',duration:.25},1.5)
    .from('.card',{opacity:0,y:20,duration:.5,ease:'expo.out'},0)
    .to('.card',{opacity:0,duration:.25},1.75);
</script>
