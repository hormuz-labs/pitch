<!doctype html><meta charset="utf-8">
<title>5 Stars: Pop</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#fff7e6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
  .stars{display:flex;gap:30px}
  .star{width:110px;height:110px;position:relative}
  .star svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .star .fill{fill:#ff9f1c;transform-origin:center;transform-box:fill-box}
  .burst line{stroke:#ff6b35;stroke-width:5;stroke-linecap:round}
  .burst circle{fill:#ffd166}
  .label{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:40px;color:#2b1d0e;letter-spacing:-.02em}
</style>
<div class="stage">
  <div class="stars"></div>
  <div class="label">“Absolutely loved it.”</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const P='M0,-40 L11.8,-12.4 L38,-12.4 L17,4.7 L23.5,32.4 L0,16 L-23.5,32.4 L-17,4.7 L-38,-12.4 L-11.8,-12.4 Z';
  const wrap=document.querySelector('.stars');
  for(let i=0;i<5;i++){
    let rays='';
    for(let k=0;k<8;k++){const a=k*Math.PI/4+Math.PI/8;const c=Math.cos(a),s=Math.sin(a);
      rays+=`<line class="ray" x1="${(c*30).toFixed(1)}" y1="${(s*30).toFixed(1)}" x2="${(c*44).toFixed(1)}" y2="${(s*44).toFixed(1)}"/>`;
      rays+=`<circle class="dot" cx="${(c*36).toFixed(1)}" cy="${(s*36).toFixed(1)}" r="4"/>`;}
    wrap.insertAdjacentHTML('beforeend',`<div class="star"><svg class="burst" viewBox="-55 -55 110 110">${rays}</svg><svg viewBox="-55 -55 110 110"><path class="fill" d="${P}"/></svg></div>`);
  }
  const tl = fx.timeline({ duration: 3 });
  const stars=gsap.utils.toArray('.star');
  stars.forEach((st,i)=>{
    const t=0.15+i*0.18;
    tl.fromTo(st.querySelector('.fill'),{scale:0,rotation:-40},{scale:1,rotation:0,duration:.6,ease:'elastic.out(1,0.45)'},t)
      // burst: rays shoot out and fade, dots fly further
      .fromTo(st.querySelectorAll('.ray'),{scale:0,transformOrigin:'0 0',opacity:1},{scale:1.6,opacity:0,duration:.5,ease:'power3.out'},t)
      .fromTo(st.querySelectorAll('.dot'),{scale:.3,transformOrigin:'0 0',opacity:1},{scale:2.2,opacity:0,duration:.55,ease:'power2.out'},t+.03);
  });
  tl.from('.label',{y:30,opacity:0,duration:.6,ease:'expo.out'},1.15)
    // exit: pop out in reverse
    .to('.star .fill',{scale:0,duration:.25,stagger:{each:.06,from:'end'},ease:'back.in(2)'},2.4)
    .to('.label',{y:-20,opacity:0,duration:.3,ease:'power2.in'},2.5);
</script>
