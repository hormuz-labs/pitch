<!doctype html><meta charset="utf-8">
<title>Premiere Pro Logo</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#120818;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px}
  .tile{position:relative;width:300px;height:300px;border-radius:56px;background:#2a0038;box-shadow:0 30px 80px rgba(234,119,255,.22);display:flex;align-items:center;justify-content:center;font-family:"Atlas Grotesk",sans-serif;font-weight:500;font-size:150px;color:#ea77ff;letter-spacing:-.04em;line-height:1;will-change:clip-path}
  .head{position:absolute;top:150px;left:50%;width:3px;height:420px;margin-left:-1.5px;background:#fff;box-shadow:0 0 18px #fff;border-radius:2px}
  .head::before{content:"";position:absolute;top:-14px;left:-9px;border:10px solid transparent;border-top:14px solid #fff}
  .track{position:relative;width:820px;height:60px;border-radius:12px;background:#1d0f26;overflow:hidden}
  .clip{position:absolute;top:8px;height:44px;border-radius:8px;will-change:transform}
  .ruler{width:820px;display:flex;justify-content:space-between;font-size:14px;color:#6b5a76;margin-top:-34px;letter-spacing:.06em}
</style>
<div class="stage">
  <div class="tile">Pr</div>
  <div class="track">
    <div class="clip" style="left:0;width:220px;background:#ea77ff"></div>
    <div class="clip" style="left:228px;width:300px;background:#8e4bd6"></div>
    <div class="clip" style="left:536px;width:284px;background:#c85cf0"></div>
  </div>
  <div class="ruler"><span>00:00</span><span>00:04</span><span>00:08</span><span>00:12</span></div>
  <div class="head"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  gsap.set('.head',{x:-410});
  // the playhead scrubs across; the tile is revealed behind it, edge locked to the playhead
  tl.from('.track',{scaleX:0,transformOrigin:'0 50%',duration:.7,ease:'expo.out'},0)
    .from('.ruler span',{opacity:0,y:8,stagger:.06,duration:.4},.2)
    .from('.head',{opacity:0,duration:.3},.1)
    .to('.head',{x:410,duration:2,ease:'power2.inOut'},.35)
    .fromTo('.tile',{clipPath:'inset(0 100% 0 0 round 56px)'},{clipPath:'inset(0 0% 0 0 round 56px)',duration:2,ease:'power2.inOut'},.35)
    .from('.clip',{xPercent:-120,duration:.8,stagger:.5,ease:'expo.out'},.5)
    .fromTo('.tile',{scale:.96},{scale:1,duration:.6,ease:'elastic.out(1,.5)'},2.3)
    // exit: scrub back, everything folds away
    .to('.head',{x:-410,duration:.55,ease:'power3.in'},3.2)
    .to('.tile',{clipPath:'inset(0 100% 0 0 round 56px)',duration:.55,ease:'power3.in'},3.2)
    .to('.clip',{xPercent:-120,duration:.4,stagger:.06,ease:'power3.in'},3.3)
    .to('.track, .ruler',{opacity:0,duration:.3},3.6);
</script>
