<!doctype html><meta charset="utf-8">
<title>5 Stars: Move Up</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0e0f12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
  .glow{position:absolute;left:50%;top:50%;width:900px;height:500px;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(255,200,61,.18),rgba(255,200,61,0) 60%)}
  .stars{display:flex;gap:26px;height:120px;overflow:hidden;padding:0 20px}
  .star{width:96px;height:120px;display:flex;align-items:center;justify-content:center;will-change:transform}
  .star svg{width:96px;height:96px;overflow:visible}
  .star .out{fill:none;stroke:#5a5340;stroke-width:4;stroke-linejoin:round}
  .star .fill{fill:#ffc83d;transform-origin:center;transform-box:fill-box}
  .meta{display:flex;align-items:baseline;gap:18px;overflow:hidden;height:70px;padding:0 10px}
  .score{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:60px;color:#fff;letter-spacing:-.03em;line-height:1}
  .count{font-size:24px;color:#9a9a9a;line-height:1}
</style>
<div class="stage">
  <div class="glow"></div>
  <div class="stars"></div>
  <div class="meta"><span class="score">4.9</span><span class="count">from 2,314 reviews</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const P='M0,-40 L11.8,-12.4 L38,-12.4 L17,4.7 L23.5,32.4 L0,16 L-23.5,32.4 L-17,4.7 L-38,-12.4 L-11.8,-12.4 Z';
  const wrap=document.querySelector('.stars');
  for(let i=0;i<5;i++){
    wrap.insertAdjacentHTML('beforeend',`<div class="star"><svg viewBox="-48 -48 96 96"><path class="fill" d="${P}"/><path class="out" d="${P}"/></svg></div>`);
  }
  const tl = fx.timeline({ duration: 3 });
  tl.from('.glow',{opacity:0,scale:.6,duration:1.2,ease:'power2.out'},0)
    // stars rise into frame from below, staggered, with a soft settle
    .from('.star',{y:150,rotation:-12,duration:.8,stagger:.1,ease:'back.out(1.6)'},0)
    // fills sweep on after each lands
    .from('.star .fill',{scale:0,duration:.45,stagger:.1,ease:'back.out(2.2)'},.42)
    .from('.star .out',{stroke:'#ffc83d',duration:.3,stagger:.1},.42)
    .from('.score',{y:80,duration:.7,ease:'expo.out'},.75)
    .from('.count',{y:80,duration:.7,ease:'expo.out'},.85)
    // exit: keep rising, out the top
    .to('.star',{y:-160,duration:.45,stagger:.06,ease:'power3.in'},2.35)
    .to('.score, .count',{y:-90,duration:.4,stagger:.05,ease:'power3.in'},2.5)
    .to('.glow',{opacity:0,duration:.3},2.7);
</script>
