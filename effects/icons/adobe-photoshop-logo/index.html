<!doctype html><meta charset="utf-8">
<title>Photoshop Logo</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#04101c;display:flex;align-items:center;justify-content:center}
  .layers{position:absolute;left:50%;top:50%;width:300px;height:300px;transform:translate(-50%,-50%)}
  .layer{position:absolute;inset:0;border-radius:56px;border:3px solid rgba(49,168,255,.6);background:rgba(0,30,54,.5);will-change:transform}
  .tile{position:relative;width:300px;height:300px;border-radius:56px;background:#001e36;box-shadow:0 30px 80px rgba(49,168,255,.25);overflow:hidden}
  .tile svg{position:absolute;inset:0;width:100%;height:100%}
  .brush{fill:none;stroke:#fff;stroke-width:90;stroke-linecap:round;stroke-linejoin:round}
  .ltr{font-family:"Atlas Grotesk",sans-serif;font-weight:500;font-size:150px;fill:#31a8ff;letter-spacing:-6px}
  .swatch{position:absolute;bottom:0;left:0;width:100%;height:100%;pointer-events:none}
  .swatch div{position:absolute;width:56px;height:56px;border-radius:14px;will-change:transform}
</style>
<div class="stage">
  <div class="layers">
    <div class="layer l1"></div><div class="layer l2"></div><div class="layer l3"></div>
  </div>
  <div class="tile">
    <svg viewBox="0 0 300 300">
      <defs>
        <mask id="m"><path class="brush" d="M30,80 L270,80 L30,150 L270,150 L30,222 L270,222"/></mask>
      </defs>
      <g mask="url(#m)"><text class="ltr" x="150" y="204" text-anchor="middle">Ps</text></g>
    </svg>
  </div>
  <div class="swatch">
    <div style="background:#31a8ff;left:770px;top:180px"></div>
    <div style="background:#ff61f6;left:820px;top:250px"></div>
    <div style="background:#ffd23f;left:440px;top:460px"></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 4 });
  // layers stack in from three directions, then collapse into the tile
  tl.from('.l1',{x:-420,y:-140,rotation:-18,opacity:0,duration:.8,ease:'move'},0)
    .from('.l2',{x:420,y:-60,rotation:14,opacity:0,duration:.8,ease:'move'},.12)
    .from('.l3',{y:300,rotation:-6,opacity:0,duration:.8,ease:'move'},.24)
    .fromTo('.l1',{scale:1.35},{scale:1,duration:.5,ease:'expo.inOut'},.9)
    .fromTo('.l2',{scale:1.22},{scale:1,duration:.5,ease:'expo.inOut'},.95)
    .fromTo('.l3',{scale:1.1},{scale:1,duration:.5,ease:'expo.inOut'},1)
    .from('.tile',{opacity:0,scale:.9,duration:.4,ease:'power2.out'},1.2)
    .to('.layer',{opacity:0,duration:.3},1.3)
    // one brush stroke paints the letters on
    .fromTo('.brush',{drawSVG:'0%'},{drawSVG:'100%',duration:1.1,ease:'power2.inOut'},1.45)
    .from('.swatch div',{scale:0,rotation:90,duration:.6,stagger:.12,ease:'back.out(2)'},1.7)
    .to('.swatch div',{y:-14,duration:.9,stagger:.1,ease:'sine.inOut',yoyo:true,repeat:1},2.3)
    // exit
    .to('.tile',{scale:.7,opacity:0,duration:.4,ease:'power3.in'},3.55)
    .to('.swatch div',{scale:0,duration:.3,stagger:.05,ease:'back.in(2)'},3.5);
</script>
