<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hero Headline Property Fade & Reveal</title>
  <meta name="fx" content="w=1280 h=720">
  <link rel="stylesheet" href="../../_lib/base.css">
  <style>
    .stage {
      background: #08090c;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Sharp Grotesk", "Atlas Grotesk", -apple-system, sans-serif;
      color: #fff;
    }
    .grid-lines {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none;
    }
    .radial-glow {
      position: absolute;
      width: 700px;
      height: 400px;
      background: radial-gradient(ellipse at center, rgba(80, 140, 255, 0.18), transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .badge-wrap {
      margin-bottom: 24px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-family: "Atlas Grotesk", sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9ab4ff;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4f87ff;
      box-shadow: 0 0 10px #4f87ff;
    }
    .headline-wrap {
      position: relative;
      text-align: center;
      max-width: 1040px;
      margin: 0 auto;
    }
    .headline {
      font-size: 96px;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.04em;
      margin: 0;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 20%, #a4b2c9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      margin-top: 28px;
      font-family: "Atlas Grotesk", sans-serif;
      font-size: 22px;
      font-weight: 400;
      line-height: 1.5;
      color: #838e9e;
      letter-spacing: -0.01em;
      max-width: 680px;
      text-align: center;
    }
    .spec-row {
      display: flex;
      gap: 32px;
      margin-top: 40px;
    }
    .spec-item {
      font-family: "Atlas Grotesk", sans-serif;
      font-size: 14px;
      color: #636d7d;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .spec-val {
      color: #e2e8f0;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="grid-lines" id="grid"></div>
    <div class="radial-glow" id="glow"></div>
    <div class="badge-wrap">
      <div class="badge" id="badge">
        <span class="badge-dot"></span>
        <span>Version 4.0 Release</span>
      </div>
    </div>
    <div class="headline-wrap">
      <h1 class="headline" id="headline">Engineered For Zero Latency</h1>
    </div>
    <p class="subtitle" id="subtitle">The next-generation distributed platform architected for real-time intelligence at global scale.</p>
    <div class="spec-row" id="specs">
      <div class="spec-item">Architecture: <span class="spec-val">Distributed</span></div>
      <div class="spec-item">P99 Latency: <span class="spec-val">1.2ms</span></div>
      <div class="spec-item">Throughput: <span class="spec-val">10M req/sec</span></div>
    </div>
  </div>

  <script src="../../_lib/anim.js"></script>
  <script src="../../_lib/fx.js"></script>
  <script>
    const D = 4;
    const badge = document.getElementById('badge');
    const headline = document.getElementById('headline');
    const subtitle = document.getElementById('subtitle');
    const specs = document.getElementById('specs');
    const glow = document.getElementById('glow');
    const grid = document.getElementById('grid');

    fx.register({
      duration: D,
      seek(t) {
        // Multi-point keyframes: 0 -> entry (0.8s) -> hold (2.4s) -> exit (0.8s)
        const badgeOpacity = anim.interpolate(t, [0, 0.4, 3.4, 3.8], [0, 1, 1, 0], { extrapolateLeft: 'clamp', extrapolateRight: 'clamp' });
        const badgeY = anim.interpolate(t, [0, 0.5, 3.3, 3.8], [16, 0, 0, -12], {
          easing: anim.Easing.bezier(0.16, 1, 0.3, 1),
          extrapolateLeft: 'clamp',
          extrapolateRight: 'clamp',
        });
        badge.style.opacity = badgeOpacity;
        badge.style.transform = `translateY(${badgeY}px)`;

        // Headline property animation: opacity, blur filter, tracking, and vertical motion
        const headOpacity = anim.interpolate(t, [0.15, 0.85, 3.2, 3.7], [0, 1, 1, 0], { extrapolateLeft: 'clamp', extrapolateRight: 'clamp' });
        const headBlur = anim.interpolate(t, [0.15, 0.8, 3.2, 3.7], [18, 0, 0, 10], { extrapolateLeft: 'clamp', extrapolateRight: 'clamp' });
        const headTracking = anim.interpolate(t, [0.15, 1.2, 3.0, 3.8], [-0.08, -0.04, -0.04, 0.01], {
          easing: anim.Easing.out(anim.Easing.cubic),
          extrapolateLeft: 'clamp',
          extrapolateRight: 'clamp',
        });
        const headY = anim.interpolate(t, [0.15, 0.85, 3.2, 3.7], [36, 0, 0, -24], {
          easing: anim.Easing.bezier(0.16, 1, 0.3, 1),
          extrapolateLeft: 'clamp',
          extrapolateRight: 'clamp',
        });
        headline.style.opacity = headOpacity;
        headline.style.filter = `blur(${headBlur}px)`;
        headline.style.letterSpacing = `${headTracking}em`;
        headline.style.transform = `translateY(${headY}px)`;

        // Subtitle interpolation
        const subOpacity = anim.interpolate(t, [0.35, 0.95, 3.1, 3.6], [0, 1, 1, 0], { extrapolateLeft: 'clamp', extrapolateRight: 'clamp' });
        const subY = anim.interpolate(t, [0.35, 1.0, 3.1, 3.6], [24, 0, 0, -16], {
          easing: anim.Easing.out(anim.Easing.quad),
          extrapolateLeft: 'clamp',
          extrapolateRight: 'clamp',
        });
        subtitle.style.opacity = subOpacity;
        subtitle.style.transform = `translateY(${subY}px)`;

        // Specs bar
        const specOpacity = anim.interpolate(t, [0.55, 1.1, 3.0, 3.5], [0, 1, 1, 0], { extrapolateLeft: 'clamp', extrapolateRight: 'clamp' });
        specs.style.opacity = specOpacity;

        // Background glow & grid motion
        const glowScale = anim.interpolate(t, [0, 2.0, 4.0], [0.85, 1.15, 0.9], {
          output: 'perceptual-scale',
          easing: anim.Easing.inOut(anim.Easing.sin),
        });
        const glowOpacity = anim.interpolate(t, [0, 1.2, 3.0, 4.0], [0.1, 0.28, 0.28, 0], { extrapolateLeft: 'clamp', extrapolateRight: 'clamp' });
        glow.style.transform = `translate(-50%, -50%) scale(${glowScale})`;
        glow.style.opacity = glowOpacity;

        const gridOpacity = anim.interpolate(t, [0, 0.8, 3.2, 4.0], [0.05, 0.25, 0.25, 0], { extrapolateLeft: 'clamp', extrapolateRight: 'clamp' });
        grid.style.opacity = gridOpacity;
      }
    });
  </script>
</body>
</html>
