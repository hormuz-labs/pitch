<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kinetic Typography Speed Skew & Spring Punch</title>
  <meta name="fx" content="w=1280 h=720">
  <link rel="stylesheet" href="../../_lib/base.css">
  <style>
    .stage {
      background: #08080a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Sharp Grotesk", "Atlas Grotesk", sans-serif;
      color: #fff;
      overflow: hidden;
      position: relative;
    }
    .flash-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.15), transparent 70%);
      pointer-events: none;
      opacity: 0;
    }
    .stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .mask-row {
      overflow: hidden;
      padding: 4px 20px;
      line-height: 0.9;
    }
    .word {
      display: block;
      font-size: 136px;
      font-weight: 700;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      will-change: transform, opacity;
      transform-origin: center bottom;
    }
    .word-1 {
      color: #ffffff;
    }
    .word-2 {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .word-3 {
      color: #ffffff;
    }
    .sub-bar {
      margin-top: 36px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: "Atlas Grotesk", sans-serif;
      font-size: 14px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #71717a;
    }
    .sub-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffd700;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="flash-bg" id="flash"></div>
    <div class="stack">
      <div class="mask-row"><span class="word word-1" id="w1">FASTER.</span></div>
      <div class="mask-row"><span class="word word-2" id="w2">SMARTER.</span></div>
      <div class="mask-row"><span class="word word-3" id="w3">UNSTOPPABLE.</span></div>
    </div>
    <div class="sub-bar" id="subBar">
      <span>Performance Reimagined</span>
      <span class="sub-dot"></span>
      <span>Engine v4.0</span>
    </div>
  </div>

  <script src="../../_lib/anim.js"></script>
  <script src="../../_lib/fx.js"></script>
  <script>
    const D = 3.5;
    const FPS = 60;
    const w1 = document.getElementById('w1');
    const w2 = document.getElementById('w2');
    const w3 = document.getElementById('w3');
    const flash = document.getElementById('flash');
    const subBar = document.getElementById('subBar');

    fx.register({
      duration: D,
      fps: FPS,
      seek(t) {
        const frame = t * FPS;

        // Word 1: slams down at 0.15s (frame 9)
        // Word 2: slams in from right at 0.45s (frame 27)
        // Word 3: zooms up with spring punch at 0.75s (frame 45)

        // Word 1 Spring
        const s1 = anim.spring({
          frame,
          fps: FPS,
          from: 0,
          to: 1,
          delay: 8,
          config: { stiffness: 180, damping: 14, mass: 0.8 },
        });
        const y1 = 140 * (1 - s1);
        const skew1 = -16 * (1 - s1);
        const op1 = anim.interpolate(frame - 8, [0, 8], [0, 1], { extrapolateLeft: 'clamp', extrapolateRight: 'clamp' });

        // Word 2 Spring
        const s2 = anim.spring({
          frame,
          fps: FPS,
          from: 0,
          to: 1,
          delay: 24,
          config: { stiffness: 190, damping: 13, mass: 0.85 },
        });
        const x2 = 200 * (1 - s2);
        const skew2 = 18 * (1 - s2);
        const op2 = anim.interpolate(frame - 24, [0, 8], [0, 1], { extrapolateLeft: 'clamp', extrapolateRight: 'clamp' });

        // Word 3 Spring
        const s3 = anim.spring({
          frame,
          fps: FPS,
          from: 0,
          to: 1,
          delay: 40,
          config: { stiffness: 160, damping: 11, mass: 1 },
        });
        const y3 = 160 * (1 - s3);
        const scale3 = 0.6 + 0.4 * s3;
        const op3 = anim.interpolate(frame - 40, [0, 8], [0, 1], { extrapolateLeft: 'clamp', extrapolateRight: 'clamp' });

        // Exit snap at t >= 2.8s
        const exitY = anim.interpolate(t, [2.8, 3.3], [0, -180], {
          easing: anim.Easing.bezier(0.7, 0, 0.84, 0),
          extrapolateLeft: 'clamp',
          extrapolateRight: 'clamp',
        });
        const exitOp = anim.interpolate(t, [2.8, 3.2], [1, 0], { extrapolateLeft: 'clamp', extrapolateRight: 'clamp' });

        w1.style.transform = `translateY(${y1 + exitY}px) skewX(${skew1}deg)`;
        w1.style.opacity = op1 * exitOp;

        w2.style.transform = `translate(${x2}px, ${exitY}px) skewX(${skew2}deg)`;
        w2.style.opacity = op2 * exitOp;

        w3.style.transform = `translateY(${y3 + exitY}px) scale(${scale3})`;
        w3.style.opacity = op3 * exitOp;

        // Flash pulse on impact of Word 3 (around frame 44 - 58)
        const flashVal = anim.interpolate(frame, [40, 46, 62], [0, 0.9, 0], {
          extrapolateLeft: 'clamp',
          extrapolateRight: 'clamp',
        });
        flash.style.opacity = flashVal;

        // Sub bar fade
        const subOp = anim.interpolate(t, [1.0, 1.4, 2.7, 3.1], [0, 1, 1, 0], {
          extrapolateLeft: 'clamp',
          extrapolateRight: 'clamp',
        });
        subBar.style.opacity = subOp;
      }
    });
  </script>
</body>
</html>
