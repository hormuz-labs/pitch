<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3D Hardware Device Turn with Three.js</title>
  <meta name="fx" content="w=1280 h=720">
  <link rel="stylesheet" href="../../_lib/base.css">
  <style>
    .stage {
      background: radial-gradient(circle at 50% 35%, #181d29 0%, #06080d 85%);
      position: relative;
      overflow: hidden;
      font-family: "Atlas Grotesk", -apple-system, sans-serif;
      color: #fff;
    }
    #three-canvas {
      position: absolute;
      inset: 0;
      width: 1280px;
      height: 720px;
      display: block;
    }
    .hud-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 64px;
      z-index: 10;
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .tag {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .device-title {
      font-family: "Sharp Grotesk", sans-serif;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #f8fafc;
      margin: 0;
    }
    .device-subtitle {
      font-size: 16px;
      color: #94a3b8;
      margin-top: 6px;
    }
    .hud-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .spec-group {
      display: flex;
      gap: 36px;
    }
    .spec-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .spec-label {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #64748b;
    }
    .spec-val {
      font-size: 18px;
      font-weight: 600;
      color: #e2e8f0;
    }
    .watermark {
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #475569;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "../../../assets/three/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <div class="stage">
    <canvas id="three-canvas" width="1280" height="720"></canvas>
    <div class="hud-overlay">
      <div class="hud-header" id="hudHead">
        <div>
          <div class="tag">Hardware Reveal</div>
          <h1 class="device-title">Titanium Edge Pro</h1>
          <div class="device-subtitle">Crafted with precision aerospace grade alloy and sapphire crystal display</div>
        </div>
        <div style="text-align: right;">
          <div style="font-size: 13px; color: #4ade80; font-weight: 600;">● Active Render</div>
          <div style="font-size: 12px; color: #64748b; margin-top: 4px;">60 FPS · Deterministic</div>
        </div>
      </div>
      <div class="hud-footer" id="hudFoot">
        <div class="spec-group">
          <div class="spec-item">
            <span class="spec-label">Chassis</span>
            <span class="spec-val">Grade 5 Titanium</span>
          </div>
          <div class="spec-item">
            <span class="spec-label">Display</span>
            <span class="spec-val">6.7" Super Retina XDR</span>
          </div>
          <div class="spec-item">
            <span class="spec-label">Weight</span>
            <span class="spec-val">187 Grams</span>
          </div>
        </div>
        <div class="watermark">Three.js WebGL Engine · Damped Spatial Motion</div>
      </div>
    </div>
  </div>

  <script src="../../_lib/anim.js"></script>
  <script src="../../_lib/fx.js"></script>
  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('three-canvas');
    const hudHead = document.getElementById('hudHead');
    const hudFoot = document.getElementById('hudFoot');

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      preserveDrawingBuffer: true,
    });
    renderer.setSize(1280, 720);
    renderer.setPixelRatio(1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, 1280 / 720, 0.1, 100);
    camera.position.set(0, 0, 8.5);

    // Dynamic Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0x38bdf8, 2.5);
    keyLight.position.set(5, 4, 6);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xa855f7, 3.0);
    rimLight.position.set(-6, -3, -4);
    scene.add(rimLight);

    const topLight = new THREE.DirectionalLight(0xffffff, 1.2);
    topLight.position.set(0, 6, 2);
    scene.add(topLight);

    // Build 3D Phone Chassis
    const phoneGroup = new THREE.Group();

    // Body chassis (Titanium)
    const bodyGeo = new THREE.BoxGeometry(2.8, 5.8, 0.28);
    const bodyMat = new THREE.MeshStandardMaterial({
      color: 0x1f242d,
      metalness: 0.85,
      roughness: 0.22,
    });
    const phoneBody = new THREE.Mesh(bodyGeo, bodyMat);
    phoneGroup.add(phoneBody);

    // Screen Bezel & Display
    const screenCanvas = document.createElement('canvas');
    screenCanvas.width = 512;
    screenCanvas.height = 1024;
    const ctx = screenCanvas.getContext('2d');

    function drawScreenContent(progress) {
      ctx.fillStyle = '#0b0f19';
      ctx.fillRect(0, 0, 512, 1024);

      // Gradient header
      const grad = ctx.createLinearGradient(0, 0, 512, 400);
      grad.addColorStop(0, '#2563eb');
      grad.addColorStop(1, '#7c3aed');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 280);

      // Status bar & Time
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 36px sans-serif';
      ctx.fillText('9:41', 40, 70);

      // Battery / Wifi icons
      ctx.fillRect(420, 48, 48, 24);

      // App Content
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 44px sans-serif';
      ctx.fillText('Next-Gen AI', 40, 200);
      ctx.font = '24px sans-serif';
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText('Global Consensus Verified', 40, 240);

      // Floating card on screen
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.fillRect(36, 320, 440, 200);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 32px sans-serif';
      ctx.fillText('Latency: 0.8ms', 60, 380);

      // Animated line chart on phone screen
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 6;
      ctx.beginPath();
      for (let i = 0; i < 400; i += 20) {
        const y = 460 + Math.sin((i / 40) + progress * 6) * 25;
        if (i === 0) ctx.moveTo(56 + i, y);
        else ctx.lineTo(56 + i, y);
      }
      ctx.stroke();
    }

    drawScreenContent(0);
    const screenTex = new THREE.CanvasTexture(screenCanvas);
    screenTex.minFilter = THREE.LinearFilter;

    const screenGeo = new THREE.PlaneGeometry(2.62, 5.58);
    const screenMat = new THREE.MeshBasicMaterial({
      map: screenTex,
    });
    const screenMesh = new THREE.Mesh(screenGeo, screenMat);
    screenMesh.position.z = 0.145;
    phoneGroup.add(screenMesh);

    // Camera bump on back
    const bumpGeo = new THREE.BoxGeometry(1.2, 1.2, 0.1);
    const bumpMat = new THREE.MeshStandardMaterial({
      color: 0x11151c,
      metalness: 0.9,
      roughness: 0.2,
    });
    const bump = new THREE.Mesh(bumpGeo, bumpMat);
    bump.position.set(-0.6, 2.0, -0.16);
    phoneGroup.add(bump);

    scene.add(phoneGroup);

    const D = 5;
    fx.register({
      duration: D,
      seek(t) {
        // Redraw dynamic screen texture
        drawScreenContent(t);
        screenTex.needsUpdate = true;

        // 3D trajectory: continuous spin + tilt + float
        const rotY = anim.interpolate(t, [0, 5.0], [-0.8, Math.PI * 2 - 0.8], {
          easing: anim.Easing.linear,
        });
        const rotX = anim.interpolate(t, [0, 1.8, 3.5, 5.0], [0.25, -0.2, 0.3, 0.25], {
          easing: anim.Easing.inOut(anim.Easing.sin),
        });
        const rotZ = anim.interpolate(t, [0, 2.5, 5.0], [-0.1, 0.1, -0.1], {
          easing: anim.Easing.inOut(anim.Easing.sin),
        });
        const floatY = anim.interpolate(t, [0, 2.5, 5.0], [-0.15, 0.2, -0.15], {
          easing: anim.Easing.inOut(anim.Easing.sin),
        });

        // Entrance scale
        const entranceScale = anim.interpolate(t, [0, 0.8], [0.75, 1.0], {
          easing: anim.Easing.bezier(0.16, 1, 0.3, 1),
          extrapolateLeft: 'clamp',
          extrapolateRight: 'clamp',
        });

        phoneGroup.rotation.set(rotX, rotY, rotZ);
        phoneGroup.position.set(0, floatY, 0);
        phoneGroup.scale.setScalar(entranceScale);

        // Render Three.js frame
        renderer.render(scene, camera);

        // Overlay HUD fade
        const hudOpacity = anim.interpolate(t, [0, 0.6, 4.2, 4.8], [0, 1, 1, 0], {
          extrapolateLeft: 'clamp',
          extrapolateRight: 'clamp',
        });
        hudHead.style.opacity = hudOpacity;
        hudFoot.style.opacity = hudOpacity;
      }
    });
  </script>
</body>
</html>
