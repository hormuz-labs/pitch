<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Perceptual Scale Camera Zoom</title>
  <meta name="fx" content="w=1280 h=720">
  <link rel="stylesheet" href="../../_lib/base.css">
  <style>
    .stage {
      background: #07080b;
      overflow: hidden;
      font-family: "Atlas Grotesk", -apple-system, sans-serif;
      color: #fff;
    }
    .viewport {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 50% 50%;
      will-change: transform;
    }
    .canvas-board {
      width: 1100px;
      height: 620px;
      background: #0f131a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
      position: relative;
      display: grid;
      grid-template-rows: 56px 1fr;
      overflow: hidden;
    }
    .nav-bar {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .dots {
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
    }
    .project-name {
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.02em;
    }
    .board-body {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100%;
    }
    .sidebar {
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .nav-link {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-link.active {
      background: rgba(59, 130, 246, 0.12);
      color: #60a5fa;
      font-weight: 500;
    }
    .main-workspace {
      padding: 36px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .target-cluster {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .focus-ring {
      position: absolute;
      width: 220px;
      height: 90px;
      border-radius: 18px;
      border: 2px dashed rgba(96, 165, 250, 0.7);
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.35);
      pointer-events: none;
    }
    .hero-button {
      padding: 18px 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 12px 32px rgba(37, 99, 235, 0.5);
      font-family: "Sharp Grotesk", sans-serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .btn-badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.2);
      font-family: "Atlas Grotesk", sans-serif;
      font-weight: 500;
    }
    .caption-overlay {
      position: absolute;
      bottom: 36px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="viewport" id="viewport">
      <div class="canvas-board">
        <div class="nav-bar">
          <div class="nav-left">
            <div class="dots">
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
            </div>
            <div class="project-name">pitch-production / edge-cluster-01</div>
          </div>
          <div style="font-size: 12px; color: #4ade80;">● All Systems Nominal</div>
        </div>
        <div class="board-body">
          <div class="sidebar">
            <div class="nav-link active"><span>⚡</span> Deployment Engine</div>
            <div class="nav-link"><span>📊</span> Live Metrics</div>
            <div class="nav-link"><span>🔑</span> Auth & Cryptography</div>
            <div class="nav-link"><span>🌐</span> Mesh Routing</div>
          </div>
          <div class="main-workspace">
            <div class="target-cluster">
              <div class="focus-ring" id="focusRing"></div>
              <button class="hero-button" id="heroButton">
                <span>Deploy to Global Edge</span>
                <span class="btn-badge">v2.4</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="caption-overlay" id="caption">Macro overview → Micro precision zoom</div>
  </div>

  <script src="../../_lib/anim.js"></script>
  <script src="../../_lib/fx.js"></script>
  <script>
    const D = 4.5;
    const viewport = document.getElementById('viewport');
    const focusRing = document.getElementById('focusRing');
    const heroButton = document.getElementById('heroButton');
    const caption = document.getElementById('caption');

    fx.register({
      duration: D,
      seek(t) {
        // Timeline:
        // 0.0 - 0.6s: slight float & overview
        // 0.6 - 2.0s: perceptual zoom from scale 1.0 -> 2.6, centered on hero button
        // 2.0 - 3.2s: hold on button with micro-pulse
        // 3.2 - 4.2s: pull back to 1.0
        const scale = anim.interpolate(
          t,
          [0, 0.6, 2.0, 3.2, 4.3],
          [0.92, 1.0, 2.5, 2.5, 0.92],
          {
            output: 'perceptual-scale',
            easing: [
              anim.Easing.linear,
              anim.Easing.bezier(0.25, 1, 0.35, 1),
              anim.Easing.linear,
              anim.Easing.bezier(0.25, 1, 0.35, 1)
            ],
            extrapolateLeft: 'clamp',
            extrapolateRight: 'clamp',
          }
        );

        // Focal pan shift towards button coordinates
        const xPan = anim.interpolate(t, [0.6, 2.0, 3.2, 4.3], [0, -130, -130, 0], {
          easing: anim.Easing.bezier(0.25, 1, 0.35, 1),
          extrapolateLeft: 'clamp',
          extrapolateRight: 'clamp',
        });
        const yPan = anim.interpolate(t, [0.6, 2.0, 3.2, 4.3], [0, -20, -20, 0], {
          easing: anim.Easing.bezier(0.25, 1, 0.35, 1),
          extrapolateLeft: 'clamp',
          extrapolateRight: 'clamp',
        });

        viewport.style.transform = `translate(${xPan}px, ${yPan}px) scale(${scale})`;

        // Focus ring animation
        const ringOpacity = anim.interpolate(t, [0.5, 1.0, 3.0, 3.5], [0, 1, 1, 0], { extrapolateLeft: 'clamp', extrapolateRight: 'clamp' });
        const ringScale = anim.interpolate(t, [0.6, 1.2, 2.4, 3.2], [1.3, 1.0, 1.05, 1.0], {
          easing: anim.Easing.inOut(anim.Easing.sin),
          extrapolateLeft: 'clamp',
          extrapolateRight: 'clamp',
        });
        focusRing.style.opacity = ringOpacity;
        focusRing.style.transform = `scale(${ringScale})`;

        // Button interactive pulse at peak zoom
        const btnScale = anim.interpolate(t, [2.0, 2.3, 2.6], [1.0, 1.06, 1.0], {
          easing: anim.Easing.bezier(0.34, 1.56, 0.64, 1),
          extrapolateLeft: 'clamp',
          extrapolateRight: 'clamp',
        });
        heroButton.style.transform = `scale(${btnScale})`;

        // Caption fade
        caption.style.opacity = anim.interpolate(t, [0, 0.5, 3.8, 4.4], [0, 0.9, 0.9, 0], { extrapolateLeft: 'clamp', extrapolateRight: 'clamp' });
      }
    });
  </script>
</body>
</html>
