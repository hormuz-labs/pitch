<!doctype html><meta charset="utf-8">
<title>The Track: Promo Reel</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b0b0d;color:#fff;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif}
  .shot{position:absolute;inset:0;overflow:hidden}
  .shot .img{position:absolute;inset:0;background:center/cover;will-change:transform}
  .k1 .img{background-image:url("../../../assets/backgrounds/sunset.png");filter:contrast(1.2) saturate(1.1)}
  .k2 .img{background-image:url("../../../assets/backgrounds/ocean.png");filter:grayscale(.7) contrast(1.3)}
  .k3 .img{background-image:url("../../../assets/backgrounds/aurora.png");filter:contrast(1.15)}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.6))}
  .solid{position:absolute;inset:0;background:#d9ff3d}
  .big{position:absolute;left:70px;right:70px;overflow:hidden;line-height:.86}
  .big span{display:block;font-size:220px;font-weight:500;letter-spacing:-.06em;text-transform:uppercase;will-change:transform}
  .big.dark span{color:#0b0b0d}
  .bar{position:absolute;left:0;right:0;height:180px;background:#fff;color:#0b0b0d;display:flex;align-items:center;white-space:nowrap;font-size:110px;font-weight:500;letter-spacing:-.04em;text-transform:uppercase;will-change:transform;overflow:hidden}
  .bar div{display:flex;gap:60px;padding-left:40px;will-change:transform}
  .stripe{position:absolute;left:-30%;width:160%;height:120px;background:#d9ff3d;transform:rotate(-16deg);will-change:transform}
  .prod{position:absolute;left:50%;top:50%;width:820px;margin:-230px 0 0 -410px;will-change:transform}
  .prod svg{width:100%;height:auto}
  .stat{position:absolute;left:70px;overflow:hidden}
  .stat span{display:block;font-size:150px;font-weight:500;letter-spacing:-.06em;line-height:1;color:#d9ff3d}
  .stat small{display:block;font-family:"Atlas Grotesk",sans-serif;font-size:26px;letter-spacing:.28em;text-transform:uppercase;color:#fff;margin-top:14px}
  .cta{position:absolute;left:70px;right:70px;bottom:150px;height:150px;border-radius:75px;background:#fff;color:#0b0b0d;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:500;letter-spacing:.02em;will-change:transform}
  .logo{position:absolute;left:0;right:0;top:120px;text-align:center;font-family:"Atlas Grotesk",sans-serif;font-size:28px;letter-spacing:.36em;text-transform:uppercase;overflow:hidden}
  .logo span{display:block}
</style>
<div class="stage">
  <div class="shot k1"><div class="img"></div><div class="shade"></div></div>
  <div class="shot k2"><div class="img"></div><div class="shade"></div></div>
  <div class="shot k3"><div class="img"></div><div class="shade"></div></div>
  <div class="solid"></div>
  <div class="stripe" style="top:700px"></div>
  <div class="stripe" style="top:1200px"></div>
  <div class="logo"><span>Northwind Athletics</span></div>
  <div class="big t1" style="top:700px"><span>Go</span></div>
  <div class="big t2" style="top:900px"><span>Harder</span></div>
  <div class="big dark t3" style="top:640px"><span>Season</span></div>
  <div class="big dark t4" style="top:840px"><span>Four</span></div>
  <div class="bar" style="top:760px"><div><span>Drop 04 · Drop 04 · Drop 04 · Drop 04 · Drop 04</span></div></div>
  <div class="prod"><svg viewBox="0 0 200 110"><path d="M12 74c0-10 22-16 40-22l30-22c9-7 20-4 28 5l40 22c22 7 40 10 40 22v9H12z" fill="#e9e9ea"/><path d="M12 83h178v6H12z" fill="#d9ff3d"/><path d="M60 55l30 15" stroke="#0a0a0b" stroke-width="6" stroke-linecap="round"/></svg></div>
  <div class="stat s1" style="top:1180px"><span>−23%</span><small>Lighter</small></div>
  <div class="stat s2" style="top:1420px"><span>+18%</span><small>Energy return</small></div>
  <div class="cta">Shop the drop</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 10 });
  const hide = (s) => gsap.set(s, { autoAlpha: 0 });
  hide(['.k2', '.k3', '.solid', '.prod', '.stat', '.cta']);
  gsap.set('.bar', { xPercent: 100 });
  // beat 1 — shot 1, "GO / HARDER" slams in
  tl.fromTo('.k1 .img', { scale: 1.3 }, { scale: 1.1, duration: 1.6, ease: 'power2.out' }, 0)
    .from('.logo span', { yPercent: 120, duration: 0.5, ease: 'expo.out' }, 0.1)
    .from('.t1 span', { yPercent: 120, duration: 0.45, ease: 'expo.out' }, 0.2)
    .from('.t2 span', { xPercent: 120, duration: 0.45, ease: 'expo.out' }, 0.32)
    // beat 2 — hard cut to shot 2 with a marquee bar racing across
    .set('.k2', { autoAlpha: 1 }, 1.5).set('.t1, .t2', { autoAlpha: 0 }, 1.5)
    .fromTo('.k2 .img', { scale: 1.0, xPercent: 3 }, { scale: 1.15, xPercent: -3, duration: 1.6, ease: 'none' }, 1.5)
    .to('.bar', { xPercent: 0, duration: 0.5, ease: 'expo.out' }, 1.5)
    .fromTo('.bar div', { xPercent: 0 }, { xPercent: -30, duration: 1.7, ease: 'none' }, 1.5)
    .to('.bar', { xPercent: -100, duration: 0.4, ease: 'expo.in' }, 2.9)
    // beat 3 — lime slab, stripes, dark type "SEASON FOUR"
    .set('.solid', { autoAlpha: 1 }, 3.2)
    .fromTo('.stripe', { xPercent: (i) => (i ? 120 : -120) }, { xPercent: 0, duration: 0.5, stagger: 0.08, ease: 'expo.out' }, 3.2)
    .from('.t3 span', { yPercent: 120, duration: 0.45, ease: 'expo.out' }, 3.35)
    .from('.t4 span', { yPercent: -120, duration: 0.45, ease: 'expo.out' }, 3.45)
    .to('.stripe', { xPercent: (i) => (i ? -140 : 140), duration: 0.5, stagger: 0.06, ease: 'expo.in' }, 4.4)
    .to('.t3 span, .t4 span', { yPercent: -120, duration: 0.35, stagger: 0.05, ease: 'expo.in' }, 4.5)
    // beat 4 — product spins in over shot 3, stats stack
    .set('.solid', { autoAlpha: 0 }, 4.9).set('.k3', { autoAlpha: 1 }, 4.9)
    .fromTo('.k3 .img', { scale: 1.25, yPercent: -2 }, { scale: 1.05, yPercent: 2, duration: 5, ease: 'none' }, 4.9)
    .fromTo('.prod', { autoAlpha: 0, rotation: -30, scale: 0.4, y: 300 }, { autoAlpha: 1, rotation: 0, scale: 1, y: 0, duration: 0.8, ease: 'expo.out' }, 4.95)
    .to('.prod', { y: -640, scale: 0.7, duration: 0.7, ease: 'expo.inOut' }, 6.0)
    .to('.prod', { rotation: 6, duration: 2.6, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 6.0)
    .fromTo('.stat', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.05, stagger: 0.25 }, 6.3)
    .from('.stat span', { yPercent: 120, duration: 0.5, stagger: 0.25, ease: 'expo.out' }, 6.3)
    .from('.stat small', { xPercent: -40, opacity: 0, duration: 0.5, stagger: 0.25, ease: 'expo.out' }, 6.45)
    .fromTo('.cta', { autoAlpha: 0, y: 200 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: 'expo.out' }, 7.2)
    .to('.cta', { scale: 1.04, duration: 0.5, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 7.8)
    // out
    .to('.cta', { y: 300, autoAlpha: 0, duration: 0.4, ease: 'expo.in' }, 9.3)
    .to('.stat', { xPercent: -120, duration: 0.4, stagger: 0.06, ease: 'expo.in' }, 9.3)
    .to('.prod', { y: -1400, duration: 0.5, ease: 'expo.in' }, 9.4)
    .to('.logo span', { yPercent: -120, duration: 0.3, ease: 'expo.in' }, 9.5)
    .to('.k3', { autoAlpha: 0, duration: 0.3 }, 9.7);
</script>
