<!doctype html><meta charset="utf-8">
<title>The Track: Session Complete</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b0b0d;color:#fff;font-family:"Atlas Grotesk",sans-serif}
  .phone{position:absolute;left:50%;top:50%;width:760px;height:1560px;margin:-780px 0 0 -380px;border-radius:90px;background:#151517;border:12px solid #2a2a2e;overflow:hidden;padding:120px 56px 56px;will-change:transform}
  .notch{position:absolute;left:50%;top:30px;width:220px;height:52px;margin-left:-110px;border-radius:26px;background:#000}
  .k{font-size:24px;letter-spacing:.24em;text-transform:uppercase;color:#8a8a94;text-align:center}
  .check{width:300px;height:300px;margin:50px auto 0;position:relative}
  .check svg{width:100%;height:100%}
  .check .bg{fill:#d9ff3d}
  .check .tick{fill:none;stroke:#0b0b0d;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
  .ring{position:absolute;inset:-20px;border-radius:50%;border:6px solid #d9ff3d;opacity:0}
  .title{text-align:center;font-family:"Sharp Grotesk",sans-serif;font-size:92px;font-weight:500;letter-spacing:-.05em;line-height:.95;margin-top:50px;overflow:hidden}
  .title span{display:block}
  .sub{text-align:center;font-size:26px;color:#8a8a94;margin-top:18px;overflow:hidden}
  .sub span{display:block}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:60px}
  .cell{border-radius:28px;background:#1d1d21;padding:30px;will-change:transform}
  .cell .l{font-size:18px;letter-spacing:.2em;text-transform:uppercase;color:#8a8a94}
  .cell .v{font-family:"Sharp Grotesk",sans-serif;font-size:66px;font-weight:500;letter-spacing:-.04em;margin-top:10px;font-variant-numeric:tabular-nums}
  .cell .v em{font-style:normal;font-size:24px;color:#d9ff3d;margin-left:6px;font-family:"Atlas Grotesk",sans-serif;letter-spacing:0}
  .btn{margin-top:40px;height:110px;border-radius:32px;background:#d9ff3d;color:#0b0b0d;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:500;will-change:transform}
  .conf{position:absolute;left:50%;top:330px;width:0;height:0}
  .conf i{position:absolute;width:14px;height:28px;border-radius:4px;background:#d9ff3d;opacity:0;margin:-14px 0 0 -7px}
  .conf i:nth-child(2n){background:#fff}.conf i:nth-child(5n){background:#ff5d3d}
</style>
<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="k">Tempo run · 45 min</div>
    <div class="check"><div class="ring"></div><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="48"/><path class="tick" d="M28 52l16 15 30-34"/></svg></div>
    <div class="title"><span>Session</span><span>complete</span></div>
    <div class="sub"><span>Nice work — that's 4 in a row this week.</span></div>
    <div class="grid">
      <div class="cell"><div class="l">Distance</div><div class="v"><span class="d">0.0</span><em>km</em></div></div>
      <div class="cell"><div class="l">Avg pace</div><div class="v"><span class="p">0:00</span><em>/km</em></div></div>
      <div class="cell"><div class="l">Calories</div><div class="v"><span class="c">0</span><em>kcal</em></div></div>
      <div class="cell"><div class="l">Avg HR</div><div class="v"><span class="h">0</span><em>bpm</em></div></div>
    </div>
    <div class="btn">Save session</div>
    <div class="conf"></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const rng = fx.rng(17);
  const conf = document.querySelector('.conf'); const bits = [];
  for (let i = 0; i < 40; i++) { const b = document.createElement('i'); conf.appendChild(b); bits.push(b); }
  const n = { d: 0, p: 0, c: 0, h: 0 };
  const paint = () => {
    document.querySelector('.d').textContent = n.d.toFixed(1);
    document.querySelector('.c').textContent = Math.round(n.c);
    document.querySelector('.h').textContent = Math.round(n.h);
    const s = Math.round(n.p); document.querySelector('.p').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };
  const tl = fx.timeline({ duration: 6 });
  tl.from('.phone', { y: 1700, duration: 0.9, ease: 'expo.out' }, 0)
    .from('.k', { opacity: 0, y: -10, duration: 0.4 }, 0.6)
    // the check lands: disc pops, tick draws, ring pulses, confetti
    .fromTo('.check .bg', { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, transformOrigin: '50% 50%', duration: 0.6, ease: 'back.out(2.5)', immediateRender: true }, 0.7)
    .fromTo('.tick', { drawSVG: '0%' }, { drawSVG: '100%', duration: 0.45, ease: 'power2.inOut' }, 1.0)
    .fromTo('.ring', { scale: 0.8, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.8, ease: 'power2.out' }, 1.1)
    .from('.title span', { yPercent: 120, duration: 0.6, stagger: 0.1, ease: 'expo.out' }, 1.2)
    .from('.sub span', { yPercent: 120, duration: 0.5, ease: 'expo.out' }, 1.5)
    .from('.cell', { y: 80, opacity: 0, duration: 0.6, stagger: 0.1, ease: 'expo.out' }, 1.7)
    .to(n, { d: 8.2, p: 5 * 60 + 12, c: 612, h: 158, duration: 1.6, ease: 'power3.out', onUpdate: paint }, 1.9)
    .from('.btn', { y: 60, opacity: 0, duration: 0.5, ease: 'expo.out' }, 2.3)
    .to('.btn', { scale: 0.95, duration: 0.12, yoyo: true, repeat: 1, ease: 'power2.inOut' }, 4.2)
    .to('.check', { scale: 1.06, duration: 0.8, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 2.0);
  bits.forEach((b) => {
    const a = -Math.PI / 2 + (rng() - 0.5) * 2.6, d = 260 + rng() * 420;
    tl.fromTo(b, { x: 0, y: 0, opacity: 1, rotation: 0 }, { x: Math.cos(a) * d, y: Math.sin(a) * d + 300, opacity: 0, rotation: (rng() - 0.5) * 720, duration: 1.2 + rng() * 0.7, ease: 'power2.out', immediateRender: false }, 1.0 + rng() * 0.15);
  });
  tl.to('.phone', { y: 1700, duration: 0.6, ease: 'expo.in' }, 5.4);
  paint();
</script>
