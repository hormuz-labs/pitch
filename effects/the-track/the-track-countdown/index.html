<!doctype html><meta charset="utf-8">
<title>The Track: Countdown</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b0b0d;color:#fff;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif}
  .track{position:absolute;left:50%;top:50%;width:1600px;height:900px;margin:-450px 0 0 -800px;will-change:transform}
  .track svg{width:100%;height:100%}
  .num{position:absolute;left:0;right:0;top:50%;height:300px;margin-top:-150px;text-align:center;font-size:300px;font-weight:500;letter-spacing:-.06em;line-height:1;overflow:hidden}
  .num span{position:absolute;left:0;right:0;top:0;will-change:transform;color:#d9ff3d}
  .kick{position:absolute;left:0;right:0;top:120px;text-align:center;font-family:"Atlas Grotesk",sans-serif;font-size:22px;letter-spacing:.32em;text-transform:uppercase;color:#fff;opacity:.85;overflow:hidden}
  .kick span{display:block}
  .foot{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-size:40px;font-weight:500;letter-spacing:-.02em;text-transform:uppercase;overflow:hidden}
  .foot span{display:block}
  .flash{position:absolute;inset:0;background:#d9ff3d;opacity:0}
  .go{position:absolute;left:0;right:0;top:50%;text-align:center;font-size:300px;font-weight:500;letter-spacing:-.06em;line-height:1;margin-top:-150px;color:#0b0b0d;opacity:0}
</style>
<div class="stage">
  <div class="track"><svg viewBox="0 0 1600 900">
    <g fill="none" stroke="#2a2a2e" stroke-width="3">
      <rect x="150" y="120" width="1300" height="660" rx="330"/><rect x="230" y="200" width="1140" height="500" rx="250"/><rect x="310" y="280" width="980" height="340" rx="170"/><rect x="390" y="360" width="820" height="180" rx="90"/>
    </g>
    <path class="lane" d="M480 160H1120A290 290 0 0 1 1120 740H480A290 290 0 0 1 480 160Z" fill="none" stroke="#d9ff3d" stroke-width="14" stroke-linecap="round"/>
    <g stroke="#3a3a40" stroke-width="3"><path d="M800 120v100M800 780v-100"/></g>
    <g class="runner" fill="#d9ff3d"><circle r="14"/></g>
  </svg></div>
  <div class="flash"></div>
  <div class="kick"><span>Northwind City Marathon · Starts in</span></div>
  <div class="num"><span class="n3">3</span><span class="n2">2</span><span class="n1">1</span></div>
  <div class="go">GO</div>
  <div class="foot"><span>Sunday 06:00 — Lane One</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../../assets/gsap/MotionPathPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin);
  const tl = fx.timeline({ duration: 4 });
  gsap.set(['.n2', '.n1'], { yPercent: 110 });
  tl.fromTo('.track', { scale: 1.3, rotation: -6 }, { scale: 0.9, rotation: 4, duration: 4, ease: 'none' }, 0)
    .fromTo('.lane', { drawSVG: '0% 0%' }, { drawSVG: '0% 100%', duration: 3.2, ease: 'power1.inOut' }, 0.1)
    .to('.runner', { motionPath: { path: '.lane', align: '.lane', alignOrigin: [0.5, 0.5] }, duration: 3.2, ease: 'power1.inOut' }, 0.1)
    .from('.kick span', { yPercent: 120, duration: 0.5, ease: 'expo.out' }, 0.1)
    .from('.foot span', { yPercent: 120, duration: 0.5, ease: 'expo.out' }, 0.25);
  // digits roll: each one slams in, then rolls out upward as the next arrives
  [['.n3', 0.2], ['.n2', 1.2], ['.n1', 2.2]].forEach(([n, t], i) => {
    tl.fromTo(n, { yPercent: 110, scale: 1.4 }, { yPercent: 0, scale: 1, duration: 0.45, ease: 'expo.out' }, t)
      .to(n, { yPercent: -110, duration: 0.35, ease: 'expo.in' }, t + 0.85);
  });
  // GO: the whole frame flashes lime
  tl.to('.flash', { opacity: 1, duration: 0.12, ease: 'power2.in' }, 3.2)
    .fromTo('.go', { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'expo.out' }, 3.25)
    .to('.kick, .foot', { opacity: 0, duration: 0.1 }, 3.2)
    .to('.go', { scale: 1.1, duration: 0.5, ease: 'power1.out' }, 3.6)
    .to('.flash', { opacity: 0, duration: 0.25, ease: 'power2.in' }, 3.75)
    .to('.go', { opacity: 0, duration: 0.2 }, 3.8);
</script>
