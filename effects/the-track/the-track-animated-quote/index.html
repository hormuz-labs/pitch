<!doctype html><meta charset="utf-8">
<title>The Track: Animated Quote</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b0b0d;color:#fff;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif}
  .bg{position:absolute;inset:0;background:url("../../../assets/backgrounds/sunset.png") center/cover;filter:grayscale(.6) contrast(1.2) brightness(.8);will-change:transform}
  .athlete{position:absolute;left:50%;bottom:0;width:520px;height:760px;margin-left:-160px;will-change:transform}
  .athlete svg{width:100%;height:100%}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.7) 80%)}
  .band{position:absolute;left:0;right:0;height:160px;background:#d9ff3d;transform-origin:left;will-change:transform}
  .quote{position:absolute;left:72px;right:72px;top:150px}
  .row{overflow:hidden;line-height:.9;padding-right:.1em}
  .w{display:block;font-size:130px;font-weight:500;letter-spacing:-.05em;text-transform:uppercase;will-change:transform}
  .w.hi{color:#0b0b0d;background:#d9ff3d;display:inline-block;padding:0 .08em;line-height:.95}
  .mark{position:absolute;left:72px;top:64px;font-size:180px;line-height:.5;color:#d9ff3d;font-family:"Sorts Mill Goudy",serif}
  .who{position:absolute;left:72px;bottom:84px;font-family:"Atlas Grotesk",sans-serif;font-size:24px;letter-spacing:.24em;text-transform:uppercase;overflow:hidden}
  .who span{display:block}
  .who b{color:#d9ff3d;font-weight:500}
  .rule{position:absolute;left:72px;bottom:130px;width:220px;height:4px;background:#fff;transform-origin:left}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="athlete"><svg viewBox="0 0 260 380"><g fill="#111"><circle cx="150" cy="48" r="30"/><path d="M118 90l60 -6 26 90 -30 10 -14 -46 -8 70 40 70 -22 22 -60 -70 -14 -60z"/><path d="M104 96l-46 50 12 30 30-32z"/><path d="M178 92l52 40-12 26-36-24z"/><path d="M110 210l-46 70 20 70 26-8-10-56 40-46z"/></g></svg></div>
  <div class="shade"></div>
  <div class="band" style="top:420px"></div>
  <div class="mark">“</div>
  <div class="quote">
    <div class="row"><span class="w">Pain is</span></div>
    <div class="row"><span class="w">just</span></div>
    <div class="row"><span class="w hi">speed</span></div>
    <div class="row"><span class="w">leaving</span></div>
    <div class="row"><span class="w">the body</span></div>
  </div>
  <div class="rule"></div>
  <div class="who"><span><b>Maya Okafor</b> — 400m, Northwind Track Club</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 5 });
  tl.fromTo('.bg', { scale: 1.15, xPercent: 2 }, { scale: 1.02, xPercent: -2, duration: 5, ease: 'none' }, 0)
    .from('.athlete', { x: 300, opacity: 0, duration: 0.9, ease: 'expo.out' }, 0)
    .to('.athlete', { y: -18, duration: 4, ease: 'sine.inOut' }, 0.9)
    // a lime band slashes across, then the words stamp over it line by line
    .fromTo('.band', { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: 'expo.inOut' }, 0.3)
    .to('.band', { scaleX: 0, transformOrigin: 'right', duration: 0.45, ease: 'expo.inOut' }, 0.85)
    .from('.mark', { scale: 0, rotation: -30, duration: 0.5, ease: 'back.out(2.5)', transformOrigin: 'center' }, 0.6)
    .from('.w', { yPercent: 115, duration: 0.6, stagger: 0.09, ease: 'expo.out' }, 0.75)
    .from('.w', { xPercent: (i) => (i % 2 ? 8 : -8), duration: 0.6, stagger: 0.09, ease: 'expo.out' }, 0.75)
    .fromTo('.w.hi', { scaleX: 1.15, scaleY: 0.85 }, { scaleX: 1, scaleY: 1, duration: 0.5, ease: 'elastic.out(1,0.4)', transformOrigin: 'left bottom' }, 1.3)
    .from('.rule', { scaleX: 0, duration: 0.5, ease: 'expo.out' }, 1.4)
    .from('.who span', { yPercent: 120, duration: 0.5, ease: 'expo.out' }, 1.55)
    // exit
    .to('.w', { yPercent: -115, duration: 0.35, stagger: 0.06, ease: 'expo.in' }, 4.2)
    .to('.who span', { yPercent: -120, duration: 0.3, ease: 'expo.in' }, 4.3)
    .to('.rule', { scaleX: 0, transformOrigin: 'right', duration: 0.3, ease: 'expo.in' }, 4.3)
    .to('.mark', { scale: 0, duration: 0.3, ease: 'back.in(2)' }, 4.4)
    .to('.athlete', { x: 300, opacity: 0, duration: 0.45, ease: 'expo.in' }, 4.5);
</script>
