<!doctype html><meta charset="utf-8">
<title>The Track: Mobile App Showcase</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b0b0d;color:#fff;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif}
  .stripe{position:absolute;left:-30%;width:160%;height:140px;background:#d9ff3d;transform:rotate(-14deg);will-change:transform}
  .h{position:absolute;left:80px;right:80px;overflow:hidden;line-height:.88}
  .h span{display:block;font-size:170px;font-weight:500;letter-spacing:-.06em;text-transform:uppercase;will-change:transform}
  .h.dark span{color:#0b0b0d}
  .phone{position:absolute;left:50%;top:50%;width:520px;height:1060px;margin:-530px 0 0 -260px;border-radius:70px;background:#151517;border:10px solid #2a2a2e;overflow:hidden;will-change:transform;font-family:"Atlas Grotesk",sans-serif}
  .notch{position:absolute;left:50%;top:22px;width:160px;height:38px;margin-left:-80px;border-radius:19px;background:#000;z-index:5}
  .scr{position:absolute;inset:0;padding:100px 34px 34px;opacity:0}
  .scr .t{font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:#8a8a94}
  .scr .v{font-family:"Sharp Grotesk",sans-serif;font-size:110px;font-weight:500;letter-spacing:-.05em;line-height:1;color:#d9ff3d;margin-top:10px}
  .scr .v small{font-size:28px;color:#fff;letter-spacing:0;margin-left:8px}
  .map{margin-top:30px;height:420px;border-radius:28px;background:#1d1d21;position:relative;overflow:hidden}
  .map svg{position:absolute;inset:0;width:100%;height:100%}
  .list{margin-top:30px;display:flex;flex-direction:column;gap:14px}
  .item{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-radius:20px;background:#1d1d21;font-size:24px}
  .item b{font-weight:500;color:#d9ff3d}
  .btn{margin-top:26px;height:84px;border-radius:24px;background:#d9ff3d;color:#0b0b0d;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:500;letter-spacing:.04em}
  .ring{width:340px;height:340px;margin:40px auto 0;position:relative}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Sharp Grotesk",sans-serif;font-size:80px;font-weight:500;letter-spacing:-.04em}
  .ring div small{font-family:"Atlas Grotesk",sans-serif;font-size:18px;letter-spacing:.2em;text-transform:uppercase;color:#8a8a94}
  .bars{display:flex;align-items:flex-end;gap:10px;height:200px;margin-top:40px}
  .bars i{flex:1;background:#2a2a2e;border-radius:6px 6px 0 0;transform-origin:bottom}
  .bars i.on{background:#d9ff3d}
  .tag{position:absolute;left:80px;bottom:110px;font-family:"Atlas Grotesk",sans-serif;font-size:26px;letter-spacing:.28em;text-transform:uppercase;overflow:hidden}
  .tag span{display:block}
</style>
<div class="stage">
  <div class="stripe s1" style="top:300px"></div>
  <div class="stripe s2" style="top:1500px"></div>
  <div class="h h1" style="top:120px"><span>Run</span></div>
  <div class="h h2" style="top:1560px;text-align:right"><span>Faster</span></div>
  <div class="phone">
    <div class="notch"></div>
    <div class="scr a">
      <div class="t">Morning run</div><div class="v"><span class="dist">0.00</span><small>km</small></div>
      <div class="map"><svg viewBox="0 0 450 420"><g stroke="#2c2c31" stroke-width="2"><path d="M0 100h450M0 220h450M0 340h450M120 0v420M300 0v420"/></g><path class="route" d="M40 360C80 300 60 200 140 180S220 260 260 200 330 80 410 60" fill="none" stroke="#d9ff3d" stroke-width="10" stroke-linecap="round"/><circle class="dotr" r="14" fill="#fff"/></svg></div>
      <div class="btn">Pause run</div>
    </div>
    <div class="scr b">
      <div class="t">Weekly goal</div>
      <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#2a2a2e" stroke-width="10"/><circle class="arc" cx="50" cy="50" r="44" fill="none" stroke="#d9ff3d" stroke-width="10" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5"/></svg><div><span class="pct">0%</span><small>of 40 km</small></div></div>
      <div class="bars"></div>
      <div class="list"><div class="item"><span>Best pace</span><b>4:41 /km</b></div><div class="item"><span>Streak</span><b>12 days</b></div></div>
    </div>
    <div class="scr c">
      <div class="t">Leaderboard</div>
      <div class="list" style="margin-top:20px">
        <div class="item"><span>1 · Maya O.</span><b>52.4 km</b></div><div class="item"><span>2 · You</span><b>48.9 km</b></div><div class="item"><span>3 · Leo K.</span><b>44.1 km</b></div><div class="item"><span>4 · Sam R.</span><b>39.7 km</b></div><div class="item"><span>5 · Ana P.</span><b>36.2 km</b></div>
      </div>
      <div class="btn">Share result</div>
    </div>
  </div>
  <div class="tag"><span>Northwind Run — Free on iOS &amp; Android</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../../assets/gsap/MotionPathPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin);
  const rng = fx.rng(9);
  const bars = document.querySelector('.bars');
  for (let i = 0; i < 7; i++) { const b = document.createElement('i'); b.style.height = (30 + rng() * 70) + '%'; if (i === 5) b.classList.add('on'); bars.appendChild(b); }
  const n = { d: 0, p: 0 };
  const paint = () => { document.querySelector('.dist').textContent = n.d.toFixed(2); document.querySelector('.pct').textContent = Math.round(n.p) + '%'; gsap.set('.arc', { strokeDashoffset: 276.5 * (1 - n.p / 100) }); };
  const tl = fx.timeline({ duration: 10 });
  // kinetic open: stripes slash in, giant words snap, phone slams up
  tl.from('.stripe', { xPercent: (i) => (i ? 120 : -120), duration: 0.6, stagger: 0.08, ease: 'move' }, 0)
    .from('.h1 span', { yPercent: 120, duration: 0.55, ease: 'expo.out' }, 0.15)
    .from('.h2 span', { yPercent: -120, duration: 0.55, ease: 'expo.out' }, 0.25)
    .from('.phone', { y: 1400, rotation: -8, duration: 0.9, ease: 'move' }, 0.3)
    .from('.tag span', { yPercent: 120, duration: 0.5, ease: 'expo.out' }, 0.9);
  // screen A: distance counts, route draws, marker runs it
  tl.to('.scr.a', { opacity: 1, duration: 0.3 }, 0.9)
    .to(n, { d: 6.42, duration: 2.4, ease: 'power2.out', onUpdate: paint }, 1.0)
    .fromTo('.route', { drawSVG: '0%' }, { drawSVG: '100%', duration: 2.2, ease: 'power1.inOut' }, 1.0)
    .to('.dotr', { motionPath: { path: '.route', align: '.route', alignOrigin: [0.5, 0.5] }, duration: 2.2, ease: 'power1.inOut' }, 1.0)
    .to('.btn', { scale: 0.95, duration: 0.1, yoyo: true, repeat: 1 }, 3.3)
    // fast cut to screen B: slide left
    .to('.scr.a', { xPercent: -100, opacity: 0, duration: 0.45, ease: 'expo.inOut' }, 3.7)
    .fromTo('.scr.b', { xPercent: 100, opacity: 1 }, { xPercent: 0, duration: 0.45, ease: 'expo.inOut' }, 3.7)
    .to(n, { p: 78, duration: 1.4, ease: 'power3.out', onUpdate: paint }, 4.1)
    .from('.bars i', { scaleY: 0, duration: 0.5, stagger: 0.05, ease: 'back.out(2)' }, 4.3)
    .from('.scr.b .item', { y: 40, opacity: 0, duration: 0.5, stagger: 0.1, ease: 'expo.out' }, 4.7)
    // cut to screen C: leaderboard cascades
    .to('.scr.b', { xPercent: -100, opacity: 0, duration: 0.45, ease: 'expo.inOut' }, 6.4)
    .fromTo('.scr.c', { xPercent: 100, opacity: 1 }, { xPercent: 0, duration: 0.45, ease: 'expo.inOut' }, 6.4)
    .from('.scr.c .item', { x: 120, opacity: 0, duration: 0.5, stagger: 0.08, ease: 'expo.out' }, 6.7)
    .to('.scr.c .item:nth-child(2)', { scale: 1.04, backgroundColor: '#2a2a10', duration: 0.4, ease: 'power2.out' }, 7.4)
    // phone tilts through the whole thing so it never sits still
    .fromTo('.phone', { rotationY: -6 }, { rotationY: 6, duration: 8, ease: 'sine.inOut' }, 1.2)
    .to('.stripe', { xPercent: (i) => (i ? -10 : 10), duration: 9, ease: 'none' }, 0.6)
    // out
    .to('.phone', { y: 1400, rotation: 6, duration: 0.6, ease: 'expo.in' }, 9.2)
    .to('.h1 span', { yPercent: -120, duration: 0.35, ease: 'expo.in' }, 9.35)
    .to('.h2 span', { yPercent: 120, duration: 0.35, ease: 'expo.in' }, 9.4)
    .to('.tag span', { yPercent: -120, duration: 0.3, ease: 'expo.in' }, 9.4)
    .to('.stripe', { xPercent: (i) => (i ? 120 : -120), duration: 0.45, stagger: 0.05, ease: 'expo.in' }, 9.5);
  paint();
</script>
