<!doctype html><meta charset="utf-8">
<title>The Edit: Nested Images</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#efeae2;color:#111}
  .grain{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.5),transparent 60%);pointer-events:none}
  .frame{position:absolute;overflow:hidden;background:#111;will-change:transform,clip-path}
  .frame .img{position:absolute;inset:-6%;background-position:center;background-size:cover;will-change:transform}
  .f1{left:90px;top:120px;width:900px;height:840px}
  .f1 .img{background-image:url("../../../assets/backgrounds/ocean.png")}
  .f2{left:60px;top:80px;width:520px;height:640px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
  .f2 .img{background-image:url("../../../assets/backgrounds/sunset.png");filter:saturate(1.15)}
  .f3{left:80px;top:100px;width:300px;height:380px;box-shadow:0 20px 40px rgba(0,0,0,.35)}
  .f3 .img{background-image:url("../../../assets/backgrounds/aurora.png")}
  .f4{left:60px;top:60px;width:150px;height:190px;box-shadow:0 12px 24px rgba(0,0,0,.35)}
  .f4 .img{background-image:url("../../../assets/backgrounds/ocean.png");filter:contrast(1.2) grayscale(.6)}
  .title{position:absolute;left:90px;top:40px;font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:44px;letter-spacing:-.02em;text-transform:uppercase;overflow:hidden;line-height:1.1}
  .title span{display:block;will-change:transform}
  .cap{position:absolute;right:90px;bottom:60px;text-align:right;font-family:"Sorts Mill Goudy",serif;font-style:italic;font-size:34px;line-height:1.15}
  .cap .r{overflow:hidden}.cap span{display:block}
  .num{position:absolute;right:60px;top:60px;font-family:"Sharp Grotesk",sans-serif;font-size:18px;letter-spacing:.3em;text-transform:uppercase;opacity:.6}
  .rule{position:absolute;left:90px;bottom:60px;height:2px;width:260px;background:#111;transform-origin:left}
</style>
<div class="stage">
  <div class="grain"></div>
  <div class="num">Vol. 04 — The Edit</div>
  <div class="title"><span>Layered</span></div>
  <div class="frame f1"><div class="img"></div>
    <div class="frame f2"><div class="img"></div>
      <div class="frame f3"><div class="img"></div>
        <div class="frame f4"><div class="img"></div></div>
      </div>
    </div>
  </div>
  <div class="cap"><div class="r"><span>Autumn, seen</span></div><div class="r"><span>from the inside</span></div></div>
  <div class="rule"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 2 });
  const frames = ['.f1', '.f2', '.f3', '.f4'];
  gsap.set('.cap span', { yPercent: 110 });
  // slow push on every image for the whole loop
  tl.fromTo('.frame .img', { scale: 1.0 }, { scale: 1.12, duration: 2, ease: 'none' }, 0);
  // frames nest in one after another: wipe reveal + parallax offset settling
  frames.forEach((f, i) => {
    tl.fromTo(f, { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.7, ease: 'expo.out' }, 0.05 + i * 0.16)
      .fromTo(f, { x: 60 + i * 20 }, { x: 0, duration: 0.8, ease: 'expo.out' }, 0.05 + i * 0.16);
  });
  tl.from('.title span', { yPercent: 110, duration: 0.6, ease: 'expo.out' }, 0.1)
    .to('.cap span', { yPercent: 0, stagger: 0.08, duration: 0.6, ease: 'expo.out' }, 0.5)
    .from('.rule', { scaleX: 0, duration: 0.7, ease: 'expo.out' }, 0.55)
    .from('.num', { opacity: 0, duration: 0.4 }, 0.3);
  // exit: the nest collapses inward, innermost first
  frames.slice().reverse().forEach((f, i) => {
    tl.to(f, { clipPath: 'inset(0 0 0 100%)', duration: 0.32, ease: 'expo.in' }, 1.45 + i * 0.07);
  });
  tl.to('.cap span, .title span', { yPercent: -110, duration: 0.3, ease: 'expo.in' }, 1.6)
    .to('.rule', { scaleX: 0, duration: 0.3, ease: 'expo.in' }, 1.65)
    .to('.num', { opacity: 0, duration: 0.2 }, 1.75);
</script>
