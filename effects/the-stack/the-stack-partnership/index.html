<!doctype html><meta charset="utf-8">
<title>The Stack: Partnership</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f4f1ea;color:#111;perspective:1600px}
  .bg{position:absolute;inset:-10%;background:radial-gradient(circle at 20% 10%,#fff 0,transparent 50%),radial-gradient(circle at 80% 90%,#ffe3c2 0,transparent 55%)}
  .deck{position:absolute;left:140px;top:210px;width:800px;height:660px;transform-style:preserve-3d}
  .card{position:absolute;inset:0;border-radius:32px;background:#fff;box-shadow:0 40px 80px rgba(0,0,0,.18),inset 0 0 0 1px rgba(0,0,0,.05);transform-origin:center bottom;will-change:transform;overflow:hidden}
  .c2{background:#ffd23f}.c3{background:#111}
  .front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding-bottom:70px}
  .logos{display:flex;align-items:center;gap:0;height:180px}
  .logo{width:180px;height:180px;border-radius:44px;display:flex;align-items:center;justify-content:center;will-change:transform;position:relative}
  .logo.a{background:#111}
  .logo.b{background:#ff5a36}
  .logo svg{width:84px;height:84px}
  .x{width:110px;text-align:center;font-family:"Sharp Grotesk",sans-serif;font-size:56px;font-weight:500;letter-spacing:-.04em;will-change:transform}
  .row{overflow:hidden}
  .row span{display:block;will-change:transform}
  .kicker{font-family:"Sharp Grotesk",sans-serif;font-size:15px;letter-spacing:.3em;text-transform:uppercase;opacity:.55}
  .h1{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:60px;letter-spacing:-.035em;line-height:1;text-align:center}
  .sub{font-size:20px;color:#666;text-align:center;max-width:520px;line-height:1.35}
  .pill{position:absolute;left:50%;bottom:44px;margin-left:-150px;width:300px;text-align:center;padding:14px 22px;border-radius:99px;background:#111;color:#fff;font-weight:500;font-size:18px;white-space:nowrap;box-shadow:0 20px 40px rgba(0,0,0,.2);will-change:transform}
  .top{position:absolute;left:140px;top:120px;font-family:"Sharp Grotesk",sans-serif;font-size:16px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;overflow:hidden}
  .top span{display:block}
  .spark{position:absolute;width:12px;height:12px;border-radius:50%;background:#ff5a36;left:50%;top:50%;margin:-6px 0 0 -6px;will-change:transform;opacity:0}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="top"><span>Announcement · 2026</span></div>
  <div class="deck">
    <div class="card c3"></div>
    <div class="card c2"></div>
    <div class="card front">
      <div class="kicker row"><span>A new partnership</span></div>
      <div class="logos">
        <div class="logo a"><svg viewBox="0 0 24 24"><path d="M12 2l10 18H2z" fill="#fff"/></svg></div>
        <div class="x">×</div>
        <div class="logo b"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fff"/><circle cx="12" cy="12" r="4" fill="#ff5a36"/></svg></div>
        <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="spark s5"></i><i class="spark s6"></i>
      </div>
      <div class="h1"><div class="row"><span>Acme × Northwind</span></div></div>
      <div class="sub row"><span>Bringing shared inventory and one checkout to every store, together.</span></div>
      <div class="pill">Read the announcement →</div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 7 });
  gsap.set('.card', { y: 760, rotateX: 22, scale: 0.85 });
  gsap.set('.logo.a', { x: -320, rotate: -25, opacity: 0 });
  gsap.set('.logo.b', { x: 320, rotate: 25, opacity: 0 });
  gsap.set('.x', { scale: 0 });
  gsap.set('.row span', { yPercent: 110 });
  gsap.set('.pill', { y: 80, opacity: 0 });
  // polished stacked reveal: three cards land, back to front, each settling a step higher
  tl.to('.c3', { y: -44, rotateX: 0, scale: 0.9, duration: 1.0, ease: 'expo.out' }, 0)
    .to('.c2', { y: -22, rotateX: 0, scale: 0.95, duration: 1.0, ease: 'expo.out' }, 0.14)
    .to('.front', { y: 0, rotateX: 0, scale: 1, duration: 1.0, ease: 'expo.out' }, 0.28)
    .to('.top span', { yPercent: 0, duration: 0.6, ease: 'expo.out' }, 0.3)
    .to('.kicker span', { yPercent: 0, duration: 0.6, ease: 'expo.out' }, 0.9);
  // the two logos collide at the centre and settle
  tl.to('.logo.a', { x: 0, rotate: 0, opacity: 1, duration: 0.7, ease: 'expo.out' }, 1.0)
    .to('.logo.b', { x: 0, rotate: 0, opacity: 1, duration: 0.7, ease: 'expo.out' }, 1.0)
    .fromTo('.logo', { scaleX: 1.1, scaleY: 0.9 }, { scaleX: 1, scaleY: 1, duration: 0.6, ease: 'elastic.out(1,0.4)' }, 1.5)
    .to('.x', { scale: 1, duration: 0.6, ease: 'back.out(3)' }, 1.45);
  // sparks burst from the collision
  const r = fx.rng(7);
  document.querySelectorAll('.spark').forEach((s, i) => {
    const a = (i / 6) * Math.PI * 2 + r() * 0.5, d = 120 + r() * 80;
    tl.fromTo(s, { x: 0, y: 0, opacity: 1, scale: 1 }, { x: Math.cos(a) * d, y: Math.sin(a) * d, opacity: 0, scale: 0.2, duration: 0.7, ease: 'power3.out' }, 1.5);
  });
  tl.to('.h1 span', { yPercent: 0, duration: 0.7, ease: 'expo.out' }, 1.8)
    .to('.sub span', { yPercent: 0, duration: 0.7, ease: 'expo.out' }, 1.95)
    .to('.pill', { y: 0, opacity: 1, duration: 0.7, ease: 'back.out(2)' }, 2.2);
  // idle: the whole deck floats in 3D
  tl.to('.deck', { rotateY: -6, rotateX: 4, duration: 2, ease: 'sine.inOut' }, 2.4)
    .to('.deck', { rotateY: 6, rotateX: -3, duration: 2, ease: 'sine.inOut' }, 4.4)
    .to('.deck', { rotateY: 0, rotateX: 0, duration: 0.6, ease: 'sine.inOut' }, 6.4);
  // exit: text drops, cards fly up in order
  tl.to('.row span', { yPercent: -110, duration: 0.3, ease: 'expo.in', stagger: 0.04 }, 6.1)
    .to('.pill', { y: 80, opacity: 0, duration: 0.3, ease: 'expo.in' }, 6.15)
    .to('.logo, .x', { scale: 0, duration: 0.3, ease: 'expo.in' }, 6.2)
    .to('.front', { y: -1000, duration: 0.5, ease: 'expo.in' }, 6.4)
    .to('.c2', { y: -1000, duration: 0.5, ease: 'expo.in' }, 6.48)
    .to('.c3', { y: -1000, duration: 0.5, ease: 'expo.in' }, 6.56)
    .to('.top span', { yPercent: -110, duration: 0.3, ease: 'expo.in' }, 6.6);
</script>
