<!doctype html><meta charset="utf-8">
<title>The Stack: Livestream</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0a0a0c;color:#fff;perspective:1400px}
  .bg{position:absolute;inset:-10%;background:url("../../../assets/backgrounds/drift-ember.mp4");}
  video{position:absolute;inset:-5%;width:110%;height:110%;object-fit:cover;filter:brightness(.55) saturate(1.3)}
  .card{position:absolute;left:120px;top:190px;width:840px;height:700px;border-radius:36px;background:#141418;box-shadow:0 60px 120px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.08);overflow:hidden;transform-style:preserve-3d;will-change:transform}
  .card.back{background:#1c1c22;transform-origin:center}
  .thumb{position:absolute;left:0;right:0;top:0;height:420px;overflow:hidden;background:linear-gradient(135deg,#ff3d3d,#ff8a3d)}
  .thumb .v{position:absolute;inset:0;background:url("../../../assets/backgrounds/sunset.png") center/cover;mix-blend-mode:luminosity;opacity:.7}
  .live{position:absolute;left:28px;top:28px;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;background:#ff2d2d;font-family:"Sharp Grotesk",sans-serif;font-size:18px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;transform-origin:left center;will-change:transform}
  .live i{width:10px;height:10px;border-radius:50%;background:#fff;display:block}
  .viewers{position:absolute;right:28px;top:28px;padding:10px 14px;border-radius:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);font-size:16px;font-variant-numeric:tabular-nums;will-change:transform}
  .viewers b{font-weight:500}
  .meta{position:absolute;left:36px;right:36px;top:450px}
  .row{overflow:hidden}
  .row span{display:block;will-change:transform}
  .kicker{font-family:"Sharp Grotesk",sans-serif;font-size:15px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;margin-bottom:14px}
  .h1{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:58px;letter-spacing:-.03em;line-height:1.02}
  .foot{position:absolute;left:36px;right:36px;bottom:32px;display:flex;align-items:center;justify-content:space-between}
  .who{display:flex;align-items:center;gap:12px;font-size:17px}
  .who i{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ffd23f,#ff5a36);display:block}
  .btn{padding:14px 22px;border-radius:14px;background:#fff;color:#111;font-weight:500;font-size:17px;will-change:transform}
  .bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.15)}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:#ff2d2d;transform-origin:left}
  .top{position:absolute;left:120px;top:110px;font-family:"Sharp Grotesk",sans-serif;font-size:16px;letter-spacing:.3em;text-transform:uppercase;opacity:.7;overflow:hidden}
  .top span{display:block}
</style>
<div class="stage">
  <video muted playsinline preload="auto" src="../../../assets/backgrounds/drift-ember.mp4"></video>
  <div class="top"><span>Acme Studio · Live in 10 min</span></div>
  <div class="card back"></div>
  <div class="card">
    <div class="thumb"><div class="v"></div>
      <div class="live"><i></i>Live</div>
      <div class="viewers"><b class="n">2,418</b> watching</div>
      <div class="bar"><i></i></div>
    </div>
    <div class="meta">
      <div class="row"><span class="kicker">Thursday · 6 PM CET</span></div>
      <div class="h1"><div class="row"><span>Building the</span></div><div class="row"><span>new editor, live.</span></div></div>
    </div>
    <div class="foot">
      <div class="who"><i></i><span>with Mara &amp; Jonas</span></div>
      <div class="btn">Set reminder</div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 6;
  const v = document.querySelector('video');
  fx.wait(new Promise(r => { if (v.readyState >= 2) r(); else v.addEventListener('loadeddata', r, { once: true }); }));
  const tl = fx.timeline({ duration: D });
  tl.eventCallback('onUpdate', () => { v.currentTime = (tl.time() % (v.duration || 1)); });
  // the original seek must also drive the video when nothing else changes
  const seekApi = window.__fx.seek; window.__fx.seek = t => { seekApi(t); v.currentTime = t % (v.duration || 1); };

  const num = { v: 2418 }, el = document.querySelector('.n');
  gsap.set('.card', { y: 900, rotateX: 18, scale: 0.9 });
  gsap.set('.live, .btn', { scale: 0 });
  gsap.set('.viewers', { x: 60, opacity: 0 });
  gsap.set('.row span', { yPercent: 110 });
  gsap.set('.bar i', { scaleX: 0 });
  // bold entrance: the stack slams up from below, back card lags
  tl.to('.card.back', { y: 0, rotateX: 0, scale: 0.94, duration: 0.9, ease: 'expo.out' }, 0.05)
    .to('.card.back', { y: -22, duration: 0.6, ease: 'power2.out' }, 0.5)
    .to('.card:not(.back)', { y: 0, rotateX: 0, scale: 1, duration: 0.9, ease: 'expo.out' }, 0.15)
    .fromTo('.card:not(.back)', { scaleY: 1.06 }, { scaleY: 1, duration: 0.5, ease: 'elastic.out(1,0.5)' }, 0.75)
    .to('.top span', { yPercent: 0, duration: 0.6, ease: 'expo.out' }, 0.2)
    .to('.live', { scale: 1, duration: 0.55, ease: 'back.out(3)' }, 0.7)
    .to('.viewers', { x: 0, opacity: 1, duration: 0.5, ease: 'expo.out' }, 0.8)
    .to('.row span', { yPercent: 0, stagger: 0.08, duration: 0.7, ease: 'expo.out' }, 0.85)
    .to('.btn', { scale: 1, duration: 0.5, ease: 'back.out(2.5)' }, 1.2)
    .to('.bar i', { scaleX: 1, duration: D - 1.5, ease: 'none' }, 0.9);
  // live badge pulses, viewers tick up
  tl.fromTo('.live i', { scale: 1, opacity: 1 }, { scale: 0.4, opacity: 0.4, duration: 0.45, yoyo: true, repeat: 9, ease: 'sine.inOut' }, 1.0);
  tl.to(num, { v: 3106, duration: 4, ease: 'power1.inOut', onUpdate: () => { el.textContent = Math.round(num.v).toLocaleString('en-US'); } }, 1.2);
  // a punchy scale-hit on the headline to keep it immediate
  tl.to('.h1', { scale: 1.03, duration: 0.25, ease: 'power2.out' }, 3.0).to('.h1', { scale: 1, duration: 0.5, ease: 'elastic.out(1,0.5)' }, 3.25);
  // exit: the stack shoots up and out
  tl.to('.row span', { yPercent: -110, duration: 0.3, ease: 'expo.in', stagger: 0.04 }, 5.1)
    .to('.top span', { yPercent: -110, duration: 0.3, ease: 'expo.in' }, 5.3)
    .to('.card:not(.back)', { y: -1100, rotateX: -12, duration: 0.5, ease: 'expo.in' }, 5.35)
    .to('.card.back', { y: -1100, duration: 0.5, ease: 'expo.in' }, 5.45);
</script>
