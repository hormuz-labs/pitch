<!doctype html><meta charset="utf-8">
<title>The Stack: Sale</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#ff3d3d;color:#111;perspective:1400px}
  .stripes{position:absolute;inset:-20%;background:repeating-linear-gradient(-30deg,rgba(255,255,255,.08) 0 40px,transparent 40px 80px);will-change:transform}
  .deck{position:absolute;left:120px;top:170px;width:840px;height:740px;transform-style:preserve-3d}
  .card{position:absolute;inset:0;border-radius:36px;background:#fff;box-shadow:0 40px 80px rgba(0,0,0,.3);transform-origin:center;will-change:transform;overflow:hidden}
  .c2{background:#ffd23f}.c3{background:#111}
  .front{padding:56px;display:flex;flex-direction:column;justify-content:space-between}
  .row{overflow:hidden}.row span{display:block;will-change:transform}
  .kick{font-family:"Sharp Grotesk",sans-serif;font-size:18px;letter-spacing:.3em;text-transform:uppercase}
  .big{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:220px;letter-spacing:-.06em;line-height:.9;display:flex;align-items:baseline}
  .big .pct{font-size:110px;margin-left:8px}
  .big .n{display:inline-block;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
  .off{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:88px;letter-spacing:-.04em;line-height:1;color:#ff3d3d}
  .prices{display:flex;align-items:baseline;gap:22px;margin-top:6px}
  .was{font-size:34px;color:#888;position:relative;font-variant-numeric:tabular-nums}
  .was i{position:absolute;left:0;right:0;top:55%;height:4px;background:#ff3d3d;transform-origin:left;display:block}
  .now{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:60px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .foot{display:flex;justify-content:space-between;align-items:center}
  .code{padding:14px 20px;border:2px dashed #111;border-radius:14px;font-size:20px;font-weight:500;letter-spacing:.1em;will-change:transform}
  .btn{padding:16px 26px;border-radius:99px;background:#111;color:#fff;font-size:20px;font-weight:500;will-change:transform}
  .tag{position:absolute;right:60px;top:100px;width:150px;height:150px;border-radius:50%;background:#111;color:#ffd23f;display:flex;align-items:center;justify-content:center;text-align:center;font-family:"Sharp Grotesk",sans-serif;font-size:22px;line-height:1.1;font-weight:500;letter-spacing:-.01em;will-change:transform}
</style>
<div class="stage">
  <div class="stripes"></div>
  <div class="deck">
    <div class="card c3"></div>
    <div class="card c2"></div>
    <div class="card front">
      <div class="kick row"><span>Northwind · Summer sale</span></div>
      <div>
        <div class="big"><span class="n">0</span><span class="pct">%</span></div>
        <div class="off row"><span>off everything</span></div>
        <div class="prices"><div class="was">$120<i></i></div><div class="now"><span class="p">$120</span></div></div>
      </div>
      <div class="foot"><div class="code">CODE: SUMMER40</div><div class="btn">Shop now →</div></div>
    </div>
  </div>
  <div class="tag">48h<br>only</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 6 });
  const nEl = document.querySelector('.big .n'), pEl = document.querySelector('.now .p');
  const st = { n: 0, p: 120 };
  gsap.set('.card', { y: 900, rotate: 8 });
  gsap.set('.row span', { yPercent: 110 });
  gsap.set('.big', { opacity: 0, y: 40 });
  gsap.set('.was i', { scaleX: 0 });
  gsap.set('.code, .btn', { scale: 0 });
  gsap.set('.tag', { scale: 0, rotate: -30 });
  tl.fromTo('.stripes', { x: 0 }, { x: 92, duration: 6, ease: 'none' }, 0);
  // stacked card reveals, each with a slight rotation that straightens on landing
  tl.to('.c3', { y: 0, rotate: -6, duration: 0.9, ease: 'move' }, 0)
    .to('.c2', { y: 0, rotate: 4, duration: 0.9, ease: 'move' }, 0.12)
    .to('.front', { y: 0, rotate: 0, duration: 0.9, ease: 'move' }, 0.24)
    .to('.c3', { rotate: -4, duration: 0.6, ease: 'elastic.out(1,0.5)' }, 0.9)
    .to('.c2', { rotate: 2.5, duration: 0.6, ease: 'elastic.out(1,0.5)' }, 0.95)
    .to('.kick span', { yPercent: 0, duration: 0.6, ease: 'expo.out' }, 0.7);
  // animated pricing: the percentage counts up with a landing squash, the old price gets struck, the new price rolls down
  tl.to('.big', { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, 0.9)
    .to(st, { n: 40, duration: 1.1, ease: 'power3.out', onUpdate: () => { nEl.textContent = Math.round(st.n); } }, 0.9)
    .fromTo('.big', { scaleY: 1.15, scaleX: 0.92 }, { scaleY: 1, scaleX: 1, duration: 0.6, ease: 'elastic.out(1,0.4)' }, 1.95)
    .to('.off span', { yPercent: 0, duration: 0.6, ease: 'expo.out' }, 1.3)
    .to('.was i', { scaleX: 1, duration: 0.4, ease: 'expo.out' }, 2.2)
    .to(st, { p: 72, duration: 0.8, ease: 'power3.out', onUpdate: () => { pEl.textContent = '$' + Math.round(st.p); } }, 2.4)
    .fromTo('.now', { color: '#111' }, { color: '#ff3d3d', duration: 0.3 }, 2.5)
    .to('.code', { scale: 1, duration: 0.5, ease: 'back.out(2.5)' }, 2.6)
    .to('.btn', { scale: 1, duration: 0.5, ease: 'back.out(2.5)' }, 2.75)
    .to('.tag', { scale: 1, rotate: 12, duration: 0.7, ease: 'elastic.out(1,0.45)' }, 2.9);
  // idle: tag wobbles, button pulses
  tl.to('.tag', { rotate: 4, duration: 0.8, ease: 'sine.inOut', yoyo: true, repeat: 2 }, 3.6)
    .fromTo('.btn', { scale: 1 }, { scale: 1.06, duration: 0.4, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 3.6);
  // exit
  tl.to('.row span', { yPercent: -110, duration: 0.3, ease: 'expo.in', stagger: 0.04 }, 5.2)
    .to('.big, .prices', { opacity: 0, y: -30, duration: 0.3, ease: 'expo.in' }, 5.25)
    .to('.code, .btn, .tag', { scale: 0, duration: 0.3, ease: 'expo.in' }, 5.3)
    .to('.front', { y: -1100, rotate: -6, duration: 0.5, ease: 'expo.in' }, 5.45)
    .to('.c2', { y: -1100, duration: 0.5, ease: 'expo.in' }, 5.52)
    .to('.c3', { y: -1100, duration: 0.5, ease: 'expo.in' }, 5.58);
</script>
