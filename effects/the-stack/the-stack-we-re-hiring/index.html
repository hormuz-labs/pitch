<!doctype html><meta charset="utf-8">
<title>The Stack: We're Hiring</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#e9f1ff;color:#111;perspective:1500px}
  .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.7;will-change:transform}
  .b1{width:600px;height:600px;left:-150px;top:-120px;background:#9ab8ff}
  .b2{width:520px;height:520px;right:-120px;bottom:-140px;background:#ffd6a5}
  .hd{position:absolute;left:100px;top:96px;right:100px}
  .row{overflow:hidden}.row span{display:block;will-change:transform}
  .kick{font-family:"Sharp Grotesk",sans-serif;font-size:16px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;margin-bottom:10px}
  .h1{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:78px;letter-spacing:-.045em;line-height:.95}
  .deck{position:absolute;left:100px;top:360px;width:880px;height:560px;transform-style:preserve-3d}
  .card{position:absolute;left:0;right:0;top:0;height:150px;border-radius:24px;background:#fff;box-shadow:0 20px 50px rgba(20,40,90,.15);padding:0 36px;display:flex;align-items:center;gap:22px;transform-origin:center;will-change:transform,opacity}
  .card .ic{width:64px;height:64px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center}
  .card .ic i{width:26px;height:26px;border-radius:7px;background:#fff;display:block}
  .c1 .ic{background:#111}.c2 .ic{background:#6b8bff}.c3 .ic{background:#ff5a36}
  .card b{display:block;font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:30px;letter-spacing:-.02em}
  .card small{font-size:17px;color:#777}
  .card .pill{margin-left:auto;padding:10px 16px;border-radius:99px;background:#eef2f9;font-size:15px;font-weight:500;white-space:nowrap}
  .card .arrow{width:44px;height:44px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;will-change:transform}
  .cta{position:absolute;left:100px;bottom:80px;display:flex;align-items:center;gap:18px}
  .cta .btn{padding:20px 30px;border-radius:99px;background:#111;color:#fff;font-size:22px;font-weight:500;will-change:transform}
  .cta .cnt{font-size:18px;color:#555}
  .cnt b{font-weight:500;color:#111;font-variant-numeric:tabular-nums}
  .faces{position:absolute;right:100px;bottom:84px;display:flex}
  .faces i{width:52px;height:52px;border-radius:50%;border:3px solid #e9f1ff;margin-left:-14px;background:linear-gradient(135deg,#ffb84d,#ff5a36);display:block;will-change:transform}
  .faces i:nth-child(2){background:linear-gradient(135deg,#6b8bff,#4dd6a8)}
  .faces i:nth-child(3){background:linear-gradient(135deg,#c46bff,#5b6cff)}
  .faces i:nth-child(4){background:#111}
</style>
<div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="hd">
    <div class="kick row"><span>Acme · Careers</span></div>
    <div class="h1"><div class="row"><span>We're hiring.</span></div><div class="row"><span>Come build with us.</span></div></div>
  </div>
  <div class="deck">
    <div class="card c3"><div class="ic"><i></i></div><div><b>Product Designer</b><small>Berlin or remote</small></div><span class="pill">Full-time</span><div class="arrow">→</div></div>
    <div class="card c2"><div class="ic"><i></i></div><div><b>Backend Engineer</b><small>Remote · Europe</small></div><span class="pill">Full-time</span><div class="arrow">→</div></div>
    <div class="card c1"><div class="ic"><i></i></div><div><b>Senior Frontend Engineer</b><small>Remote · Worldwide</small></div><span class="pill">Full-time</span><div class="arrow">→</div></div>
  </div>
  <div class="cta"><div class="btn">See all roles</div><div class="cnt"><b class="n">0</b> open positions</div></div>
  <div class="faces"><i></i><i></i><i></i><i></i></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 9;
  const tl = fx.timeline({ duration: D });
  const cards = ['.c1', '.c2', '.c3'];
  const st = { n: 0 }, nEl = document.querySelector('.cnt .n');
  gsap.set('.row span', { yPercent: 110 });
  // start stacked: three cards on top of each other, slightly offset
  cards.forEach((c, i) => gsap.set(c, { y: i * 14 + 600, scale: 1 - i * 0.05, opacity: 0, rotateX: 30 }));
  gsap.set('.cta .btn', { scale: 0 });
  gsap.set('.cta .cnt', { opacity: 0, x: -20 });
  gsap.set('.faces i', { scale: 0 });
  tl.to('.b1', { x: 80, y: 60, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
    .to('.b2', { x: -70, y: -50, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  tl.to('.row span', { yPercent: 0, stagger: 0.1, duration: 0.8, ease: 'expo.out' }, 0.1);
  // polished card reveal: the stack rises as one, then fans down into a list
  cards.forEach((c, i) => tl.to(c, { y: i * 14, opacity: 1, rotateX: 0, duration: 1.0, ease: 'expo.out' }, 0.5 + i * 0.08));
  cards.forEach((c, i) => tl.to(c, { y: i * 172, scale: 1, duration: 0.9, ease: 'back.out(1.5)' }, 1.7 + i * 0.1));
  tl.to(st, { n: 12, duration: 1, ease: 'power2.out', onUpdate: () => { nEl.textContent = Math.round(st.n); } }, 2.4)
    .to('.cta .btn', { scale: 1, duration: 0.6, ease: 'back.out(2.5)' }, 2.3)
    .to('.cta .cnt', { opacity: 1, x: 0, duration: 0.5, ease: 'expo.out' }, 2.5)
    .to('.faces i', { scale: 1, stagger: 0.08, duration: 0.5, ease: 'back.out(3)' }, 2.6);
  // idle: rows take turns lifting like a hover, the arrow nudges
  for (let i = 0; i < 3; i++) {
    const t = 3.6 + i * 1.2;
    tl.to(cards[i], { x: 16, boxShadow: '0 30px 60px rgba(20,40,90,.22)', duration: 0.5, ease: 'power3.out' }, t)
      .to(`${cards[i]} .arrow`, { x: 8, duration: 0.4, ease: 'power3.out' }, t)
      .to(cards[i], { x: 0, boxShadow: '0 20px 50px rgba(20,40,90,.15)', duration: 0.5, ease: 'power3.inOut' }, t + 0.6)
      .to(`${cards[i]} .arrow`, { x: 0, duration: 0.4, ease: 'power3.inOut' }, t + 0.6);
  }
  tl.fromTo('.cta .btn', { scale: 1 }, { scale: 1.05, duration: 0.5, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 6.0);
  // exit: cards restack, then the stack drops away
  cards.forEach((c, i) => tl.to(c, { y: i * 14, scale: 1 - i * 0.05, duration: 0.6, ease: 'expo.inOut' }, 7.6 + (2 - i) * 0.06));
  tl.to('.card', { y: '+=700', rotateX: 30, opacity: 0, duration: 0.5, ease: 'expo.in', stagger: 0.05 }, 8.3)
    .to('.row span', { yPercent: -110, duration: 0.3, ease: 'expo.in', stagger: 0.05 }, 8.35)
    .to('.cta .btn, .faces i', { scale: 0, duration: 0.3, ease: 'expo.in' }, 8.45)
    .to('.cta .cnt', { opacity: 0, duration: 0.2 }, 8.5);
</script>
