<!doctype html><meta charset="utf-8">
<title>Step Progress</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  /* Palette — every colour in this effect derives from these tokens; change
     them to re-brand it. Shadows stay black: they are darkness, not brand. */
  :root{
    --bg:#f3f2ee; --surface:#ffffff; --ink:#141414; --muted:#77756f;
    --accent:#ff5a1f; --accent-2:#ffb347; --on-accent:#ffffff; --positive:#22a06b;
    --line:color-mix(in srgb,var(--ink) 10%,transparent);
    --track:color-mix(in srgb,var(--ink) 12%,var(--bg));
  }
  .stage{background:radial-gradient(ellipse 75% 65% at 50% 45%,var(--surface) 0%,var(--bg) 75%)}
  .title{position:absolute;left:120px;top:84px;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:44px;letter-spacing:-.04em;color:var(--ink)}
  .steps{position:absolute;left:120px;top:186px;width:440px}
  .step{position:relative;height:112px;padding-left:72px}
  .node{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--track);display:grid;place-items:center;font-size:16px;font-weight:500;color:var(--muted)}
  .node .fill{position:absolute;inset:-2px;border-radius:50%;background:var(--accent);transform:scale(0)}
  .node svg{position:absolute;width:20px;height:20px;color:var(--on-accent);opacity:0}
  .node .num{position:relative}
  .pulse{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);opacity:0}
  .rail{position:absolute;left:21px;top:48px;width:2px;height:60px;border-radius:1px;background:var(--track);overflow:hidden}
  .rail i{position:absolute;inset:0;background:var(--accent);transform-origin:50% 0;transform:scaleY(0)}
  .lbl{font-size:21px;font-weight:500;color:var(--muted);padding-top:9px}
  .sub{margin-top:6px;font-size:16px;color:var(--muted);opacity:0}
  .panel{position:absolute;left:640px;top:150px;width:520px;height:420px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:0 30px 70px -30px rgba(0,0,0,.25);overflow:hidden}
  .view{position:absolute;inset:0;padding:40px;display:flex;flex-direction:column;justify-content:flex-end;opacity:0}
  .view .ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent);margin-bottom:auto}
  .view .ic svg{width:30px;height:30px}
  .view h3{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:36px;letter-spacing:-.035em;color:var(--ink)}
  .view p{margin-top:10px;font-size:18px;line-height:1.5;color:var(--muted)}
  .burst{position:absolute;left:22px;top:22px;width:0;height:0}
  .burst i{position:absolute;left:-2px;top:-14px;width:4px;height:14px;border-radius:2px;background:var(--accent);transform-origin:2px 14px;opacity:0}
</style>
<div class="stage">
  <div class="title">Set up in four steps</div>
  <div class="steps"></div>
  <div class="panel"></div>
</div>
<script src="../../_lib/fx.js"></script>
<script>
  fx.wait(document.fonts.load('500 44px "Sharp Grotesk"'));
  fx.wait(document.fonts.load('500 21px "Atlas Grotesk"'));
  const D = 7;
  const clamp = (x) => Math.max(0, Math.min(1, x));
  function bezier(x1, y1, x2, y2) {
    const B = (a, b, t) => 3 * a * t * (1 - t) * (1 - t) + 3 * b * t * t * (1 - t) + t * t * t;
    return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1; for (let k = 0; k < 28; k++) { const m = (lo + hi) / 2; if (B(x1, x2, m) < x) lo = m; else hi = m; } return B(y1, y2, (lo + hi) / 2); };
  }
  // Flow curves (effects/flow-easing).
  const flowCubic = bezier(0.66, 0, 0.34, 1), flowQuintOut = bezier(0.22, 1, 0.36, 1), flowCubicIn = bezier(0.4, 0, 0.68, 0.06);
  /* A damped spring as an ease: starts from rest, overshoots ~10% once and
     settles to rest. Zero velocity at both ends, which a bezier back-out
     (still moving on its last frame) cannot give. */
  const softSpring = (p) => {
    if (p <= 0) return 0;
    if (p >= 1) return 1;
    const s = (x) => 1 - Math.exp(-8 * x) * (Math.cos(11 * x) + (8 / 11) * Math.sin(11 * x));
    return s(p) / s(1);
  };
  const soft = (t, a, b) => { const p = clamp((t - a) / (b - a)); return p * p * (3 - 2 * p); };
  const mixc = (a, b, p) => `color-mix(in srgb,var(${b}) ${(p * 100).toFixed(1)}%,var(${a}))`;

  const ICONS = {
    plug: '<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 01-12 0zM12 17v4"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M3 20c.8-3.6 3.2-5.5 6-5.5s5.2 1.9 6 5.5M16 4.5a3.5 3.5 0 010 7M18 14.5c2 .8 3 2.7 3.4 5.5"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    rocket: '<path d="M12 15l-3-3c1.5-5 5-8 10-8 0 5-3 8.5-8 10zM9 12l-4 1 2-4h4M12 15l-1 4 4-2v-4"/>',
  };
  const STEPS = [
    ['Connect your data', 'Sync from 120+ sources', 'plug', 'Connect your data', 'Pull in billing, product and CRM events in a couple of clicks.'],
    ['Invite your team', 'Roles and access in seconds', 'users', 'Invite your team', 'Everyone sees the same numbers, with the right permissions.'],
    ['Build a dashboard', 'Start from a template', 'chart', 'Build a dashboard', 'Drag in charts, set goals and share a live link.'],
    ['Go live', 'Alerts on the metrics that matter', 'rocket', 'You’re live', 'Your team gets alerts the moment something moves.'],
  ];
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const steps = document.querySelector('.steps'), panel = document.querySelector('.panel');
  STEPS.forEach(([lbl, sub, ic, h, p], i) => {
    steps.insertAdjacentHTML('beforeend', `<div class="step"><div class="pulse"></div><div class="node"><span class="fill"></span><span class="num">${i + 1}</span>${CHECK}</div>${i < STEPS.length - 1 ? '<div class="rail"><i></i></div>' : ''}<div class="lbl">${lbl}</div><div class="sub">${sub}</div>${i === STEPS.length - 1 ? '<div class="burst">' + '<i></i>'.repeat(8) + '</div>' : ''}</div>`);
    panel.insertAdjacentHTML('beforeend', `<div class="view"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[ic]}</svg></div><h3>${h}</h3><p>${p}</p></div>`);
  });
  const S = [...steps.querySelectorAll('.step')], V = [...panel.querySelectorAll('.view')];
  const burst = [...document.querySelectorAll('.burst i')];
  const title = document.querySelector('.title');

  // Step k becomes active at ACT[k] and completes at DONE[k]; the rail to the
  // next step fills between them.
  const ACT = [0.6, 2.05, 3.2, 4.35], DONE = [1.75, 2.9, 4.05, 5.0];

  function draw(t) {
    const enter = flowQuintOut(clamp((t - 0.1) / 0.8));
    const exit = flowCubicIn(clamp((t - 6.3) / 0.55));
    for (const el of [title, steps, panel]) {
      el.style.opacity = (soft(t, 0.1, 0.75) * (1 - soft(t, 6.3, 6.85))).toFixed(3);
      el.style.translate = `0 ${((1 - enter) * 20 - exit * 14).toFixed(2)}px`;
    }
    S.forEach((s, k) => {
      const act = clamp((t - ACT[k]) / 0.35), done = clamp((t - DONE[k]) / 0.45);
      const fill = softSpring(clamp((t - DONE[k]) / 0.55));
      s.querySelector('.fill').style.transform = `scale(${fill.toFixed(4)})`;
      const chk = s.querySelector('svg');
      chk.style.opacity = clamp((t - DONE[k] - 0.1) / 0.2).toFixed(3);
      chk.style.transform = `scale(${(0.5 + 0.5 * softSpring(clamp((t - DONE[k] - 0.1) / 0.5))).toFixed(4)})`;
      s.querySelector('.num').style.opacity = (1 - done).toFixed(3);
      s.querySelector('.node').style.borderColor = mixc('--track', '--accent', flowCubic(act));
      s.querySelector('.node').style.color = mixc('--muted', '--accent', flowCubic(act));
      s.querySelector('.lbl').style.color = mixc('--muted', '--ink', flowCubic(act));
      const sub = s.querySelector('.sub');
      sub.style.opacity = soft(t, ACT[k], ACT[k] + 0.4).toFixed(3);
      sub.style.translate = `0 ${((1 - flowQuintOut(act)) * 8).toFixed(2)}px`;
      // Active (not yet done) steps breathe with a soft pulse ring.
      const pr = s.querySelector('.pulse');
      const ph = (t - ACT[k]) / 0.9;
      const live = t >= ACT[k] && t < DONE[k];
      const f = ph - Math.floor(ph);
      pr.style.opacity = live ? ((1 - f) * 0.45 * Math.min(1, (DONE[k] - t) / 0.2)).toFixed(3) : 0;
      pr.style.transform = `scale(${(1 + flowQuintOut(f) * 0.55).toFixed(4)})`;
      const rail = s.querySelector('.rail i');
      if (rail) rail.style.transform = `scaleY(${flowCubic(clamp((t - DONE[k]) / (ACT[k + 1] - DONE[k] + 0.25))).toFixed(4)})`;
      // Panel views hand over in sequence — the old view slides out, then the
      // new one slides in — so two blocks of text never overlap.
      const vIn = flowQuintOut(clamp((t - ACT[k] - (k ? 0.2 : 0)) / 0.6));
      const vOut = k < S.length - 1 ? flowCubicIn(clamp((t - ACT[k + 1]) / 0.2)) : 0;
      const v0 = ACT[k] + (k ? 0.2 : 0);
      V[k].style.opacity = (soft(t, v0, v0 + 0.45) * (k < S.length - 1 ? 1 - soft(t, ACT[k + 1], ACT[k + 1] + 0.2) : 1)).toFixed(3);
      V[k].style.translate = `${((1 - vIn) * 30 - vOut * 30).toFixed(2)}px 0`;
    });
    // Completion burst on the final node: eight strokes shoot out and fade.
    const b = clamp((t - DONE[3] - 0.08) / 0.6);
    burst.forEach((el, i) => {
      const e = flowQuintOut(b);
      el.style.opacity = b > 0 && b < 1 ? (1 - b).toFixed(3) : 0;
      el.style.transform = `rotate(${i * 45}deg) translateY(${(-22 - e * 26).toFixed(2)}px) scaleY(${(1 - e * 0.6).toFixed(3)})`;
    });
  }
  fx.register({ duration: D, seek: draw });

  // Sound, on the same beats as the picture (film cue-sheet format; see fx.js).
  // Pitch SaaS pack (ElevenLabs-generated): glitch accents, deep whooshes and
  // crisp UI sounds; signature moments name their clip. Clips carry measured
  // hit points, so each lands on its beat without hand-set leads.
  fx.sfx([
    { t: 0.3, event: 'whoosh_deep', label: 'in' },
    ...ACT.slice(1).map((t) => ({ t, event: 'glitch', clip: 'pitch-glitch-tick', label: 'step active' })),
    ...DONE.slice(0, 3).map((t) => ({ t: t + 0.08, event: 'glitch', clip: 'pitch-glitch-blip', label: 'step done' })),
    { t: DONE[3] + 0.1, event: 'success', clip: 'pitch-success', label: 'all done' },
    { t: 6.45, event: 'whoosh_deep', label: 'exit' },
  ]);
</script>
