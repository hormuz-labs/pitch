<!doctype html><meta charset="utf-8">
<title>3D Cursor Flythrough</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  /* Palette — every colour in this effect derives from these tokens. */
  :root{
    --bg:#f3f2ee; --surface:#ffffff; --ink:#141414; --muted:#7a7873;
    --accent:#ff5a1f; --accent-2:#ffb347; --positive:#22a06b;
    --cursor:#141414; --cursor-rim:#ffffff;
    --line:color-mix(in srgb,var(--ink) 9%,transparent);
    --soft:color-mix(in srgb,var(--ink) 4%,var(--surface));
  }
  .stage{background:var(--bg)}
  .ui{position:absolute;inset:0;will-change:opacity,transform}
  .nav{position:absolute;left:40px;right:40px;top:28px;height:56px;display:flex;align-items:center;gap:6px;padding:0 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
  .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));margin-right:18px}
  .tab{position:relative;height:36px;padding:0 16px;display:grid;place-items:center;font-size:15px;color:var(--muted);border-radius:10px}
  .tab .hov{position:absolute;inset:0;border-radius:10px;background:var(--soft);opacity:0}
  .tab b{position:relative;font-weight:500}
  .tab.on{color:var(--ink)}
  .search{margin-left:auto;width:220px;height:36px;border-radius:10px;background:var(--soft);display:flex;align-items:center;padding:0 12px;font-size:14px;color:var(--muted)}
  .me{width:32px;height:32px;border-radius:50%;margin-left:12px;background:linear-gradient(135deg,var(--accent-2),var(--accent))}
  .card{position:absolute;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 4%,transparent)}
  .rev{left:40px;top:108px;width:760px;height:360px;padding:24px 28px}
  .lbl{font-size:15px;color:var(--muted)}
  .big{margin-top:6px;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:40px;letter-spacing:-.03em;color:var(--ink)}
  .rev svg{position:absolute;left:28px;top:140px;width:704px;height:190px;overflow:visible}
  .tip{position:absolute;padding:8px 12px;border-radius:10px;background:var(--ink);color:var(--surface);font-size:14px;font-weight:500;white-space:nowrap;opacity:0;transform-origin:50% 100%}
  .plan{left:824px;top:108px;width:416px;height:360px;padding:26px 28px;display:flex;flex-direction:column}
  .plan h3{margin-top:8px;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:30px;letter-spacing:-.03em;color:var(--ink)}
  .plan p{margin-top:10px;font-size:16px;line-height:1.5;color:var(--muted)}
  .btn{position:relative;margin-top:auto;height:54px;border-radius:14px;display:grid;place-items:center;font-size:17px;font-weight:500;color:#fff;
    background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent));box-shadow:0 10px 26px -8px color-mix(in srgb,var(--accent) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.3);overflow:hidden}
  .btn span{position:absolute;inset:0;display:grid;place-items:center}
  .btn .ok{background:var(--positive);opacity:0;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn .ok svg{width:18px;height:18px}
  .stats{position:absolute;left:40px;right:40px;top:492px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .stats .card{position:relative;height:150px;padding:22px 26px}
  .stats .v{margin-top:8px;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:32px;letter-spacing:-.03em;color:var(--ink)}
  .ring{position:absolute;left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid var(--accent);opacity:0;z-index:5}
  .shadow{position:absolute;left:0;top:0;width:56px;height:80px;margin:-6px 0 0 -6px;border-radius:40% 60% 50% 50%;background:color-mix(in srgb,var(--ink) 60%,transparent);
    transform-origin:20% 10%;z-index:6;opacity:0;will-change:transform,opacity,filter}
  canvas.out{position:absolute;inset:0;width:1280px;height:720px;z-index:10}
</style>
<div class="stage">
  <div class="ui">
    <div class="nav"><div class="logo"></div><div class="tab on"><b>Overview</b></div><div class="tab t-an"><span class="hov"></span><b>Analytics</b></div><div class="tab"><b>Customers</b></div><div class="tab"><b>Settings</b></div><div class="search">Search…</div><div class="me"></div></div>
    <div class="card rev"><div class="lbl">Revenue · last 30 days</div><div class="big">$48,210</div>
      <svg viewBox="0 0 704 190"><defs><linearGradient id="fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
        <path class="area" fill="url(#fa)"/><path class="line" fill="none" style="stroke:var(--accent)" stroke-width="3" stroke-linecap="round"/><circle class="dot" r="6" style="fill:var(--surface);stroke:var(--accent)" stroke-width="3" opacity="0"/></svg>
      <div class="tip">Oct 18 · $2,140</div></div>
    <div class="card plan"><div class="lbl">Your plan</div><h3>Starter</h3><p>You're at 92% of your monthly events. Upgrade for unlimited events and team seats.</p>
      <div class="btn"><span class="up">Upgrade to Pro</span><span class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>You're on Pro</span></div></div>
    <div class="stats"><div class="card"><div class="lbl">Active users</div><div class="v">12,904</div></div><div class="card"><div class="lbl">Conversion</div><div class="v">4.8%</div></div><div class="card"><div class="lbl">Avg. session</div><div class="v">6m 12s</div></div></div>
  </div>
  <div class="ring"></div>
  <div class="shadow"></div>
  <canvas class="out" width="1280" height="720"></canvas>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script type="module">
import * as THREE from '../../../assets/three/three.module.min.js';

const fontsReady = Promise.all([document.fonts.load('500 40px "Sharp Grotesk"'), document.fonts.load('400 15px "Atlas Grotesk"'), document.fonts.load('500 15px "Atlas Grotesk"')]);

const W = 1280, H = 720, D = 7.2, FPS = 30;
const clamp = (x) => Math.max(0, Math.min(1, x));
const smooth = (t, a, b) => { const p = clamp((t - a) / (b - a)); return p * p * (3 - 2 * p); };
/* Flow curves (effects/flow-easing): cubic in-out for travel, back-out for pops. */
function bezier(x1, y1, x2, y2) {
  const B = (a, b, t) => 3 * a * t * (1 - t) * (1 - t) + 3 * b * t * t * (1 - t) + t * t * t;
  return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1; for (let k = 0; k < 28; k++) { const m = (lo + hi) / 2; if (B(x1, x2, m) < x) lo = m; else hi = m; } return B(y1, y2, (lo + hi) / 2); };
}
const flowCubic = bezier(0.66, 0, 0.34, 1), flowQuintOut = bezier(0.22, 1, 0.36, 1);
/* A damped spring as an ease: starts from rest, overshoots ~10% once and
   settles to rest. Zero velocity at both ends, which a bezier back-out
   (still moving on its last frame) cannot give. */
const softSpring = (p) => {
  if (p <= 0) return 0;
  if (p >= 1) return 1;
  const s = (x) => 1 - Math.exp(-8 * x) * (Math.cos(11 * x) + (8 / 11) * Math.sin(11 * x));
  return s(p) / s(1);
};


/* Palette → numbers for WebGL. */
const probe = document.createElement('div'); document.body.append(probe);
const px = Object.assign(document.createElement('canvas'), { width: 1, height: 1 }).getContext('2d', { willReadFrequently: true });
function rgb(css) { probe.style.color = css; px.clearRect(0, 0, 1, 1); px.fillStyle = getComputedStyle(probe).color; px.fillRect(0, 0, 1, 1); const d = px.getImageData(0, 0, 1, 1).data; return new THREE.Color(d[0] / 255, d[1] / 255, d[2] / 255).convertSRGBToLinear(); }

// ---- the stage chart (DOM/SVG, palette-driven) ----
const DATA = [32, 36, 34, 41, 39, 47, 45, 52, 50, 58, 63, 61, 70, 76];
const cx = (i) => (i / (DATA.length - 1)) * 704, cy = (v) => 190 - ((v - 25) / 60) * 190;
let dPath = `M${cx(0)},${cy(DATA[0])}`;
for (let i = 1; i < DATA.length; i++) { const x0 = cx(i - 1), x1 = cx(i), m = (x0 + x1) / 2; dPath += `C${m},${cy(DATA[i - 1])} ${m},${cy(DATA[i])} ${x1},${cy(DATA[i])}`; }
document.querySelector('.rev .line').setAttribute('d', dPath);
document.querySelector('.rev .area').setAttribute('d', `${dPath}L704,190L0,190Z`);
const HOVER_I = 10;
const dot = document.querySelector('.rev .dot');
dot.setAttribute('cx', cx(HOVER_I)); dot.setAttribute('cy', cy(DATA[HOVER_I]));

// ---- three.js: perspective camera matched to stage pixels at z = 0 ----
const gl = document.createElement('canvas'); gl.width = W; gl.height = H;
const renderer = new THREE.WebGLRenderer({ canvas: gl, alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
const FOV = 32, DIST = (H / 2) / Math.tan((FOV / 2) * Math.PI / 180);
const camera = new THREE.PerspectiveCamera(FOV, W / H, 1, 5000);
camera.position.set(0, 0, DIST);
const scene = new THREE.Scene();

// A small studio for reflections: a dim room with two soft light panels.
const pmrem = new THREE.PMREMGenerator(renderer);
const studio = new THREE.Scene();
studio.add(new THREE.Mesh(new THREE.BoxGeometry(10, 10, 10), new THREE.MeshBasicMaterial({ color: 0x404040, side: THREE.BackSide })));
const panel = (w, h, pos, int) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(int, int, int), side: THREE.DoubleSide })); m.position.set(...pos); m.lookAt(0, 0, 0); studio.add(m); };
panel(6, 2, [-2, 4.5, 3], 6); panel(2, 5, [4.5, 0, 2], 3); panel(4, 4, [0, -4.5, 0], 0.6);
scene.environment = pmrem.fromScene(studio, 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(-300, 500, 700); scene.add(key);

/* The pointer: a rounded arrow, tip at the origin, extruded with a soft bevel.
   Cap and rim are separate materials (palette --cursor / --cursor-rim). */
function rounded(points, r) {
  const s = new THREE.Shape(), n = points.length;
  const at = (i) => points[(i + n) % n];
  for (let i = 0; i < n; i++) {
    const [px0, py0] = at(i - 1), [x, y] = at(i), [nx, ny] = at(i + 1), rr = r[i];
    const a = Math.hypot(x - px0, y - py0), b = Math.hypot(nx - x, ny - y);
    const p1 = [x + (px0 - x) * rr / a, y + (py0 - y) * rr / a], p2 = [x + (nx - x) * rr / b, y + (ny - y) * rr / b];
    if (i === 0) s.moveTo(...p1); else s.lineTo(...p1);
    s.quadraticCurveTo(x, y, ...p2);
  }
  s.closePath();
  return s;
}
const ARROW = [[0, 0], [0, -58], [14.5, -45], [25, -68], [35.5, -63.5], [25.5, -41.5], [44, -41.5]];
const geo = new THREE.ExtrudeGeometry(rounded(ARROW, [2.2, 3, 2, 3, 3, 2, 3]), { depth: 9, bevelEnabled: true, bevelThickness: 3.2, bevelSize: 2.6, bevelSegments: 5, curveSegments: 10 });
geo.translate(0, 0, -6);
geo.scale(1.25, 1.25, 1.25);   // ~85px tall on the page: legible in a 1080p film
const cap = new THREE.MeshPhysicalMaterial({ color: rgb('var(--cursor)'), roughness: 0.32, metalness: 0.05, clearcoat: 1, clearcoatRoughness: 0.12, envMapIntensity: 1.1 });
const rim = new THREE.MeshPhysicalMaterial({ color: rgb('var(--cursor-rim)'), roughness: 0.28, metalness: 0, clearcoat: 0.6, envMapIntensity: 1 });
const pointer = new THREE.Group();
pointer.add(new THREE.Mesh(geo, [cap, rim]));
scene.add(pointer);

// ---- choreography: targets are measured once the fonts have laid out ----
let tab, btn, pt, LEGS;
const btnEl = document.querySelector('.btn');
const center = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
function measure() {
  tab = center(document.querySelector('.t-an'));
  btn = center(btnEl);
  const svgBox = document.querySelector('.rev svg').getBoundingClientRect();
  pt = [svgBox.left + cx(HOVER_I), svgBox.top + cy(DATA[HOVER_I])];
// Waypoints in stage pixels plus height z (toward the camera). Each leg is a
// quadratic arc: lift sets how far it rises off the page mid-flight, side how
// far it bows sideways.
LEGS = [
  { t0: 0.35, t1: 1.75, from: [160, 900, 820], to: [tab[0] + 4, tab[1] + 6, 0], lift: 60, side: 160, ease: flowQuintOut },
  { t0: 2.2, t1: 3.05, from: [tab[0] + 4, tab[1] + 6, 0], to: [btn[0] - 30, btn[1] + 4, 0], lift: 170, side: 70, ease: flowCubic },
  { t0: 3.85, t1: 4.65, from: [btn[0] - 30, btn[1] + 4, 0], to: [pt[0], pt[1], 0], lift: 110, side: -60, ease: flowCubic },
  { t0: 5.55, t1: 6.6, from: [pt[0], pt[1], 0], to: [1500, 120, 620], lift: 60, side: 90, ease: (p) => p * p * p },
];
  const rev = document.querySelector('.rev').getBoundingClientRect();
  tip.style.left = (pt[0] - rev.left - 70) + 'px';
  tip.style.top = (pt[1] - rev.top - 52) + 'px';
}
const CLICK = 3.2;
function pathAt(t) {
  let L = LEGS[0];
  for (const l of LEGS) if (t >= l.t0) L = l;
  const p = L.ease(clamp((t - L.t0) / (L.t1 - L.t0)));
  const [ax, ay, az] = L.from, [bx, by, bz] = L.to;
  const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
  const bow = 4 * p * (1 - p);
  return [ax + dx * p - (dy / len) * L.side * bow, ay + dy * p + (dx / len) * L.side * bow, az + (bz - az) * p + L.lift * bow];
}
/* Stage pixel + height → world position; and back, for the DOM shadow. */
const toWorld = ([x, y, z]) => new THREE.Vector3((x - W / 2) * (DIST - z) / DIST, (H / 2 - y) * (DIST - z) / DIST, z);
function pose(t) {
  const P = pathAt(t);
  // Velocity over a short window drives banking and lean, so the pointer
  // tilts into turns and straightens as it lands.
  const a = pathAt(t - 0.05), b = pathAt(t + 0.05);
  const vx = (b[0] - a[0]) / 0.1, vy = (b[1] - a[1]) / 0.1, vz = (b[2] - a[2]) / 0.1;
  const press = t >= CLICK && t < CLICK + 0.32 ? Math.sin(((t - CLICK) / 0.32) * Math.PI) : 0;
  pointer.position.copy(toWorld(P));
  pointer.position.z -= press * 8;
  pointer.rotation.set(
    -0.42 + THREE.MathUtils.clamp(vy * 0.0005, -0.35, 0.35) + vz * 0.0004 + press * 0.32,
    0.4 + THREE.MathUtils.clamp(vx * 0.0006, -0.5, 0.5),
    -0.08 - THREE.MathUtils.clamp(vx * 0.00035, -0.4, 0.4),
  );
  pointer.scale.setScalar(1 - press * 0.08);
  return { P, speed: Math.hypot(vx, vy) / FPS };
}

const tip = document.querySelector('.tip');
const out = document.querySelector('canvas.out').getContext('2d');
const shadow = document.querySelector('.shadow'), ring = document.querySelector('.ring');
const ui = document.querySelector('.ui');
const hov = document.querySelector('.t-an .hov');
const up = btnEl.querySelector('.up'), ok = btnEl.querySelector('.ok');

function draw(t) {
  // UI choreography that answers the cursor.
  const ui_in = smooth(t, 0, 0.35) * (1 - smooth(t, 6.7, 7.1));
  ui.style.opacity = ui_in.toFixed(3);
  hov.style.opacity = (smooth(t, 1.55, 1.8) * (1 - smooth(t, 2.25, 2.5))).toFixed(3);
  const hoverBtn = smooth(t, 2.85, 3.05);
  const pressed = t >= CLICK && t < CLICK + 0.3 ? Math.sin(((t - CLICK) / 0.3) * Math.PI) : 0;
  btnEl.style.transform = `scale(${(1 + hoverBtn * 0.02 - pressed * 0.04).toFixed(4)})`;
  btnEl.style.filter = `brightness(${(1 + hoverBtn * 0.06).toFixed(3)})`;
  const done = smooth(t, CLICK + 0.15, CLICK + 0.45);
  ok.style.opacity = done.toFixed(3);
  up.style.opacity = (1 - done).toFixed(3);
  ok.style.transform = `translateY(${((1 - softSpring(clamp((t - CLICK - 0.15) / 0.6))) * 14).toFixed(2)}px)`;
  const r = clamp((t - CLICK) / 0.6);
  ring.style.opacity = t >= CLICK ? ((1 - r) * 0.9).toFixed(3) : 0;
  ring.style.transform = `translate(${btn[0] - 30}px,${btn[1] + 4}px) scale(${(0.4 + flowQuintOut(r) * 1.6).toFixed(4)})`;
  const tp = clamp((t - 4.55) / 0.45);
  const tipOn = softSpring(tp) * (1 - smooth(t, 5.4, 5.7));
  tip.style.opacity = (clamp(tp * 2) * (1 - smooth(t, 5.4, 5.7))).toFixed(3);
  tip.style.transform = `scale(${(0.85 + 0.15 * tipOn).toFixed(4)})`;
  dot.setAttribute('opacity', (smooth(t, 4.5, 4.8) * (1 - smooth(t, 5.45, 5.75))).toFixed(3));

  // Cursor with motion blur: when it moves fast, average sub-frame renders
  // across half a frame's shutter (premultiplied, so 'lighter' at 1/n averages).
  const { P, speed } = pose(t);
  const n = Math.max(1, Math.min(10, Math.ceil(speed / 7)));
  out.clearRect(0, 0, W, H);
  out.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const ts = n === 1 ? t : t + ((i / (n - 1)) - 0.5) * (0.5 / FPS);
    pose(ts);
    renderer.render(scene, camera);
    out.globalAlpha = 1 / n;
    out.drawImage(gl, 0, 0);
  }
  out.globalAlpha = 1;
  out.globalCompositeOperation = 'source-over';
  pose(t);
  const visible = t > LEGS[0].t0 && t < LEGS[3].t1;
  out.canvas.style.opacity = visible ? 1 : 0;

  // Shadow: cast down-right onto the page; softer, larger and fainter with height.
  const [x, y, z] = P;
  shadow.style.opacity = visible ? (0.34 * (1 - clamp(z / 620))).toFixed(3) : 0;
  shadow.style.transform = `translate(${(x + 10 + z * 0.22).toFixed(1)}px,${(y + 14 + z * 0.3).toFixed(1)}px) rotate(-28deg) scale(${(0.7 + z / 380).toFixed(3)},${(0.75 + z / 380).toFixed(3)})`;
  shadow.style.filter = `blur(${(5 + z / 14).toFixed(2)}px)`;
}

fx.wait(fontsReady.then(measure));
fx.register({ duration: D, seek: draw });

  // Sound, on the same beats as the picture (film cue-sheet format; see fx.js).
  // Pitch SaaS pack (ElevenLabs-generated): glitch accents, deep whooshes and
  // crisp UI sounds; signature moments name their clip. Clips carry measured
  // hit points, so each lands on its beat without hand-set leads.
  fx.sfx([
    { t: 0.75, event: 'whoosh_deep', clip: 'pitch-whoosh-deep-2', label: 'cursor swoops in' },
    { t: 1.72, event: 'tick', clip: 'pitch-hover', label: 'hovers tab' },
    { t: 2.62, event: 'whoosh_deep', label: 'to the button' },
    { t: CLICK, event: 'click', clip: 'pitch-click-soft', label: 'click' },
    { t: CLICK + 0.3, event: 'success', clip: 'pitch-success', label: 'upgraded' },
    { t: 4.25, event: 'whoosh_deep', label: 'to the chart' },
    { t: 4.62, event: 'glitch', clip: 'pitch-glitch-pop', label: 'tooltip' },
    { t: 6.25, event: 'whoosh_deep', clip: 'pitch-whoosh-sweep', label: 'flies off' },
  ]);
</script>
