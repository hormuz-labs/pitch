<!doctype html><meta charset="utf-8">
<title>Round Logo: Ripple</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0c1220}
  .c{position:absolute;left:50%;top:50%;width:0;height:0}
  .ring{position:absolute;left:0;top:0;width:200px;height:200px;border-radius:50%;border:2px solid rgba(120,190,255,.9);transform:translate(-50%,-50%);opacity:0}
  .mark{position:absolute;left:0;top:0;width:200px;height:200px;transform:translate(-50%,-50%)}
  .name{position:absolute;left:50%;top:50%;transform:translate(-50%,150px);font-family:"Atlas Grotesk",sans-serif;font-weight:500;font-size:30px;letter-spacing:.3em;text-transform:uppercase;color:#dbe8ff;padding-left:.3em;white-space:nowrap}
</style>
<div class="stage">
  <div class="c">
    <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <svg class="mark" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="96" fill="#4f8cff"/>
      <circle cx="100" cy="100" r="60" fill="none" stroke="#0c1220" stroke-width="12"/>
      <circle class="dot" cx="100" cy="100" r="18" fill="#0c1220"/>
    </svg>
  </div>
  <div class="name">Pulse Labs</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 3 });
  // the mark lands with a squash; the impact throws out rings that radiate and fade
  tl.from('.mark', { scale: 0, duration: .7, ease: 'back.out(2.2)' }, 0);
  gsap.utils.toArray('.ring').forEach((r, i) => {
    tl.fromTo(r, { scale: .9, opacity: .9, borderWidth: 6 }, { scale: 3.2 + i * .5, opacity: 0, borderWidth: 1, duration: 1.5, ease: 'power2.out', immediateRender: false }, .35 + i * .18);
  });
  // a second beat: the centre dot pulses and sends one more ripple
  tl.to('.dot', { attr: { r: 26 }, duration: .18, ease: 'power2.in' }, 1.6)
    .to('.dot', { attr: { r: 18 }, duration: .5, ease: 'elastic.out(1,.4)' }, 1.78)
    .fromTo('.ring:nth-child(2)', { scale: .9, opacity: .8, borderWidth: 5 }, { scale: 3.6, opacity: 0, borderWidth: 1, duration: 1.2, ease: 'power2.out', immediateRender: false }, 1.7)
    .from('.name', { opacity: 0, y: 16, duration: .7, ease: 'power3.out' }, .8)
    .to('.mark', { scale: 0, duration: .4, ease: 'back.in(2)' }, 2.6)
    .to('.name', { opacity: 0, y: -10, duration: .3 }, 2.65);
  tl.to({}, { duration: .01 }, 3);
</script>
