<!doctype html><meta charset="utf-8">
<title>Before & After: Logo</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0e0e11}
  .half{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:28px}
  .half.before{background:#ece6da}
  .half.after{background:#0e0e11;clip-path:inset(0 100% 0 0)}
  .logo{display:flex;align-items:center;gap:26px}
  .mark{width:120px;height:120px}
  .name{font-size:76px;letter-spacing:-.03em;line-height:1}
  .before .name{font-family:"Sorts Mill Goudy",serif;color:#3a2f22;font-style:italic;letter-spacing:0}
  .after .name{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;color:#fff;text-transform:lowercase}
  .tag{font-size:18px;letter-spacing:.32em;text-transform:uppercase;opacity:.55}
  .before .tag{color:#3a2f22}.after .tag{color:#fff}
  .bar{position:absolute;top:0;bottom:0;width:4px;left:0;background:#fff;transform:translateX(-2px);box-shadow:0 0 30px rgba(255,255,255,.6)}
  .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;gap:6px;color:#0e0e11;font-size:16px;font-weight:500}
  .lbl{position:absolute;top:44px;font-size:15px;letter-spacing:.3em;text-transform:uppercase;padding:8px 14px;border-radius:999px}
  .lbl.b{left:48px;background:rgba(58,47,34,.12);color:#3a2f22}
  .lbl.a{right:48px;background:rgba(255,255,255,.12);color:#fff}
</style>
<div class="stage">
  <div class="half before">
    <div class="logo">
      <svg class="mark" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#3a2f22" stroke-width="4"/><circle cx="60" cy="60" r="40" fill="none" stroke="#3a2f22" stroke-width="2"/><text x="60" y="76" text-anchor="middle" font-family="Sorts Mill Goudy" font-size="48" fill="#3a2f22">N</text></svg>
      <div class="name">Northwind &amp; Co.</div>
    </div>
    <div class="tag">Est. 1998</div>
    <div class="lbl b">Before</div>
  </div>
  <div class="half after">
    <div class="logo">
      <svg class="mark" viewBox="0 0 120 120"><rect x="8" y="8" width="104" height="104" rx="30" fill="#5b6cff"/><path d="M34 84 L34 40 L60 68 L86 40 L86 84" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="name">northwind</div>
    </div>
    <div class="tag">Reimagined</div>
    <div class="lbl a">After</div>
  </div>
  <div class="bar"><div class="knob">‹ ›</div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 5 });
  const W = 1280;
  // the old logo settles in
  tl.from('.before .mark', { scale: .6, rotation: -40, duration: .6, ease: 'expo.out' }, 0)
    .from('.before .name', { x: 30, duration: .6, ease: 'expo.out' }, .1)
    .from('.before .tag', { opacity: 0, y: 10, duration: .5 }, .3)
    .from('.before .lbl', { opacity: 0, y: -10, duration: .4 }, .3);
  // the divider sweeps across, revealing the rebrand
  const sweep = { p: 0 };
  tl.to(sweep, { p: 1, duration: 1.3, ease: 'expo.inOut', onUpdate: apply }, 1.2)
    .to(sweep, { p: 0, duration: 1.1, ease: 'expo.inOut', onUpdate: apply }, 3.6);
  function apply(){ const x = sweep.p * W; gsap.set('.bar', { x }); gsap.set('.after', { clipPath: `inset(0 ${W - x}px 0 0)` }); }
  // the new mark pops under the wipe, the wordmark slides in with it
  tl.from('.after .mark', { scale: .5, rotation: -25, duration: .8, ease: 'back.out(2)' }, 1.5)
    .from('.after .name', { x: -40, duration: .8, ease: 'expo.out' }, 1.7)
    .from('.after .tag', { y: 12, opacity: 0, duration: .5 }, 2.1)
    .from('.after .lbl', { opacity: 0, y: -10, duration: .4 }, 2.4);
  // the old mark leaves as the wipe returns
  tl.to('.before .logo', { x: -30, opacity: 0, duration: .6, ease: 'power2.in' }, 4.4)
    .to('.before .tag, .before .lbl', { opacity: 0, duration: .4 }, 4.5);
  tl.to({}, { duration: .01 }, 5);
  tl.seek(0);
</script>
