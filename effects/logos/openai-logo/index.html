<!doctype html><meta charset="utf-8">
<title>AI Knot Logo</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#000}
  .knot{position:absolute;left:50%;top:50%;width:360px;height:360px;transform:translate(-50%,-56%)}
  .word{position:absolute;left:50%;top:73%;transform:translateX(-50%);font-family:"Atlas Grotesk",sans-serif;font-weight:500;font-size:44px;letter-spacing:.04em;color:#fff;white-space:nowrap}
  .word span{display:inline-block}
</style>
<div class="stage">
  <svg class="knot" viewBox="-180 -180 360 360">
    <g class="rot">
      <g class="petals"></g>
    </g>
  </svg>
  <div class="word"><span>Open</span><span>Mind</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  // six interlocking rounded arcs forming a hexagonal knot
  const g = document.querySelector('.petals');
  const NS = 'http://www.w3.org/2000/svg';
  for (let i = 0; i < 6; i++) {
    const p = document.createElementNS(NS, 'path');
    // one petal: a rounded lozenge whose ends interlock with its neighbours
    p.setAttribute('d', 'M0 -150 L 70 -110 A 24 24 0 0 1 82 -90 L 82 0 A 24 24 0 0 1 58 24 L 0 -10 Z');
    p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#fff'); p.setAttribute('stroke-width', '20');
    p.setAttribute('stroke-linejoin', 'round');
    p.setAttribute('transform', `rotate(${i * 60})`);
    p.classList.add('petal');
    g.appendChild(p);
  }
  const tl = fx.timeline({ duration: 3 });
  tl.fromTo('.petal', { drawSVG: '0% 0%' }, { drawSVG: '0% 100%', stagger: .09, duration: .9, ease: 'power2.inOut' }, 0)
    .fromTo('.rot', { rotation: -120, scale: .6, transformOrigin: '50% 50%' }, { rotation: 0, scale: 1, duration: 1.6, ease: 'expo.out' }, 0)
    // a slow continuous turn so the knot never rests, then a snap out
    .to('.rot', { rotation: 60, duration: 1.4, ease: 'power1.inOut' }, 1.3)
    .from('.word span', { y: 24, opacity: 0, stagger: .08, duration: .6, ease: 'expo.out' }, .9)
    .to('.petal', { drawSVG: '100% 100%', stagger: -.05, duration: .4, ease: 'power2.in' }, 2.45)
    .to('.word span', { y: -16, opacity: 0, stagger: .04, duration: .3, ease: 'power2.in' }, 2.6);
  tl.to({}, { duration: .01 }, 3);
</script>
