<!doctype html><meta charset="utf-8">
<title>Simple Dot Logo</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f7f7f5}
  .row{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:baseline;font-family:"Atlas Grotesk",sans-serif;font-weight:500;font-size:120px;letter-spacing:-.03em;color:#161616;line-height:1}
  .ch{display:inline-block}
  .dotslot{display:inline-block;width:.34em;height:1em;position:relative}
  .dot{position:absolute;left:0;bottom:.06em;width:.3em;height:.3em;border-radius:50%;background:#161616}
</style>
<div class="stage">
  <div class="row"><span class="ch">m</span><span class="ch">o</span><span class="ch">n</span><span class="ch">o</span><span class="dotslot"><span class="dot"></span></span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 3 });
  // the dot falls in and bounces to rest; each bounce lower, squash on contact
  gsap.set('.ch', { opacity: 0 });
  tl.from('.dot', { y: -300, duration: .5, ease: 'power2.in' }, 0)
    .to('.dot', { scaleY: .6, scaleX: 1.3, transformOrigin: '50% 100%', duration: .07 }, .5)
    .to('.dot', { scaleY: 1, scaleX: 1, duration: .1 }, .57)
    .to('.dot', { y: -120, duration: .28, ease: 'power2.out' }, .57)
    .to('.dot', { y: 0, duration: .28, ease: 'power2.in' }, .85)
    .to('.dot', { scaleY: .75, scaleX: 1.15, duration: .06 }, 1.13)
    .to('.dot', { scaleY: 1, scaleX: 1, duration: .1 }, 1.19)
    .to('.dot', { y: -40, duration: .18, ease: 'power2.out' }, 1.19)
    .to('.dot', { y: 0, duration: .18, ease: 'power2.in' }, 1.37)
    // the letters rise up out of the baseline, right to left from the dot
    .fromTo('.ch', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .6, ease: 'expo.out', stagger: { each: .06, from: 'end' }, immediateRender: false }, 1.45)
    // the dot breathes once, then the whole thing sinks away and the dot leaves last
    .to('.dot', { scale: 1.25, duration: .25, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2.0)
    .to('.ch', { y: 40, opacity: 0, duration: .35, ease: 'power3.in', stagger: .04 }, 2.45)
    .to('.dot', { y: -300, duration: .3, ease: 'power2.in' }, 2.7);
  tl.to({}, { duration: .01 }, 3);
</script>
