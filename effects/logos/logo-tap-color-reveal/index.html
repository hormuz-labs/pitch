<!doctype html><meta charset="utf-8">
<title>Logo Tap: Color Reveal</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f3f1ec}
  .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:0;height:0}
  .logo{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:180px;height:180px;border-radius:52px;background:#111;display:flex;align-items:center;justify-content:center;box-shadow:0 30px 60px rgba(0,0,0,.18)}
  .logo svg{width:96px;height:96px}
  .sw{position:absolute;left:0;top:0;width:96px;height:96px;border-radius:30px;transform:translate(-50%,-50%);box-shadow:0 12px 30px rgba(0,0,0,.14);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:13px;font-family:"SF Mono",Menlo,monospace;letter-spacing:.06em;color:rgba(255,255,255,.9)}
  .cursor{position:absolute;left:0;top:0;width:22px;height:22px;transform:translate(60px,60px)}
  .ring{position:absolute;left:0;top:0;width:180px;height:180px;border-radius:52px;transform:translate(-50%,-50%);border:3px solid #111;opacity:0}
  .title{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:28px;letter-spacing:.2em;text-transform:uppercase;color:#111;opacity:0}
</style>
<div class="stage">
  <div class="center">
    <div class="ring r1"></div><div class="ring r2"></div>
    <div class="sw" style="background:#ff5c3a">#FF5C3A</div>
    <div class="sw" style="background:#ffb433">#FFB433</div>
    <div class="sw" style="background:#3ddc97">#3DDC97</div>
    <div class="sw" style="background:#2f7bff">#2F7BFF</div>
    <div class="sw" style="background:#9b5cff">#9B5CFF</div>
    <div class="sw" style="background:#ff4f9a">#FF4F9A</div>
    <div class="logo">
      <svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="34" fill="none" stroke="#fff" stroke-width="9"/><circle cx="48" cy="48" r="10" fill="#fff"/></svg>
    </div>
    <svg class="cursor" viewBox="0 0 24 24"><path d="M4 3l6 17 3-7 7-3z" fill="#111" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </div>
  <div class="title">Acme palette</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 10 });
  const sws = gsap.utils.toArray('.sw');
  const n = sws.length, R = 250;
  gsap.set(sws, { scale: 0 });
  // logo settles
  tl.from('.logo', { scale: .3, rotation: -30, duration: .8, ease: 'expo.out' }, 0);
  // cursor arrives and taps
  tl.from('.cursor', { x: 360, y: 240, duration: 1, ease: 'power3.inOut' }, .6)
    .to('.cursor', { scale: .8, duration: .12, ease: 'power2.in' }, 1.8)
    .to('.cursor', { scale: 1, duration: .25, ease: 'back.out(3)' }, 1.92)
    .to('.logo', { scale: .88, duration: .12, ease: 'power2.in' }, 1.8)
    .to('.logo', { scale: 1, duration: .7, ease: 'elastic.out(1,.4)' }, 1.92)
    .fromTo('.ring.r1', { scale: 1, opacity: .7 }, { scale: 2.6, opacity: 0, duration: .9, ease: 'power2.out', immediateRender: false }, 1.92)
    .fromTo('.ring.r2', { scale: 1, opacity: .5 }, { scale: 3.4, opacity: 0, duration: 1.1, ease: 'power2.out', immediateRender: false }, 2.02)
    .to('.cursor', { x: 120, y: 90, opacity: 0, duration: .6, ease: 'power2.in' }, 2.1);
  // burst: swatches shoot out radially, overshoot, settle on a ring
  sws.forEach((el, i) => {
    const a = -Math.PI / 2 + (i / n) * Math.PI * 2;
    const x = Math.cos(a) * R, y = Math.sin(a) * R;
    tl.fromTo(el, { x: 0, y: 0, scale: 0, rotation: -30 },
      { x, y, scale: 1, rotation: 0, duration: 1.1, ease: 'move' }, 1.95 + i * .05);
  });
  // the ring slowly turns, the logo counter-turns, so nothing sits still
  tl.to(sws, { rotation: 8, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 3.4);
  sws.forEach((el, i) => {
    const a0 = -Math.PI / 2 + (i / n) * Math.PI * 2;
    const spin = { a: a0 };
    tl.to(spin, { a: a0 + Math.PI / 3, duration: 3.4, ease: 'power1.inOut', onUpdate(){ gsap.set(el, { x: Math.cos(spin.a) * R, y: Math.sin(spin.a) * R }); } }, 3.4);
  });
  tl.to('.title', { opacity: 1, y: -6, duration: .6 }, 3.2);
  // collapse back into the mark
  sws.forEach((el, i) => {
    tl.to(el, { x: 0, y: 0, scale: 0, rotation: 30, duration: .7, ease: 'back.in(1.8)' }, 7.4 + i * .06);
  });
  tl.to('.logo', { scale: 1.08, duration: .15, ease: 'power2.in' }, 8.05)
    .to('.logo', { scale: 1, duration: .8, ease: 'elastic.out(1,.4)' }, 8.2)
    .to('.title', { opacity: 0, duration: .4 }, 7.6)
    .to('.logo', { scale: .6, opacity: 0, duration: .5, ease: 'expo.in' }, 9.5);
  tl.to({}, { duration: .01 }, 10);
</script>
