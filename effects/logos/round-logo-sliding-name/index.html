<!doctype html><meta charset="utf-8">
<title>Round Logo: Sliding Name</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#ffffff}
  .lockup{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center}
  .mark{position:relative;z-index:2;width:140px;height:140px;flex:none;border-radius:50%;background:#1b1b1f;display:flex;align-items:center;justify-content:center}
  .mark svg{width:70px;height:70px}
  .mask{overflow:hidden;height:160px;display:flex;align-items:center;padding-left:30px;margin-left:-4px}
  .name{font-family:"Atlas Grotesk",sans-serif;font-weight:500;font-size:96px;letter-spacing:-.03em;color:#1b1b1f;white-space:nowrap;line-height:1}
</style>
<div class="stage">
  <div class="lockup">
    <div class="mark"><svg viewBox="0 0 70 70"><path d="M12 50 L35 14 L58 50 Z" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round"/><circle cx="35" cy="40" r="7" fill="#ffb833"/></svg></div>
    <div class="mask"><div class="name">Northwind</div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 2 });
  const nameW = document.querySelector('.mask').offsetWidth;
  tl.set('.lockup', { x: nameW / 2 })
    // the round mark rolls in from the left like a wheel and stops
    .from('.mark', { x: -420, rotation: -540, duration: .8, ease: 'move' }, 0)
    .from('.mark svg', { scale: 0, duration: .5, ease: 'back.out(2)' }, .45)
    // the name slides out from behind it while the lockup recentres
    .from('.name', { xPercent: -125, duration: .7, ease: 'expo.out' }, .55)
    .to('.lockup', { x: 0, duration: .7, ease: 'move' }, .55)
    // out: name retracts, mark rolls off right
    .to('.name', { xPercent: -125, duration: .35, ease: 'expo.in' }, 1.5)
    .to('.lockup', { x: nameW / 2, duration: .35, ease: 'expo.in' }, 1.5)
    .to('.mark', { x: 500, rotation: 540, duration: .35, ease: 'power3.in' }, 1.65);
  tl.to({}, { duration: .01 }, 2);
</script>
