<!doctype html><meta charset="utf-8">
<title>Square Logo</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#111114;perspective:1200px}
  .wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:34px}
  .sq{width:200px;height:200px;position:relative;transform-style:preserve-3d}
  .q{position:absolute;width:100px;height:100px;background:#fff}
  .q1{left:0;top:0;border-top-left-radius:28px}.q2{right:0;top:0;border-top-right-radius:28px;background:#ff7a1a}
  .q3{left:0;bottom:0;border-bottom-left-radius:28px;background:#ff7a1a}.q4{right:0;bottom:0;border-bottom-right-radius:28px}
  .name{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:36px;letter-spacing:.24em;text-transform:uppercase;color:#fff;padding-left:.24em}
</style>
<div class="stage">
  <div class="wrap">
    <div class="sq"><div class="q q1"></div><div class="q q2"></div><div class="q q3"></div><div class="q q4"></div></div>
    <div class="name">Quadra</div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 2 });
  // four quadrants fly in from the corners and lock into a square
  tl.from('.q1', { x: -260, y: -200, rotation: 90, duration: .7, ease: 'expo.out' }, 0)
    .from('.q2', { x: 260, y: -200, rotation: 90, duration: .7, ease: 'expo.out' }, .06)
    .from('.q3', { x: -260, y: 200, rotation: -90, duration: .7, ease: 'expo.out' }, .12)
    .from('.q4', { x: 260, y: 200, rotation: -90, duration: .7, ease: 'expo.out' }, .18)
    // the square rounds off and does one clean flip on Y as the name arrives
    .to('.q', { borderRadius: 28, duration: .4 }, .7)
    .to('.sq', { rotationY: 180, duration: .8, ease: 'power3.inOut' }, .85)
    .from('.name', { opacity: 0, y: 16, duration: .6, ease: 'power3.out' }, .95)
    // out: the quadrants pull back to their corners
    .to('.q1', { x: -260, y: -200, opacity: 0, duration: .4, ease: 'power3.in' }, 1.55)
    .to('.q2', { x: 260, y: -200, opacity: 0, duration: .4, ease: 'power3.in' }, 1.58)
    .to('.q3', { x: -260, y: 200, opacity: 0, duration: .4, ease: 'power3.in' }, 1.61)
    .to('.q4', { x: 260, y: 200, opacity: 0, duration: .4, ease: 'power3.in' }, 1.64)
    .to('.name', { opacity: 0, y: -10, duration: .3 }, 1.65);
  tl.to({}, { duration: .01 }, 2);
</script>
