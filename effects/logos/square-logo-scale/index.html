<!doctype html><meta charset="utf-8">
<title>Square Logo: Scale</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#e8f0ff}
  .wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:30px}
  .sq{width:210px;height:210px;border-radius:52px;background:#1d4ed8;display:flex;align-items:center;justify-content:center;box-shadow:0 40px 80px rgba(29,78,216,.28)}
  .sq svg{width:110px;height:110px}
  .name{font-family:"Atlas Grotesk",sans-serif;font-weight:500;font-size:40px;letter-spacing:.06em;color:#0f1f4d}
  .shadow{position:absolute;left:50%;top:50%;width:210px;height:210px;border-radius:52px;background:#1d4ed8;opacity:.18;transform:translate(-50%,-50%)}
</style>
<div class="stage">
  <div class="shadow"></div>
  <div class="wrap">
    <div class="sq"><svg viewBox="0 0 110 110"><rect x="14" y="14" width="34" height="34" rx="8" fill="#fff"/><rect x="62" y="14" width="34" height="34" rx="8" fill="#fff" opacity=".7"/><rect x="14" y="62" width="34" height="34" rx="8" fill="#fff" opacity=".7"/><rect x="62" y="62" width="34" height="34" rx="8" fill="#93c5fd"/></svg></div>
    <div class="name">Blocky</div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 2 });
  // the square scales up from nothing with a firm overshoot; its glyphs pop in after
  tl.from('.sq', { scale: 0, rotation: -12, duration: .8, ease: 'back.out(1.8)' }, 0)
    .from('.sq svg rect', { scale: 0, transformOrigin: '50% 50%', stagger: .06, duration: .5, ease: 'back.out(2.5)' }, .35)
    // an echo square expands and fades behind it
    .fromTo('.shadow', { scale: .2, opacity: .3 }, { scale: 2.2, opacity: 0, duration: 1.1, ease: 'power3.out' }, .15)
    .from('.name', { opacity: 0, y: 18, duration: .6, ease: 'power3.out' }, .6)
    // a subtle hover so the frame keeps breathing, then scale out
    .to('.sq', { y: -8, duration: .45, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.0)
    .to('.sq', { scale: 0, rotation: 12, duration: .4, ease: 'back.in(1.8)' }, 1.6)
    .to('.name', { opacity: 0, y: -10, duration: .3 }, 1.65);
  tl.to({}, { duration: .01 }, 2);
</script>
