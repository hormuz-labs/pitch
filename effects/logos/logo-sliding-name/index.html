<!doctype html><meta charset="utf-8">
<title>Logo: Sliding Name</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101014}
  .lockup{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:0}
  .mark{position:relative;z-index:2;width:150px;height:150px;flex:none}
  .mask{overflow:hidden;height:170px;display:flex;align-items:center;padding-left:34px;margin-left:-6px}
  .name{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:110px;letter-spacing:-.04em;color:#fff;white-space:nowrap;line-height:1}
  .name em{font-style:normal;color:#7cf5c1}
</style>
<div class="stage">
  <div class="lockup">
    <svg class="mark" viewBox="0 0 150 150">
      <rect x="0" y="0" width="150" height="150" rx="40" fill="#7cf5c1"/>
      <path class="m1" d="M40 108 V48 l35 40 35-40 v60" fill="none" stroke="#101014" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="mask"><div class="name">acme<em>.</em></div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 3 });
  const nameW = document.querySelector('.mask').offsetWidth;
  // the mark drops in and lands, centered
  tl.set('.lockup', { x: nameW / 2 })
    .from('.mark', { y: -220, rotation: -18, duration: .7, ease: 'expo.out' }, 0)
    .fromTo('.mark', { scaleY: .9, scaleX: 1.08 }, { scaleY: 1, scaleX: 1, duration: .5, ease: 'elastic.out(1,.4)' }, .55)
    .from('.m1', { drawSVG: '0%', duration: .6, ease: 'power2.inOut' }, .25)
    // the name slides out from behind the mark; the lockup recenters as it grows
    .from('.name', { xPercent: -125, duration: .8, ease: 'expo.out' }, .8)
    .to('.lockup', { x: 0, duration: .8, ease: 'expo.out' }, .8)
    // exit: name retracts, mark flips away
    .to('.name', { xPercent: -125, duration: .45, ease: 'expo.in' }, 2.35)
    .to('.lockup', { x: nameW / 2, duration: .45, ease: 'expo.in' }, 2.35)
    .to('.mark', { y: 220, rotation: 18, duration: .35, ease: 'power3.in' }, 2.65);
  tl.to({}, { duration: .01 }, 3);
</script>
