<!doctype html><meta charset="utf-8">
<title>Round Logo</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f6f4ef}
  .wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:30px}
  .mark{width:220px;height:220px}
  .name{font-family:"Atlas Grotesk",sans-serif;font-weight:500;font-size:34px;letter-spacing:.28em;text-transform:uppercase;color:#1a1a1a;padding-left:.28em}
</style>
<div class="stage">
  <div class="wrap">
    <svg class="mark" viewBox="0 0 220 220">
      <circle class="disc" cx="110" cy="110" r="104" fill="#1a1a1a"/>
      <g class="inner">
        <circle cx="110" cy="110" r="64" fill="none" stroke="#f6f4ef" stroke-width="14"/>
        <path d="M110 46 A64 64 0 0 1 174 110" fill="none" stroke="#ff6a3d" stroke-width="14" stroke-linecap="round"/>
        <circle cx="110" cy="110" r="16" fill="#f6f4ef"/>
      </g>
    </svg>
    <div class="name">Orbital</div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 2 });
  // the disc rotates in while fading up; the inner ring counter-rotates and locks
  tl.fromTo('.mark', { rotation: -180, scale: .3, opacity: .25, transformOrigin: '50% 50%' }, { rotation: 0, scale: 1, opacity: 1, duration: .9, ease: 'expo.out' }, 0)
    .fromTo('.inner', { rotation: 200, transformOrigin: '50% 50%' }, { rotation: 0, duration: 1.1, ease: 'expo.out' }, .1)
    .from('.name', { opacity: 0, y: 14, letterSpacing: '.6em', duration: .7, ease: 'power3.out' }, .5)
    // a gentle continuing turn of the accent so the loop holds motion
    .to('.inner', { rotation: 90, duration: .9, ease: 'power2.inOut' }, 1.0)
    // out: rotate away and fade
    .to('.mark', { rotation: 120, scale: .6, opacity: 0, duration: .45, ease: 'power3.in' }, 1.55)
    .to('.name', { opacity: 0, y: -10, duration: .3 }, 1.65);
  tl.to({}, { duration: .01 }, 2);
</script>
