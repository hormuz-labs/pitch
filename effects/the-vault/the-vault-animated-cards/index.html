<!doctype html><meta charset="utf-8">
<title>The Vault: Animated Cards</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0a0a0c;color:#fff;font-family:"Atlas Grotesk",sans-serif;perspective:1600px}
  .bgglow{position:absolute;left:50%;top:50%;width:1200px;height:800px;border-radius:50%;background:radial-gradient(ellipse,rgba(212,175,55,.18),rgba(212,175,55,0) 60%);transform:translate(-50%,-50%)}
  .deck{position:absolute;left:50%;top:50%;width:520px;height:330px;margin:-165px 0 0 -260px;transform-style:preserve-3d}
  .card{position:absolute;inset:0;border-radius:26px;padding:30px 34px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 30px 60px rgba(0,0,0,.55);will-change:transform;transform-origin:center;overflow:hidden}
  .card.c1{background:linear-gradient(135deg,#1b1b22,#2b2b36)}
  .card.c2{background:linear-gradient(135deg,#d4af37,#f5e08a 60%,#c99a1f);color:#1a1405}
  .card.c3{background:linear-gradient(135deg,#0f2e5a,#2e6bff)}
  .card.c4{background:linear-gradient(135deg,#f0f0f4,#c9c9d4);color:#111}
  .card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%)}
  .brand{font-size:20px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
  .chipv{width:54px;height:40px;border-radius:8px;background:linear-gradient(135deg,#e8d28a,#b8952a);opacity:.9}
  .num{font-size:30px;letter-spacing:.14em;font-variant-numeric:tabular-nums}
  .foot{display:flex;justify-content:space-between;font-size:16px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
  .ring{width:44px;height:44px;border-radius:50%;border:5px solid currentColor;opacity:.6;position:relative}
  .ring::after{content:"";position:absolute;left:12px;top:-5px;width:44px;height:44px;border-radius:50%;border:5px solid currentColor}
  .h1{position:absolute;left:80px;top:80px;font-size:52px;font-weight:500;letter-spacing:-.03em;line-height:1.05;overflow:hidden}
  .h1 span{display:block}
  .sub{position:absolute;left:80px;top:200px;font-size:20px;color:#9a9aa8;max-width:300px;line-height:1.5;overflow:hidden}
  .sub span{display:block}
  .tier{position:absolute;left:80px;bottom:90px;display:flex;flex-direction:column;gap:14px}
  .tier div{font-size:20px;color:#5a5a66;display:flex;align-items:center;gap:12px;opacity:0}
  .tier div::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
</style>
<div class="stage">
  <div class="bgglow"></div>
  <div class="h1"><span>Four cards.</span><span>One vault.</span></div>
  <div class="sub"><span>Tap to switch. Every card, one balance, zero fees.</span></div>
  <div class="tier"><div class="t1">Core</div><div class="t2">Gold</div><div class="t3">Travel</div><div class="t4">Virtual</div></div>
  <div class="deck">
    <div class="card c4"><div class="brand">Northwind <span class="chipv"></span></div><div class="num">•••• •••• •••• 0198</div><div class="foot"><span>Virtual</span><span class="ring"></span></div></div>
    <div class="card c3"><div class="brand">Northwind <span class="chipv"></span></div><div class="num">•••• •••• •••• 7731</div><div class="foot"><span>Travel</span><span class="ring"></span></div></div>
    <div class="card c2"><div class="brand">Northwind <span class="chipv"></span></div><div class="num">•••• •••• •••• 4402</div><div class="foot"><span>Gold</span><span class="ring"></span></div></div>
    <div class="card c1"><div class="brand">Northwind <span class="chipv"></span></div><div class="num">•••• •••• •••• 2210</div><div class="foot"><span>Core</span><span class="ring"></span></div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 10 });
  const cards = ['.c1', '.c2', '.c3', '.c4'];
  gsap.set('.deck', { x: 260 });
  tl.from('.h1 span', { yPercent: 120, duration: 0.7, stagger: 0.1, ease: 'expo.out' }, 0.1)
    .from('.sub span', { yPercent: 120, duration: 0.6, ease: 'expo.out' }, 0.4);
  // cards rise from below into a fanned stack, layered back to front
  tl.from('.card', { y: 500, rotationX: -30, rotation: (i) => (i - 1.5) * 4, duration: 1.1, stagger: -0.12, ease: 'move' }, 0.2)
    .to('.card', { y: (i) => (3 - i) * -34, x: (i) => (3 - i) * 18, rotation: (i) => (3 - i) * -3, duration: 0.8, ease: 'expo.inOut' }, 1.4);
  // reveal each card in turn: the front card lifts, tilts to the light, and slides to the back; the rest shift forward
  const slot = (k) => ({ y: -34 * k, x: 18 * k, rotation: -3 * k, scale: 1 - k * 0.02 });
  let order = ['.c1', '.c2', '.c3', '.c4'];
  order.forEach((c, k) => tl.set(c, { zIndex: 10 - k }, 0));
  for (let i = 0; i < 4; i++) {
    const t = 2.4 + i * 1.75, front = order[0];
    tl.to('.tier div', { opacity: 0.4, color: '#5a5a66', duration: 0.3 }, t)
      .to(`.tier .t${i + 1}`, { opacity: 1, color: '#fff', x: 8, duration: 0.4, ease: 'power3.out' }, t)
      .to(`.tier .t${i + 1}`, { x: 0, duration: 0.4 }, t + 1.3)
      .to(front, { y: -150, rotation: -6, rotationY: 35, scale: 1.04, duration: 0.55, ease: 'move' }, t)
      .set(front, { zIndex: 6 }, t + 0.7)
      .to(front, { ...slot(3), rotationY: 0, duration: 0.7, ease: 'expo.inOut' }, t + 0.6);
    order.slice(1).forEach((c, j) => tl.to(c, { ...slot(j), duration: 0.6, ease: 'expo.inOut' }, t + 0.55).set(c, { zIndex: 10 - j }, t + 0.55));
    order = [...order.slice(1), front];
  }
</script>
