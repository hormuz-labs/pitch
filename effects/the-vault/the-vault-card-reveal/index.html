<!doctype html><meta charset="utf-8">
<title>The Vault: Card Reveal</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#070709;color:#fff;font-family:"Atlas Grotesk",sans-serif;perspective:1400px}
  .halo{position:absolute;left:50%;top:50%;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.22),rgba(212,175,55,0) 55%);transform:translate(-50%,-50%);opacity:0}
  .beam{position:absolute;left:50%;top:-10%;width:8px;height:120%;margin-left:-4px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.9),transparent);opacity:0}
  .card{position:absolute;left:50%;top:50%;width:560px;height:350px;margin:-175px 0 0 -280px;border-radius:28px;transform-style:preserve-3d;will-change:transform}
  .face{position:absolute;inset:0;border-radius:28px;backface-visibility:hidden;overflow:hidden;padding:32px 36px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 40px 80px rgba(0,0,0,.6)}
  .front{background:linear-gradient(135deg,#141418 0%,#1f1f26 55%,#0f0f12 100%);border:1px solid rgba(255,255,255,.1)}
  .back{background:linear-gradient(135deg,#0f0f12,#1c1c22);transform:rotateY(180deg);border:1px solid rgba(255,255,255,.1)}
  .sheen{position:absolute;inset:-40%;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);transform:translateX(-80%)}
  .brand{display:flex;justify-content:space-between;align-items:center;font-size:20px;letter-spacing:.24em;text-transform:uppercase;font-weight:500}
  .chip{width:58px;height:42px;border-radius:9px;background:linear-gradient(135deg,#f1dc8f,#b8952a);position:relative}
  .chip::after{content:"";position:absolute;left:8px;right:8px;top:19px;height:2px;background:rgba(0,0,0,.35);box-shadow:0 -9px 0 rgba(0,0,0,.35),0 9px 0 rgba(0,0,0,.35)}
  .num{font-size:34px;letter-spacing:.16em;font-variant-numeric:tabular-nums;display:flex;gap:.6em}
  .num span{display:inline-block;overflow:hidden}
  .num span i{display:block;font-style:normal;will-change:transform}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#bcbcc8}
  .foot b{display:block;font-size:20px;color:#fff;font-weight:500;letter-spacing:.06em;margin-top:6px}
  .gold{color:#d4af37}
  .stripe{height:60px;background:#000;margin:0 -36px}
  .sig{height:44px;background:#e9e9ee;border-radius:6px;color:#111;display:flex;align-items:center;justify-content:flex-end;padding:0 14px;font-size:18px;letter-spacing:.2em}
  .h1{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-size:44px;font-weight:500;letter-spacing:-.02em;overflow:hidden}
  .h1 span{display:block}
  .kick{position:absolute;left:0;right:0;top:60px;text-align:center;font-size:18px;letter-spacing:.32em;text-transform:uppercase;color:#d4af37;overflow:hidden}
  .kick span{display:block}
  .dust{position:absolute;left:50%;top:50%;width:0;height:0}
  .dust i{position:absolute;width:6px;height:6px;border-radius:50%;background:#f1dc8f;opacity:0}
</style>
<div class="stage">
  <div class="halo"></div><div class="beam"></div>
  <div class="kick"><span>Introducing Northwind Black</span></div>
  <div class="card">
    <div class="face front">
      <div class="brand"><span>Northwind</span><span class="chip"></span></div>
      <div class="num"></div>
      <div class="foot"><div>Card holder<b>Jordan Rivera</b></div><div>Expires<b>09 / 31</b></div><div class="gold" style="font-size:26px;font-weight:500">◎</div></div>
      <div class="sheen"></div>
    </div>
    <div class="face back">
      <div class="stripe"></div>
      <div class="sig">•••</div>
      <div class="foot"><span>Northwind Bank · Member since 2019</span><span class="gold">Black</span></div>
    </div>
  </div>
  <div class="dust"></div>
  <div class="h1"><span>Metal. Made for more.</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const rng = fx.rng(23);
  const num = document.querySelector('.num');
  ['4402', '1187', '6630', '2019'].forEach((g) => { const s = document.createElement('span'); s.innerHTML = '<i>' + g + '</i>'; num.appendChild(s); });
  const dust = document.querySelector('.dust'); const bits = [];
  for (let i = 0; i < 40; i++) { const b = document.createElement('i'); dust.appendChild(b); bits.push(b); }
  const tl = fx.timeline({ duration: 10 });
  // the card rises out of darkness, edge-on, catching a beam of light
  tl.fromTo('.card', { y: 380, rotationX: 70, rotationY: -90, scale: 0.8, opacity: 0 }, { y: 0, rotationX: 0, rotationY: 0, scale: 1, opacity: 1, duration: 1.8, ease: 'expo.out' }, 0.2)
    .to('.beam', { opacity: 1, duration: 0.3 }, 0.6).to('.beam', { opacity: 0, x: 500, duration: 1.0, ease: 'power2.inOut' }, 0.9)
    .to('.halo', { opacity: 1, duration: 1.2, ease: 'power2.out' }, 0.8)
    .from('.kick span', { yPercent: 120, duration: 0.6, ease: 'expo.out' }, 1.0)
    .fromTo('.sheen', { xPercent: -80 }, { xPercent: 80, duration: 1.2, ease: 'power2.inOut' }, 1.4)
    .from('.num i', { yPercent: 110, duration: 0.5, stagger: 0.1, ease: 'expo.out' }, 1.6)
    .from('.foot > *', { y: 12, opacity: 0, duration: 0.5, stagger: 0.08, ease: 'power3.out' }, 2.0)
    .from('.h1 span', { yPercent: 120, duration: 0.7, ease: 'expo.out' }, 2.4);
  // slow float with a gentle tilt, then a full flip to show the back, and back again
  tl.to('.card', { rotationY: -14, rotationX: 8, duration: 1.6, ease: 'sine.inOut' }, 2.4)
    .to('.card', { rotationY: 180, rotationX: 0, duration: 1.2, ease: 'expo.inOut' }, 4.2)
    .to('.card', { rotationY: 194, rotationX: -6, duration: 1.4, ease: 'sine.inOut' }, 5.4)
    .to('.card', { rotationY: 360, rotationX: 0, duration: 1.2, ease: 'expo.inOut' }, 6.8)
    .fromTo('.sheen', { xPercent: -80 }, { xPercent: 80, duration: 1.0, ease: 'power2.inOut' }, 7.6);
  bits.forEach((b) => {
    const a = rng() * Math.PI * 2, d = 200 + rng() * 380;
    tl.fromTo(b, { x: Math.cos(a) * d * 0.4, y: Math.sin(a) * d * 0.4, opacity: 0 }, { x: Math.cos(a) * d, y: Math.sin(a) * d - 60, opacity: 0.9, duration: 1.5 + rng(), ease: 'power1.out' }, 0.8 + rng() * 1.5)
      .to(b, { opacity: 0, duration: 0.6 }, '>-0.3');
  });
  // out
  tl.to('.h1 span', { yPercent: -120, duration: 0.35, ease: 'expo.in' }, 9.0)
    .to('.kick span', { yPercent: -120, duration: 0.3, ease: 'expo.in' }, 9.05)
    .to('.card', { y: -420, rotationX: -40, scale: 0.85, opacity: 0, duration: 0.7, ease: 'power3.in' }, 9.15)
    .to('.halo', { opacity: 0, duration: 0.5 }, 9.3);
</script>
