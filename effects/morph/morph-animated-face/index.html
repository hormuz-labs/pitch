<!doctype html><meta charset="utf-8">
<title>Morph: Animated Face</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#ffd23f;display:grid;place-items:center}
  svg{width:760px;height:760px;overflow:visible}
  .label{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:44px;letter-spacing:-.02em;color:#1b1b1b}
  .label span{display:inline-block}
</style>
<div class="stage">
  <svg viewBox="-200 -200 400 400">
    <g id="face">
      <path id="head" fill="#1b1b1b" d="M -150 0 C -150 -83 -83 -150 0 -150 C 83 -150 150 -83 150 0 C 150 83 83 150 0 150 C -83 150 -150 83 -150 0 Z"/>
      <g id="eyes" fill="#ffd23f">
        <path id="eyeL" transform="translate(-52 -30)" d="M -12 0 A 12 12 0 1 0 12 0 A 12 12 0 1 0 -12 0 Z"/>
        <path id="eyeR" transform="translate(52 -30)" d="M -12 0 A 12 12 0 1 0 12 0 A 12 12 0 1 0 -12 0 Z"/>
      </g>
      <g id="brows" stroke="#ffd23f" stroke-width="10" stroke-linecap="round" fill="none">
        <path id="browL" d="M -74 -68 L -32 -68"/>
        <path id="browR" d="M 32 -68 L 74 -68"/>
      </g>
      <g id="blush" fill="#ff6b6b" opacity="0">
        <ellipse cx="-92" cy="14" rx="20" ry="11"/><ellipse cx="92" cy="14" rx="20" ry="11"/>
      </g>
      <path id="mouth" fill="#ffd23f" transform="translate(0 50)" d="M -30 -4 Q 0 -6 30 -4 Q 0 6 -30 -4 Z"/>
    </g>
  </svg>
  <div class="label"><span id="lab">Hello</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/MorphSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(MorphSVGPlugin);
  const EYE = {
    open: 'M -12 0 A 12 12 0 1 0 12 0 A 12 12 0 1 0 -12 0 Z',
    happy: 'M -17 5 Q 0 -19 17 5 Q 0 -5 -17 5 Z',
    wide: 'M -16 0 A 16 19 0 1 0 16 0 A 16 19 0 1 0 -16 0 Z',
    wink: 'M -17 0 Q 0 8 17 0 Q 0 3 -17 0 Z',
  };
  const MOUTH = {
    neutral: 'M -30 -4 Q 0 -6 30 -4 Q 0 6 -30 -4 Z',
    smile: 'M -52 -14 Q 0 62 52 -14 Q 0 14 -52 -14 Z',
    o: 'M -24 0 A 24 30 0 1 0 24 0 A 24 30 0 1 0 -24 0 Z',
    grin: 'M -54 -6 Q 0 50 54 -24 Q 0 22 -54 -6 Z',
  };
  const HEAD = {
    round: 'M -150 0 C -150 -83 -83 -150 0 -150 C 83 -150 150 -83 150 0 C 150 83 83 150 0 150 C -83 150 -150 83 -150 0 Z',
    tall: 'M -138 0 C -138 -95 -80 -166 0 -166 C 80 -166 138 -95 138 0 C 138 95 80 160 0 160 C -80 160 -138 95 -138 0 Z',
    squat: 'M -162 0 C -162 -70 -90 -136 0 -136 C 90 -136 162 -70 162 0 C 162 78 90 148 0 148 C -90 148 -162 78 -162 0 Z',
  };
  const tl = fx.timeline({ duration: 3 });
  const M = 0.32, E = 'power3.inOut';
  function state(at, { eyeL, eyeR, mouth, head, browY, browRot, blush, label }) {
    tl.to('#eyeL', { morphSVG: eyeL, duration: M, ease: E }, at)
      .to('#eyeR', { morphSVG: eyeR, duration: M, ease: E }, at)
      .to('#mouth', { morphSVG: mouth, duration: M, ease: E }, at)
      .to('#head', { morphSVG: head, duration: M + 0.1, ease: 'back.out(2)' }, at)
      .to('#browL', { y: browY, rotation: -browRot, transformOrigin: '50% 50%', duration: M, ease: E }, at)
      .to('#browR', { y: browY, rotation: browRot, transformOrigin: '50% 50%', duration: M, ease: E }, at)
      .to('#blush', { opacity: blush, duration: M }, at)
      .to('#lab', { yPercent: 120, opacity: 0, duration: 0.14, ease: 'power2.in' }, at - 0.05)
      .add(() => { document.getElementById('lab').textContent = label; }, at + 0.1)
      .fromTo('#lab', { yPercent: -120, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.25, ease: 'expo.out', immediateRender: false }, at + 0.12);
  }
  // the face is always in motion: a slow bob + a look-around between expressions
  tl.fromTo('#face', { y: 0 }, { y: -10, duration: 0.75, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 0);
  tl.fromTo('#eyes', { x: 0 }, { x: 10, duration: 0.75, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 0);

  state(0.15, { eyeL: EYE.happy, eyeR: EYE.happy, mouth: MOUTH.smile, head: HEAD.squat, browY: -6, browRot: 10, blush: 1, label: 'Happy' });
  state(0.9, { eyeL: EYE.wide, eyeR: EYE.wide, mouth: MOUTH.o, head: HEAD.tall, browY: -22, browRot: -4, blush: 0, label: 'Surprised' });
  state(1.65, { eyeL: EYE.wink, eyeR: EYE.open, mouth: MOUTH.grin, head: HEAD.round, browY: -4, browRot: 14, blush: 1, label: 'Wink' });
  state(2.4, { eyeL: EYE.open, eyeR: EYE.open, mouth: MOUTH.neutral, head: HEAD.round, browY: 0, browRot: 0, blush: 0, label: 'Hello' });
  // the surprise gets a jump
  tl.to('#face', { y: -40, duration: 0.18, ease: 'power2.out' }, 0.9).to('#face', { y: 0, duration: 0.45, ease: 'bounce.out' }, 1.08);
</script>
