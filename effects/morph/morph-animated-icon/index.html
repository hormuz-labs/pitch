<!doctype html><meta charset="utf-8">
<title>Morph: Animated Icon</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101014;display:grid;place-items:center}
  .card{width:420px;height:420px;border-radius:44px;background:#1b1b22;border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;box-shadow:0 40px 90px rgba(0,0,0,.5)}
  svg{width:200px;height:200px;overflow:visible}
  .name{overflow:hidden;height:34px;font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.8)}
  .name span{display:block;line-height:34px}
  .dots{position:absolute;bottom:90px;left:0;right:0;display:flex;justify-content:center;gap:12px}
  .dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18)}
  .dots i.on{background:#fff}
</style>
<div class="stage">
  <div class="card">
    <svg viewBox="-60 -60 120 120">
      <path id="bg" fill="#5b4dff" d="M -50 0 C -50 -28 -28 -50 0 -50 C 28 -50 50 -28 50 0 C 50 28 28 50 0 50 C -28 50 -50 28 -50 0 Z"/>
      <path id="icon" fill="#fff" d="M -18 -26 L 26 0 L -18 26 Z"/>
    </svg>
    <div class="name"><span id="nm">Play</span></div>
  </div>
  <div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/MorphSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(MorphSVGPlugin);
  const star = (() => { const p = []; for (let i = 0; i < 10; i++) { const r = i % 2 ? 12 : 28, a = -Math.PI / 2 + i * Math.PI / 5; p.push((i ? 'L' : 'M') + ' ' + (Math.cos(a) * r).toFixed(1) + ' ' + (Math.sin(a) * r).toFixed(1)); } return p.join(' ') + ' Z'; })();
  const ICONS = [
    { n: 'Play', d: 'M -18 -26 L 26 0 L -18 26 Z', c: '#5b4dff' },
    { n: 'Pause', d: 'M -24 -26 H -6 V 26 H -24 Z M 6 -26 H 24 V 26 H 6 Z', c: '#ff5c8a' },
    { n: 'Heart', d: 'M 0 28 C -36 6 -36 -24 -18 -26 C -8 -27 0 -18 0 -12 C 0 -18 8 -27 18 -26 C 36 -24 36 6 0 28 Z', c: '#ff9f1c' },
    { n: 'Alert', d: 'M -22 14 C -22 -8 -18 -22 0 -26 C 18 -22 22 -8 22 14 L 30 22 L -30 22 Z M -8 26 L 8 26 L 6 32 L -6 32 Z', c: '#00b894' },
    { n: 'Star', d: star, c: '#ffd23f' },
  ];
  const BG = [
    'M -50 0 C -50 -28 -28 -50 0 -50 C 28 -50 50 -28 50 0 C 50 28 28 50 0 50 C -28 50 -50 28 -50 0 Z',
    'M -50 -20 C -50 -40 -40 -50 -20 -50 L 20 -50 C 40 -50 50 -40 50 -20 L 50 20 C 50 40 40 50 20 50 L -20 50 C -40 50 -50 40 -50 20 Z',
    'M -48 8 C -54 -24 -30 -52 4 -50 C 36 -48 54 -22 50 10 C 46 40 20 54 -10 50 C -36 46 -44 30 -48 8 Z',
    'M 0 -52 L 45 -26 L 45 26 L 0 52 L -45 26 L -45 -26 Z',
    'M -50 0 C -50 -28 -28 -50 0 -50 C 28 -50 50 -28 50 0 C 50 28 28 50 0 50 C -28 50 -50 28 -50 0 Z',
  ];
  const D = 5, STEP = 1;
  const tl = fx.timeline({ duration: D });
  const dots = document.querySelectorAll('.dots i');
  // the bg blob slowly turns the whole loop
  tl.fromTo('#bg', { rotation: 0, transformOrigin: '50% 50%' }, { rotation: 360, duration: D, ease: 'none' }, 0);
  ICONS.forEach((ic, i) => {
    const next = ICONS[(i + 1) % ICONS.length], at = i * STEP + 0.55;
    // the morph itself: shape flows into the next, with a spin and a squeeze
    tl.to('#icon', { morphSVG: { shape: next.d, shapeIndex: 'auto' }, duration: 0.55, ease: 'power3.inOut' }, at)
      .fromTo('#icon', { rotation: 0, transformOrigin: '50% 50%' }, { rotation: 180, duration: 0.55, ease: 'power3.inOut', immediateRender: false }, at)
      .fromTo('#icon', { scale: 1, transformOrigin: '50% 50%' }, { scale: 0.7, duration: 0.28, ease: 'power2.in', immediateRender: false }, at)
      .to('#icon', { scale: 1, duration: 0.5, ease: 'back.out(3)' }, at + 0.28)
      .to('#bg', { morphSVG: BG[(i + 1) % BG.length], fill: next.c, duration: 0.6, ease: 'power3.inOut' }, at)
      .to('#nm', { yPercent: -110, duration: 0.2, ease: 'power2.in' }, at + 0.1)
      .add(() => { document.getElementById('nm').textContent = next.n; }, at + 0.3)
      .fromTo('#nm', { yPercent: 110 }, { yPercent: 0, duration: 0.35, ease: 'expo.out', immediateRender: false }, at + 0.32)
      .add(() => { dots.forEach((d, k) => d.classList.toggle('on', k === (i + 1) % ICONS.length)); }, at + 0.3);
  });
</script>
