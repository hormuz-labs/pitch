<!doctype html><meta charset="utf-8">
<title>Morph: Line to Radar Chart</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0f1117;color:#fff}
  svg{position:absolute;inset:0;width:100%;height:100%}
  .lbl{font-size:18px;letter-spacing:.14em;text-transform:uppercase;fill:rgba(255,255,255,.7);font-family:"Atlas Grotesk",sans-serif}
  .side{position:absolute;left:820px;top:200px;width:380px}
  .mask{overflow:hidden}
  .mask>*{display:block}
  .kick{font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:#7cf2c4}
  .kickm{margin-bottom:14px}
  h1{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:56px;line-height:1;letter-spacing:-.03em}
  .legend{margin-top:30px;display:flex;flex-direction:column;gap:12px;font-size:18px;color:rgba(255,255,255,.75)}
  .legend .row{display:flex;align-items:center;gap:12px}
  .legend i{width:14px;height:14px;border-radius:4px;background:#7cf2c4}
  .legend .b i{background:#ff7a9a}
  .score{margin-top:34px;font-family:"Sharp Grotesk",sans-serif;font-size:84px;line-height:1;letter-spacing:-.04em}
  .score small{font-size:20px;color:rgba(255,255,255,.5);letter-spacing:.1em;margin-left:10px}
</style>
<div class="stage">
  <svg viewBox="0 0 1280 720">
    <g id="grid" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.5">
      <path class="ring" d="M 420 224 L 538 292 L 538 428 L 420 496 L 302 428 L 302 292 Z"/>
      <path class="ring" d="M 420 292 L 479 326 L 479 394 L 420 428 L 361 394 L 361 326 Z"/>
      <line class="spoke" x1="420" y1="360" x2="420" y2="156"/>
      <line class="spoke" x1="420" y1="360" x2="597" y2="258"/>
      <line class="spoke" x1="420" y1="360" x2="597" y2="462"/>
      <line class="spoke" x1="420" y1="360" x2="420" y2="564"/>
      <line class="spoke" x1="420" y1="360" x2="243" y2="462"/>
      <line class="spoke" x1="420" y1="360" x2="243" y2="258"/>
    </g>
    <path id="frame" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" d="M 120 360 L 720 360"/>
    <path id="dataB" fill="rgba(255,122,154,.18)" stroke="#ff7a9a" stroke-width="3" stroke-linejoin="round" d="M 420 360 L 420 360 L 420 360 L 420 360 L 420 360 L 420 360 Z"/>
    <path id="dataA" fill="rgba(124,242,196,.22)" stroke="#7cf2c4" stroke-width="3" stroke-linejoin="round" d="M 420 360 L 420 360 L 420 360 L 420 360 L 420 360 L 420 360 Z"/>
    <g id="dots" fill="#7cf2c4"></g>
    <g id="labels">
      <text class="lbl" x="420" y="132" text-anchor="middle">Speed</text>
      <text class="lbl" x="618" y="250" text-anchor="start">Design</text>
      <text class="lbl" x="618" y="484" text-anchor="start">Support</text>
      <text class="lbl" x="420" y="606" text-anchor="middle">Price</text>
      <text class="lbl" x="222" y="484" text-anchor="end">Reach</text>
      <text class="lbl" x="222" y="250" text-anchor="end">Trust</text>
    </g>
  </svg>
  <div class="side">
    <div class="mask kickm"><div class="kick">Product scorecard</div></div>
    <div class="mask"><h1>Where we<br>stand</h1></div>
    <div class="legend"><div class="mask"><div class="row a"><i></i><span>Northwind</span></div></div><div class="mask"><div class="row b"><i></i><span>Category average</span></div></div></div>
    <div class="mask"><div class="score"><span id="num">0</span><small>/ 100</small></div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/MorphSVGPlugin.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(MorphSVGPlugin, DrawSVGPlugin);
  const CX = 420, CY = 360, R = 204;
  const ang = i => -Math.PI / 2 + i * Math.PI / 3;
  const pt = (i, v) => [CX + Math.cos(ang(i)) * R * v, CY + Math.sin(ang(i)) * R * v];
  const poly = vals => vals.map((v, i) => (i ? 'L' : 'M') + ' ' + pt(i, v).map(n => n.toFixed(1)).join(' ')).join(' ') + ' Z';
  const HEX = poly([1, 1, 1, 1, 1, 1]);
  const LINE = 'M 120 360 L 720 360';
  const A1 = [0.86, 0.72, 0.9, 0.58, 0.66, 0.8], A2 = [0.94, 0.88, 0.7, 0.76, 0.82, 0.9], B = [0.6, 0.62, 0.55, 0.7, 0.5, 0.58];
  const ZERO = poly([0, 0, 0, 0, 0, 0]);
  const dotsG = document.getElementById('dots');
  const dots = A1.map((v, i) => { const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); c.setAttribute('r', 7); const [x, y] = pt(i, v); c.setAttribute('cx', x); c.setAttribute('cy', y); dotsG.appendChild(c); return c; });
  const num = { v: 0 };
  const tl = fx.timeline({ duration: 10 });

  gsap.set('.ring, .spoke', { drawSVG: '0%' });
  gsap.set('#labels text', { opacity: 0 });
  gsap.set('#dots circle', { scale: 0, transformOrigin: '50% 50%' });
  // 1. a line draws itself
  tl.fromTo('#frame', { drawSVG: '0% 0%' }, { drawSVG: '0% 100%', duration: 1.2, ease: 'expo.inOut' }, 0.2)
    // 2. the line bends and closes into the hexagon that frames the chart
    .to('#frame', { morphSVG: { shape: HEX, shapeIndex: 0 }, duration: 1.4, ease: 'power3.inOut' }, 1.7)
    // 3. the grid and spokes draw from the centre, labels arrive on the tips
    .to('.spoke', { drawSVG: '0% 100%', duration: 0.7, ease: 'expo.out', stagger: 0.06 }, 3.0)
    .to('.ring', { drawSVG: '0% 100%', duration: 0.9, ease: 'expo.inOut', stagger: 0.15 }, 3.1)
    .to('#labels text', { opacity: 1, duration: 0.4, stagger: 0.06 }, 3.4)
    // 4. the data blooms out of the centre and springs into place
    .to('#dataB', { morphSVG: poly(B), duration: 0.9, ease: 'back.out(1.4)' }, 4.1)
    .to('#dataA', { morphSVG: poly(A1), duration: 1.0, ease: 'back.out(1.6)' }, 4.3)
    .to('#dots circle', { scale: 1, duration: 0.5, ease: 'back.out(3)', stagger: 0.05 }, 4.8)
    .to(num, { v: 76, duration: 1.0, ease: 'power2.out', onUpdate: () => { document.getElementById('num').textContent = Math.round(num.v); } }, 4.4)
    // 5. a second dataset: the shape re-flows to the new values
    .to('#dataA', { morphSVG: poly(A2), duration: 1.0, ease: 'elastic.out(1,0.6)' }, 6.6)
    .to(num, { v: 84, duration: 0.8, ease: 'power2.out', onUpdate: () => { document.getElementById('num').textContent = Math.round(num.v); } }, 6.6);
  A2.forEach((v, i) => { const [x, y] = pt(i, v); tl.to(dots[i], { attr: { cx: x, cy: y }, duration: 1.0, ease: 'elastic.out(1,0.6)' }, 6.6); });
  // copy on the right
  tl.from('.kick', { yPercent: 110, duration: 0.6, ease: 'expo.out' }, 3.2)
    .from('h1', { yPercent: 110, duration: 0.8, ease: 'expo.out' }, 3.35)
    .from('.legend .row', { yPercent: 110, duration: 0.6, ease: 'expo.out', stagger: 0.05 }, 4.0)
    .from('.score', { yPercent: 110, duration: 0.7, ease: 'expo.out' }, 4.3);
  // 6. it all folds back into the line so the loop closes
  tl.to('#dots circle', { scale: 0, duration: 0.3, ease: 'power2.in', stagger: 0.03 }, 8.4)
    .to('#dataA', { morphSVG: ZERO, duration: 0.6, ease: 'power3.in' }, 8.5)
    .to('#dataB', { morphSVG: ZERO, duration: 0.6, ease: 'power3.in' }, 8.55)
    .to('#labels text', { opacity: 0, duration: 0.3, stagger: 0.03 }, 8.5)
    .to('.ring, .spoke', { drawSVG: '0% 0%', duration: 0.5, ease: 'expo.in', stagger: 0.03 }, 8.6)
    .to(['.kick', 'h1', '.legend .row', '.score'], { yPercent: -110, duration: 0.45, ease: 'expo.in', stagger: 0.03 }, 8.6)
    .to('#frame', { morphSVG: { shape: LINE, shapeIndex: 0 }, duration: 0.8, ease: 'power3.inOut' }, 9.0)
    .to('#frame', { drawSVG: '100% 100%', duration: 0.35, ease: 'expo.in' }, 9.65);
</script>
