<!doctype html><meta charset="utf-8">
<title>Morph: Weather Icons</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#dfe9f5;display:grid;place-items:center}
  .card{width:560px;height:560px;border-radius:48px;background:#3b82f6;color:#fff;position:relative;overflow:hidden;box-shadow:0 40px 90px rgba(30,60,120,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  svg{width:300px;height:300px;overflow:visible}
  .temp{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:96px;line-height:1;letter-spacing:-.04em}
  .mask{overflow:hidden;height:34px}
  .mask span{display:block;line-height:34px;font-size:22px;letter-spacing:.24em;text-transform:uppercase;opacity:.85}
  .row{position:absolute;left:0;right:0;bottom:40px;display:flex;justify-content:center;gap:28px;font-size:16px;letter-spacing:.14em;opacity:.7}
  .city{position:absolute;top:44px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.3em;text-transform:uppercase;opacity:.85}
</style>
<div class="stage">
  <div class="card" id="card">
    <div class="city">Northwind · Today</div>
    <svg viewBox="-80 -80 160 160">
      <g id="rays" stroke="#fff" stroke-width="7" stroke-linecap="round"></g>
      <g id="precip" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="#fff"></g>
      <path id="bolt" fill="#ffd23f" d="M 6 4 L -10 30 L -2 30 L -8 52 L 12 22 L 4 22 L 10 4 Z" opacity="0" transform-origin="0 20"/>
      <path id="body" fill="#fff" d="M -32 0 C -32 -18 -18 -32 0 -32 C 18 -32 32 -18 32 0 C 32 18 18 32 0 32 C -18 32 -32 18 -32 0 Z"/>
    </svg>
    <div class="temp"><span id="deg">24</span>°</div>
    <div class="mask"><span id="lab">Sunny</span></div>
    <div class="row"><span>H 27°</span><span>L 16°</span><span>Wind 8</span></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/MorphSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(MorphSVGPlugin);
  const SUN = 'M -32 0 C -32 -18 -18 -32 0 -32 C 18 -32 32 -18 32 0 C 32 18 18 32 0 32 C -18 32 -32 18 -32 0 Z';
  const CLOUD = 'M -46 22 C -64 22 -64 -8 -44 -8 C -44 -30 -16 -40 -4 -22 C 8 -38 40 -30 36 -8 C 56 -8 56 22 38 22 Z';
  const CLOUD_LOW = 'M -46 10 C -64 10 -64 -20 -44 -20 C -44 -42 -16 -52 -4 -34 C 8 -50 40 -42 36 -20 C 56 -20 56 10 38 10 Z';
  // rays for the sun
  const rays = document.getElementById('rays');
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; const l = document.createElementNS('http://www.w3.org/2000/svg', 'line'); l.setAttribute('x1', Math.cos(a) * 44); l.setAttribute('y1', Math.sin(a) * 44); l.setAttribute('x2', Math.cos(a) * 58); l.setAttribute('y2', Math.sin(a) * 58); rays.appendChild(l); }
  // drops (lines) and flakes (circles) under the cloud
  const precip = document.getElementById('precip');
  const drops = [], flakes = [];
  for (let i = 0; i < 5; i++) {
    const x = -32 + i * 16;
    const d = document.createElementNS('http://www.w3.org/2000/svg', 'line'); d.setAttribute('x1', x); d.setAttribute('y1', 24); d.setAttribute('x2', x - 4); d.setAttribute('y2', 38); d.setAttribute('opacity', 0); precip.appendChild(d); drops.push(d);
    const f = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); f.setAttribute('cx', x); f.setAttribute('cy', 30); f.setAttribute('r', 4); f.setAttribute('opacity', 0); precip.appendChild(f); flakes.push(f);
  }
  const STATES = [
    { lab: 'Sunny', deg: 24, bg: '#3b82f6', body: SUN, rays: 1 },
    { lab: 'Cloudy', deg: 19, bg: '#64748b', body: CLOUD, rays: 0 },
    { lab: 'Rain', deg: 14, bg: '#334155', body: CLOUD_LOW, rays: 0, rain: 1 },
    { lab: 'Snow', deg: -2, bg: '#7c9cc4', body: CLOUD_LOW, rays: 0, snow: 1 },
    { lab: 'Storm', deg: 11, bg: '#1e1b4b', body: CLOUD_LOW, rays: 0, bolt: 1 },
  ];
  const D = 7, STEP = D / STATES.length, deg = { v: 24 };
  const tl = fx.timeline({ duration: D });
  // the sun turns all loop; only visible while it is the sun
  tl.fromTo('#rays', { rotation: 0, transformOrigin: '0 0' }, { rotation: 90, duration: D, ease: 'none' }, 0);
  STATES.forEach((s, i) => {
    const next = STATES[(i + 1) % STATES.length], at = i * STEP + 0.85;
    tl.to('#body', { morphSVG: next.body, duration: 0.7, ease: 'power3.inOut' }, at)
      .to('#rays line', { scale: next.rays, opacity: next.rays, transformOrigin: '0 0', duration: 0.45, ease: next.rays ? 'back.out(2)' : 'power2.in', stagger: 0.03 }, at + (next.rays ? 0.3 : 0))
      .to('#card', { backgroundColor: next.bg, duration: 0.8, ease: 'power2.inOut' }, at)
      .to(deg, { v: next.deg, duration: 0.7, ease: 'power2.out', onUpdate: () => { document.getElementById('deg').textContent = Math.round(deg.v); } }, at)
      .to('#lab', { yPercent: -110, duration: 0.2, ease: 'power2.in' }, at + 0.1)
      .add(() => { document.getElementById('lab').textContent = next.lab; }, at + 0.3)
      .fromTo('#lab', { yPercent: 110 }, { yPercent: 0, duration: 0.35, ease: 'expo.out', immediateRender: false }, at + 0.32);
    // rain: drops fall in a stagger under the cloud for the length of the state
    const holdStart = at + 0.6, hold = STEP - 0.2;
    if (next.rain) drops.forEach((d, k) => tl.fromTo(d, { y: -6, opacity: 0 }, { y: 16, opacity: 1, duration: 0.45, ease: 'power1.in', repeat: Math.floor(hold / 0.55), repeatDelay: 0.1, immediateRender: false, onRepeat: () => {} }, holdStart + k * 0.09));
    if (next.snow) flakes.forEach((f, k) => tl.fromTo(f, { y: -4, opacity: 0, x: 0 }, { y: 20, opacity: 1, x: k % 2 ? 6 : -6, duration: 0.9, ease: 'sine.inOut', repeat: Math.floor(hold / 1.0), repeatDelay: 0.1, immediateRender: false }, holdStart + k * 0.12));
    if (next.bolt) tl.fromTo('#bolt', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(3)', immediateRender: false }, holdStart)
      .to('#bolt', { opacity: 0.3, duration: 0.08, repeat: 3, yoyo: true }, holdStart + 0.5)
      .to('#bolt', { opacity: 0, scale: 0.4, duration: 0.2, ease: 'power2.in' }, holdStart + hold - 0.2);
    // whatever precipitation was showing clears before the next morph
    tl.to([...drops, ...flakes], { opacity: 0, duration: 0.15 }, at + STEP - 0.1);
  });
  // the cloud drifts a touch while it is a cloud, the sun breathes while it is the sun
  tl.fromTo('#body', { x: 0 }, { x: 4, duration: D / 4, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 0);
</script>
