<!doctype html><meta charset="utf-8">
<title>Morph: Video Mask</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b0a12}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:url(#m)}
  svg.defs{position:absolute;inset:0;width:100%;height:100%}
  #edge{fill:none;stroke:#fff;stroke-width:3}
  .title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;pointer-events:none}
  .mask{overflow:hidden}
  .mask>*{display:block}
  .t{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:150px;line-height:1;letter-spacing:-.05em;text-transform:uppercase}
  .s{font-size:20px;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.75)}
</style>
<div class="stage">
  <svg class="defs" viewBox="0 0 1280 720"><path id="edge" d=""/></svg>
  <video id="v" src="../../../assets/backgrounds/drift-violet.mp4" muted playsinline preload="auto"></video>
  <svg width="0" height="0" style="position:absolute"><clipPath id="m" clipPathUnits="userSpaceOnUse"><path id="mp" d=""/></clipPath></svg>
  <div class="title">
    <div class="mask"><div class="t">Open</div></div>
    <div class="mask"><div class="s">Northwind Pictures · 2026</div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/MorphSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(MorphSVGPlugin);
  // every shape is 8 cubic segments around the centre so the morph stays clean
  function ring(cx, cy, fn) {
    const n = 8, pts = [];
    for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; const r = fn(a, i); pts.push([cx + Math.cos(a) * r.x, cy + Math.sin(a) * r.y]); }
    const k = 0.5523 * Math.PI * 2 / n / (Math.PI / 2);   // handle length factor per segment
    let d = '';
    for (let i = 0; i < n; i++) {
      const p0 = pts[i], p1 = pts[(i + 1) % n];
      const a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2;
      const r0 = fn(a0, i), r1 = fn(a1, (i + 1) % n);
      const h0 = [p0[0] - Math.sin(a0) * r0.x * k * 0.55, p0[1] + Math.cos(a0) * r0.y * k * 0.55];
      const h1 = [p1[0] + Math.sin(a1) * r1.x * k * 0.55, p1[1] - Math.cos(a1) * r1.y * k * 0.55];
      d += (i ? '' : `M ${p0[0]} ${p0[1]} `) + `C ${h0[0]} ${h0[1]} ${h1[0]} ${h1[1]} ${p1[0]} ${p1[1]} `;
    }
    return d + 'Z';
  }
  const CX = 640, CY = 360;
  const DOT = ring(CX, CY, () => ({ x: 70, y: 70 }));
  const BLOB = ring(CX, CY, (a, i) => { const r = 200 + [60, -30, 80, -10, 50, -40, 30, 10][i]; return { x: r, y: r * 0.9 }; });
  const FLOWER = ring(CX, CY, (a, i) => { const r = i % 2 ? 190 : 340; return { x: r, y: r }; });
  const FULL = ring(CX, CY, () => ({ x: 1000, y: 700 }));
  const v = document.getElementById('v');
  fx.wait(new Promise(r => { if (v.readyState >= 2) r(); else v.addEventListener('loadeddata', r, { once: true }); }));

  const tl = fx.timeline({ duration: 5 });
  gsap.set(['#mp', '#edge'], { attr: { d: DOT } });
  // the shape opens in stages, each a different form, the last one swallowing the frame
  const step = (shape, at, dur, ease) => {
    tl.to('#mp', { morphSVG: shape, duration: dur, ease }, at)
      .to('#edge', { morphSVG: shape, duration: dur, ease }, at + 0.06);
  };
  step(BLOB, 0.2, 0.8, 'back.out(1.5)');
  step(FLOWER, 1.2, 0.8, 'power3.inOut');
  step(FULL, 2.2, 1.0, 'expo.inOut');
  tl.from('.t', { yPercent: 110, duration: 0.8, ease: 'expo.out' }, 2.7)
    .from('.s', { yPercent: 110, duration: 0.6, ease: 'expo.out' }, 2.9)
    // the shape slowly turns while it is a blob or flower, so nothing is ever still
    .fromTo(['#mp', '#edge'], { rotation: 0 }, { rotation: 40, transformOrigin: '640px 360px', duration: 2.4, ease: 'sine.inOut' }, 0.2)
    // close: the frame draws back into the dot, the title leaves
    .to(['.t', '.s'], { yPercent: -110, duration: 0.45, ease: 'expo.in', stagger: 0.05 }, 4.1);
  step(BLOB, 4.25, 0.5, 'expo.inOut');
  step(DOT, 4.65, 0.35, 'power3.inOut');
  tl.to(['#mp', '#edge'], { rotation: 0, duration: 0.7, ease: 'sine.inOut' }, 4.3);
  const seekVideo = t => { const vt = (t * 1.0) % 16; if (Math.abs(v.currentTime - vt) > 0.02) v.currentTime = vt; };
  const base = window.__fx.seek;
  window.__fx.seek = t => { seekVideo(t); base(t); };
</script>
