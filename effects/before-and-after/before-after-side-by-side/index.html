<!doctype html><meta charset="utf-8">
<title>Before & After: Side By Side</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#111114;color:#fff;font-family:"Atlas Grotesk",sans-serif}
  .panel{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;will-change:transform}
  .panel.l{left:0}.panel.r{right:0}
  .img{position:absolute;inset:0;background:url("../../../assets/backgrounds/ocean.png") center/cover;will-change:transform}
  .l .img{filter:grayscale(.9) brightness(.55) contrast(.85)}
  .r .img{filter:saturate(1.35) contrast(1.08)}
  .noise{position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 2px,transparent 2px 4px)}
  .lab{position:absolute;left:48px;top:48px;padding:12px 20px;border-radius:999px;font-size:22px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;overflow:hidden;will-change:transform}
  .l .lab{background:rgba(0,0,0,.65);color:#bbb}.r .lab{background:#d9ff3d;color:#0d0d0f}
  .seam{position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:#fff;transform-origin:top;will-change:transform}
  .cap{position:absolute;left:0;right:0;bottom:56px;text-align:center;font-size:30px;font-weight:500;letter-spacing:-.01em;overflow:hidden}
  .cap span{display:block;text-shadow:0 4px 20px rgba(0,0,0,.6)}
  .stat{position:absolute;right:48px;bottom:48px;background:rgba(0,0,0,.6);border-radius:16px;padding:16px 22px;font-size:20px;line-height:1.3;opacity:0}
  .stat b{display:block;font-size:44px;font-weight:500;letter-spacing:-.03em;color:#d9ff3d}
  .arrow{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:56px;opacity:0;will-change:transform}
</style>
<div class="stage">
  <div class="panel l"><div class="img"></div><div class="noise"></div><div class="lab">Before</div></div>
  <div class="panel r"><div class="img"></div><div class="lab">After</div>
    <div class="stat"><b>+64%</b>brighter, sharper, done</div>
  </div>
  <div class="seam"></div>
  <div class="arrow">→</div>
  <div class="cap"><span>Same room. One weekend.</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 5 });
  // the two halves slide in from their own sides and meet at the seam
  tl.from('.panel.l', { xPercent: -100, duration: 0.8, ease: 'expo.out' }, 0)
    .from('.panel.r', { xPercent: 100, duration: 0.8, ease: 'expo.out' }, 0.08)
    .fromTo('.seam', { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: 'expo.inOut' }, 0.55)
    .from('.lab', { yPercent: 160, opacity: 0, duration: 0.5, stagger: 0.1, ease: 'back.out(1.8)' }, 0.7)
    // both shots share one slow push, so they read as the same photo
    .fromTo('.img', { scale: 1.12 }, { scale: 1.0, duration: 4.4, ease: 'none' }, 0.3)
    // the after side gets emphasis: seam pushes left, after panel grows
    .to('.panel.l', { xPercent: -14, duration: 0.7, ease: 'expo.inOut' }, 1.7)
    .to('.panel.r', { xPercent: -14, duration: 0.7, ease: 'expo.inOut' }, 1.7)
    .to('.seam', { xPercent: -1400 / 6 * 0.12 * 6 / 6 * 1, x: -90, duration: 0.7, ease: 'expo.inOut' }, 1.7)
    .fromTo('.arrow', { scale: 0, opacity: 0, x: 0 }, { scale: 1, opacity: 1, x: -90, duration: 0.5, ease: 'back.out(2.2)' }, 1.85)
    .to('.arrow', { scale: 0, opacity: 0, duration: 0.3, ease: 'back.in(2)' }, 2.9)
    .to('.stat', { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 2.1)
    .from('.stat', { y: 30 }, 2.1)
    .from('.cap span', { yPercent: 120, duration: 0.55, ease: 'expo.out' }, 2.3)
    // out: both halves leave the way they came
    .to('.cap span', { yPercent: -120, duration: 0.3, ease: 'expo.in' }, 4.35)
    .to('.stat', { opacity: 0, y: 20, duration: 0.25 }, 4.35)
    .to('.lab', { yPercent: -160, opacity: 0, duration: 0.3, ease: 'expo.in' }, 4.4)
    .to('.seam', { scaleY: 0, transformOrigin: 'bottom', duration: 0.35, ease: 'expo.in' }, 4.45)
    .to('.panel.l', { xPercent: -100, duration: 0.45, ease: 'expo.in' }, 4.55)
    .to('.panel.r', { xPercent: 100, duration: 0.45, ease: 'expo.in' }, 4.55);
</script>
