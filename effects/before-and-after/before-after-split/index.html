<!doctype html><meta charset="utf-8">
<title>Before & After: Split</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0c0c0e;color:#fff;font-family:"Atlas Grotesk",sans-serif}
  .layer{position:absolute;inset:0;will-change:transform,clip-path}
  .img{position:absolute;inset:0;background:url("../../../assets/backgrounds/aurora.png") center/cover;will-change:transform}
  .after .img{filter:saturate(1.4) contrast(1.1) brightness(1.05)}
  .before .img{filter:grayscale(.95) brightness(.5) contrast(.8)}
  .scratch{position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 1px,transparent 1px 7px),repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 3px,transparent 3px 6px)}
  .half{position:absolute;inset:0}
  .half.tl{clip-path:polygon(0 0,100% 0,0 100%)}
  .half.br{clip-path:polygon(100% 0,100% 100%,0 100%)}
  .edge{position:absolute;left:50%;top:50%;width:1800px;height:10px;margin:-5px 0 0 -900px;background:#fff;transform:rotate(-29.36deg);will-change:transform,opacity;box-shadow:0 0 40px rgba(255,255,255,.7)}
  .lab{position:absolute;padding:12px 20px;border-radius:999px;font-size:22px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;will-change:transform}
  .lab.b{left:56px;top:52px;background:rgba(0,0,0,.65);color:#ccc}
  .lab.a{right:56px;bottom:52px;background:#fff;color:#111}
  .big{position:absolute;left:0;right:0;top:50%;text-align:center;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-size:140px;font-weight:500;letter-spacing:-.05em;line-height:1;transform:translateY(-50%);text-transform:uppercase;overflow:hidden}
  .big span{display:block;text-shadow:0 10px 40px rgba(0,0,0,.6)}
</style>
<div class="stage">
  <div class="layer after"><div class="img"></div></div>
  <div class="layer before half tl"><div class="img"></div><div class="scratch"></div></div>
  <div class="layer before half br"><div class="img"></div><div class="scratch"></div></div>
  <div class="edge"></div>
  <div class="lab b">Before</div><div class="lab a">After</div>
  <div class="big"><span>Reveal</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 5 });
  // direction perpendicular to the diagonal (1280x720 → angle atan(720/1280))
  const ang = Math.atan2(720, 1280), nx = Math.sin(ang), ny = -Math.cos(ang);
  const D = 1000;
  tl.fromTo('.before .img', { scale: 1.08 }, { scale: 1.0, duration: 5, ease: 'none' }, 0)
    .fromTo('.after .img', { scale: 1.0 }, { scale: 1.1, duration: 5, ease: 'none' }, 0)
    .from('.lab.b', { xPercent: -140, duration: 0.6, ease: 'expo.out' }, 0.1)
    // a light cuts the frame along the diagonal
    .fromTo('.edge', { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.5, ease: 'expo.inOut' }, 0.9)
    // the two halves of "before" split apart, sliding off perpendicular to the cut
    .to('.half.tl', { x: -nx * D, y: -ny * D, duration: 1.1, ease: 'expo.inOut' }, 1.35)
    .to('.half.br', { x: nx * D, y: ny * D, duration: 1.1, ease: 'expo.inOut' }, 1.35)
    .to('.edge', { opacity: 0, scaleX: 1.2, duration: 0.5, ease: 'power2.out' }, 1.9)
    .to('.lab.b', { xPercent: -140, duration: 0.4, ease: 'expo.in' }, 1.4)
    .from('.lab.a', { xPercent: 140, duration: 0.6, ease: 'expo.out' }, 2.1)
    .from('.big span', { yPercent: 120, duration: 0.7, ease: 'expo.out' }, 2.2)
    .to('.big span', { yPercent: -120, duration: 0.4, ease: 'expo.in' }, 3.9)
    // halves come back to close the loop
    .to('.lab.a', { xPercent: 140, duration: 0.4, ease: 'expo.in' }, 4.0)
    .to('.half.tl', { x: 0, y: 0, duration: 0.7, ease: 'expo.inOut' }, 4.25)
    .to('.half.br', { x: 0, y: 0, duration: 0.7, ease: 'expo.inOut' }, 4.25)
    .fromTo('.edge', { scaleX: 1, opacity: 0 }, { opacity: 1, duration: 0.2 }, 4.7)
    .to('.edge', { opacity: 0, duration: 0.1 }, 4.9)
    .to('.lab.b', { xPercent: 0, duration: 0.4, ease: 'expo.out' }, 4.6);
</script>
