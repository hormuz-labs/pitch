<!doctype html><meta charset="utf-8">
<title>Before & After: Slider</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0f0f12;color:#fff;font-family:"Atlas Grotesk",sans-serif}
  .frame{position:absolute;inset:40px;border-radius:28px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6)}
  .img{position:absolute;inset:0;background:url("../../../assets/backgrounds/sunset.png") center/cover}
  .before .img{filter:grayscale(1) brightness(.6) contrast(.8);}
  .before,.after{position:absolute;inset:0}
  .after{clip-path:inset(0 0 0 50%)}
  .after .img{filter:saturate(1.3) contrast(1.05)}
  .room{position:absolute;inset:0}
  .wall{position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0))}
  .floor{position:absolute;left:0;right:0;bottom:0;height:38%;background:rgba(0,0,0,.35);border-top:2px solid rgba(255,255,255,.15)}
  .sofa{position:absolute;left:24%;bottom:19%;width:38%;height:22%;border-radius:22px 22px 8px 8px;background:#3a3a3f}
  .after .sofa{background:#f2e6d0}
  .sofa::before{content:"";position:absolute;left:-4%;right:-4%;bottom:0;height:45%;border-radius:12px;background:inherit;filter:brightness(.88)}
  .lamp{position:absolute;left:70%;bottom:27%;width:6px;height:170px;background:#555}
  .lamp::before{content:"";position:absolute;left:-50px;top:-50px;width:106px;height:70px;border-radius:8px 8px 40px 40px;background:#555}
  .after .lamp,.after .lamp::before{background:#d9a441}
  .glow{position:absolute;left:calc(70% - 120px);bottom:22%;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,90,.5),transparent 60%);opacity:0}
  .after .glow{opacity:1}
  .art{position:absolute;left:36%;top:14%;width:16%;height:22%;border:6px solid #444;background:#2a2a2e}
  .after .art{border-color:#fff;background:linear-gradient(135deg,#ff6a3d,#ffd23f)}
  .handle{position:absolute;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;background:#fff;will-change:transform}
  .knob{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:8px;will-change:transform}
  .knob i{width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent}
  .knob i.l{border-right:11px solid #111}.knob i.r{border-left:11px solid #111}
  .lab{position:absolute;top:36px;padding:10px 18px;border-radius:999px;font-size:20px;font-weight:500;letter-spacing:.18em;text-transform:uppercase}
  .lab.b{left:36px;background:rgba(0,0,0,.6)}.lab.a{right:36px;background:#fff;color:#111}
  .title{position:absolute;left:0;right:0;bottom:60px;text-align:center;font-size:30px;font-weight:500;overflow:hidden}
  .title span{display:block;text-shadow:0 4px 20px rgba(0,0,0,.7)}
</style>
<div class="stage">
  <div class="frame">
    <div class="before"><div class="img"></div><div class="room"><div class="wall"></div><div class="floor"></div><div class="art"></div><div class="sofa"></div><div class="glow"></div><div class="lamp"></div></div></div>
    <div class="after"><div class="img"></div><div class="room"><div class="wall"></div><div class="floor"></div><div class="art"></div><div class="sofa"></div><div class="glow"></div><div class="lamp"></div></div></div>
    <div class="handle"></div>
    <div class="knob"><i class="l"></i><i class="r"></i></div>
    <div class="lab b">Before</div><div class="lab a">After</div>
    <div class="title"><span>Living room — 3 week renovation</span></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 10 });
  const pos = { p: 100 }; // percent of the frame where the curtain sits
  const frame = document.querySelector('.frame');
  const W = () => frame.clientWidth;
  function apply() {
    document.querySelector('.after').style.clipPath = `inset(0 0 0 ${pos.p}%)`;
    const x = (pos.p / 100 - 0.5) * W();
    gsap.set('.handle', { x }); gsap.set('.knob', { x });
  }
  const glide = (to, dur, ease, at) => tl.to(pos, { p: to, duration: dur, ease, onUpdate: apply }, at);
  tl.from('.frame', { scale: 0.92, opacity: 0, duration: 0.8, ease: 'expo.out' }, 0)
    .from('.lab', { y: -20, opacity: 0, duration: 0.5, stagger: 0.1, ease: 'power3.out' }, 0.5)
    .from('.title span', { yPercent: 120, duration: 0.6, ease: 'expo.out' }, 0.9);
  // the curtain starts fully closed at the right edge and glides open
  tl.set(pos, { p: 100, onUpdate: apply }, 0);
  glide(28, 2.2, 'expo.inOut', 1.0);
  tl.to('.knob', { scale: 1.12, duration: 0.3, ease: 'power2.out' }, 1.0).to('.knob', { scale: 1, duration: 0.6, ease: 'power2.inOut' }, 3.0);
  // a hesitation: back to the middle, then a slow reveal all the way across
  glide(58, 1.4, 'power3.inOut', 3.7);
  glide(4, 1.9, 'expo.inOut', 5.5);
  tl.to('.knob', { scale: 1.12, duration: 0.3, ease: 'power2.out' }, 5.5).to('.knob', { scale: 1, duration: 0.6, ease: 'power2.inOut' }, 7.2);
  // the shot breathes the whole time
  tl.fromTo('.img', { scale: 1.06 }, { scale: 1.0, duration: 10, ease: 'none' }, 0);
  // close back to the start for the loop
  glide(100, 1.2, 'expo.inOut', 8.6);
  tl.to('.title span', { yPercent: -120, duration: 0.35, ease: 'expo.in' }, 9.5)
    .to('.lab', { y: -20, opacity: 0, duration: 0.3, ease: 'power2.in' }, 9.55);
</script>
