<!doctype html><meta charset="utf-8">
<title>Before & After: Swipe</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0e0e11;color:#fff;font-family:"Atlas Grotesk",sans-serif}
  .card{position:absolute;inset:60px;border-radius:32px;overflow:hidden;will-change:transform}
  .layer{position:absolute;inset:0}
  .img{position:absolute;inset:0;background:url("../../../assets/backgrounds/ocean.png") center/cover;will-change:transform}
  .before .img{filter:grayscale(1) brightness(.55) contrast(.85)}
  .after .img{filter:saturate(1.35) contrast(1.05)}
  .after{clip-path:inset(0 100% 0 0)}
  .face{position:absolute;left:50%;top:50%;width:360px;height:440px;margin:-220px 0 0 -180px;border-radius:180px 180px 150px 150px;background:#6b6b70}
  .after .face{background:#e5b48c}
  .face::before,.face::after{content:"";position:absolute;top:150px;width:34px;height:34px;border-radius:50%;background:#222}
  .face::before{left:90px}.face::after{right:90px}
  .smile{position:absolute;left:50%;top:290px;width:120px;height:40px;margin-left:-60px;border-bottom:10px solid #222;border-radius:0 0 80px 80px}
  .before .smile{height:0;border-radius:0;width:90px;margin-left:-45px}
  .hair{position:absolute;left:50%;top:50%;width:380px;height:200px;margin:-236px 0 0 -190px;border-radius:190px 190px 40px 40px;background:#3a3a3e}
  .after .hair{background:#5b2a12;height:260px}
  .hand{position:absolute;left:50%;top:50%;width:70px;height:90px;margin:-45px 0 0 -35px;border-radius:26px 26px 30px 30px;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.5);will-change:transform;opacity:0}
  .hand::before{content:"";position:absolute;left:24px;top:-34px;width:22px;height:50px;border-radius:11px;background:#fff}
  .edge{position:absolute;top:0;bottom:0;left:0;width:5px;background:#fff;will-change:transform}
  .lab{position:absolute;top:36px;padding:12px 20px;border-radius:999px;font-size:22px;font-weight:500;letter-spacing:.18em;text-transform:uppercase}
  .lab.b{left:36px;background:rgba(0,0,0,.6)}.lab.a{right:36px;background:#fff;color:#111}
  .cap{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:34px;font-weight:500;overflow:hidden}
  .cap span{display:block;text-shadow:0 4px 20px rgba(0,0,0,.6)}
  .hint{position:absolute;left:0;right:0;top:40px;text-align:center;font-size:22px;letter-spacing:.22em;text-transform:uppercase;opacity:.7}
</style>
<div class="stage">
  <div class="hint">Swipe to compare</div>
  <div class="card">
    <div class="layer before"><div class="img"></div><div class="hair"></div><div class="face"><div class="smile"></div></div></div>
    <div class="layer after"><div class="img"></div><div class="hair"></div><div class="face"><div class="smile"></div></div></div>
    <div class="edge"></div>
    <div class="lab b">Before</div><div class="lab a">After</div>
    <div class="cap"><span>90-day glow-up</span></div>
    <div class="hand"></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 5 });
  const s = { p: 0 };
  const card = document.querySelector('.card');
  const apply = () => {
    document.querySelector('.after').style.clipPath = `inset(0 ${100 - s.p}% 0 0)`;
    gsap.set('.edge', { x: s.p / 100 * card.clientWidth });
  };
  tl.set(s, { p: 0, onUpdate: apply }, 0)
    .from('.card', { y: 60, opacity: 0, duration: 0.7, ease: 'expo.out' }, 0)
    .from('.hint', { y: -20, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0.3)
    .from('.lab.b', { xPercent: -160, duration: 0.5, ease: 'expo.out' }, 0.5)
    // a finger lands and swipes across: the after glides in behind it
    .fromTo('.hand', { x: -300, y: 160, opacity: 0, scale: 0.8 }, { x: -320, y: 120, opacity: 1, scale: 1, duration: 0.5, ease: 'power3.out' }, 0.9)
    .to('.hand', { x: 420, duration: 1.3, ease: 'expo.inOut' }, 1.5)
    .to(s, { p: 100, duration: 1.3, ease: 'expo.inOut', onUpdate: apply }, 1.5)
    .to('.hand', { y: 40, opacity: 0, duration: 0.45, ease: 'power2.in' }, 2.8)
    .from('.lab.a', { xPercent: 160, duration: 0.5, ease: 'expo.out' }, 2.5)
    .from('.cap span', { yPercent: 120, duration: 0.6, ease: 'expo.out' }, 2.7)
    .fromTo('.img', { scale: 1.08 }, { scale: 1.0, duration: 5, ease: 'none' }, 0)
    // swipe back for a clean loop
    .to('.cap span', { yPercent: -120, duration: 0.3, ease: 'expo.in' }, 4.1)
    .to('.lab.a', { xPercent: 160, duration: 0.35, ease: 'expo.in' }, 4.15)
    .to(s, { p: 0, duration: 0.6, ease: 'expo.inOut', onUpdate: apply }, 4.3)
    .to('.lab.b', { xPercent: 0, duration: 0.4, ease: 'expo.out' }, 4.6);
</script>
