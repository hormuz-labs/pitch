<!doctype html><meta charset="utf-8">
<title>Kaleidoscope: Intro Slide</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0e0b1e}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #k{clip-path:circle(120% at 50% 50%)}
  .slide{position:absolute;inset:0;display:flex;align-items:center;padding-left:112px;gap:60px;color:#fff}
  .disc{width:230px;height:230px;border-radius:50%;flex:none;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .disc canvas{position:absolute;left:50%;top:50%;width:460px;height:460px;transform:translate(-50%,-50%)}
  .copy{display:flex;flex-direction:column;gap:14px}
  .mask{overflow:hidden}
  .mask>*{display:block}
  .kick{font-size:17px;letter-spacing:.38em;text-transform:uppercase;color:#ffb3e6}
  .title{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:132px;line-height:.92;letter-spacing:-.04em}
  .foot{font-size:22px;color:rgba(255,255,255,.7)}
  .bar{height:3px;width:120px;background:#ffb3e6;transform-origin:left}
</style>
<div class="stage">
  <canvas id="k" width="1280" height="720"></canvas>
  <div class="slide">
    <div class="disc"><canvas id="d" width="460" height="460"></canvas></div>
    <div class="copy">
      <div class="mask"><div class="kick">Showreel · 2026</div></div>
      <div class="mask"><div class="title">Prism</div></div>
      <div class="mask"><div class="title">Studio</div></div>
      <div class="bar"></div>
      <div class="mask"><div class="foot">Motion, identity and the space between.</div></div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 5, W = 1280, H = 720, SEG = 12;
  const big = document.getElementById('k').getContext('2d');
  const disc = document.getElementById('d').getContext('2d');
  // the source pattern: seeded shapes on an offscreen tile
  const src = document.createElement('canvas'); src.width = src.height = 1400;
  const sc = src.getContext('2d');
  const rnd = fx.rng(23);
  const shapes = Array.from({ length: 220 }, (_, i) => ({
    x: rnd() * 1400, y: rnd() * 1400, r: 16 + rnd() * 60, k: i % 3,
    c: ['#ff4fa3', '#ffb347', '#4fd1ff', '#8f6bff', '#fff36b', '#59ffb0'][i % 6],
    vx: (rnd() - 0.5) * 120, vy: (rnd() - 0.5) * 120, rot: rnd() * 6.28,
  }));
  function drawSource(t) {
    const u = t / D * Math.PI * 2;
    sc.fillStyle = '#1b1440'; sc.fillRect(0, 0, 1400, 1400);
    for (const s of shapes) {
      const x = s.x + Math.sin(u + s.rot) * s.vx, y = s.y + Math.cos(u + s.rot) * s.vy;
      sc.fillStyle = s.c; sc.globalAlpha = 0.92;
      sc.save(); sc.translate(x, y); sc.rotate(s.rot + u);
      sc.beginPath();
      if (s.k === 0) sc.arc(0, 0, s.r, 0, 6.2832);
      else if (s.k === 1) { sc.moveTo(0, -s.r); sc.lineTo(s.r, s.r); sc.lineTo(-s.r, s.r); sc.closePath(); }
      else sc.rect(-s.r * 0.7, -s.r * 0.3, s.r * 1.4, s.r * 0.6);
      sc.fill(); sc.restore();
    }
    sc.globalAlpha = 1;
  }
  // mirror the source into SEG wedges around (cx,cy)
  function kaleido(ctx, cx, cy, R, spin, zoom) {
    const a = Math.PI * 2 / SEG;
    for (let i = 0; i < SEG; i++) {
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(i * a + spin);
      if (i % 2) ctx.scale(1, -1);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, -0.005, a + 0.005); ctx.closePath(); ctx.clip();
      ctx.scale(zoom, zoom);
      ctx.drawImage(src, -700, -700);
      ctx.restore();
    }
  }
  const tl = gsap.timeline({ paused: true });
  const st = { spin: 0, zoom: 1.6 };
  // spin runs a whole turn over the loop, the zoom breathes in and back
  tl.fromTo(st, { spin: 0 }, { spin: Math.PI * 2 / SEG * 2, duration: D, ease: 'none' }, 0)
    .fromTo(st, { zoom: 1.2 }, { zoom: 0.85, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
    // the unfold: the full-frame kaleidoscope irises down into a disc, and the slide arrives
    .fromTo('#k', { clipPath: 'circle(120% at 50% 50%)' }, { clipPath: 'circle(0% at 50% 50%)', duration: 1.1, ease: 'expo.inOut' }, 1.5)
    .fromTo('.disc', { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 1.0, ease: 'back.out(1.6)' }, 1.9)
    .from('.kick', { yPercent: 110, duration: 0.6, ease: 'expo.out' }, 2.2)
    .from('.title', { yPercent: 110, duration: 0.9, ease: 'expo.out', stagger: 0.1 }, 2.3)
    .from('.bar', { scaleX: 0, duration: 0.7, ease: 'expo.out' }, 2.7)
    .from('.foot', { yPercent: 110, duration: 0.6, ease: 'expo.out' }, 2.85)
    // the fold-back: the slide leaves, the disc bursts back to full frame for the loop
    .to(['.kick', '.title', '.foot'], { yPercent: -110, duration: 0.45, ease: 'expo.in', stagger: 0.05 }, 4.2)
    .to('.bar', { scaleX: 0, duration: 0.4, ease: 'expo.in' }, 4.3)
    .to('.disc', { scale: 0, rotation: 90, duration: 0.5, ease: 'expo.in' }, 4.3)
    .to('#k', { clipPath: 'circle(120% at 50% 50%)', duration: 0.5, ease: 'expo.out' }, 4.55);
  fx.register({ duration: D, seek(t) {
    tl.seek(t, false);
    drawSource(t);
    big.clearRect(0, 0, W, H);
    kaleido(big, W / 2, H / 2, 800, st.spin, st.zoom);
    disc.clearRect(0, 0, 460, 460);
    kaleido(disc, 230, 230, 240, st.spin * 1.5, st.zoom * 0.5);
  } });
</script>
