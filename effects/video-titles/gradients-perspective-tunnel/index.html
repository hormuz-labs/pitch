<!doctype html><meta charset="utf-8">
<title>Gradients: Perspective Tunnel</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#07050f}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:22px;color:#fff}
  .mark{width:92px;height:92px;position:relative}
  .mark i{position:absolute;inset:0;border:5px solid #fff;border-radius:22px;transform:rotate(45deg)}
  .mark b{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px;border-radius:50%;background:#fff}
  .name{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:34px;letter-spacing:.36em;text-transform:uppercase;padding-left:.36em}
  .glow{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,0) 60%)}
</style>
<div class="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div class="glow"></div>
  <div class="logo"><div class="mark"><i></i><b></b></div><div class="name">Northwind</div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 5, W = 1280, H = 720, N = 18, SP = 1;   // N rings, one unit apart
  const ctx = document.getElementById('c').getContext('2d');
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('.mark i', { rotation: 45 }, { rotation: 405, duration: D, ease: 'none' }, 0)
    .fromTo('.mark b', { scale: 0.8 }, { scale: 1.2, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
    .fromTo('.glow', { scale: 0.9, opacity: 0.7 }, { scale: 1.15, opacity: 1, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);

  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
  }
  fx.register({ duration: D, seek(t) {
    tl.seek(t, false);
    const u = t / D;                       // 0..1, one ring of travel per loop
    // the vanishing point drifts on a closed path so the tunnel bends a little
    const vx = W / 2 + Math.sin(u * Math.PI * 2) * 40, vy = H / 2 + Math.cos(u * Math.PI * 2) * 24;
    ctx.fillStyle = '#07050f'; ctx.fillRect(0, 0, W, H);
    ctx.lineJoin = 'round';
    // depth ordering: far rings first
    for (let i = N - 1; i >= 0; i--) {
      // rings advance toward camera; when one passes, it re-enters at the back
      const z = ((i + u * 3) % N) / N;     // 0 = nearest, 1 = farthest ... after remap
      const depth = 1 - z;                 // 1 near, 0 far
      const s = 0.02 + Math.pow(depth, 2.6) * 1.6;   // perspective: cheap and steep
      const w = W * s, h = H * s;
      const x = vx + (W / 2 - vx) * s - w / 2, y = vy + (H / 2 - vy) * s - h / 2;
      const hue = (u * 360 + depth * 220) % 360;
      const g = ctx.createLinearGradient(x, y, x + w, y + h);
      g.addColorStop(0, `hsl(${hue},90%,62%)`);
      g.addColorStop(1, `hsl(${(hue + 80) % 360},90%,58%)`);
      ctx.strokeStyle = g;
      ctx.globalAlpha = Math.min(1, depth * 1.4) * (1 - Math.max(0, (s - 1.05)) * 1.6);
      ctx.lineWidth = 2 + depth * 22;
      ctx.shadowColor = `hsla(${hue},90%,60%,0.6)`; ctx.shadowBlur = 8 + depth * 40;
      rrect(x, y, w, h, Math.max(4, 90 * s));
      ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    // deep fog at the vanishing point
    const f = ctx.createRadialGradient(vx, vy, 0, vx, vy, 260);
    f.addColorStop(0, 'rgba(7,5,15,0.9)'); f.addColorStop(1, 'rgba(7,5,15,0)');
    ctx.fillStyle = f; ctx.fillRect(0, 0, W, H);
  } });
</script>
