<!doctype html><meta charset="utf-8">
<title>Slideshow Loop</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#111;color:#fff}
  .track{position:absolute;left:0;top:130px;height:460px;display:flex;gap:40px;will-change:transform}
  .fr{position:relative;width:640px;height:460px;flex:none;border-radius:18px;overflow:hidden;will-change:transform;transform-origin:50% 50%}
  .fr .img{position:absolute;inset:0;background-size:cover;background-position:center}
  .fr .cap{position:absolute;left:24px;bottom:22px;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:30px;letter-spacing:-.03em;text-shadow:0 2px 14px rgba(0,0,0,.4)}
  .fr .cap small{display:block;font-family:"Atlas Grotesk",sans-serif;font-weight:400;font-size:14px;opacity:.8;margin-top:4px;letter-spacing:.06em}
  .s1{background-image:url("../../../assets/backgrounds/sunset.png")}
  .s2{background-image:url("../../../assets/backgrounds/ocean.png")}
  .s3{background-image:url("../../../assets/backgrounds/aurora.png")}
  .s4{background:linear-gradient(135deg,#ffd23f,#ff6b57)}
  .s5{background:linear-gradient(135deg,#2d5cff,#8bd3ff)}
  .s6{background:linear-gradient(135deg,#1b1b22,#4a4a5a)}
  .prog{position:absolute;left:0;right:0;bottom:60px;display:flex;justify-content:center;gap:10px}
  .prog i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
  .head{position:absolute;left:0;right:0;top:56px;text-align:center;font-size:13px;letter-spacing:.24em;text-transform:uppercase;opacity:.6}
</style>
<div class="stage">
  <div class="head">Acme — spring collection</div>
  <div class="track" id="tr"></div>
  <div class="prog" id="pr"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const items = [['s1', 'Solstice', 'No. 01'], ['s2', 'Tidal', 'No. 02'], ['s3', 'Aurora', 'No. 03'], ['s4', 'Ember', 'No. 04'], ['s5', 'Drift', 'No. 05'], ['s6', 'Mono', 'No. 06']];
  const tr = document.getElementById('tr'), pr = document.getElementById('pr');
  const N = items.length, W = 640 + 40;
  // three copies so the strip is endless in both directions
  const frs = [];
  for (let k = 0; k < 3; k++) items.forEach(([c, t, n]) => { const d = document.createElement('div'); d.className = 'fr'; d.innerHTML = `<div class="img ${c}"></div><div class="cap">${t}<small>${n}</small></div>`; tr.appendChild(d); frs.push(d); });
  items.forEach(() => pr.appendChild(document.createElement('i')));
  const D = 6, slot = D / N;
  const centre = 1280 / 2 - 640 / 2;
  fx.register({ duration: D, seek(t) {
    // eased position per slot: hold, then a quick expo slide; the loop closes because N slots == N frames
    const p = t / slot, i = Math.floor(p), f = p - i;
    const e = f < .55 ? 0 : gsap.parseEase('expo.inOut')((f - .55) / .45);
    const pos = i + e;             // fractional index in frames
    const x = centre - (N + pos) * W;
    tr.style.transform = `translate3d(${x}px,0,0)`;
    frs.forEach((fr, k) => {
      const d = Math.abs(k - (N + pos));   // distance from centre
      const s = 1 - Math.min(d, 1) * .12;
      fr.style.transform = `scale(${s})`;
      fr.style.opacity = 1 - Math.min(d, 1) * .5;
      const img = fr.firstElementChild; img.style.transform = `translateX(${(k - (N + pos)) * -30}px) scale(1.12)`;
    });
    [...pr.children].forEach((dot, k) => { const on = k === (i % N); dot.style.background = on ? '#fff' : 'rgba(255,255,255,.25)'; dot.style.transform = on ? 'scale(1.5)' : ''; });
  } });
</script>
