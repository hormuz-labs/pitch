<!doctype html><meta charset="utf-8">
<title>Sliding Squares</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f7f4ee}
  .grid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:960px;height:480px}
  .sq{position:absolute;width:150px;height:150px;border-radius:10px;will-change:transform}
  .word{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:120px;letter-spacing:-.05em;color:#141414;mix-blend-mode:multiply;white-space:nowrap}
</style>
<div class="stage">
  <div class="grid" id="g"></div>
  <div class="word">ACME</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const g = document.getElementById('g');
  const colors = ['#ffd23f', '#2d5cff', '#ff6b57', '#7bd88f', '#141414', '#c9a3ff'];
  const cols = 6, rows = 3, step = 160;
  const sqs = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const d = document.createElement('div'); d.className = 'sq'; d.style.left = c * step + 'px'; d.style.top = r * step + 'px'; d.style.background = colors[(r * 2 + c) % colors.length]; g.appendChild(d); sqs.push(d); }
  const tl = fx.timeline({ duration: 8 });
  // slide in: rows from alternating sides, staggered along the row
  const dirs = sqs.map((_, i) => (Math.floor(i / cols) % 2 ? 1 : -1));
  tl.from(sqs, { x: (i) => dirs[i] * 1400, duration: 1.1, ease: 'expo.out', stagger: { each: .06, grid: [rows, cols], axis: 'x', from: 'start' } }, 0)
    .from('.word', { scale: .6, opacity: 0, duration: .8, ease: 'back.out(1.8)' }, 1.4)
    // a shuffle: every square slides one column right (the last column wraps to the front)
    .to(sqs, { x: step, duration: .7, ease: 'expo.inOut', stagger: { each: .03, grid: [rows, cols], from: 'start' } }, 2.6)
    .to(sqs.filter((_, i) => i % cols === cols - 1), { x: -(cols - 1) * step, duration: .7, ease: 'expo.inOut' }, 2.6)
    // and a column slide: columns move vertically in alternation
    .to(sqs, { y: (i) => (i % cols % 2 ? -step * .5 : step * .5), duration: .7, ease: 'expo.inOut', stagger: { each: .03, grid: [rows, cols], axis: 'y', from: 'edges' } }, 4.0)
    .to(sqs, { y: 0, duration: .7, ease: 'expo.inOut', stagger: { each: .03, grid: [rows, cols], from: 'center' } }, 5.2)
    // slide out the way they came, word shrinks away
    .to('.word', { scale: .6, opacity: 0, duration: .4, ease: 'power3.in' }, 6.5)
    .to(sqs, { x: (i) => -dirs[i] * 1400, duration: .8, ease: 'expo.in', stagger: { each: .04, grid: [rows, cols], axis: 'x', from: 'end' } }, 6.6);
</script>
