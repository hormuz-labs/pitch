<!doctype html><meta charset="utf-8">
<title>Interactive Gallery</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#e9e6df}
  .field{position:absolute;inset:0;will-change:transform}
  .card{position:absolute;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 20px 40px -20px rgba(0,0,0,.35);will-change:transform;transform-origin:50% 50%}
  .card .img{position:absolute;inset:0;background-size:cover;background-position:center}
  .card .cap{position:absolute;left:14px;bottom:12px;font-size:13px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);opacity:0}
  .k1{background-image:url("../../../assets/backgrounds/sunset.png")}
  .k2{background-image:url("../../../assets/backgrounds/ocean.png")}
  .k3{background-image:url("../../../assets/backgrounds/aurora.png")}
  .k4{background:linear-gradient(135deg,#ffd23f,#ff6b57)}
  .k5{background:linear-gradient(135deg,#141414,#3a3a44)}
  .k6{background:linear-gradient(135deg,#2d5cff,#8bd3ff)}
  .k7{background:repeating-linear-gradient(90deg,#f3f1ec 0 10px,#d8d2c4 10px 20px)}
  .cur{position:absolute;left:0;top:0;width:22px;height:22px;pointer-events:none;will-change:transform;z-index:9}
  .cur svg{display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
  .hint{position:absolute;left:48px;top:40px;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:26px;letter-spacing:-.02em;color:#141414}
  .hint small{display:block;font-family:"Atlas Grotesk",sans-serif;font-weight:400;font-size:15px;color:#6b6760;margin-top:4px}
</style>
<div class="stage">
  <div class="hint">Explore the archive<small>Drag to wander. Hover to look closer.</small></div>
  <div class="field" id="f"></div>
  <div class="cur"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M3 2l15 7-6.5 1.8L8 17z" fill="#fff" stroke="#141414" stroke-width="1.5"/></svg></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const f = document.getElementById('f');
  const spec = [[120,140,260,180,'k1','Solstice'],[430,90,220,300,'k2','Tidal'],[700,160,300,200,'k3','Aurora'],[1050,80,200,260,'k4','Ember'],[200,380,200,240,'k5','Mono'],[470,440,320,220,'k6','Drift'],[850,410,240,240,'k7','Grain'],[1130,400,180,180,'k1','Solstice II']];
  const cards = spec.map(([x,y,w,h,k,c]) => { const d = document.createElement('div'); d.className = 'card'; d.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`; d.innerHTML = `<div class="img ${k}"></div><span class="cap">${c}</span>`; f.appendChild(d); return d; });
  const tl = fx.timeline({ duration: 8 });
  tl.from(cards, { scale: .4, opacity: 0, y: 40, rotate: () => 0, duration: 1.0, ease: 'expo.out', stagger: { each: .08, from: 'random', grid: 'auto' } }, 0)
    .from('.hint', { x: -30, opacity: 0, duration: .7, ease: 'power3.out' }, .2);
  // the cursor wanders across three cards; each lifts and shows its caption while hovered
  const visits = [[1, 1.4], [5, 3.6], [2, 5.6]];
  const cur = document.querySelector('.cur');
  gsap.set(cur, { x: 640, y: 680 });
  let prev = [640, 680];
  visits.forEach(([i, at]) => {
    const [x, y, w, h] = spec[i];
    const cx = x + w * .55, cy = y + h * .6;
    tl.to(cur, { x: cx, y: cy, duration: .9, ease: 'power2.inOut' }, at - .9)
      .to(cards[i], { scale: 1.12, zIndex: 5, boxShadow: '0 40px 70px -20px rgba(0,0,0,.5)', duration: .5, ease: 'power3.out' }, at - .1)
      .to(cards[i].querySelector('.cap'), { opacity: 1, y: -4, duration: .3 }, at)
      .to(cards[i].querySelector('.img'), { scale: 1.08, duration: 1.4, ease: 'power1.out' }, at)
      .to(cards[i], { scale: 1, zIndex: 1, boxShadow: '0 20px 40px -20px rgba(0,0,0,.35)', duration: .5, ease: 'power3.inOut' }, at + 1.3)
      .to(cards[i].querySelector('.cap'), { opacity: 0, duration: .25 }, at + 1.3)
      .to(cards[i].querySelector('.img'), { scale: 1, duration: .5 }, at + 1.3);
  });
  // the field itself drifts (a drag) between visits, so the layout keeps exploring
  tl.to(f, { x: -60, y: 20, duration: 2.2, ease: 'power2.inOut' }, 2.3)
    .to(f, { x: 40, y: -30, duration: 2.2, ease: 'power2.inOut' }, 4.5)
    .to(f, { x: 0, y: 0, duration: 1.2, ease: 'power2.inOut' }, 6.7)
    .to(cur, { x: 640, y: 680, duration: .8, ease: 'power2.inOut' }, 7.0)
    // exit and re-entry hidden: cards shrink away at the very end
    .to(cards, { scale: .4, opacity: 0, duration: .45, ease: 'power3.in', stagger: { each: .04, from: 'random' } }, 7.4)
    .to('.hint', { opacity: 0, duration: .3 }, 7.6);
</script>
