<!doctype html><meta charset="utf-8">
<title>Bento Modular Showreel</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101010;color:#fff}
  .grid{position:absolute;inset:48px 72px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr);gap:14px}
  .tile{position:relative;border-radius:20px;overflow:hidden;background:#1c1c1e;will-change:transform}
  .tile .img{position:absolute;inset:0;background-size:cover;background-position:center}
  .tile .cap{position:absolute;left:20px;bottom:18px;font-size:15px;letter-spacing:.02em;opacity:.9;text-shadow:0 1px 8px rgba(0,0,0,.4)}
  .tile .num{position:absolute;right:18px;top:16px;font-size:12px;letter-spacing:.12em;opacity:.6}
  .t1 .img{background-image:url("../../../assets/backgrounds/sunset.png")}
  .t2 .img{background-image:url("../../../assets/backgrounds/ocean.png")}
  .t3 .img{background-image:url("../../../assets/backgrounds/aurora.png")}
  .t4{background:#ffd23f;color:#141414}.t5{background:#2d5cff}.t6{background:#f3f1ec;color:#141414}
  .word{position:absolute;left:20px;top:18px;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:34px;letter-spacing:-.04em;line-height:1}
  .t5 .img{background:radial-gradient(circle at 30% 30%,#8bd3ff,#2d5cff 60%)}
  .t6 .img{background:repeating-linear-gradient(45deg,#f3f1ec 0 14px,#e2ddd2 14px 28px)}
  /* layouts */
  .L0 .t1{grid-area:1/1/3/4}.L0 .t2{grid-area:1/4/2/6}.L0 .t3{grid-area:3/1/5/3}.L0 .t4{grid-area:1/6/3/7}.L0 .t5{grid-area:2/4/5/7}.L0 .t6{grid-area:3/3/5/4}
  .L1 .t1{grid-area:1/1/2/3}.L1 .t2{grid-area:1/3/4/6}.L1 .t3{grid-area:2/1/5/3}.L1 .t4{grid-area:4/3/5/6}.L1 .t5{grid-area:1/6/3/7}.L1 .t6{grid-area:3/6/5/7}
  .L2 .t1{grid-area:3/4/5/7}.L2 .t2{grid-area:1/1/2/3}.L2 .t3{grid-area:1/3/3/7}.L2 .t4{grid-area:2/1/5/2}.L2 .t5{grid-area:2/2/5/4}.L2 .t6{grid-area:3/4/5/5}
</style>
<div class="stage">
  <div class="grid L0">
    <div class="tile t1"><div class="img"></div><span class="num">01</span><span class="cap">Solstice — campaign</span></div>
    <div class="tile t2"><div class="img"></div><span class="num">02</span><span class="cap">Tidal — product film</span></div>
    <div class="tile t3"><div class="img"></div><span class="num">03</span><span class="cap">Aurora — identity</span></div>
    <div class="tile t4"><span class="word">Selected<br>work</span><span class="cap">2024 – 2026</span></div>
    <div class="tile t5"><div class="img"></div><span class="num">04</span><span class="cap">Northwind — app</span></div>
    <div class="tile t6"><span class="word">Acme<br>Studio</span></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 8 });
  const grid = document.querySelector('.grid');
  const tiles = gsap.utils.toArray('.tile');
  // measure each layout while the grid owns the tiles, then take the tiles absolute and tween between the measured rects
  const layouts = {};
  const g0 = grid.getBoundingClientRect();
  for (const L of ['L0', 'L1', 'L2']) {
    grid.className = 'grid ' + L;
    layouts[L] = tiles.map(t => { const r = t.getBoundingClientRect(); return { left: r.left - g0.left, top: r.top - g0.top, width: r.width, height: r.height }; });
  }
  grid.className = 'grid L0'; grid.style.display = 'block';
  tiles.forEach((t, i) => { t.style.position = 'absolute'; gsap.set(t, layouts.L0[i]); });
  function swap(L, at) {
    tiles.forEach((t, i) => tl.to(t, { ...layouts[L][i], duration: 1.1, ease: 'expo.inOut' }, at + i * .04));
    tl.to(tiles, { scale: .96, duration: .55, ease: 'power2.inOut', yoyo: true, repeat: 1, stagger: .04 }, at);
  }
  swap('L1', 2.2);
  swap('L2', 4.6);
  swap('L0', 6.6);   // returns to the first layout so the loop closes
  tl.from(tiles, { scale: .6, opacity: 0, y: 80, duration: .9, ease: 'expo.out', stagger: .08 }, 0)
    .from('.cap, .num, .word', { y: 16, opacity: 0, duration: .5, stagger: .05 }, .5)
    .fromTo('.tile .img', { scale: 1.2 }, { scale: 1.0, duration: 8, ease: 'none' }, 0);
</script>
