<!doctype html><meta charset="utf-8">
<title>Cascading Squares Grid</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f4efe6}
  .grid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(8,72px);grid-template-rows:repeat(4,72px);gap:14px}
  .sq{width:72px;height:72px;border-radius:14px;background:#141414;will-change:transform;transform-origin:50% 100%}
  .sq.y{background:#ffd23f}.sq.b{background:#2d5cff}.sq.r{background:#ff6b57}.sq.g{background:#7bd88f}
  .title{position:absolute;left:0;right:0;bottom:64px;text-align:center;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:28px;letter-spacing:-.02em;color:#141414;overflow:hidden}
  .title span{display:block}
</style>
<div class="stage">
  <div class="grid" id="g"></div>
  <div class="title"><span>Hervé & Co — pattern intro</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/CustomEase.min.js"></script>
<script src="../../../assets/gsap/CustomBounce.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(CustomEase, CustomBounce);
  CustomBounce.create('drop', { strength: .5, squash: 2 });
  const g = document.getElementById('g'); const rnd = fx.rng(7);
  const cls = ['', '', 'y', 'b', 'r', 'g', '', 'y'];
  const sqs = [];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 8; c++) { const d = document.createElement('div'); d.className = 'sq ' + cls[Math.floor(rnd() * cls.length)]; d.dataset.r = r; d.dataset.c = c; g.appendChild(d); sqs.push(d); }
  const tl = fx.timeline({ duration: 8 });
  // drop in: column by column, top row first, each square falls from above and bounces
  tl.from(sqs, { y: -900, duration: 1.2, ease: 'drop', stagger: { each: .05, grid: [4, 8], from: 'start', axis: 'x' } }, 0)
    .to(sqs, { scaleY: .6, scaleX: 1.35, duration: 1.2, ease: 'drop-squash', stagger: { each: .05, grid: [4, 8], from: 'start', axis: 'x' } }, 0)
    .from('.title span', { yPercent: 120, duration: .7, ease: 'expo.out' }, 1.6)
    // a ripple from the centre once settled
    .to(sqs, { scale: .72, rotate: 90, duration: .5, ease: 'power2.inOut', yoyo: true, repeat: 1, stagger: { each: .04, grid: [4, 8], from: 'center' } }, 3.2)
    // second ripple from a corner with colour flash
    .to(sqs, { rotate: 45, duration: .45, ease: 'power2.inOut', yoyo: true, repeat: 1, stagger: { each: .03, grid: [4, 8], from: 'end' } }, 5.0)
    // drop out: fall through the floor in a cascade
    .to(sqs, { y: 520, opacity: 0, duration: .6, ease: 'power3.in', stagger: { each: .03, grid: [4, 8], from: 'start', axis: 'x' } }, 6.6)
    .to('.title span', { yPercent: -120, duration: .4, ease: 'power3.in' }, 7.3);
</script>
