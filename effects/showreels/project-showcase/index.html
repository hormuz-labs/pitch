<!doctype html><meta charset="utf-8">
<title>Project Showcase</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f5f2ec;color:#141414}
  .pic{position:absolute;left:640px;top:80px;width:520px;height:560px;overflow:hidden;border-radius:4px}
  .pic .img{position:absolute;inset:0;background:url("../../../assets/backgrounds/ocean.png") center/cover;transform:scale(1.15)}
  .pic .mask{position:absolute;inset:0;background:#f5f2ec;transform-origin:50% 100%}
  .copy{position:absolute;left:100px;top:160px;width:460px}
  .idx{font-size:13px;letter-spacing:.24em;text-transform:uppercase;opacity:.55}
  .ttl{margin-top:26px;font-family:"Sorts Mill Goudy",serif;font-size:74px;line-height:1;letter-spacing:-.01em}
  .ttl .l{overflow:hidden}.ttl .l span{display:block}
  .desc{margin-top:26px;font-size:17px;line-height:1.5;color:#5c584f;max-width:380px}
  .rule{margin-top:36px;height:1px;background:#141414;transform-origin:0 50%}
  .tags{margin-top:16px;display:flex;gap:10px}
  .tags span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;border:1px solid rgba(0,0,0,.25);border-radius:999px}
  .num{position:absolute;right:100px;bottom:48px;font-family:"Sorts Mill Goudy",serif;font-size:22px;font-style:italic;opacity:.5}
</style>
<div class="stage">
  <div class="copy">
    <div class="idx">Case study — 03</div>
    <div class="ttl"><div class="l"><span>Tidal,</span></div><div class="l"><span>a calmer</span></div><div class="l"><span>banking app</span></div></div>
    <div class="desc">Rebuilding the everyday money experience for Northwind Bank, from onboarding to statements.</div>
    <div class="rule"></div>
    <div class="tags"><span>Product</span><span>Brand</span><span>Motion</span></div>
  </div>
  <div class="pic"><div class="img"></div><div class="mask"></div></div>
  <div class="num">Vendredi — 2026</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  tl.to('.pic .mask', { scaleY: 0, duration: 1.2, ease: 'expo.inOut' }, 0)
    .fromTo('.pic .img', { scale: 1.25 }, { scale: 1.05, duration: 4, ease: 'none' }, 0)
    .from('.idx', { y: 12, opacity: 0, duration: .6, ease: 'power3.out' }, .3)
    .from('.ttl .l span', { yPercent: 110, duration: .9, ease: 'expo.out', stagger: .1 }, .45)
    .from('.desc', { y: 16, opacity: 0, duration: .8, ease: 'power3.out' }, .9)
    .from('.rule', { scaleX: 0, duration: .9, ease: 'expo.out' }, 1.05)
    .from('.tags span', { y: 10, opacity: 0, duration: .5, ease: 'power2.out', stagger: .08 }, 1.25)
    .from('.num', { opacity: 0, duration: .8 }, 1.2)
    // exit: the image is re-covered from the top, the copy lifts out
    .to('.pic .mask', { scaleY: 1, transformOrigin: '50% 0', duration: .7, ease: 'expo.inOut' }, 3.2)
    .to('.ttl .l span', { yPercent: -110, duration: .45, ease: 'power3.in', stagger: .05 }, 3.25)
    .to('.idx, .desc, .rule, .tags, .num', { opacity: 0, y: -10, duration: .35, ease: 'power2.in', stagger: .03 }, 3.4);
</script>
