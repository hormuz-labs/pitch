<!doctype html><meta charset="utf-8">
<title>Rewind</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#000;color:#fff}
  .vid{position:absolute;inset:0;object-fit:cover;width:100%;height:100%;filter:saturate(1.3) contrast(1.1)}
  .rgb{position:absolute;inset:0;mix-blend-mode:screen;opacity:.0;background:linear-gradient(90deg,rgba(255,0,60,.35),transparent 30%,transparent 70%,rgba(0,120,255,.35))}
  .lines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px);pointer-events:none}
  .band{position:absolute;left:0;right:0;height:38px;background:rgba(255,255,255,.12);filter:blur(2px);will-change:transform}
  .tear{position:absolute;left:0;right:0;height:60px;overflow:hidden;will-change:transform}
  .tear .vid{transform:translateX(24px)}
  .noise{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay}
  .osd{position:absolute;inset:0;font-family:"Courier New",monospace;font-weight:700;font-size:44px;letter-spacing:.06em;text-shadow:0 0 6px rgba(255,255,255,.8),2px 0 0 rgba(255,0,0,.6),-2px 0 0 rgba(0,255,255,.6)}
  .rew{position:absolute;left:70px;top:56px;display:flex;align-items:center;gap:18px}
  .rew svg{width:64px;height:44px}
  .tc{position:absolute;right:70px;bottom:56px}
  .play{position:absolute;left:70px;bottom:56px;font-size:28px;opacity:.9}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.7));pointer-events:none}
  .hl{position:absolute;inset:0;border:2px solid rgba(255,255,255,.1)}
</style>
<div class="stage">
  <video class="vid main" src="../../../assets/backgrounds/drift-ember.mp4" muted playsinline preload="auto"></video>
  <div class="tear t1"><video class="vid" src="../../../assets/backgrounds/drift-ember.mp4" muted playsinline preload="auto"></video></div>
  <div class="tear t2"><video class="vid" src="../../../assets/backgrounds/drift-ember.mp4" muted playsinline preload="auto"></video></div>
  <div class="band"></div>
  <div class="rgb"></div>
  <canvas class="noise" width="320" height="180"></canvas>
  <div class="lines"></div>
  <div class="vig"></div>
  <div class="osd">
    <div class="rew"><svg viewBox="0 0 64 44"><path d="M30 4L2 22l28 18zM62 4L34 22l28 18z" fill="#fff"/></svg><span>REW</span></div>
    <div class="play">PLAY ▶</div>
    <div class="tc"><span class="h">00</span>:<span class="m">04</span>:<span class="s">32</span></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const vids = [...document.querySelectorAll('video')];
  vids.forEach(v => fx.wait(new Promise(r => { v.addEventListener('loadeddata', r, { once: true }); v.load(); })));
  const noise = document.querySelector('.noise'), nctx = noise.getContext('2d');
  const rnd = fx.rng(11);
  const frames = []; for (let f = 0; f < 6; f++) { const id = nctx.createImageData(320, 180); for (let i = 0; i < id.data.length; i += 4) { const v = rnd() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } frames.push(id); }
  gsap.set('.play', { opacity: 0 });
  const D = 7;
  const tl = gsap.timeline({ paused: true });
  // rewind: the picture runs backwards at speed while the OSD flickers; near the end it snaps to PLAY
  const tear1 = document.querySelector('.t1'), tear2 = document.querySelector('.t2'), band = document.querySelector('.band');
  tl.fromTo(band, { y: 720 }, { y: -60, duration: 1.4, ease: 'none', repeat: 3 }, 0)
    .fromTo(tear1, { y: 120 }, { y: 560, duration: .9, ease: 'none', repeat: 5 }, 0)
    .fromTo(tear2, { y: 500 }, { y: 40, duration: 1.3, ease: 'none', repeat: 3 }, 0)
    .fromTo('.rgb', { opacity: .6 }, { opacity: .2, duration: .12, repeat: 40, yoyo: true }, 0)
    .to('.rew svg', { opacity: .25, duration: .2, repeat: 27, yoyo: true, ease: 'none' }, 0)
    // the snap: rewind stops, tears collapse, PLAY appears
    .to('.band, .tear, .rgb', { opacity: 0, duration: .15 }, 5.6)
    .set('.rew', { opacity: 0 }, 5.6)
    .set('.play', { opacity: 1 }, 5.7)
    .to('.play', { opacity: 0, duration: .01, repeat: 5, yoyo: true, repeatDelay: .25 }, 5.7);
  const h = document.querySelector('.h'), m = document.querySelector('.m'), s = document.querySelector('.s');
  const pad = n => String(n).padStart(2, '0');
  const dur = vids[0].duration || 8;
  fx.register({ duration: D, seek(t) {
    tl.seek(t, false);
    // video time: rewinding at 3x for 5.6s, then playing forward
    let vt;
    if (t < 5.6) vt = ((dur - (t * 3) % dur) + dur) % dur; else vt = (t - 5.6) % dur;
    vids.forEach((v, i) => { v.currentTime = i === 0 ? vt : (vt + .4 * i) % dur; });
    // timecode counts down during rewind, up after
    const secs = t < 5.6 ? Math.max(0, 272 - Math.floor(t * 3 * 4)) : 200 + Math.floor((t - 5.6) * 4);
    h.textContent = pad(Math.floor(secs / 3600)); m.textContent = pad(Math.floor(secs / 60) % 60); s.textContent = pad(secs % 60);
    nctx.putImageData(frames[Math.floor(t * 30) % frames.length], 0, 0);
    noise.style.opacity = t < 5.6 ? .28 : .1;
    document.querySelector('.stage').style.transform = t < 5.6 ? `translate(${(Math.floor(t * 30) % 3 - 1) * 2}px,0)` : '';
  } });
</script>
