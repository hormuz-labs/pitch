<!doctype html><meta charset="utf-8">
<title>Share Your Work</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f4f1ea;color:#141414}
  .shot{position:absolute;left:120px;top:150px;width:840px;height:600px;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 60px 100px -50px rgba(0,0,0,.4);will-change:transform;transform-origin:50% 100%}
  .bar{height:44px;background:#f0efeb;border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:8px;padding:0 16px}
  .bar i{width:11px;height:11px;border-radius:50%;background:#dcd8cf}
  .bar .url{margin-left:14px;flex:1;height:26px;border-radius:7px;background:#fff;font-size:12px;color:#8a877f;display:flex;align-items:center;padding:0 10px}
  .body{position:absolute;inset:44px 0 0;background:url("../../../assets/backgrounds/aurora.png") center/cover}
  .body .hero{position:absolute;left:44px;bottom:44px;color:#fff;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:56px;letter-spacing:-.04em;line-height:1;text-shadow:0 2px 20px rgba(0,0,0,.3)}
  .cap{position:absolute;left:120px;top:800px;right:120px;display:flex;justify-content:space-between;align-items:baseline;overflow:hidden}
  .cap h1{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:40px;letter-spacing:-.03em}
  .cap span{font-size:16px;color:#6b6760}
  .lab{position:absolute;left:120px;top:96px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.5;overflow:hidden}
  .lab span{display:block}
</style>
<div class="stage">
  <div class="lab"><span>New work — 001</span></div>
  <div class="shot"><div class="bar"><i></i><i></i><i></i><div class="url">northwind.studio</div></div><div class="body"><div class="hero">Northwind<br>Studio site</div></div></div>
  <div class="cap"><h1>Northwind — website</h1><span>Design, build, launch</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 1 });
  tl.from('.shot', { y: 120, scale: .94, opacity: 0, duration: .55, ease: 'expo.out' }, 0)
    .from('.body', { yPercent: 20, duration: .8, ease: 'expo.out' }, .1)
    .from('.lab span', { yPercent: 120, duration: .4, ease: 'expo.out' }, .05)
    .from('.cap h1, .cap span', { yPercent: 120, duration: .45, ease: 'expo.out', stagger: .06 }, .18)
    .to('.shot', { y: -40, opacity: 0, duration: .25, ease: 'power3.in' }, .78)
    .to('.cap h1, .cap span, .lab span', { yPercent: -120, duration: .2, ease: 'power3.in', stagger: .03 }, .8);
</script>
