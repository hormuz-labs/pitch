<!doctype html><meta charset="utf-8">
<title>Blend Modes: Circle Stack</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f4efe4}
  .c{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;mix-blend-mode:multiply;will-change:transform}
  .c1{background:#ff3b30}.c2{background:#ffcc00}.c3{background:#1e6bff}.c4{background:#19c37d}.c5{background:#ff2d95}
  .label{position:absolute;left:48px;bottom:40px;font-family:"Atlas Grotesk",sans-serif;font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:#1a1a1a;opacity:.7}
  .label b{font-weight:500}
  .mark{position:absolute;right:48px;top:40px;width:26px;height:26px;border-radius:50%;border:3px solid #1a1a1a}
</style>
<div class="stage">
  <div class="c c1"></div><div class="c c2"></div><div class="c c3"></div><div class="c c4"></div><div class="c c5"></div>
  <div class="label"><b>Acme</b> — Circle Stack</div>
  <div class="mark"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 6, N = 5;
  const cs = [...document.querySelectorAll('.c')];
  // each circle rides its own orbit; all frequencies are whole multiples of the loop, so t=6 equals t=0
  const orb = cs.map((el, i) => ({
    el, ph: (i / N) * Math.PI * 2,
    rx: 180 + 40 * ((i * 7) % 3), ry: 90 + 30 * ((i * 5) % 3), k: (i % 2) ? 1 : -1,
  }));
  function seek(t) {
    const w = (t / D) * Math.PI * 2;
    for (const o of orb) {
      const a = o.k * w + o.ph;
      const x = Math.cos(a) * o.rx;
      const y = Math.sin(a) * o.ry;
      // breathing: two full pulses per loop, staggered per circle
      const s = 1 + 0.18 * Math.sin(2 * w + o.ph);
      // stacking order flips with the depth of the orbit
      gsap.set(o.el, { x, y, scale: s, zIndex: Math.round(10 + 5 * Math.sin(a)) });
    }
  }
  fx.register({ duration: D, seek });
</script>
