<!doctype html><meta charset="utf-8">
<title>Blend Modes: Collage Shuffle</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101014}
  .paper{position:absolute;inset:0;background:url("../../../assets/backgrounds/aurora.png") center/cover;opacity:.55;filter:saturate(1.3)}
  .grid{position:absolute;left:80px;top:70px;width:1120px;height:580px}
  .tile{position:absolute;width:352px;height:274px;left:0;top:0;border-radius:6px;overflow:hidden;background-size:cover;background-position:center;will-change:transform;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .tile::after{content:"";position:absolute;inset:0;background:var(--tint);mix-blend-mode:color;opacity:.75}
  .t0{background-image:url("../../../assets/backgrounds/sunset.png");--tint:#ff5a36}
  .t1{background-image:url("../../../assets/backgrounds/ocean.png");--tint:#2f7bff}
  .t2{background-image:url("../../../assets/backgrounds/aurora.png");--tint:#8a4dff}
  .t3{background-image:url("../../../assets/backgrounds/sunset.png");--tint:#ffc23b;background-position:left top}
  .t4{background-image:url("../../../assets/backgrounds/ocean.png");--tint:#19c37d;background-position:right bottom}
  .t5{background-image:url("../../../assets/backgrounds/aurora.png");--tint:#ff2d95;background-position:left bottom}
  .cap{position:absolute;left:80px;bottom:26px;font-family:"Atlas Grotesk",sans-serif;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#fff;opacity:.85}
  .idx{position:absolute;right:80px;bottom:26px;font-family:"Sharp Grotesk",sans-serif;font-size:15px;letter-spacing:.2em;color:#fff;opacity:.85}
</style>
<div class="stage">
  <div class="paper"></div>
  <div class="grid">
    <div class="tile t0"></div><div class="tile t1"></div><div class="tile t2"></div>
    <div class="tile t3"></div><div class="tile t4"></div><div class="tile t5"></div>
  </div>
  <div class="cap">Northwind — Editorial Collage</div>
  <div class="idx">01 / 06</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tiles = [...document.querySelectorAll('.tile')];
  const W = 352, H = 274, GX = 32, GY = 32;
  const slot = i => ({ x: (i % 3) * (W + GX), y: Math.floor(i / 3) * (H + GY) });
  // permutation of order 4: (0 1 2 3)(4 5) — four shuffles bring the collage home
  const perm = [1, 2, 3, 0, 5, 4];
  const modes = ['difference', 'screen', 'exclusion', 'lighten'];
  const tl = fx.timeline({ duration: 6 });
  let pos = tiles.map((_, i) => i);
  tiles.forEach((el, i) => gsap.set(el, { x: slot(i).x, y: slot(i).y, mixBlendMode: 'normal' }));
  for (let step = 0; step < 4; step++) {
    const t0 = step * 1.5;
    const next = pos.map(p => perm[p]);
    tiles.forEach((el, i) => {
      const to = slot(next[i]);
      const d = 0.06 * (i % 3);
      tl.set(el, { mixBlendMode: modes[step] }, t0 + 0.05 + d)
        .to(el, { x: to.x, y: to.y, duration: 0.9, ease: 'expo.inOut' }, t0 + 0.1 + d)
        .to(el, { scale: 1.12, rotation: (i % 2 ? 1 : -1) * 3, duration: 0.45, ease: 'power2.out' }, t0 + 0.1 + d)
        .to(el, { scale: 1, rotation: 0, duration: 0.45, ease: 'power2.inOut' }, t0 + 0.55 + d)
        .set(el, { mixBlendMode: 'normal' }, t0 + 1.08 + d);
    });
    tl.to('.idx', { textContent: `0${step + 2 > 6 ? 1 : step + 2} / 06`, duration: 0 }, t0 + 0.6);
    pos = next;
  }
  // the paper behind drifts the whole loop
  tl.fromTo('.paper', { scale: 1.05, xPercent: -1 }, { scale: 1.1, xPercent: 1, duration: 6, ease: 'none' }, 0);
</script>
