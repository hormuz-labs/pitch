<!doctype html><meta charset="utf-8">
<title>Blend Modes: Color Blocks</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#fbfaf6}
  .b{position:absolute;mix-blend-mode:multiply;will-change:transform;border-radius:4px}
  .b1{left:120px;top:90px;width:560px;height:400px;background:#00c2ff}
  .b2{left:420px;top:200px;width:620px;height:360px;background:#ff2f8e}
  .b3{left:260px;top:330px;width:480px;height:300px;background:#ffd400}
  .b4{left:760px;top:60px;width:340px;height:520px;background:#3b3bff}
  .b5{left:60px;top:440px;width:380px;height:200px;background:#00e08a}
  .word{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:150px;letter-spacing:-.04em;color:#111;mix-blend-mode:overlay;line-height:1}
  .foot{position:absolute;left:48px;bottom:36px;font-family:"Atlas Grotesk",sans-serif;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:#111}
</style>
<div class="stage">
  <div class="b b1"></div><div class="b b2"></div><div class="b b3"></div><div class="b b4"></div><div class="b b5"></div>
  <div class="word">Overlap</div>
  <div class="foot">Acme Studio — Color Blocks</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 5 });
  // enter from four edges, interleave, then leave the way they came: state at 5 equals state at 0
  const enter = [
    ['.b1', { x: -900, rotation: -8 }], ['.b2', { x: 1000, rotation: 6 }],
    ['.b3', { y: 700, rotation: 4 }], ['.b4', { y: -800, rotation: -5 }], ['.b5', { x: -700, y: 300 }],
  ];
  enter.forEach(([sel, from], i) => {
    tl.fromTo(sel, from, { x: 0, y: 0, rotation: 0, duration: 1.0, ease: 'move' }, i * 0.07);
  });
  // the layered drift: blocks slide over each other so the multiply overlaps keep changing
  tl.to('.b1', { x: 90, y: 40, rotation: 3, duration: 2.8, ease: 'sine.inOut' }, 1.1)
    .to('.b2', { x: -160, y: -30, rotation: -4, duration: 2.8, ease: 'sine.inOut' }, 1.1)
    .to('.b3', { x: 120, y: -100, rotation: 6, duration: 2.8, ease: 'sine.inOut' }, 1.1)
    .to('.b4', { x: -220, y: 60, rotation: -3, duration: 2.8, ease: 'sine.inOut' }, 1.1)
    .to('.b5', { x: 220, y: -90, duration: 2.8, ease: 'sine.inOut' }, 1.1);
  // exit
  tl.to('.b5', { x: -700, y: 300, duration: 0.55, ease: 'expo.in' }, 4.1)
    .to('.b4', { y: -800, rotation: -5, duration: 0.55, ease: 'expo.in' }, 4.17)
    .to('.b3', { y: 700, rotation: 4, duration: 0.55, ease: 'expo.in' }, 4.24)
    .to('.b2', { x: 1000, rotation: 6, duration: 0.55, ease: 'expo.in' }, 4.31)
    .to('.b1', { x: -900, rotation: -8, duration: 0.55, ease: 'expo.in' }, 4.38);
  // headline: pops in on the collision, snaps out before the blocks leave
  tl.fromTo('.word', { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: 'back.out(1.8)' }, 0.75)
    .to('.word', { scale: 0.8, opacity: 0, duration: 0.35, ease: 'power3.in' }, 3.85);
</script>
