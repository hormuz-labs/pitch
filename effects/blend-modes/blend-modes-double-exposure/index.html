<!doctype html><meta charset="utf-8">
<title>Blend Modes: Double Exposure</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#fff}
  .silhouette{position:absolute;left:50%;top:50%;width:520px;height:720px;margin:-360px 0 0 -260px}
  .silhouette path{fill:#0b0b0e}
  /* lighten over white is white, lighten over the dark silhouette is the image: that is the double exposure */
  .ex{position:absolute;inset:-10%;background-size:cover;background-position:center;mix-blend-mode:lighten;will-change:transform}
  .ex1{background-image:url("../../../assets/backgrounds/sunset.png");filter:contrast(1.6) brightness(.8) saturate(1.3)}
  .ex2{background-image:url("../../../assets/backgrounds/ocean.png");filter:contrast(1.7) brightness(.75) saturate(1.4) hue-rotate(20deg)}
  .ex3{background-image:url("../../../assets/backgrounds/aurora.png");filter:contrast(1.8) brightness(.7);background-size:140%}
  .cap{position:absolute;left:64px;bottom:44px;font-family:"Sorts Mill Goudy",serif;font-size:30px;color:#111;font-style:italic}
  .tag{position:absolute;right:64px;bottom:50px;font-family:"Atlas Grotesk",sans-serif;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#111}
</style>
<div class="stage">
  <svg class="silhouette" viewBox="0 0 400 600"><path d="M200 40 C 270 40 320 100 320 180 C 320 240 290 290 250 310 C 250 340 270 360 300 375 C 380 410 400 480 400 600 L 0 600 C 0 480 20 410 100 375 C 130 360 150 340 150 310 C 110 290 80 240 80 180 C 80 100 130 40 200 40 Z"/></svg>
  <div class="ex ex1"></div>
  <div class="ex ex2"></div>
  <div class="ex ex3"></div>
  <div class="cap">Northwind — Chapter One</div>
  <div class="tag">Double Exposure</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 2;
  function seek(t) {
    const w = (t / D) * Math.PI * 2;
    // two exposures drift against each other and breathe in opacity; every term is a whole cycle so t=2 is t=0
    gsap.set('.ex1', { x: 40 * Math.sin(w), y: 12 * Math.cos(w), scale: 1.04 + 0.03 * Math.sin(w), opacity: 0.85 + 0.15 * Math.cos(w) });
    gsap.set('.ex2', { x: -50 * Math.sin(w), y: -20 * Math.sin(w), scale: 1.08 + 0.04 * Math.cos(w), opacity: 0.55 + 0.45 * Math.sin(w) * Math.sin(w) });
    gsap.set('.ex3', { x: 30 * Math.cos(w), y: -40 * Math.sin(w), scale: 1.1 + 0.05 * Math.sin(w), opacity: 0.4 + 0.3 * Math.cos(w) });
    gsap.set('.silhouette', { y: 6 * Math.sin(w), scale: 1 + 0.01 * Math.sin(w) });
  }
  fx.register({ duration: D, seek });
</script>
