<!doctype html><meta charset="utf-8">
<title>Animated Mobile Gallery</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f3efe8;font-family:"Atlas Grotesk",sans-serif}
  .track{position:absolute;left:50%;top:50%;display:flex;gap:40px;transform:translateY(-50%);will-change:transform}
  .shot{position:relative;width:260px;height:560px;border-radius:36px;overflow:hidden;background:#fff;box-shadow:0 30px 60px rgba(60,40,20,.18),0 0 0 1px rgba(0,0,0,.05);flex:none;will-change:transform,opacity}
  .bar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-size:12px;font-weight:500}
  .bar i{width:40px;height:10px;border-radius:5px;background:currentColor;opacity:.4}
  .body{padding:60px 18px 18px}
  .hd{font-size:24px;font-weight:500;letter-spacing:-.02em;margin-bottom:14px}
  .hd small{display:block;font-size:12px;opacity:.55;font-weight:400}
  .card{border-radius:16px;padding:14px;margin-bottom:12px;background:rgba(0,0,0,.05)}
  .card.tall{height:180px;display:flex;align-items:flex-end;font-size:22px;font-weight:500;letter-spacing:-.02em}
  .rowi{display:flex;gap:10px;align-items:center;padding:9px 0}
  .rowi i{width:32px;height:32px;border-radius:10px;background:rgba(0,0,0,.12);flex:none}
  .rowi em{display:block;height:9px;border-radius:5px;background:rgba(0,0,0,.18);width:70%;font-style:normal;margin-bottom:6px}
  .rowi em+em{width:45%;opacity:.6;margin:0}
  .rowi .t{flex:1}
  .btn{height:46px;border-radius:14px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500}
  .s1{background:#fff;color:#111}.s1 .card.tall{background:linear-gradient(135deg,#ffd166,#ff7a59);color:#fff}
  .s2{background:#111318;color:#fff}.s2 .card{background:rgba(255,255,255,.08)}.s2 .rowi i{background:rgba(255,255,255,.15)}.s2 .rowi em{background:rgba(255,255,255,.3)}.s2 .btn{background:#fff;color:#111}.s2 .card.tall{background:linear-gradient(135deg,#3d5aff,#9d3dff)}
  .s3{background:#eaf4ee;color:#0f2a1c}.s3 .card.tall{background:linear-gradient(135deg,#1fa86c,#0b6b47);color:#fff}
  .s4{background:#fff;color:#111}.s4 .card.tall{background:linear-gradient(135deg,#ff3d81,#7a3dff);color:#fff}
  .s5{background:#fbf3ff;color:#2a0f3a}.s5 .card.tall{background:linear-gradient(135deg,#9d3dff,#ff5c6e);color:#fff}
  .dots{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
  .dots i{width:8px;height:8px;border-radius:4px;background:#111;opacity:.2}
  .dots i.on{width:24px;opacity:1}
</style>
<div class="stage">
  <div class="track"></div>
  <div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const titles = [['Discover', 'Today'], ['Library', 'Saved'], ['Wellness', 'Progress'], ['Orders', 'Checkout'], ['Studio', 'Create']];
  const heros = ['Morning mix', 'New releases', 'Week 3', 'Ready to ship', 'Fresh canvas'];
  const track = document.querySelector('.track');
  const N = 5, COPIES = 3;
  for (let j = 0; j < N * COPIES; j++) {
    const i = j % N;
    const d = document.createElement('div');
    d.className = 'shot s' + (i + 1);
    d.innerHTML = `<div class="bar"><span>9:41</span><i></i></div><div class="body"><div class="hd"><small>${titles[i][0]}</small>${titles[i][1]}</div><div class="card tall">${heros[i]}</div><div class="card"><div class="rowi"><i></i><div class="t"><em></em><em></em></div></div><div class="rowi"><i></i><div class="t"><em></em><em></em></div></div><div class="rowi"><i></i><div class="t"><em></em><em></em></div></div></div><div class="btn">Continue</div></div>`;
    track.appendChild(d);
  }
  const STEP = 300, W = 260;
  const xFor = idx => -(idx * STEP) - W / 2; // centers shot idx under the stage center
  const tl = fx.timeline({ duration: 4 });
  const shots = gsap.utils.toArray('.shot');
  const START = N; // the middle copy
  gsap.set(shots, { scale: 0.86, opacity: 0.55 });
  gsap.set(shots[START], { scale: 1, opacity: 1 });
  gsap.set(track, { x: xFor(START) });
  // one screenshot per beat; five beats bring us to the next copy = the loop seam
  for (let k = 0; k < N; k++) {
    const at = 0.2 + k * 0.76;
    const cur = START + k, nxt = START + k + 1;
    tl.to(track, { x: xFor(nxt), duration: 0.65, ease: 'expo.inOut' }, at)
      .to(shots[cur], { scale: 0.86, opacity: 0.55, duration: 0.45, ease: 'power2.inOut' }, at)
      .to(shots[nxt], { scale: 1, opacity: 1, duration: 0.45, ease: 'power2.inOut' }, at + 0.12)
      .to('.dots i', { width: 8, opacity: 0.2, duration: 0.3 }, at)
      .to(`.dots i:nth-child(${((k + 1) % N) + 1})`, { width: 24, opacity: 1, duration: 0.3 }, at);
  }
</script>
