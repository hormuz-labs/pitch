<!doctype html><meta charset="utf-8">
<title>Mobile Screens: Slider</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:linear-gradient(160deg,#f3f0ff,#e9f4ff 60%,#fdf0f6)}
  .title{position:absolute;left:0;right:0;top:54px;text-align:center;color:#141428}
  .title h1{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:40px;letter-spacing:-.03em;line-height:1}
  .title p{font-size:15px;opacity:.6;margin-top:8px}
  .track{position:absolute;left:50%;top:50%;width:0;height:0;margin-top:26px}
  .slot{position:absolute;left:-130px;top:-270px;width:260px;height:540px;will-change:transform,opacity}
  .phone{width:100%;height:100%;border-radius:44px;background:#111216;padding:10px;box-shadow:0 40px 70px rgba(40,30,90,.28)}
  .scr{height:100%;border-radius:35px;overflow:hidden;background:#fff;position:relative;font-size:12px;color:#141428}
  .isl{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:76px;height:22px;border-radius:12px;background:#111;z-index:3}
  .in{padding:50px 16px 0}
  .h{font-size:22px;font-weight:500;letter-spacing:-.02em;margin-bottom:12px}
  .h small{display:block;font-size:11px;color:#8a8f9a;font-weight:400}
  .card{border-radius:16px;padding:14px;margin-bottom:10px;background:#f4f5f8}
  .card.hero{height:150px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
  .card.hero b{font-size:24px;font-weight:500;letter-spacing:-.02em}.card.hero span{font-size:11px;opacity:.85}
  .row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #e6e8ef}
  .row:last-child{border:0}
  .row i{width:32px;height:32px;border-radius:10px;flex:none}
  .row em{display:block;height:8px;border-radius:4px;background:#cfd3dc;font-style:normal;margin-bottom:6px}.row em+em{margin:0;background:#e2e5ec}
  .row .t{flex:1}
  .btn{height:44px;border-radius:14px;background:#141428;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:90px;padding:0 4px}
  .bars i{flex:1;border-radius:5px 5px 2px 2px;background:var(--c)}
  .label{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);display:flex;gap:8px}
  .label i{width:8px;height:8px;border-radius:50%;background:#141428;opacity:.2}
  .cap{position:absolute;left:50%;top:50%;margin-top:-12px;transform:translateX(-50%);pointer-events:none}
  .cap span{position:absolute;left:0;top:0;transform:translateX(-50%);white-space:nowrap;font-size:14px;font-weight:500;color:#141428;background:#fff;padding:8px 14px;border-radius:99px;box-shadow:0 8px 24px rgba(40,30,90,.15);opacity:0}
</style>
<div class="stage">
  <div class="title"><h1>Take the tour</h1><p>Five screens, one swipe at a time</p></div>
  <div class="track" id="track"></div>
  <div class="label" id="dots"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const N = 5, STEP = 320, SEG = 2, HOLD = 1.05;
  const themes = [['#ff5c7a','#ff9a5c','Home'],['#5c7cff','#7ee0ff','Wallet'],['#22c58b','#a3f2c8','Stats'],['#a45cff','#ff7ad9','Orders'],['#ffb020','#ffe08a','Profile']];
  const track = document.getElementById('track'), dots = document.getElementById('dots');
  const rng = fx.rng(21);
  const slots = [];
  for (let i = 0; i < N; i++) {
    const [a, b, name] = themes[i];
    const el = document.createElement('div'); el.className = 'slot';
    let body = '';
    if (i % 3 === 0) body = `<div class="card hero" style="background:linear-gradient(135deg,${a},${b})"><span>${name}</span><b>Welcome back</b></div><div class="card">${[0,1,2].map(r => `<div class="row"><i style="background:${r%2?b:a}"></i><div class="t"><em style="width:${50+Math.floor(rng()*35)}%"></em><em style="width:${25+Math.floor(rng()*40)}%"></em></div></div>`).join('')}</div>`;
    else if (i % 3 === 1) body = `<div class="card" style="--c:${a}"><div class="bars">${[0,1,2,3,4,5,6].map(() => `<i style="height:${20+Math.floor(rng()*80)}%"></i>`).join('')}</div></div><div class="card">${[0,1].map(r => `<div class="row"><i style="background:${r%2?b:a}"></i><div class="t"><em style="width:60%"></em><em style="width:35%"></em></div></div>`).join('')}</div><div class="btn">See details</div>`;
    else body = `<div class="card">${[0,1,2,3].map(r => `<div class="row"><i style="background:${r%2?b:a}"></i><div class="t"><em style="width:${50+Math.floor(rng()*35)}%"></em><em style="width:${25+Math.floor(rng()*40)}%"></em></div></div>`).join('')}</div><div class="btn" style="background:${a}">Continue</div>`;
    el.innerHTML = `<div class="phone"><div class="scr"><div class="isl"></div><div class="in"><div class="h"><small>Acme</small>${name}</div>${body}</div></div></div>`;
    track.appendChild(el); slots.push(el);
    const d = document.createElement('i'); dots.appendChild(d);
  }
  const dotEls = [...dots.children];
  const ease = gsap.parseEase('expo.inOut');
  fx.register({ duration: N * SEG, seek(t) {
    const k = Math.floor(t / SEG), u = (t - k * SEG);
    const pos = k + (u < HOLD ? 0 : ease((u - HOLD) / (SEG - HOLD)));
    for (let i = 0; i < N; i++) {
      let d = ((i - pos) % N + N + N / 2) % N - N / 2;   // wrap so the carousel is endless
      const a = Math.min(1, Math.abs(d));
      const x = d * STEP;
      gsap.set(slots[i], { x, y: a * 22, scale: 1.12 - 0.28 * a, opacity: 1 - 0.55 * Math.min(1, Math.abs(d) / 2), zIndex: 10 - Math.round(Math.abs(d) * 2), filter: `blur(${Math.max(0, Math.abs(d) - 1) * 2}px)` });
      // the active screen's content rises as it lands
      gsap.set(slots[i].querySelector('.in'), { y: 14 * Math.min(1, Math.abs(d)) });
    }
    const active = ((Math.round(pos) % N) + N) % N;
    dotEls.forEach((el, i) => gsap.set(el, { opacity: i === active ? 1 : 0.2, scale: i === active ? 1.35 : 1 }));
  } });
</script>
