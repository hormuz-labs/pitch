<!doctype html><meta charset="utf-8">
<title>Web Screens: Grid</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0e0f13;font-family:"Atlas Grotesk",sans-serif}
  .bg{position:absolute;inset:0;background:radial-gradient(60% 70% at 15% 10%,#22264a,transparent 60%),radial-gradient(50% 60% at 90% 90%,#3a1f3f,transparent 60%)}
  .grid{position:absolute;left:50%;top:50%;width:1680px;display:grid;grid-template-columns:repeat(3,1fr);gap:36px;transform:translate(-50%,-50%);will-change:transform}
  .win{position:relative;height:340px;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 30px 70px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08);will-change:transform,opacity;transform-origin:50% 50%}
  .chrome{height:34px;background:#f4f4f7;border-bottom:1px solid #e3e4ea;display:flex;align-items:center;padding:0 12px;gap:6px}
  .chrome i{width:10px;height:10px;border-radius:50%}
  .chrome i:nth-child(1){background:#ff5f57}.chrome i:nth-child(2){background:#febc2e}.chrome i:nth-child(3){background:#28c840}
  .chrome b{margin-left:14px;flex:1;height:20px;border-radius:6px;background:#e9eaef;font-size:10px;font-weight:400;color:#8a8f9a;display:flex;align-items:center;padding-left:9px}
  .site{position:relative;height:306px;overflow:hidden}
  .page{padding:20px 26px;will-change:transform}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
  .logo{display:flex;align-items:center;gap:7px;font-weight:500;font-size:13px}
  .logo i{width:18px;height:18px;border-radius:6px}
  .nav em{display:flex;gap:14px;font-size:10px;color:#5b6070;font-style:normal;align-items:center}
  .nav em b{padding:6px 10px;border-radius:7px;background:#111;color:#fff;font-weight:500}
  .h1{font-family:"Sharp Grotesk",sans-serif;font-size:36px;font-weight:500;letter-spacing:-.03em;line-height:1;max-width:440px}
  .h1 span{display:block;overflow:hidden}.h1 u{display:block;text-decoration:none}
  .p{font-size:12px;color:#5b6070;margin:12px 0 16px;max-width:360px;line-height:1.5}
  .cta{display:inline-flex;gap:8px}
  .cta b{padding:9px 14px;border-radius:8px;font-size:11px;font-weight:500;background:#111;color:#fff}
  .cta b+b{background:#eef0f4;color:#111}
  .cards{display:flex;gap:12px;margin-top:22px}
  .cards i{flex:1;height:120px;border-radius:10px}
  .rows{margin-top:16px;display:flex;flex-direction:column;gap:8px}
  .rows i{height:12px;border-radius:6px;background:#eceef3;display:block}
  .dark{background:#111318;color:#fff}.dark .chrome{background:#1b1c22;border-color:#2b2c33}.dark .chrome b{background:#2b2c33}.dark .nav em{color:#aab}.dark .nav em b{background:#fff;color:#111}.dark .p{color:#9aa}.dark .cta b{background:#fff;color:#111}.dark .cta b+b{background:#2b2c33;color:#fff}.dark .rows i{background:#22242c}
  .title{position:absolute;left:48px;bottom:36px;color:#fff;font-size:12px;letter-spacing:.22em;text-transform:uppercase;opacity:.7}
  .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 80% at 50% 50%,transparent 60%,rgba(0,0,0,.55))}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="vig"></div>
  <div class="title">Selected work — 2026</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const sites = [
    { url: 'acme.co', name: 'Acme', ic: '#ff3d81', h: ['Build the', 'future faster'], g: ['#ff7a59', '#ff3d81', '#ffd166'], d: 0 },
    { url: 'northwind.io', name: 'Northwind', ic: '#3d5aff', h: ['Analytics for', 'ambitious teams'], g: ['#3d5aff', '#00d4ff', '#9d3dff'], d: 1 },
    { url: 'verdant.farm', name: 'Verdant', ic: '#1fa86c', h: ['Grown with', 'a lighter touch'], g: ['#1fa86c', '#c7f464', '#0b6b47'], d: 0 },
    { url: 'lumen.studio', name: 'Lumen', ic: '#ffb703', h: ['Light, shaped', 'for living'], g: ['#ffb703', '#fb8500', '#ffd60a'], d: 1 },
    { url: 'harbor.app', name: 'Harbor', ic: '#06b6d4', h: ['Ship updates', 'without drama'], g: ['#06b6d4', '#0ea5e9', '#164e63'], d: 0 },
    { url: 'quill.co', name: 'Quill', ic: '#a855f7', h: ['Write once,', 'publish anywhere'], g: ['#a855f7', '#ec4899', '#312e81'], d: 1 },
  ];
  const grid = document.querySelector('.grid');
  sites.forEach((s, i) => {
    const w = document.createElement('div');
    w.className = 'win w' + i + (s.d ? ' dark' : '');
    w.innerHTML = `<div class="chrome"><i></i><i></i><i></i><b>${s.url}</b></div><div class="site"><div class="page">
      <div class="nav"><div class="logo"><i style="background:${s.ic}"></i>${s.name}</div><em>Product<span>Pricing</span><span>Docs</span><b>Get started</b></em></div>
      <div class="h1"><span><u>${s.h[0]}</u></span><span><u>${s.h[1]}</u></span></div>
      <div class="p">A calmer way to plan, build and ship. Trusted by teams who care about the details.</div>
      <div class="cta"><b>Start free</b><b>Book a demo</b></div>
      <div class="cards"><i style="background:${s.g[0]}"></i><i style="background:${s.g[1]}"></i><i style="background:${s.g[2]}"></i></div>
      <div class="rows"><i style="width:80%"></i><i style="width:60%"></i><i style="width:70%"></i></div>
    </div></div>`;
    grid.appendChild(w);
  });
  const tl = fx.timeline({ duration: 9 });
  // the grid enters slightly zoomed out, windows pop in with a checker stagger
  gsap.set('.grid', { scale: 0.62, rotate: -3, y: 20 });
  tl.from('.win', { scale: 0.6, y: 120, opacity: 0, duration: 0.9, ease: 'expo.out', stagger: { each: 0.09, grid: [2, 3], from: 'center' } }, 0.05);
  tl.from('.h1 u', { yPercent: 110, duration: 0.6, ease: 'expo.out', stagger: 0.05 }, 0.45)
    .from('.cards i', { y: 30, opacity: 0, duration: 0.5, ease: 'back.out(1.6)', stagger: 0.03 }, 0.6);
  tl.to('.grid', { scale: 0.74, rotate: 0, y: 0, duration: 1.4, ease: 'expo.out' }, 0.3);
  tl.from('.title', { opacity: 0, x: -12, duration: 0.5 }, 0.9);
  // pages scroll inside the windows in a wave
  tl.to('.page', { y: -130, duration: 1.4, ease: 'power3.inOut', stagger: { each: 0.08, grid: [2, 3], from: 'start' } }, 1.7);
  // the camera pushes into one screen (row 1, col 2), then pulls back
  tl.to('.grid', { scale: 1.5, x: 0, y: 282, duration: 1.6, ease: 'expo.inOut' }, 3.2);
  tl.to('.w1 .page', { y: -260, duration: 1.2, ease: 'power3.inOut' }, 4.4);
  tl.to('.grid', { scale: 0.74, x: 0, y: 0, duration: 1.6, ease: 'expo.inOut' }, 5.4);
  tl.to('.page', { y: 0, duration: 1.2, ease: 'power3.inOut', stagger: { each: 0.06, grid: [2, 3], from: 'end' } }, 6.0);
  // exit: the grid tips and the windows fall away in reverse order
  tl.to('.win', { y: 140, scale: 0.7, opacity: 0, duration: 0.6, ease: 'expo.in', stagger: { each: 0.07, grid: [2, 3], from: 'edges' } }, 8.0)
    .to('.grid', { scale: 0.62, rotate: 3, duration: 1.0, ease: 'power2.in' }, 8.0)
    .to('.title', { opacity: 0, duration: 0.3 }, 8.4);
</script>
