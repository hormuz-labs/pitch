<!doctype html><meta charset="utf-8">
<title>Mobile Gallery: Grid</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#111216;font-family:"Atlas Grotesk",sans-serif;perspective:1800px}
  .grid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(4,200px);gap:26px;transform-style:preserve-3d}
  .shot{width:200px;height:300px;border-radius:24px;overflow:hidden;position:relative;background:#fff;color:#111;box-shadow:0 20px 50px rgba(0,0,0,.5);will-change:transform,opacity}
  .bar{height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:10px;font-weight:500}
  .body{padding:4px 12px 12px}
  .hd{font-size:15px;font-weight:500;letter-spacing:-.02em;margin-bottom:8px}.hd small{display:block;font-size:9px;opacity:.55;font-weight:400}
  .hero{height:96px;border-radius:12px;color:#fff;display:flex;align-items:flex-end;padding:8px;font-size:13px;font-weight:500;margin-bottom:8px}
  .rowi{display:flex;gap:6px;align-items:center;padding:5px 0}
  .rowi i{width:18px;height:18px;border-radius:6px;background:rgba(0,0,0,.12);flex:none}
  .rowi em{display:block;height:5px;border-radius:3px;background:rgba(0,0,0,.18);width:70%;font-style:normal;margin-bottom:4px}
  .rowi em+em{width:45%;opacity:.6;margin:0}.rowi .t{flex:1}
  .dark{background:#1b1c22;color:#fff}.dark .rowi i{background:rgba(255,255,255,.15)}.dark .rowi em{background:rgba(255,255,255,.3)}
  .lbl{position:absolute;left:0;right:0;bottom:30px;text-align:center;color:#fff;font-size:12px;letter-spacing:.25em;text-transform:uppercase;opacity:.6}
</style>
<div class="stage">
  <div class="grid"></div>
  <div class="lbl">Acme — 8 screens</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const grads = ['linear-gradient(135deg,#5b6cff,#c46bff)', 'linear-gradient(135deg,#ff8a5c,#ff3d81)', 'linear-gradient(135deg,#1fa86c,#c7f464)', 'linear-gradient(135deg,#ffd166,#ff7a59)', 'linear-gradient(135deg,#3d5aff,#00d4ff)', 'linear-gradient(135deg,#9d3dff,#ff5c6e)', 'linear-gradient(135deg,#111,#555)', 'linear-gradient(135deg,#00b4a2,#3d5aff)'];
  const names = [['Home', 'Today'], ['Shop', 'Featured'], ['Health', 'Activity'], ['Wallet', 'Balance'], ['Social', 'Friends'], ['Music', 'Now playing'], ['Settings', 'Account'], ['Maps', 'Nearby']];
  const grid = document.querySelector('.grid');
  const rows = '<div class="rowi"><i></i><div class="t"><em></em><em></em></div></div>'.repeat(3);
  for (let i = 0; i < 8; i++) {
    const d = document.createElement('div');
    d.className = 'shot s' + i + (i % 3 === 1 ? ' dark' : '');
    d.innerHTML = `<div class="bar"><span>9:41</span><span>●●●</span></div><div class="body"><div class="hd"><small>${names[i][0]}</small>${names[i][1]}</div><div class="hero" style="background:${grads[i]}">${names[i][1]}</div>${rows}</div>`;
    grid.appendChild(d);
  }
  const tl = fx.timeline({ duration: 3 });
  const shots = gsap.utils.toArray('.shot');
  // all eight start stacked in the centre as one pile, then spring out into the grid
  shots.forEach((s, i) => {
    const r = s.getBoundingClientRect();
    const cx = 640 - (r.left + r.width / 2), cy = 360 - (r.top + r.height / 2);
    tl.fromTo(s, { x: cx, y: cy + 40, rotate: (i - 3.5) * 4, scale: 0.7, opacity: 0 },
      { x: 0, y: 0, rotate: 0, scale: 1, opacity: 1, duration: 0.9, ease: 'move' }, 0.1 + i * 0.07);
  });
  tl.from('.lbl', { opacity: 0, y: 8, duration: 0.4 }, 0.9);
  // the grid tilts gently in 3D once assembled, then screens pile back to the centre for the loop
  tl.fromTo('.grid', { rotateX: 0, rotateY: 0 }, { rotateX: -6, rotateY: 6, duration: 1.2, ease: 'sine.inOut' }, 1.0)
    .to('.grid', { rotateX: 0, rotateY: 0, duration: 0.6, ease: 'sine.inOut' }, 2.2);
  shots.forEach((s, i) => {
    const r = s.getBoundingClientRect();
    const cx = 640 - (r.left + r.width / 2), cy = 360 - (r.top + r.height / 2);
    tl.to(s, { x: cx, y: cy - 40, scale: 0.7, opacity: 0, rotate: (3.5 - i) * 4, duration: 0.4, ease: 'power3.in' }, 2.5 + (7 - i) * 0.04);
  });
  tl.to('.lbl', { opacity: 0, duration: 0.3 }, 2.6);
</script>
