<!doctype html><meta charset="utf-8">
<title>Push Notification [iOS]</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#08080b;font-family:-apple-system,"Helvetica Neue","Atlas Grotesk",sans-serif;perspective:1800px}
  .bg{position:absolute;inset:-10%;background:url("../../../assets/backgrounds/sunset.png") center/cover;filter:brightness(.35) saturate(1.2)}
  .copy{position:absolute;right:110px;top:50%;transform:translateY(-50%);color:#fff;width:420px;text-align:right}
  .copy .k{font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.55;margin-bottom:16px}
  .copy h1{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:58px;line-height:1;letter-spacing:-.03em}
  .copy h1 span{display:block;overflow:hidden}.copy h1 b{display:block;font-weight:500}
  .copy p{margin-top:18px;font-size:17px;line-height:1.5;opacity:.75}
  .wrap{position:absolute;left:200px;top:50%;transform:translateY(-50%);transform-style:preserve-3d}
  .phone{width:300px;height:620px;border-radius:52px;background:#16171c;padding:12px;box-shadow:0 60px 100px rgba(0,0,0,.6),inset 0 0 0 2px #45464e;will-change:transform}
  .scr{height:100%;border-radius:41px;overflow:hidden;position:relative;background:url("../../../assets/backgrounds/aurora.png") center/cover;color:#fff}
  .isl{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:96px;height:28px;border-radius:16px;background:#111;z-index:6}
  .sb{position:absolute;top:16px;left:26px;right:26px;display:flex;justify-content:space-between;font-size:13px;font-weight:600}
  .lock{position:absolute;top:60px;left:0;right:0;text-align:center;will-change:transform}
  .lock small{font-size:14px;font-weight:600}
  .lock .t{font-size:72px;font-weight:600;letter-spacing:-.04em;line-height:1}
  .note{position:absolute;left:12px;right:12px;top:150px;border-radius:22px;background:rgba(40,40,48,.45);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 16px 40px rgba(0,0,0,.35);display:flex;gap:11px;align-items:center;padding:12px 14px;will-change:transform,opacity;transform-origin:50% 0}
  .app{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#8b7bff,#ff6fb5);flex:none;display:flex;align-items:center;justify-content:center}
  .app::after{content:"";width:16px;height:16px;border-radius:4px;background:#fff;transform:rotate(45deg)}
  .txt{flex:1;min-width:0}
  .txt .n{display:flex;justify-content:space-between;font-size:13px;font-weight:600}.txt .n small{font-weight:400;opacity:.6;font-size:11px}
  .txt .m{font-size:12.5px;line-height:1.3;margin-top:2px;opacity:.95}
  .bottom{position:absolute;bottom:30px;left:26px;right:26px;display:flex;justify-content:space-between}
  .bottom i{width:42px;height:42px;border-radius:50%;background:rgba(40,40,48,.5)}
  .home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:110px;height:5px;border-radius:3px;background:#fff}
  .badge{position:absolute;left:50%;top:50%;margin:-120px 0 0 -150px;width:300px;height:300px;pointer-events:none}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="wrap"><div class="phone"><div class="scr">
    <div class="isl"></div>
    <div class="sb"><span>9:41</span><span>●●● ▮</span></div>
    <div class="lock"><small>Tuesday, September 6</small><div class="t">9:41</div></div>
    <div class="note"><div class="app"></div><div class="txt"><div class="n">Acme <small>now</small></div><div class="m">Your weekly report is ready — revenue up 18%.</div></div></div>
    <div class="bottom"><i></i><i></i></div>
    <div class="home"></div>
  </div></div></div>
  <div class="copy"><div class="k">iOS · Push</div><h1><span><b>Right on</b></span><span><b>time,</b></span><span><b>every time.</b></span></h1><p>Acme pushes what matters, the moment it matters — with a spring you can feel.</p></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/CustomEase.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(CustomEase);
  CustomEase.create('spring', 'M0,0 C0.12,0.72 0.24,1.06 0.44,1.05 0.6,1.04 0.7,1 1,1');
  const tl = fx.timeline({ duration: 3 });
  tl.fromTo('.bg', { scale: 1.05, xPercent: -1 }, { scale: 1.12, xPercent: 1, duration: 3, ease: 'none' }, 0)
    .fromTo('.phone', { rotateY: 16, rotateX: 4 }, { rotateY: 9, rotateX: 2, duration: 3, ease: 'sine.inOut' }, 0)
    .from('.copy h1 b', { yPercent: 110, stagger: 0.08, duration: 0.7, ease: 'expo.out' }, 0.05)
    .from('.copy .k, .copy p', { y: 14, opacity: 0, stagger: 0.1, duration: 0.5, ease: 'power3.out' }, 0.25)
    // the banner drops in with the iOS spring, the clock shifts to make room
    .fromTo('.note', { y: -170, scale: 0.9, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.8, ease: 'spring' }, 0.45)
    .fromTo('.lock', { y: 0 }, { y: 10, duration: 0.7, ease: 'spring' }, 0.45)
    .from('.txt > *', { y: 6, opacity: 0, stagger: 0.06, duration: 0.35, ease: 'power2.out' }, 0.62)
    // a tiny haptic on the phone body
    .fromTo('.phone', { x: 0 }, { x: 3, duration: 0.05, yoyo: true, repeat: 5 }, 0.5)
    // dismiss upward
    .to('.note', { y: -170, scale: 0.92, opacity: 0, duration: 0.4, ease: 'power3.in' }, 2.35)
    .to('.lock', { y: 0, duration: 0.45, ease: 'power3.inOut' }, 2.4)
    .to('.copy', { opacity: 0, x: 24, duration: 0.35, ease: 'power2.in' }, 2.65);
</script>
