<!doctype html><meta charset="utf-8">
<title>Sliding Smartphones</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f3f1ec;perspective:1800px;color:#141414}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
  .b1{left:-100px;top:-150px;width:600px;height:600px;background:#ffb1c8}
  .b2{right:-150px;bottom:-200px;width:700px;height:700px;background:#b9c6ff}
  .row{position:absolute;left:62%;top:50%;transform:translate(-50%,-50%);display:flex;gap:44px;align-items:center;transform-style:preserve-3d}
  .ph{width:240px;height:490px;border-radius:40px;background:#141414;padding:10px;box-shadow:0 50px 80px rgba(40,30,60,.28);will-change:transform,opacity;transform-style:preserve-3d}
  .scr{height:100%;border-radius:31px;overflow:hidden;position:relative;background:#fff;font-size:11px}
  .isl{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:72px;height:20px;border-radius:12px;background:#111;z-index:3}
  .in{padding:46px 14px 0}
  .h{font-size:21px;font-weight:500;letter-spacing:-.02em;margin-bottom:10px}.h small{display:block;font-size:10px;color:#8a8f9a;font-weight:400}
  .card{border-radius:14px;padding:12px;margin-bottom:8px;background:#f4f5f8}
  .card.hero{height:140px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}.card.hero b{font-size:20px;font-weight:500}.card.hero span{font-size:10px;opacity:.85}
  .r{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #e6e8ef}.r:last-child{border:0}
  .r i{width:26px;height:26px;border-radius:8px;flex:none}
  .r em{display:block;height:6px;border-radius:3px;background:#cfd3dc;font-style:normal;margin-bottom:5px}.r em+em{margin:0;background:#e2e5ec}.r .t{flex:1}
  .btn{height:38px;border-radius:12px;background:#141414;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:12px}
  .bars{display:flex;align-items:flex-end;gap:5px;height:80px}.bars i{flex:1;border-radius:4px 4px 2px 2px;background:var(--c)}
  .cap{position:absolute;left:60px;top:50%;transform:translateY(-50%);width:300px}
  .cap h1{font-family:"Sharp Grotesk",sans-serif;font-size:44px;font-weight:500;letter-spacing:-.03em;line-height:1}
  .cap h1 span{display:block;overflow:hidden}.cap h1 b{display:block;font-weight:500}
  .tag{position:absolute;left:60px;bottom:64px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.5}
</style>
<div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="cap"><h1><span><b>Three screens.</b></span><span><b>One launch.</b></span></h1></div>
  <div class="row" id="row"></div>
  <div class="tag">Acme · Spring release</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const rng = fx.rng(3);
  const themes = [['#ff5c7a', '#ff9a5c', 'Home'], ['#5c7cff', '#7ee0ff', 'Wallet'], ['#22c58b', '#a3f2c8', 'Stats']];
  const row = document.getElementById('row');
  themes.forEach(([a, b, n], i) => {
    const el = document.createElement('div'); el.className = 'ph p' + i;
    const rows = k => Array.from({ length: k }, (_, r) => `<div class="r"><i style="background:${r % 2 ? b : a}"></i><div class="t"><em style="width:${50 + Math.floor(rng() * 35)}%"></em><em style="width:${25 + Math.floor(rng() * 40)}%"></em></div></div>`).join('');
    const body = i === 1 ? `<div class="card" style="--c:${a}"><div class="bars">${[40, 70, 55, 95, 65, 80, 100].map(h => `<i style="height:${h}%"></i>`).join('')}</div></div><div class="card">${rows(2)}</div><div class="btn">See details</div>` : `<div class="card hero" style="background:linear-gradient(135deg,${a},${b})"><span>Today</span><b>Welcome back</b></div><div class="card">${rows(3)}</div>${i === 2 ? '<div class="btn">Continue</div>' : ''}`;
    el.innerHTML = `<div class="scr"><div class="isl"></div><div class="in"><div class="h"><small>Acme</small>${n}</div>${body}</div></div>`;
    row.appendChild(el);
  });
  const tl = fx.timeline({ duration: 5 });
  // three directions: left, bottom, right — each slides in with an expo ease and a slight rotation that straightens out
  tl.from('.p0', { x: -900, rotate: -14, rotateY: 30, duration: 1.0, ease: 'expo.out' }, 0.15)
    .from('.p1', { y: 800, rotate: 6, duration: 1.0, ease: 'expo.out' }, 0.3)
    .from('.p2', { x: 900, rotate: 14, rotateY: -30, duration: 1.0, ease: 'expo.out' }, 0.45)
    .from('.cap h1 b', { yPercent: 110, stagger: 0.1, duration: 0.8, ease: 'expo.out' }, 0.5)
    .from('.tag', { opacity: 0, x: 20, duration: 0.6 }, 0.9)
    // settled: a soft float, out of phase
    .to('.p0', { y: -14, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.2)
    .to('.p1', { y: 12, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.3)
    .to('.p2', { y: -10, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.4)
    .fromTo('.blob', { scale: 1 }, { scale: 1.15, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
    // out: each leaves the way it came
    .to('.p0', { x: -900, rotate: -10, duration: 0.5, ease: 'expo.in' }, 4.3)
    .to('.p1', { y: 800, rotate: 5, duration: 0.5, ease: 'expo.in' }, 4.38)
    .to('.p2', { x: 900, rotate: 10, duration: 0.5, ease: 'expo.in' }, 4.46)
    .to('.cap h1 b', { yPercent: -110, stagger: 0.06, duration: 0.4, ease: 'expo.in' }, 4.4)
    .to('.tag', { opacity: 0, duration: 0.3 }, 4.5);
</script>
