<!doctype html><meta charset="utf-8">
<title>The Route: iOS Flight Tracker</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#07101c;perspective:1800px;color:#fff;font-family:-apple-system,"Helvetica Neue","Atlas Grotesk",sans-serif}
  .bg{position:absolute;inset:-10%;background:url("../../../assets/backgrounds/ocean.png") center/cover;filter:brightness(.35) saturate(1.2)}
  .copy{position:absolute;right:110px;top:50%;transform:translateY(-50%);width:430px;text-align:right}
  .copy .k{font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.55;margin-bottom:16px;font-family:"Atlas Grotesk",sans-serif}
  .copy h1{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:54px;line-height:1;letter-spacing:-.03em}
  .copy h1 span{display:block;overflow:hidden}.copy h1 b{display:block;font-weight:500}
  .copy .stat{display:inline-block;margin-top:22px;padding:14px 20px;border-radius:16px;background:rgba(255,255,255,.08);font-size:15px;text-align:left}
  .copy .stat b{display:block;font-size:30px;font-weight:600;letter-spacing:-.02em}
  .wrap{position:absolute;left:200px;top:50%;transform:translateY(-50%);transform-style:preserve-3d}
  .phone{width:300px;height:620px;border-radius:52px;background:#16171c;padding:12px;box-shadow:0 60px 100px rgba(0,0,0,.6),inset 0 0 0 2px #45464e;will-change:transform}
  .scr{height:100%;border-radius:41px;overflow:hidden;position:relative;background:#0d1a2b}
  .isl{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:96px;height:28px;border-radius:16px;background:#000;z-index:8;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:10px;font-weight:600;overflow:hidden}
  .isl .pl{width:14px;height:14px;background:#7ee0ff;clip-path:polygon(0 50%,100% 0,70% 50%,100% 100%)}
  .isl .eta{opacity:0}
  .sb{position:absolute;top:16px;left:26px;right:26px;display:flex;justify-content:space-between;font-size:13px;font-weight:600;z-index:7}
  .map{position:absolute;inset:0}
  .map svg{width:100%;height:100%}
  .plane{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px;will-change:transform;z-index:5;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
  .tip{position:absolute;left:0;top:0;transform:translate(-50%,-140%);background:#fff;color:#0b1220;border-radius:12px;padding:8px 10px;font-size:11px;white-space:nowrap;z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .tip b{display:block;font-size:14px;font-weight:600}
  .sheet{position:absolute;left:0;right:0;bottom:0;height:250px;border-radius:26px 26px 0 0;background:rgba(255,255,255,.96);color:#0b1220;padding:14px 18px;z-index:6;will-change:transform}
  .sheet .grab{width:36px;height:5px;border-radius:3px;background:#d0d3da;margin:0 auto 12px}
  .sheet .fl{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#6b7280}
  .sheet .fl b{color:#0b1220;font-weight:600}
  .sheet .fl span{padding:4px 10px;border-radius:99px;background:#e9fbf2;color:#0f9d58;font-weight:600;font-size:11px}
  .sheet .rt{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
  .sheet .rt .a{font-size:30px;font-weight:600;letter-spacing:-.03em}
  .sheet .rt .a small{display:block;font-size:11px;color:#6b7280;font-weight:400}
  .sheet .prog{flex:1;margin:0 14px;height:4px;border-radius:2px;background:#e5e7ee;position:relative}
  .sheet .prog i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:2px;background:#2f6bff;transform-origin:left;transform:scaleX(0)}
  .sheet .g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .sheet .g div{background:#f3f4f8;border-radius:12px;padding:10px;font-size:16px;font-weight:600;letter-spacing:-.02em}
  .sheet .g div small{display:block;font-size:10px;color:#6b7280;font-weight:400;margin-bottom:2px}
  .home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:110px;height:5px;border-radius:3px;background:#0b1220;z-index:9}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="wrap"><div class="phone"><div class="scr">
    <div class="isl"><span class="pl"></span><span class="eta">42 min</span></div>
    <div class="sb"><span>9:41</span><span>●●● ▮</span></div>
    <div class="map"><svg viewBox="0 0 276 596" preserveAspectRatio="none" id="svg"></svg></div>
    <svg class="plane" viewBox="0 0 24 24"><path d="M2 12l20-8-6 8 6 8z" fill="#fff"/></svg>
    <div class="tip"><b>NW 214</b><span class="alt">0 ft</span> · <span class="spd">0 mph</span></div>
    <div class="sheet">
      <div class="grab"></div>
      <div class="fl"><b>NW 214</b>Northwind Air<span class="st">On time</span></div>
      <div class="rt"><div class="a">SFO<small>07:45</small></div><div class="prog"><i></i></div><div class="a" style="text-align:right">JFK<small>16:20</small></div></div>
      <div class="g"><div><small>Altitude</small><span class="alt2">0</span> ft</div><div><small>Speed</small><span class="spd2">0</span> mph</div><div><small>Arrives in</small><span class="eta2">5h 20m</span></div></div>
    </div>
    <div class="home"></div>
  </div></div></div>
  <div class="copy"><div class="k">The Route · Live activity</div><h1><span><b>Follow</b></span><span><b>every mile.</b></span></h1><div class="stat">Altitude<b><span class="alt3">0</span> ft</b></div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../../assets/gsap/MotionPathPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin);
  const rng = fx.rng(31), svg = document.getElementById('svg');
  // an abstract map: soft land masses, a grid, a few roads
  let land = '';
  for (let i = 0; i < 7; i++) {
    const cx = rng() * 276, cy = rng() * 596, r = 40 + rng() * 70; let d = '';
    for (let k = 0; k < 9; k++) { const a = k / 9 * Math.PI * 2, rr = r * (0.7 + rng() * 0.6); d += (k ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(1) + ',' + (cy + Math.sin(a) * rr).toFixed(1); }
    land += `<path d="${d}Z" fill="#16283f" stroke="#1f3652" stroke-width="1"/>`;
  }
  let grid = '';
  for (let x = 0; x < 276; x += 46) grid += `<line x1="${x}" y1="0" x2="${x}" y2="596" stroke="rgba(255,255,255,.05)"/>`;
  for (let y = 0; y < 596; y += 46) grid += `<line x1="0" y1="${y}" x2="276" y2="${y}" stroke="rgba(255,255,255,.05)"/>`;
  let roads = '';
  for (let i = 0; i < 6; i++) roads += `<path d="M${rng() * 276},${rng() * 596} Q${rng() * 276},${rng() * 596} ${rng() * 276},${rng() * 596}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.5"/>`;
  svg.innerHTML = `<g class="mapg">${land}${grid}${roads}</g>
    <path id="route" d="M40,470 C60,300 120,180 236,110" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2" stroke-dasharray="4 6"/>
    <path id="flown" d="M40,470 C60,300 120,180 236,110" fill="none" stroke="#7ee0ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="470" r="6" fill="#fff"/><circle cx="236" cy="110" r="6" fill="#fff"/>
    <circle class="ping" cx="236" cy="110" r="6" fill="none" stroke="#7ee0ff" stroke-width="2"/>`;
  const n = { alt: 0, spd: 0 };
  const tl = fx.timeline({ duration: 10 });
  tl.fromTo('.bg', { scale: 1.05, xPercent: -1 }, { scale: 1.12, xPercent: 1, duration: 10, ease: 'none' }, 0)
    .fromTo('.phone', { rotateY: 40, x: -200, opacity: 0 }, { rotateY: 12, x: 0, opacity: 1, duration: 1.1, ease: 'expo.out' }, 0)
    .to('.phone', { rotateY: 6, rotateX: 3, duration: 4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.1)
    .from('.copy h1 b', { yPercent: 110, stagger: 0.1, duration: 0.8, ease: 'expo.out' }, 0.3)
    .from('.copy .k, .copy .stat', { y: 16, opacity: 0, stagger: 0.1, duration: 0.5 }, 0.6)
    // the map settles, the sheet is parked low, the route draws, then the plane flies it
    .fromTo('.mapg', { scale: 1.15, transformOrigin: '50% 50%', opacity: 0 }, { scale: 1, opacity: 1, duration: 1.2, ease: 'power3.out' }, 0.2)
    .set('.sheet', { y: 150 }, 0)
    .fromTo('#flown', { drawSVG: '0%' }, { drawSVG: '100%', duration: 5.2, ease: 'power1.inOut' }, 1.4)
    .to('.plane, .tip', { motionPath: { path: '#route', align: '#route', alignOrigin: [0.5, 0.5], autoRotate: false }, duration: 5.2, ease: 'power1.inOut' }, 1.4)
    .to('.plane', { motionPath: { path: '#route', align: '#route', alignOrigin: [0.5, 0.5], autoRotate: true }, duration: 5.2, ease: 'power1.inOut' }, 1.4)
    .from('.tip', { opacity: 0, scale: 0.6, duration: 0.4, ease: 'back.out(2)' }, 1.4)
    .to(n, { alt: 34000, spd: 512, duration: 3, ease: 'power2.out', onUpdate() {
      const a = Math.round(n.alt).toLocaleString(), s = Math.round(n.spd);
      document.querySelector('.alt').textContent = a + ' ft'; document.querySelector('.spd').textContent = s + ' mph';
      document.querySelector('.alt2').textContent = a; document.querySelector('.spd2').textContent = s; document.querySelector('.alt3').textContent = a;
    } }, 1.6)
    .fromTo('.sheet .prog i', { scaleX: 0 }, { scaleX: 1, duration: 5.2, ease: 'power1.inOut' }, 1.4)
    .fromTo('.ping', { attr: { r: 6 }, opacity: 1 }, { attr: { r: 26 }, opacity: 0, duration: 1.2, ease: 'power2.out', repeat: 7 }, 0.5)
    // Dynamic Island live activity expands with the ETA as the plane closes in
    .to('.isl', { width: 170, duration: 0.5, ease: 'back.out(1.5)' }, 5.0)
    .to('.isl .eta', { opacity: 1, duration: 0.3 }, 5.3)
    .to('.eta2', { duration: 0.01, onComplete() { this.targets()[0].textContent = '42m'; }, onReverseComplete() { this.targets()[0].textContent = '5h 20m'; } }, 5.2)
    // the sheet rises with landing details
    .to('.sheet', { y: 0, duration: 0.7, ease: 'expo.out' }, 6.6)
    .to('.st', { backgroundColor: '#e8f0ff', color: '#2f6bff', duration: 0.3, onComplete() { this.targets()[0].textContent = 'Landing'; }, onReverseComplete() { this.targets()[0].textContent = 'On time'; } }, 6.9)
    // out
    .to('.phone', { rotateY: -30, x: -220, opacity: 0, duration: 0.6, ease: 'expo.in' }, 9.3)
    .to('.copy', { opacity: 0, x: 24, duration: 0.4, ease: 'power2.in' }, 9.4);
</script>
