<!doctype html><meta charset="utf-8">
<title>Animated Photo Gallery</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0a0a0b;font-family:"Atlas Grotesk",sans-serif}
  .frame{position:absolute;left:50%;top:50%;width:900px;height:560px;transform:translate(-50%,-50%);overflow:hidden;border-radius:14px;box-shadow:0 50px 100px rgba(0,0,0,.6)}
  .ph{position:absolute;inset:0;background-size:cover;background-position:center;will-change:transform,clip-path}
  .ph.a{background-image:url("../../../assets/backgrounds/aurora.png")}
  .ph.b{background-image:url("../../../assets/backgrounds/ocean.png")}
  .ph.c{background-image:url("../../../assets/backgrounds/sunset.png")}
  .cap{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:space-between;padding:0 190px;color:#fff;font-size:14px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
  .cap .l{overflow:hidden;height:20px}
  .cap .l span{display:block;will-change:transform}
  .thumbs{position:absolute;right:40px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
  .thumbs i{width:70px;height:44px;border-radius:6px;background-size:cover;background-position:center;opacity:.35;transform-origin:right center}
  .thumbs i.a{background-image:url("../../../assets/backgrounds/aurora.png")}
  .thumbs i.b{background-image:url("../../../assets/backgrounds/ocean.png")}
  .thumbs i.c{background-image:url("../../../assets/backgrounds/sunset.png")}
  .num{position:absolute;left:40px;top:50%;transform:translateY(-50%);color:#fff;font-family:"Sorts Mill Goudy",serif;font-size:64px;line-height:1;opacity:.85}
  .num small{display:block;font-family:"Atlas Grotesk",sans-serif;font-size:12px;letter-spacing:.2em;opacity:.5;margin-top:8px}
</style>
<div class="stage">
  <div class="num"><b class="n">01</b><small>OF 03</small></div>
  <div class="frame">
    <div class="ph c"></div>
    <div class="ph b"></div>
    <div class="ph a"></div>
  </div>
  <div class="thumbs"><i class="a"></i><i class="b"></i><i class="c"></i></div>
  <div class="cap"><div class="l"><span class="t1">Aurora · Tromsø</span></div><div class="l"><span class="t2">Series I</span></div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 3 });
  const names = ['Aurora · Tromsø', 'Shore · Lofoten', 'Dusk · Reine'];
  const nums = ['01', '02', '03'];
  const layers = ['.ph.a', '.ph.b', '.ph.c'];
  const thumbs = gsap.utils.toArray('.thumbs i');
  gsap.set(thumbs[0], { opacity: 1, scale: 1.15 });
  // each photo: slow push-in for its whole life; the next one wipes in over it with a soft
  // diagonal clip, revealing a fresh photo that itself starts wide and settles
  gsap.set('.ph', { clipPath: 'inset(0 0 0 0)' });
  const wipeIn = (sel, at) => tl.fromTo(sel, { clipPath: 'inset(0 0 0 100%)', scale: 1.18 }, { clipPath: 'inset(0 0 0 0%)', scale: 1.08, duration: 0.75, ease: 'expo.inOut', immediateRender: false }, at);
  const settle = (sel, at, len) => tl.to(sel, { scale: 1.0, xPercent: -1.5, duration: len, ease: 'none' }, at);
  tl.fromTo('.ph.a', { scale: 1.08, xPercent: 0 }, { scale: 1.0, xPercent: -1.5, duration: 1.0, ease: 'none' }, 0);
  // a -> b
  gsap.set('.ph.b', { zIndex: 3 });
  wipeIn('.ph.b', 0.75); settle('.ph.b', 1.5, 0.5);
  gsap.set('.ph.c', { zIndex: 4 });
  wipeIn('.ph.c', 1.75); settle('.ph.c', 2.5, 0.5);
  // c -> a for the loop seam: a wipes back in on top at the very end
  tl.set('.ph.a', { zIndex: 5 }, 2.75);
  wipeIn('.ph.a', 2.75);
  tl.set('.ph.a', { zIndex: 0, scale: 1.08, xPercent: 0 }, 0);
  tl.set('.ph.b', { clipPath: 'inset(0 0 0 100%)' }, 0).set('.ph.c', { clipPath: 'inset(0 0 0 100%)' }, 0);
  // captions roll, thumbs and counter follow
  [1, 2, 0].forEach((idx, k) => {
    const at = 0.85 + k * 1.0;
    tl.to('.t1', { yPercent: -110, duration: 0.25, ease: 'power2.in' }, at)
      .call(() => { document.querySelector('.t1').textContent = names[idx]; document.querySelector('.n').textContent = nums[idx]; }, null, at + 0.25)
      .fromTo('.t1', { yPercent: 110 }, { yPercent: 0, duration: 0.35, ease: 'expo.out', immediateRender: false }, at + 0.25)
      .to(thumbs, { opacity: 0.35, scale: 1, duration: 0.3 }, at)
      .to(thumbs[idx], { opacity: 1, scale: 1.15, duration: 0.3 }, at)
      .fromTo('.n', { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, immediateRender: false }, at + 0.25);
  });
  tl.call(() => { document.querySelector('.t1').textContent = names[0]; document.querySelector('.n').textContent = nums[0]; }, null, 0.01);
</script>
