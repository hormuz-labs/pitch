<!doctype html><meta charset="utf-8">
<title>Mobile App Showcase</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f4f1ea;font-family:"Atlas Grotesk",sans-serif;perspective:1800px}
  .blob{position:absolute;width:700px;height:700px;border-radius:50%;filter:blur(90px);opacity:.55}
  .b1{left:-150px;top:-200px;background:#ffd6c2}.b2{right:-200px;bottom:-250px;background:#cfe0ff}
  .wrap{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
  .phone{position:absolute;left:-140px;top:-290px;width:280px;height:580px;border-radius:48px;background:#1a1b20;padding:12px;box-shadow:0 50px 90px rgba(30,30,60,.3),inset 0 0 0 2px #4a4b52;will-change:transform}
  .scr{height:100%;border-radius:37px;overflow:hidden;position:relative;background:#fff;color:#111}
  .island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:90px;height:26px;border-radius:14px;background:#111;z-index:5}
  .pages{position:absolute;inset:0;width:300%;display:flex;will-change:transform}
  .page{width:calc(100%/3);padding:54px 18px 18px;position:relative}
  .hd{font-size:22px;font-weight:500;letter-spacing:-.02em;margin-bottom:12px}.hd small{display:block;font-size:11px;color:#8a8f9a;font-weight:400}
  .card{border-radius:16px;background:#f3f4f7;padding:12px;margin-bottom:10px}
  .hero{height:150px;background:linear-gradient(135deg,#ff8a5c,#ff3d81);color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
  .hero b{font-size:24px;font-weight:500;letter-spacing:-.02em}.hero span{font-size:11px;opacity:.85}
  .rowi{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #e9ebf0}.rowi:last-child{border:0}
  .rowi i{width:30px;height:30px;border-radius:9px;background:#dfe3ec;flex:none}
  .rowi .t{flex:1}.rowi em{display:block;height:8px;border-radius:4px;background:#cfd3dc;width:70%;font-style:normal;margin-bottom:6px}.rowi em+em{width:45%;background:#e4e7ee;margin:0}
  .btn{height:46px;border-radius:14px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:60px;background:#fff;border-top:1px solid #eceef2;display:flex;justify-content:space-around;align-items:center;padding-bottom:8px;z-index:4}
  .tabbar i{width:20px;height:20px;border-radius:6px;background:#d3d6de}.tabbar i.on{background:#ff3d81}
  .tap{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,61,129,.35);border:2px solid rgba(255,61,129,.8);z-index:8;transform:scale(0);left:0;top:0;will-change:transform}
  .step{position:absolute;color:#111;width:300px}
  .step.l{left:110px;top:50%;transform:translateY(-50%)}
  .step b{display:block;font-family:"Sharp Grotesk",sans-serif;font-size:44px;font-weight:500;letter-spacing:-.03em;line-height:1.02}
  .step small{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#ff3d81;margin-bottom:10px}
  .step p{margin-top:12px;font-size:15px;color:#5b6070;line-height:1.5}
  .steps{position:absolute;right:120px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px}
  .steps i{width:10px;height:10px;border-radius:5px;background:#111;opacity:.15}
  .steps i.on{height:34px;opacity:1}
</style>
<div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="step l"><small class="k">Step 1</small><b class="t">Plan<br>your day</b><p class="d">Add tasks in a tap and let Acme order them for you.</p></div>
  <div class="steps"><i class="on"></i><i></i><i></i></div>
  <div class="wrap"><div class="phone"><div class="scr"><div class="island"></div>
    <div class="pages">
      <div class="page"><div class="hd"><small>Monday</small>Today</div><div class="card hero"><span>3 tasks left</span><b>Good pace</b></div><div class="card"><div class="rowi"><i></i><div class="t"><em></em><em></em></div></div><div class="rowi"><i></i><div class="t"><em></em><em></em></div></div></div><div class="btn b1">Add task</div></div>
      <div class="page"><div class="hd"><small>Focus</small>Deep work</div><div class="card" style="text-align:center;padding:26px 12px"><div style="font-size:54px;font-weight:500;letter-spacing:-.03em" class="timer">25:00</div><div style="font-size:11px;color:#8a8f9a">Session 2 of 4</div></div><div class="card"><div class="rowi"><i></i><div class="t"><em></em><em></em></div></div></div><div class="btn">Start</div></div>
      <div class="page"><div class="hd"><small>Weekly</small>Review</div><div class="card" style="height:150px;display:flex;align-items:flex-end;gap:6px"><i class="bar" style="flex:1;height:40%;background:#ff3d81;border-radius:4px"></i><i class="bar" style="flex:1;height:70%;background:#ff3d81;border-radius:4px"></i><i class="bar" style="flex:1;height:55%;background:#ff3d81;border-radius:4px"></i><i class="bar" style="flex:1;height:90%;background:#ff3d81;border-radius:4px"></i><i class="bar" style="flex:1;height:65%;background:#ff3d81;border-radius:4px"></i></div><div class="card"><div class="rowi"><i></i><div class="t"><em></em><em></em></div></div><div class="rowi"><i></i><div class="t"><em></em><em></em></div></div></div><div class="btn">Share</div></div>
    </div>
    <div class="tabbar"><i class="on t1"></i><i class="t2"></i><i class="t3"></i></div>
    <div class="tap"></div>
  </div></div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 5 });
  const copy = [['Step 1', 'Plan<br>your day', 'Add tasks in a tap and let Acme order them for you.'], ['Step 2', 'Focus<br>in blocks', 'Timed sessions keep you on one thing at a time.'], ['Step 3', 'Review<br>the week', 'See where the hours went, and plan the next.']];
  const setCopy = i => { document.querySelector('.k').textContent = copy[i][0]; document.querySelector('.t').innerHTML = copy[i][1]; document.querySelector('.d').textContent = copy[i][2]; };
  const swapCopy = (i, at) => {
    tl.to('.step', { opacity: 0, y: -14, duration: 0.25, ease: 'power2.in' }, at)
      .call(() => setCopy(i), null, at + 0.25)
      .fromTo('.step', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out', immediateRender: false }, at + 0.25)
      .to('.steps i', { height: 10, opacity: 0.15, duration: 0.3 }, at)
      .to(`.steps i:nth-child(${i + 1})`, { height: 34, opacity: 1, duration: 0.3 }, at);
  };
  const tapAt = (x, y, at) => tl.set('.tap', { x, y }, at).fromTo('.tap', { scale: 0, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.5, ease: 'power2.out', immediateRender: false }, at);
  tl.call(() => setCopy(0), null, 0.01);
  tl.fromTo('.phone', { rotateY: -30, y: 40, opacity: 0 }, { rotateY: -12, y: 0, opacity: 1, duration: 1.0, ease: 'expo.out' }, 0)
    .to('.phone', { rotateY: 12, duration: 3.6, ease: 'sine.inOut' }, 1.0)
    .to('.phone', { rotateY: -12, y: 0, duration: 0.4, ease: 'power2.inOut' }, 4.6)
    .from('.step', { x: -30, opacity: 0, duration: 0.7, ease: 'power3.out' }, 0.3)
    .from('.steps', { opacity: 0, duration: 0.5 }, 0.3);
  // walk-through: tap the tab, the screen slides, the copy follows
  tapAt(128 - 22, 500, 1.4);
  tl.to('.pages', { xPercent: -100 / 3, duration: 0.6, ease: 'expo.inOut' }, 1.55).to('.t1', { backgroundColor: '#d3d6de', duration: 0.2 }, 1.6).to('.t2', { backgroundColor: '#ff3d81', duration: 0.2 }, 1.6);
  swapCopy(1, 1.55);
  const tm = { v: 1500 };
  tl.to(tm, { v: 1500 - 47, duration: 1.2, ease: 'none', onUpdate() { const s = Math.round(tm.v); document.querySelector('.timer').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); } }, 2.0);
  tapAt(200 - 22, 500, 3.0);
  tl.to('.pages', { xPercent: -200 / 3, duration: 0.6, ease: 'expo.inOut' }, 3.15).to('.t2', { backgroundColor: '#d3d6de', duration: 0.2 }, 3.2).to('.t3', { backgroundColor: '#ff3d81', duration: 0.2 }, 3.2);
  swapCopy(2, 3.15);
  tl.from('.bar', { scaleY: 0, transformOrigin: 'bottom', stagger: 0.06, duration: 0.5, ease: 'back.out(1.5)' }, 3.5);
  // loop back: snap to the first page
  tapAt(56 - 22, 500, 4.5);
  tl.to('.pages', { xPercent: 0, duration: 0.45, ease: 'expo.inOut' }, 4.6).to('.t3', { backgroundColor: '#d3d6de', duration: 0.2 }, 4.65).to('.t1', { backgroundColor: '#ff3d81', duration: 0.2 }, 4.65);
  swapCopy(0, 4.55);
</script>
