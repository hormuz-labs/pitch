<!doctype html><meta charset="utf-8">
<title>Mobile Showreel</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b0b0e;perspective:1600px}
  .bg{position:absolute;inset:-10%;background:url("../../../assets/backgrounds/aurora.png") center/cover;filter:brightness(.45) saturate(1.3)}
  .wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-style:preserve-3d}
  .phone{width:300px;height:620px;border-radius:52px;background:#16171c;padding:12px;box-shadow:0 60px 100px rgba(0,0,0,.6),inset 0 0 0 2px #45464e;will-change:transform}
  .scr{height:100%;border-radius:41px;overflow:hidden;background:#fff;position:relative}
  .isl{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:96px;height:28px;border-radius:16px;background:#111;z-index:5}
  .strip{position:absolute;inset:0;will-change:transform}
  .pg{height:596px;padding:60px 18px 0;position:relative;color:#111;font-size:13px}
  .pg .h{font-size:26px;font-weight:500;letter-spacing:-.02em;margin-bottom:14px}
  .pg .h small{display:block;font-size:12px;color:#8a8f9a;font-weight:400}
  .card{border-radius:18px;padding:14px;margin-bottom:12px;background:#f4f5f8}
  .card.hero{height:190px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
  .card.hero b{font-size:28px;font-weight:500;letter-spacing:-.02em}.card.hero span{font-size:12px;opacity:.85}
  .row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #e6e8ef}.row:last-child{border:0}
  .row i{width:34px;height:34px;border-radius:11px;flex:none}
  .row em{display:block;height:8px;border-radius:4px;background:#cfd3dc;font-style:normal;margin-bottom:6px}.row em+em{margin:0;background:#e2e5ec}
  .row .t{flex:1}
  .btn{height:48px;border-radius:14px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px}
  .big{font-size:52px;font-weight:500;letter-spacing:-.04em;line-height:1;margin:6px 0 14px}
  .bars{display:flex;align-items:flex-end;gap:7px;height:110px}
  .bars i{flex:1;border-radius:6px 6px 2px 2px;background:var(--c)}
  .pg.dark{background:#111216;color:#fff}.pg.dark .card{background:#1e1f26}.pg.dark .row{border-color:#2a2b33}.pg.dark .row em{background:#3a3c48}.pg.dark .row em+em{background:#2c2e38}.pg.dark .btn{background:#fff;color:#111}
  .caps{position:absolute;left:50%;top:50%;margin-left:230px;transform:translateY(-50%);color:#fff}
  .caps .k{font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.5;margin-bottom:12px}
  .caps .l{height:70px;overflow:hidden;position:relative;width:420px}
  .caps .l span{position:absolute;left:0;top:0;font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:58px;letter-spacing:-.03em;line-height:70px;white-space:nowrap}
  .num{position:absolute;left:50%;top:50%;margin-left:-560px;transform:translateY(-50%);color:#fff;font-family:"Sharp Grotesk",sans-serif;font-size:120px;font-weight:500;letter-spacing:-.05em;opacity:.15;line-height:1;height:120px;overflow:hidden;width:200px}
  .num span{position:absolute;left:0;top:0}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="num"><span>01</span><span>02</span><span>03</span><span>04</span><span>01</span></div>
  <div class="wrap"><div class="phone"><div class="scr"><div class="isl"></div><div class="strip" id="strip"></div></div></div></div>
  <div class="caps"><div class="k">Acme · Showreel</div><div class="l"><span>Onboarding</span><span>Dashboard</span><span>Insights</span><span>Checkout</span><span>Onboarding</span></div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const rng = fx.rng(5);
  const rows = (a, b, n) => `<div class="card">${Array.from({ length: n }, (_, r) => `<div class="row"><i style="background:${r % 2 ? b : a}"></i><div class="t"><em style="width:${50 + Math.floor(rng() * 35)}%"></em><em style="width:${25 + Math.floor(rng() * 40)}%"></em></div></div>`).join('')}</div>`;
  const pages = [
    `<div class="pg"><div class="h"><small>Welcome</small>Let's get you set up</div><div class="card hero" style="background:linear-gradient(135deg,#ff5c7a,#ff9a5c)"><span>Step 1 of 3</span><b>Pick a plan</b></div>${rows('#ff5c7a', '#ff9a5c', 2)}<div class="btn">Continue</div></div>`,
    `<div class="pg dark"><div class="h"><small>Balance</small>Dashboard</div><div class="big">$12,480</div><div class="card" style="--c:#5c7cff"><div class="bars">${[40, 65, 50, 90, 70, 100, 80].map(h => `<i style="height:${h}%"></i>`).join('')}</div></div>${rows('#5c7cff', '#7ee0ff', 2)}</div>`,
    `<div class="pg"><div class="h"><small>This month</small>Insights</div><div class="card hero" style="background:linear-gradient(135deg,#22c58b,#a3f2c8)"><span>Up 24%</span><b>Best week yet</b></div>${rows('#22c58b', '#a3f2c8', 3)}</div>`,
    `<div class="pg"><div class="h"><small>2 items</small>Checkout</div>${rows('#a45cff', '#ff7ad9', 2)}<div class="card"><div class="row"><div class="t"><em style="width:40%"></em><em style="width:60%"></em></div><b>$96.00</b></div></div><div class="btn" style="background:#a45cff">Pay now</div></div>`,
  ];
  document.getElementById('strip').innerHTML = pages.concat(pages[0]).join('');
  gsap.set('.caps .l span, .num span', { yPercent: 100 });
  gsap.set('.caps .l span:first-child, .num span:first-child', { yPercent: 0 });
  const tl = fx.timeline({ duration: 4 });
  const cuts = [0.65, 1.65, 2.65, 3.55];
  tl.fromTo('.bg', { scale: 1.05, xPercent: 1 }, { scale: 1.12, xPercent: -1, duration: 4, ease: 'none' }, 0)
    // the phone hangs at a slight angle and breathes; quick 3D nudge on every cut
    .fromTo('.phone', { rotateY: -14, rotateX: 5 }, { rotateY: -8, rotateX: 3, duration: 4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  cuts.forEach((c, i) => {
    tl.to('#strip', { y: -(i + 1) * 596, duration: 0.45, ease: 'expo.inOut' }, c)
      .fromTo('.phone', { scale: 1 }, { scale: 0.965, duration: 0.22, yoyo: true, repeat: 1, ease: 'power2.inOut' }, c)
      .to(`.caps .l span:nth-child(${i + 1})`, { yPercent: -100, duration: 0.45, ease: 'expo.inOut' }, c)
      .to(`.caps .l span:nth-child(${i + 2})`, { yPercent: 0, duration: 0.45, ease: 'expo.inOut' }, c)
      .to(`.num span:nth-child(${i + 1})`, { yPercent: -100, duration: 0.45, ease: 'expo.inOut' }, c)
      .to(`.num span:nth-child(${i + 2})`, { yPercent: 0, duration: 0.45, ease: 'expo.inOut' }, c);
  });
  // each page's content settles in just after its cut
  tl.from('.pg:nth-child(1) > *', { y: 24, opacity: 0, stagger: 0.06, duration: 0.5, ease: 'power3.out' }, 0);
  cuts.slice(0, 3).forEach((c, i) => tl.from(`.pg:nth-child(${i + 2}) > *`, { y: 24, opacity: 0, stagger: 0.06, duration: 0.5, ease: 'power3.out' }, c + 0.25));
</script>
