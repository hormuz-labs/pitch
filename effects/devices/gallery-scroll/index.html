<!doctype html><meta charset="utf-8">
<title>Gallery: Scroll</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0e0e10;font-family:"Atlas Grotesk",sans-serif}
  .cols{position:absolute;inset:0;display:flex;gap:22px;padding:0 60px;transform:rotate(-6deg) scale(1.15);transform-origin:center}
  .col{flex:1;display:flex;flex-direction:column;gap:22px;will-change:transform}
  .tile{position:relative;border-radius:14px;overflow:hidden;flex:none;background:#1b1b20}
  .tile .img{position:absolute;inset:0;background-size:cover;background-position:center}
  .tile .cap{position:absolute;left:14px;bottom:12px;color:#fff;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
  .tile .cap b{display:block;font-family:"Sorts Mill Goudy",serif;font-size:22px;letter-spacing:0;text-transform:none;font-weight:400;margin-bottom:2px}
  .vig{position:absolute;inset:0;background:radial-gradient(70% 70% at 50% 50%,transparent 40%,rgba(0,0,0,.75));pointer-events:none}
  .title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff}
  .title b{display:block;font-family:"Sharp Grotesk",sans-serif;font-size:72px;font-weight:500;letter-spacing:-.03em;line-height:1}
  .title small{display:block;font-size:13px;letter-spacing:.3em;text-transform:uppercase;opacity:.7;margin-top:14px}
</style>
<div class="stage">
  <div class="cols"></div>
  <div class="vig"></div>
  <div class="title"><b>Portfolio</b><small>Scroll · Vol. 3</small></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const imgs = ['aurora', 'ocean', 'sunset'];
  const rnd = fx.rng(7);
  const caps = ['Northern', 'Shoreline', 'Golden hour', 'Drift', 'Ridge', 'Still water', 'Ember', 'Fjord', 'Basalt', 'Haze'];
  const colsEl = document.querySelector('.cols');
  const NCOL = 4, PER = 5;
  const cols = [];
  for (let c = 0; c < NCOL; c++) {
    const col = document.createElement('div'); col.className = 'col';
    const heights = [];
    for (let k = 0; k < PER; k++) heights.push(180 + Math.floor(rnd() * 160));
    // two identical copies so a one-copy scroll is a seamless loop
    for (let copy = 0; copy < 2; copy++) for (let k = 0; k < PER; k++) {
      const t = document.createElement('div'); t.className = 'tile'; t.style.height = heights[k] + 'px';
      const img = imgs[(c + k) % 3];
      const pos = Math.floor(rnd() * 100);
      t.innerHTML = `<div class="img" style="background-image:url('../../../assets/backgrounds/${img}.png');background-position:${pos}% ${100 - pos}%;filter:saturate(${0.8 + rnd() * .5}) hue-rotate(${Math.floor(rnd() * 60 - 30)}deg)"></div><div class="cap"><b>${caps[(c * PER + k) % caps.length]}</b>No. ${c * PER + k + 1}</div>`;
      col.appendChild(t);
    }
    colsEl.appendChild(col);
    cols.push({ el: col, span: heights.reduce((a, b) => a + b, 0) + 22 * PER });
  }
  const D = 10;
  const tl = fx.timeline({ duration: D });
  // continuous scroll: alternating directions per column, each covering exactly one copy in D seconds
  cols.forEach((c, i) => {
    const up = i % 2 === 0;
    tl.fromTo(c.el, { y: up ? 0 : -c.span }, { y: up ? -c.span : 0, duration: D, ease: 'none' }, 0);
  });
  // the title sits on top and breathes
  tl.fromTo('.title', { scale: 0.96 }, { scale: 1.04, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
</script>
