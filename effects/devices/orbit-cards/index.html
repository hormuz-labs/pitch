<!doctype html><meta charset="utf-8">
<title>Orbit: Cards</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0c0d12}
  .glow{position:absolute;left:50%;top:50%;width:900px;height:600px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(120,90,255,.3),transparent 70%);filter:blur(20px)}
  .ring{position:absolute;left:50%;top:50%;width:960px;height:360px;transform:translate(-50%,-50%);overflow:visible}
  .core{position:absolute;left:50%;top:50%;width:150px;height:150px;transform:translate(-50%,-50%);border-radius:50%;background:linear-gradient(135deg,#8b7bff,#ff6fb5);box-shadow:0 0 0 14px rgba(255,255,255,.06),0 30px 60px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;will-change:transform}
  .core::after{content:"";width:56px;height:56px;border-radius:14px;background:#fff;transform:rotate(45deg)}
  .core span{position:absolute;top:100%;margin-top:26px;color:#fff;font-size:14px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;white-space:nowrap}
  .card{position:absolute;left:50%;top:50%;width:230px;height:118px;margin:-59px 0 0 -115px;border-radius:20px;background:#fff;color:#111;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 30px 60px rgba(0,0,0,.45);will-change:transform,opacity,filter}
  .card i{width:46px;height:46px;border-radius:14px;flex:none}
  .card b{display:block;font-size:17px;font-weight:500;letter-spacing:-.02em;margin-bottom:6px}
  .card em{display:block;height:7px;border-radius:4px;background:#dcdfe6;font-style:normal;width:80%}
  .card em+em{width:55%;margin-top:5px;background:#eceef3}
  .dot{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#fff;opacity:.5}
</style>
<div class="stage">
  <div class="glow"></div>
  <svg class="ring" viewBox="0 0 960 360"><ellipse cx="480" cy="180" rx="440" ry="150" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.5" stroke-dasharray="6 10" id="orb"/><ellipse cx="480" cy="180" rx="230" ry="78" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="1" id="orb2"/></svg>
  <div class="core"><span>Acme platform</span></div>
  <div id="cards"></div>
  <div id="dots"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const feats = [['Payments', '#ff6fb5'], ['Analytics', '#5c7cff'], ['Inbox', '#22c58b'], ['Automations', '#ffb020'], ['Teams', '#8b7bff'], ['Storage', '#7ee0ff']];
  const wrap = document.getElementById('cards'), dw = document.getElementById('dots');
  const cards = feats.map(([n, c]) => { const el = document.createElement('div'); el.className = 'card'; el.innerHTML = `<i style="background:${c}"></i><div><b>${n}</b><em></em><em></em></div>`; wrap.appendChild(el); return el; });
  const dots = Array.from({ length: 8 }, () => { const d = document.createElement('div'); d.className = 'dot'; dw.appendChild(d); return d; });
  const core = document.querySelector('.core'), orb = document.getElementById('orb'), orb2 = document.getElementById('orb2');
  const D = 5, RX = 440, RY = 150, N = cards.length;
  fx.register({ duration: D, seek(t) {
    const ph = (t / D) * Math.PI * 2;
    cards.forEach((el, i) => {
      const a = ph + (i / N) * Math.PI * 2;
      const x = Math.cos(a) * RX, y = Math.sin(a) * RY;
      const depth = (Math.sin(a) + 1) / 2;               // 0 far (top), 1 near (bottom)
      gsap.set(el, { x, y, scale: 0.8 + depth * 0.5, opacity: 0.45 + depth * 0.55, zIndex: 100 + Math.round(depth * 50), filter: `blur(${(1 - depth) * 2.2}px)` });
    });
    dots.forEach((d, i) => {
      const a = -ph * 2 + (i / dots.length) * Math.PI * 2;
      const depth = (Math.sin(a) + 1) / 2;
      gsap.set(d, { x: Math.cos(a) * 230, y: Math.sin(a) * 78, scale: 0.5 + depth * 0.8, opacity: 0.2 + depth * 0.5 });
    });
    gsap.set(core, { scale: 1 + Math.sin(ph * 2) * 0.04, rotate: t * 18 });
    orb.setAttribute('stroke-dashoffset', -t * 40);
    orb2.setAttribute('stroke-dashoffset', t * 30);
  } });
</script>
