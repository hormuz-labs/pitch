<!doctype html><meta charset="utf-8">
<title>Web Gallery: Grid</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#111216;color:#fff}
  .cam{position:absolute;left:50%;top:50%;will-change:transform}
  .grid{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(3,370px);gap:26px}
  .site{width:370px;height:230px;border-radius:12px;background:#fff;overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.5);will-change:transform,opacity;color:#141428}
  .chrome{height:24px;background:#f3f4f8;border-bottom:1px solid #e5e7ee;display:flex;align-items:center;padding:0 10px;gap:5px}
  .chrome i{width:7px;height:7px;border-radius:50%;background:#dcdfe6}
  .chrome .u{margin-left:8px;flex:1;height:14px;border-radius:4px;background:#fff;border:1px solid #e5e7ee}
  .body{padding:14px 18px;font-size:9px;height:206px;position:relative;overflow:hidden}
  .body .nav{display:flex;gap:10px;align-items:center;margin-bottom:12px}
  .body .nav b{font-size:11px;font-weight:500;margin-right:auto}
  .body .nav em{width:22px;height:5px;border-radius:3px;background:#dcdfe6;font-style:normal}
  .body .nav .cta{padding:4px 8px;border-radius:5px;background:var(--c);color:#fff;font-weight:500}
  .h2{font-family:"Sharp Grotesk",sans-serif;font-size:22px;font-weight:500;letter-spacing:-.03em;line-height:1;width:60%}
  .p{height:5px;border-radius:3px;background:#dcdfe6;margin-top:8px;width:55%}
  .p+.p{width:40%;margin-top:5px}
  .art{position:absolute;right:18px;top:48px;width:130px;height:110px;border-radius:10px}
  .tiles{display:flex;gap:8px;margin-top:16px}.tiles i{flex:1;height:44px;border-radius:7px;background:#f3f4f8}
  .dark{background:#151622;color:#fff}.dark .chrome{background:#1e1f2b;border-color:#2a2b38}.dark .chrome .u{background:#151622;border-color:#2a2b38}.dark .p,.dark .nav em{background:#2f3040}.dark .tiles i{background:#1e1f2b}
  .cap{position:absolute;left:60px;top:54px;z-index:3}
  .cap h1{font-family:"Sharp Grotesk",sans-serif;font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:1}
  .cap p{margin-top:8px;font-size:13px;opacity:.6}
  .shade{position:absolute;left:0;top:0;width:560px;height:240px;background:radial-gradient(ellipse at 0 0,rgba(17,18,22,.95),transparent 70%);z-index:2}
</style>
<div class="stage">
  <div class="cam"><div class="grid" id="grid"></div></div>
  <div class="shade"></div>
  <div class="cap"><h1>Selected work</h1><p>Acme Studio · 2026</p></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const rng = fx.rng(4);
  const C = [['#5c7cff', '#7ee0ff'], ['#ff5c7a', '#ff9a5c'], ['#22c58b', '#a3f2c8'], ['#a45cff', '#ff7ad9'], ['#ffb020', '#ffe08a'], ['#141428', '#5c7cff'], ['#ff6fb5', '#8b7bff'], ['#7ee0ff', '#22c58b'], ['#ff9a5c', '#a45cff']];
  const names = ['Northwind', 'Acme', 'Bloom', 'Orbit', 'Lumen', 'Harbor', 'Pixel', 'Nova', 'Atlas'];
  const grid = document.getElementById('grid');
  for (let i = 0; i < 9; i++) {
    const [a, b] = C[i]; const s = document.createElement('div'); s.className = 'site' + (rng() < 0.35 ? ' dark' : ''); s.style.setProperty('--c', a);
    s.innerHTML = `<div class="chrome"><i></i><i></i><i></i><div class="u"></div></div><div class="body"><div class="nav"><b>${names[i]}</b><em></em><em></em><em></em><span class="cta">Start</span></div><div class="h2">${['Build faster.', 'Design that sells.', 'Grow with data.', 'Ship every day.', 'Made to move.', 'Simple by default.', 'Your new home.', 'Clarity, delivered.', 'Bold ideas.'][i]}</div><div class="p"></div><div class="p"></div><div class="art" style="background:linear-gradient(135deg,${a},${b})"></div><div class="tiles"><i></i><i></i><i></i></div></div>`;
    grid.appendChild(s);
  }
  const tl = fx.timeline({ duration: 4 });
  // tiles pop in row by row; the camera then pushes in on the centre tile before pulling back out to loop
  tl.fromTo('.cam', { scale: 0.9, x: 0, y: 40 }, { scale: 1.0, x: 0, y: 0, duration: 1.2, ease: 'power3.out' }, 0)
    .from('.site', { scale: 0.7, opacity: 0, y: 60, duration: 0.8, ease: 'expo.out', stagger: { each: 0.07, grid: [3, 3], from: 'start' } }, 0.05)
    .from('.cap > *', { y: 16, opacity: 0, stagger: 0.1, duration: 0.5 }, 0.3)
    // the contents keep moving: the hero art drifts and tiles shimmer
    .to('.art', { y: -8, rotate: -3, duration: 1.8, ease: 'sine.inOut', yoyo: true, repeat: 1, stagger: 0.05 }, 0.3)
    .to('.cam', { scale: 1.7, x: 0, y: 40, duration: 1.3, ease: 'expo.inOut' }, 1.6)
    .to('.site:not(:nth-child(5))', { opacity: 0.35, duration: 0.6 }, 1.8)
    .to('.site:nth-child(5) .body', { y: -40, duration: 1.2, ease: 'power2.inOut' }, 2.2)
    .to('.cam', { scale: 0.9, x: 0, y: 40, duration: 0.6, ease: 'expo.in' }, 3.4)
    .to('.site', { opacity: 0, duration: 0.4, ease: 'power2.in' }, 3.55)
    .to('.cap', { opacity: 0, duration: 0.3 }, 3.6);
</script>
