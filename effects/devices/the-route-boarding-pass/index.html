<!doctype html><meta charset="utf-8">
<title>The Route: Boarding Pass</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b1220;perspective:1800px;color:#0b1220}
  .bg{position:absolute;inset:-10%;background:url("../../../assets/backgrounds/ocean.png") center/cover;filter:brightness(.45) saturate(1.2)}
  .wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-style:preserve-3d}
  .pass{width:760px;height:400px;display:flex;border-radius:26px;background:#fff;box-shadow:0 60px 100px rgba(0,0,0,.5);overflow:hidden;position:relative;will-change:transform,opacity}
  .main{flex:1;padding:30px 34px;position:relative}
  .stub{width:230px;border-left:2px dashed #d7dbe3;padding:30px 26px;position:relative;background:#f7f8fb}
  .stub::before,.stub::after{content:"";position:absolute;left:-14px;width:26px;height:26px;border-radius:50%;background:#0b1220}
  .stub::before{top:-13px}.stub::after{bottom:-13px}
  .hd{display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#6b7280}
  .hd i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#2f6bff,#7ee0ff)}
  .hd b{color:#0b1220;font-weight:500}
  .hd span{margin-left:auto;padding:6px 12px;border-radius:99px;background:#e9fbf2;color:#0f9d58;font-weight:500;letter-spacing:0;text-transform:none;font-size:12px}
  .route{display:grid;grid-template-columns:130px 1fr 130px;align-items:center;margin-top:26px}
  .apt{font-family:"Sharp Grotesk",sans-serif;font-size:64px;font-weight:500;letter-spacing:-.04em;line-height:1}
  .apt small{display:block;font-family:"Atlas Grotesk",sans-serif;font-size:13px;color:#6b7280;letter-spacing:0;margin-top:6px}
  .apt.r{text-align:right}
  .arc{height:110px;position:relative}
  .arc svg{width:100%;height:100%;overflow:visible}
  .plane{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px;will-change:transform}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}
  .grid div{font-size:26px;font-weight:500;letter-spacing:-.02em}
  .grid div small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#6b7280;font-weight:400;margin-bottom:6px}
  .stub .apt{font-size:34px}
  .stub .k{margin-top:16px;font-size:20px;font-weight:500}.stub .k small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6b7280;font-weight:400;margin-bottom:4px}
  .bar{position:absolute;left:26px;right:26px;bottom:28px;height:64px;display:flex;align-items:flex-end;gap:2px}
  .bar i{width:3px;background:#0b1220;transform-origin:bottom}
  .cap{position:absolute;left:0;right:0;bottom:44px;text-align:center;color:#fff;font-size:14px;letter-spacing:.22em;text-transform:uppercase;opacity:.6}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="wrap"><div class="pass">
    <div class="main">
      <div class="hd"><i></i><b>Northwind Air</b>NW 214<span class="st">Boarding</span></div>
      <div class="route">
        <div class="apt">SFO<small>San Francisco · 07:45</small></div>
        <div class="arc"><svg viewBox="0 0 400 110"><path id="p" d="M8,95 C120,-10 280,-10 392,95" fill="none" stroke="#d7dbe3" stroke-width="2" stroke-dasharray="5 7"/><path id="p2" d="M8,95 C120,-10 280,-10 392,95" fill="none" stroke="#2f6bff" stroke-width="3" stroke-linecap="round"/><circle cx="8" cy="95" r="6" fill="#0b1220"/><circle cx="392" cy="95" r="6" fill="#0b1220"/></svg>
          <svg class="plane" viewBox="0 0 24 24"><path d="M2 12l20-8-6 8 6 8z" fill="#0b1220"/></svg></div>
        <div class="apt r">JFK<small>New York · 16:20</small></div>
      </div>
      <div class="grid"><div><small>Gate</small><span class="g">B12</span></div><div><small>Boarding</small><span class="bt">07:05</span></div><div><small>Seat</small><span class="se">14A</span></div><div><small>Group</small><span class="gr">2</span></div></div>
    </div>
    <div class="stub">
      <div class="hd"><b>Passenger</b></div>
      <div class="apt" style="margin-top:12px;font-size:26px">Ada Acme</div>
      <div class="k"><small>Flight</small>NW 214</div>
      <div class="k"><small>Seat</small>14A · Window</div>
      <div class="bar" id="bar"></div>
    </div>
  </div></div>
  <div class="cap">The Route · Boarding pass</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../../assets/gsap/MotionPathPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin);
  const rng = fx.rng(14), bar = document.getElementById('bar');
  for (let i = 0; i < 44; i++) { const b = document.createElement('i'); b.style.height = (35 + rng() * 65) + '%'; b.style.opacity = rng() < 0.2 ? .35 : 1; bar.appendChild(b); }
  const tl = fx.timeline({ duration: 9 });
  tl.fromTo('.bg', { scale: 1.05, xPercent: -1 }, { scale: 1.12, xPercent: 1, duration: 9, ease: 'none' }, 0)
    // the pass flips in from the side and settles at a slight angle
    .fromTo('.pass', { rotateY: -75, x: -120, opacity: 0 }, { rotateY: -6, x: 0, opacity: 1, duration: 1.1, ease: 'expo.out' }, 0.1)
    .to('.pass', { rotateY: 4, rotateX: 3, duration: 3.6, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.2)
    .from('.main > *, .stub > *', { y: 20, opacity: 0, stagger: 0.07, duration: 0.6, ease: 'power3.out' }, 0.5)
    // barcode prints in
    .from('#bar i', { scaleY: 0, stagger: 0.012, duration: 0.3, ease: 'power2.out' }, 1.0)
    // the route draws and the plane follows it, nose along the curve
    .fromTo('#p2', { drawSVG: '0%' }, { drawSVG: '100%', duration: 3.2, ease: 'power2.inOut' }, 1.5)
    .to('.plane', { motionPath: { path: '#p', align: '#p', alignOrigin: [0.5, 0.5], autoRotate: true }, duration: 3.2, ease: 'power2.inOut' }, 1.5)
    // the pass reacts: gate and boarding time update with a flip
    .to('.g', { yPercent: -100, opacity: 0, duration: 0.2, ease: 'power2.in', onComplete() { this.targets()[0].textContent = 'B14'; }, onReverseComplete() { this.targets()[0].textContent = 'B12'; } }, 3.0)
    .fromTo('.g', { yPercent: 100, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.35, ease: 'back.out(1.6)', immediateRender: false }, 3.2)
    .fromTo('.st', { scale: 1 }, { scale: 1.08, duration: 0.5, ease: 'sine.inOut', yoyo: true, repeat: 7 }, 1.0)
    .to('.st', { backgroundColor: '#fff3d6', color: '#b76e00', duration: 0.3, onComplete() { this.targets()[0].textContent = 'Final call'; }, onReverseComplete() { this.targets()[0].textContent = 'Boarding'; } }, 5.2)
    // stub tears off, then the whole pass flips away
    .to('.stub', { x: 60, rotate: 3, opacity: 0, duration: 0.5, ease: 'power3.in' }, 7.6)
    .to('.pass', { rotateY: 70, x: 160, opacity: 0, duration: 0.6, ease: 'expo.in' }, 8.2);
</script>
