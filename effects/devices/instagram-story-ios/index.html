<!doctype html><meta charset="utf-8">
<title>Instagram Story [iOS]</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#000;font-family:-apple-system,"Atlas Grotesk",sans-serif;color:#fff}
  .media{position:absolute;inset:0;background:url("../../../assets/backgrounds/sunset.png") center/cover;will-change:transform}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 25%,transparent 75%,rgba(0,0,0,.5))}
  .status{position:absolute;top:0;left:0;right:0;height:140px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 64px 0 76px;font-size:34px;font-weight:600}
  .status .r{display:flex;gap:12px;align-items:center}
  .status .r i{display:block;width:34px;height:22px;border-radius:5px;border:3px solid #fff}
  .bars{position:absolute;top:150px;left:24px;right:24px;display:flex;gap:8px}
  .bars i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden;position:relative}
  .bars i b{position:absolute;left:0;top:0;bottom:0;width:100%;background:#fff;transform-origin:left;transform:scaleX(0)}
  .bars i.done b{transform:scaleX(1)}
  .head{position:absolute;top:182px;left:32px;right:32px;display:flex;align-items:center;gap:20px;font-size:30px}
  .head .av{width:84px;height:84px;border-radius:50%;padding:4px;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
  .head .av i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;border:4px solid #000;background:radial-gradient(circle at 40% 35%,#ffd9c0,#c47a55)}
  .head b{font-weight:600}.head span{opacity:.7;margin-left:14px;font-weight:400}
  .head .x{margin-left:auto;font-size:44px;font-weight:300;line-height:1}
  .foot{position:absolute;bottom:60px;left:32px;right:32px;display:flex;align-items:center;gap:28px}
  .foot .in{flex:1;height:96px;border-radius:48px;border:3px solid rgba(255,255,255,.7);display:flex;align-items:center;padding:0 36px;font-size:30px;color:rgba(255,255,255,.85)}
  .foot .ic{width:60px;height:60px;border-radius:50%;border:4px solid #fff}
  .foot .ic.p{border:0;position:relative}
  .foot .ic.p::before{content:"";position:absolute;left:8px;top:14px;border:22px solid transparent;border-left:44px solid #fff;border-right:0}
  .stick{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);padding:28px 44px;border-radius:24px;background:#fff;color:#111;font-size:56px;font-weight:700;letter-spacing:-.02em;text-align:center;will-change:transform}
  .stick small{display:block;font-size:26px;font-weight:500;color:#e1306c;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
  .poll{position:absolute;left:50%;top:62%;transform:translateX(-50%);width:720px;border-radius:28px;background:#fff;color:#111;padding:36px;text-align:center;will-change:transform}
  .poll h3{font-size:40px;font-weight:600;margin-bottom:22px}
  .poll .opts{display:flex;border:3px solid #eee;border-radius:20px;overflow:hidden;height:100px;position:relative}
  .poll .opt{flex:1;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:600;position:relative;z-index:2}
  .poll .opt.a{color:#3d5aff}.poll .opt.b{color:#e1306c}
  .poll .fill{position:absolute;left:0;top:0;bottom:0;width:60%;background:#f1f4ff;transform-origin:left;transform:scaleX(0);z-index:1}
  .poll .fill.r{left:auto;right:0;width:40%;background:#fff0f5;transform-origin:right}
  .poll .pct{position:absolute;bottom:-46px;left:0;right:0;display:flex;justify-content:space-between;padding:0 30px;font-size:26px;color:#777;opacity:0}
  .mention{position:absolute;left:50%;top:78%;transform:translateX(-50%);padding:16px 30px;border-radius:14px;background:rgba(0,0,0,.55);font-size:32px;font-weight:600;backdrop-filter:blur(6px)}
  .mention span{color:#ffd166}
  .home{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:280px;height:10px;border-radius:5px;background:#fff;opacity:.9}
</style>
<div class="stage">
  <div class="media"></div><div class="shade"></div>
  <div class="status"><span>9:41</span><div class="r"><span>●●●</span><span>5G</span><i></i></div></div>
  <div class="bars"><i class="done"><b></b></i><i class="cur"><b></b></i><i><b></b></i><i><b></b></i></div>
  <div class="head"><div class="av"><i></i></div><b>acme.studio</b><span>2h</span><div class="x">×</div></div>
  <div class="stick"><small>New drop</small>Summer<br>Collection</div>
  <div class="poll"><h3>Which colorway?</h3><div class="opts"><div class="fill l"></div><div class="fill r"></div><div class="opt a">Sunset</div><div class="opt b">Dusk</div></div><div class="pct"><span>62%</span><span>38%</span></div></div>
  <div class="mention">📍 <span>@northwind</span> · Lisbon</div>
  <div class="foot"><div class="in">Send message</div><div class="ic"></div><div class="ic p"></div></div>
  <div class="home"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 5 });
  tl.fromTo('.media', { scale: 1.0 }, { scale: 1.12, duration: 5, ease: 'none' }, 0)
    // the story progress bar fills across the loop
    .fromTo('.bars .cur b', { scaleX: 0 }, { scaleX: 1, duration: 5, ease: 'none' }, 0)
    // chrome slides in
    .from('.head', { y: -30, opacity: 0, duration: 0.6, ease: 'power3.out' }, 0.1)
    .from('.foot', { y: 40, opacity: 0, duration: 0.6, ease: 'power3.out' }, 0.2)
    // sticker pops with a wobble
    .from('.stick', { scale: 0, rotate: -12, duration: 0.8, ease: 'elastic.out(1,0.5)' }, 0.5)
    .fromTo('.stick', { rotate: -4 }, { rotate: 3, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.3)
    // poll rises, then the vote lands and the bars fill
    .from('.poll', { y: 80, opacity: 0, scale: 0.9, duration: 0.7, ease: 'back.out(1.6)' }, 1.0)
    .fromTo('.opt.a', { scale: 1 }, { scale: 0.92, duration: 0.12, yoyo: true, repeat: 1 }, 2.1)
    .to('.fill.l', { scaleX: 1, duration: 0.7, ease: 'expo.out' }, 2.3)
    .to('.fill.r', { scaleX: 1, duration: 0.7, ease: 'expo.out' }, 2.35)
    .to('.pct', { opacity: 1, y: -4, duration: 0.4 }, 2.5)
    .from('.mention', { x: -40, opacity: 0, duration: 0.5, ease: 'power3.out' }, 1.6)
    // exit: everything slides up like a swipe to the next story
    .to('.stick, .poll, .mention', { y: -80, opacity: 0, stagger: 0.06, duration: 0.4, ease: 'power2.in' }, 4.4)
    .to('.head, .foot', { opacity: 0, duration: 0.3 }, 4.6);
</script>
