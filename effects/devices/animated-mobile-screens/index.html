<!doctype html><meta charset="utf-8">
<title>Animated Mobile Screens</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b0c10;perspective:2200px;font-family:"Atlas Grotesk",sans-serif}
  .bg{position:absolute;inset:-10%;background:url("../../../assets/backgrounds/ocean.png") center/cover;filter:brightness(.45) saturate(1.3)}
  .grp{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
  .phone{position:absolute;left:-125px;top:-270px;width:250px;height:540px;border-radius:42px;background:#17181d;padding:10px;box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 0 0 2px #45464d;transform-style:preserve-3d;will-change:transform}
  .scr{height:100%;border-radius:33px;overflow:hidden;position:relative;background:#fff;color:#111}
  .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:84px;height:24px;border-radius:14px;background:#17181d;z-index:5}
  .body{padding:50px 16px 16px;will-change:transform}
  .hd{font-size:22px;font-weight:500;letter-spacing:-.02em;margin-bottom:12px}
  .hd small{display:block;font-size:11px;opacity:.55;font-weight:400}
  .card{border-radius:16px;padding:12px;margin-bottom:10px;background:rgba(0,0,0,.05)}
  .card.tall{height:150px;display:flex;align-items:flex-end;font-size:20px;font-weight:500;letter-spacing:-.02em;color:#fff}
  .rowi{display:flex;gap:10px;align-items:center;padding:8px 0}
  .rowi i{width:30px;height:30px;border-radius:9px;background:rgba(0,0,0,.12);flex:none}
  .rowi .t{flex:1}
  .rowi em{display:block;height:8px;border-radius:4px;background:rgba(0,0,0,.18);width:70%;font-style:normal;margin-bottom:6px}
  .rowi em+em{width:45%;opacity:.6;margin:0}
  .btn{height:44px;border-radius:14px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
  .dark .scr{background:#141519;color:#fff}.dark .card{background:rgba(255,255,255,.08)}.dark .rowi i{background:rgba(255,255,255,.15)}.dark .rowi em{background:rgba(255,255,255,.3)}.dark .btn{background:#fff;color:#111}
  .title{position:absolute;left:0;right:0;bottom:44px;text-align:center;color:#fff;font-family:"Sharp Grotesk",sans-serif;font-size:40px;font-weight:500;letter-spacing:-.02em}
  .title small{display:block;font-family:"Atlas Grotesk",sans-serif;font-size:14px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;margin-bottom:8px}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="grp"></div>
  <div class="title"><small>Northwind 2.0</small>The full picture</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const grads = ['linear-gradient(135deg,#5b6cff,#c46bff)', 'linear-gradient(135deg,#ff8a5c,#ff3d81)', 'linear-gradient(135deg,#1fa86c,#0b6b47)', 'linear-gradient(135deg,#ffd166,#ff7a59)', 'linear-gradient(135deg,#3d5aff,#00d4ff)'];
  const names = [['Home', 'Today'], ['Shop', 'Featured'], ['Health', 'Activity'], ['Wallet', 'Balance'], ['Social', 'Friends']];
  const grp = document.querySelector('.grp');
  for (let i = 0; i < 5; i++) {
    const p = document.createElement('div');
    p.className = 'phone p' + i + (i % 2 ? ' dark' : '');
    p.innerHTML = `<div class="scr"><div class="notch"></div><div class="body"><div class="hd"><small>${names[i][0]}</small>${names[i][1]}</div><div class="card tall" style="background:${grads[i]}">${['Morning brief', 'New drop', 'Steps · 8,420', '$2,140.00', '12 online'][i]}</div><div class="card"><div class="rowi"><i></i><div class="t"><em></em><em></em></div></div><div class="rowi"><i></i><div class="t"><em></em><em></em></div></div><div class="rowi"><i></i><div class="t"><em></em><em></em></div></div></div><div class="btn">Open</div></div></div>`;
    grp.appendChild(p);
  }
  // final fan: x spread, slight z and rotateY so the group reads as a 3D arc
  const layout = [
    { x: -520, y: 40, z: -220, ry: 28 },
    { x: -270, y: 10, z: -90, ry: 14 },
    { x: 0, y: -10, z: 0, ry: 0 },
    { x: 270, y: 10, z: -90, ry: -14 },
    { x: 520, y: 40, z: -220, ry: -28 },
  ];
  const tl = fx.timeline({ duration: 10 });
  tl.fromTo('.bg', { scale: 1.06, xPercent: 1 }, { scale: 1.12, xPercent: -1, duration: 10, ease: 'none' }, 0);
  // all five fly in together from below and the sides, staggered from the center out
  const order = [2, 1, 3, 0, 4];
  order.forEach((i, k) => {
    const L = layout[i];
    tl.fromTo('.p' + i, { x: L.x * 1.6, y: 700, z: L.z - 400, rotateY: L.ry * 2, rotateX: -20, opacity: 0 },
      { x: L.x, y: L.y, z: L.z, rotateY: L.ry, rotateX: 0, opacity: 1, duration: 1.3, ease: 'move' }, 0.1 + k * 0.12);
  });
  tl.from('.title small, .title', { y: 20, opacity: 0, duration: 0.7, stagger: 0.1, ease: 'power3.out' }, 1.2);
  // the group slowly turns as one, screens scroll in a wave
  tl.to('.grp', { rotateY: -12, duration: 3.6, ease: 'sine.inOut' }, 1.6)
    .to('.grp', { rotateY: 10, duration: 3.6, ease: 'sine.inOut' }, 5.2);
  for (let i = 0; i < 5; i++) {
    tl.to(`.p${i} .body`, { y: -120, duration: 1.4, ease: 'power3.inOut' }, 2.2 + i * 0.18)
      .to(`.p${i} .body`, { y: 0, duration: 1.4, ease: 'power3.inOut' }, 5.6 + i * 0.18);
  }
  // exit: the fan lifts off in the reverse stagger
  order.slice().reverse().forEach((i, k) => {
    tl.to('.p' + i, { y: -750, rotateX: 25, opacity: 0, duration: 0.6, ease: 'expo.in' }, 9.0 + k * 0.08);
  });
  tl.to('.title', { opacity: 0, y: 20, duration: 0.4 }, 9.3);
</script>
