<!doctype html><meta charset="utf-8">
<title>Mobile Screens Reveal</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#050507;font-family:"Atlas Grotesk",sans-serif;perspective:1400px}
  .glow{position:absolute;left:50%;top:50%;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(120,90,255,.45),transparent 60%);transform:translate(-50%,-50%);will-change:transform,opacity}
  .grp{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
  .phone{position:absolute;left:-125px;top:-270px;width:250px;height:540px;border-radius:42px;background:#17181d;padding:10px;box-shadow:0 40px 100px rgba(0,0,0,.8),inset 0 0 0 2px #45464d;will-change:transform,opacity}
  .scr{height:100%;border-radius:33px;overflow:hidden;position:relative;background:#fff;color:#111}
  .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:84px;height:24px;border-radius:14px;background:#17181d;z-index:5}
  .body{padding:50px 16px 16px}
  .hd{font-size:22px;font-weight:500;letter-spacing:-.02em;margin-bottom:12px}.hd small{display:block;font-size:11px;opacity:.55;font-weight:400}
  .hero{height:150px;border-radius:16px;color:#fff;display:flex;align-items:flex-end;padding:12px;font-size:20px;font-weight:500;letter-spacing:-.02em;margin-bottom:10px}
  .rowi{display:flex;gap:10px;align-items:center;padding:8px 0}
  .rowi i{width:30px;height:30px;border-radius:9px;background:rgba(0,0,0,.12);flex:none}
  .rowi em{display:block;height:8px;border-radius:4px;background:rgba(0,0,0,.18);width:70%;font-style:normal;margin-bottom:6px}
  .rowi em+em{width:45%;opacity:.6;margin:0}.rowi .t{flex:1}
  .dark .scr{background:#141519;color:#fff}.dark .rowi i{background:rgba(255,255,255,.15)}.dark .rowi em{background:rgba(255,255,255,.3)}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .title{position:absolute;left:0;right:0;bottom:56px;text-align:center;color:#fff}
  .title b{display:block;font-family:"Sharp Grotesk",sans-serif;font-size:48px;font-weight:500;letter-spacing:-.03em;line-height:1;overflow:hidden}
  .title b span{display:block}
  .title small{display:block;font-size:12px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;margin-top:10px}
  .streak{position:absolute;top:50%;left:-200px;width:200px;height:2px;background:linear-gradient(90deg,transparent,#fff);opacity:0}
</style>
<div class="stage">
  <div class="glow"></div>
  <div class="grp"></div>
  <div class="flash"></div>
  <div class="title"><b><span>Coming soon.</span></b><small>Acme for iOS</small></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const grads = ['linear-gradient(135deg,#ff8a5c,#ff3d81)', 'linear-gradient(135deg,#5b6cff,#c46bff)', 'linear-gradient(135deg,#1fa86c,#c7f464)'];
  const names = [['Shop', 'Featured'], ['Home', 'Today'], ['Health', 'Activity']];
  const grp = document.querySelector('.grp');
  const rows = '<div class="rowi"><i></i><div class="t"><em></em><em></em></div></div>'.repeat(3);
  for (let i = 0; i < 3; i++) {
    const p = document.createElement('div');
    p.className = 'phone p' + i + (i === 1 ? ' dark' : '');
    p.innerHTML = `<div class="scr"><div class="notch"></div><div class="body"><div class="hd"><small>${names[i][0]}</small>${names[i][1]}</div><div class="hero" style="background:${grads[i]}">${names[i][1]}</div>${rows}</div></div>`;
    grp.appendChild(p);
  }
  const tl = fx.timeline({ duration: 3 });
  // cinematic: darkness, a glow swells, then the three phones slam in from off-frame —
  // left, below, right — with a whip of motion blur, a flash on impact, and settle into a fan
  gsap.set('.glow', { scale: 0.3, opacity: 0 });
  tl.to('.glow', { scale: 1, opacity: 1, duration: 1.0, ease: 'power2.out' }, 0)
    .fromTo('.p1', { y: 900, rotateX: -40, scale: 1.1, filter: 'blur(14px)' }, { y: -10, rotateX: 0, scale: 1, filter: 'blur(0px)', duration: 0.7, ease: 'move' }, 0.35)
    .fromTo('.p0', { x: -1000, rotateY: 60, rotateZ: -12, filter: 'blur(14px)' }, { x: -300, rotateY: 22, rotateZ: -6, filter: 'blur(0px)', duration: 0.7, ease: 'move' }, 0.5)
    .fromTo('.p2', { x: 1000, rotateY: -60, rotateZ: 12, filter: 'blur(14px)' }, { x: 300, rotateY: -22, rotateZ: 6, filter: 'blur(0px)', duration: 0.7, ease: 'move' }, 0.6)
    .set('.p0', { z: -120, y: 30 }, 0).set('.p2', { z: -120, y: 30 }, 0)
    // impact flash + a shake on the group
    .fromTo('.flash', { opacity: 0.85 }, { opacity: 0, duration: 0.35, ease: 'power2.out', immediateRender: false }, 0.62)
    .fromTo('.grp', { x: 0 }, { x: 8, duration: 0.05, yoyo: true, repeat: 5, ease: 'none' }, 0.62)
    .set('.grp', { x: 0 }, 0.95)
    // title rises
    .from('.title b span', { yPercent: 120, duration: 0.6, ease: 'expo.out' }, 0.9)
    .from('.title small', { opacity: 0, y: 8, duration: 0.5 }, 1.2)
    // hold with a slow 3D drift
    .to('.grp', { rotateY: 8, duration: 1.3, ease: 'sine.inOut' }, 1.1)
    // exit: they pull back into the dark
    .to('.phone', { z: -900, opacity: 0, filter: 'blur(10px)', duration: 0.5, ease: 'power3.in', stagger: 0.04 }, 2.45)
    .to('.glow', { scale: 0.3, opacity: 0, duration: 0.5, ease: 'power2.in' }, 2.5)
    .to('.title', { opacity: 0, y: 12, duration: 0.3 }, 2.55);
</script>
