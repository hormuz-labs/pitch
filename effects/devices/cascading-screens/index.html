<!doctype html><meta charset="utf-8">
<title>Cascading Screens</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f1efe9;font-family:"Atlas Grotesk",sans-serif;perspective:2200px}
  .bg{position:absolute;inset:0;background:radial-gradient(70% 80% at 80% 20%,#ffe3d1,transparent 65%),radial-gradient(60% 70% at 15% 90%,#d8e3ff,transparent 65%)}
  .cas{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
  .scr{position:absolute;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 40px 80px rgba(20,20,40,.22),0 0 0 1px rgba(0,0,0,.06);will-change:transform,opacity}
  .web{width:520px;height:350px;left:-260px;top:-175px}
  .app{width:210px;height:440px;left:-105px;top:-220px;border-radius:32px}
  .chrome{height:34px;background:#f4f4f7;border-bottom:1px solid #e3e4ea;display:flex;align-items:center;padding:0 12px;gap:6px}
  .chrome i{width:10px;height:10px;border-radius:50%}
  .chrome i:nth-child(1){background:#ff5f57}.chrome i:nth-child(2){background:#febc2e}.chrome i:nth-child(3){background:#28c840}
  .chrome b{margin-left:14px;flex:1;height:18px;border-radius:6px;background:#e9eaef}
  .body{padding:22px 26px;will-change:transform}
  .app .body{padding:44px 14px 14px}
  .hero{border-radius:12px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
  .web .hero{height:140px}
  .app .hero{height:130px;padding:12px}
  .hero b{font-size:28px;font-weight:500;letter-spacing:-.02em;line-height:1}
  .app .hero b{font-size:18px}
  .hero span{font-size:11px;opacity:.85;margin-bottom:6px}
  .cols{display:flex;gap:12px;margin-top:14px}
  .cols i{flex:1;height:90px;border-radius:10px;background:rgba(0,0,0,.06)}
  .rowi{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.06)}
  .rowi i{width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.1);flex:none}
  .rowi em{display:block;height:8px;border-radius:4px;background:rgba(0,0,0,.18);width:70%;font-style:normal;margin-bottom:6px}
  .rowi em+em{width:45%;opacity:.6;margin:0}
  .rowi .t{flex:1}
  .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:70px;height:20px;border-radius:12px;background:#111;z-index:5}
  .dark{background:#15161b;color:#fff}.dark .chrome{background:#1e1f25;border-color:#2b2c33}.dark .chrome b{background:#2b2c33}.dark .cols i{background:rgba(255,255,255,.08)}.dark .rowi i{background:rgba(255,255,255,.15)}.dark .rowi em{background:rgba(255,255,255,.3)}
  .title{position:absolute;left:70px;bottom:60px;color:#111}
  .title b{display:block;font-family:"Sharp Grotesk",sans-serif;font-size:40px;font-weight:500;letter-spacing:-.03em;line-height:1}
  .title small{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.55;margin-bottom:10px}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="cas"></div>
  <div class="title"><small>Northwind · Showreel</small><b>Web &amp; app, one system.</b></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const items = [
    { k: 'web', g: 'linear-gradient(135deg,#ff7a59,#ff3d81)', t: 'Ship faster', d: 0 },
    { k: 'app', g: 'linear-gradient(135deg,#3d5aff,#00d4ff)', t: 'Today', d: 1 },
    { k: 'web', g: 'linear-gradient(135deg,#1fa86c,#c7f464)', t: 'Grow greener', d: 1 },
    { k: 'app', g: 'linear-gradient(135deg,#ffd166,#ff7a59)', t: 'Wallet', d: 0 },
    { k: 'web', g: 'linear-gradient(135deg,#9d3dff,#ff5c6e)', t: 'Sound studio', d: 0 },
    { k: 'app', g: 'linear-gradient(135deg,#111,#555)', t: 'Library', d: 1 },
  ];
  const cas = document.querySelector('.cas');
  items.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = `scr ${it.k} s${i}` + (it.d ? ' dark' : '');
    const rows = '<div class="rowi"><i></i><div class="t"><em></em><em></em></div></div>'.repeat(3);
    d.innerHTML = it.k === 'web'
      ? `<div class="chrome"><i></i><i></i><i></i><b></b></div><div class="body"><div class="hero" style="background:${it.g}"><span>Acme · case study</span><b>${it.t}</b></div><div class="cols"><i></i><i></i><i></i></div>${rows}</div>`
      : `<div class="notch"></div><div class="body"><div class="hero" style="background:${it.g}"><span>Acme</span><b>${it.t}</b></div>${rows}</div>`;
    cas.appendChild(d);
  });
  // staggered staircase: alternating web/app, each step further right, lower and deeper
  const pose = i => ({ x: -400 + i * 190, y: -90 + i * 34, z: -i * 100 });
  const tl = fx.timeline({ duration: 10 });
  gsap.set('.cas', { rotateY: -18, rotateX: 8, x: 40 });
  items.forEach((it, i) => {
    const P = pose(i);
    tl.fromTo('.s' + i, { x: P.x + 420, y: P.y - 60, z: P.z, opacity: 0, rotateY: -30 }, { x: P.x, y: P.y, z: P.z, opacity: 1, rotateY: 0, duration: 1.0, ease: 'expo.out' }, 0.15 + i * 0.28);
    tl.to(`.s${i} .body`, { y: -120, duration: 1.4, ease: 'power3.inOut' }, 3.2 + i * 0.15)
      .to(`.s${i} .body`, { y: 0, duration: 1.4, ease: 'power3.inOut' }, 5.8 + i * 0.15);
  });
  tl.from('.title small, .title b', { y: 20, opacity: 0, stagger: 0.12, duration: 0.7, ease: 'power3.out' }, 1.2);
  tl.to('.cas', { rotateY: -8, x: -40, duration: 6, ease: 'sine.inOut' }, 1.5);
  items.forEach((it, i) => tl.to('.s' + i, { x: pose(i).x - 500, opacity: 0, rotateY: 20, duration: 0.6, ease: 'expo.in' }, 8.5 + i * 0.14));
  tl.to('.title', { opacity: 0, y: 20, duration: 0.4 }, 9.2);
</script>
