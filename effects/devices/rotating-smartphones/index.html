<!doctype html><meta charset="utf-8">
<title>Rotating Smartphones</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:radial-gradient(ellipse at 50% 40%,#2a2450,#0c0b16 70%);perspective:2000px;color:#fff}
  .floor{position:absolute;left:50%;top:50%;width:1400px;height:700px;transform:translate(-50%,-30%) rotateX(78deg);background:radial-gradient(closest-side,rgba(140,110,255,.25),transparent 70%);filter:blur(10px)}
  .row{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:120px;transform-style:preserve-3d}
  .p{width:230px;height:470px;position:relative;transform-style:preserve-3d;will-change:transform}
  .f{position:absolute;inset:0;border-radius:36px;backface-visibility:hidden;transform-style:preserve-3d}
  .front{background:#16171c;padding:9px;transform:translateZ(6px);box-shadow:inset 0 0 0 2px #4a4b55}
  .scr{height:100%;border-radius:28px;overflow:hidden;position:relative;background:#fff;color:#111;font-size:11px}
  .isl{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:70px;height:20px;border-radius:12px;background:#111;z-index:3}
  .in{padding:44px 14px 0}
  .h{font-size:20px;font-weight:500;letter-spacing:-.02em;margin-bottom:10px}.h small{display:block;font-size:10px;color:#8a8f9a;font-weight:400}
  .card{border-radius:14px;padding:12px;margin-bottom:8px;background:#f4f5f8}
  .card.hero{height:130px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}.card.hero b{font-size:20px;font-weight:500}.card.hero span{font-size:10px;opacity:.85}
  .r{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #e6e8ef}.r:last-child{border:0}
  .r i{width:26px;height:26px;border-radius:8px;flex:none}
  .r em{display:block;height:6px;border-radius:3px;background:#cfd3dc;font-style:normal;margin-bottom:5px}.r em+em{margin:0;background:#e2e5ec}.r .t{flex:1}
  .btn{height:38px;border-radius:12px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:12px}
  .back{background:linear-gradient(160deg,#2a2b33,#15161b);transform:rotateY(180deg) translateZ(6px);box-shadow:inset 0 0 0 2px #4a4b55}
  .back .bump{position:absolute;left:16px;top:16px;width:78px;height:78px;border-radius:22px;background:#0f1013;box-shadow:inset 0 0 0 1px #3a3b44}
  .back .bump i{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#5b6270,#0a0b0e 70%);box-shadow:0 0 0 3px #202229}
  .back .bump i:nth-child(1){left:10px;top:10px}.back .bump i:nth-child(2){left:10px;bottom:10px}.back .bump i:nth-child(3){right:10px;top:10px}
  .back .logo{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:9px;background:#fff;opacity:.9;transform:rotate(45deg)}
  .edge{position:absolute;background:#2f3039;backface-visibility:hidden}
  .edge.l,.edge.r{top:0;bottom:0;width:12px;transform-origin:left;border-radius:0}
  .edge.l{left:0;transform:rotateY(-90deg) translateX(-6px)}
  .edge.r{right:0;transform-origin:right;transform:rotateY(90deg) translateX(6px)}
  .cap{position:absolute;left:0;right:0;bottom:56px;text-align:center}
  .cap h1{font-family:"Sharp Grotesk",sans-serif;font-size:40px;font-weight:500;letter-spacing:-.03em;line-height:1}
  .cap p{font-size:14px;opacity:.6;margin-top:10px}
</style>
<div class="stage">
  <div class="floor"></div>
  <div class="row" id="row"></div>
  <div class="cap"><h1>Every angle. Every screen.</h1><p>Acme Phone — now in three finishes</p></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const rng = fx.rng(11);
  const themes = [['#ff5c7a', '#ff9a5c', 'Home'], ['#5c7cff', '#7ee0ff', 'Wallet'], ['#22c58b', '#a3f2c8', 'Stats']];
  const row = document.getElementById('row');
  const phones = themes.map(([a, b, n], i) => {
    const el = document.createElement('div'); el.className = 'p';
    const rows = Array.from({ length: 3 }, (_, r) => `<div class="r"><i style="background:${r % 2 ? b : a}"></i><div class="t"><em style="width:${50 + Math.floor(rng() * 35)}%"></em><em style="width:${25 + Math.floor(rng() * 40)}%"></em></div></div>`).join('');
    el.innerHTML = `<div class="f front"><div class="scr"><div class="isl"></div><div class="in"><div class="h"><small>Acme</small>${n}</div><div class="card hero" style="background:linear-gradient(135deg,${a},${b})"><span>Today</span><b>Welcome back</b></div><div class="card">${rows}</div><div class="btn">Continue</div></div></div></div>
      <div class="f back"><div class="bump"><i></i><i></i><i></i></div><div class="logo"></div></div>
      <div class="edge l"></div><div class="edge r"></div>`;
    row.appendChild(el); return el;
  });
  const D = 5;
  fx.register({ duration: D, seek(t) {
    const u = t / D;
    phones.forEach((el, i) => {
      // one full turn per loop, each phone a third of a turn behind the last; a gentle bob on top
      const ry = u * 360 + i * 120;
      const bob = Math.sin((u + i / 3) * Math.PI * 2) * 14;
      gsap.set(el, { rotateY: ry, y: bob, rotateX: Math.sin((u + i * 0.2) * Math.PI * 2) * 5, rotateZ: -4 + i * 4 });
    });
    gsap.set('.row', { rotateY: Math.sin(u * Math.PI * 2) * 10 });
    gsap.set('.cap', { y: Math.sin(u * Math.PI * 2) * 3 });
  } });
</script>
