<!doctype html><meta charset="utf-8">
<title>Animated Web Screens</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f6f5f2;font-family:"Atlas Grotesk",sans-serif;perspective:1800px;overflow:hidden}
  .bg{position:absolute;inset:0;background:radial-gradient(70% 80% at 20% 20%,#ffe9d6,transparent 65%),radial-gradient(60% 70% at 85% 85%,#dfe6ff,transparent 65%)}
  .wrap{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
  .win{position:absolute;width:660px;height:420px;left:-330px;top:-210px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 40px 90px rgba(20,20,40,.22),0 0 0 1px rgba(0,0,0,.06);will-change:transform,opacity;transform-style:preserve-3d}
  .chrome{height:40px;background:#f4f4f7;border-bottom:1px solid #e3e4ea;display:flex;align-items:center;padding:0 14px;gap:7px}
  .chrome i{width:11px;height:11px;border-radius:50%}
  .chrome i:nth-child(1){background:#ff5f57}.chrome i:nth-child(2){background:#febc2e}.chrome i:nth-child(3){background:#28c840}
  .chrome b{margin-left:18px;flex:1;height:22px;border-radius:7px;background:#e9eaef;font-size:11px;font-weight:400;color:#8a8f9a;display:flex;align-items:center;padding-left:10px}
  .site{position:relative;height:380px;overflow:hidden}
  .page{padding:22px 32px;will-change:transform}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
  .nav .logo{display:flex;align-items:center;gap:8px;font-weight:500;font-size:15px}
  .nav .logo i{width:22px;height:22px;border-radius:7px}
  .nav em{display:flex;gap:18px;font-size:12px;color:#5b6070;font-style:normal;align-items:center}
  .nav em b{padding:7px 12px;border-radius:8px;background:#111;color:#fff;font-weight:500}
  .h1{font-family:"Sharp Grotesk",sans-serif;font-size:48px;font-weight:500;letter-spacing:-.03em;line-height:1;max-width:520px}
  .h1 span{display:block;overflow:hidden}
  .p{font-size:14px;color:#5b6070;margin:14px 0 20px;max-width:420px;line-height:1.5}
  .cta{display:inline-flex;gap:10px}
  .cta b{padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;background:#111;color:#fff}
  .cta b+b{background:#eef0f4;color:#111}
  .cards{display:flex;gap:14px;margin-top:26px}
  .cards i{flex:1;height:140px;border-radius:12px}
  .dark{background:#111318;color:#fff}.dark .chrome{background:#1b1c22;border-color:#2b2c33}.dark .chrome b{background:#2b2c33}.dark .nav em{color:#aab}.dark .nav em b{background:#fff;color:#111}.dark .p{color:#9aa}.dark .cta b{background:#fff;color:#111}.dark .cta b+b{background:#2b2c33;color:#fff}
  .credit{position:absolute;left:48px;bottom:40px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#55586a}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="wrap"></div>
  <div class="credit">Northwind Agency — Web</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const sites = [
    { url: 'acme.co', name: 'Acme', ic: '#ff3d81', h: ['Build the', 'future faster'], g: ['#ff7a59', '#ff3d81', '#ffd166'], d: 0 },
    { url: 'northwind.io', name: 'Northwind', ic: '#3d5aff', h: ['Analytics for', 'ambitious teams'], g: ['#3d5aff', '#00d4ff', '#9d3dff'], d: 1 },
    { url: 'verdant.farm', name: 'Verdant', ic: '#1fa86c', h: ['Grown with', 'a lighter touch'], g: ['#1fa86c', '#c7f464', '#0b6b47'], d: 0 },
  ];
  const wrap = document.querySelector('.wrap');
  sites.forEach((s, i) => {
    const w = document.createElement('div');
    w.className = 'win w' + i + (s.d ? ' dark' : '');
    w.innerHTML = `<div class="chrome"><i></i><i></i><i></i><b>${s.url}</b></div><div class="site"><div class="page">
      <div class="nav"><div class="logo"><i style="background:${s.ic}"></i>${s.name}</div><em>Product<span>Pricing</span><span>Docs</span><b>Get started</b></em></div>
      <div class="h1"><span><u>${s.h[0]}</u></span><span><u>${s.h[1]}</u></span></div>
      <div class="p">A calmer way to plan, build and ship. Trusted by teams who care about the details.</div>
      <div class="cta"><b>Start free</b><b>Book a demo</b></div>
      <div class="cards"><i style="background:${s.g[0]}"></i><i style="background:${s.g[1]}"></i><i style="background:${s.g[2]}"></i></div>
    </div></div>`;
    wrap.appendChild(w);
  });
  document.querySelectorAll('.h1 u').forEach(u => { u.style.textDecoration = 'none'; u.style.display = 'block'; });
  const tl = fx.timeline({ duration: 7 });
  // stacked in depth: back windows sit up-right and further away, each enters with clean motion
  const pose = [
    { x: -60, y: 70, z: 0, ry: 0 },
    { x: 170, y: -40, z: -300, ry: -8 },
    { x: 400, y: -150, z: -600, ry: -14 },
  ];
  gsap.set('.wrap', { rotateY: -14, rotateX: 6, x: -80 });
  [2, 1, 0].forEach((i, k) => {
    const P = pose[i];
    tl.fromTo('.w' + i, { x: P.x + 700, y: P.y + 80, z: P.z, rotateY: P.ry, opacity: 0 }, { x: P.x, y: P.y, z: P.z, rotateY: P.ry, opacity: 1, duration: 1.1, ease: 'expo.out' }, 0.1 + k * 0.25);
    // the headline lines rise inside each screen after it lands
    tl.from(`.w${i} .h1 u`, { yPercent: 110, stagger: 0.08, duration: 0.6, ease: 'expo.out' }, 0.6 + k * 0.25)
      .from(`.w${i} .p, .w${i} .cta`, { y: 14, opacity: 0, stagger: 0.1, duration: 0.5, ease: 'power3.out' }, 0.8 + k * 0.25)
      .from(`.w${i} .cards i`, { y: 40, opacity: 0, stagger: 0.08, duration: 0.6, ease: 'back.out(1.5)' }, 1.0 + k * 0.25);
  });
  tl.from('.credit', { opacity: 0, x: -10, duration: 0.5 }, 1.0);
  // the whole stack slowly pans; front pages scroll
  tl.to('.wrap', { rotateY: -6, x: 0, duration: 4, ease: 'sine.inOut' }, 1.5);
  [0, 1, 2].forEach(i => tl.to(`.w${i} .page`, { y: -150, duration: 1.3, ease: 'power3.inOut' }, 3.2 + i * 0.2).to(`.w${i} .page`, { y: 0, duration: 1.1, ease: 'power3.inOut' }, 4.9 + i * 0.15));
  // exit: fly out to the left in front-to-back order
  [0, 1, 2].forEach((i, k) => tl.to('.w' + i, { x: pose[i].x - 900, opacity: 0, duration: 0.6, ease: 'expo.in' }, 6.2 + k * 0.12));
  tl.to('.credit', { opacity: 0, duration: 0.3 }, 6.5);
</script>
