<!doctype html><meta charset="utf-8">
<title>Animated iPhone Mockup</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0d0e12;perspective:1800px;font-family:"Atlas Grotesk",sans-serif}
  .bg{position:absolute;inset:-10%;background:url("../../../assets/backgrounds/sunset.png") center/cover;filter:brightness(.5) saturate(1.2)}
  .copy{position:absolute;left:110px;top:50%;transform:translateY(-50%);color:#fff;width:420px}
  .copy h1{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:64px;line-height:1;letter-spacing:-.03em}
  .copy h1 span{display:block;overflow:hidden}
  .copy h1 span b{display:block;font-weight:500}
  .copy p{margin-top:22px;font-size:18px;line-height:1.5;opacity:.8}
  .copy .pill{display:inline-block;margin-top:26px;padding:12px 22px;border-radius:99px;background:#fff;color:#111;font-size:15px;font-weight:500}
  .wrap{position:absolute;right:170px;top:50%;transform:translateY(-50%);transform-style:preserve-3d}
  .phone{position:relative;width:300px;height:620px;border-radius:52px;background:#1a1b20;padding:13px;box-shadow:0 60px 100px rgba(0,0,0,.6),inset 0 0 0 2px #4a4b52;transform-style:preserve-3d;will-change:transform}
  .phone::before{content:"";position:absolute;left:-3px;top:130px;width:3px;height:36px;background:#3a3b41;border-radius:2px 0 0 2px}
  .phone::after{content:"";position:absolute;right:-3px;top:170px;width:3px;height:70px;background:#3a3b41;border-radius:0 2px 2px 0}
  .scr{position:relative;height:100%;border-radius:40px;overflow:hidden;background:#fafafc}
  .island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:96px;height:28px;border-radius:16px;background:#111;z-index:5}
  .pages{position:absolute;inset:0;display:flex;width:300%;will-change:transform}
  .page{width:calc(100% / 3);padding:58px 20px 80px;position:relative}
  .hd{font-size:24px;font-weight:500;letter-spacing:-.02em;margin-bottom:16px}
  .hd small{display:block;font-size:12px;color:#8a8f9a;font-weight:400}
  .card{border-radius:18px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.05);padding:14px;margin-bottom:12px;will-change:transform}
  .hero{height:170px;background:linear-gradient(135deg,#ff8a5c,#ff3d81 60%,#7a3dff);color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
  .hero b{font-size:28px;font-weight:500;letter-spacing:-.02em}.hero span{font-size:12px;opacity:.85}
  .rowi{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eef0f4}
  .rowi:last-child{border:0}
  .rowi i{width:34px;height:34px;border-radius:11px;background:#e3e6ee;flex:none}
  .rowi i.a{background:#ffb84d}.rowi i.b{background:#4dd6a8}.rowi i.c{background:#6b8bff}
  .rowi .t{flex:1}.rowi .t em{display:block;height:9px;border-radius:5px;background:#cfd3dc;width:70%;margin-bottom:6px;font-style:normal}
  .rowi .t em+em{width:45%;background:#e4e7ee;margin:0}
  .rowi .chk{width:20px;height:20px;border-radius:50%;border:2px solid #d5d8e0}
  .rowi .chk.on{background:#ff3d81;border-color:#ff3d81}
  .ring{width:150px;height:150px;margin:8px auto 14px;position:relative}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:500;letter-spacing:-.02em}
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:66px;background:#fff;border-top:1px solid #eceef2;display:flex;justify-content:space-around;align-items:center;padding-bottom:10px;z-index:4}
  .tabbar i{width:22px;height:22px;border-radius:7px;background:#d3d6de}
  .tabbar i.on{background:#ff3d81}
  .home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:110px;height:5px;border-radius:3px;background:#111;z-index:5}
  .btn{height:48px;border-radius:14px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500}
  .glare{position:absolute;inset:0;border-radius:52px;background:linear-gradient(115deg,rgba(255,255,255,.18),transparent 40%);pointer-events:none;z-index:6}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="copy">
    <h1><span><b>Track</b></span><span><b>every</b></span><span><b>habit.</b></span></h1>
    <p>Acme keeps your streaks alive with a tap. Plan, check off, and watch the ring close.</p>
    <div class="pill">Get the app</div>
  </div>
  <div class="wrap"><div class="phone"><div class="scr"><div class="island"></div>
    <div class="pages">
      <div class="page p1">
        <div class="hd"><small>Tuesday</small>Today</div>
        <div class="card hero"><span>Streak · 14 days</span><b>Keep it up</b></div>
        <div class="card"><div class="rowi"><i class="a"></i><div class="t"><em></em><em></em></div><div class="chk on"></div></div><div class="rowi"><i class="b"></i><div class="t"><em></em><em></em></div><div class="chk k2"></div></div><div class="rowi"><i class="c"></i><div class="t"><em></em><em></em></div><div class="chk k3"></div></div></div>
      </div>
      <div class="page p2">
        <div class="hd"><small>Progress</small>This week</div>
        <div class="card"><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#f0f1f5" stroke-width="10"/><circle class="arc" cx="50" cy="50" r="42" fill="none" stroke="#ff3d81" stroke-width="10" stroke-linecap="round"/></svg><b class="pct">0%</b></div>
          <div class="rowi"><i class="a"></i><div class="t"><em></em><em></em></div></div><div class="rowi"><i class="b"></i><div class="t"><em></em><em></em></div></div></div>
        <div class="btn">Share progress</div>
      </div>
      <div class="page p3">
        <div class="hd"><small>Library</small>Habits</div>
        <div class="card"><div class="rowi"><i class="c"></i><div class="t"><em></em><em></em></div></div><div class="rowi"><i class="a"></i><div class="t"><em></em><em></em></div></div><div class="rowi"><i class="b"></i><div class="t"><em></em><em></em></div></div><div class="rowi"><i></i><div class="t"><em></em><em></em></div></div><div class="rowi"><i class="c"></i><div class="t"><em></em><em></em></div></div></div>
        <div class="btn">New habit</div>
      </div>
    </div>
    <div class="tabbar"><i class="on t1"></i><i class="t2"></i><i class="t3"></i></div>
    <div class="home"></div>
  </div><div class="glare"></div></div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 8 });
  const pct = { v: 0 };
  tl.fromTo('.bg', { scale: 1.05, xPercent: -1 }, { scale: 1.1, xPercent: 1, duration: 8, ease: 'none' }, 0)
    // phone turns in from a 3D angle
    .fromTo('.phone', { rotateY: -55, rotateX: 8, x: 260, opacity: 0 }, { rotateY: -14, rotateX: 4, x: 0, opacity: 1, duration: 1.3, ease: 'expo.out' }, 0)
    .to('.phone', { rotateY: -8, y: -10, duration: 3, ease: 'sine.inOut' }, 1.3)
    .to('.phone', { rotateY: -16, y: 6, duration: 3, ease: 'sine.inOut' }, 4.3)
    .to('.phone', { rotateY: 50, x: 300, opacity: 0, duration: 0.6, ease: 'expo.in' }, 7.4)
    // headline
    .from('.copy h1 b', { yPercent: 110, stagger: 0.1, duration: 0.8, ease: 'expo.out' }, 0.3)
    .from('.copy p', { y: 20, opacity: 0, duration: 0.6, ease: 'power3.out' }, 0.8)
    .from('.copy .pill', { y: 20, opacity: 0, duration: 0.6, ease: 'back.out(1.7)' }, 1.0)
    .to('.copy', { opacity: 0, x: -30, duration: 0.5, ease: 'power2.in' }, 7.4)
    // screen 1 builds and checks off
    .from('.p1 .card', { y: 40, opacity: 0, stagger: 0.12, duration: 0.6, ease: 'power3.out' }, 0.7)
    .to('.k2', { backgroundColor: '#ff3d81', borderColor: '#ff3d81', duration: 0.2 }, 1.9)
    .fromTo('.k2', { scale: 1 }, { scale: 1.3, duration: 0.15, yoyo: true, repeat: 1 }, 1.9)
    .to('.k3', { backgroundColor: '#ff3d81', borderColor: '#ff3d81', duration: 0.2 }, 2.4)
    .fromTo('.k3', { scale: 1 }, { scale: 1.3, duration: 0.15, yoyo: true, repeat: 1 }, 2.4)
    // swipe to screen 2: the ring counts up
    .to('.pages', { xPercent: -100 / 3, duration: 0.7, ease: 'expo.inOut' }, 3.0)
    .to('.t1', { backgroundColor: '#d3d6de', duration: 0.3 }, 3.1).to('.t2', { backgroundColor: '#ff3d81', duration: 0.3 }, 3.1)
    .from('.p2 .card, .p2 .btn', { y: 30, opacity: 0, stagger: 0.1, duration: 0.5, ease: 'power3.out' }, 3.3)
    .fromTo('.arc', { drawSVG: '0%' }, { drawSVG: '82%', duration: 1.4, ease: 'power3.out' }, 3.6)
    .to(pct, { v: 82, duration: 1.4, ease: 'power3.out', onUpdate() { document.querySelector('.pct').textContent = Math.round(pct.v) + '%'; } }, 3.6)
    // swipe to screen 3: the list staggers in
    .to('.pages', { xPercent: -200 / 3, duration: 0.7, ease: 'expo.inOut' }, 5.4)
    .to('.t2', { backgroundColor: '#d3d6de', duration: 0.3 }, 5.5).to('.t3', { backgroundColor: '#ff3d81', duration: 0.3 }, 5.5)
    .from('.p3 .rowi', { x: 30, opacity: 0, stagger: 0.07, duration: 0.45, ease: 'power3.out' }, 5.7)
    .from('.p3 .btn', { y: 20, opacity: 0, duration: 0.5, ease: 'back.out(1.6)' }, 6.1);
</script>
