<!doctype html><meta charset="utf-8">
<title>Mobile App: Subscribe Field</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101216;font-family:"Atlas Grotesk",sans-serif;perspective:1600px}
  .bg{position:absolute;inset:-10%;background:url("../../../assets/backgrounds/ocean.png") center/cover;filter:brightness(.4) saturate(1.2)}
  .wrap{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
  .phone{position:absolute;left:-150px;top:-310px;width:300px;height:620px;border-radius:50px;background:#1a1b20;padding:12px;box-shadow:0 50px 90px rgba(0,0,0,.6),inset 0 0 0 2px #4a4b52;will-change:transform}
  .scr{height:100%;border-radius:39px;overflow:hidden;position:relative;background:#fff;color:#111;padding:70px 22px 30px;display:flex;flex-direction:column}
  .island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:96px;height:28px;border-radius:16px;background:#111}
  .art{height:170px;border-radius:20px;background:linear-gradient(135deg,#3d5aff,#00d4ff);margin-bottom:22px;position:relative;overflow:hidden}
  .art i{position:absolute;border-radius:50%;background:rgba(255,255,255,.25)}
  .h{font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
  .p{font-size:13px;color:#7a7f8c;margin:8px 0 22px;line-height:1.5}
  .field{position:relative;height:54px;border-radius:16px;border:2px solid #e2e4ea;background:#fff;display:flex;align-items:center;padding:0 16px;font-size:14px;color:#9aa0ad;overflow:hidden;will-change:transform}
  .field .ph{position:absolute;left:16px;will-change:transform}
  .field .val{color:#111;white-space:nowrap}
  .field .caret{width:2px;height:20px;background:#3d5aff;margin-left:2px}
  .btn{margin-top:12px;height:54px;border-radius:16px;background:#111;color:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;will-change:transform}
  .btn .lbl,.btn .ok{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn .ok{background:#1fa86c}
  .btn .ok svg{width:20px;height:20px}
  .spark{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#1fa86c;opacity:0}
  .fine{margin-top:auto;font-size:11px;color:#aab;text-align:center}
  .tag{position:absolute;left:140px;top:50%;transform:translateY(-50%);color:#fff;width:340px}
  .tag b{display:block;font-family:"Sharp Grotesk",sans-serif;font-size:52px;font-weight:500;letter-spacing:-.03em;line-height:1}
  .tag p{margin-top:16px;font-size:16px;opacity:.75;line-height:1.5}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="tag"><b>Never miss<br>a drop.</b><p>The subscribe field, animated: type, tap, done.</p></div>
  <div class="wrap"><div class="phone"><div class="scr"><div class="island"></div>
    <div class="art"><i style="width:180px;height:180px;left:-40px;top:-60px"></i><i style="width:120px;height:120px;right:-30px;bottom:-40px"></i></div>
    <div class="h">Get the weekly<br>Northwind letter</div>
    <div class="p">Product news, tips and early access. No spam, unsubscribe any time.</div>
    <div class="field"><span class="ph">you@email.com</span><span class="val"></span><span class="caret"></span></div>
    <div class="btn"><span class="lbl">Subscribe</span><span class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path class="tick" d="M4 12l5 5L20 6"/></svg>You're in</span>
      <i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i></div>
    <div class="fine">By subscribing you agree to the terms.</div>
  </div></div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/TextPlugin.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(TextPlugin, DrawSVGPlugin);
  const tl = fx.timeline({ duration: 4 });
  gsap.set('.btn .ok', { yPercent: 100 });
  gsap.set('.caret', { opacity: 0 });
  tl.fromTo('.bg', { scale: 1.05 }, { scale: 1.12, duration: 4, ease: 'none' }, 0)
    .fromTo('.phone', { rotateY: -18, rotateX: 4, y: 30 }, { rotateY: -8, rotateX: 2, y: 0, duration: 4, ease: 'sine.inOut' }, 0)
    .from('.tag b', { y: 30, opacity: 0, duration: 0.7, ease: 'expo.out' }, 0.1)
    .from('.tag p', { y: 16, opacity: 0, duration: 0.6, ease: 'power3.out' }, 0.3)
    // focus: the field lifts and its border turns blue, placeholder slides away, caret blinks
    .to('.field', { borderColor: '#3d5aff', scale: 1.03, boxShadow: '0 0 0 4px rgba(61,90,255,.15)', duration: 0.3, ease: 'power2.out' }, 0.5)
    .to('.ph', { yPercent: -160, opacity: 0, duration: 0.3, ease: 'power2.in' }, 0.6)
    .fromTo('.caret', { opacity: 0 }, { opacity: 1, duration: 0.12, repeat: 7, yoyo: true, ease: 'none' }, 0.6)
    .to('.val', { text: { value: 'ada@northwind.io', delimiter: '' }, duration: 1.1, ease: 'none' }, 0.85)
    .set('.caret', { opacity: 0 }, 2.05)
    // tap: button squashes, label swaps for the tick, sparks burst
    .to('.btn', { scale: 0.94, duration: 0.12, ease: 'power2.in' }, 2.15)
    .to('.btn', { scale: 1, duration: 0.5, ease: 'elastic.out(1,0.45)' }, 2.27)
    .to('.btn .lbl', { yPercent: -100, duration: 0.35, ease: 'expo.inOut' }, 2.27)
    .to('.btn .ok', { yPercent: 0, duration: 0.35, ease: 'expo.inOut' }, 2.27)
    .fromTo('.tick', { drawSVG: '0%' }, { drawSVG: '100%', duration: 0.4, ease: 'power2.out' }, 2.5)
    .to('.field', { borderColor: '#1fa86c', scale: 1, boxShadow: '0 0 0 0 rgba(0,0,0,0)', duration: 0.4 }, 2.3);
  document.querySelectorAll('.spark').forEach((s, i) => {
    const a = (i / 6) * Math.PI * 2;
    tl.fromTo(s, { x: 0, y: 0, opacity: 1, scale: 1 }, { x: Math.cos(a) * 70, y: Math.sin(a) * 40, opacity: 0, scale: 0.3, duration: 0.6, ease: 'power3.out' }, 2.3);
  });
  // reset for the loop: the field clears and the button returns
  tl.to('.btn .ok', { yPercent: 100, duration: 0.35, ease: 'expo.inOut' }, 3.5)
    .to('.btn .lbl', { yPercent: 0, duration: 0.35, ease: 'expo.inOut' }, 3.5)
    .to('.val', { text: '', duration: 0.25, ease: 'none' }, 3.5)
    .to('.ph', { yPercent: 0, opacity: 1, duration: 0.3, ease: 'power2.out' }, 3.65)
    .to('.field', { borderColor: '#e2e4ea', duration: 0.3 }, 3.6);
</script>
