<!doctype html><meta charset="utf-8">
<title>Mobile Screens: Grid</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0d0e13;perspective:2200px}
  .glow{position:absolute;left:50%;top:50%;width:1200px;height:900px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(90,110,255,.28),transparent 70%);filter:blur(30px)}
  .cam{position:absolute;left:50%;top:50%;transform-style:preserve-3d;will-change:transform}
  .grid{position:absolute;left:0;top:0;display:grid;grid-template-columns:repeat(5,190px);gap:34px;transform:translate(-50%,-50%) rotateX(32deg) rotateZ(-16deg);transform-style:preserve-3d}
  .scr{width:190px;height:400px;border-radius:26px;background:#fff;overflow:hidden;position:relative;box-shadow:0 40px 60px rgba(0,0,0,.55),0 0 0 6px #1b1c24,0 0 0 8px #33343f;will-change:transform,opacity}
  .scr .bar{height:46px;display:flex;align-items:flex-end;padding:0 14px 10px;font-size:13px;font-weight:500;letter-spacing:-.01em;color:#111}
  .scr .bar i{margin-left:auto;width:26px;height:26px;border-radius:50%;background:#e6e8ef}
  .list{position:absolute;left:0;right:0;top:46px;padding:0 12px;will-change:transform}
  .hero{height:120px;border-radius:16px;margin-bottom:10px;position:relative;overflow:hidden;color:#fff;padding:12px;display:flex;flex-direction:column;justify-content:flex-end}
  .hero b{font-size:17px;font-weight:500;letter-spacing:-.02em}.hero span{font-size:10px;opacity:.85}
  .row{display:flex;align-items:center;gap:9px;padding:8px 6px;border-radius:12px;background:#f4f5f8;margin-bottom:8px}
  .row i{width:30px;height:30px;border-radius:9px;flex:none}
  .row em{display:block;height:7px;border-radius:4px;background:#cfd3dc;font-style:normal;margin-bottom:5px}
  .row em+em{background:#e2e5ec;margin:0}
  .row .t{flex:1}
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .stat div{border-radius:12px;background:#f4f5f8;padding:10px;font-size:15px;font-weight:500;letter-spacing:-.02em;color:#111}
  .stat div small{display:block;font-size:9px;color:#8a8f9a;font-weight:400;margin-bottom:2px}
  .dark{background:#15161c}.dark .bar{color:#fff}.dark .row{background:#22232b}.dark .row em{background:#3a3c48}.dark .row em+em{background:#2c2e38}.dark .stat div{background:#22232b;color:#fff}
  .tab{position:absolute;left:0;right:0;bottom:0;height:44px;background:#fff;border-top:1px solid #eceef2;display:flex;justify-content:space-around;align-items:center}
  .dark .tab{background:#15161c;border-color:#26272f}
  .tab i{width:16px;height:16px;border-radius:5px;background:#d3d6de}.tab i.on{background:var(--c)}
  .dark .tab i{background:#3a3c48}
  .head{position:absolute;left:60px;bottom:56px;color:#fff;z-index:3}
  .shade{position:absolute;left:0;bottom:0;width:640px;height:420px;background:radial-gradient(ellipse at 0% 100%,rgba(13,14,19,.98),rgba(13,14,19,.7) 45%,transparent 72%);z-index:2}
  .head h1{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:46px;line-height:1;letter-spacing:-.03em}
  .head h1 span{display:block;overflow:hidden}.head h1 b{display:block;font-weight:500}
  .head p{margin-top:12px;font-size:15px;opacity:.7}
</style>
<div class="stage">
  <div class="glow"></div>
  <div class="cam"><div class="grid" id="grid"></div></div>
  <div class="shade"></div>
  <div class="head"><h1><span><b>Every screen,</b></span><span><b>one wall.</b></span></h1><p>Northwind — 14 flows, one design system</p></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const rng = fx.rng(7);
  const themes = [['#ff5c7a','#ff9a5c'],['#5c7cff','#7ee0ff'],['#22c58b','#a3f2c8'],['#a45cff','#ff7ad9'],['#ffb020','#ffe08a'],['#111','#444']];
  const titles = ['Home','Wallet','Activity','Explore','Inbox','Stats','Orders','Profile','Search','Rides','Library','Today','Goals','Cards','Feed'];
  const grid = document.getElementById('grid');
  const COLS = 5, ROWS = 3;
  for (let i = 0; i < COLS * ROWS; i++) {
    const th = themes[i % themes.length];
    const dark = rng() < 0.3;
    const s = document.createElement('div');
    s.className = 'scr' + (dark ? ' dark' : '');
    s.style.setProperty('--c', th[0]);
    let rows = '';
    const n = 6 + Math.floor(rng() * 3);
    for (let r = 0; r < n; r++) {
      const w1 = 45 + Math.floor(rng() * 40), w2 = 25 + Math.floor(rng() * 40);
      rows += `<div class="row"><i style="background:${r % 2 ? th[1] : th[0]};opacity:.85"></i><div class="t"><em style="width:${w1}%"></em><em style="width:${w2}%"></em></div></div>`;
    }
    const stat = `<div class="stat"><div><small>Balance</small>$${(1200 + Math.floor(rng() * 8000)).toLocaleString()}</div><div><small>This week</small>+${Math.floor(rng() * 40)}%</div></div>`;
    s.innerHTML = `<div class="bar">${titles[i % titles.length]}<i></i></div><div class="list"><div class="hero" style="background:linear-gradient(135deg,${th[0]},${th[1]})"><span>${titles[(i + 3) % titles.length]}</span><b>Good morning</b></div>${i % 2 ? stat : ''}${rows}</div><div class="tab"><i class="${i % 4 === 0 ? 'on' : ''}"></i><i class="${i % 4 === 1 ? 'on' : ''}"></i><i class="${i % 4 === 2 ? 'on' : ''}"></i><i class="${i % 4 === 3 ? 'on' : ''}"></i></div>`;
    grid.appendChild(s);
  }
  const tl = fx.timeline({ duration: 7 });
  // camera: a slow diagonal pan across the wall, the whole loop
  tl.fromTo('.cam', { x: 260, y: -150, scale: 1.02 }, { x: 60, y: -10, scale: 1.14, duration: 7, ease: 'none' }, 0)
    // screens pop in, rippling out from the centre of the grid
    .from('.scr', { scale: 0.6, opacity: 0, z: -300, duration: 0.9, ease: 'expo.out', stagger: { each: 0.06, grid: [ROWS, COLS], from: 'center' } }, 0.1)
    // every list keeps scrolling at its own pace
    .to('.list', { y: (i) => -(120 + (i % 4) * 60), duration: 6.4, ease: 'power1.inOut', stagger: { each: 0.05 } }, 0.5)
    .from('.head h1 b', { yPercent: 110, stagger: 0.1, duration: 0.8, ease: 'expo.out' }, 0.5)
    .from('.head p', { y: 14, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0.95)
    .to('.head', { opacity: 0, y: -16, duration: 0.4, ease: 'power2.in' }, 6.3)
    // screens leave the way they came, edges first
    .to('.scr', { scale: 0.6, opacity: 0, z: -300, duration: 0.5, ease: 'expo.in', stagger: { each: 0.04, grid: [ROWS, COLS], from: 'edges' } }, 6.2);
</script>
