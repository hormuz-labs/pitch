<!doctype html><meta charset="utf-8">
<title>Wow: Rotate and Scale</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:radial-gradient(ellipse at 50% 60%,#2a1a4a 0%,#0c0a14 65%)}
  .ring{position:absolute;left:50%;top:50%;width:820px;height:820px;margin:-410px 0 0 -410px;border-radius:50%;border:2px dashed rgba(255,255,255,.14)}
  .ring2{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;border:1px solid rgba(255,255,255,.1)}
  .halo{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(circle,#ff6b9d 0%,rgba(255,107,157,0) 62%);opacity:.7}
  .hero{position:absolute;inset:0;display:grid;place-items:center}
  .wow{display:flex;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:300px;line-height:1;letter-spacing:-.06em;color:#fff;transform-origin:50% 55%}
  .wow span{display:inline-block;transform-origin:50% 60%}
  .wow span:nth-child(2){color:#ffd23f}
  .sub{position:absolute;left:0;right:0;top:560px;text-align:center;font-size:22px;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.75)}
  .sub .mask{display:inline-block;overflow:hidden;vertical-align:top}
  .sub .mask span{display:block}
  .spark{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#ffd23f}
</style>
<div class="stage">
  <div class="ring"></div><div class="ring2"></div><div class="halo"></div>
  <div class="hero"><div class="wow"><span>W</span><span>O</span><span>W</span></div></div>
  <div class="sub"><span class="mask"><span>The Acme Autumn Collection</span></span></div>
  <div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div><div class="spark s4"></div><div class="spark s5"></div><div class="spark s6"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 5 });
  // rings turn for the whole loop, one full turn each way, so t=5 matches t=0
  tl.fromTo('.ring', { rotation: 0 }, { rotation: 360, duration: 5, ease: 'none' }, 0);
  tl.fromTo('.ring2', { rotation: 0 }, { rotation: -360, duration: 5, ease: 'none' }, 0);
  tl.fromTo('.halo', { scale: 0.9 }, { scale: 1.1, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);

  // the entrance: scale and rotation together, the rotation running ahead of
  // the scale so the word screws itself into place and overshoots once
  tl.fromTo('.wow', { scale: 0, rotation: -540 }, { scale: 1, rotation: 0, duration: 1.3, ease: 'expo.out' }, 0.1)
    .fromTo('.wow', { scale: 0 }, { scale: 1, duration: 1.1, ease: 'back.out(2.2)' }, 0.25)
    // secondary: each letter takes its own late spin and lands staggered
    .fromTo('.wow span', { rotation: 180, scale: 0.6 }, { rotation: 0, scale: 1, duration: 0.9, ease: 'back.out(1.8)', stagger: 0.09 }, 0.75)
    .from('.sub .mask span', { yPercent: 110, duration: 0.7, ease: 'expo.out' }, 1.5);

  // sparks fly out on the landing
  document.querySelectorAll('.spark').forEach((s, i) => {
    const a = (i / 6) * Math.PI * 2 + 0.4;
    tl.fromTo(s, { x: 0, y: 0, scale: 0, opacity: 1 }, { x: Math.cos(a) * 380, y: Math.sin(a) * 280, scale: 1.4, opacity: 0, duration: 0.8, ease: 'expo.out' }, 1.15);
  });

  // exit: it keeps turning and blows past the camera
  tl.to('.wow', { scale: 4, rotation: 90, opacity: 0, duration: 0.7, ease: 'expo.in' }, 4.05)
    .to('.sub .mask span', { yPercent: -110, duration: 0.4, ease: 'expo.in' }, 4.1);
</script>
