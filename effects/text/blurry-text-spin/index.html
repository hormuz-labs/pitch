<!doctype html><meta charset="utf-8">
<title>Blurry Text Spin</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#050507;color:#fff;perspective:1400px}
  .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;will-change:transform}
  .o1{width:560px;height:560px;background:#ff3cac;left:120px;top:60px}
  .o2{width:520px;height:520px;background:#2b86ff;left:660px;top:180px}
  .o3{width:360px;height:360px;background:#7cffc4;left:480px;top:-120px;opacity:.5}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transform-style:preserve-3d}
  .line{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;letter-spacing:-.04em;line-height:1;will-change:transform,filter,opacity;transform-style:preserve-3d}
  .l1{font-size:150px}
  .l2{font-size:34px;font-family:"Atlas Grotesk",sans-serif;font-weight:400;letter-spacing:.02em;color:#c9cbe0;margin-top:22px}
  .pill{margin-top:34px;padding:12px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.3);font-size:16px;letter-spacing:.16em;text-transform:uppercase;backdrop-filter:blur(8px)}
</style>
<div class="stage">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="wrap">
    <div class="line l1">Spatial Audio</div>
    <div class="line l2">Sound that moves around you.</div>
    <div class="line pill">Now on Acme Music</div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 2 });
  tl.fromTo('.o1', { x: -60, y: 20 }, { x: 60, y: -20, duration: 2, ease: 'sine.inOut' }, 0)
    .fromTo('.o2', { x: 40, y: -30 }, { x: -60, y: 30, duration: 2, ease: 'sine.inOut' }, 0)
    .fromTo('.o3', { scale: .8 }, { scale: 1.2, duration: 2, ease: 'sine.inOut' }, 0);
  // the spin: text swings in from a blurred, rotated, oversized state and snaps sharp
  tl.fromTo('.l1', { rotationY: -100, rotationX: 25, z: -300, scale: 1.35, opacity: 0, filter: 'blur(28px)' },
            { rotationY: 0, rotationX: 0, z: 0, scale: 1, opacity: 1, filter: 'blur(0px)', duration: .85, ease: 'expo.out' }, 0)
    .fromTo('.l2', { rotationY: 80, z: -200, opacity: 0, filter: 'blur(18px)' },
            { rotationY: 0, z: 0, opacity: 1, filter: 'blur(0px)', duration: .8, ease: 'expo.out' }, .18)
    .fromTo('.pill', { y: 20, opacity: 0, filter: 'blur(10px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: .6, ease: 'power3.out' }, .38);
  // a slow, tiny 3D sway during the hold so it never sits still
  tl.to('.wrap', { rotationY: 6, rotationX: -3, duration: 1.0, ease: 'sine.inOut' }, .8);
  // out: spin away the other side, blurring as it goes
  tl.to('.l1', { rotationY: 90, z: -250, scale: 1.2, opacity: 0, filter: 'blur(24px)', duration: .45, ease: 'expo.in' }, 1.55)
    .to('.l2', { rotationY: -70, opacity: 0, filter: 'blur(16px)', duration: .4, ease: 'expo.in' }, 1.55)
    .to('.pill', { opacity: 0, filter: 'blur(8px)', y: -10, duration: .3, ease: 'power2.in' }, 1.6);
</script>
