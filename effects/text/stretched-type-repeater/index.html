<!doctype html><meta charset="utf-8">
<title>Stretched Type Repeater</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0e0e10}
  .col{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .row{height:64px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
  .t{display:block;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:78px;line-height:1;letter-spacing:-.05em;text-transform:uppercase;color:#f2f2f2;transform-origin:50% 50%;will-change:transform}
  .row:nth-child(odd) .t{color:#ff4d2e}
  .row.mid .t{color:#fff}
  .lbl{position:absolute;left:60px;top:44px;font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.5)}
  .lbl.r{left:auto;right:60px}
</style>
<div class="stage">
  <div class="col" id="col"></div>
  <div class="lbl">Rhythm · 001</div>
  <div class="lbl r">Acme type</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const words = ['Rhythm', 'Repeat', 'Rhythm', 'Repeat', 'Rhythm', 'Repeat', 'Rhythm', 'Repeat', 'Rhythm'];
  const col = document.getElementById('col');
  words.forEach((w, i) => {
    const r = document.createElement('div'); r.className = 'row' + (i === 4 ? ' mid' : '');
    r.innerHTML = `<span class="t">${w}</span>`; col.appendChild(r);
  });
  const rows = gsap.utils.toArray('.t');
  const tl = fx.timeline({ duration: 8 });
  const mid = 4;
  // phase 1: rows rise out of the center line, each stretched tall then snapping to size
  rows.forEach((el, i) => {
    const d = Math.abs(i - mid);
    tl.fromTo(el, { scaleY: 0.05, scaleX: 2.2, opacity: 0 }, { scaleY: 1, scaleX: 1, opacity: 1, duration: 0.9, ease: 'expo.out' }, 0.1 + d * 0.12);
  });
  // phase 2: a stretch wave travels top to bottom, twice, in beat
  for (let beat = 0; beat < 3; beat++) {
    const at = 1.6 + beat * 1.5;
    rows.forEach((el, i) => {
      tl.to(el, { scaleY: 3.4, scaleX: 0.72, duration: 0.22, ease: 'power3.in' }, at + i * 0.09)
        .to(el, { scaleY: 1, scaleX: 1, duration: 0.7, ease: 'elastic.out(1,0.45)' }, at + 0.22 + i * 0.09);
    });
    // and a horizontal drift, the stack sliding as a repeater
    tl.to('.row', { xPercent: (i) => (i % 2 ? 6 : -6) * (beat + 1), duration: 1.2, ease: 'expo.inOut', stagger: 0.03 }, at + 0.2);
  }
  // phase 3: wide stretch-out, thin, collapsing to the center line
  rows.forEach((el, i) => {
    const d = Math.abs(i - mid);
    tl.to(el, { scaleX: 3, scaleY: 0.04, opacity: 0, duration: 0.6, ease: 'expo.in' }, 7.1 + (mid - d) * 0.06);
  });
  tl.to('.row', { xPercent: 0, duration: 0.8, ease: 'expo.inOut' }, 6.6);
</script>
