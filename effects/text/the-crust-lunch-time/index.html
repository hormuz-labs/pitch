<!doctype html><meta charset="utf-8">
<title>The Crust: Lunch Time</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#c2542b;color:#fbf1dc}
  .stripe{position:absolute;left:-20%;right:-20%;height:120px;background:#fbf1dc;transform:rotate(-8deg);opacity:.12}
  .big{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;line-height:.82}
  .row{overflow:hidden;padding:0 10px}
  .w{display:block;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:270px;letter-spacing:-.07em;text-transform:uppercase;transform-origin:50% 100%;will-change:transform}
  .row.b .w{color:#c2542b;-webkit-text-stroke:5px #fbf1dc}
  .ribbon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg);background:#2a1a0e;color:#fbf1dc;font-family:"Sorts Mill Goudy",serif;font-style:italic;font-size:64px;padding:14px 44px;border-radius:8px;white-space:nowrap;transform-origin:center}
  .top{position:absolute;top:70px;left:0;right:0;text-align:center;font-size:24px;letter-spacing:.32em;text-transform:uppercase;overflow:hidden}
  .top span{display:block}
  .bot{position:absolute;bottom:70px;left:0;right:0;text-align:center;font-size:24px;letter-spacing:.32em;text-transform:uppercase;overflow:hidden}
  .bot span{display:block}
  .clock{position:absolute;right:80px;top:70px;width:90px;height:90px;border-radius:50%;border:5px solid #fbf1dc}
  .clock i{position:absolute;left:50%;top:50%;width:5px;height:34px;margin:-34px 0 0 -2px;background:#fbf1dc;transform-origin:50% 100%;border-radius:3px}
  .clock i.m{height:26px;margin-top:-26px}
</style>
<div class="stage">
  <div class="stripe" style="top:180px"></div><div class="stripe" style="top:720px"></div>
  <div class="top"><span>The Crust · Bakery</span></div>
  <div class="clock"><i class="h"></i><i class="m"></i></div>
  <div class="big">
    <div class="row a"><span class="w">Lunch</span></div>
    <div class="row b"><span class="w">Time</span></div>
  </div>
  <div class="ribbon">12 – 3 PM daily</div>
  <div class="bot"><span>Fresh sandwiches every day</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 5 });
  tl.from('.row.a .w', { yPercent: 110, scaleY: 1.8, duration: 0.7, ease: 'expo.out' }, 0.05)
    .from('.row.b .w', { yPercent: -110, scaleY: 1.8, duration: 0.7, ease: 'expo.out' }, 0.2)
    // landing punch
    .to('.w', { scaleX: 1.08, scaleY: 0.9, duration: 0.1, ease: 'power2.in' }, 0.75)
    .to('.w', { scaleX: 1, scaleY: 1, duration: 0.6, ease: 'elastic.out(1,0.4)' }, 0.85)
    .from('.ribbon', { scale: 0, rotate: 20, duration: 0.7, ease: 'back.out(2.2)' }, 0.95)
    .from('.top span', { yPercent: 120, duration: 0.6, ease: 'expo.out' }, 0.4)
    .from('.bot span', { yPercent: -120, duration: 0.6, ease: 'expo.out' }, 1.2)
    .from('.clock', { scale: 0, duration: 0.6, ease: 'back.out(2)' }, 0.6)
    .to('.clock .m', { rotate: 360, duration: 4, ease: 'none' }, 0.6)
    .to('.clock .h', { rotate: 90, duration: 4, ease: 'none' }, 0.6)
    .fromTo('.stripe', { xPercent: -8 }, { xPercent: 8, duration: 5, ease: 'none' }, 0)
    // the type bounces on a beat while it holds
    .to('.row.a .w', { yPercent: -4, duration: 0.2, yoyo: true, repeat: 3, ease: 'power2.inOut' }, 2.2)
    .to('.row.b .w', { yPercent: 4, duration: 0.2, yoyo: true, repeat: 3, ease: 'power2.inOut' }, 2.3)
    .to('.ribbon', { rotate: -2, duration: 0.8, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 1.6)
    .to('.row.a .w', { xPercent: -120, duration: 0.45, ease: 'expo.in' }, 4.4)
    .to('.row.b .w', { xPercent: 120, duration: 0.45, ease: 'expo.in' }, 4.45)
    .to('.ribbon', { scale: 0, duration: 0.35, ease: 'expo.in' }, 4.5)
    .to('.top span, .bot span, .clock', { opacity: 0, duration: 0.3 }, 4.6);
</script>
