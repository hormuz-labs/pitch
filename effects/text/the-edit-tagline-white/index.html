<!doctype html><meta charset="utf-8">
<title>The Edit: Tagline [White]</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f5f4f0;color:#111}
  .wrap{position:absolute;inset:0;padding:96px;display:flex;flex-direction:column;justify-content:center}
  .kicker{font-family:"Atlas Grotesk",sans-serif;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:#777;margin-bottom:36px;overflow:hidden;height:30px}
  .kicker span{display:block}
  .row{overflow:hidden;line-height:.95;font-size:132px;height:1.02em}
  .l{display:block;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;letter-spacing:-.04em;will-change:transform}
  .l i{font-style:normal;font-family:"Sorts Mill Goudy",serif;font-weight:400;font-style:italic;letter-spacing:0}
  .bar{position:absolute;left:96px;right:96px;top:50%;height:14px;background:#111;transform:translateY(-50%);transform-origin:left center}
  .sub{margin-top:40px;display:flex;gap:28px;font-family:"Atlas Grotesk",sans-serif;font-size:26px;color:#444}
  .sub .m{overflow:hidden}.sub .m span{display:block}
  .corner{position:absolute;font-family:"Atlas Grotesk",sans-serif;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:#999}
  .c1{left:96px;top:72px}.c2{right:96px;top:72px}.c3{left:96px;bottom:72px}.c4{right:96px;bottom:72px}
</style>
<div class="stage">
  <div class="bar"></div>
  <div class="corner c1">Northwind</div><div class="corner c2">Edition 02</div>
  <div class="corner c3">Spring</div><div class="corner c4">2026</div>
  <div class="wrap">
    <div class="kicker"><span>The new tagline</span></div>
    <div class="row"><span class="l">Less noise,</span></div>
    <div class="row"><span class="l">more <i>signal</i>.</span></div>
    <div class="sub"><div class="m"><span>01 — Design</span></div><div class="m"><span>02 — Craft</span></div><div class="m"><span>03 — Focus</span></div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 5 });
  // a black bar wipes across, then thins away as the type rises beneath it
  tl.from('.bar', { scaleX: 0, duration: .8, ease: 'expo.inOut' }, 0)
    .to('.bar', { scaleY: 0, duration: .5, ease: 'expo.inOut' }, .85)
    .from('.kicker span', { yPercent: 110, duration: .6, ease: 'expo.out' }, .8)
    .from('.l', { yPercent: 110, duration: .9, ease: 'expo.out', stagger: .12 }, .95)
    .from('.sub .m span', { yPercent: 110, duration: .6, ease: 'expo.out', stagger: .08 }, 1.4)
    .from('.corner', { opacity: 0, duration: .5, stagger: .08 }, 1.2)
    // a slow settle: the whole block eases left a few px, the italic breathes
    .from('.wrap', { x: 24, duration: 2.2, ease: 'power2.out' }, 1.0)
    .fromTo('.l i', { skewX: 0 }, { skewX: -6, duration: 1.6, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.6)
    // exit: bar returns from the right and wipes it clean
    .to('.l', { yPercent: -110, duration: .5, ease: 'expo.in', stagger: .08 }, 4.15)
    .to('.kicker span, .sub .m span', { yPercent: -110, duration: .4, ease: 'expo.in', stagger: .04 }, 4.25)
    .to('.corner', { opacity: 0, duration: .3 }, 4.5)
    .fromTo('.bar', { scaleY: 1, scaleX: 0, transformOrigin: 'right center' }, { scaleX: 1, duration: .45, ease: 'expo.inOut' }, 4.45)
    .to('.bar', { scaleX: 0, transformOrigin: 'left center', duration: .12, ease: 'power1.in' }, 4.9);
</script>
