<!doctype html><meta charset="utf-8">
<title>Countdown: Bold</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#111;color:#fff}
  .bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#2a2a33,#0c0c0f 70%)}
  .n{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:520px;line-height:1;letter-spacing:-.06em;will-change:transform,filter,opacity;opacity:0}
  .n.go{font-size:300px;color:#ffd23f;letter-spacing:-.03em}
  svg.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  .ring circle{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round}
  .flash{position:absolute;inset:0;background:#fff;opacity:0}
  .sub{position:absolute;left:0;right:0;bottom:64px;text-align:center;font-size:18px;letter-spacing:.24em;text-transform:uppercase;color:#9a9aa8}
</style>
<div class="stage">
  <div class="bg"></div>
  <svg class="ring" width="600" height="600" viewBox="0 0 600 600"><circle id="ring" cx="300" cy="300" r="280" transform="rotate(-90 300 300)"/></svg>
  <div class="n" id="n3">3</div><div class="n" id="n2">2</div><div class="n" id="n1">1</div><div class="n go" id="go">GO</div>
  <div class="flash"></div>
  <div class="sub">Launching — stay tuned</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 4 });
  ['#n3', '#n2', '#n1'].forEach((id, i) => {
    const t = i;
    tl.fromTo(id, { scale: 2.6, opacity: 0, filter: 'blur(30px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: .45, ease: 'expo.out' }, t)
      .to(id, { scale: .92, duration: .35, ease: 'none' }, t + .45)
      .to(id, { scale: .6, opacity: 0, filter: 'blur(14px)', duration: .22, ease: 'expo.in' }, t + .8);
    tl.fromTo('#ring', { drawSVG: '0%' }, { drawSVG: '100%', duration: .95, ease: 'power1.inOut' }, t);
    tl.fromTo('.bg', { scale: 1 }, { scale: 1.03, duration: .5, ease: 'expo.out' }, t);
  });
  tl.fromTo('#go', { scale: .3, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: .5, ease: 'back.out(2.5)' }, 3)
    .fromTo('.flash', { opacity: .9 }, { opacity: 0, duration: .5, ease: 'power2.out', immediateRender: false }, 3)
    .to('#ring', { stroke: '#ffd23f', duration: .2 }, 3)
    .fromTo('#ring', { drawSVG: '0%' }, { drawSVG: '100%', duration: .5, ease: 'expo.out' }, 3)
    .to('#go', { scale: 1.06, duration: .3, ease: 'none' }, 3.5)
    .to('#go', { scale: 1.6, opacity: 0, filter: 'blur(16px)', duration: .22, ease: 'expo.in' }, 3.78)
    .to('#ring', { opacity: 0, duration: .2 }, 3.8);
  tl.from('.sub', { opacity: 0, y: 10, duration: .5 }, .2).to('.sub', { opacity: 0, duration: .2 }, 3.8);
</script>
