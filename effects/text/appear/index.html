<!doctype html><meta charset="utf-8">
<title>Appear</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f4f3ef}
  .card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:560px;padding:52px 56px;border-radius:24px;background:#fff;box-shadow:0 30px 80px rgba(20,20,30,.08),0 1px 0 rgba(0,0,0,.04)}
  .tag{display:inline-block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#6b6f80;padding:6px 12px;border:1px solid #e3e3e8;border-radius:999px}
  h1{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:44px;letter-spacing:-.03em;line-height:1.05;margin-top:22px;color:#121318}
  p{margin-top:16px;font-size:18px;line-height:1.5;color:#5c5f6e}
  .btn{margin-top:28px;display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:12px;background:#121318;color:#fff;font-size:16px;font-weight:500}
  .btn i{width:8px;height:8px;border-top:2px solid #fff;border-right:2px solid #fff;transform:rotate(45deg);display:block}
  .el{will-change:transform,opacity,filter}
</style>
<div class="stage">
  <div class="card">
    <span class="tag el">Antinomy</span>
    <h1 class="el">Quietly better,<br>every release.</h1>
    <p class="el">Small improvements shipped weekly. Nothing loud, nothing in the way.</p>
    <span class="btn el">See what's new <i></i></span>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 2 });
  tl.from('.card', { y: 10, opacity: 0, duration: .9, ease: 'power2.out' }, 0)
    .from('.el', { y: 10, opacity: 0, filter: 'blur(6px)', duration: .8, stagger: .11, ease: 'power2.out' }, 0.12)
    // hold with an almost invisible breath, then leave the same way
    .to('.card', { y: -2, duration: .6, ease: 'sine.inOut' }, 1.0)
    .to('.el', { y: -6, opacity: 0, filter: 'blur(4px)', duration: .4, stagger: .04, ease: 'power2.in' }, 1.55)
    .to('.card', { opacity: 0, duration: .3, ease: 'power2.in' }, 1.7);
</script>
