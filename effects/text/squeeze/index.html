<!doctype html><meta charset="utf-8">
<title>Squeeze</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f5f1ea}
  .card{position:absolute;left:50%;top:50%;width:520px;height:300px;margin:-150px 0 0 -260px;border-radius:32px;background:#fff;box-shadow:0 30px 60px rgba(40,30,10,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transform-origin:50% 100%;will-change:transform}
  .title{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:56px;letter-spacing:-.04em;color:#111;transform-origin:50% 100%;will-change:transform}
  .btn{padding:16px 40px;border-radius:999px;background:#ff5a36;color:#fff;font-size:22px;font-weight:500;transform-origin:50% 100%;will-change:transform}
  .dots{position:absolute;left:50%;bottom:120px;display:flex;gap:16px;transform:translateX(-50%)}
  .dot{width:20px;height:20px;border-radius:50%;background:#111;transform-origin:50% 100%}
  .hand{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:3px solid #111;background:rgba(255,90,54,.35);opacity:0}
</style>
<div class="stage">
  <div class="card">
    <div class="title">Squeeze me</div>
    <div class="btn">Press & hold</div>
  </div>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="hand"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 1 });
  // press: the card is compressed flat and wide, then releases with an elastic snap-back
  tl.to('.hand', { opacity: 1, scale: 0.7, duration: 0.1 }, 0.05)
    .to('.card', { scaleY: 0.62, scaleX: 1.18, duration: 0.18, ease: 'power3.in' }, 0.05)
    .to('.title', { scaleY: 0.7, scaleX: 1.25, duration: 0.18, ease: 'power3.in' }, 0.05)
    .to('.btn', { scaleY: 0.5, scaleX: 1.4, duration: 0.18, ease: 'power3.in' }, 0.07)
    .to('.hand', { opacity: 0, scale: 1.6, duration: 0.25 }, 0.25)
    .to('.card', { scaleY: 1, scaleX: 1, duration: 0.7, ease: 'elastic.out(1.2,0.35)' }, 0.25)
    .to('.title', { scaleY: 1, scaleX: 1, duration: 0.7, ease: 'elastic.out(1.2,0.32)' }, 0.27)
    .to('.btn', { scaleY: 1, scaleX: 1, duration: 0.7, ease: 'elastic.out(1.3,0.3)' }, 0.29)
    // the dots catch the shock, in sequence
    .to('.dot', { scaleY: 0.4, scaleX: 1.5, duration: 0.08, stagger: 0.04, ease: 'power2.in' }, 0.23)
    .to('.dot', { scaleY: 1, scaleX: 1, duration: 0.5, stagger: 0.04, ease: 'elastic.out(1,0.35)' }, 0.31);
</script>
