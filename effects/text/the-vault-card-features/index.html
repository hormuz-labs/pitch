<!doctype html><meta charset="utf-8">
<title>The Vault: Card Features</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0c0d10;color:#f2f2f5;font-family:"Atlas Grotesk",sans-serif;perspective:1600px}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
  .card{position:relative;width:640px;height:400px;border-radius:28px;background:linear-gradient(135deg,#1f2230,#0f1117);border:1px solid #2c3040;box-shadow:0 40px 80px rgba(0,0,0,.6);transform-style:preserve-3d;overflow:hidden}
  .card .sheen{position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%)}
  .card .chip{position:absolute;left:40px;top:44px;width:64px;height:48px;border-radius:8px;background:linear-gradient(135deg,#e8c56a,#b08a2e)}
  .card .brand{position:absolute;right:40px;top:40px;font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:26px;letter-spacing:.02em}
  .card .num{position:absolute;left:40px;bottom:96px;font-size:30px;letter-spacing:.14em;font-variant-numeric:tabular-nums}
  .card .name{position:absolute;left:40px;bottom:44px;font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:#a7abbb}
  .card .exp{position:absolute;right:40px;bottom:44px;font-size:18px;letter-spacing:.12em;color:#a7abbb}
  .card .circ{position:absolute;right:40px;bottom:96px;width:44px;height:44px;border-radius:50%;background:#e35d2b}
  .card .circ2{position:absolute;right:66px;bottom:96px;width:44px;height:44px;border-radius:50%;background:#f4a340;opacity:.9}
  .layers{width:640px;display:flex;flex-direction:column;gap:12px}
  .feat{background:#15171e;border:1px solid #262a36;border-radius:18px;padding:20px 24px;display:flex;align-items:center;gap:18px;transform-origin:50% 0}
  .feat .ic{width:44px;height:44px;border-radius:12px;background:#1f2330;display:flex;align-items:center;justify-content:center;flex:none}
  .feat .ic i{display:block;width:18px;height:18px;border-radius:50%;background:#7fe0a0}
  .feat .ic.b i{background:#7c9cff;border-radius:4px}
  .feat .ic.c i{background:#ffd166;border-radius:2px;transform:rotate(45deg)}
  .feat .tx{display:flex;flex-direction:column;gap:4px;overflow:hidden}
  .feat b{font-size:22px;font-weight:500;display:block}
  .feat small{font-size:16px;color:#8b90a3;display:block}
  .feat .val{margin-left:auto;font-size:22px;color:#7fe0a0;font-variant-numeric:tabular-nums}
  .head{position:absolute;left:0;right:0;top:80px;text-align:center;font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:44px;letter-spacing:-.02em;overflow:hidden;height:54px}
  .head span{display:block}
</style>
<div class="stage">
  <div class="head"><span>Everything in one card</span></div>
  <div class="wrap">
    <div class="card">
      <div class="sheen"></div><div class="chip"></div><div class="brand">VAULT</div>
      <div class="num">•••• •••• •••• 4821</div><div class="name">A. Northwind</div><div class="exp">09/29</div>
      <div class="circ2"></div><div class="circ"></div>
    </div>
    <div class="layers">
      <div class="feat"><div class="ic"><i></i></div><div class="tx"><b>2% cashback</b><small>On every purchase, no caps</small></div><div class="val">+$248</div></div>
      <div class="feat"><div class="ic b"><i></i></div><div class="tx"><b>Zero FX fees</b><small>Spend in 150+ currencies</small></div><div class="val">$0</div></div>
      <div class="feat"><div class="ic c"><i></i></div><div class="tx"><b>Instant freeze</b><small>Lock the card from the app</small></div><div class="val">On</div></div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  // the card tilts in from a flat 3D lie, the sheen sweeps, then feature layers stack out beneath it
  tl.from('.head span', { yPercent: 110, duration: .6, ease: 'expo.out' }, 0)
    .fromTo('.card', { rotationX: 70, y: 180, opacity: 0, scale: .9 }, { rotationX: 0, y: 0, opacity: 1, scale: 1, duration: 1, ease: 'move' }, .1)
    .fromTo('.card .sheen', { xPercent: -60 }, { xPercent: 60, duration: 1.1, ease: 'power2.inOut' }, .3)
    .from('.card .num, .card .name, .card .exp', { opacity: 0, y: 8, duration: .5, stagger: .08 }, .6)
    .from('.feat', { y: -40, opacity: 0, scaleY: .6, duration: .7, ease: 'expo.out', stagger: .14 }, .8)
    .from('.feat .tx > *', { yPercent: 110, duration: .5, ease: 'expo.out', stagger: .05 }, 1.0)
    .from('.feat .val', { opacity: 0, x: 12, duration: .4, stagger: .14 }, 1.15)
    .from('.feat .ic i', { scale: 0, duration: .5, ease: 'back.out(3)', stagger: .14 }, 1.0);
  // hold: the card breathes on its axis, the cashback value counts up
  tl.to('.card', { rotationY: -14, rotationX: 6, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.2)
    .to({ v: 0 }, { v: 248, duration: 1.2, ease: 'power2.out', onUpdate() { document.querySelector('.feat .val').textContent = '+$' + Math.round(this.targets()[0].v); } }, 1.2);
  // exit: layers fold back into the card, card flips away
  tl.to('.feat', { y: -30, opacity: 0, scaleY: .6, duration: .35, ease: 'power3.in', stagger: { each: .07, from: 'end' } }, 3.2)
    .to('.card', { rotationX: -70, y: -120, opacity: 0, duration: .45, ease: 'power3.in' }, 3.45)
    .to('.head span', { yPercent: -110, duration: .3, ease: 'expo.in' }, 3.6);
</script>
