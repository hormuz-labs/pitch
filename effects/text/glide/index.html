<!doctype html><meta charset="utf-8">
<title>Glide</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0e0f14;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform;mix-blend-mode:screen}
  .b1{width:720px;height:720px;left:120px;top:-120px;background:radial-gradient(circle,#4d6bff 0%,rgba(77,107,255,0) 70%)}
  .b2{width:640px;height:640px;left:560px;top:180px;background:radial-gradient(circle,#ff6a9a 0%,rgba(255,106,154,0) 70%)}
  .b3{width:520px;height:520px;left:820px;top:-160px;background:radial-gradient(circle,#4fe3c1 0%,rgba(79,227,193,0) 70%)}
  .grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay;pointer-events:none}
  .title{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:"Sorts Mill Goudy",serif;font-weight:400;font-size:190px;line-height:1;color:#f4f2ee;font-style:italic;white-space:nowrap}
  .title span{display:inline-block;will-change:transform,opacity}
  .line{position:absolute;left:50%;top:50%;height:1px;width:640px;margin-left:-320px;background:linear-gradient(90deg,rgba(244,242,238,0),#f4f2ee,rgba(244,242,238,0));transform-origin:50% 50%}
  .l1{margin-top:-140px}.l2{margin-top:128px}
  .cap{position:absolute;left:0;right:0;bottom:80px;text-align:center;font-family:"Atlas Grotesk",sans-serif;font-size:16px;letter-spacing:.42em;text-transform:uppercase;color:rgba(244,242,238,.6)}
  .ring{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;border:1px solid rgba(244,242,238,.16);will-change:transform}
</style>
<div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <svg class="grain" width="100%" height="100%"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1 0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  <div class="ring"></div>
  <div class="line l1"></div>
  <div class="title"><span>G</span><span>l</span><span>i</span><span>d</span><span>e</span></div>
  <div class="line l2"></div>
  <div class="cap">Antinomy · Studio</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  // a fully periodic loop: every value is a sine of t over the 3s period, so frame 0 == frame 90
  const D = 3, TAU = Math.PI * 2;
  const blobs = gsap.utils.toArray('.blob');
  const chars = gsap.utils.toArray('.title span');
  fx.register({
    duration: D,
    seek(t) {
      const p = (t / D) * TAU;
      gsap.set('.b1', { x: Math.sin(p) * 140, y: Math.cos(p) * 60, scale: 1 + Math.sin(p + 1) * 0.08 });
      gsap.set('.b2', { x: Math.cos(p + 0.8) * -160, y: Math.sin(p * 1) * 80, scale: 1 + Math.cos(p) * 0.1 });
      gsap.set('.b3', { x: Math.sin(p + 2.2) * 120, y: Math.cos(p + 2.2) * 110, scale: 1 + Math.sin(p + 3) * 0.12 });
      chars.forEach((c, i) => {
        const ph = p - i * 0.55;
        gsap.set(c, { y: Math.sin(ph) * 22, x: Math.sin(ph * 1) * 6, rotate: Math.sin(ph + 1) * 1.5, opacity: 0.86 + Math.sin(ph) * 0.14 });
      });
      gsap.set('.l1', { x: Math.sin(p) * 220, scaleX: 0.8 + Math.cos(p) * 0.25 });
      gsap.set('.l2', { x: Math.sin(p + Math.PI) * 220, scaleX: 0.8 + Math.cos(p + Math.PI) * 0.25 });
      gsap.set('.ring', { scale: 1 + Math.sin(p) * 0.06, rotate: (t / D) * 360, skewY: Math.sin(p) * 3 });
      gsap.set('.cap', { letterSpacing: (0.42 + Math.sin(p) * 0.06) + 'em', opacity: 0.55 + Math.sin(p) * 0.15 });
    }
  });
</script>
