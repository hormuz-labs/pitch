<!doctype html><meta charset="utf-8">
<title>Bouncy Period</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f6f1e7;color:#141414}
  .line{position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);display:flex;align-items:baseline;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:190px;letter-spacing:-.05em;line-height:1}
  .dot{display:inline-block;width:46px;height:46px;border-radius:50%;background:#ff4d2e;margin-left:14px;transform-origin:50% 100%;will-change:transform;position:relative;top:-6px}
  .shadow{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);width:46px;height:10px;border-radius:50%;background:rgba(0,0,0,.18);transform-origin:center}
  .cap{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);font-size:16px;letter-spacing:.22em;text-transform:uppercase;color:#8a857b}
</style>
<div class="stage">
  <div class="line"><span class="w">Loading</span><span class="dotwrap" style="position:relative"><span class="dot"></span><span class="shadow"></span></span></div>
  <div class="cap">Just a moment</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/CustomEase.min.js"></script>
<script src="../../../assets/gsap/CustomBounce.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(CustomEase, CustomBounce);
  CustomBounce.create('drop', { strength: .62, squash: 3, squashID: 'drop-squash' });
  const tl = fx.timeline({ duration: 4 });
  tl.from('.w', { yPercent: 40, opacity: 0, duration: .7, ease: 'expo.out' }, 0);
  // drop 1: the period falls from above the frame, bounces and settles
  tl.fromTo('.dot', { y: -420 }, { y: 0, duration: 1.4, ease: 'drop' }, .2)
    .fromTo('.dot', { scaleX: 1, scaleY: 1 }, { scaleX: 1.5, scaleY: .55, duration: 1.4, ease: 'drop-squash' }, .2)
    .fromTo('.shadow', { scale: .3, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.4, ease: 'drop' }, .2);
  // two springy hops
  for (const t of [1.9, 2.75]) {
    tl.to('.dot', { y: -150, duration: .32, ease: 'move' }, t)
      .to('.dot', { y: 0, duration: .5, ease: 'drop' }, t + .32)
      .to('.dot', { scaleX: .82, scaleY: 1.18, duration: .2, ease: 'power2.out' }, t)
      .to('.dot', { scaleX: 1.4, scaleY: .6, duration: .5, ease: 'drop-squash' }, t + .32)
      .to('.shadow', { scale: .55, opacity: .5, duration: .32, ease: 'power2.out' }, t)
      .to('.shadow', { scale: 1, opacity: 1, duration: .5, ease: 'drop' }, t + .32);
  }
  tl.to('.w', { yPercent: -40, opacity: 0, duration: .35, ease: 'expo.in' }, 3.65)
    .to('.dot', { y: -420, duration: .35, ease: 'power2.in' }, 3.65)
    .to('.shadow', { opacity: 0, scale: .3, duration: .3 }, 3.65);
</script>
