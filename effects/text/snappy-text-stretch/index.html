<!doctype html><meta charset="utf-8">
<title>Snappy Text Stretch</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#e8ff47}
  .stack{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .row{overflow:hidden;line-height:.85;padding:0 30px}
  .line{display:block;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:190px;letter-spacing:-.06em;text-transform:uppercase;color:#111;transform-origin:50% 100%;will-change:transform}
  .row:nth-child(2) .line{color:#e8ff47;-webkit-text-stroke:4px #111}
  .badge{position:absolute;right:90px;top:80px;width:150px;height:150px;border-radius:50%;border:4px solid #111;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;letter-spacing:.18em;text-transform:uppercase;line-height:1.3;color:#111;transform-origin:center}
  .tag{position:absolute;left:90px;bottom:70px;font-size:22px;letter-spacing:.26em;text-transform:uppercase;color:#111;overflow:hidden}
  .tag span{display:block}
</style>
<div class="stage">
  <div class="stack">
    <div class="row"><span class="line">Official</span></div>
    <div class="row"><span class="line">Selection</span></div>
  </div>
  <div class="badge">Acme<br>Film<br>Fest</div>
  <div class="tag"><span>Opening night · 8 PM</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 2 });
  // each line is stretched tall and thin from below, then snaps to true proportions
  tl.fromTo('.row:nth-child(1) .line', { yPercent: 110, scaleY: 3.2, scaleX: 0.7 }, { yPercent: 0, scaleY: 1, scaleX: 1, duration: 0.55, ease: 'move' }, 0.05)
    .fromTo('.row:nth-child(2) .line', { yPercent: 110, scaleY: 3.2, scaleX: 0.7 }, { yPercent: 0, scaleY: 1, scaleX: 1, duration: 0.55, ease: 'move' }, 0.2)
    // a horizontal punch: stretch wide and snap back
    .to('.line', { scaleX: 1.25, scaleY: 0.85, duration: 0.12, ease: 'power2.in', stagger: 0.06 }, 0.8)
    .to('.line', { scaleX: 1, scaleY: 1, duration: 0.45, ease: 'elastic.out(1,0.5)', stagger: 0.06 }, 0.92)
    .from('.badge', { scale: 0, rotate: -90, duration: 0.6, ease: 'back.out(2)' }, 0.35)
    .to('.badge', { rotate: 30, duration: 1.4, ease: 'none' }, 0.6)
    .from('.tag span', { yPercent: 120, duration: 0.5, ease: 'expo.out' }, 0.5)
    // exit: squash flat and drop
    .to('.line', { scaleY: 0.05, yPercent: 60, duration: 0.25, ease: 'expo.in', stagger: 0.05 }, 1.6)
    .to('.badge', { scale: 0, duration: 0.25, ease: 'expo.in' }, 1.65)
    .to('.tag span', { yPercent: -120, duration: 0.25, ease: 'expo.in' }, 1.65);
</script>
