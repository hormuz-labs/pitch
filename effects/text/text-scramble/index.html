<!doctype html><meta charset="utf-8">
<title>Text Scramble</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#050507}
  .bg{position:absolute;inset:0;background:url("../../../assets/backgrounds/sunset.png") center/cover;opacity:.45;filter:contrast(1.3) saturate(.8)}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,#000 100%)}
  .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 5px);opacity:.6}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  .kick{font-size:20px;letter-spacing:.4em;text-transform:uppercase;color:#e50914;font-weight:500}
  .title{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:150px;letter-spacing:-.02em;text-transform:uppercase;color:#fff;line-height:1;min-height:150px;white-space:nowrap;padding:0 20px}
  .date{font-size:28px;letter-spacing:.2em;text-transform:uppercase;color:#fff;font-family:"Atlas Grotesk",sans-serif;min-height:34px}
  .bar{position:absolute;left:50%;bottom:110px;width:360px;height:3px;margin-left:-180px;background:rgba(255,255,255,.2)}
  .bar i{display:block;height:100%;width:100%;background:#e50914;transform-origin:left}
</style>
<div class="stage">
  <div class="bg"></div><div class="vig"></div><div class="scan"></div>
  <div class="center">
    <div class="kick">Acme Originals</div>
    <div class="title">XQ#ZK&amp;WPBLN</div>
    <div class="date">01/9 3/ 74//205.8/1</div>
  </div>
  <div class="bar"><i></i></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/ScrambleTextPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(ScrambleTextPlugin);
  const tl = fx.timeline({ duration: 2 });
  tl.from('.kick', { opacity: 0, letterSpacing: '1em', duration: 0.6, ease: 'expo.out' }, 0)
    .fromTo('.title', { opacity: 0.8 }, { scrambleText: { text: 'Coming soon', chars: 'upperCase', speed: 1.4, revealDelay: 0.15, tweenLength: false }, opacity: 1, duration: 1.0, ease: 'none' }, 0.1)
    .to('.date', { scrambleText: { text: 'Only on Northwind+', chars: '0123456789/.', speed: 1.2, revealDelay: 0.3, tweenLength: false }, duration: 0.9, ease: 'none' }, 0.5)
    .fromTo('.bar i', { scaleX: 0 }, { scaleX: 1, duration: 1.5, ease: 'power1.inOut' }, 0.2)
    .to('.bg', { scale: 1.06, duration: 2, ease: 'none' }, 0)
    // a flicker as it locks, then a scramble-out
    .to('.title', { opacity: 0.3, duration: 0.04, repeat: 3, yoyo: true }, 1.15)
    .to('.title', { scrambleText: { text: '', chars: 'upperCase', speed: 1.5, tweenLength: true }, duration: 0.35, ease: 'none' }, 1.65)
    .to('.date, .kick', { opacity: 0, duration: 0.25 }, 1.7)
    .to('.bar', { opacity: 0, duration: 0.2 }, 1.8);
</script>
