<!doctype html><meta charset="utf-8">
<title>Blend Modes: Mode Showcase</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#15151a;color:#fff}
  .grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:18px;padding:60px 80px 56px}
  .tile{position:relative;border-radius:22px;background:#26262e;overflow:hidden;isolation:isolate}
  .tile.light{background:#e9e6df}
  .s{position:absolute;width:150px;height:150px;border-radius:50%;left:50%;top:50%;margin:-75px 0 0 -75px;will-change:transform}
  .a{background:#ff3d7f}.b{background:#28c7ff}.c{background:#ffd23f;border-radius:26px;width:120px;height:120px;margin:-60px 0 0 -60px}
  .tile .b,.tile .c{mix-blend-mode:var(--m)}
  .lbl{position:absolute;left:20px;bottom:16px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.45);color:#fff}
  .light .lbl{background:rgba(0,0,0,.75)}
  .title{position:absolute;left:80px;top:20px;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#8a8a96}
</style>
<div class="stage">
  <div class="title">Blend modes — six ways to overlap</div>
  <div class="grid">
    <div class="tile" style="--m:screen"><div class="s a"></div><div class="s b"></div><div class="s c"></div><div class="lbl">Screen</div></div>
    <div class="tile light" style="--m:multiply"><div class="s a"></div><div class="s b"></div><div class="s c"></div><div class="lbl">Multiply</div></div>
    <div class="tile" style="--m:difference"><div class="s a"></div><div class="s b"></div><div class="s c"></div><div class="lbl">Difference</div></div>
    <div class="tile light" style="--m:overlay"><div class="s a"></div><div class="s b"></div><div class="s c"></div><div class="lbl">Overlay</div></div>
    <div class="tile" style="--m:exclusion"><div class="s a"></div><div class="s b"></div><div class="s c"></div><div class="lbl">Exclusion</div></div>
    <div class="tile light" style="--m:hard-light"><div class="s a"></div><div class="s b"></div><div class="s c"></div><div class="lbl">Hard light</div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 4;
  const tl = fx.timeline({ duration: D });
  tl.from('.tile', { scale: .85, opacity: 0, y: 30, duration: .7, stagger: { each: .08, grid: [2, 3], from: 'start' }, ease: 'expo.out' }, 0)
    .from('.lbl', { y: 12, opacity: 0, duration: .5, stagger: .08, ease: 'power3.out' }, .35)
    .to('.tile', { scale: .9, opacity: 0, y: -20, duration: .35, stagger: .05, ease: 'power2.in' }, D - .55);
  // shapes orbit continuously: one full revolution per loop so it seams
  const orbit = { p: 0 };
  tl.to(orbit, { p: 1, duration: D, ease: 'none', onUpdate() {
    const ph = orbit.p * Math.PI * 2;
    document.querySelectorAll('.tile').forEach((tile, i) => {
      const o = i * Math.PI / 3;
      gsap.set(tile.querySelector('.a'), { x: Math.cos(ph + o) * 55, y: Math.sin(ph + o) * 32 });
      gsap.set(tile.querySelector('.b'), { x: Math.cos(ph + o + Math.PI) * 55, y: Math.sin(ph + o + Math.PI) * 32 });
      gsap.set(tile.querySelector('.c'), { x: Math.sin(ph * 2 + o) * 40, y: Math.cos(ph + o) * -50, rotation: orbit.p * 360 });
    });
  } }, 0);
</script>
