<!doctype html><meta charset="utf-8">
<title>The Harvest: Orange Float</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#ff5a2b}
  .stack{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:"Sorts Mill Goudy",serif;font-size:196px;line-height:.9;color:#fff2d6}
  .row{clip-path:inset(0 -600px);height:.95em;position:relative;z-index:2}
  .row.mid{z-index:0}
  .l{display:block;will-change:transform}
  .orange{position:absolute;left:50%;top:50%;width:250px;height:250px;margin:-125px 0 0 -125px;z-index:1;will-change:transform}
  .orange svg{overflow:visible}
  .badge{position:absolute;left:80px;top:80px;font-family:"Atlas Grotesk",sans-serif;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:#fff2d6}
  .badge2{left:auto;right:80px;text-align:right}
  .foot{position:absolute;left:0;right:0;bottom:80px;text-align:center;font-family:"Atlas Grotesk",sans-serif;font-size:26px;color:#fff2d6;overflow:hidden;height:34px}
  .foot span{display:block}
  .bubble{position:absolute;border-radius:50%;background:rgba(255,242,214,.25)}
</style>
<div class="stage">
  <div class="bubble" style="left:120px;top:800px;width:40px;height:40px"></div>
  <div class="bubble" style="left:900px;top:700px;width:26px;height:26px"></div>
  <div class="bubble" style="left:200px;top:300px;width:18px;height:18px"></div>
  <div class="bubble" style="left:860px;top:260px;width:54px;height:54px"></div>
  <div class="badge">Acme Juice Co</div><div class="badge badge2">No sugar<br>added</div>
  <div class="stack">
    <div class="row"><span class="l">Squeeze</span></div>
    <div class="row mid"><span class="l">the</span></div>
    <div class="row"><span class="l">Morning</span></div>
  </div>
  <div class="orange"><svg viewBox="0 0 100 100" width="250" height="250">
    <defs><radialGradient id="g" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#ffc24a"/><stop offset=".6" stop-color="#ff9a1f"/><stop offset="1" stop-color="#e8721a"/></radialGradient></defs>
    <circle cx="50" cy="52" r="44" fill="url(#g)"/>
    <circle cx="50" cy="52" r="44" fill="none" stroke="#fff2d6" stroke-width="1.5" opacity=".5"/>
    <g class="leaf"><path d="M52 12 c 10 -14 30 -12 34 -2 c -12 8 -24 8 -34 2z" fill="#3f9a4a"/><path d="M52 12 c 8 -6 18 -8 30 -6" stroke="#2c7a36" stroke-width="1.5" fill="none"/></g>
    <circle cx="50" cy="10" r="3" fill="#5a3a1e"/>
  </svg></div>
  <div class="foot"><span>Cold-pressed · Bottled the same day</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 6 });
  // the headline stacks in; the orange rises from below and floats between the lines
  tl.from('.l', { yPercent: 110, duration: .9, ease: 'expo.out', stagger: .12 }, 0)
    .from('.badge', { opacity: 0, y: -10, duration: .6, stagger: .1 }, .5)
    .from('.foot span', { yPercent: 110, duration: .6, ease: 'expo.out' }, .7)
    .fromTo('.orange', { y: 700, rotation: -40, scale: .8 }, { y: 0, rotation: 0, scale: 1, duration: 1.3, ease: 'expo.out' }, .45)
    // the middle word yields as the orange arrives
    .to('.row.mid .l', { x: -250, duration: .8, ease: 'expo.out' }, .9)
    // the float: a slow bob + tilt, two full cycles, drifting left-right through the line
    .to('.orange', { y: -28, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: 2 }, 1.6)
    .to('.orange', { rotation: 14, duration: 2.1, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.6)
    .to('.orange', { x: 90, duration: 4.2, ease: 'sine.inOut' }, 1.5)
    .to('.row.mid .l', { x: -290, duration: 4.2, ease: 'sine.inOut' }, 1.5)
    .to('.leaf', { rotation: -10, transformOrigin: '0% 100%', duration: 1.2, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 1.4);
  // bubbles rise all loop
  tl.fromTo('.bubble', { y: 120, opacity: 0 }, { y: -320, opacity: 1, duration: 6, ease: 'none', stagger: .4 }, 0);
  // exit: orange drops through the frame, lines slide out
  tl.to('.orange', { y: 800, rotation: 60, duration: .55, ease: 'power3.in' }, 5.3)
    .to('.l', { yPercent: -110, duration: .45, ease: 'expo.in', stagger: .07 }, 5.4)
    .to('.foot span', { yPercent: -110, duration: .35, ease: 'expo.in' }, 5.5)
    .to('.badge', { opacity: 0, duration: .3 }, 5.6);
</script>
