<!doctype html><meta charset="utf-8">
<title>Type Trail</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0d0d10}
  .grid{position:absolute;inset:-10%;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:80px 80px}
  .word{position:absolute;inset:0;display:grid;place-items:center}
  .layer{position:absolute;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:230px;letter-spacing:-.05em;line-height:1;text-transform:uppercase;color:#fff;white-space:nowrap;will-change:transform}
  .layer.g{filter:url(#smear)}
  .w2 .layer{color:#ff4d6d}
  .w3 .layer{color:#7cf2c4}
  .tag{position:absolute;left:56px;bottom:44px;font-size:16px;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.45)}
  .tag b{color:#fff;font-weight:500}
  svg.defs{position:absolute;width:0;height:0}
</style>
<div class="stage">
  <svg class="defs"><filter id="smear" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22 1"/></filter></svg>
  <div class="grid"></div>
  <div class="word w1"></div>
  <div class="word w2"></div>
  <div class="word w3"></div>
  <div class="tag"><b>Acme</b> &nbsp;·&nbsp; Kinetic Type</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const GHOSTS = 6;
  function build(sel, text) {
    const host = document.querySelector(sel);
    const layers = [];
    for (let i = GHOSTS; i >= 0; i--) {
      const s = document.createElement('span');
      s.className = 'layer' + (i ? ' g' : '');
      s.textContent = text;
      if (i) s.style.opacity = (0.55 - i * 0.075).toFixed(2);
      host.appendChild(s);
      layers[i] = s;
    }
    return layers;
  }
  const W1 = build('.w1', 'Kinetic'), W2 = build('.w2', 'Type'), W3 = build('.w3', 'Trail');

  const tl = fx.timeline({ duration: 4 });
  tl.fromTo('.grid', { x: 0, y: 0 }, { x: -80, y: -80, duration: 4, ease: 'none' }, 0);

  // a move: the main glyph leads, each ghost repeats the same path a beat later,
  // which is what draws the smear behind it
  function move(layers, from, to, at, dur, ease, lag) {
    layers.forEach((el, i) => tl.fromTo(el, from, { ...to, duration: dur, ease, immediateRender: false }, at + i * lag));
  }
  // skew reads as velocity on the lead glyph
  function skew(layers, from, at, dur) {
    tl.fromTo(layers[0], { skewX: from }, { skewX: 0, duration: dur, ease: 'expo.out' }, at);
  }
  gsap.set(W1, { xPercent: -170, yPercent: 0 });
  gsap.set(W2, { xPercent: 0, yPercent: 320 });
  gsap.set(W3, { xPercent: 170, yPercent: 0 });

  // 1. KINETIC rushes in from the left
  move(W1, { xPercent: -170 }, { xPercent: 0 }, 0.05, 0.75, 'expo.out', 0.035);
  skew(W1, -28, 0.05, 0.75);
  // 2. it shoots up and out, TYPE drops in from below
  move(W1, { yPercent: 0 }, { yPercent: -320 }, 1.15, 0.45, 'expo.in', 0.03);
  move(W2, { yPercent: 320 }, { yPercent: 0 }, 1.3, 0.7, 'expo.out', 0.035);
  tl.fromTo(W2[0], { scaleY: 1.25 }, { scaleY: 1, duration: 0.5, ease: 'expo.out' }, 1.55);
  // 3. TYPE exits left, TRAIL enters from the right
  move(W2, { xPercent: 0 }, { xPercent: -170 }, 2.25, 0.45, 'expo.in', 0.03);
  move(W3, { xPercent: 170 }, { xPercent: 0 }, 2.4, 0.7, 'expo.out', 0.035);
  skew(W3, 26, 2.4, 0.7);
  // 4. TRAIL leaves the way it came so the loop starts on an empty stage
  move(W3, { xPercent: 0 }, { xPercent: 170 }, 3.4, 0.4, 'expo.in', 0.03);
  tl.to(W3[0], { skewX: 18, duration: 0.4, ease: 'expo.in' }, 3.4);
</script>
