<!doctype html><meta charset="utf-8">
<title>The Route: Logo Reveal</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0f1b2d}
  svg.map{position:absolute;inset:0;width:100%;height:100%}
  .dots circle{fill:#27405f}
  .path{fill:none;stroke:#ffd166;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .glow{fill:none;stroke:#ffd166;stroke-width:16;stroke-linecap:round;opacity:.18;filter:url(#b)}
  .stop{fill:#0f1b2d;stroke:#ffd166;stroke-width:3}
  .logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:22px}
  .mark{width:86px;height:86px;position:relative}
  .mark svg{width:100%;height:100%;overflow:visible}
  .name{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:72px;letter-spacing:-.03em;color:#fff;overflow:hidden;height:84px}
  .name span{display:block}
  .tag{position:absolute;left:0;right:0;top:calc(50% + 60px);text-align:center;font-family:"Atlas Grotesk",sans-serif;font-size:20px;letter-spacing:.3em;text-transform:uppercase;color:#8fa3bf;overflow:hidden;height:28px}
  .tag span{display:block}
  .plane{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px}
</style>
<div class="stage">
  <svg class="map" viewBox="0 0 1280 720">
    <defs><filter id="b"><feGaussianBlur stdDeviation="6"/></filter></defs>
    <g class="dots" id="dots"></g>
    <path id="glow" class="glow" d="M80 620 C 200 560, 260 420, 360 380 S 520 460, 620 400 S 760 200, 900 260 S 1100 240, 1200 120"/>
    <path id="path" class="path" d="M80 620 C 200 560, 260 420, 360 380 S 520 460, 620 400 S 760 200, 900 260 S 1100 240, 1200 120"/>
    <circle class="stop" cx="80" cy="620" r="9"/><circle class="stop s2" cx="360" cy="380" r="9"/><circle class="stop s3" cx="620" cy="400" r="9"/><circle class="stop s4" cx="900" cy="260" r="9"/><circle class="stop s5" cx="1200" cy="120" r="9"/>
  </svg>
  <div class="plane"><svg viewBox="0 0 44 44"><path d="M22 4 l 6 16 l 12 6 v 4 l -12 -2 l -2 8 l 5 3 v 3 l -9 -2 l -9 2 v -3 l 5 -3 l -2 -8 l -12 2 v -4 l 12 -6 z" fill="#ffd166"/></svg></div>
  <div class="logo">
    <div class="mark"><svg viewBox="0 0 86 86"><circle class="ring" cx="43" cy="43" r="38" fill="none" stroke="#ffd166" stroke-width="5"/><path class="arrow" d="M20 58 L 43 22 L 66 58 L 43 46 Z" fill="#ffd166"/></svg></div>
    <div class="name"><span>Northwind</span></div>
  </div>
  <div class="tag"><span>Go further</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../../assets/gsap/MotionPathPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin);
  let s = ''; for (let y = 20; y < 720; y += 36) for (let x = 20; x < 1280; x += 36) s += `<circle cx="${x}" cy="${y}" r="2"/>`;
  document.getElementById('dots').innerHTML = s;
  const mr = document.querySelector('.mark').getBoundingClientRect();
  const MX = mr.left + mr.width / 2, MY = mr.top + mr.height / 2;
  const tl = fx.timeline({ duration: 5 });
  // the route draws itself across the frame with a plane riding the tip, stops lighting as it passes
  tl.from('.dots circle', { opacity: 0, duration: .6, stagger: { each: .0008, from: 'start' } }, 0)
    .from('.stop', { scale: 0, transformOrigin: 'center', duration: .4, ease: 'back.out(3)', stagger: .45 }, .2)
    .fromTo('#path', { drawSVG: '0%' }, { drawSVG: '100%', duration: 2.2, ease: 'power2.inOut' }, .2)
    .fromTo('#glow', { drawSVG: '0%' }, { drawSVG: '100%', duration: 2.2, ease: 'power2.inOut' }, .2)
    .to('.plane', { motionPath: { path: '#path', align: '#path', alignOrigin: [.5, .5], autoRotate: 90 }, duration: 2.2, ease: 'power2.inOut' }, .2)
    // arrival: the line erases from its tail into the last stop, which becomes the logo's ring
    .to('#path, #glow', { drawSVG: '100% 100%', duration: .6, ease: 'power3.in' }, 2.3)
    .to('.plane', { scale: 0, duration: .25, ease: 'power2.in' }, 2.65)
    .to('.dots circle', { opacity: .35, duration: .6 }, 2.4)
    .to('.stop:not(.s5)', { scale: 0, transformOrigin: 'center', duration: .3, ease: 'power2.in', stagger: .04 }, 2.35)
    // the last stop pulls to centre and blooms into the mark
    .to('.stop.s5', { attr: { cx: MX, cy: MY, r: 38 }, duration: .55, ease: 'expo.inOut', scale: 1 }, 2.55)
    .to('.stop.s5', { opacity: 0, duration: .1 }, 3.1)
    .from('.mark .ring', { drawSVG: '0%', duration: .5, ease: 'power2.out' }, 2.95)
    .from('.mark .arrow', { scale: 0, transformOrigin: 'center', rotation: -90, duration: .6, ease: 'back.out(2)' }, 3.1)
    .from('.name span', { yPercent: 110, duration: .7, ease: 'expo.out' }, 3.25)
    .from('.tag span', { yPercent: 110, duration: .6, ease: 'expo.out' }, 3.5)
    // exit: the logo rides off along the arrow's heading
    .to('.logo', { y: -40, opacity: 0, duration: .4, ease: 'power3.in' }, 4.6)
    .to('.tag span', { yPercent: -110, duration: .3, ease: 'expo.in' }, 4.6)
    .to('.dots circle', { opacity: 0, duration: .3 }, 4.7);
</script>
