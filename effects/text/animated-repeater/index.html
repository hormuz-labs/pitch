<!doctype html><meta charset="utf-8">
<title>Animated Repeater</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101014}
  .grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(20,1fr);grid-template-rows:repeat(11,1fr);padding:30px;gap:0;opacity:.7}
  .cell{display:grid;place-items:center}
  .dot{width:36px;height:36px;border-radius:9px;background:#ffd23f;will-change:transform,opacity}
  .mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:110px;letter-spacing:-.04em;color:#fff;z-index:2}
</style>
<div class="stage"><div class="grid" id="grid"></div><div class="mark">Northwind</div></div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const COLS = 20, ROWS = 11, D = 5;
  const grid = document.getElementById('grid');
  const cells = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const cell = document.createElement('div'); cell.className = 'cell';
    const dot = document.createElement('div'); dot.className = 'dot';
    cell.appendChild(dot); grid.appendChild(cell);
    const dx = c - (COLS - 1) / 2, dy = (r - (ROWS - 1) / 2) * 1.2;
    cells.push({ el: dot, d: Math.hypot(dx, dy), ang: Math.atan2(dy, dx), r, c });
  }
  const palette = ['#ffd23f', '#ff6b8b', '#5b6bff', '#2fd3a5'];
  fx.register({
    duration: D,
    seek(t) {
      const ph = (t / D) * Math.PI * 2;           // one full cycle per loop
      for (const k of cells) {
        // two radial waves travelling out from the centre, plus a slow spin of the pattern
        const w1 = Math.sin(ph * 2 - k.d * 0.55);
        const w2 = Math.sin(ph - k.d * 0.25 + k.ang * 2);
        const s = 0.15 + 0.85 * (0.5 + 0.5 * w1) * (0.6 + 0.4 * (0.5 + 0.5 * w2));
        const rot = 45 * w1 + (ph * 180 / Math.PI) * 0.5 * 0; // rotation follows the wave
        const ci = Math.floor(((k.ang + Math.PI) / (Math.PI * 2) * 4 + t / D * 4 + 8)) % 4;
        k.el.style.transform = `scale(${s.toFixed(3)}) rotate(${rot.toFixed(1)}deg)`;
        k.el.style.opacity = (0.35 + 0.65 * (0.5 + 0.5 * w1)).toFixed(3);
        k.el.style.background = palette[ci];
      }
    },
  });
</script>
