<!doctype html><meta charset="utf-8">
<title>Glitchy Text Reveal</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0d0d0d}
  .stripe{position:absolute;left:-200px;right:-200px;height:140px;background:#c8ff00;transform:rotate(-8deg);top:470px;will-change:transform}
  .stack{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
  .line{position:relative;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:196px;line-height:.88;letter-spacing:-.04em;text-transform:uppercase;color:#fff;will-change:transform}
  .line.k{color:#0d0d0d}
  .line .s{position:absolute;inset:0;color:inherit;will-change:transform,clip-path}
  .line .s.a{color:#c8ff00;mix-blend-mode:screen}
  .line .s.b{color:#ff2d95;mix-blend-mode:screen}
  .line.k .s.a{color:#fff}
  .meta{position:absolute;left:0;right:0;bottom:96px;display:flex;justify-content:center;gap:40px;font-family:"Atlas Grotesk",sans-serif;font-weight:500;font-size:26px;letter-spacing:.3em;text-transform:uppercase;color:#c8ff00}
  .meta span{will-change:transform,opacity}
  .top{position:absolute;left:0;right:0;top:96px;text-align:center;font-family:"Atlas Grotesk",sans-serif;font-weight:500;font-size:22px;letter-spacing:.4em;text-transform:uppercase;color:#fff;opacity:.7}
</style>
<div class="stage">
  <div class="stripe"></div>
  <div class="top">Northwind Run Club</div>
  <div class="stack">
    <div class="line" data-t="Sunday"><span class="s a">Sunday</span><span class="s b">Sunday</span>Sunday</div>
    <div class="line k" data-t="7AM"><span class="s a">7AM</span><span class="s b">7AM</span>7AM</div>
    <div class="line" data-t="RSVP"><span class="s a">RSVP</span><span class="s b">RSVP</span>RSVP</div>
  </div>
  <div class="meta"><span>Free</span><span>·</span><span>10K</span><span>·</span><span>Link in bio</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 2 });
  const rnd = fx.rng(77);
  const lines = gsap.utils.toArray('.line');
  tl.fromTo('.stripe', { xPercent: -8, scaleX: 1.05 }, { xPercent: 8, scaleX: 1.05, duration: 2, ease: 'none' }, 0);
  lines.forEach((el, i) => {
    const at = 0.08 + i * 0.16;
    // slam in, stepped (glitchy) not smooth
    tl.fromTo(el, { xPercent: i % 2 ? 60 : -60, opacity: 0 }, { xPercent: 0, opacity: 1, duration: 0.3, ease: 'steps(5)' }, at);
    // slices tear apart in stepped bursts, then lock in
    const a = el.querySelector('.s.a'), b = el.querySelector('.s.b');
    for (let k = 0; k < 6; k++) {
      const t = at + 0.05 + k * 0.055;
      const top = Math.floor(rnd() * 70), h = 10 + Math.floor(rnd() * 35);
      const top2 = Math.floor(rnd() * 70), h2 = 10 + Math.floor(rnd() * 35);
      tl.set(a, { clipPath: `inset(${top}% 0 ${Math.max(0, 100 - top - h)}% 0)`, x: (rnd() - 0.5) * 90, opacity: 1 }, t)
        .set(b, { clipPath: `inset(${top2}% 0 ${Math.max(0, 100 - top2 - h2)}% 0)`, x: (rnd() - 0.5) * 90, opacity: 1 }, t);
    }
    tl.set([a, b], { opacity: 0 }, at + 0.05 + 6 * 0.055);
    // a mid-loop twitch
    tl.set(a, { clipPath: 'inset(30% 0 40% 0)', x: 34, opacity: 1 }, 1.15 + i * 0.03)
      .set(b, { clipPath: 'inset(55% 0 20% 0)', x: -30, opacity: 1 }, 1.15 + i * 0.03)
      .set(el, { x: 8 }, 1.15 + i * 0.03)
      .set([a, b], { opacity: 0 }, 1.22 + i * 0.03).set(el, { x: 0 }, 1.22 + i * 0.03);
    // stepped exit
    tl.to(el, { xPercent: i % 2 ? -60 : 60, opacity: 0, duration: 0.22, ease: 'steps(4)' }, 1.66 + i * 0.06);
  });
  tl.from('.meta span', { y: 30, opacity: 0, duration: 0.25, ease: 'steps(3)', stagger: 0.04 }, 0.55)
    .to('.meta span', { opacity: 0, duration: 0.15, ease: 'steps(2)', stagger: 0.02 }, 1.72);
  tl.from('.top', { opacity: 0, duration: 0.2, ease: 'steps(2)' }, 0.1).to('.top', { opacity: 0, duration: 0.15, ease: 'steps(2)' }, 1.8);
</script>
