<!doctype html><meta charset="utf-8">
<title>Morph: Lines To Text</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b0d12}
  canvas{position:absolute;inset:0;width:100%;height:100%}
</style>
<div class="stage"><canvas id="c" width="1280" height="720"></canvas></div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const W = 1280, H = 720, D = 1, STEP = 7;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const FONT = '500 280px "Sharp Grotesk", "Atlas Grotesk", sans-serif';
  fx.wait(document.fonts.load(FONT));
  const rnd = fx.rng(9);
  let segs = null;
  // scan the text mask row by row into horizontal runs: those runs are the "lines" of the text
  function build() {
    const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
    const o = oc.getContext('2d');
    o.font = FONT; o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = '#fff';
    o.fillText('DATA', W / 2, H / 2);
    const img = o.getImageData(0, 0, W, H).data;
    const out = [];
    for (let y = 0; y < H; y += STEP) {
      let x = 0;
      while (x < W) {
        while (x < W && img[(y * W + x) * 4 + 3] < 128) x++;
        const x0 = x;
        while (x < W && img[(y * W + x) * 4 + 3] >= 128) x++;
        if (x > x0 + 2) out.push({ x0, x1: x, y });
      }
    }
    // the origin state: a stack of long horizontal rules spread over the frame; each run comes from one of them
    const LINES = 14;
    out.forEach((s, i) => {
      const li = Math.floor(rnd() * LINES);
      s.sy = 60 + li * ((H - 120) / (LINES - 1));
      const len = s.x1 - s.x0;
      s.sx0 = rnd() * (W - len) ; s.sx1 = s.sx0 + len;
      s.sl = 40 + rnd() * 500;   // starting length is different: a long rule
      s.sx1 = s.sx0 + s.sl;
      s.d = rnd() * 0.25;        // stagger
    });
    return out;
  }
  const easeIO = gsap.parseEase('expo.inOut');
  fx.register({
    duration: D,
    seek(t) {
      if (!segs) segs = build();
      ctx.fillStyle = '#0b0d12'; ctx.fillRect(0, 0, W, H);
      // 0→0.5 assemble, hold to 0.72, 0.72→1 fly back to rules
      for (const s of segs) {
        let p;
        if (t < 0.55) p = Math.max(0, Math.min(1, (t - s.d) / 0.3));
        else if (t < 0.72) p = 1;
        else p = 1 - Math.max(0, Math.min(1, (t - 0.72 - s.d * 0.6) / 0.16));
        p = easeIO(p);
        const x0 = s.sx0 + (s.x0 - s.sx0) * p, x1 = s.sx1 + (s.x1 - s.sx1) * p;
        const y = s.sy + (s.y - s.sy) * p;
        ctx.strokeStyle = p > 0.98 ? '#f4f5f7' : `hsl(${205 + p * 30} 90% ${60 + p * 25}%)`;
        ctx.lineWidth = STEP - 1.5;
        ctx.lineCap = 'butt';
        ctx.beginPath(); ctx.moveTo(x0, y + STEP / 2); ctx.lineTo(x1, y + STEP / 2); ctx.stroke();
      }
    }
  });
</script>
