<!doctype html><meta charset="utf-8">
<title>The Edit: Product Launch</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0d0d0f;color:#fff}
  .cut{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .cut .w{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:190px;letter-spacing:-.06em;text-transform:uppercase;line-height:.9;white-space:nowrap}
  .c1{background:#0d0d0f}.c2{background:#e8ff47;color:#0d0d0f}.c3{background:#0d0d0f}.c4{background:#ff4d2e}
  .count{position:absolute;left:60px;bottom:50px;font-size:18px;letter-spacing:.3em;text-transform:uppercase;opacity:.6}
  .reveal{position:absolute;inset:0;background:#f4f4f2;color:#0d0d0f;display:flex;align-items:center;justify-content:center;gap:80px}
  .product{width:300px;height:300px;border-radius:40px;background:linear-gradient(145deg,#1d1d20,#0d0d0f);box-shadow:0 40px 80px rgba(0,0,0,.35);position:relative;transform-origin:center;display:flex;align-items:center;justify-content:center}
  .product .lens{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#3b3b44,#101014 70%);border:6px solid #2a2a30}
  .product .lens::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#7cf0c8,#1a5c4a)}
  .product .dot{position:absolute;right:26px;top:26px;width:14px;height:14px;border-radius:50%;background:#ff4d2e}
  .copy{display:flex;flex-direction:column;gap:14px;overflow:hidden}
  .copy .k{font-size:18px;letter-spacing:.3em;text-transform:uppercase;color:#ff4d2e}
  .copy .h{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:96px;letter-spacing:-.05em;line-height:.95}
  .copy .s{font-size:24px;color:#555}
  .copy .btn{align-self:flex-start;margin-top:10px;background:#0d0d0f;color:#fff;padding:16px 32px;border-radius:999px;font-size:20px;font-weight:500}
  .flash{position:absolute;inset:0;background:#fff;opacity:0}
  .c2,.c3,.c4,.reveal{visibility:hidden;opacity:0}
</style>
<div class="stage">
  <div class="cut c1"><span class="w">Something</span></div>
  <div class="cut c2"><span class="w">Is</span></div>
  <div class="cut c3"><span class="w">Coming</span></div>
  <div class="cut c4"><span class="w">Now.</span></div>
  <div class="reveal">
    <div class="product"><div class="lens"></div><div class="dot"></div></div>
    <div class="copy"><span class="k">Introducing</span><span class="h">Acme Orbit</span><span class="s">The camera that sees around corners.</span><span class="btn">Pre-order today</span></div>
  </div>
  <div class="flash"></div>
  <div class="count">Launch · 09.09</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 6 });
  // hard cuts that accelerate: 1.0s, 0.7s, 0.5s, 0.3s → reveal
  const cuts = [['.c1', 0, 1.0, 'y'], ['.c2', 1.0, 0.7, 'x'], ['.c3', 1.7, 0.5, 'y'], ['.c4', 2.2, 0.35, 'x']];
  cuts.forEach(([sel, at, len, axis], i) => {
    if (i) tl.set(sel, { autoAlpha: 1, immediateRender: false }, at);
    const w = sel + ' .w';
    if (axis === 'y') tl.fromTo(w, { yPercent: 110 }, { yPercent: 0, duration: Math.min(0.45, len * 0.6), ease: 'expo.out' }, at);
    else tl.fromTo(w, { xPercent: -110 }, { xPercent: 0, duration: Math.min(0.45, len * 0.6), ease: 'expo.out' }, at);
    tl.to(w, { scale: 1.06, duration: len, ease: 'none' }, at);
    tl.set(sel, { autoAlpha: 0, immediateRender: false }, at + len);
  });
  tl.set('.reveal', { autoAlpha: 1, immediateRender: false }, 2.55)
    .fromTo('.flash', { opacity: 1 }, { opacity: 0, duration: 0.5, ease: 'power2.out', immediateRender: false }, 2.55)
    .from('.product', { scale: 0.3, rotate: -25, duration: 0.9, ease: 'expo.out' }, 2.55)
    .to('.product', { rotate: 6, y: -10, duration: 1.6, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 3.4)
    .from('.copy > *', { yPercent: 130, opacity: 0, stagger: 0.09, duration: 0.7, ease: 'expo.out' }, 2.8)
    .from('.count', { opacity: 0, duration: 0.4 }, 3.0)
    .to('.product', { scale: 0.3, rotate: 25, opacity: 0, duration: 0.4, ease: 'expo.in' }, 5.5)
    .to('.copy > *', { yPercent: -130, opacity: 0, stagger: 0.04, duration: 0.35, ease: 'expo.in' }, 5.5)
    .to('.reveal', { autoAlpha: 0, duration: 0.15 }, 5.85)
    .to('.count', { opacity: 0, duration: 0.2 }, 5.7);
</script>
