<!doctype html><meta charset="utf-8">
<title>The Harvest: Banana Spin</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f7e86a}
  .word{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Sorts Mill Goudy",serif;font-size:300px;line-height:1;color:#1e2a1a;letter-spacing:-.02em}
  .ch{display:inline-block;will-change:transform}
  .banana{position:absolute;left:50%;top:50%;width:520px;height:260px;margin:-130px 0 0 -260px;will-change:transform}
  .tag{position:absolute;left:64px;bottom:56px;font-family:"Atlas Grotesk",sans-serif;font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:#1e2a1a;overflow:hidden;height:32px}
  .tag span{display:block}
  .tag2{left:auto;right:64px}
  .ring{position:absolute;left:50%;top:50%;width:640px;height:640px;margin:-320px 0 0 -320px;border:3px solid #1e2a1a;border-radius:50%;opacity:.35}
</style>
<div class="stage">
  <div class="ring"></div>
  <div class="word"><span class="ch">R</span><span class="ch">I</span><span class="ch">P</span><span class="ch">E</span></div>
  <svg class="banana" viewBox="0 0 520 260">
    <path d="M40 60 C 120 220, 330 250, 480 150 C 500 140, 505 160, 490 175 C 340 300, 90 260, 22 92 C 12 70, 28 48, 40 60 Z" fill="#ffd93b" stroke="#1e2a1a" stroke-width="10" stroke-linejoin="round"/>
    <path d="M60 80 C 140 210, 320 230, 460 150" fill="none" stroke="#e0b52a" stroke-width="10" stroke-linecap="round"/>
    <path d="M470 152 l 28 -14 l 8 18" fill="#6b4a12" stroke="#1e2a1a" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="36" cy="66" r="10" fill="#6b4a12" stroke="#1e2a1a" stroke-width="6"/>
  </svg>
  <div class="tag"><span>Fresh — Harvest 2026</span></div>
  <div class="tag tag2"><span>Acme Farms</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 10 });
  const rng = fx.rng(7);
  // letters drop in with a serif bounce
  tl.from('.ch', { yPercent: -160, rotation: () => rng() * 20 - 10, duration: .9, ease: 'bounce.out', stagger: .1 }, 0)
    .from('.tag span', { yPercent: 110, duration: .6, ease: 'expo.out', stagger: .1 }, .6)
    .from('.ring', { scale: .6, opacity: 0, duration: 1.2, ease: 'expo.out' }, .2);
  // the banana: enters from the left spinning, flies through the lettering,
  // parks between the letters, then spins slowly the rest of the loop
  tl.fromTo('.banana', { x: -1100, y: 60, rotation: -540, scale: .7 }, { x: 0, y: 0, rotation: 0, scale: 1, duration: 1.4, ease: 'move' }, .9);
  // the letters it passes through get shoved aside and settle back
  tl.to('.ch', { xPercent: (i) => (i < 2 ? -34 : 34), duration: .45, ease: 'expo.out', stagger: { each: .05, from: 'center' } }, 1.55)
    .to('.ch', { xPercent: (i) => (i < 2 ? -26 : 26), duration: .8, ease: 'elastic.out(1,.5)', stagger: { each: .03, from: 'center' } }, 2.0);
  // continuous spin, a full turn every ~3s, with a gentle float
  tl.to('.banana', { rotation: 720, duration: 6.4, ease: 'power1.inOut' }, 2.3)
    .to('.banana', { y: -22, duration: 1.6, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 2.3)
    .to('.ring', { rotation: 180, duration: 8, ease: 'none' }, 1);
  // exit: banana flicks out to the right, letters close back and drop
  tl.to('.banana', { x: 1200, rotation: '+=360', duration: .6, ease: 'expo.in' }, 8.9)
    .to('.ch', { xPercent: 0, duration: .5, ease: 'expo.inOut', stagger: { each: .03, from: 'center' } }, 9.05)
    .to('.ch', { yPercent: 160, duration: .45, ease: 'power3.in', stagger: .05 }, 9.45)
    .to('.tag span', { yPercent: -110, duration: .35, ease: 'expo.in' }, 9.5)
    .to('.ring', { scale: 1.3, opacity: 0, duration: .5, ease: 'power2.in' }, 9.5);
</script>
