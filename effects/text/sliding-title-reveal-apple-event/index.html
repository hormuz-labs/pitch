<!doctype html><meta charset="utf-8">
<title>Sliding Title Reveal [Apple Event]</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#000}
  .glow{position:absolute;left:50%;top:50%;width:1100px;height:520px;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(120,80,255,.55),rgba(255,90,160,.25) 40%,rgba(0,0,0,0) 70%);filter:blur(40px);will-change:transform,opacity}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  .kicker{font-size:26px;letter-spacing:.02em;color:#a1a1a6;overflow:hidden;height:36px}
  .kicker span{display:block}
  .title{overflow:hidden;padding:0 20px 12px}
  .title .line{display:flex;gap:.22em;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:132px;letter-spacing:-.045em;line-height:1.05;white-space:nowrap}
  .title .w{display:inline-block;background:linear-gradient(90deg,#fff 0%,#e5e0ff 55%,#ffb7d5 100%);-webkit-background-clip:text;background-clip:text;color:transparent;will-change:transform,filter}
  .sub{font-size:30px;color:#f5f5f7;letter-spacing:-.01em;overflow:hidden;height:40px}
  .sub span{display:block}
  .dateline{position:absolute;bottom:64px;left:0;right:0;text-align:center;font-size:20px;color:#6e6e73;letter-spacing:.08em;text-transform:uppercase}
  .logo{position:absolute;top:56px;left:50%;width:44px;height:44px;margin-left:-22px;border-radius:14px;background:linear-gradient(135deg,#fff,#bbb)}
</style>
<div class="stage">
  <div class="glow"></div>
  <div class="logo"></div>
  <div class="center">
    <div class="kicker"><span>Introducing</span></div>
    <div class="title"><div class="line"><span class="w">Acme</span><span class="w">Vision</span><span class="w">Pro</span></div></div>
    <div class="sub"><span>The next chapter begins.</span></div>
  </div>
  <div class="dateline">Special event · September 9</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  tl.fromTo('.glow', { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.6, ease: 'power2.out' }, 0)
    .to('.glow', { scale: 1.15, xPercent: 6, duration: 2.4, ease: 'sine.inOut' }, 1.6)
    .from('.logo', { scale: 0, opacity: 0, duration: 0.8, ease: 'expo.out' }, 0.1)
    .from('.kicker span', { yPercent: 120, duration: 0.8, ease: 'expo.out' }, 0.35)
    // title words slide up from behind the clip, soft blur clearing as they land
    .from('.title .w', { yPercent: 115, filter: 'blur(14px)', stagger: 0.12, duration: 1.1, ease: 'expo.out' }, 0.5)
    .from('.sub span', { yPercent: 120, duration: 0.8, ease: 'expo.out' }, 1.15)
    .from('.dateline', { opacity: 0, y: 12, duration: 0.7, ease: 'power2.out' }, 1.4)
    // exit slides everything left, keynote cut
    .to('.title .w', { xPercent: -40, opacity: 0, stagger: 0.05, duration: 0.5, ease: 'expo.in' }, 3.3)
    .to('.kicker span, .sub span', { yPercent: -120, duration: 0.4, ease: 'expo.in' }, 3.35)
    .to('.dateline, .logo', { opacity: 0, duration: 0.3 }, 3.5)
    .to('.glow', { opacity: 0, scale: 0.7, duration: 0.5, ease: 'power2.in' }, 3.45);
</script>
