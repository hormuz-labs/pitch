<!doctype html><meta charset="utf-8">
<title>The Harvest: Peach Plunge</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#ffd7c2}
  .poster{position:absolute;inset:0;padding:110px 80px;display:flex;flex-direction:column}
  .kicker{font-family:"Atlas Grotesk",sans-serif;font-size:26px;letter-spacing:.24em;text-transform:uppercase;color:#7a3a2a;display:flex;justify-content:space-between;overflow:hidden;height:34px}
  .kicker span{display:block}
  .head{margin-top:140px;font-family:"Sorts Mill Goudy",serif;font-size:250px;line-height:.86;color:#5a1f16}
  .row{overflow:hidden;height:.92em}
  .l{display:block}
  .l.i{font-style:italic;padding-left:.35em}
  .body{margin-top:70px;max-width:620px;font-family:"Atlas Grotesk",sans-serif;font-size:30px;line-height:1.4;color:#7a3a2a}
  .body p{overflow:hidden}.body p span{display:block}
  .pool{position:absolute;left:0;right:0;bottom:0;height:560px;background:#ff8c5a;transform-origin:50% 100%}
  .pool2{position:absolute;left:0;right:0;bottom:0;height:520px;background:#ff7444;transform-origin:50% 100%}
  .wave{position:absolute;left:-10%;width:120%;bottom:520px;height:60px}
  .peach{position:absolute;left:50%;top:0;width:360px;height:360px;margin-left:-180px;will-change:transform}
  .splash{position:absolute;left:50%;bottom:520px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#fff2e8;opacity:0}
  .ring{position:absolute;left:50%;bottom:400px;width:300px;height:110px;margin-left:-150px;border:6px solid #fff2e8;border-radius:50%;opacity:0}
  .foot{position:absolute;left:80px;right:80px;bottom:90px;display:flex;justify-content:space-between;font-family:"Atlas Grotesk",sans-serif;font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:#fff2e8}
</style>
<div class="stage">
  <div class="poster">
    <div class="kicker"><span>Acme Orchards</span><span>No. 04</span></div>
    <div class="head">
      <div class="row"><span class="l">Dive</span></div>
      <div class="row"><span class="l i">into</span></div>
      <div class="row"><span class="l">Peach</span></div>
    </div>
    <div class="body"><p><span>Stone fruit, pressed at dawn and bottled before noon. Sweet, sunlit, gone by August.</span></p></div>
  </div>
  <div class="pool"></div>
  <svg class="wave" viewBox="0 0 1200 60" preserveAspectRatio="none"><path class="wp" d="M0 30 Q 150 0 300 30 T 600 30 T 900 30 T 1200 30 V 60 H 0 Z" fill="#ff7444"/></svg>
  <div class="pool2"></div>
  <div class="ring"></div>
  <div class="peach"><svg viewBox="0 0 100 100" width="360" height="360" style="overflow:visible">
    <defs><radialGradient id="pg" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffd27a"/><stop offset=".55" stop-color="#ff9a5a"/><stop offset="1" stop-color="#e8552f"/></radialGradient></defs>
    <path d="M50 92 C 20 92, 6 68, 8 46 C 10 24, 28 12, 50 22 C 72 12, 90 24, 92 46 C 94 68, 80 92, 50 92 Z" fill="url(#pg)"/>
    <path d="M50 22 C 44 40, 44 70, 50 92" stroke="#d9552f" stroke-width="2.5" fill="none" opacity=".7"/>
    <path d="M50 22 c 6 -14 22 -18 30 -10 c -8 10 -20 12 -30 10z" fill="#5fae3f"/>
  </svg></div>
  <div class="splash s1"></div><div class="splash s2"></div><div class="splash s3"></div><div class="splash s4"></div><div class="splash s5"></div><div class="splash s6"></div>
  <div class="foot"><span>Summer edition</span><span>330 ml</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 8 });
  const rng = fx.rng(11);
  // the pool rises, the poster type lands, then the peach plunges and splashes
  tl.from('.pool, .pool2', { yPercent: 100, duration: 1.2, ease: 'move', stagger: .1 }, 0)
    .from('.wave', { yPercent: 200, duration: 1.2, ease: 'move' }, .1)
    .from('.kicker span', { yPercent: 110, duration: .6, ease: 'move', stagger: .1 }, .3)
    .from('.l', { yPercent: 110, duration: 1, ease: 'move', stagger: .14 }, .4)
    .from('.body p span', { yPercent: 110, duration: .8, ease: 'move' }, .95)
    .from('.foot span', { opacity: 0, y: 10, duration: .5, stagger: .1 }, 1.4);
  // the wave keeps rolling the whole loop
  tl.fromTo('.wave', { x: 0 }, { x: -300, duration: 8, ease: 'none' }, 0);
  // peach: fall from above, accelerate, plunge below the waterline
  tl.fromTo('.peach', { y: -400, rotation: -20 }, { y: 1150, rotation: 25, duration: 1.1, ease: 'power3.in' }, 1.9)
    .to('.peach', { y: 2200, rotation: 40, duration: 1.2, ease: 'power1.out' }, 3.0).to('.peach', { opacity: 0, duration: .5 }, 3.2)
    // the water reacts: a bulge, then ripple rings and droplets
    .to('.pool2', { scaleY: 1.06, duration: .18, ease: 'power2.out' }, 2.95)
    .to('.pool2', { scaleY: 1, duration: 1.2, ease: 'elastic.out(1,.35)' }, 3.13)
    .to('.wave', { scaleY: 2.2, transformOrigin: '50% 100%', duration: .2, ease: 'power2.out' }, 2.95)
    .to('.wave', { scaleY: 1, duration: 1.4, ease: 'elastic.out(1,.3)' }, 3.15)
    .fromTo('.ring', { scale: .2, opacity: 1 }, { scale: 1.8, opacity: 0, duration: 1.4, ease: 'power2.out' }, 3.0);
  document.querySelectorAll('.splash').forEach((el, i) => {
    const a = -Math.PI / 2 + (i - 2.5) * .35 + (rng() - .5) * .2;
    const v = 500 + rng() * 300;
    tl.fromTo(el, { x: 0, y: 0, opacity: 1, scale: 1 + rng() * 1.5 },
      { x: Math.cos(a) * v * .9, y: Math.sin(a) * v, opacity: .9, duration: .5, ease: 'move' }, 2.98)
      .to(el, { y: '+=500', opacity: 0, duration: .55, ease: 'power2.in' }, 3.48);
  });
  // the type shudders on impact
  tl.to('.head', { y: 14, duration: .1, ease: 'power2.out' }, 2.98)
    .to('.head', { y: 0, duration: .9, ease: 'elastic.out(1,.3)' }, 3.08);
  // hold with a slow headline drift, then the pool drains and the type leaves
  tl.to('.head', { x: -14, duration: 3, ease: 'sine.inOut' }, 4)
    .to('.l', { yPercent: -110, duration: .5, ease: 'expo.in', stagger: .08 }, 7.1)
    .to('.body p span, .kicker span', { yPercent: -110, duration: .4, ease: 'expo.in' }, 7.25)
    .to('.pool, .pool2, .wave', { yPercent: 110, duration: .6, ease: 'expo.in', stagger: .04 }, 7.3)
    .to('.foot span', { opacity: 0, duration: .3 }, 7.4);
</script>
