<!doctype html><meta charset="utf-8">
<title>Text Extrusion</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#1a1030;perspective:1400px}
  .bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,#3a2470,#1a1030 65%)}
  .scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d}
  .rig{position:relative;transform-style:preserve-3d;will-change:transform}
  .layer{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:200px;letter-spacing:-.04em;text-transform:uppercase;white-space:nowrap;color:#5a2fa8;line-height:1}
  .layer.front{color:#ffe36e;position:relative;left:auto;top:auto;transform:none}
  .sub{position:absolute;left:0;right:0;bottom:80px;text-align:center;font-size:20px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.55)}
  .floor{position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.5),transparent 60%);transform:rotateX(85deg) translateZ(-160px)}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="scene">
    <div class="floor"></div>
    <div class="rig" id="rig"><span class="layer front">Depth</span></div>
  </div>
  <div class="sub">Extruded · 48 layers</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const rig = document.getElementById('rig');
  const N = 48, STEP = 4;
  const layers = [];
  for (let i = 1; i <= N; i++) {
    const s = document.createElement('span'); s.className = 'layer'; s.textContent = 'Depth';
    const k = i / N;
    s.style.color = `hsl(${268 - k * 20},60%,${38 - k * 24}%)`;
    rig.insertBefore(s, rig.firstChild);
    layers.push(s);
  }
  const tl = fx.timeline({ duration: 3 });
  // the extrusion grows out of the flat face while the rig turns to reveal the side
  tl.set(layers, { z: 0 })
    .from('.layer.front', { opacity: 0, scale: 0.8, duration: 0.5, ease: 'expo.out' }, 0)
    .to(layers, { z: (i) => -(i + 1) * STEP, duration: 1.0, ease: 'expo.out', stagger: { each: 0.008, from: 'start' } }, 0.25)
    .fromTo(rig, { rotateY: 0, rotateX: 0 }, { rotateY: -38, rotateX: 14, duration: 1.2, ease: 'power3.inOut' }, 0.25)
    .to(rig, { rotateY: 34, rotateX: -10, duration: 1.2, ease: 'power3.inOut' }, 1.45)
    .to(rig, { rotateY: 0, rotateX: 0, duration: 0.5, ease: 'power3.inOut' }, 2.55)
    .to(layers, { z: 0, duration: 0.45, ease: 'expo.in', stagger: { each: 0.004, from: 'end' } }, 2.5)
    .from('.sub', { opacity: 0, y: 10, duration: 0.6 }, 0.6)
    .to('.sub', { opacity: 0, duration: 0.3 }, 2.6);
</script>
