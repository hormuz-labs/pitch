<!doctype html><meta charset="utf-8">
<title>Morph: Dots To Text</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101014}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .cap{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-family:"Atlas Grotesk",sans-serif;font-size:16px;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.45)}
</style>
<div class="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div class="cap">Northwind · Motion Reel</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const W = 1280, H = 720, D = 9, N = 900;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const FONT = '500 300px "Sharp Grotesk", "Atlas Grotesk", sans-serif';
  fx.wait(document.fonts.load(FONT));
  const rnd = fx.rng(42);

  // sample N points inside the glyphs of a word (rejection sampling on a text mask)
  function sample(word) {
    const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
    const o = oc.getContext('2d');
    o.font = FONT; o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = '#fff';
    o.fillText(word, W / 2, H / 2 - 20);
    const img = o.getImageData(0, 0, W, H).data;
    const pts = [];
    let guard = 0;
    while (pts.length < N && guard++ < 400000) {
      const x = Math.floor(rnd() * W), y = Math.floor(rnd() * H);
      if (img[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
    }
    return pts;
  }
  // three states: a scattered cloud, word A, word B
  const cloud = Array.from({ length: N }, () => [rnd() * W, rnd() * H]);
  const cloud2 = Array.from({ length: N }, () => [W / 2 + (rnd() - 0.5) * 1500, H / 2 + (rnd() - 0.5) * 900]);
  let A = null, B = null;
  const delay = Array.from({ length: N }, () => rnd());   // per-dot stagger
  const sizes = Array.from({ length: N }, () => 3 + rnd() * 4);

  const easeIO = gsap.parseEase('power3.inOut');
  // a segment: from state S0 to S1 over [t0,t1], each dot offset by its delay across `spread`
  function mix(t, S0, S1, t0, t1, spread, out) {
    for (let i = 0; i < N; i++) {
      const d = delay[i] * spread;
      let p = (t - t0 - d) / (t1 - t0 - spread);
      p = Math.max(0, Math.min(1, p));
      p = easeIO(p);
      // dots travel on a slight arc so they rearrange rather than fly straight
      const ax = S0[i][0], ay = S0[i][1], bx = S1[i][0], by = S1[i][1];
      const arc = Math.sin(p * Math.PI) * 60 * (delay[i] - 0.5);
      out[i][0] = ax + (bx - ax) * p + arc;
      out[i][1] = ay + (by - ay) * p - arc;
      out[i][2] = p;
    }
  }
  const cur = Array.from({ length: N }, () => [0, 0, 0]);

  fx.register({
    duration: D,
    seek(t) {
      if (!A) { A = sample('ACME'); B = sample('STUDIO'); }
      let phase;
      if (t < 3.2) { mix(t, cloud, A, 0.2, 3.2, 1.2, cur); phase = 0; }
      else if (t < 4.2) { mix(t, A, A, 3.2, 4.2, 0, cur); phase = 1; }
      else if (t < 6.8) { mix(t, A, B, 4.2, 6.8, 1.0, cur); phase = 2; }
      else if (t < 7.8) { mix(t, B, B, 6.8, 7.8, 0, cur); phase = 3; }
      else { mix(t, B, cloud, 7.8, 9.0, 0.5, cur); phase = 4; }
      ctx.fillStyle = '#101014'; ctx.fillRect(0, 0, W, H);
      const wob = t * 2.2;
      for (let i = 0; i < N; i++) {
        const [x, y, p] = cur[i];
        // settled dots breathe a little so the word never freezes
        const bx = x + Math.sin(wob + i * 0.37) * 1.6, by = y + Math.cos(wob + i * 0.53) * 1.6;
        const settled = (phase === 1 || phase === 3) ? 1 : (phase === 0 || phase === 2) ? p : 1 - p;
        const r = sizes[i] * (0.6 + settled * 0.5) * 0.5;
        const hue = 200 + (settled * 160) + (i % 7) * 4;
        ctx.fillStyle = `hsl(${hue} 90% ${62 + settled * 15}%)`;
        ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
      }
    }
  });
</script>
