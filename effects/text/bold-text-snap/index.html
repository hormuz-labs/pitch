<!doctype html><meta charset="utf-8">
<title>Bold Text Snap</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b0b0c}
  .bg{position:absolute;inset:0;background:url("../../../assets/backgrounds/sunset.png") center/cover;filter:saturate(1.2) contrast(1.05);transform:scale(1.08)}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55))}
  .stack{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0}
  .row{overflow:hidden;line-height:.88}
  .line{display:block;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:168px;letter-spacing:-.05em;color:#fff;text-transform:uppercase;will-change:transform}
  .line.b{color:#ffd23f}
</style>
<div class="stage">
  <div class="bg"></div><div class="shade"></div>
  <div class="stack">
    <div class="row"><span class="line a">Drop</span></div>
    <div class="row"><span class="line b">Season</span></div>
    <div class="row"><span class="line c">Two</span></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 2 });
  // camera drift on the imagery, the whole loop
  tl.fromTo('.bg', { scale: 1.08, xPercent: -1.5 }, { scale: 1.14, xPercent: 1.5, duration: 2, ease: 'none' }, 0);
  // lines collide from opposite sides and settle
  tl.from('.line.a', { xPercent: -140, duration: 0.55, ease: 'expo.out' }, 0.05)
    .from('.line.b', { xPercent: 140, duration: 0.55, ease: 'expo.out' }, 0.18)
    .from('.line.c', { yPercent: 120, duration: 0.5, ease: 'expo.out' }, 0.32)
    // the collision shock: a squash on landing
    .fromTo('.line.b', { scaleX: 1.12, scaleY: 0.86 }, { scaleX: 1, scaleY: 1, duration: 0.35, ease: 'elastic.out(1,0.45)' }, 0.62)
    // exit: snap out the way they came
    .to('.line.c', { yPercent: -120, duration: 0.3, ease: 'expo.in' }, 1.55)
    .to('.line.b', { xPercent: -140, duration: 0.3, ease: 'expo.in' }, 1.62)
    .to('.line.a', { xPercent: 140, duration: 0.3, ease: 'expo.in' }, 1.68);
</script>
