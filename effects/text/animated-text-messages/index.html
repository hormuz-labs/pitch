<!doctype html><meta charset="utf-8">
<title>Animated Text Messages</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:linear-gradient(160deg,#1a2a6c,#b21f66 55%,#fdbb2d)}
  .phone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:820px;height:1680px;border-radius:96px;background:#111;padding:18px;box-shadow:0 60px 120px rgba(0,0,0,.45)}
  .screen{width:100%;height:100%;border-radius:80px;background:#fff;overflow:hidden;position:relative;display:flex;flex-direction:column}
  .notch{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:230px;height:54px;border-radius:30px;background:#111;z-index:3}
  .status{height:110px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 56px 10px;font-size:28px;font-weight:500}
  .hdr{display:flex;align-items:center;gap:20px;padding:18px 40px 26px;border-bottom:1px solid #e6e6ea}
  .av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#5b6bff,#2fd3a5);display:grid;place-items:center;color:#fff;font-weight:500;font-size:32px}
  .hdr b{display:block;font-size:32px;font-weight:500}.hdr span{display:block;font-size:24px;color:#8a8a92;margin-top:4px}
  .list{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:30px 40px 40px;gap:0}
  .row{overflow:hidden}
  .row .in{padding:8px 0;display:flex}
  .row.me .in{justify-content:flex-end}
  .bubble{max-width:78%;padding:22px 30px;border-radius:38px;font-size:31px;line-height:1.3;background:#ececf0;color:#111;transform-origin:bottom left}
  .me .bubble{background:#2b7cff;color:#fff;transform-origin:bottom right;border-bottom-right-radius:10px}
  .them .bubble{border-bottom-left-radius:10px}
  .typing .bubble{display:flex;gap:10px;padding:28px 30px}
  .typing i{width:16px;height:16px;border-radius:50%;background:#9a9aa3;display:block}
  .compose{margin:0 40px 60px;height:84px;border-radius:42px;border:1.5px solid #d9d9df;display:flex;align-items:center;padding:0 30px;color:#9a9aa3;font-size:28px;justify-content:space-between}
  .compose i{width:56px;height:56px;border-radius:50%;background:#2b7cff}
</style>
<div class="stage">
  <div class="phone"><div class="screen">
    <div class="notch"></div>
    <div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div>
    <div class="hdr"><div class="av">N</div><div><b>Northwind</b><span>Active now</span></div></div>
    <div class="list">
      <div class="row them" data-t="0.3"><div class="in"><div class="bubble">Hey! Your order just shipped 📦</div></div></div>
      <div class="row me" data-t="1.6"><div class="in"><div class="bubble">Amazing, that was fast.</div></div></div>
      <div class="row them typing" data-t="2.7" data-end="4.0"><div class="in"><div class="bubble"><i></i><i></i><i></i></div></div></div>
      <div class="row them" data-t="4.0"><div class="in"><div class="bubble">Should be at your door by Thursday. Want a live tracking link?</div></div></div>
      <div class="row me" data-t="5.6"><div class="in"><div class="bubble">Yes please 🙏</div></div></div>
      <div class="row them typing" data-t="6.5" data-end="7.6"><div class="in"><div class="bubble"><i></i><i></i><i></i></div></div></div>
      <div class="row them" data-t="7.6"><div class="in"><div class="bubble">Sent. Talk soon!</div></div></div>
    </div>
    <div class="compose"><span>Message</span><i></i></div>
  </div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 10 });
  document.querySelectorAll('.row').forEach(row => {
    const t = +row.dataset.t, end = row.dataset.end ? +row.dataset.end : null;
    const b = row.querySelector('.bubble');
    tl.from(row, { height: 0, duration: .45, ease: 'power3.out' }, t)
      .from(b, { scale: .5, opacity: 0, duration: .55, ease: 'back.out(1.8)' }, t + 0.05);
    if (row.classList.contains('typing')) {
      const dots = row.querySelectorAll('i');
      const reps = Math.floor((end - t - .4) / .6);
      tl.to(dots, { y: -10, duration: .3, stagger: .1, repeat: reps * 2 - 1, yoyo: true, ease: 'sine.inOut' }, t + .3);
      tl.to(b, { scale: .6, opacity: 0, duration: .25, ease: 'power2.in' }, end - .25)
        .to(row, { height: 0, duration: .3, ease: 'power3.inOut' }, end - .2);
    }
  });
  tl.fromTo('.stage', { backgroundPosition: '0% 0%' }, { duration: 10 }, 0);
  tl.to('.phone', { y: 8, rotation: -.6, duration: 5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  tl.to('.row', { opacity: 0, duration: .4, stagger: .05, ease: 'power2.in' }, 9.3);
</script>
