<!doctype html><meta charset="utf-8">
<title>Blend Modes: Type Blend</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#000;color:#fff;isolation:isolate}
  .img{position:absolute;inset:-6%;background:url("../../../assets/backgrounds/aurora.png") center/cover}
  .row{position:absolute;left:0;right:0;white-space:nowrap;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:190px;letter-spacing:-.05em;text-transform:uppercase;line-height:.9;will-change:transform}
  .r1{top:110px;color:#fff;mix-blend-mode:difference}
  .r2{top:280px;color:#ffe45c;mix-blend-mode:overlay;-webkit-text-stroke:0}
  .r3{top:450px;color:#fff;mix-blend-mode:exclusion}
  .row span{display:inline-block;padding-right:.35em}
  .bar{position:absolute;left:0;right:0;top:300px;height:150px;background:#ff2d55;mix-blend-mode:screen;transform-origin:left}
  .tag{position:absolute;left:64px;bottom:44px;font-size:15px;letter-spacing:.2em;text-transform:uppercase;mix-blend-mode:difference}
  .tag.r{left:auto;right:64px}
</style>
<div class="stage">
  <div class="img"></div>
  <div class="bar"></div>
  <div class="row r1"><span>Northern</span><span>Light</span><span>Northern</span><span>Light</span></div>
  <div class="row r2"><span>Studio</span><span>Sessions</span><span>Studio</span><span>Sessions</span></div>
  <div class="row r3"><span>Vol. 03</span><span>Winter</span><span>Vol. 03</span><span>Winter</span></div>
  <div class="tag">Brand film · 2026</div><div class="tag r">Type × imagery</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  tl.fromTo('.img', { scale: 1.06, x: 20 }, { scale: 1.12, x: -20, duration: 4, ease: 'none' }, 0);
  // rows glide in opposite directions; each row is two copies so the drift is seamless
  tl.fromTo('.r1', { x: 0 }, { x: -820, duration: 4, ease: 'none' }, 0)
    .fromTo('.r2', { x: -900 }, { x: -100, duration: 4, ease: 'none' }, 0)
    .fromTo('.r3', { x: -120 }, { x: -760, duration: 4, ease: 'none' }, 0);
  tl.from('.row', { yPercent: 60, opacity: 0, duration: .8, stagger: .12, ease: 'move' }, 0)
    .from('.bar', { scaleX: 0, duration: .8, ease: 'expo.out' }, .3)
    .from('.tag', { opacity: 0, y: 8, duration: .5, stagger: .1 }, .6)
    .to('.row', { yPercent: -60, opacity: 0, duration: .5, stagger: .08, ease: 'expo.in' }, 3.3)
    .to('.bar', { scaleX: 0, transformOrigin: 'right', duration: .5, ease: 'expo.in' }, 3.4)
    .to('.tag', { opacity: 0, duration: .3 }, 3.6);
</script>
