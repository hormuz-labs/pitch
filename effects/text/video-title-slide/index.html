<!doctype html><meta charset="utf-8">
<title>Video Title Slide</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f3efe6;color:#141414}
  .blob{position:absolute;right:-180px;top:-220px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#ffb86b,#ff7a45 70%);opacity:.9}
  .blob2{position:absolute;left:-260px;bottom:-320px;width:620px;height:620px;border-radius:50%;background:#141414;opacity:.06}
  .frame{position:absolute;inset:64px 72px}
  .rule{position:absolute;left:0;top:0;height:3px;width:100%;background:#141414;transform-origin:left center}
  .label{position:absolute;left:0;top:26px;font-size:15px;letter-spacing:.34em;text-transform:uppercase;display:flex;gap:18px}
  .label .dot{width:9px;height:9px;border-radius:50%;background:#ff7a45;align-self:center}
  .title{position:absolute;left:0;top:200px}
  .row{overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
  .line{display:block;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:132px;line-height:.95;letter-spacing:-.04em}
  .line i{font-style:normal;color:#ff7a45}
  .sub{position:absolute;left:0;top:508px;font-size:24px;color:#4a4a4a;max-width:640px;line-height:1.3}
  .foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;font-size:15px;letter-spacing:.2em;text-transform:uppercase}
  .mark{display:flex;align-items:center;gap:12px;font-weight:500}
  .mark span{width:22px;height:22px;background:#141414;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
  .frule{position:absolute;left:0;right:0;bottom:44px;height:1px;background:rgba(20,20,20,.25);transform-origin:right center}
  .mask{overflow:hidden}
  .mask>*{display:block}
</style>
<div class="stage">
  <div class="blob"></div><div class="blob2"></div>
  <div class="frame">
    <div class="rule"></div>
    <div class="label"><span class="dot"></span><span class="mask"><span>Episode 04</span></span><span class="mask"><span>Northwind Sessions</span></span></div>
    <div class="title">
      <div class="row"><span class="line">Designing</span></div>
      <div class="row"><span class="line">for <i>Motion</i></span></div>
    </div>
    <div class="sub mask"><span>How small moves make a product feel finished — a conversation with the Acme design team.</span></div>
    <div class="frule"></div>
    <div class="foot">
      <div class="mark mask"><span></span><span>Northwind</span></div>
      <div class="mask"><span>12 · 09 · 2026</span></div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  // the blob breathes for the whole loop so the slide is never a still
  tl.fromTo('.blob', { x: 0, y: 0, scale: 1 }, { x: -30, y: 30, scale: 1.08, duration: 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  tl.fromTo('.blob2', { x: 0 }, { x: 40, duration: 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);

  // in
  tl.from('.rule', { scaleX: 0, duration: 0.9, ease: 'expo.inOut' }, 0)
    .from('.label .dot', { scale: 0, duration: 0.4, ease: 'back.out(2)' }, 0.5)
    .from('.label .mask > span', { yPercent: 110, duration: 0.6, ease: 'expo.out', stagger: 0.08 }, 0.55)
    .from('.line', { yPercent: 110, duration: 0.9, ease: 'expo.out', stagger: 0.12 }, 0.45)
    .from('.sub > span', { yPercent: 110, duration: 0.7, ease: 'expo.out' }, 0.95)
    .from('.frule', { scaleX: 0, duration: 0.8, ease: 'expo.inOut' }, 1.0)
    .from('.foot .mask > span', { yPercent: 110, duration: 0.6, ease: 'expo.out', stagger: 0.06 }, 1.15);

  // out: everything leaves upward, the rules retract, so t=4 matches t=0
  tl.to('.line', { yPercent: -110, duration: 0.5, ease: 'expo.in', stagger: 0.08 }, 3.15)
    .to('.sub > span', { yPercent: -110, duration: 0.4, ease: 'expo.in' }, 3.25)
    .to('.label .mask > span', { yPercent: -110, duration: 0.4, ease: 'expo.in', stagger: 0.05 }, 3.3)
    .to('.label .dot', { scale: 0, duration: 0.3, ease: 'expo.in' }, 3.4)
    .to('.foot .mask > span', { yPercent: -110, duration: 0.4, ease: 'expo.in', stagger: 0.05 }, 3.3)
    .to('.frule', { scaleX: 0, duration: 0.45, ease: 'expo.inOut' }, 3.4)
    .to('.rule', { scaleX: 0, transformOrigin: 'right center', duration: 0.5, ease: 'expo.inOut' }, 3.45);
</script>
