<!doctype html><meta charset="utf-8">
<title>The Crust: Animated Menu</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f6e7c8;color:#2a1a0e}
  .board{position:absolute;inset:60px;border:6px solid #2a1a0e;border-radius:28px;padding:56px 64px;display:flex;flex-direction:column;background:#fbf1dc;overflow:hidden}
  .board>*{position:relative;z-index:1}
  .head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:4px solid #2a1a0e;padding-bottom:22px;margin-bottom:26px;overflow:hidden}
  .h1{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:96px;letter-spacing:-.04em;line-height:.9;text-transform:uppercase}
  .h1 em{font-family:"Sorts Mill Goudy",serif;font-style:italic;text-transform:none;font-size:64px;color:#c2542b;display:block;letter-spacing:0}
  .day{font-size:20px;letter-spacing:.24em;text-transform:uppercase;border:3px solid #2a1a0e;border-radius:999px;padding:12px 22px}
  .items{display:flex;flex-direction:column;gap:14px;flex:1}
  .item{display:flex;align-items:baseline;gap:14px;font-size:38px;letter-spacing:-.01em;overflow:hidden;padding:6px 0;will-change:transform}
  .item .n{font-weight:500;white-space:nowrap}
  .item .d{flex:1;border-bottom:3px dotted #2a1a0e;transform-origin:left;margin:0 4px 10px}
  .item .p{font-family:"Sorts Mill Goudy",serif;font-size:44px;color:#c2542b;white-space:nowrap}
  .item .tag{font-size:16px;letter-spacing:.2em;text-transform:uppercase;background:#c2542b;color:#fbf1dc;padding:6px 10px;border-radius:6px;transform-origin:left}
  .foot{margin-top:10px;font-size:18px;letter-spacing:.24em;text-transform:uppercase;display:flex;justify-content:space-between;overflow:hidden}
  .croissant{position:absolute;right:-30px;bottom:-30px;width:260px;height:160px;border-radius:130px 130px 40px 40px;background:#e2a24a;box-shadow:inset -20px -20px 0 #c47d2b;transform-origin:center;opacity:.5;z-index:0}
</style>
<div class="stage">
  <div class="board">
    <div class="head">
      <div class="h1">Today's<em>specials</em></div>
      <div class="day">Tuesday</div>
    </div>
    <div class="items">
      <div class="item"><span class="n">Butter croissant</span><span class="tag">New</span><span class="d"></span><span class="p">$4.50</span></div>
      <div class="item"><span class="n">Sourdough loaf</span><span class="d"></span><span class="p">$9</span></div>
      <div class="item"><span class="n">Cardamom bun</span><span class="d"></span><span class="p">$5.25</span></div>
      <div class="item"><span class="n">Pain au chocolat</span><span class="tag">Fav</span><span class="d"></span><span class="p">$5</span></div>
      <div class="item"><span class="n">Rye & seed</span><span class="d"></span><span class="p">$8.50</span></div>
      <div class="item"><span class="n">Cinnamon knot</span><span class="d"></span><span class="p">$4.75</span></div>
    </div>
    <div class="foot"><span>The Crust · Bakery</span><span>Baked at 6 AM daily</span></div>
    <div class="croissant"></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 8 });
  tl.from('.board', { scale: 0.92, opacity: 0, duration: 0.8, ease: 'expo.out' }, 0)
    .from('.h1', { yPercent: 110, duration: 0.9, ease: 'expo.out' }, 0.15)
    .from('.day', { xPercent: 120, opacity: 0, duration: 0.7, ease: 'expo.out' }, 0.4)
    .from('.head', { borderBottomWidth: 0, duration: 0.5 }, 0.5);
  gsap.utils.toArray('.item').forEach((it, i) => {
    const at = 0.8 + i * 0.32;
    tl.from(it.querySelector('.n'), { xPercent: -110, duration: 0.7, ease: 'expo.out' }, at)
      .from(it.querySelector('.d'), { scaleX: 0, duration: 0.7, ease: 'expo.out' }, at + 0.12)
      .from(it.querySelector('.p'), { yPercent: 120, duration: 0.6, ease: 'expo.out' }, at + 0.3);
    const tag = it.querySelector('.tag');
    if (tag) tl.from(tag, { scaleX: 0, duration: 0.5, ease: 'back.out(2)' }, at + 0.35);
  });
  tl.from('.foot span', { yPercent: 120, stagger: 0.1, duration: 0.6, ease: 'expo.out' }, 2.9)
    .from('.croissant', { scale: 0, rotate: -40, duration: 0.8, ease: 'back.out(1.6)' }, 3.0)
    // price pulses in rhythm while the board holds
    .to('.item .p', { scale: 1.12, color: '#2a1a0e', duration: 0.18, stagger: 0.14, yoyo: true, repeat: 1, ease: 'power2.inOut' }, 4.4)
    .to('.croissant', { rotate: 8, duration: 2.5, ease: 'sine.inOut' }, 3.8)
    // sweep out
    .to('.item', { xPercent: 110, stagger: 0.06, duration: 0.45, ease: 'expo.in' }, 7.0)
    .to('.h1, .day, .foot', { yPercent: -120, duration: 0.45, ease: 'expo.in' }, 7.25)
    .to('.board', { scale: 0.92, opacity: 0, duration: 0.4, ease: 'power2.in' }, 7.55);
</script>
