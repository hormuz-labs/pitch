<!doctype html><meta charset="utf-8">
<title>The Crust: Tagline</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#fbf1dc;color:#2a1a0e}
  .photo{position:absolute;left:90px;top:90px;width:900px;height:900px;border-radius:450px;overflow:hidden;clip-path:circle(50% at 50% 50%)}
  .photo .img{position:absolute;inset:-12%;background:url("../../../assets/backgrounds/sunset.png") center/cover;filter:sepia(.7) saturate(1.5)}
  .photo .tint{position:absolute;inset:0;background:rgba(194,84,43,.25)}
  .line{position:absolute;left:0;right:0;text-align:center;overflow:hidden;padding:0 20px}
  .line .w{display:inline-block;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:150px;letter-spacing:-.05em;text-transform:uppercase;line-height:.9;color:#fbf1dc;white-space:nowrap}
  .line.a{top:250px}.line.b{top:400px}
  .line.c{top:560px}
  .line.c .w{font-family:"Sorts Mill Goudy",serif;font-style:italic;text-transform:none;letter-spacing:0;font-size:120px;color:#2a1a0e;background:#e2a24a;padding:6px 36px;border-radius:14px}
  .stamp{position:absolute;left:50%;top:740px;width:170px;height:170px;margin-left:-85px;border-radius:50%;border:4px solid #fbf1dc;display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;letter-spacing:.22em;text-transform:uppercase;line-height:1.35;color:#fbf1dc}
  .brand{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:20px;letter-spacing:.32em;text-transform:uppercase}
</style>
<div class="stage">
  <div class="photo"><div class="img"></div><div class="tint"></div></div>
  <div class="line a"><span class="w">Freshly</span></div>
  <div class="line b"><span class="w">Baked</span></div>
  <div class="line c"><span class="w">every morning</span></div>
  <div class="stamp">Since<br>1987</div>
  <div class="brand">The Crust · Bakery</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 5 });
  tl.from('.photo', { clipPath: 'circle(0% at 50% 50%)', duration: 1.0, ease: 'expo.inOut' }, 0)
    .fromTo('.photo .img', { scale: 1.25, rotate: -4 }, { scale: 1.0, rotate: 0, duration: 5, ease: 'none' }, 0)
    .from('.line.a .w', { yPercent: 110, duration: 0.8, ease: 'expo.out' }, 0.5)
    .from('.line.b .w', { yPercent: 110, duration: 0.8, ease: 'expo.out' }, 0.65)
    .from('.line.c .w', { yPercent: 130, rotate: 6, duration: 0.8, ease: 'expo.out' }, 0.85)
    .from('.stamp', { scale: 0, rotate: -120, duration: 0.8, ease: 'back.out(1.8)' }, 1.2)
    .to('.stamp', { rotate: 25, duration: 3.3, ease: 'none' }, 1.7)
    .from('.brand', { opacity: 0, y: 10, duration: 0.6 }, 1.4)
    // a subtle pulse on the italic pill during the hold
    .to('.line.c .w', { scale: 1.04, duration: 0.5, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 2.0)
    .to('.line .w', { yPercent: -120, stagger: 0.08, duration: 0.45, ease: 'expo.in' }, 4.2)
    .to('.stamp', { scale: 0, duration: 0.35, ease: 'expo.in' }, 4.35)
    .to('.photo', { clipPath: 'circle(0% at 50% 50%)', duration: 0.5, ease: 'expo.in' }, 4.5)
    .to('.brand', { opacity: 0, duration: 0.3 }, 4.6);
</script>
