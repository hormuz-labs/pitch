<!doctype html><meta charset="utf-8">
<title>Tilted Text Snap</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#ff3d1f}
  .stack{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .row{overflow:hidden;padding:0 .1em;height:1em;line-height:1;font-size:170px}
  .line{display:block;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;letter-spacing:-.05em;text-transform:uppercase;color:#111;transform-origin:0% 100%;will-change:transform;line-height:.95}
  .line.w{color:#fff}
  .corner{position:absolute;font-family:"Atlas Grotesk",sans-serif;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:#111}
  .c1{left:56px;top:48px}.c2{right:56px;top:48px}.c3{left:56px;bottom:48px}.c4{right:56px;bottom:48px}
</style>
<div class="stage">
  <div class="corner c1">Acme</div><div class="corner c2">Issue 09</div><div class="corner c3">Out now</div><div class="corner c4">→</div>
  <div class="stack">
    <div class="row"><span class="line">Louder</span></div>
    <div class="row"><span class="line w">Faster</span></div>
    <div class="row"><span class="line">Sharper</span></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 2 });
  // each line rotates in from below at a tilt, pivoting on its left baseline, and snaps flat
  tl.from('.corner', { opacity: 0, duration: .3, stagger: .05 }, 0);
  gsap.utils.toArray('.line').forEach((el, i) => {
    const t0 = .05 + i * .14;
    tl.fromTo(el, { yPercent: 120, rotation: 12 }, { yPercent: 0, rotation: 0, duration: .55, ease: 'expo.out' }, t0)
      // the snap: a tiny overshoot past flat and back
      .to(el, { rotation: -2.5, duration: .12, ease: 'power2.out' }, t0 + .38)
      .to(el, { rotation: 0, duration: .35, ease: 'elastic.out(1,.4)' }, t0 + .5);
  });
  // exit: tilt the other way and drop
  gsap.utils.toArray('.line').forEach((el, i) => {
    tl.to(el, { rotation: -10, yPercent: -120, duration: .32, ease: 'power3.in' }, 1.45 + i * .08);
  });
  tl.to('.corner', { opacity: 0, duration: .2 }, 1.75);
</script>
