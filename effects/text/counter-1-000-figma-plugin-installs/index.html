<!doctype html><meta charset="utf-8">
<title>Counter: 1,000 Installs</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#1e1e1e;color:#fff}
  .glow{position:absolute;left:50%;top:50%;width:900px;height:900px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(162,89,255,.35),rgba(162,89,255,0) 65%)}
  .logo{position:absolute;left:50%;top:170px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px}
  .logo i{display:block;width:44px;height:44px;border-radius:0 22px 22px 0;background:#f24e1e}
  .logo i:nth-child(2){background:#a259ff;border-radius:22px 0 0 22px}
  .logo i:nth-child(3){background:#1abcfe;border-radius:22px}
  .num{position:absolute;left:0;right:0;top:50%;transform:translateY(-58%);text-align:center;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:300px;letter-spacing:-.06em;line-height:1;font-variant-numeric:tabular-nums;will-change:transform}
  .lbl{position:absolute;left:0;right:0;top:668px;text-align:center;font-size:34px;color:#c7c7d1;letter-spacing:-.01em}
  .lbl b{color:#fff;font-weight:500}
  .pill{position:absolute;left:50%;top:760px;transform:translateX(-50%);padding:14px 28px;border-radius:999px;background:#a259ff;font-size:20px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
  .p{position:absolute;left:50%;top:50%;width:14px;height:22px;border-radius:3px;will-change:transform;opacity:0}
</style>
<div class="stage">
  <div class="glow"></div>
  <div class="logo"><i></i><i></i><i></i></div>
  <div class="num" id="num">0</div>
  <div class="lbl"><b>Figma plugin</b> installs</div>
  <div class="pill">Thank you</div>
  <div id="conf"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 3 });
  const num = document.getElementById('num');
  const v = { n: 0 };
  const fmt = n => Math.round(n).toLocaleString('en-US');
  tl.from('.logo i', { scale: 0, x: -20, duration: .5, stagger: .08, ease: 'back.out(2)' }, 0)
    .from('.lbl', { y: 16, opacity: 0, duration: .5, ease: 'power3.out' }, .2);
  tl.fromTo(num, { scale: .9, opacity: 0 }, { scale: 1, opacity: 1, duration: .4, ease: 'power3.out' }, .1);
  tl.to(v, { n: 1000, duration: 1.6, ease: 'expo.inOut', onUpdate() { num.textContent = fmt(v.n); } }, .2);
  // the landing: a pop and a confetti burst
  tl.fromTo(num, { scale: 1 }, { scale: 1.1, duration: .12, ease: 'power2.out' }, 1.8)
    .to(num, { scale: 1, duration: .6, ease: 'elastic.out(1,.35)' }, 1.92)
    .from('.pill', { scale: 0, duration: .5, ease: 'back.out(2)' }, 1.85)
    .fromTo('.glow', { scale: .8 }, { scale: 1.2, duration: .8, ease: 'expo.out' }, 1.8);
  const rng = fx.rng(42), cols = ['#f24e1e', '#a259ff', '#1abcfe', '#0acf83', '#ff7262', '#ffd23f'];
  const conf = document.getElementById('conf');
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div'); p.className = 'p'; p.style.background = cols[i % cols.length]; conf.appendChild(p);
    const a = rng() * Math.PI * 2, r = 260 + rng() * 380;
    tl.fromTo(p, { x: 0, y: 0, opacity: 1, rotation: 0, scale: .6 + rng() * .8 },
      { x: Math.cos(a) * r, y: Math.sin(a) * r + 160, rotation: (rng() - .5) * 720, opacity: 0, duration: .9 + rng() * .4, ease: 'move' }, 1.8);
  }
  tl.to('.num, .lbl, .pill, .logo', { opacity: 0, y: -20, duration: .3, stagger: .03, ease: 'power2.in' }, 2.7);
</script>
