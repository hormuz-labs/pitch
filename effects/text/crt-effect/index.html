<!doctype html><meta charset="utf-8">
<title>CRT Effect</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#000}
  .tube{position:absolute;inset:40px 120px;border-radius:40px/60px;overflow:hidden;background:#07110b;box-shadow:inset 0 0 120px rgba(0,0,0,.9)}
  .content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 90px;color:#7dff9a;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;text-shadow:0 0 12px rgba(125,255,154,.8);will-change:transform;filter:url(#warp)}
  .t{font-size:118px;letter-spacing:-.02em;line-height:1;text-transform:uppercase}
  .s{margin-top:22px;font-family:"Atlas Grotesk",monospace;font-size:26px;letter-spacing:.18em;text-transform:uppercase;color:#b8ffc9}
  .cur{display:inline-block;width:.6em;height:1em;background:#7dff9a;vertical-align:-.15em;margin-left:.1em}
  .rgb{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
  .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 2px,rgba(0,0,0,0) 2px 4px);pointer-events:none;mix-blend-mode:multiply}
  .noise{position:absolute;inset:0;opacity:.18;filter:url(#nz);pointer-events:none;mix-blend-mode:screen}
  .roll{position:absolute;left:0;right:0;height:140px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.12) 50%,rgba(255,255,255,0));pointer-events:none;will-change:transform}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 100%);pointer-events:none}
  .glass{position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.07),rgba(255,255,255,0) 45%);pointer-events:none}
  .flick{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0}
</style>
<div class="stage">
  <svg width="0" height="0" style="position:absolute">
    <filter id="nz"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="1"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 1  0 0 0 0 .6  0 0 0 1 0"/></filter>
    <filter id="warp" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence id="wt" type="turbulence" baseFrequency="0 .012" numOctaves="1" seed="3"/><feDisplacementMap id="dm" in="SourceGraphic" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter>
  </svg>
  <div class="tube">
    <div class="content">
      <div class="t" id="t1">System</div>
      <div class="t" id="t2">Online</div>
      <div class="s"><span id="s">&nbsp;</span><span class="cur"></span></div>
    </div>
    <div class="noise"></div>
    <div class="scan"></div>
    <div class="roll"></div>
    <div class="flick"></div>
    <div class="vig"></div>
    <div class="glass"></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/ScrambleTextPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(ScrambleTextPlugin);
  const D = 4;
  const tl = fx.timeline({ duration: D });
  const rng = fx.rng(7); const flick = Array.from({ length: 120 }, () => rng()); const jit = Array.from({ length: 120 }, () => rng());
  // power on: a thin bright line that expands vertically into the picture
  tl.fromTo('.content', { scaleY: .01, scaleX: 1.3, opacity: 1 }, { scaleY: 1, scaleX: 1, duration: .5, ease: 'expo.out' }, 0);
  tl.fromTo('#t1', { text: '' }, { duration: .6, scrambleText: { text: 'System', chars: '01#$%&/', speed: .5 } }, .4)
    .fromTo('#t2', { text: '' }, { duration: .6, scrambleText: { text: 'Online', chars: '01#$%&/', speed: .5 } }, .7)
    .to('#s', { duration: 1.2, scrambleText: { text: 'Northwind OS v2.1 — ready', chars: 'upperCase', speed: .3 } }, 1.1);
  // things driven directly by t: noise seed, flicker, roll bar, glitch tears
  const turb = document.getElementById('turb'), dm = document.getElementById('dm');
  const drive = { p: 0 };
  tl.to(drive, { p: 1, duration: D, ease: 'none', onUpdate() {
    const t = drive.p * D, f = Math.floor(t * 30);
    turb.setAttribute('seed', String(1 + (f % 60)));
    document.querySelector('.flick').style.opacity = (flick[f % 120] * .12).toFixed(3);
    document.querySelector('.roll').style.transform = `translateY(${(-140 + ((t / D) * 2 % 1) * 800).toFixed(1)}px)`;
    // occasional horizontal tear
    const tear = jit[f % 120] > .93 ? 22 : 0;
    dm.setAttribute('scale', String(tear));
    document.querySelector('.content').style.transform += '';
  } }, 0);
  tl.to('.content', { x: 6, duration: .06, yoyo: true, repeat: 3, ease: 'none' }, 1.9);
  tl.to('.content', { x: -8, duration: .05, yoyo: true, repeat: 3, ease: 'none' }, 3.1);
  // power off: collapse to a line, then a dot
  tl.to('.content', { scaleY: .01, scaleX: 1.2, duration: .3, ease: 'expo.in' }, D - .45)
    .to('.content', { scaleX: 0, opacity: 0, duration: .15, ease: 'expo.in' }, D - .15);
</script>
