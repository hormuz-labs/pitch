<!doctype html><meta charset="utf-8">
<title>Blend Modes: Overlay Poster</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0a0a0c;color:#fff;isolation:isolate}
  .img{position:absolute;inset:0;background:url("../../../assets/backgrounds/ocean.png") center/cover;filter:saturate(1.1) contrast(1.1) brightness(1.15)}
  .panel{position:absolute;mix-blend-mode:overlay;will-change:transform}
  .p1{left:0;top:0;width:100%;height:100%;background:#ff7a3d;transform-origin:left}
  .p2{left:0;top:1080px;width:100%;height:840px;background:#2e7bff;transform-origin:bottom}
  .p3{left:80px;top:220px;width:920px;height:1120px;background:#fff;opacity:.9}
  .type{position:absolute;left:80px;top:380px;right:80px;mix-blend-mode:overlay}
  .h{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:236px;line-height:.86;letter-spacing:-.05em;text-transform:uppercase;color:#fff}
  .h .ln{display:block;overflow:hidden}.h .ln span{display:block}
  .meta{position:absolute;left:80px;right:80px;bottom:140px;display:flex;justify-content:space-between;font-size:30px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;border-top:2px solid #fff;padding-top:22px}
  .badge{position:absolute;right:80px;top:120px;width:150px;height:150px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-size:26px;text-align:center;line-height:1.1;letter-spacing:.06em;mix-blend-mode:overlay}
  .strip{position:absolute;left:0;right:0;top:1460px;height:120px;background:#fff;mix-blend-mode:overlay;color:#000;display:flex;align-items:center;white-space:nowrap;font-size:64px;font-weight:500;letter-spacing:-.02em;text-transform:uppercase;overflow:hidden}
  .strip .track{display:flex;will-change:transform}.strip span{padding-right:60px}
</style>
<div class="stage">
  <div class="img"></div>
  <div class="panel p1"></div><div class="panel p2"></div><div class="panel p3"></div>
  <div class="badge">Live<br>Sept 12</div>
  <div class="type"><div class="h"><div class="ln"><span>Open</span></div><div class="ln"><span>Water</span></div><div class="ln"><span>Fest</span></div></div></div>
  <div class="strip"><div class="track"><span>Northwind Sound System</span><span>Northwind Sound System</span><span>Northwind Sound System</span><span>Northwind Sound System</span></div></div>
  <div class="meta"><span>Harbour Pier 9</span><span>From 7pm</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  tl.fromTo('.img', { scale: 1.12, y: -20 }, { scale: 1.02, y: 20, duration: 4, ease: 'none' }, 0);
  tl.from('.p1', { scaleX: 0, duration: .8, ease: 'expo.out' }, 0)
    .from('.p2', { scaleY: 0, duration: .8, ease: 'expo.out' }, .15)
    .from('.p3', { yPercent: 110, duration: .9, ease: 'expo.out' }, .25)
    .from('.h span', { yPercent: 105, duration: .8, stagger: .1, ease: 'expo.out' }, .45)
    .from('.badge', { scale: 0, rotation: -90, duration: .7, ease: 'back.out(1.8)' }, .8)
    .from('.strip', { scaleY: 0, duration: .5, ease: 'expo.out' }, .9)
    .from('.meta', { y: 20, opacity: 0, duration: .6, ease: 'power3.out' }, 1.0);
  tl.fromTo('.strip .track', { x: 0 }, { x: -880, duration: 4, ease: 'none' }, 0);
  tl.to('.badge', { rotation: 360, duration: 4, ease: 'none' }, 0);
  tl.to('.p1', { scaleX: 0, transformOrigin: 'right', duration: .5, ease: 'expo.in' }, 3.4)
    .to('.p2', { scaleY: 0, duration: .5, ease: 'expo.in' }, 3.4)
    .to('.p3', { yPercent: -110, duration: .5, ease: 'expo.in' }, 3.45)
    .to('.h span', { yPercent: -105, duration: .4, stagger: .05, ease: 'expo.in' }, 3.35)
    .to('.badge, .meta, .strip', { opacity: 0, duration: .3 }, 3.6);
</script>
