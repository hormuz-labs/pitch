<!doctype html><meta charset="utf-8">
<title>Sliding Text Reveal</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f3efe6}
  .grain{position:absolute;inset:0;opacity:.35;background:url("../../../assets/backgrounds/ocean.png") center/cover;mix-blend-mode:multiply;filter:grayscale(1) contrast(1.2)}
  .stack{position:absolute;left:120px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
  .row{position:relative;overflow:hidden;padding-right:24px}
  .words{display:flex;gap:.28em;line-height:1;white-space:nowrap}
  .w{display:inline-block;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:128px;letter-spacing:-.04em;color:#111;text-transform:uppercase;will-change:transform}
  .row.small .w{font-family:"Sorts Mill Goudy",serif;font-style:italic;font-weight:400;font-size:64px;text-transform:none;letter-spacing:0;color:#8b3a2a}
  .mask{position:absolute;inset:0;background:#111;transform-origin:left;will-change:transform}
  .row.small .mask{background:#8b3a2a}
  .rule{position:absolute;left:120px;bottom:110px;height:3px;width:420px;background:#111;transform-origin:left}
  .meta{position:absolute;left:120px;bottom:72px;font-size:18px;letter-spacing:.24em;text-transform:uppercase;color:#111;overflow:hidden}
</style>
<div class="stage">
  <div class="grain"></div>
  <div class="stack">
    <div class="row"><div class="words"><span class="w">Deliberate</span></div><div class="mask"></div></div>
    <div class="row"><div class="words"><span class="w">By</span><span class="w">Design</span></div><div class="mask"></div></div>
    <div class="row small"><div class="words"><span class="w">Chapter one</span><span class="w">—</span><span class="w">the brief</span></div><div class="mask"></div></div>
  </div>
  <div class="rule"></div>
  <div class="meta"><span class="w2">Northwind Studio · 2026</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 3 });
  const rows = gsap.utils.toArray('.row');
  rows.forEach((row, i) => {
    const t0 = 0.1 + i * 0.22;
    const mask = row.querySelector('.mask');
    const ws = row.querySelectorAll('.w');
    // the mask wipes across, then slides away to the right revealing words sliding in behind it
    tl.fromTo(mask, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: 'expo.inOut' }, t0)
      .set(mask, { transformOrigin: 'right' }, t0 + 0.45)
      .to(mask, { scaleX: 0, duration: 0.5, ease: 'expo.inOut' }, t0 + 0.47)
      .from(ws, { x: (i, el) => -(el.offsetLeft + el.offsetWidth + 40), stagger: 0.07, duration: 0.8, ease: 'expo.out' }, t0 + 0.42);
    // exit: words slide out under the mask edge
    tl.to(ws, { x: (i, el) => row.offsetWidth - el.offsetLeft + 40, stagger: 0.05, duration: 0.45, ease: 'expo.in' }, 2.35 + i * 0.08);
  });
  tl.from('.rule', { scaleX: 0, duration: 0.7, ease: 'expo.out' }, 0.9)
    .from('.w2', { yPercent: 120, duration: 0.6, ease: 'expo.out' }, 1.0)
    .to('.rule', { scaleX: 0, transformOrigin: 'right', duration: 0.4, ease: 'expo.in' }, 2.5)
    .to('.w2', { yPercent: -120, duration: 0.35, ease: 'expo.in' }, 2.55)
    .fromTo('.grain', { xPercent: -2 }, { xPercent: 2, duration: 3, ease: 'none' }, 0);
</script>
