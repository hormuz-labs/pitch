<!doctype html><meta charset="utf-8">
<title>Save The Date</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f6f1e8;color:#1e1a16}
  .frame{position:absolute;inset:64px;border:1px solid rgba(30,26,22,.35)}
  .frame i{position:absolute;background:#f6f1e8}
  .col{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .eyebrow{font-family:"Atlas Grotesk",sans-serif;font-size:18px;letter-spacing:.48em;text-transform:uppercase;opacity:.7}
  .rule{width:1px;height:70px;background:#1e1a16;margin:26px 0;transform-origin:50% 0}
  .title{font-family:"Sorts Mill Goudy",serif;font-size:150px;line-height:.95;letter-spacing:-.01em}
  .title .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .04em}
  .title .w span{display:inline-block;will-change:transform}
  .title .it{font-style:italic}
  .date{margin-top:36px;font-family:"Atlas Grotesk",sans-serif;font-weight:500;font-size:34px;letter-spacing:.42em}
  .date span{display:inline-block}
  .place{margin-top:18px;font-family:"Sorts Mill Goudy",serif;font-style:italic;font-size:32px;opacity:.85}
  .orn{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;border:1px solid rgba(30,26,22,.22);will-change:transform}
  .orn.b{width:640px;height:640px;margin:-320px 0 0 -320px;border-color:rgba(30,26,22,.12)}
  .dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#b5462f;left:50%;top:50%;margin:-4px 0 0 -4px}
</style>
<div class="stage">
  <div class="frame"><i id="fa"></i><i id="fb"></i><i id="fc"></i><i id="fd"></i></div>
  <div class="orn a"></div><div class="orn b"></div>
  <div class="col">
    <div class="eyebrow">You are invited</div>
    <div class="rule"></div>
    <div class="title"><span class="w"><span>Save</span></span> <span class="w"><span class="it">the</span></span> <span class="w"><span>Date</span></span></div>
    <div class="date"><span>12</span><span>·</span><span>06</span><span>·</span><span>2026</span></div>
    <div class="place">The Northwind House, Lisbon</div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 7 });
  // the frame draws itself: four covers slide away along each edge
  gsap.set('#fa', { left: -1, top: -1, right: -1, height: 3, transformOrigin: '100% 50%' });
  gsap.set('#fb', { right: -1, top: -1, bottom: -1, width: 3, transformOrigin: '50% 100%' });
  gsap.set('#fc', { left: -1, bottom: -1, right: -1, height: 3, transformOrigin: '0% 50%' });
  gsap.set('#fd', { left: -1, top: -1, bottom: -1, width: 3, transformOrigin: '50% 0%' });
  tl.to('#fa', { scaleX: 0, duration: 1.1, ease: 'expo.inOut' }, 0.1)
    .to('#fb', { scaleY: 0, duration: 1.1, ease: 'expo.inOut' }, 0.5)
    .to('#fc', { scaleX: 0, duration: 1.1, ease: 'expo.inOut' }, 0.9)
    .to('#fd', { scaleY: 0, duration: 1.1, ease: 'expo.inOut' }, 1.3);
  // ornament rings breathe and turn slowly through the whole loop
  tl.fromTo('.orn.a', { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.8, ease: 'expo.out' }, 0.3)
    .fromTo('.orn.b', { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 2.0, ease: 'expo.out' }, 0.5)
    .to('.orn.a', { scale: 1.05, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2)
    .to('.orn.b', { scale: 0.96, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2);
  // the copy: eyebrow tracks in, rule draws, words rise under their masks, date letters space out
  tl.from('.eyebrow', { opacity: 0, letterSpacing: '.9em', duration: 1.2, ease: 'power3.out' }, 0.6)
    .from('.rule', { scaleY: 0, duration: 0.9, ease: 'expo.inOut' }, 1.1)
    .from('.title .w span', { yPercent: 110, duration: 1.1, ease: 'expo.out', stagger: 0.16 }, 1.5)
    .from('.date span', { opacity: 0, y: 14, duration: 0.7, ease: 'power3.out', stagger: 0.09 }, 2.4)
    .from('.place', { opacity: 0, y: 10, duration: 0.8, ease: 'power2.out' }, 2.9);
  // a slow drift on the whole block keeps the hold alive
  tl.fromTo('.col', { y: 6 }, { y: -6, duration: 4, ease: 'sine.inOut' }, 2.5);
  // exit: everything settles out with the same care
  tl.to('.title .w span', { yPercent: -110, duration: 0.7, ease: 'expo.in', stagger: 0.08 }, 5.9)
    .to(['.date', '.place', '.eyebrow'], { opacity: 0, y: -8, duration: 0.5, ease: 'power2.in', stagger: 0.06 }, 6.0)
    .to('.rule', { scaleY: 0, duration: 0.5, ease: 'expo.in' }, 6.1)
    .to('.orn', { scale: 1.2, opacity: 0, duration: 0.6, ease: 'power2.in' }, 6.3)
    .to(['#fa', '#fb', '#fc', '#fd'], { scale: 1, duration: 0.5, ease: 'expo.inOut', stagger: 0.05 }, 6.4);
</script>
