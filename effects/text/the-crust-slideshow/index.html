<!doctype html><meta charset="utf-8">
<title>The Crust: Slideshow</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#2a1a0e;color:#fbf1dc}
  .slide{position:absolute;inset:0;overflow:hidden}
  .img{position:absolute;inset:-10%;background-size:cover;background-position:center;will-change:transform;filter:sepia(.6) saturate(1.4) contrast(1.05)}
  .s1 .img{background-image:url("../../../assets/backgrounds/sunset.png")}
  .s2 .img{background-image:url("../../../assets/backgrounds/aurora.png");filter:sepia(.9) saturate(1.3) hue-rotate(-10deg)}
  .s3 .img{background-image:url("../../../assets/backgrounds/ocean.png");filter:sepia(1) saturate(1.6) brightness(.9)}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,26,14,0) 40%,rgba(42,26,14,.85))}
  .cap{position:absolute;left:72px;bottom:84px;right:72px;overflow:hidden}
  .cap .n{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:96px;letter-spacing:-.04em;text-transform:uppercase;line-height:.95;display:block}
  .cap .d{font-family:"Sorts Mill Goudy",serif;font-style:italic;font-size:38px;margin-top:14px;display:block;color:#e2a24a}
  .num{position:absolute;right:72px;top:72px;font-size:22px;letter-spacing:.3em;text-transform:uppercase}
  .brand{position:absolute;left:72px;top:72px;font-size:22px;letter-spacing:.3em;text-transform:uppercase}
  .wipe{position:absolute;inset:0;background:#e2a24a;transform:scaleY(0);transform-origin:bottom}
  .ring{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;border:3px solid rgba(251,241,220,.5);transform:scale(0)}
</style>
<div class="stage">
  <div class="slide s1"><div class="img"></div><div class="shade"></div><div class="ring"></div><div class="cap"><span class="n">Butter croissant</span><span class="d">Laminated 27 times, baked at dawn</span></div></div>
  <div class="slide s2"><div class="img"></div><div class="shade"></div><div class="ring"></div><div class="cap"><span class="n">Cardamom bun</span><span class="d">Hand-knotted, sugar-glazed</span></div></div>
  <div class="slide s3"><div class="img"></div><div class="shade"></div><div class="ring"></div><div class="cap"><span class="n">Sourdough</span><span class="d">48-hour ferment, open crumb</span></div></div>
  <div class="wipe"></div>
  <div class="brand">The Crust</div>
  <div class="num">01 / 03</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  const slides = gsap.utils.toArray('.slide');
  const per = 4 / 3;
  slides.forEach((s, i) => {
    const at = i * per;
    const img = s.querySelector('.img'), ring = s.querySelector('.ring');
    tl.set(s, { zIndex: i + 1 }, 0);
    // close-up push-in on the "photo", ring pulse like a macro focus lock
    tl.fromTo(img, { scale: 1.35, xPercent: i % 2 ? 4 : -4 }, { scale: 1.05, xPercent: 0, duration: per + 0.3, ease: 'power2.out' }, at)
      .fromTo(ring, { scale: 0, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.9, ease: 'expo.out' }, at + 0.05)
      .from(s.querySelector('.n'), { yPercent: 110, duration: 0.7, ease: 'expo.out' }, at + 0.1)
      .from(s.querySelector('.d'), { yPercent: 160, opacity: 0, duration: 0.7, ease: 'expo.out' }, at + 0.25);
    if (i > 0) tl.from(s, { clipPath: 'inset(0 0 100% 0)', duration: 0.55, ease: 'expo.inOut' }, at - 0.1);
    if (i > 0) tl.set('.num', { textContent: `0${i + 1} / 03` }, at + 0.15);
  });
  // a colour wipe closes the loop so slide 3 hands back to slide 1
  tl.to('.wipe', { scaleY: 1, duration: 0.35, ease: 'expo.in' }, 3.6)
    .set('.wipe', { transformOrigin: 'top' }, 3.96)
    .set('.num', { textContent: '01 / 03' }, 3.96)
    .to('.wipe', { scaleY: 0, duration: 0.04 }, 3.96);
</script>
