<!doctype html><meta charset="utf-8">
<title>Stretch</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101014}
  .track{position:absolute;left:140px;right:140px;top:50%;height:2px;margin-top:-1px;background:rgba(255,255,255,.12)}
  .pill{position:absolute;top:50%;left:140px;width:200px;height:120px;margin-top:-60px;border-radius:60px;background:#7cf0c8;display:flex;align-items:center;justify-content:center;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:40px;letter-spacing:-.03em;color:#101014;will-change:transform}
  .pill.b{background:#ff7ad9;top:26%}
  .pill.c{background:#ffd23f;top:74%}
  .lbl{position:absolute;left:140px;top:80px;font-size:18px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.5)}
  .stops{position:absolute;left:140px;right:140px;top:50%;display:flex;justify-content:space-between;margin-top:-6px}
  .stops i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.3);display:block}
</style>
<div class="stage">
  <div class="lbl">Stretch · elastic move</div>
  <div class="track"></div>
  <div class="stops"><i></i><i></i><i></i></div>
  <div class="pill b">Left</div>
  <div class="pill a">Move</div>
  <div class="pill c">Right</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 3 });
  const dist = 1280 - 280 - 200; // travel between track ends
  function hop(sel, at, dir) {
    const from = dir > 0 ? 0 : dist, to = dir > 0 ? dist : 0;
    // anticipation: stretch away from the direction of travel, then fly, elongated, and snap back at the stop
    tl.set(sel, { transformOrigin: dir > 0 ? '0% 50%' : '100% 50%' }, at)
      .fromTo(sel, { x: from, scaleX: 1, scaleY: 1 }, { scaleX: 1.6, scaleY: 0.8, duration: 0.25, ease: 'power2.in' }, at)
      .to(sel, { x: to, duration: 0.5, ease: 'move' }, at + 0.25)
      .set(sel, { transformOrigin: dir > 0 ? '100% 50%' : '0% 50%' }, at + 0.25)
      .to(sel, { scaleX: 1, scaleY: 1, duration: 0.9, ease: 'elastic.out(1.1,0.35)' }, at + 0.32);
  }
  hop('.pill.a', 0.1, 1);
  hop('.pill.b', 0.35, 1);
  hop('.pill.c', 0.6, 1);
  hop('.pill.a', 1.6, -1);
  hop('.pill.b', 1.85, -1);
  hop('.pill.c', 2.1, -1);
</script>
