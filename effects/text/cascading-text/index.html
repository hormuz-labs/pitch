<!doctype html><meta charset="utf-8">
<title>Cascading Text</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0f172a;color:#fff}
  .bg{position:absolute;inset:0;background:url("../../../assets/backgrounds/aurora.png") center/cover;opacity:.35}
  .stack{position:absolute;left:100px;top:50%;transform:translateY(-50%)}
  .row{overflow:hidden;line-height:1.02}
  .ln{display:block;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:104px;letter-spacing:-.04em;transform-origin:50% 100%;will-change:transform}
  .ln.hi{color:#7cffc4}
  .num{position:absolute;right:100px;top:50%;transform:translateY(-50%);text-align:right;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:#93a0b8;line-height:2.4}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="stack">
    <div class="row"><span class="ln">Faster builds.</span></div>
    <div class="row"><span class="ln">Fewer meetings.</span></div>
    <div class="row"><span class="ln hi">Ship on Friday.</span></div>
    <div class="row"><span class="ln">Sleep on Sunday.</span></div>
  </div>
  <div class="num">01 Speed<br>02 Focus<br>03 Rhythm<br>04 Rest</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 5 });
  tl.fromTo('.bg', { scale: 1.1, y: 10 }, { scale: 1.02, y: -10, duration: 5, ease: 'none' }, 0);
  // each line falls in from above its slot and lands with a squash, one after the other
  const lines = gsap.utils.toArray('.ln');
  lines.forEach((el, i) => {
    const t = 0.15 + i * 0.42;
    tl.fromTo(el, { yPercent: -110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: .55, ease: 'power3.in' }, t)
      .fromTo(el, { scaleY: 1 }, { scaleY: .86, duration: .09, ease: 'power2.out' }, t + .5)
      .to(el, { scaleY: 1, duration: .5, ease: 'elastic.out(1,.4)' }, t + .59);
  });
  tl.from('.num', { x: 20, opacity: 0, duration: .8, ease: 'power3.out' }, 1.2);
  // exit: lines drop out the bottom in the same order
  tl.to('.ln', { yPercent: 110, opacity: 0, duration: .4, stagger: .07, ease: 'power3.in' }, 4.25)
    .to('.num', { opacity: 0, duration: .3 }, 4.4);
</script>
