<!doctype html><meta charset="utf-8">
<title>Gradients: Animated List</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0f0f12;color:#fff}
  .head{position:absolute;left:100px;top:86px;font-family:"Atlas Grotesk",sans-serif;font-weight:500;font-size:22px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.55)}
  .list{position:absolute;left:100px;right:100px;top:150px;display:flex;flex-direction:column;gap:18px}
  .row{position:relative;height:104px;border-radius:22px;overflow:hidden;display:flex;align-items:center;padding:0 40px;will-change:transform,opacity;transform-origin:0 50%}
  .row .g{position:absolute;inset:0;background-size:300% 300%;will-change:background-position}
  .r1 .g{background-image:linear-gradient(115deg,#ff7a18,#ff2d95,#7b2cff,#ff7a18)}
  .r2 .g{background-image:linear-gradient(115deg,#00e0ff,#3b82f6,#a855f7,#00e0ff)}
  .r3 .g{background-image:linear-gradient(115deg,#a3ff12,#00d68f,#00b8d9,#a3ff12)}
  .r4 .g{background-image:linear-gradient(115deg,#ffd23f,#ff8a3d,#ff3d6e,#ffd23f)}
  .row .n{position:relative;font-family:"Atlas Grotesk",monospace;font-size:20px;opacity:.75;width:60px;letter-spacing:.1em}
  .row .t{position:relative;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:44px;letter-spacing:-.02em;white-space:nowrap}
  .row .d{position:relative;margin-left:auto;font-family:"Atlas Grotesk",sans-serif;font-size:20px;opacity:.85;white-space:nowrap}
  .row .sheen{position:absolute;top:0;bottom:0;width:220px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(255,255,255,0));transform:skewX(-20deg)}
</style>
<div class="stage">
  <div class="head">Acme — Autumn Menu</div>
  <div class="list">
    <div class="row r1"><div class="g"></div><div class="sheen"></div><span class="n">01</span><span class="t">Smart Sync</span><span class="d">Everything, everywhere</span></div>
    <div class="row r2"><div class="g"></div><div class="sheen"></div><span class="n">02</span><span class="t">Live Collab</span><span class="d">Cursors in real time</span></div>
    <div class="row r3"><div class="g"></div><div class="sheen"></div><span class="n">03</span><span class="t">Auto Layout</span><span class="d">Grids that think</span></div>
    <div class="row r4"><div class="g"></div><div class="sheen"></div><span class="n">04</span><span class="t">Night Mode</span><span class="d">Easy on the eyes</span></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 6 });
  const rows = gsap.utils.toArray('.row');
  tl.from('.head', { opacity: 0, x: -20, duration: 0.6, ease: 'power3.out' }, 0.1).to('.head', { opacity: 0, duration: 0.3 }, 5.5);
  rows.forEach((r, i) => {
    const g = r.querySelector('.g'), sh = r.querySelector('.sheen');
    // each row's gradient drifts on its own phase and speed for the whole loop
    tl.fromTo(g, { backgroundPosition: '0% 50%' }, { backgroundPosition: '100% 50%', duration: 6 / (1 + i * 0.25), ease: 'none', repeat: -1 }, 0);
    // rows enter: slide + scale from left, expo, staggered
    tl.fromTo(r, { xPercent: -8, scaleX: 0.6, opacity: 0 }, { xPercent: 0, scaleX: 1, opacity: 1, duration: 0.9, ease: 'expo.out' }, 0.25 + i * 0.16);
    tl.from(r.querySelectorAll('.n,.t,.d'), { y: 24, opacity: 0, duration: 0.6, ease: 'power3.out', stagger: 0.06 }, 0.55 + i * 0.16);
    // a light sheen crosses each row at a different moment
    tl.fromTo(sh, { x: -260 }, { x: 1300, duration: 1.1, ease: 'power2.inOut' }, 1.6 + i * 0.35);
    // exit in reverse order
    tl.to(r, { xPercent: 6, scaleX: 0.7, opacity: 0, duration: 0.45, ease: 'power3.in' }, 5.35 + (rows.length - 1 - i) * 0.08);
  });
  // the whole list breathes very slightly to keep the frame alive mid-loop
  tl.to('.list', { y: -6, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
</script>
