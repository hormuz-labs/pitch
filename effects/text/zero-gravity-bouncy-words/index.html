<!doctype html><meta charset="utf-8">
<title>Zero Gravity: Bouncy Words</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#e9e4ff}
  .word{position:absolute;padding:.18em .5em;border-radius:999px;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:112px;line-height:1;letter-spacing:-.03em;color:#fff;white-space:nowrap;will-change:transform;transform-origin:50% 50%}
  .w1{background:#ff5c8a;left:120px;top:150px}
  .w2{background:#5b4dff;left:420px;top:420px}
  .w3{background:#111;left:100px;top:700px;color:#ffd23f}
  .w4{background:#00b894;left:640px;top:180px}
  .w5{background:#ff9f1c;left:560px;top:760px}
  .dot{position:absolute;border-radius:50%;background:#5b4dff;opacity:.25}
  .tag{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:20px;letter-spacing:.3em;text-transform:uppercase;color:#5b4dff}
</style>
<div class="stage">
  <div class="dot" style="left:60px;top:520px;width:36px;height:36px"></div>
  <div class="dot" style="left:960px;top:560px;width:22px;height:22px"></div>
  <div class="dot" style="left:880px;top:80px;width:48px;height:48px"></div>
  <div class="dot" style="left:300px;top:980px;width:28px;height:28px"></div>
  <div class="word w1">Float</div>
  <div class="word w2">Bounce</div>
  <div class="word w3">Drift</div>
  <div class="word w4">Wobble</div>
  <div class="word w5">Play</div>
  <div class="tag">Acme · Zero Gravity</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 3;
  const tl = fx.timeline({ duration: D });
  const rnd = fx.rng(7);

  // weightless: every word drifts on a slow sine in x, y and rotation whose
  // period is the loop, so the field of words is always slowly turning
  document.querySelectorAll('.word').forEach((el, i) => {
    const dx = (rnd() - 0.5) * 90, dy = (rnd() - 0.5) * 110, dr = (rnd() - 0.5) * 22;
    tl.fromTo(el, { x: -dx, y: -dy, rotation: -dr }, { x: dx, y: dy, rotation: dr, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
    // the bounce: a tap from nowhere, the word squashes, springs, and settles
    const at = 0.15 + i * 0.5;
    tl.fromTo(el, { scaleX: 1, scaleY: 1 }, { scaleX: 1.25, scaleY: 0.75, duration: 0.12, ease: 'power2.in' }, at)
      .to(el, { scaleX: 1, scaleY: 1, duration: 0.9, ease: 'elastic.out(1.1,0.35)' }, at + 0.12)
      .to(el, { y: '-=70', duration: 0.28, ease: 'power2.out' }, at + 0.12)
      .to(el, { y: '+=70', duration: 0.5, ease: 'bounce.out' }, at + 0.4);
  });
  document.querySelectorAll('.dot').forEach((el, i) => {
    tl.fromTo(el, { y: -20 - i * 6 }, { y: 20 + i * 6, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  });
</script>
