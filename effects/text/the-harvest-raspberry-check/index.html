<!doctype html><meta charset="utf-8">
<title>The Harvest: Raspberry Check</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#1a2fd8}
  .check{position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(12,1fr)}
  .check i{display:block;background:#fff}
  .inner{position:absolute;left:90px;top:90px;right:90px;bottom:90px;background:#1a2fd8;overflow:hidden}
  .word{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Sorts Mill Goudy",serif;font-size:200px;line-height:.9;color:#fff;font-style:italic}
  .row{overflow:hidden;height:1em}.row span{display:block}
  .berry{position:absolute;width:130px;height:130px;will-change:transform}
  .berry svg{width:100%;height:100%;overflow:visible}
  .tag{position:absolute;left:0;right:0;bottom:36px;text-align:center;font-family:"Atlas Grotesk",sans-serif;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:#fff;overflow:hidden;height:30px}
  .tag span{display:block}
  .top{position:absolute;left:0;right:0;top:36px;text-align:center;font-family:"Atlas Grotesk",sans-serif;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:#fff;overflow:hidden;height:30px}
  .top span{display:block}
</style>
<div class="stage">
  <div class="check" id="check"></div>
  <div class="inner">
    <div class="top"><span>Acme Berries</span></div>
    <div class="word"><div class="row"><span>Berry</span></div><div class="row"><span>Good</span></div></div>
    <div id="berries"></div>
    <div class="tag"><span>Picked this morning</span></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const rng = fx.rng(23);
  const check = document.getElementById('check');
  for (let r = 0; r < 12; r++) for (let c = 0; c < 12; c++) {
    const i = document.createElement('i'); i.style.opacity = (r + c) % 2 ? 1 : 0; check.appendChild(i);
  }
  const berrySvg = () => `<svg viewBox="0 0 100 100"><g fill="#e8306b">${[[50,30],[36,42],[64,42],[28,58],[50,54],[72,58],[38,74],[62,74],[50,88]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="13"/>`).join('')}</g><g fill="#ff7aa8" opacity=".55">${[[46,26],[32,38],[60,38],[24,54],[46,50],[68,54],[34,70],[58,70],[46,84]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4"/>`).join('')}</g><path d="M50 18 c -10 -10 -22 -6 -26 0 c 8 4 18 4 26 0z" fill="#4caf50"/><path d="M50 18 c 10 -10 22 -6 26 0 c -8 4 -18 4 -26 0z" fill="#4caf50"/></svg>`;
  const wrap = document.getElementById('berries');
  const N = 7, berries = [];
  for (let i = 0; i < N; i++) {
    const d = document.createElement('div'); d.className = 'berry'; d.innerHTML = berrySvg();
    const s = .6 + rng() * .7; d.style.left = (60 + rng() * 780) + 'px'; d.style.top = (80 + rng() * 740) + 'px';
    d.style.width = d.style.height = (130 * s) + 'px';
    wrap.appendChild(d); berries.push(d);
  }
  const tl = fx.timeline({ duration: 6 });
  // the checkerboard frame ticks on cell by cell from the corners, the inner panel opens
  tl.from('#check i', { scale: 0, duration: .5, ease: 'back.out(2)', stagger: { each: .006, grid: [12, 12], from: 'edges' } }, 0)
    .from('.inner', { scale: 0, duration: .9, ease: 'expo.out' }, .35)
    .from('.row span', { yPercent: 110, duration: .9, ease: 'expo.out', stagger: .12 }, .8)
    .from('.top span, .tag span', { yPercent: 110, duration: .6, ease: 'expo.out', stagger: .1 }, 1.1);
  // berries drift in and keep drifting: each has its own lazy bob and slow spin
  berries.forEach((b, i) => {
    const dx = (rng() - .5) * 200, dy = (rng() - .5) * 160, rot = (rng() - .5) * 60;
    tl.from(b, { scale: 0, rotation: rot * 2, duration: .8, ease: 'back.out(1.7)' }, .9 + i * .09)
      .fromTo(b, { x: -dx, y: -dy, rotation: -rot }, { x: dx, y: dy, rotation: rot, duration: 4.2, ease: 'sine.inOut' }, 1.0)
      .to(b, { scale: 0, duration: .45, ease: 'back.in(2)' }, 5.2 + i * .04);
  });
  // the checkerboard slowly inverts its pattern during the hold
  tl.to('#check i', { opacity: (i) => 1 - +check.children[i].style.opacity, duration: .6, ease: 'power2.inOut', stagger: { each: .004, grid: [12, 12], from: 'center' } }, 3.0);
  tl.to('.row span', { yPercent: -110, duration: .45, ease: 'expo.in', stagger: .08 }, 5.3)
    .to('.top span, .tag span', { yPercent: -110, duration: .35, ease: 'expo.in' }, 5.45)
    .to('.inner', { scale: 0, duration: .5, ease: 'expo.in' }, 5.5)
    .to('#check i', { scale: 0, duration: .35, ease: 'power2.in', stagger: { each: .003, grid: [12, 12], from: 'center' } }, 5.55);
</script>
