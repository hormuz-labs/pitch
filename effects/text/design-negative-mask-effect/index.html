<!doctype html><meta charset="utf-8">
<title>Design: Negative Mask Effect</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#fff;isolation:isolate}
  .type{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#111;line-height:.9}
  .h{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:210px;letter-spacing:-.05em;text-transform:uppercase}
  .h.i{font-family:"Sorts Mill Goudy",serif;font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.02em;font-size:200px}
  .neg{position:absolute;background:#fff;mix-blend-mode:difference;will-change:transform}
  .c1{width:520px;height:520px;border-radius:50%;left:-260px;top:100px}
  .c2{width:360px;height:360px;border-radius:50%;left:800px;top:-180px}
  .bar{width:260px;height:900px;left:-300px;top:-90px;transform:rotate(18deg)}
  .sq{width:300px;height:300px;left:1000px;top:520px;border-radius:40px}
  .foot{position:absolute;left:64px;bottom:44px;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#111}
  .foot.r{left:auto;right:64px}
</style>
<div class="stage">
  <div class="type"><div class="h">Negative</div><div class="h i">space</div></div>
  <div class="foot">Editorial 04</div><div class="foot r">Inverted shapes</div>
  <div class="neg c1"></div><div class="neg c2"></div><div class="neg bar"></div><div class="neg sq"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  tl.from('.h', { yPercent: 40, opacity: 0, duration: .8, stagger: .12, ease: 'expo.out' }, 0)
    .from('.foot', { opacity: 0, y: 8, duration: .5, stagger: .1 }, .5);
  // inverted shapes sweep through the type; each one inverts whatever it covers
  tl.fromTo('.c1', { x: 0, scale: .6 }, { x: 1500, scale: 1.1, duration: 3.2, ease: 'power2.inOut' }, .2)
    .fromTo('.c2', { y: 0 }, { y: 800, duration: 3.0, ease: 'power1.inOut' }, .6)
    .fromTo('.bar', { x: 0 }, { x: 1700, duration: 2.2, ease: 'expo.inOut' }, 1.0)
    .fromTo('.sq', { x: 0, y: 0, rotation: 0 }, { x: -1100, y: -380, rotation: 90, duration: 2.6, ease: 'power2.inOut' }, 1.1);
  tl.to('.h', { yPercent: -40, opacity: 0, duration: .4, stagger: .08, ease: 'expo.in' }, 3.5)
    .to('.foot', { opacity: 0, duration: .3 }, 3.6);
</script>
