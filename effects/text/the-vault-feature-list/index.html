<!doctype html><meta charset="utf-8">
<title>The Vault: Feature List</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0c0d10;color:#f2f2f5;font-family:"Atlas Grotesk",sans-serif}
  .grid{position:absolute;inset:0;background-image:radial-gradient(#22252f 1px,transparent 1px);background-size:32px 32px;opacity:.6}
  .left{position:absolute;left:90px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-size:16px;letter-spacing:.3em;text-transform:uppercase;color:#7fe0a0;overflow:hidden;height:22px}
  .eyebrow span{display:block}
  .title{margin-top:18px;font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:64px;line-height:1;letter-spacing:-.03em}
  .title .r{overflow:hidden;height:1.05em}.title .r span{display:block}
  .desc{margin-top:24px;font-size:20px;line-height:1.5;color:#8b90a3;max-width:440px;overflow:hidden}
  .desc span{display:block}
  .list{position:absolute;right:90px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center;gap:14px}
  .item{display:flex;align-items:center;gap:18px;background:#15171e;border:1px solid #262a36;border-radius:16px;padding:20px 22px;position:relative;overflow:hidden}
  .item .chk{width:36px;height:36px;border-radius:50%;border:2px solid #2c3040;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
  .item .chk svg{width:20px;height:20px;overflow:visible}
  .item .chk path{fill:none;stroke:#0c0d10;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .item .chk .f{position:absolute;inset:-2px;border-radius:50%;background:#7fe0a0;transform:scale(0)}
  .item .chk svg{position:relative}
  .item .t{font-size:22px;font-weight:500;overflow:hidden}
  .item .t span{display:block}
  .item .n{margin-left:auto;font-size:16px;color:#5f6475;font-variant-numeric:tabular-nums}
  .item .bar{position:absolute;left:0;bottom:0;height:2px;background:#7fe0a0;width:100%;transform-origin:left center}
  .stat{position:absolute;left:90px;bottom:64px;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:#5f6475}
</style>
<div class="stage">
  <div class="grid"></div>
  <div class="left">
    <div class="eyebrow"><span>Vault · Business</span></div>
    <div class="title"><div class="r"><span>Built for</span></div><div class="r"><span>moving money.</span></div></div>
    <div class="desc"><span>Payments, cards and treasury in one ledger. Every feature below, on from day one.</span></div>
  </div>
  <div class="list">
    <div class="item"><div class="chk"><i class="f"></i><svg viewBox="0 0 20 20"><path d="M3 10.5 L 8 15 L 17 5"/></svg></div><div class="t"><span>Instant settlements</span></div><div class="n">01</div><i class="bar"></i></div>
    <div class="item"><div class="chk"><i class="f"></i><svg viewBox="0 0 20 20"><path d="M3 10.5 L 8 15 L 17 5"/></svg></div><div class="t"><span>Multi-currency accounts</span></div><div class="n">02</div><i class="bar"></i></div>
    <div class="item"><div class="chk"><i class="f"></i><svg viewBox="0 0 20 20"><path d="M3 10.5 L 8 15 L 17 5"/></svg></div><div class="t"><span>Virtual team cards</span></div><div class="n">03</div><i class="bar"></i></div>
    <div class="item"><div class="chk"><i class="f"></i><svg viewBox="0 0 20 20"><path d="M3 10.5 L 8 15 L 17 5"/></svg></div><div class="t"><span>Automated approvals</span></div><div class="n">04</div><i class="bar"></i></div>
    <div class="item"><div class="chk"><i class="f"></i><svg viewBox="0 0 20 20"><path d="M3 10.5 L 8 15 L 17 5"/></svg></div><div class="t"><span>24/7 human support</span></div><div class="n">05</div><i class="bar"></i></div>
  </div>
  <div class="stat"><span id="cnt">0</span> / 5 enabled</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 10 });
  tl.from('.eyebrow span', { yPercent: 110, duration: .6, ease: 'expo.out' }, 0)
    .from('.title .r span', { yPercent: 110, duration: .8, ease: 'expo.out', stagger: .1 }, .1)
    .from('.desc span', { yPercent: 110, duration: .7, ease: 'expo.out' }, .4)
    .from('.stat', { opacity: 0, duration: .5 }, .8)
    .from('.grid', { opacity: 0, duration: 1 }, 0);
  // each feature slides in, then is "checked": the circle fills, the tick draws, an underline runs across
  const items = gsap.utils.toArray('.item');
  tl.from(items, { x: 60, opacity: 0, duration: .7, ease: 'expo.out', stagger: .1 }, .5)
    .from('.item .t span', { yPercent: 110, duration: .5, ease: 'expo.out', stagger: .1 }, .7)
    .set('.item .chk path', { drawSVG: '0%' }, 0)
    .set('.item .bar', { scaleX: 0 }, 0);
  items.forEach((el, i) => {
    const t0 = 1.6 + i * .9;
    tl.to(el.querySelector('.f'), { scale: 1, duration: .35, ease: 'back.out(2.5)' }, t0)
      .to(el.querySelector('.chk'), { borderColor: '#7fe0a0', duration: .2 }, t0)
      .to(el.querySelector('path'), { drawSVG: '100%', duration: .35, ease: 'power2.out' }, t0 + .12)
      .fromTo(el, { backgroundColor: '#15171e' }, { backgroundColor: '#1a2a22', duration: .25, yoyo: true, repeat: 1 }, t0)
      .to(el, { x: 8, duration: .15, ease: 'power2.out' }, t0).to(el, { x: 0, duration: .6, ease: 'elastic.out(1,.4)' }, t0 + .15)
      .to(el.querySelector('.bar'), { scaleX: 1, duration: .8, ease: 'expo.out' }, t0 + .1)
      .to({}, { duration: .01, onStart() { document.getElementById('cnt').textContent = i + 1; }, onReverseComplete() { document.getElementById('cnt').textContent = i; } }, t0 + .1);
  });
  // hold: a light pulse chases down the ticks; exit staggered off
  tl.to('.item .f', { scale: 1.15, duration: .25, ease: 'sine.inOut', yoyo: true, repeat: 1, stagger: .08 }, 6.6)
    .to(items, { x: 60, opacity: 0, duration: .4, ease: 'power3.in', stagger: { each: .06, from: 'end' } }, 9.0)
    .to('.title .r span, .eyebrow span, .desc span', { yPercent: -110, duration: .4, ease: 'expo.in', stagger: .05 }, 9.2)
    .to('.stat', { opacity: 0, duration: .3 }, 9.4);
</script>
