<!doctype html><meta charset="utf-8">
<title>Multiply</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  :root{--scale:min(calc(100vw / 1280px), calc(100vh / 720px))}
  body{background:#f2ede4}
  .stage{background:#f2ede4;display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;overflow:hidden}
  .artboard{position:absolute;width:1280px;height:720px;background:#f2ede4;overflow:hidden;transform-origin:center center;transform:scale(var(--scale, 1))}
  .s{position:absolute;mix-blend-mode:multiply;will-change:transform}
  .c1{width:520px;height:520px;border-radius:50%;background:#ff4d3d;left:240px;top:60px}
  .c2{width:560px;height:560px;border-radius:50%;background:#2d6cff;left:540px;top:120px}
  .c3{width:440px;height:440px;border-radius:50%;background:#ffd23f;left:420px;top:-40px}
  .r1{width:700px;height:120px;background:#19c6a5;left:100px;top:470px}
  .r2{width:160px;height:640px;background:#ff8ac2;left:960px;top:40px}
  .t{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:"Sorts Mill Goudy",serif;font-size:250px;line-height:1;color:#1a1a1a;mix-blend-mode:multiply;letter-spacing:-.02em;will-change:transform}
  .t.i{font-style:italic;color:#2d6cff;mix-blend-mode:multiply}
  .cap{position:absolute;left:60px;bottom:52px;font-family:"Atlas Grotesk",sans-serif;font-size:15px;letter-spacing:.4em;text-transform:uppercase;color:#1a1a1a;opacity:.7}
  .cap2{position:absolute;right:60px;bottom:52px;font-family:"Atlas Grotesk",sans-serif;font-size:15px;letter-spacing:.4em;text-transform:uppercase;color:#1a1a1a;opacity:.7}
</style>
<div class="stage">
  <div class="artboard">
    <div class="s c1"></div><div class="s c2"></div><div class="s c3"></div><div class="s r1"></div><div class="s r2"></div>
    <div class="t">Multiply</div>
    <div class="t i">Multiply</div>
    <div class="cap">Antinomy — Issue 04</div>
    <div class="cap2">Blend study</div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  function updateScale() {
    const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    document.documentElement.style.setProperty('--scale', s);
  }
  window.addEventListener('resize', updateScale);
  updateScale();

  const D = 8, TAU = Math.PI * 2;
  fx.register({
    duration: D,
    seek(t) {
      // every value is periodic in t over 8s: the loop is seamless, the shapes drift through each other and colours stack up
      const p = (t / D) * TAU;
      gsap.set('.c1', { x: Math.sin(p) * 260, y: Math.cos(p * 2) * 60, scale: 1 + Math.sin(p + 1) * 0.12 });
      gsap.set('.c2', { x: Math.sin(p + Math.PI) * 300, y: Math.sin(p) * 90, scale: 1 + Math.cos(p) * 0.1 });
      gsap.set('.c3', { x: Math.cos(p) * 200, y: Math.sin(p * 2 + 1) * 120, scale: 0.9 + Math.sin(p * 2) * 0.15 });
      gsap.set('.r1', { x: Math.sin(p + 2) * 220, rotate: Math.sin(p) * 14, scaleX: 1 + Math.cos(p) * 0.2 });
      gsap.set('.r2', { x: Math.cos(p + 1) * 240, rotate: Math.cos(p * 2) * -18, scaleY: 1 + Math.sin(p * 2) * 0.15 });
      gsap.set('.t:not(.i)', { x: Math.sin(p) * 40, y: -50 + Math.cos(p) * 12 });
      gsap.set('.t.i', { x: Math.sin(p + Math.PI) * 40, y: 50 + Math.cos(p + Math.PI) * 12 });
    }
  });
</script>
