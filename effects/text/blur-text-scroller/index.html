<!doctype html><meta charset="utf-8">
<title>Blur: Text Scroller</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0c0c0f;color:#fff}
  .win{position:absolute;inset:0;overflow:hidden}
  .col{position:absolute;left:0;right:0;top:50%;filter:url(#mb);will-change:transform}
  .w{height:200px;display:flex;align-items:center;justify-content:center;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:150px;letter-spacing:-.05em;text-transform:uppercase;line-height:1;margin-top:-100px;position:relative}
  .w:not(:first-child){margin-top:0}
  .w small{position:absolute;right:120px;top:50%;transform:translateY(-50%);font-family:"Atlas Grotesk",sans-serif;font-size:16px;letter-spacing:.2em;color:#6d6d7a;text-transform:uppercase}
  .fade{position:absolute;inset:0;background:linear-gradient(180deg,#0c0c0f 0%,rgba(12,12,15,0) 28%,rgba(12,12,15,0) 72%,#0c0c0f 100%);pointer-events:none}
  .rule{position:absolute;left:80px;right:80px;top:50%;height:1px;background:rgba(255,255,255,.14)}
  .ticks{position:absolute;left:80px;top:40px;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#6d6d7a}
</style>
<div class="stage">
  <svg width="0" height="0" style="position:absolute"><filter id="mb" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur id="blur" stdDeviation="0 0"/></filter></svg>
  <div class="win">
    <div class="rule"></div>
    <div class="col" id="col"></div>
    <div class="fade"></div>
  </div>
  <div class="ticks">Editorial — the year in six words</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const words = ['Momentum', 'Velocity', 'Clarity', 'Focus', 'Rhythm', 'Signal'];
  const col = document.getElementById('col');
  // three copies: the middle one is what we scroll through; loop resets to the same visual
  for (let k = 0; k < 3; k++) words.forEach((w, i) => {
    const d = document.createElement('div'); d.className = 'w';
    d.innerHTML = `${w}<small>0${i + 1} / 06</small>`; col.appendChild(d);
  });
  const STEP = 200, N = words.length, HOLD = 1.5;
  const tl = fx.timeline({ duration: N * HOLD });
  gsap.set(col, { y: -STEP * N });          // start on the first word of the middle copy
  const blur = document.getElementById('blur');
  const pos = { v: 0 };
  for (let i = 0; i < N; i++) {
    const t0 = i * HOLD + 0.85;
    tl.to(col, { y: -STEP * (N + i + 1), duration: .55, ease: 'expo.inOut' }, t0);
    // blur peaks mid-move, in the direction of travel
    tl.fromTo(blur, { attr: { stdDeviation: '0 0' } }, { attr: { stdDeviation: '0 26' }, duration: .27, ease: 'power2.in' }, t0)
      .to(blur, { attr: { stdDeviation: '0 0' }, duration: .3, ease: 'power2.out' }, t0 + .27);
    // the word that lands gets a tiny overshoot-free settle: opacity of neighbours
  }
  // rows dim the further they are from the centre line, as a function of y
  const rows = col.querySelectorAll('.w');
  const upd = { p: 0 };
  function dim() {
    const y = gsap.getProperty(col, 'y');
    rows.forEach((r, j) => {
      const c = y + j * STEP;             // row centre relative to the stage centre line
      const d = Math.min(1, Math.abs(c) / 260);
      r.style.opacity = (1 - d * .78).toFixed(3);
      r.style.transform = `scale(${(1 - d * .18).toFixed(3)})`;
    });
  }
  dim();
  tl.to(upd, { p: 1, duration: N * HOLD, ease: 'none', onUpdate: dim }, 0);
</script>
