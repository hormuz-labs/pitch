<!doctype html><meta charset="utf-8">
<title>Text Mirror Effect</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0a0a0a}
  .bg{position:absolute;inset:0;background:url("../../../assets/backgrounds/aurora.png") center/cover;opacity:.5;filter:saturate(.7) blur(2px)}
  .axis{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.35)}
  .axisv{position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(255,255,255,.12)}
  .half{position:absolute;left:0;right:0;height:50%;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
  .half.top{top:0}
  .half.bot{top:50%;align-items:flex-start;transform:scaleY(-1)}
  .word{display:flex;font-family:"Sorts Mill Goudy",serif;font-size:150px;line-height:.86;letter-spacing:.02em;color:#fff;white-space:nowrap;padding-bottom:4px;transform-origin:50% 100%}
  .bot .word{color:rgba(255,255,255,.55);-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0),#000 65%);mask-image:linear-gradient(180deg,rgba(0,0,0,0),#000 65%);padding-bottom:0;padding-top:4px;transform-origin:50% 0%}
  .ch{display:inline-block;will-change:transform,opacity}
  .side{position:absolute;top:50%;font-size:16px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:-8px}
  .side.l{left:60px}.side.r{right:60px}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="axisv"></div>
  <div class="half top"><div class="word" id="top"></div></div>
  <div class="half bot"><div class="word" id="bot"></div></div>
  <div class="axis"></div>
  <div class="side l">Reflect</div><div class="side r">Symmetry</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const text = 'Symmetria';
  for (const id of ['top', 'bot']) {
    document.getElementById(id).innerHTML = [...text].map(c => `<span class="ch">${c}</span>`).join('');
  }
  const tl = fx.timeline({ duration: 4 });
  const topC = gsap.utils.toArray('#top .ch'), botC = gsap.utils.toArray('#bot .ch');
  // letters fold up from the mirror line, the reflection following a beat later
  tl.from(topC, { yPercent: 105, rotateX: -70, opacity: 0, transformOrigin: '50% 100%', stagger: { each: 0.06, from: 'center' }, duration: 1.0, ease: 'expo.out' }, 0.1)
    .from(botC, { yPercent: -105, rotateX: 70, opacity: 0, transformOrigin: '50% 0%', stagger: { each: 0.06, from: 'center' }, duration: 1.0, ease: 'expo.out' }, 0.22)
    .from('.axis', { scaleX: 0, duration: 0.9, ease: 'expo.inOut' }, 0)
    .from('.side', { opacity: 0, x: (i) => i ? 20 : -20, duration: 0.6 }, 0.8)
    // the composition breathes: letter-spacing opens then the mirror halves drift apart and back
    .to('#top', { letterSpacing: '0.12em', duration: 1.4, ease: 'sine.inOut' }, 1.2)
    .to('#bot', { letterSpacing: '0.12em', duration: 1.4, ease: 'sine.inOut' }, 1.2)
    .to('.half.top .word', { y: -22, duration: 1.4, ease: 'sine.inOut' }, 1.2)
    .to('.half.bot .word', { y: 22, duration: 1.4, ease: 'sine.inOut' }, 1.2)
    .to('.bg', { scale: 1.08, duration: 4, ease: 'none' }, 0)
    // exit: the halves close on the mirror line
    .to(topC, { yPercent: 105, opacity: 0, stagger: { each: 0.03, from: 'edges' }, duration: 0.45, ease: 'expo.in' }, 3.35)
    .to(botC, { yPercent: -105, opacity: 0, stagger: { each: 0.03, from: 'edges' }, duration: 0.45, ease: 'expo.in' }, 3.35)
    .to('.axis', { scaleX: 0, duration: 0.4, ease: 'expo.in' }, 3.6)
    .to('.side', { opacity: 0, duration: 0.3 }, 3.5);
</script>
