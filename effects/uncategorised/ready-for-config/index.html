<!doctype html><meta charset="utf-8">
<title>Ready For Config</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#1e1e1e;color:#fff;overflow:hidden}
  .shape{position:absolute;will-change:transform}
  .s1{left:90px;top:120px;width:220px;height:220px;border-radius:50%;background:#f24e1e}
  .s2{right:90px;top:140px;width:220px;height:220px;border-radius:110px 0 0 110px;background:#ff7262}
  .s3{left:120px;bottom:130px;width:220px;height:220px;border-radius:0 110px 110px 0;background:#a259ff}
  .s4{right:120px;bottom:120px;width:220px;height:220px;background:#1abcfe;border-radius:110px 110px 0 0}
  .s5{left:50%;top:50%;width:160px;height:160px;margin:-80px 0 0 -80px;border-radius:50%;background:#0acf83;transform:scale(0)}
  .copy{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
  .line{overflow:hidden;line-height:1}
  .line span{display:inline-block;font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:150px;letter-spacing:-.05em;text-transform:uppercase}
  .kicker{font-size:18px;letter-spacing:.34em;text-transform:uppercase;opacity:.8;margin-bottom:24px}
  .date{font-size:20px;letter-spacing:.2em;text-transform:uppercase;margin-top:28px;opacity:.85}
  .confetti{position:absolute;inset:0;pointer-events:none}
  .cf{position:absolute;left:50%;top:50%;width:14px;height:22px;border-radius:3px;opacity:0}
</style>
<div class="stage">
  <div class="shape s1"></div><div class="shape s2"></div><div class="shape s3"></div><div class="shape s4"></div><div class="shape s5"></div>
  <div class="confetti" id="cf"></div>
  <div class="copy">
    <div class="line"><div class="kicker">June 24 – 26 · San Francisco</div></div>
    <div class="line"><span>Ready</span></div>
    <div class="line"><span>for</span></div>
    <div class="line"><span>Config</span></div>
    <div class="line"><div class="date">See you there</div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 9;
  const tl = fx.timeline({ duration: D });
  const rnd = fx.rng(42);
  const cols = ['#f24e1e', '#ff7262', '#a259ff', '#1abcfe', '#0acf83', '#ffd23f'];
  const box = document.getElementById('cf');
  const bits = [];
  for (let i = 0; i < 60; i++) { const d = document.createElement('div'); d.className = 'cf'; d.style.background = cols[i % cols.length]; box.appendChild(d); bits.push(d); }
  const shapes = ['.s1', '.s2', '.s3', '.s4'];
  // 1. the shapes bounce in from the edges
  tl.from('.s1', { x: -400, y: -300, rotation: -90, duration: 1, ease: 'back.out(1.5)' }, 0)
    .from('.s2', { x: 400, y: -300, rotation: 90, duration: 1, ease: 'back.out(1.5)' }, 0.1)
    .from('.s3', { x: -400, y: 300, rotation: 90, duration: 1, ease: 'back.out(1.5)' }, 0.2)
    .from('.s4', { x: 400, y: 300, rotation: -90, duration: 1, ease: 'back.out(1.5)' }, 0.3);
  // 2. the words push in line by line
  tl.from('.kicker', { yPercent: 120, duration: 0.7, ease: 'expo.out' }, 0.8)
    .from('.line span', { yPercent: 115, duration: 0.9, ease: 'expo.out', stagger: 0.12 }, 0.95)
    .from('.date', { yPercent: 120, duration: 0.7, ease: 'expo.out' }, 1.5);
  // 3. the centre dot pops and bursts confetti
  tl.to('.s5', { scale: 1, duration: 0.5, ease: 'back.out(3)' }, 2.2)
    .to('.s5', { scale: 0, duration: 0.3, ease: 'power2.in' }, 2.9);
  bits.forEach(b => {
    const a = rnd() * Math.PI * 2, dist = 260 + rnd() * 380;
    tl.fromTo(b, { x: 0, y: 0, opacity: 1, rotation: 0 }, { x: Math.cos(a) * dist, y: Math.sin(a) * dist + 200, rotation: 360 + rnd() * 540, opacity: 0, duration: 1.4 + rnd() * 0.6, ease: 'power3.out' }, 2.8 + rnd() * 0.15);
  });
  // 4. the shapes keep dancing: slow spin and a synchronised hop, so nothing sits still
  shapes.forEach((s, i) => {
    tl.to(s, { rotation: (i % 2 ? 1 : -1) * 90, duration: 4.6, ease: 'sine.inOut' }, 2.4)
      .to(s, { y: -30, duration: 0.6, ease: 'power2.inOut', yoyo: true, repeat: 3 }, 3.4 + i * 0.15);
  });
  // 5. exit for the loop: words push up, shapes fly back out the way they came
  tl.to('.date', { yPercent: -120, duration: 0.45, ease: 'expo.in' }, D - 1.3)
    .to('.line span', { yPercent: -115, duration: 0.5, ease: 'expo.in', stagger: 0.08 }, D - 1.25)
    .to('.kicker', { yPercent: -120, duration: 0.45, ease: 'expo.in' }, D - 1.0)
    .to('.s1', { x: -400, y: -300, duration: 0.55, ease: 'back.in(1.5)' }, D - 0.7)
    .to('.s2', { x: 400, y: -300, duration: 0.55, ease: 'back.in(1.5)' }, D - 0.65)
    .to('.s3', { x: -400, y: 300, duration: 0.55, ease: 'back.in(1.5)' }, D - 0.6)
    .to('.s4', { x: 400, y: 300, duration: 0.55, ease: 'back.in(1.5)' }, D - 0.55);
</script>
