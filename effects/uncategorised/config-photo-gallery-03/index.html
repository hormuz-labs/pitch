<!doctype html><meta charset="utf-8">
<title>Config: Photo Gallery 03</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#1a1a1d;color:#fff}
  .big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:330px;letter-spacing:-.06em;line-height:1;color:#2a2a2f;text-transform:uppercase}
  .big span{display:inline-block}
  .photo{position:absolute;width:300px;height:220px;padding:10px 10px 34px;background:#fff;border-radius:6px;box-shadow:0 40px 60px -20px rgba(0,0,0,.6);will-change:transform;opacity:0}
  .photo .im{width:100%;height:100%;background-size:cover;background-position:center}
  .photo .c{position:absolute;left:12px;bottom:9px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#444}
  .a{background-image:url("../../../assets/backgrounds/aurora.png")}
  .o{background-image:url("../../../assets/backgrounds/ocean.png")}
  .s{background-image:url("../../../assets/backgrounds/sunset.png")}
  .h1{filter:hue-rotate(120deg)}.h2{filter:sepia(.6)}.h3{filter:grayscale(1) contrast(1.2)}
  .tag{position:absolute;left:0;right:0;bottom:56px;text-align:center;font-size:14px;letter-spacing:.3em;text-transform:uppercase;opacity:.7}
  .tag span{display:inline-block}
  .tagrow{overflow:hidden}
</style>
<div class="stage">
  <div class="big"><span>C</span><span>o</span><span>n</span><span>f</span><span>i</span><span>g</span></div>
  <div class="photo" style="left:120px;top:90px"><div class="im a"></div><div class="c">01 · Doors open</div></div>
  <div class="photo" style="left:860px;top:70px;width:260px;height:300px"><div class="im o h2"></div><div class="c">02 · Keynote</div></div>
  <div class="photo" style="left:500px;top:300px;width:320px;height:230px"><div class="im s"></div><div class="c">03 · Main stage</div></div>
  <div class="photo" style="left:150px;top:400px;width:280px;height:210px"><div class="im o h1"></div><div class="c">04 · Hallway</div></div>
  <div class="photo" style="left:900px;top:410px;width:250px;height:220px"><div class="im a h3"></div><div class="c">05 · Night</div></div>
  <div class="tagrow tag"><span>Photo gallery · 03 · design community</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 6;
  const tl = fx.timeline({ duration: D });
  const photos = gsap.utils.toArray('.photo');
  const rnd = fx.rng(3);
  const rots = photos.map(() => (rnd() - 0.5) * 16);
  // the word settles first, letter by letter
  tl.from('.big span', { yPercent: 40, opacity: 0, duration: 0.8, ease: 'expo.out', stagger: 0.05 }, 0);
  // photos drop in one at a time, scaling down from the camera with a little spin, and land with a soft overshoot
  photos.forEach((p, i) => {
    const t = 0.5 + i * 0.5;
    tl.fromTo(p, { opacity: 0, scale: 1.6, rotation: rots[i] + 25, y: -80 },
      { opacity: 1, scale: 1, rotation: rots[i], y: 0, duration: 0.75, ease: 'move' }, t);
    // while they hold, each photo drifts slightly so the frame never freezes
    tl.to(p, { y: -10 + i * 3, rotation: rots[i] + (i % 2 ? 2 : -2), duration: 1.6, ease: 'sine.inOut' }, t + 0.75);
  });
  tl.from('.tag span', { yPercent: 120, duration: 0.6, ease: 'expo.out' }, 1.2);
  // exit: photos sweep up and out in the order they came, the word follows
  photos.forEach((p, i) => {
    tl.to(p, { y: -800, rotation: rots[i] - 20, duration: 0.55, ease: 'expo.in' }, 4.6 + i * 0.12);
  });
  tl.to('.tag span', { yPercent: -120, duration: 0.4, ease: 'expo.in' }, 5.1)
    .to('.big span', { yPercent: -40, opacity: 0, duration: 0.45, ease: 'expo.in', stagger: 0.04 }, 5.3);
</script>
