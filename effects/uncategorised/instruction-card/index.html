<!doctype html><meta charset="utf-8">
<title>Instruction Card</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f4f5f7;color:#111418}
  .card{position:absolute;left:50%;top:50%;width:640px;height:520px;margin:-260px 0 0 -320px;background:#fff;border-radius:28px;box-shadow:0 40px 80px -30px rgba(20,30,60,.25);padding:44px 48px;overflow:hidden}
  .k{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:#7a8190}
  .h{font-family:"Sharp Grotesk",sans-serif;font-size:40px;font-weight:500;letter-spacing:-.03em;margin-top:8px}
  .steps{margin-top:34px;display:flex;flex-direction:column;gap:16px}
  .step{display:flex;align-items:center;gap:18px;padding:16px 18px;border-radius:16px;background:#f4f5f7;opacity:0;transform:translateX(-30px)}
  .n{width:40px;height:40px;border-radius:50%;background:#111418;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:16px;flex:none;position:relative}
  .n svg{position:absolute;inset:0;width:40px;height:40px}
  .n span{position:relative}
  .txt{flex:1}.txt b{display:block;font-size:19px;font-weight:500}.txt small{font-size:14px;color:#7a8190}
  .prog{position:absolute;left:48px;right:48px;bottom:36px;height:6px;border-radius:3px;background:#e9ebef}
  .prog i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:#3a5bff}
  .cnt{position:absolute;right:48px;bottom:54px;font-size:13px;color:#7a8190}
  .row{overflow:hidden}
</style>
<div class="stage">
  <div class="card">
    <div class="row"><div class="k">Getting started</div></div>
    <div class="row"><div class="h">Set up your workspace</div></div>
    <div class="steps">
      <div class="step"><div class="n"><svg viewBox="0 0 40 40"><circle class="ring" cx="20" cy="20" r="18" fill="none" stroke="#3a5bff" stroke-width="3"/><path class="tick" d="M12 20.5l5.5 5.5L28 15" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>1</span></div><div class="txt"><b>Create a project</b><small>Name it and pick a template</small></div></div>
      <div class="step"><div class="n"><svg viewBox="0 0 40 40"><circle class="ring" cx="20" cy="20" r="18" fill="none" stroke="#3a5bff" stroke-width="3"/><path class="tick" d="M12 20.5l5.5 5.5L28 15" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>2</span></div><div class="txt"><b>Invite your team</b><small>Share a link or add by email</small></div></div>
      <div class="step"><div class="n"><svg viewBox="0 0 40 40"><circle class="ring" cx="20" cy="20" r="18" fill="none" stroke="#3a5bff" stroke-width="3"/><path class="tick" d="M12 20.5l5.5 5.5L28 15" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>3</span></div><div class="txt"><b>Connect a data source</b><small>Sheets, Postgres or an API</small></div></div>
    </div>
    <div class="cnt"><span id="c">0</span> of 3 done</div>
    <div class="prog"><i id="p"></i></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const D = 7;
  const tl = fx.timeline({ duration: D });
  const steps = gsap.utils.toArray('.step');
  gsap.set('.ring', { drawSVG: '0%' });
  gsap.set('.tick', { drawSVG: '0%' });
  tl.from('.card', { y: 60, opacity: 0, scale: 0.96, duration: 0.8, ease: 'expo.out' }, 0)
    .from('.k', { yPercent: 120, duration: 0.6, ease: 'expo.out' }, 0.3)
    .from('.h', { yPercent: 120, duration: 0.7, ease: 'expo.out' }, 0.4);
  // steps present one at a time: slide in, then the ring draws, the number swaps for a tick, the bar advances
  steps.forEach((s, i) => {
    const t = 1.0 + i * 1.5;
    tl.to(s, { opacity: 1, x: 0, duration: 0.6, ease: 'expo.out' }, t)
      .to(s.querySelector('.ring'), { drawSVG: '100%', duration: 0.6, ease: 'power2.inOut' }, t + 0.5)
      .to(s.querySelector('.n'), { background: '#3a5bff', duration: 0.25 }, t + 1.0)
      .to(s.querySelector('.n span'), { scale: 0, duration: 0.2, ease: 'power2.in' }, t + 1.0)
      .to(s.querySelector('.tick'), { drawSVG: '100%', duration: 0.35, ease: 'power2.out' }, t + 1.15)
      .to('#p', { width: ((i + 1) / 3 * 100) + '%', duration: 0.5, ease: 'expo.out' }, t + 1.1);
    // steps already done dim slightly so the eye moves to the current one
    if (i > 0) tl.to(steps[i - 1], { opacity: 0.55, duration: 0.4 }, t);
  });
  // wrap: the card leaves so the loop restarts clean
  tl.to('.card', { y: -60, opacity: 0, duration: 0.5, ease: 'expo.in' }, D - 0.55);
  const cnt = document.getElementById('c'), api = window.__fx, base = api.seek;
  api.seek = t => { base(t); cnt.textContent = Math.max(0, Math.min(3, Math.floor((t - 2.1) / 1.5) + 1)); };
</script>
