<!doctype html><meta charset="utf-8">
<title>Config: Photo Gallery 01</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0d0d0f;color:#fff}
  .cols{position:absolute;inset:0;display:flex;gap:18px;padding:0 90px}
  .col{flex:1;position:relative;overflow:hidden}
  .track{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;gap:18px;will-change:transform}
  .ph{width:100%;border-radius:14px;background-size:cover;background-position:center;position:relative;overflow:hidden}
  .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.45))}
  .a{background-image:url("../../../assets/backgrounds/aurora.png")}
  .o{background-image:url("../../../assets/backgrounds/ocean.png")}
  .s{background-image:url("../../../assets/backgrounds/sunset.png")}
  .h1{filter:hue-rotate(60deg) saturate(1.3)}.h2{filter:hue-rotate(200deg)}.h3{filter:sepia(.6) contrast(1.1)}.h4{filter:grayscale(.9) contrast(1.2)}
  .cap{position:absolute;left:14px;bottom:12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
  .vignette{position:absolute;inset:0;background:linear-gradient(180deg,#0d0d0f 0%,transparent 18%,transparent 82%,#0d0d0f 100%);pointer-events:none}
  .title{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none}
  .title .w{display:inline-block;font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:150px;letter-spacing:-.05em;line-height:.9;text-transform:uppercase;mix-blend-mode:difference}
  .title .sub{font-size:16px;letter-spacing:.3em;text-transform:uppercase;margin-top:12px;opacity:.9}
  .row{overflow:hidden}
</style>
<div class="stage">
  <div class="cols">
    <div class="col" id="c1"><div class="track"></div></div>
    <div class="col" id="c2"><div class="track"></div></div>
    <div class="col" id="c3"><div class="track"></div></div>
  </div>
  <div class="vignette"></div>
  <div class="title">
    <div class="row"><span class="w">Config</span></div>
    <div class="row"><span class="w">2026</span></div>
    <div class="row"><div class="sub">Photo gallery · 01</div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 8;
  const rnd = fx.rng(11);
  const skins = ['a h1','o','s','a h2','o h3','s h4','a','o h1','s h2'];
  const caps = ['Keynote','Workshop','Hallway','Main stage','Booth','Panel','Night','Studio','Demo'];
  // each column: a list of tiles whose total height (incl. gaps) is the scroll distance
  const specs = [[300,220,260,300,220],[220,320,240,200,320],[280,200,300,260,260]];
  const cols = [];
  specs.forEach((hs, ci) => {
    const track = document.querySelector('#c' + (ci + 1) + ' .track');
    const total = hs.reduce((a, b) => a + b + 18, 0);
    // two copies so the wrap is seamless
    for (let k = 0; k < 2; k++) hs.forEach((h, i) => {
      const d = document.createElement('div');
      d.className = 'ph ' + skins[(ci * 3 + i) % skins.length];
      d.style.height = h + 'px';
      d.innerHTML = '<div class="cap">' + caps[(ci * 3 + i) % caps.length] + '</div>';
      track.appendChild(d);
    });
    cols.push({ track, total });
  });
  const tl = fx.timeline({ duration: D });
  // columns scroll continuously, middle one the other way, each wrapping exactly once per loop
  cols.forEach((c, i) => {
    const up = i !== 1;
    gsap.set(c.track, { y: up ? 0 : -c.total });
    tl.to(c.track, { y: up ? -c.total : 0, duration: D, ease: 'none' }, 0);
  });
  // title pushes in, holds, pushes out
  tl.from('.w', { yPercent: 110, duration: 0.9, ease: 'expo.out', stagger: 0.1 }, 0.4)
    .from('.sub', { yPercent: 130, duration: 0.7, ease: 'expo.out' }, 0.7)
    .to('.w', { yPercent: -110, duration: 0.6, ease: 'expo.in', stagger: 0.08 }, D - 1.1)
    .to('.sub', { yPercent: -130, duration: 0.5, ease: 'expo.in' }, D - 0.9);
  // a slow breathing scale on the whole grid so the scroll never reads as flat
  tl.fromTo('.cols', { scale: 1.02 }, { scale: 1.08, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
</script>
