<!doctype html><meta charset="utf-8">
<title>NFT Cards: 3D</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#07070a;color:#fff}
  canvas{display:block;position:absolute;inset:0}
  .ttl{position:absolute;left:70px;bottom:64px;font-family:"Sharp Grotesk",sans-serif;font-size:44px;font-weight:500;letter-spacing:-.03em;line-height:1}
  .ttl small{display:block;font-family:"Atlas Grotesk",sans-serif;font-size:13px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;margin-bottom:10px}
  .meta{position:absolute;right:70px;bottom:64px;text-align:right;font-size:14px;line-height:1.7;opacity:.75}
  .meta b{font-weight:500;color:#fff;opacity:1}
</style>
<div class="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div class="ttl"><small>Collection · Drop 03</small>Prism Fragments</div>
  <div class="meta"><b>Edition 12 / 250</b><br>Floor 0.42 ETH</div>
</div>
<script type="importmap">{"imports":{"three":"../../../assets/three/three.module.min.js"}}</script>
<script src="../../_lib/fx.js"></script>
<script type="module">
import * as THREE from 'three';
const W = 1280, H = 720, D = 7;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(38, W / H, 0.1, 100); cam.position.set(0, 0.6, 9);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 6); scene.add(key);
const rim = new THREE.PointLight(0x7c5cff, 40, 30); rim.position.set(-5, 2, -3); scene.add(rim);
const rim2 = new THREE.PointLight(0xff5ca8, 30, 30); rim2.position.set(5, -2, -2); scene.add(rim2);

// generative artwork drawn to canvas textures: one per card
function art(seed, hue) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 720;
  const g = c.getContext('2d'), r = fx.rng(seed);
  const bg = g.createLinearGradient(0, 0, 512, 720); bg.addColorStop(0, `hsl(${hue},70%,12%)`); bg.addColorStop(1, `hsl(${hue + 60},70%,22%)`);
  g.fillStyle = bg; g.fillRect(0, 0, 512, 720);
  for (let i = 0; i < 26; i++) {
    const x = r() * 512, y = 60 + r() * 520, s = 20 + r() * 120, a = r() * Math.PI;
    g.save(); g.translate(x, y); g.rotate(a); g.globalAlpha = 0.35 + r() * 0.5;
    g.fillStyle = `hsl(${hue + r() * 140},90%,${55 + r() * 25}%)`;
    if (r() < 0.5) { g.beginPath(); g.arc(0, 0, s / 2, 0, Math.PI * 2); g.fill(); } else g.fillRect(-s / 2, -s / 2, s, s * 0.6);
    g.restore();
  }
  // frame + label baked into the card face
  g.globalAlpha = 1; g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 6; g.strokeRect(16, 16, 480, 688);
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(16, 600, 480, 104);
  g.fillStyle = '#fff'; g.font = '500 34px "Sharp Grotesk", sans-serif'; g.fillText('Fragment #' + (seed * 7 % 250), 40, 648);
  g.font = '18px "Atlas Grotesk", sans-serif'; g.fillStyle = 'rgba(255,255,255,.7)'; g.fillText('Prism Fragments · 2026', 40, 682);
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx;
}
const geo = new THREE.BoxGeometry(2.2, 3.1, 0.06);
const group = new THREE.Group(); scene.add(group);
const cards = [];
[[3, 280], [5, 190], [9, 20]].forEach(([seed, hue], i) => {
  const face = new THREE.MeshStandardMaterial({ map: art(seed, hue), roughness: 0.35, metalness: 0.4 });
  const edge = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.3, metalness: 0.9 });
  const m = new THREE.Mesh(geo, [edge, edge, edge, edge, face, face]);
  const a = i / 3 * Math.PI * 2;
  m.position.set(Math.cos(a) * 3.1, 0, Math.sin(a) * 3.1);
  group.add(m); cards.push({ m, a });
});
// floor of soft particles for depth
const pg = new THREE.BufferGeometry(); const pr = fx.rng(77); const pts = [];
for (let i = 0; i < 300; i++) pts.push((pr() - 0.5) * 24, (pr() - 0.5) * 10, (pr() - 0.5) * 16 - 4);
pg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
const dust = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0x9a8cff, size: 0.05, transparent: true, opacity: 0.7 }));
scene.add(dust);

fx.wait(document.fonts.ready);
fx.register({ duration: D, seek(t) {
  const p = t / D;
  // the ring of cards orbits a full turn per loop; each card also spins on its own axis, and bobs
  group.rotation.y = p * Math.PI * 2;
  cards.forEach(({ m, a }, i) => {
    m.rotation.y = -group.rotation.y + Math.sin(p * Math.PI * 2 + i) * 0.55 + p * Math.PI * 2;
    m.position.y = Math.sin(p * Math.PI * 4 + i * 2.1) * 0.22;
    m.rotation.z = Math.sin(p * Math.PI * 2 + i * 1.3) * 0.06;
  });
  dust.rotation.y = -p * Math.PI * 2 * 0.5;
  cam.position.y = 0.6 + Math.sin(p * Math.PI * 2) * 0.35;
  cam.lookAt(0, 0, 0);
  renderer.render(scene, cam);
}});
</script>
