<!doctype html><meta charset="utf-8">
<title>Zero Gravity: Floating Cards</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b0d14;color:#fff;perspective:1500px}
  .bg{position:absolute;inset:0;background:url("../../../assets/backgrounds/aurora.png") center/cover;opacity:.35;filter:blur(30px);transform:scale(1.2)}
  .card{position:absolute;width:300px;border-radius:22px;background:rgba(255,255,255,.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.16);padding:22px;box-shadow:0 40px 80px -30px rgba(0,0,0,.8);transform-style:preserve-3d;will-change:transform}
  .card .im{height:140px;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#3dd6ff);margin-bottom:18px}
  .card.b .im{background:linear-gradient(135deg,#ff5ca8,#ffb84d)}
  .card.c .im{background:linear-gradient(135deg,#3af0a8,#1abcfe)}
  .card .t{font-size:18px;font-weight:500}
  .card .p{font-size:13px;opacity:.65;margin-top:4px}
  .card .price{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
  .card .price b{font-size:20px;font-weight:500}
  .btn{padding:8px 14px;border-radius:999px;background:#fff;color:#0b0d14;font-size:12px;font-weight:500}
  .shadow{position:absolute;width:260px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(18px)}
  .hdr{position:absolute;left:80px;top:80px}
  .hdr .k{font-size:13px;letter-spacing:.3em;text-transform:uppercase;opacity:.6}
  .hdr .h{font-family:"Sharp Grotesk",sans-serif;font-size:56px;font-weight:500;letter-spacing:-.04em;line-height:1;margin-top:10px}
  .row{overflow:hidden}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="hdr"><div class="row"><div class="k">New arrivals</div></div><div class="row"><div class="h">Weightless<br>collection</div></div></div>
  <div class="shadow" id="sh1" style="left:520px;top:600px"></div>
  <div class="shadow" id="sh2" style="left:830px;top:640px"></div>
  <div class="shadow" id="sh3" style="left:210px;top:660px"></div>
  <div class="card a" id="c1" style="left:500px;top:170px"><div class="im"></div><div class="t">Orbit Headphones</div><div class="p">Wireless · 40h battery</div><div class="price"><b>$249</b><span class="btn">Add</span></div></div>
  <div class="card b" id="c2" style="left:810px;top:260px"><div class="im"></div><div class="t">Drift Speaker</div><div class="p">Room-filling sound</div><div class="price"><b>$129</b><span class="btn">Add</span></div></div>
  <div class="card c" id="c3" style="left:190px;top:330px"><div class="im"></div><div class="t">Lumen Lamp</div><div class="p">Warm to cool, dimmable</div><div class="price"><b>$89</b><span class="btn">Add</span></div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 4;
  const cards = [['c1', 'sh1', 0, 1], ['c2', 'sh2', 2.1, 0.8], ['c3', 'sh3', 4.2, 1.15]].map(([c, s, ph, amp]) => ({ el: document.getElementById(c), sh: document.getElementById(s), ph, amp }));
  const hdr = document.querySelector('.hdr');
  fx.register({ duration: D, seek(t) {
    const w = t / D * Math.PI * 2;   // one full cycle per loop, so every sine returns to its start
    cards.forEach(({ el, sh, ph, amp }) => {
      const y = Math.sin(w + ph) * 26 * amp;
      const rz = Math.sin(w + ph + 1) * 4 * amp;
      const ry = Math.cos(w + ph) * 14 * amp, rx = Math.sin(w * 2 + ph) * 7;
      const x = Math.cos(w + ph * 0.7) * 10;
      el.style.transform = `translate3d(${x}px, ${y}px, 0) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
      // the shadow shrinks and fades as the card rises
      const lift = (y + 26 * amp) / (52 * amp);   // 0 low .. 1 high
      sh.style.transform = `translateX(${x * 0.6}px) scale(${1.05 - lift * 0.3})`;
      sh.style.opacity = 0.55 - lift * 0.35;
    });
    hdr.style.transform = `translateY(${Math.sin(w + 3) * 6}px)`;
  }});
</script>
