<!doctype html><meta charset="utf-8">
<title>Config: Photo Gallery 02</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f3f1ec;color:#111}
  .strip{position:absolute;left:0;top:130px;height:460px;display:flex;gap:16px;align-items:stretch;will-change:transform}
  .slot{position:relative;flex:none;width:200px;border-radius:18px;overflow:hidden;background:#ccc}
  .img{position:absolute;inset:-10%;background-size:cover;background-position:center;will-change:transform}
  .a{background-image:url("../../../assets/backgrounds/aurora.png")}
  .o{background-image:url("../../../assets/backgrounds/ocean.png")}
  .s{background-image:url("../../../assets/backgrounds/sunset.png")}
  .h1{filter:hue-rotate(90deg)}.h2{filter:sepia(.5) contrast(1.1)}.h3{filter:grayscale(.85) contrast(1.15)}.h4{filter:hue-rotate(220deg) saturate(1.2)}
  .meta{position:absolute;left:28px;bottom:26px;color:#fff;opacity:0;transform:translateY(12px)}
  .meta .t{font-family:"Sharp Grotesk",sans-serif;font-size:40px;font-weight:500;letter-spacing:-.03em;line-height:1}
  .meta .s2{font-size:14px;letter-spacing:.2em;text-transform:uppercase;margin-top:8px;opacity:.85}
  .head{position:absolute;left:80px;top:52px;font-size:14px;letter-spacing:.26em;text-transform:uppercase;color:#555}
  .num{position:absolute;right:80px;top:48px;font-family:"Sharp Grotesk",sans-serif;font-size:26px;letter-spacing:-.02em}
  .num span{display:inline-block}
  .bar{position:absolute;left:80px;right:80px;bottom:78px;height:2px;background:#ddd8cf}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:#111}
</style>
<div class="stage">
  <div class="head">Config · Photo gallery 02</div>
  <div class="num"><span id="cur">01</span> / 06</div>
  <div class="strip" id="strip"></div>
  <div class="bar"><i id="fill"></i></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 6, N = 6, STEP = D / N;
  const skins = ['a', 'o h2', 's', 'a h4', 'o h3', 's h1'];
  const titles = ['Keynote', 'Workshops', 'Hallway track', 'Main stage', 'Community', 'Afterparty'];
  const strip = document.getElementById('strip');
  // 6 slides plus a copy of the first so the last step lands on an identical frame
  const slots = [];
  for (let i = 0; i <= N; i++) {
    const k = i % N;
    const d = document.createElement('div');
    d.className = 'slot';
    d.innerHTML = '<div class="img ' + skins[k] + '"></div><div class="meta"><div class="t">' + titles[k] + '</div><div class="s2">0' + (k + 1) + ' — San Francisco</div></div>';
    strip.appendChild(d); slots.push(d);
  }
  const W = 1280, WIDE = 720, THIN = 200, GAP = 16;
  // x offset of the strip so that slot i (wide) is centred
  const offset = i => W / 2 - WIDE / 2 - i * (THIN + GAP);
  gsap.set(slots, { width: THIN });
  gsap.set(slots[0], { width: WIDE });
  gsap.set(strip, { x: offset(0) });
  gsap.set(slots[0].querySelector('.meta'), { opacity: 1, y: 0 });

  const tl = fx.timeline({ duration: D });
  const cur = document.getElementById('cur');
  for (let i = 0; i < N; i++) {
    const t = i * STEP + 0.62, from = slots[i], to = slots[i + 1];
    tl.to(from, { width: THIN, duration: 0.7, ease: 'expo.inOut' }, t)
      .to(to, { width: WIDE, duration: 0.7, ease: 'expo.inOut' }, t)
      .to(strip, { x: offset(i + 1), duration: 0.7, ease: 'expo.inOut' }, t)
      .to(from.querySelector('.meta'), { opacity: 0, y: 12, duration: 0.25, ease: 'power2.in' }, t)
      .fromTo(to.querySelector('.meta'), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: 'expo.out' }, t + 0.4);
    // a little ken-burns drift on the wide image while it holds
    tl.fromTo(to.querySelector('.img'), { scale: 1.08, xPercent: -2 }, { scale: 1, xPercent: 2, duration: STEP + 0.5, ease: 'none' }, t);
  }
  tl.fromTo(slots[0].querySelector('.img'), { scale: 1.08, xPercent: -2 }, { scale: 1, xPercent: 2, duration: 1.3, ease: 'none' }, 0);
  tl.fromTo('#fill', { width: '0%' }, { width: '100%', duration: D, ease: 'none' }, 0);
  // the counter is a pure function of time (calls would not survive seeking)
  const api = window.__fx, base = api.seek;
  api.seek = t => { base(t); const k = t < 0.97 ? 0 : (Math.floor((t - 0.97) / STEP) + 1) % N; cur.textContent = '0' + (k + 1); };
</script>
