<!doctype html><meta charset="utf-8">
<title>Word Rotator</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  /* Palette — every colour in this effect derives from these tokens; change
     them to re-brand it. Masks below use #000 only as alpha, not as a colour. */
  :root{--bg:#f3f2ee;--surface:#ffffff;--ink:#141414;--muted:#77756f;--accent:#ff5a1f;--accent-2:#ffb347;--on-accent:#ffffff}
  .stage{background:radial-gradient(ellipse 75% 65% at 50% 45%,var(--surface) 0%,var(--bg) 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
  .title{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:108px;line-height:1.15;letter-spacing:-.045em;color:var(--ink);white-space:nowrap;will-change:transform,filter,opacity}
  .static{display:inline-block}
  /* The slot clips vertically only (inset 0 top/bottom, generous sides) so the
     rolling words are masked without cropping the last glyph's overhang. */
  .slot{position:relative;display:inline-block;vertical-align:top;height:1.15em;clip-path:inset(0 -1em 0 -1em)}
  .word{position:absolute;left:0;top:0;white-space:nowrap;background:linear-gradient(95deg,var(--accent) 0%,var(--accent-2) 110%);-webkit-background-clip:text;background-clip:text;color:transparent;will-change:transform,opacity}
  .sub{font-size:28px;color:var(--muted);letter-spacing:-.01em;will-change:transform,opacity}
</style>
<div class="stage">
  <h1 class="title"><span class="static">Built for</span> <span class="slot"><span class="word">teams</span><span class="word">speed</span><span class="word">scale</span><span class="word">everyone.</span></span></h1>
  <p class="sub">The workspace that grows with you.</p>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/CustomEase.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(CustomEase);
  // Entrances that fade and move in one tween start from rest: soft onset, long settle.
  CustomEase.create('softOut', '0.2,0,0,1');
  CustomEase.create('textOut', '0.22,1,0.36,1');
  CustomEase.create('roll', '0.76,0,0.24,1');   // ease-in-out quart: leaves decisively, lands softly
  const fontsReady = Promise.all([
    document.fonts.load('500 108px "Sharp Grotesk"'),
    document.fonts.load('400 28px "Atlas Grotesk"'),
  ]);

  const D = 6.4, FIRST_SWAP = 1.5, EVERY = 1.25, SWAP = 0.75;
  let tl;

  // Built after the font loads: the slot animates between measured word widths.
  function build() {
    const slot = document.querySelector('.slot');
    const words = [...document.querySelectorAll('.word')];
    const widths = words.map((w) => w.getBoundingClientRect().width);

    gsap.set(slot, { width: widths[0] });
    gsap.set(words.slice(1), { yPercent: 100, opacity: 0 });

    tl.fromTo('.title', { y: 26, opacity: 0, filter: 'blur(12px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 1.1, ease: 'softOut' }, 0.2)
      .fromTo('.sub', { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: 'softOut' }, 0.55);

    for (let i = 1; i < words.length; i++) {
      const at = FIRST_SWAP + (i - 1) * EVERY;
      tl.to(words[i - 1], { yPercent: -100, duration: SWAP, ease: 'roll' }, at)
        .to(words[i - 1], { opacity: 0, duration: SWAP * 0.6, ease: 'power2.inOut' }, at)
        .fromTo(words[i], { yPercent: 100 }, { yPercent: 0, duration: SWAP, ease: 'roll' }, at)
        .fromTo(words[i], { opacity: 0 }, { opacity: 1, duration: SWAP * 0.6, ease: 'power1.out' }, at + SWAP * 0.4)
        .to(slot, { width: widths[i], duration: SWAP, ease: 'roll' }, at);
    }

    tl.to('.title', { y: -16, opacity: 0, filter: 'blur(10px)', duration: 0.55, ease: 'power2.inOut' }, 5.5)
      .to('.sub', { y: -8, opacity: 0, duration: 0.45, ease: 'power2.inOut' }, 5.55);
  }

  fx.wait(fontsReady.then(build));
  tl = fx.timeline({ duration: D });

  // Sound, on the same beats as the picture (film cue-sheet format; see fx.js).
  // Pitch SaaS pack (ElevenLabs-generated): glitch accents, deep whooshes and
  // crisp UI sounds; signature moments name their clip. Clips carry measured
  // hit points, so each lands on its beat without hand-set leads.
  fx.sfx([
    { t: 0.42, event: 'whoosh_deep', label: 'line in' },
    ...[1, 2, 3].map((i) => ({ t: FIRST_SWAP + (i - 1) * EVERY + SWAP / 2, event: 'whoosh_deep', label: 'word rolls' })),
    { t: 5.65, event: 'whoosh_deep', label: 'exit' },
  ]);
</script>
