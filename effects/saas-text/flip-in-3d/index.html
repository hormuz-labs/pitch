<!doctype html><meta charset="utf-8">
<title>3D Flip In</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  /* Palette — every colour in this effect derives from these tokens; change
     them to re-brand it. Masks below use #000 only as alpha, not as a colour. */
  :root{--bg:#0c0c0d;--surface:#161618;--ink:#f3f2ee;--muted:#8d8b85;--accent:#ff5a1f;--accent-2:#ffb347;--on-accent:#ffffff}
  .stage{background:radial-gradient(ellipse 70% 60% at 50% 45%,color-mix(in srgb,var(--surface) 75%,var(--bg)) 0%,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
  .title{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:112px;line-height:1.08;letter-spacing:-.045em;color:var(--ink);text-align:center;max-width:1100px}
  .w{display:inline-block;white-space:nowrap}
  .c{display:inline-block;backface-visibility:hidden;will-change:transform,opacity}
  .title .accent .c{color:var(--accent)}
  .sub{font-size:28px;color:var(--muted);letter-spacing:-.01em}
</style>
<div class="stage">
  <h1 class="title">Meet your new <span data-accent>dashboard.</span></h1>
  <p class="sub">Every metric, one glance away.</p>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/CustomEase.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(CustomEase);
  // Entrances that fade and move in one tween start from rest: soft onset, long settle.
  CustomEase.create('softOut', '0.2,0,0,1');
  CustomEase.create('textOut', '0.22,1,0.36,1');
  CustomEase.create('flipOut', '0.16,1,0.3,1');
  fx.wait(document.fonts.load('500 112px "Sharp Grotesk"'));
  fx.wait(document.fonts.load('400 28px "Atlas Grotesk"'));

  /* Split into unbreakable words of character spans; a [data-accent] span keeps
     its class on the words it contains. */
  function splitChars(el) {
    const chars = [];
    const pieces = [...el.childNodes].flatMap((node) =>
      node.nodeType === 3
        ? node.textContent.split(/\s+/).filter(Boolean).map((t) => [t, false])
        : node.textContent.split(/\s+/).filter(Boolean).map((t) => [t, true]));
    el.textContent = '';
    pieces.forEach(([part, accent], i) => {
      if (i) el.append(' ');
      const w = document.createElement('span');
      w.className = accent ? 'w accent' : 'w';
      for (const ch of part) {
        const c = document.createElement('span');
        c.className = 'c';
        c.textContent = ch;
        w.append(c);
        chars.push(c);
      }
      el.append(w);
    });
    return chars;
  }

  const chars = splitChars(document.querySelector('.title'));
  const tl = fx.timeline({ duration: 4.6 });

  // Enter: AE "3D Flip In Rotate X" — each letter stands up from its baseline
  // hinge in perspective, a soft staggered wave.
  gsap.set(chars, { transformPerspective: 700, transformOrigin: '50% 100%' });
  tl.fromTo(chars, { rotationX: -95, yPercent: 18 }, { rotationX: 0, yPercent: 0, duration: 1.15, stagger: 0.03, ease: 'flipOut' }, 0.25)
    .fromTo(chars, { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.03, ease: 'power1.out' }, 0.25)
    .fromTo('.sub', { y: 14, opacity: 0, filter: 'blur(6px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.9, ease: 'softOut' }, 1.15)
  // Exit: letters tip back over the top hinge.
    .to(chars, { rotationX: 95, yPercent: -10, opacity: 0, transformOrigin: '50% 0%', duration: 0.55, stagger: 0.018, ease: 'power2.inOut' }, 3.35)
    .to('.sub', { y: -8, opacity: 0, duration: 0.4, ease: 'power2.inOut' }, 3.3);

  // Sound, on the same beats as the picture (film cue-sheet format; see fx.js).
  // Pitch SaaS pack (ElevenLabs-generated): glitch accents, deep whooshes and
  // crisp UI sounds; signature moments name their clip. Clips carry measured
  // hit points, so each lands on its beat without hand-set leads.
  fx.sfx([
    { t: 0.5, event: 'whoosh_deep', label: 'letters flip up' },
    { t: 3.5, event: 'whoosh_deep', label: 'letters tip away' },
  ]);
</script>
