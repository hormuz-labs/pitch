<!doctype html><meta charset="utf-8">
<title>Shine Sweep</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  /* Palette — every colour in this effect derives from these tokens; change
     them to re-brand it. Masks below use #000 only as alpha, not as a colour. */
  :root{--bg:#0c0c0d;--surface:#161618;--ink:#f3f2ee;--muted:#8d8b85;--accent:#ff5a1f;--accent-2:#ffb347;--on-accent:#ffffff}
  .stage{background:radial-gradient(ellipse 70% 60% at 50% 45%,color-mix(in srgb,var(--surface) 75%,var(--bg)) 0%,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
  .pill{font-size:19px;font-weight:500;color:var(--ink);padding:8px 18px;border-radius:999px;border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);background:var(--surface)}
  /* The mask carries the title's font size so its em padding is title-sized:
     room for descenders and overhangs, cancelled by the negative margin. */
  .m{font-size:128px;overflow:hidden;padding:.08em .12em .24em;margin:-.08em -.12em -.24em}
  /* Two background layers clipped to the glyphs: a narrow white highlight band
     on top of a brushed-metal vertical gradient. Moving the band's position is
     the sweep. background-clip:text only paints inside the padding box, so the
     bottom padding is what keeps descenders (the g) from being cut off. */
  .title{display:block;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:1em;padding:.04em .06em .2em;margin:-.04em -.06em -.2em;line-height:1.05;letter-spacing:-.05em;white-space:nowrap;
    background:
      linear-gradient(105deg,transparent 40%,color-mix(in srgb,var(--ink) 25%,#fff) 50%,transparent 60%) 110% 0/250% 100% no-repeat,
      linear-gradient(180deg,color-mix(in srgb,var(--ink) 92%,var(--bg)) 0%,color-mix(in srgb,var(--ink) 64%,var(--bg)) 62%,color-mix(in srgb,var(--ink) 50%,var(--bg)) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;will-change:transform,filter}
  .sub{font-size:28px;color:var(--muted);letter-spacing:-.01em}
</style>
<div class="stage">
  <div class="pill">New</div>
  <div class="m"><h1 class="title">Introducing Pulse</h1></div>
  <p class="sub">Real-time insight for every team.</p>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/CustomEase.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(CustomEase);
  // Entrances that fade and move in one tween start from rest: soft onset, long settle.
  CustomEase.create('softOut', '0.2,0,0,1');
  CustomEase.create('textOut', '0.22,1,0.36,1');
  fx.wait(document.fonts.load('500 128px "Sharp Grotesk"'));
  fx.wait(document.fonts.load('500 19px "Atlas Grotesk"'));

  const tl = fx.timeline({ duration: 4.6 });
  // The band is 250% wide, so background-position 110% parks it left of the
  // word and -10% parks it right; the travel between is the visible sweep.
  tl.fromTo('.pill', { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: 'softOut' }, 0.15)
    .fromTo('.title', { yPercent: 105, filter: 'blur(8px)' }, { yPercent: 0, filter: 'blur(0px)', duration: 1.1, ease: 'textOut' }, 0.3)
    .fromTo('.title', { backgroundPosition: '110% 0, 0 0' }, { backgroundPosition: '-10% 0, 0 0', duration: 1.5, ease: 'power2.inOut' }, 1.15)
    .fromTo('.sub', { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: 'softOut' }, 0.85)
    .to('.title', { yPercent: -105, duration: 0.6, ease: 'power3.in' }, 3.6)
    .to('.pill, .sub', { y: -10, opacity: 0, duration: 0.45, stagger: 0.05, ease: 'power2.inOut' }, 3.55);

  // Sound, on the same beats as the picture (film cue-sheet format; see fx.js).
  // Pitch SaaS pack (ElevenLabs-generated): glitch accents, deep whooshes and
  // crisp UI sounds; signature moments name their clip. Clips carry measured
  // hit points, so each lands on its beat without hand-set leads.
  fx.sfx([
    { t: 0.3, event: 'glitch', clip: 'pitch-glitch-pop', label: 'pill' },
    { t: 0.5, event: 'whoosh_deep', label: 'title rises' },
    { t: 1.9, event: 'chime', clip: 'pitch-shimmer', dur: 1.2, targetLufs: -22, label: 'shine crosses' },
    { t: 3.75, event: 'whoosh_deep', label: 'exit' },
  ]);
</script>
