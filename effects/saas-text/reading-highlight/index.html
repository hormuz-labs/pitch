<!doctype html><meta charset="utf-8">
<title>Reading Highlight</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  /* Palette — every colour in this effect derives from these tokens; change
     them to re-brand it. */
  :root{--bg:#0c0c0d;--surface:#161618;--ink:#f3f2ee;--muted:#8d8b85;--accent:#ff5a1f;--accent-2:#ffb347;--on-accent:#ffffff}
  .stage{background:radial-gradient(ellipse 70% 60% at 50% 45%,color-mix(in srgb,var(--surface) 75%,var(--bg)) 0%,var(--bg) 70%)}
  .block{position:absolute;left:140px;right:140px;top:50%;transform:translateY(-50%);will-change:transform,opacity,filter}
  .kicker{font-size:18px;font-weight:500;letter-spacing:.14em;color:var(--accent);margin-bottom:26px}
  /* --lit (0..1) per word: dim ink at 0, full ink (or the accent for key words) at 1. */
  .para{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:50px;line-height:1.32;letter-spacing:-.03em}
  .para .w{--lit:0;color:color-mix(in srgb,var(--ink) calc(18% + var(--lit) * 82%),transparent)}
  .para .w.key{color:color-mix(in srgb,var(--accent) calc(var(--lit) * 100%),color-mix(in srgb,var(--ink) 18%,transparent))}
</style>
<div class="stage">
  <div class="block">
    <div class="kicker">WHY TEAMS SWITCH</div>
    <p class="para">Every launch used to mean five tools, three spreadsheets and a week of meetings. Now your whole team plans, builds and ships from <b>one place</b> and it actually feels <b>fast.</b></p>
  </div>
</div>
<script src="../../_lib/fx.js"></script>
<script>
  fx.wait(document.fonts.load('500 50px "Sharp Grotesk"'));
  fx.wait(document.fonts.load('500 18px "Atlas Grotesk"'));
  const D = 6.4;
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const smooth = (t, a, b) => { const p = clamp((t - a) / (b - a)); return p * p * (3 - 2 * p); };
  /* Flow curves (effects/flow-easing) as functions of 0..1. */
  function bezier(x1, y1, x2, y2) {
    const B = (a, b, t) => 3 * a * t * (1 - t) * (1 - t) + 3 * b * t * t * (1 - t) + t * t * t;
    return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1; for (let k = 0; k < 28; k++) { const m = (lo + hi) / 2; if (B(x1, x2, m) < x) lo = m; else hi = m; } return B(y1, y2, (lo + hi) / 2); };
  }
  const flowEase = bezier(0.42, 0, 0.58, 1), flowQuintOut = bezier(0.22, 1, 0.36, 1), flowCubicIn = bezier(0.4, 0, 0.68, 0.06);

  // Split into word spans; words inside <b> are key words.
  const para = document.querySelector('.para');
  const words = [];
  (function split(node, key) {
    for (const child of [...node.childNodes]) {
      if (child.nodeType === 3) {
        const frag = document.createDocumentFragment();
        child.textContent.split(/(\s+)/).forEach((part) => {
          if (!part) return;
          if (/^\s+$/.test(part)) { frag.append(' '); return; }
          const s = document.createElement('span');
          s.className = key ? 'w key' : 'w';
          s.textContent = part;
          frag.append(s);
          words.push(s);
        });
        child.replaceWith(frag);
      } else { split(child, true); child.replaceWith(...child.childNodes); }
    }
  })(para, false);

  const block = document.querySelector('.block');
  const kicker = document.querySelector('.kicker');
  const N = words.length, SOFT = 2.2;   // the lit edge spans about two words

  /* A reading head moves through the paragraph at an even, eased pace; each
     word brightens as the head passes, with a soft two-word leading edge. */
  function draw(t) {
    const head = flowEase(clamp((t - 0.7) / 3.9)) * (N + SOFT);
    words.forEach((w, i) => w.style.setProperty('--lit', clamp((head - i) / SOFT).toFixed(3)));
    const enter = flowQuintOut(clamp((t - 0.05) / 0.8));
    const exit = flowCubicIn(clamp((t - 5.5) / 0.6));
    // Opacity eases on a smoothstep at both ends; motion keeps its own curve.
    block.style.opacity = (smooth(t, 0.05, 0.75) * (1 - smooth(t, 5.5, 6.1))).toFixed(3);
    block.style.transform = `translateY(calc(-50% + ${((1 - enter) * 18 - exit * 18).toFixed(2)}px))`;
    block.style.filter = `blur(${((1 - enter) * 8 + exit * 8).toFixed(2)}px)`;
    kicker.style.opacity = smooth(t, 0.2, 0.7).toFixed(3);
  }
  fx.register({ duration: D, seek: draw });

  // Sound, on the same beats as the picture (film cue-sheet format; see fx.js).
  // Pitch SaaS pack (ElevenLabs-generated): glitch accents, deep whooshes and
  // crisp UI sounds; signature moments name their clip. Clips carry measured
  // hit points, so each lands on its beat without hand-set leads.
  fx.sfx([
    { t: 0.3, event: 'whoosh_deep', label: 'paragraph in' },
    { t: 4.35, event: 'chime', clip: 'pitch-shimmer', dur: 0.9, targetLufs: -22, label: 'last words light' },
    { t: 5.7, event: 'whoosh_deep', label: 'exit' },
  ]);
</script>
