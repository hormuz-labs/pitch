<!doctype html><meta charset="utf-8">
<title>Mask Line Reveal</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  /* Palette — every colour in this effect derives from these tokens; change
     them to re-brand it. Masks below use #000 only as alpha, not as a colour. */
  :root{--bg:#f3f2ee;--surface:#ffffff;--ink:#141414;--muted:#77756f;--accent:#ff5a1f;--accent-2:#ffb347;--on-accent:#ffffff}
  .stage{background:var(--bg)}
  .block{position:absolute;left:140px;top:50%;transform:translateY(-50%)}
  .label{font-size:20px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:22px;overflow:hidden}
  .label span{display:block}
  .title{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:100px;line-height:1.02;letter-spacing:-.05em;color:var(--ink)}
  /* Each line clips its own text. The padding keeps descenders and the
     rotated corner inside the mask; the negative margin keeps line spacing. */
  .m{display:block;overflow:hidden;padding:.04em .1em .14em 0;margin:-.04em -.1em -.14em 0}
  .line{display:block;white-space:nowrap;will-change:transform}
  .line em{font-style:normal;color:var(--accent)}
  .rule{height:3px;width:520px;margin-top:34px;background:var(--ink);transform-origin:0 50%}
</style>
<div class="stage">
  <div class="block">
    <div class="label"><span>Analytics</span></div>
    <h1 class="title">
      <span class="m"><span class="line">Turn raw data</span></span>
      <span class="m"><span class="line">into decisions</span></span>
      <span class="m"><span class="line">your team <em>trusts.</em></span></span>
    </h1>
    <div class="rule"></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/CustomEase.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(CustomEase);
  CustomEase.create('textOut', '0.22,1,0.36,1');
  CustomEase.create('drawInOut', '0.65,0,0.35,1');
  fx.wait(document.fonts.load('500 100px "Sharp Grotesk"'));
  fx.wait(document.fonts.load('500 20px "Atlas Grotesk"'));

  const tl = fx.timeline({ duration: 4.5 });

  // Enter: each line slides up from behind its mask, hinged a few degrees at the
  // bottom-left so it lands with a slight settle rather than a straight lift.
  tl.fromTo('.label span', { yPercent: 110 }, { yPercent: 0, duration: 0.8, ease: 'textOut' }, 0.2)
    .fromTo('.line', { yPercent: 115, rotation: 4, transformOrigin: '0% 100%' }, { yPercent: 0, rotation: 0, duration: 1.15, stagger: 0.12, ease: 'textOut' }, 0.3)
    .fromTo('.rule', { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: 'drawInOut' }, 0.9)
  // Exit: lines continue up through the same masks; the rule retracts to the right.
    .to('.line', { yPercent: -115, duration: 0.6, stagger: 0.07, ease: 'power3.in' }, 3.3)
    .to('.label span', { yPercent: -110, duration: 0.5, ease: 'power3.in' }, 3.25)
    .to('.rule', { scaleX: 0, transformOrigin: '100% 50%', duration: 0.55, ease: 'power3.in' }, 3.4);

  // Sound, on the same beats as the picture (film cue-sheet format; see fx.js).
  // Pitch SaaS pack (ElevenLabs-generated): glitch accents, deep whooshes and
  // crisp UI sounds; signature moments name their clip. Clips carry measured
  // hit points, so each lands on its beat without hand-set leads.
  fx.sfx([
    { t: 0.5, event: 'whoosh_deep', label: 'lines rise' },
    { t: 3.45, event: 'whoosh_deep', label: 'lines exit' },
  ]);
</script>
