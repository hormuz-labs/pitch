<!doctype html><meta charset="utf-8">
<title>Inline Media Pill</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  /* Palette — every colour in this effect derives from these tokens; change
     them to re-brand it. */
  :root{--bg:#f3f2ee;--surface:#ffffff;--ink:#141414;--muted:#77756f;--accent:#ff5a1f;--accent-2:#ffb347;--on-accent:#ffffff;--positive:#22a06b}
  .stage{background:radial-gradient(ellipse 75% 65% at 50% 45%,var(--surface) 0%,var(--bg) 75%);display:flex;flex-direction:column;align-items:center;justify-content:center}
  /* Lines are authored, so a growing pill can only push words sideways along
     its own centred line — never re-wrap a word to another line mid-motion. */
  .line{display:flex;align-items:center;justify-content:center;white-space:nowrap;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:96px;line-height:1.16;letter-spacing:-.045em;color:var(--ink)}
  .w{display:inline-block;will-change:transform,opacity,filter}
  .gap{display:inline-block;width:.24em}
  .pill{position:relative;display:inline-block;height:.78em;width:0;border-radius:999px;overflow:hidden;flex:none;will-change:width}
  .pill .in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;will-change:transform,opacity}
  .p1{background:color-mix(in srgb,var(--ink) 7%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 10%,transparent)}
  .p1 .av{width:.5em;height:.5em;border-radius:50%;border:3px solid var(--surface);margin-left:-.12em}
  .p1 .av:first-child{margin-left:0}
  .p2{background:linear-gradient(120deg,var(--accent),var(--accent-2))}
  .p2 .blob{position:absolute;width:.9em;height:.9em;border-radius:50%;background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--accent-2) 40%,#fff),transparent 70%);filter:blur(4px)}
  .p3{background:var(--ink)}
  .p3 svg{width:.42em;height:.42em;color:var(--accent)}
</style>
<div class="stage">
  <div class="line"><span class="w">We</span><span class="gap"></span><span class="w">help</span><span class="pill p1"><span class="in"><i class="av" style="background:linear-gradient(135deg,var(--accent-2),var(--accent))"></i><i class="av" style="background:linear-gradient(135deg,color-mix(in srgb,var(--ink) 55%,var(--bg)),var(--ink))"></i><i class="av" style="background:linear-gradient(135deg,var(--accent-2),var(--positive))"></i></span></span><span class="gap"></span><span class="w">teams</span></div>
  <div class="line"><span class="w">ship</span><span class="pill p2"><span class="in"><i class="blob"></i></span></span><span class="gap"></span><span class="w">products</span></div>
  <div class="line"><span class="w">people</span><span class="pill p3"><span class="in"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 3 5 6.6 5c2.2 0 3.6 1.3 4.4 2.6.8-1.3 2.2-2.6 4.4-2.6C19 5 21 8.4 21.6 11.7 19.5 16.4 12 21 12 21z"/></svg></span></span><span class="gap"></span><span class="w">love.</span></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/CustomEase.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(CustomEase);
  // Entrances that fade and move in one tween start from rest: soft onset, long settle.
  CustomEase.create('softOut', '0.2,0,0,1');
  // Flow curves (effects/flow-easing).
  CustomEase.create('flowQuintOut', '0.22,1,0.36,1');
  CustomEase.create('flowCubicIn', '0.4,0,0.68,0.06');
  fx.wait(document.fonts.load('500 96px "Sharp Grotesk"'));
  /* A damped spring as an ease: starts from rest, overshoots ~10% once and
     settles to rest. Zero velocity at both ends, which a bezier back-out
     (still moving on its last frame) cannot give. */
  const softSpring = (p) => {
    if (p <= 0) return 0;
    if (p >= 1) return 1;
    const s = (x) => 1 - Math.exp(-8 * x) * (Math.cos(11 * x) + (8 / 11) * Math.sin(11 * x));
    return s(p) / s(1);
  };

  const W = ['1.9em', '1.5em', '1.15em'];   // open widths of the three pills
  const tl = fx.timeline({ duration: 6 });
  tl.fromTo('.w', { y: 26, opacity: 0, filter: 'blur(10px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 1.0, stagger: 0.06, ease: 'softOut' }, 0.2);
  // Each pill opens with one soft overshoot; its margins open with it so the
  // words either side part evenly. Contents pop in once there is room.
  document.querySelectorAll('.pill').forEach((pill, i) => {
    const at = 1.05 + i * 0.32;
    tl.fromTo(pill, { width: 0, marginLeft: 0, marginRight: 0 }, { width: W[i], marginLeft: '0.24em', marginRight: 0, duration: 0.9, ease: softSpring }, at)
      .fromTo(pill.querySelector('.in'), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: softSpring }, at + 0.22);
  });
  tl.fromTo('.p1 .av', { x: -14, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, stagger: 0.07, ease: 'softOut' }, 1.3)
    .fromTo('.p2 .blob', { xPercent: -160 }, { xPercent: 160, duration: 2.4, ease: 'sine.inOut' }, 1.5)
    .fromTo('.p3 svg', { scale: 1 }, { scale: 1.18, duration: 0.18, yoyo: true, repeat: 3, ease: 'sine.inOut', transformOrigin: '50% 60%', immediateRender: false }, 2.6)
  // Exit: everything lifts away into blur.
    .to('.line', { y: -18, opacity: 0, filter: 'blur(10px)', duration: 0.55, stagger: 0.06, ease: 'power2.inOut' }, 5.0);

  // Sound, on the same beats as the picture (film cue-sheet format; see fx.js).
  // Pitch SaaS pack (ElevenLabs-generated): glitch accents, deep whooshes and
  // crisp UI sounds; signature moments name their clip. Clips carry measured
  // hit points, so each lands on its beat without hand-set leads.
  fx.sfx([
    { t: 0.45, event: 'whoosh_deep', label: 'lines rise' },
    { t: 1.12, event: 'glitch', clip: 'pitch-glitch-pop', label: 'avatar pill' },
    { t: 1.44, event: 'glitch', clip: 'pitch-glitch-blip', label: 'visual pill' },
    { t: 1.76, event: 'glitch', clip: 'pitch-glitch-chirp', label: 'heart pill' },
    { t: 5.15, event: 'whoosh_deep', label: 'exit' },
  ]);
</script>
