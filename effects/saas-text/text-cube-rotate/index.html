<!doctype html><meta charset="utf-8">
<title>Text Cube Rotate</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  /* Palette — every colour in this effect derives from these tokens; change
     them to re-brand it. */
  :root{--bg:#0c0c0d;--surface:#161618;--ink:#f3f2ee;--muted:#8d8b85;--accent:#ff5a1f;--accent-2:#ffb347;--on-accent:#ffffff}
  .stage{background:radial-gradient(ellipse 70% 60% at 50% 45%,color-mix(in srgb,var(--surface) 75%,var(--bg)) 0%,var(--bg) 70%)}
  .row{position:absolute;top:50%;left:0;display:flex;align-items:center;gap:.26em;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:100px;letter-spacing:-.045em;line-height:1.16;color:var(--ink);will-change:transform,opacity,filter}
  /* A four-sided prism of words. Each face is 1.16em tall and pushed out by
     half that, so the faces meet edge to edge as it turns about X. */
  .cube{position:relative;height:1.16em;perspective:1100px}
  .spin{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
  .face{position:absolute;left:0;top:0;height:1.16em;white-space:nowrap;backface-visibility:hidden;color:var(--accent)}
  .shade{position:absolute;inset:-.05em -.1em;background:var(--bg);opacity:0;pointer-events:none}
</style>
<div class="stage">
  <div class="row"><span>Your data,</span><div class="cube"><div class="spin"><div class="face">unified.<i class="shade"></i></div><div class="face">secured.<i class="shade"></i></div><div class="face">automated.<i class="shade"></i></div><div class="face">everywhere.<i class="shade"></i></div></div></div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/CustomEase.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(CustomEase);
  // Entrances that fade and move in one tween start from rest: soft onset, long settle.
  CustomEase.create('softOut', '0.2,0,0,1');
  // Each quarter turn is a back in-out (GSAP's exact function, the shape of
  // Flow "back"): a wind-up, a fast turn and an overshoot that settles to rest.
  CustomEase.create('flowQuintOut', '0.22,1,0.36,1');
  CustomEase.create('flowCubicIn', '0.4,0,0.68,0.06');
  const fontsReady = document.fonts.load('500 100px "Sharp Grotesk"');
  const row = document.querySelector('.row'), cube = document.querySelector('.cube'), spin = document.querySelector('.spin');
  const faces = [...document.querySelectorAll('.face')];
  const turn = { a: 0 };   // prism angle in degrees
  let half = 0;

  function build() {
    const em = parseFloat(getComputedStyle(row).fontSize);
    half = em * 1.16 / 2;
    cube.style.width = Math.max(...faces.map((f) => f.getBoundingClientRect().width)) + 'px';
    faces.forEach((f, i) => { f.style.transform = `rotateX(${i * -90}deg) translateZ(${half}px)`; });
    row.style.left = ((1280 - row.getBoundingClientRect().width) / 2) + 'px';
    paint();
  }

  /* Faces darken as they turn away from the viewer: the face's angle to the
     camera sets its shade, so the prism reads as lit from the front. */
  function paint() {
    spin.style.transform = `translateZ(${-half}px) rotateX(${turn.a}deg)`;
    faces.forEach((f, i) => {
      const ang = ((turn.a - i * 90) % 360 + 540) % 360 - 180;
      const facing = Math.cos(ang * Math.PI / 180);
      f.querySelector('.shade').style.opacity = Math.min(1, Math.max(0, 1 - facing) * 0.85).toFixed(3);
      // A face seen edge-on would render as a hairline; fade it out before then.
      const e = Math.min(1, Math.max(0, facing / 0.18));
      f.style.opacity = (e * e * (3 - 2 * e)).toFixed(3);
    });
  }

  let tl;
  fx.wait(fontsReady.then(build));
  tl = fx.timeline({ duration: 6.2, onUpdate: paint });
  tl.fromTo(row, { y: 24, opacity: 0, filter: 'blur(10px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 1.0, ease: 'softOut' }, 0.15);
  [1.45, 2.65, 3.85].forEach((at, k) => tl.to(turn, { a: (k + 1) * 90, duration: 0.9, ease: 'back.inOut(1.4)' }, at));
  tl.to(row, { y: -16, opacity: 0, filter: 'blur(10px)', duration: 0.55, ease: 'power2.inOut' }, 5.5);

  // Sound, on the same beats as the picture (film cue-sheet format; see fx.js).
  // Pitch SaaS pack (ElevenLabs-generated): glitch accents, deep whooshes and
  // crisp UI sounds; signature moments name their clip. Clips carry measured
  // hit points, so each lands on its beat without hand-set leads.
  fx.sfx([
    { t: 0.35, event: 'whoosh_deep', label: 'line in' },
    ...[1.45, 2.65, 3.85].map((t) => ({ t: t + 0.45, event: 'whoosh_deep', label: 'cube turns' })),
    { t: 5.65, event: 'whoosh_deep', label: 'exit' },
  ]);
</script>
