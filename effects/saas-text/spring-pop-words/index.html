<!doctype html><meta charset="utf-8">
<title>Spring Pop Words</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  /* Palette — every colour in this effect derives from these tokens; change
     them to re-brand it. Masks below use #000 only as alpha, not as a colour. */
  :root{--bg:#f3f2ee;--surface:#ffffff;--ink:#141414;--muted:#77756f;--accent:#ff5a1f;--accent-2:#ffb347;--on-accent:#ffffff}
  .stage{background:radial-gradient(ellipse 75% 65% at 50% 45%,var(--surface) 0%,var(--bg) 75%);display:flex;align-items:center;justify-content:center}
  .title{display:flex;gap:.28em;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:118px;line-height:1;letter-spacing:-.05em;color:var(--ink)}
  .w{display:inline-block;transform-origin:50% 80%;will-change:transform,opacity,filter}
  .w i{font-style:normal;color:var(--accent)}
</style>
<div class="stage">
  <h1 class="title"><span class="w">Fast<i>.</i></span><span class="w">Simple<i>.</i></span><span class="w">Yours<i>.</i></span></h1>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  fx.wait(document.fonts.load('500 118px "Sharp Grotesk"'));

  /* An underdamped spring as an ease: one ~12% overshoot, a small
     second swing, at rest by the end. Normalised so ease(0)=0 and ease(1)=1. */
  const RAW = (t) => 1 - Math.exp(-7 * t) * Math.cos(10.5 * t);
  const END = RAW(1);
  const spring = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : RAW(t) / END);

  const words = document.querySelectorAll('.w');
  const tl = fx.timeline({ duration: 4.5 });

  // Enter: each word springs up from 45% scale, untilting as it lands.
  tl.fromTo(words, { scale: 0.45, rotation: -7, y: 40 }, { scale: 1, rotation: 0, y: 0, duration: 1.2, stagger: 0.22, ease: spring }, 0.3)
    .fromTo(words, { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.22, ease: 'power1.out' }, 0.3)
  // Exit: words shrink and soften away, in reading order.
    .to(words, { scale: 0.82, opacity: 0, filter: 'blur(6px)', duration: 0.4, stagger: 0.07, ease: 'power2.inOut' }, 3.55);

  // Sound, on the same beats as the picture (film cue-sheet format; see fx.js).
  // Pitch SaaS pack (ElevenLabs-generated): glitch accents, deep whooshes and
  // crisp UI sounds; signature moments name their clip. Clips carry measured
  // hit points, so each lands on its beat without hand-set leads.
  fx.sfx([
    { t: 0.36, event: 'glitch', clip: 'pitch-glitch-pop', label: 'Fast.' },
    { t: 0.58, event: 'glitch', clip: 'pitch-glitch-blip', label: 'Simple.' },
    { t: 0.8, event: 'glitch', clip: 'pitch-glitch-chirp', label: 'Yours.' },
    { t: 3.68, event: 'whoosh_deep', label: 'exit' },
  ]);
</script>
