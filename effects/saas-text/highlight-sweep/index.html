<!doctype html><meta charset="utf-8">
<title>Highlight Sweep</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  /* Palette — every colour in this effect derives from these tokens; change
     them to re-brand it. Masks below use #000 only as alpha, not as a colour. */
  :root{--bg:#0c0c0d;--surface:#161618;--ink:#f3f2ee;--muted:#8d8b85;--accent:#ff5a1f;--accent-2:#ffb347;--on-accent:#ffffff}
  .stage{background:radial-gradient(ellipse 70% 60% at 50% 45%,color-mix(in srgb,var(--surface) 75%,var(--bg)) 0%,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
  .title{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:104px;line-height:1.12;letter-spacing:-.045em;color:var(--ink);text-align:center}
  .w{display:inline-block;white-space:nowrap;will-change:transform,filter,opacity}
  /* The marker: a bar behind, and a dark copy of the text clipped to the same
     box. Both are driven by one progress value, so the ink flips exactly where
     the bar has passed. */
  .mark{position:relative;padding:0 .14em;margin:0 -.04em}
  .mark .bar{position:absolute;inset:.1em 0 .02em 0;background:var(--accent);border-radius:.12em;transform-origin:0 50%;transform:scaleX(0)}
  .mark .base{position:relative}
  .mark .over{position:absolute;inset:0;padding:0 .14em;color:var(--on-accent);clip-path:inset(0 100% 0 0)}
  .sub{font-size:28px;color:var(--muted);letter-spacing:-.01em}
</style>
<div class="stage">
  <h1 class="title"><span class="w">Close</span> <span class="w">your</span> <span class="w">books</span><br><span class="w mark"><span class="bar"></span><span class="base">10x faster.</span><span class="over" aria-hidden="true">10x faster.</span></span></h1>
  <p class="sub"><span class="w">Reconciliation</span> <span class="w">that</span> <span class="w">runs</span> <span class="w">itself.</span></p>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/CustomEase.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(CustomEase);
  // Entrances that fade and move in one tween start from rest: soft onset, long settle.
  CustomEase.create('softOut', '0.2,0,0,1');
  CustomEase.create('textOut', '0.22,1,0.36,1');
  CustomEase.create('sweep', '0.65,0,0.35,1');   // ease-in-out cubic, a hand-drawn marker stroke
  fx.wait(document.fonts.load('500 104px "Sharp Grotesk"'));
  fx.wait(document.fonts.load('400 28px "Atlas Grotesk"'));

  const words = document.querySelectorAll('.title .w');
  const sub = document.querySelectorAll('.sub .w');
  const bar = document.querySelector('.mark .bar');
  const over = document.querySelector('.mark .over');
  // Draw-on progress and retract progress. The paint reads both, so the result
  // is the same whichever tween updated last (the renderer also seeks backward).
  const draw = { p: 0 }, retract = { p: 0 };
  function paint() {
    if (retract.p > 0) {
      const r = retract.p * 100;
      bar.style.transformOrigin = '100% 50%';
      bar.style.transform = `scaleX(${1 - retract.p})`;
      over.style.clipPath = `inset(0 0 0 ${r.toFixed(3)}%)`;
    } else {
      bar.style.transformOrigin = '0% 50%';
      bar.style.transform = `scaleX(${draw.p})`;
      over.style.clipPath = `inset(0 ${(100 - draw.p * 100).toFixed(3)}% 0 0)`;
    }
  }
  paint();

  const tl = fx.timeline({ duration: 5, onUpdate: paint });
  tl.fromTo(words, { y: 26, filter: 'blur(12px)' }, { y: 0, filter: 'blur(0px)', duration: 1.05, stagger: 0.08, ease: 'textOut' }, 0.25)
    .fromTo(words, { opacity: 0 }, { opacity: 1, duration: 0.5, stagger: 0.08, ease: 'power1.out' }, 0.25)
    .fromTo(sub, { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, stagger: 0.05, ease: 'softOut' }, 0.9)
    .fromTo(draw, { p: 0 }, { p: 1, duration: 0.75, ease: 'sweep' }, 1.55)
    .fromTo(retract, { p: 0 }, { p: 1, duration: 0.45, ease: 'power2.in' }, 3.75)
    .to(words, { y: -16, opacity: 0, filter: 'blur(10px)', duration: 0.5, stagger: 0.04, ease: 'power2.inOut' }, 3.95)
    .to(sub, { y: -8, opacity: 0, duration: 0.4, stagger: 0.03, ease: 'power2.inOut' }, 3.95);

  // Sound, on the same beats as the picture (film cue-sheet format; see fx.js).
  // Pitch SaaS pack (ElevenLabs-generated): glitch accents, deep whooshes and
  // crisp UI sounds; signature moments name their clip. Clips carry measured
  // hit points, so each lands on its beat without hand-set leads.
  fx.sfx([
    { t: 0.48, event: 'whoosh_deep', label: 'words rise' },
    { t: 1.6, event: 'glitch', clip: 'pitch-glitch-stutter', label: 'marker down' },
    { t: 4.1, event: 'whoosh_deep', label: 'exit' },
  ]);
</script>
