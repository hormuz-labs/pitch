<!doctype html><meta charset="utf-8">
<title>Gradient Wipe Reveal</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  /* Palette — every colour in this effect derives from these tokens; change
     them to re-brand it. Masks below use #000 only as alpha, not as a colour. */
  :root{--bg:#f3f2ee;--surface:#ffffff;--ink:#141414;--muted:#77756f;--accent:#ff5a1f;--accent-2:#ffb347;--on-accent:#ffffff}
  .stage{background:var(--bg)}
  .block{position:absolute;left:140px;top:50%;transform:translateY(-50%)}
  /* AE "Linear Wipe" with feather. --in is the leading edge of the reveal and
     --out the trailing edge of the exit; both are percentages of the line width.
     The 14% feather either side of each edge is the soft gradient. A mask only
     covers the element's box, so the padding (cancelled by negative margins)
     gives descenders like the g room inside it. */
  .line{--in:-20%;--out:-20%;display:block;width:max-content;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:104px;line-height:1.08;letter-spacing:-.05em;color:var(--ink);white-space:nowrap;padding:.06em .1em .24em 0;margin:-.06em 0 -.24em;
    -webkit-mask-image:linear-gradient(90deg,transparent calc(var(--out) - 14%),#000 calc(var(--out) + 14%),#000 calc(var(--in) - 14%),transparent calc(var(--in) + 14%));
    mask-image:linear-gradient(90deg,transparent calc(var(--out) - 14%),#000 calc(var(--out) + 14%),#000 calc(var(--in) - 14%),transparent calc(var(--in) + 14%));
    will-change:transform}
  .line em{font-style:normal;color:var(--accent)}
  .note{--in:-20%;--out:-20%;margin-top:30px;padding-bottom:.25em;margin-bottom:-.25em;font-size:28px;color:var(--muted);letter-spacing:-.01em;width:max-content;
    -webkit-mask-image:linear-gradient(90deg,transparent calc(var(--out) - 14%),#000 calc(var(--out) + 14%),#000 calc(var(--in) - 14%),transparent calc(var(--in) + 14%));
    mask-image:linear-gradient(90deg,transparent calc(var(--out) - 14%),#000 calc(var(--out) + 14%),#000 calc(var(--in) - 14%),transparent calc(var(--in) + 14%))}
</style>
<div class="stage">
  <div class="block">
    <h1><span class="line">Everything you need.</span><span class="line"><em>Nothing</em> you don’t.</span></h1>
    <p class="note">A calmer way to run your company.</p>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/CustomEase.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(CustomEase);
  CustomEase.create('wipe', '0.6,0,0.2,1');   // eases in briskly, lands long — a feathered matte wipe
  fx.wait(document.fonts.load('500 104px "Sharp Grotesk"'));
  fx.wait(document.fonts.load('400 28px "Atlas Grotesk"'));

  const tl = fx.timeline({ duration: 4.8 });
  // The edge runs from -20% to 120% so the feather fully clears both ends.
  tl.fromTo('.line', { '--in': '-20%', x: -28 }, { '--in': '120%', x: 0, duration: 1.3, stagger: 0.2, ease: 'wipe' }, 0.25)
    .fromTo('.note', { '--in': '-20%' }, { '--in': '120%', duration: 1.1, ease: 'wipe' }, 0.95)
  // Exit: the matte keeps travelling right, so the text wipes off the same way it arrived.
    .to('.line', { '--out': '120%', x: 20, duration: 0.85, stagger: 0.12, ease: 'power2.in' }, 3.65)
    .to('.note', { '--out': '120%', duration: 0.7, ease: 'power2.in' }, 3.6);

  // Sound, on the same beats as the picture (film cue-sheet format; see fx.js).
  // Pitch SaaS pack (ElevenLabs-generated): glitch accents, deep whooshes and
  // crisp UI sounds; signature moments name their clip. Clips carry measured
  // hit points, so each lands on its beat without hand-set leads.
  fx.sfx([
    { t: 0.75, event: 'whoosh_deep', label: 'wipe on' },
    { t: 3.95, event: 'whoosh_deep', label: 'wipe off' },
  ]);
</script>
