<!doctype html><meta charset="utf-8">
<title>Blur Rise Words</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  /* Palette — every colour in this effect derives from these tokens; change
     them to re-brand it. Masks below use #000 only as alpha, not as a colour. */
  :root{--bg:#0c0c0d;--surface:#161618;--ink:#f3f2ee;--muted:#8d8b85;--accent:#ff5a1f;--accent-2:#ffb347;--on-accent:#ffffff}
  .stage{background:radial-gradient(ellipse 70% 60% at 50% 45%,color-mix(in srgb,var(--surface) 75%,var(--bg)) 0%,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
  .title{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-weight:500;font-size:96px;line-height:1.04;letter-spacing:-.045em;color:var(--ink);text-align:center;max-width:1000px}
  .sub{font-size:28px;letter-spacing:-.01em;color:var(--muted);text-align:center}
  .w{display:inline-block;white-space:nowrap;will-change:transform,filter,opacity}
</style>
<div class="stage">
  <h1 class="title">Your workflow, finally in one place.</h1>
  <p class="sub">Plan, build and ship together.</p>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/CustomEase.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(CustomEase);
  CustomEase.create('textOut', '0.22,1,0.36,1');   // ease-out quint: fast start, long soft landing
  fx.wait(document.fonts.load('500 96px "Sharp Grotesk"'));
  fx.wait(document.fonts.load('400 28px "Atlas Grotesk"'));

  /* Split text into word spans, keeping real spaces so the line wraps like the source. */
  function split(el) {
    const parts = el.textContent.trim().split(/\s+/);
    el.textContent = '';
    return parts.map((part, i) => {
      if (i) el.append(' ');
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      el.append(w);
      return w;
    });
  }

  const title = split(document.querySelector('.title'));
  const sub = split(document.querySelector('.sub'));
  const tl = fx.timeline({ duration: 4.5 });

  // Enter: each word rises 28px out of a 14px blur. Opacity resolves faster than
  // the motion so no word lingers as a ghost while it settles.
  tl.fromTo(title, { y: 28, filter: 'blur(14px)' }, { y: 0, filter: 'blur(0px)', duration: 1.1, stagger: 0.075, ease: 'textOut' }, 0.3)
    .fromTo(title, { opacity: 0 }, { opacity: 1, duration: 0.55, stagger: 0.075, ease: 'power1.out' }, 0.3)
    .fromTo(sub, { y: 16, filter: 'blur(8px)' }, { y: 0, filter: 'blur(0px)', duration: 0.9, stagger: 0.06, ease: 'textOut' }, 0.95)
    .fromTo(sub, { opacity: 0 }, { opacity: 1, duration: 0.45, stagger: 0.06, ease: 'power1.out' }, 0.95)
  // Exit: the same move continued upward, accelerating away.
    .to(title, { y: -18, filter: 'blur(10px)', opacity: 0, duration: 0.55, stagger: 0.035, ease: 'power2.inOut' }, 3.35)
    .to(sub, { y: -10, filter: 'blur(6px)', opacity: 0, duration: 0.45, stagger: 0.03, ease: 'power2.inOut' }, 3.4);

  // Sound, on the same beats as the picture (film cue-sheet format; see fx.js).
  // Pitch SaaS pack (ElevenLabs-generated): glitch accents, deep whooshes and
  // crisp UI sounds; signature moments name their clip. Clips carry measured
  // hit points, so each lands on its beat without hand-set leads.
  fx.sfx([
    { t: 0.5, event: 'whoosh_deep', label: 'headline rises' },
    { t: 3.55, event: 'whoosh_deep', label: 'exit' },
  ]);
</script>
