<!doctype html><meta charset="utf-8">
<title>Back / Next Buttons</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#eef0f4;display:flex;align-items:center;justify-content:center}
  .card{width:820px;border-radius:28px;background:#fff;box-shadow:0 30px 80px rgba(20,30,60,.12);padding:48px 56px 44px;position:relative;overflow:hidden}
  .dots{display:flex;gap:10px;margin-bottom:34px}
  .dot{height:8px;width:40px;border-radius:4px;background:#e3e6ec;position:relative;overflow:hidden}
  .dot i{position:absolute;inset:0;background:#2d5bff;transform:scaleX(0);transform-origin:left;will-change:transform}
  .dot.d1 i{transform:scaleX(1)}
  .viewport{height:220px;position:relative;overflow:hidden}
  .step{position:absolute;inset:0;will-change:transform}
  .kicker{font-size:18px;color:#7b8190;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
  .h{font-size:44px;font-weight:500;color:#111;letter-spacing:-.02em;line-height:1.05}
  .p{font-size:22px;color:#5d6472;margin-top:14px;max-width:560px;line-height:1.4}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:30px}
  .btn{display:flex;align-items:center;gap:12px;height:64px;padding:0 28px;border-radius:16px;font-size:22px;font-weight:500;will-change:transform;position:relative}
  .back{background:#f1f3f7;color:#333}
  .next{background:#2d5bff;color:#fff;box-shadow:0 10px 30px rgba(45,91,255,.35)}
  .btn svg{width:22px;height:22px;will-change:transform}
  .btn .hov{position:absolute;inset:0;border-radius:16px;background:rgba(0,0,0,.08);opacity:0}
  .next .hov{background:rgba(255,255,255,.14)}
  .cursor{position:absolute;width:40px;height:44px;left:0;top:0;will-change:transform;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));opacity:0}
</style>
<div class="stage">
  <div class="card">
    <div class="dots"><div class="dot d1"><i></i></div><div class="dot d2"><i></i></div><div class="dot d3"><i></i></div><div class="dot d4"><i></i></div></div>
    <div class="viewport">
      <div class="step s1"><div class="kicker">Step 1 of 4</div><div class="h">Tell us about<br>your workspace</div><div class="p">Pick a name and a color. You can change these later.</div></div>
      <div class="step s2" style="transform:translateX(110%)"><div class="kicker">Step 2 of 4</div><div class="h">Invite your<br>teammates</div><div class="p">Add people by email or share an invite link.</div></div>
    </div>
    <div class="row">
      <div class="btn back"><div class="hov"></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 5l-7 7 7 7"/></svg><span>Back</span></div>
      <div class="btn next"><div class="hov"></div><span>Next</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></div>
    </div>
    <svg class="cursor" viewBox="0 0 20 22"><path d="M2 1 L17 12 L10 13 L14 20 L11 21 L7 14 L2 18 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  // card-local coords: Next button sits at right ~ (820-56-70, 48+34+8+220+30+32)
  const nx = 820 - 56 - 70, ny = 48 + 34 + 8 + 220 + 30 + 32;
  const bx = 56 + 70, by = ny;
  gsap.set('.back', { opacity: 0.45 });
  tl.fromTo('.cursor', { x: nx + 220, y: ny + 160, opacity: 0 }, { x: nx, y: ny, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0)
    // hover next
    .to('.next .hov', { opacity: 1, duration: 0.2 }, 0.45)
    .to('.next', { y: -3, scale: 1.03, duration: 0.25, ease: 'power2.out' }, 0.45)
    .to('.next svg', { x: 5, duration: 0.3, ease: 'power2.out' }, 0.45)
    // press
    .to('.next', { scale: 0.95, y: 0, duration: 0.1, ease: 'power2.in' }, 0.8)
    .to('.cursor', { scale: 0.85, duration: 0.1, transformOrigin: '10% 5%' }, 0.8)
    .to('.next', { scale: 1.03, y: -3, duration: 0.4, ease: 'back.out(3)' }, 0.92)
    .to('.cursor', { scale: 1, duration: 0.15 }, 0.92)
    // content advances
    .to('.s1', { xPercent: -110, duration: 0.55, ease: 'expo.inOut' }, 0.9)
    .to('.s2', { x: 0, duration: 0.55, ease: 'expo.inOut' }, 0.9)
    .to('.d2 i', { scaleX: 1, duration: 0.4, ease: 'power3.out' }, 1.0)
    .to('.back', { opacity: 1, duration: 0.3 }, 1.0)
    // leave next, travel to back
    .to('.next .hov', { opacity: 0, duration: 0.2 }, 1.5)
    .to('.next', { y: 0, scale: 1, duration: 0.3 }, 1.5)
    .to('.next svg', { x: 0, duration: 0.3 }, 1.5)
    .to('.cursor', { x: bx, y: by, duration: 0.7, ease: 'power3.inOut' }, 1.55)
    // hover back
    .to('.back .hov', { opacity: 1, duration: 0.2 }, 2.2)
    .to('.back', { y: -3, scale: 1.03, duration: 0.25 }, 2.2)
    .to('.back svg', { x: -5, duration: 0.3, ease: 'power2.out' }, 2.2)
    // press back
    .to('.back', { scale: 0.95, y: 0, duration: 0.1, ease: 'power2.in' }, 2.55)
    .to('.cursor', { scale: 0.85, duration: 0.1 }, 2.55)
    .to('.back', { scale: 1.03, y: -3, duration: 0.4, ease: 'back.out(3)' }, 2.67)
    .to('.cursor', { scale: 1, duration: 0.15 }, 2.67)
    .to('.s2', { x: '110%', duration: 0.55, ease: 'expo.inOut' }, 2.65)
    .to('.s1', { xPercent: 0, duration: 0.55, ease: 'expo.inOut' }, 2.65)
    .to('.d2 i', { scaleX: 0, transformOrigin: 'right', duration: 0.4, ease: 'power3.out' }, 2.75)
    .to('.back', { opacity: 0.45, duration: 0.3 }, 3.1)
    .to('.back .hov', { opacity: 0, duration: 0.2 }, 3.2)
    .to('.back', { y: 0, scale: 1, duration: 0.3 }, 3.2)
    .to('.back svg', { x: 0, duration: 0.3 }, 3.2)
    .to('.cursor', { x: nx + 220, y: ny + 160, opacity: 0, duration: 0.6, ease: 'power3.in' }, 3.3);
</script>
