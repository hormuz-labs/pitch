<!doctype html><meta charset="utf-8">
<title>Interactive Button: Trace</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f6f2ea;display:flex;align-items:center;justify-content:center}
  .paper{position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply}
  .wrap{position:relative;will-change:transform}
  .btn{position:relative;padding:0 64px;height:116px;border-radius:22px;background:#fff;border:2px solid #1a1a1a;display:flex;align-items:center;gap:18px;box-shadow:6px 6px 0 #1a1a1a}
  .btn span{font-size:44px;font-weight:500;color:#1a1a1a;letter-spacing:-.01em;font-family:"Sorts Mill Goudy","Atlas Grotesk",serif;font-style:italic}
  .trace{position:absolute;left:-22px;top:-22px;width:calc(100% + 44px);height:calc(100% + 44px);overflow:visible}
  .trace path{fill:none;stroke:#e5482b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .trace .p2{stroke:#1a1a1a;stroke-width:3;opacity:.9}
  .cursor{position:absolute;width:40px;height:44px;left:50%;top:50%;will-change:transform;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));opacity:0}
  .tick{position:absolute;right:-30px;top:-34px;width:60px;height:60px;overflow:visible;opacity:0}
  .tick path{fill:none;stroke:#e5482b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
</style>
<svg width="0" height="0" style="position:absolute"><filter id="wobble" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div class="stage">
  <svg class="paper" xmlns="http://www.w3.org/2000/svg"><filter id="pp"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .9 0 0 0 0 .86 0 0 0 0 .8 0 0 0 .35 0"/></filter><rect width="100%" height="100%" filter="url(#pp)"/></svg>
  <div class="wrap">
    <div class="btn"><span>Sign me up</span><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></div>
    <svg class="trace" viewBox="0 0 400 160" preserveAspectRatio="none" style="filter:url(#wobble)">
      <path class="p1" d="M60 22 H345 Q378 22 378 55 V105 Q378 138 345 138 H55 Q22 138 22 105 V55 Q22 22 55 22 H70"/>
      <path class="p2" d="M80 30 H340 Q370 30 370 60 V100 Q370 130 340 130 H60 Q30 130 30 100 V60 Q30 30 60 30 H95"/>
    </svg>
    <svg class="tick" viewBox="0 0 60 60"><path d="M10 32 L25 46 L52 12"/></svg>
  </div>
  <svg class="cursor" viewBox="0 0 20 22"><path d="M2 1 L17 12 L10 13 L14 20 L11 21 L7 14 L2 18 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 6 });
  gsap.set('.trace path', { drawSVG: '0% 0%' });
  gsap.set('.tick path', { drawSVG: '0% 0%' });
  tl.to('.wrap', { y: -5, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
    .fromTo('.cursor', { x: 280, y: 220, opacity: 0 }, { x: 120, y: 36, opacity: 1, duration: 0.8, ease: 'power3.out' }, 0.3)
    .to('.wrap', { scale: 1.03, duration: 0.3, ease: 'power2.out' }, 1.0)
    // press: the outline draws itself around the edge
    .to('.wrap', { scale: 0.96, duration: 0.12, ease: 'power2.in' }, 1.4)
    .to('.cursor', { scale: 0.85, transformOrigin: '10% 5%', duration: 0.1 }, 1.4)
    .to('.btn', { x: 4, y: 4, boxShadow: '2px 2px 0 #1a1a1a', duration: 0.12 }, 1.4)
    .to('.wrap', { scale: 1.03, duration: 0.5, ease: 'back.out(2)' }, 1.54)
    .to('.btn', { x: 0, y: 0, boxShadow: '6px 6px 0 #1a1a1a', duration: 0.4, ease: 'back.out(2)' }, 1.54)
    .to('.cursor', { scale: 1, duration: 0.15 }, 1.54)
    .to('.p1', { drawSVG: '0% 100%', duration: 1.1, ease: 'power2.inOut' }, 1.5)
    .to('.p2', { drawSVG: '0% 100%', duration: 1.1, ease: 'power2.inOut' }, 1.7)
    .to('.tick', { opacity: 1, duration: 0.1 }, 2.5)
    .to('.tick path', { drawSVG: '0% 100%', duration: 0.4, ease: 'power2.out' }, 2.5)
    .fromTo('.tick', { scale: 0.6, rotation: -10 }, { scale: 1, rotation: 0, duration: 0.5, ease: 'back.out(3)' }, 2.5)
    // the line lifts off the way it came, then the cursor leaves
    .to('.cursor', { x: 280, y: 220, opacity: 0, duration: 0.8, ease: 'power3.in' }, 3.3)
    .to('.wrap', { scale: 1, duration: 0.4, ease: 'power2.inOut' }, 3.4)
    .to('.p1', { drawSVG: '100% 100%', duration: 0.9, ease: 'power2.inOut' }, 4.3)
    .to('.p2', { drawSVG: '100% 100%', duration: 0.9, ease: 'power2.inOut' }, 4.4)
    .to('.tick', { opacity: 0, scale: 0.6, duration: 0.3, ease: 'power2.in' }, 4.6);
</script>
