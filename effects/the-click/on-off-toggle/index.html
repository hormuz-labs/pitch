<!doctype html><meta charset="utf-8">
<title>On / Off Toggle</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f2f3f5;display:flex;align-items:center;justify-content:center}
  .card{width:720px;border-radius:28px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.10);padding:12px 0;position:relative}
  .row{display:flex;align-items:center;justify-content:space-between;padding:26px 40px}
  .row+.row{border-top:1px solid #eef0f3}
  .t{font-size:28px;font-weight:500;color:#111}
  .t small{display:block;font-size:19px;font-weight:400;color:#8b8f99;margin-top:4px}
  .tog{position:relative;width:132px;height:76px;border-radius:38px;background:#d9dce3;will-change:transform,background-color}
  .tog.small{width:96px;height:56px;border-radius:28px}
  .knob{position:absolute;left:5px;top:5px;width:66px;height:66px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.22);will-change:transform;display:flex;align-items:center;justify-content:center}
  .small .knob{width:46px;height:46px}
  .knob svg{width:30px;height:30px;stroke:#22c55e;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
  .txt{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-size:20px;font-weight:500;letter-spacing:.06em;color:#fff;overflow:hidden}
  .txt.on{left:22px}.txt.off{right:20px;color:#8b8f99}
  .cursor{position:absolute;width:40px;height:44px;left:0;top:0;will-change:transform;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));opacity:0;z-index:9}
</style>
<div class="stage">
  <div class="card">
    <div class="row"><div class="t">Notifications<small>Alerts for new activity</small></div>
      <div class="tog main"><span class="txt on">ON</span><span class="txt off">OFF</span><div class="knob"><svg viewBox="0 0 24 24"><path class="chk" d="M5 12l5 5 9-10"/></svg></div></div></div>
    <div class="row"><div class="t" style="font-size:24px">Location access</div><div class="tog small" style="background:#22c55e"><div class="knob" style="transform:translateX(40px)"></div></div></div>
    <div class="row"><div class="t" style="font-size:24px">Analytics</div><div class="tog small"><div class="knob"></div></div></div>
    <svg class="cursor" viewBox="0 0 20 22"><path d="M2 1 L17 12 L10 13 L14 20 L11 21 L7 14 L2 18 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  gsap.set('.main .chk', { strokeDasharray: 30, strokeDashoffset: 30 });
  gsap.set('.txt.on', { x: -20, opacity: 0 });
  const D = 56;
  const kx = 720 - 40 - 132 + 38, ky = 12 + 26 + 38;
  function snap(on, t) {
    tl.to('.main', { scale: 0.94, duration: 0.09, ease: 'power2.in' }, t)
      .to('.main', { scale: 1, duration: 0.45, ease: 'elastic.out(1,0.5)' }, t + 0.1)
      .to('.main', { backgroundColor: on ? '#22c55e' : '#d9dce3', duration: 0.25, ease: 'power2.inOut' }, t + 0.08)
      .fromTo('.main .knob', { scaleX: 1 }, { scaleX: 1.3, duration: 0.1, ease: 'power2.out' }, t + 0.05)
      .to('.main .knob', { x: on ? D : 0, duration: 0.32, ease: 'back.out(2.2)' }, t + 0.08)
      .to('.main .knob', { scaleX: 1, duration: 0.5, ease: 'elastic.out(1,0.4)' }, t + 0.18)
      .to('.main .chk', { strokeDashoffset: on ? 0 : 30, duration: 0.3, ease: 'power2.out' }, t + (on ? 0.25 : 0.05))
      .to('.txt.on', { x: on ? 0 : -20, opacity: on ? 1 : 0, duration: 0.3, ease: 'power3.out' }, t + 0.15)
      .to('.txt.off', { x: on ? 20 : 0, opacity: on ? 0 : 1, duration: 0.3, ease: 'power3.out' }, t + 0.08)
      .to('.cursor', { scale: 0.85, transformOrigin: '10% 5%', duration: 0.08 }, t)
      .to('.cursor', { scale: 1, duration: 0.15 }, t + 0.12);
  }
  tl.fromTo('.cursor', { x: kx - 220, y: ky + 200, opacity: 0 }, { x: kx, y: ky, opacity: 1, duration: 0.7, ease: 'move' }, 0);
  snap(true, 0.9);
  tl.to('.cursor', { x: kx + D, duration: 0.35, ease: 'power2.inOut' }, 1.1);
  snap(false, 2.5);
  tl.to('.cursor', { x: kx, duration: 0.35, ease: 'power2.inOut' }, 2.7);
  tl.to('.cursor', { x: kx - 220, y: ky + 200, opacity: 0, duration: 0.6, ease: 'power3.in' }, 3.3);
</script>
