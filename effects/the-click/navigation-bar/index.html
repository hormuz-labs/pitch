<!doctype html><meta charset="utf-8">
<title>Navigation Bar</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#e6e9ef;display:flex;align-items:center;justify-content:center}
  .phone{width:340px;height:680px;border-radius:48px;background:#111;padding:12px;box-shadow:0 40px 100px rgba(0,0,0,.3);position:relative}
  .screen{position:absolute;inset:12px;border-radius:38px;background:#f7f8fb;overflow:hidden}
  .notch{position:absolute;left:50%;top:14px;width:100px;height:28px;margin-left:-50px;border-radius:14px;background:#111;z-index:5}
  .pages{position:absolute;inset:0 0 92px}
  .page{position:absolute;inset:0;padding:66px 22px 0;will-change:transform,opacity;opacity:0}
  .page h1{font-size:28px;font-weight:500;color:#111;margin-bottom:16px}
  .blk{border-radius:16px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:12px}
  .tabbar{position:absolute;left:14px;right:14px;bottom:16px;height:76px;border-radius:26px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.12);display:flex;align-items:center;padding:0 8px}
  .ind{position:absolute;left:8px;top:8px;width:66px;height:60px;border-radius:20px;background:#2d5bff;will-change:transform}
  .tab{position:relative;flex:1;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8a90a0;will-change:transform}
  .tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;will-change:transform}
  .tab span{font-size:11px;font-weight:500;height:12px;overflow:hidden;opacity:0;will-change:transform,opacity}
  .cursor{position:absolute;width:40px;height:44px;left:0;top:0;will-change:transform;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));opacity:0;z-index:9}
</style>
<div class="stage">
  <div class="phone"><div class="notch"></div>
    <div class="screen">
      <div class="pages">
        <div class="page p0"><h1>Home</h1><div class="blk" style="height:150px;background:linear-gradient(135deg,#dfe5ff,#f1e0ff)"></div><div class="blk" style="height:70px"></div><div class="blk" style="height:70px"></div></div>
        <div class="page p1"><h1>Explore</h1><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="blk" style="height:130px;background:#ffe4d6"></div><div class="blk" style="height:130px;background:#d9f5e6"></div><div class="blk" style="height:130px;background:#dfe5ff"></div><div class="blk" style="height:130px;background:#fff3c4"></div></div></div>
        <div class="page p2"><h1>Inbox</h1><div class="blk" style="height:64px"></div><div class="blk" style="height:64px"></div><div class="blk" style="height:64px"></div><div class="blk" style="height:64px"></div></div>
        <div class="page p3"><h1>Profile</h1><div class="blk" style="height:110px;width:110px;border-radius:55px;background:#f1e0ff;margin:8px auto 20px"></div><div class="blk" style="height:56px"></div><div class="blk" style="height:56px"></div></div>
      </div>
      <div class="tabbar">
        <div class="ind"></div>
        <div class="tab t0"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10H3z"/></svg><span>Home</span></div>
        <div class="tab t1"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2 6-4 2 2-6z"/></svg><span>Explore</span></div>
        <div class="tab t2"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 8l9 6 9-6"/></svg><span>Inbox</span></div>
        <div class="tab t3"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Profile</span></div>
      </div>
      <svg class="cursor" viewBox="0 0 20 22"><path d="M2 1 L17 12 L10 13 L14 20 L11 21 L7 14 L2 18 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 5 });
  const tabs = [...document.querySelectorAll('.tab')];
  const W = tabs[0].offsetWidth;
  gsap.set('.ind', { width: W });
  gsap.set('.p0', { opacity: 1 });
  gsap.set('.t0', { color: '#fff' }); gsap.set('.t0 span', { opacity: 1 });
  const cy = 680 - 24 - 16 - 38, cx0 = 14 + 8 + W / 2;
  function go(from, to, t) {
    const dir = Math.sign(to - from);
    tl.to('.ind', { x: (to) * W, duration: 0.5, ease: 'move' }, t)
      .fromTo('.ind', { scaleX: 1 }, { scaleX: 1.25, duration: 0.15, ease: 'power2.out' }, t)
      .to('.ind', { scaleX: 1, duration: 0.5, ease: 'elastic.out(1,0.45)' }, t + 0.15)
      .to(tabs[from], { color: '#8a90a0', duration: 0.25 }, t)
      .to(tabs[from].querySelector('span'), { opacity: 0, y: 4, duration: 0.2 }, t)
      .to(tabs[to], { color: '#fff', duration: 0.25 }, t + 0.1)
      .fromTo(tabs[to].querySelector('span'), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out', immediateRender: false }, t + 0.2)
      .fromTo(tabs[to].querySelector('svg'), { y: 0, scale: 1 }, { y: -6, scale: 1.15, duration: 0.15, ease: 'power2.out' }, t + 0.05)
      .to(tabs[to].querySelector('svg'), { y: 0, scale: 1, duration: 0.55, ease: 'elastic.out(1,0.4)' }, t + 0.2)
      .to('.p' + from, { opacity: 0, x: -24 * dir, duration: 0.3, ease: 'power2.in' }, t)
      .fromTo('.p' + to, { opacity: 0, x: 40 * dir }, { opacity: 1, x: 0, duration: 0.45, ease: 'expo.out', immediateRender: false }, t + 0.2)
      .to('.cursor', { x: cx0 + to * W, duration: 0.45, ease: 'power2.inOut' }, t - 0.45)
      .to('.cursor', { scale: 0.85, transformOrigin: '10% 5%', duration: 0.08 }, t - 0.02)
      .to('.cursor', { scale: 1, duration: 0.15 }, t + 0.1);
  }
  tl.fromTo('.cursor', { x: cx0 + 80, y: cy - 200, opacity: 0 }, { x: cx0, y: cy, opacity: 1, duration: 0.6, ease: 'move' }, 0);
  go(0, 1, 1.0); go(1, 2, 2.0); go(2, 3, 3.0); go(3, 0, 4.1);
</script>
