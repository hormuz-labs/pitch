<!doctype html><meta charset="utf-8">
<title>View Cart Button: Split</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101114;display:flex;align-items:center;justify-content:center}
  .glow{position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:radial-gradient(circle,#2a3cff 0%,transparent 60%);opacity:.18;filter:blur(40px)}
  .panel{position:relative;width:460px;padding:28px;border-radius:30px;background:#1a1b20;border:1px solid rgba(255,255,255,.06);box-shadow:0 40px 80px rgba(0,0,0,.5)}
  .row{display:flex;align-items:center;gap:18px;margin-bottom:24px}
  .thumb{width:84px;height:84px;border-radius:20px;background:linear-gradient(135deg,#7c5cff,#ff5c8a);display:flex;align-items:center;justify-content:center}
  .thumb i{width:38px;height:38px;border-radius:10px;background:#fff;transform:rotate(45deg)}
  .name{font-size:22px;font-weight:500;color:#fff}
  .sub{font-size:15px;color:#8a8f9c;margin-top:4px}
  .price{margin-left:auto;font-size:22px;color:#fff;font-weight:500}
  .btnwrap{position:relative;height:62px}
  .pill{position:absolute;top:0;left:0;height:62px;border-radius:31px;background:#fff;color:#111;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:500;will-change:transform,width}
  .whole{width:404px}
  .left{width:404px;opacity:0}
  .right{width:404px;opacity:0}
  .step{display:flex;align-items:center;gap:0;height:100%;width:100%;justify-content:space-between;padding:0 6px;opacity:0}
  .step .k{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;color:#111;will-change:transform}
  .step .k.plus{background:#111;color:#fff}
  .qty{height:30px;overflow:hidden;width:24px;text-align:center;font-size:22px;font-weight:500}
  .qty .col{display:flex;flex-direction:column;will-change:transform}
  .qty .col span{height:30px;line-height:30px;display:block}
  .vc{display:flex;align-items:center;gap:8px;opacity:0;white-space:nowrap}
  .vc svg{width:20px;height:20px}
  .cursor{position:absolute;left:0;top:0;width:30px;height:30px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));z-index:10;will-change:transform}
  .ring{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid rgba(255,255,255,.9);opacity:0;pointer-events:none}
</style>
<div class="stage">
  <div class="glow"></div>
  <div class="panel">
    <div class="row"><div class="thumb"><i></i></div><div><div class="name">Northwind Case</div><div class="sub">Graphite · In stock</div></div><div class="price">$49</div></div>
    <div class="btnwrap">
      <div class="pill left"><div class="step"><div class="k minus">−</div><div class="qty"><div class="col"><span>0</span><span>1</span><span>2</span><span>3</span></div></div><div class="k plus">+</div></div></div>
      <div class="pill right"><div class="vc"><span>View cart</span><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></div>
      <div class="pill whole"><span class="wl">Add to cart</span></div>
    </div>
  </div>
  <div class="ring"></div>
  <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l16 9-7 1.5L9 20z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 8 });
  // stage coords: panel 460x~220 centered → button row center y ≈ 360+55, button spans x 438..842
  const BY = 415, BX = 640;
  const PLUS_X = 438 + 172 - 31, MINUS_X = 438 + 31;   // left pill will be 172 wide
  gsap.set('.qty .col', { y: 0 });
  gsap.set('.cursor', { x: 1000, y: 660 });
  const click = (t, x, y, target) => {
    tl.to(target, { scale: 0.92, duration: 0.1, ease: 'power2.in' }, t)
      .to(target, { scale: 1, duration: 0.45, ease: 'elastic.out(1,0.45)' }, t + 0.1)
      .to('.cursor', { scale: 0.85, duration: 0.08 }, t).to('.cursor', { scale: 1, duration: 0.2 }, t + 0.1)
      .fromTo('.ring', { x, y, scale: 0.5, opacity: 0.9 }, { scale: 5, opacity: 0, duration: 0.5, ease: 'power2.out' }, t);
  };

  tl.from('.panel', { y: 40, opacity: 0, duration: 0.6, ease: 'expo.out' }, 0)
    .fromTo('.cursor', { x: 1000, y: 660 }, { x: BX + 10, y: BY + 6, duration: 0.8, ease: 'power3.inOut' }, 0.5);
  // the tap that splits
  click(1.35, BX, BY, '.pill.whole');
  tl.set('.pill.left, .pill.right', { opacity: 1 }, 1.5)
    .to('.pill.whole', { opacity: 0, duration: 0.08 }, 1.5)
    .to('.wl', { opacity: 0, duration: 0.05 }, 1.5)
    // the pill tears in two: the left becomes a stepper, the right slides away and becomes "View cart"
    .to('.pill.left', { width: 172, duration: 0.7, ease: 'expo.out' }, 1.52)
    .to('.pill.right', { width: 218, x: 186, duration: 0.7, ease: 'expo.out' }, 1.52)
    .to('.step', { opacity: 1, duration: 0.3 }, 1.75)
    .to('.vc', { opacity: 1, duration: 0.3 }, 1.8)
    .fromTo('.vc', { x: 12 }, { x: 0, duration: 0.5, ease: 'expo.out' }, 1.8)
    .fromTo('.step .k', { scale: 0.6 }, { scale: 1, duration: 0.5, ease: 'back.out(2.5)', stagger: 0.06 }, 1.75)
    .to('.qty .col', { y: -30, duration: 0.4, ease: 'back.out(1.6)' }, 1.85)
    // over to plus, two more taps
    .to('.cursor', { x: PLUS_X + 8, y: BY + 4, duration: 0.6, ease: 'power3.inOut' }, 2.5);
  click(3.2, PLUS_X, BY, '.k.plus');
  tl.to('.qty .col', { y: -60, duration: 0.4, ease: 'back.out(1.6)' }, 3.25);
  click(3.9, PLUS_X, BY, '.k.plus');
  tl.to('.qty .col', { y: -90, duration: 0.4, ease: 'back.out(1.6)' }, 3.95)
    // one back on minus
    .to('.cursor', { x: MINUS_X + 8, y: BY + 4, duration: 0.5, ease: 'power3.inOut' }, 4.5);
  click(5.1, MINUS_X, BY, '.k.minus');
  tl.to('.qty .col', { y: -60, duration: 0.4, ease: 'back.out(1.6)' }, 5.15)
    // drift toward view cart, hover
    .to('.cursor', { x: BX + 120, y: BY + 6, duration: 0.6, ease: 'power3.inOut' }, 5.7)
    .to('.vc svg', { x: 5, duration: 0.3, yoyo: true, repeat: 1, ease: 'power1.inOut' }, 6.3)
    // merge back for the loop
    .to('.step, .vc', { opacity: 0, duration: 0.2 }, 6.9)
    .to('.pill.left', { width: 404, duration: 0.6, ease: 'expo.inOut' }, 7.0)
    .to('.pill.right', { width: 404, x: 0, duration: 0.6, ease: 'expo.inOut' }, 7.0)
    .to('.pill.whole', { opacity: 1, duration: 0.15 }, 7.5)
    .to('.wl', { opacity: 1, duration: 0.2 }, 7.55)
    .to('.qty .col', { y: 0, duration: 0.01 }, 7.6)
    .to('.cursor', { x: 1000, y: 660, duration: 0.5, ease: 'power2.in' }, 7.4);
</script>
