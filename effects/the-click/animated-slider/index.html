<!doctype html><meta charset="utf-8">
<title>Animated Slider</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f3f1ec;display:flex;align-items:center;justify-content:center}
  .card{width:760px;padding:56px 60px 52px;border-radius:32px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.10)}
  .q{font-size:34px;font-weight:500;color:#111;letter-spacing:-.02em}
  .sub{font-size:20px;color:#8a8a8a;margin-top:8px}
  .face{font-size:96px;line-height:1;text-align:center;margin:36px 0 28px;height:100px;position:relative}
  .face span{position:absolute;left:50%;top:0;margin-left:-48px;width:96px;will-change:transform;opacity:0}
  .track{position:relative;height:16px;border-radius:8px;background:#ececec;margin:0 12px}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;background:linear-gradient(90deg,#ff7a59,#ffcb47 50%,#38d39f);will-change:width}
  .pos{position:absolute;left:0;top:50%;width:0;height:0;will-change:transform}
  .thumb{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.22),0 0 0 3px #111 inset;will-change:transform}
  .tip{position:absolute;left:0;bottom:36px;transform:translateX(-50%);padding:8px 16px;border-radius:12px;background:#111;color:#fff;font-size:20px;font-weight:500;white-space:nowrap;opacity:0}
  .tip:after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:#111;transform:translateX(-50%) rotate(45deg)}
  .cursor{position:absolute;width:40px;height:44px;left:-6px;top:-4px;will-change:transform;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
  .ends{display:flex;justify-content:space-between;margin:20px 12px 0;font-size:18px;color:#9a9a9a}
</style>
<div class="stage">
  <div class="card">
    <div class="q">How was your experience today?</div>
    <div class="sub">Drag to rate</div>
    <div class="face"><span class="f0">😞</span><span class="f1">😐</span><span class="f2">🙂</span><span class="f3">😄</span></div>
    <div class="track">
      <div class="fill"></div>
      <div class="pos">
        <div class="tip">Meh</div>
        <div class="thumb"></div>
        <svg class="cursor" viewBox="0 0 20 22"><path d="M2 1 L17 12 L10 13 L14 20 L11 21 L7 14 L2 18 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div class="ends"><span>Not great</span><span>Amazing</span></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const W = 760 - 120 - 24; // track width
  const tl = fx.timeline({ duration: 4 });
  const pos = { v: 0.12 };
  const faces = ['.f0', '.f1', '.f2', '.f3'];
  gsap.set('.f0', { opacity: 1 });
  const posEl = document.querySelector('.pos'), fillEl = document.querySelector('.fill');
  function apply() { posEl.style.transform = `translateX(${pos.v * W}px)`; fillEl.style.width = pos.v * W + 'px'; }
  apply();
  tl.fromTo('.cursor', { x: 300, y: 220, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.7, ease: 'power3.out' }, 0)
    .to('.thumb', { scale: 1.25, duration: 0.25, ease: 'back.out(3)' }, 0.65)
    .to('.tip', { opacity: 1, y: -6, duration: 0.25, ease: 'power2.out' }, 0.65)
    .to(pos, { v: 0.92, duration: 1.0, ease: 'power2.inOut', onUpdate: apply }, 0.85)
    .to(pos, { v: 0.86, duration: 0.5, ease: 'elastic.out(1,0.5)', onUpdate: apply }, 1.85)
    .to('.thumb', { scale: 1, duration: 0.3, ease: 'power2.out' }, 2.4)
    .to('.cursor', { x: 160, y: 140, opacity: 0, duration: 0.7, ease: 'power3.in' }, 2.7)
    .to('.tip', { opacity: 0, y: 0, duration: 0.25 }, 3.3)
    .to(pos, { v: 0.12, duration: 0.5, ease: 'power3.inOut', onUpdate: apply }, 3.5);
  function crossT(th) { const p = (th - 0.12) / 0.8; const u = p < 0.5 ? Math.sqrt(p / 2) : 1 - Math.sqrt((1 - p) / 2); return 0.85 + u; }
  [[0.3, 'Okay'], [0.55, 'Good'], [0.8, 'Amazing']].forEach(([th, label], k) => {
    const t = crossT(th);
    tl.to(faces[k], { yPercent: -60, opacity: 0, scale: 0.7, duration: 0.18, ease: 'power2.in' }, t)
      .fromTo(faces[k + 1], { yPercent: 60, opacity: 0, scale: 0.7, rotation: -15 }, { yPercent: 0, opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: 'elastic.out(1,0.5)' }, t + 0.1)
      .set('.tip', { textContent: label }, t);
  });
  tl.to('.f3', { opacity: 0, scale: 0.7, duration: 0.25 }, 3.5)
    .fromTo('.f0', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)' }, 3.6)
    .set('.tip', { textContent: 'Meh' }, 3.6);
</script>
