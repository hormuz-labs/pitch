<!doctype html><meta charset="utf-8">
<title>Search Bar Reveal</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0f1117;display:flex;align-items:flex-start;justify-content:center;padding-top:170px}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px}
  .wrap{position:relative;width:760px;height:84px;display:flex;justify-content:center}
  .bar{position:absolute;top:0;left:50%;transform:translateX(-50%);width:84px;height:84px;border-radius:42px;background:#1b1e27;border:1.5px solid rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;align-items:center;padding:0 26px;gap:16px;overflow:hidden;will-change:width}
  .bar svg.mag{flex:none;width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
  .field{flex:1;font-size:28px;color:#fff;white-space:nowrap;opacity:0;display:flex;align-items:center}
  .ph{color:#6d7282}
  .caret{display:inline-block;width:2px;height:32px;background:#7c9cff;margin-left:2px;will-change:opacity}
  .kbd{flex:none;font-size:15px;color:#9aa0b2;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:5px 9px;opacity:0}
  .results{position:absolute;top:100px;left:0;right:0;border-radius:22px;background:#1b1e27;border:1.5px solid rgba(255,255,255,.1);box-shadow:0 30px 80px rgba(0,0,0,.5);padding:10px;opacity:0;will-change:transform,opacity;transform-origin:50% 0}
  .r{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:14px;color:#fff;font-size:22px;opacity:0;will-change:transform,opacity}
  .r i{width:40px;height:40px;border-radius:12px;background:#2a2f3d;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;font-style:normal;color:#9aa0b2}
  .r small{margin-left:auto;font-size:16px;color:#6d7282}
  .r.hl{background:rgba(124,156,255,.16)}
  .cursor{position:absolute;width:40px;height:44px;left:50%;top:0;will-change:transform;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6));opacity:0;z-index:9}
</style>
<div class="stage">
  <div class="grid"></div>
  <div class="wrap">
    <div class="bar">
      <svg class="mag" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <div class="field"><span class="typed"></span><span class="ph">Search anything…</span><span class="caret"></span></div>
      <span class="kbd">⌘ K</span>
    </div>
    <div class="results">
      <div class="r hl"><i>◈</i>Design system overview<small>Page</small></div>
      <div class="r"><i>▤</i>Design tokens · colors<small>File</small></div>
      <div class="r"><i>◷</i>Design review · Thursday<small>Event</small></div>
      <div class="r"><i>◎</i>Designers channel<small>Channel</small></div>
    </div>
    <svg class="cursor" viewBox="0 0 20 22"><path d="M2 1 L17 12 L10 13 L14 20 L11 21 L7 14 L2 18 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/TextPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(TextPlugin);
  const tl = fx.timeline({ duration: 6 });
  gsap.set('.results', { y: -14, scale: 0.96 });
  gsap.set('.r', { y: 8 });
  tl.fromTo('.cursor', { x: 220, y: 260, opacity: 0 }, { x: 4, y: 40, opacity: 1, duration: 0.7, ease: 'power3.out' }, 0)
    .to('.bar', { scale: 0.92, duration: 0.1, ease: 'power2.in' }, 0.7)
    .to('.cursor', { scale: 0.85, transformOrigin: '10% 5%', duration: 0.08 }, 0.7)
    .to('.cursor', { scale: 1, duration: 0.15 }, 0.82)
    // the reveal: the circle stretches into a full-width bar
    .to('.bar', { scale: 1, width: 760, duration: 0.7, ease: 'expo.out' }, 0.82)
    .fromTo('.bar', { scaleY: 1 }, { scaleY: 0.9, duration: 0.15 }, 0.82).to('.bar', { scaleY: 1, duration: 0.6, ease: 'elastic.out(1,0.45)' }, 0.97)
    .to('.bar svg.mag', { rotation: -20, duration: 0.15 }, 0.82).to('.bar svg.mag', { rotation: 0, duration: 0.5, ease: 'elastic.out(1,0.4)' }, 0.97)
    .to('.field', { opacity: 1, duration: 0.3 }, 1.1)
    .to('.kbd', { opacity: 1, duration: 0.3 }, 1.25)
    .to('.cursor', { x: 300, y: 200, opacity: 0, duration: 0.6, ease: 'power3.in' }, 1.2)
    // typing
    .to('.ph', { opacity: 0, duration: 0.15 }, 1.7)
    .to('.typed', { text: 'design', duration: 0.6, ease: 'none' }, 1.75)
    .to('.results', { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: 'expo.out' }, 2.25)
    .to('.r', { opacity: 1, y: 0, duration: 0.45, stagger: 0.07, ease: 'power3.out' }, 2.2)
    // collapse back
    .to('.r', { opacity: 0, y: -6, duration: 0.25, stagger: { each: 0.04, from: 'end' }, ease: 'power2.in' }, 4.2)
    .to('.results', { opacity: 0, y: -14, scale: 0.96, duration: 0.35, ease: 'power3.in' }, 4.4)
    .to('.kbd', { opacity: 0, duration: 0.2 }, 4.5)
    .to('.field', { opacity: 0, duration: 0.2 }, 4.55)
    .to('.bar', { width: 84, duration: 0.6, ease: 'expo.inOut' }, 4.7)
    .set('.typed', { text: '' }, 5.4).set('.ph', { opacity: 1 }, 5.4);
  // caret blink as a function of time
  for (let t = 1.1; t < 4.6; t += 0.5) tl.set('.caret', { opacity: 0 }, t).set('.caret', { opacity: 1 }, t + 0.25);
</script>
