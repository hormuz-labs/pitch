<!doctype html><meta charset="utf-8">
<title>Liquid Glass Menu: Horizontal</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#1a0f2e;display:flex;align-items:center;justify-content:center}
  .bg{position:absolute;inset:-8%;background:url("../../../assets/backgrounds/sunset.png") center/cover;filter:saturate(1.3) brightness(.95);will-change:transform}
  .orb{position:absolute;border-radius:50%;filter:blur(30px);opacity:.7;will-change:transform}
  .o1{width:420px;height:420px;background:#ff8a5b;left:120px;top:240px}.o2{width:360px;height:360px;background:#7c5cff;right:160px;top:40px}
  .nav{position:relative;display:flex;align-items:center;padding:8px;border-radius:999px;background:rgba(255,255,255,.12);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);border:1px solid rgba(255,255,255,.35);box-shadow:0 30px 80px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
  .pill{position:absolute;left:8px;top:8px;height:72px;width:150px;border-radius:999px;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 2px 6px rgba(255,255,255,.8),inset 0 -8px 16px rgba(255,255,255,.15),0 8px 26px rgba(0,0,0,.18);will-change:transform;transform-origin:50% 50%}
  .pill:before{content:"";position:absolute;inset:0;border-radius:999px;background:radial-gradient(60% 70% at 30% 20%,rgba(255,255,255,.7),rgba(255,255,255,0))}
  .it{position:relative;height:72px;padding:0 34px;display:flex;align-items:center;gap:10px;font-size:26px;font-weight:500;color:rgba(255,255,255,.7);white-space:nowrap;will-change:transform}
  .it svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .cursor{position:absolute;width:40px;height:44px;left:0;top:0;will-change:transform;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));opacity:0}
</style>
<div class="stage">
  <div class="bg"></div><div class="orb o1"></div><div class="orb o2"></div>
  <div class="nav">
    <div class="pill"></div>
    <div class="it i0"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10H3z"/></svg>Home</div>
    <div class="it i1"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</div>
    <div class="it i2"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h14"/></svg>Library</div>
    <div class="it i3"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</div>
    <svg class="cursor" viewBox="0 0 20 22"><path d="M2 1 L17 12 L10 13 L14 20 L11 21 L7 14 L2 18 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const items = [...document.querySelectorAll('.it')];
  const pill = document.querySelector('.pill');
  const tl = fx.timeline({ duration: 6 });
  const geo = items.map(el => ({ x: el.offsetLeft - 8, w: el.offsetWidth }));
  gsap.set(pill, { x: geo[0].x, width: geo[0].w });
  gsap.set(items[0], { color: '#1a1a2a' });
  function go(from, to, t) {
    const dir = Math.sign(to - from);
    // liquid: the pill stretches toward the target, then snaps and settles
    tl.to(pill, { x: geo[to].x, width: geo[to].w, duration: 0.55, ease: 'move' }, t)
      .fromTo(pill, { scaleX: 1, scaleY: 1 }, { scaleX: 1.45, scaleY: 0.82, duration: 0.18, ease: 'power2.out' }, t)
      .to(pill, { scaleX: 1, scaleY: 1, duration: 0.6, ease: 'elastic.out(1,0.45)' }, t + 0.18)
      .to(items[from], { color: 'rgba(255,255,255,.7)', duration: 0.3 }, t)
      .to(items[to], { color: '#1a1a2a', duration: 0.3 }, t + 0.15)
      .fromTo(items[to], { y: 0 }, { y: -6, duration: 0.15, ease: 'power2.out' }, t + 0.1)
      .to(items[to], { y: 0, duration: 0.5, ease: 'elastic.out(1,0.4)' }, t + 0.25)
      .fromTo(items[to].querySelector('svg'), { rotation: -14 * dir, scale: 0.8 }, { rotation: 0, scale: 1, duration: 0.6, ease: 'back.out(3)' }, t + 0.1);
    // cursor rides along
    tl.to('.cursor', { x: geo[to].x + geo[to].w / 2 + 8, y: 44, duration: 0.5, ease: 'power2.inOut' }, t - 0.45)
      .to('.cursor', { scale: 0.85, transformOrigin: '10% 5%', duration: 0.08 }, t - 0.02)
      .to('.cursor', { scale: 1, duration: 0.15 }, t + 0.1);
  }
  tl.fromTo('.cursor', { x: geo[0].x + 60, y: 180, opacity: 0 }, { x: geo[0].x + geo[0].w / 2 + 8, y: 44, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0);
  go(0, 1, 1.0); go(1, 2, 2.2); go(2, 3, 3.4); go(3, 0, 4.7);
  tl.to('.orb.o1', { x: 120, y: -60, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
    .to('.orb.o2', { x: -140, y: 80, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
    .fromTo('.bg', { scale: 1.0 }, { scale: 1.05, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
</script>
