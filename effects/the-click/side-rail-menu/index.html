<!doctype html><meta charset="utf-8">
<title>Side Rail Menu</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#dfe3ea;display:flex;align-items:center;justify-content:center}
  .win{width:1120px;height:620px;border-radius:20px;background:#f7f8fa;box-shadow:0 40px 100px rgba(0,0,0,.25);overflow:hidden;position:relative}
  .chrome{height:48px;background:#fff;border-bottom:1px solid #e6e8ee;display:flex;align-items:center;padding:0 18px;gap:8px}
  .chrome i{width:12px;height:12px;border-radius:50%;background:#e2e4ea}
  .chrome i:nth-child(1){background:#ff5f57}.chrome i:nth-child(2){background:#febc2e}.chrome i:nth-child(3){background:#28c840}
  .body{position:absolute;inset:48px 0 0}
  .rail{position:absolute;left:0;top:0;bottom:0;width:260px;background:#fff;border-right:1px solid #e6e8ee;padding:18px 12px;display:flex;flex-direction:column;gap:6px;will-change:transform;box-shadow:20px 0 60px rgba(0,0,0,.08)}
  .nav{display:flex;align-items:center;gap:14px;height:52px;padding:0 14px;border-radius:12px;color:#3a3f4b;font-size:20px;font-weight:500;white-space:nowrap;will-change:transform,opacity;opacity:0}
  .nav.active{background:#2d5bff;color:#fff}
  .nav svg{flex:none;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .nav span{overflow:hidden;will-change:opacity}
  .content{position:absolute;left:0;right:0;top:0;bottom:0;padding:28px 36px;will-change:transform}
  .top{display:flex;align-items:center;gap:16px;margin-bottom:24px}
  .burger{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid #e6e8ee;display:flex;align-items:center;justify-content:center;will-change:transform;position:relative}
  .burger svg{width:22px;height:22px;stroke:#3a3f4b;fill:none;stroke-width:2.4;stroke-linecap:round}
  .h{font-size:30px;font-weight:500;color:#111}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .c{height:120px;border-radius:16px;background:#fff;border:1px solid #e6e8ee}
  .big{margin-top:16px;height:260px;border-radius:16px;background:#fff;border:1px solid #e6e8ee}
  .cursor{position:absolute;width:40px;height:44px;left:0;top:0;will-change:transform;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));opacity:0;z-index:9}
</style>
<div class="stage">
  <div class="win">
    <div class="chrome"><i></i><i></i><i></i></div>
    <div class="body">
      <div class="content">
        <div class="top"><div class="burger"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div><div class="h">Dashboard</div></div>
        <div class="cards"><div class="c"></div><div class="c"></div><div class="c"></div></div>
        <div class="big"></div>
      </div>
      <div class="rail">
        <div class="nav active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>Dashboard</span></div>
        <div class="nav"><svg viewBox="0 0 24 24"><path d="M4 19V5M10 19v-8M16 19V9M22 19H2"/></svg><span>Analytics</span></div>
        <div class="nav"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 010 8M22 21c0-3-2-5-5-6"/></svg><span>Customers</span></div>
        <div class="nav"><svg viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></svg><span>Reports</span></div>
        <div class="nav"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Settings</span></div>
      </div>
      <svg class="cursor" viewBox="0 0 20 22"><path d="M2 1 L17 12 L10 13 L14 20 L11 21 L7 14 L2 18 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 7 });
  gsap.set('.rail', { x: -260 });
  gsap.set('.nav', { x: -30 });
  const bx = 36 + 22, by = 28 + 22;
  tl.fromTo('.cursor', { x: bx + 300, y: by + 220, opacity: 0 }, { x: bx, y: by, opacity: 1, duration: 0.7, ease: 'move' }, 0)
    .to('.burger', { scale: 0.88, duration: 0.1, ease: 'power2.in' }, 0.75)
    .to('.cursor', { scale: 0.85, transformOrigin: '10% 5%', duration: 0.08 }, 0.75)
    .to('.cursor', { scale: 1, duration: 0.15 }, 0.87)
    .to('.burger', { scale: 1, duration: 0.4, ease: 'back.out(3)' }, 0.87)
    // rail slides in from the edge, content shifts over, items cascade
    .to('.rail', { x: 0, duration: 0.7, ease: 'move' }, 0.85)
    .to('.content', { x: 260, duration: 0.7, ease: 'move' }, 0.85)
    .to('.nav', { opacity: 1, x: 0, duration: 0.5, stagger: 0.06, ease: 'power3.out' }, 1.0)
    .to('.cursor', { x: bx + 260, duration: 0.7, ease: 'move' }, 0.85)
    // wander to an item and hover it
    .to('.cursor', { x: 120, y: 18 + 52 * 2 + 26, duration: 0.7, ease: 'power2.inOut' }, 1.9)
    .to('.nav:nth-child(3)', { backgroundColor: '#eef1f7', duration: 0.25 }, 2.5)
    .to('.nav:nth-child(3)', { scale: 0.97, duration: 0.1 }, 3.0)
    .to('.nav:nth-child(3)', { scale: 1, backgroundColor: '#2d5bff', color: '#fff', duration: 0.4, ease: 'back.out(2)' }, 3.12)
    .to('.nav.active', { backgroundColor: '#ffffff', color: '#3a3f4b', duration: 0.3 }, 3.1)
    .to('.h', { opacity: 0, y: -8, duration: 0.2 }, 3.1).set('.h', { textContent: 'Customers' }, 3.3).to('.h', { opacity: 1, y: 0, duration: 0.3 }, 3.3)
    .to('.cursor', { scale: 0.85, duration: 0.08 }, 3.0).to('.cursor', { scale: 1, duration: 0.15 }, 3.12)
    // back to the burger; close: rail leaves to the edge
    .to('.cursor', { x: bx + 260, y: by, duration: 0.7, ease: 'power2.inOut' }, 4.2)
    .to('.burger', { scale: 0.88, duration: 0.1, ease: 'power2.in' }, 5.0)
    .to('.cursor', { scale: 0.85, duration: 0.08 }, 5.0).to('.cursor', { scale: 1, duration: 0.15 }, 5.12)
    .to('.burger', { scale: 1, duration: 0.4, ease: 'back.out(3)' }, 5.12)
    .to('.nav', { opacity: 0, x: -30, duration: 0.3, stagger: { each: 0.04, from: 'end' }, ease: 'power2.in' }, 5.05)
    .to('.rail', { x: -260, duration: 0.6, ease: 'expo.inOut' }, 5.2)
    .to('.content', { x: 0, duration: 0.6, ease: 'expo.inOut' }, 5.2)
    .to('.cursor', { x: bx, duration: 0.6, ease: 'expo.inOut' }, 5.2)
    .to('.cursor', { x: bx + 300, y: by + 220, opacity: 0, duration: 0.6, ease: 'power3.in' }, 6.0)
    // reset the active state for the loop
    .to('.nav:nth-child(3)', { backgroundColor: 'rgba(255,255,255,0)', color: '#3a3f4b', duration: 0.2 }, 6.4)
    .to('.nav.active', { backgroundColor: '#2d5bff', color: '#fff', duration: 0.2 }, 6.4)
    .to('.h', { opacity: 0, duration: 0.15 }, 6.5).set('.h', { textContent: 'Dashboard' }, 6.65).to('.h', { opacity: 1, duration: 0.2 }, 6.65);
</script>
