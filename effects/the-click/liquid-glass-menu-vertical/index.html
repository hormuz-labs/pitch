<!doctype html><meta charset="utf-8">
<title>Liquid Glass Menu: Vertical</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b1a2a;display:flex;align-items:center;justify-content:center}
  .bg{position:absolute;inset:-8%;background:url("../../../assets/backgrounds/ocean.png") center/cover;filter:saturate(1.2);will-change:transform}
  .orb{position:absolute;border-radius:50%;filter:blur(36px);opacity:.75;will-change:transform}
  .o1{width:460px;height:460px;background:#38d0ff;left:160px;top:-80px}.o2{width:380px;height:380px;background:#ff7ad1;right:200px;bottom:-120px}
  .menu{position:relative;width:300px;border-radius:38px;background:rgba(255,255,255,.14);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);border:1px solid rgba(255,255,255,.4);box-shadow:0 30px 80px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.65);overflow:hidden;height:76px;will-change:height,transform;transform-origin:50% 0}
  .menu:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 20% 0%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%);pointer-events:none}
  .head{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:26px;font-weight:500;color:#fff}
  .head svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;will-change:transform}
  .list{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
  .it{height:60px;border-radius:20px;display:flex;align-items:center;gap:14px;padding:0 18px;font-size:23px;font-weight:500;color:#fff;opacity:0;will-change:transform,opacity;position:relative}
  .it svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .hl{position:absolute;left:12px;top:0;width:276px;height:60px;border-radius:20px;background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 2px 6px rgba(255,255,255,.7);opacity:0;will-change:transform}
  .cursor{position:absolute;width:40px;height:44px;left:0;top:0;will-change:transform;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));opacity:0;z-index:5}
</style>
<div class="stage">
  <div class="bg"></div><div class="orb o1"></div><div class="orb o2"></div>
  <div class="menu">
    <div class="head"><span>Menu</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
    <div class="hl"></div>
    <div class="list">
      <div class="it"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10H3z"/></svg>Home</div>
      <div class="it"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18"/></svg>Calendar</div>
      <div class="it"><svg viewBox="0 0 24 24"><path d="M21 8l-9 6-9-6V6l9 6 9-6z"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>Messages</div>
      <div class="it"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>Settings</div>
    </div>
    <svg class="cursor" viewBox="0 0 20 22"><path d="M2 1 L17 12 L10 13 L14 20 L11 21 L7 14 L2 18 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 6 });
  const OPEN = 76 + 4 * 60 + 3 * 6 + 12;
  gsap.set('.it', { y: -18, scale: 0.94, transformOrigin: '50% 0' });
  tl.to('.orb.o1', { x: 120, y: 80, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
    .to('.orb.o2', { x: -140, y: -60, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
    .fromTo('.bg', { scale: 1.0 }, { scale: 1.05, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
    .fromTo('.cursor', { x: 60, y: 200, opacity: 0 }, { x: 250, y: 38, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0)
    // press the header: the glass stretches down like a drop, items settle in
    .to('.menu', { scale: 0.97, duration: 0.1, ease: 'power2.in' }, 0.7)
    .to('.cursor', { scale: 0.85, transformOrigin: '10% 5%', duration: 0.08 }, 0.7)
    .to('.cursor', { scale: 1, duration: 0.15 }, 0.82)
    .to('.menu', { height: OPEN + 26, scale: 1, duration: 0.55, ease: 'expo.out' }, 0.82)
    .to('.menu', { height: OPEN, duration: 0.6, ease: 'elastic.out(1,0.5)' }, 1.3)
    .to('.head svg', { rotation: 180, duration: 0.5, ease: 'back.out(2)' }, 0.82)
    .to('.it', { opacity: 1, y: 0, scale: 1, duration: 0.5, stagger: 0.07, ease: 'back.out(1.8)' }, 0.95)
    // hover down the list; a liquid highlight follows
    .to('.hl', { opacity: 1, y: 76, duration: 0.3 }, 1.7)
    .to('.cursor', { x: 160, y: 108, duration: 0.5, ease: 'power2.inOut' }, 1.5)
    .to('.hl', { y: 76 + 66, duration: 0.45, ease: 'expo.out' }, 2.3)
    .fromTo('.hl', { scaleY: 1 }, { scaleY: 1.3, duration: 0.15 }, 2.3).to('.hl', { scaleY: 1, duration: 0.5, ease: 'elastic.out(1,0.4)' }, 2.45)
    .to('.cursor', { y: 174, duration: 0.45, ease: 'power2.inOut' }, 2.3)
    .to('.hl', { y: 76 + 132, duration: 0.45, ease: 'expo.out' }, 3.0)
    .fromTo('.hl', { scaleY: 1 }, { scaleY: 1.3, duration: 0.15 }, 3.0).to('.hl', { scaleY: 1, duration: 0.5, ease: 'elastic.out(1,0.4)' }, 3.15)
    .to('.cursor', { y: 240, duration: 0.45, ease: 'power2.inOut' }, 3.0)
    // close: back to the header, press, the glass sucks back up
    .to('.hl', { opacity: 0, duration: 0.25 }, 3.9)
    .to('.cursor', { x: 250, y: 38, duration: 0.5, ease: 'power2.inOut' }, 3.9)
    .to('.menu', { scale: 0.97, duration: 0.1, ease: 'power2.in' }, 4.5)
    .to('.cursor', { scale: 0.85, duration: 0.08 }, 4.5)
    .to('.cursor', { scale: 1, duration: 0.15 }, 4.62)
    .to('.it', { opacity: 0, y: -18, scale: 0.94, duration: 0.3, stagger: { each: 0.05, from: 'end' }, ease: 'power3.in' }, 4.55)
    .to('.menu', { height: 76, scale: 1, duration: 0.6, ease: 'expo.inOut' }, 4.7)
    .fromTo('.menu', { scaleY: 1 }, { scaleY: 0.94, duration: 0.12 }, 5.25).to('.menu', { scaleY: 1, duration: 0.5, ease: 'elastic.out(1,0.4)' }, 5.37)
    .to('.head svg', { rotation: 0, duration: 0.5, ease: 'back.out(2)' }, 4.7)
    .to('.cursor', { x: 60, y: 200, opacity: 0, duration: 0.5, ease: 'power3.in' }, 5.3);
</script>
