<!doctype html><meta charset="utf-8">
<title>Floating Action Menu</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#e9ecf1;display:flex;align-items:center;justify-content:center}
  .phone{width:340px;height:680px;border-radius:48px;background:#111;padding:12px;box-shadow:0 40px 100px rgba(0,0,0,.3);position:relative}
  .screen{position:absolute;inset:12px;border-radius:38px;background:#f6f7fb;overflow:hidden}
  .notch{position:absolute;left:50%;top:14px;width:100px;height:28px;margin-left:-50px;border-radius:14px;background:#111;z-index:5}
  .hdr{padding:60px 24px 0;font-size:26px;font-weight:500;color:#111}
  .list{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
  .item{height:70px;border-radius:18px;background:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .item i{width:40px;height:40px;border-radius:12px;background:#dfe5ff}
  .item b{display:block;height:12px;width:120px;border-radius:6px;background:#dcdfe6}
  .item s{display:block;height:9px;width:80px;border-radius:5px;background:#eceef3;margin-top:8px}
  .scrim{position:absolute;inset:0;background:rgba(20,24,40,.35);backdrop-filter:blur(6px);opacity:0}
  .fab{position:absolute;right:22px;bottom:30px;width:68px;height:68px;border-radius:24px;background:#2d5bff;box-shadow:0 14px 34px rgba(45,91,255,.45);display:flex;align-items:center;justify-content:center;will-change:transform;z-index:4}
  .fab svg{width:30px;height:30px;will-change:transform}
  .menu{position:absolute;right:22px;bottom:118px;display:flex;flex-direction:column;align-items:flex-end;gap:14px;z-index:3}
  .opt{display:flex;align-items:center;gap:12px;will-change:transform,opacity;opacity:0}
  .opt .lbl{background:#fff;padding:10px 16px;border-radius:12px;font-size:16px;font-weight:500;color:#111;box-shadow:0 6px 20px rgba(0,0,0,.15)}
  .opt .ic{width:52px;height:52px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.15)}
  .opt .ic svg{width:24px;height:24px;stroke:#2d5bff}
  .cursor{position:absolute;width:40px;height:44px;left:0;top:0;will-change:transform;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));opacity:0;z-index:9}
</style>
<div class="stage">
  <div class="phone"><div class="notch"></div>
    <div class="screen">
      <div class="hdr">Projects</div>
      <div class="list">
        <div class="item"><i></i><div><b></b><s></s></div></div>
        <div class="item"><i style="background:#ffe4d6"></i><div><b style="width:90px"></b><s></s></div></div>
        <div class="item"><i style="background:#d9f5e6"></i><div><b style="width:140px"></b><s></s></div></div>
        <div class="item"><i style="background:#f1e0ff"></i><div><b style="width:100px"></b><s></s></div></div>
        <div class="item"><i></i><div><b></b><s></s></div></div>
      </div>
      <div class="scrim"></div>
      <div class="menu">
        <div class="opt"><span class="lbl">New document</span><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6zM14 3v5h5M9 13h6M9 17h6"/></svg></span></div>
        <div class="opt"><span class="lbl">Upload file</span><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg></span></div>
        <div class="opt"><span class="lbl">New folder</span><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h6l2 2h10v11H3zM12 11v6M9 14h6"/></svg></span></div>
      </div>
      <div class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
      <svg class="cursor" viewBox="0 0 20 22"><path d="M2 1 L17 12 L10 13 L14 20 L11 21 L7 14 L2 18 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  const fx0 = 316 - 22 - 34, fy0 = 656 - 30 - 34; // fab center in screen coords
  gsap.set('.opt', { y: 30, scale: 0.6, transformOrigin: '100% 50%' });
  tl.fromTo('.cursor', { x: fx0 - 120, y: fy0 - 200, opacity: 0 }, { x: fx0, y: fy0, opacity: 1, duration: 0.6, ease: 'move' }, 0)
    .to('.fab', { scale: 0.88, duration: 0.1, ease: 'power2.in' }, 0.6)
    .to('.fab', { scale: 1.08, duration: 0.55, ease: 'elastic.out(1,0.5)', borderRadius: '34px' }, 0.72)
    .to('.fab svg', { rotation: 135, duration: 0.5, ease: 'back.out(2)' }, 0.68)
    .to('.scrim', { opacity: 1, duration: 0.4 }, 0.7)
    .to('.opt', { opacity: 1, y: 0, scale: 1, duration: 0.55, stagger: { each: 0.08, from: 'end' }, ease: 'back.out(2.2)' }, 0.78)
    .to('.fab', { scale: 1, duration: 0.3 }, 1.4)
    // hover the middle option briefly
    .to('.cursor', { x: fx0 - 8, y: fy0 - 152, duration: 0.5, ease: 'power2.inOut' }, 1.6)
    .to('.opt:nth-child(2)', { x: -6, duration: 0.25 }, 2.0)
    .to('.opt:nth-child(2)', { x: 0, duration: 0.25 }, 2.5)
    // back to fab and close
    .to('.cursor', { x: fx0, y: fy0, duration: 0.45, ease: 'power2.inOut' }, 2.5)
    .to('.fab', { scale: 0.88, duration: 0.1, ease: 'power2.in' }, 3.0)
    .to('.fab', { scale: 1, borderRadius: '24px', duration: 0.5, ease: 'elastic.out(1,0.5)' }, 3.12)
    .to('.fab svg', { rotation: 0, duration: 0.45, ease: 'back.out(2)' }, 3.05)
    .to('.opt', { opacity: 0, y: 30, scale: 0.6, duration: 0.3, stagger: 0.05, ease: 'power3.in' }, 3.0)
    .to('.scrim', { opacity: 0, duration: 0.35 }, 3.15)
    .to('.cursor', { x: fx0 - 120, y: fy0 - 200, opacity: 0, duration: 0.5, ease: 'power3.in' }, 3.4);
</script>
