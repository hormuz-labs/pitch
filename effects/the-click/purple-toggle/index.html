<!doctype html><meta charset="utf-8">
<title>Purple Toggle</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f5f1ff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:40px}
  .glowbg{position:absolute;width:700px;height:700px;left:50%;top:50%;margin:-350px 0 0 -350px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.35),rgba(139,92,246,0) 65%);opacity:0;will-change:opacity,transform}
  .tog{position:relative;width:260px;height:140px;border-radius:70px;background:#e6dcff;box-shadow:inset 0 4px 10px rgba(80,40,160,.12);will-change:transform}
  .fillp{position:absolute;inset:0;border-radius:70px;background:linear-gradient(135deg,#a78bfa,#7c3aed);opacity:0;will-change:opacity}
  .fillp:after{content:"";position:absolute;inset:0;border-radius:70px;background:radial-gradient(80% 70% at 30% 10%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%)}
  .knob{position:absolute;left:10px;top:10px;width:120px;height:120px;border-radius:50%;background:#fff;box-shadow:0 8px 24px rgba(80,40,160,.28);display:flex;align-items:center;justify-content:center;will-change:transform}
  .knob svg{width:56px;height:56px;position:absolute;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .ic-x{stroke:#b9b0d6}.ic-chk{stroke:#7c3aed;opacity:0}
  .lbl{font-size:30px;font-weight:500;color:#3b2a6b;height:40px;position:relative;width:360px;text-align:center;overflow:hidden}
  .lbl span{position:absolute;left:0;right:0;top:0}
  .cursor{position:absolute;width:40px;height:44px;left:50%;top:50%;will-change:transform;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));opacity:0;z-index:9}
</style>
<div class="stage">
  <div class="glowbg"></div>
  <div class="tog"><div class="fillp"></div><div class="knob"><svg class="ic-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg><svg class="ic-chk" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div></div>
  <div class="lbl"><span class="l-off">Dark mode off</span><span class="l-on" style="opacity:0">Dark mode on</span></div>
  <svg class="cursor" viewBox="0 0 20 22"><path d="M2 1 L17 12 L10 13 L14 20 L11 21 L7 14 L2 18 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  const D = 120;
  function flip(on, t) {
    tl.to('.tog', { scale: 0.96, duration: 0.1, ease: 'power2.in' }, t)
      .to('.tog', { scale: 1, duration: 0.5, ease: 'elastic.out(1,0.5)' }, t + 0.12)
      .to('.fillp', { opacity: on ? 1 : 0, duration: 0.5, ease: 'power2.inOut' }, t + 0.05)
      .to('.glowbg', { opacity: on ? 1 : 0, scale: on ? 1.1 : 1, duration: 0.7, ease: 'power2.inOut' }, t + 0.05)
      .fromTo('.knob', { scaleX: 1, scaleY: 1 }, { scaleX: 1.25, scaleY: 0.9, duration: 0.15, ease: 'power2.out' }, t + 0.05)
      .to('.knob', { x: on ? D : 0, duration: 0.5, ease: 'power3.inOut' }, t + 0.08)
      .to('.knob', { scaleX: 1, scaleY: 1, duration: 0.6, ease: 'elastic.out(1,0.4)' }, t + 0.35)
      .to('.knob', { rotation: on ? 180 : 0, duration: 0.55, ease: 'power3.inOut' }, t + 0.08)
      .to('.ic-x', { opacity: on ? 0 : 1, scale: on ? 0.5 : 1, duration: 0.25 }, t + 0.2)
      .to('.ic-chk', { opacity: on ? 1 : 0, scale: on ? 1 : 0.5, duration: 0.35, ease: 'back.out(2)' }, t + 0.3)
      .to(on ? '.l-off' : '.l-on', { yPercent: -110, opacity: 0, duration: 0.3, ease: 'power3.in' }, t + 0.1)
      .fromTo(on ? '.l-on' : '.l-off', { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.4, ease: 'power3.out', immediateRender: false }, t + 0.3)
      .to('.cursor', { scale: 0.85, transformOrigin: '10% 5%', duration: 0.08 }, t)
      .to('.cursor', { scale: 1, duration: 0.15 }, t + 0.12);
  }
  gsap.set('.ic-chk', { scale: 0.5, transformOrigin: '50% 50%' });
  // cursor coords relative to stage center: knob is at (-60,-30) offset roughly
  tl.fromTo('.cursor', { x: -300, y: 180, opacity: 0 }, { x: -60, y: -32, opacity: 1, duration: 0.7, ease: 'power3.out' }, 0);
  flip(true, 0.9);
  tl.to('.cursor', { x: 60, duration: 0.5, ease: 'power2.inOut' }, 1.0);
  flip(false, 2.5);
  tl.to('.cursor', { x: -60, duration: 0.5, ease: 'power2.inOut' }, 2.6);
  tl.to('.cursor', { x: -300, y: 180, opacity: 0, duration: 0.6, ease: 'power3.in' }, 3.3);
</script>
