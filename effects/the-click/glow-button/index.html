<!doctype html><meta charset="utf-8">
<title>Glow Button</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#07070b;display:flex;align-items:center;justify-content:center}
  .vig{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.04),rgba(0,0,0,0) 55%)}
  .wrap{position:relative;will-change:transform}
  .halo{position:absolute;left:50%;top:50%;width:700px;height:420px;margin:-210px 0 0 -350px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(124,92,255,.85),rgba(56,189,248,.35) 45%,rgba(0,0,0,0) 70%);filter:blur(30px);will-change:transform,opacity}
  .auraWrap{position:absolute;inset:-8px;border-radius:999px;overflow:hidden;filter:blur(12px);will-change:transform,opacity}
  .aura{position:absolute;left:50%;top:50%;width:700px;height:700px;margin:-350px 0 0 -350px;background:conic-gradient(from 0deg,#7c5cff,#38bdf8,#ff5da2,#7c5cff);will-change:transform}
  .btn{position:relative;padding:0 64px;height:112px;border-radius:999px;background:linear-gradient(180deg,#1b1b25,#121218);border:1.5px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 20px 50px rgba(0,0,0,.6)}
  .btn span{font-size:42px;font-weight:500;color:#fff;letter-spacing:-.01em}
  .btn .dot{width:14px;height:14px;border-radius:50%;background:#7c5cff;box-shadow:0 0 18px #7c5cff;will-change:transform}
  .ring{position:absolute;inset:-2px;border-radius:999px;border:2px solid rgba(255,255,255,.7);opacity:0;will-change:transform}
  .cursor{position:absolute;width:40px;height:44px;left:50%;top:50%;will-change:transform;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6));opacity:0}
</style>
<div class="stage">
  <div class="vig"></div>
  <div class="wrap">
    <div class="halo"></div>
    <div class="auraWrap"><div class="aura"></div></div>
    <div class="btn"><i class="dot"></i><span>Start free trial</span></div>
    <div class="ring"></div>
  </div>
  <svg class="cursor" viewBox="0 0 20 22"><path d="M2 1 L17 12 L10 13 L14 20 L11 21 L7 14 L2 18 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 8 });
  // the ambient pulse: 4 breaths over the loop
  tl.fromTo('.halo', { scale: 0.9, opacity: 0.55 }, { scale: 1.15, opacity: 1, duration: 1, ease: 'sine.inOut', yoyo: true, repeat: 7 }, 0)
    .fromTo('.auraWrap', { opacity: 0.5, scale: 1 }, { opacity: 1, scale: 1.04, duration: 1, ease: 'sine.inOut', yoyo: true, repeat: 7 }, 0)
    .to('.aura', { rotation: 360, duration: 8, ease: 'none' }, 0)
    .fromTo('.dot', { scale: 0.8 }, { scale: 1.3, duration: 1, ease: 'sine.inOut', yoyo: true, repeat: 7 }, 0)
    .to('.wrap', { y: -8, duration: 4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
    // a visit: hover swells the glow, press sends a ring out
    .fromTo('.cursor', { x: 320, y: 220, opacity: 0 }, { x: 130, y: 30, opacity: 1, duration: 0.9, ease: 'power3.out' }, 2.4)
    .to('.wrap', { scale: 1.05, duration: 0.4, ease: 'power2.out' }, 3.1)
    .to('.halo', { opacity: 1.6, scale: 1.4, duration: 0.6, ease: 'power2.out' }, 3.1)
    .to('.wrap', { scale: 0.96, duration: 0.12, ease: 'power2.in' }, 3.8)
    .to('.cursor', { scale: 0.85, transformOrigin: '10% 5%', duration: 0.1 }, 3.8)
    .to('.wrap', { scale: 1.05, duration: 0.6, ease: 'elastic.out(1,0.45)' }, 3.94)
    .to('.cursor', { scale: 1, duration: 0.15 }, 3.94)
    .fromTo('.ring', { scale: 1, opacity: 0.9 }, { scale: 1.5, opacity: 0, duration: 0.8, ease: 'power2.out' }, 3.94)
    .fromTo('.ring', { scale: 1, opacity: 0.6 }, { scale: 1.8, opacity: 0, duration: 1, ease: 'power2.out' }, 4.1)
    .to('.wrap', { scale: 1, duration: 0.6, ease: 'power2.inOut' }, 5.0)
    .to('.cursor', { x: 320, y: 220, opacity: 0, duration: 0.8, ease: 'power3.in' }, 5.0);
</script>
