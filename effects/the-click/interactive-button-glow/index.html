<!doctype html><meta charset="utf-8">
<title>Interactive Button: Glow</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f4f4f7;display:flex;align-items:center;justify-content:center}
  .wrap{position:relative;will-change:transform}
  .glow{position:absolute;inset:-28px;border-radius:999px;background:#ff6a3d;filter:blur(34px);opacity:.35;will-change:transform,opacity}
  .glow2{position:absolute;inset:-10px;border-radius:999px;background:#ffb03d;filter:blur(18px);opacity:.3;will-change:transform,opacity}
  .btn{position:relative;padding:0 60px;height:108px;border-radius:999px;background:linear-gradient(180deg,#ff7a4a,#ff5a2a);display:flex;align-items:center;gap:18px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 12px 30px rgba(255,90,42,.35)}
  .btn span{font-size:40px;font-weight:500;color:#fff;letter-spacing:-.01em}
  .btn svg{width:36px;height:36px;will-change:transform}
  .ripple{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(255,255,255,.5);opacity:0;will-change:transform}
  .hint{position:absolute;bottom:170px;left:50%;transform:translateX(-50%);font-size:22px;color:#9a9ca6;letter-spacing:.02em}
  .cursor{position:absolute;width:40px;height:44px;left:50%;top:50%;will-change:transform;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));opacity:0}
</style>
<div class="stage">
  <div class="wrap">
    <div class="glow"></div><div class="glow2"></div>
    <div class="btn" style="overflow:hidden"><div class="ripple"></div><span>Claim offer</span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></div>
  </div>
  <div class="hint">Hover, then press</div>
  <svg class="cursor" viewBox="0 0 20 22"><path d="M2 1 L17 12 L10 13 L14 20 L11 21 L7 14 L2 18 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 6 });
  // idle: a soft pulse, ~1.5s per breath
  tl.fromTo('.glow', { scale: 0.92, opacity: 0.25 }, { scale: 1.08, opacity: 0.55, duration: 0.75, ease: 'sine.inOut', yoyo: true, repeat: 7 }, 0)
    .fromTo('.glow2', { scale: 1, opacity: 0.2 }, { scale: 1.1, opacity: 0.5, duration: 0.75, ease: 'sine.inOut', yoyo: true, repeat: 7 }, 0.2)
    // cursor arrives: hover — glow blooms and the arrow nudges
    .fromTo('.cursor', { x: 260, y: 200, opacity: 0 }, { x: 110, y: 26, opacity: 1, duration: 0.8, ease: 'power3.out' }, 1.0)
    .to('.wrap', { scale: 1.06, y: -4, duration: 0.4, ease: 'power2.out' }, 1.7)
    .to('.glow', { opacity: 0.95, scale: 1.35, duration: 0.5, ease: 'power2.out', overwrite: 'auto' }, 1.7)
    .to('.glow2', { opacity: 0.8, scale: 1.25, duration: 0.5, ease: 'power2.out', overwrite: 'auto' }, 1.7)
    .to('.btn svg', { x: 8, duration: 0.4, ease: 'back.out(3)' }, 1.7)
    // press → ripple + squash
    .to('.wrap', { scale: 0.95, y: 0, duration: 0.12, ease: 'power2.in' }, 2.5)
    .to('.cursor', { scale: 0.85, transformOrigin: '10% 5%', duration: 0.1 }, 2.5)
    .fromTo('.ripple', { scale: 0.2, opacity: 0.8 }, { scale: 14, opacity: 0, duration: 0.9, ease: 'power2.out' }, 2.55)
    .to('.wrap', { scale: 1.08, y: -4, duration: 0.6, ease: 'elastic.out(1,0.45)' }, 2.64)
    .to('.cursor', { scale: 1, duration: 0.15 }, 2.64)
    .to('.glow', { opacity: 1, scale: 1.6, duration: 0.35, ease: 'power2.out' }, 2.62)
    .to('.glow', { opacity: 0.6, scale: 1.3, duration: 0.7, ease: 'power2.inOut' }, 3.0)
    // leave: glow settles back to idle amplitude
    .to('.cursor', { x: 260, y: 200, opacity: 0, duration: 0.8, ease: 'power3.in' }, 3.8)
    .to('.wrap', { scale: 1, y: 0, duration: 0.5, ease: 'power2.inOut' }, 3.9)
    .to('.btn svg', { x: 0, duration: 0.4, ease: 'power2.inOut' }, 3.9)
    .to('.glow', { opacity: 0.35, scale: 1, duration: 0.8, ease: 'sine.inOut' }, 4.0)
    .to('.glow2', { opacity: 0.3, scale: 1, duration: 0.8, ease: 'sine.inOut' }, 4.0)
    .fromTo('.glow', { scale: 1, opacity: 0.35 }, { scale: 1.08, opacity: 0.55, duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 4.8)
    .fromTo('.glow2', { scale: 1, opacity: 0.3 }, { scale: 1.1, opacity: 0.5, duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 4.8);
</script>
