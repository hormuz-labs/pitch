<!doctype html><meta charset="utf-8">
<title>Animated Emoji Button</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101014;display:flex;align-items:center;justify-content:center}
  .glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(255,93,143,.22),rgba(255,93,143,0) 60%);left:50%;top:50%;transform:translate(-50%,-50%)}
  .btn{position:relative;display:flex;align-items:center;gap:22px;padding:28px 52px 28px 38px;border-radius:999px;background:#1c1c24;border:1.5px solid rgba(255,255,255,.08);box-shadow:0 20px 60px rgba(0,0,0,.5);will-change:transform;transform-origin:center}
  .emoji{font-size:80px;line-height:1;display:block;transform-origin:50% 60%;will-change:transform}
  .label{font-size:44px;font-weight:500;color:#fff;letter-spacing:-.01em}
  .count{display:inline-block;font-size:44px;font-weight:500;color:#ff5d8f;min-width:80px;text-align:right;position:relative;height:50px;overflow:hidden;line-height:50px}
  .count span{position:absolute;right:0;top:0}
  .burst{position:absolute;left:66px;top:50%;width:0;height:0;pointer-events:none}
  .p{position:absolute;font-size:30px;line-height:1;left:-15px;top:-15px;opacity:0;will-change:transform}
  .ring{position:absolute;inset:-6px;border-radius:999px;border:3px solid #ff5d8f;opacity:0;will-change:transform}
  .cursor{position:absolute;width:40px;height:44px;left:50%;top:50%;will-change:transform;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
</style>
<div class="stage">
  <div class="glow"></div>
  <div class="btn">
    <div class="ring"></div>
    <span class="emoji">😍</span>
    <span class="label">Love it</span>
    <span class="count"><span class="c1">128</span><span class="c2" style="opacity:0">129</span></span>
    <div class="burst"></div>
  </div>
  <svg class="cursor" viewBox="0 0 20 22"><path d="M2 1 L17 12 L10 13 L14 20 L11 21 L7 14 L2 18 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const rng = fx.rng(7);
  const burst = document.querySelector('.burst');
  const glyphs = ['❤️','💖','✨','😍','💗','⭐'];
  const parts = [];
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('span'); p.className = 'p';
    p.textContent = glyphs[i % glyphs.length]; burst.appendChild(p); parts.push(p);
  }
  const tl = fx.timeline({ duration: 4 });
  // cursor travels in and hovers
  tl.fromTo('.cursor', { x: 300, y: 260, opacity: 0 }, { x: 40, y: 20, opacity: 1, duration: 0.9, ease: 'power3.out' }, 0)
    .to('.btn', { scale: 1.04, y: -4, duration: 0.35, ease: 'power2.out' }, 0.6)
    // press
    .to('.cursor', { scale: 0.86, duration: 0.1, ease: 'power2.in', transformOrigin: '10% 5%' }, 1.1)
    .to('.btn', { scale: 0.94, y: 0, duration: 0.12, ease: 'power2.in' }, 1.1)
    .to('.emoji', { scale: 0.7, rotation: -12, duration: 0.12, ease: 'power2.in' }, 1.1)
    // release: pop
    .to('.cursor', { scale: 1, duration: 0.2 }, 1.24)
    .to('.btn', { scale: 1.06, duration: 0.5, ease: 'elastic.out(1,0.4)' }, 1.24)
    .to('.emoji', { scale: 1.55, rotation: 14, duration: 0.55, ease: 'elastic.out(1.2,0.35)' }, 1.24)
    .to('.emoji', { scale: 1, rotation: 0, duration: 0.5, ease: 'back.out(2)' }, 1.9)
    .fromTo('.ring', { scale: 0.9, opacity: 0.9 }, { scale: 1.35, opacity: 0, duration: 0.6, ease: 'power2.out' }, 1.24)
    // counter rolls
    .to('.c1', { yPercent: -110, opacity: 0, duration: 0.35, ease: 'power3.inOut' }, 1.3)
    .fromTo('.c2', { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.35, ease: 'power3.inOut' }, 1.3)
    .to('.glow', { scale: 1.25, opacity: 1.5, duration: 0.4, ease: 'power2.out' }, 1.24)
    .to('.glow', { scale: 1, opacity: 1, duration: 1, ease: 'power2.inOut' }, 1.7);
  // particle burst
  parts.forEach((p, i) => {
    const a = -Math.PI / 2 + (rng() - 0.5) * 2.4;
    const d = 120 + rng() * 160;
    tl.fromTo(p, { x: 0, y: 0, scale: 0.3, opacity: 1, rotation: 0 },
      { x: Math.cos(a) * d, y: Math.sin(a) * d - 40, scale: 0.9 + rng() * 0.6, rotation: (rng() - 0.5) * 120, opacity: 0, duration: 0.9 + rng() * 0.4, ease: 'power3.out' }, 1.26 + rng() * 0.08);
  });
  // cursor leaves, button relaxes; state resets for the loop
  tl.to('.cursor', { x: 320, y: 280, opacity: 0, duration: 0.8, ease: 'power3.in' }, 2.6)
    .to('.btn', { scale: 1, y: 0, duration: 0.5, ease: 'power2.inOut' }, 2.7)
    .to('.c2', { yPercent: -110, opacity: 0, duration: 0.3, ease: 'power3.in' }, 3.6)
    .to('.c1', { yPercent: 0, opacity: 1, duration: 0.3, ease: 'power3.out' }, 3.7);
</script>
