<!doctype html><meta charset="utf-8">
<title>Multiple Bar Chart</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f4f5f7;display:flex;align-items:center;justify-content:center}
  .card{width:980px;height:560px;background:#fff;border-radius:24px;box-shadow:0 30px 80px rgba(20,24,40,.12);padding:40px 48px;position:relative}
  .title{font-size:24px;font-weight:500;color:#111827;letter-spacing:-.01em}
  .sub{font-size:14px;color:#6b7280;margin-top:6px}
  .legend{position:absolute;right:48px;top:44px;display:flex;gap:20px;font-size:13px;color:#4b5563}
  .legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--c);margin-right:8px;vertical-align:-1px}
  .plot{position:absolute;left:48px;right:48px;top:140px;bottom:64px}
  .gl{position:absolute;left:36px;right:0;height:1px;background:#e5e7eb}
  .gl span{position:absolute;right:100%;margin-right:10px;top:-8px;font-size:12px;color:#9ca3af}
  .groups{position:absolute;left:36px;right:0;top:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end}
  .g{display:flex;gap:6px;align-items:flex-end;height:100%;position:relative}
  .b{width:26px;border-radius:6px 6px 2px 2px;background:var(--c);transform-origin:50% 100%}
  .g .l{position:absolute;top:100%;left:0;right:0;text-align:center;margin-top:12px;font-size:13px;color:#6b7280}
  .base{position:absolute;left:36px;right:0;bottom:0;height:2px;background:#d1d5db;transform-origin:0 50%}
</style>
<div class="stage">
  <div class="card">
    <div class="title">Regional sales</div><div class="sub">Units sold by quarter · three regions</div>
    <div class="legend"><span style="--c:#111827">North</span><span style="--c:#3b82f6">West</span><span style="--c:#a5b4fc">South</span></div>
    <div class="plot">
      <div class="gl" style="top:0"><span>400</span></div><div class="gl" style="top:33.3%"><span>300</span></div><div class="gl" style="top:66.6%"><span>200</span></div>
      <div class="base"></div>
      <div class="groups" id="groups"></div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const data=[['Q1',[62,45,30]],['Q2',[70,58,38]],['Q3',[66,74,44]],['Q4',[82,80,56]],['Q1',[78,88,61]],['Q2',[92,96,70]]];
  const C=['#111827','#3b82f6','#a5b4fc'];
  const gs=document.getElementById('groups');
  data.forEach(([l,v])=>{const g=document.createElement('div');g.className='g';g.innerHTML=v.map((h,i)=>`<div class="b s${i}" style="--c:${C[i]};height:${h}%"></div>`).join('')+`<div class="l">${l}</div>`;gs.appendChild(g)});
  const tl=fx.timeline({duration:4});
  tl.from('.card',{y:30,opacity:0,duration:.6,ease:'power3.out'},0)
    .from('.title,.sub,.legend span',{y:12,opacity:0,duration:.5,stagger:.07,ease:'power3.out'},.1)
    .from('.gl,.base',{scaleX:0,transformOrigin:'0 50%',duration:.7,ease:'expo.out',stagger:.05},.2)
    .from('.g .l',{opacity:0,y:6,duration:.4,stagger:.06},.4)
    // every series builds at once; groups stagger left→right, series offset within each group
    .from('.b.s0',{scaleY:0,duration:1,ease:'expo.out',stagger:.08},.5)
    .from('.b.s1',{scaleY:0,duration:1,ease:'expo.out',stagger:.08},.58)
    .from('.b.s2',{scaleY:0,duration:1,ease:'expo.out',stagger:.08},.66)
    // hold: a highlight wave through the groups
    .to('.g',{y:-8,duration:.35,yoyo:true,repeat:1,ease:'sine.inOut',stagger:.08},2.1)
    .to('.b',{scaleY:0,duration:.45,ease:'expo.in',stagger:{each:.02,from:'end'}},3.15)
    .to('.g .l',{opacity:0,duration:.3},3.3)
    .to('.card',{opacity:0,y:-16,duration:.3,ease:'power2.in'},3.7);
</script>
