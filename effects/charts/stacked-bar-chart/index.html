<!doctype html><meta charset="utf-8">
<title>Stacked Bar Chart</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f7f7f4;display:flex;align-items:center;justify-content:center}
  .card{width:980px;height:560px;background:#fff;border-radius:24px;box-shadow:0 30px 80px rgba(20,24,40,.1);padding:40px 48px;position:relative}
  .title{font-size:24px;font-weight:500;color:#111;letter-spacing:-.01em}
  .sub{font-size:14px;color:#777;margin-top:6px}
  .legend{position:absolute;right:48px;top:44px;display:flex;gap:18px;font-size:13px;color:#444}
  .legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);margin-right:8px;vertical-align:-1px}
  .plot{position:absolute;left:48px;right:48px;top:140px;bottom:64px}
  .gl{position:absolute;left:36px;right:0;height:1px;background:#ececea}
  .gl span{position:absolute;right:100%;margin-right:10px;top:-8px;font-size:12px;color:#aaa}
  .bars{position:absolute;left:36px;right:0;top:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end}
  .bar{width:56px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
  .seg{width:100%;background:var(--c);transform-origin:50% 100%}
  .seg:first-child{border-radius:8px 8px 0 0}
  .tot{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:13px;font-weight:500;color:#111;margin-bottom:8px;font-variant-numeric:tabular-nums}
  .bar .l{position:absolute;top:100%;left:0;right:0;text-align:center;margin-top:12px;font-size:13px;color:#777}
  .base{position:absolute;left:36px;right:0;bottom:0;height:2px;background:#ddd;transform-origin:0 50%}
</style>
<div class="stage">
  <div class="card">
    <div class="title">Revenue mix</div><div class="sub">Subscriptions, services and hardware · $k</div>
    <div class="legend"><span style="--c:#f97316">Hardware</span><span style="--c:#fb923c">Services</span><span style="--c:#1f2937">Subscriptions</span></div>
    <div class="plot">
      <div class="gl" style="top:0"><span>200</span></div><div class="gl" style="top:25%"><span>150</span></div><div class="gl" style="top:50%"><span>100</span></div><div class="gl" style="top:75%"><span>50</span></div>
      <div class="base"></div><div class="bars" id="bars"></div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const data=[['Jan',[40,18,12]],['Feb',[46,20,14]],['Mar',[52,22,13]],['Apr',[58,26,18]],['May',[63,28,20]],['Jun',[70,30,22]],['Jul',[78,34,24]],['Aug',[86,36,28]]];
  const C=['#1f2937','#fb923c','#f97316'];
  const bars=document.getElementById('bars');
  data.forEach(([l,v])=>{const b=document.createElement('div');b.className='bar';const sum=v.reduce((a,c)=>a+c,0);
    b.innerHTML=`<div class="tot" data-t="${sum}">0</div>`+[2,1,0].map(i=>`<div class="seg s${i}" style="--c:${C[i]};height:${v[i]/2}%"></div>`).join('')+`<div class="l">${l}</div>`;bars.appendChild(b)});
  const tl=fx.timeline({duration:4});
  tl.from('.card',{y:30,opacity:0,duration:.6,ease:'power3.out'},0)
    .from('.title,.sub,.legend span',{y:12,opacity:0,duration:.5,stagger:.07,ease:'power3.out'},.1)
    .from('.gl,.base',{scaleX:0,transformOrigin:'0 50%',duration:.7,ease:'expo.out',stagger:.05},.2)
    .from('.bar .l',{opacity:0,y:6,duration:.4,stagger:.06},.4);
  // each bar: the whole stack grows together from the baseline, segments building on top of each other
  document.querySelectorAll('.bar').forEach((b,i)=>{const t=.5+i*.09;const s0=b.querySelector('.s0'),s1=b.querySelector('.s1'),s2=b.querySelector('.s2');
    tl.from(s0,{scaleY:0,duration:.8,ease:'expo.out'},t)
      .from(s1,{scaleY:0,y:()=>s0.offsetHeight,duration:.8,ease:'expo.out'},t+.12)
      .from(s2,{scaleY:0,y:()=>s0.offsetHeight+s1.offsetHeight,duration:.8,ease:'expo.out'},t+.24)
      .from(b.querySelector('.tot'),{opacity:0,y:10,duration:.4},t+.6);
    const o={n:0};tl.to(o,{n:+b.querySelector('.tot').dataset.t,duration:1,ease:'expo.out',onUpdate(){b.querySelector('.tot').textContent=Math.round(o.n)}},t+.24)});
  tl.to('.s1',{opacity:.7,duration:.4,yoyo:true,repeat:1,ease:'sine.inOut',stagger:.05},2.3)
    .to('.seg',{scaleY:0,duration:.45,ease:'expo.in',stagger:{each:.015,from:'end'}},3.15)
    .to('.tot,.bar .l',{opacity:0,duration:.3},3.25)
    .to('.card',{opacity:0,y:-16,duration:.3,ease:'power2.in'},3.7);
</script>
