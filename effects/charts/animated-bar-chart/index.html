<!doctype html><meta charset="utf-8">
<title>Animated Bar Chart</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f3f4f6;display:flex;align-items:center;justify-content:center}
  .card{width:960px;height:560px;background:#fff;border-radius:24px;box-shadow:0 30px 80px rgba(20,24,40,.12);padding:44px 52px;position:relative}
  .head{display:flex;justify-content:space-between;align-items:flex-start}
  .title{font-size:26px;font-weight:500;color:#111827;letter-spacing:-.01em}
  .sub{font-size:15px;color:#6b7280;margin-top:6px}
  .kpi{text-align:right}
  .kpi .v{font-size:34px;font-weight:500;color:#111827;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kpi .d{font-size:14px;color:#16a34a;margin-top:2px}
  .plot{position:absolute;left:52px;right:52px;bottom:80px;top:150px}
  .grid{position:absolute;left:0;right:0;height:1px;background:#e5e7eb}
  .grid span{position:absolute;right:100%;margin-right:12px;top:-8px;font-size:12px;color:#9ca3af;font-variant-numeric:tabular-nums}
  .bars{position:absolute;left:40px;right:0;top:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 10px}
  .bar{width:64px;position:relative;height:100%;display:flex;align-items:flex-end}
  .fill{width:100%;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#6366f1,#4f46e5);transform-origin:50% 100%}
  .bar.hi .fill{background:linear-gradient(180deg,#f59e0b,#f97316)}
  .val{position:absolute;left:0;right:0;text-align:center;font-size:14px;font-weight:500;color:#111827;font-variant-numeric:tabular-nums;transform:translateY(-26px)}
  .lab{position:absolute;left:0;right:0;top:100%;margin-top:12px;text-align:center;font-size:13px;color:#6b7280}
  .base{position:absolute;left:40px;right:0;bottom:0;height:2px;background:#d1d5db;transform-origin:0 50%}
</style>
<div class="stage">
  <div class="card">
    <div class="head">
      <div><div class="title">Monthly revenue</div><div class="sub">Acme Analytics · last 7 months</div></div>
      <div class="kpi"><div class="v" id="kpi">$0</div><div class="d">▲ 18.4% vs prior period</div></div>
    </div>
    <div class="plot">
      <div class="grid" style="top:0%"><span>100k</span></div>
      <div class="grid" style="top:25%"><span>75k</span></div>
      <div class="grid" style="top:50%"><span>50k</span></div>
      <div class="grid" style="top:75%"><span>25k</span></div>
      <div class="base"></div>
      <div class="bars" id="bars"></div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const data=[{l:'Mar',v:42},{l:'Apr',v:55},{l:'May',v:48},{l:'Jun',v:66},{l:'Jul',v:73},{l:'Aug',v:81},{l:'Sep',v:94,hi:true}];
  const bars=document.getElementById('bars');
  data.forEach(d=>{const b=document.createElement('div');b.className='bar'+(d.hi?' hi':'');b.innerHTML=`<div class="fill" style="height:${d.v}%"><div class="val" data-v="${d.v}">0k</div></div><div class="lab">${d.l}</div>`;bars.appendChild(b)});
  const tl=fx.timeline({duration:4});
  const counters={};
  tl.from('.card',{y:30,opacity:0,duration:.6,ease:'power3.out'},0)
    .from('.grid',{scaleX:0,transformOrigin:'0 50%',duration:.7,ease:'expo.out',stagger:.05},.15)
    .from('.base',{scaleX:0,duration:.6,ease:'expo.out'},.2)
    .from('.fill',{scaleY:0,duration:.9,ease:'expo.out',stagger:.09},.4)
    .from('.lab',{opacity:0,y:8,duration:.4,stagger:.09},.5)
    .from('.val',{opacity:0,duration:.3,stagger:.09},.7);
  document.querySelectorAll('.val').forEach((el,i)=>{const o={n:0};tl.to(o,{n:+el.dataset.v,duration:.9,ease:'expo.out',onUpdate(){el.textContent=Math.round(o.n)+'k'}},.4+i*.09)});
  const k={n:0};tl.to(k,{n:459,duration:1.4,ease:'power2.out',onUpdate(){document.getElementById('kpi').textContent='$'+Math.round(k.n)+'k'}},.5);
  // hold with a gentle breath on the highlight bar, then clean exit
  tl.to('.bar.hi .fill',{scaleY:1.04,duration:.6,yoyo:true,repeat:1,ease:'sine.inOut'},2.0)
    .to('.fill',{scaleY:0,duration:.45,ease:'expo.in',stagger:{each:.04,from:'end'}},3.1)
    .to('.val,.lab',{opacity:0,duration:.3},3.3)
    .to('.card',{opacity:0,y:-20,duration:.35,ease:'power2.in'},3.6);
</script>
