<!doctype html><meta charset="utf-8">
<title>Multiple Line Chart: Green</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#06120c;padding:60px 80px;color:#fff}
  .top{display:flex;justify-content:space-between;align-items:flex-end}
  h1{font-size:34px;font-weight:500;letter-spacing:-.02em}
  .sub{font-size:14px;color:#6f9c84;margin-top:6px}
  .legend{display:flex;gap:22px;font-size:13px;color:#b7d9c6}
  .legend span::before{content:"";display:inline-block;width:20px;height:3px;border-radius:2px;background:var(--c);margin-right:8px;vertical-align:3px}
  .plot{position:absolute;left:80px;right:80px;top:170px;bottom:70px}
  svg{width:100%;height:100%;overflow:visible}
  .grid{stroke:rgba(255,255,255,.07)}
  .lab{font-size:12px;fill:#6f9c84;font-family:inherit}
  .ln{fill:none;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
  .ln.a{stroke:#4ade80;filter:drop-shadow(0 0 8px rgba(74,222,128,.6))}
  .ln.b{stroke:#16a34a}
  .ln.c{stroke:#86efac;stroke-dasharray:1 0}
  .end circle{stroke-width:3;fill:#06120c}
  .end text{font-size:13px;fill:#fff;font-family:inherit;font-weight:500}
</style>
<div class="stage">
  <div class="top"><div><h1>Portfolio performance</h1><div class="sub">Indexed to 100 · trailing 12 months</div></div>
    <div class="legend"><span style="--c:#4ade80">Growth</span><span style="--c:#16a34a">Balanced</span><span style="--c:#86efac">Income</span></div></div>
  <div class="plot"><svg viewBox="0 0 1120 480" preserveAspectRatio="none"><g id="grid"></g><path id="pa" class="ln a"/><path id="pb" class="ln b"/><path id="pc" class="ln c"/><g id="ends" class="end"></g></svg></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const W=1120,H=480,pad=50,base=H-30,span=H-70;
  const rng=fx.rng(7);
  const walk=(start,drift,vol)=>{let v=start;return Array.from({length:13},(_,i)=>i?v+=drift+(rng()-.5)*vol:v)};
  const A=walk(100,3.2,6),B=walk(100,1.8,3),Cc=walk(100,.9,1.5);
  const min=95,max=145;
  const P=v=>v.map((y,i)=>[pad+i*(W-pad-60)/12,base-((y-min)/(max-min))*span]);
  const curve=pts=>{let d='M'+pts[0].join(' ');for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(i-1,0)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(i+2,pts.length-1)];d+=` C${p1[0]+(p2[0]-p0[0])/6} ${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6} ${p2[1]-(p3[1]-p1[1])/6} ${p2[0]} ${p2[1]}`}return d};
  const ns='http://www.w3.org/2000/svg',grid=document.getElementById('grid'),ends=document.getElementById('ends');
  [[A,'pa','#4ade80'],[B,'pb','#16a34a'],[Cc,'pc','#86efac']].forEach(([v,id,c])=>{const pts=P(v);document.getElementById(id).setAttribute('d',curve(pts));const [x,y]=pts[12];const g=document.createElementNS(ns,'g');g.innerHTML=`<circle cx="${x}" cy="${y}" r="6" stroke="${c}"/><text x="${x+14}" y="${y+5}">${v[12].toFixed(1)}</text>`;g.style.transformOrigin=`${x}px ${y}px`;ends.appendChild(g)});
  for(let i=0;i<=5;i++){const y=base-(i/5)*span;const l=document.createElementNS(ns,'line');l.setAttribute('class','grid');l.setAttribute('x1',pad);l.setAttribute('x2',W-60);l.setAttribute('y1',y);l.setAttribute('y2',y);grid.appendChild(l);const t=document.createElementNS(ns,'text');t.setAttribute('class','lab');t.setAttribute('x',0);t.setAttribute('y',y+4);t.textContent=Math.round(min+(max-min)*i/5);grid.appendChild(t)}
  'JFMAMJJASONDJ'.split('').forEach((m,i)=>{const t=document.createElementNS(ns,'text');t.setAttribute('class','lab');t.setAttribute('x',pad+i*(W-pad-60)/12-4);t.setAttribute('y',H);t.textContent=m;grid.appendChild(t)});
  const tl=fx.timeline({duration:4});
  tl.from('h1,.sub,.legend span',{y:16,opacity:0,duration:.6,stagger:.08,ease:'power3.out'},0)
    .from('.grid',{drawSVG:'0%',duration:.8,ease:'expo.out',stagger:.04},.15)
    .from('.lab',{opacity:0,duration:.4,stagger:.015},.3)
    // all three draw at the same time, slightly different speeds
    .fromTo('#pc',{drawSVG:'0%'},{drawSVG:'100%',duration:2.0,ease:'power2.inOut'},.5)
    .fromTo('#pb',{drawSVG:'0%'},{drawSVG:'100%',duration:1.9,ease:'power2.inOut'},.5)
    .fromTo('#pa',{drawSVG:'0%'},{drawSVG:'100%',duration:1.8,ease:'power2.inOut'},.5)
    .from('.end g',{scale:0,opacity:0,duration:.4,ease:'back.out(2.5)',stagger:.06},2.25)
    // hold: the lead line pulses its glow
    .to('#pa',{strokeWidth:5,duration:.5,yoyo:true,repeat:1,ease:'sine.inOut'},2.6)
    .to('.end g',{scale:0,opacity:0,duration:.25,stagger:.04},3.2)
    .to('#pa,#pb,#pc',{drawSVG:'100% 100%',duration:.5,ease:'expo.in',stagger:.04},3.25)
    .to('.stage > *',{opacity:0,duration:.3},3.7);
</script>
