<!doctype html><meta charset="utf-8">
<title>Animated Line Chart: Purple</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#12071f;display:flex;align-items:center;justify-content:center}
  .glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,.35),transparent 60%);left:50%;top:60%;transform:translate(-50%,-50%);filter:blur(40px)}
  .card{width:1000px;height:560px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:40px 48px;position:relative;backdrop-filter:blur(10px)}
  .title{font-size:24px;font-weight:500;color:#fff;letter-spacing:-.01em}
  .sub{font-size:14px;color:#a78bca;margin-top:6px}
  .legend{position:absolute;right:48px;top:44px;display:flex;gap:18px;font-size:13px;color:#c9b8e0}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#c084fc;margin-right:8px;vertical-align:1px}
  .legend span.b::before{background:#5b3a86}
  .plot{position:absolute;left:48px;right:48px;top:130px;bottom:56px}
  svg{width:100%;height:100%;overflow:visible}
  .grid{stroke:rgba(255,255,255,.08);stroke-width:1;stroke-dasharray:4 6}
  .lab{font-size:12px;fill:#8b78a8;font-family:inherit}
  .l1{fill:none;stroke:#c084fc;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 10px rgba(192,132,252,.7))}
  .l2{fill:none;stroke:#5b3a86;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 8}
  .area{fill:url(#gp)}
  .mk{fill:#12071f;stroke:#c084fc;stroke-width:3}
  .scan{stroke:rgba(192,132,252,.5);stroke-width:1}
</style>
<div class="stage">
  <div class="glow"></div>
  <div class="card">
    <div class="title">Weekly engagement</div><div class="sub">Sessions per user · rolling 12 weeks</div>
    <div class="legend"><span>This year</span><span class="b">Last year</span></div>
    <div class="plot">
      <svg viewBox="0 0 904 374" preserveAspectRatio="none">
        <defs><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c084fc" stop-opacity=".4"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></linearGradient>
        <clipPath id="clip"><rect id="cr" x="0" y="-40" width="0" height="440"/></clipPath></defs>
        <g id="grid"></g>
        <path id="area" class="area" clip-path="url(#clip)"/>
        <path id="l2" class="l2"/>
        <path id="l1" class="l1"/>
        <line id="scan" class="scan" y1="0" y2="344"/>
        <g id="marks"></g>
      </svg>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const W=904,H=374,pad=36,base=H-30,span=H-50;
  const a=[3.1,3.4,3.2,3.9,4.4,4.1,4.9,5.6,5.3,6.1,6.8,7.4], b=[2.8,2.9,3.1,3.0,3.4,3.3,3.7,3.9,3.8,4.2,4.1,4.5];
  const max=8;
  const P=v=>v.map((y,i)=>[pad+i*(W-pad)/(v.length-1),base-(y/max)*span]);
  function curve(pts){let d='M'+pts[0].join(' ');for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(i-1,0)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(i+2,pts.length-1)];d+=` C${p1[0]+(p2[0]-p0[0])/6} ${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6} ${p2[1]-(p3[1]-p1[1])/6} ${p2[0]} ${p2[1]}`}return d}
  const pa=P(a),pb=P(b);
  const l1=document.getElementById('l1');l1.setAttribute('d',curve(pa));
  document.getElementById('l2').setAttribute('d',curve(pb));
  document.getElementById('area').setAttribute('d',curve(pa)+` L${pa[11][0]} ${base} L${pa[0][0]} ${base} Z`);
  const ns='http://www.w3.org/2000/svg',grid=document.getElementById('grid'),marks=document.getElementById('marks');
  for(let i=0;i<=4;i++){const y=base-(i/4)*span;const l=document.createElementNS(ns,'line');l.setAttribute('class','grid');l.setAttribute('x1',pad);l.setAttribute('x2',W);l.setAttribute('y1',y);l.setAttribute('y2',y);grid.appendChild(l);const t=document.createElementNS(ns,'text');t.setAttribute('class','lab');t.setAttribute('x',0);t.setAttribute('y',y+4);t.textContent=(max*i/4).toFixed(0);grid.appendChild(t)}
  pa.forEach((p,i)=>{const t=document.createElementNS(ns,'text');t.setAttribute('class','lab');t.setAttribute('x',p[0]-10);t.setAttribute('y',H-4);t.textContent='W'+(i+1);grid.appendChild(t);
    const c=document.createElementNS(ns,'circle');c.setAttribute('class','mk');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r',5);marks.appendChild(c)});
  const cr=document.getElementById('cr'),scan=document.getElementById('scan');
  const len=l1.getTotalLength();const o={p:0};
  const upd=()=>{const p=l1.getPointAtLength(o.p*len);cr.setAttribute('width',p.x);scan.setAttribute('x1',p.x);scan.setAttribute('x2',p.x)};
  const tl=fx.timeline({duration:4});
  tl.from('.card',{y:30,opacity:0,duration:.6,ease:'power3.out'},0)
    .from('.glow',{scale:.6,opacity:0,duration:1.2,ease:'power2.out'},0)
    .from('.grid',{drawSVG:'0%',duration:.8,ease:'expo.out',stagger:.05},.15)
    .from('.lab',{opacity:0,duration:.4,stagger:.015},.3)
    .from('.title,.sub,.legend',{y:12,opacity:0,duration:.5,stagger:.08,ease:'power3.out'},.1)
    .fromTo('#l2',{drawSVG:'0%'},{drawSVG:'100%',duration:1.6,ease:'power2.inOut'},.5)
    .fromTo(l1,{drawSVG:'0%'},{drawSVG:'100%',duration:1.8,ease:'power2.inOut'},.6)
    .to(o,{p:1,duration:1.8,ease:'power2.inOut',onUpdate:upd},.6)
    .from('.mk',{scale:0,transformOrigin:'50% 50%',duration:.4,ease:'back.out(3)',stagger:.14},.75)
    .to('#scan',{opacity:0,duration:.3},2.4)
    .to('.glow',{x:60,duration:1.5,ease:'sine.inOut',yoyo:true,repeat:1},1.2)
    .to('.mk',{scale:0,duration:.25,stagger:{each:.03,from:'end'}},3.2)
    .to('#l1,#l2',{drawSVG:'100% 100%',duration:.5,ease:'expo.in'},3.25)
    .to(cr,{attr:{width:0},duration:.5,ease:'expo.in'},3.25)
    .to('.card',{opacity:0,y:-16,duration:.3,ease:'power2.in'},3.7);
</script>
