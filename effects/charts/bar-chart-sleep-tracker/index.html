<!doctype html><meta charset="utf-8">
<title>Bar Chart: Sleep Tracker</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0e0b1f;display:flex;align-items:center;justify-content:center}
  .phone{width:820px;height:1620px;border-radius:80px;background:#15112b;border:10px solid #2a2445;padding:70px 56px;position:relative;box-shadow:0 60px 140px rgba(0,0,0,.6)}
  .notch{position:absolute;left:50%;top:26px;width:200px;height:44px;border-radius:24px;background:#0e0b1f;transform:translateX(-50%)}
  .top{display:flex;justify-content:space-between;align-items:center;margin-top:60px;color:#fff}
  .top .t{font-size:34px;font-weight:500}
  .top .wk{font-size:22px;color:#8f86b8;background:#221c3d;padding:10px 20px;border-radius:999px}
  .hero{margin-top:60px;color:#fff}
  .hero .l{font-size:22px;color:#8f86b8}
  .hero .v{font-size:110px;font-weight:500;letter-spacing:-.04em;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
  .hero .v small{font-size:44px;color:#8f86b8;letter-spacing:0;margin-left:4px}
  .hero .d{margin-top:16px;font-size:22px;color:#7ee0b8}
  .chart{margin-top:80px;height:640px;position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:0 80px 0 10px}
  .gl{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.08)}
  .gl span{position:absolute;right:0;top:-12px;font-size:18px;color:#5f578a}
  .day{width:70px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
  .seg{width:100%;transform-origin:50% 100%}
  .seg.deep{background:#5b4bff;border-radius:0 0 14px 14px}
  .seg.core{background:#8f83ff}
  .seg.rem{background:#c9c2ff;border-radius:14px 14px 0 0}
  .day .n{position:absolute;top:100%;margin-top:18px;left:0;right:0;text-align:center;color:#8f86b8;font-size:20px}
  .day.today .n{color:#fff}
  .legend{margin-top:80px;display:flex;gap:36px;color:#8f86b8;font-size:22px}
  .legend span::before{content:"";display:inline-block;width:16px;height:16px;border-radius:5px;margin-right:12px;vertical-align:-1px;background:var(--c)}
  .cards{margin-top:70px;display:flex;gap:24px}
  .c{flex:1;background:#221c3d;border-radius:32px;padding:32px;color:#fff}
  .c .k{font-size:20px;color:#8f86b8}.c .n{font-size:44px;font-weight:500;margin-top:10px;font-variant-numeric:tabular-nums}
</style>
<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="top"><div class="t">Sleep</div><div class="wk">This week</div></div>
    <div class="hero"><div class="l">Avg. time asleep</div><div class="v"><span id="h">0</span><small>h</small> <span id="m">00</span><small>m</small></div><div class="d">▲ 32 min vs last week</div></div>
    <div class="chart" id="chart">
      <div class="gl" style="top:0"><span>10h</span></div><div class="gl" style="top:50%"><span>5h</span></div><div class="gl" style="bottom:0"></div>
    </div>
    <div class="legend"><span style="--c:#5b4bff">Deep</span><span style="--c:#8f83ff">Core</span><span style="--c:#c9c2ff">REM</span></div>
    <div class="cards"><div class="c"><div class="k">Deep sleep</div><div class="n" id="c1">0%</div></div><div class="c"><div class="k">Sleep score</div><div class="n" id="c2">0</div></div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const days=[['M',1.6,3.9,1.4],['T',1.4,3.5,1.2],['W',1.9,4.1,1.6],['T',1.2,3.2,1.1],['F',1.8,4.0,1.5],['S',2.2,4.6,1.9],['S',2.0,4.4,1.7]];
  const ch=document.getElementById('chart');
  days.forEach((d,i)=>{const el=document.createElement('div');el.className='day'+(i===6?' today':'');el.innerHTML=`<div class="seg rem" style="height:${d[3]*10}%"></div><div class="seg core" style="height:${d[2]*10}%"></div><div class="seg deep" style="height:${d[1]*10}%"></div><div class="n">${d[0]}</div>`;ch.appendChild(el)});
  const tl=fx.timeline({duration:5});
  tl.from('.phone',{y:80,opacity:0,duration:.8,ease:'power3.out'},0)
    .from('.top,.hero > *',{y:24,opacity:0,duration:.6,stagger:.1,ease:'power3.out'},.3)
    .from('.gl',{scaleX:0,transformOrigin:'0 50%',duration:.7,ease:'expo.out',stagger:.06},.5)
    .from('.day .n',{opacity:0,duration:.4,stagger:.07},.7);
  // each day's stack grows from the baseline; segments build bottom→top
  document.querySelectorAll('.day').forEach((d,i)=>{const t=.8+i*.12;
    tl.from(d.querySelector('.deep'),{scaleY:0,duration:.6,ease:'expo.out'},t)
      .from(d.querySelector('.core'),{scaleY:0,y:()=>d.querySelector('.deep').offsetHeight,duration:.6,ease:'expo.out'},t+.1)
      .from(d.querySelector('.rem'),{scaleY:0,y:()=>d.querySelector('.deep').offsetHeight+d.querySelector('.core').offsetHeight,duration:.6,ease:'expo.out'},t+.2)});
  const o={h:0,m:0,p:0,s:0};
  tl.to(o,{h:7,m:12,p:23,s:86,duration:1.6,ease:'power2.out',onUpdate(){document.getElementById('h').textContent=Math.round(o.h);document.getElementById('m').textContent=String(Math.round(o.m)).padStart(2,'0');document.getElementById('c1').textContent=Math.round(o.p)+'%';document.getElementById('c2').textContent=Math.round(o.s)}},.9)
    .from('.legend span',{opacity:0,y:8,duration:.4,stagger:.08},1.5)
    .from('.c',{y:30,opacity:0,duration:.6,stagger:.1,ease:'power3.out'},1.7)
    // hold: today's bar breathes
    .to('.day.today',{scaleY:1.03,transformOrigin:'50% 100%',duration:.6,yoyo:true,repeat:1,ease:'sine.inOut'},2.8)
    .to('.seg',{scaleY:0,duration:.45,ease:'expo.in',stagger:{each:.04,from:'end'}},4.15)
    .to('.phone',{y:-60,opacity:0,duration:.45,ease:'power2.in'},4.55);
</script>
