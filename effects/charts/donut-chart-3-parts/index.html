<!doctype html><meta charset="utf-8">
<title>Donut Chart: 3 Parts</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#fafaf7;display:flex;align-items:center;justify-content:center}
  .wrap{display:flex;align-items:center;gap:96px}
  .ring{position:relative;width:380px;height:380px}
  svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  circle{fill:none;stroke-width:44}
  .s1{stroke:#ff6b4a}.s2{stroke:#3b82f6}.s3{stroke:#111}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .center .n{font-size:56px;font-weight:500;color:#111;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .center .l{font-size:13px;color:#777;letter-spacing:.18em;text-transform:uppercase}
  .legend{width:340px}
  .legend h2{font-size:32px;font-weight:500;color:#111;letter-spacing:-.02em;margin-bottom:28px}
  .it{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid #e6e6e0;font-size:17px;color:#333}
  .sw{width:16px;height:16px;border-radius:5px}
  .it b{margin-left:auto;font-weight:500;color:#111;font-variant-numeric:tabular-nums}
  .it .bar{position:absolute}
</style>
<div class="stage">
  <div class="wrap">
    <div class="ring">
      <svg viewBox="0 0 380 380"><circle class="s3" cx="190" cy="190" r="150"/><circle class="s2" cx="190" cy="190" r="150"/><circle class="s1" cx="190" cy="190" r="150"/></svg>
      <div class="center"><div class="n" id="n">0%</div><div class="l">of budget</div></div>
    </div>
    <div class="legend">
      <h2>Spend by channel</h2>
      <div class="it" data-v="46"><span class="sw" style="background:#ff6b4a"></span>Paid social<b>0%</b></div>
      <div class="it" data-v="32"><span class="sw" style="background:#3b82f6"></span>Search<b>0%</b></div>
      <div class="it" data-v="22"><span class="sw" style="background:#111"></span>Partnerships<b>0%</b></div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const V=[46,32,22];
  const tl=fx.timeline({duration:4});
  const o={n:0};const items=[...document.querySelectorAll('.it')];
  const upd=()=>{document.getElementById('n').textContent=Math.round(o.n)+'%';let acc=0;items.forEach((it,i)=>{const v=Math.max(0,Math.min(V[i],o.n-acc));it.querySelector('b').textContent=Math.round(v)+'%';acc+=V[i]})};
  // three segments, each drawn in sequence from where the previous ended
  tl.from('.ring',{scale:.8,opacity:0,duration:.6,ease:'power3.out'},0)
    .from('.legend h2',{y:14,opacity:0,duration:.5,ease:'power3.out'},.1)
    .fromTo('.s1',{drawSVG:'0% 0%'},{drawSVG:'0% 46%',duration:.8,ease:'power3.inOut'},.4)
    .fromTo('.s2',{drawSVG:'46% 46%'},{drawSVG:'46% 78%',duration:.7,ease:'power3.inOut'},1.15)
    .fromTo('.s3',{drawSVG:'78% 78%'},{drawSVG:'78% 100%',duration:.6,ease:'power3.inOut'},1.8)
    .to(o,{n:46,duration:.8,ease:'power3.inOut',onUpdate:upd},.4)
    .to(o,{n:78,duration:.7,ease:'power3.inOut',onUpdate:upd},1.15)
    .to(o,{n:100,duration:.6,ease:'power3.inOut',onUpdate:upd},1.8)
    .from(items[0],{x:20,opacity:0,duration:.5,ease:'power3.out'},.45)
    .from(items[1],{x:20,opacity:0,duration:.5,ease:'power3.out'},1.2)
    .from(items[2],{x:20,opacity:0,duration:.5,ease:'power3.out'},1.85)
    // hold: the whole ring rotates a touch while the largest segment pops out
    .to('svg',{rotate:-80,duration:1.2,ease:'power2.inOut'},2.4)
    .to('.s1',{attr:{r:158},strokeWidth:52,duration:.4,ease:'back.out(2)'},2.5)
    .to('.s1',{attr:{r:150},strokeWidth:44,duration:.4,ease:'power2.inOut'},3.0)
    .to('.s1,.s2,.s3',{drawSVG:'0% 0%',duration:.5,ease:'expo.in',stagger:.05},3.3)
    .to(o,{n:0,duration:.55,ease:'expo.in',onUpdate:upd},3.3)
    .to('.legend,.center',{opacity:0,duration:.3},3.55)
    .to('svg',{rotate:-90,duration:.3},3.7);
</script>
