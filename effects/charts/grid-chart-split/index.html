<!doctype html><meta charset="utf-8">
<title>Grid Chart: Split</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101114;display:flex;align-items:center;justify-content:center}
  .grid{position:relative;width:1040px;height:600px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px}
  .p{background:#1b1d23;border-radius:22px;padding:30px 34px;position:relative;overflow:hidden;color:#fff;transform-origin:50% 50%}
  .p .k{font-size:13px;color:#8b90a0;letter-spacing:.14em;text-transform:uppercase}
  .p .v{font-size:52px;font-weight:500;letter-spacing:-.03em;margin-top:8px;font-variant-numeric:tabular-nums;line-height:1}
  .p .d{font-size:14px;margin-top:8px;color:#5ee0a0}.p .d.neg{color:#ff7a7a}
  .p:nth-child(1){background:#3a56ff}.p:nth-child(1) .k{color:#c7d0ff}.p:nth-child(1) .d{color:#dfe5ff}
  .mini{position:absolute;left:34px;right:34px;bottom:30px;height:90px;display:flex;align-items:flex-end;gap:8px}
  .mini i{flex:1;background:rgba(255,255,255,.35);border-radius:4px 4px 0 0;transform-origin:50% 100%}
  .p:nth-child(2) .mini i{background:#5ee0a0}
  .spark{position:absolute;left:34px;right:34px;bottom:30px;height:90px}
  .spark svg{width:100%;height:100%;overflow:visible}
  .spark path{fill:none;stroke:#ffb84d;stroke-width:4;stroke-linecap:round}
  .prog{position:absolute;left:34px;right:34px;bottom:34px}
  .prog .row{display:flex;justify-content:space-between;font-size:13px;color:#8b90a0;margin-bottom:8px}
  .prog .tr{height:10px;background:#2a2d36;border-radius:5px;overflow:hidden}
  .prog .f{height:100%;background:#c084fc;border-radius:5px;transform-origin:0 50%}
  .prog + .prog{margin-bottom:0}
  .seam{position:absolute;background:#101114;z-index:2}
  .seam.h{left:0;right:0;top:50%;height:14px;transform:translateY(-50%) scaleX(0)}
  .seam.v{top:0;bottom:0;left:50%;width:14px;transform:translateX(-50%) scaleY(0)}
</style>
<div class="stage">
  <div class="grid">
    <div class="p"><div class="k">Revenue</div><div class="v" id="v1">$0</div><div class="d">▲ 12.5% this month</div><div class="mini"><i style="height:40%"></i><i style="height:55%"></i><i style="height:48%"></i><i style="height:70%"></i><i style="height:64%"></i><i style="height:82%"></i><i style="height:100%"></i></div></div>
    <div class="p"><div class="k">Orders</div><div class="v" id="v2">0</div><div class="d">▲ 8.1% this month</div><div class="mini"><i style="height:30%"></i><i style="height:44%"></i><i style="height:60%"></i><i style="height:52%"></i><i style="height:74%"></i><i style="height:68%"></i><i style="height:92%"></i></div></div>
    <div class="p"><div class="k">Avg. session</div><div class="v" id="v3">0:00</div><div class="d neg">▼ 2.3% this month</div><div class="spark"><svg viewBox="0 0 400 90" preserveAspectRatio="none"><path d="M0 70 C40 60 60 30 100 40 S160 80 200 60 S260 20 300 30 S360 10 400 20"/></svg></div></div>
    <div class="p"><div class="k">Goals</div><div class="v" id="v4">0%</div><div class="d">3 of 4 on track</div><div class="prog" style="bottom:70px"><div class="row"><span>Signups</span><span>82%</span></div><div class="tr"><div class="f" style="width:82%"></div></div></div><div class="prog"><div class="row"><span>Retention</span><span>64%</span></div><div class="tr"><div class="f" style="width:64%"></div></div></div></div>
    <div class="seam h"></div><div class="seam v"></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl=fx.timeline({duration:3});
  const p=[...document.querySelectorAll('.p')];
  // one panel, then it splits into four
  const init={x:i=>i%2?-527:0,y:i=>i>1?-307:0,scaleX:i=>i%2?0:1,scaleY:i=>i>1?0:1,transformOrigin:'0 0'};
  gsap.set(p,init);gsap.set(p[0],{scaleX:2.03,scaleY:2.02,transformOrigin:'0 0'});
  tl.from(p[0],{opacity:0,duration:.4,ease:'power3.out'},0)
    .from('.grid',{scale:.92,duration:.5,ease:'power3.out'},0)
    .to(p[0],{scaleX:1,scaleY:1,duration:.7,ease:'expo.inOut'},.35)
    .to(p.slice(1),{x:0,y:0,scaleX:1,scaleY:1,duration:.7,ease:'expo.inOut'},.35)
    .from('.p > .k,.p > .v,.p > .d',{y:14,opacity:0,duration:.45,stagger:.03,ease:'power3.out'},.75)
    .from('.mini i',{scaleY:0,duration:.6,ease:'expo.out',stagger:.04},.9)
    .from('.spark path',{drawSVG:'0%',duration:.8,ease:'power2.inOut'},.95)
    .from('.prog .f',{scaleX:0,duration:.7,ease:'expo.out',stagger:.1},1.0)
    .from('.prog .row',{opacity:0,duration:.3,stagger:.1},1.0);
  const o={a:0,b:0,c:0,d:0};
  tl.to(o,{a:48200,b:1284,c:222,d:76,duration:1,ease:'power3.out',onUpdate(){v1.textContent='$'+Math.round(o.a).toLocaleString('en-US');v2.textContent=Math.round(o.b).toLocaleString('en-US');v3.textContent=Math.floor(o.c/60)+':'+String(Math.round(o.c%60)).padStart(2,'0');v4.textContent=Math.round(o.d)+'%'}},.85);
  // exit: collapse back into one and fade
  tl.to(p.slice(1),{x:i=>(i+1)%2?-527:0,y:i=>i+1>1?-307:0,scaleX:i=>(i+1)%2?0:1,scaleY:i=>i+1>1?0:1,duration:.4,ease:'expo.in',transformOrigin:'0 0'},2.45)
    .to(p[0],{scaleX:2.03,scaleY:2.02,duration:.4,ease:'expo.in',transformOrigin:'0 0'},2.45)
    .to('.grid',{opacity:0,scale:.96,duration:.25,ease:'power2.in'},2.75);
</script>
