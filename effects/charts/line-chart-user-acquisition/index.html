<!doctype html><meta charset="utf-8">
<title>Line Chart: User Acquisition</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0c0f14;padding:64px 80px;color:#fff}
  .eyebrow{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#7c8594}
  h1{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-size:40px;font-weight:400;letter-spacing:-.02em;margin-top:10px}
  .big{position:absolute;right:80px;top:56px;text-align:right}
  .big .n{font-size:64px;font-weight:500;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
  .big .l{font-size:14px;color:#7c8594;margin-top:6px}
  .plot{position:absolute;left:80px;right:80px;top:190px;bottom:70px}
  svg{width:100%;height:100%;overflow:visible}
  .grid{stroke:rgba(255,255,255,.07)}
  .lab{font-size:12px;fill:#7c8594;font-family:inherit}
  .line{fill:none;stroke:#34d399;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
  .area{fill:url(#g)}
  .ms circle{fill:#0c0f14;stroke:#34d399;stroke-width:3}
  .ms text{font-size:12px;fill:#cbd5e1;font-family:inherit;text-anchor:middle}
  .ms rect{fill:#1a202b;stroke:rgba(255,255,255,.1)}
  .head{fill:#34d399}
</style>
<div class="stage">
  <div class="eyebrow">Growth · 18 months</div>
  <h1>User acquisition</h1>
  <div class="big"><div class="n" id="n">0</div><div class="l">total users</div></div>
  <div class="plot">
    <svg viewBox="0 0 1120 460" preserveAspectRatio="none">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".35"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient>
      <clipPath id="c"><rect id="cr" x="0" y="-50" width="0" height="560"/></clipPath></defs>
      <g id="grid"></g>
      <path id="area" class="area" clip-path="url(#c)"/>
      <path id="line" class="line"/>
      <g id="ms" class="ms"></g>
      <circle id="head" class="head" r="8"/>
    </svg>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const W=1120,H=460,pad=50,base=H-30,span=H-70;
  const vals=[2,3,4,6,7,9,12,14,15,19,24,27,33,40,44,52,63,72];
  const max=80;
  const pts=vals.map((v,i)=>[pad+i*(W-pad)/(vals.length-1),base-(v/max)*span]);
  let d='M'+pts[0].join(' ');for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(i-1,0)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(i+2,pts.length-1)];d+=` C${p1[0]+(p2[0]-p0[0])/6} ${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6} ${p2[1]-(p3[1]-p1[1])/6} ${p2[0]} ${p2[1]}`}
  const line=document.getElementById('line');line.setAttribute('d',d);
  document.getElementById('area').setAttribute('d',d+` L${pts[17][0]} ${base} L${pts[0][0]} ${base} Z`);
  const ns='http://www.w3.org/2000/svg',grid=document.getElementById('grid'),ms=document.getElementById('ms');
  for(let i=0;i<=4;i++){const y=base-(i/4)*span;const l=document.createElementNS(ns,'line');l.setAttribute('class','grid');l.setAttribute('x1',pad);l.setAttribute('x2',W);l.setAttribute('y1',y);l.setAttribute('y2',y);grid.appendChild(l);const t=document.createElementNS(ns,'text');t.setAttribute('class','lab');t.setAttribute('x',0);t.setAttribute('y',y+4);t.textContent=(max*i/4)+'k';grid.appendChild(t)}
  ['Jan','Apr','Jul','Oct','Jan','Apr'].forEach((m,i)=>{const t=document.createElementNS(ns,'text');t.setAttribute('class','lab');t.setAttribute('x',pts[Math.min(i*3,17)][0]);t.setAttribute('y',H);t.textContent=m;grid.appendChild(t)});
  const miles=[[6,'Launch v2'],[10,'Series A'],[15,'Mobile app']];
  miles.forEach(([i,txt])=>{const g=document.createElementNS(ns,'g');g.setAttribute('class','m');const [x,y]=pts[i];g.innerHTML=`<rect x="${x-44}" y="${y-58}" width="88" height="26" rx="6"/><text x="${x}" y="${y-40}">${txt}</text><circle cx="${x}" cy="${y}" r="6"/>`;g.style.transformOrigin=`${x}px ${y}px`;ms.appendChild(g)});
  const len=line.getTotalLength(),cr=document.getElementById('cr'),head=document.getElementById('head');
  const o={p:0,n:0};
  const upd=()=>{const p=line.getPointAtLength(o.p*len);cr.setAttribute('width',p.x);head.setAttribute('cx',p.x);head.setAttribute('cy',p.y);document.getElementById('n').textContent=Math.round(o.n).toLocaleString('en-US')};
  const tl=fx.timeline({duration:5});
  tl.from('.eyebrow,h1,.big',{y:20,opacity:0,duration:.6,stagger:.1,ease:'power3.out'},0)
    .from(head,{opacity:0,duration:.3},.6)
    .from('.grid',{drawSVG:'0%',duration:.8,ease:'expo.out',stagger:.05},.2)
    .from('.lab',{opacity:0,duration:.4,stagger:.02},.4)
    .fromTo(line,{drawSVG:'0%'},{drawSVG:'100%',duration:2.4,ease:'power1.inOut'},.6)
    .to(o,{p:1,n:72400,duration:2.4,ease:'power1.inOut',onUpdate:upd},.6);
  miles.forEach(([i],k)=>{tl.from(ms.children[k],{scale:0,opacity:0,duration:.45,ease:'back.out(2.5)'},.6+2.4*(i/17)*.92)});
  tl.to(head,{attr:{r:14},opacity:0,duration:.8,ease:'power2.out'},3.0)
    .to('.m',{y:-4,duration:.6,yoyo:true,repeat:1,ease:'sine.inOut',stagger:.1},3.1)
    .to('.m',{scale:0,opacity:0,duration:.3,stagger:.05},4.2)
    .to(line,{drawSVG:'100% 100%',duration:.5,ease:'expo.in'},4.3)
    .to(cr,{attr:{width:0},duration:.5,ease:'expo.in'},4.3)
    .to('.stage > *',{opacity:0,duration:.3},4.65);
</script>
