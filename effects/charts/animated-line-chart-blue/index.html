<!doctype html><meta charset="utf-8">
<title>Animated Line Chart: Blue</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f5f7fb;display:flex;align-items:center;justify-content:center}
  .card{width:980px;height:560px;background:#fff;border-radius:24px;box-shadow:0 30px 80px rgba(20,24,40,.12);padding:40px 48px;position:relative}
  .head{display:flex;justify-content:space-between;align-items:flex-start}
  .title{font-size:24px;font-weight:500;color:#0f172a;letter-spacing:-.01em}
  .sub{font-size:14px;color:#64748b;margin-top:6px}
  .kpi{text-align:right}.kpi .v{font-size:36px;font-weight:500;color:#0f172a;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kpi .d{display:inline-block;margin-top:4px;font-size:13px;color:#1d4ed8;background:#dbeafe;padding:3px 10px;border-radius:999px}
  .plot{position:absolute;left:48px;right:48px;top:140px;bottom:64px}
  svg{width:100%;height:100%;overflow:visible}
  .grid{stroke:#e2e8f0;stroke-width:1}
  .ylab{font-size:12px;fill:#94a3b8;font-family:inherit}
  .xlab{font-size:12px;fill:#94a3b8;font-family:inherit;text-anchor:middle}
  .line{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .area{fill:url(#ga)}
  .dot{fill:#fff;stroke:#2563eb;stroke-width:4}
  .halo{fill:#2563eb;opacity:.18}
  .tip{position:absolute;background:#0f172a;color:#fff;font-size:13px;padding:8px 12px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-140%)}
  .tip b{font-weight:500;font-variant-numeric:tabular-nums}
</style>
<div class="stage">
  <div class="card">
    <div class="head">
      <div><div class="title">Active subscriptions</div><div class="sub">Northwind · Jan – Dec</div></div>
      <div class="kpi"><div class="v" id="kpi">0</div><div class="d">+42% YoY</div></div>
    </div>
    <div class="plot">
      <svg id="svg" viewBox="0 0 884 356" preserveAspectRatio="none">
        <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb" stop-opacity=".35"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></linearGradient>
        <clipPath id="clip"><rect id="cr" x="0" y="-20" width="0" height="400"/></clipPath></defs>
        <g id="grid"></g>
        <path id="area" class="area" clip-path="url(#clip)"/>
        <path id="line" class="line"/>
        <circle id="halo" class="halo" r="16"/><circle id="dot" class="dot" r="7"/>
      </svg>
      <div class="tip" id="tip"><b>0</b> subs</div>
    </div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const W=884,H=356,pad=40;
  const vals=[12,15,14,19,24,22,28,31,30,37,42,48];
  const max=52;
  const pts=vals.map((v,i)=>[pad+i*(W-pad)/(vals.length-1),H-30-(v/max)*(H-40)]);
  // smooth catmull-rom-ish bezier
  let d='M'+pts[0].join(' ');
  for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(i-1,0)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(i+2,pts.length-1)];
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];d+=` C${c1.join(' ')} ${c2.join(' ')} ${p2.join(' ')}`}
  const line=document.getElementById('line');line.setAttribute('d',d);
  document.getElementById('area').setAttribute('d',d+` L${pts[pts.length-1][0]} ${H-30} L${pts[0][0]} ${H-30} Z`);
  const grid=document.getElementById('grid');const ns='http://www.w3.org/2000/svg';
  for(let i=0;i<=4;i++){const y=H-30-(i/4)*(H-40);const l=document.createElementNS(ns,'line');l.setAttribute('class','grid');l.setAttribute('x1',pad);l.setAttribute('x2',W);l.setAttribute('y1',y);l.setAttribute('y2',y);grid.appendChild(l);
    const t=document.createElementNS(ns,'text');t.setAttribute('class','ylab');t.setAttribute('x',0);t.setAttribute('y',y+4);t.textContent=Math.round(max*i/4)+'k';grid.appendChild(t)}
  'JFMAMJJASOND'.split('').forEach((m,i)=>{const t=document.createElementNS(ns,'text');t.setAttribute('class','xlab');t.setAttribute('x',pts[i][0]);t.setAttribute('y',H-6);t.textContent=m;grid.appendChild(t)});
  const len=line.getTotalLength();
  const dot=document.getElementById('dot'),halo=document.getElementById('halo'),tip=document.getElementById('tip'),cr=document.getElementById('cr');
  const plot=document.querySelector('.plot');
  const o={p:0};
  function upd(){const p=line.getPointAtLength(o.p*len);dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);halo.setAttribute('cx',p.x);halo.setAttribute('cy',p.y);cr.setAttribute('width',p.x);
    const pw=plot.clientWidth,ph=plot.clientHeight;tip.style.left=(p.x/W*pw)+'px';tip.style.top=(p.y/H*ph)+'px';
    const v=(1-(p.y-(H-30))/-(H-40))*max;const k=Math.max(0,(H-30-p.y)/(H-40)*max);tip.firstElementChild.textContent=(k).toFixed(1)+'k';document.getElementById('kpi').textContent=k.toFixed(1)+'k'}
  const tl=fx.timeline({duration:4});
  tl.from('.card',{y:30,opacity:0,duration:.6,ease:'power3.out'},0)
    .from('.grid',{scaleX:0,transformOrigin:'0 50%',duration:.7,ease:'expo.out',stagger:.05},.15)
    .from('.ylab,.xlab',{opacity:0,duration:.4,stagger:.02},.3)
    .fromTo(line,{drawSVG:'0%'},{drawSVG:'100%',duration:1.8,ease:'power2.inOut'},.5)
    .to(o,{p:1,duration:1.8,ease:'power2.inOut',onUpdate:upd},.5)
    .from('.tip',{opacity:0,scale:.8,duration:.3},.6)
    .fromTo(halo,{attr:{r:10}},{attr:{r:22},opacity:0,duration:.9,ease:'power2.out',repeat:1},2.35)
    .to('.tip,#dot',{opacity:0,duration:.3},3.4)
    .to('#line',{drawSVG:'100% 100%',duration:.5,ease:'expo.in'},3.3)
    .to(cr,{attr:{width:0},duration:.5,ease:'expo.in'},3.3)
    .to('.card',{opacity:0,y:-16,duration:.3,ease:'power2.in'},3.7);
</script>
