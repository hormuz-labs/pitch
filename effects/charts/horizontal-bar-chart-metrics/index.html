<!doctype html><meta charset="utf-8">
<title>Horizontal Bar Chart: Metrics</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f6f6f2;display:flex;align-items:center;justify-content:center}
  .card{width:920px;background:#fff;border-radius:24px;box-shadow:0 30px 80px rgba(20,24,40,.1);padding:44px 52px;overflow:hidden}
  .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:30px}
  .head h2{font-size:26px;font-weight:500;color:#111;letter-spacing:-.01em}
  .head span{font-size:14px;color:#777}
  .row{display:grid;grid-template-columns:36px 150px 1fr 90px;align-items:center;gap:18px;height:62px}
  .rk{font-size:15px;color:#999;font-variant-numeric:tabular-nums}
  .nm{display:flex;align-items:center;gap:12px;font-size:16px;color:#111;font-weight:500}
  .av{width:34px;height:34px;border-radius:10px;background:var(--c);display:grid;place-items:center;color:#fff;font-size:14px}
  .tr{height:28px;background:#f1f1ee;border-radius:8px;overflow:hidden;position:relative}
  .f{height:100%;border-radius:8px;background:var(--c);transform-origin:0 50%;position:relative}
  .f::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(var(--sheen,-100%))}
  .v{text-align:right;font-size:17px;font-weight:500;color:#111;font-variant-numeric:tabular-nums}
  .row:first-of-type .v{color:#111}
</style>
<div class="stage">
  <div class="card">
    <div class="head"><h2>Top performers</h2><span>Deals closed · Q3</span></div>
    <div id="rows"></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const data=[['Ava Chen','AC',128,'#ff6b4a'],['Marcus Lee','ML',112,'#3b82f6'],['Priya Nair','PN',97,'#8b5cf6'],['Jonas Weber','JW',84,'#14b8a6'],['Sofia Ruiz','SR',71,'#f59e0b'],['Kenji Sato','KS',58,'#64748b']];
  const rows=document.getElementById('rows');
  data.forEach((d,i)=>{const r=document.createElement('div');r.className='row';r.style.setProperty('--c',d[3]);r.innerHTML=`<div class="rk">0${i+1}</div><div class="nm"><span class="av">${d[1]}</span>${d[0]}</div><div class="tr"><div class="f" style="width:${d[2]/128*100}%"></div></div><div class="v">0</div>`;rows.appendChild(r)});
  const tl=fx.timeline({duration:4});
  tl.from('.card',{y:30,opacity:0,duration:.6,ease:'power3.out'},0)
    .from('.head > *',{y:12,opacity:0,duration:.5,stagger:.08,ease:'power3.out'},.15)
    // rows slide in from the left, then bars expand
    .from('.row',{x:-80,opacity:0,duration:.6,stagger:.09,ease:'expo.out'},.3)
    .from('.tr',{scaleX:0,transformOrigin:'0 50%',duration:.5,stagger:.09,ease:'expo.out'},.4)
    .from('.f',{scaleX:0,duration:1,stagger:.09,ease:'expo.out'},.6);
  document.querySelectorAll('.row').forEach((r,i)=>{const o={n:0};tl.to(o,{n:data[i][2],duration:1,ease:'expo.out',onUpdate(){r.querySelector('.v').textContent=Math.round(o.n)}},.6+i*.09)});
  // hold: a sheen sweeps along the bars
  document.querySelectorAll('.f').forEach((f,i)=>{const s={x:-100};tl.to(s,{x:300,duration:.8,ease:'power2.inOut',onUpdate(){f.style.setProperty('--sheen',s.x+'%')}},2.0+i*.06)});
  tl.to('.f',{scaleX:0,duration:.45,ease:'expo.in',stagger:{each:.05,from:'end'}},3.15)
    .to('.v',{opacity:0,duration:.3},3.2)
    .to('.row',{x:-60,opacity:0,duration:.35,ease:'power2.in',stagger:{each:.04,from:'end'}},3.4)
    .to('.card',{opacity:0,duration:.25},3.75);
</script>
