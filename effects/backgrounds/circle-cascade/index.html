<!doctype html><meta charset="utf-8">
<title>Circle Cascade</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f3efe6}
  .grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(6,1fr);padding:24px;gap:12px}
  .cell{display:flex;align-items:center;justify-content:center}
  .dot{width:92px;height:92px;border-radius:50%;background:#1a1a1f;will-change:transform,opacity}
  .dot.a{background:#ff5a36}.dot.b{background:#2b5cff}.dot.c{background:#f5c400}
</style>
<div class="stage"><div class="grid" id="grid"></div></div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const COLS = 10, ROWS = 6, grid = document.getElementById('grid');
  const rnd = fx.rng(7);
  const dots = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const cell = document.createElement('div'); cell.className = 'cell';
    const d = document.createElement('div'); d.className = 'dot';
    const k = rnd(); if (k < .18) d.classList.add('a'); else if (k < .34) d.classList.add('b'); else if (k < .46) d.classList.add('c');
    cell.appendChild(d); grid.appendChild(cell); dots.push({ el: d, r, c });
  }
  const tl = fx.timeline({ duration: 2 });
  // cascade in along the diagonal from top-left: each dot pops with overshoot
  dots.forEach(({ el, r, c }) => {
    const delay = (r + c) * 0.045;
    tl.fromTo(el, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: 'back.out(2.2)' }, delay);
    // cascade out along the same diagonal, shrinking to nothing
    tl.to(el, { scale: 0, opacity: 0, duration: 0.3, ease: 'power3.in' }, 1.25 + delay * 0.6);
  });
</script>
