<!doctype html><meta charset="utf-8">
<title>Rotating Squares</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#12141c}
  .grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(7,1fr);padding:26px 40px}
  .cell{display:flex;align-items:center;justify-content:center}
  .sq{width:58px;height:58px;border-radius:8px;background:#6d8cff;will-change:transform}
</style>
<div class="stage"><div class="grid" id="grid"></div></div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 10, COLS = 12, ROWS = 7, grid = document.getElementById('grid'), sq = [];
  const pal = ['#6d8cff', '#8ef0d2', '#ffd166', '#ff7b9c'];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const cell = document.createElement('div'); cell.className = 'cell';
    const s = document.createElement('div'); s.className = 'sq';
    const dist = Math.hypot(c - (COLS - 1) / 2, r - (ROWS - 1) / 2);
    s.style.background = pal[Math.floor(dist) % pal.length];
    cell.appendChild(s); grid.appendChild(cell); sq.push({ el: s, dist });
  }
  fx.register({ duration: D, seek(t) {
    const p = t / D;
    for (const { el, dist } of sq) {
      // every square makes two full turns per loop; the phase grows with distance from the centre,
      // so the rotation reads as a ripple spreading outward; scale breathes on the same ripple
      const rot = 720 * p - dist * 40;
      const s = 0.72 + 0.28 * (0.5 + 0.5 * Math.sin(2 * Math.PI * (2 * p) - dist * 0.7));
      gsap.set(el, { rotation: rot, scale: s });
    }
  }});
</script>
