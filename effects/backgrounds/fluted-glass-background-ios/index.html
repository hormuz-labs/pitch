<!doctype html><meta charset="utf-8">
<title>Fluted Glass Background [iOS]</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0a0a0d;display:flex;align-items:center;justify-content:center;perspective:1600px}
  .halo{position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:radial-gradient(circle,rgba(120,90,255,.35),transparent 60%);filter:blur(30px)}
  .phone{position:relative;width:340px;height:700px;border-radius:54px;background:#111;box-shadow:0 0 0 2px #2a2a2e,0 0 0 8px #0d0d0f,0 40px 80px rgba(0,0,0,.6);overflow:hidden;will-change:transform;transform-style:preserve-3d}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .island{position:absolute;left:50%;top:18px;width:110px;height:32px;margin-left:-55px;border-radius:20px;background:#000}
  .lock{position:absolute;left:0;right:0;top:82px;text-align:center;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.35)}
  .lock .d{font-size:16px;font-weight:500;letter-spacing:.02em;opacity:.9}
  .lock .t{font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;font-size:82px;font-weight:500;letter-spacing:-.03em;line-height:1}
  .notif{position:absolute;left:14px;right:14px;top:262px;padding:14px 16px;border-radius:22px;background:rgba(255,255,255,.22);backdrop-filter:blur(20px);color:#fff;display:flex;gap:12px;align-items:center;will-change:transform,opacity}
  .notif .ic{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#ff7a59,#ff3d7f);flex:none}
  .notif b{display:block;font-size:14px}.notif span{font-size:13px;opacity:.85}
  .bar{position:absolute;left:50%;bottom:10px;width:120px;height:5px;margin-left:-60px;border-radius:3px;background:rgba(255,255,255,.85)}
  .ctrl{position:absolute;bottom:34px;left:34px;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(10px)}
  .ctrl.r{left:auto;right:34px}
</style>
<div class="stage">
  <div class="halo"></div>
  <div class="phone" id="phone">
    <canvas id="c" width="340" height="700"></canvas>
    <div class="island"></div>
    <div class="lock"><div class="d">Tuesday, 14 May</div><div class="t">9:41</div></div>
    <div class="notif" id="notif"><div class="ic"></div><div><b>Acme</b><span>Your order is on its way</span></div></div>
    <div class="ctrl"></div><div class="ctrl r"></div>
    <div class="bar"></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 5, W = 340, H = 700;
  const out = document.getElementById('c').getContext('2d');
  const src = document.createElement('canvas'); src.width = W; src.height = H; const sc = src.getContext('2d');
  const blobs = [
    { c: '#ff6a3d', r: 260, cx: .3, cy: .3, rx: .25, ry: .18, k: 1, p: 0 },
    { c: '#7b5cff', r: 300, cx: .7, cy: .55, rx: .22, ry: .22, k: 1, p: 2.1 },
    { c: '#2fd4ff', r: 220, cx: .4, cy: .8, rx: .3, ry: .12, k: 2, p: 4.0 },
    { c: '#ffd23f', r: 180, cx: .8, cy: .2, rx: .15, ry: .2, k: 2, p: 1.0 },
  ];
  const RIB = 22;      // rib width in px
  function drawSource(t) {
    sc.fillStyle = '#1b1035'; sc.fillRect(0, 0, W, H);
    for (const b of blobs) {
      const a = 2 * Math.PI * b.k * t / D + b.p;
      const x = (b.cx + b.rx * Math.cos(a)) * W, y = (b.cy + b.ry * Math.sin(a)) * H;
      const g = sc.createRadialGradient(x, y, 0, x, y, b.r);
      g.addColorStop(0, b.c); g.addColorStop(1, b.c + '00');
      sc.fillStyle = g; sc.fillRect(0, 0, W, H);
    }
  }
  fx.register({ duration: D, seek(t) {
    drawSource(t);
    out.clearRect(0, 0, W, H);
    // fluted glass: each rib is a cylindrical lens, so the source is stretched across the rib and
    // offset by a sawtooth; the ribs themselves slide slowly (one rib per loop => seamless)
    const shift = (t / D) * RIB;
    for (let x = 0; x < W; x++) {
      const u = (((x + shift) % RIB) + RIB) % RIB / RIB - 0.5;   // -0.5..0.5 across the rib
      const lens = Math.sign(u) * Math.pow(Math.abs(u) * 2, 1.6) * 0.5; // barrel refraction
      const sx = Math.max(0, Math.min(W - 1, x + lens * 34));
      out.drawImage(src, sx, 0, 1, H, x, 0, 1, H);
    }
    // specular highlight + shadow edge on every rib
    for (let x = -RIB; x < W + RIB; x += RIB) {
      const r0 = x - (shift % RIB);
      const g = out.createLinearGradient(r0, 0, r0 + RIB, 0);
      g.addColorStop(0, 'rgba(0,0,0,.28)'); g.addColorStop(.25, 'rgba(255,255,255,.22)'); g.addColorStop(.45, 'rgba(255,255,255,.04)'); g.addColorStop(.85, 'rgba(0,0,0,.05)'); g.addColorStop(1, 'rgba(0,0,0,.28)');
      out.fillStyle = g; out.fillRect(r0, 0, RIB, H);
    }
  }});
  // the DOM layer: the phone turns gently, a notification lands and leaves within the loop
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#phone', { rotationY: -14, rotationX: 4 }, { rotationY: 14, rotationX: -4, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  tl.fromTo('#notif', { y: -40, opacity: 0, scale: .92 }, { y: 0, opacity: 1, scale: 1, duration: .7, ease: 'expo.out' }, .8)
    .to('#notif', { y: -30, opacity: 0, duration: .45, ease: 'power3.in' }, 3.9);
  const base = window.__fx.seek; window.__fx.seek = (t) => { base(t); tl.seek(t, false); };
</script>
