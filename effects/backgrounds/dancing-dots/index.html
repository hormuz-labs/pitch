<!doctype html><meta charset="utf-8">
<title>Dancing Dots</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#14121a}
  .floor{position:absolute;left:0;right:0;top:470px;height:1px;background:rgba(255,255,255,.12)}
  .row{position:absolute;left:0;right:0;top:0;bottom:0}
  .dot{position:absolute;width:84px;height:84px;border-radius:50%;top:386px;will-change:transform;transform-origin:50% 100%}
  .sh{position:absolute;width:84px;height:18px;border-radius:50%;top:462px;background:rgba(0,0,0,.6);filter:blur(4px);will-change:transform}
</style>
<div class="stage"><div class="floor"></div><div class="row" id="row"></div></div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 4, N = 9, colors = ['#ff5a36', '#ffd23f', '#3ddc97', '#4f8cff', '#ff5a36', '#ffd23f', '#3ddc97', '#4f8cff', '#ff5a36'];
  const row = document.getElementById('row'), dots = [], shs = [];
  const gap = 118, x0 = 640 - (N - 1) * gap / 2 - 42;
  for (let i = 0; i < N; i++) {
    const s = document.createElement('div'); s.className = 'sh'; s.style.left = x0 + i * gap + 'px'; row.appendChild(s); shs.push(s);
    const d = document.createElement('div'); d.className = 'dot'; d.style.left = x0 + i * gap + 'px'; d.style.background = colors[i]; row.appendChild(d); dots.push(d);
  }
  // a bounce is a function of phase: airborne on a parabola, squashed on the floor
  function bounce(ph) { // ph in [0,1): 0..0.15 floor contact, rest airborne
    const c = 0.16;
    if (ph < c) { const q = ph / c; const s = Math.sin(q * Math.PI); return { y: 0, sx: 1 + .32 * s, sy: 1 - .38 * s }; }
    const a = (ph - c) / (1 - c); const h = 4 * a * (1 - a);
    const st = Math.min(1, Math.abs(a - .5) * 2.2);
    return { y: -h, sx: 1 - .1 * st, sy: 1 + .16 * st };
  }
  fx.register({ duration: D, seek(t) {
    for (let i = 0; i < N; i++) {
      const per = 1;                                  // one bounce per second, four per loop
      const ph = ((t / per) + i * 0.11) % 1;          // the wave runs down the line
      const amp = 190 + 90 * Math.sin(2 * Math.PI * (t / D) + i * 0.7); // the height pattern swells once per loop
      const b = bounce(ph);
      gsap.set(dots[i], { y: b.y * amp, scaleX: b.sx, scaleY: b.sy });
      const air = -b.y; // 0 on floor .. 1 at apex
      gsap.set(shs[i], { scale: 1 - .45 * air, opacity: 1 - .55 * air });
    }
  }});
</script>
