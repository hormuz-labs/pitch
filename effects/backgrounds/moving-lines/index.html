<!doctype html><meta charset="utf-8">
<title>Moving Lines</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0f172a}
  canvas{position:absolute;inset:0;width:100%;height:100%}
</style>
<div class="stage"><canvas id="c" width="1280" height="720"></canvas></div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 4, W = 1280, H = 720, P = 36, TILT = -0.35; // rad
  const ctx = document.getElementById('c').getContext('2d');
  fx.register({ duration: D, seek(t) {
    const p = t / D;
    ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(TILT);
    const span = Math.hypot(W, H);
    // parallel lines march across by 6 pitches per loop; a compression wave (2 cycles across, 1 per loop)
    // squeezes and releases their spacing as it travels the other way
    const scroll = (p * 6 * P) % P;
    for (let k = -Math.ceil(span / P) - 2; k <= Math.ceil(span / P) + 2; k++) {
      const x0 = k * P + scroll;
      const wave = Math.sin(2 * Math.PI * (2 * x0 / span - p));
      const x = x0 + wave * P * 0.34;
      const thick = 2 + 5 * (0.5 + 0.5 * wave);
      const bright = 0.35 + 0.65 * (0.5 + 0.5 * wave);
      ctx.strokeStyle = `rgba(${Math.round(120 + 135 * bright)},${Math.round(200 * bright + 40)},255,${0.25 + 0.75 * bright})`;
      ctx.lineWidth = thick; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, -span / 2); ctx.lineTo(x, span / 2); ctx.stroke();
    }
    ctx.restore();
  }});
</script>
