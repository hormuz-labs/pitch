<!doctype html><meta charset="utf-8">
<title>Small Waves</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:linear-gradient(180deg,#eef6f8 0%,#d9ecf1 100%)}
  svg{position:absolute;inset:0;width:100%;height:100%}
  .w{fill:none;stroke-linecap:round;will-change:transform}
</style>
<div class="stage"><svg viewBox="0 0 1280 720" id="svg"></svg></div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 10, W = 1280, NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('svg');
  // a calm stack of thin sine lines; each slides whole wavelengths per loop, some left, some right
  const lines = [];
  for (let i = 0; i < 14; i++) {
    const wl = 320 + (i % 4) * 90, amp = 8 + (i % 3) * 4, base = 250 + i * 30;
    const cyc = (i % 3) + 1, dir = i % 2 ? 1 : -1;
    lines.push({ wl, amp, base, cyc, dir, id: 'l' + i, w: 1.5 + (i % 3), op: 0.25 + 0.05 * (i % 5) });
  }
  function wavePath(wl, amp, base) {
    const n = Math.ceil(W / wl) + 3, k = wl / 4, q = 0.5523 * k; let d = `M ${-wl * 2} ${base}`;
    for (let i = 0; i < n; i++) { const x = -wl * 2 + i * wl;
      d += ` C ${x + q} ${base - amp}, ${x + 2 * k - q} ${base - amp}, ${x + 2 * k} ${base}`;
      d += ` C ${x + 2 * k + q} ${base + amp}, ${x + wl - q} ${base + amp}, ${x + wl} ${base}`; }
    return d;
  }
  for (const L of lines) {
    const p = document.createElementNS(NS, 'path'); p.setAttribute('d', wavePath(L.wl, L.amp, L.base));
    p.setAttribute('class', 'w'); p.id = L.id; p.setAttribute('stroke', '#2a6f86'); p.setAttribute('stroke-width', L.w); p.setAttribute('opacity', L.op);
    svg.appendChild(p);
  }
  const tl = fx.timeline({ duration: D });
  for (const L of lines) {
    tl.fromTo('#' + L.id, { x: 0 }, { x: L.dir * L.wl * L.cyc, duration: D, ease: 'none' }, 0);
    // the faintest vertical swell, one cycle per loop
    tl.fromTo('#' + L.id, { y: 0 }, { y: -10 - (L.amp), duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  }
</script>
