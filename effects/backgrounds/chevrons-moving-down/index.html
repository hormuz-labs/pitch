<!doctype html><meta charset="utf-8">
<title>Chevrons Moving Down</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101014}
  svg{position:absolute;inset:0;width:100%;height:100%}
  .col{will-change:transform}
  .fade{position:absolute;inset:0;background:linear-gradient(180deg,#101014 0%,transparent 22%,transparent 78%,#101014 100%)}
</style>
<div class="stage">
  <svg viewBox="0 0 1280 720" id="svg"></svg>
  <div class="fade"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 10, DIR = 'down', W = 1280, H = 720;
  const colors = ['#ff5c35', '#ffffff', '#ffb800'];
  const svg = document.getElementById('svg'), NS = 'http://www.w3.org/2000/svg';
  // five columns of stacked chevrons; the middle ones move faster (integer pitches per loop => seamless)
  const cols = [
    { cx: 140,  w: 200, pitch: 120, speed: 3, sw: 26 },
    { cx: 390,  w: 260, pitch: 150, speed: 4, sw: 34 },
    { cx: 640,  w: 320, pitch: 180, speed: 5, sw: 44 },
    { cx: 890,  w: 260, pitch: 150, speed: 4, sw: 34 },
    { cx: 1140, w: 200, pitch: 120, speed: 3, sw: 26 },
  ];
  cols.forEach((c, ci) => {
    const g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'col'); g.id = 'c' + ci;
    const n = Math.ceil(H / c.pitch) + 8, h = c.w * 0.42;
    for (let i = -4; i < n; i++) {
      const y = i * c.pitch, x0 = c.cx - c.w / 2, x1 = c.cx + c.w / 2;
      const p = document.createElementNS(NS, 'polyline');
      const d = DIR === 'down' ? `${x0},${y} ${c.cx},${y + h} ${x1},${y}` : `${x0},${y + h} ${c.cx},${y} ${x1},${y + h}`;
      p.setAttribute('points', d);
      p.setAttribute('fill', 'none'); p.setAttribute('stroke', colors[((i % 3) + 3) % 3]);
      p.setAttribute('stroke-width', c.sw); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round');
      p.setAttribute('opacity', ci === 2 ? 1 : ci === 1 || ci === 3 ? .8 : .55);
      g.appendChild(p);
    }
    svg.appendChild(g);
  });
  const tl = fx.timeline({ duration: D });
  cols.forEach((c, ci) => {
    const dist = c.pitch * c.speed * (DIR === 'down' ? 1 : -1);
    tl.fromTo('#c' + ci, { y: 0 }, { y: dist, duration: D, ease: 'none' }, 0);
  });
  // a slow lateral sway, one full cycle per loop, so the field is never purely mechanical
  tl.fromTo('#svg', { x: -14 }, { x: 14, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
</script>
