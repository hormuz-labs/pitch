<!doctype html><meta charset="utf-8">
<title>Gradient Background</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#1a1030}
  .field{position:absolute;inset:-20%;will-change:filter}
  .blob{position:absolute;width:900px;height:900px;border-radius:50%;filter:blur(90px);opacity:.9;will-change:transform}
  .b1{background:#ff4f81;left:0;top:-10%}.b2{background:#ffb347;right:-5%;top:10%}.b3{background:#3f7cff;left:25%;bottom:-15%}.b4{background:#33e0c8;right:20%;bottom:0}
  .grain{position:absolute;inset:0;opacity:.06;background:repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
</style>
<div class="stage">
  <div class="field" id="field">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  </div>
  <div class="grain"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 10;
  const tl = fx.timeline({ duration: D });
  // every blob drifts on its own closed orbit (integer cycles per loop)
  [['.b1', 260, 140, 1], ['.b2', 220, 200, 1], ['.b3', 300, 120, 2], ['.b4', 180, 220, 1]].forEach(([s, rx, ry, k]) => {
    tl.fromTo(s, { x: 0 }, { x: rx * 2, duration: D / (2 * k), ease: 'sine.inOut', yoyo: true, repeat: 2 * k - 1 }, 0);
    tl.fromTo(s, { y: -ry }, { y: ry, duration: D / (2 * k), ease: 'sine.inOut', yoyo: true, repeat: 2 * k - 1 }, D / (4 * k));
    tl.fromTo(s, { y: -ry }, { y: 0, duration: D / (4 * k), ease: 'sine.in' }, 0); // lead-in so the y orbit starts on the loop boundary
  });
  // and the whole palette walks around the hue wheel, one full turn per loop, so the loop closes
  tl.fromTo('#field', { filter: 'hue-rotate(0deg)' }, { filter: 'hue-rotate(360deg)', duration: D, ease: 'none' }, 0);
</script>
