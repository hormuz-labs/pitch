<!doctype html><meta charset="utf-8">
<title>Halftone Effect</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f2ead8}
  canvas{position:absolute;inset:0;width:100%;height:100%}
</style>
<div class="stage"><canvas id="c" width="1280" height="720"></canvas></div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 4, W = 1280, H = 720, CELL = 14;
  const out = document.getElementById('c').getContext('2d');
  const cols = Math.ceil(W / CELL) + 2, rows = Math.ceil(H / CELL) + 2;
  const src = document.createElement('canvas'); src.width = cols; src.height = rows; const sc = src.getContext('2d');
  // the source picture: a sun that rides across, a big word, a horizon gradient — drawn at grid resolution
  function drawSource(t) {
    const p = t / D, k = CELL;
    sc.fillStyle = '#fff'; sc.fillRect(0, 0, cols, rows);
    const gy = sc.createLinearGradient(0, 0, 0, rows); gy.addColorStop(0, '#fff'); gy.addColorStop(1, '#333');
    sc.fillStyle = gy; sc.fillRect(0, 0, cols, rows);
    const sx = (0.15 + 0.7 * (0.5 - 0.5 * Math.cos(2 * Math.PI * p))) * cols;   // sun swings across and back
    const sy = rows * (0.42 - 0.18 * Math.sin(Math.PI * (0.5 - 0.5 * Math.cos(2 * Math.PI * p))));
    const r = rows * 0.34;
    const g = sc.createRadialGradient(sx - r * .3, sy - r * .3, r * .05, sx, sy, r);
    g.addColorStop(0, '#000'); g.addColorStop(.6, '#444'); g.addColorStop(1, '#ddd');
    sc.fillStyle = g; sc.beginPath(); sc.arc(sx, sy, r, 0, Math.PI * 2); sc.fill();
    sc.fillStyle = '#000'; sc.font = `500 ${rows * 0.36}px "Sharp Grotesk","Atlas Grotesk",sans-serif`; sc.textAlign = 'center'; sc.textBaseline = 'alphabetic';
    sc.fillText('RETRO', cols / 2, rows * 0.93);
  }
  fx.wait(document.fonts.load('500 40px "Sharp Grotesk"'));
  fx.register({ duration: D, seek(t) {
    drawSource(t);
    const d = sc.getImageData(0, 0, cols, rows).data;
    out.fillStyle = '#f2ead8'; out.fillRect(0, 0, W, H);
    out.fillStyle = '#1b1b24';
    // the dot screen rotates a little and breathes, one cycle per loop, print-style
    const ang = 0.26 + 0.06 * Math.sin(2 * Math.PI * t / D), ca = Math.cos(ang), sa = Math.sin(ang);
    const gain = 1 + 0.12 * Math.sin(2 * Math.PI * t / D + 1);
    out.beginPath();
    // the dot screen is rotated, the picture is not: walk a rotated lattice and sample the source upright
    const R = Math.ceil(Math.hypot(W, H) / 2 / CELL) + 1;
    for (let j = -R; j <= R; j++) for (let i = -R; i <= R; i++) {
      const gx = i * CELL, gy = j * CELL;
      const x = W / 2 + gx * ca - gy * sa, y = H / 2 + gx * sa + gy * ca;
      if (x < -CELL || x > W + CELL || y < -CELL || y > H + CELL) continue;
      const si = Math.max(0, Math.min(cols - 1, Math.round(x / CELL))), sj = Math.max(0, Math.min(rows - 1, Math.round(y / CELL)));
      const lum = d[(sj * cols + si) * 4] / 255;
      const rad = (1 - lum) * CELL * 0.62 * gain; if (rad < 0.4) continue;
      out.moveTo(x + rad, y); out.arc(x, y, rad, 0, Math.PI * 2);
    }
    out.fill();
  }});
</script>
