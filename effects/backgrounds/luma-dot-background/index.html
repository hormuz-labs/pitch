<!doctype html><meta charset="utf-8">
<title>Luma Dot Background</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#07080c}
  canvas{position:absolute;inset:0;width:100%;height:100%}
</style>
<div class="stage"><canvas id="c" width="1280" height="720"></canvas></div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 8, W = 1280, H = 720, CELL = 16;
  const out = document.getElementById('c').getContext('2d');
  const cols = Math.ceil(W / CELL), rows = Math.ceil(H / CELL);
  const src = document.createElement('canvas'); src.width = cols; src.height = rows; const sc = src.getContext('2d');
  // the picture is drawn, not loaded: file:// images taint the canvas and block getImageData.
  // three aurora ribbons ripple across a night sky; a roaming light lifts the brightness where it passes
  function drawSource(t) {
    const p = t / D;
    sc.fillStyle = '#04060c'; sc.fillRect(0, 0, cols, rows);
    const ribbons = [
      { col: ['rgba(90,255,190,0)', 'rgba(90,255,190,.9)', 'rgba(90,255,190,0)'], y: .35, amp: .12, k: 1, ph: 0, w: .22 },
      { col: ['rgba(120,140,255,0)', 'rgba(120,140,255,.85)', 'rgba(120,140,255,0)'], y: .55, amp: .10, k: 2, ph: 2, w: .18 },
      { col: ['rgba(255,110,200,0)', 'rgba(255,110,200,.7)', 'rgba(255,110,200,0)'], y: .72, amp: .08, k: 1, ph: 4, w: .14 },
    ];
    for (const R of ribbons) {
      for (let x = 0; x <= cols; x++) {
        const u = x / cols;
        const yc = rows * (R.y + R.amp * Math.sin(2 * Math.PI * (u * 1.5 - R.k * p) + R.ph) + 0.04 * Math.sin(2 * Math.PI * (u * 4 + p * 2)));
        const h = rows * R.w * (0.7 + 0.3 * Math.sin(2 * Math.PI * (u * 2 + p) + R.ph));
        const g = sc.createLinearGradient(0, yc - h, 0, yc + h);
        g.addColorStop(0, R.col[0]); g.addColorStop(.5, R.col[1]); g.addColorStop(1, R.col[2]);
        sc.fillStyle = g; sc.fillRect(x, yc - h, 1, h * 2);
      }
    }
    const lx = cols * (0.5 + 0.38 * Math.cos(2 * Math.PI * p)), ly = rows * (0.5 + 0.32 * Math.sin(4 * Math.PI * p));
    const g = sc.createRadialGradient(lx, ly, 0, lx, ly, rows * 0.45);
    g.addColorStop(0, 'rgba(255,255,255,.75)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    sc.fillStyle = g; sc.fillRect(0, 0, cols, rows);
  }
  fx.register({ duration: D, seek(t) {
    drawSource(t);
    const d = sc.getImageData(0, 0, cols, rows).data;
    out.fillStyle = '#07080c'; out.fillRect(0, 0, W, H);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const k = (j * cols + i) * 4, r = d[k], g = d[k + 1], b = d[k + 2];
      const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
      const rad = Math.pow(lum, 1.3) * CELL * 0.58; if (rad < 0.5) continue;
      out.fillStyle = `rgb(${Math.min(255, r + 40)},${Math.min(255, g + 40)},${Math.min(255, b + 40)})`;
      out.beginPath(); out.arc(i * CELL + CELL / 2, j * CELL + CELL / 2, rad, 0, Math.PI * 2); out.fill();
    }
  }});
</script>
