<!doctype html><meta charset="utf-8">
<title>Rotating Crosses</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f5f1ea}
  .grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(6,1fr);padding:30px 40px}
  .cell{display:flex;align-items:center;justify-content:center}
  .x{position:relative;width:64px;height:64px;will-change:transform}
  .x::before,.x::after{content:"";position:absolute;background:#141418;border-radius:4px}
  .x::before{left:50%;top:0;width:14px;height:100%;margin-left:-7px}
  .x::after{top:50%;left:0;height:14px;width:100%;margin-top:-7px}
  .x.a::before,.x.a::after{background:#ff4d1c}
</style>
<div class="stage"><div class="grid" id="grid"></div></div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const COLS = 10, ROWS = 6, grid = document.getElementById('grid');
  const tl = fx.timeline({ duration: 1 });
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const cell = document.createElement('div'); cell.className = 'cell';
    const x = document.createElement('div'); x.className = 'x' + (((r + c) % 4 === 0) ? ' a' : ''); cell.appendChild(x); grid.appendChild(cell);
    // checkerboard: neighbours turn opposite ways; a quarter turn snaps in, then the pattern is identical => clean 1s loop
    const dir = (r + c) % 2 ? 1 : -1;
    const delay = ((r + c) / (ROWS + COLS - 2)) * 0.35;
    tl.fromTo(x, { rotation: 0 }, { rotation: 90 * dir, duration: 0.55, ease: 'expo.inOut' }, delay);
    tl.fromTo(x, { scale: 1 }, { scale: 0.8, duration: 0.27, ease: 'sine.inOut', yoyo: true, repeat: 1 }, delay);
  }
</script>
