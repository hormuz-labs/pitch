<!doctype html><meta charset="utf-8">
<title>Gradient Noisy Blur</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#2b1712}
  .blob{position:absolute;width:820px;height:820px;border-radius:50%;filter:blur(110px);will-change:transform}
  .b1{background:#ff8a3d;left:-10%;top:-30%}.b2{background:#ff3d6e;right:-10%;top:-10%;opacity:.85}.b3{background:#ffd27a;left:20%;bottom:-40%}.b4{background:#7a2e4b;right:15%;bottom:-30%}
  svg{position:absolute;inset:0;width:100%;height:100%}
  .grain{position:absolute;inset:0;mix-blend-mode:soft-light;opacity:.9}
  .grain2{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.35}
  .vig{position:absolute;inset:0;background:radial-gradient(110% 80% at 50% 50%,transparent 50%,rgba(40,10,0,.6) 100%)}
</style>
<div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <svg class="grain"><filter id="n"><feTurbulence id="tb" type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="1" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="1.4" intercept="-.2"/></feComponentTransfer></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <svg class="grain2"><filter id="n2"><feTurbulence id="tb2" type="fractalNoise" baseFrequency="0.35" numOctaves="1" seed="9" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n2)"/></svg>
  <div class="vig"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 4;
  const tl = fx.timeline({ duration: D });
  // the warm blobs breathe and swap places on closed orbits
  tl.fromTo('.b1', { x: 0, y: 0 }, { x: 220, y: 120, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  tl.fromTo('.b2', { x: 0, y: 0 }, { x: -260, y: 140, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  tl.fromTo('.b3', { x: 0, scale: 1 }, { x: 200, scale: 1.25, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  tl.fromTo('.b4', { y: 0, scale: 1 }, { y: -180, scale: .85, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  // film grain: a fresh noise seed every frame, and a slow drift of the coarse noise
  const tb = document.getElementById('tb'), tb2 = document.getElementById('tb2');
  const base = window.__fx.seek;
  window.__fx.seek = (t) => { base(t); tb.setAttribute('seed', String(1 + Math.floor(t * 30) % 120)); tb2.setAttribute('seed', String(9 + Math.floor(t * 6) % 24)); };
</script>
