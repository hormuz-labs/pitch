<!doctype html><meta charset="utf-8">
<title>Color Cards: Scale</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#fafafa;font-family:"Atlas Grotesk",sans-serif}
  .grid{position:absolute;left:90px;right:90px;top:120px;bottom:120px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:18px}
  .card{border-radius:24px;position:relative;will-change:transform;box-shadow:0 20px 40px -18px rgba(0,0,0,.3)}
  .card .n{position:absolute;left:22px;bottom:44px;font-family:"Sharp Grotesk",sans-serif;font-size:26px;font-weight:500;letter-spacing:-.02em;color:#fff;line-height:1}
  .card .h{position:absolute;left:22px;bottom:20px;font-size:13px;letter-spacing:.1em;color:rgba(255,255,255,.8)}
  .card.light .n{color:#111}.card.light .h{color:rgba(0,0,0,.6)}
  .card .sw{position:absolute;right:20px;top:20px;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.35);backdrop-filter:blur(4px)}
  .cap{position:absolute;left:90px;top:56px;font-family:"Sharp Grotesk",sans-serif;font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:#111}
  .cap b{font-weight:500;color:#888;margin-left:14px}
</style>
<div class="stage">
  <div class="cap">Acme <b>Color system</b></div>
  <div class="grid">
    <div class="card" style="background:#0d1b2a"><div class="sw"></div><div class="n">Midnight</div><div class="h">#0D1B2A</div></div>
    <div class="card" style="background:#1b4965"><div class="sw"></div><div class="n">Harbor</div><div class="h">#1B4965</div></div>
    <div class="card" style="background:#5fa8d3"><div class="sw"></div><div class="n">Glacier</div><div class="h">#5FA8D3</div></div>
    <div class="card light" style="background:#cae9ff"><div class="sw"></div><div class="n">Frost</div><div class="h">#CAE9FF</div></div>
    <div class="card" style="background:#ff6b35"><div class="sw"></div><div class="n">Ember</div><div class="h">#FF6B35</div></div>
    <div class="card light" style="background:#f7c59f"><div class="sw"></div><div class="n">Peach</div><div class="h">#F7C59F</div></div>
    <div class="card light" style="background:#efefd0"><div class="sw"></div><div class="n">Bone</div><div class="h">#EFEFD0</div></div>
    <div class="card" style="background:#004e89"><div class="sw"></div><div class="n">Cobalt</div><div class="h">#004E89</div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 6 });
  const cards = gsap.utils.toArray('.card');
  tl.from('.cap', { y: -14, opacity: 0, duration: 0.5, ease: 'expo.out' }, 0);
  // cards grow into view from a point, with overshoot, radiating from the top-left
  tl.from(cards, { scale: 0, rotate: -8, duration: 0.9, ease: 'back.out(1.7)', stagger: { each: 0.09, grid: [2, 4], from: 'start' } }, 0.1);
  tl.from('.card .n, .card .h', { y: 12, opacity: 0, duration: 0.5, ease: 'expo.out', stagger: 0.04 }, 0.6);
  tl.from('.card .sw', { scale: 0, duration: 0.5, ease: 'back.out(2)', stagger: 0.06 }, 0.7);
  // a scale ripple runs across the grid: each card pops slightly larger in turn
  tl.to(cards, { scale: 1.08, duration: 0.3, ease: 'power2.out', stagger: { each: 0.08, grid: [2, 4], from: 'center' } }, 2.4)
    .to(cards, { scale: 1, duration: 0.5, ease: 'elastic.out(1,0.5)', stagger: { each: 0.08, grid: [2, 4], from: 'center' } }, 2.7);
  // exit: shrink back to the point, from the far end
  tl.to(cards, { scale: 0, rotate: 6, duration: 0.5, ease: 'back.in(1.5)', stagger: { each: 0.06, grid: [2, 4], from: 'end' } }, 5.0);
  tl.to('.cap', { y: -14, opacity: 0, duration: 0.3 }, 5.6);
</script>
