<!doctype html><meta charset="utf-8">
<title>Color Cards: Cascade</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#f4f2ee;font-family:"Atlas Grotesk",sans-serif;perspective:1400px}
  .title{position:absolute;left:80px;top:60px;font-family:"Sharp Grotesk",sans-serif;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:#1b1b1b}
  .deck{position:absolute;left:80px;right:80px;top:140px;bottom:80px;display:flex;gap:18px}
  .card{flex:1;border-radius:22px;position:relative;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);will-change:transform;transform-origin:50% 0}
  .card .n{position:absolute;left:24px;bottom:56px;font-family:"Sharp Grotesk",sans-serif;font-size:30px;font-weight:500;letter-spacing:-.02em;color:#fff;line-height:1}
  .card .h{position:absolute;left:24px;bottom:26px;font-size:15px;letter-spacing:.08em;color:rgba(255,255,255,.8)}
  .card .i{position:absolute;left:24px;top:24px;width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.85)}
  .card.light .n{color:#1b1b1b}.card.light .h{color:rgba(0,0,0,.6)}.card.light .i{border-color:#1b1b1b}
</style>
<div class="stage">
  <div class="title">Northwind / Palette 01</div>
  <div class="deck">
    <div class="card" style="background:#0f3d3e"><div class="i"></div><div class="n">Deep Teal</div><div class="h">#0F3D3E</div></div>
    <div class="card" style="background:#e0a458"><div class="i"></div><div class="n">Amber</div><div class="h">#E0A458</div></div>
    <div class="card" style="background:#c8553d"><div class="i"></div><div class="n">Terracotta</div><div class="h">#C8553D</div></div>
    <div class="card light" style="background:#f5e6cc"><div class="i"></div><div class="n">Linen</div><div class="h">#F5E6CC</div></div>
    <div class="card" style="background:#2b2b2b"><div class="i"></div><div class="n">Charcoal</div><div class="h">#2B2B2B</div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 6 });
  const cards = gsap.utils.toArray('.card');
  tl.from('.title', { y: -16, opacity: 0, duration: 0.5, ease: 'expo.out' }, 0);
  // each card drops from above in sequence, tilting back as it falls, and lands with a soft bounce
  cards.forEach((c, i) => {
    const t = 0.1 + i * 0.22;
    tl.fromTo(c, { y: -820, rotateX: -35, rotateZ: -6 + i * 3 }, { y: 0, rotateX: 0, rotateZ: 0, duration: 1.0, ease: 'move' }, t)
      .fromTo(c, { scaleY: 1 }, { scaleY: 0.94, duration: 0.12, ease: 'power2.out', yoyo: true, repeat: 1 }, t + 0.72)
      .from([c.querySelector('.n'), c.querySelector('.h')], { y: 18, opacity: 0, duration: 0.5, ease: 'expo.out', stagger: 0.08 }, t + 0.8);
  });
  // settled hold with a slow breathing lift
  tl.to(cards, { y: -10, duration: 1.2, ease: 'sine.inOut', stagger: 0.1, yoyo: true, repeat: 1 }, 2.4);
  // exit: cascade off the bottom the same order
  tl.to(cards, { y: 900, rotateX: 25, duration: 0.6, ease: 'power3.in', stagger: 0.1 }, 5.05);
  tl.to('.title', { y: -16, opacity: 0, duration: 0.3 }, 5.55);
</script>
