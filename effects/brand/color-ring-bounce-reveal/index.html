<!doctype html><meta charset="utf-8">
<title>Color Ring: Bounce Reveal</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#12121a;font-family:"Atlas Grotesk",sans-serif}
  .ring{position:absolute;left:50%;top:50%;width:0;height:0;will-change:transform}
  .orb{position:absolute;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:50%;will-change:transform;box-shadow:0 20px 40px -14px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
  .orb b{font-family:"Sharp Grotesk",sans-serif;font-size:13px;letter-spacing:.1em;color:rgba(255,255,255,.9);text-transform:uppercase;font-weight:500}
  .orb.light b{color:#111}
  .track{position:absolute;left:50%;top:50%;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;border:2px dashed rgba(255,255,255,.18)}
  .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff}
  .center .t{font-family:"Sharp Grotesk",sans-serif;font-size:60px;font-weight:500;letter-spacing:-.04em;line-height:1}
  .center .s{font-size:15px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;margin-top:12px}
  .center .t,.center .s{will-change:transform}
</style>
<div class="stage">
  <div class="track"></div>
  <div class="center"><div class="t">Acme</div><div class="s">Brand colors</div></div>
  <div class="ring">
    <div class="orb" style="background:#ff4757"><b>Cherry</b></div>
    <div class="orb" style="background:#ff7f50"><b>Coral</b></div>
    <div class="orb light" style="background:#ffd32a"><b>Lemon</b></div>
    <div class="orb" style="background:#2ed573"><b>Lime</b></div>
    <div class="orb" style="background:#1e90ff"><b>Sky</b></div>
    <div class="orb" style="background:#5352ed"><b>Indigo</b></div>
    <div class="orb" style="background:#b53471"><b>Plum</b></div>
    <div class="orb light" style="background:#f1f2f6"><b>Cloud</b></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 6 });
  const orbs = gsap.utils.toArray('.orb');
  const R = 220, N = orbs.length;
  orbs.forEach((o, i) => { const a = -Math.PI / 2 + (i / N) * Math.PI * 2; gsap.set(o, { x: Math.cos(a) * R, y: Math.sin(a) * R }); });
  tl.from('.track', { scale: 0, opacity: 0, duration: 0.9, ease: 'expo.out' }, 0);
  tl.from('.center .t', { scale: 0.6, opacity: 0, duration: 0.7, ease: 'back.out(2)' }, 0.1);
  tl.from('.center .s', { y: 10, opacity: 0, duration: 0.5 }, 0.35);
  // orbs bounce in around the ring: each drops from scale 0 with a bounce, clockwise
  orbs.forEach((o, i) => {
    const t = 0.25 + i * 0.14;
    tl.from(o, { scale: 0, duration: 0.9, ease: 'bounce.out' }, t);
    tl.from(o.querySelector('b'), { opacity: 0, scale: 0.5, duration: 0.4, ease: 'back.out(2)' }, t + 0.35);
  });
  // the whole ring turns a step, then springs back, then keeps a slow drift
  tl.to('.ring', { rotate: 45, duration: 0.8, ease: 'back.out(1.6)' }, 2.1);
  tl.to(orbs, { rotate: -45, duration: 0.8, ease: 'back.out(1.6)' }, 2.1);   // keep labels upright
  tl.to('.ring', { rotate: 90, duration: 2.4, ease: 'sine.inOut' }, 3.0);
  tl.to(orbs, { rotate: -90, duration: 2.4, ease: 'sine.inOut' }, 3.0);
  // a pulse bounce runs round the ring
  tl.to(orbs, { scale: 1.3, duration: 0.2, ease: 'power2.out', stagger: 0.09 }, 3.2)
    .to(orbs, { scale: 1, duration: 0.7, ease: 'bounce.out', stagger: 0.09 }, 3.4);
  tl.to('.center .t', { scale: 1.12, duration: 0.2, ease: 'power2.out' }, 3.2).to('.center .t', { scale: 1, duration: 0.7, ease: 'bounce.out' }, 3.4);
  // exit: orbs shrink away counter-clockwise, ring and title fall out
  tl.to(orbs.slice().reverse(), { scale: 0, duration: 0.3, ease: 'back.in(2)', stagger: 0.05 }, 5.15);
  tl.to('.track', { scale: 0, opacity: 0, duration: 0.4, ease: 'power3.in' }, 5.5);
  tl.to('.center', { scale: 0.7, opacity: 0, duration: 0.35, ease: 'power3.in' }, 5.6);
</script>
