<!doctype html><meta charset="utf-8">
<title>The Edit: Collection Teaser</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#050505;font-family:"Sorts Mill Goudy",serif;color:#f3efe6}
  .img{position:absolute;inset:0;overflow:hidden}
  .img video{position:absolute;left:50%;top:50%;width:200%;height:100%;object-fit:cover;transform:translate(-50%,-50%);filter:saturate(.35) contrast(1.15) brightness(.7);will-change:transform}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 20%,rgba(0,0,0,.85) 80%)}
  .curtain{position:absolute;top:0;bottom:0;background:#050505;width:50%}
  .curtain.l{left:0;transform-origin:left}.curtain.r{right:0;transform-origin:right}
  .frame{position:absolute;left:120px;right:120px;top:300px;bottom:300px;border:1px solid rgba(243,239,230,.35)}
  .frame i{position:absolute;background:rgba(243,239,230,.6)}
  .eyebrow{position:absolute;left:0;right:0;top:400px;text-align:center;font-family:"Atlas Grotesk",sans-serif;font-size:24px;letter-spacing:.5em;text-transform:uppercase;opacity:.75}
  .title{position:absolute;left:0;right:0;top:800px;text-align:center;font-size:170px;line-height:.95;letter-spacing:.02em}
  .title .l{display:block;overflow:hidden;padding:0 20px}
  .title .l span{display:block;will-change:transform}
  .title em{font-style:italic}
  .rule{position:absolute;left:50%;top:1170px;width:220px;height:1px;background:rgba(243,239,230,.7);margin-left:-110px;transform:scaleX(0)}
  .date{position:absolute;left:0;right:0;top:1230px;text-align:center;font-family:"Atlas Grotesk",sans-serif;font-size:30px;letter-spacing:.35em;text-transform:uppercase}
  .brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;font-family:"Sharp Grotesk",sans-serif;font-size:28px;letter-spacing:.45em;text-transform:uppercase;opacity:.8}
</style>
<div class="stage">
  <div class="img"><video muted playsinline preload="auto" src="../../../assets/backgrounds/drift-ember.mp4"></video><div class="vig"></div></div>
  <div class="frame"><i style="left:-1px;top:-1px;width:1px;height:0" class="e1"></i></div>
  <div class="eyebrow">Introducing</div>
  <div class="title"><span class="l"><span>The <em>Autumn</em></span></span><span class="l"><span>Collection</span></span></div>
  <div class="rule"></div>
  <div class="date">Arriving 10 · 12</div>
  <div class="brand">Northwind</div>
  <div class="curtain l"></div><div class="curtain r"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const v = document.querySelector('video');
  fx.wait(new Promise(r => { if (v.readyState >= 2) r(); else v.addEventListener('loadeddata', r, { once: true }); }));
  const tl = fx.timeline({ duration: 4 });
  tl.to({}, { duration: 4, onUpdate() { v.currentTime = (this.progress() * 4 * 0.6 + 3) % (v.duration || 16); } }, 0);
  // slow build: the image creeps in scale for the whole loop
  tl.fromTo(v, { scale: 1.25, xPercent: -50, yPercent: -50 }, { scale: 1.05, duration: 4, ease: 'none' }, 0);
  // curtains part slowly, then the frame draws itself
  tl.to('.curtain.l', { scaleX: 0, duration: 1.5, ease: 'expo.inOut' }, 0.1);
  tl.to('.curtain.r', { scaleX: 0, duration: 1.5, ease: 'expo.inOut' }, 0.1);
  tl.from('.frame', { scale: 1.08, opacity: 0, duration: 1.4, ease: 'power2.out' }, 0.7);
  // type: eyebrow tracks open, title rises out of its masks, rule draws, date fades
  tl.from('.eyebrow', { letterSpacing: '1.4em', opacity: 0, duration: 1.4, ease: 'power3.out' }, 0.9);
  tl.from('.title .l span', { yPercent: 105, duration: 1.2, ease: 'expo.out', stagger: 0.18 }, 1.35);
  tl.to('.rule', { scaleX: 1, duration: 0.8, ease: 'expo.out' }, 2.1);
  tl.from('.date', { opacity: 0, y: 14, duration: 0.8, ease: 'power2.out' }, 2.35);
  tl.from('.brand', { opacity: 0, duration: 1 }, 2.5);
  // dramatic close: everything dims and the curtains sweep shut for the loop
  tl.to('.title .l span', { yPercent: -105, duration: 0.5, ease: 'power3.in', stagger: 0.08 }, 3.35);
  tl.to(['.eyebrow', '.date', '.rule', '.brand', '.frame'], { opacity: 0, duration: 0.4 }, 3.45);
  tl.to('.curtain.l, .curtain.r', { scaleX: 1, duration: 0.45, ease: 'expo.in' }, 3.55);
</script>
