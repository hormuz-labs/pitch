<!doctype html><meta charset="utf-8">
<title>The Edit: Fragrance Promo</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#07060a;font-family:"Sorts Mill Goudy",serif;color:#efe6d8}
  .bgv{position:absolute;left:50%;top:50%;width:200%;height:100%;object-fit:cover;transform:translate(-50%,-50%);filter:blur(30px) saturate(.6) brightness(.45);will-change:transform}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,0) 10%,rgba(0,0,0,.9) 75%)}
  .cut{position:absolute;inset:0;opacity:0}
  /* the bottle, in DOM */
  .bottle{position:absolute;left:50%;top:50%;width:360px;height:560px;margin:-260px 0 0 -180px;will-change:transform;transform-style:preserve-3d}
  .cap{position:absolute;left:50%;top:-120px;width:120px;height:150px;margin-left:-60px;border-radius:14px;background:linear-gradient(90deg,#2a2320,#6b5a4a 40%,#c9b08e 55%,#5a4a3a 75%,#241d19)}
  .neck{position:absolute;left:50%;top:0;width:90px;height:40px;margin-left:-45px;background:linear-gradient(90deg,#3a2a30,#8a6c72,#3a2a30)}
  .glass{position:absolute;left:0;top:30px;right:0;bottom:0;border-radius:30px 30px 46px 46px;background:linear-gradient(180deg,rgba(255,200,170,.18),rgba(120,40,70,.55) 40%,rgba(50,10,30,.9));box-shadow:inset 0 0 60px rgba(255,255,255,.08),inset 12px 0 30px rgba(255,255,255,.12),inset -12px 0 30px rgba(0,0,0,.4),0 60px 120px -30px rgba(0,0,0,.9);overflow:hidden}
  .glass .liquid{position:absolute;left:0;right:0;bottom:0;height:70%;background:linear-gradient(180deg,rgba(200,60,110,.55),rgba(90,10,50,.95))}
  .glass .sheen{position:absolute;top:-20%;bottom:-20%;width:90px;left:-120px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(255,255,255,0));transform:skewX(-14deg);will-change:transform}
  .glass .lab{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);text-align:center}
  .glass .lab b{display:block;font-weight:400;font-size:34px;letter-spacing:.3em;text-transform:uppercase}
  .glass .lab i{display:block;font-style:italic;font-size:20px;opacity:.75;margin-top:6px;letter-spacing:.08em}
  .floor{position:absolute;left:50%;top:50%;width:520px;height:60px;margin:300px 0 0 -260px;border-radius:50%;background:radial-gradient(ellipse,rgba(230,120,160,.35),rgba(0,0,0,0) 70%)}
  .t1{position:absolute;left:0;right:0;top:1330px;text-align:center}
  .t1 .n{font-size:120px;letter-spacing:.12em;line-height:1}
  .t1 .s{font-family:"Atlas Grotesk",sans-serif;font-size:22px;letter-spacing:.5em;text-transform:uppercase;opacity:.7;margin-top:18px}
  .c2 .big{position:absolute;left:0;right:0;top:640px;text-align:center;font-size:250px;line-height:.9;letter-spacing:.04em}
  .c2 .big span{display:block;overflow:hidden}
  .c2 .big span em{display:block;will-change:transform;font-style:normal}
  .c2 .big span em.i{font-style:italic;font-size:200px}
  .c2 .line{position:absolute;left:50%;top:1230px;width:1px;height:160px;background:rgba(239,230,216,.6);transform-origin:top}
  .c2 .foot{position:absolute;left:0;right:0;top:1420px;text-align:center;font-family:"Atlas Grotesk",sans-serif;font-size:22px;letter-spacing:.45em;text-transform:uppercase;opacity:.8}
  .dust{position:absolute;width:6px;height:6px;border-radius:50%;background:rgba(255,220,200,.6);filter:blur(1px)}
  .fade{position:absolute;inset:0;background:#07060a;opacity:0}
</style>
<div class="stage">
  <video class="bgv" muted playsinline preload="auto" src="../../../assets/backgrounds/drift-violet.mp4"></video>
  <div class="vig"></div>
  <div class="cut c1">
    <div class="floor"></div>
    <div class="bottle"><div class="cap"></div><div class="neck"></div><div class="glass"><div class="liquid"></div><div class="lab"><b>Noir</b><i>eau de parfum</i></div><div class="sheen"></div></div></div>
    <div class="t1"><div class="n">Noir</div><div class="s">Northwind Parfums</div></div>
  </div>
  <div class="cut c2">
    <div class="big"><span><em>Wear</em></span><span><em class="i">the night</em></span></div>
    <div class="line"></div>
    <div class="foot">Available now</div>
  </div>
  <div class="fade"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const v = document.querySelector('video');
  fx.wait(new Promise(r => { if (v.readyState >= 2) r(); else v.addEventListener('loadeddata', r, { once: true }); }));
  const rnd = fx.rng(21);
  const c1 = document.querySelector('.c1');
  for (let i = 0; i < 18; i++) { const d = document.createElement('div'); d.className = 'dust'; d.style.left = (140 + rnd() * 800) + 'px'; d.style.top = (400 + rnd() * 900) + 'px'; d.style.opacity = .2 + rnd() * .6; c1.appendChild(d); }
  const tl = fx.timeline({ duration: 4 });
  tl.to({}, { duration: 4, onUpdate() { v.currentTime = (6 + this.progress() * 4 * 0.5) % (v.duration || 16); } }, 0);
  tl.fromTo(v, { scale: 1.15, xPercent: -50, yPercent: -50 }, { scale: 1.0, duration: 4, ease: 'none' }, 0);
  // cut 1 — the bottle, slowly turning toward camera, light sweeping across the glass
  tl.set('.c1', { opacity: 1 }, 0).set('.c1', { opacity: 0 }, 2.4);
  tl.fromTo('.bottle', { scale: 1.3, y: 60, rotateY: -24, opacity: 0 }, { scale: 1.06, y: 0, rotateY: 8, opacity: 1, duration: 2.4, ease: 'power1.out' }, 0);
  tl.fromTo('.sheen', { x: 0 }, { x: 560, duration: 1.6, ease: 'power2.inOut' }, 0.5);
  tl.fromTo('.floor', { opacity: 0, scale: .6 }, { opacity: 1, scale: 1, duration: 1.6, ease: 'power2.out' }, 0.3);
  tl.from('.t1 .n', { letterSpacing: '.6em', opacity: 0, duration: 1.6, ease: 'power3.out' }, 0.6);
  tl.from('.t1 .s', { opacity: 0, y: 10, duration: 1, ease: 'power2.out' }, 1.1);
  tl.from('.dust', { y: 40, opacity: 0, duration: 2, ease: 'power1.out', stagger: 0.05 }, 0.2);
  tl.to('.dust', { y: -60, duration: 2.4, ease: 'none' }, 0);
  // cinematic dip to black between cuts
  tl.fromTo('.fade', { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power2.in' }, 2.05).to('.fade', { opacity: 0, duration: 0.4, ease: 'power2.out' }, 2.4);
  // cut 2 — the line: type rises slowly, a hairline draws, a slow drift on the whole cut
  tl.set('.c2', { opacity: 1 }, 2.4);
  tl.fromTo('.c2', { scale: 1.06 }, { scale: 1, duration: 1.6, ease: 'power1.out' }, 2.4);
  tl.from('.c2 .big em', { yPercent: 100, duration: 1.1, ease: 'power3.out', stagger: 0.15 }, 2.45);
  tl.from('.c2 .line', { scaleY: 0, duration: 0.9, ease: 'power2.inOut' }, 2.8);
  tl.from('.c2 .foot', { opacity: 0, duration: 0.8 }, 3.15);
  // loop close: dip to black
  tl.to('.fade', { opacity: 1, duration: 0.35, ease: 'power2.in' }, 3.65);
</script>
