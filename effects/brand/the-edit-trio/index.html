<!doctype html><meta charset="utf-8">
<title>The Edit: Trio</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0b0b0d;font-family:"Atlas Grotesk",sans-serif}
  .panel{position:absolute;left:60px;right:60px;height:560px;border-radius:26px;overflow:hidden;will-change:transform}
  .p1{top:100px}.p2{top:680px}.p3{top:1260px}
  .panel .img{position:absolute;inset:0;overflow:hidden}
  .panel video{position:absolute;left:50%;top:50%;width:200%;height:150%;object-fit:cover;transform:translate(-50%,-50%);will-change:transform}
  .panel .grade{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.5}
  .p1 .grade{background:#ff6a3d}.p2 .grade{background:#3d7bff}.p3 .grade{background:#2fd28a}
  .panel .num{position:absolute;left:40px;top:36px;font-family:"Sharp Grotesk",sans-serif;font-size:26px;letter-spacing:.2em;color:#fff;opacity:.85}
  .panel .name{position:absolute;left:40px;bottom:40px;font-family:"Sharp Grotesk",sans-serif;font-size:96px;font-weight:500;letter-spacing:-.04em;color:#fff;line-height:.9;overflow:hidden}
  .panel .name span{display:block;will-change:transform}
  .panel .price{position:absolute;right:40px;bottom:48px;padding:14px 24px;border-radius:999px;background:#fff;color:#111;font-family:"Sharp Grotesk",sans-serif;font-size:30px;font-weight:500;will-change:transform}
  .rule{position:absolute;left:60px;right:60px;height:2px;background:rgba(255,255,255,.5);transform:scaleX(0)}
  .head{position:absolute;left:0;right:0;top:36px;text-align:center;color:#fff;font-size:22px;letter-spacing:.35em;text-transform:uppercase;opacity:.75}
  .foot{position:absolute;left:0;right:0;bottom:40px;text-align:center;color:#fff;font-size:22px;letter-spacing:.35em;text-transform:uppercase;opacity:.75}
</style>
<div class="stage">
  <div class="head">Acme — The Trio</div>
  <div class="panel p1"><div class="img"><video muted playsinline preload="auto" src="../../../assets/backgrounds/drift-ember.mp4"></video><div class="grade"></div></div><div class="num">01</div><div class="name"><span>Ember</span></div><div class="price">$120</div></div>
  <div class="panel p2"><div class="img"><video muted playsinline preload="auto" src="../../../assets/backgrounds/drift-violet.mp4"></video><div class="grade"></div></div><div class="num">02</div><div class="name"><span>Violet</span></div><div class="price">$140</div></div>
  <div class="panel p3"><div class="img"><video muted playsinline preload="auto" src="../../../assets/backgrounds/drift-mint.mp4"></video><div class="grade"></div></div><div class="num">03</div><div class="name"><span>Mint</span></div><div class="price">$160</div></div>
  <div class="rule" style="top:670px"></div><div class="rule" style="top:1250px"></div>
  <div class="foot">Compare all three</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const vids = gsap.utils.toArray('video');
  vids.forEach(v => fx.wait(new Promise(r => { if (v.readyState >= 2) r(); else v.addEventListener('loadeddata', r, { once: true }); })));
  const tl = fx.timeline({ duration: 6 });
  tl.to({}, { duration: 6, onUpdate() { const t = this.progress() * 6; vids.forEach(v => { v.currentTime = (4 + t) % (v.duration || 16); }); } }, 0);
  const panels = ['.p1', '.p2', '.p3'];
  tl.from('.head', { y: -14, opacity: 0, duration: 0.5, ease: 'expo.out' }, 0);
  // synchronized entrance: all three panels slide in together, alternating sides, and settle as one
  tl.from('.p1', { xPercent: -115, duration: 0.9, ease: 'move' }, 0.1);
  tl.from('.p2', { xPercent: 115, duration: 0.9, ease: 'move' }, 0.1);
  tl.from('.p3', { xPercent: -115, duration: 0.9, ease: 'move' }, 0.1);
  // and their imagery pans across in unison
  tl.fromTo(vids, { xPercent: -62, yPercent: -50, scale: 1.2 }, { xPercent: -38, scale: 1.02, duration: 6, ease: 'none' }, 0);
  tl.from('.panel .num', { y: -20, opacity: 0, duration: 0.5, ease: 'expo.out' }, 0.55);
  tl.from('.panel .name span', { yPercent: 110, duration: 0.7, ease: 'expo.out' }, 0.65);
  tl.from('.panel .price', { scale: 0, duration: 0.6, ease: 'back.out(2)' }, 0.85);
  tl.to('.rule', { scaleX: 1, duration: 0.7, ease: 'expo.out' }, 0.6);
  tl.from('.foot', { opacity: 0, duration: 0.5 }, 1.2);
  // the synced beat: all panels shift and squeeze together at the same instant, prices bump
  tl.to(panels, { scale: 0.96, duration: 0.35, ease: 'power2.inOut' }, 2.4).to(panels, { scale: 1, duration: 0.7, ease: 'elastic.out(1,0.5)' }, 2.75);
  tl.to('.panel .price', { scale: 1.15, duration: 0.2, ease: 'power2.out' }, 2.5).to('.panel .price', { scale: 1, duration: 0.6, ease: 'elastic.out(1,0.4)' }, 2.7);
  // names swap in sync
  tl.to('.panel .name span', { yPercent: -110, duration: 0.35, ease: 'power3.in' }, 3.6);
  tl.set('.p1 .name span', { textContent: 'Warm' }, 3.96).set('.p2 .name span', { textContent: 'Cool' }, 3.96).set('.p3 .name span', { textContent: 'Fresh' }, 3.96);
  tl.fromTo('.panel .name span', { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: 'expo.out' }, 3.98);
  // exit together, the way each came in
  tl.to('.p1', { xPercent: -115, duration: 0.55, ease: 'expo.in' }, 5.3);
  tl.to('.p2', { xPercent: 115, duration: 0.55, ease: 'expo.in' }, 5.3);
  tl.to('.p3', { xPercent: -115, duration: 0.55, ease: 'expo.in' }, 5.3);
  tl.to('.rule', { scaleX: 0, duration: 0.4, ease: 'expo.in' }, 5.4);
  tl.to('.head, .foot', { opacity: 0, duration: 0.3 }, 5.5);
</script>
