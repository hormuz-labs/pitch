<!doctype html><meta charset="utf-8">
<title>The Edit: Split Reveal</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#08090c;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif}
  .behind{position:absolute;inset:0;overflow:hidden}
  .behind video{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:cover;transform:translate(-50%,-50%);filter:saturate(1.1) brightness(.85);will-change:transform}
  .behind .shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(0,0,0,0),rgba(0,0,0,.7))}
  .product{position:absolute;left:50%;top:50%;width:520px;height:300px;margin:-150px 0 0 -260px;border-radius:26px;background:linear-gradient(150deg,#1a1c22,#0b0c10);box-shadow:0 40px 100px -20px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.15);will-change:transform;padding:36px;color:#fff}
  .product .k{font-size:14px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
  .product .n{font-size:54px;font-weight:500;letter-spacing:-.03em;margin-top:12px;line-height:1}
  .product .row{position:absolute;left:36px;right:36px;bottom:36px;display:flex;justify-content:space-between;align-items:center}
  .product .price{font-size:30px}
  .product .btn{padding:14px 26px;border-radius:999px;background:#fff;color:#111;font-family:"Atlas Grotesk",sans-serif;font-size:16px;letter-spacing:.08em;text-transform:uppercase}
  .product .chip{position:absolute;right:36px;top:36px;width:84px;height:84px;border-radius:24px;background:conic-gradient(from 200deg,#ff7a45,#ffd23f,#2ed47a,#2f80ed,#ff7a45)}
  .half{position:absolute;top:0;bottom:0;width:50%;background:#101216;overflow:hidden;will-change:transform}
  .half.l{left:0}.half.r{right:0}
  .half .t{position:absolute;top:50%;color:#fff;font-size:150px;font-weight:500;text-transform:uppercase;letter-spacing:-.05em;line-height:.9;transform:translateY(-50%);white-space:nowrap}
  .half.l .t{right:14px;text-align:right}.half.r .t{left:14px}
  .half .sub{position:absolute;bottom:60px;font-family:"Atlas Grotesk",sans-serif;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.6)}
  .half.l .sub{right:40px}.half.r .sub{left:40px}
  .seam{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;transform:scaleY(0)}
  .edge{position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,0))}
  .cap{position:absolute;left:0;right:0;bottom:56px;text-align:center;color:#fff;font-family:"Atlas Grotesk",sans-serif;font-size:15px;letter-spacing:.24em;text-transform:uppercase;opacity:.7}
</style>
<div class="stage">
  <div class="behind"><video muted playsinline preload="auto" src="../../../assets/backgrounds/drift-ember.mp4"></video><div class="shade"></div></div>
  <div class="product"><div class="k">Acme Audio</div><div class="n">Pulse One</div><div class="chip"></div><div class="row"><span class="price">$249</span><span class="btn">Pre-order</span></div></div>
  <div class="cap">Launching worldwide · 09.12</div>
  <div class="half l"><div class="t">Some</div><div class="sub">Acme presents</div><div class="edge" style="right:0;transform:scaleX(-1)"></div></div>
  <div class="half r"><div class="t">thing</div><div class="sub">A new sound</div><div class="edge" style="left:0"></div></div>
  <div class="seam"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const v = document.querySelector('video');
  fx.wait(new Promise(r => { if (v.readyState >= 2) r(); else v.addEventListener('loadeddata', r, { once: true }); }));
  const tl = fx.timeline({ duration: 6 });
  tl.to({}, { duration: 6, onUpdate() { v.currentTime = (this.progress() * 6 * 0.7 + 1) % (v.duration || 16); } }, 0);
  // title on the closed split: the two halves of the word slide in to meet at the seam
  tl.from('.half.l .t', { x: -300, opacity: 0, duration: 0.8, ease: 'move' }, 0.1);
  tl.from('.half.r .t', { x: 300, opacity: 0, duration: 0.8, ease: 'move' }, 0.1);
  tl.from('.half .sub', { y: 16, opacity: 0, duration: 0.5, ease: 'expo.out' }, 0.5);
  tl.fromTo('.seam', { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: 'expo.out' }, 0.7);
  // the split opens: halves part to either side, revealing the product behind
  tl.to('.seam', { opacity: 0, duration: 0.2 }, 1.7);
  tl.to('.half.l', { xPercent: -100, duration: 1.1, ease: 'expo.inOut' }, 1.75);
  tl.to('.half.r', { xPercent: 100, duration: 1.1, ease: 'expo.inOut' }, 1.75);
  tl.fromTo(v, { scale: 1.3, xPercent: -50, yPercent: -50 }, { scale: 1.05, duration: 2.6, ease: 'power2.out' }, 1.8);
  tl.fromTo('.product', { scale: 0.7, rotateY: 30, opacity: 0 }, { scale: 1, rotateY: 0, opacity: 1, duration: 1.0, ease: 'back.out(1.4)' }, 2.05);
  tl.from('.product .k, .product .n, .product .row', { y: 16, opacity: 0, duration: 0.5, ease: 'expo.out', stagger: 0.08 }, 2.5);
  tl.from('.product .chip', { scale: 0, rotate: 90, duration: 0.7, ease: 'back.out(2)' }, 2.6);
  tl.from('.cap', { y: 10, opacity: 0, duration: 0.5 }, 2.9);
  // hold with a slow float
  tl.to('.product', { y: -10, rotateY: -5, duration: 1.6, ease: 'sine.inOut' }, 3.1).to('.product', { y: 0, rotateY: 0, duration: 1.0, ease: 'sine.inOut' }, 4.7);
  // close: the halves slam shut for the loop
  tl.to('.half.l', { xPercent: 0, duration: 0.45, ease: 'expo.in' }, 5.35);
  tl.to('.half.r', { xPercent: 0, duration: 0.45, ease: 'expo.in' }, 5.35);
  tl.to('.half .t', { x: 0, opacity: 0, duration: 0.01 }, 5.35);
  tl.to('.half .sub', { opacity: 0, duration: 0.01 }, 5.35);
  tl.fromTo('.seam', { opacity: 1, scaleY: 1 }, { scaleY: 0, duration: 0.2, ease: 'power2.in' }, 5.8);
</script>
