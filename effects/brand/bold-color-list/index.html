<!doctype html><meta charset="utf-8">
<title>Bold Color List</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0e0e10;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif}
  .head{position:absolute;left:80px;top:56px;display:flex;align-items:center;gap:14px;color:#fff;font-size:15px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
  .head i{width:14px;height:14px;border-radius:50%;background:#fff;display:inline-block}
  .list{position:absolute;left:80px;right:80px;top:120px;display:flex;flex-direction:column;gap:10px}
  .row{position:relative;height:86px;border-radius:14px;overflow:hidden;display:flex;align-items:center;padding:0 34px;justify-content:space-between;will-change:transform;transform-origin:left center}
  .row .name{font-size:44px;font-weight:500;letter-spacing:-.03em;color:#111;line-height:1;white-space:nowrap}
  .row .meta{display:flex;gap:40px;font-family:"Atlas Grotesk",sans-serif;font-size:18px;letter-spacing:.06em;color:rgba(0,0,0,.65);text-transform:uppercase}
  .row.dark .name,.row.dark .meta{color:#fff}
  .row.dark .meta{color:rgba(255,255,255,.7)}
  .row .name,.row .meta{will-change:transform,opacity}
  .swipe{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left center;mix-blend-mode:overlay;opacity:.5}
</style>
<div class="stage">
  <div class="head"><i></i>Acme — Core palette</div>
  <div class="list">
    <div class="row" style="background:#ff5a36"><span class="name">Signal Orange</span><span class="meta"><span>#FF5A36</span><span>Primary</span></span><div class="swipe"></div></div>
    <div class="row" style="background:#ffc61a"><span class="name">Sun Yellow</span><span class="meta"><span>#FFC61A</span><span>Accent</span></span><div class="swipe"></div></div>
    <div class="row" style="background:#2ed47a"><span class="name">Mint Green</span><span class="meta"><span>#2ED47A</span><span>Success</span></span><div class="swipe"></div></div>
    <div class="row" style="background:#2f80ed"><span class="name">Sky Blue</span><span class="meta"><span>#2F80ED</span><span>Link</span></span><div class="swipe"></div></div>
    <div class="row dark" style="background:#7b61ff"><span class="name">Ultra Violet</span><span class="meta"><span>#7B61FF</span><span>Brand</span></span><div class="swipe"></div></div>
    <div class="row dark" style="background:#f2f2f0;--fg:#111"><span class="name" style="color:#111">Paper White</span><span class="meta" style="color:rgba(0,0,0,.6)"><span>#F2F2F0</span><span>Surface</span></span><div class="swipe"></div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 10 });
  const rows = gsap.utils.toArray('.row');
  tl.from('.head', { y: -20, opacity: 0, duration: 0.6, ease: 'expo.out' }, 0);
  // rows snap in from the left as thin slivers that stretch open
  tl.from(rows, { xPercent: -104, duration: 0.8, ease: 'move', stagger: 0.12 }, 0.15);
  tl.from(rows, { scaleY: 0.2, duration: 0.6, ease: 'expo.out', stagger: 0.12 }, 0.15);
  tl.from('.row .name', { xPercent: -30, opacity: 0, duration: 0.6, ease: 'move', stagger: 0.12 }, 0.45);
  tl.from('.row .meta', { x: 40, opacity: 0, duration: 0.6, ease: 'move', stagger: 0.12 }, 0.55);
  // a light sweep runs down the list, one row after another
  rows.forEach((r, i) => {
    const t = 2.2 + i * 0.55;
    tl.fromTo(r.querySelector('.swipe'), { scaleX: 0, transformOrigin: 'left center' }, { scaleX: 1, duration: 0.45, ease: 'expo.out' }, t)
      .to(r.querySelector('.swipe'), { scaleX: 0, transformOrigin: 'right center', duration: 0.4, ease: 'expo.in' }, t + 0.45)
      .to(r, { scale: 1.02, duration: 0.25, ease: 'power2.out' }, t)
      .to(r, { scale: 1, duration: 0.5, ease: 'power2.inOut' }, t + 0.3);
  });
  // bold emphasis: each row in turn grows tall while the others tighten
  rows.forEach((r, i) => {
    const t = 5.8 + i * 0.5;
    tl.to(r, { height: 118, duration: 0.45, ease: 'expo.out' }, t)
      .to(r.querySelector('.name'), { scale: 1.18, transformOrigin: 'left center', duration: 0.45, ease: 'expo.out' }, t)
      .to(r, { height: 86, duration: 0.5, ease: 'expo.inOut' }, t + 0.5)
      .to(r.querySelector('.name'), { scale: 1, duration: 0.5, ease: 'expo.inOut' }, t + 0.5);
  });
  // exit: rows shoot off to the right, bottom first
  tl.to(rows.slice().reverse(), { xPercent: 106, duration: 0.5, ease: 'expo.in', stagger: 0.07 }, 9.15);
  tl.to('.head', { y: -20, opacity: 0, duration: 0.3, ease: 'power2.in' }, 9.6);
</script>
