<!doctype html><meta charset="utf-8">
<title>The Track: Product Reveal</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0d0d0f;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;color:#fff;perspective:1600px}
  .bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,#2a2320,#0d0d0f 60%)}
  .lines{position:absolute;inset:0}
  .lines i{position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.12);transform:scaleX(0)}
  .kin{position:absolute;left:0;right:0;top:50%;text-align:center;font-size:260px;font-weight:500;text-transform:uppercase;letter-spacing:-.06em;line-height:.85;transform:translateY(-50%)}
  .kin .w{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);opacity:0;will-change:transform}
  .count{position:absolute;left:0;right:0;top:50%;text-align:center;font-size:520px;font-weight:500;letter-spacing:-.08em;line-height:1;transform:translateY(-50%);opacity:0;will-change:transform}
  .product{position:absolute;left:50%;top:50%;width:640px;height:640px;margin:-360px 0 0 -320px;will-change:transform;transform-style:preserve-3d}
  .shoe{position:absolute;left:0;top:0;width:640px;height:640px}
  .glow{position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:radial-gradient(circle,rgba(255,120,40,.5),rgba(255,120,40,0) 60%);opacity:0}
  .burst{position:absolute;left:50%;top:50%;width:0;height:0}
  .burst i{position:absolute;left:0;top:0;width:4px;height:140px;margin-left:-2px;background:#fff;transform-origin:50% 0;opacity:0}
  .name{position:absolute;left:60px;right:60px;top:1240px;font-size:130px;font-weight:500;letter-spacing:-.05em;line-height:.9;text-transform:uppercase}
  .name .l{display:block;overflow:hidden}.name .l span{display:block;will-change:transform}
  .name .l .acc{color:#ff7a2a}
  .meta{position:absolute;left:60px;top:1520px;display:flex;gap:40px;font-family:"Atlas Grotesk",sans-serif;font-size:24px;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
  .cta{position:absolute;left:60px;top:1620px;padding:26px 48px;border-radius:999px;background:#fff;color:#0d0d0f;font-size:30px;font-weight:500;letter-spacing:.05em;will-change:transform}
  .logo{position:absolute;left:60px;top:80px;display:flex;align-items:center;gap:14px;font-size:26px;letter-spacing:.25em;text-transform:uppercase}
  .logo i{width:34px;height:34px;background:#fff;clip-path:polygon(0 100%,50% 0,100% 100%);display:block}
  .flash{position:absolute;inset:0;background:#fff;opacity:0}
</style>
<div class="stage">
  <div class="bg"></div>
  <div class="lines"><i style="top:300px"></i><i style="top:700px"></i><i style="top:1100px"></i><i style="top:1500px"></i></div>
  <div class="logo"><i></i>Acme Track</div>
  <div class="count"><span>3</span></div>
  <div class="kin"><div class="w">Faster</div><div class="w">Lighter</div><div class="w">Bolder</div></div>
  <div class="glow"></div>
  <div class="burst"></div>
  <div class="product">
    <!-- a stylised sneaker, drawn in SVG -->
    <svg class="shoe" viewBox="0 0 400 400">
      <defs><linearGradient id="up" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a4a"/><stop offset="1" stop-color="#ff5a1f"/></linearGradient></defs>
      <path d="M40 250 C60 200 120 210 160 180 C200 150 220 110 260 120 C290 128 300 160 330 180 C360 200 380 215 372 250 Z" fill="url(#up)"/>
      <path d="M36 252 L374 252 C380 270 372 290 350 290 L60 290 C40 290 30 270 36 252Z" fill="#f4f1ea"/>
      <path d="M60 290 L350 290 C360 296 356 306 340 306 L70 306 C54 306 50 296 60 290Z" fill="#1a1a1c"/>
      <path d="M170 176 C205 150 230 128 260 132 L262 148 C230 148 210 170 180 192Z" fill="#fff" opacity=".9"/>
      <path d="M120 250 C150 230 230 190 300 215" fill="none" stroke="#1a1a1c" stroke-width="10" stroke-linecap="round"/>
      <circle cx="322" cy="176" r="8" fill="#1a1a1c"/>
    </svg>
  </div>
  <div class="name"><span class="l"><span>Pulse</span></span><span class="l"><span class="acc">Zero 2</span></span></div>
  <div class="meta"><span>185 g</span><span>Carbon plate</span><span>09.12</span></div>
  <div class="cta">Shop the drop</div>
  <div class="flash"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const burst = document.querySelector('.burst');
  for (let i = 0; i < 16; i++) { const s = document.createElement('i'); s.style.transform = `rotate(${i * 22.5}deg)`; burst.appendChild(s); }
  const tl = fx.timeline({ duration: 7 });
  const cnt = document.querySelector('.count span');
  tl.from('.logo', { y: -20, opacity: 0, duration: 0.5, ease: 'expo.out' }, 0);
  // buildup: a countdown slams 3-2-1, each number punching in and shoving out
  [['3', 0.1], ['2', 0.55], ['1', 1.0]].forEach(([n, t]) => {
    tl.set(cnt, { textContent: n }, t);
    tl.fromTo('.count', { opacity: 1, scale: 1.8 }, { scale: 1, duration: 0.3, ease: 'expo.out' }, t);
    tl.to('.count', { opacity: 0, scale: 0.8, duration: 0.15, ease: 'power2.in' }, t + 0.32);
  });
  tl.to('.lines i', { scaleX: 1, duration: 0.5, ease: 'expo.out', stagger: 0.08 }, 0.1);
  // kinetic words: each word rips through from a different side
  const dirs = [{ x: -1200 }, { x: 1200 }, { y: 600 }];
  gsap.utils.toArray('.kin .w').forEach((w, i) => {
    const t = 1.5 + i * 0.5;
    tl.fromTo(w, { ...dirs[i], opacity: 1, skewX: -12 }, { x: 0, y: 0, skewX: 0, duration: 0.35, ease: 'expo.out', immediateRender: false }, t);
    tl.to(w, { ...(i === 2 ? { y: -1500 } : { x: dirs[i].x > 0 ? -1200 : 1200 }), skewX: 12, duration: 0.25, ease: 'expo.in' }, t + 0.35);
  });
  // the reveal: flash, glow blooms, the burst rays fire, the shoe drops in with a 3D turn and a bounce
  tl.fromTo('.flash', { opacity: 1 }, { opacity: 0, duration: 0.4, ease: 'power2.out', immediateRender: false }, 3.05);
  tl.to('.lines i', { scaleX: 0, duration: 0.3, ease: 'expo.in', stagger: 0.03 }, 2.95);
  tl.fromTo('.glow', { opacity: 0, scale: .3 }, { opacity: 1, scale: 1, duration: 1.0, ease: 'expo.out' }, 3.05);
  tl.fromTo('.burst i', { opacity: 1, scaleY: 0, y: 0 }, { scaleY: 1, y: 380, duration: 0.5, ease: 'expo.out' }, 3.05)
    .to('.burst i', { opacity: 0, scaleY: 0.2, duration: 0.3, ease: 'power2.in' }, 3.45);
  tl.fromTo('.product', { y: -1500, rotateY: -80, rotateZ: -20, scale: 1.3 }, { y: 0, rotateY: 0, rotateZ: 0, scale: 1, duration: 0.9, ease: 'back.out(1.3)' }, 3.05);
  tl.to('.product', { rotateY: 18, y: -20, duration: 1.8, ease: 'sine.inOut' }, 4.0).to('.product', { rotateY: -12, y: 0, duration: 1.6, ease: 'sine.inOut' }, 5.8);
  // name, meta and cta land in a strong cadence
  tl.from('.name .l span', { yPercent: 110, duration: 0.6, ease: 'expo.out', stagger: 0.1 }, 3.5);
  tl.from('.meta span', { y: 16, opacity: 0, duration: 0.5, ease: 'expo.out', stagger: 0.08 }, 3.9);
  tl.from('.cta', { scale: 0, duration: 0.6, ease: 'back.out(2)' }, 4.1);
  tl.to('.cta', { scale: 1.06, duration: 0.25, ease: 'power2.out' }, 5.3).to('.cta', { scale: 1, duration: 0.5, ease: 'elastic.out(1,0.4)' }, 5.55);
  // exit: everything punches out for the loop
  tl.to('.product', { y: 1000, rotateZ: 15, duration: 0.5, ease: 'power3.in' }, 6.45);
  tl.to('.name .l span', { yPercent: -110, duration: 0.3, ease: 'expo.in', stagger: 0.05 }, 6.5);
  tl.to('.meta, .cta', { opacity: 0, y: 20, duration: 0.3, ease: 'power2.in' }, 6.6);
  tl.to('.glow', { opacity: 0, duration: 0.4 }, 6.5);
  tl.to('.logo', { opacity: 0, duration: 0.25 }, 6.7);
</script>
