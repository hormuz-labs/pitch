<!doctype html><meta charset="utf-8">
<title>Color Cards: Expand</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#111113;font-family:"Atlas Grotesk",sans-serif}
  .rail{position:absolute;left:60px;right:60px;top:110px;bottom:110px;display:flex;gap:14px}
  .card{width:150px;border-radius:20px;position:relative;overflow:hidden;will-change:width}
  .card .n{position:absolute;left:28px;bottom:80px;font-family:"Sharp Grotesk",sans-serif;font-size:64px;font-weight:500;letter-spacing:-.04em;color:#fff;line-height:.95;white-space:nowrap;opacity:0}
  .card .h{position:absolute;left:28px;bottom:36px;font-size:18px;letter-spacing:.1em;color:rgba(255,255,255,.75);white-space:nowrap;opacity:0}
  .card .v{position:absolute;left:0;right:0;bottom:36px;text-align:center;font-family:"Sharp Grotesk",sans-serif;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8);writing-mode:vertical-rl;left:auto;right:0;width:100%;height:100%;top:0;display:flex;align-items:center;justify-content:flex-end;padding-bottom:36px}
  .card .v span{display:block;transform:rotate(180deg)}
  .card.light .n,.card.light .h,.card.light .v{color:#111}
  .card .dot{position:absolute;left:28px;top:28px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.9)}
  .card.light .dot{background:#111}
  .cap{position:absolute;left:60px;top:48px;color:#fff;font-size:15px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
</style>
<div class="stage">
  <div class="cap">Acme Design System — Colors</div>
  <div class="rail">
    <div class="card" style="background:#ff4d3d"><div class="dot"></div><div class="v"><span>Coral</span></div><div class="n">Coral</div><div class="h">#FF4D3D · Primary</div></div>
    <div class="card" style="background:#ff9f1c"><div class="dot"></div><div class="v"><span>Tangerine</span></div><div class="n">Tangerine</div><div class="h">#FF9F1C · Accent</div></div>
    <div class="card light" style="background:#ffe66d"><div class="dot"></div><div class="v"><span>Lemon</span></div><div class="n">Lemon</div><div class="h">#FFE66D · Highlight</div></div>
    <div class="card" style="background:#2ec4b6"><div class="dot"></div><div class="v"><span>Lagoon</span></div><div class="n">Lagoon</div><div class="h">#2EC4B6 · Success</div></div>
    <div class="card" style="background:#3a86ff"><div class="dot"></div><div class="v"><span>Azure</span></div><div class="n">Azure</div><div class="h">#3A86FF · Link</div></div>
    <div class="card" style="background:#8338ec"><div class="dot"></div><div class="v"><span>Grape</span></div><div class="n">Grape</div><div class="h">#8338EC · Brand</div></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 7 });
  const cards = gsap.utils.toArray('.card');
  const W = 1280 - 120 - 14 * 5;      // rail width minus gaps
  const REST = W / 6, OPEN = 560, SMALL = (W - OPEN) / 5;
  gsap.set(cards, { width: REST });
  tl.from('.cap', { y: -14, opacity: 0, duration: 0.5, ease: 'expo.out' }, 0);
  // cards grow in from zero width, left to right
  tl.from(cards, { width: 0, duration: 0.8, ease: 'expo.out', stagger: 0.08 }, 0.05);
  tl.from('.card .v', { opacity: 0, y: 20, duration: 0.5, stagger: 0.08 }, 0.4);
  // each card expands in turn while the rest collapse; its label unfolds
  const STEP = 0.9;
  cards.forEach((c, i) => {
    const t = 1.1 + i * STEP;
    tl.to(cards, { width: (j) => (j === i ? OPEN : SMALL), duration: 0.65, ease: 'expo.inOut' }, t);
    tl.to(c.querySelector('.v'), { opacity: 0, duration: 0.2 }, t);
    tl.fromTo(c.querySelector('.n'), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: 'expo.out' }, t + 0.25);
    tl.fromTo(c.querySelector('.h'), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: 'expo.out' }, t + 0.33);
    // collapse: label folds back before the next one opens
    tl.to([c.querySelector('.n'), c.querySelector('.h')], { opacity: 0, x: -20, duration: 0.25, ease: 'power2.in' }, t + STEP - 0.15);
    tl.to(c.querySelector('.v'), { opacity: 1, duration: 0.3 }, t + STEP + 0.3);
  });
  // return to even rest, then exit collapsing right to left
  tl.to(cards, { width: REST, duration: 0.6, ease: 'expo.inOut' }, 1.1 + 6 * STEP);
  tl.to(cards.slice().reverse(), { width: 0, duration: 0.45, ease: 'expo.in', stagger: 0.05 }, 6.5);
  tl.to('.cap', { opacity: 0, duration: 0.25 }, 6.7);
</script>
