<!doctype html><meta charset="utf-8">
<title>The Edit: Poppy</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#ff4f7b;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;overflow:hidden}
  .scene{position:absolute;inset:0;opacity:0}
  .s1{background:#ff4f7b}.s2{background:#ffd93d}.s3{background:#4d8bff}.s4{background:#1ad39a}
  .wipe{position:absolute;inset:0;transform:scaleY(0);transform-origin:bottom}
  .big{position:absolute;left:70px;right:70px;top:50%;transform:translateY(-50%);font-size:210px;font-weight:500;text-transform:uppercase;letter-spacing:-.05em;line-height:.86;color:#fff}
  .big .l{display:block;overflow:hidden}.big .l span{display:block;will-change:transform}
  .s2 .big{color:#1a1a1a}
  .blob{position:absolute;border-radius:50%;will-change:transform}
  .sq{position:absolute;border-radius:28px;will-change:transform}
  .pill{position:absolute;padding:22px 40px;border-radius:999px;background:#fff;color:#1a1a1a;font-size:34px;font-weight:500;letter-spacing:.02em;will-change:transform}
  .star{position:absolute;width:180px;height:180px;will-change:transform}
  .logo{position:absolute;left:60px;top:56px;display:flex;align-items:center;gap:14px;color:#fff;font-size:26px;letter-spacing:.2em;text-transform:uppercase;mix-blend-mode:difference}
  .logo i{width:30px;height:30px;border-radius:50%;background:#fff;display:block}
</style>
<div class="stage">
  <div class="scene s1">
    <div class="blob" style="left:620px;top:120px;width:380px;height:380px;background:#ffd93d"></div>
    <div class="blob" style="left:-80px;top:700px;width:300px;height:300px;background:#4d8bff"></div>
    <div class="big"><span class="l"><span>Feel</span></span><span class="l"><span>Good</span></span></div>
    <div class="pill" style="left:560px;top:820px">New in ✦</div>
  </div>
  <div class="scene s2">
    <div class="sq" style="left:560px;top:80px;width:420px;height:420px;background:#ff4f7b"></div>
    <div class="blob" style="left:60px;top:640px;width:240px;height:240px;background:#1ad39a"></div>
    <div class="big"><span class="l"><span>Bright</span></span><span class="l"><span>Days</span></span></div>
    <svg class="star" style="left:760px;top:720px" viewBox="0 0 100 100"><path fill="#4d8bff" d="M50 0 L61 39 L100 50 L61 61 L50 100 L39 61 L0 50 L39 39Z"/></svg>
  </div>
  <div class="scene s3">
    <div class="blob" style="left:-120px;top:-120px;width:440px;height:440px;background:#ff4f7b"></div>
    <div class="sq" style="left:680px;top:660px;width:300px;height:300px;background:#ffd93d;border-radius:150px 28px 150px 28px"></div>
    <div class="big"><span class="l"><span>Move</span></span><span class="l"><span>Loud</span></span></div>
    <div class="pill" style="left:70px;top:860px">Summer edit</div>
  </div>
  <div class="scene s4">
    <div class="blob" style="left:600px;top:80px;width:360px;height:360px;background:#ffd93d"></div>
    <div class="sq" style="left:80px;top:700px;width:260px;height:260px;background:#ff4f7b"></div>
    <div class="big" style="text-align:center"><span class="l"><span>Shop</span></span><span class="l"><span>Now</span></span></div>
    <svg class="star" style="left:120px;top:100px" viewBox="0 0 100 100"><path fill="#fff" d="M50 0 L61 39 L100 50 L61 61 L50 100 L39 61 L0 50 L39 39Z"/></svg>
  </div>
  <div class="wipe w1" style="background:#ffd93d"></div>
  <div class="wipe w2" style="background:#4d8bff"></div>
  <div class="wipe w3" style="background:#1ad39a"></div>
  <div class="wipe w4" style="background:#ff4f7b"></div>
  <div class="logo"><i></i>Poppy</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  const scenes = ['.s1', '.s2', '.s3', '.s4'], wipes = ['.w1', '.w2', '.w3', '.w4'];
  const origins = ['bottom', 'left', 'top', 'right'], axes = ['scaleY', 'scaleX', 'scaleY', 'scaleX'];
  scenes.forEach((s, i) => {
    const a = i * 1.0, b = a + 1.0;
    tl.set(s, { opacity: 1 }, a).set(s, { opacity: 0 }, b);
    // fast transition: a colour wipe covers the frame, the next scene is under it, the wipe leaves the other way
    const w = wipes[i], ax = axes[i];
    tl.fromTo(w, { [ax]: 0, transformOrigin: origins[i] }, { [ax]: 1, duration: 0.22, ease: 'power3.in' }, b - 0.22);
    tl.set(w, { transformOrigin: origins[(i + 2) % 4] }, b);
    tl.to(w, { [ax]: 0, duration: 0.3, ease: 'expo.out' }, b);
    // type snaps up, shapes bounce in, then everything drifts before the next cut
    tl.fromTo(s + ' .big .l span', { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: 'expo.out', stagger: 0.07 }, a + 0.02);
    tl.fromTo(s + ' .blob, ' + s + ' .sq, ' + s + ' .star', { scale: 0, rotate: -40 }, { scale: 1, rotate: 0, duration: 0.7, ease: 'back.out(2)', stagger: 0.08 }, a + 0.05);
    tl.to(s + ' .blob', { y: -30, x: 20, duration: 0.8, ease: 'sine.inOut' }, a + 0.2);
    tl.to(s + ' .sq', { rotate: 18, duration: 0.9, ease: 'sine.inOut' }, a + 0.1);
    tl.to(s + ' .star', { rotate: 120, duration: 0.9, ease: 'power1.inOut' }, a + 0.1);
    const p = document.querySelector(s + ' .pill'); if (p) tl.fromTo(p, { scale: 0, rotate: -12 }, { scale: 1, rotate: -6, duration: 0.6, ease: 'back.out(2.5)' }, a + 0.3);
    tl.to(s + ' .big', { scale: 1.06, duration: 0.8, ease: 'power1.inOut' }, a + 0.2);
  });
  tl.from('.logo', { x: -30, opacity: 0, duration: 0.5, ease: 'expo.out' }, 0.1);
</script>
