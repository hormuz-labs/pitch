<!doctype html><meta charset="utf-8">
<title>The Edit: Duo</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0c0c0c;font-family:"Atlas Grotesk",sans-serif}
  .panel{position:absolute;left:60px;right:60px;height:860px;overflow:hidden;border-radius:28px;will-change:transform}
  .panel.a{top:90px}.panel.b{top:970px}
  .panel .img{position:absolute;inset:0;overflow:hidden}
  .panel .img img,.panel .img video{position:absolute;left:50%;top:50%;width:200%;height:120%;object-fit:cover;transform:translate(-50%,-50%);will-change:transform}
  .panel .lab{position:absolute;left:44px;top:44px;padding:14px 22px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:24px;letter-spacing:.2em;text-transform:uppercase;backdrop-filter:blur(6px);will-change:transform}
  .panel .big{position:absolute;left:44px;bottom:48px;font-family:"Sharp Grotesk",sans-serif;font-size:120px;font-weight:500;letter-spacing:-.04em;color:#fff;line-height:.9;overflow:hidden}
  .panel .big span{display:block;will-change:transform}
  .panel .grade{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.55}
  .a .grade{background:#2a3d66}.b .grade{background:#d67a3a}
  .a video{filter:saturate(.4) brightness(.8)}
  .mid{position:absolute;left:0;right:0;top:50%;height:2px;background:#fff;transform:scaleX(0)}
  .badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-family:"Sharp Grotesk",sans-serif;font-size:40px;font-weight:500;letter-spacing:.05em;will-change:transform}
  .foot{position:absolute;left:0;right:0;bottom:24px;text-align:center;color:#fff;font-size:22px;letter-spacing:.35em;text-transform:uppercase;opacity:.7}
</style>
<div class="stage">
  <div class="panel a"><div class="img"><video muted playsinline preload="auto" src="../../../assets/backgrounds/drift-mint.mp4"></video><div class="grade"></div></div><div class="lab">Before</div><div class="big"><span>Classic</span></div></div>
  <div class="panel b"><div class="img"><video muted playsinline preload="auto" src="../../../assets/backgrounds/drift-mint.mp4"></video><div class="grade"></div></div><div class="lab">After</div><div class="big"><span>Reworked</span></div></div>
  <div class="mid"></div>
  <div class="badge">VS</div>
  <div class="foot">Acme Studio — Duo Edit</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const vids = gsap.utils.toArray('video');
  vids.forEach(v => fx.wait(new Promise(r => { if (v.readyState >= 2) r(); else v.addEventListener('loadeddata', r, { once: true }); })));
  const tl = fx.timeline({ duration: 5 });
  tl.to({}, { duration: 5, onUpdate() { const t = this.progress() * 5; vids.forEach(v => { v.currentTime = (2 + t) % (v.duration || 16); }); } }, 0);
  // synced: both panels slide in from opposite sides at the same instant, and their imagery pans in mirror
  tl.from('.panel.a', { xPercent: -110, duration: 0.9, ease: 'expo.out' }, 0);
  tl.from('.panel.b', { xPercent: 110, duration: 0.9, ease: 'expo.out' }, 0);
  tl.fromTo('.a video', { scale: 1.25, xPercent: -60, yPercent: -50 }, { xPercent: -40, scale: 1.08, duration: 5, ease: 'none' }, 0);
  tl.fromTo('.b video', { scale: 1.25, xPercent: -40, yPercent: -50 }, { xPercent: -60, scale: 1.08, duration: 5, ease: 'none' }, 0);
  tl.from('.panel .lab', { y: -30, opacity: 0, duration: 0.5, ease: 'expo.out' }, 0.5);
  tl.from('.panel .big span', { yPercent: 110, duration: 0.7, ease: 'expo.out' }, 0.6);
  tl.to('.mid', { scaleX: 1, duration: 0.7, ease: 'expo.out' }, 0.55);
  tl.from('.badge', { scale: 0, rotate: -90, duration: 0.7, ease: 'back.out(2)' }, 0.8);
  tl.from('.foot', { opacity: 0, duration: 0.5 }, 1.1);
  // the mirrored beat: both panels tilt together, the badge spins
  tl.to('.panel.a', { xPercent: -3, duration: 0.5, ease: 'power2.inOut' }, 2.2).to('.panel.a', { xPercent: 0, duration: 0.6, ease: 'expo.out' }, 2.7);
  tl.to('.panel.b', { xPercent: 3, duration: 0.5, ease: 'power2.inOut' }, 2.2).to('.panel.b', { xPercent: 0, duration: 0.6, ease: 'expo.out' }, 2.7);
  tl.to('.badge', { rotate: 360, duration: 0.9, ease: 'expo.inOut' }, 2.2);
  // swap: the labels flip with the second word
  tl.to('.panel .big span', { yPercent: -110, duration: 0.35, ease: 'power3.in' }, 3.0);
  tl.set('.a .big span', { textContent: 'Heritage' }, 3.36).set('.b .big span', { textContent: 'Remix' }, 3.36);
  tl.fromTo('.panel .big span', { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: 'expo.out' }, 3.38);
  // exit: both panels leave the way they came, in sync
  tl.to('.panel.a', { xPercent: -110, duration: 0.55, ease: 'expo.in' }, 4.4);
  tl.to('.panel.b', { xPercent: 110, duration: 0.55, ease: 'expo.in' }, 4.4);
  tl.to('.badge', { scale: 0, duration: 0.35, ease: 'back.in(2)' }, 4.45);
  tl.to('.mid', { scaleX: 0, duration: 0.4, ease: 'expo.in' }, 4.5);
  tl.to('.foot', { opacity: 0, duration: 0.3 }, 4.6);
</script>
