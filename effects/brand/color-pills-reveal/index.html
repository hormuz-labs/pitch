<!doctype html><meta charset="utf-8">
<title>Color Pills: Reveal</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#fff8f0;font-family:"Atlas Grotesk",sans-serif}
  .cap{position:absolute;left:0;right:0;top:110px;text-align:center;font-family:"Sharp Grotesk",sans-serif;font-size:54px;font-weight:500;letter-spacing:-.03em;color:#1a1a1a}
  .cap span{display:inline-block}
  .wrap{position:absolute;left:120px;right:120px;top:250px;display:flex;flex-wrap:wrap;justify-content:center;gap:18px 16px}
  .pill{display:inline-flex;align-items:center;gap:14px;height:76px;padding:0 30px 0 16px;border-radius:999px;font-family:"Sharp Grotesk",sans-serif;font-size:28px;font-weight:500;letter-spacing:-.01em;color:#fff;box-shadow:0 14px 30px -12px rgba(0,0,0,.35);will-change:transform;white-space:nowrap}
  .pill i{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.9);flex:none}
  .pill.light{color:#1a1a1a}.pill.light i{border-color:#1a1a1a;background:rgba(0,0,0,.08)}
  .pill small{font-family:"Atlas Grotesk",sans-serif;font-size:15px;letter-spacing:.08em;opacity:.75;margin-left:4px}
</style>
<div class="stage">
  <div class="cap"><span>Meet</span> <span>the</span> <span>Acme</span> <span>palette</span></div>
  <div class="wrap">
    <div class="pill" style="background:#ff3b6b"><i></i>Raspberry<small>#FF3B6B</small></div>
    <div class="pill" style="background:#ff8c42"><i></i>Clementine<small>#FF8C42</small></div>
    <div class="pill light" style="background:#ffd23f"><i></i>Butter<small>#FFD23F</small></div>
    <div class="pill" style="background:#06c17a"><i></i>Kiwi<small>#06C17A</small></div>
    <div class="pill" style="background:#2b7cff"><i></i>Cobalt<small>#2B7CFF</small></div>
    <div class="pill" style="background:#7a3cff"><i></i>Iris<small>#7A3CFF</small></div>
    <div class="pill light" style="background:#ffd6e8"><i></i>Blush<small>#FFD6E8</small></div>
    <div class="pill" style="background:#1c1c1e"><i></i>Ink<small>#1C1C1E</small></div>
    <div class="pill light" style="background:#e8e4dc"><i></i>Stone<small>#E8E4DC</small></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 6 });
  const pills = gsap.utils.toArray('.pill');
  tl.from('.cap span', { yPercent: 110, opacity: 0, duration: 0.6, ease: 'expo.out', stagger: 0.06 }, 0);
  // pills pop in one by one: from a dot, overshooting with a little twist
  pills.forEach((p, i) => {
    const t = 0.35 + i * 0.16;
    tl.from(p, { scale: 0, rotate: (i % 2 ? 1 : -1) * 18, duration: 0.7, ease: 'back.out(2.2)' }, t);
    tl.from(p.querySelector('i'), { scale: 0, duration: 0.45, ease: 'back.out(3)' }, t + 0.18);
  });
  // a playful bounce wave passes through the row
  tl.to(pills, { y: -16, duration: 0.22, ease: 'power2.out', stagger: 0.07 }, 2.9)
    .to(pills, { y: 0, duration: 0.6, ease: 'bounce.out', stagger: 0.07 }, 3.12);
  // the swatch dots swell once, in order
  tl.to('.pill i', { scale: 1.25, duration: 0.2, ease: 'power2.out', stagger: 0.05 }, 3.9)
    .to('.pill i', { scale: 1, duration: 0.5, ease: 'elastic.out(1,0.4)', stagger: 0.05 }, 4.1);
  // exit: pop out in reverse
  tl.to(pills.slice().reverse(), { scale: 0, rotate: 12, duration: 0.35, ease: 'back.in(2)', stagger: 0.06 }, 5.0);
  tl.to('.cap span', { yPercent: -110, opacity: 0, duration: 0.35, ease: 'power3.in', stagger: 0.04 }, 5.5);
</script>
