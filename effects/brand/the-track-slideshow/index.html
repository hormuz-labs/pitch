<!doctype html><meta charset="utf-8">
<title>The Track: Slideshow</title>
<meta name="fx" content="w=1080 h=1080">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0d0d0f;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif;color:#fff}
  .slide{position:absolute;inset:0;overflow:hidden}
  .shot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;will-change:transform}
  .shot svg{width:720px;height:auto}
  .s1 .shot{background:#d9ff3d}.s2 .shot{background:#ff4d2e}.s3 .shot{background:#2e6bff}
  .grain{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 55%),radial-gradient(circle at 80% 90%,rgba(0,0,0,.35),transparent 50%);opacity:.5}
  .wipe{position:absolute;inset:0;background:#0d0d0f;transform-origin:left;will-change:transform}
  .ui{position:absolute;inset:0;pointer-events:none;z-index:10}
  .idx{position:absolute;left:64px;top:56px;width:240px;font-size:40px;font-weight:500;letter-spacing:-.02em;overflow:hidden;height:48px;line-height:48px}
  .idx span{display:block;position:absolute;left:0;top:0}
  .tag{position:absolute;right:64px;top:60px;font-size:22px;letter-spacing:.24em;text-transform:uppercase;opacity:.85}
  .name{position:absolute;left:64px;bottom:64px;overflow:hidden;line-height:.9}
  .name span{display:block;font-size:150px;font-weight:500;letter-spacing:-.05em;text-transform:uppercase;will-change:transform}
  .price{position:absolute;right:64px;bottom:76px;width:240px;text-align:right;font-size:44px;font-weight:500;letter-spacing:-.02em;overflow:hidden;height:52px;line-height:52px}
  .price span{display:block;position:absolute;right:0;top:0}
  .bar{position:absolute;left:64px;right:64px;top:126px;height:4px;background:rgba(255,255,255,.25)}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:#fff;transform-origin:left;transform:scaleX(0)}
  .s2 .shot,.s3 .shot{}
</style>
<div class="stage">
  <div class="slide s1"><div class="shot">
    <svg viewBox="0 0 200 110"><path d="M12 74c0-10 22-16 40-22l30-22c9-7 20-4 28 5l40 22c22 7 40 10 40 22v9H12z" fill="#111"/><path d="M12 83h178v6H12z" fill="#fff"/><path d="M60 55l30 15" stroke="#d9ff3d" stroke-width="6" stroke-linecap="round"/><path d="M110 40l50 26" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".5"/></svg>
  </div><div class="grain"></div></div>
  <div class="slide s2"><div class="shot">
    <svg viewBox="0 0 200 110"><rect x="20" y="30" width="30" height="50" rx="6" fill="#111"/><rect x="150" y="30" width="30" height="50" rx="6" fill="#111"/><rect x="8" y="38" width="16" height="34" rx="4" fill="#111"/><rect x="176" y="38" width="16" height="34" rx="4" fill="#111"/><rect x="50" y="49" width="100" height="12" rx="6" fill="#111"/><rect x="85" y="47" width="30" height="16" rx="6" fill="#fff"/></svg>
  </div><div class="grain"></div></div>
  <div class="slide s3"><div class="shot">
    <svg viewBox="0 0 200 110"><rect x="72" y="8" width="56" height="94" rx="20" fill="#111"/><rect x="84" y="2" width="32" height="14" rx="6" fill="#111"/><rect x="72" y="42" width="56" height="30" fill="#fff"/><rect x="82" y="50" width="36" height="6" rx="3" fill="#2e6bff"/><rect x="82" y="60" width="22" height="5" rx="2.5" fill="#111" opacity=".5"/></svg>
  </div><div class="grain"></div></div>
  <div class="wipe"></div>
  <div class="ui">
    <div class="idx"><span class="i1">01 / 03</span><span class="i2">02 / 03</span><span class="i3">03 / 03</span></div>
    <div class="tag">Northwind · Drop 04</div>
    <div class="bar"><i></i></div>
    <div class="name"><span class="n1">Velocity</span><span class="n2">Ironset</span><span class="n3">Hydra</span></div>
    <div class="price"><span class="p1">$180</span><span class="p2">$240</span><span class="p3">$32</span></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 3 });
  const D = 1; // one second per shot
  // stacking: slide 3 sits underneath at t=0 so the loop reads as 3 → 1; each new slide wipes in on top
  gsap.set('.s1', { zIndex: 3 }); gsap.set('.s2', { zIndex: 1 }); gsap.set('.s3', { zIndex: 2 });
  gsap.set(['.n2','.n3'], { position:'absolute', left:0, top:0 });
  gsap.set(['.i2','.i3','.p2','.p3'], { yPercent: 110 });
  tl.set('.s2', { zIndex: 4 }, 1).set('.s3', { zIndex: 5 }, 2);
  for (let i = 0; i < 3; i++) {
    const t = i * D, s = `.s${i+1}`;
    // each shot enters with a hard wipe and settles with a slow push-in
    tl.fromTo(s, { clipPath: 'inset(0 0 0 100%)' }, { clipPath: 'inset(0 0 0 0%)', duration: 0.42, ease: 'expo.inOut', immediateRender: i === 0 }, t)
      .fromTo(s + ' .shot', { xPercent: 12, scale: 1.18, rotation: -6 }, { xPercent: 0, scale: 1.0, rotation: 0, duration: 0.55, ease: 'expo.out', immediateRender: false }, t + 0.1)
      .to(s + ' .shot', { scale: 1.06, duration: D - 0.6, ease: 'none' }, t + 0.6)
      .fromTo(`.n${i+1}`, { yPercent: 110 }, { yPercent: 0, duration: 0.45, ease: 'expo.out' }, t + 0.18)
      .to(`.n${i+1}`, { yPercent: -110, duration: 0.3, ease: 'expo.in' }, t + D - 0.22)
      .fromTo(`.i${i+1}`, { yPercent: 110 }, { yPercent: 0, duration: 0.35, ease: 'expo.out' }, t + 0.2)
      .to(`.i${i+1}`, { yPercent: -110, duration: 0.25, ease: 'expo.in' }, t + D - 0.2)
      .fromTo(`.p${i+1}`, { yPercent: 110 }, { yPercent: 0, duration: 0.35, ease: 'expo.out' }, t + 0.26)
      .to(`.p${i+1}`, { yPercent: -110, duration: 0.25, ease: 'expo.in' }, t + D - 0.2)
      .fromTo('.bar i', { scaleX: 0 }, { scaleX: 1, duration: D, ease: 'none' }, t);
  }
  gsap.set('.s3 .shot', { scale: 1.06 });
</script>
