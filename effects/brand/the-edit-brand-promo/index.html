<!doctype html><meta charset="utf-8">
<title>The Edit: Brand Promo</title>
<meta name="fx" content="w=1080 h=1920">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#000;font-family:"Sharp Grotesk","Atlas Grotesk",sans-serif}
  .cut{position:absolute;inset:0;opacity:0}
  .cut .bg{position:absolute;inset:0;overflow:hidden}
  .cut video,.cut img{position:absolute;left:50%;top:50%;width:200%;height:100%;object-fit:cover;transform:translate(-50%,-50%);will-change:transform}
  .cut .tint{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.75}
  .cut .grain{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0),rgba(0,0,0,.55))}
  .word{position:absolute;left:70px;right:70px;color:#fff;font-weight:500;text-transform:uppercase;letter-spacing:-.05em;line-height:.86;will-change:transform}
  .word .l{display:block;overflow:hidden}
  .word .l span{display:block;will-change:transform}
  .c1 .word{top:520px;font-size:230px}
  .c2 .word{top:420px;font-size:250px;text-align:right}
  .c3 .word{top:560px;font-size:210px}
  .c4 .word{top:640px;font-size:180px;text-align:center}
  .tag{position:absolute;left:70px;bottom:150px;color:#fff;font-family:"Atlas Grotesk",sans-serif;font-size:30px;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:22px}
  .tag i{width:64px;height:2px;background:#fff;display:block}
  .logo{position:absolute;right:70px;top:110px;display:flex;align-items:center;gap:14px;color:#fff;font-size:30px;letter-spacing:.2em;text-transform:uppercase}
  .logo i{width:34px;height:34px;border-radius:9px;background:#fff;display:block}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .bar{position:absolute;left:0;right:0;height:26px;background:#fff;transform:scaleX(0);transform-origin:left}
</style>
<div class="stage">
  <div class="cut c1">
    <div class="bg"><video muted playsinline preload="auto" src="../../../assets/backgrounds/drift-ember.mp4"></video><div class="tint" style="background:#ff3d00"></div><div class="grain"></div></div>
    <div class="word"><span class="l"><span>Make</span></span><span class="l"><span>Noise</span></span></div>
    <div class="tag"><i></i>Acme SS/26</div>
  </div>
  <div class="cut c2">
    <div class="bg"><img src="../../../assets/backgrounds/ocean.png"><div class="tint" style="background:#0059ff"></div><div class="grain"></div></div>
    <div class="word"><span class="l"><span>Move</span></span><span class="l"><span>Fast</span></span><span class="l"><span>Stay</span></span><span class="l"><span>Loud</span></span></div>
  </div>
  <div class="cut c3">
    <div class="bg"><video muted playsinline preload="auto" src="../../../assets/backgrounds/drift-violet.mp4"></video><div class="tint" style="background:#c800ff"></div><div class="grain"></div></div>
    <div class="word"><span class="l"><span>Wear</span></span><span class="l"><span>It</span></span><span class="l"><span>Bold</span></span></div>
    <div class="bar" style="top:1300px"></div>
  </div>
  <div class="cut c4">
    <div class="bg"><img src="../../../assets/backgrounds/sunset.png"><div class="tint" style="background:#ffb300"></div><div class="grain"></div></div>
    <div class="word"><span class="l"><span>New</span></span><span class="l"><span>Drop</span></span><span class="l"><span>09.12</span></span></div>
    <div class="tag" style="left:0;right:0;justify-content:center"><i></i>acme.co<i></i></div>
  </div>
  <div class="logo"><i></i>Acme</div>
  <div class="flash"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const vids = gsap.utils.toArray('video');
  vids.forEach(v => fx.wait(new Promise(r => { if (v.readyState >= 2) r(); else v.addEventListener('loadeddata', r, { once: true }); })));
  const tl = fx.timeline({ duration: 5 });
  tl.to({}, { duration: 5, onUpdate() { const t = this.progress() * 5; vids.forEach((v, i) => { v.currentTime = (t + i * 5) % (v.duration || 16); }); } }, 0);
  const cuts = [['.c1', 0, 1.3], ['.c2', 1.3, 2.5], ['.c3', 2.5, 3.7], ['.c4', 3.7, 5]];
  cuts.forEach(([sel, a, b]) => {
    const el = document.querySelector(sel);
    // hard cut: visible only during its window
    tl.set(el, { opacity: 1 }, a).set(el, { opacity: 0 }, b);
    // punch: the image lands slightly big and eases down, panning
    tl.fromTo(el.querySelector('video,img'), { scale: 1.18, xPercent: -50, yPercent: -50 }, { scale: 1.02, duration: b - a, ease: 'power2.out' }, a);
    // type snaps up out of its line masks
    tl.fromTo(el.querySelectorAll('.word .l span'), { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: 'expo.out', stagger: 0.07 }, a + 0.02);
    tl.fromTo(el.querySelector('.word'), { scale: 1.06 }, { scale: 1, duration: b - a, ease: 'power2.out' }, a);
    const tag = el.querySelector('.tag'); if (tag) tl.fromTo(tag, { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: 'expo.out' }, a + 0.3);
    // white flash on the cut
    tl.fromTo('.flash', { opacity: 0.9 }, { opacity: 0, duration: 0.18, ease: 'power2.out' }, a);
  });
  tl.fromTo('.bar', { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: 'expo.out' }, 2.75).to('.bar', { scaleX: 0, transformOrigin: 'right', duration: 0.3, ease: 'expo.in' }, 3.35);
  tl.from('.logo', { y: -30, opacity: 0, duration: 0.6, ease: 'expo.out' }, 0.2);
  // final: last words shove out so the loop can flash back in
  tl.to('.c4 .word .l span', { yPercent: -110, duration: 0.3, ease: 'expo.in', stagger: 0.04 }, 4.72);
</script>
