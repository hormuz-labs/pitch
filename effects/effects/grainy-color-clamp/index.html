<!doctype html><meta charset="utf-8">
<title>Grainy Color Clamp</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#1a1418}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  .caption{position:absolute;left:60px;bottom:52px;color:#fff3e3;font-family:"Sorts Mill Goudy",serif;font-size:56px;line-height:1;letter-spacing:-.01em;mix-blend-mode:screen}
  .caption em{font-style:italic;opacity:.75;font-size:26px;display:block;margin-top:10px;font-family:"Atlas Grotesk",sans-serif;letter-spacing:.2em;text-transform:uppercase}
  .sw{position:absolute;right:60px;bottom:60px;display:flex;gap:8px}
  .sw i{width:34px;height:34px;border-radius:8px;border:2px solid rgba(255,255,255,.6);transform-origin:bottom}
</style>
<div class="stage">
  <canvas id="c" width="640" height="360"></canvas>
  <div class="caption">Issue nº 12<em>The colour report</em></div>
  <div class="sw" id="sw"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const W = 640, H = 360;

  // procedural footage (pixel access on file:// images taints the canvas, so the "footage" is painted): sky, sun, ridges, sea, a figure
  function footage(c, w, h, t, pan) {
    const sky = c.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, '#2b1d4f'); sky.addColorStop(0.45, '#c9536b'); sky.addColorStop(0.7, '#ffb36b'); sky.addColorStop(1, '#ffe2b0');
    c.fillStyle = sky; c.fillRect(0, 0, w, h);
    const sx = w * 0.62 + pan * 0.3, sy = h * 0.5;
    const sun = c.createRadialGradient(sx, sy, 10, sx, sy, h * 0.42); sun.addColorStop(0, '#fff6d8'); sun.addColorStop(0.25, '#ffcf7a'); sun.addColorStop(1, 'rgba(255,180,100,0)');
    c.fillStyle = sun; c.fillRect(0, 0, w, h);
    c.fillStyle = '#ffefc4'; c.beginPath(); c.arc(sx, sy, h * 0.12, 0, Math.PI * 2); c.fill();
    const ridges = [['#7a3a5a', 0.62, 60, 0.2], ['#4e2547', 0.7, 44, 0.5], ['#2b1630', 0.8, 30, 0.9]];
    for (const [col, base, amp, par] of ridges) {
      c.fillStyle = col; c.beginPath(); c.moveTo(0, h);
      for (let x = 0; x <= w; x += 8) { const u = (x + pan * par) / w * 6; c.lineTo(x, h * base - amp * (Math.sin(u) * 0.6 + Math.sin(u * 2.3 + 1) * 0.3 + Math.sin(u * 5.1) * 0.15)); }
      c.lineTo(w, h); c.fill();
    }
    // the sea: horizontal light bands under the sun, shimmering with time
    for (let i = 0; i < 26; i++) {
      const y = h * 0.84 + i * (h * 0.16 / 26);
      const ww = (h * 0.1 + i * 9) * (0.7 + 0.3 * Math.sin(t * 3 + i * 1.7));
      c.fillStyle = `rgba(255,220,150,${0.35 - i * 0.01})`; c.fillRect(sx - ww / 2 + 12 * Math.sin(t * 2 + i), y, ww, 2);
    }
    // a figure on the near ridge, walking
    const fx0 = w * 0.3 + pan * 0.9, fy0 = h * 0.8 - 8; c.fillStyle = '#160a18';
    c.beginPath(); c.arc(fx0, fy0 - h * 0.13, h * 0.025, 0, Math.PI * 2); c.fill();
    c.fillRect(fx0 - h * 0.018, fy0 - h * 0.11, h * 0.036, h * 0.08);
    c.save(); c.translate(fx0, fy0 - h * 0.03); c.rotate(0.35 * Math.sin(t * 4)); c.fillRect(-h * 0.008, 0, h * 0.016, h * 0.04); c.rotate(-0.7 * Math.sin(t * 4)); c.fillRect(-h * 0.008, 0, h * 0.016, h * 0.04); c.restore();
  }
  const out = document.getElementById('c').getContext('2d');
  const src = document.createElement('canvas'); src.width = W; src.height = H; const sc = src.getContext('2d');
  // editorial palettes; the clamp steps through them
  const pals = [
    ['#1a1418', '#6b2d3a', '#e0623c', '#f6c89a', '#fff3e3'],
    ['#0d1b2a', '#1b4965', '#5fa8d3', '#bee9e8', '#fff3e3'],
    ['#1a1418', '#3f2a56', '#9a4fb5', '#f2a7d2', '#fff3e3'],
  ];
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const P = pals.map(p => p.map(hex));
  const sw = document.getElementById('sw');
  for (let i = 0; i < 5; i++) sw.appendChild(document.createElement('i'));
  const D = 4;
  const state = { grain: 0.35, pal: 0, levels: 5 };
  const smooth = x => x * x * (3 - 2 * x);
  fx.register({ duration: D, seek(t) {
    const p = t / D;
    // slow push-in on the footage
    footage(sc, W, H, t, 40 * Math.sin(p * Math.PI * 2));
    // which palette, and the crossfade between palettes happens as a hard cut with grain surge
    const seg = p * 3; const k = Math.floor(seg) % 3; const f = seg - Math.floor(seg);
    const cutSurge = Math.exp(-f * 8) + Math.exp(-(1 - f) * 8);
    const grain = 0.18 + 0.5 * cutSurge;
    const levels = 2 + Math.round(2.99 * smooth(Math.min(1, f * 1.4)));   // the palette "opens up": 2 → 5 colours after each cut
    const pal = P[k];
    const d = sc.getImageData(0, 0, W, H), q = d.data;
    const rnd = fx.rng(1000 + Math.round(t * 30));
    for (let i = 0; i < q.length; i += 4) {
      let l = (q[i] * 0.3 + q[i + 1] * 0.59 + q[i + 2] * 0.11) / 255;
      l += (rnd() - 0.5) * grain;
      let idx = Math.round(l * (levels - 1)); idx = idx < 0 ? 0 : idx > levels - 1 ? levels - 1 : idx;
      const c = pal[Math.round(idx * 4 / (levels - 1))];
      q[i] = c[0]; q[i + 1] = c[1]; q[i + 2] = c[2];
    }
    out.putImageData(d, 0, 0);
    const swatches = sw.children;
    for (let i = 0; i < 5; i++) { const on = Math.round(i * (levels - 1) / 4) * 4 / (levels - 1) === i || levels === 5; swatches[i].style.background = pals[k][i]; swatches[i].style.transform = `scaleY(${on ? 1 : 0.35})`; swatches[i].style.opacity = on ? 1 : 0.4; }
  } });
</script>
