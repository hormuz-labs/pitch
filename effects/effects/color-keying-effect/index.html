<!doctype html><meta charset="utf-8">
<title>Color Keying Effect</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#000;font-family:"Atlas Grotesk",sans-serif}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .panel{position:absolute;left:40px;bottom:40px;width:300px;padding:18px 20px;border-radius:16px;background:rgba(10,12,18,.72);color:#fff;backdrop-filter:blur(8px);font-size:13px}
  .panel .t{display:flex;align-items:center;gap:10px;font-weight:500;font-size:14px;margin-bottom:12px}
  .panel .t i{width:18px;height:18px;border-radius:5px;background:#00b140}
  .lab{display:flex;justify-content:space-between;color:#aeb4c2;margin-bottom:6px}
  .track{height:6px;border-radius:3px;background:#2a2e3a;position:relative}
  .track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#3ee6c8;width:0}
  .track b{position:absolute;top:-5px;width:16px;height:16px;border-radius:50%;background:#fff;margin-left:-8px;left:0}
  .split{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 12px #fff}
  .tag{position:absolute;top:36px;padding:6px 12px;border-radius:8px;background:#fff;color:#111;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
</style>
<div class="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div class="split" id="split"><div class="tag" id="tagL" style="right:14px">Keyed</div><div class="tag" id="tagR" style="left:14px">Source</div></div>
  <div class="panel">
    <div class="t"><i></i>Key color · #00B140</div>
    <div class="lab"><span>Tolerance</span><span id="tv">0%</span></div>
    <div class="track"><i id="fill"></i><b id="knob"></b></div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const W = 1280, H = 720;
  const bg = new Image(); bg.src = '../../../assets/backgrounds/aurora.png'; fx.wait(bg.decode());
  const out = document.getElementById('c').getContext('2d');
  const src = document.createElement('canvas'); src.width = W; src.height = H; const sc = src.getContext('2d');
  const keyed = document.createElement('canvas'); keyed.width = W; keyed.height = H; const kc = keyed.getContext('2d');
  const KEY = [0, 177, 64];
  function drawSource(t) {
    sc.fillStyle = '#00b140'; sc.fillRect(0, 0, W, H);
    // a subtle lighting gradient on the "screen" so the key has to work
    const g = sc.createRadialGradient(640, 360, 100, 640, 360, 800); g.addColorStop(0, 'rgba(255,255,255,.08)'); g.addColorStop(1, 'rgba(0,0,0,.18)');
    sc.fillStyle = g; sc.fillRect(0, 0, W, H);
    // the subject: a phone mockup with a floating badge and orbiting shapes
    sc.save(); sc.translate(640 + 30 * Math.sin(t * 1.2), 380 + 12 * Math.sin(t * 2.1)); sc.rotate(0.04 * Math.sin(t * 1.5));
    sc.shadowColor = 'rgba(0,0,0,.35)'; sc.shadowBlur = 40; sc.shadowOffsetY = 20;
    rr(sc, -150, -300, 300, 600, 44, '#111319'); sc.shadowColor = 'transparent';
    rr(sc, -138, -288, 276, 576, 34, '#f4f5f8');
    rr(sc, -110, -230, 220, 140, 18, '#ff5a2b'); rr(sc, -110, -70, 220, 16, 8, '#d8dbe3'); rr(sc, -110, -40, 150, 16, 8, '#d8dbe3');
    for (let i = 0; i < 3; i++) rr(sc, -110, 0 + i * 70, 220, 54, 14, '#e6e9ef');
    rr(sc, -110, 220, 220, 48, 24, '#111319');
    sc.restore();
    for (let i = 0; i < 5; i++) {
      const a = t * 0.9 + i * Math.PI * 2 / 5; const r = 330 + 20 * Math.sin(t * 2 + i);
      sc.fillStyle = ['#ffd23f', '#ff5a2b', '#ffffff', '#3ee6c8', '#8b7bff'][i];
      sc.beginPath(); sc.arc(640 + Math.cos(a) * r, 380 + Math.sin(a) * r * 0.55, 18 + 6 * Math.sin(t * 3 + i), 0, Math.PI * 2); sc.fill();
    }
  }
  function rr(c, x, y, w, h, r, col) { c.fillStyle = col; c.beginPath(); c.roundRect(x, y, w, h, r); c.fill(); }
  function key(tol) {
    const d = sc.getImageData(0, 0, W, H), p = d.data;
    const lo = 40 + tol * 40, hi = lo + 60 + tol * 90;
    for (let i = 0; i < p.length; i += 4) {
      const dr = p[i] - KEY[0], dg = p[i + 1] - KEY[1], db = p[i + 2] - KEY[2];
      const dist = Math.sqrt(dr * dr + dg * dg + db * db) * 1.0 + (p[i + 1] - Math.max(p[i], p[i + 2])) * -0.4;
      let a = (dist - lo) / (hi - lo); a = a < 0 ? 0 : a > 1 ? 1 : a;
      p[i + 3] = a * 255 * tol + p[i + 3] * (1 - tol);
      // spill suppression: pull green down toward the other channels
      if (tol > 0) { const m = Math.max(p[i], p[i + 2]); if (p[i + 1] > m) p[i + 1] = m + (p[i + 1] - m) * (1 - tol); }
    }
    kc.putImageData(d, 0, 0);
  }
  const state = { tol: 0, split: 0 };
  const tl = fx.timeline({ duration: 5 });
  tl.to(state, { tol: 1, duration: 1.2, ease: 'power2.inOut' }, 0.4)
    .to(state, { split: 1, duration: 1.4, ease: 'expo.inOut' }, 0.5)
    .to(state, { split: 0, duration: 1.2, ease: 'expo.inOut' }, 3.4)
    .to(state, { tol: 0, duration: 1.0, ease: 'power2.inOut' }, 3.8);
  const base = window.__fx.seek;
  window.__fx.seek = t => {
    base(t);
    drawSource(t);
    key(state.tol);
    // background drifts behind the keyed subject
    out.clearRect(0, 0, W, H);
    out.drawImage(bg, -60 + 60 * Math.sin(t * 0.6), -40, W + 120, H + 80);
    out.drawImage(keyed, 0, 0);
    const sx = state.split * (W + 4) - 2;
    // right of the split: raw source; the wipe reveals the keyed composite behind it
    const rw = Math.max(1, W - sx);
    if (sx < W) out.drawImage(src, Math.max(0, sx), 0, rw, H, Math.max(0, sx), 0, rw, H);
    document.getElementById('split').style.left = sx + 'px';
    document.getElementById('tv').textContent = Math.round(state.tol * 100) + '%';
    document.getElementById('fill').style.width = state.tol * 100 + '%';
    document.getElementById('knob').style.left = state.tol * 100 + '%';
  };
</script>
