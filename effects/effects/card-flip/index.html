<!doctype html><meta charset="utf-8">
<title>Card Flip</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#e9ecf3;font-family:"Atlas Grotesk",sans-serif;color:#15171c}
  .bgblob{position:absolute;width:900px;height:900px;left:50%;top:50%;margin:-450px 0 0 -450px;border-radius:50%;background:conic-gradient(from 0deg,#cdd6ff,#ffd8c8,#c8f2e6,#cdd6ff);filter:blur(60px);opacity:.8}
  .scene{position:absolute;inset:0;perspective:1600px;display:flex;align-items:center;justify-content:center}
  .card{position:relative;width:400px;height:520px;transform-style:preserve-3d}
  .face{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;box-shadow:0 30px 70px rgba(20,30,60,.22);overflow:hidden;display:flex;flex-direction:column}
  .front{background:#fff}
  .hero{height:300px;background:linear-gradient(150deg,#ff9f6b,#ff4d7d 60%,#8a3bff);position:relative}
  .hero .shape{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:40px;background:rgba(255,255,255,.22);backdrop-filter:blur(2px);border:2px solid rgba(255,255,255,.5)}
  .hero .shape i{position:absolute;inset:34px;border-radius:50%;background:#fff}
  .body{padding:26px 28px;display:flex;flex-direction:column;gap:8px;flex:1}
  .name{font-family:"Sharp Grotesk",sans-serif;font-size:30px;font-weight:500;letter-spacing:-.02em}
  .meta{color:#7c8391;font-size:14px}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
  .price{font-size:26px;font-weight:500}
  .btn{background:#15171c;color:#fff;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:500}
  .back{background:#15171c;color:#fff;transform:rotateY(180deg);padding:30px}
  .back h3{font-family:"Sharp Grotesk",sans-serif;font-size:26px;font-weight:500;margin-bottom:18px;letter-spacing:-.02em}
  .spec{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #2b2e3a;font-size:15px}
  .spec span:last-child{color:#a8adbd}
  .cta{margin-top:auto;background:#ff4d7d;border-radius:12px;padding:14px;text-align:center;font-weight:500}
  .hint{position:absolute;left:0;right:0;bottom:48px;text-align:center;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#7c8391}
</style>
<div class="stage">
  <div class="bgblob" id="blob"></div>
  <div class="scene"><div class="card" id="card">
    <div class="face front">
      <div class="hero"><div class="shape"><i></i></div></div>
      <div class="body"><div class="name">Orbit Lamp</div><div class="meta">Warm dimmable · matte white</div>
        <div class="row"><div class="price">$149</div><div class="btn">Add to cart</div></div></div>
    </div>
    <div class="face back">
      <h3>Details</h3>
      <div class="spec"><span>Material</span><span>Recycled aluminium</span></div>
      <div class="spec"><span>Output</span><span>800 lm · 2700K</span></div>
      <div class="spec"><span>Weight</span><span>1.2 kg</span></div>
      <div class="spec"><span>Warranty</span><span>3 years</span></div>
      <div class="cta">Buy now</div>
    </div>
  </div></div>
  <div class="hint" id="hint">Tap to flip</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const tl = fx.timeline({ duration: 4 });
  tl.to('#blob', { rotation: 360, duration: 4, ease: 'none' }, 0)
    // idle hover-float
    .to('#card', { y: -8, rotationX: 4, duration: 2, ease: 'sine.inOut', repeat: 1, yoyo: true }, 0)
    // flip to the back: lift, turn, settle
    .to('#card', { rotationY: 180, duration: 0.9, ease: 'expo.inOut' }, 0.7)
    .to('#card', { scale: 1.08, duration: 0.45, ease: 'power2.out' }, 0.7)
    .to('#card', { scale: 1, duration: 0.45, ease: 'power2.in' }, 1.15)
    .from('.spec', { x: 24, opacity: 0, stagger: 0.06, duration: 0.5, ease: 'expo.out', immediateRender: false }, 1.2)
    .from('.cta', { y: 16, opacity: 0, duration: 0.5, ease: 'expo.out', immediateRender: false }, 1.45)
    // flip back to the front
    .to('#card', { rotationY: 360, duration: 0.9, ease: 'expo.inOut' }, 2.7)
    .to('#card', { scale: 1.08, duration: 0.45, ease: 'power2.out' }, 2.7)
    .to('#card', { scale: 1, duration: 0.45, ease: 'power2.in' }, 3.15)
    .from('.body > *', { y: 14, opacity: 0, stagger: 0.06, duration: 0.5, ease: 'expo.out', immediateRender: false }, 3.2)
    .to('#hint', { opacity: 0.3, duration: 0.5, ease: 'sine.inOut', repeat: 7, yoyo: true }, 0);
  // rotationY 360 == 0 so the loop closes
</script>
