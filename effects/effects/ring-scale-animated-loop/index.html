<!doctype html><meta charset="utf-8">
<title>Ring Scale: Animated Loop</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0f1020;font-family:"Atlas Grotesk",sans-serif}
  .ring{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;border:4px solid #7c6bff;will-change:transform,opacity}
  .badge{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;background:linear-gradient(150deg,#8b7bff,#4d3cff);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;box-shadow:0 20px 60px rgba(77,60,255,.5)}
  .badge b{font-family:"Sharp Grotesk",sans-serif;font-size:56px;font-weight:500;letter-spacing:-.03em;line-height:1}
  .badge span{font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.85;margin-top:6px}
  .halo{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;background:#7c6bff;filter:blur(30px);opacity:.5}
  .tick{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff}
</style>
<div class="stage">
  <div class="halo" id="halo"></div>
  <div id="rings"></div>
  <div class="badge" id="badge"><b>Live</b><span>Now on air</span></div>
  <div id="ticks"></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 4, BEAT = 1, N = 4;                             // one ring per beat; 4 beats per loop
  const wrap = document.getElementById('rings'), badge = document.getElementById('badge'), halo = document.getElementById('halo');
  const rings = []; for (let i = 0; i < N; i++) { const r = document.createElement('div'); r.className = 'ring'; wrap.appendChild(r); rings.push(r); }
  const tw = document.getElementById('ticks'); const ticks = []; for (let i = 0; i < 12; i++) { const d = document.createElement('div'); d.className = 'tick'; tw.appendChild(d); ticks.push(d); }
  const expoOut = x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
  fx.register({ duration: D, seek(t) {
    const p = t / D;
    for (let i = 0; i < N; i++) {
      const ph = ((t - i * BEAT) / (N * BEAT) + 1) % 1;     // ring i is born on beat i and lives for the whole loop
      const e = expoOut(ph);
      gsap.set(rings[i], { scale: 1 + e * 2.6, opacity: (1 - ph) * (1 - ph) * 0.9, borderWidth: 4 - 3 * ph });
    }
    // the badge pulses on the beat: a sharp hit then an elastic settle
    const b = (t % BEAT) / BEAT;
    const hit = Math.exp(-b * 9) * Math.cos(b * 22) * 0.12;
    gsap.set(badge, { scale: 1 + hit + 0.02 * Math.sin(p * Math.PI * 2 * 4) });
    gsap.set(halo, { scale: 1.4 + 0.5 * Math.exp(-b * 4), opacity: 0.35 + 0.4 * Math.exp(-b * 5) });
    // a ring of ticks orbits and each lights as the beat passes it
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6 + p * Math.PI * 2;
      const lit = Math.exp(-(((t * 3 - i) % 12 + 12) % 12) * 0.8);
      gsap.set(ticks[i], { x: Math.cos(a) * 300, y: Math.sin(a) * 300, scale: 0.6 + lit * 1.6, opacity: 0.3 + lit * 0.7 });
    }
  } });
</script>
