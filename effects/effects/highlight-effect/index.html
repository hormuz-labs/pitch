<!doctype html><meta charset="utf-8">
<title>Highlight Effect</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#101014;font-family:"Atlas Grotesk",sans-serif;color:#fff}
  .copy{position:absolute;left:120px;top:190px;width:1040px}
  h1{font-family:"Sharp Grotesk",sans-serif;font-weight:500;font-size:96px;line-height:1;letter-spacing:-.04em;position:relative}
  h1 .hl{position:relative;display:inline-block;padding:0 12px;z-index:1}
  h1 .hl svg{position:absolute;left:-6px;top:6px;width:calc(100% + 12px);height:100%;z-index:-1;overflow:visible}
  h1 .hl path{fill:none;stroke:#ffd23f;stroke-width:64;stroke-linecap:round;mix-blend-mode:screen;opacity:.9}
  p{font-size:22px;color:#a9adbb;margin-top:28px;max-width:640px;line-height:1.45}
  .btn{position:absolute;left:120px;top:520px;padding:20px 34px;border-radius:14px;background:#fff;color:#111;font-weight:500;font-size:20px;overflow:hidden}
  .sheen{position:absolute;top:-50%;bottom:-50%;width:140px;background:linear-gradient(105deg,rgba(255,255,255,0),rgba(255,255,255,.95) 50%,rgba(255,255,255,0));transform:skewX(-18deg);pointer-events:none;mix-blend-mode:screen}
  .sweep{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 60%);mix-blend-mode:overlay}
  .textwrap{position:relative;display:inline-block;overflow:hidden}
  .textwrap .sheen{width:220px;background:linear-gradient(105deg,rgba(255,255,255,0),rgba(255,210,63,.95) 50%,rgba(255,255,255,0))}
  .card{position:absolute;right:120px;top:470px;width:300px;padding:22px;border-radius:18px;background:#1b1b22;border:1px solid #2a2a33;overflow:hidden}
  .card b{display:block;font-size:34px;font-weight:500}
  .card span{font-size:13px;color:#a9adbb;letter-spacing:.1em;text-transform:uppercase}
  .card .ring{position:absolute;inset:-2px;border-radius:18px;border:2px solid #ffd23f;opacity:0}
</style>
<div class="stage">
  <div class="sweep" id="sweep"></div>
  <div class="copy">
    <h1><span class="textwrap">Ship faster with<div class="sheen" id="s1"></div></span><br><span class="hl">smarter<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path id="mark" d="M2 55 L98 52"/></svg></span> tooling.</h1>
    <p>One workspace for design, review and release. Highlight what matters, let the rest fade.</p>
  </div>
  <div class="btn">Start free trial<div class="sheen" id="s2"></div></div>
  <div class="card"><div class="ring" id="ring"></div><b>+42%</b><span>Faster reviews</span><div class="sheen" id="s3"></div></div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../../assets/gsap/DrawSVGPlugin.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);
  const tl = fx.timeline({ duration: 4 });
  // the big sweep of light across the frame, twice per loop
  tl.fromTo('#sweep', { xPercent: -110 }, { xPercent: 110, duration: 1.4, ease: 'power2.inOut' }, 0.1)
    .fromTo('#sweep', { xPercent: -110 }, { xPercent: 110, duration: 1.4, ease: 'power2.inOut' }, 2.3)
    // local sheens follow it across the headline, the button and the stat card
    .fromTo('#s1', { left: '-30%' }, { left: '110%', duration: 0.9, ease: 'power2.inOut' }, 0.3)
    .fromTo('#s2', { left: '-60%' }, { left: '130%', duration: 0.7, ease: 'power2.inOut' }, 0.8)
    .fromTo('#s3', { left: '-60%' }, { left: '130%', duration: 0.7, ease: 'power2.inOut' }, 1.1)
    .fromTo('#s1', { left: '-30%' }, { left: '110%', duration: 0.9, ease: 'power2.inOut' }, 2.5)
    .fromTo('#s2', { left: '-60%' }, { left: '130%', duration: 0.7, ease: 'power2.inOut' }, 3.0)
    .fromTo('#s3', { left: '-60%' }, { left: '130%', duration: 0.7, ease: 'power2.inOut' }, 3.3)
    // the marker highlight draws behind the key word, then wipes away before the loop closes
    .fromTo('#mark', { drawSVG: '0% 0%' }, { drawSVG: '0% 100%', duration: 0.6, ease: 'power3.out' }, 0.7)
    .to('#mark', { drawSVG: '100% 100%', duration: 0.5, ease: 'power3.in' }, 3.3)
    .fromTo('#ring', { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'expo.out' }, 1.2)
    .to('#ring', { opacity: 0, duration: 0.4 }, 2.6)
    .fromTo('.card b', { scale: 1 }, { scale: 1.08, duration: 0.25, ease: 'back.out(3)', yoyo: true, repeat: 1 }, 1.2)
    .fromTo('.card b', { scale: 1 }, { scale: 1.08, duration: 0.25, ease: 'back.out(3)', yoyo: true, repeat: 1 }, 3.4);
</script>
