<!doctype html><meta charset="utf-8">
<title>3D Rotation</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:radial-gradient(ellipse at 50% 40%,#2a2f45,#0c0e18 70%);font-family:"Atlas Grotesk",sans-serif}
  .world{position:absolute;inset:0;perspective:1400px;perspective-origin:50% 42%}
  .box{position:absolute;left:50%;top:50%;width:260px;height:380px;margin:-190px 0 0 -130px;transform-style:preserve-3d}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:6px;display:flex;flex-direction:column;justify-content:space-between;padding:26px;color:#fff}
  .front{background:linear-gradient(160deg,#ff8a5b,#ff3d77 55%,#7b2cff)}
  .back{background:linear-gradient(160deg,#7b2cff,#ff3d77 45%,#ff8a5b);transform:rotateY(180deg) translateZ(80px)}
  .front{transform:translateZ(80px)}
  .side{width:160px;left:50px;background:#c92d5f}
  .left{transform:rotateY(-90deg) translateZ(130px)}
  .right{transform:rotateY(90deg) translateZ(130px)}
  .cap{height:160px;top:110px;background:#ffb08a;border-radius:6px}
  .top{transform:rotateX(90deg) translateZ(190px)}
  .bottom{transform:rotateX(-90deg) translateZ(190px)}
  .mark{width:44px;height:44px;border-radius:50%;border:5px solid #fff}
  .brand{font-family:"Sharp Grotesk",sans-serif;font-size:36px;font-weight:500;letter-spacing:-.02em;line-height:1}
  .small{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-top:8px}
  .shadow{position:absolute;left:50%;top:50%;width:360px;height:70px;margin:220px 0 0 -180px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),rgba(0,0,0,0) 70%)}
  .shade{position:absolute;inset:0;background:#000;border-radius:6px;pointer-events:none}
  .glow{position:absolute;left:50%;top:50%;width:700px;height:700px;margin:-350px 0 0 -350px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,120,.25),rgba(0,0,0,0) 60%)}
  .cap .shade{border-radius:6px}
  .caption{position:absolute;left:0;right:0;bottom:60px;text-align:center;color:#fff;font-size:14px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
</style>
<div class="stage">
  <div class="glow" id="glow"></div>
  <div class="shadow" id="shadow"></div>
  <div class="world"><div class="box" id="box">
    <div class="face front"><div class="mark"></div><div><div class="brand">Acme<br>Glow</div><div class="small">Night serum · 30ml</div></div><div class="shade"></div></div>
    <div class="face back"><div class="mark"></div><div><div class="brand">No.<br>03</div><div class="small">Made in Lisbon</div></div><div class="shade"></div></div>
    <div class="face side left"><div class="shade"></div></div>
    <div class="face side right"><div class="shade"></div></div>
    <div class="face cap top"><div class="shade"></div></div>
    <div class="face cap bottom"><div class="shade"></div></div>
  </div></div>
  <div class="caption">Spin · tilt · reveal</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const box = document.getElementById('box'), shadow = document.getElementById('shadow'), glow = document.getElementById('glow');
  const faces = { front: [0, 0, 1], back: [0, 0, -1], left: [-1, 0, 0], right: [1, 0, 0], top: [0, -1, 0], bottom: [0, 1, 0] };
  const shades = {}; for (const k in faces) shades[k] = document.querySelector('.' + k + ' .shade');
  const light = [0.4, -0.6, 0.7]; const ll = Math.hypot(...light); light.forEach((v, i) => light[i] = v / ll);
  const D = 6;
  fx.register({ duration: D, seek(t) {
    const p = t / D;
    const ry = p * 360;                                  // one full spin per loop
    const rx = -18 + 22 * Math.sin(p * Math.PI * 2);     // tilt swings up and down once
    const rz = 6 * Math.sin(p * Math.PI * 4);
    const fy = -14 * Math.sin(p * Math.PI * 2 + 1);
    gsap.set(box, { rotationX: rx, rotationY: ry, rotationZ: rz, y: fy });
    gsap.set(shadow, { scale: 1 + fy / 120, opacity: 0.9 - fy / 60 });
    gsap.set(glow, { scale: 1 + 0.08 * Math.sin(p * Math.PI * 4), opacity: 0.8 + 0.2 * Math.sin(p * Math.PI * 2) });
    // per-face lambert shading from the rotation
    const cy = Math.cos(ry * Math.PI / 180), sy = Math.sin(ry * Math.PI / 180), cx = Math.cos(rx * Math.PI / 180), sx = Math.sin(rx * Math.PI / 180);
    for (const k in faces) {
      let [x, y, z] = faces[k];
      let x1 = x * cy + z * sy, z1 = -x * sy + z * cy;    // rotate Y
      let y2 = y * cx - z1 * sx, z2 = y * sx + z1 * cx;   // rotate X
      const d = Math.max(0, x1 * light[0] + y2 * light[1] + z2 * light[2]);
      shades[k].style.opacity = (0.55 - d * 0.55).toFixed(3);
    }
  } });
</script>
