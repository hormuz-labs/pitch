<!doctype html><meta charset="utf-8">
<title>Holographic Logo</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:radial-gradient(ellipse at 50% 50%,#1b1b22,#08080b 70%);font-family:"Atlas Grotesk",sans-serif}
  .scene{position:absolute;inset:0;perspective:1200px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:30px}
  .logo{position:relative;width:260px;height:260px;transform-style:preserve-3d}
  .foil{position:absolute;inset:0;
    --a:0deg;--px:0%;
    background:
      linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 70%) var(--px) 0/300% 100% no-repeat,
      conic-gradient(from var(--a) at 50% 50%,#ff5ea8,#ffd23f,#3ee6c8,#5b8bff,#b06bff,#ff5ea8);
    -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 4 L94 30 V70 L50 96 L6 70 V30 Z' fill='black'/><circle cx='50' cy='50' r='19' fill='white'/><path d='M50 4 L94 30 V70 L50 96 L6 70 V30 Z M50 20 L80 37 V63 L50 80 L20 63 V37 Z' fill='black' fill-rule='evenodd'/></svg>") center/contain no-repeat;
    mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 4 L94 30 V70 L50 96 L6 70 V30 Z M50 20 L80 37 V63 L50 80 L20 63 V37 Z' fill='black' fill-rule='evenodd'/><circle cx='50' cy='50' r='19' fill='black'/></svg>") center/contain no-repeat;
    filter:saturate(1.3) contrast(1.1)}
  .word{font-family:"Sharp Grotesk",sans-serif;font-size:44px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;padding-left:.32em;
    --a:0deg;--px:0%;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.9) 50%,rgba(255,255,255,0) 70%) var(--px) 0/300% 100% no-repeat,conic-gradient(from var(--a) at 50% 50%,#ff5ea8,#ffd23f,#3ee6c8,#5b8bff,#b06bff,#ff5ea8);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .glow{position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,rgba(160,120,255,.35),rgba(0,0,0,0) 65%);filter:blur(10px)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.12;mix-blend-mode:overlay}
</style>
<div class="stage">
  <svg class="grain"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="scene">
    <div class="logo" id="logo"><div class="glow" id="glow"></div><div class="foil" id="foil"></div></div>
    <div class="word" id="word">Northwind</div>
  </div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 3;
  const foil = document.getElementById('foil'), word = document.getElementById('word'), logo = document.getElementById('logo'), glow = document.getElementById('glow');
  const smooth = x => x * x * (3 - 2 * x);
  fx.register({ duration: D, seek(t) {
    const p = t / D;
    // the iridescence: conic hue wheel turns a full revolution per loop (so it closes)
    foil.style.setProperty('--a', (p * 360) + 'deg');
    word.style.setProperty('--a', (-p * 360 + 120) + 'deg');
    // the specular sweep: a bright band crosses twice, offset between mark and wordmark
    const s1 = ((p * 2) % 1), s2 = ((p * 2 + 0.85) % 1);
    foil.style.setProperty('--px', (smooth(s1) * 100) + '%');
    word.style.setProperty('--px', (smooth(s2) * 100) + '%');
    // the mark tilts toward the light as the sheen passes, like a foil card in hand
    const ry = 22 * Math.sin(p * Math.PI * 2), rx = 12 * Math.sin(p * Math.PI * 2 + 1.2);
    gsap.set(logo, { rotationY: ry, rotationX: rx, scale: 1 + 0.03 * Math.sin(p * Math.PI * 4) });
    gsap.set(glow, { opacity: 0.6 + 0.4 * Math.sin(p * Math.PI * 4), rotation: p * 360 });
    // grain hue drifts by rotating the noise
    document.querySelector('.grain rect').setAttribute('transform', `translate(${-((Math.round(t * 30) * 37) % 200)} ${-((Math.round(t * 30) * 53) % 200)})`);
  } });
</script>
