<!doctype html><meta charset="utf-8">
<title>Dithering Effect</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#0e0b14}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
</style>
<div class="stage"><canvas id="c" width="320" height="180"></canvas></div>
<script src="../../_lib/fx.js"></script>
<script>
  // render at quarter res, one dither cell per canvas pixel, upscale with image-rendering:pixelated
  const W = 320, H = 180;
  const out = document.getElementById('c').getContext('2d');
  const src = document.createElement('canvas'); src.width = W; src.height = H; const sc = src.getContext('2d');
  const bayer = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const pal = [[14, 10, 24], [92, 40, 140], [255, 110, 80], [255, 236, 200]];
  const D = 4;
  function drawScene(t) {
    const p = t / D;
    sc.fillStyle = '#1a1030'; sc.fillRect(0, 0, W, H);
    // a lit sphere with the light circling it, and a slow gradient sweep behind
    const g0 = sc.createLinearGradient(0, 0, W, H); g0.addColorStop(0, '#0e0b14'); g0.addColorStop(0.5 + 0.4 * Math.sin(p * Math.PI * 2), '#3a2160'); g0.addColorStop(1, '#0e0b14');
    sc.fillStyle = g0; sc.fillRect(0, 0, W, H);
    const cx = 160 + 30 * Math.sin(p * Math.PI * 2), cy = 90, r = 62;
    const lx = cx + Math.cos(p * Math.PI * 2) * 40, ly = cy - 20 + Math.sin(p * Math.PI * 2) * 30;
    const g = sc.createRadialGradient(lx, ly, 4, cx, cy, r + 8);
    g.addColorStop(0, '#fff2d8'); g.addColorStop(0.45, '#ff7a55'); g.addColorStop(1, '#2a1240');
    sc.fillStyle = g; sc.beginPath(); sc.arc(cx, cy, r, 0, Math.PI * 2); sc.fill();
    // ring of small orbs
    for (let i = 0; i < 6; i++) {
      const a = p * Math.PI * 2 + i * Math.PI / 3;
      const x = cx + Math.cos(a) * 110, y = cy + Math.sin(a) * 45;
      const rg = sc.createRadialGradient(x - 3, y - 3, 1, x, y, 12); rg.addColorStop(0, '#ffe4b0'); rg.addColorStop(1, '#4a2070');
      sc.fillStyle = rg; sc.beginPath(); sc.arc(x, y, 12, 0, Math.PI * 2); sc.fill();
    }
    sc.fillStyle = '#ffe9c8'; sc.font = '500 22px "Sharp Grotesk", sans-serif'; sc.textAlign = 'center'; sc.fillText('DITHER', cx, 172);
  }
  fx.register({ duration: D, seek(t) {
    drawScene(t);
    const d = sc.getImageData(0, 0, W, H), q = d.data;
    const frame = Math.round(t * 30);
    const ox = frame % 4, oy = (frame >> 1) % 4;            // the matrix crawls: the animated noise
    const n = pal.length - 1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const l = (q[i] * 0.3 + q[i + 1] * 0.59 + q[i + 2] * 0.11) / 255;
      const th = (bayer[((y + oy) & 3) * 4 + ((x + ox) & 3)] + 0.5) / 16;
      let v = l * n + th - 0.5; let k = Math.round(v); k = k < 0 ? 0 : k > n ? n : k;
      q[i] = pal[k][0]; q[i + 1] = pal[k][1]; q[i + 2] = pal[k][2];
    }
    out.putImageData(d, 0, 0);
  } });
</script>
