<!doctype html><meta charset="utf-8">
<title>Image Stretch Transition</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#000}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .cap{position:absolute;left:70px;bottom:60px;color:#fff;font-family:"Sharp Grotesk",sans-serif;font-size:64px;font-weight:500;letter-spacing:-.03em;line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.4)}
  .cap small{display:block;font-family:"Atlas Grotesk",sans-serif;font-size:16px;letter-spacing:.24em;text-transform:uppercase;opacity:.75;margin-bottom:14px}
</style>
<div class="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div class="cap" id="cap"><small>01 / 03</small>Aurora</div>
</div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const W = 1280, H = 720;
  const names = ['Aurora', 'Ocean', 'Sunset'];
  const imgs = ['aurora', 'ocean', 'sunset'].map(n => { const i = new Image(); i.src = `../../../assets/backgrounds/${n}.png`; fx.wait(i.decode()); return i; });
  const ctx = document.getElementById('c').getContext('2d');
  const D = 8, HOLD = 8 / 3 - 1.1, TR = 1.1;                   // 3 × (hold + transition) = 8
  const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;   // cubic inOut
  // draw an image column-by-column with a warp: dest strip [x0,x1) samples the source by a power curve, so one edge
  // stretches into a long smear while the other stays sharp. pull>1 stretches the left edge, <1 the right edge
  function warped(img, x0, x1, pull) {
    const w = x1 - x0; if (w < 1) return;
    const cols = Math.ceil(w);
    for (let i = 0; i < cols; i++) {
      const u = (i + 0.5) / cols;
      const s = Math.pow(u, pull);                      // source position 0..1
      const s2 = Math.pow((i + 1) / cols, pull);
      const sw = Math.max(0.5, (s2 - s) * W);
      ctx.drawImage(img, s * W, 0, sw, H, x0 + i, 0, 1.01, H);
    }
  }
  function frame(t) {
    const seg = t / (HOLD + TR); const k = Math.floor(seg) % 3; const local = t - Math.floor(seg) * (HOLD + TR);
    const A = imgs[k], B = imgs[(k + 1) % 3];
    if (local < HOLD) {
      // slow drift on the held image
      const z = 1.04 + 0.03 * (local / HOLD);
      ctx.drawImage(A, (W - W * z) / 2, (H - H * z) / 2, W * z, H * z);
      return { k, p: 0 };
    }
    const p = ease((local - HOLD) / TR);
    // the outgoing image is pulled off to the left; its trailing edge stretches into a smear
    const edge = W * (1 - p);
    warped(A, 0, edge, 1 + 7 * Math.sin(p * Math.PI));
    // the incoming image is pulled in from the right, its leading edge stretched the same way
    warped(B, edge, W, 1 / (1 + 7 * Math.sin(p * Math.PI)));
    // a hot seam
    const g = ctx.createLinearGradient(edge - 30, 0, edge + 30, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, `rgba(255,255,255,${0.7 * Math.sin(p * Math.PI)})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(edge - 30, 0, 60, H);
    return { k, p };
  }
  const cap = document.getElementById('cap');
  fx.register({ duration: D, seek(t) {
    const { k, p } = frame(t);
    const shown = p > 0.5 ? (k + 1) % 3 : k;
    cap.innerHTML = `<small>0${shown + 1} / 03</small>${names[shown]}`;
    // caption is pulled with the image: slides out left as p→0.5 and in from the right after
    const off = p === 0 ? 0 : p < 0.5 ? -ease(p * 2) * 400 : (1 - ease((p - 0.5) * 2)) * 400;
    gsap.set(cap, { x: off, scaleX: 1 + Math.abs(off) / 250, opacity: 1 - Math.abs(off) / 400, transformOrigin: off < 0 ? 'right' : 'left' });
  } });
</script>
