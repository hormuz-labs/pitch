<!doctype html><meta charset="utf-8">
<title>Inward Echo Loop</title>
<meta name="fx" content="w=1280 h=720">
<link rel="stylesheet" href="../../_lib/base.css">
<style>
  .stage{background:#07070c;perspective:900px}
  .echo{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:64px;border:3px solid #fff;will-change:transform,opacity}
  .core{position:absolute;left:50%;top:50%;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:22px;background:#fff;box-shadow:0 0 60px rgba(255,255,255,.6)}
  .vig{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 30%,rgba(0,0,0,.8) 100%)}
</style>
<div class="stage"><div id="rings"></div><div class="core" id="core"></div><div class="vig"></div></div>
<script src="../../../assets/gsap/gsap.min.js"></script>
<script src="../../_lib/fx.js"></script>
<script>
  const D = 6, N = 14;                                   // 14 echoes in flight, one born every 6/14 s
  const wrap = document.getElementById('rings'), core = document.getElementById('core');
  const rings = [];
  for (let i = 0; i < N; i++) { const e = document.createElement('div'); e.className = 'echo'; wrap.appendChild(e); rings.push(e); }
  const easeIn = x => x * x * x;
  fx.register({ duration: D, seek(t) {
    const p = t / D;
    for (let i = 0; i < N; i++) {
      const ph = (p + i / N) % 1;                          // 0 = just born at the edge, 1 = swallowed by the core
      const s = 4.2 - 4.0 * (1 - Math.pow(1 - ph, 2.2));   // rushes early, eases into the centre
      const hue = (ph * 220 + p * 360) % 360;
      gsap.set(rings[i], {
        scale: Math.max(0.12, s),
        rotation: ph * 90 + p * 360,                         // each echo turns a quarter as it travels; the whole field spins once per loop
        opacity: Math.min(1, ph * 6) * (1 - easeIn(ph)) ,
        borderColor: `hsl(${hue} 90% 65%)`,
        borderWidth: 2 + ph * 6,
        z: -200 * ph,
      });
    }
    gsap.set(core, { scale: 1 + 0.18 * Math.sin(p * Math.PI * 2 * N), rotation: p * 360 + 45 });
  } });
</script>
