name: Deploy GKE

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pitch-gke-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_TARGET == 'gke'
    runs-on: ubuntu-latest
    environment: production-gke
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
      IMAGE_PREFIX: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}
      API_HOST: ${{ vars.GKE_API_HOST }}
      APP_URL: ${{ vars.GKE_APP_URL }}
      MEDIA_PUBLIC_URL: ${{ vars.GKE_MEDIA_PUBLIC_URL }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GKE_RUNTIME_SERVICE_ACCOUNT }}
      CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
      GKE_STATIC_IP_NAME: ${{ vars.GKE_STATIC_IP_NAME }}
      CLOAK_IMAGE: ${{ vars.CLOAK_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify application
        run: |
          bun install --frozen-lockfile
          bunx vitest run tests/
          bunx tsc -b packages/db packages/shared packages/storage
          bunx tsc --noEmit -p apps/web/tsconfig.solid.json
          # Match Bun's module resolution; the legacy composite config excludes .pi.
          bunx tsc --noEmit -p apps/api/tsconfig.json --composite false --rootDir . --module ESNext --moduleResolution Bundler --allowImportingTsExtensions
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GKE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin,kubectl
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Configure registry
        run: gcloud auth configure-docker "$REGISTRY" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime base
        id: base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/pitch-base:${{ github.sha }}
          cache-from: type=gha,scope=gke-base
          cache-to: type=gha,mode=max,scope=gke-base
      - name: Build API
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/pitch-api:${{ github.sha }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            RUNTIME_IMAGE=${{ env.IMAGE_PREFIX }}/pitch-base@${{ steps.base.outputs.digest }}
          cache-from: type=gha,scope=gke-api
          cache-to: type=gha,mode=max,scope=gke-api
      - name: Render and deploy
        env:
          API_IMAGE: ${{ env.IMAGE_PREFIX }}/pitch-api@${{ steps.api.outputs.digest }}
        run: |
          node scripts/render-gke.mjs > "$RUNNER_TEMP/pitch.yaml"
          kubectl get secret pitch-runtime -n pitch >/dev/null
          kubectl apply --dry-run=server -f "$RUNNER_TEMP/pitch.yaml"
          kubectl apply -f "$RUNNER_TEMP/pitch.yaml"
          kubectl rollout status deployment/pitch -n pitch --timeout=900s
          kubectl exec -n pitch deployment/pitch -c api -- node scripts/sandbox-check.mjs
          curl --fail --retry 12 --retry-delay 10 "https://$API_HOST/health/ready"
