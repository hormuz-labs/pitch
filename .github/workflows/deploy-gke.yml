name: Deploy GKE

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pitch-gke-production
  cancel-in-progress: false

jobs:
  deploy:
    # `both` keeps the Compose host deploying too, for the api → api-v2 transition.
    if: vars.DEPLOY_TARGET == 'gke' || vars.DEPLOY_TARGET == 'both'
    runs-on: ubuntu-latest
    # Workers roll one at a time and each may drain for up to STUDIO_DRAIN_MS.
    timeout-minutes: 360
    environment: production-gke
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install test tooling
        run: sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils
      - name: Verify application
        run: |
          bun install --frozen-lockfile
          bunx vitest run tests/
          bunx tsc -b packages/db packages/shared packages/storage
          bunx tsc --noEmit -p apps/web/tsconfig.solid.json
          # Match Bun's module resolution; the legacy composite config excludes .pi.
          bunx tsc --noEmit -p apps/api/tsconfig.json --composite false --rootDir . --module ESNext --moduleResolution Bundler --allowImportingTsExtensions
      # Set after the tests on purpose: the application reads APP_URL and friends,
      # and the suite must see the same environment as a developer's machine.
      - name: Deployment variables
        run: |
          cat >> "$GITHUB_ENV" <<EOF
          REGISTRY=${{ vars.GCP_REGION }}-docker.pkg.dev
          GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
          BUILD_SERVICE_ACCOUNT=${{ vars.GKE_BUILD_SERVICE_ACCOUNT }}
          IMAGE_PREFIX=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}
          API_HOST=${{ vars.GKE_API_HOST }}
          API_EXTRA_HOSTS=${{ vars.GKE_API_EXTRA_HOSTS }}
          APP_URL=${{ vars.GKE_APP_URL }}
          MEDIA_PUBLIC_URL=${{ vars.GKE_MEDIA_PUBLIC_URL }}
          GKE_STATIC_IP_NAME=${{ vars.GKE_STATIC_IP_NAME }}
          MEDIA_BUCKET=${{ vars.GKE_MEDIA_BUCKET }}
          PROFILES_BUCKET=${{ vars.GKE_PROFILES_BUCKET }}
          WORKSPACE_BUCKET=${{ vars.GKE_WORKSPACE_BUCKET }}
          RUNTIME_SERVICE_ACCOUNT=${{ vars.GKE_RUNTIME_SERVICE_ACCOUNT }}
          EOF
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GKE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin,kubectl
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Upload Cloud Build source
        run: |
          gcloud auth configure-docker "$REGISTRY" --quiet
          docker build \
            --file=Dockerfile.cloudbuild-source \
            --tag="$IMAGE_PREFIX/pitch-source:$GITHUB_SHA" \
            .
          docker push "$IMAGE_PREFIX/pitch-source:$GITHUB_SHA"
      - name: Build images in Cloud Build
        run: |
          gcloud builds submit \
            --project="$GCP_PROJECT_ID" \
            --config=cloudbuild.yaml \
            --no-source \
            --substitutions="_IMAGE_PREFIX=$IMAGE_PREFIX,_GIT_HASH=$GITHUB_SHA,_BUILD_SERVICE_ACCOUNT=$BUILD_SERVICE_ACCOUNT" \
            --quiet
      - name: Resolve immutable image digests
        run: |
          api_digest=$(gcloud artifacts docker images describe "$IMAGE_PREFIX/pitch-api:$GITHUB_SHA" --format='value(image_summary.digest)')
          bot_digest=$(gcloud artifacts docker images describe "$IMAGE_PREFIX/pitch-discord-bot:$GITHUB_SHA" --format='value(image_summary.digest)')
          test -n "$api_digest" && test -n "$bot_digest"
          {
            echo "API_IMAGE=$IMAGE_PREFIX/pitch-api@$api_digest"
            echo "BOT_IMAGE=$IMAGE_PREFIX/pitch-discord-bot@$bot_digest"
          } >> "$GITHUB_ENV"
      - name: Keep three image versions per package
        run: |
          gcloud artifacts repositories set-cleanup-policies "${{ vars.GCP_ARTIFACT_REPOSITORY }}" \
            --project="$GCP_PROJECT_ID" \
            --location="${{ vars.GCP_REGION }}" \
            --policy=infra/gke/artifact-cleanup-policy.json \
            --no-dry-run \
            --quiet
      - name: Migrate the database
        env:
          RELEASE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          kubectl get secret pitch-runtime -n pitch >/dev/null
          node scripts/render-gke.mjs migrate > "$RUNNER_TEMP/migrate.yaml"
          kubectl apply -f "$RUNNER_TEMP/migrate.yaml"
          job="job/pitch-migrate-$RELEASE"
          for _ in $(seq 1 180); do
            [ "$(kubectl get -n pitch "$job" -o jsonpath='{.status.succeeded}')" = 1 ] && exit 0
            [ -n "$(kubectl get -n pitch "$job" -o jsonpath='{.status.failed}')" ] && break
            sleep 5
          done
          kubectl logs -n pitch "$job" -c migrate || true
          echo "migration did not succeed" >&2
          exit 1
      - name: Render and deploy
        run: |
          node scripts/render-gke.mjs > "$RUNNER_TEMP/pitch.yaml"
          kubectl delete deployment,statefulset,horizontalpodautoscaler,poddisruptionbudget,service pitch-browser -n pitch --ignore-not-found
          kubectl apply --dry-run=server -f "$RUNNER_TEMP/pitch.yaml"
          kubectl apply -f "$RUNNER_TEMP/pitch.yaml"
          kubectl rollout status deployment/pitch -n pitch --timeout=900s
          kubectl rollout status deployment/pitch-discord-bot -n pitch --timeout=300s
          # Render pods are usually 0; when there are some, each finishes its job first.
          kubectl rollout status deployment/pitch-render -n pitch --timeout=1h
          # Each worker drains gently (up to STUDIO_DRAIN_MS) before its replacement starts.
          kubectl rollout status statefulset/pitch-worker -n pitch --timeout=5h
          kubectl exec -n pitch pitch-worker-0 -c worker -- node scripts/sandbox-check.mjs
          curl --fail --retry 12 --retry-delay 10 "https://$API_HOST/health/ready"
