name: Deploy web

# Production deploys of trypitch.co (Vercel project `trypitch`) from site/,
# the Astro marketing site. Astro renders every page to static HTML at build
# time, so no headless browser is involved; the job builds with the Vercel CLI
# and ships the output with `vercel deploy --prebuilt`. Git-triggered
# production deploys of main stay switched off in site/vercel.json so this is
# the only production path.
#
# trypitch.co also served the old app (sign-in, dashboard) from the same
# deploy. Production deploys therefore wait for the repository variable
# SITE_DEPLOY=astro, set once the studio has its own host and PUBLIC_STUDIO_URL
# points at it. Until then a push to main builds and checks the site but does
# not replace what is live.
#
# Before the first deploy, set the Vercel project's Root Directory to `site`.
#
# Repository secrets:
#   VERCEL_TOKEN   vercel.com/account/tokens, officialtrypitch-3395 team
# Repository variables:
#   SITE_DEPLOY         `astro` to deploy to production
#   PUBLIC_STUDIO_URL   where sign-in and app links go (default https://studio.trypitch.co)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/deploy-web.yml

concurrency:
  group: web-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_zIiESu5Llgl5So6Nrkh06fRF
  VERCEL_PROJECT_ID: prj_7sNTP1jqrnZtUuMQKdBMSa0oP5ex

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          PUBLIC_STUDIO_URL: ${{ vars.PUBLIC_STUDIO_URL }}

      - name: Check the output
        run: |
          out=dist
          test -s "$out/sitemap.xml"
          test -s "$out/llms.txt"
          # The homepage is rendered HTML, not an empty shell.
          grep -q 'lb-agenc-title' "$out/index.html"
          test -s "$out/blog/index.html"
          test -s "$out/404.html"
          echo "pages: $(find "$out" -name index.html | wc -l)"

      - name: Install the Vercel CLI
        if: vars.SITE_DEPLOY == 'astro'
        run: bun add --global vercel@latest

      - name: Pull production settings and environment
        if: vars.SITE_DEPLOY == 'astro'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        if: vars.SITE_DEPLOY == 'astro'
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PUBLIC_STUDIO_URL: ${{ vars.PUBLIC_STUDIO_URL }}

      - name: Deploy to production
        if: vars.SITE_DEPLOY == 'astro'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
