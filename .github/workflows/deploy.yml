name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Build and deploy containers
        run: |
          export IMAGE_TAG=${{ github.sha }}
          echo "Deploying commit: $IMAGE_TAG"
          
          # Build api and worker in parallel
          docker compose -f docker-compose.yml -f docker-compose.prod.yml build api &
          PID_API=$!
          docker compose -f docker-compose.yml -f docker-compose.prod.yml build worker &
          PID_WORKER=$!
          
          # Wait for both builds to finish
          wait $PID_API
          wait $PID_WORKER
          
          # Recreate containers with the specific image tag
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
          
          # Clean up unused containers, networks, and dangling images
          docker system prune -f
