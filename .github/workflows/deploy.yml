name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser test tools
        run: |
          bun install --global @playwright/cli@0.1.17
          bunx playwright install chromium

      - name: Run all tests
        run: make test

      - name: Typecheck API and web
        run: |
          bunx tsc --noEmit -p apps/api/tsconfig.json
          bunx tsc --noEmit -p apps/web/tsconfig.solid.json
          bunx tsc --noEmit -p apps/web/tsconfig.node.json

  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && vars.DEPLOY_TARGET != 'gke'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Check for base image changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            base:
              - 'Dockerfile.base'

      - name: Build and push base image
        if: steps.filter.outputs.base == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ghcr.io/${{ github.repository }}-base:latest

      - name: Build and deploy containers
        run: |
          # The docker-compose.yml file hardcodes `env_file: - .env`
          # We must create a symlink or copy the env file to the runner's workspace directory
          # so docker-compose can find it exactly where it expects it.
          cp /workspace/.env .env

          export IMAGE_TAG=${{ github.sha }}
          export ENV_FILE="/workspace/.env"
          echo "Deploying commit: $IMAGE_TAG"

          # Build the API (using local Docker cache on the self-hosted runner)
          docker compose --env-file $ENV_FILE -f docker-compose.yml -f docker-compose.prod.yml build api

          # Recreate containers with the specific image tag
          # Using --remove-orphans prevents conflicts if old containers exist with the same name
          docker compose --env-file $ENV_FILE -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

          # Clean up unused containers, networks, and dangling images
          docker system prune -f
