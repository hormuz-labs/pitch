<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>28 – Parametric Shapes & Extrusions</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#050508; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; }

.label {
  position:absolute; top:32px; left:32px; font-size:13px; color:#00e855; letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4; z-index:100;
}

#webglCanvas { position:absolute; inset:0; z-index:1; }

/* Interactive overlay */
.chart-info {
  position:absolute; top:80px; right:80px; text-align:right; z-index:10; pointer-events:none;
}
.chart-info h1 { font-size:42px; font-weight:800; color:#fff; letter-spacing:1px; margin-bottom:8px; }
.chart-info p { font-size:14px; color:#00e855; letter-spacing:3px; text-transform:uppercase; font-family:monospace; }

#replayBtn {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(0,170,69,0.4);
  background:rgba(0,0,0,0.7); color:#00AA45; cursor:pointer; font-size:13px;
  font-family:monospace; backdrop-filter:blur(10px);
}
</style>
</head>
<body>
<div class="vp">
  <div class="label">Lego 28 · Parametric Shapes & Extrusions</div>
  <canvas id="webglCanvas"></canvas>
  
  <div class="chart-info">
    <p>Data visualization // Q2 Forecast</p>
    <h1 id="metricVal">+340% GROWTH</h1>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050508, 0.05);

const camera = new THREE.PerspectiveCamera(40, 1920 / 1080, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webglCanvas'), antialias: true });
renderer.setSize(1920, 1080);
renderer.shadowMap.enabled = true;

// Grid helper on floor to show perspective grid
const gridHelper = new THREE.GridHelper(40, 40, 0x00e855, 0x112211);
gridHelper.position.y = -2;
scene.add(gridHelper);

// ── PARAMETRIC EXTRUSIONS ──

// Create 3D pillars (bar chart)
const numBars = 7;
const barWidth = 0.6;
const barDepth = 0.6;
const barMaxHeight = 4.5;
const barData = [1.2, 2.5, 1.8, 3.8, 2.9, 4.8, 3.5];

const pillars = [];
const pillarGeometry = new THREE.BoxGeometry(barWidth, 1, barDepth); // Height is scaled dynamically

// Material with subtle glass/glowing properties
const pillarMat = new THREE.MeshPhysicalMaterial({
  color: 0x00e855,
  roughness: 0.2,
  metalness: 0.1,
  transmission: 0.6,
  thickness: 1.0,
  transparent: true,
  opacity: 0.85
});

for (let i = 0; i < numBars; i++) {
  const mesh = new THREE.Mesh(pillarGeometry, pillarMat);
  // Distribute along X axis
  const x = (i - (numBars - 1) / 2) * 1.6;
  mesh.position.set(x, -2, 0); // starts on grid floor
  mesh.scale.set(1, 0.01, 1); // scale Y to 0 initially
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  pillars.push(mesh);
}

// ── EXTRUDE CURVED SPLINE (Literal depth statistical curve) ──
// We'll define a spline following the peaks of the bars, and extrude a tube/ribbon along it
const curvePoints = [];
for (let i = 0; i < numBars; i++) {
  const x = (i - (numBars - 1) / 2) * 1.6;
  const y = -2 + barData[i];
  curvePoints.push(new THREE.Vector3(x, y, 0));
}

const curve = new THREE.CatmullRomCurve3(curvePoints);
const splineGeometry = new THREE.TubeGeometry(curve, 100, 0.15, 12, false);
const splineMaterial = new THREE.MeshStandardMaterial({
  color: 0x00f0ff,
  roughness: 0.1,
  metalness: 0.8,
  emissive: 0x00a0cc,
  emissiveIntensity: 0.3
});

// We create a helper object to draw the tube geometry frame-by-frame
const splineMesh = new THREE.Mesh(splineGeometry, splineMaterial);
splineMesh.visible = false;
scene.add(splineMesh);

// Lights
const ambient = new THREE.AmbientLight(0xffffff, 0.1);
scene.add(ambient);

const ptLight = new THREE.PointLight(0x00e855, 6, 15);
ptLight.position.set(-4, 2, 3);
scene.add(ptLight);

const ptLight2 = new THREE.PointLight(0x00f0ff, 4, 15);
ptLight2.position.set(4, 2, -3);
scene.add(ptLight2);

// Camera Target tracking
const lookAtTarget = new THREE.Vector3(0, 0, 0);

// Render/Update Loop
function animate() {
  requestAnimationFrame(animate);
  camera.lookAt(lookAtTarget);
  renderer.render(scene, camera);
}
animate();

function play() {
  gsap.killTweensOf('*');
  
  // Reset Pillars
  pillars.forEach(p => {
    p.scale.y = 0.01;
    p.position.y = -2;
  });
  
  // Hide Spline initially
  splineMesh.visible = false;
  
  // Reset Camera: starting low and slightly off-angle for a dynamic fly-through
  gsap.set(camera.position, { x: -8, y: -0.5, z: 6 });
  gsap.set(lookAtTarget, { x: -3, y: -0.5, z: 0 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // 1. Camera starts moving & flying through the bars (0s - 7s)
  tl.to(camera.position, {
    x: 6,
    y: 1.5,
    z: 7,
    duration: 6.0,
    ease: 'power2.inOut'
  }, 0);

  tl.to(lookAtTarget, {
    x: 1,
    y: 0,
    z: 0,
    duration: 6.0,
    ease: 'power2.inOut'
  }, 0);

  // 2. Pillars grow sequentially (staggered extrusions) (0.5s - 3s)
  pillars.forEach((p, i) => {
    const targetYScale = barData[i];
    tl.to(p.scale, {
      y: targetYScale,
      duration: 1.5,
      ease: 'elastic.out(1,0.65)'
    }, 0.5 + i * 0.15);

    // Adjust vertical center since BoxGeometry scales from center, move Y up by half scale
    tl.to(p.position, {
      y: -2 + targetYScale / 2,
      duration: 1.5,
      ease: 'elastic.out(1,0.65)'
    }, 0.5 + i * 0.15);
  });

  // 3. Spline/Statistical Ribbon extrudes right after (3s)
  tl.set(splineMesh, { visible: true }, 2.0);
  tl.from(splineMesh.scale, {
    x: 0,
    duration: 2.0,
    ease: 'power2.out'
  }, 2.0);

  // Metric text counter animation
  const counterObj = { val: 0 };
  tl.to(counterObj, {
    val: 340,
    duration: 3.5,
    ease: 'power2.out',
    onUpdate: () => {
      document.getElementById('metricVal').textContent = '+' + Math.round(counterObj.val) + '% GROWTH';
    }
  }, 0.5);

  tl.to({}, { duration: 0.5 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
