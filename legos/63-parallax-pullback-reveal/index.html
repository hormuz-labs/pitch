<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>63 – Parallax Pull-Back Reveal</title>
<style>
:root { --bg:#0a0612; --bg-mid:#241046; --accent:#a78bfa; --accent-2:#7c3aed; --glow:rgba(124,58,237,0.3); }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.5; z-index:100; }

/* camera rig: a single scaled stage holds depth layers; pulling back = scaling the stage down */
.camera { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; will-change:transform, filter; }
.depth { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; will-change:transform; }

/* far background */
.d-far { z-index:0; background:radial-gradient(ellipse 60% 55% at 50% 45%, var(--bg-mid), var(--bg) 75%); }
.rings { position:absolute; inset:0; }
.ring { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); border:1px solid rgba(var(--accent-2-rgb,124,58,237),0.18); border-radius:50%; }

/* mid: floating glass tiles */
.d-mid { z-index:1; }
.tile { position:absolute; width:150px; height:150px; border-radius:26px; background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.12); backdrop-filter:blur(16px); display:flex; align-items:center; justify-content:center; font-size:64px;
  box-shadow:inset 0 0 30px var(--glow), 0 18px 50px rgba(0,0,0,0.4); }

/* near: the macro element we start pushed into */
.d-near { z-index:2; }
.hero-mark { width:280px; height:280px; border-radius:60px; background:radial-gradient(circle at 35% 30%, #00e06a, var(--accent-2));
  display:flex; align-items:center; justify-content:center; font-size:150px; font-weight:900; color:#1a0635; box-shadow:0 40px 100px var(--glow); }

.title { position:absolute; z-index:3; left:0; right:0; bottom:200px; text-align:center; opacity:0; }
.title .h { font-size:84px; font-weight:900; letter-spacing:-2px; }
.title .h .reg { font-size:34px; vertical-align:super; color:var(--accent); }
.title .s { font-size:22px; color:rgba(255,255,255,0.5); letter-spacing:3px; margin-top:10px; }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid var(--accent);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="label"></div>

  <div class="camera" id="camera">
    <div class="depth d-far" id="dFar">
      <div class="rings">
        <div class="ring" style="width:700px;height:700px;"></div>
        <div class="ring" style="width:1100px;height:1100px;"></div>
        <div class="ring" style="width:1550px;height:1550px;"></div>
      </div>
    </div>
    <div class="depth d-mid" id="dMid"></div>
    <div class="depth d-near" id="dNear"><div class="hero-mark" id="heroMark"></div></div>
  </div>

  <div class="title" id="title">
    <div class="h" id="titleH"></div>
    <div class="s" id="titleS"></div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════ EDIT EVERYTHING HERE ════════════════ */
const CONFIG = {
  label: 'Lego 63 · Parallax Pull-Back Reveal',
  markGlyph: 'W',
  icons: ['💬','🛡️','⚡','📦','🔒','📍','♻️','📊'],
  titleH: 'WasteProtection',
  trademark: '®',
  titleS: 'the operations layer, revealed',
  pullDuration: 2.6,     // seconds of the dolly-back
  startScale: 3.2,       // how zoomed-in (into the mark) we begin
  colors: { bg:'#0a0612', bgMid:'#241046', accent:'#a78bfa', accent2:'#7c3aed',
            accent2Rgb:'124,58,237', glow:'rgba(124,58,237,0.3)' }
};
/* ═══════════════════════════════════════════════════════ */

const C = CONFIG.colors, _r = document.documentElement.style;
_r.setProperty('--bg', C.bg); _r.setProperty('--bg-mid', C.bgMid);
_r.setProperty('--accent', C.accent); _r.setProperty('--accent-2', C.accent2);
_r.setProperty('--accent-2-rgb', C.accent2Rgb); _r.setProperty('--glow', C.glow);
document.getElementById('label').textContent = CONFIG.label;
document.getElementById('heroMark').textContent = CONFIG.markGlyph;
document.getElementById('titleH').innerHTML = CONFIG.titleH + (CONFIG.trademark ? '<span class="reg">' + CONFIG.trademark + '</span>' : '');
document.getElementById('titleS').textContent = CONFIG.titleS;

// place mid-depth tiles in a ring around centre, all within frame at rest
const dMid = document.getElementById('dMid');
const SPOTS = [[-620,-260],[-700,180],[-380,420],[620,-300],[720,160],[420,420],[-120,-440],[180,440]];
SPOTS.forEach((p, i) => {
  const t = document.createElement('div'); t.className = 'tile';
  t.textContent = CONFIG.icons[i % CONFIG.icons.length];
  t.style.left = `calc(50% + ${p[0]}px)`; t.style.top = `calc(50% + ${p[1]}px)`;
  t.style.transform = 'translate(-50%,-50%)'; t.style.marginLeft = '0';
  dMid.appendChild(t);
});

function play() {
  gsap.killTweensOf('*');
  // start pushed into the near mark; far/mid scaled UP more (closer-feeling) for parallax on pull-back
  gsap.set('#camera', { scale: CONFIG.startScale, filter: 'blur(0px)' });
  gsap.set('#dNear', { scale: 1 });
  gsap.set('#dMid', { scale: 1.6, opacity: 0 });
  gsap.set('#dFar', { scale: 1.3 });
  gsap.set('#title', { opacity: 0, y: 24 });
  gsap.utils.toArray('#dMid .tile').forEach(t => gsap.set(t, { opacity: 0, scale: 0.7 }));

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // brief hold pushed-in, then the camera pulls back (weighted expo.out "settle")
  const D = CONFIG.pullDuration;
  tl.to('#camera', { scale: 1, duration: D, ease: 'expo.out' }, 0.4);
  // depth layers resolve to neutral at their own rates → parallax
  tl.to('#dFar', { scale: 1, duration: D, ease: 'expo.out' }, 0.4);
  tl.to('#dMid', { scale: 1, opacity: 1, duration: D, ease: 'expo.out' }, 0.4);
  // tiles fade/pop in midway through the pull-back
  tl.to('#dMid .tile', { opacity: 1, scale: 1, duration: 0.8, ease: 'back.out(1.5)', stagger: 0.06 }, 1.0);
  // a touch of motion blur during the fastest part of the move, cleared on landing
  tl.fromTo('#camera', { filter: 'blur(5px)' }, { filter: 'blur(0px)', duration: 0.8, ease: 'power2.out' }, 0.4);

  // title lands once the camera has settled (eye already centred)
  tl.to('#title', { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0.4 + D * 0.7);
  // ambient breathing on the whole rig
  tl.to('#camera', { scale: 1.015, duration: 2.4, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0.4 + D);

  tl.to({}, { duration: 1.4 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
