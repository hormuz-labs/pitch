<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>05 – Animated Infographics & Charts</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#0D0D0D; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center; gap:60px; padding:80px; }

.label {
  position:absolute; top:32px; left:32px; font-size:13px; color:#00AA45; letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4;
}

/* Chart card */
.chart-card {
  background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06);
  border-radius:16px; padding:32px 36px; width:520px;
}
.chart-card h3 {
  font-size:13px; font-weight:600; color:#00AA45; text-transform:uppercase;
  letter-spacing:2px; margin-bottom:24px;
  font-family:'Courier New',monospace;
}

/* Bar chart */
.bar-chart { display:flex; gap:12px; align-items:flex-end; height:220px; padding-top:20px; }
.bar-group { display:flex; flex-direction:column; align-items:center; flex:1; }
.bar {
  width:100%; border-radius:4px 4px 0 0;
  background: linear-gradient(180deg, #00AA45 0%, rgba(0,170,69,0.3) 100%);
  height:0; will-change:height;
}
.bar-label { font-size:11px; color:rgba(255,255,255,0.3); margin-top:10px; letter-spacing:1px; }

/* Line chart */
.line-chart-wrap { position:relative; height:220px; margin-top:20px; }
.line-chart-svg { width:100%; height:100%; }
.line-path { stroke:#00AA45; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.line-area { fill:url(#areaGrad); opacity:0.15; }
.dot { fill:#00AA45; opacity:0; }

/* Pie chart */
.pie-wrap { display:flex; align-items:center; gap:40px; }
.pie-svg { width:200px; height:200px; }
.pie-legend { display:flex; flex-direction:column; gap:10px; }
.legend-item { display:flex; align-items:center; gap:10px; font-size:13px; color:rgba(255,255,255,0.6); }
.legend-dot { width:10px; height:10px; border-radius:50%; }

/* Stat counter */
.stat-row {
  position:absolute; bottom:60px; left:50%; transform:translateX(-50%);
  display:flex; gap:80px;
}
.stat-item { text-align:center; }
.stat-number { font-size:56px; font-weight:900; color:#00AA45; font-variant-numeric:tabular-nums; line-height:1; }
.stat-suffix { font-size:28px; font-weight:700; color:#00AA45; }
.stat-desc { font-size:14px; color:rgba(255,255,255,0.4); margin-top:6px; letter-spacing:1px; text-transform:uppercase; font-family:'Courier New',monospace; }

#replayBtn {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(0,170,69,0.4);
  background:rgba(0,0,0,0.7); color:#00AA45; cursor:pointer; font-size:13px;
  font-family:monospace; backdrop-filter:blur(10px);
}
</style>
</head>
<body>
<div class="vp">
  <div class="label">Lego 05 · Animated Infographics & Charts</div>

  <!-- Bar Chart Card -->
  <div class="chart-card">
    <h3>Monthly Active Users</h3>
    <div class="bar-chart" id="barChart">
      <div class="bar-group"><div class="bar" id="bar1" style="height:0;"></div><div class="bar-label">Jan</div></div>
      <div class="bar-group"><div class="bar" id="bar2" style="height:0;"></div><div class="bar-label">Feb</div></div>
      <div class="bar-group"><div class="bar" id="bar3" style="height:0;"></div><div class="bar-label">Mar</div></div>
      <div class="bar-group"><div class="bar" id="bar4" style="height:0;"></div><div class="bar-label">Apr</div></div>
      <div class="bar-group"><div class="bar" id="bar5" style="height:0;"></div><div class="bar-label">May</div></div>
      <div class="bar-group"><div class="bar" id="bar6" style="height:0;"></div><div class="bar-label">Jun</div></div>
      <div class="bar-group"><div class="bar" id="bar7" style="height:0;"></div><div class="bar-label">Jul</div></div>
    </div>
  </div>

  <!-- Pie + Line Card -->
  <div class="chart-card">
    <h3>Revenue Breakdown</h3>
    <div class="pie-wrap">
      <svg class="pie-svg" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="85" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <circle id="pieSlice1" cx="100" cy="100" r="85" fill="none" stroke="#00AA45" stroke-width="30"
          stroke-dasharray="534" stroke-dashoffset="534" stroke-linecap="butt"
          transform="rotate(-90 100 100)"/>
        <circle id="pieSlice2" cx="100" cy="100" r="85" fill="none" stroke="#219653" stroke-width="30"
          stroke-dasharray="400" stroke-dashoffset="534" stroke-linecap="butt"
          transform="rotate(-90 100 100)"/>
        <circle id="pieSlice3" cx="100" cy="100" r="85" fill="none" stroke="rgba(0,170,69,0.25)" stroke-width="30"
          stroke-dasharray="200" stroke-dashoffset="534" stroke-linecap="butt"
          transform="rotate(-90 100 100)"/>
      </svg>
      <div class="pie-legend">
        <div class="legend-item"><span class="legend-dot" style="background:#00AA45;"></span> SaaS (48%)</div>
        <div class="legend-item"><span class="legend-dot" style="background:#219653;"></span> Enterprise (32%)</div>
        <div class="legend-item"><span class="legend-dot" style="background:rgba(0,170,69,0.25);"></span> Other (20%)</div>
      </div>
    </div>
    <div class="line-chart-wrap" style="margin-top:30px;">
      <svg class="line-chart-svg" viewBox="0 0 440 120">
        <defs>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#00AA45" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#00AA45" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <polyline class="line-area" id="lineArea" points="20,100 80,90 140,75 200,60 260,45 320,30 380,15 420,10"/>
        <polyline class="line-path" id="linePath"
          points="20,100 80,90 140,75 200,60 260,45 320,30 380,15 420,10"
          stroke-dasharray="800" stroke-dashoffset="800"/>
        <circle class="dot" id="dot1" cx="20" cy="100" r="4"/>
        <circle class="dot" id="dot2" cx="140" cy="75" r="4"/>
        <circle class="dot" id="dot3" cx="260" cy="45" r="4"/>
        <circle class="dot" id="dot4" cx="380" cy="15" r="4"/>
      </svg>
    </div>
  </div>

  <!-- Bottom stats -->
  <div class="stat-row">
    <div class="stat-item">
      <div style="display:flex;align-items:flex-end;justify-content:center;">
        <span class="stat-number" id="stat1">0</span><span class="stat-suffix">M+</span>
      </div>
      <div class="stat-desc">Transactions</div>
    </div>
    <div class="stat-item">
      <div style="display:flex;align-items:flex-end;justify-content:center;">
        <span class="stat-number" id="stat2">0</span><span class="stat-suffix" style="font-size:20px;">%</span>
      </div>
      <div class="stat-desc">Growth</div>
    </div>
    <div class="stat-item">
      <div style="display:flex;align-items:flex-end;justify-content:center;">
        <span class="stat-number" id="stat3">0</span><span class="stat-suffix">K+</span>
      </div>
      <div class="stat-desc">Builders</div>
    </div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const barHeights = [35, 48, 62, 58, 78, 91, 100];

function play() {
  gsap.killTweensOf('*');
  document.querySelectorAll('.bar').forEach(b => b.style.height = '0');
  document.querySelectorAll('#linePath, #lineArea').forEach(el => {
    el.setAttribute('stroke-dashoffset', '800');
  });
  gsap.set('.dot', { opacity: 0 });
  gsap.set('#pieSlice1, #pieSlice2, #pieSlice3', { strokeDashoffset: 534 });
  gsap.set('#stat1, #stat2, #stat3', { textContent: '0' });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // Bar chart — grow each bar
  tl.to('#bar1', { height: `${barHeights[0]}%`, duration: 0.5, ease: 'power2.out' }, 0.3);
  tl.to('#bar2', { height: `${barHeights[1]}%`, duration: 0.5, ease: 'power2.out' }, 0.5);
  tl.to('#bar3', { height: `${barHeights[2]}%`, duration: 0.5, ease: 'power2.out' }, 0.7);
  tl.to('#bar4', { height: `${barHeights[3]}%`, duration: 0.5, ease: 'power2.out' }, 0.9);
  tl.to('#bar5', { height: `${barHeights[4]}%`, duration: 0.5, ease: 'power2.out' }, 1.1);
  tl.to('#bar6', { height: `${barHeights[5]}%`, duration: 0.5, ease: 'power2.out' }, 1.3);
  tl.to('#bar7', { height: `${barHeights[6]}%`, duration: 0.5, ease: 'power2.out' }, 1.5);

  // Pie chart — slice in
  tl.to('#pieSlice1', { strokeDashoffset: 280, duration: 0.8, ease: 'power2.out' }, 1.8);
  tl.to('#pieSlice2', { strokeDashoffset: 400, duration: 0.8, ease: 'power2.out' }, 2.0);
  tl.to('#pieSlice3', { strokeDashoffset: 470, duration: 0.8, ease: 'power2.out' }, 2.2);

  // Line chart — draw path
  tl.to('#linePath, #lineArea', {
    strokeDashoffset: 0, duration: 1.5, ease: 'power2.out'
  }, 2.5);
  tl.to('.dot', { opacity: 1, scale: 1.5, duration: 0.3, ease: 'back.out(2)', stagger: 0.2 }, 3.2);

  // Stat counters
  const s1 = { val: 0 };
  tl.to(s1, { val: 10, duration: 1.5, ease: 'power2.out',
    onUpdate: () => { document.getElementById('stat1').textContent = s1.val.toFixed(1); }
  }, 4.0);
  const s2 = { val: 0 };
  tl.to(s2, { val: 312, duration: 1.5, ease: 'power2.out',
    onUpdate: () => { document.getElementById('stat2').textContent = Math.round(s2.val); }
  }, 4.0);
  const s3 = { val: 0 };
  tl.to(s3, { val: 50, duration: 1.5, ease: 'power2.out',
    onUpdate: () => { document.getElementById('stat3').textContent = Math.round(s3.val); }
  }, 4.0);

  tl.to({}, { duration: 1.5 }, 5.5);
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
