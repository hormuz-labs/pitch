<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>57 – Sparkle Match-Cut Zoom</title>
<style>
:root { --bg:#0a0612; --bg-a:#1f1140; --bg-b:#2a1550; --accent:#a78bfa; --accent-2:#8b5cf6; --accent-3:#6d28d9; --grad-a:#c4b5fd; --grad-b:#7c3aed; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.5; z-index:100; }

.sceneA { position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 50% 45%, var(--bg-a), var(--bg) 72%); }
.chat { width:900px; padding:28px 32px; border-radius:22px; display:flex; align-items:center; gap:18px;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); backdrop-filter:blur(20px); }
.chat .label-txt { flex:1; font-size:28px; color:rgba(255,255,255,0.55); }
.chat .send { width:54px; height:54px; border-radius:14px; background:linear-gradient(135deg,var(--accent-2),var(--accent-3)); display:flex; align-items:center; justify-content:center; font-size:24px; }

.sceneB { position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 50% 50%, var(--bg-b), var(--bg) 75%); opacity:0; }
.sceneB .h { font-size:88px; font-weight:800; letter-spacing:-2px; opacity:0; }
.sceneB .s { font-size:26px; color:rgba(255,255,255,0.5); margin-top:14px; opacity:0; }

.spark { position:absolute; z-index:5; left:50%; top:50%; width:90px; height:90px; margin:-45px 0 0 -45px;
  display:flex; align-items:center; justify-content:center; will-change:transform; }
.spark svg { width:100%; height:100%; filter:drop-shadow(0 0 24px rgba(167,139,250,0.8)); }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid var(--accent);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="label"></div>

  <div class="sceneA" id="sceneA">
    <div class="chat" id="chat">
      <div class="label-txt" id="chatPlaceholder"></div>
      <div class="send" id="sendIc"></div>
    </div>
  </div>

  <div class="sceneB" id="sceneB">
    <div class="h" id="bH"></div>
    <div class="s" id="bS"></div>
  </div>

  <div class="spark" id="spark" style="left:1180px; top:540px;">
    <svg viewBox="0 0 100 100"><path d="M50 4 C54 34 66 46 96 50 C66 54 54 66 50 96 C46 66 34 54 4 50 C34 46 46 34 50 4 Z" fill="url(#g)"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--grad-a)"/><stop offset="1" stop-color="var(--grad-b)"/></linearGradient></defs>
    </svg>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════ EDIT EVERYTHING HERE ════════════════ */
const CONFIG = {
  label: 'Lego 57 · Sparkle Match-Cut Zoom',
  chatPlaceholder: 'Ask Arlo anything…',
  sendIcon: '➤',
  headline: 'More than Software',
  subline: 'An operations intelligence layer for every fleet.',
  zoomScale: 26,        // how far the sparkle blows up through the cut
  colors: { bg:'#0a0612', bgA:'#1f1140', bgB:'#2a1550', accent:'#a78bfa', accent2:'#8b5cf6', accent3:'#6d28d9',
            sparkTop:'#c4b5fd', sparkBot:'#7c3aed' }
};
/* ═══════════════════════════════════════════════════════ */

const C = CONFIG.colors, _r = document.documentElement.style;
_r.setProperty('--bg', C.bg); _r.setProperty('--bg-a', C.bgA); _r.setProperty('--bg-b', C.bgB);
_r.setProperty('--accent', C.accent); _r.setProperty('--accent-2', C.accent2); _r.setProperty('--accent-3', C.accent3);
_r.setProperty('--grad-a', C.sparkTop); _r.setProperty('--grad-b', C.sparkBot);
document.getElementById('label').textContent = CONFIG.label;
document.getElementById('chatPlaceholder').textContent = CONFIG.chatPlaceholder;
document.getElementById('sendIc').textContent = CONFIG.sendIcon;
document.getElementById('bH').textContent = CONFIG.headline;
document.getElementById('bS').textContent = CONFIG.subline;
// SVG gradient stops don't read CSS vars in all engines — set them explicitly too
document.querySelectorAll('#g stop')[0].setAttribute('stop-color', C.sparkTop);
document.querySelectorAll('#g stop')[1].setAttribute('stop-color', C.sparkBot);

function play() {
  gsap.killTweensOf('*');
  gsap.set('#sceneA', { opacity: 1 });
  gsap.set('#sceneB', { opacity: 0, scale: 1.1 });
  gsap.set('#bH', { opacity: 0, y: 30 });
  gsap.set('#bS', { opacity: 0, y: 20 });
  gsap.set('#chat', { opacity: 0, y: 30, scale: 0.96 });
  gsap.set('#spark', { left: 1180, top: 540, scale: 0.5, rotation: 0, opacity: 0 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;
  tl.to('#chat', { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: 'power3.out' }, 0.2);
  tl.to('#spark', { opacity: 1, scale: 0.5, duration: 0.5, ease: 'power2.out' }, 0.5);
  tl.to('#spark', { rotation: 20, duration: 1.0, ease: 'sine.inOut' }, 0.6);

  tl.to('#spark', { left: 960, top: 540, duration: 0.5, ease: 'power2.in' }, 1.6);
  tl.to('#spark', { scale: CONFIG.zoomScale, rotation: 200, duration: 1.1, ease: 'power3.in' }, 1.7);
  tl.to('#sceneA', { opacity: 0, duration: 0.5, ease: 'power2.in' }, 2.1);
  tl.set('#sceneB', { opacity: 1 }, 2.3);

  tl.to('#spark', { scale: 4.2, rotation: 360, duration: 1.0, ease: 'power3.out' }, 2.4);
  tl.to('#sceneB', { scale: 1, duration: 1.0, ease: 'power3.out' }, 2.4);
  tl.to('#spark', { opacity: 0.25, duration: 0.6 }, 3.2);
  tl.to('#bH', { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 3.3);
  tl.to('#bS', { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out' }, 3.6);
  tl.to({}, { duration: 1.8 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
