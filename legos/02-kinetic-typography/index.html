<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>02 – Kinetic Typography</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#0D0D0D; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center; }

.char-wrap { display:inline-block; overflow:hidden; vertical-align:bottom; }
.char { display:inline-block; transform:translateY(100%); will-change:transform; }
.word { display:inline-block; white-space:nowrap; }

.line { margin-bottom:24px; text-align:center; }
.line-1 { font-size:110px; font-weight:900; letter-spacing:-2px; }
.line-2 { font-size:110px; font-weight:900; letter-spacing:-2px; }
.line-3 { font-size:26px; font-weight:400; color:rgba(255,255,255,0.45); letter-spacing:8px; text-transform:uppercase; margin-top:40px; }

.label {
  position:absolute; top:32px; left:32px; font-size:13px; color:#00AA45; letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4;
}

.accent { color:#00AA45; }

/* Replay button */
#replayBtn {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(0,170,69,0.4);
  background:rgba(0,0,0,0.7); color:#00AA45; cursor:pointer; font-size:13px;
  font-family:monospace; backdrop-filter:blur(10px);
}
</style>
</head>
<body>
<div class="vp">
  <div class="label">Lego 02 · Kinetic Typography</div>

  <div style="text-align:center;">
    <div class="line line-1" id="line1">
      <span class="word" id="w1"></span>
    </div>
    <div class="line line-2" id="line2">
      <span class="word" id="w2"></span>
    </div>
    <div class="line line-3" id="line3"></div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
function buildChars(container, text) {
  container.innerHTML = '';
  [...text].forEach((ch, i) => {
    const wrap = document.createElement('span');
    wrap.className = 'char-wrap';
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    wrap.appendChild(span);
    // track which index for staggering
    wrap.dataset.idx = i;
    container.appendChild(wrap);
  });
}

// Line 1: "BUILD" in white, "IN PUBLIC" in green
const w1 = document.getElementById('w1');
[['BUILD ', '#fff'], ['IN PUBLIC', '#00AA45']].forEach(([txt, color]) => {
  const b = document.createElement('span');
  b.style.color = color;
  b.className = 'word';
  buildChars(b, txt);
  w1.appendChild(b);
});

// Line 2: "YOUR NETWORK"
const w2 = document.getElementById('w2');
const parts = [['YOUR ', 'rgba(255,255,255,0.4)'], ['NETWORK', '#fff']];
parts.forEach(([txt, color]) => {
  const b = document.createElement('span');
  b.style.color = color;
  b.className = 'word';
  buildChars(b, txt);
  w2.appendChild(b);
});

const line3 = document.getElementById('line3');
line3.textContent = 'PEERLIST — THE PROFESSIONAL NETWORK FOR BUILDERS';

function play() {
  gsap.set('.char', { y: '100%' });
  gsap.set('#line3', { opacity: 0, y: 30 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // Line 1: staggered char reveal with power bounce
  tl.to('#line1 .char', {
    y: '0%', duration: 0.9, ease: 'power4.out',
    stagger: { each: 0.04, from: 'start' }
  }, 0.3);

  // Line 2: staggered after line 1
  tl.to('#line2 .char', {
    y: '0%', duration: 0.9, ease: 'power4.out',
    stagger: { each: 0.03, from: 'start' }
  }, 1.5);

  // Line 3 subtitle fade up
  tl.to('#line3', { opacity: 1, y: 0, duration: 1.0, ease: 'power2.out' }, 2.8);

  // Hold at end
  tl.to({}, { duration: 1.5 }, 3.8);

  return tl;
}

document.getElementById('replayBtn').addEventListener('click', () => {
  // Kill running timeline
  if (window.masterTimeline) window.masterTimeline.progress(1).kill();
  play();
});

play();
</script>
</body>
</html>
