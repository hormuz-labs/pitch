<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>61 – Logo Stroke Reveal</title>
<style>
:root { --logo-bg:#000; --stroke:#fff; --accent:#a78bfa; --accent-2:#7c3aed; --card-bg:#f7f5fb; --ink:#1c1530; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--logo-bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4; z-index:100; }

.sceneLogo { position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; background:var(--logo-bg); }
.logo-wrap { position:relative; width:420px; height:420px; }
.logo-wrap svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.stroke { fill:none; stroke:var(--stroke); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
.ring-stroke { fill:none; stroke:var(--accent); stroke-width:3; }
.fill-shape { fill:var(--accent); opacity:0; }

.glint { position:absolute; inset:0; overflow:hidden; border-radius:50%; pointer-events:none; }
.glint .beam { position:absolute; top:-30%; left:-40%; width:30%; height:160%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,0.9), transparent); transform:skewX(-18deg); filter:blur(2px); }

.sceneCard { position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--card-bg); color:var(--ink); opacity:0; }
.sceneCard .wp { font-size:200px; font-weight:900; letter-spacing:-6px; }
.sceneCard .wp .reg { font-size:60px; vertical-align:super; color:var(--accent-2); }
.sceneCard .tag { font-size:24px; letter-spacing:6px; text-transform:uppercase; color:var(--accent-2); margin-top:8px; opacity:0; }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid var(--accent);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="label"></div>

  <div class="sceneLogo" id="sceneLogo">
    <div class="logo-wrap" id="logoWrap">
      <svg viewBox="0 0 200 200">
        <path class="stroke" id="shield" pathLength="1"
          d="M100 22 L168 50 L168 104 C168 150 138 174 100 188 C62 174 32 150 32 104 L32 50 Z"/>
        <path class="stroke" id="cube" pathLength="1"
          d="M100 70 L128 86 L128 118 L100 134 L72 118 L72 86 Z M100 70 L100 102 M100 102 L128 86 M100 102 L72 86"/>
        <path class="fill-shape" id="shieldFill"
          d="M100 22 L168 50 L168 104 C168 150 138 174 100 188 C62 174 32 150 32 104 L32 50 Z"/>
      </svg>
      <svg viewBox="0 0 200 200"><circle class="ring-stroke" id="ring" cx="100" cy="100" r="96" pathLength="1"/></svg>
      <div class="glint"><div class="beam" id="beam"></div></div>
    </div>
  </div>

  <div class="sceneCard" id="sceneCard">
    <div class="wp" id="wordmark"></div>
    <div class="tag" id="cardTag"></div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════ EDIT EVERYTHING HERE ════════════════ */
const CONFIG = {
  label: 'Lego 61 · Logo Stroke Reveal',
  wordmark: 'WP',
  trademark: '®',
  cardTag: 'Waste Protection',
  strokeDuration: 1.4,   // seconds to draw the shield outline
  colors: {
    logoBg:'#000000', stroke:'#ffffff', accent:'#a78bfa', accent2:'#7c3aed',
    cardBg:'#f7f5fb', ink:'#1c1530'
  }
};
/* ═══════════════════════════════════════════════════════ */

const C = CONFIG.colors, _r = document.documentElement.style;
_r.setProperty('--logo-bg', C.logoBg); _r.setProperty('--stroke', C.stroke);
_r.setProperty('--accent', C.accent); _r.setProperty('--accent-2', C.accent2);
_r.setProperty('--card-bg', C.cardBg); _r.setProperty('--ink', C.ink);
document.getElementById('label').textContent = CONFIG.label;
document.getElementById('wordmark').innerHTML = CONFIG.wordmark + (CONFIG.trademark ? '<span class="reg">' + CONFIG.trademark + '</span>' : '');
document.getElementById('cardTag').textContent = CONFIG.cardTag;

function play() {
  gsap.killTweensOf('*');
  gsap.set('#sceneLogo', { opacity: 1 });
  gsap.set('#logoWrap', { scale: 0.92, opacity: 1 });
  gsap.set(['#shield', '#cube'], { strokeDasharray: 1, strokeDashoffset: 1, opacity: 1 });
  gsap.set('#ring', { strokeDasharray: 1, strokeDashoffset: 1 });
  gsap.set('#shieldFill', { opacity: 0 });
  gsap.set('#beam', { left: '-40%' });
  gsap.set('#sceneCard', { opacity: 0, scale: 1.05 });
  gsap.set('#cardTag', { opacity: 0, letterSpacing: '14px' });

  const tl = gsap.timeline();
  window.masterTimeline = tl;
  tl.to('#shield', { strokeDashoffset: 0, duration: CONFIG.strokeDuration, ease: 'power2.inOut' }, 0.3);
  tl.to('#cube', { strokeDashoffset: 0, duration: 1.0, ease: 'power2.inOut' }, 1.0);
  tl.to('#ring', { strokeDashoffset: 0, duration: 1.2, ease: 'power2.inOut' }, 1.3);
  tl.to('#shieldFill', { opacity: 0.16, duration: 0.8, ease: 'power2.out' }, 2.0);
  tl.to('#logoWrap', { scale: 1, duration: 0.9, ease: 'back.out(1.6)' }, 2.0);
  tl.fromTo('#beam', { left: '-40%' }, { left: '130%', duration: 0.9, ease: 'power2.inOut' }, 2.4);
  tl.to('#sceneLogo', { opacity: 0, scale: 1.1, duration: 0.5, ease: 'power2.in' }, 3.5);
  tl.set('#sceneCard', { opacity: 1 }, 3.7);
  tl.to('#sceneCard', { scale: 1, duration: 0.9, ease: 'power3.out' }, 3.7);
  tl.to('#cardTag', { opacity: 1, letterSpacing: '6px', duration: 0.9, ease: 'power2.out' }, 4.0);
  tl.to({}, { duration: 1.8 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
