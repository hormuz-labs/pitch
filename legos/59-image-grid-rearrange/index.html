<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>59 – Image Grid Rearrange</title>
<style>
:root { --bg-a:#efeafc; --bg-b:#d9cdf5; --accent:#7c3aed; --accent-3:#5b21b6; --ink:#1c1530; --overlay:rgba(124,58,237,0.45); }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg-a); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:var(--ink); }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; background:radial-gradient(ellipse at 50% 40%, var(--bg-a), var(--bg-b) 75%); }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.6; z-index:100; }

.stage { position:absolute; inset:0; z-index:1; }
.tile { position:absolute; border-radius:24px; overflow:hidden; will-change:transform,opacity; box-shadow:0 30px 70px rgba(80,40,160,0.25); }
.tile .img { position:absolute; inset:0; }
.tile .ov { position:absolute; inset:0; mix-blend-mode:multiply; background:var(--overlay); }
.tile .cap { position:absolute; left:18px; bottom:16px; z-index:2; color:#fff; font-size:20px; font-weight:700; text-shadow:0 2px 8px rgba(0,0,0,0.4); }

.pill { position:absolute; z-index:5; left:50%; top:50%; transform:translate(-50%,-50%);
  padding:22px 48px; border-radius:60px; background:#fff; color:var(--accent-3); font-size:42px; font-weight:800;
  box-shadow:0 24px 60px rgba(124,58,237,0.3); opacity:0; white-space:nowrap; }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(124,58,237,0.4);
  background:rgba(255,255,255,0.8); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="label"></div>
  <div class="stage" id="stage"></div>
  <div class="pill" id="pill"></div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════ EDIT EVERYTHING HERE ════════════════ */
const CONFIG = {
  label: 'Lego 59 · Image Grid Rearrange',
  pill: 'Diverse industries',
  // each tile: caption + a CSS background (gradient or url(...)) for the image
  tiles: [
    { cap: 'Municipal',  img: 'linear-gradient(135deg,#f59e0b,#b45309)' },
    { cap: 'Recycling',  img: 'linear-gradient(135deg,#10b981,#065f46)' },
    { cap: 'Industrial', img: 'linear-gradient(135deg,#3b82f6,#1e3a8a)' },
    { cap: 'Hazardous',  img: 'linear-gradient(135deg,#ef4444,#7f1d1d)' }
  ],
  rearrangeAt: 1.6,   // seconds before tiles fan out
  colors: { bgA:'#efeafc', bgB:'#d9cdf5', accent:'#7c3aed', accent3:'#5b21b6', ink:'#1c1530', overlay:'rgba(124,58,237,0.45)' }
};
/* ═══════════════════════════════════════════════════════ */

const C = CONFIG.colors, _r = document.documentElement.style;
_r.setProperty('--bg-a', C.bgA); _r.setProperty('--bg-b', C.bgB);
_r.setProperty('--accent', C.accent); _r.setProperty('--accent-3', C.accent3);
_r.setProperty('--ink', C.ink); _r.setProperty('--overlay', C.overlay);
document.getElementById('label').textContent = CONFIG.label;
document.getElementById('pill').textContent = CONFIG.pill;

// build tiles
const stage = document.getElementById('stage');
stage.innerHTML = CONFIG.tiles.map((t, i) =>
  `<div class="tile" id="t${i}"><div class="img" style="background:${t.img}"></div><div class="ov"></div><div class="cap">${t.cap}</div></div>`).join('');

// layouts — all coords keep tiles fully inside 1920×1080
const GRID = [
  { x: 560, y: 200, w: 380, h: 300 }, { x: 980, y: 200, w: 380, h: 300 },
  { x: 560, y: 540, w: 380, h: 300 }, { x: 980, y: 540, w: 380, h: 300 }
];
const FAN = [
  { x: 250, y: 170, w: 420, h: 340 }, { x: 1250, y: 150, w: 360, h: 260 },
  { x: 230, y: 600, w: 360, h: 300 }, { x: 1290, y: 560, w: 400, h: 340 }
];
function applyStatic(layout) {
  layout.forEach((c, i) => { const t = document.getElementById('t' + i);
    t.style.left = c.x + 'px'; t.style.top = c.y + 'px'; t.style.width = c.w + 'px'; t.style.height = c.h + 'px'; });
}

function play() {
  gsap.killTweensOf('*');
  applyStatic(GRID);
  const tiles = CONFIG.tiles.map((_, i) => document.getElementById('t' + i));
  gsap.set(tiles, { opacity: 0, scale: 0.8, y: 40 });
  gsap.set('#pill', { opacity: 0, scale: 0.7 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;
  tl.to(tiles, { opacity: 1, scale: 1, y: 0, duration: 0.8, ease: 'back.out(1.5)', stagger: 0.12 }, 0.2);
  FAN.forEach((c, i) => {
    tl.to('#t' + i, { left: c.x, top: c.y, width: c.w, height: c.h, duration: 1.0, ease: 'power3.inOut' }, CONFIG.rearrangeAt);
  });
  tl.to('#pill', { opacity: 1, scale: 1, duration: 0.8, ease: 'back.out(1.8)' }, CONFIG.rearrangeAt + 0.6);
  tl.to({}, { duration: 2.0 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
