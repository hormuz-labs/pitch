<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>64 – Camera Orbit / Arc</title>
<style>
:root { --bg:#0a0612; --bg-mid:#1d1038; --accent:#a78bfa; --accent-2:#7c3aed; --panel:#f6f4fb; --panel-2:#efeafc; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; background:radial-gradient(ellipse at 50% 40%, var(--bg-mid), var(--bg) 72%); display:flex; align-items:center; justify-content:center; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.5; z-index:100; }
.caption { position:absolute; bottom:90px; left:0; right:0; text-align:center; z-index:20; }
.caption .h { font-size:48px; font-weight:800; letter-spacing:-1px; opacity:0; }
.caption .h .accent { color:var(--accent); }

/* The "orbit" is the rig rotateY-ing about a centre; per-card depth (translateZ) makes
   the parallax read as a camera arcing around the stack rather than a flat spin. */
.rig { position:relative; width:900px; height:560px; perspective:1700px; }
.orbit { position:absolute; inset:0; transform-style:preserve-3d; will-change:transform; }
.card { position:absolute; top:50%; left:50%; width:720px; height:460px; margin:-230px 0 0 -360px;
  border-radius:20px; overflow:hidden; background:var(--panel); box-shadow:0 50px 100px rgba(0,0,0,0.5);
  border:1px solid rgba(255,255,255,0.12); transform-style:preserve-3d; }
.card .bar { height:44px; background:var(--panel-2); display:flex; align-items:center; gap:8px; padding:0 16px; }
.card .bar i { width:11px; height:11px; border-radius:50%; background:#d6cdf0; }
.card .body { padding:22px; }
.card .tag { display:inline-block; font-size:12px; font-weight:700; color:var(--accent-2); background:#fff; padding:4px 10px; border-radius:20px; box-shadow:0 3px 10px rgba(124,58,237,0.2); }
.card .row { height:34px; border-radius:8px; background:#ece6fb; margin-top:12px; }
.card .row.hl { background:linear-gradient(90deg,#ddd0fb,var(--panel-2)); }
.card .panel { height:150px; border-radius:12px; margin-top:14px; background:linear-gradient(135deg,#241046,var(--accent-2)); }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid var(--accent);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="label"></div>

  <div class="rig">
    <div class="orbit" id="orbit">
      <div class="card" id="c3"><div class="bar"><i></i><i></i><i></i></div><div class="body"><span class="tag" id="t3"></span><div class="row"></div><div class="panel"></div></div></div>
      <div class="card" id="c2"><div class="bar"><i></i><i></i><i></i></div><div class="body"><span class="tag" id="t2"></span><div class="row hl"></div><div class="row"></div><div class="panel"></div></div></div>
      <div class="card" id="c1"><div class="bar"><i></i><i></i><i></i></div><div class="body"><span class="tag" id="t1"></span><div class="row"></div><div class="row hl"></div><div class="row"></div></div></div>
    </div>
  </div>

  <div class="caption"><div class="h" id="capH"></div></div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════ EDIT EVERYTHING HERE ════════════════ */
const CONFIG = {
  label: 'Lego 64 · Camera Orbit / Arc',
  tags: { c1: 'Bins Pickup', c2: 'Routes', c3: 'Analytics' },
  caption: [{ t: 'Layered by ' }, { t: 'design.', accent: true }],
  arcDegrees: 34,        // how far the camera arcs around the stack
  arcDuration: 4.0,      // seconds for the full there-and-back arc
  colors: { bg:'#0a0612', bgMid:'#1d1038', accent:'#a78bfa', accent2:'#7c3aed', panel:'#f6f4fb', panel2:'#efeafc' }
};
/* ═══════════════════════════════════════════════════════ */

const C = CONFIG.colors, _r = document.documentElement.style;
_r.setProperty('--bg', C.bg); _r.setProperty('--bg-mid', C.bgMid);
_r.setProperty('--accent', C.accent); _r.setProperty('--accent-2', C.accent2);
_r.setProperty('--panel', C.panel); _r.setProperty('--panel-2', C.panel2);
document.getElementById('label').textContent = CONFIG.label;
document.getElementById('t1').textContent = CONFIG.tags.c1;
document.getElementById('t2').textContent = CONFIG.tags.c2;
document.getElementById('t3').textContent = CONFIG.tags.c3;
document.getElementById('capH').innerHTML = CONFIG.caption.map(s => s.accent ? `<span class="accent">${s.t}</span>` : s.t).join('');

function play() {
  gsap.killTweensOf('*');
  // stagger cards in depth (Z) and slight offset so the stack has real volume
  gsap.set('#c1', { z: 120, x: -90, y: 50,  rotateZ: -4, opacity: 0, scale: 0.9 });
  gsap.set('#c2', { z: 0,   x: 0,   y: 0,   rotateZ: 0,  opacity: 0, scale: 0.9 });
  gsap.set('#c3', { z: -120,x: 90,  y: -50, rotateZ: 4,  opacity: 0, scale: 0.9 });
  gsap.set('#orbit', { rotateY: -CONFIG.arcDegrees / 2, rotateX: 6 });
  gsap.set('#capH', { opacity: 0, y: 18 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // cards assemble
  tl.to('#c1', { opacity: 1, scale: 1, duration: 0.8, ease: 'power3.out' }, 0.2);
  tl.to('#c2', { opacity: 1, scale: 1, duration: 0.8, ease: 'power3.out' }, 0.35);
  tl.to('#c3', { opacity: 1, scale: 1, duration: 0.8, ease: 'power3.out' }, 0.5);

  // ── the orbit: camera arcs from one side to the other and eases back, weighted in/out ──
  tl.to('#orbit', { rotateY: CONFIG.arcDegrees / 2, duration: CONFIG.arcDuration, ease: 'power2.inOut' }, 1.0);
  tl.to('#orbit', { rotateY: -CONFIG.arcDegrees / 4, duration: CONFIG.arcDuration * 0.6, ease: 'power2.inOut' }, 1.0 + CONFIG.arcDuration);

  tl.to('#capH', { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 1.4);
  tl.to({}, { duration: 1.4 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
