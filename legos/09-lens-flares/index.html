<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>09 – Anamorphic Lens Flares</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#0D0D0D; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; }

.label {
  position:absolute; top:32px; left:32px; font-size:13px; color:#00AA45; letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4; z-index:100;
}

/* ── Scene setup ── */
.scene {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  pointer-events:none;
}
#sceneDark {
  background: radial-gradient(ellipse at 50% 50%, #1a1410 0%, #0D0D0D 70%);
}
#sceneLight {
  background: radial-gradient(ellipse at 50% 50%, #1a2a1e 0%, #0D0D0D 70%);
  opacity:0;
}

.dark-title {
  font-size:72px; font-weight:300; color:rgba(255,255,255,0.12);
  letter-spacing:12px; text-transform:uppercase;
}
.light-title {
  font-size:80px; font-weight:900; letter-spacing:-2px;
}
.light-title .accent { color:#00AA45; }

/* ── Lens flare layers ── */
.flare-layer {
  position:absolute; inset:0; pointer-events:none;
  mix-blend-mode:screen;
}

/* Horizontal anamorphic streak */
.anamorphic-streak {
  position:absolute; height:4px; width:100%;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255,200,100,0) 10%,
    rgba(255,200,100,0.4) 30%,
    rgba(255,255,200,0.7) 50%,
    rgba(255,200,100,0.4) 70%,
    rgba(255,200,100,0) 90%,
    transparent 100%
  );
  filter: blur(2px);
  opacity:0; transform:translateX(-50%) scaleX(0.3);
}

/* Ghost orbs */
.ghost-orb {
  position:absolute; border-radius:50%;
  filter: blur(40px);
  opacity:0;
}

/* Light wrap / rim light */
.rim-light {
  position:absolute; width:100%; height:100%;
  background: radial-gradient(ellipse at 30% 50%, rgba(255,200,100,0.08) 0%, transparent 60%);
  opacity:0;
}

/* Chromatic streak */
.chromatic-streak {
  position:absolute; width:200%; height:3px;
  filter: blur(3px);
  opacity:0; transform:rotate(-15deg);
}

#replayBtn {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(0,170,69,0.4);
  background:rgba(0,0,0,0.7); color:#00AA45; cursor:pointer; font-size:13px;
  font-family:monospace; backdrop-filter:blur(10px);
}

/* Flash overlay */
.flash-overlay {
  position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;
}
</style>
</head>
<body>
<div class="vp">
  <div class="label">Lego 09 · Anamorphic Lens Flares</div>

  <!-- Scene: Dark → Light transition -->
  <div class="scene" id="sceneDark">
    <div class="dark-title">dark matter</div>
  </div>
  <div class="scene" id="sceneLight">
    <div class="light-title"><span class="accent">PEER</span>LIST</div>
  </div>

  <div class="flash-overlay" id="flashOverlay"></div>

  <!-- Rim light -->
  <div class="rim-light" id="rimLight"></div>

  <!-- Anamorphic streak (horizontal sweep) -->
  <div class="anamorphic-streak" id="streak1" style="top:45%;"></div>
  <div class="anamorphic-streak" id="streak2" style="top:55%;"></div>

  <!-- Ghost orbs -->
  <div class="ghost-orb" id="orb1" style="width:300px;height:300px;top:30%;left:20%;background:radial-gradient(circle,rgba(255,180,80,0.6),transparent);"></div>
  <div class="ghost-orb" id="orb2" style="width:200px;height:200px;bottom:25%;right:15%;background:radial-gradient(circle,rgba(100,200,255,0.4),transparent);"></div>
  <div class="ghost-orb" id="orb3" style="width:150px;height:150px;top:50%;right:30%;background:radial-gradient(circle,rgba(0,170,69,0.5),transparent);"></div>

  <!-- Chromatic streaks -->
  <div class="chromatic-streak" id="chroma1" style="top:35%;left:-20%;background:linear-gradient(90deg,transparent,#ff0040,transparent);"></div>
  <div class="chromatic-streak" id="chroma2" style="top:65%;left:-20%;background:linear-gradient(90deg,transparent,#00ccff,transparent);"></div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
function play() {
  gsap.killTweensOf('*');
  gsap.set('#sceneDark', { opacity: 1 });
  gsap.set('#sceneLight', { opacity: 0 });
  gsap.set('#flashOverlay', { opacity: 0 });
  gsap.set('#rimLight', { opacity: 0 });
  gsap.set('#streak1, #streak2', { opacity: 0, scaleX: 0.3 });
  gsap.set('#orb1, #orb2, #orb3', { opacity: 0, scale: 0.5 });
  gsap.set('#chroma1, #chroma2', { opacity: 0 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // ── Act 1: Dark scene, subtle ambient glow (0–2s) ──
  tl.to('#orb1', { opacity: 0.15, scale: 1, duration: 2, ease: 'power2.out' }, 0.3);
  tl.to('#orb2', { opacity: 0.1, scale: 1, duration: 2, ease: 'power2.out' }, 0.8);

  // ── Act 2: Anamorphic streak sweeps in (2–3.5s) ──
  tl.to('#streak1', {
    opacity: 0.7, scaleX: 1, duration: 0.8, ease: 'power3.out'
  }, 2);
  tl.to('#streak1', {
    opacity: 0, duration: 1.5, ease: 'power2.in'
  }, 2.8);

  tl.to('#streak2', {
    opacity: 0.5, scaleX: 0.9, duration: 0.6, ease: 'power3.out'
  }, 3.0);
  tl.to('#streak2', {
    opacity: 0, duration: 1.5, ease: 'power2.in'
  }, 3.6);

  // ── Act 3: Flash + light scene reveals logo (3.5–5s) ──
  tl.to('#flashOverlay', { opacity: 0.15, duration: 0.15, ease: 'power2.in' }, 3.8);
  tl.to('#flashOverlay', { opacity: 0, duration: 0.4, ease: 'power2.out' }, 3.95);

  tl.set('#sceneDark', { opacity: 0 }, 3.9);
  tl.set('#sceneLight', { opacity: 1 }, 3.9);

  // Rim light kicks in
  tl.to('#rimLight', { opacity: 0.6, duration: 0.8, ease: 'power2.out' }, 3.9);

  // Orbs move and re-form
  tl.to('#orb1', { x: -60, y: -40, opacity: 0.08, duration: 1.5, ease: 'power2.out' }, 4.0);
  tl.to('#orb2', { x: 40, y: 30, opacity: 0.06, duration: 1.5, ease: 'power2.out' }, 4.2);

  // Green orb blooms
  tl.to('#orb3', { opacity: 0.3, scale: 1.8, duration: 1.2, ease: 'power2.out' }, 3.9);
  tl.to('#orb3', { opacity: 0, duration: 1.5, ease: 'power2.in' }, 5.0);

  // Chromatic aberration streaks
  tl.to('#chroma1', { opacity: 0.12, duration: 0.6, ease: 'power3.out' }, 4.5);
  tl.to('#chroma1', { opacity: 0, duration: 1.0, ease: 'power2.in' }, 5.1);
  tl.to('#chroma2', { opacity: 0.08, duration: 0.6, ease: 'power3.out' }, 4.8);
  tl.to('#chroma2', { opacity: 0, duration: 1.0, ease: 'power2.in' }, 5.4);

  tl.to({}, { duration: 1.5 }, 6);
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
