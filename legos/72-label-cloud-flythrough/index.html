<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>72 – Label-Cloud Fly-Through</title>
<style>
:root { --bg-a:#0c0a14; --bg-b:#14101f; --accent:#c9a7ff; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg-a); font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; background:radial-gradient(ellipse at 50% 50%, var(--bg-b), var(--bg-a) 75%); }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.5; z-index:100; }

/* the 3D scene the camera flies through */
.scene { position:absolute; inset:0; perspective:1000px; z-index:1; }
.cloud { position:absolute; inset:0; transform-style:preserve-3d; }
.tag { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); white-space:nowrap;
  font-size:40px; font-weight:700; padding:14px 28px; border-radius:40px;
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); backdrop-filter:blur(6px);
  will-change:transform, opacity; opacity:0; }

/* anchor headline stays at the focal centre */
.anchor { position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.anchor .h { font-size:84px; font-weight:800; letter-spacing:-2px; opacity:0;
  background:linear-gradient(120deg,#ff9bd0,#c9a7ff,#9be7c4); -webkit-background-clip:text; background-clip:text; color:transparent; }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid var(--accent);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="label"></div>
  <div class="scene"><div class="cloud" id="cloud"></div></div>
  <div class="anchor"><div class="h" id="anchorH"></div></div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════ EDIT EVERYTHING HERE ════════════════ */
const CONFIG = {
  label: 'Lego 72 · Label-Cloud Fly-Through',
  anchor: 'Create your own sound.',
  // category-coloured node-type labels the camera flies through
  labels: [
    { t:'Guitar Node',    c:'#b07bff' }, { t:'Melody AI Node', c:'#ff7eb6' },
    { t:'Bass Node',      c:'#b07bff' }, { t:'Vocal Node',     c:'#b07bff' },
    { t:'Drum Node',      c:'#ffa94d' }, { t:'Master AI Node', c:'#ff7eb6' },
    { t:'Reverse FX',     c:'#4cc38a' }, { t:'Reverb Node',    c:'#4cc38a' },
    { t:'Sampler Node',   c:'#ffa94d' }, { t:'Arp AI Node',    c:'#ff7eb6' },
    { t:'Delay FX',       c:'#4cc38a' }, { t:'Synth Node',     c:'#b07bff' },
    { t:'Sidechain FX',   c:'#4cc38a' }, { t:'Chord AI Node',  c:'#ff7eb6' }
  ],
  flyDuration: 4.2,       // seconds the camera flies through the cloud
  colors: { bgA:'#0c0a14', bgB:'#14101f', accent:'#c9a7ff' }
};
/* ═══════════════════════════════════════════════════════ */

const C = CONFIG.colors, _r = document.documentElement.style;
_r.setProperty('--bg-a', C.bgA); _r.setProperty('--bg-b', C.bgB); _r.setProperty('--accent', C.accent);
document.getElementById('label').textContent = CONFIG.label;
document.getElementById('anchorH').textContent = CONFIG.anchor;

const cloud = document.getElementById('cloud');
// give each label a random position + depth; keep x/y modest so they stay framed as they pass
const items = CONFIG.labels.map((l, i) => {
  const e = document.createElement('div'); e.className = 'tag'; e.textContent = l.t;
  e.style.color = l.c; e.style.borderColor = l.c + '55';
  cloud.appendChild(e);
  return {
    e,
    x: gsap.utils.random(-560, 560),
    y: gsap.utils.random(-320, 320),
    z0: -2400 - i * 130        // staggered in depth, far → near
  };
});

function play() {
  gsap.killTweensOf('*');
  gsap.set('#anchorH', { opacity: 0, scale: 0.9 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;
  const D = CONFIG.flyDuration;

  items.forEach((it, i) => {
    // each label flies from far (z very negative) toward the camera; we FADE IT OUT before
    // it crosses the lens (max z ≈ +320, scale stays modest) so nothing blows up / clips.
    gsap.set(it.e, { x: it.x, y: it.y, z: it.z0, opacity: 0 });
    const dur = D, delay = (i / items.length) * D * 0.6;
    tl.to(it.e, { z: 320, duration: dur, ease: 'none' }, delay);
    tl.to(it.e, { opacity: 1, duration: 0.5, ease: 'power1.out' }, delay);          // fade in from the haze
    tl.to(it.e, { opacity: 0, duration: 0.5, ease: 'power1.in' }, delay + dur - 0.5); // fade before passing lens
  });

  // anchor headline holds at focal centre, gentle pulse
  tl.to('#anchorH', { opacity: 1, scale: 1, duration: 1.0, ease: 'power3.out' }, 0.8);
  tl.to('#anchorH', { scale: 1.04, duration: 2.2, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 1.8);

  tl.to({}, { duration: 1.2 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
