<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>45 – Confetti Celebration</title>
<style>
:root { --accent:#00AA45; --accent-rgb:0,170,69; --accent-2:#00e855; --accent-2-rgb:0,232,85; --bg:#0D0D0D; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4; z-index:100; }

#confetti { position:absolute; inset:0; z-index:2; }

.center { position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; pointer-events:none; }
.badge {
  width:180px; height:180px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #00e06a, #008f3a);
  display:flex; align-items:center; justify-content:center; font-size:90px;
  box-shadow:0 20px 60px rgba(var(--accent-rgb),0.45); position:relative;
}
.badge::after { content:''; position:absolute; inset:-14px; border-radius:50%; border:2px solid rgba(var(--accent-rgb),0.4); }
.headline { font-size:88px; font-weight:900; letter-spacing:-2px; }
.headline .accent { color:var(--accent); }
.subline { font-size:26px; color:rgba(255,255,255,0.5); letter-spacing:3px; }

/* radial burst rings */
.ring { position:absolute; top:50%; left:50%; border:2px solid rgba(var(--accent-rgb),0.5); border-radius:50%;
  width:180px; height:180px; transform:translate(-50%,-50%) scale(0); opacity:0; z-index:1; }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(var(--accent-rgb),0.4);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="cfgLabel">Lego 45 · Confetti Celebration</div>

  <div class="ring" id="ring1"></div>
  <div class="ring" id="ring2"></div>

  <canvas id="confetti" width="1920" height="1080"></canvas>

  <div class="center">
    <div class="badge" id="badge">🎉</div>
    <div class="headline" id="headline"><span class="accent">10,000</span> builders</div>
    <div class="subline" id="subline">shipped this week on Peerlist</div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
const COLORS = ['#00AA45', '#00e06a', '#ffffff', '#7CFFB0', '#FFD23F'];

let particles = [];
let raf = null;

function spawnBurst(originX, originY, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 6 + Math.random() * 16;
    particles.push({
      x: originX, y: originY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 6,    // bias upward
      w: 6 + Math.random() * 10,
      h: 10 + Math.random() * 14,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.4,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      life: 1, decay: 0.004 + Math.random() * 0.006,
      sway: Math.random() * Math.PI * 2
    });
  }
}

function tick() {
  ctx.clearRect(0, 0, 1920, 1080);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += 0.28;                 // gravity
    p.vx *= 0.99;                 // air drag
    p.sway += 0.1;
    p.x += p.vx + Math.sin(p.sway) * 0.8;
    p.y += p.vy;
    p.rot += p.vr;
    p.life -= p.decay;
    if (p.life <= 0 || p.y > 1140) { particles.splice(i, 1); continue; }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.4));
    ctx.fillStyle = p.color;
    // flutter: squash width by rotation phase to fake 3D spin
    const sx = Math.abs(Math.cos(p.sway));
    ctx.fillRect(-p.w / 2 * sx, -p.h / 2, p.w * sx, p.h);
    ctx.restore();
  }
  raf = requestAnimationFrame(tick);
}

function play() {
  gsap.killTweensOf('*');
  if (raf) cancelAnimationFrame(raf);
  particles = [];
  ctx.clearRect(0, 0, 1920, 1080);
  tick();

  gsap.set('#badge', { scale: 0, rotation: -40, opacity: 0 });
  gsap.set('#headline', { scale: 0.7, opacity: 0, y: 30 });
  gsap.set('#subline', { opacity: 0, y: 20 });
  gsap.set(['#ring1', '#ring2'], { scale: 0, opacity: 0 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // Badge pops
  tl.to('#badge', { scale: 1, rotation: 0, opacity: 1, duration: 0.8, ease: 'back.out(2.2)' }, 0.3);

  // Burst rings + confetti cannon on the pop
  tl.add(() => {
    spawnBurst(960, 470, 160);
    spawnBurst(620, 540, 60);
    spawnBurst(1300, 540, 60);
  }, 0.7);
  tl.fromTo('#ring1', { scale: 0, opacity: 0.7 }, { scale: 4, opacity: 0, duration: 1.0, ease: 'power2.out' }, 0.7);
  tl.fromTo('#ring2', { scale: 0, opacity: 0.5 }, { scale: 6, opacity: 0, duration: 1.3, ease: 'power2.out' }, 0.85);

  // Headline + subline
  tl.to('#headline', { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: 'back.out(1.8)' }, 0.9);
  tl.to('#subline', { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, 1.3);

  // Second, smaller confetti wave for sustain
  tl.add(() => { spawnBurst(960, 470, 90); }, 1.8);

  tl.to({}, { duration: 3.0 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>

<script>
/* ════════ EDIT COLORS / LABEL HERE — applies live via CSS variables ════════ */
const CONFIG = {
  label: "Lego 45 · Confetti Celebration",
  colors: {
    accent:     '#00AA45',   // primary brand accent
    accentRgb:  '0,170,69',  // same accent, for rgba() glows/shadows
    accent2:    '#00e855',   // secondary / brighter accent (used by some scenes)
    accent2Rgb: '0,232,85',
    bg:         '#0D0D0D'    // page background
  }
};
/* ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  var c = CONFIG.colors, r = document.documentElement.style;
  r.setProperty('--accent', c.accent);       r.setProperty('--accent-rgb', c.accentRgb);
  r.setProperty('--accent-2', c.accent2);     r.setProperty('--accent-2-rgb', c.accent2Rgb);
  r.setProperty('--bg', c.bg);
  var lab = document.getElementById('cfgLabel'); if (lab) lab.textContent = CONFIG.label;
})();
</script>
</body>
</html>
