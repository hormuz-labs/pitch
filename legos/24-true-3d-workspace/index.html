<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>24 – True 3D Workspace & Modeling</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#08080A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center; perspective: 1200px; }

.label {
  position:absolute; top:32px; left:32px; font-size:13px; color:#00e855; letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4; z-index:100;
}

/* 3D Scene Assembly */
.scene {
  width: 800px;
  height: 600px;
  transform-style: preserve-3d;
  will-change: transform;
}

.laptop {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 500px;
  height: 340px;
  margin-left: -250px;
  margin-top: -170px;
  transform-style: preserve-3d;
  will-change: transform;
}

/* Laptop Screen Lid */
.lid {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 500px;
  height: 320px;
  transform-origin: bottom center;
  transform-style: preserve-3d;
  transform: rotateX(-90deg); /* Start closed */
  will-change: transform;
}

.screen-back {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #1e1e24, #121215);
  border-radius: 12px 12px 0 0;
  border: 1px solid rgba(255,255,255,0.08);
  backface-visibility: hidden;
  transform: translateZ(-2px);
  display: flex;
  align-items: center;
  justify-content: center;
}
.screen-logo {
  font-size: 28px;
  color: rgba(255,255,255,0.15);
  font-weight: 700;
  letter-spacing: 4px;
}

.screen-front {
  position: absolute;
  inset: 0;
  background: #0d0d11;
  border-radius: 12px 12px 0 0;
  border: 8px solid #16161c;
  border-bottom-width: 14px;
  backface-visibility: hidden;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
  transform: translateZ(2px);
  overflow: hidden;
}

/* UI Content Inside Screen */
.screen-content {
  width: 100%;
  height: 100%;
  position: relative;
  background: #0B0B0E;
  font-family: monospace;
}
.screen-header {
  height: 28px;
  background: #14141a;
  display: flex;
  align-items: center;
  padding: 0 12px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  gap: 6px;
}
.dot { width: 6px; height: 6px; border-radius: 50%; }
.dot-r { background: #ef4444; }
.dot-y { background: #f59e0b; }
.dot-g { background: #10b981; }
.screen-title { font-size: 10px; color: rgba(255,255,255,0.3); margin-left: 10px; }

.screen-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  height: calc(100% - 28px);
}
.terminal-text {
  font-size: 11px;
  color: #00e855;
  line-height: 1.5;
  white-space: pre-wrap;
  margin-bottom: 12px;
}
.ui-dashboard {
  opacity: 0;
  display: none;
  flex-direction: column;
  gap: 12px;
  height: 100%;
}
.dash-row {
  display: flex;
  gap: 12px;
}
.dash-card {
  flex: 1;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 6px;
  padding: 10px;
}
.dash-card h4 {
  font-size: 9px;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.dash-card .val {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
}
.chart-container {
  height: 110px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.04);
  border-radius: 6px;
  position: relative;
  overflow: hidden;
  padding: 10px;
}
.chart-svg {
  width: 100%;
  height: 100%;
}
.chart-path {
  fill: none;
  stroke: #00e855;
  stroke-width: 2;
  stroke-dasharray: 600;
  stroke-dashoffset: 600;
}

/* Laptop Keyboard Base */
.base {
  position: absolute;
  bottom: -4px;
  left: 0;
  width: 500px;
  height: 340px;
  transform-origin: bottom center;
  transform: rotateX(90deg) translateZ(4px);
  transform-style: preserve-3d;
  will-change: transform;
}

.base-top {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, #1b1b22, #101014);
  border-radius: 0 0 16px 16px;
  border: 1px solid rgba(255,255,255,0.06);
  backface-visibility: hidden;
  box-shadow: inset 0 10px 20px rgba(255,255,255,0.05);
}

/* Keyboard Area */
.keyboard {
  width: 440px;
  height: 160px;
  margin: 30px auto 0;
  background: #0a0a0d;
  border-radius: 8px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  box-shadow: inset 0 2px 10px rgba(0,0,0,0.6);
}
.key-row {
  display: flex;
  gap: 4px;
  height: calc(20% - 3px);
}
.key {
  flex: 1;
  background: #1d1d24;
  border-radius: 2px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.4);
}
.key.space { flex: 4; }
.key.active { background: #00e855 !important; box-shadow: 0 0 10px #00e855 !important; }

/* Trackpad */
.trackpad {
  width: 140px;
  height: 80px;
  margin: 20px auto 0;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 4px;
}

/* Laptop Sides (thickness) */
.base-front {
  position: absolute;
  left: 0;
  bottom: -16px;
  width: 500px;
  height: 16px;
  background: #0e0e12;
  transform: rotateX(-90deg);
  transform-origin: top center;
  border-radius: 0 0 8px 8px;
}

/* Controls */
#replayBtn {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(0,170,69,0.4);
  background:rgba(0,0,0,0.7); color:#00AA45; cursor:pointer; font-size:13px;
  font-family:monospace; backdrop-filter:blur(10px);
}
</style>
</head>
<body>
<div class="vp">
  <div class="label">Lego 24 · True 3D Workspace & Modeling</div>

  <div class="scene" id="scene">
    <div class="laptop" id="laptop">
      
      <!-- Screen Lid (rotates open) -->
      <div class="lid" id="lid">
        <div class="screen-back">
          <div class="screen-logo">PREMIUM</div>
        </div>
        <div class="screen-front">
          <div class="screen-content">
            <div class="screen-header">
              <div class="dot dot-r"></div>
              <div class="dot dot-y"></div>
              <div class="dot dot-g"></div>
              <div class="screen-title">terminal - build:prod</div>
            </div>
            <div class="screen-body">
              <div class="terminal-text" id="termText"></div>
              
              <div class="ui-dashboard" id="dashboard">
                <div class="dash-row">
                  <div class="dash-card">
                    <h4>SYSTEM HEALTH</h4>
                    <div class="val" id="healthVal">99.9%</div>
                  </div>
                  <div class="dash-card">
                    <h4>ACTIVE NODES</h4>
                    <div class="val" id="nodesVal">1,024</div>
                  </div>
                </div>
                <div class="chart-container">
                  <svg class="chart-svg" viewBox="0 0 460 110">
                    <path class="chart-path" id="chartPath" d="M 0 100 Q 80 20, 160 80 T 320 30 T 460 5" />
                  </svg>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>

      <!-- Keyboard Base -->
      <div class="base">
        <div class="base-top">
          <div class="keyboard">
            <div class="key-row">
              <div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key font"></div><div class="key"></div><div class="key"></div>
            </div>
            <div class="key-row">
              <div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div>
            </div>
            <div class="key-row">
              <div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div>
            </div>
            <div class="key-row">
              <div class="key"></div><div class="key"></div><div class="key"></div><div class="key space"></div><div class="key"></div><div class="key"></div><div class="key"></div>
            </div>
          </div>
          <div class="trackpad"></div>
        </div>
        <div class="base-front"></div>
      </div>

    </div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
function play() {
  gsap.killTweensOf('*');
  
  // Reset
  gsap.set('#laptop', { rotateX: 20, rotateY: -35, rotateZ: 0, scale: 1.2 });
  gsap.set('#lid', { rotateX: -180 }); // start completely closed (facing down)
  gsap.set('#termText', { textContent: '' });
  gsap.set('#dashboard', { opacity: 0, display: 'none' });
  gsap.set('#chartPath', { strokeDashoffset: 600 });
  
  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // Phase 1: Establish scene, laptop opens (0 - 1.8s)
  tl.to('#lid', { rotateX: -25, duration: 1.8, ease: 'power2.out' }, 0.2);
  tl.to('#laptop', { rotateY: 25, duration: 2.2, ease: 'power1.inOut' }, 0.2);

  // Keyboard lights up
  const keys = document.querySelectorAll('.key');
  tl.to(keys, {
    backgroundColor: '#00e855',
    boxShadow: '0 0 8px #00e855',
    stagger: { each: 0.015, from: 'random' },
    duration: 0.1,
    yoyo: true,
    repeat: 1
  }, 0.8);

  // Phase 2: System Boot / Code Output typing inside screen (1.8s - 3.8s)
  const codeLines = [
    "> npm run start:analytics",
    "> Initializing cloud sync...",
    "> Establishing neural mesh nodes...",
    "> Connection SECURE.",
    "> Loading system UI..."
  ];

  let currentText = '';
  codeLines.forEach((line, index) => {
    tl.to({}, {
      duration: 0.35,
      onStart: () => {
        currentText += line + '\n';
        document.getElementById('termText').textContent = currentText;
      }
    }, 1.8 + index * 0.35);
  });

  // Phase 3: Transition to beautiful Dashboard + Camera focus zoom (3.8s - 6s)
  tl.to('#termText', { opacity: 0, duration: 0.3 }, 3.8);
  tl.set('#dashboard', { display: 'flex' }, 4.0);
  tl.to('#dashboard', { opacity: 1, duration: 0.5 }, 4.0);
  
  // Camera zooms into screen for maximum detail
  tl.to('#laptop', { 
    rotateX: 10,
    rotateY: 5,
    scale: 2.1,
    y: 80,
    duration: 2.0, 
    ease: 'power3.inOut' 
  }, 3.8);

  // SVG Line Chart reveal
  tl.to('#chartPath', { strokeDashoffset: 0, duration: 1.5, ease: 'power2.out' }, 4.2);

  // Animated counters inside dashboard
  const systemHealth = { val: 0 };
  tl.to(systemHealth, {
    val: 99.9,
    duration: 1.2,
    ease: 'power2.out',
    onUpdate: () => {
      document.getElementById('healthVal').textContent = systemHealth.val.toFixed(1) + '%';
    }
  }, 4.2);

  const activeNodes = { val: 0 };
  tl.to(activeNodes, {
    val: 1024,
    duration: 1.5,
    ease: 'power2.out',
    onUpdate: () => {
      document.getElementById('nodesVal').textContent = Math.round(activeNodes.val).toLocaleString();
    }
  }, 4.2);

  // Phase 4: Swoop camera to cinematic hero angle and rotate out (6s - 8s)
  tl.to('#laptop', {
    rotateX: 25,
    rotateY: -45,
    scale: 1.15,
    y: 0,
    duration: 2.0,
    ease: 'power2.inOut'
  }, 6.0);

  tl.to({}, { duration: 0.5 }); // buffer at the end
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
