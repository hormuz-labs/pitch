<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>51 – Extreme Text Zoom</title>
<style>
:root { --bg:#0a0612; --bg-mid:#28124a; --bg-mid2:#160a2b; --accent:#a78bfa; --grad-a:#ffffff; --grad-b:#c4b5fd; --grad-c:#8b5cf6; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; }

.bg { position:absolute; inset:0; z-index:0; background:radial-gradient(ellipse 80% 70% at 50% 50%, var(--bg-mid) 0%, var(--bg-mid2) 45%, var(--bg) 80%); }
.bg-parallax { position:absolute; inset:-10%; z-index:0; will-change:transform;
  background:radial-gradient(circle at 30% 40%, rgba(139,92,246,0.25), transparent 50%),
             radial-gradient(circle at 70% 60%, rgba(192,38,211,0.18), transparent 50%); }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.5; z-index:100; }

.zoom-stage { position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; }
.word {
  position:absolute; font-weight:900; letter-spacing:-4px; white-space:nowrap; line-height:1; font-size:200px;
  background:linear-gradient(180deg, var(--grad-a) 0%, var(--grad-b) 55%, var(--grad-c) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  will-change:transform, opacity; opacity:0;
}

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid var(--accent);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="bg"></div>
  <div class="bg-parallax" id="parallax"></div>
  <div class="label" id="label"></div>

  <div class="zoom-stage" id="stage"></div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════ EDIT EVERYTHING HERE ════════════════ */
const CONFIG = {
  label: 'Lego 51 · Extreme Text Zoom',
  // words rush toward camera, each handing off to the next; the LAST one is the hero
  words: ['Protecting', 'What Matters', 'Introducing', 'Arlo'],
  secondsPerWord: 1.5,
  colors: {
    bg:     '#0a0612',
    bgMid:  '#28124a',
    bgMid2: '#160a2b',
    accent: '#a78bfa',
    gradTop:'#ffffff',   // text gradient — top
    gradMid:'#c4b5fd',   // text gradient — middle
    gradBot:'#8b5cf6'    // text gradient — bottom
  }
};
/* ═══════════════════════════════════════════════════════ */

const _root = document.documentElement.style;
_root.setProperty('--bg', CONFIG.colors.bg);
_root.setProperty('--bg-mid', CONFIG.colors.bgMid);
_root.setProperty('--bg-mid2', CONFIG.colors.bgMid2);
_root.setProperty('--accent', CONFIG.colors.accent);
_root.setProperty('--grad-a', CONFIG.colors.gradTop);
_root.setProperty('--grad-b', CONFIG.colors.gradMid);
_root.setProperty('--grad-c', CONFIG.colors.gradBot);
document.getElementById('label').textContent = CONFIG.label;

const stage = document.getElementById('stage');
const WORDS = CONFIG.words;

function play() {
  gsap.killTweensOf('*');
  stage.innerHTML = '';
  gsap.set('#parallax', { x: 0, y: 0, scale: 1.1 });

  const els = WORDS.map(w => { const d = document.createElement('div'); d.className = 'word'; d.textContent = w; stage.appendChild(d); return d; });
  gsap.set(els, { opacity: 0, scale: 0.15, filter: 'blur(4px)' });

  const tl = gsap.timeline();
  window.masterTimeline = tl;
  gsap.to('#parallax', { x: -80, y: 40, duration: 14, ease: 'sine.inOut', yoyo: true, repeat: -1 });

  const SEG = CONFIG.secondsPerWord;
  els.forEach((el, i) => {
    const at = i * SEG, last = i === els.length - 1;
    tl.fromTo(el, { opacity: 0, scale: 0.15, filter: 'blur(6px)' },
      { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, at);
    if (!last) tl.to(el, { scale: 9, opacity: 0, filter: 'blur(10px)', duration: 0.8, ease: 'power2.in' }, at + 0.7);
    else tl.to(el, { scale: 1.06, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, at + 0.7);
  });
  tl.to({}, { duration: 1.4 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
