<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>56 – AI Chat Ticker</title>
<style>
:root { --bg:#0a0612; --bg-mid:#1f1140; --accent:#a78bfa; --accent-2:#8b5cf6; --accent-3:#6d28d9; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; background:radial-gradient(ellipse at 50% 40%, var(--bg-mid), var(--bg) 72%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:48px; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.5; z-index:100; }

.hero { text-align:center; opacity:0; }
.hero .k { font-family:'Courier New',monospace; font-size:18px; letter-spacing:8px; color:var(--accent); text-transform:uppercase; }
.hero .h { font-size:72px; font-weight:800; letter-spacing:-2px; margin-top:12px; }
.hero .h .spark { color:var(--accent); }

.chat {
  width:1000px; border-radius:24px; padding:30px 34px;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(24px); box-shadow:0 30px 80px rgba(0,0,0,0.45);
  display:flex; align-items:center; gap:20px; opacity:0;
}
.chat .spark-ic { font-size:40px; flex:0 0 auto; }
.chat .field { flex:1; height:64px; overflow:hidden; position:relative; }
.chat .ticker { position:absolute; left:0; top:0; width:100%; will-change:transform; }
.chat .q { height:64px; display:flex; align-items:center; font-size:30px; color:rgba(255,255,255,0.55); }
.chat .send { flex:0 0 auto; width:60px; height:60px; border-radius:16px; background:linear-gradient(135deg,var(--accent-2),var(--accent-3));
  display:flex; align-items:center; justify-content:center; font-size:26px; box-shadow:0 10px 26px rgba(124,58,237,0.4); }
.caret { display:inline-block; width:3px; height:34px; background:var(--accent); margin-left:4px; vertical-align:-6px; }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid var(--accent);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="label"></div>

  <div class="hero" id="hero">
    <div class="k" id="heroK"></div>
    <div class="h" id="heroH"></div>
  </div>

  <div class="chat" id="chat">
    <div class="spark-ic" id="sparkIc"></div>
    <div class="field"><div class="ticker" id="ticker"></div></div>
    <div class="send" id="sendIc"></div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════ EDIT EVERYTHING HERE ════════════════ */
const CONFIG = {
  label: 'Lego 56 · AI Chat Ticker',
  kicker: 'meet your operations copilot',
  heroHtml: 'Ask <span class="spark">✦ Arlo</span>',
  sparkIcon: '✦',
  sendIcon: '➤',
  questions: [
    'How can I reduce disposal costs this quarter?',
    'Where can we optimize for sustainability?',
    'How do I measure waste reduction over time?',
    'Which routes are running behind today?'
  ],
  holdPerQuestion: 1.4,   // seconds each question stays before sliding up
  colors: { bg:'#0a0612', bgMid:'#1f1140', accent:'#a78bfa', accent2:'#8b5cf6', accent3:'#6d28d9' }
};
/* ═══════════════════════════════════════════════════════ */

const C = CONFIG.colors, _r = document.documentElement.style;
_r.setProperty('--bg', C.bg); _r.setProperty('--bg-mid', C.bgMid);
_r.setProperty('--accent', C.accent); _r.setProperty('--accent-2', C.accent2); _r.setProperty('--accent-3', C.accent3);
document.getElementById('label').textContent = CONFIG.label;
document.getElementById('heroK').textContent = CONFIG.kicker;
document.getElementById('heroH').innerHTML = CONFIG.heroHtml;
document.getElementById('sparkIc').textContent = CONFIG.sparkIcon;
document.getElementById('sendIc').textContent = CONFIG.sendIcon;

const ticker = document.getElementById('ticker');
const QUESTIONS = CONFIG.questions;
const ROW = 64;

function play() {
  gsap.killTweensOf('*');
  ticker.innerHTML = '';
  [...QUESTIONS, QUESTIONS[0]].forEach(q => {
    const d = document.createElement('div'); d.className = 'q';
    d.innerHTML = q + '<span class="caret"></span>'; ticker.appendChild(d);
  });
  gsap.set(ticker, { y: 0 });
  gsap.set('#hero', { opacity: 0, y: 20 });
  gsap.set('#chat', { opacity: 0, y: 40, scale: 0.96 });
  gsap.set('.caret', { opacity: 1 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;
  tl.to('#hero', { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0.2);
  tl.to('#chat', { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: 'power3.out' }, 0.6);
  gsap.to('.caret', { opacity: 0, duration: 0.5, repeat: -1, yoyo: true, ease: 'steps(1)' });

  const H = CONFIG.holdPerQuestion;
  QUESTIONS.forEach((_, i) => {
    tl.to(ticker, { y: -ROW * (i + 1), duration: 0.6, ease: 'power3.inOut' }, 1.6 + i * H);
  });
  tl.set(ticker, { y: 0 }, 1.6 + QUESTIONS.length * H);
  tl.to({}, { duration: 1.0 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
