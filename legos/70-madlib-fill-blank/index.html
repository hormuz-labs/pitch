<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>70 – Madlib Fill-in-the-Blank</title>
<style>
:root { --bg:#0a0a0c; --accent:#e7b8ff; --pill:#c9a7ff; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.5; z-index:100; }

.sentence { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:22px 26px; max-width:1500px; font-size:88px; font-weight:600; letter-spacing:-1px; }
.word { display:inline-block; opacity:0; }

/* the iridescent "blob" that fills a blank */
.blob-slot { display:inline-flex; width:150px; height:110px; border-radius:50%; vertical-align:middle; opacity:0;
  background:
    radial-gradient(60% 70% at 40% 40%, #ff9bd0, transparent 70%),
    radial-gradient(60% 70% at 65% 60%, #ffc98a, transparent 70%),
    radial-gradient(70% 70% at 50% 55%, #c9a7ff, transparent 72%),
    radial-gradient(70% 80% at 55% 45%, #9be7c4, transparent 74%);
  filter:blur(6px) saturate(1.2); will-change:transform, filter; }

/* the madlib pill that types a word into itself */
.pill { display:inline-flex; align-items:center; justify-content:center; min-width:90px; height:104px; padding:0 34px;
  border-radius:54px; border:2px dashed rgba(201,167,255,0.6); color:var(--pill); position:relative; opacity:0; }
.pill .ptxt { white-space:nowrap; }
.pill .pcaret { display:inline-block; width:4px; height:62px; background:var(--pill); margin-left:6px; vertical-align:-14px; }

.sparkles { position:absolute; inset:0; z-index:3; pointer-events:none; }
.spark { position:absolute; font-size:30px; color:#fff; opacity:0; filter:drop-shadow(0 0 8px #e7b8ff); }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid var(--accent);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="label"></div>
  <div class="sentence" id="sentence"></div>
  <div class="sparkles" id="sparkles"></div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════ EDIT EVERYTHING HERE ════════════════ */
const CONFIG = {
  label: 'Lego 70 · Madlib Fill-in-the-Blank',
  // tokens build the sentence. types: word | blob (iridescent blank) | pill (types a word in)
  tokens: [
    { type:'word', t:'What if' },
    { type:'blob' },
    { type:'word', t:'had a new' },
    { type:'pill', t:'language' },
    { type:'word', t:'?' }
  ],
  wordStagger: 0.18,    // delay between each word appearing
  pillTypeSpeed: 0.08,  // seconds per character typed into the pill
  colors: { bg:'#0a0a0c', accent:'#e7b8ff', pill:'#c9a7ff' }
};
/* ═══════════════════════════════════════════════════════ */

const C = CONFIG.colors, _r = document.documentElement.style;
_r.setProperty('--bg', C.bg); _r.setProperty('--accent', C.accent); _r.setProperty('--pill', C.pill);
document.getElementById('label').textContent = CONFIG.label;

const sentence = document.getElementById('sentence');
const sparkles = document.getElementById('sparkles');

// build tokens
const built = CONFIG.tokens.map(tok => {
  if (tok.type === 'word') { const e = document.createElement('span'); e.className = 'word'; e.textContent = tok.t; sentence.appendChild(e); return { tok, e }; }
  if (tok.type === 'blob') { const e = document.createElement('span'); e.className = 'blob-slot'; sentence.appendChild(e); return { tok, e }; }
  // pill
  const e = document.createElement('span'); e.className = 'pill';
  e.innerHTML = `<span class="ptxt"></span><span class="pcaret"></span>`;
  sentence.appendChild(e); return { tok, e };
});

function emitSparkles(targetEl, n) {
  const r = targetEl.getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div'); s.className = 'spark'; s.textContent = '✦';
    const x = r.left + Math.random() * r.width, y = r.top + Math.random() * r.height;
    s.style.left = x + 'px'; s.style.top = y + 'px';
    sparkles.appendChild(s);
    gsap.timeline({ onComplete: () => s.remove() })
      .fromTo(s, { opacity: 0, scale: 0, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.3, ease: 'back.out(2)' })
      .to(s, { opacity: 0, scale: 0.4, y: '-=30', duration: 0.6, ease: 'power2.in' });
  }
}

function play() {
  gsap.killTweensOf('*');
  sparkles.innerHTML = '';
  built.forEach(b => {
    if (b.tok.type === 'word') gsap.set(b.e, { opacity: 0, y: 24 });
    if (b.tok.type === 'blob') gsap.set(b.e, { opacity: 0, scale: 0.4 });
    if (b.tok.type === 'pill') { gsap.set(b.e, { opacity: 0, scale: 0.8 }); b.e.querySelector('.ptxt').textContent = ''; gsap.set(b.e.querySelector('.pcaret'), { opacity: 1 }); b.e.style.borderStyle = 'dashed'; }
  });

  const tl = gsap.timeline();
  window.masterTimeline = tl;
  let at = 0.3;

  built.forEach(b => {
    if (b.tok.type === 'word') {
      tl.to(b.e, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, at);
      at += CONFIG.wordStagger;
    } else if (b.tok.type === 'blob') {
      tl.to(b.e, { opacity: 1, scale: 1, duration: 0.7, ease: 'back.out(1.8)' }, at);
      // blob morphs/breathes + spits sparkles
      tl.to(b.e, { scale: 1.08, rotation: 8, duration: 1.6, ease: 'sine.inOut', yoyo: true, repeat: -1 }, at + 0.3);
      tl.add(() => emitSparkles(b.e, 6), at + 0.5);
      at += 0.5;
    } else {
      // pill appears, then types its word, caret blinks, then border goes solid (locks in)
      tl.to(b.e, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.6)' }, at);
      const ptxt = b.e.querySelector('.ptxt'), caret = b.e.querySelector('.pcaret');
      gsap.to(caret, { opacity: 0, duration: 0.4, repeat: -1, yoyo: true, ease: 'steps(1)' });
      const word = b.tok.t, proxy = { n: 0 };
      tl.to(proxy, { n: word.length, duration: word.length * CONFIG.pillTypeSpeed, ease: 'none',
        onUpdate: () => ptxt.textContent = word.slice(0, Math.round(proxy.n)) }, at + 0.4);
      const typedEnd = at + 0.4 + word.length * CONFIG.pillTypeSpeed;
      // lock in: dashed → solid border, caret fades, little sparkle pop
      tl.to(caret, { opacity: 0, duration: 0.2 }, typedEnd + 0.2);
      tl.add(() => { b.e.style.borderStyle = 'solid'; b.e.style.borderColor = 'rgba(201,167,255,0.95)'; emitSparkles(b.e, 5); }, typedEnd + 0.3);
      tl.fromTo(b.e, { boxShadow: '0 0 0 rgba(201,167,255,0)' }, { boxShadow: '0 0 30px rgba(201,167,255,0.5)', duration: 0.5, yoyo: true, repeat: 1 }, typedEnd + 0.3);
      at = typedEnd + 0.6;
    }
  });

  tl.to({}, { duration: 1.6 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
