<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>16 – Node/Workflow Activation Effects</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#0D0D0D; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; position:relative; overflow:hidden; }

.label {
  position:absolute; top:32px; left:32px; font-size:13px; color:#00AA45; letter-spacing:2px;
  text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4; z-index:50;
}

/* Grid background */
.grid-bg {
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(0,170,69,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,170,69,0.04) 1px, transparent 1px);
  background-size:60px 60px;
}

/* Node container */
#nodeCanvas {
  position:absolute; inset:0;
}

/* SVG for connection lines */
#lineSvg {
  position:absolute; inset:0; width:100%; height:100%; overflow:visible;
}

/* Node base styles */
.node {
  position:absolute; border-radius:12px;
  background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  will-change:transform,filter;
  cursor:default;
}
.node-icon { font-size:28px; margin-bottom:8px; }
.node-label { font-size:13px; font-weight:600; color:rgba(255,255,255,0.7); }
.node-type { font-size:10px; font-family:'Courier New',monospace; color:rgba(255,255,255,0.3); letter-spacing:1px; margin-top:3px; }

/* Active node glow */
.node.active {
  background:rgba(0,170,69,0.1);
  border-color:rgba(0,170,69,0.6);
  box-shadow: 0 0 30px rgba(0,170,69,0.25), 0 0 60px rgba(0,170,69,0.1);
}

/* Pulse ring */
.pulse-ring {
  position:absolute; border-radius:50%; border:2px solid #00AA45;
  opacity:0; transform:scale(0); pointer-events:none; will-change:transform,opacity;
}

/* Data packet that travels along paths */
.packet {
  position:absolute; width:10px; height:10px; border-radius:50%;
  background:#00AA45; box-shadow:0 0 12px rgba(0,170,69,0.8);
  opacity:0; pointer-events:none; will-change:transform,opacity;
}

/* Status badge on node */
.node-status {
  position:absolute; bottom:8px; right:10px;
  font-size:10px; font-family:'Courier New',monospace;
  color:rgba(255,255,255,0.25); letter-spacing:1px;
}
.node.active .node-status { color:#00AA45; }

/* Step output log at bottom */
.exec-log {
  position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.8); border:1px solid rgba(0,170,69,0.2);
  border-radius:10px; padding:14px 28px; font-family:'Courier New',monospace;
  font-size:13px; color:rgba(255,255,255,0.3); display:flex; gap:30px;
  backdrop-filter:blur(10px);
}
.log-stat { text-align:center; }
.log-val { font-size:20px; font-weight:700; color:#00AA45; }
.log-key { font-size:10px; letter-spacing:1px; margin-top:2px; }

#replayBtn {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(0,170,69,0.4);
  background:rgba(0,0,0,0.7); color:#00AA45; cursor:pointer; font-size:13px;
  font-family:monospace; backdrop-filter:blur(10px);
}
</style>
</head>
<body>
<div class="vp">
  <div class="label">Lego 16 · Node/Workflow Activation Effects</div>
  <div class="grid-bg"></div>

  <!-- Ambient radial -->
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%, rgba(0,170,69,0.05) 0%, transparent 60%);"></div>

  <div id="nodeCanvas">
    <!-- SVG lines layer -->
    <svg id="lineSvg">
      <defs>
        <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
          <polygon points="0 0, 6 2, 0 4" fill="rgba(0,170,69,0.5)"/>
        </marker>
        <!-- Glow filter for active lines -->
        <filter id="lineGlow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- Lines drawn by JS -->
    </svg>

    <!-- Node: Trigger -->
    <div class="node" id="nTrigger" style="width:160px;height:110px;top:460px;left:120px;">
      <div class="node-icon">⚡</div>
      <div class="node-label">Trigger</div>
      <div class="node-type">WEBHOOK</div>
      <div class="node-status" id="stTrigger">IDLE</div>
    </div>

    <!-- Node: Parse -->
    <div class="node" id="nParse" style="width:160px;height:110px;top:340px;left:420px;">
      <div class="node-icon">⬡</div>
      <div class="node-label">Parse</div>
      <div class="node-type">JSON PARSER</div>
      <div class="node-status" id="stParse">IDLE</div>
    </div>

    <!-- Node: Filter -->
    <div class="node" id="nFilter" style="width:160px;height:110px;top:580px;left:420px;">
      <div class="node-icon">▽</div>
      <div class="node-label">Filter</div>
      <div class="node-type">CONDITION</div>
      <div class="node-status" id="stFilter">IDLE</div>
    </div>

    <!-- Node: Transform -->
    <div class="node" id="nTransform" style="width:160px;height:110px;top:460px;left:720px;">
      <div class="node-icon">⇄</div>
      <div class="node-label">Transform</div>
      <div class="node-type">MAP + ENRICH</div>
      <div class="node-status" id="stTransform">IDLE</div>
    </div>

    <!-- Node: AI Analyze -->
    <div class="node" id="nAI" style="width:160px;height:110px;top:460px;left:1020px;">
      <div class="node-icon">◉</div>
      <div class="node-label">AI Analyze</div>
      <div class="node-type">INFERENCE</div>
      <div class="node-status" id="stAI">IDLE</div>
    </div>

    <!-- Node: Slack -->
    <div class="node" id="nSlack" style="width:160px;height:110px;top:320px;left:1330px;">
      <div class="node-icon">💬</div>
      <div class="node-label">Notify</div>
      <div class="node-type">SLACK</div>
      <div class="node-status" id="stSlack">IDLE</div>
    </div>

    <!-- Node: Database -->
    <div class="node" id="nDB" style="width:160px;height:110px;top:600px;left:1330px;">
      <div class="node-icon">🗄</div>
      <div class="node-label">Store</div>
      <div class="node-type">POSTGRES</div>
      <div class="node-status" id="stDB">IDLE</div>
    </div>

    <!-- Pulse rings (centered on each node, positioned in JS) -->
    <div class="pulse-ring" id="prTrigger" style="width:80px;height:80px;top:495px;left:160px;margin-left:-40px;margin-top:-40px;"></div>

    <!-- Data packets -->
    <div class="packet" id="pkt1"></div>
    <div class="packet" id="pkt2"></div>
    <div class="packet" id="pkt3"></div>
    <div class="packet" id="pkt4"></div>
    <div class="packet" id="pkt5"></div>

    <!-- Execution log -->
    <div class="exec-log" id="execLog" style="opacity:0;">
      <div class="log-stat"><div class="log-val" id="logRecords">0</div><div class="log-key">RECORDS</div></div>
      <div class="log-stat"><div class="log-val" id="logNodes">0</div><div class="log-key">NODES FIRED</div></div>
      <div class="log-stat"><div class="log-val" id="logMs">0ms</div><div class="log-key">LATENCY</div></div>
    </div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
// Node center positions for line drawing and packet animation
const nodes = {
  nTrigger:   { cx: 200, cy: 515 },
  nParse:     { cx: 500, cy: 395 },
  nFilter:    { cx: 500, cy: 635 },
  nTransform: { cx: 800, cy: 515 },
  nAI:        { cx: 1100, cy: 515 },
  nSlack:     { cx: 1410, cy: 375 },
  nDB:        { cx: 1410, cy: 655 },
};

const connections = [
  ['nTrigger',   'nParse'],
  ['nTrigger',   'nFilter'],
  ['nParse',     'nTransform'],
  ['nFilter',    'nTransform'],
  ['nTransform', 'nAI'],
  ['nAI',        'nSlack'],
  ['nAI',        'nDB'],
];

// Draw static connection lines
const svg = document.getElementById('lineSvg');
const lineEls = {};

connections.forEach(([a, b]) => {
  const { cx: x1, cy: y1 } = nodes[a];
  const { cx: x2, cy: y2 } = nodes[b];
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  line.setAttribute('stroke', 'rgba(255,255,255,0.07)');
  line.setAttribute('stroke-width', '2');
  line.setAttribute('marker-end', 'url(#arrowhead)');
  svg.appendChild(line);

  const glowLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  glowLine.setAttribute('x1', x1); glowLine.setAttribute('y1', y1);
  glowLine.setAttribute('x2', x2); glowLine.setAttribute('y2', y2);
  glowLine.setAttribute('stroke', '#00AA45');
  glowLine.setAttribute('stroke-width', '2');
  glowLine.setAttribute('opacity', '0');
  glowLine.setAttribute('filter', 'url(#lineGlow)');
  svg.appendChild(glowLine);
  lineEls[`${a}-${b}`] = glowLine;
});

// Animate a packet along a connection
function animatePacket(pktId, fromKey, toKey, delay, tl) {
  const pkt = document.getElementById(pktId);
  const from = nodes[fromKey];
  const to = nodes[toKey];
  const key = `${fromKey}-${toKey}`;
  const glowLine = lineEls[key];

  tl.set(pkt, { opacity:1, x: from.cx - 5, y: from.cy - 5 }, delay);
  tl.to(pkt, { x: to.cx - 5, y: to.cy - 5, duration: 0.6, ease: 'power2.inOut' }, delay);
  tl.to(pkt, { opacity:0, duration:0.2 }, delay + 0.5);

  // Light up the line
  if (glowLine) {
    tl.to(glowLine, { opacity:1, duration:0.2 }, delay);
    tl.to(glowLine, { opacity:0, duration:0.5 }, delay + 0.5);
  }
}

function activateNode(nodeId, statusId, tl, t) {
  tl.call(() => {
    document.getElementById(nodeId).classList.add('active');
    document.getElementById(statusId).textContent = 'ACTIVE';
  }, [], t);
  // Pulse ring
  const prId = 'pr' + nodeId.replace('n', '').toUpperCase();
  // Short glow out
  tl.call(() => {
    document.getElementById(nodeId).style.boxShadow = '0 0 40px rgba(0,170,69,0.4), 0 0 80px rgba(0,170,69,0.15)';
  }, [], t + 0.05);
  tl.call(() => {
    document.getElementById(statusId).textContent = 'DONE';
    setTimeout(() => {
      document.getElementById(nodeId).classList.remove('active');
      document.getElementById(nodeId).style.boxShadow = '';
    }, 400);
  }, [], t + 0.8);
}

function play() {
  gsap.killTweensOf('*');

  // Reset
  document.querySelectorAll('.node').forEach(n => {
    n.classList.remove('active');
    n.style.boxShadow = '';
  });
  document.querySelectorAll('.node-status').forEach(s => s.textContent = 'IDLE');
  Object.values(lineEls).forEach(l => l.setAttribute('opacity', '0'));
  gsap.set('.packet', { opacity:0 });
  gsap.set('#execLog', { opacity:0 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // 0s: Trigger fires
  activateNode('nTrigger', 'stTrigger', tl, 0.3);

  // 0.8s: fork to Parse & Filter
  animatePacket('pkt1', 'nTrigger', 'nParse', 0.8, tl);
  animatePacket('pkt2', 'nTrigger', 'nFilter', 0.9, tl);
  activateNode('nParse', 'stParse', tl, 1.3);
  activateNode('nFilter', 'stFilter', tl, 1.4);

  // 2.0s: both merge into Transform
  animatePacket('pkt3', 'nParse', 'nTransform', 2.0, tl);
  activateNode('nTransform', 'stTransform', tl, 2.4);

  // 3.0s: Transform → AI
  animatePacket('pkt4', 'nTransform', 'nAI', 3.0, tl);
  activateNode('nAI', 'stAI', tl, 3.4);

  // 4.0s: AI forks to Slack + DB
  animatePacket('pkt5', 'nAI', 'nSlack', 4.0, tl);
  activateNode('nSlack', 'stSlack', tl, 4.4);
  tl.call(() => {
    const pkt = document.getElementById('pkt1');
    gsap.set(pkt, { opacity:1, x: nodes.nAI.cx - 5, y: nodes.nAI.cy - 5 });
    gsap.to(pkt, { x: nodes.nDB.cx - 5, y: nodes.nDB.cy - 5, duration:0.6, ease:'power2.inOut' });
    setTimeout(() => gsap.to(pkt, { opacity:0, duration:0.2 }), 500);
    const gl = lineEls['nAI-nDB'];
    if (gl) { gsap.to(gl, { opacity:1, duration:0.2 }); setTimeout(() => gsap.to(gl, { opacity:0, duration:0.5 }), 500); }
  }, [], 4.1);
  activateNode('nDB', 'stDB', tl, 4.5);

  // Execution log counter
  tl.to('#execLog', { opacity:1, duration:0.5 }, 5.0);
  const rec = { val:0 }, nd = { val:0 }, ms = { val:0 };
  tl.to(rec, { val:8412, duration:1.2, ease:'power2.out', onUpdate: () => { document.getElementById('logRecords').textContent = Math.round(rec.val).toLocaleString(); } }, 5.2);
  tl.to(nd, { val:7, duration:1.0, ease:'power2.out', onUpdate: () => { document.getElementById('logNodes').textContent = Math.round(nd.val); } }, 5.2);
  tl.to(ms, { val:24, duration:1.0, ease:'power2.out', onUpdate: () => { document.getElementById('logMs').textContent = Math.round(ms.val) + 'ms'; } }, 5.2);
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
