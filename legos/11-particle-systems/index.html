<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>11 – Particle Systems</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#0D0D0D; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; }

.label {
  position:absolute; top:32px; left:32px; font-size:13px; color:#00AA45; letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4; z-index:100;
}

#particleCanvas { position:absolute; inset:0; }

/* Central node system */
.node-system {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  pointer-events:none; z-index:10;
}
.center-node {
  width:80px; height:80px; border-radius:50%;
  background: radial-gradient(circle at 30% 30%, #00e855, #00AA45, #006b2b);
  box-shadow: 0 0 40px 16px rgba(0,170,69,0.3);
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
}
.orbit-ring {
  position:absolute; border-radius:50%;
  border:1px solid rgba(0,170,69,0.12);
  top:50%; left:50%; transform:translate(-50%,-50%);
}
.orbit-node {
  position:absolute; width:12px; height:12px; border-radius:50%;
  background:#00AA45;
  box-shadow: 0 0 12px 4px rgba(0,170,69,0.4);
}

/* Data packet lines */
.data-stream {
  position:absolute; height:2px; background:rgba(0,170,69,0.15);
  transform-origin:left center;
  pointer-events:none;
}

#replayBtn {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(0,170,69,0.4);
  background:rgba(0,0,0,0.7); color:#00AA45; cursor:pointer; font-size:13px;
  font-family:monospace; backdrop-filter:blur(10px);
}
</style>
</head>
<body>
<div class="vp">
  <div class="label">Lego 11 · Particle Systems</div>

  <canvas id="particleCanvas"></canvas>

  <!-- Orbit system -->
  <div class="node-system" id="nodeSystem">
    <div class="center-node" id="centerNode"></div>

    <!-- Orbits are positioned via JS -->
    <div id="orbitContainer"></div>

    <!-- Data packets -->
    <div id="packetContainer"></div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
// ── Background particle system ──
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 1920; canvas.height = 1080;

const W = 1920, H = 1080;
const particles = [];
for (let i = 0; i < 120; i++) {
  particles.push({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.6,
    vy: (Math.random() - 0.5) * 0.6,
    r: Math.random() * 2 + 0.5,
    baseA: Math.random() * 0.3 + 0.05,
    phase: Math.random() * Math.PI * 2
  });
}

let bgTime = 0;
function drawParticles() {
  bgTime += 0.016;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0D0D0D';
  ctx.fillRect(0, 0, W, H);

  // Draw particles
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    const pulse = Math.sin(bgTime * 1.5 + p.phase) * 0.4 + 0.6;
    const alpha = p.baseA * pulse;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,170,69,${alpha})`;
    ctx.fill();
  });

  // Draw connections between nearby particles
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 160) {
        const a = (1 - dist / 160) * 0.08;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(0,170,69,${a})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(drawParticles);
}
drawParticles();

// ── Build orbit system ──
const orbitContainer = document.getElementById('orbitContainer');
const packetContainer = document.getElementById('packetContainer');
const orbitConfigs = [
  { radius: 160, nodes: 6, speed: 0.5 },
  { radius: 280, nodes: 10, speed: -0.3 },
  { radius: 400, nodes: 14, speed: 0.2 },
];

orbitConfigs.forEach((cfg, oi) => {
  const ring = document.createElement('div');
  ring.className = 'orbit-ring';
  ring.style.width = ring.style.height = cfg.radius * 2 + 'px';
  orbitContainer.appendChild(ring);

  for (let i = 0; i < cfg.nodes; i++) {
    const angle = (i / cfg.nodes) * Math.PI * 2;
    const x = cfg.radius * Math.cos(angle);
    const y = cfg.radius * Math.sin(angle);
    const node = document.createElement('div');
    node.className = 'orbit-node';
    node.dataset.orbit = oi;
    node.dataset.index = i;
    node.dataset.angle = angle;
    node.dataset.radius = cfg.radius;
    node.dataset.speed = cfg.speed;
    node.style.transform = `translate(${x - 6}px, ${y - 6}px)`;
    node.style.opacity = '0';
    orbitContainer.appendChild(node);
  }
});

function play() {
  gsap.killTweensOf('*');

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // ── Phase 1: Center node pulse (0–1.5s) ──
  tl.from('#centerNode', { scale: 0, opacity: 0, duration: 1.2, ease: 'elastic.out(1,0.5)' }, 0);
  tl.to('#centerNode', {
    boxShadow: '0 0 60px 24px rgba(0,170,69,0.4)',
    duration: 1.5, ease: 'sine.inOut', yoyo: true, repeat: 1
  }, 0.8);

  // ── Phase 2: Orbit nodes appear (1.5–3s) ──
  const orbitNodes = document.querySelectorAll('.orbit-node');
  tl.to(orbitNodes, {
    opacity: 1, scale: 1, duration: 0.5,
    stagger: { each: 0.05, from: 'random' },
    ease: 'back.out(2)'
  }, 1.2);

  // ── Phase 3: Continuous orbit rotation via onUpdate ──
  // We'll animate a proxy object and move nodes
  const orbits = [{ angle: 0 }, { angle: 0 }, { angle: 0 }];
  orbitConfigs.forEach((cfg, oi) => {
    tl.to(orbits[oi], {
      angle: Math.PI * 2 * (cfg.speed > 0 ? 1 : -1),
      duration: Math.abs(1 / cfg.speed) * 1.5,
      ease: 'none',
      modifiers: {
        angle: (val) => {
          const v = parseFloat(val);
          const nodes = orbitContainer.querySelectorAll(`.orbit-node[data-orbit="${oi}"]`);
          nodes.forEach((n, i) => {
            const baseAngle = parseFloat(n.dataset.angle);
            const r = parseFloat(n.dataset.radius);
            const angle = baseAngle + v;
            const x = r * Math.cos(angle);
            const y = r * Math.sin(angle);
            n.style.transform = `translate(${x - 6}px, ${y - 6}px)`;
          });
          return val;
        }
      }
    }, 1.5);
  });

  // ── Phase 4: Data streams emanate (3–5s) ──
  const streamAngles = [0.2, 0.8, 1.4, 2.2, -0.5, -1.2];
  streamAngles.forEach((angle, i) => {
    const stream = document.createElement('div');
    stream.className = 'data-stream';
    const len = 350 + Math.random() * 200;
    const xOff = 80 * Math.cos(angle);
    const yOff = 80 * Math.sin(angle);
    stream.style.width = '0px';
    stream.style.top = `calc(50% + ${yOff}px)`;
    stream.style.left = `calc(50% + ${xOff}px)`;
    stream.style.transform = `rotate(${angle * 180 / Math.PI}deg)`;
    stream.style.background = `linear-gradient(90deg, rgba(0,170,69,0.4), rgba(0,170,69,0.02))`;
    document.getElementById('nodeSystem').appendChild(stream);

    tl.to(stream, { width: len + 'px', duration: 0.8, ease: 'power2.out' }, 2.8 + i * 0.1);
    tl.to(stream, { opacity: 0, duration: 0.5 }, 4.0 + i * 0.05);

    // Destroy after animation
    tl.call(() => { if (stream.parentNode) stream.remove(); }, [], '+=0');
  });

  tl.to({}, { duration: 1 }, 5);
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
