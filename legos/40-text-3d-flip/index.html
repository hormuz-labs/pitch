<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>40 – 3D Flip Text</title>
<style>
:root { --accent:#00AA45; --accent-rgb:0,170,69; --accent-2:#00e855; --accent-2-rgb:0,232,85; --bg:#0D0D0D; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:70px; perspective:1400px; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4; z-index:100; }
.block-title { font-family:'Courier New',monospace; font-size:16px; letter-spacing:6px; color:rgba(255,255,255,0.3); text-transform:uppercase; text-align:center; margin-bottom:22px; }

.flip-text { font-size:104px; font-weight:900; letter-spacing:-1px; text-align:center; white-space:nowrap; transform-style:preserve-3d; }
.flip-text .ch { display:inline-block; transform-style:preserve-3d; backface-visibility:hidden; will-change:transform; }
.flip-text .accent { color:var(--accent); }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(var(--accent-rgb),0.4);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="cfgLabel">Lego 40 · 3D Flip Text</div>

  <div>
    <div class="block-title">Flip Down (rotateX)</div>
    <div class="flip-text" id="flipX"></div>
  </div>
  <div>
    <div class="block-title">Card Turn (rotateY)</div>
    <div class="flip-text" id="flipY"></div>
  </div>
  <div>
    <div class="block-title">Tumble (rotateX + Z)</div>
    <div class="flip-text" id="tumble"></div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
function buildChars(el, text, accentRanges = []) {
  el.innerHTML = '';
  const out = [];
  [...text].forEach((c, i) => {
    const s = document.createElement('span');
    s.className = 'ch';
    if (accentRanges.some(([a, b]) => i >= a && i < b)) s.classList.add('accent');
    s.textContent = c === ' ' ? ' ' : c;
    el.appendChild(s);
    out.push(s);
  });
  return out;
}

const flipX  = buildChars(document.getElementById('flipX'), 'PEERLIST', [[0, 4]]);
const flipY  = buildChars(document.getElementById('flipY'), 'SHIP DAILY', [[5, 10]]);
const tumble = buildChars(document.getElementById('tumble'), 'GET HIRED', [[4, 9]]);

function play() {
  gsap.killTweensOf('*');
  gsap.set(flipX,  { rotateX: -110, opacity: 0, transformOrigin: '50% 0%' });
  gsap.set(flipY,  { rotateY: 100, opacity: 0, transformOrigin: '0% 50%' });
  gsap.set(tumble, { rotateX: 130, rotationZ: -25, opacity: 0, y: -40 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  tl.to(flipX, { rotateX: 0, opacity: 1, duration: 0.9, ease: 'back.out(1.7)', stagger: 0.06 }, 0.3);
  tl.to(flipY, { rotateY: 0, opacity: 1, duration: 0.9, ease: 'back.out(1.4)', stagger: 0.05 }, 1.1);
  tl.to(tumble, { rotateX: 0, rotationZ: 0, y: 0, opacity: 1, duration: 1.0, ease: 'back.out(1.6)', stagger: 0.06 }, 1.9);

  tl.to({}, { duration: 1.6 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>

<script>
/* ════════ EDIT COLORS / LABEL HERE — applies live via CSS variables ════════ */
const CONFIG = {
  label: "Lego 40 · 3D Flip Text",
  colors: {
    accent:     '#00AA45',   // primary brand accent
    accentRgb:  '0,170,69',  // same accent, for rgba() glows/shadows
    accent2:    '#00e855',   // secondary / brighter accent (used by some scenes)
    accent2Rgb: '0,232,85',
    bg:         '#0D0D0D'    // page background
  }
};
/* ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  var c = CONFIG.colors, r = document.documentElement.style;
  r.setProperty('--accent', c.accent);       r.setProperty('--accent-rgb', c.accentRgb);
  r.setProperty('--accent-2', c.accent2);     r.setProperty('--accent-2-rgb', c.accent2Rgb);
  r.setProperty('--bg', c.bg);
  var lab = document.getElementById('cfgLabel'); if (lab) lab.textContent = CONFIG.label;
})();
</script>
</body>
</html>
