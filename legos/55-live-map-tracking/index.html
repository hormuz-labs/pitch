<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>55 – Live Map Tracking</title>
<style>
:root { --bg:#0c0a1a; --bg-deep:#0a0612; --accent:#a78bfa; --accent-2:#7c3aed; --grid:rgba(124,58,237,0.06); --route-glow:rgba(124,58,237,0.7); }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg-deep); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; background:var(--bg); }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.5; z-index:100; }

.map { position:absolute; inset:0; z-index:0;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    radial-gradient(ellipse at 50% 45%, #1a1233 0%, var(--bg) 70%);
  background-size:80px 80px, 80px 80px, 100% 100%; }
.blocks { position:absolute; inset:0; z-index:1; opacity:0.5; }
.block { position:absolute; border-radius:6px; background:rgba(167,139,250,0.05); border:1px solid rgba(167,139,250,0.08); }

.mapsvg { position:absolute; inset:0; z-index:2; }
.route { fill:none; stroke:var(--accent-2); stroke-width:6; stroke-linecap:round; filter:drop-shadow(0 0 10px var(--route-glow)); }
.route-bg { fill:none; stroke:rgba(124,58,237,0.18); stroke-width:6; stroke-linecap:round; }

.radar { position:absolute; z-index:3; width:40px; height:40px; }
.radar .ring { position:absolute; inset:0; border-radius:50%; border:2px solid var(--accent); }
.radar .core { position:absolute; inset:14px; border-radius:50%; background:var(--accent); box-shadow:0 0 16px var(--accent); }

.truck { position:absolute; z-index:5; width:54px; height:54px; margin:-27px 0 0 -27px;
  display:flex; align-items:center; justify-content:center; font-size:30px;
  background:#fff; border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,0.5); }

.infocard { position:absolute; z-index:6; min-width:230px; padding:16px 18px; border-radius:14px;
  background:rgba(20,14,38,0.85); border:1px solid rgba(167,139,250,0.3); backdrop-filter:blur(14px);
  box-shadow:0 16px 40px rgba(0,0,0,0.5); opacity:0; }
.infocard .t { font-size:12px; color:var(--accent); text-transform:uppercase; letter-spacing:1px; }
.infocard .v { font-size:22px; font-weight:700; margin-top:6px; }
.infocard .s { font-size:13px; color:rgba(255,255,255,0.5); margin-top:4px; }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid var(--accent);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="label"></div>
  <div class="map"></div>
  <div class="blocks" id="blocks"></div>

  <svg class="mapsvg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
    <path class="route-bg" id="routeBg" d="M 300 820 C 560 820 560 520 820 520 S 1120 300 1380 300 S 1680 360 1680 360"/>
    <path class="route" id="route" d="M 300 820 C 560 820 560 520 820 520 S 1120 300 1380 300 S 1680 360 1680 360" pathLength="1"/>
  </svg>

  <div class="radar" id="radar" style="left:1660px; top:340px;">
    <div class="ring" id="ring1"></div><div class="ring" id="ring2"></div><div class="core"></div>
  </div>

  <div class="truck" id="truck"></div>

  <div class="infocard" id="card1" style="left:360px; top:640px;">
    <div class="t" id="c1t"></div><div class="v" id="c1v"></div><div class="s" id="c1s"></div>
  </div>
  <div class="infocard" id="card2" style="left:1380px; top:150px;">
    <div class="t" id="c2t"></div><div class="v" id="c2v"></div><div class="s" id="c2s"></div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════ EDIT EVERYTHING HERE ════════════════ */
const CONFIG = {
  label: 'Lego 55 · Live Map Tracking',
  truckIcon: '🚛',
  card1: { t: 'Driver · Route 7', v: 'M. Alvarez', s: '12 bins · on schedule' },
  card2: { t: 'Destination', v: 'Sector 4 Depot', s: 'ETA 09:42 · 3.2 km' },
  colors: { bg:'#0c0a1a', bgDeep:'#0a0612', accent:'#a78bfa', accent2:'#7c3aed',
            grid:'rgba(124,58,237,0.06)', routeGlow:'rgba(124,58,237,0.7)' }
};
/* ═══════════════════════════════════════════════════════ */

const C = CONFIG.colors, _r = document.documentElement.style;
_r.setProperty('--bg', C.bg); _r.setProperty('--bg-deep', C.bgDeep);
_r.setProperty('--accent', C.accent); _r.setProperty('--accent-2', C.accent2);
_r.setProperty('--grid', C.grid); _r.setProperty('--route-glow', C.routeGlow);
document.getElementById('label').textContent = CONFIG.label;
document.getElementById('truck').textContent = CONFIG.truckIcon;
document.getElementById('c1t').textContent = CONFIG.card1.t; document.getElementById('c1v').textContent = CONFIG.card1.v; document.getElementById('c1s').textContent = CONFIG.card1.s;
document.getElementById('c2t').textContent = CONFIG.card2.t; document.getElementById('c2v').textContent = CONFIG.card2.v; document.getElementById('c2s').textContent = CONFIG.card2.s;

const blocks = document.getElementById('blocks');
for (let i = 0; i < 26; i++) {
  const b = document.createElement('div'); b.className = 'block';
  const w = 60 + Math.random() * 140, h = 60 + Math.random() * 120;
  // clamp so decorative blocks never exceed the frame
  const left = Math.min(80 + Math.random() * 1700, 1920 - w);
  const top = Math.min(80 + Math.random() * 900, 1080 - h);
  b.style.width = w + 'px'; b.style.height = h + 'px'; b.style.left = left + 'px'; b.style.top = top + 'px';
  blocks.appendChild(b);
}

const route = document.getElementById('route');
const truck = document.getElementById('truck');
const len = route.getTotalLength();

function play() {
  gsap.killTweensOf('*');
  gsap.set('#route', { strokeDasharray: 1, strokeDashoffset: 1 });
  gsap.set(['#card1', '#card2'], { opacity: 0, y: 16, scale: 0.92 });
  gsap.set(['#ring1', '#ring2'], { scale: 0.4, opacity: 0 });
  const p0 = route.getPointAtLength(0);
  gsap.set(truck, { left: p0.x, top: p0.y, opacity: 0 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;
  gsap.to('#ring1', { scale: 2.6, opacity: 0, duration: 1.6, ease: 'power1.out', repeat: -1 });
  gsap.to('#ring2', { scale: 2.6, opacity: 0, duration: 1.6, ease: 'power1.out', repeat: -1, delay: 0.8 });

  tl.to('#route', { strokeDashoffset: 0, duration: 2.2, ease: 'power2.inOut' }, 0.3);
  tl.to(truck, { opacity: 1, duration: 0.3 }, 0.5);
  const prog = { p: 0 };
  tl.to(prog, { p: 1, duration: 3.4, ease: 'power1.inOut',
    onUpdate: () => {
      const pt = route.getPointAtLength(prog.p * len);
      const ahead = route.getPointAtLength(Math.min(len, prog.p * len + 4));
      const ang = Math.atan2(ahead.y - pt.y, ahead.x - pt.x) * 180 / Math.PI;
      gsap.set(truck, { left: pt.x, top: pt.y, rotation: ang * 0.15 });
    } }, 0.6);
  tl.to('#card1', { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: 'back.out(1.6)' }, 1.0);
  tl.to('#card2', { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: 'back.out(1.6)' }, 2.4);
  tl.to({}, { duration: 1.6 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
