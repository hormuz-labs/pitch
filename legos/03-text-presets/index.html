<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>03 – Dynamic Text Presets</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#0D0D0D; font-family: 'Courier New', Consolas, monospace; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:60px; }

.demo-block { text-align:center; }
.demo-label { font-size:11px; color:#00AA45; letter-spacing:3px; text-transform:uppercase; margin-bottom:16px; opacity:0.5; }

/* Typewriter */
.terminal-window {
  width: 800px; background:rgba(0,0,0,0.6); border:1px solid rgba(0,170,69,0.2);
  border-radius:12px; padding:24px 28px; text-align:left;
}
.terminal-bar {
  display:flex; gap:8px; margin-bottom:20px;
}
.terminal-dot { width:12px; height:12px; border-radius:50%; }
.terminal-dot:nth-child(1) { background:#FF5F56; }
.terminal-dot:nth-child(2) { background:#FFBD2E; }
.terminal-dot:nth-child(3) { background:#27C93F; }
.terminal-line {
  font-size:18px; color:rgba(255,255,255,0.7); line-height:1.8;
  min-height: 32px;
}
.terminal-line .prompt { color:#00AA45; }
.terminal-line .cursor {
  display:inline-block; width:10px; height:24px; background:#00AA45;
  vertical-align:text-bottom; margin-left:4px;
}
.terminal-line .output { color:rgba(255,255,255,0.9); }

/* Blur reveal */
.blur-text {
  font-size:72px; font-weight:800; letter-spacing:-1px;
  filter:blur(20px); opacity:0;
}

/* Tracking text */
.track-container { overflow:hidden; }
.track-text {
  font-size:52px; font-weight:700; letter-spacing:50px;
  text-transform:uppercase; opacity:0;
}
.track-text .accent { color:#00AA45; }

.label {
  position:absolute; top:32px; left:32px; font-size:13px; color:#00AA45; letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4;
}

#replayBtn {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(0,170,69,0.4);
  background:rgba(0,0,0,0.7); color:#00AA45; cursor:pointer; font-size:13px;
  font-family:monospace; backdrop-filter:blur(10px);
}
</style>
</head>
<body>
<div class="vp">
  <div class="label">Lego 03 · Dynamic Text Presets</div>

  <!-- Typewriter -->
  <div class="demo-block">
    <div class="demo-label">Typewriter Effect</div>
    <div class="terminal-window">
      <div class="terminal-bar">
        <div class="terminal-dot"></div>
        <div class="terminal-dot"></div>
        <div class="terminal-dot"></div>
      </div>
      <div class="terminal-line" id="typewriterLine">
        <span class="prompt">$ </span>
        <span id="typewriterText"></span>
        <span class="cursor" id="cursor"></span>
      </div>
      <div class="terminal-line" id="typewriterOutput" style="opacity:0;">
        <span class="output">✔ Build complete. 0 errors. 0 warnings.</span>
      </div>
    </div>
  </div>

  <!-- Blur reveal -->
  <div class="demo-block">
    <div class="demo-label">Blur Reveal</div>
    <div class="blur-text" id="blurText">SHIP FASTER. BUILD BOLDER.</div>
  </div>

  <!-- Tracking -->
  <div class="demo-block">
    <div class="demo-label">Letter Tracking</div>
    <div class="track-container">
      <div class="track-text" id="trackText"><span class="accent">PEER</span>LIST</div>
    </div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const typewriterText = document.getElementById('typewriterText');
const cursor = document.getElementById('cursor');
const output = document.getElementById('typewriterOutput');
const blurText = document.getElementById('blurText');
const trackText = document.getElementById('trackText');

const code = 'npm create peerlist-app@latest';

function play() {
  gsap.killTweensOf('*');
  // Reset
  typewriterText.textContent = '';
  gsap.set(output, { opacity: 0 });
  gsap.set(blurText, { opacity: 0, filter: 'blur(20px)' });
  gsap.set(trackText, { opacity: 0, letterSpacing: '50px' });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // ── Typewriter: type each char ──
  const chars = code.split('');
  let idx = 0;
  tl.to({}, {
    duration: 0.04,
    repeat: chars.length - 1,
    onRepeat: () => {
      typewriterText.textContent += chars[idx];
      idx++;
    }
  }, 0.3);

  // Cursor blink
  tl.to(cursor, { opacity: 0, duration: 0.08, repeat: 1, yoyo: true }, 0.3);
  tl.to(cursor, { opacity: 0, duration: 0.2, repeat: 5, yoyo: true }, 0.3 + chars.length * 0.04);
  tl.to(cursor, { opacity: 0, duration: 0.15 }, '+=0.3');

  // Show output
  tl.to(output, { opacity: 1, duration: 0.5 }, '+=0.2');

  // ── Blur reveal ──
  tl.to(blurText, {
    opacity: 1, filter: 'blur(0px)', duration: 1.8, ease: 'power3.out'
  }, 2.5);

  // ── Tracking close-up ──
  tl.to(trackText, {
    opacity: 1, letterSpacing: '6px', duration: 1.6, ease: 'power4.out'
  }, 4.5);

  tl.to({}, { duration: 1.5 }, 6);
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
