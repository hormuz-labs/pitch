<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>39 – Elastic & Wave Text</title>
<style>
:root { --accent:#00AA45; --accent-rgb:0,170,69; --accent-2:#00e855; --accent-2-rgb:0,232,85; --bg:#0D0D0D; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:70px; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4; z-index:100; }
.block-title { font-family:'Courier New',monospace; font-size:16px; letter-spacing:6px; color:rgba(255,255,255,0.3); text-transform:uppercase; text-align:center; margin-bottom:22px; }

.stage-text { font-size:96px; font-weight:900; letter-spacing:-1px; text-align:center; white-space:nowrap; }
.stage-text .ch { display:inline-block; will-change:transform; }
.stage-text .accent { color:var(--accent); }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(var(--accent-rgb),0.4);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="cfgLabel">Lego 39 · Elastic & Wave Text</div>

  <div>
    <div class="block-title">Elastic Drop-In</div>
    <div class="stage-text" id="elastic"></div>
  </div>
  <div>
    <div class="block-title">Continuous Wave</div>
    <div class="stage-text" id="wave"></div>
  </div>
  <div>
    <div class="block-title">Bounce Pop</div>
    <div class="stage-text" id="bounce"></div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
function buildChars(el, text, accentRanges = []) {
  el.innerHTML = '';
  const out = [];
  [...text].forEach((c, i) => {
    const s = document.createElement('span');
    s.className = 'ch';
    if (accentRanges.some(([a, b]) => i >= a && i < b)) s.classList.add('accent');
    s.textContent = c === ' ' ? ' ' : c;
    el.appendChild(s);
    out.push(s);
  });
  return out;
}

const elastic = buildChars(document.getElementById('elastic'), 'BUILD IN PUBLIC', [[6, 15]]);
const wave    = buildChars(document.getElementById('wave'), 'PEERLIST', [[0, 4]]);
const bounce  = buildChars(document.getElementById('bounce'), 'SHIP IT FAST', [[8, 12]]);

let waveLoop;

function play() {
  gsap.killTweensOf('*');
  if (waveLoop) waveLoop.kill();
  gsap.set(elastic, { y: -160, opacity: 0, scaleY: 1.6 });
  gsap.set(wave, { y: 0 });
  gsap.set(bounce, { scale: 0, opacity: 0 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // Elastic drop: each letter falls and springs, squash settles
  tl.to(elastic, {
    y: 0, opacity: 1, scaleY: 1, duration: 1.3,
    ease: 'elastic.out(1, 0.4)', stagger: 0.05
  }, 0.3);

  // Wave: continuous sine bob loop across characters
  tl.add(() => {
    waveLoop = gsap.to(wave, {
      y: -28, duration: 0.7, ease: 'sine.inOut',
      stagger: { each: 0.07, repeat: -1, yoyo: true }
    });
  }, 1.1);

  // Bounce pop: scale from 0 with back overshoot, staggered
  tl.to(bounce, {
    scale: 1, opacity: 1, duration: 0.7,
    ease: 'back.out(2.5)', stagger: 0.045
  }, 1.4);

  tl.to({}, { duration: 2.2 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>

<script>
/* ════════ EDIT COLORS / LABEL HERE — applies live via CSS variables ════════ */
const CONFIG = {
  label: "Lego 39 · Elastic & Wave Text",
  colors: {
    accent:     '#00AA45',   // primary brand accent
    accentRgb:  '0,170,69',  // same accent, for rgba() glows/shadows
    accent2:    '#00e855',   // secondary / brighter accent (used by some scenes)
    accent2Rgb: '0,232,85',
    bg:         '#0D0D0D'    // page background
  }
};
/* ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  var c = CONFIG.colors, r = document.documentElement.style;
  r.setProperty('--accent', c.accent);       r.setProperty('--accent-rgb', c.accentRgb);
  r.setProperty('--accent-2', c.accent2);     r.setProperty('--accent-2-rgb', c.accent2Rgb);
  r.setProperty('--bg', c.bg);
  var lab = document.getElementById('cfgLabel'); if (lab) lab.textContent = CONFIG.label;
})();
</script>
</body>
</html>
