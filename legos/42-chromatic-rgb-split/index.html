<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>42 – Chromatic Aberration / RGB Split</title>
<style>
:root { --accent:#00AA45; --accent-rgb:0,170,69; --accent-2:#00e855; --accent-2-rgb:0,232,85; --bg:#0D0D0D; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4; z-index:100; }

/* Scanline + vignette atmosphere */
.scanlines { position:absolute; inset:0; pointer-events:none; z-index:6;
  background:repeating-linear-gradient(rgba(255,255,255,0.025) 0 1px, transparent 1px 3px); opacity:0.5; }
.vignette { position:absolute; inset:0; pointer-events:none; z-index:5;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.7) 100%); }

/* RGB split: three stacked copies of the same text, blended additively */
.rgb-stack { position:relative; text-align:center; }
.rgb-stack .layer {
  position:absolute; top:0; left:0; right:0; mix-blend-mode:screen; will-change:transform;
}
.rgb-stack .layer.base { position:relative; }
.headline { font-size:150px; font-weight:900; letter-spacing:-4px; line-height:1; white-space:nowrap; }
.red   { color:#ff0033; }
.green { color:#00ff66; }
.blue  { color:#0066ff; }
.white { color:#fff; }

.sub {
  margin-top:30px; font-family:'Courier New',monospace; font-size:22px; letter-spacing:8px;
  color:rgba(255,255,255,0.5); text-transform:uppercase; position:relative; will-change:transform;
}

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(var(--accent-rgb),0.4);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="cfgLabel">Lego 42 · Chromatic Aberration / RGB Split</div>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <div style="text-align:center;">
    <div class="rgb-stack">
      <div class="layer red"  id="r"><div class="headline">PEERLIST</div></div>
      <div class="layer blue" id="b"><div class="headline">PEERLIST</div></div>
      <div class="layer base white" id="w"><div class="headline">PEERLIST</div></div>
    </div>
    <div class="sub" id="sub">signal · locked</div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const r = document.getElementById('r');
const b = document.getElementById('b');
const w = document.getElementById('w');
const sub = document.getElementById('sub');

let idle;

function play() {
  gsap.killTweensOf('*');
  if (idle) idle.kill();
  gsap.set([r, b, w], { x: 0, y: 0, opacity: 1 });
  gsap.set(w, { scale: 1.4, filter: 'blur(14px)' });
  gsap.set(sub, { opacity: 0, x: 0 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // 1. Hard split — channels fly apart from a blurred origin
  tl.fromTo(r, { x: 0 }, { x: -90, y: -8, duration: 0.5, ease: 'power3.out' }, 0.2);
  tl.fromTo(b, { x: 0 }, { x: 90, y: 8, duration: 0.5, ease: 'power3.out' }, 0.2);
  tl.to(w, { scale: 1, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, 0.2);

  // 2. Violent glitch jitter — random channel offsets
  const glitch = (t) => {
    tl.to(r, { x: gsap.utils.random(-40, -10), y: gsap.utils.random(-6, 6), duration: 0.05, ease: 'none' }, t);
    tl.to(b, { x: gsap.utils.random(10, 40), y: gsap.utils.random(-6, 6), duration: 0.05, ease: 'none' }, t);
    tl.to(w, { x: gsap.utils.random(-8, 8), skewX: gsap.utils.random(-6, 6), duration: 0.05, ease: 'none' }, t);
  };
  for (let i = 0; i < 8; i++) glitch(0.9 + i * 0.06);

  // 3. Converge — channels snap back into perfect registration
  tl.to([r, b, w], { x: 0, y: 0, skewX: 0, duration: 0.5, ease: 'power4.out' }, 1.4);

  // 4. Subtle residual aberration breathing (loop) + sub reveal
  tl.to(sub, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 1.8);
  tl.add(() => {
    idle = gsap.timeline({ repeat: -1, yoyo: true });
    idle.to(r, { x: -4, duration: 1.2, ease: 'sine.inOut' }, 0)
        .to(b, { x: 4, duration: 1.2, ease: 'sine.inOut' }, 0);
  }, 2.0);

  tl.to({}, { duration: 2.0 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>

<script>
/* ════════ EDIT COLORS / LABEL HERE — applies live via CSS variables ════════ */
const CONFIG = {
  label: "Lego 42 · Chromatic Aberration / RGB Split",
  colors: {
    accent:     '#00AA45',   // primary brand accent
    accentRgb:  '0,170,69',  // same accent, for rgba() glows/shadows
    accent2:    '#00e855',   // secondary / brighter accent (used by some scenes)
    accent2Rgb: '0,232,85',
    bg:         '#0D0D0D'    // page background
  }
};
/* ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  var c = CONFIG.colors, r = document.documentElement.style;
  r.setProperty('--accent', c.accent);       r.setProperty('--accent-rgb', c.accentRgb);
  r.setProperty('--accent-2', c.accent2);     r.setProperty('--accent-2-rgb', c.accent2Rgb);
  r.setProperty('--bg', c.bg);
  var lab = document.getElementById('cfgLabel'); if (lab) lab.textContent = CONFIG.label;
})();
</script>
</body>
</html>
