<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>44 – Light Sweep / Shimmer</title>
<style>
:root { --accent:#00AA45; --accent-rgb:0,170,69; --accent-2:#00e855; --accent-2-rgb:0,232,85; --bg:#0D0D0D; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:60px; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4; z-index:100; }

/* Metallic chrome text — gradient fill clipped to text, with an animated bright sweep */
.shine-text {
  font-size:160px; font-weight:900; letter-spacing:-4px; line-height:1; position:relative;
  background:linear-gradient(100deg,
    #6b6b6b 0%, #cfcfcf 38%, #ffffff 48%, #cfcfcf 58%, #6b6b6b 100%);
  background-size:300% 100%; background-position:120% 0;
  -webkit-background-clip:text; background-clip:text; color:transparent;
}

/* Green brand bar with glass sweep */
.brand-pill {
  position:relative; overflow:hidden; padding:22px 56px; border-radius:18px;
  background:linear-gradient(135deg, #00C24F, #008f3a);
  font-size:40px; font-weight:800; letter-spacing:1px; color:var(--bg);
  box-shadow:0 12px 40px rgba(var(--accent-rgb),0.35);
}
.brand-pill .sweep {
  position:absolute; top:-50%; left:-60%; width:40%; height:200%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,0.85), transparent);
  transform:skewX(-20deg); filter:blur(3px);
}

.tagline { font-family:'Courier New',monospace; font-size:22px; letter-spacing:10px; color:rgba(255,255,255,0.4); text-transform:uppercase; opacity:0; }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(var(--accent-rgb),0.4);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="cfgLabel">Lego 44 · Light Sweep / Shimmer</div>

  <div class="shine-text" id="shine">PEERLIST</div>

  <div class="brand-pill" id="pill">
    Claim your profile
    <div class="sweep" id="sweep"></div>
  </div>

  <div class="tagline" id="tag">premium · polished · pro</div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
let shimmerLoop, sweepLoop;

function play() {
  gsap.killTweensOf('*');
  if (shimmerLoop) shimmerLoop.kill();
  if (sweepLoop) sweepLoop.kill();

  gsap.set('#shine', { backgroundPosition: '120% 0', opacity: 0, y: 30, scale: 0.96 });
  gsap.set('#pill', { opacity: 0, y: 30, scale: 0.9 });
  gsap.set('#sweep', { left: '-60%' });
  gsap.set('#tag', { opacity: 0, letterSpacing: '20px' });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // Entrance
  tl.to('#shine', { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: 'power3.out' }, 0.2);
  tl.to('#pill', { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: 'back.out(1.6)' }, 0.6);
  tl.to('#tag', { opacity: 1, letterSpacing: '10px', duration: 0.9, ease: 'power2.out' }, 1.0);

  // First hero shimmer pass across the chrome text
  tl.fromTo('#shine', { backgroundPosition: '120% 0' },
    { backgroundPosition: '-120% 0', duration: 1.3, ease: 'power2.inOut' }, 0.8);

  // Glass sweep across pill
  tl.fromTo('#sweep', { left: '-60%' }, { left: '160%', duration: 0.9, ease: 'power2.inOut' }, 1.1);

  // Then settle into gentle looping shimmer + periodic sweep
  tl.add(() => {
    shimmerLoop = gsap.fromTo('#shine', { backgroundPosition: '120% 0' },
      { backgroundPosition: '-120% 0', duration: 3.2, ease: 'sine.inOut', repeat: -1, repeatDelay: 1.2 });
    sweepLoop = gsap.fromTo('#sweep', { left: '-60%' },
      { left: '160%', duration: 1.0, ease: 'power2.inOut', repeat: -1, repeatDelay: 2.4 });
  }, 2.2);

  tl.to({}, { duration: 2.5 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>

<script>
/* ════════ EDIT COLORS / LABEL HERE — applies live via CSS variables ════════ */
const CONFIG = {
  label: "Lego 44 · Light Sweep / Shimmer",
  colors: {
    accent:     '#00AA45',   // primary brand accent
    accentRgb:  '0,170,69',  // same accent, for rgba() glows/shadows
    accent2:    '#00e855',   // secondary / brighter accent (used by some scenes)
    accent2Rgb: '0,232,85',
    bg:         '#0D0D0D'    // page background
  }
};
/* ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  var c = CONFIG.colors, r = document.documentElement.style;
  r.setProperty('--accent', c.accent);       r.setProperty('--accent-rgb', c.accentRgb);
  r.setProperty('--accent-2', c.accent2);     r.setProperty('--accent-2-rgb', c.accent2Rgb);
  r.setProperty('--bg', c.bg);
  var lab = document.getElementById('cfgLabel'); if (lab) lab.textContent = CONFIG.label;
})();
</script>
</body>
</html>
