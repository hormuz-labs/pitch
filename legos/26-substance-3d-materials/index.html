<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>26 – Substance 3D Materials</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#040406; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; }

.label {
  position:absolute; top:32px; left:32px; font-size:13px; color:#00e855; letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4; z-index:100;
}

#webglCanvas { position:absolute; inset:0; z-index:1; }

/* Interactive overlay describing each material */
.material-info {
  position:absolute; bottom:120px; left:50%; transform:translateX(-50%);
  display:flex; gap:60px; z-index:10; pointer-events:none;
}
.material-card {
  text-align:center; opacity:0; transform:translateY(30px);
}
.material-card h3 {
  font-size:14px; letter-spacing:3px; text-transform:uppercase; color:#00e855; margin-bottom:8px; font-family: monospace;
}
.material-card p {
  font-size:13px; color:rgba(255,255,255,0.4);
}

#replayBtn {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(0,170,69,0.4);
  background:rgba(0,0,0,0.7); color:#00AA45; cursor:pointer; font-size:13px;
  font-family:monospace; backdrop-filter:blur(10px);
}
</style>
</head>
<body>
<div class="vp">
  <div class="label">Lego 26 · Substance 3D Materials</div>
  <canvas id="webglCanvas"></canvas>
  
  <div class="material-info">
    <div class="material-card" id="cardGlass">
      <h3>Frosted Glass</h3>
      <p>Refractive, Transmissive physical glass with clearcoat</p>
    </div>
    <div class="material-card" id="cardGold">
      <h3>Anodized Gold</h3>
      <p>Ultra-polished, reflective precious metal</p>
    </div>
    <div class="material-card" id="cardMatte">
      <h3>Matte Polycarbonate</h3>
      <p>Soft-touch satin material with high light scattering</p>
    </div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x040406, 0.05);

const camera = new THREE.PerspectiveCamera(38, 1920 / 1080, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webglCanvas'), antialias: true });
renderer.setSize(1920, 1080);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

// ── ENVIRONMENT REFLECTION SETUP ──
// We'll create colorful glowing objects behind and around the camera to give beautiful reflections on our materials!
const refGroup = new THREE.Group();
const ringGeo = new THREE.TorusGeometry(8, 0.2, 16, 100);
const ringMatCyan = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
const ringMatPink = new THREE.MeshBasicMaterial({ color: 0xff007f });

const ring1 = new THREE.Mesh(ringGeo, ringMatCyan);
ring1.position.set(0, 0, -6);
refGroup.add(ring1);

const ring2 = new THREE.Mesh(ringGeo, ringMatPink);
ring2.position.set(0, 0, 6);
ring2.rotation.y = Math.PI / 2;
refGroup.add(ring2);

// Bright ambient and studio lights
const spotLight1 = new THREE.SpotLight(0xffffff, 8, 30, Math.PI / 4, 0.5, 1);
spotLight1.position.set(-6, 8, 8);
spotLight1.castShadow = true;
scene.add(spotLight1);

const spotLight2 = new THREE.SpotLight(0x00ffaa, 5, 30, Math.PI / 4, 0.5, 1);
spotLight2.position.set(6, 8, -4);
scene.add(spotLight2);

const ambientLight = new THREE.AmbientLight(0x101015, 1.5);
scene.add(ambientLight);

// ── SUBSTANCE GEOMETRIES AND MATERIALS ──

// 1. Frosted Glass (Torus Knot)
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  roughness: 0.15,
  metalness: 0.0,
  transmission: 0.95, // transmission of light
  thickness: 2.0, // glass thickness for refraction
  ior: 1.52, // refractive index of glass
  clearcoat: 1.0,
  clearcoatRoughness: 0.1,
  side: THREE.DoubleSide
});
const glassMesh = new THREE.Mesh(new THREE.TorusKnotGeometry(1.0, 0.35, 150, 20), glassMat);
glassMesh.position.set(-4.5, 0, 0);
glassMesh.castShadow = true;
glassMesh.receiveShadow = true;
scene.add(glassMesh);

// 2. Anodized/Polished Gold (Chamfered Cylinder/Sphere)
const goldMat = new THREE.MeshPhysicalMaterial({
  color: 0xfcc205, // Gold
  roughness: 0.08,
  metalness: 1.0, // Solid Metal
  clearcoat: 1.0,
  clearcoatRoughness: 0.05,
  reflectivity: 1.0
});
const goldMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1.3, 2), goldMat);
goldMesh.position.set(0, 0, 0);
goldMesh.castShadow = true;
goldMesh.receiveShadow = true;
scene.add(goldMesh);

// 3. Matte Soft-Touch Polycarbonate (Curved Shape)
const matteMat = new THREE.MeshPhysicalMaterial({
  color: 0x111625, // Sleek Navy Matte
  roughness: 0.85,
  metalness: 0.0,
  clearcoat: 0.05,
  clearcoatRoughness: 0.5
});
const matteMesh = new THREE.Mesh(new THREE.ConeGeometry(1.1, 2.2, 4), matteMat);
matteMesh.position.set(4.5, 0, 0);
matteMesh.castShadow = true;
matteMesh.receiveShadow = true;
scene.add(matteMesh);

scene.add(refGroup);

// Render loop
function animate() {
  requestAnimationFrame(animate);
  
  // Rotate reflection environment
  refGroup.rotation.y += 0.005;
  refGroup.rotation.x += 0.002;
  
  renderer.render(scene, camera);
}
animate();

function play() {
  gsap.killTweensOf('*');
  
  // Set initial state
  gsap.set(camera.position, { x: 0, y: 1.5, z: 12 });
  gsap.set(camera.rotation, { x: -0.1, y: 0, z: 0 });
  
  gsap.set('#cardGlass, #cardGold, #cardMatte', { opacity: 0, y: 30 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // 1. Zoom into the scene showing three materials side-by-side (0s - 3s)
  tl.to(camera.position, { z: 9, duration: 3.0, ease: 'power2.out' }, 0);
  tl.to('#cardGlass, #cardGold, #cardMatte', { opacity: 1, y: 0, duration: 1.0, stagger: 0.25, ease: 'power2.out' }, 1.0);

  // 2. Zoom Close-up to Frosted Glass with reflection rotation (3s - 5.5s)
  tl.to(camera.position, { x: -4.5, y: 0, z: 4.5, duration: 2.5, ease: 'power3.inOut' }, 3.0);
  tl.to('#cardGold, #cardMatte', { opacity: 0.15, duration: 1.0 }, 3.0);
  tl.to('#cardGlass', { scale: 1.15, duration: 1.0 }, 3.0);

  // 3. Sweep across to Chrome/Gold (5.5s - 8s)
  tl.to(camera.position, { x: 0, y: 0.3, z: 4.0, duration: 2.5, ease: 'power3.inOut' }, 5.5);
  tl.to('#cardGlass', { scale: 1.0, opacity: 0.15, duration: 1.0 }, 5.5);
  tl.to('#cardGold', { scale: 1.15, opacity: 1, duration: 1.0 }, 5.5);

  // 4. Sweep across to Matte Polycarbonate (8s - 10.5s)
  tl.to(camera.position, { x: 4.5, y: -0.2, z: 4.5, duration: 2.5, ease: 'power3.inOut' }, 8.0);
  tl.to('#cardGold', { scale: 1.0, opacity: 0.15, duration: 1.0 }, 8.0);
  tl.to('#cardMatte', { scale: 1.15, opacity: 1, duration: 1.0 }, 8.0);

  // 5. Back to Wide (10.5s - 13s)
  tl.to(camera.position, { x: 0, y: 1.5, z: 9.5, duration: 2.5, ease: 'power2.inOut' }, 10.5);
  tl.to('#cardGlass, #cardGold, #cardMatte', { scale: 1.0, opacity: 1, duration: 1.5 }, 11.0);

  // Slow spins on the meshes
  tl.to(glassMesh.rotation, { x: Math.PI * 2, y: Math.PI * 1.5, duration: 12.5, ease: 'none' }, 0);
  tl.to(goldMesh.rotation, { y: -Math.PI * 2, x: Math.PI, duration: 12.5, ease: 'none' }, 0);
  tl.to(matteMesh.rotation, { x: Math.PI, y: Math.PI * 2, duration: 12.5, ease: 'none' }, 0);

  tl.to({}, { duration: 0.5 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
