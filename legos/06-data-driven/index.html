<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>06 – Data-Driven Animations</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#0D0D0D; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; }

.label {
  position:absolute; top:32px; left:32px; font-size:13px; color:#00AA45; letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4;
}

/* CSV-style data table */
.data-table {
  background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06);
  border-radius:12px; overflow:hidden; width:760px; margin-bottom:40px;
}
.data-table table { width:100%; border-collapse:collapse; }
.data-table th {
  text-align:left; padding:14px 20px; font-size:11px; color:#00AA45;
  text-transform:uppercase; letter-spacing:2px; font-family:'Courier New',monospace;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.data-table td {
  padding:12px 20px; font-size:14px; color:rgba(255,255,255,0.7);
  border-bottom:1px solid rgba(255,255,255,0.03);
  font-family:'Courier New',monospace;
}
.data-table tr:last-child td { border-bottom:none; }
.data-table .highlight td { color:#00AA45; }

/* Render area for generated cards */
.render-area {
  display:flex; gap:20px; align-items:stretch;
  min-height:200px;
}
.render-card {
  background:rgba(255,255,255,0.03); border:1px solid rgba(0,170,69,0.2);
  border-radius:12px; padding:20px 24px; width:200px;
  text-align:center;
  opacity:0; transform:translateY(20px);
}
.render-card .rc-icon { font-size:32px; margin-bottom:12px; }
.render-card .rc-name { font-size:15px; font-weight:600; margin-bottom:4px; }
.render-card .rc-role { font-size:11px; color:rgba(255,255,255,0.4); font-family:'Courier New',monospace; }
.render-card .rc-badge {
  display:inline-block; margin-top:10px; padding:3px 12px;
  border-radius:20px; border:1px solid rgba(0,170,69,0.4);
  font-size:10px; color:#00AA45; font-family:'Courier New',monospace;
}

.control-bar {
  position:absolute; bottom:50px; display:flex; gap:16px; align-items:center;
}
.control-bar button {
  padding:10px 28px; border-radius:30px; border:1px solid rgba(0,170,69,0.4);
  background:rgba(0,0,0,0.7); color:#00AA45; cursor:pointer; font-size:13px;
  font-family:monospace; backdrop-filter:blur(10px);
  transition:all 0.2s;
}
.control-bar button:hover { background:rgba(0,170,69,0.15); }
.control-bar select {
  padding:8px 16px; border-radius:20px; border:1px solid rgba(0,170,69,0.3);
  background:rgba(0,0,0,0.6); color:#fff; font-size:13px; font-family:monospace;
  cursor:pointer;
}
.control-bar .file-label { font-size:12px; color:rgba(255,255,255,0.3); font-family:monospace; }
</style>
</head>
<body>
<div class="vp">
  <div class="label">Lego 06 · Data-Driven Animations</div>

  <!-- "CSV" data table display -->
  <div class="data-table" id="dataTable">
    <table>
      <thead><tr>
        <th>Name</th><th>Role</th><th>Projects</th><th>Badge</th><th>Color</th>
      </tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- Cards rendered from data -->
  <div class="render-area" id="renderArea"></div>

  <div class="control-bar">
    <span class="file-label">data.json</span>
    <select id="datasetSelect">
      <option value="0">Team A — Engineering</option>
      <option value="1">Team B — Design</option>
      <option value="2">Team C — Growth</option>
    </select>
    <button id="renderBtn">▶ RENDER</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
// ── Dataset: simulates CSV/JSON-driven content ──
const datasets = [
  [
    { name: 'Michael Rivera', role: 'Full-Stack Engineer', projects: 24, badge: 'Verified', color: '#00AA45' },
    { name: 'Aneeta Sharma', role: 'Product Designer', projects: 18, badge: 'Top 5%', color: '#0070f3' },
    { name: 'James Liu', role: 'ML Engineer', projects: 31, badge: 'Verified', color: '#7c3aed' },
    { name: 'Sofia Chen', role: 'Frontend Lead', projects: 42, badge: 'Staff', color: '#f59e0b' },
  ],
  [
    { name: 'Laura Kim', role: 'UX Director', projects: 56, badge: 'Staff', color: '#ec4899' },
    { name: 'Tomas Garcia', role: 'Visual Designer', projects: 12, badge: 'Rising', color: '#00AA45' },
    { name: 'Priya Patel', role: 'Design Engineer', projects: 27, badge: 'Verified', color: '#0070f3' },
    { name: 'Omar Hassan', role: 'Brand Lead', projects: 33, badge: 'Top 1%', color: '#f59e0b' },
  ],
  [
    { name: 'Emily Davis', role: 'Growth PM', projects: 19, badge: 'Verified', color: '#00AA45' },
    { name: 'Raj Kapoor', role: 'Marketing Eng', projects: 15, badge: 'Rising', color: '#7c3aed' },
    { name: 'Zoe Martin', role: 'Data Analyst', projects: 22, badge: 'Top 5%', color: '#ec4899' },
    { name: 'Liam O\'Brien', role: 'Content Lead', projects: 44, badge: 'Staff', color: '#0070f3' },
  ]
];

function renderTable(data) {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  data.forEach((row, i) => {
    const tr = document.createElement('tr');
    if (i === 0) tr.className = 'highlight';
    tr.innerHTML = `
      <td>${row.name}</td>
      <td>${row.role}</td>
      <td>${row.projects}</td>
      <td style="color:${row.color};">${row.badge}</td>
      <td style="color:${row.color};">●</td>
    `;
    tbody.appendChild(tr);
  });

  // Animate table rows
  gsap.from('#tableBody tr', {
    opacity: 0, x: -20, duration: 0.4,
    stagger: 0.07, ease: 'power2.out'
  });
}

function renderCards(data) {
  const area = document.getElementById('renderArea');
  area.innerHTML = '';

  // Emoji hue based on color
  const emojiFromColor = (color) => {
    const map = { '#00AA45': '🧑‍💻', '#0070f3': '👩‍🎨', '#7c3aed': '🧙', '#f59e0b': '🚀', '#ec4899': '✨' };
    return map[color] || '👤';
  };

  data.forEach((row, i) => {
    const card = document.createElement('div');
    card.className = 'render-card';
    card.style.borderColor = row.color + '44';
    card.innerHTML = `
      <div class="rc-icon">${emojiFromColor(row.color)}</div>
      <div class="rc-name">${row.name}</div>
      <div class="rc-role">${row.role}</div>
      <div class="rc-badge" style="border-color:${row.color}66;color:${row.color};">${row.badge}</div>
    `;
    area.appendChild(card);
  });

  // Animate cards in
  gsap.to('.render-card', {
    opacity: 1, y: 0, duration: 0.6, ease: 'back.out(1.7)',
    stagger: 0.12
  });
}

function loadDataset(idx) {
  const data = datasets[idx];
  renderTable(data);
  renderCards(data);
}

document.getElementById('renderBtn').addEventListener('click', () => {
  const idx = parseInt(document.getElementById('datasetSelect').value);
  loadDataset(idx);
});

// Initial load
loadDataset(0);

window.masterTimeline = gsap.timeline(); // placeholder for API compatibility
</script>
</body>
</html>
