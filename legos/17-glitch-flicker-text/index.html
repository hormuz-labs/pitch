<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>17 – Glitch/Flicker Text Presets</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#080808; font-family:'Courier New', Courier, monospace; color:#fff; }
.vp { width:1920px; height:1080px; position:relative; overflow:hidden; }

.label {
  position:absolute; top:32px; left:32px; font-size:13px; color:#00AA45; letter-spacing:2px;
  text-transform:uppercase; opacity:0.4; z-index:50;
}

/* Scanlines */
.scanlines {
  position:absolute; inset:0; pointer-events:none; z-index:40; opacity:0.04;
  background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.06) 2px, rgba(255,255,255,0.06) 4px);
}

/* Vignette */
.vignette {
  position:absolute; inset:0; pointer-events:none; z-index:39;
  background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
}

/* CRT grid overlay */
.crt-grid {
  position:absolute; inset:0; pointer-events:none; z-index:38; opacity:0.015;
  background-image: linear-gradient(rgba(0,255,80,0.1) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0,255,80,0.1) 1px, transparent 1px);
  background-size:4px 4px;
}

/* Main glitch stage */
.glitch-stage {
  position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
  width:1400px; text-align:center;
}

/* Glitch text utility */
.glitch-text {
  position:relative; display:inline-block;
  color:#00FF55; text-shadow:0 0 8px rgba(0,255,85,0.5);
  will-change:transform,filter;
}
.glitch-text::before,
.glitch-text::after {
  content:attr(data-text);
  position:absolute; top:0; left:0; width:100%;
  opacity:0; clip:rect(0,0,0,0);
}
.glitch-text::before {
  color:#FF3366; text-shadow:2px 0 8px rgba(255,51,102,0.5);
  left:2px;
}
.glitch-text::after {
  color:#33FFFF; text-shadow:-2px 0 8px rgba(51,255,255,0.5);
  left:-2px;
}

/* Status text lines */
.status-line {
  font-size:22px; letter-spacing:4px; color:rgba(0,255,85,0.35);
  margin-bottom:10px; opacity:0; text-transform:uppercase;
  display:flex; align-items:center; justify-content:center; gap:12px;
}
.status-bracket { color:rgba(0,255,85,0.5); }

/* Blink cursor */
.cursor { display:inline-block; width:14px; height:28px; background:#00FF55; vertical-align:middle; animation:blink 0.8s step-end infinite; }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

/* Noise artifact div */
.noise-bar {
  position:absolute; left:0; right:0; height:3px;
  background:linear-gradient(90deg, transparent 0%, rgba(0,255,85,0.6) 30%, rgba(255,51,102,0.4) 60%, transparent 100%);
  opacity:0; pointer-events:none;
}

/* Color bleed layers */
.bleed-r, .bleed-b {
  position:absolute; inset:0; pointer-events:none; opacity:0;
  mix-blend-mode:screen;
}
.bleed-r { background:rgba(255,0,0,0.08); }
.bleed-b { background:rgba(0,100,255,0.08); }

/* Flicker text (different preset - rapid on/off) */
.flicker-wrap { position:absolute; opacity:0; will-change:opacity; }

/* Hex decode text (number scramble) */
.decode-line {
  font-size:18px; letter-spacing:6px; color:rgba(0,255,85,0.5);
  font-family:'Courier New',monospace; opacity:0; margin-top:12px;
}

#replayBtn {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(0,170,69,0.4);
  background:rgba(0,0,0,0.7); color:#00AA45; cursor:pointer; font-size:13px;
  font-family:monospace; backdrop-filter:blur(10px);
}
</style>
</head>
<body>
<div class="vp">
  <div class="label">Lego 17 · Glitch/Flicker Text Presets</div>
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="crt-grid"></div>

  <!-- Color bleed layers -->
  <div class="bleed-r" id="bleedR"></div>
  <div class="bleed-b" id="bleedB"></div>

  <!-- Noise bars that sweep randomly -->
  <div class="noise-bar" id="noise1" style="top:200px;"></div>
  <div class="noise-bar" id="noise2" style="top:550px;"></div>
  <div class="noise-bar" id="noise3" style="top:820px;"></div>

  <!-- Main stage -->
  <div class="glitch-stage">

    <!-- Status lines (top) -->
    <div class="status-line" id="sl1">
      <span class="status-bracket">[</span>SYSTEM BOOT — v4.7.2<span class="status-bracket">]</span>
    </div>
    <div class="status-line" id="sl2">
      <span class="status-bracket">[</span>LOADING NEURAL MODULES...<span class="status-bracket">]</span>
    </div>

    <!-- HERO GLITCH TITLE -->
    <div style="position:relative; margin:20px 0 16px;">
      <div class="glitch-text" id="heroGlitch" data-text="EXTRACTING DATA"
           style="font-size:110px; font-weight:900; letter-spacing:12px; display:block; opacity:0;">
        EXTRACTING DATA
      </div>
    </div>

    <!-- Decode line -->
    <div class="decode-line" id="decodeLine">0x4E455852 · 0xA2F1 · CHECKSUM OK</div>

    <!-- Progress bar -->
    <div style="margin:28px auto; width:800px; height:3px; background:rgba(0,255,85,0.1); border-radius:2px; position:relative; opacity:0;" id="progressWrap">
      <div id="progressFill" style="height:100%; width:0%; background:#00FF55; border-radius:2px; box-shadow:0 0 10px rgba(0,255,85,0.6);"></div>
      <div style="position:absolute; right:0; top:-20px; font-size:12px; color:#00FF55; letter-spacing:2px; font-family:'Courier New',monospace;" id="progressPct">0%</div>
    </div>

    <!-- Bottom status lines -->
    <div class="status-line" id="sl3" style="margin-top:20px;">
      <span class="status-bracket">[</span>ENCRYPTION LAYER: AES-256 · ACTIVE<span class="status-bracket">]</span>
    </div>
    <div class="status-line" id="sl4" style="font-size:28px; color:rgba(0,255,85,0.7); letter-spacing:6px;">
      SYSTEM READY<span class="cursor"></span>
    </div>
  </div>

  <!-- Flicker preset: top-right corner HUD box -->
  <div class="flicker-wrap" id="hudBox" style="top:60px; right:60px; width:340px; padding:16px 20px; border:1px solid rgba(0,255,85,0.3); background:rgba(0,255,85,0.04);">
    <div style="font-size:11px; letter-spacing:3px; color:rgba(0,255,85,0.5); margin-bottom:8px;">THREAT LEVEL</div>
    <div style="font-size:42px; font-weight:900; color:#00FF55; text-shadow:0 0 20px rgba(0,255,85,0.5);">NULL</div>
    <div style="font-size:11px; letter-spacing:2px; color:rgba(0,255,85,0.35); margin-top:4px;">● SECURE CHANNEL OPEN</div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
// Glitch function: rapid CSS transform + skew + color bleed
function glitch(el, intensity, duration, tl, at) {
  const steps = Math.floor(duration * 20);
  for (let i = 0; i < steps; i++) {
    const t = at + (i / steps) * duration;
    const skew = (Math.random() - 0.5) * intensity * 6;
    const tx = (Math.random() - 0.5) * intensity * 12;
    const ty = (Math.random() - 0.5) * intensity * 4;
    tl.set(el, { skewX: skew, x: tx, y: ty, filter:`blur(${Math.random() * intensity * 2}px)` }, t);
  }
  tl.set(el, { skewX:0, x:0, y:0, filter:'blur(0)' }, at + duration);
}

// Character scramble for decode text
function scrambleText(el, finalText, duration, tl, at) {
  const chars = '01ABCDEF$#%@!?→◆░▓|';
  const len = finalText.length;
  let current = Array(len).fill('█').join('');
  const obj = { p: 0 };
  tl.to(obj, {
    p: 1,
    duration,
    ease: 'none',
    onUpdate: function() {
      const revealed = Math.floor(obj.p * len);
      let display = '';
      for (let i = 0; i < len; i++) {
        if (i < revealed) display += finalText[i];
        else display += chars[Math.floor(Math.random() * chars.length)];
      }
      el.textContent = display;
    },
    onComplete: () => { el.textContent = finalText; }
  }, at);
}

function play() {
  gsap.killTweensOf('*');

  // Reset
  gsap.set('#sl1,#sl2,#sl3,#sl4', { opacity:0 });
  gsap.set('#heroGlitch', { opacity:0, skewX:0, x:0, y:0 });
  gsap.set('#decodeLine', { opacity:0 });
  gsap.set('#progressWrap', { opacity:0 });
  gsap.set('#progressFill', { width:'0%' });
  gsap.set('#progressPct', { textContent:'0%' });
  gsap.set('#hudBox', { opacity:0 });
  gsap.set('.noise-bar', { opacity:0, scaleX:1 });
  gsap.set('#bleedR,#bleedB', { opacity:0, x:0 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // Noise bars sweep
  tl.to('#noise1', { opacity:1, scaleX:1.2, duration:0.05 }, 0.1);
  tl.to('#noise1', { opacity:0, duration:0.1 }, 0.2);
  tl.to('#noise2', { opacity:0.8, duration:0.05 }, 0.3);
  tl.to('#noise2', { opacity:0, duration:0.08 }, 0.4);

  // Status line 1
  tl.to('#sl1', { opacity:1, duration:0 }, 0.2);

  // Color bleed jitter
  tl.to('#bleedR', { opacity:1, x:5, duration:0.1 }, 0.5);
  tl.to('#bleedB', { opacity:1, x:-5, duration:0.1 }, 0.5);
  tl.to('#bleedR,#bleedB', { opacity:0, x:0, duration:0.15 }, 0.65);

  // Status line 2
  tl.to('#sl2', { opacity:1, duration:0 }, 0.8);

  // Hero text in
  tl.to('#heroGlitch', { opacity:1, duration:0 }, 1.4);

  // BIG GLITCH on hero
  glitch('#heroGlitch', 1.5, 0.3, tl, 1.4);
  tl.to('#bleedR', { opacity:1, x:8, duration:0.05 }, 1.4);
  tl.to('#bleedB', { opacity:1, x:-8, duration:0.05 }, 1.4);
  tl.to('#bleedR,#bleedB', { opacity:0, x:0, duration:0.2 }, 1.7);

  // Noise bar on hero
  tl.to('#noise3', { opacity:0.9, duration:0.05 }, 1.45);
  tl.to('#noise3', { opacity:0, duration:0.15 }, 1.55);

  // Decode line
  tl.to('#decodeLine', { opacity:1, duration:0 }, 1.8);
  scrambleText(document.getElementById('decodeLine'), '0x4E455852 · 0xA2F1 · CHECKSUM OK', 1.2, tl, 1.8);

  // Progress bar
  tl.to('#progressWrap', { opacity:1, duration:0.3 }, 2.2);
  const pct = { val:0 };
  tl.to(pct, {
    val:100, duration:2.0, ease:'power1.inOut',
    onUpdate: () => {
      const v = Math.round(pct.val);
      document.getElementById('progressFill').style.width = v + '%';
      document.getElementById('progressPct').textContent = v + '%';
    }
  }, 2.2);

  // Mid-progress glitch
  glitch('#heroGlitch', 0.8, 0.25, tl, 3.0);
  tl.to('#bleedR', { opacity:0.7, x:6, duration:0.08 }, 3.0);
  tl.to('#bleedB', { opacity:0.7, x:-6, duration:0.08 }, 3.0);
  tl.to('#bleedR,#bleedB', { opacity:0, x:0, duration:0.2 }, 3.1);
  tl.to('#noise1', { top:Math.random()*900, opacity:0.7, duration:0.05 }, 3.1);
  tl.to('#noise1', { opacity:0, duration:0.1 }, 3.2);

  // Status 3 appears
  tl.to('#sl3', { opacity:1, duration:0 }, 3.8);

  // HUD box flickers in
  tl.to('#hudBox', { opacity:1, duration:0.05 }, 4.0);
  tl.to('#hudBox', { opacity:0.2, duration:0.05 }, 4.08);
  tl.to('#hudBox', { opacity:1, duration:0.05 }, 4.14);
  tl.to('#hudBox', { opacity:0, duration:0.05 }, 4.2);
  tl.to('#hudBox', { opacity:1, duration:0.1 }, 4.3);

  // Final status SYSTEM READY
  tl.to('#sl4', { opacity:1, duration:0.1 }, 4.5);
  glitch('#heroGlitch', 0.4, 0.2, tl, 4.5);

  // Settle
  tl.to('#heroGlitch', { textShadow:'0 0 20px rgba(0,255,85,0.7)', duration:0.5 }, 4.8);
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
