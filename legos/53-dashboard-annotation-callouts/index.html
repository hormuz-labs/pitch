<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>53 – Dashboard Annotation Callouts</title>
<style>
:root { --bg:#0a0612; --bg-mid:#1e1140; --accent:#a78bfa; --accent-2:#7c3aed; --accent-3:#5b21b6;
  --panel:#f6f4fb; --panel-2:#efeafc; --ink:#1c1530; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:var(--ink); }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; background:radial-gradient(ellipse at 50% 30%, var(--bg-mid), var(--bg) 70%); display:flex; align-items:center; justify-content:center; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.5; z-index:100; }

.heading { position:absolute; top:90px; left:0; right:0; text-align:center; z-index:4; color:#fff; }
.heading .l1 { font-size:30px; font-weight:600; opacity:0.7; }
.heading .l2 { font-size:60px; font-weight:800; letter-spacing:-1px; }
.heading .l2 .accent { color:var(--accent); }

.scene3d { perspective:1600px; z-index:2; margin-top:120px; }
.dash { width:1280px; height:720px; border-radius:20px; background:var(--panel); overflow:hidden;
  box-shadow:0 60px 120px rgba(0,0,0,0.55); position:relative; transform-style:preserve-3d; will-change:transform;
  display:grid; grid-template-columns:240px 1fr; }
.side { background:var(--panel-2); border-right:1px solid #e2dcf3; padding:28px 20px; }
.brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; color:var(--accent-3); margin-bottom:32px; }
.brand .dot { width:26px; height:26px; border-radius:8px; background:var(--accent-2); }
.nav { display:flex; flex-direction:column; gap:8px; }
.nav .item { height:42px; border-radius:10px; display:flex; align-items:center; padding:0 14px; font-size:14px; color:#6b6480; gap:10px; }
.nav .item.active { background:#fff; color:var(--accent-3); font-weight:600; box-shadow:0 4px 14px rgba(124,58,237,0.12); }
.main { padding:32px 36px; }
.welcome { font-size:26px; font-weight:800; color:var(--ink); }
.welcome span { color:var(--accent-2); }
.cards { display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px; margin-top:24px; }
.kpi { background:#fff; border-radius:14px; padding:20px; box-shadow:0 6px 20px rgba(80,40,160,0.06); }
.kpi .t { font-size:12px; color:#8a83a0; text-transform:uppercase; letter-spacing:1px; }
.kpi .v { font-size:34px; font-weight:800; color:var(--ink); margin-top:8px; }
.kpi .bar { height:6px; background:#ece6fb; border-radius:3px; margin-top:14px; overflow:hidden; }
.kpi .bar i { display:block; height:100%; background:var(--accent-2); width:0; }
.chartcard { background:#fff; border-radius:14px; padding:22px; margin-top:18px; height:240px; box-shadow:0 6px 20px rgba(80,40,160,0.06); }
.chartcard .t { font-size:14px; font-weight:700; color:var(--ink); }
.bars { display:flex; gap:14px; align-items:flex-end; height:150px; margin-top:18px; }
.bars i { flex:1; background:linear-gradient(var(--accent),var(--accent-2)); border-radius:6px 6px 0 0; height:10%; }

.callout { position:absolute; z-index:6; border-radius:14px; pointer-events:none; }
.callout rect { fill:none; stroke:var(--accent-2); stroke-width:3; }
.cursor { position:absolute; z-index:8; width:30px; height:30px; left:0; top:0; filter:drop-shadow(0 3px 6px rgba(0,0,0,0.4)); opacity:0; }
.cursor path { fill:#fff; stroke:var(--accent-2); stroke-width:1.5; }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid var(--accent);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="label"></div>

  <div class="heading">
    <div class="l1" id="hl1"></div>
    <div class="l2" id="hl2"></div>
  </div>

  <div class="scene3d">
    <div class="dash" id="dash">
      <div class="side">
        <div class="brand"><div class="dot"></div> <span id="brandName"></span></div>
        <div class="nav" id="nav"></div>
      </div>
      <div class="main">
        <div class="welcome" id="welcome"></div>
        <div class="cards" id="cards"></div>
        <div class="chartcard">
          <div class="t" id="chartTitle"></div>
          <div class="bars" id="bars"></div>
        </div>
      </div>
    </div>

    <svg class="callout" id="c1" style="left:300px; top:120px; width:260px; height:60px;"><rect x="2" y="2" width="256" height="56" rx="12" pathLength="1"/></svg>
    <svg class="callout" id="c2" style="left:296px; top:208px; width:330px; height:140px;"><rect x="2" y="2" width="326" height="136" rx="12" pathLength="1"/></svg>
    <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M3 2l7 18 2.5-7.5L20 10z"/></svg>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════ EDIT EVERYTHING HERE ════════════════ */
const CONFIG = {
  label: 'Lego 53 · Dashboard Annotation Callouts',
  headingTop: 'All In One',
  headingMain: [{ t: 'Integrated', accent: true }, { t: ' System' }],
  brand: 'WasteProtect',
  nav: ['▦ Dashboard', '🗑 Bins Pickup', '🛣 Routes', '📊 Analytics', '⚙ Settings'],
  welcome: 'Welcome, <span>John</span>',
  chartTitle: 'Weekly Collection Volume',
  kpis: [   // {title, value, suffix, bar%}
    { t: 'Avg. Bin Fill', v: 60, suf: '%', bar: 60 },
    { t: 'Active Routes', v: 14, suf: '',  bar: 78 },
    { t: 'On-time',       v: 96, suf: '%', bar: 96 }
  ],
  barHeights: [40, 65, 50, 80, 55, 90, 70, 100, 60, 85, 75, 95],
  colors: {
    bg:'#0a0612', bgMid:'#1e1140', accent:'#a78bfa', accent2:'#7c3aed', accent3:'#5b21b6',
    panel:'#f6f4fb', panel2:'#efeafc', ink:'#1c1530'
  }
};
/* ═══════════════════════════════════════════════════════ */

const C = CONFIG.colors, _r = document.documentElement.style;
_r.setProperty('--bg', C.bg); _r.setProperty('--bg-mid', C.bgMid);
_r.setProperty('--accent', C.accent); _r.setProperty('--accent-2', C.accent2); _r.setProperty('--accent-3', C.accent3);
_r.setProperty('--panel', C.panel); _r.setProperty('--panel-2', C.panel2); _r.setProperty('--ink', C.ink);

document.getElementById('label').textContent = CONFIG.label;
document.getElementById('hl1').textContent = CONFIG.headingTop;
document.getElementById('hl2').innerHTML = CONFIG.headingMain.map(s => s.accent ? `<span class="accent">${s.t}</span>` : s.t).join('');
document.getElementById('brandName').textContent = CONFIG.brand;
document.getElementById('welcome').innerHTML = CONFIG.welcome;
document.getElementById('chartTitle').textContent = CONFIG.chartTitle;
document.getElementById('nav').innerHTML = CONFIG.nav.map((n, i) => `<div class="item${i===0?' active':''}">${n}</div>`).join('');
document.getElementById('cards').innerHTML = CONFIG.kpis.map((k, i) =>
  `<div class="kpi"><div class="t">${k.t}</div><div class="v" id="kpi${i}">0${k.suf}</div><div class="bar"><i id="bar${i}"></i></div></div>`).join('');
document.getElementById('bars').innerHTML = CONFIG.barHeights.map(() => '<i></i>').join('');

function play() {
  gsap.killTweensOf('*');
  gsap.set('.heading .l1', { opacity: 0, y: 20 });
  gsap.set('.heading .l2', { opacity: 0, y: 24 });
  gsap.set('#dash', { y: 360, opacity: 0, rotateX: 18, rotateY: -14, rotateZ: 2, scale: 0.96, transformOrigin: '50% 60%' });
  gsap.set(['#c1 rect', '#c2 rect'], { strokeDasharray: 1, strokeDashoffset: 1 });
  gsap.set('#cursor', { opacity: 0, x: 980, y: 60 });
  CONFIG.kpis.forEach((k, i) => { gsap.set('#bar' + i, { width: '0%' }); document.getElementById('kpi' + i).textContent = '0' + k.suf; });
  gsap.utils.toArray('#bars i').forEach(i => gsap.set(i, { height: '10%' }));

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  tl.to('.heading .l1', { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 0.1);
  tl.to('.heading .l2', { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 0.3);
  tl.to('#dash', { y: 0, opacity: 1, rotateX: 8, rotateY: -7, rotateZ: 0, scale: 1, duration: 1.4, ease: 'power3.out' }, 0.5);

  CONFIG.kpis.forEach((k, i) => {
    const o = { v: 0 };
    tl.to(o, { v: k.v, duration: 1.2, ease: 'power2.out',
      onUpdate: () => document.getElementById('kpi' + i).textContent = Math.round(o.v) + k.suf }, 1.6 + i * 0.1);
    tl.to('#bar' + i, { width: k.bar + '%', duration: 1.2, ease: 'power2.out' }, 1.6 + i * 0.1);
  });
  gsap.utils.toArray('#bars i').forEach((bar, i) => {
    tl.to(bar, { height: CONFIG.barHeights[i] + '%', duration: 0.9, ease: 'back.out(1.4)' }, 2.0 + i * 0.04);
  });

  tl.to('#cursor', { opacity: 1, duration: 0.3 }, 2.4);
  tl.to('#cursor', { x: 430, y: 150, duration: 0.7, ease: 'power2.inOut' }, 2.5);
  tl.to('#c1 rect', { strokeDashoffset: 0, duration: 0.7, ease: 'power2.inOut' }, 3.0);
  tl.to('#cursor', { x: 460, y: 280, duration: 0.7, ease: 'power2.inOut' }, 3.6);
  tl.to('#c2 rect', { strokeDashoffset: 0, duration: 0.8, ease: 'power2.inOut' }, 4.1);
  tl.to({}, { duration: 1.8 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
