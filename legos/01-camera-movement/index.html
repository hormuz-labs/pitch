<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>01 – Virtual Camera Movement</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#0D0D0D; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.viewport { width:1920px; height:1080px; overflow:hidden; position:relative; }
.stage { position:absolute; top:0; left:0; width:1920px; height:1080px; transform-origin:center center; will-change:transform; }

.layer { position:absolute; will-change:transform; }
.layer-0 { z-index:0; }
.layer-1 { z-index:1; }
.layer-2 { z-index:2; }
.layer-3 { z-index:3; }

/* Deep space bg */
.stars { position:absolute; inset:0; }
.star { position:absolute; width:2px; height:2px; border-radius:50%; background:#fff; }

/* Dashboard grid */
.dashboard {
  position:absolute; top:200px; left:200px; width:1400px; height:800px;
  border:1px solid rgba(255,255,255,0.08); border-radius:16px;
  background:rgba(255,255,255,0.02);
  backdrop-filter:blur(20px);
}
.sidebar {
  position:absolute; top:0; left:0; width:260px; height:800px;
  border-right:1px solid rgba(255,255,255,0.06);
  padding:40px 24px;
}
.sidebar-item { height:36px; border-radius:8px; background:rgba(255,255,255,0.04); margin-bottom:8px; }
.sidebar-item.active { background:rgba(0,170,69,0.15); border:1px solid rgba(0,170,69,0.3); }
.content-grid {
  position:absolute; top:0; left:260px; right:0; height:800px; padding:32px;
  display:grid; grid-template-columns:1fr 1fr; gap:24px;
}
.card {
  background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06);
  border-radius:12px; padding:24px;
}
.card.wide { grid-column:1/-1; }
.card h3 { font-size:14px; font-weight:600; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:2px; margin-bottom:16px; }
.chart-line { height:4px; background:#00AA45; border-radius:2px; margin-bottom:8px; }
.chart-bar-group { display:flex; gap:8px; align-items:flex-end; height:100px; }
.chart-bar { width:24px; border-radius:4px; background:#00AA45; }

/* Far background elements (parallax layer 2) */
.far-elements {
  position:absolute; top:0; left:0; width:2200px; height:1400px;
  opacity:0.15;
}
.far-elements circle, .far-elements rect { fill:none; stroke:#00AA45; stroke-width:1; }

/* Mid elements (parallax layer 1) */
.mid-elements {
  position:absolute; top:0; left:0; width:2000px; height:1200px;
  opacity:0.3;
}
.mid-elements .node {
  position:absolute; width:8px; height:8px; border-radius:50%; background:#00AA45;
}

/* Floating element near camera (layer 3) */
.near-element {
  position:absolute; width:60px; height:60px;
  border-radius:12px; background:rgba(0,170,69,0.12);
  border:1px solid rgba(0,170,69,0.4);
  backdrop-filter:blur(8px);
  display:flex; align-items:center; justify-content:center;
  font-size:28px;
}

/* Label top-left */
.label {
  position:absolute; top:32px; left:32px; font-size:13px; color:#00AA45; letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4;
}
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">

    <div class="label">Lego 01 · Virtual Camera Movement</div>

    <!-- Parallax Layer 0 (deep background) -->
    <div class="layer layer-0" id="layer0">
      <div class="stars" id="stars"></div>
      <div class="far-elements">
        <svg width="2200" height="1400">
          <circle cx="600" cy="400" r="300" stroke="#00AA45" stroke-width="0.5" fill="none" opacity="0.3"/>
          <circle cx="1400" cy="600" r="200" stroke="#00AA45" stroke-width="0.5" fill="none" opacity="0.2"/>
          <rect x="300" y="500" width="1600" height="2" fill="#00AA45" opacity="0.15"/>
          <rect x="500" y="300" width="2" height="600" fill="#00AA45" opacity="0.15"/>
        </svg>
      </div>
    </div>

    <!-- Parallax Layer 1 (midground system nodes) -->
    <div class="layer layer-1" id="layer1">
      <div class="mid-elements">
        <div class="node" style="top:200px;left:300px;"></div>
        <div class="node" style="top:450px;left:700px;"></div>
        <div class="node" style="top:150px;left:1200px;"></div>
        <div class="node" style="top:600px;left:500px;"></div>
        <div class="node" style="top:700px;left:1000px;"></div>
        <div class="node" style="top:350px;left:1500px;"></div>
        <div class="node" style="top:800px;left:1300px;"></div>
      </div>
    </div>

    <!-- Parallax Layer 2 (main UI dashboard) -->
    <div class="layer layer-2" id="layer2">
      <div class="dashboard">
        <div class="sidebar">
          <div class="sidebar-item active"></div>
          <div class="sidebar-item"></div>
          <div class="sidebar-item"></div>
          <div class="sidebar-item"></div>
        </div>
        <div class="content-grid">
          <div class="card">
            <h3>Revenue</h3>
            <div style="font-size:42px;font-weight:800;color:#fff;margin-bottom:20px;">$128K</div>
            <div class="chart-line" style="width:85%"></div>
            <div class="chart-line" style="width:72%"></div>
            <div class="chart-line" style="width:91%"></div>
          </div>
          <div class="card">
            <h3>Users</h3>
            <div style="font-size:42px;font-weight:800;color:#fff;margin-bottom:20px;">34.2K</div>
            <div class="chart-bar-group">
              <div class="chart-bar" style="height:60%"></div>
              <div class="chart-bar" style="height:85%"></div>
              <div class="chart-bar" style="height:45%"></div>
              <div class="chart-bar" style="height:70%"></div>
              <div class="chart-bar" style="height:95%"></div>
              <div class="chart-bar" style="height:55%"></div>
            </div>
          </div>
          <div class="card wide">
            <h3>Active Projects</h3>
            <div style="display:flex;gap:16px;">
              <div style="flex:1;height:80px;border-radius:8px;background:rgba(0,170,69,0.08);border:1px solid rgba(0,170,69,0.2);padding:16px;">
                <div style="font-size:14px;color:#00AA45;font-weight:600;">Design System</div>
                <div style="font-size:12px;color:rgba(255,255,255,0.4);margin-top:4px;">34 commits today</div>
              </div>
              <div style="flex:1;height:80px;border-radius:8px;background:rgba(0,170,69,0.08);border:1px solid rgba(0,170,69,0.2);padding:16px;">
                <div style="font-size:14px;color:#00AA45;font-weight:600;">API v3</div>
                <div style="font-size:12px;color:rgba(255,255,255,0.4);margin-top:4px;">12 commits today</div>
              </div>
              <div style="flex:1;height:80px;border-radius:8px;background:rgba(0,170,69,0.08);border:1px solid rgba(0,170,69,0.2);padding:16px;">
                <div style="font-size:14px;color:#00AA45;font-weight:600;">Mobile App</div>
                <div style="font-size:12px;color:rgba(255,255,255,0.4);margin-top:4px;">28 commits today</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Parallax Layer 3 (near foreground floating elements) -->
    <div class="layer layer-3" id="layer3">
      <div class="near-element" id="nearElem1" style="top:200px;left:200px;">⚡</div>
      <div class="near-element" id="nearElem2" style="bottom:180px;right:220px;">✦</div>
      <div class="near-element" id="nearElem3" style="top:400px;right:380px;">◆</div>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
// Generate stars
const starsEl = document.getElementById('stars');
for (let i = 0; i < 200; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 1920 + 'px';
  s.style.top = Math.random() * 1080 + 'px';
  s.style.width = s.style.height = (Math.random() * 2 + 1) + 'px';
  s.style.opacity = Math.random() * 0.5 + 0.1;
  starsEl.appendChild(s);
}

const stage = document.getElementById('stage');
const layer0 = document.getElementById('layer0');
const layer1 = document.getElementById('layer1');
const layer2 = document.getElementById('layer2');
const layer3 = document.getElementById('layer3');

// Create a small timeline controller UI at bottom
const ctl = document.createElement('div');
ctl.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:16px;align-items:center;background:rgba(0,0,0,0.7);padding:12px 24px;border-radius:30px;border:1px solid rgba(0,170,69,0.3);backdrop-filter:blur(10px);';
ctl.innerHTML = `
  <button id="btnPlay" style="padding:6px 18px;border-radius:20px;border:1px solid #00AA45;background:transparent;color:#00AA45;cursor:pointer;font-size:13px;font-family:monospace;">▶ PLAY</button>
  <div style="color:rgba(255,255,255,0.3);font-size:12px;font-family:monospace;">camera sequence</div>
`;
document.body.appendChild(ctl);
document.getElementById('btnPlay').addEventListener('click', () => { tl.play(); });

// 7-second timeline: camera moves through the scene
const tl = gsap.timeline({ paused: true });
window.masterTimeline = tl;

// Camera origin
gsap.set(stage, { scale: 1, x: 0, y: 0 });
gsap.set(layer0, { x: 0, y: 0 });
gsap.set(layer1, { x: 0, y: 0 });
gsap.set(layer2, { x: 0, y: 0 });
gsap.set(layer3, { x: 0, y: 0 });

// ── Shot 1: Wide establishing shot, slow zoom-in (0–2s)
tl.to(stage, { scale: 1.15, duration: 2.5, ease: 'power2.inOut' }, 0);
tl.to(layer0, { x: 10, y: 10, duration: 2.5, ease: 'power2.inOut' }, 0);
tl.to(layer1, { x: 5, y: 5, duration: 2.5, ease: 'power2.inOut' }, 0);
tl.to(layer2, { x: 0, y: 0, duration: 2.5, ease: 'power2.inOut' }, 0);
tl.to(layer3, { x: -15, y: -15, duration: 2.5, ease: 'power2.inOut' }, 0);

// ── Shot 2: Sweep right – focus on sidebar + content (2–4s)
tl.to(stage, { x: -120, duration: 2.5, ease: 'power3.inOut' }, 2.5);
tl.to(layer0, { x: -30, duration: 2.5, ease: 'power3.inOut' }, 2.5);
tl.to(layer1, { x: -60, duration: 2.5, ease: 'power3.inOut' }, 2.5);
tl.to(layer2, { x: -120, duration: 2.5, ease: 'power3.inOut' }, 2.5);
tl.to(layer3, { x: -180, duration: 2.5, ease: 'power3.inOut' }, 2.5);

// ── Shot 3: Zoom into chart card (4–6s)
tl.to(stage, { scale: 1.8, x: -250, y: -80, duration: 2.5, ease: 'power2.inOut' }, 5);
tl.to(layer0, { x: -50, y: 20, duration: 2.5, ease: 'power2.inOut' }, 5);
tl.to(layer1, { x: -100, y: -20, duration: 2.5, ease: 'power2.inOut' }, 5);
tl.to(layer2, { x: -250, y: -80, duration: 2.5, ease: 'power2.inOut' }, 5);
tl.to(layer3, { x: -350, y: -140, duration: 2.5, ease: 'power2.inOut' }, 5);

// ── Shot 4: Pull back to wide (6–8s)
tl.to(stage, { scale: 1, x: 0, y: 0, duration: 2, ease: 'power2.inOut' }, 7.5);
tl.to(layer0, { x: 0, y: 0, duration: 2, ease: 'power2.inOut' }, 7.5);
tl.to(layer1, { x: 0, y: 0, duration: 2, ease: 'power2.inOut' }, 7.5);
tl.to(layer2, { x: 0, y: 0, duration: 2, ease: 'power2.inOut' }, 7.5);
tl.to(layer3, { x: 0, y: 0, duration: 2, ease: 'power2.inOut' }, 7.5);

// Float label animation on near elements
tl.to('#nearElem1', { y: -20, x: 10, rotation: 10, duration: 1.5, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 0);
tl.to('#nearElem2', { y: 15, x: -10, rotation: -8, duration: 1.8, ease: 'sine.inOut', yoyo: true, repeat: 2 }, 0.5);
tl.to('#nearElem3', { y: -12, x: 8, rotation: 6, duration: 1.3, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 1);
</script>
</body>
</html>
