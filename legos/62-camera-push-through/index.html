<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>62 – Camera Push-Through + Match Cut</title>
<style>
:root { --bg:#0a0612; --bg-mid:#28124a; --bg-mid2:#160a2b; --accent:#a78bfa; --grad-a:#ffffff; --grad-b:#c4b5fd; --grad-c:#8b5cf6; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.5; z-index:100; }

/* depth layers — different parallax rates sell 3D as the camera flies forward */
.bg    { position:absolute; inset:-15%; z-index:0; will-change:transform;
  background:radial-gradient(ellipse 70% 60% at 50% 45%, var(--bg-mid) 0%, var(--bg-mid2) 45%, var(--bg) 80%); }
.specks{ position:absolute; inset:-15%; z-index:1; will-change:transform; }
.speck { position:absolute; width:4px; height:4px; border-radius:50%; background:rgba(167,139,250,0.5); }

.flyword { position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; }
.flyword .w { position:absolute; font-weight:900; letter-spacing:-4px; white-space:nowrap; line-height:1; font-size:190px;
  background:linear-gradient(180deg, var(--grad-a), var(--grad-b) 55%, var(--grad-c));
  -webkit-background-clip:text; background-clip:text; color:transparent; will-change:transform, filter; opacity:0; }

/* match-cut hero scene B */
.sceneB { position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; }
.sceneB .hero { font-size:120px; font-weight:900; letter-spacing:-3px;
  background:linear-gradient(180deg, var(--grad-a), var(--grad-c)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.sceneB .sub { margin-top:18px; font-family:'Courier New',monospace; font-size:22px; letter-spacing:8px; color:var(--accent); text-transform:uppercase; opacity:0; }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid var(--accent);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="bg" id="bg"></div>
  <div class="specks" id="specks"></div>
  <div class="label" id="label"></div>

  <div class="flyword" id="flyword"></div>

  <div class="sceneB" id="sceneB">
    <div class="hero" id="heroWord"></div>
    <div class="sub" id="heroSub"></div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════ EDIT EVERYTHING HERE ════════════════ */
const CONFIG = {
  label: 'Lego 62 · Camera Push-Through + Match Cut',
  // words the camera flies THROUGH, one after another; last hands off to the hero
  flyWords: ['Protecting', 'What', 'Matters'],
  heroWord: 'WasteProtection',
  heroSub: 'one platform · every operation',
  flyScale: 34,           // how far each word blows past the lens
  panPerWord: 260,        // lateral drift (px) so it reads as "flying past", not zooming
  secondsPerWord: 1.0,
  colors: { bg:'#0a0612', bgMid:'#28124a', bgMid2:'#160a2b', accent:'#a78bfa',
            gradTop:'#ffffff', gradMid:'#c4b5fd', gradBot:'#8b5cf6' }
};
/* ═══════════════════════════════════════════════════════ */

const C = CONFIG.colors, _r = document.documentElement.style;
_r.setProperty('--bg', C.bg); _r.setProperty('--bg-mid', C.bgMid); _r.setProperty('--bg-mid2', C.bgMid2);
_r.setProperty('--accent', C.accent);
_r.setProperty('--grad-a', C.gradTop); _r.setProperty('--grad-b', C.gradMid); _r.setProperty('--grad-c', C.gradBot);
document.getElementById('label').textContent = CONFIG.label;
document.getElementById('heroWord').textContent = CONFIG.heroWord;
document.getElementById('heroSub').textContent = CONFIG.heroSub;

// scatter parallax specks
const specks = document.getElementById('specks');
for (let i = 0; i < 60; i++) {
  const s = document.createElement('div'); s.className = 'speck';
  s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
  s.style.opacity = (Math.random() * 0.6 + 0.2); s.style.transform = `scale(${Math.random() * 1.5 + 0.5})`;
  specks.appendChild(s);
}

const flyword = document.getElementById('flyword');

function play() {
  gsap.killTweensOf('*');
  flyword.innerHTML = '';
  gsap.set('#bg', { scale: 1, x: 0, y: 0 });
  gsap.set('#specks', { scale: 1, x: 0, y: 0 });
  gsap.set('#sceneB', { opacity: 0 });
  gsap.set('#heroWord', { scale: 0.7, opacity: 0 });
  gsap.set('#heroSub', { opacity: 0, y: 16 });

  const els = CONFIG.flyWords.map(w => { const d = document.createElement('div'); d.className = 'w'; d.textContent = w; flyword.appendChild(d); return d; });
  gsap.set(els, { opacity: 0, scale: 0.18, filter: 'blur(6px)', x: 0 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // background creeps forward the whole time (slow dolly), foreground specks faster — parallax
  tl.to('#bg', { scale: 1.25, duration: CONFIG.flyWords.length * CONFIG.secondsPerWord + 1.5, ease: 'power1.inOut' }, 0);
  tl.to('#specks', { scale: 1.9, duration: CONFIG.flyWords.length * CONFIG.secondsPerWord + 1.5, ease: 'power1.in' }, 0);

  const SEG = CONFIG.secondsPerWord;
  els.forEach((el, i) => {
    const at = i * SEG;
    const dir = i % 2 === 0 ? 1 : -1;   // alternate which side each word exits
    // arrive (ease-out, weighted) with motion blur clearing
    tl.fromTo(el, { opacity: 0, scale: 0.18, filter: 'blur(8px)', x: -dir * 80 },
      { opacity: 1, scale: 1, filter: 'blur(0px)', x: 0, duration: 0.55, ease: 'expo.out' }, at);
    // fly THROUGH camera: scale past frame + lateral pan + motion blur ramps up
    tl.to(el, { scale: CONFIG.flyScale, x: dir * CONFIG.panPerWord, opacity: 0, filter: 'blur(14px)',
      duration: 0.55, ease: 'power3.in' }, at + 0.55);
  });

  // ── MATCH CUT landing: hero resolves out of the last push, soft expo.out "stick" ──
  const land = CONFIG.flyWords.length * SEG;
  tl.set('#sceneB', { opacity: 1 }, land - 0.05);
  tl.fromTo('#heroWord', { scale: 3.4, opacity: 0, filter: 'blur(16px)' },
    { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 1.2, ease: 'expo.out' }, land - 0.05);
  // settling breath — the camera has weight
  tl.to('#heroWord', { scale: 1.03, duration: 1.0, ease: 'sine.inOut', yoyo: true, repeat: 1 }, land + 1.2);
  tl.to('#heroSub', { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out' }, land + 0.7);

  tl.to({}, { duration: 1.6 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
