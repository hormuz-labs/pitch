<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>12 – Masking & Rotoscoping</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#0D0D0D; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center; }

.label {
  position:absolute; top:32px; left:32px; font-size:13px; color:#00AA45; letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4; z-index:100;
}

/* Phone mockup */
.phone-mock {
  position:relative; width:320px; height:660px;
  border-radius:40px; border:3px solid rgba(255,255,255,0.12);
  background: #111; overflow:hidden;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8);
}
.phone-notch {
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:140px; height:28px; background:#0D0D0D;
  border-radius:0 0 16px 16px; z-index:30;
}
.phone-screen {
  position:absolute; inset:0; overflow:hidden;
}

/* Masked content: app UI behind phone bezel */
.app-ui {
  position:absolute; inset:0;
  background: linear-gradient(180deg, #0a1a10 0%, #0D0D0D 100%);
  padding:80px 20px 30px;
  clip-path: inset(0 0 0 0);
}
.app-header {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:24px; padding:0 8px;
}
.app-header .dot { width:8px; height:8px; border-radius:50%; background:#00AA45; }
.app-card {
  background:rgba(255,255,255,0.03); border:1px solid rgba(0,170,69,0.12);
  border-radius:14px; padding:16px; margin-bottom:12px;
}
.app-card.row { display:flex; gap:12px; align-items:center; }
.app-avatar {
  width:44px; height:44px; border-radius:50%;
  background: linear-gradient(135deg, #00AA45, #219653);
  flex-shrink:0;
}
.app-card h4 { font-size:14px; font-weight:600; margin-bottom:4px; }
.app-card p { font-size:12px; color:rgba(255,255,255,0.4); }
.app-badge {
  display:inline-block; padding:2px 10px; border-radius:30px;
  border:1px solid rgba(0,170,69,0.3); font-size:10px; color:#00AA45;
}

/* ── Background reveal ring ── */
.bg-reveal {
  position:absolute; inset:0;
  background: radial-gradient(ellipse at 50% 50%, #00AA45 0%, transparent 70%);
  opacity:0; mix-blend-mode:overlay;
  clip-path: circle(0% at 50% 50%);
}

/* Clip-path text mask example */
.mask-text-demo {
  position:absolute; right:120px; top:50%; transform:translateY(-50%);
  text-align:center;
}
.mask-text-demo .preview {
  font-size:14px; color:rgba(255,255,255,0.2); margin-bottom:16px; font-family:'Courier New',monospace;
}
.mask-clip-text {
  font-size:96px; font-weight:900; line-height:1;
  background: linear-gradient(135deg, #00AA45, #fff, #00AA45);
  -webkit-background-clip: text;
  background-clip: text;
  color:transparent;
  filter: grayscale(1) contrast(0.3);
}

/* Hand silhouette mask example */
.hand-mask-area {
  position:absolute; left:120px; top:50%; transform:translateY(-50%);
  width:200px; height:300px;
  overflow:hidden;
}
.hand-shape {
  width:100%; height:100%;
  background:rgba(0,170,69,0.08);
  clip-path: polygon(30% 0%, 70% 0%, 75% 30%, 100% 20%, 100% 40%, 80% 50%, 85% 80%, 60% 100%, 40% 100%, 15% 80%, 20% 50%, 0% 40%, 0% 20%, 25% 30%);
}
.hand-shape-bg {
  position:absolute; inset:0;
  clip-path: polygon(30% 0%, 70% 0%, 75% 30%, 100% 20%, 100% 40%, 80% 50%, 85% 80%, 60% 100%, 40% 100%, 15% 80%, 20% 50%, 0% 40%, 0% 20%, 25% 30%);
  overflow:hidden;
}
.hand-shape-bg video-bg {
  position:absolute; inset:-20px; display:block;
  background: linear-gradient(135deg, #00AA45, #0070f3, #7c3aed, #00AA45);
  background-size:400% 400%;
}

#replayBtn {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(0,170,69,0.4);
  background:rgba(0,0,0,0.7); color:#00AA45; cursor:pointer; font-size:13px;
  font-family:monospace; backdrop-filter:blur(10px);
}
</style>
</head>
<body>
<div class="vp">
  <div class="label">Lego 12 · Masking & Rotoscoping</div>

  <!-- Phone mockup (UI masked inside phone frame) -->
  <div class="phone-mock" id="phoneMock">
    <div class="phone-notch"></div>
    <div class="phone-screen">
      <div class="app-ui" id="appUI">
        <div class="app-header">
          <span style="font-size:18px;font-weight:700;">peerlist</span>
          <div class="dot"></div>
        </div>
        <div class="app-card row">
          <div class="app-avatar"></div>
          <div style="flex:1;">
            <h4>Michael Rivera</h4>
            <p>Full-Stack Engineer</p>
          </div>
          <div class="app-badge">✓</div>
        </div>
        <div class="app-card">
          <h4>shipped/design-system</h4>
          <p>42 commits · 3 hours ago</p>
        </div>
        <div class="app-card">
          <h4>Verified GitHub</h4>
          <p>1,426 contributions in 2025</p>
        </div>
        <div class="app-card row" style="opacity:0.5;">
          <div style="flex:1;"><h4>Scroll</h4><p>See what your network built</p></div>
          <span style="color:#00AA45;">→</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Masked text gradient demo -->
  <div class="mask-text-demo">
    <div class="preview">masked text · clip-path gradient</div>
    <div class="mask-clip-text" id="maskText">PEERLIST</div>
  </div>

  <!-- Hand shape masked area -->
  <div class="hand-mask-area">
    <div class="preview" style="position:absolute;top:-40px;left:0;font-size:12px;color:rgba(255,255,255,0.15);font-family:'Courier New',monospace;">rotoscope mask</div>
    <div class="hand-shape-bg" id="handMask">
      <div class="video-bg" id="handGradient" style="position:absolute;inset:-20px;background:linear-gradient(135deg,#00AA45,#0070f3,#7c3aed,#00AA45);background-size:400% 400%;"></div>
    </div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
function play() {
  gsap.killTweensOf('*');

  // Reset phone
  gsap.set('#appUI', { clipPath: 'inset(0 0 0 100%)' });
  gsap.set('#phoneMock', { y: 20, opacity: 0 });
  gsap.set('#maskText', { filter: 'grayscale(1) contrast(0.3)', opacity: 0.3 });
  gsap.set('#handGradient', { backgroundPosition: '0% 50%', opacity: 0 });
  gsap.set('#handMask', { clipPath: 'polygon(30% 0%, 70% 0%, 75% 30%, 100% 20%, 100% 40%, 80% 50%, 85% 80%, 60% 100%, 40% 100%, 15% 80%, 20% 50%, 0% 40%, 0% 20%, 25% 30%)' });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // ── Phone floats in ──
  tl.to('#phoneMock', { y: 0, opacity: 1, duration: 0.8, ease: 'power3.out' }, 0.3);

  // ── Phone UI reveals via clip-path mask (0.5–2s) ──
  tl.to('#appUI', {
    clipPath: 'inset(0 0 0 0%)',
    duration: 1.5, ease: 'power3.out'
  }, 0.8);

  // ── App cards stagger in ──
  tl.from('#appUI .app-card, #appUI .app-header', {
    opacity: 0, y: 15, duration: 0.5,
    stagger: 0.08, ease: 'power2.out'
  }, 1.2);

  // ── Masked text restores color ──
  tl.to('#maskText', {
    filter: 'grayscale(0) contrast(1)',
    opacity: 1, duration: 1.8, ease: 'power3.out'
  }, 1.5);

  // ── Hand mask gradient animates (rotoscope feel) ──
  tl.to('#handGradient', { opacity: 1, duration: 0.5 }, 2.0);
  tl.to('#handGradient', {
    backgroundPosition: '100% 50%',
    duration: 3, ease: 'none'
  }, 2.0);
  // Animate the clip-path of hand moving slightly
  tl.to('#handMask', {
    clipPath: 'polygon(30% 0%, 72% 0%, 77% 28%, 100% 22%, 100% 42%, 80% 52%, 83% 78%, 60% 100%, 40% 100%, 15% 78%, 20% 52%, 0% 42%, 0% 22%, 25% 28%)',
    duration: 2, ease: 'sine.inOut', yoyo: true, repeat: 1
  }, 2.0);

  tl.to({}, { duration: 1 }, 5);
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
