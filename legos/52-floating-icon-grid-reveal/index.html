<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>52 – Floating Icon Grid Reveal</title>
<style>
:root { --bg:#0a0612; --bg-mid:#28124a; --bg-mid2:#160a2b; --accent:#a78bfa; --tile-glow:rgba(139,92,246,0.15); }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; }
.bg { position:absolute; inset:0; z-index:0; background:radial-gradient(ellipse 75% 65% at 50% 45%, var(--bg-mid) 0%, var(--bg-mid2) 42%, var(--bg) 78%); }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.5; z-index:100; }

.field { position:absolute; inset:0; z-index:1; }
.tile {
  position:absolute; width:120px; height:120px; border-radius:26px;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(20px); display:flex; align-items:center; justify-content:center; font-size:54px;
  box-shadow:inset 0 0 30px var(--tile-glow), 0 18px 50px rgba(0,0,0,0.4);
  will-change:transform, opacity; opacity:0;
}

.center { position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
.intro-k { font-family:'Courier New',monospace; font-size:18px; letter-spacing:8px; color:var(--accent); text-transform:uppercase; opacity:0; margin-bottom:18px; }
.intro-h { font-size:84px; font-weight:800; letter-spacing:-2px; opacity:0; }
.intro-h .reg { font-size:36px; vertical-align:super; color:var(--accent); }
.scrim { position:absolute; inset:0; z-index:2; background:radial-gradient(ellipse 40% 30% at 50% 50%, rgba(10,6,18,0.85), transparent 70%); opacity:0; }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid var(--accent);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="bg"></div>
  <div class="label" id="label"></div>

  <div class="field" id="field"></div>
  <div class="scrim" id="scrim"></div>
  <div class="center">
    <div class="intro-k" id="introK"></div>
    <div class="intro-h" id="introH"></div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════ EDIT EVERYTHING HERE ════════════════ */
const CONFIG = {
  label: 'Lego 52 · Floating Icon Grid Reveal',
  kicker: 'introducing',
  product: 'WasteProtection',
  trademark: '®',                 // shown as superscript; set '' to hide
  icons: ['💬','🛡️','⚡','🫆','📨','📦','🗄️','🔒','📍','♻️','🛰️','📊'],
  colors: {
    bg:      '#0a0612',
    bgMid:   '#28124a',
    bgMid2:  '#160a2b',
    accent:  '#a78bfa',
    tileGlow:'rgba(139,92,246,0.15)'  // inner glow on each glass tile
  }
};
/* ═══════════════════════════════════════════════════════ */

const _root = document.documentElement.style;
_root.setProperty('--bg', CONFIG.colors.bg);
_root.setProperty('--bg-mid', CONFIG.colors.bgMid);
_root.setProperty('--bg-mid2', CONFIG.colors.bgMid2);
_root.setProperty('--accent', CONFIG.colors.accent);
_root.setProperty('--tile-glow', CONFIG.colors.tileGlow);
document.getElementById('label').textContent = CONFIG.label;
document.getElementById('introK').textContent = CONFIG.kicker;
document.getElementById('introH').innerHTML = CONFIG.product + (CONFIG.trademark ? '<span class="reg">' + CONFIG.trademark + '</span>' : '');

const field = document.getElementById('field');
const ICONS = CONFIG.icons;
// positions kept ≥120px inside the 1920×1080 frame, clear of the central headline
const SPOTS = [
  [180, 180], [430, 360], [250, 620], [520, 760], [150, 880],
  [1620, 180], [1430, 380], [1700, 600], [1480, 800], [1640, 900],
  [820, 150], [1080, 880]
];
let drifts = [];

function play() {
  gsap.killTweensOf('*');
  drifts.forEach(d => d.kill()); drifts = [];
  field.innerHTML = '';

  const tiles = SPOTS.map((pos, i) => {
    const t = document.createElement('div');
    t.className = 'tile'; t.textContent = ICONS[i % ICONS.length];
    t.style.left = pos[0] + 'px'; t.style.top = pos[1] + 'px';
    field.appendChild(t); return t;
  });

  gsap.set(tiles, { opacity: 0, scale: 0.5, y: 40 });
  gsap.set('#introK', { opacity: 0, y: 14 });
  gsap.set('#introH', { opacity: 0, y: 24, scale: 0.96 });
  gsap.set('#scrim', { opacity: 0 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  tl.to(tiles, { opacity: 1, scale: 1, y: 0, duration: 0.8, ease: 'back.out(1.6)', stagger: { each: 0.07, from: 'random' } }, 0.2);
  tl.add(() => {
    tiles.forEach(t => drifts.push(gsap.to(t, {
      y: '+=' + gsap.utils.random(-22, 22), x: '+=' + gsap.utils.random(-16, 16), rotation: gsap.utils.random(-5, 5),
      duration: gsap.utils.random(2.5, 4.5), ease: 'sine.inOut', yoyo: true, repeat: -1 })));
  }, 1.0);
  tl.to('#scrim', { opacity: 1, duration: 0.9, ease: 'power2.out' }, 1.4);
  tl.to('#introK', { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 1.7);
  tl.to('#introH', { opacity: 1, y: 0, scale: 1, duration: 1.0, ease: 'power3.out' }, 1.95);
  tl.to({}, { duration: 2.6 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
