<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>33 – Depth of Field & Camera Blur</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#07070a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center; perspective: 1200px; }

.label {
  position:absolute; top:32px; left:32px; font-size:13px; color:#00e855; letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4; z-index:100;
}

/* 3D Lens Stage */
.stage {
  width: 1200px;
  height: 700px;
  transform-style: preserve-3d;
  position: relative;
  will-change: transform;
}

/* Shared Card styles */
.depth-card {
  position: absolute;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.06);
  padding: 30px;
  background: rgba(15, 15, 22, 0.45);
  backdrop-filter: blur(20px);
  will-change: filter, transform;
}

/* Card 1: Foreground (Macro Detail, Bottom Left, very close to camera) */
.fg-card {
  width: 420px;
  height: 260px;
  bottom: 40px;
  left: 60px;
  transform: translateZ(280px); /* extreme positive Z */
  border-color: rgba(0, 240, 255, 0.2);
  box-shadow: 0 40px 80px rgba(0,0,0,0.6);
  z-index: 30;
}
.token {
  width: 50px; height: 50px; border-radius: 12px;
  background: radial-gradient(circle, #00f0ff, #0077aa);
  box-shadow: 0 0 20px rgba(0,240,255,0.4);
  margin-bottom: 24px;
}

/* Card 2: Midground (Core UI Dashboard, Centered) */
.mg-card {
  width: 700px;
  height: 440px;
  top: 100px;
  left: 280px;
  transform: translateZ(0px); /* default focus plane */
  border-color: rgba(0, 232, 85, 0.15);
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  z-index: 20;
}
.mg-header { display:flex; justify-content:space-between; margin-bottom: 30px; }
.mg-title { font-size: 11px; font-family: monospace; color: #00e855; letter-spacing: 2px; }
.mg-chart { height: 160px; border-bottom: 1px solid rgba(255,255,255,0.1); position:relative; display:flex; align-items:flex-end; gap:4px; }
.mg-bar { flex:1; background: rgba(0,232,85,0.25); border: 1px solid rgba(0,232,85,0.5); border-bottom:0; }

/* Card 3: Background (Systems Map, Far Back) */
.bg-card {
  width: 1000px;
  height: 550px;
  top: 40px;
  right: -80px;
  transform: translateZ(-250px); /* negative Z */
  border-color: rgba(255, 255, 255, 0.03);
  background: rgba(10, 10, 15, 0.25);
  z-index: 10;
}
.bg-nodes { opacity: 0.15; position:absolute; inset: 0; }

/* Focus Telemetry HUD Overlay */
.focus-hud {
  position:absolute; bottom:120px; left:50%; transform:translateX(-50%);
  border: 1px solid rgba(255,255,255,0.08); background:rgba(0,0,0,0.6);
  padding: 10px 24px; border-radius:30px; font-family: monospace; font-size: 12px;
  color: rgba(255,255,255,0.5); z-index:100; pointer-events:none;
}
.hud-active { color: #00e855; font-weight: 700; }

#replayBtn {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(0,170,69,0.4);
  background:rgba(0,0,0,0.7); color:#00AA45; cursor:pointer; font-size:13px;
  font-family:monospace; backdrop-filter:blur(10px);
}
</style>
</head>
<body>
<div class="vp">
  <div class="label">Lego 33 · Depth of Field & Camera Blur</div>

  <div class="stage" id="stage">
    
    <!-- Background Card (Far focus plane, -250px) -->
    <div class="depth-card bg-card" id="cardBG">
      <div style="font-size:12px; font-family:monospace; color:rgba(255,255,255,0.3); letter-spacing:1px; margin-bottom:12px;">SYSTEMS_MAP // CLOUD_NODES</div>
      <div style="font-size:32px; font-weight:700; color:rgba(255,255,255,0.25);">Cluster Topology</div>
      <svg class="bg-nodes" viewBox="0 0 1000 550">
        <circle cx="200" cy="150" r="10" fill="rgba(255,255,255,0.2)"/>
        <circle cx="450" cy="350" r="15" fill="rgba(255,255,255,0.2)"/>
        <circle cx="800" cy="200" r="12" fill="rgba(255,255,255,0.2)"/>
        <line x1="200" y1="150" x2="450" y2="350" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
        <line x1="450" y1="350" x2="800" y2="200" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
      </svg>
    </div>

    <!-- Midground Card (Default focus plane, 0px) -->
    <div class="depth-card mg-card" id="cardMG">
      <div class="mg-header">
        <div class="mg-title">WORKSPACE // WORKLOADS</div>
        <div style="font-size:12px; font-family:monospace; color:rgba(255,255,255,0.3);">NODE_01</div>
      </div>
      <div style="font-size:24px; font-weight:800; margin-bottom:4px;">Operational Capacity</div>
      <div style="font-size:48px; font-weight:800; color:#00e855; margin-bottom:30px;">98.24%</div>
      
      <div class="mg-chart">
        <div class="mg-bar" style="height:30%"></div>
        <div class="mg-bar" style="height:45%"></div>
        <div class="mg-bar" style="height:60%"></div>
        <div class="mg-bar" style="height:40%"></div>
        <div class="mg-bar" style="height:75%"></div>
        <div class="mg-bar" style="height:90%"></div>
        <div class="mg-bar" style="height:55%"></div>
      </div>
    </div>

    <!-- Foreground Card (Macro/Macro focus plane, +280px) -->
    <div class="depth-card fg-card" id="cardFG">
      <div class="token"></div>
      <div style="font-size:11px; font-family:monospace; color:#00f0ff; letter-spacing:2px; margin-bottom:4px;">TOKEN_CREDENTIALS</div>
      <div style="font-size:20px; font-weight:700; margin-bottom:12px;">Active Session</div>
      <div style="font-size:12px; font-family:monospace; color:rgba(255,255,255,0.4);">ID // 84fa-92cd-11ee</div>
    </div>

  </div>

  <!-- Telemetry HUD -->
  <div class="focus-hud">
    FOCUS STATE: <span id="hudState" class="hud-active">FOREGROUND_MACRO</span> // LENS_BREATHING: <span id="hudBreath">0.00%</span>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
function play() {
  gsap.killTweensOf('*');

  // Reset
  gsap.set('#stage', { rotateY: -15, scale: 1.0, x: 0, y: 0 });
  
  // Set initial blurs (Foreground is sharp, others are heavily blurred)
  gsap.set('#cardFG', { filter: 'blur(0px)', scale: 1.0 });
  gsap.set('#cardMG', { filter: 'blur(15px)', scale: 0.95 });
  gsap.set('#cardBG', { filter: 'blur(28px)', scale: 0.9 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // ── Phase 1: Foreground Macro Focus (0s - 2.5s)
  tl.to({}, {
    duration: 2.0,
    onStart: () => {
      document.getElementById('hudState').textContent = 'FOREGROUND_MACRO';
      document.getElementById('hudBreath').textContent = '0.00%';
    }
  });

  // ── Phase 2: Focus pull to Midground Dashboard + Lens Breathing (2.5s - 5.5s)
  // Slight camera lens breathing: scale stage slightly up as we adjust focus plane, shift camera pan
  tl.to('#stage', {
    scale: 1.05,
    x: -60,
    y: -20,
    rotateY: -5,
    duration: 1.8,
    ease: 'power2.inOut'
  }, 2.0);

  tl.to('#cardFG', {
    filter: 'blur(12px)',
    scale: 0.9,
    duration: 1.8,
    ease: 'power2.inOut'
  }, 2.0);

  tl.to('#cardMG', {
    filter: 'blur(0px)',
    scale: 1.0,
    duration: 1.8,
    ease: 'power2.inOut',
    onStart: () => {
      document.getElementById('hudState').textContent = 'MIDGROUND_CORE_UI';
      document.getElementById('hudBreath').textContent = '+5.00%';
    }
  }, 2.0);

  tl.to('#cardBG', {
    filter: 'blur(14px)',
    scale: 0.95,
    duration: 1.8,
    ease: 'power2.inOut'
  }, 2.0);


  // ── Phase 3: Focus pull to Background Cluster Map + Lens Breathing (5.5s - 8.5s)
  tl.to('#stage', {
    scale: 1.12,
    x: -120,
    y: -40,
    rotateY: 5,
    duration: 1.8,
    ease: 'power2.inOut'
  }, 5.0);

  tl.to('#cardMG', {
    filter: 'blur(10px)',
    scale: 0.92,
    duration: 1.8,
    ease: 'power2.inOut'
  }, 5.0);

  tl.to('#cardBG', {
    filter: 'blur(0px)',
    scale: 1.0,
    duration: 1.8,
    ease: 'power2.inOut',
    onStart: () => {
      document.getElementById('hudState').textContent = 'BACKGROUND_LANDSCAPE';
      document.getElementById('hudBreath').textContent = '+12.00%';
    }
  }, 5.0);

  tl.to('#cardFG', {
    filter: 'blur(20px)',
    scale: 0.8,
    duration: 1.8,
    ease: 'power2.inOut'
  }, 5.0);


  // ── Phase 4: Settle camera back to general middle ground wide (8.5s)
  tl.to('#stage', {
    scale: 1.0,
    x: 0,
    y: 0,
    rotateY: -10,
    duration: 2.2,
    ease: 'power2.inOut'
  }, 8.0);

  tl.to('#cardFG', { filter: 'blur(5px)', scale: 0.95, duration: 2.2, ease: 'power2.inOut' }, 8.0);
  tl.to('#cardMG', { filter: 'blur(0px)', scale: 1.0, duration: 2.2, ease: 'power2.inOut' }, 8.0);
  tl.to('#cardBG', { filter: 'blur(8px)', scale: 0.95, duration: 2.2, ease: 'power2.inOut' }, 8.0);
  
  tl.to({}, {
    duration: 0.1,
    onStart: () => {
      document.getElementById('hudState').textContent = 'WIDE_PARALLAX_SETTLED';
      document.getElementById('hudBreath').textContent = '0.00%';
    }
  }, 8.5);

  tl.to({}, { duration: 0.5 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
