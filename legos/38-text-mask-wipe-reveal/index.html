<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>38 – Mask Wipe Reveals</title>
<style>
:root { --accent:#00AA45; --accent-rgb:0,170,69; --accent-2:#00e855; --accent-2-rgb:0,232,85; --bg:#0D0D0D; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; padding-left:200px; gap:6px; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4; z-index:100; }

.kicker { font-family:'Courier New',monospace; font-size:22px; letter-spacing:8px; color:var(--accent); text-transform:uppercase; margin-bottom:18px;
  clip-path: inset(0 100% 0 0); }

/* Each headline line clips with a left→right wipe. The bar is an overlay that sweeps. */
.line { position:relative; overflow:hidden; }
.line .text { font-size:104px; font-weight:900; letter-spacing:-2px; line-height:1.12;
  display:inline-block; transform:translateY(105%); }
.line .text .accent { color:var(--accent); }

/* Sweeping reveal bar drawn over each line */
.line .bar { position:absolute; top:0; left:0; height:100%; width:0%; background:var(--accent); z-index:3; }

.subline { margin-top:30px; font-size:24px; color:rgba(255,255,255,0.4); letter-spacing:2px;
  clip-path: inset(0 0 0 100%); }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(var(--accent-rgb),0.4);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="cfgLabel">Lego 38 · Mask Wipe Reveals</div>

  <div class="kicker" id="kicker">For the people who build</div>
  <div class="line"><span class="text" id="t1">Ideas become</span><span class="bar" id="b1"></span></div>
  <div class="line"><span class="text" id="t2"><span class="accent">products</span> in public.</span><span class="bar" id="b2"></span></div>
  <div class="line"><span class="text" id="t3">Get seen. Get hired.</span><span class="bar" id="b3"></span></div>
  <div class="subline" id="sub">peerlist.io — the professional network for builders</div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
function play() {
  gsap.killTweensOf('*');
  gsap.set('.line .text', { y: '105%' });
  gsap.set('.line .bar', { width: '0%', left: '0%' });
  gsap.set('#kicker', { clipPath: 'inset(0 100% 0 0)' });
  gsap.set('#sub', { clipPath: 'inset(0 0 0 100%)' });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // kicker types-in via clip wipe
  tl.to('#kicker', { clipPath: 'inset(0 0% 0 0)', duration: 0.7, ease: 'power3.inOut' }, 0.2);

  // Per line: green bar sweeps across, text slides up behind it, bar exits right.
  const lines = [['#t1', '#b1'], ['#t2', '#b2'], ['#t3', '#b3']];
  lines.forEach(([t, b], i) => {
    const at = 0.7 + i * 0.55;
    tl.set(b, { left: '0%', width: '0%' }, at);
    tl.to(b, { width: '100%', duration: 0.28, ease: 'power2.in' }, at);          // bar grows from left
    tl.set(t, { y: '0%' }, at + 0.28);                                           // reveal text under bar
    tl.to(b, { left: '100%', width: '0%', duration: 0.34, ease: 'power2.out' }, at + 0.28); // bar slides off right
  });

  // subline wipe in from right
  tl.to('#sub', { clipPath: 'inset(0 0 0 0%)', duration: 0.8, ease: 'power3.inOut' }, 2.5);

  tl.to({}, { duration: 1.5 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>

<script>
/* ════════ EDIT COLORS / LABEL HERE — applies live via CSS variables ════════ */
const CONFIG = {
  label: "Lego 38 · Mask Wipe Reveals",
  colors: {
    accent:     '#00AA45',   // primary brand accent
    accentRgb:  '0,170,69',  // same accent, for rgba() glows/shadows
    accent2:    '#00e855',   // secondary / brighter accent (used by some scenes)
    accent2Rgb: '0,232,85',
    bg:         '#0D0D0D'    // page background
  }
};
/* ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  var c = CONFIG.colors, r = document.documentElement.style;
  r.setProperty('--accent', c.accent);       r.setProperty('--accent-rgb', c.accentRgb);
  r.setProperty('--accent-2', c.accent2);     r.setProperty('--accent-2-rgb', c.accent2Rgb);
  r.setProperty('--bg', c.bg);
  var lab = document.getElementById('cfgLabel'); if (lab) lab.textContent = CONFIG.label;
})();
</script>
</body>
</html>
