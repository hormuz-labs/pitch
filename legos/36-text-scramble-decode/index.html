<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>36 – Text Scramble / Decode</title>
<style>
:root { --accent:#00AA45; --accent-rgb:0,170,69; --accent-2:#00e855; --accent-2-rgb:0,232,85; --bg:#0D0D0D; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:48px; }

.scan-overlay { position:absolute; inset:0; pointer-events:none; z-index:5;
  background:linear-gradient(rgba(var(--accent-rgb),0.0) 50%, rgba(var(--accent-rgb),0.02) 50%); background-size:100% 4px; }

.decode-line { text-align:center; }
.kicker { font-family:'Courier New',monospace; font-size:20px; letter-spacing:10px; color:var(--accent); text-transform:uppercase; opacity:0; }
.headline { font-size:120px; font-weight:900; letter-spacing:-3px; line-height:1; }
.headline .ch { display:inline-block; }
.headline .accent { color:var(--accent); }
.subline { font-family:'Courier New',monospace; font-size:24px; letter-spacing:4px; color:rgba(255,255,255,0.45); text-transform:uppercase; }
.subline .ch { display:inline-block; white-space:pre; }

.bracket { color:rgba(var(--accent-rgb),0.5); font-weight:400; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4; z-index:100; }
#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(var(--accent-rgb),0.4);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="scan-overlay"></div>
  <div class="label" id="cfgLabel">Lego 36 · Text Scramble / Decode</div>

  <div class="decode-line"><span class="kicker" id="kicker">[ incoming transmission ]</span></div>
  <div class="decode-line"><div class="headline" id="headline"></div></div>
  <div class="decode-line"><div class="subline" id="subline"></div></div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const GLYPHS = '!<>-_\\/[]{}—=+*^?#01ABCDEF$%&@';
const rnd = () => GLYPHS[Math.floor(Math.random() * GLYPHS.length)];

// Build per-character spans. accentSet = indices (in final string) rendered green.
function buildScramble(container, text, accentRanges = []) {
  container.innerHTML = '';
  const chars = [];
  [...text].forEach((finalCh, i) => {
    const span = document.createElement('span');
    span.className = 'ch';
    if (accentRanges.some(([a, b]) => i >= a && i < b)) span.classList.add('accent');
    span.textContent = finalCh === ' ' ? ' ' : rnd();
    container.appendChild(span);
    chars.push({ span, finalCh: finalCh === ' ' ? ' ' : finalCh });
  });
  return chars;
}

// Decode a set of char objects: each settles after a per-char delay, scrambling until then.
function decode(tl, chars, startAt, settleSpread = 0.9, scrambleHz = 0.045) {
  chars.forEach((c, i) => {
    const settle = startAt + (i / chars.length) * settleSpread + Math.random() * 0.18;
    // scramble ticks until settle
    const proxy = { t: 0 };
    tl.to(proxy, {
      t: 1, duration: settle - startAt, ease: 'none',
      onUpdate: () => { if (c.finalCh !== ' ') c.span.textContent = rnd(); },
      onComplete: () => { c.span.textContent = c.finalCh; }
    }, startAt);
  });
}

const headline = document.getElementById('headline');
const subline = document.getElementById('subline');
const kicker = document.getElementById('kicker');

function play() {
  gsap.killTweensOf('*');
  gsap.set(kicker, { opacity: 0, y: 10 });

  // "PEERLIST" with PEER accented (indices 0-4)
  const hChars = buildScramble(headline, 'PEERLIST', [[0, 4]]);
  const sChars = buildScramble(subline, 'BUILD · SHIP · GET HIRED');

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  tl.to(kicker, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.1);
  decode(tl, hChars, 0.4, 1.1);
  decode(tl, sChars, 1.4, 1.0);

  // glitch flicker on settle
  tl.fromTo(headline, { filter: 'brightness(1)' },
    { filter: 'brightness(1.8)', duration: 0.06, yoyo: true, repeat: 3, ease: 'none' }, 1.5);
  tl.to(kicker, { opacity: 0.3, duration: 0.4 }, 2.6);

  tl.to({}, { duration: 1.5 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>

<script>
/* ════════ EDIT COLORS / LABEL HERE — applies live via CSS variables ════════ */
const CONFIG = {
  label: "Lego 36 · Text Scramble / Decode",
  colors: {
    accent:     '#00AA45',   // primary brand accent
    accentRgb:  '0,170,69',  // same accent, for rgba() glows/shadows
    accent2:    '#00e855',   // secondary / brighter accent (used by some scenes)
    accent2Rgb: '0,232,85',
    bg:         '#0D0D0D'    // page background
  }
};
/* ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  var c = CONFIG.colors, r = document.documentElement.style;
  r.setProperty('--accent', c.accent);       r.setProperty('--accent-rgb', c.accentRgb);
  r.setProperty('--accent-2', c.accent2);     r.setProperty('--accent-2-rgb', c.accent2Rgb);
  r.setProperty('--bg', c.bg);
  var lab = document.getElementById('cfgLabel'); if (lab) lab.textContent = CONFIG.label;
})();
</script>
</body>
</html>
