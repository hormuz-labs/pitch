<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>60 – Wireframe Globe</title>
<style>
:root { --bg:#06040d; --bg-mid:#18103a; --accent:#a78bfa; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; background:radial-gradient(ellipse at 50% 50%, var(--bg-mid), var(--bg) 70%); }
#gl { position:absolute; inset:0; z-index:1; display:block; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.5; z-index:100; }

.copy { position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
.copy .k { font-family:'Courier New',monospace; font-size:18px; letter-spacing:8px; color:var(--accent); text-transform:uppercase; opacity:0; }
.copy .h { font-size:72px; font-weight:800; letter-spacing:-2px; margin-top:14px; opacity:0; text-align:center; }
.copy .h .accent { color:var(--accent); }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid var(--accent);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div class="label" id="label"></div>

  <div class="copy">
    <div class="k" id="ck"></div>
    <div class="h" id="ch"></div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════ EDIT EVERYTHING HERE ════════════════ */
const CONFIG = {
  label: 'Lego 60 · Wireframe Globe',
  kicker: 'go global',
  headlineHtml: 'Get started with<br><span class="accent">WasteProtection</span>',
  spinSpeed: 0.0035,   // globe rotation per frame
  colors: {
    bg:'#06040d', bgMid:'#18103a', accent:'#a78bfa',
    wire:'#a78bfa', core:'#6d28d9', dots:'#c4b5fd', halo:'#7c3aed'
  }
};
/* ═══════════════════════════════════════════════════════ */

const C = CONFIG.colors, _r = document.documentElement.style;
_r.setProperty('--bg', C.bg); _r.setProperty('--bg-mid', C.bgMid); _r.setProperty('--accent', C.accent);
document.getElementById('label').textContent = CONFIG.label;
document.getElementById('ck').textContent = CONFIG.kicker;
document.getElementById('ch').innerHTML = CONFIG.headlineHtml;

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(1920, 1080, false); renderer.setPixelRatio(1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1920 / 1080, 0.1, 100);
camera.position.set(0, 0, 7.2);

const group = new THREE.Group(); scene.add(group);
const inner = new THREE.Mesh(new THREE.SphereGeometry(2, 48, 48), new THREE.MeshBasicMaterial({ color: C.core, transparent: true, opacity: 0.12 }));
group.add(inner);
const wire = new THREE.Mesh(new THREE.SphereGeometry(2.02, 36, 24), new THREE.MeshBasicMaterial({ color: C.wire, wireframe: true, transparent: true, opacity: 0.35 }));
group.add(wire);

const N = 500; const pts = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  const u = Math.random(), v = Math.random();
  const theta = 2 * Math.PI * u, phi = Math.acos(2 * v - 1), r = 2.04;
  pts[i*3] = r*Math.sin(phi)*Math.cos(theta); pts[i*3+1] = r*Math.cos(phi); pts[i*3+2] = r*Math.sin(phi)*Math.sin(theta);
}
const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pts, 3));
const dots = new THREE.Points(pg, new THREE.PointsMaterial({ color: C.dots, size: 0.05, transparent: true, opacity: 0.9 }));
group.add(dots);
const halo = new THREE.Mesh(new THREE.SphereGeometry(2.6, 48, 48), new THREE.MeshBasicMaterial({ color: C.halo, transparent: true, opacity: 0.12, side: THREE.BackSide }));
group.add(halo);

let raf = null;
function animate() { group.rotation.y += CONFIG.spinSpeed; group.rotation.x = 0.35; renderer.render(scene, camera); raf = requestAnimationFrame(animate); }

function play() {
  gsap.killTweensOf('*');
  if (raf) cancelAnimationFrame(raf);
  group.rotation.set(0.35, 0, 0); animate();

  gsap.set(group.scale, { x: 0.2, y: 0.2, z: 0.2 });
  gsap.set('#ck', { opacity: 0, y: 14 });
  gsap.set('#ch', { opacity: 0, y: 24 });
  inner.material.opacity = 0; wire.material.opacity = 0; dots.material.opacity = 0; halo.material.opacity = 0;

  const tl = gsap.timeline();
  window.masterTimeline = tl;
  tl.to(group.scale, { x: 1, y: 1, z: 1, duration: 1.8, ease: 'power3.out' }, 0);
  tl.to(wire.material, { opacity: 0.35, duration: 1.4 }, 0.2);
  tl.to(inner.material, { opacity: 0.12, duration: 1.4 }, 0.2);
  tl.to(dots.material, { opacity: 0.9, duration: 1.4 }, 0.5);
  tl.to(halo.material, { opacity: 0.18, duration: 1.6 }, 0.4);
  tl.to('#ck', { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out' }, 1.4);
  tl.to('#ch', { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 1.7);
  tl.to({}, { duration: 3.0 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
