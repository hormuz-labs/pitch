<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>50 – Particle Wave Grid</title>
<style>
:root { --bg:#000; --bg-mid:#06040d; --accent:#a78bfa; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; }
#gl { position:absolute; inset:0; z-index:0; display:block; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.5; z-index:100; }

.caption { position:absolute; z-index:5; left:0; right:0; top:46%; transform:translateY(-50%); text-align:center; pointer-events:none; }
.caption .k { font-family:'Courier New',monospace; font-size:20px; letter-spacing:10px; color:var(--accent); text-transform:uppercase; opacity:0; }
.caption .h { font-size:80px; font-weight:800; letter-spacing:-2px; margin-top:14px; opacity:0; }

.vignette { position:absolute; inset:0; z-index:3; pointer-events:none; background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.85) 100%); }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid var(--accent);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div class="vignette"></div>
  <div class="label" id="label"></div>

  <div class="caption">
    <div class="k" id="capK"></div>
    <div class="h" id="capH"></div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════ EDIT EVERYTHING HERE ════════════════ */
const CONFIG = {
  label: 'Lego 50 · Particle Wave Grid',
  kicker: 'the platform is live',
  headline: 'Operations, in motion.',
  colors: {
    bg:        '#000000',   // page background
    accent:    '#a78bfa',   // text accent / label / replay
    particleA: '#00d4ff',   // wave colour near centre (cyan)
    particleB: '#c026d3'    // wave colour at edges (magenta)
  },
  grid: { cols: 120, rows: 80, spacing: 9, amplitude: 26 } // wave geometry
};
/* ═══════════════════════════════════════════════════════ */

const _root = document.documentElement.style;
_root.setProperty('--bg', CONFIG.colors.bg);
_root.setProperty('--accent', CONFIG.colors.accent);
document.getElementById('label').textContent = CONFIG.label;
document.getElementById('capK').textContent = CONFIG.kicker;
document.getElementById('capH').textContent = CONFIG.headline;

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(1920, 1080, false); renderer.setPixelRatio(1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1920 / 1080, 0.1, 2000);
camera.position.set(0, 130, 360); camera.lookAt(0, -40, 0);

const COLS = CONFIG.grid.cols, ROWS = CONFIG.grid.rows, SP = CONFIG.grid.spacing;
const COUNT = COLS * ROWS;
const positions = new Float32Array(COUNT * 3);
const colors = new Float32Array(COUNT * 3);
const base = [];
const cA = new THREE.Color(CONFIG.colors.particleA);
const cB = new THREE.Color(CONFIG.colors.particleB);
let i = 0;
for (let z = 0; z < ROWS; z++) {
  for (let x = 0; x < COLS; x++) {
    const px = (x - COLS / 2) * SP, pz = (z - ROWS / 2) * SP;
    positions[i*3] = px; positions[i*3+1] = 0; positions[i*3+2] = pz;
    base.push([px, pz]);
    const d = Math.min(1, Math.hypot(px, pz) / 520);
    const col = cA.clone().lerp(cB, d);
    colors[i*3] = col.r; colors[i*3+1] = col.g; colors[i*3+2] = col.b;
    i++;
  }
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const c = document.createElement('canvas'); c.width = c.height = 64;
const cx = c.getContext('2d');
const g = cx.createRadialGradient(32, 32, 0, 32, 32, 32);
g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,255,255,0.6)'); g.addColorStop(1, 'rgba(255,255,255,0)');
cx.fillStyle = g; cx.fillRect(0, 0, 64, 64);
const sprite = new THREE.CanvasTexture(c);

const mat = new THREE.PointsMaterial({ size: 7, map: sprite, vertexColors: true, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.9 });
const points = new THREE.Points(geo, mat);
scene.add(points);

let time = 0, raf = null, amp = 0;
const AMP = CONFIG.grid.amplitude;
function animate() {
  time += 0.02;
  const pos = geo.attributes.position.array;
  for (let k = 0; k < COUNT; k++) {
    const [px, pz] = base[k];
    const d = Math.hypot(px, pz) * 0.012;
    pos[k*3+1] = (Math.sin(px*0.018 + time) + Math.cos(pz*0.022 + time*0.8)) * AMP * amp + Math.sin(d - time) * 10 * amp;
  }
  geo.attributes.position.needsUpdate = true;
  points.rotation.y = Math.sin(time * 0.1) * 0.08;
  renderer.render(scene, camera);
  raf = requestAnimationFrame(animate);
}

function play() {
  gsap.killTweensOf('*');
  if (raf) cancelAnimationFrame(raf);
  amp = 0; time = 0; animate();

  gsap.set('#capK', { opacity: 0, y: 14 });
  gsap.set('#capH', { opacity: 0, y: 24 });
  camera.position.set(0, 320, 520);

  const tl = gsap.timeline();
  window.masterTimeline = tl;
  tl.to({ a: 0 }, { a: 1, duration: 2.2, ease: 'power2.out', onUpdate: function () { amp = this.targets()[0].a; } }, 0);
  tl.to(camera.position, { y: 130, z: 360, duration: 3.0, ease: 'power2.inOut', onUpdate: () => camera.lookAt(0, -40, 0) }, 0);
  tl.to('#capK', { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out' }, 1.4);
  tl.to('#capH', { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 1.7);
  tl.to({}, { duration: 3.2 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
