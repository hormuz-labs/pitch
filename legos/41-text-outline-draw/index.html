<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>41 – Outline Stroke Draw-On</title>
<style>
:root { --accent:#00AA45; --accent-rgb:0,170,69; --accent-2:#00e855; --accent-2-rgb:0,232,85; --bg:#0D0D0D; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.4; z-index:100; }

svg { display:block; overflow:visible; }
.draw-text {
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-weight:900; font-size:200px; letter-spacing:-6px;
  fill:var(--accent); fill-opacity:0;
  stroke:var(--accent); stroke-width:1.4;
  stroke-dasharray:1; stroke-dashoffset:1;     /* set via pathLength=1 */
}
.tagline {
  font-family:'Courier New',monospace; font-size:26px; letter-spacing:10px; color:rgba(255,255,255,0.45);
  text-transform:uppercase; clip-path: inset(0 50% 0 50%); opacity:0;
}
.underline { height:3px; background:var(--accent); width:0; box-shadow:0 0 16px rgba(var(--accent-rgb),0.7); }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid rgba(var(--accent-rgb),0.4);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="cfgLabel">Lego 41 · Outline Stroke Draw-On</div>

  <svg width="1400" height="320" viewBox="0 0 1400 320">
    <text class="draw-text" id="dt" x="700" y="230" text-anchor="middle" pathLength="1">PEERLIST</text>
  </svg>
  <div class="underline" id="underline"></div>
  <div class="tagline" id="tagline">design · code · ship</div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const dt = document.getElementById('dt');

function play() {
  gsap.killTweensOf('*');
  gsap.set(dt, { strokeDashoffset: 1, fillOpacity: 0, attr: { 'stroke-width': 1.4 } });
  gsap.set('#tagline', { clipPath: 'inset(0 50% 0 50%)', opacity: 0 });
  gsap.set('#underline', { width: 0 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // 1. Stroke draws the outline (uses pathLength=1 so dashoffset 1→0 traces the glyphs)
  tl.to(dt, { strokeDashoffset: 0, duration: 2.0, ease: 'power2.inOut' }, 0.3);

  // 2. Fill floods in, stroke thins
  tl.to(dt, { fillOpacity: 1, duration: 0.9, ease: 'power2.out' }, 1.9);
  tl.to(dt, { attr: { 'stroke-width': 0.4 }, duration: 0.9, ease: 'power2.out' }, 1.9);

  // 3. Underline sweeps out from center
  tl.to('#underline', { width: 560, duration: 0.7, ease: 'power3.inOut' }, 2.4);

  // 4. Tagline opens from center
  tl.to('#tagline', { clipPath: 'inset(0 0% 0 0%)', opacity: 1, duration: 0.9, ease: 'power3.out' }, 2.7);

  tl.to({}, { duration: 1.5 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>

<script>
/* ════════ EDIT COLORS / LABEL HERE — applies live via CSS variables ════════ */
const CONFIG = {
  label: "Lego 41 · Outline Stroke Draw-On",
  colors: {
    accent:     '#00AA45',   // primary brand accent
    accentRgb:  '0,170,69',  // same accent, for rgba() glows/shadows
    accent2:    '#00e855',   // secondary / brighter accent (used by some scenes)
    accent2Rgb: '0,232,85',
    bg:         '#0D0D0D'    // page background
  }
};
/* ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  var c = CONFIG.colors, r = document.documentElement.style;
  r.setProperty('--accent', c.accent);       r.setProperty('--accent-rgb', c.accentRgb);
  r.setProperty('--accent-2', c.accent2);     r.setProperty('--accent-2-rgb', c.accent2Rgb);
  r.setProperty('--bg', c.bg);
  var lab = document.getElementById('cfgLabel'); if (lab) lab.textContent = CONFIG.label;
})();
</script>
</body>
</html>
