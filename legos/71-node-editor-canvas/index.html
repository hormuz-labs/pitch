<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>71 – Node Editor Canvas</title>
<style>
:root { --bg-a:#f3eefb; --bg-b:#fbe9f2; --ink:#2a2438; --node:#ffffff; --accent:#b07bff; --grid:rgba(120,80,200,0.07); }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg-a); font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:var(--ink); }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; background:linear-gradient(135deg, var(--bg-a), var(--bg-b)); }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.6; z-index:100; }

/* the infinite-canvas camera — we pull this back to reveal context */
.canvas { position:absolute; top:50%; left:50%; width:2200px; height:1500px; margin:-750px 0 0 -1100px; will-change:transform;
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:60px 60px; }

/* concentric audio-pulse rings emanating from the play orb */
.pulse { position:absolute; border-radius:50%; border:2px solid rgba(176,123,255,0.4); transform:translate(-50%,-50%); }

.node { position:absolute; transform:translate(-50%,-50%); background:var(--node); border-radius:20px; padding:18px 22px;
  box-shadow:0 18px 50px rgba(80,40,160,0.18); border:1px solid rgba(120,80,200,0.12); min-width:240px; opacity:0; }
.node .nh { display:flex; align-items:center; gap:10px; font-size:16px; font-weight:700; }
.node .dot { width:12px; height:12px; border-radius:50%; }
.node .nb { font-size:14px; color:#6b6480; margin-top:8px; min-height:20px; }
.node .ports { position:absolute; top:50%; width:14px; height:14px; border-radius:50%; background:var(--accent); transform:translateY(-50%); }
.node .ports.in { left:-7px; } .node .ports.out { right:-7px; }

.play-orb { position:absolute; transform:translate(-50%,-50%); width:120px; height:120px; border-radius:50%;
  background:radial-gradient(circle at 38% 32%, #ff9bd0, #b07bff 70%); box-shadow:0 0 50px rgba(176,123,255,0.6);
  display:flex; align-items:center; justify-content:center; font-size:46px; color:#fff; opacity:0; }

.connSvg { position:absolute; inset:0; overflow:visible; z-index:2; }
.conn { fill:none; stroke:url(#irid); stroke-width:5; stroke-linecap:round; }

.cursor { position:absolute; z-index:9; width:26px; height:26px; transform:translate(-4px,-2px); filter:drop-shadow(0 3px 5px rgba(0,0,0,0.3)); opacity:0; }
.cursor path { fill:#fff; stroke:var(--accent); stroke-width:1.5; }

/* minimap appears on pull-back */
.minimap { position:absolute; right:50px; bottom:50px; width:280px; height:180px; border-radius:16px; z-index:8;
  background:rgba(255,255,255,0.7); border:1px solid rgba(120,80,200,0.2); backdrop-filter:blur(10px); box-shadow:0 12px 30px rgba(80,40,160,0.15); opacity:0; }
.minimap .mm { position:absolute; width:12px; height:8px; border-radius:3px; background:var(--accent); }
.caption { position:absolute; right:60px; top:42%; z-index:8; text-align:right; opacity:0; }
.caption .h { font-size:44px; font-weight:700; letter-spacing:-1px; }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid var(--accent);
  background:rgba(255,255,255,0.8); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="label" id="label"></div>

  <div class="canvas" id="canvas">
    <svg class="connSvg" id="connSvg" viewBox="0 0 2200 1500" preserveAspectRatio="none">
      <defs><linearGradient id="irid" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff9bd0"/><stop offset="0.5" stop-color="#c9a7ff"/><stop offset="1" stop-color="#9be7c4"/>
      </linearGradient></defs>
    </svg>
    <div id="pulses"></div>
    <div id="nodes"></div>
    <div class="play-orb" id="orb" style="left:1100px; top:750px;">▶</div>
    <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M3 2l7 18 2.5-7.5L20 10z"/></svg>
  </div>

  <div class="minimap" id="minimap"></div>
  <div class="caption" id="caption"><div class="h" id="capH"></div></div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════ EDIT EVERYTHING HERE ════════════════ */
const CONFIG = {
  label: 'Lego 71 · Node Editor Canvas',
  caption: 'Just by connecting nodes.',
  // node positions are in the 2200×1500 canvas space (orb sits at 1100,750 = centre)
  nodes: [
    { x:560,  y:560, color:'#b07bff', title:'🎹 Melody Node', body:'Turn ideas into sound…' },
    { x:560,  y:980, color:'#4cc38a', title:'🎚 Reverb FX',    body:'Space & depth' },
    { x:1640, y:560, color:'#ff7eb6', title:'🤖 Master AI',    body:'Auto-mix & polish' },
    { x:1640, y:980, color:'#ffa94d', title:'🥁 Drum Node',    body:'Groove engine' }
  ],
  startZoom: 2.4,        // begin pushed into the first connection
  colors: { bgA:'#f3eefb', bgB:'#fbe9f2', accent:'#b07bff' }
};
/* ═══════════════════════════════════════════════════════ */

const C = CONFIG.colors, _r = document.documentElement.style;
_r.setProperty('--bg-a', C.bgA); _r.setProperty('--bg-b', C.bgB); _r.setProperty('--accent', C.accent);
document.getElementById('label').textContent = CONFIG.label;
document.getElementById('capH').textContent = CONFIG.caption;

const ORB = { x: 1100, y: 750 };
const nodesEl = document.getElementById('nodes');
const connSvg = document.getElementById('connSvg');
const minimap = document.getElementById('minimap');

// build nodes
CONFIG.nodes.forEach((n, i) => {
  const d = document.createElement('div'); d.className = 'node'; d.id = 'node' + i;
  d.style.left = n.x + 'px'; d.style.top = n.y + 'px';
  d.innerHTML = `<div class="nh"><span class="dot" style="background:${n.color}"></span>${n.title}</div><div class="nb" id="nb${i}"></div><div class="ports in"></div><div class="ports out"></div>`;
  nodesEl.appendChild(d);
  // minimap marker (scaled into 280×180)
  const mm = document.createElement('div'); mm.className = 'mm';
  mm.style.left = (n.x / 2200 * 280) + 'px'; mm.style.top = (n.y / 1500 * 180) + 'px';
  minimap.appendChild(mm);
});

// build connection paths (node → orb) as bezier curves
const conns = CONFIG.nodes.map((n, i) => {
  const sx = n.x + (n.x < ORB.x ? 120 : -120), sy = n.y;       // from node out-port
  const ex = ORB.x + (n.x < ORB.x ? -60 : 60), ey = ORB.y;     // to orb
  const cx1 = (sx + ex) / 2, p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('class', 'conn'); p.setAttribute('id', 'conn' + i);
  p.setAttribute('d', `M ${sx} ${sy} C ${cx1} ${sy}, ${cx1} ${ey}, ${ex} ${ey}`);
  connSvg.appendChild(p);
  return p;
});

function play() {
  gsap.killTweensOf('*');
  // begin pushed into the canvas near the first node/connection
  gsap.set('#canvas', { scale: CONFIG.startZoom, x: 360, y: -120 });
  gsap.set('#orb', { opacity: 0, scale: 0.6 });
  gsap.set('#cursor', { opacity: 0 });
  gsap.set(['#minimap', '#caption'], { opacity: 0 });
  gsap.set('#caption', { x: 30 });
  CONFIG.nodes.forEach((n, i) => { gsap.set('#node' + i, { opacity: 0, scale: 0.85 }); document.getElementById('nb' + i).textContent = ''; });
  conns.forEach(p => { const L = p.getTotalLength(); gsap.set(p, { strokeDasharray: L, strokeDashoffset: L }); });
  document.getElementById('pulses').innerHTML = '';

  const tl = gsap.timeline();
  window.masterTimeline = tl;

  // first node appears + its label typewrites; cursor drags a connection to the orb
  tl.to('#node0', { opacity: 1, scale: 1, duration: 0.6, ease: 'back.out(1.6)' }, 0.2);
  const nb0 = document.getElementById('nb0'), w0 = CONFIG.nodes[0].body, px0 = { n: 0 };
  tl.to(px0, { n: w0.length, duration: w0.length * 0.045, ease: 'none', onUpdate: () => nb0.textContent = w0.slice(0, Math.round(px0.n)) }, 0.5);
  tl.to('#cursor', { opacity: 1, duration: 0.2 }, 0.6);
  // cursor travels along conn0 while it draws
  tl.to('#orb', { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.7)' }, 0.7);
  const c0 = conns[0], L0 = c0.getTotalLength(), drag0 = { p: 0 };
  tl.to('#conn0', { strokeDashoffset: 0, duration: 1.0, ease: 'power2.inOut' }, 0.9);
  tl.to(drag0, { p: 1, duration: 1.0, ease: 'power2.inOut',
    onUpdate: () => { const pt = c0.getPointAtLength(drag0.p * L0); gsap.set('#cursor', { left: pt.x, top: pt.y }); } }, 0.9);

  // ── camera pulls back to reveal the whole canvas (weighted expo.out) ──
  tl.to('#canvas', { scale: 1, x: 0, y: 0, duration: 1.8, ease: 'expo.out' }, 2.0);
  // remaining nodes + connections resolve during the pull-back
  CONFIG.nodes.forEach((n, i) => { if (i === 0) return;
    tl.to('#node' + i, { opacity: 1, scale: 1, duration: 0.6, ease: 'back.out(1.5)' }, 2.1 + i * 0.12);
    tl.to('#conn' + i, { strokeDashoffset: 0, duration: 0.9, ease: 'power2.inOut' }, 2.3 + i * 0.12);
  });

  // pulse rings emanate from the orb (audio waves)
  tl.add(() => {
    const pulses = document.getElementById('pulses');
    for (let k = 0; k < 3; k++) {
      const r = document.createElement('div'); r.className = 'pulse';
      r.style.left = ORB.x + 'px'; r.style.top = ORB.y + 'px'; r.style.width = r.style.height = '120px';
      pulses.appendChild(r);
      gsap.fromTo(r, { scale: 0.5, opacity: 0.6 }, { scale: 6, opacity: 0, duration: 2.2, ease: 'power1.out', repeat: -1, delay: k * 0.7 });
    }
  }, 2.4);

  tl.to('#cursor', { left: ORB.x, top: ORB.y, duration: 0.6, ease: 'power2.inOut' }, 3.0);
  tl.to('#minimap', { opacity: 1, duration: 0.6, ease: 'power2.out' }, 3.2);
  tl.to('#caption', { opacity: 1, x: 0, duration: 0.8, ease: 'power3.out' }, 3.4);

  tl.to({}, { duration: 1.8 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
