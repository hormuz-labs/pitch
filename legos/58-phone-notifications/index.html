<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>58 – Phone Notifications</title>
<style>
:root { --bg:#0a0612; --bg-mid:#20123e; --accent:#a78bfa; --accent-2:#8b5cf6; --accent-3:#6d28d9; --sweep:rgba(124,58,237,0.25); }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff; }
.vp { width:1920px; height:1080px; overflow:hidden; position:relative; background:radial-gradient(ellipse at 50% 40%, var(--bg-mid), var(--bg) 72%); display:flex; align-items:center; justify-content:center; gap:120px; }

.label { position:absolute; top:32px; left:32px; font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; opacity:0.5; z-index:100; }

.sweep { position:absolute; z-index:0; width:2400px; height:600px; left:-200px; top:240px; transform:rotate(-12deg);
  background:linear-gradient(90deg, transparent, var(--sweep), transparent); filter:blur(40px); opacity:0; }

.copy { z-index:2; max-width:520px; opacity:0; }
.copy .k { font-family:'Courier New',monospace; font-size:16px; letter-spacing:6px; color:var(--accent); text-transform:uppercase; }
.copy .h { font-size:64px; font-weight:800; letter-spacing:-2px; margin-top:14px; line-height:1.05; }
.copy .s { font-size:22px; color:rgba(255,255,255,0.55); margin-top:18px; line-height:1.5; }

.phone { position:relative; z-index:2; width:380px; height:780px; border-radius:54px; padding:14px;
  background:linear-gradient(160deg,#2a2440,#15101f); box-shadow:0 50px 110px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(255,255,255,0.06); }
.screen { position:relative; width:100%; height:100%; border-radius:42px; overflow:hidden;
  background:linear-gradient(180deg,var(--accent-3),#1a0f33); }
.notch { position:absolute; top:14px; left:50%; transform:translateX(-50%); width:120px; height:30px; background:#000; border-radius:16px; z-index:5; }
.lock { position:absolute; top:90px; left:0; right:0; text-align:center; }
.lock .time { font-size:84px; font-weight:300; letter-spacing:-2px; }
.lock .date { font-size:18px; color:rgba(255,255,255,0.7); margin-top:2px; }

.notifs { position:absolute; left:16px; right:16px; bottom:30px; display:flex; flex-direction:column; gap:12px; }
.notif { background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.12); backdrop-filter:blur(20px);
  border-radius:20px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; will-change:transform,opacity; }
.notif .ic { width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,var(--accent-2),var(--accent-3)); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:20px; }
.notif .txt .t { font-size:15px; font-weight:700; }
.notif .txt .b { font-size:13px; color:rgba(255,255,255,0.7); margin-top:2px; }
.notif .when { margin-left:auto; font-size:12px; color:rgba(255,255,255,0.5); }

#replayBtn { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;
  padding:10px 28px; border-radius:30px; border:1px solid var(--accent);
  background:rgba(0,0,0,0.7); color:var(--accent); cursor:pointer; font-size:13px; font-family:monospace; backdrop-filter:blur(10px); }
</style>
</head>
<body>
<div class="vp">
  <div class="sweep" id="sweep"></div>
  <div class="label" id="label"></div>

  <div class="copy" id="copy">
    <div class="k" id="copyK"></div>
    <div class="h" id="copyH"></div>
    <div class="s" id="copyS"></div>
  </div>

  <div class="phone">
    <div class="screen">
      <div class="notch"></div>
      <div class="lock"><div class="time" id="lockTime"></div><div class="date" id="lockDate"></div></div>
      <div class="notifs" id="notifs"></div>
    </div>
  </div>
</div>

<button id="replayBtn">▶ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════ EDIT EVERYTHING HERE ════════════════ */
const CONFIG = {
  label: 'Lego 58 · Phone Notifications',
  kicker: 'stay in the loop',
  headlineHtml: 'Alerts that<br>reach you first.',
  sub: 'Route changes, missed pickups and delays — pushed to your team in real time.',
  lockTime: '12:00',
  lockDate: 'Tuesday, 21 March',
  notifications: [
    { ic: '🚛', t: 'Route 3 Delayed',          b: 'Estimated time: 45 mins',  when: 'now' },
    { ic: '⚠️', t: 'Pickup Missed — Sector 2',  b: 'Reassigned to Unit 7',     when: '2m' },
    { ic: '✅', t: 'Bin 14 Collected',          b: 'Fill level reset to 0%',   when: '5m' },
    { ic: '📊', t: 'Daily report ready',        b: '98% on-time completion',   when: '9m' }
  ],
  stagger: 0.45,   // seconds between each banner dropping in
  colors: { bg:'#0a0612', bgMid:'#20123e', accent:'#a78bfa', accent2:'#8b5cf6', accent3:'#6d28d9', sweep:'rgba(124,58,237,0.25)' }
};
/* ═══════════════════════════════════════════════════════ */

const C = CONFIG.colors, _r = document.documentElement.style;
_r.setProperty('--bg', C.bg); _r.setProperty('--bg-mid', C.bgMid);
_r.setProperty('--accent', C.accent); _r.setProperty('--accent-2', C.accent2); _r.setProperty('--accent-3', C.accent3);
_r.setProperty('--sweep', C.sweep);
document.getElementById('label').textContent = CONFIG.label;
document.getElementById('copyK').textContent = CONFIG.kicker;
document.getElementById('copyH').innerHTML = CONFIG.headlineHtml;
document.getElementById('copyS').textContent = CONFIG.sub;
document.getElementById('lockTime').textContent = CONFIG.lockTime;
document.getElementById('lockDate').textContent = CONFIG.lockDate;
document.getElementById('notifs').innerHTML = CONFIG.notifications.map(n =>
  `<div class="notif"><div class="ic">${n.ic}</div><div class="txt"><div class="t">${n.t}</div><div class="b">${n.b}</div></div><div class="when">${n.when}</div></div>`).join('');

function play() {
  gsap.killTweensOf('*');
  const notifs = gsap.utils.toArray('#notifs .notif');
  gsap.set('#sweep', { opacity: 0, x: -200 });
  gsap.set('#copy', { opacity: 0, x: -40 });
  gsap.set(notifs, { opacity: 0, y: 120, scale: 0.9 });

  const tl = gsap.timeline();
  window.masterTimeline = tl;
  tl.to('#sweep', { opacity: 1, x: 0, duration: 1.4, ease: 'power2.out' }, 0);
  tl.to('#copy', { opacity: 1, x: 0, duration: 0.9, ease: 'power3.out' }, 0.3);
  notifs.forEach((n, i) => {
    tl.fromTo(n, { opacity: 0, y: 120, scale: 0.9 },
      { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: 'back.out(1.7)' }, 0.8 + i * CONFIG.stagger);
  });
  tl.to({}, { duration: 1.8 });
}

document.getElementById('replayBtn').addEventListener('click', play);
play();
</script>
</body>
</html>
