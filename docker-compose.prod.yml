# Production overrides — applied on the Linux host via: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Remaps volumes to stable /mnt/hdd paths and enables Linux VAAPI access for the API.
# Grafana / Loki / MinIO data lives on the HDD at /mnt/hdd; everything else stays on the SSD at /opt/pitch.

services:
  postgres:
    volumes:
      - /opt/pitch/postgres:/var/lib/postgresql/data

  minio:
    volumes:
      - /mnt/hdd/minio:/data

  loki:
    volumes:
      - /mnt/hdd/loki:/loki

  grafana:
    volumes:
      - /mnt/hdd/grafana:/var/lib/grafana
      - /mnt/hdd/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - /mnt/hdd/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards

  api:
    environment:
      # Never persist the host-only MinIO address in production project rows.
      # Cloudflare routes this public hostname to MinIO's host port 9002.
      MINIO_PUBLIC_URL: https://s3.trypitch.co
    # Ship logs to Loki. This needs a Docker plugin on the HOST:
    #   docker plugin install grafana/loki-docker-driver:latest \
    #     --alias loki --grant-all-permissions
    # Without it the daemon refuses to CREATE the container — "error looking
    # up logging plugin loki" — so it lives here rather than in the base
    # compose file, where it stopped a fresh machine from starting at all.
    logging:
      driver: loki
      options:
        loki-url: http://localhost:3101/loki/api/v1/push
        loki-batch-size: "400"
        loki-timeout: "10s"
        loki-retries: "3"
        loki-external-labels: "job=api,container_name={{.Name}}"
        labels: "job=api"
        env: "SERVICE_NAME,HOSTNAME"
    volumes:
      - /opt/pitch/launch-video/projects:/app/projects
      - /opt/pitch/pi:/root/.pi/agent
      - /usr/local/share/whisper.cpp/models:/root/.cache/whisper-cpp
    devices:
      - ${FFMPEG_VAAPI_DEVICE:-/dev/dri/renderD128}:${FFMPEG_VAAPI_DEVICE:-/dev/dri/renderD128}
