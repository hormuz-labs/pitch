    <script>
      // Drives the CSS intro above. Runs before paint so a returning visitor or a
      // non-landing route never sees a frame of it. The animation itself needs no
      // JS — this only clears the overlay when the sequence is over.
      (function () {
        var el = document.getElementById('pitch-preloader')
        if (!el) return
        var run = location.pathname === '/'
        try { if (sessionStorage.getItem('preloader_done') === '1') run = false } catch (e) {}
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) run = false
        if (!run) { el.remove(); return }
        // The build-time prerenderer sets this so the pristine markup is captured
        // into dist/index.html instead of a half-removed DOM.
        if (window.__PITCH_PRERENDER__) return
        var root = document.documentElement
        root.classList.add('pl-lock')
        setTimeout(function () {
          root.classList.remove('pl-lock')
          el.remove()
          try { sessionStorage.setItem('preloader_done', '1') } catch (e) {}
        }, 1900)
      })()
    </script>
