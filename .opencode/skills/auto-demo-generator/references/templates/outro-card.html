<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden;
    background: {{BG}};
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif; gap: 32px;
  }
  .logo-wrap {
    opacity: 0; transform: scale(0.9); filter: blur(4px);
    animation: fadeIn 0.8s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
  }
  .logo-wrap img { height: 80px; width: auto; max-width: 400px; object-fit: contain; }
  @keyframes fadeIn {
    to { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  .thanks {
    font-family: 'Inter', sans-serif; font-weight: 400; font-size: 28px;
    letter-spacing: -0.01em; color: rgba(245,245,245,0.7);
    opacity: 0; transform: translateY(16px);
    animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.6s forwards;
  }
  @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
  .company-name {
    font-family: 'Inter', sans-serif; font-weight: 700; font-size: 48px;
    letter-spacing: -0.03em; color: {{TEXT_COLOR}};
    opacity: 0; transform: translateY(16px);
    animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.8s forwards;
  }
  .url {
    font-family: 'Inter', sans-serif; font-weight: 400; font-size: 18px;
    color: rgba(245,245,245,0.4); margin-top: 8px;
    opacity: 0;
    animation: fadeIn 0.5s ease 1.1s forwards;
  }
  body { animation: fadeOut 0.6s ease 2.4s forwards; }
  @keyframes fadeOut { to { opacity: 0; } }
</style>
</head>
<body>
  {{LOGO_HTML}}
  <div class="thanks">Thanks for watching</div>
  <div class="company-name">{{COMPANY_NAME}}</div>
  <div class="url">{{URL}}</div>
</body>
</html>
