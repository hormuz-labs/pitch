apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pitch
resources:
  - namespace.yaml
  - service-account.yaml
  - storage.yaml
  - browser.yaml
  - api.yaml
  - worker.yaml
  - render.yaml
  - ingress.yaml
  - discord-bot.yaml
configMapGenerator:
  - name: pitch-config
    literals:
      - NODE_ENV=production
      - PORT=3000
      - PROJECTS_DIR=/app/projects
      - PI_AGENT_DIR=/root/.pi/agent
      - STUDIO_SANDBOX=bwrap
      # Placement (docs/studio-architecture.md → Scaling). A worker is light
      # — sessions, not renders — so it holds many.
      - STUDIO_WORKER_SLOTS=24
      - STUDIO_WORKSPACE_BUCKET=${WORKSPACE_BUCKET}
      # Cloud Storage through its S3-compatible endpoint (an HMAC key in
      # pitch-runtime as MINIO_ROOT_USER/MINIO_ROOT_PASSWORD): the same code
      # path as MinIO, and the one interface that moves to another cloud
      # unchanged. Buckets are created ahead of time; the S3 API cannot
      # create them on GCS.
      - STORAGE_DRIVER=s3
      - MINIO_ENDPOINT=https://storage.googleapis.com
      - MINIO_REGION=auto
      - STORAGE_BUCKET=${MEDIA_BUCKET}
      - STORAGE_PROFILES_BUCKET=${PROFILES_BUCKET}
      - STORAGE_PUBLIC_URL=${MEDIA_PUBLIC_URL}
      - FFMPEG_ENCODER=libx264
      # The browser manager pool (browser.yaml): a headless Service, so every
      # process resolves the managers behind it and pins to one. The FQDN,
      # because the SRV lookup does not go through the search list.
      - CLOAK_MANAGER_URL=http://pitch-browser.pitch.svc.cluster.local:8080
      - CLOAK_MANAGER_CAPACITY=4
      # Where a manager loads previews from; workers override it with their pod IP.
      - STUDIO_INTERNAL_ORIGIN=http://pitch.pitch.svc.cluster.local
      # Fetched onto each render pod's scratch disk on boot (render.yaml → prepare-state).
      - WHISPER_MODEL_FILE=ggml-large-v3-turbo.bin
      - WHISPER_MODEL_BASE_URL=https://huggingface.co/ggerganov/whisper.cpp/resolve/main
      - WHISPER_MODEL=/root/.cache/whisper-cpp/ggml-large-v3-turbo.bin
      - APP_URL=${APP_URL}
images:
  - name: pitch-api
    newName: ${API_IMAGE}
  - name: cloakbrowser-manager
    newName: ${CLOAK_IMAGE}
  - name: pitch-discord-bot
    newName: ${BOT_IMAGE}
