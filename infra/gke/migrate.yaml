# Schema migrations run once per release, before the rollout, as a Job —
# not on every container boot, now that many pods start at once. Rendered
# and applied on its own by `node scripts/render-gke.mjs migrate` (it is not
# in the kustomization: a Job's spec is immutable, so each release gets a
# fresh name).
apiVersion: batch/v1
kind: Job
metadata:
  name: pitch-migrate-${RELEASE}
  namespace: pitch
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: pitch-migrate
    spec:
      serviceAccountName: pitch
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
        pool: system
      containers:
        - name: migrate
          image: ${API_IMAGE}
          command:
            - ./node_modules/.bin/prisma
            - migrate
            - deploy
            - --schema
            - packages/db/prisma/schema.prisma
          envFrom:
            - secretRef: { name: pitch-runtime }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: '1', memory: 1Gi }
