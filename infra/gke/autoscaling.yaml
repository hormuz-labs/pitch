# Workers scale on demand, not on CPU: a worker mid-turn is mostly waiting
# on a model, so CPU says little. The API answers GET /internal/scale with
# `wanted` — enough workers to hold every leased project and still keep
# STUDIO_SCALE_HEADROOM slots free — and KEDA follows that number
# (metrics-api trigger; target 1 with the default AverageValue means
# desired = wanted). Needs KEDA installed in the cluster; see
# docs/gke-deployment.md.
#
# Scale-up is quick (no stabilisation, two pods a minute) because a fresh
# node plus the image pull already take minutes, and the headroom exists so
# a project never waits for that. Scale-down is slow (half an hour of
# stability, one pod every ten minutes) because removing a worker is a
# gentle drain that can take up to STUDIO_DRAIN_MS, and a short dip is not
# worth paying that for.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: pitch-scale
spec:
  secretTargetRef:
    - parameter: token
      name: pitch-runtime
      key: STUDIO_WORKER_TOKEN
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pitch-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: pitch-worker
  pollingInterval: 15
  minReplicaCount: 1
  maxReplicaCount: 8
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - { type: Pods, value: 2, periodSeconds: 60 }
        scaleDown:
          stabilizationWindowSeconds: 1800
          policies:
            - { type: Pods, value: 1, periodSeconds: 600 }
  triggers:
    - type: metrics-api
      metadata:
        url: http://pitch.pitch.svc.cluster.local/internal/scale
        valueLocation: wanted
        targetValue: '1'
        authMode: bearer
      authenticationRef:
        name: pitch-scale
