# Two elastic tiers, one number each, both read from the API's
# GET /internal/scale (behind STUDIO_WORKER_TOKEN, so the scaler needs no
# database of its own) by KEDA metrics-api triggers. Needs KEDA installed
# in the cluster; see docs/gke-deployment.md.
#
#   wanted          workers: enough to hold every leased project and still
#                   keep STUDIO_SCALE_HEADROOM slots free. A worker holds
#                   tens of projects, so this number barely moves.
#   render.wanted   render pods: one per RenderJob queued or running, at
#                   least one, at most eight. This is the number that moves:
#                   it is the fleet's CPU.
#
# The browser managers are the third elastic tier and scale on CPU with a
# plain HPA (browser.yaml); the API likewise (api.yaml).
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: pitch-scale
spec:
  secretTargetRef:
    - parameter: token
      name: pitch-runtime
      key: STUDIO_WORKER_TOKEN
---
# Workers. Scale-up is quick (no stabilisation, two pods a minute) because a
# fresh node plus the image pull already take minutes. Scale-down is slow
# (half an hour of stability, one pod every ten minutes) because removing a
# worker is a gentle drain that can take up to STUDIO_DRAIN_MS.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pitch-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: pitch-worker
  pollingInterval: 15
  minReplicaCount: 2
  maxReplicaCount: 8
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - { type: Pods, value: 2, periodSeconds: 60 }
        scaleDown:
          stabilizationWindowSeconds: 1800
          policies:
            - { type: Pods, value: 1, periodSeconds: 600 }
  triggers:
    - type: metrics-api
      metadata:
        url: http://pitch.pitch.svc.cluster.local/internal/scale
        valueLocation: wanted
        targetValue: '1'
        authMode: bearer
      authenticationRef:
        name: pitch-scale
---
# Render pods. Up as fast as KEDA polls; down after ten quiet minutes, one
# pod at a time, since a pod on its way out still finishes the job it holds
# and the next burst wants a warm one.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pitch-render
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pitch-render
  pollingInterval: 10
  minReplicaCount: 1
  maxReplicaCount: 8
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - { type: Pods, value: 4, periodSeconds: 60 }
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - { type: Pods, value: 1, periodSeconds: 120 }
  triggers:
    - type: metrics-api
      metadata:
        url: http://pitch.pitch.svc.cluster.local/internal/scale
        valueLocation: render.wanted
        targetValue: '1'
        authMode: bearer
      authenticationRef:
        name: pitch-scale
