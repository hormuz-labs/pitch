apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: pitch
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    type: HTTP
    requestPath: /health/ready
    port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: pitch
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "pitch"}'
spec:
  selector:
    app: pitch
  ports:
    - name: http
      port: 80
      targetPort: http
---
# One certificate per host: Google issues each only once that host's DNS
# resolves to the load balancer, so a host waiting for its DNS flip must not
# hold back the ones already live. Renderer expands API_EXTRA_HOSTS below.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: pitch
spec:
  domains: ["${API_HOST}"]
${EXTRA_CERTIFICATES}---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: pitch
spec:
  redirectToHttps:
    enabled: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pitch
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: ${GKE_STATIC_IP_NAME}
    networking.gke.io/managed-certificates: ${MANAGED_CERTIFICATES}
    networking.gke.io/v1beta1.FrontendConfig: pitch
spec:
  # No host match: the API serves every name that carries a certificate above.
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pitch
                port:
                  number: 80
