<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Pitch — Small prompt. Big production.</title>
  <desc id="desc">A cinematic studio cover with the Pitch pixel mark, floating film and slide compositions, and a production timeline. One studio, one agent, from first brief to final cut.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101014"/><stop offset="1" stop-color="#070709"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(982 341) rotate(90) scale(354 408)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9481FF" stop-opacity=".24"/><stop offset="1" stop-color="#9481FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="792" y1="179" x2="1138" y2="466" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BEB0FF"/><stop offset=".48" stop-color="#8074BE"/><stop offset="1" stop-color="#31294D"/>
    </linearGradient>
    <linearGradient id="metal" x1="815" y1="205" x2="1092" y2="438" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ECE6FF"/><stop offset=".22" stop-color="#AEA0E6"/><stop offset=".46" stop-color="#F7F4FF"/><stop offset=".66" stop-color="#786AAB"/><stop offset="1" stop-color="#D8CDFF"/>
    </linearGradient>
    <linearGradient id="track" x1="65" y1="0" x2="1215" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D5C9C"/><stop offset=".6" stop-color="#C2B4F2"/><stop offset="1" stop-color="#D8CEEE"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#FFF" stroke-opacity=".035"/>
    </pattern>
    <pattern id="ticks" width="24" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 0V7" stroke="#727078" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-40%" width="170%" height="200%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="bounds"><rect width="1280" height="800" rx="24"/></clipPath>
    <style>
      .sans { font-family: 'DM Sans', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Instrument Serif', Georgia, serif; }
      .float { animation: float 9s ease-in-out infinite; }
      .signal { animation: signal 4s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes signal { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .float, .signal { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1280" height="800" fill="url(#bg)"/>
    <rect width="1280" height="800" fill="url(#grid)"/>
    <rect width="1280" height="800" fill="url(#halo)"/>
    <path d="M64 108H1216" stroke="#303037"/>

    <!-- The product's pixel P, redrawn as simple geometry. -->
    <g fill="#F0EDF5" transform="translate(64 42)">
      <path d="M0 0h11v7H0zM14 0h11v7H14zM28 0h11v7H28zM0 10h11v7H0zM28 10h11v7H28zM0 20h11v7H0zM14 20h11v7H14zM28 20h11v7H28zM0 30h11v7H0zM0 40h11v7H0z"/>
    </g>
    <text x="120" y="77" class="sans" font-size="36" font-weight="700" letter-spacing="-1.5" fill="#F5F2F8">Pitch</text>
    <text x="272" y="71" class="mono" font-size="13" letter-spacing="2.5" fill="#9995A4">THE AGENT STUDIO</text>
    <circle cx="1015" cy="64" r="4" fill="#C4B5FD" class="signal"/>
    <text x="1031" y="69" class="mono" font-size="12" letter-spacing="1.6" fill="#C9C4D4">IDEA → ARTIFACT</text>

    <text x="64" y="173" class="mono" font-size="13" letter-spacing="3" fill="#BFB0F2">YOU DIRECT. THE AGENT MAKES.</text>
    <text x="58" y="274" class="sans" font-size="84" font-weight="700" letter-spacing="-5" fill="#F4F0F6">Small prompt.</text>
    <text x="61" y="373" class="serif" font-size="88" font-style="italic" letter-spacing="-4" fill="#C5B6F3">Big production.</text>
    <text x="66" y="431" class="sans" font-size="21" fill="#A9A4B2">Launch films. Real browser demos. Slide decks.</text>
    <text x="66" y="463" class="sans" font-size="21" fill="#A9A4B2">The recording you almost got right.</text>
    <rect x="64" y="507" width="271" height="47" rx="23.5" fill="#F0ECF5"/>
    <text x="86" y="536" class="sans" font-size="16" font-weight="700" fill="#19171E">ONE STUDIO. ONE AGENT.</text>
    <path d="M356 530h60m-8-7 8 7-8 7" stroke="#7D758E" stroke-width="1.5"/>
    <text x="433" y="536" class="mono" font-size="14" fill="#C4BDCF">trypitch.co</text>

    <!-- A floating, illustrated production stack. -->
    <g class="float">
      <ellipse cx="975" cy="333" rx="257" ry="199" stroke="#C7B9F2" stroke-opacity=".14" transform="rotate(-26 975 333)"/>
      <ellipse cx="975" cy="333" rx="280" ry="175" stroke="#C7B9F2" stroke-opacity=".07" transform="rotate(-26 975 333)"/>
      <g transform="rotate(9 988 259)" filter="url(#shadow)">
        <rect x="826" y="142" width="353" height="228" rx="12" fill="#1C1923" stroke="#494050"/>
        <text x="849" y="177" class="mono" font-size="12" letter-spacing="2" fill="#B1A6C5">SCENE 01 / THE OPENING</text>
        <path d="M849 196H1154" stroke="#443A51"/>
        <path d="M868 222h54v25h-54zM931 222h54v25h-54zM994 222h54v25h-54zM868 256h54v25h-54zM994 256h54v25h-54zM868 290h54v25h-54zM931 290h54v25h-54zM994 290h54v25h-54z" fill="#8B79B3"/>
      </g>
      <g transform="rotate(-8 967 334)" filter="url(#shadow)">
        <rect x="754" y="223" width="432" height="264" rx="12" fill="url(#frame)" stroke="#C9BBEB" stroke-opacity=".65"/>
        <path d="M775 245h18m-18 0v18m390-18h-18m18 0v18M775 466h18m-18 0v-18m390 18h-18m18 0v-18" stroke="#EBE1FF" stroke-opacity=".65"/>
        <circle cx="970" cy="345" r="91" stroke="url(#metal)" stroke-width="26"/>
        <ellipse cx="970" cy="345" rx="43" ry="91" stroke="url(#metal)" stroke-width="12" transform="rotate(38 970 345)"/>
        <path d="M884 345h172" stroke="#EEE7FF" stroke-opacity=".7"/>
        <text x="781" y="452" class="mono" font-size="12" letter-spacing="1.5" fill="#F4EDFF">A NEW PERSPECTIVE.</text>
        <text x="1111" y="452" class="mono" font-size="12" fill="#F4EDFF">01:24</text>
      </g>
      <g transform="rotate(4 973 478)" filter="url(#shadow)">
        <rect x="871" y="429" width="324" height="133" rx="10" fill="#EEE9DE"/>
        <text x="893" y="458" class="mono" font-size="10" letter-spacing="2" fill="#777267">THE SAME IDEA. ANOTHER FORMAT.</text>
        <text x="891" y="502" class="serif" font-size="40" letter-spacing="-1.3" fill="#29262E">Your next act.</text>
        <path d="M894 523H1173" stroke="#CFC8BE"/>
        <text x="894" y="543" class="mono" font-size="10" fill="#706C65">PITCH / DECK</text>
        <text x="1146" y="543" class="mono" font-size="10" fill="#706C65">01/08</text>
      </g>
    </g>

    <!-- Timeline: a small production desk beneath the editorial cover. -->
    <path d="M64 604H1216" stroke="#343039"/>
    <text x="64" y="634" class="mono" font-size="12" letter-spacing="2" fill="#B5AEBD">FROM FIRST BRIEF TO FINAL CUT</text>
    <text x="1049" y="634" class="mono" font-size="12" fill="#958D9F">THE WORK, IN VIEW.</text>
    <rect x="64" y="651" width="1152" height="16" fill="url(#ticks)"/>
    <g class="mono" font-size="10" fill="#958D9F">
      <text x="64" y="689">01 / BRIEF</text><text x="326" y="689">02 / MAKE</text><text x="684" y="689">03 / DIRECT</text><text x="1030" y="689">04 / PUBLISH</text>
    </g>
    <rect x="64" y="703" width="248" height="32" rx="5" fill="#30283F" stroke="#554567"/>
    <rect x="320" y="703" width="350" height="32" rx="5" fill="#675582"/>
    <rect x="678" y="703" width="338" height="32" rx="5" fill="url(#track)"/>
    <rect x="1024" y="703" width="192" height="32" rx="5" fill="#E1D7F2"/>
    <g stroke="#C0AFD7" stroke-opacity=".35">
      <path d="M78 719h220M338 719h312M696 719h300"/>
      <path d="M344 712v14m8-10v6m8-14v22m8-18v14m8-21v28m8-23v18m8-12v6m8-14v22m8-18v14m8-10v6m8-16v26m8-19v12m8-17v22m8-17v12m8-19v26m8-18v10m8-14v18m8-15v12m8-8v4m8-15v26m8-21v16m8-11v6m8-15v24m8-17v10m8-14v18m8-12v6m8-10v14m8-9v4m8-12v20m8-16v12m8-19v26m8-21v16m8-11v6m8-15v24m8-17v10m8-9v8m8-13v18"/>
    </g>
    <path d="m852 650 7 8 7-8z" fill="#F3EFF8"/><path d="M859 658V746" stroke="#F3EFF8"/>
    <circle cx="1186" cy="719" r="8" fill="#3B314D"/>
    <path d="m1182 719 3 3 5-6" stroke="#E8E0F4" stroke-width="1.5"/>
    <text x="64" y="771" class="mono" font-size="10" letter-spacing="2" fill="#7E7689">BUILT FOR THE NEXT “WHAT IF…”</text>
    <text x="1042" y="771" class="mono" font-size="10" letter-spacing="2" fill="#7E7689">PITCH / STUDIO NOTES</text>
    <rect x=".5" y=".5" width="1279" height="799" rx="23.5" stroke="#39333F"/>
  </g>
</svg>
