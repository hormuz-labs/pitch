services:
  postgres:
    image: postgres:15-alpine
    container_name: pitch_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pitch
    ports:
      - "5433:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pitch"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: pitch_pgweb
    restart: always
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/pitch?sslmode=disable
      - AUTH_USER=${PGWEB_USER:-admin}
      - AUTH_PASS=${PGWEB_PASSWORD:-supersecret123}
    ports:
      - "127.0.0.1:8081:8081"
    # Bound to localhost; external access is via the host-level cloudflared systemd service
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: pitch_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: pitch_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./docker-data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.2.0
    container_name: pitch_loki
    restart: always
    user: "10001:10001"
    ports:
      - "127.0.0.1:3101:3100"
    volumes:
      - ./docker-data/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.6.0
    container_name: pitch_grafana
    restart: always
    user: "472:0"
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker-data/grafana:/var/lib/grafana
      - ./docker-data/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./docker-data/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      loki:
        condition: service_healthy

  cloakbrowser-manager:
    image: cloakhq/cloakbrowser-manager
    container_name: cloakbrowser_manager
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - cloakprofiles:/data
    group_add:
      - "44"
      - "992"

  # ---------------------------------------------------------------------------
  # Transcription — local Whisper (transformers.js on Bun, model baked into the
  # image). Serves the recording-editor flow: the worker posts uploaded
  # narration here for word-level transcripts. Host port mapping also lets a
  # host-run worker reach it.
  # ---------------------------------------------------------------------------
  transcription:
    image: pitch-transcription:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/transcription/Dockerfile
    container_name: pitch_transcription
    restart: always
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-Xenova/whisper-small}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    image: pitch-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pitch_api
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/pitch?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      CLOAK_MANAGER_URL: http://cloakbrowser-manager:8080
    logging:
      driver: loki
      options:
        loki-url: http://localhost:3101/loki/api/v1/push
        loki-batch-size: "400"
        loki-timeout: "10s"
        loki-retries: "3"
        loki-external-labels: "job=api,container_name={{.Name}}"
        labels: "job=api"
        env: "SERVICE_NAME,HOSTNAME"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      loki:
        condition: service_healthy
      cloakbrowser-manager:
        condition: service_started

  worker:
    image: pitch-worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/pitch?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      CLOAK_MANAGER_URL: http://cloakbrowser-manager:8080
      TRANSCRIPTION_SERVICE_URL: http://transcription:4000/transcribe
      HSA_OVERRIDE_GFX_VERSION: "10.3.0"
    logging:
      driver: loki
      options:
        loki-url: http://localhost:3101/loki/api/v1/push
        loki-batch-size: "400"
        loki-timeout: "10s"
        loki-retries: "3"
        loki-external-labels: "job=worker,container_name={{.Name}}"
        labels: "job=worker"
        env: "SERVICE_NAME,HOSTNAME"
    volumes:
      - ./docker-data/opencode-logs:/root/.local/share/opencode/log
    group_add:
      - "44"
      - "992"
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      loki:
        condition: service_healthy
      cloakbrowser-manager:
        condition: service_started
      transcription:
        condition: service_healthy

volumes:
  cloakprofiles:
