services:
  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel — zero-trust ingress, no open ports required
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pitch_cloudflared
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - api
      - minio
      - loki
      - grafana

  postgres:
    image: postgres:15-alpine
    container_name: pitch_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pitch
    ports:
      - "5433:5432"
    volumes:
      - /opt/pitch/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pitch"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pitch_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - /opt/pitch/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: pitch_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9002:9000"
    volumes:
      - /opt/pitch/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.2.0
    container_name: pitch_loki
    restart: always
    user: "10001:10001"
    ports:
      - "3101:3100"
    volumes:
      - /opt/pitch/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.6.0
    container_name: pitch_grafana
    restart: always
    user: "472:0"
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - /opt/pitch/grafana:/var/lib/grafana
      - /opt/pitch/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - /opt/pitch/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      loki:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pitch_api
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/pitch?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
    logging:
      driver: loki
      options:
        loki-url: http://localhost:3101/loki/api/v1/push
        loki-batch-size: "400"
        loki-timeout: "10s"
        loki-retries: "3"
        loki-external-labels: "job=api,container_name={{.Name}}"
        labels: "job=api"
        env: "SERVICE_NAME,HOSTNAME"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      loki:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/pitch?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      HSA_OVERRIDE_GFX_VERSION: "10.3.0"
    logging:
      driver: loki
      options:
        loki-url: http://localhost:3101/loki/api/v1/push
        loki-batch-size: "400"
        loki-timeout: "10s"
        loki-retries: "3"
        loki-external-labels: "job=worker,container_name={{.Name}}"
        labels: "job=worker"
        env: "SERVICE_NAME,HOSTNAME"
    volumes:
      - /opt/pitch/opencode-logs:/root/.local/share/opencode/log
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      loki:
        condition: service_healthy

