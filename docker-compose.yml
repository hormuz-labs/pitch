services:
  postgres:
    image: postgres:15-alpine
    container_name: pitch_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pitch
    ports:
      - "5433:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pitch"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: pitch_pgweb
    restart: always
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/pitch?sslmode=disable
      - AUTH_USER=${PGWEB_USER:-admin}
      - AUTH_PASS=${PGWEB_PASSWORD:-supersecret123}
    ports:
      - "127.0.0.1:8081:8081"
    # Bound to localhost; external access is via the host-level cloudflared systemd service
    depends_on:
      postgres:
        condition: service_healthy

  loki:
    image: grafana/loki:3.2.0
    container_name: pitch_loki
    restart: always
    user: "10001:10001"
    ports:
      - "127.0.0.1:3101:3100"
    volumes:
      - ./docker-data/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.6.0
    container_name: pitch_grafana
    restart: always
    user: "472:0"
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker-data/grafana:/var/lib/grafana
      - ./docker-data/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./docker-data/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      loki:
        condition: service_healthy

  api:
    image: pitch-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pitch_api
    restart: always
    shm_size: 2gb
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/pitch?schema=public
      STORAGE_DRIVER: gcs
      GCS_PROJECT: ${GCS_PROJECT:-your-gcp-project}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-silverfish-media}
      STORAGE_PROFILES_BUCKET: ${STORAGE_PROFILES_BUCKET:-silverfish-profiles}
      STUDIO_WORKSPACE_BUCKET: ${STUDIO_WORKSPACE_BUCKET:-silverfish-workspaces}
      STORAGE_PUBLIC_URL: https://storage.googleapis.com
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/secrets/google/application_default_credentials.json
      STUDIO_INTERNAL_ORIGIN: http://api:3000
      # This container is the API and a worker in one (STUDIO_ROLE=all). It
      # registers itself under this id at this URL so worker nodes added later
      # (see the `worker` service) and this one share the projects between them.
      STUDIO_ROLE: ${STUDIO_ROLE:-all}
      STUDIO_WORKER_ID: ${STUDIO_WORKER_ID:-api}
      STUDIO_WORKER_URL: http://api:3000
      STUDIO_WORKER_SLOTS: ${STUDIO_WORKER_SLOTS:-16}
    volumes:
      # Project workspaces: sources, recordings, renders. The directory is the truth.
      - ./projects:/app/projects
      # pi session history (resumable conversations) and the whisper model.
      - ./docker-data/pi:/root/.pi/agent
      - ./docker-data/whisper:/root/.cache/whisper-cpp
      - ${GOOGLE_APPLICATION_CREDENTIALS:-${HOME}/.config/gcloud/application_default_credentials.json}:/var/run/secrets/google/application_default_credentials.json:ro
    # The agent's shell runs under bubblewrap, which needs to create a user
    # namespace and mount inside it. Docker's default seccomp profile blocks
    # the first and the docker-default AppArmor profile blocks the second.
    #
    # This is a real trade-off: it loosens the container that holds every
    # secret in order to confine the shell running inside it. Run
    # `make sandbox-check` on the host to find the smallest set that works
    # there — on many Linux hosts seccomp:unconfined alone is enough, and
    # SYS_ADMIN is only needed where the kernel refuses the sandbox's loopback.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
    # Long enough to checkpoint every held workspace to object storage before
    # the process is killed (STUDIO_SHUTDOWN_GRACE_MS, default 60s).
    stop_grace_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_healthy

  # A second studio worker on the same machine, plus a render pod. Real
  # capacity comes from running this image with STUDIO_ROLE=worker and
  # STUDIO_ROLE=render on other nodes pointed at the same DATABASE_URL and
  # MINIO_ENDPOINT; these services are the local shape of that, for trying
  # the placement and the render queue out. Needs STUDIO_WORKER_TOKEN in
  # .env. A worker with checkpoints defaults to STUDIO_RENDER=remote, so its
  # heavy actions wait for the `render` service below.
  worker:
    image: pitch-api:${IMAGE_TAG:-latest}
    container_name: pitch_worker
    restart: always
    shm_size: 2gb
    profiles: ["worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/pitch?schema=public
      STORAGE_DRIVER: gcs
      GCS_PROJECT: ${GCS_PROJECT:-your-gcp-project}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-silverfish-media}
      STORAGE_PROFILES_BUCKET: ${STORAGE_PROFILES_BUCKET:-silverfish-profiles}
      STUDIO_WORKSPACE_BUCKET: ${STUDIO_WORKSPACE_BUCKET:-silverfish-workspaces}
      STORAGE_PUBLIC_URL: https://storage.googleapis.com
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/secrets/google/application_default_credentials.json
      STUDIO_INTERNAL_ORIGIN: http://worker:3000
      STUDIO_ROLE: worker
      STUDIO_WORKER_ID: worker-1
      STUDIO_WORKER_URL: http://worker:3000
      STUDIO_WORKER_SLOTS: ${STUDIO_WORKER_SLOTS:-16}
    volumes:
      - ./docker-data/worker-1/projects:/app/projects
      - ./docker-data/worker-1/pi:/root/.pi/agent
      - ${GOOGLE_APPLICATION_CREDENTIALS:-${HOME}/.config/gcloud/application_default_credentials.json}:/var/run/secrets/google/application_default_credentials.json:ro
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
    stop_grace_period: 90s

  # The render tier (apps/api/src/renderer/): claims RenderJobs the workers
  # queue, restores the workspace checkpoint, runs the heavy host action —
  # a capture, an encode, whisper — and ships the files back through MinIO.
  # No sandbox privileges: nothing here runs an agent shell.
  render:
    image: pitch-api:${IMAGE_TAG:-latest}
    container_name: pitch_render
    restart: always
    shm_size: 2gb
    profiles: ["worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/pitch?schema=public
      STORAGE_DRIVER: gcs
      GCS_PROJECT: ${GCS_PROJECT:-your-gcp-project}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-silverfish-media}
      STORAGE_PROFILES_BUCKET: ${STORAGE_PROFILES_BUCKET:-silverfish-profiles}
      STUDIO_WORKSPACE_BUCKET: ${STUDIO_WORKSPACE_BUCKET:-silverfish-workspaces}
      STORAGE_PUBLIC_URL: https://storage.googleapis.com
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/secrets/google/application_default_credentials.json
      STUDIO_ROLE: render
      STUDIO_RENDER_ID: render-1
    volumes:
      - ./docker-data/render-1/projects:/app/projects
      - ./docker-data/render-1/pi:/root/.pi/agent
      - ./docker-data/whisper:/root/.cache/whisper-cpp
      - ${GOOGLE_APPLICATION_CREDENTIALS:-${HOME}/.config/gcloud/application_default_credentials.json}:/var/run/secrets/google/application_default_credentials.json:ro
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
    stop_grace_period: 600s
    depends_on:
      postgres:
        condition: service_healthy

  discord-bot:
    image: pitch-discord-bot:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/discord-bot/Dockerfile
    container_name: pitch_discord_bot
    restart: always
    profiles: ["discord"]
    env_file:
      - .env
    environment:
      # `make discord` overrides this to reach a host-run dev API. In a fully
      # containerized deployment the bot uses the Compose API service instead.
      PITCH_API_URL: ${DISCORD_PITCH_API_URL:-http://api:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
