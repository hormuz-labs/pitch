services:
  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel — zero-trust ingress, no open ports required
  # Routes api.trypitch.co → api:3000 and minio.trypitch.co → minio:9001
  #
  # Setup:
  #   1. Go to https://one.dash.cloudflare.com → Networks → Tunnels → Create tunnel
  #   2. Copy the tunnel token and set TUNNEL_TOKEN in your .env file
  #   3. In the tunnel's Public Hostname tab add:
  #        api.trypitch.co   → http://api:3000
  #        minio.trypitch.co → http://minio:9001
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: silverfish_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - api
      - minio

  postgres:
    image: postgres:15-alpine
    container_name: silverfish_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: silverfish
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d silverfish"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: silverfish_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: silverfish_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API — used internally by api/worker
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: silverfish_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override localhost-based URLs to use Docker service names
      DATABASE_URL: postgresql://postgres:password@postgres:5432/silverfish?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/silverfish?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      # AMD RX 5500 XT (gfx1012) — override to nearest supported ROCm target
      HSA_OVERRIDE_GFX_VERSION: "10.3.0"
    devices:
      # Expose AMD GPU to the container
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    deploy:
      replicas: 1   # increase to scale horizontally, e.g. docker compose up --scale worker=3
      resources:
        reservations:
          devices:
            - driver: amdgpu
              count: 1
              capabilities: [gpu, compute]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
